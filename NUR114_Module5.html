MED_MATH.lessons.push(
{ id:"m5math-abg-er", title:"ABGs in Medical Emergencies", kicker:"Which gas goes with which emergency",
  blocks:[
   {p:"Use the same steps as the ABG Review: pH first, then match CO₂ (lungs) or HCO₃ (kidneys) to the pH, then check compensation. These are the gases that show up with this module's exemplars."},
   {table:{head:["Emergency","Expected gas","Why"],rows:[
    ["<strong>Opioid or benzodiazepine overdose</strong>","<strong>Respiratory acidosis</strong>","Respiratory depression — CO₂ is retained"],
    ["<strong>Alcohol intoxication</strong> with slow breathing","Respiratory acidosis","CNS and respiratory depression"],
    ["<strong>IICP — therapeutic hyperventilation</strong>","<strong>Respiratory alkalosis</strong> (on purpose)","Blowing off CO₂ (a vasodilator) constricts cerebral vessels and lowers ICP — brief use only"],
    ["<strong>Salicylate (aspirin) overdose</strong>","<strong>Respiratory alkalosis first → metabolic acidosis</strong>","Aspirin stimulates the respiratory center; then acid builds up in the blood"],
    ["<strong>Shock</strong> (any type)","<strong>Metabolic acidosis</strong>","Poor perfusion → anaerobic metabolism → <strong>lactic acid</strong> (lactate above 2 = cells in trouble)"],
    ["<strong>Burns — emergent phase</strong>","<strong>Metabolic acidosis</strong>","Lost bicarbonate and lactic acid from poor perfusion"],
    ["<strong>Cardiac arrest</strong>","Mixed respiratory and metabolic acidosis","No breathing (CO₂ builds) and no perfusion (lactic acid) — \"hydrogen ion (acidosis)\" is one of the H's"],
    ["<strong>Anxiety / panic, early sepsis</strong>","Respiratory alkalosis","Hyperventilation blows off CO₂"]
   ]}},
   {h:"Carbon monoxide — a special case"},
   {p:"Pulse oximetry reads falsely normal (98–100%) with carbon monoxide. An <strong>ABG with a carboxyhemoglobin level</strong> shows the true picture. Treat with 100% O₂ by nonrebreather."},
   {hook:"Slow breathing = CO₂ builds = <strong>respiratory acidosis</strong>. Poor perfusion = lactic acid = <strong>metabolic acidosis</strong>. Fast breathing = CO₂ blown off = <strong>respiratory alkalosis</strong>."}
  ]
}
);

MED_MATH.lessons.push(
{ id:"m5math-rome", title:"The ROME Method + Arrows (Tic-Tac-Toe)", kicker:"Respiratory Opposite, Metabolic Equal — combined with your arrows",
  blocks:[
   {hook:"<strong>ROME = Respiratory Opposite, Metabolic Equal.</strong> Compare the arrow on the pH with the arrow on PaCO₂ and HCO₃. The value that matches the ROME rule is the cause."},
   {h:"The four imbalances — arrows"},
   {table:{head:["Imbalance","pH","PaCO₂","HCO₃","ROME"],rows:[
    ["<strong>Respiratory acidosis</strong>","↓","<strong>↑</strong>","↔ (or ↑ if compensating)","pH and CO₂ <strong>opposite</strong> → Respiratory"],
    ["<strong>Respiratory alkalosis</strong>","↑","<strong>↓</strong>","↔ (or ↓ if compensating)","pH and CO₂ <strong>opposite</strong> → Respiratory"],
    ["<strong>Metabolic acidosis</strong>","↓","↔ (or ↓ if compensating)","<strong>↓</strong>","pH and HCO₃ <strong>equal</strong> → Metabolic"],
    ["<strong>Metabolic alkalosis</strong>","↑","↔ (or ↑ if compensating)","<strong>↑</strong>","pH and HCO₃ <strong>equal</strong> → Metabolic"]
   ]}},
   {h:"Step by step"},
   {list:[
    "<strong>1. pH</strong> — below 7.35 = acidosis (↓); above 7.45 = alkalosis (↑). If it is 7.35–7.45, note which side of <strong>7.40</strong> it leans toward.",
    "<strong>2. Draw the arrows</strong> for pH, PaCO₂ (35–45), and HCO₃ (22–26).",
    "<strong>3. ROME</strong> — PaCO₂ arrow <strong>opposite</strong> the pH arrow → respiratory. HCO₃ arrow <strong>same</strong> as the pH arrow → metabolic.",
    "<strong>4. Compensation</strong> — the other value normal → <strong>uncompensated</strong>. The other value abnormal and pH still abnormal → <strong>partially compensated</strong>. Both abnormal and pH back to normal → <strong>fully compensated</strong>."]},
   {h:"The tic-tac-toe boxes"},
   {p:"Put each value in a box — Acid, Normal, or Base. Remember PaCO₂ is reversed: <strong>high CO₂ = acid</strong>, low CO₂ = base. The value in the <strong>same box as the pH</strong> is the cause; the value in the opposite box is compensating."},
   {table:{head:["Example: pH 7.31 · PaCO₂ 52 · HCO₃ 29","Acid","Normal","Base"],rows:[
    ["pH 7.31","✓","",""],
    ["PaCO₂ 52","✓ (cause)","",""],
    ["HCO₃ 29","","","✓ (compensating)"]
   ]}},
   {p:"<strong>Arrows:</strong> pH ↓, PaCO₂ ↑ — opposite → respiratory. <strong>Boxes:</strong> pH and CO₂ share the acid box → respiratory acidosis. HCO₃ is moving (base) and the pH is still abnormal → <strong>partially compensated respiratory acidosis</strong>."},
   {h:"Fully compensated — use 7.40"},
   {p:"pH 7.37 · PaCO₂ 30 · HCO₃ 17. The pH is normal but below 7.40, so it leans <strong>acid</strong>. HCO₃ 17 is acid (same as the lean) → metabolic; CO₂ 30 is base (compensating). Both abnormal, pH normal → <strong>fully compensated metabolic acidosis</strong>."},
   {hook:"Use both: the <strong>arrows</strong> for ROME and the <strong>boxes</strong> to see which value matches the pH. For endless practice, see Games → Endless ABGs (classic or ROME boxes)."}
  ]
}
);

MED_MATH.lessons.push(
{ id:"m4math-co-sv", title:"Cardiac Output &amp; Stroke Volume", kicker:"CO = HR × SV — and why a racing heart can pump less",
  blocks:[
   {p:"Every rhythm, drug, and fluid decision in Perfusion is really about one goal: <strong>optimize cardiac output</strong>. Two quick formulas let you see how heart rate and stroke volume trade off against each other."},
   {h:"The formulas"},
   {table:{head:["Value","Formula","Normal"],rows:[
    ["Cardiac output (CO)","Heart rate × stroke volume (mL) ÷ 1,000 = L/min","<strong>4–8 L/min</strong>"],
    ["Stroke volume (SV)","(CO in L/min × 1,000) ÷ heart rate = mL/beat","<strong>60–100 mL/beat</strong>"]]}},
   {p:"Stroke volume is measured in <strong>mL per beat</strong>, but cardiac output is reported in <strong>liters per minute</strong> — so divide by 1,000 at the end (or multiply by 1,000 to go back)."},
   {h:"Worked example 1 — finding CO"},
   {list:[
    "<strong>Given:</strong> HR 72 beats/min, SV 70 mL/beat",
    "<strong>Formula:</strong> CO = HR × SV",
    "<strong>Steps:</strong> 72 × 70 = 5,040 mL/min → 5,040 ÷ 1,000 = 5.04 L/min",
    "<strong>Answer:</strong> CO ≈ <strong>5 L/min</strong> — within the normal 4–8 L/min"]},
   {h:"Worked example 2 — finding SV"},
   {list:[
    "<strong>Given:</strong> CO 5.5 L/min, HR 80 beats/min",
    "<strong>Formula:</strong> SV = (CO × 1,000) ÷ HR",
    "<strong>Steps:</strong> 5.5 × 1,000 = 5,500 mL/min → 5,500 ÷ 80 = 68.75",
    "<strong>Answer:</strong> SV = <strong>68.75 mL/beat</strong> (≈ 69) — within the normal 60–100 mL/beat"]},
   {h:"Worked example 3 — why tachycardia eventually LOWERS CO"},
   {p:"Faster sounds like more output, and at first it is. But the ventricles fill during <strong>diastole</strong>, and diastole is the part of the cycle that shrinks when the rate climbs. Less filling time → less blood in the ventricle → <strong>↓ stroke volume</strong>."},
   {table:{head:["Situation","HR","SV","CO"],rows:[
    ["Resting","80","70 mL","80 × 70 = 5,600 mL → <strong>5.6 L/min</strong>"],
    ["Sustained tachycardia, poor filling","160","25 mL","160 × 25 = 4,000 mL → <strong>4.0 L/min</strong>"]]}},
   {p:"The rate doubled, but stroke volume fell so far that cardiac output <strong>dropped</strong>. Lose the atrial kick (as in A-fib) and filling drops even more; a fast heart also raises myocardial O₂ demand — which is why a patient in a fast rhythm can show signs of decreased CO (↓BP, dizziness, chest pain)."},
   {hook:"<strong>CO = HR × SV.</strong> If one side drops, the other has to rise to keep up. A slow heart lowers CO through HR; a very fast heart lowers CO through SV (no time to fill)."}
  ],
  check:{stem:"A client's heart rate is 100 beats/min and stroke volume is 50 mL/beat. What is the cardiac output?", options:["0.5 L/min","2 L/min","5 L/min","50 L/min"], answer:2, why:"100 × 50 = 5,000 mL/min; 5,000 ÷ 1,000 = 5 L/min, which is within the normal 4–8 L/min."}
},
{ id:"m4math-hr-ef", title:"Heart Rate from a Strip &amp; Ejection Fraction", kicker:"The 6-second method and the EF percentage",
  blocks:[
   {p:"Two numbers you'll calculate constantly: the heart rate off a rhythm strip, and the ejection fraction that classifies heart failure."},
   {h:"Heart rate — the 6-second method"},
   {p:"<strong>Formula:</strong> number of QRS complexes in a 6-second strip × 10 = heart rate (beats/min). Count the QRS complexes (the tall spikes), not the P waves. One big box = 0.20 s, so 30 big boxes = 6 seconds."},
   {img:STRIPS.nsr, caption:"Normal sinus rhythm — 6-second strip. Count the QRS complexes: 7 × 10 = about 70 (measured rate ≈75)."},
   {list:[
    "<strong>Given:</strong> 7 QRS complexes in 6 seconds (a 7–8 count is typical for this rate)",
    "<strong>Steps:</strong> 7 × 10 = 70",
    "<strong>Answer:</strong> about <strong>70–75 beats/min</strong> → within 60–100 = normal rate"]},
   {img:STRIPS.sb, caption:"Sinus bradycardia — 6-second strip. 5 QRS complexes × 10 = about 50 (measured rate ≈45)."},
   {list:[
    "<strong>Given:</strong> 5 QRS complexes in 6 seconds",
    "<strong>Steps:</strong> 5 × 10 = 50",
    "<strong>Answer:</strong> about <strong>50 beats/min</strong> → below 60 = bradycardia. Check whether the client is symptomatic before treating."]},
   {hook:"The 6-second method is an <strong>estimate</strong> — great for regular and irregular rhythms alike (it's the go-to for A-fib). A partial complex at the edge makes the count land a little above or below the true rate."},
   {table:{head:["QRS in 6 s","Rate","Interpretation (if sinus)"],rows:[
    ["3","30","Very slow — brady"],
    ["5","50","Brady (below 60)"],
    ["6–10","60–100","Normal rate"],
    ["12","120","Tachy (above 100)"],
    ["18","180","SVT range (150–250) — not sinus tach"]]}},
   {h:"Ejection fraction (EF)"},
   {p:"<strong>Formula:</strong> (volume ejected ÷ end-diastolic volume) × 100 = EF %. End-diastolic volume is how much blood is in the ventricle when it's full; volume ejected is what leaves with one squeeze (the stroke volume)."},
   {list:[
    "<strong>Given:</strong> end-diastolic volume 100 mL; 60 mL ejected",
    "<strong>Steps:</strong> 60 ÷ 100 = 0.60 → × 100 = 60",
    "<strong>Answer:</strong> EF = <strong>60%</strong> → normal"]},
   {list:[
    "<strong>Given:</strong> end-diastolic volume 120 mL; 42 mL ejected",
    "<strong>Steps:</strong> 42 ÷ 120 = 0.35 → × 100 = 35",
    "<strong>Answer:</strong> EF = <strong>35%</strong> → below 50% = HFrEF (systolic, can't pump)"]},
   {table:{head:["EF","Meaning"],rows:[
    ["50–70%","Normal"],
    ["Below 50%","<strong>HFrEF</strong> — reduced EF, systolic HF, stretched/boggy walls that can't pump"],
    ["Normal EF with HF symptoms","<strong>HFpEF</strong> — preserved EF, diastolic HF, thick stiff walls that can't fill"]]}},
   {hook:"An echocardiogram is the go-to test for EF. Remember <strong>\"Systolic = stretched\"</strong> (low EF) and <strong>\"Diastolic = thick\"</strong> (EF preserved)."}
  ],
  check:{stem:"An echocardiogram shows an end-diastolic volume of 150 mL and 60 mL ejected per beat. Which interpretation is correct?", options:["EF 60% — normal","EF 40% — consistent with HFrEF","EF 90% — hyperdynamic","EF 25% — normal for older adults"], answer:1, why:"60 ÷ 150 = 0.40 × 100 = 40%. Below 50% is reduced EF (HFrEF, systolic heart failure)."}
},
{ id:"m4math-map-cpp", title:"MAP → CPP Multi-Step Problems", kicker:"Perfusion pressure to the organs and the brain",
  blocks:[
   {p:"In stroke and neuro patients you'll often need <strong>two steps</strong>: calculate MAP from the blood pressure, then subtract ICP to get cerebral perfusion pressure."},
   {h:"The formulas"},
   {table:{head:["Value","Formula","Target"],rows:[
    ["MAP","(SBP + 2 × DBP) ÷ 3","<strong>65 or higher</strong> = adequate organ perfusion"],
    ["CPP","MAP − ICP","Below ~60 = <strong>cerebral ischemia risk</strong>"]]}},
   {hook:"Diastole counts twice in MAP because the heart spends about two-thirds of each cycle in diastole. Always finish MAP <strong>before</strong> you subtract ICP."},
   {h:"Example 1 — post-stroke client, adequate"},
   {list:[
    "<strong>Given:</strong> BP 150/90, ICP 15 mmHg",
    "<strong>Step 1 (MAP):</strong> 2 × 90 = 180 → 150 + 180 = 330 → 330 ÷ 3 = <strong>110</strong>",
    "<strong>Step 2 (CPP):</strong> 110 − 15 = <strong>95 mmHg</strong>",
    "<strong>Interpret:</strong> MAP 65 or higher and CPP well above 60 → brain is being perfused"]},
   {h:"Example 2 — low BP, rising ICP"},
   {list:[
    "<strong>Given:</strong> BP 84/48, ICP 22 mmHg",
    "<strong>Step 1 (MAP):</strong> 2 × 48 = 96 → 84 + 96 = 180 → 180 ÷ 3 = <strong>60</strong>",
    "<strong>Step 2 (CPP):</strong> 60 − 22 = <strong>38 mmHg</strong>",
    "<strong>Interpret:</strong> MAP below 65 AND CPP far below 60 → cerebral ischemia risk. Report immediately; this client needs perfusion support."]},
   {h:"Example 3 — normal MAP, but high ICP"},
   {list:[
    "<strong>Given:</strong> BP 120/75, ICP 35 mmHg",
    "<strong>Step 1 (MAP):</strong> 2 × 75 = 150 → 120 + 150 = 270 → 270 ÷ 3 = <strong>90</strong>",
    "<strong>Step 2 (CPP):</strong> 90 − 35 = <strong>55 mmHg</strong>",
    "<strong>Interpret:</strong> MAP looks fine, but CPP is below ~60 → the brain is at risk. A \"normal\" BP doesn't guarantee brain perfusion when ICP is high."]},
   {h:"Example 4 — rounding a MAP"},
   {list:[
    "<strong>Given:</strong> BP 118/76, ICP 12 mmHg",
    "<strong>Step 1 (MAP):</strong> 2 × 76 = 152 → 118 + 152 = 270 → 270 ÷ 3 = <strong>90</strong>",
    "<strong>Step 2 (CPP):</strong> 90 − 12 = <strong>78 mmHg</strong> → adequate",
    "If MAP doesn't divide evenly (e.g., 122/78 → 278 ÷ 3 = 92.67), round only at the end, as the question directs (92.7 or 93)."]},
   {h:"Quick interpretation table"},
   {table:{head:["Result","Meaning","Nursing thought"],rows:[
    ["MAP 65 or higher","Organs perfused","Keep monitoring"],
    ["MAP below 65","Organ perfusion at risk","Report; think decreased CO care (SBP goal above 90)"],
    ["CPP about 60 or higher","Brain perfused","Keep monitoring neuro status"],
    ["CPP below ~60","Cerebral ischemia risk","Report; neuro checks; check BP and ICP trends"]]}}
  ],
  check:{stem:"A client has BP 96/60 and ICP 20 mmHg. Which statement is accurate?", options:["MAP 72, CPP 52 — cerebral ischemia risk","MAP 78, CPP 58 — adequate","MAP 72, CPP 92 — adequate","MAP 52, CPP 72 — organ perfusion inadequate"], answer:0, why:"MAP = (96 + 120) ÷ 3 = 216 ÷ 3 = 72. CPP = 72 − 20 = 52, which is below ~60, so the brain is at risk even though MAP is above 65."}
},
{ id:"m4math-drips", title:"Cardiac Drip Calculations", kicker:"Heparin, dopamine, epinephrine, amiodarone, atropine, adenosine",
  blocks:[
   {p:"These are high-alert drugs on an infusion pump (or a rapid push). Find the <strong>concentration</strong> first, then solve for mL/h or mL. The concentrations below are examples — always use the label on the bag or syringe in front of you."},
   {h:"Heparin — units/h and mL/h"},
   {list:[
    "<strong>Given:</strong> heparin 25,000 units in 250 mL; order 1,000 units/h",
    "<strong>Concentration:</strong> 25,000 ÷ 250 = 100 units/mL",
    "<strong>Formula:</strong> ordered units/h ÷ units/mL = mL/h",
    "<strong>Steps:</strong> 1,000 ÷ 100 = 10",
    "<strong>Answer:</strong> <strong>10 mL/h</strong>"]},
   {list:[
    "<strong>Weight-based — Given:</strong> 18 units/kg/h for an 80 kg client; same bag (100 units/mL)",
    "<strong>Steps:</strong> 18 × 80 = 1,440 units/h → 1,440 ÷ 100 = 14.4",
    "<strong>Answer:</strong> <strong>14.4 mL/h</strong> (1,440 units/h)"]},
   {hook:"Heparin is monitored with the <strong>PTT</strong> — \"two t's make an H.\" Watch platelets for HIT; the antidote is protamine sulfate."},
   {h:"Dopamine — mcg/kg/min → mL/h"},
   {list:[
    "<strong>Given:</strong> dopamine 400 mg in 250 mL; order 5 mcg/kg/min; client 80 kg",
    "<strong>Concentration:</strong> 400 mg × 1,000 = 400,000 mcg ÷ 250 mL = <strong>1,600 mcg/mL</strong>",
    "<strong>Formula:</strong> (mcg × kg × 60 min) ÷ mcg/mL = mL/h",
    "<strong>Steps:</strong> 5 × 80 = 400 mcg/min → × 60 = 24,000 mcg/h → 24,000 ÷ 1,600 = 15",
    "<strong>Answer:</strong> <strong>15 mL/h</strong>. (At the top of the 5–20 mcg/kg/min brady range, 20 mcg/kg/min for the same client = 96,000 ÷ 1,600 = 60 mL/h.)"]},
   {h:"Epinephrine — mcg/min → mL/h"},
   {list:[
    "<strong>Given:</strong> epinephrine 4 mg in 250 mL; order 2 mcg/min (brady range 2–10 mcg/min)",
    "<strong>Concentration:</strong> 4 mg × 1,000 = 4,000 mcg ÷ 250 mL = <strong>16 mcg/mL</strong>",
    "<strong>Formula:</strong> (mcg/min × 60) ÷ mcg/mL = mL/h (no weight in this one)",
    "<strong>Steps:</strong> 2 × 60 = 120 mcg/h → 120 ÷ 16 = 7.5",
    "<strong>Answer:</strong> <strong>7.5 mL/h</strong>. At 10 mcg/min: 600 ÷ 16 = 37.5 mL/h."]},
   {hook:"Dopamine and epinephrine are <strong>vesicants</strong> — large vein or central line, check the site often; extravasation antidote is phentolamine."},
   {h:"Amiodarone — mg/min → mL/h"},
   {list:[
    "<strong>Given:</strong> amiodarone 900 mg in 500 mL; maintenance 1 mg/min",
    "<strong>Concentration:</strong> 900 ÷ 500 = <strong>1.8 mg/mL</strong>",
    "<strong>Steps:</strong> 1 mg/min × 60 = 60 mg/h → 60 ÷ 1.8 = 33.33",
    "<strong>Answer:</strong> <strong>33.3 mL/h</strong> (33 mL/h to the nearest whole number)"]},
   {h:"Push doses — atropine and adenosine"},
   {table:{head:["Drug","Given","Steps","Answer"],rows:[
    ["Atropine 1 mg IV push","Prefilled syringe 0.1 mg/mL (1 mg/10 mL)","1 ÷ 0.1 = 10","<strong>10 mL</strong> — repeat q3–5 min, max 3 mg (30 mL total)"],
    ["Adenosine 6 mg rapid IV push","Vial 3 mg/mL","6 ÷ 3 = 2","<strong>2 mL</strong>, then 20 mL NS flush fast"],
    ["Adenosine 12 mg (second dose)","Vial 3 mg/mL","12 ÷ 3 = 4","<strong>4 mL</strong>, then flush"]]}},
   {hook:"Beware the look-alike, sound-alike <strong>\"A\" drugs</strong>: <strong>A</strong>tropine speeds a slow heart, <strong>A</strong>denosine briefly stops a fast one, <strong>A</strong>miodarone is an antiarrhythmic drip. Read the label twice."}
  ],
  check:{stem:"Heparin 25,000 units in 500 mL is infusing. The order is 1,200 units/h. At what rate should the pump be set?", options:["12 mL/h","24 mL/h","48 mL/h","50 mL/h"], answer:1, why:"25,000 ÷ 500 = 50 units/mL. 1,200 ÷ 50 = 24 mL/h."}
},
{ id:"m4math-ci", title:"Cardiac Index (likely NUR 211)", kicker:"Cardiac output sized to the body — plus intracardiac pressures",
  blocks:[
   {hook:"<strong>Likely NUR 211 content — kept here for next semester; not on the Module 4 exam.</strong>"},
   {h:"Why index cardiac output?"},
   {p:"A CO of 4 L/min means something different for a small adult than for a very large one. <strong>Cardiac index (CI)</strong> adjusts cardiac output for body size by dividing by body surface area (BSA)."},
   {h:"Formula"},
   {table:{head:["Value","Formula","Normal"],rows:[
    ["Cardiac index","CO (L/min) ÷ BSA (m²)","<strong>2.5–4 L/min/m²</strong>"]]}},
   {h:"Worked example"},
   {list:[
    "<strong>Given:</strong> CO 5.5 L/min, BSA 1.64 m²",
    "<strong>Formula:</strong> CI = CO ÷ BSA",
    "<strong>Steps:</strong> 5.5 ÷ 1.64 = 3.354 → rounds to 3.35",
    "<strong>Answer:</strong> CI ≈ <strong>3.35 L/min/m²</strong> → within the normal 2.5–4"]},
   {p:"Bedside monitors usually calculate BSA and CI automatically once height and weight are entered."},
   {h:"Normal intracardiac pressures (likely 211)"},
   {table:{head:["Location","Normal (mmHg)"],rows:[
    ["Right atrium","0–8"],
    ["Right ventricle","Systolic 15–25 / diastolic 0–8"],
    ["Pulmonary artery","Systolic 15–25 / diastolic 8–15"],
    ["Left atrium","4–12"],
    ["Left ventricle","Systolic 110–130 / diastolic 4–12"],
    ["Aorta","Systolic 110–130 / diastolic 70–80"]]}},
   {hook:"Pattern to notice: the <strong>right side is a low-pressure system</strong> (pumps only to the lungs); the <strong>left side is high pressure</strong> (pumps to the whole body) — which is why the left ventricle is the thickest chamber."}
  ],
  check:{stem:"A client's CO is 3.2 L/min and BSA is 2.0 m². How should the nurse interpret the cardiac index?", options:["1.6 L/min/m² — below normal","6.4 L/min/m² — above normal","3.2 L/min/m² — normal","2.5 L/min/m² — low normal"], answer:0, why:"3.2 ÷ 2.0 = 1.6 L/min/m², below the normal 2.5–4 L/min/m²."}
}
);

{ id:"ws-case-kwon", title:"Case Study: Luke Kwon (Epidural Hemorrhage)", kicker:"A head injury, a lucid interval, and a race against herniation",
  blocks:[
   {p:"Luke Kwon, a professional golfer and YouTube creator, survived an <strong>epidural hemorrhage</strong> in September 2022 — and was extremely lucky to live. It is the same type of head injury that killed actress Natasha Richardson in 2009: after a fall on a beginner ski slope she felt fine and declined medical care, then declined hours later."},
   {p:"His video account is a layperson's telling of a complex neurological emergency, pieced together from what he remembers and what others told him."},
   {hook:"<strong>Case question:</strong> which of his symptoms show that his intracranial pressure had risen to a very dangerous level?"},
   {h:"What happened"},
   {table:{head:["Time","Events","Cues"],rows:[
    ["The injury","Riding in a golf cart with his head out, he struck a steel bridge railing. \"Ow — what was that?\" He did <strong>not</strong> pass out.","Mechanism of a head injury; no loss of consciousness does not rule out a bleed"],
    ["The next hours","Played seven more holes — remembers none of them. Texted that he felt confused. Drove about 40 minutes to his hotel.","<strong>Amnesia</strong> for the event; confusion — a change in LOC"],
    ["At the hotel","Excruciating, worsening headache; very sleepy; asked the clerk to wake him and check his orientation. Did not want the ER because of cost.","Worsening headache and lethargy = rising ICP; the <strong>lucid interval</strong> is ending"],
    ["Arriving at the ER","Vomited three times outside the entrance. Minutes later, asked where he was, he answered with something unrelated (switching his website payment system).","Vomiting from pressure; disorientation — LOC is falling fast"],
    ["Emergency CT","Large collection of blood across the top left of the skull; staff called out the amount of blood.","Space-occupying bleed in a closed box"],
    ["Before transfer","In and out of a coma; seven seizures, two serious. The first hospital had no neurosurgeon, and he was too unstable to transfer — he was sedated more until stable enough.","Seizures and coma = decompensation. Sedation lowers the brain's metabolic demand and protects the airway"],
    ["Surgery","Transferred to a hospital with a neurosurgeon; the blood was drained in about 2.5 hours. Staples in the scalp.","Evacuating the blood restores room in the box"],
    ["Recovery","Woke four days later; could wiggle his toes and give a thumbs-up; no lasting memory or motor problems.","Motor response and following commands = good neuro signs"]
   ]}},
   {h:"Answer: the dangerous-ICP cues"},
   {list:[
    "<strong>Worsening, excruciating headache</strong> that kept getting worse instead of better",
    "<strong>Increasing sleepiness</strong> (lethargy) — a falling LOC",
    "<strong>Vomiting</strong> — three times outside the ER",
    "<strong>Disorientation</strong> — answering \"where are you?\" with something unrelated",
    "<strong>Seizures</strong> (seven, two serious) and <strong>going in and out of a coma</strong> — decompensation, with herniation close"]},
   {h:"Clinical judgment"},
   {list:[
    "<strong>Herniation:</strong> in his own words, with that much blood the brain has nowhere to go but down toward the spine — \"once that happens it's pretty much game over.\" That is herniation from high to low pressure, and why the team had perhaps 30–45 minutes.",
    "<strong>Change in LOC came first</strong> (confusion, amnesia, sleepiness); vomiting and seizures came later as pressure kept rising.",
    "<strong>Never leave a head-injured person to \"sleep it off\"</strong> — any worsening headache, vomiting, or confusion after a head injury needs emergency evaluation.",
    "Neuro checks: orientation, LOC, pupils (hourly), and motor response — \"wiggle your toes, give a thumbs-up.\""]},
   {hook:"Hit head → \"fine\" → headache, confusion, sleepiness → vomiting → seizures and coma. The lucid interval buys false reassurance."}
  ],
  check:{stem:"After hitting his head, a client says he feels fine but has no memory of the last hour and a worsening headache. Which action is best?", options:["Let him sleep and check on him in the morning","Arrange emergency evaluation and frequent neuro checks","Give ibuprofen and send him home","Have him resume normal activity to see how he feels"], answer:1, why:"Amnesia and a worsening headache after a head injury suggest a bleed with a lucid interval. He needs emergency evaluation and close neuro monitoring, not sleep or activity."}
}
]};

// ---------- EMERGENCY MATH SPRINT (timed) ----------
"game-mathsprint":[
 {stem:"MAP 90, ICP 15. CPP = ?", options:["75","105","60","85"], answer:0, why:"CPP = MAP − ICP = 90 − 15 = <strong>75</strong> (normal 70–100).", ref:"m5math-cpp"},
 {stem:"BP 120/60. MAP = ?", options:["90","80","70","100"], answer:1, why:"MAP = (SBP + 2 × DBP) ÷ 3 = (120 + 120) ÷ 3 = <strong>80</strong>.", ref:"m4math-map-cpp"},
 {stem:"BP 150/90, ICP 25. CPP = ?", options:["85","110","65","95"], answer:0, why:"MAP = (150 + 180) ÷ 3 = 110. CPP = 110 − 25 = <strong>85</strong>.", ref:"m5math-cpp"},
 {stem:"MAP 70, ICP 22. CPP = ? What does it mean?", options:["48 — ischemia","92 — normal","48 — normal","22 — necrosis"], answer:0, why:"70 − 22 = <strong>48</strong>, below 50 = ischemia.", ref:"m5math-cpp"},
 {stem:"Sepsis bundle bolus for an 80-kg client = ?", options:["800 mL","2,400 mL","1,600 mL","3,000 mL"], answer:1, why:"30 mL/kg × 80 kg = <strong>2,400 mL</strong>.", ref:"m5qr-shock"},
 {stem:"Sepsis bundle bolus for a 60-kg client = ?", options:["1,800 mL","600 mL","1,200 mL","2,400 mL"], answer:0, why:"30 × 60 = <strong>1,800 mL</strong>.", ref:"m5qr-shock"},
 {stem:"Minimum hourly urine output for a 70-kg thermal-burn client at 0.5 mL/kg/hr = ?", options:["35 mL/hr","70 mL/hr","14 mL/hr","50 mL/hr"], answer:0, why:"0.5 × 70 = <strong>35 mL/hr</strong> (target 30–50).", ref:"burns-thermal"},
 {stem:"Urine output over 4 hours = 120 mL. Hourly average = ?", options:["30 mL/hr","40 mL/hr","20 mL/hr","60 mL/hr"], answer:0, why:"120 ÷ 4 = <strong>30 mL/hr</strong>.", ref:"mathfluid"},
 {stem:"Intake: IV 1,200 mL + PO 480 mL. Output: urine 900 mL + NG 200 mL. Balance = ?", options:["+580 mL","−580 mL","+1,780 mL","+380 mL"], answer:0, why:"1,680 − 1,100 = <strong>+580 mL</strong>.", ref:"mathfluid"},
 {stem:"GCS: eyes to pain (2), inappropriate words (3), localizes pain (5). Total = ?", options:["10","9","11","8"], answer:0, why:"2 + 3 + 5 = <strong>10</strong>.", ref:"iicp-assess"},
 {stem:"GCS: no eye opening (1), no verbal (1), withdraws (4). Total = ? Action?", options:["6 — protect the airway (intubate)","6 — monitor","8 — normal","4 — normal"], answer:0, why:"1 + 1 + 4 = <strong>6</strong> — 8 or below, intubate.", ref:"iicp-assess"},
 {stem:"BP 130/70. MAP = ?", options:["90","100","80","85"], answer:0, why:"(130 + 140) ÷ 3 = <strong>90</strong>.", ref:"m4math-map-cpp"},
 {stem:"Minimum urine output for an 80-kg client in shock (0.5 mL/kg/hr) = ?", options:["40 mL/hr","80 mL/hr","16 mL/hr","30 mL/hr"], answer:0, why:"0.5 × 80 = <strong>40 mL/hr</strong>.", ref:"shock-hypo"},
 {stem:"Disaster kit water for 2 people for 3 days = ?", options:["24 liters","12 liters","8 liters","6 liters"], answer:0, why:"4 L × 2 people × 3 days = <strong>24 liters</strong>.", ref:"prep-plans"},
 {stem:"Amiodarone in VF: first dose 300 mg. Second dose = ?", options:["150 mg","300 mg","75 mg","450 mg"], answer:0, why:"300 mg first, <strong>150 mg</strong> second.", ref:"ws-code-paths"},
 {stem:"MAP 100, ICP 30. CPP = ?", options:["70","130","60","80"], answer:0, why:"100 − 30 = <strong>70</strong> — but ICP above 20 still needs treatment.", ref:"m5math-cpp"}

// ---------- CODE STRIP DRILL ----------
"drill-strips":[
 {stem:g5strip('vfib')+'The client is unresponsive and pulseless. Name this rhythm.', options:["Ventricular fibrillation","Asystole","Ventricular tachycardia","Atrial fibrillation"], answer:0, why:"Chaotic, wavy baseline with no identifiable QRS = <strong>V-fib</strong>. No cardiac output.", ref:"ws-code-paths"},
 {stem:g5strip('vfib')+'The code team confirms this rhythm. What is the first action after CPR is started?', options:["Defibrillate","Epinephrine ASAP","Amiodarone 300 mg","Synchronized cardioversion"], answer:0, why:"VF is shockable — <strong>shock #1</strong>, then CPR 2 min.", ref:"ws-code-paths"},
 {stem:g5strip('vtach')+'No pulse is felt. Name the rhythm and the action.', options:["Pulseless V-tach — defibrillate","V-tach with a pulse — adenosine","SVT — vagal maneuver","Sinus tachycardia — treat the cause"], answer:0, why:"Fast, wide, regular QRS with <strong>no pulse</strong> = pulseless VT → shockable → defibrillate.", ref:"ws-code-paths"},
 {stem:g5strip('asystole')+'Name this rhythm.', options:["Asystole","Fine V-fib","PEA","Agonal rhythm"], answer:0, why:"A flat line = <strong>asystole</strong> (confirm in more than one lead).", ref:"ws-code-paths"},
 {stem:g5strip('asystole')+'What does the team do?', options:["CPR and epinephrine ASAP — no shock","Defibrillate","Amiodarone 300 mg","Synchronized cardioversion"], answer:0, why:"Asystole is non-shockable: <strong>epinephrine ASAP</strong> and CPR; look for the H's and T's.", ref:"ws-code-paths"},
 {stem:g5strip('nsr')+'The monitor shows this rhythm, but the client has <strong>no pulse</strong>. What is it?', options:["Pulseless electrical activity (PEA)","Normal sinus rhythm","Asystole","Ventricular fibrillation"], answer:0, why:"An organized rhythm with no pulse = <strong>PEA</strong> — non-shockable: epinephrine ASAP, CPR, H's and T's.", ref:"ws-code-paths"},
 {stem:g5strip('vfib')+'This rhythm persists after shock #2 and 2 minutes of CPR. What comes with the next CPR cycle?', options:["Epinephrine 1 mg","Amiodarone 300 mg","Atropine 1 mg","Nothing — shock again only"], answer:0, why:"Shockable pathway: after shock #2 → CPR 2 min + <strong>epinephrine</strong>.", ref:"ws-code-paths"},
 {stem:g5strip('vfib')+'This rhythm persists after shock #3. Which drug goes with the next CPR cycle?', options:["Amiodarone 300 mg","Epinephrine ASAP","Adenosine 6 mg","Magnesium only"], answer:0, why:"After the third shock: CPR 2 min + <strong>amiodarone 300 mg</strong> (or lidocaine).", ref:"ws-code-paths"},
 {stem:'The client was shocked once for V-fib. At the next rhythm check, the monitor shows:'+g5strip('asystole')+'What now?', options:["Epinephrine ASAP and CPR","Shock #2","Amiodarone 300 mg","Stop the code"], answer:0, why:"The <strong>Reverse</strong>: VF became asystole → epinephrine ASAP, CPR, find the H's and T's.", ref:"ws-code-paths"},
 {stem:'After epinephrine for asystole, the rhythm check now shows:'+g5strip('vfib')+'What now?', options:["Shock immediately","Finish the drug cycle first","Give amiodarone","Check for ROSC"], answer:0, why:"The <strong>Switch</strong>: once shockable, shock immediately — don't finish the drug cycle.", ref:"ws-code-paths"},
 {stem:g5strip('torsades')+'A pulseless client has this twisting, wide-complex rhythm. Which statement is correct?', options:["It's torsades de pointes — shockable; magnesium is the drug for it","It's asystole — epinephrine only","It's sinus tachycardia — treat the cause","It's atrial flutter — rate control"], answer:0, why:"<strong>Torsades</strong> (polymorphic VT) — pulseless means defibrillate; magnesium treats torsades.", ref:"ws-code-paths"},
 {stem:g5strip('vfib')+'During CPR for this rhythm, the ETCO₂ suddenly jumps from 12 to 40 mm Hg. What does it suggest?', options:["Return of spontaneous circulation","Poor compressions","The tube is in the esophagus","Hyperventilation"], answer:0, why:"A sudden jump to 35–45 during a code = <strong>ROSC</strong> — check for a pulse.", ref:"em-survey"}

(function(){

  const KEY = "nur114-m5:runcode";
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  function strip(k){ return (typeof STRIPS!=="undefined" && STRIPS[k]) ? '<img src="'+STRIPS[k]+'" alt="Rhythm strip" style="width:100%;height:auto;display:block;margin:6px 0">' : ""; }
  function Game(el){ this.el = el; this.mode = "any"; this.st = load(); this.st.streak = this.st.streak||0; this.st.best = this.st.best||0; this.st.codes = this.st.codes||0; this.start(); }
  Game.prototype.start = function(){
    const keys = Object.keys(RC_PATHS);
    this.path = this.mode === "any" ? keys[Math.floor(Math.random()*keys.length)] : this.mode;
    this.steps = RC_PATHS[this.path].f(); this.i = 0; this.log = []; this.right = 0; this.wrong = 0; this.fb = null;
    this.advance(); this.render();
  };
  Game.prototype.advance = function(){ while(this.i < this.steps.length && this.steps[this.i].c){ const s = this.steps[this.i]; this.log.push({c:s.c, note:s.note}); this.i++; } };
  Game.prototype.pick = function(a){
    const s = this.steps[this.i]; if(!s) return;
    const ok = a === s.a;
    if(ok){ this.right++; this.st.streak++; if(this.st.streak > this.st.best) this.st.best = this.st.streak; }
    else { this.wrong++; this.st.streak = 0; }
    this.log.push({a:s.a, ok, picked:a, why:s.why});
    this.fb = {ok, why:s.why, picked:a, a:s.a};
    this.i++; this.advance();
    if(this.i >= this.steps.length) this.st.codes++;
    save(this.st); this.render();
  };
  Game.prototype.render = function(){
    const self = this, done = this.i >= this.steps.length;
    const chips = [["any","Surprise me"]].concat(Object.keys(RC_PATHS).map(k=>[k,RC_PATHS[k].t]));
    let h = '<div class="cg-chips" role="group" aria-label="Choose a pathway">' + chips.map(c=>'<button type="button" class="cg-chip" data-rcm="'+c[0]+'" aria-pressed="'+(self.mode===c[0])+'">'+c[1]+'</button>').join("") + '</div>';
    h += '<div class="cg-stats"><span><b>'+this.right+'</b> right</span><span><b>'+this.wrong+'</b> missed</span><span><b>'+this.st.streak+'</b> streak</span><span><b>'+this.st.best+'</b> best</span></div>';
    h += '<div class="rc-log" style="display:flex;flex-direction:column;gap:6px;margin:8px 0">';
    let lastC = -1; this.log.forEach(function(e, n){ if(e.c) lastC = n; });
    this.log.forEach(function(e, n){
      if(e.c){ const r = RC_RHY[e.c]; const isNew = n === lastC;
        h += '<div style="border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card,#fff)"><div style="font-size:12px;font-weight:800;letter-spacing:.04em;color:'+(/NOW/.test(e.note)?'#c0392b':'var(--dim)')+'">RHYTHM CHECK · '+e.note.toUpperCase()+'</div><div style="font-weight:700">'+r.t+'</div>'+(isNew?strip(r.s):'')+'</div>'; }
      else h += '<div style="padding:6px 10px;border-left:4px solid '+(e.ok?'#27ae60':'#c0392b')+';background:'+(e.ok?'rgba(39,174,96,.08)':'rgba(192,57,43,.08)')+';border-radius:6px"><b>'+RC_ACTS[e.a].t+'</b>'+(e.ok?'':' <span style="color:#c0392b">(you picked '+RC_ACTS[e.picked].t+')</span>')+'<div style="font-size:14px;margin-top:2px">'+e.why+'</div></div>';
    });
    h += '</div>';
    if(done){
      h += '<div class="cg-end"><p><strong>Code complete — '+(this.mode==="any"?'this was pathway: ':'')+RC_PATHS[this.path].t+'.</strong> '+this.right+' of '+(this.right+this.wrong)+' steps right.</p>' +
        '<div class="cg-bar" style="justify-content:flex-start"><button type="button" class="cg-btn" data-rcnew="1">Run another code</button></div></div>';
    } else {
      h += '<p style="font-weight:700;margin:6px 0">What does the team do next?</p><div class="cg-opts c-navy" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px">' +
        Object.keys(RC_ACTS).map(k=>'<button type="button" class="cg-opt" data-rca="'+k+'">'+RC_ACTS[k].t+'</button>').join("") + '</div>';
    }

    this.el.onclick = function(e){
      const b = e.target.closest ? e.target.closest("button") : null; if(!b || !self.el.contains(b)) return;

      if(b.dataset.rcnew){ self.start(); const t = self.el.getBoundingClientRect().top + window.pageYOffset - 80; if(t < window.pageYOffset) window.scrollTo(0, t); }
    };
  };

  function boot(){ mountAll(); new MutationObserver(function(){ if(document.querySelector(".rc-mount:not([data-ready])")) mountAll(); }).observe(document.body, {childList:true, subtree:true}); }

})();

rowsWhy("toxin", "tox", {

 "Acetaminophen":"Acetaminophen's toxic byproduct destroys the liver (RUQ pain, jaundice, ALT/AST up). Acetylcysteine restores the liver's protection; its sulfur smell makes clients vomit.",
 "Salicylates (aspirin)":"Aspirin stimulates the respiratory center first (fast breathing, respiratory alkalosis), then acid builds (metabolic acidosis). Tinnitus is the tell. Bicarb alkalinizes the urine so the acid is excreted — tricyclics also get bicarb, but their cue is a wide QRS.",
 "Tricyclic antidepressants":"Tricyclics slow conduction through the heart — the QRS widens and lethal dysrhythmias and seizures follow. Bicarb narrows the QRS, so the client stays on a continuous ECG. Aspirin also gets bicarb, but its cue is tinnitus.",
 "Digoxin":"Digoxin toxicity shows up as visual halos, nausea, and bradycardia. Digibind binds the drug; as digoxin's effect ends, potassium moves back into the cells, so watch for hypokalemia.",
 "Iron":"Children often get into iron-containing vitamins. Deferoxamine binds the iron so it leaves in the urine — the reddish-pink color is expected. Charcoal can't bind iron.",
 "Ethylene glycol":"Antifreeze tastes sweet, which attracts children and pets. The liver turns it into toxic acids (metabolic acidosis); fomepizole blocks that enzyme. Kidneys may need dialysis.",
 "Carbon monoxide":"CO binds hemoglobin about 200 times more readily than oxygen, and the pulse oximeter reads it as oxygen — so the SpO₂ looks normal. 100% O₂ pushes CO off faster; follow the carboxyhemoglobin level.",
 "Cyanide":"Burning plastics release cyanide, which stops the cells from using oxygen — lactate climbs. Hydroxocobalamin binds cyanide and turns skin and urine red, which can throw off lab tests, so draw labs first.",
 "Nerve agents (sarin)":"Nerve agents flood the body with acetylcholine (SLUDGE). Atropine dries the secretions; pralidoxime reactivates the enzyme. Decontaminate first so staff aren't exposed.",
 "Corrosives (lye, bleach)":"A corrosive burns going down and burns again coming up, so vomiting is never induced. Charcoal won't bind it and blackens the esophagus so the burns can't be seen on endoscopy.",
 "Hydrocarbons (gasoline, kerosene)":"Hydrocarbons are easily inhaled into the lungs — vomiting would cause aspiration pneumonia. Care is supportive and focused on the airway.",
 "Vasopressor infiltration":"A vasopressor that leaks into tissue clamps the vessels so hard the skin dies (cold, hard, pale). Phentolamine reverses the constriction; restart the drip in another limb because the client still needs it."

(function(){
  const strip = s => String(s==null?"":s).replace(/<img[^>]*>/g,"").replace(/<br\s*\/?>/g," ").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();
  const clean = s => String(s==null?"":s).replace(/<img[^>]*>/g,"").trim();
  function cardsFrom(units){
    const cards = [], seen = new Set();
    units.forEach(u => { if(!u) return; u.lessons.forEach(l => {
      let ctx = strip(l.title);
      (l.blocks||[]).forEach(b => {
        if(b.h) ctx = strip(b.h);
        if(!b.table) return;
        const head = b.table.head.map(strip);
        b.table.rows.forEach(r => {
          if(!r || r.length < 2) return;
          const key = strip(r[0]);
          if(!key || key.length > 90) return;
          const backParts = [];
          for(let i=1;i<r.length;i++){ const v = strip(r[i]); if(v && v!=="—") backParts.push((head[i] && !/^details?$/i.test(head[i]) ? "<strong>"+head[i]+":</strong> " : "")+clean(r[i])); }
          if(!backParts.length) return;
          const front = (ctx && ctx !== key ? '<span style="font-size:.8em;opacity:.75">'+ctx+'</span><br>' : "") + "<strong>"+clean(r[0])+"</strong>";
          const sig = ctx+"|"+key;
          if(seen.has(sig)) return; seen.add(sig);
          cards.push({f:front, b:backParts.join("<br>")});
        });
      });
    }); });
    return cards;
  }
  const groups = [
    ["auto-basics","Emergency Basics &amp; IICP — every table", [typeof EM_BASICS!=="undefined"?EM_BASICS:null, typeof IICP_UNIT!=="undefined"?IICP_UNIT:null, typeof HYDRO_UNIT!=="undefined"?HYDRO_UNIT:null]],

    ["auto-poison","Poisonings — every table", [typeof POISON_UNIT!=="undefined"?POISON_UNIT:null]],
    ["auto-shock","Shock &amp; Submersion — every table", [typeof SHOCK_UNIT!=="undefined"?SHOCK_UNIT:null, typeof SUBMERSION_UNIT!=="undefined"?SUBMERSION_UNIT:null]],
    ["auto-env","Environmental &amp; Anaphylaxis — every table", [typeof ENV_UNIT!=="undefined"?ENV_UNIT:null, typeof ANAPH_UNIT!=="undefined"?ANAPH_UNIT:null]],
    ["auto-prep","Preparedness &amp; Crisis — every table", [typeof PREP_UNIT!=="undefined"?PREP_UNIT:null, typeof CRISIS_UNIT!=="undefined"?CRISIS_UNIT:null]],
    ["auto-meds","Medications — every drug card", [typeof M5_MEDS!=="undefined"?M5_MEDS:null]],
    ["auto-ref","Quick Reference &amp; Master Charts — every table", [typeof M5_QUICKREF!=="undefined"?M5_QUICKREF:null, typeof M5_CHARTS!=="undefined"?M5_CHARTS:null]]
  ];
  const all = [];
  groups.forEach(([key,title,units]) => { const c = cardsFrom(units); if(c.length){ FLASH[key] = {title, cards:c}; all.push(...c); } });
  // keep the hand-written decks too, and build one endless deck from everything
  Object.keys(FLASH).filter(k => !/^auto-|^all$/.test(k)).forEach(k => all.push(...FLASH[k].cards));
  const ordered = {all:{title:"Everything — endless shuffle (all decks)", cards:all}};
  Object.keys(FLASH).forEach(k => ordered[k] = FLASH[k]);
  Object.keys(FLASH).forEach(k => delete FLASH[k]);
  Object.assign(FLASH, ordered);
})();

"p": "Lay the patient flat with legs up. <b>BP rises</b> → they need fluids. <b>BP stays the same</b> → fluids won't help; go to vasopressors."

"Fluid",
"Notes"

"Isotonic crystalloids — NS, LR",
"First line"

[

"Colloids — albumin, blood products, volume expanders",
"Stay where you put them"

"Not fluid-responsive, or nothing else works"

},
{
"h": "2.3 Vasopressors"
},
{
"table": {
"head": [
"Topic",
"Key point"
],
"rows": [
[
"<b>Action</b>",
"Constrict vessels → BP ↑"
],
[
"<b>Titration</b>",
"MAP &lt; 60 → start lowest dose, titrate up, add another pressor if needed. MAP &gt; 60 → titrate down. <b>Goal = get them OFF</b>"
],
[

"<b>Vesicant</b> → large-bore IV or central line"
],
[

],

},
{
"hook": "<b>Infiltration: NEW IV FIRST</b><br>The patient needs the pressor more than anything. Start a new IV ASAP, <b>then</b> give <b>phentolamine SubQ</b> infiltrated across the entire area."

{

},

"Key signs",

{
"h": "2.6 How Shock Happens — Cells, BP Regulation &amp; MODS"
},
{
"p": "<i>From your textbook — Ch. 11 Shock, Sepsis &amp; MODS</i>"
},
{
"p": "Shock = <b>inadequate tissue perfusion</b> → O₂ and nutrient delivery fails → cell dysfunction and death. Adequate perfusion needs three things: a working <b>pump</b> (heart), intact <b>vessels</b>, and enough <b>volume</b>. Textbook classes: <b>hypovolemic, cardiogenic, obstructive, distributive</b> (septic, neurogenic, anaphylactic)."
},
{
"table": {
"head": [
"What happens",
"Why it matters"
],
"rows": [
[
"<b>Cells switch to anaerobic metabolism</b>",
"Little ATP + <b>lactic acid</b> buildup → acidosis (one reason pressors fail in acid)"
],
[
"<b>Cell swells: K⁺ leaks out, Na⁺ and water rush in; mitochondria and lysosomes rupture</b>",
"Cell dies; <b>hyperkalemia</b>"
],
[
"<b>Stress hormones (catecholamines, cortisol, glucagon) + cytokines</b>",
"<b>Hyperglycemia</b> and insulin resistance; glycogen runs out → protein breakdown → organ failure"
],
[
"<b>Clotting cascade activates</b>",
"Micro-clots block small vessels → worse perfusion (a positive feedback loop)"
]
]
}
},
{
"hook": "<b>MAP = Cardiac output × Peripheral resistance</b><br>Cardiac output = stroke volume × heart rate. Arteriole diameter sets peripheral resistance. Raise either one and BP rises — that's how fluids, inotropes and vasopressors work."
},
{
"table": {
"head": [
"Regulator",
"How it raises BP",
"Speed"
],
"rows": [
[
"<b>Baroreceptors (carotid sinus, aortic arch)</b>",
"Sense ↓ BP → adrenal medulla releases <b>epinephrine/norepinephrine</b> → ↑ HR + vasoconstriction",
"Seconds"
],
[
"<b>Chemoreceptors (aortic arch, carotids)</b>",
"Sense ↓ O₂ / ↑ CO₂ → ↑ BP and RR",
"Seconds"
],
[
"<b>Kidneys — RAAS</b>",
"Renin → angiotensin II (vasoconstrictor) → <b>aldosterone</b> (retain Na⁺ + water) → <b>ADH</b> (retain more water)",
"Hours to days"
]
]
}
},
{
"hook": "<b>MODS — Multiple Organ Dysfunction Syndrome</b><br>Altered function of <b>2 or more organs</b> in an acutely ill patient, needing intervention to keep them working. Can follow any shock but is <b>mostly seen with sepsis</b>. Septic shock is the most life-threatening form of sepsis — early recognition is the key to survival."
},

"blocks": [
{
"h": "<span style=\"font-size:1.05em\">Part 3 · IICP, Hydrocephalus &amp; Brain Death</span>"
},
{
"p": "The skull is a closed box. When brain, CSF or blood volume rises, pressure has nowhere to go and pushes down on the brainstem. The <b>first sign is always a change in LOC</b> — headache is not reliable."
},
{
"h": "3.1 Monro-Kellie &amp; Compensation"
},
{
"table": {
"head": [
"Skull contents",
"%"
],
"rows": [
[
"<b>Brain tissue</b>",
"80%"
],
[
"<b>CSF</b>",
"10%"
],
[
"<b>Blood</b>",
"10%"
]
]
}
},
{
"p": "The skull can't expand (except in babies), so a rise in one must be offset by another. The brain compensates for edema three ways:"
},
{
"list": [
"<b>Autoregulation</b> — arterioles dilate or constrict.",
"<b>CSF</b> — production decreases or reabsorption increases.",
"<b>Shunting</b> — CSF to the spinal canal; blood to the venous system (keep the neck straight)."
]
},
{

"h": "3.7 ICP Monitoring &amp; CPP"
},
{
"p": "Gold standard = <b>drain the fluid</b>: ventriculostomy (neurosurgeon at bedside); also subarachnoid bolt or epidural monitor."
},
{
"hook": "<b>Ventric drain care</b><br>Works by <b>gravity</b>. Transducer level with the <b>TRAGUS of the ear</b> at all times. Insertion site <b>sterile</b>. Fluid <b>CLEAR</b> — slightly bloody only at insertion, never cloudy."
},
{
"hook": "<b>CPP = MAP − ICP</b><br>Example: MAP 80, ICP 25 → CPP 55 (low — heading toward ischemia)."

{
"h": "<span style=\"font-size:1.05em\">Part 4 · Burns &amp; Smoke Inhalation</span>"
},
{
"p": "Burns threaten all three ABCs: the airway swells, fluid shifts out of the vessels, and destroyed cells release potassium. <b>Airway first, then fluids (MAP &gt; 60, urine output), then infection prevention.</b>"
},
{
"h": "4.1 Burn Depth"
},
{
"table": {
"head": [
"Depth",
"Involves",
"Signs &amp; appearance",
"Healing / treatment"
],
"rows": [
[
"<b>1st (superficial)</b>",
"Epidermis",
"Sunburn; red, <b>blanches</b>, dry; tingling, peeling, itching; pain soothed by cooling",
"Heals in a few days; oral pain meds, cool compresses, lotion — <b>no topical antimicrobials</b>"
],
[
"<b>2nd (partial thickness)</b>",
"Epidermis + part of dermis",
"Scalds, flash flame; <b>blistered</b>, mottled red, weeping, edema; <b>painful</b>, sensitive to air",
"Heals in <b>2–3 weeks</b>; some scarring; may need grafting"
],
[
"<b>3rd (full thickness)</b>",
"Epidermis, dermis ± subcutaneous tissue",
"Flame, hot liquids, electrical, chemical; <b>dry, leathery</b> — pale white, red, brown or charred; <b>insensate</b>; shock, <b>myoglobinuria</b> (red urine)",
"Eschar removal + <b>grafting</b>; scarring, contractures, loss of function"
],
[
"<b>4th / deep full-thickness</b>",
"Fat, fascia, <b>muscle, bone</b>",
"<b>Charred</b> /black; no sensation; shock, myoglobinuria",
"Months; <b>amputation likely</b> (see box below)"
]
]
}
},
{
"hook": "<b>Less pain does NOT mean less injury</b><br>Partial thickness hurts the most. Full-thickness and deeper burns may be <b>painless</b> because nerve fibers are destroyed — the textbook says this often <b>deceives patients</b> about how serious the burn is."
},
{
"hook": "<b>Numbers that differ between your sources</b><br>Your burns handout says deep full-thickness burns need <b>grafts</b>. Your textbook (Table 58-1) says for 4th-degree burns <b>amputation is likely and grafting is of no benefit</b>. Know both — ask your instructor which wording to use."
},
{
"h": "4.2 Severity &amp; TBSA"
},
{
"p": "<i>From your textbook — Ch. 58 Burns</i>"
},
{
"p": "Severity depends on: <b>age</b> (young children and older adults do worse — thinner skin → deeper burns), <b>depth</b>, <b>% TBSA</b>, <b>inhalation injury</b>, other injuries, <b>location</b> (face, perineum, hands, feet), and <b>comorbidities</b>."
},
{
"p": "TBSA is estimated with the <b>rule of nines</b> (most common in adults), the Lund-Browder method, or the palmar method (patient's palm ≈ 1%). Partial areas count partially — half of one arm = <b>4.5%</b>, not 9%."
},
{
"p": "<i>Rule of nines values — standard adult figure (your textbook's Fig. 58-3 wasn't in the screenshots)</i>"
},
{

"9%"
],
[

"9% (×2 = 18%)"
],
[

"18%"
],
[
"<b>Back of trunk</b>",
"18%"
],
[

},
{
"p": "<b>ABA criteria for referral to a burn center:</b>"
},
{
"list": [
"Partial thickness ≥ <b>10% TBSA</b>",
"Burns of the <b>face, hands, feet, genitalia, perineum or major joints</b>",

{
"h": "4.3 Care at the Scene"
},
{
"p": "<i>From your textbook — Ch. 58 Burns</i>"
},
{
"list": [
"<b>Stop the burning:</b> stop, drop and roll; smother flames with a blanket or coat (\"stop, sit and pat\" if mobility is impaired). Electrical → <b>disconnect the source before touching the patient</b>.",
"<b>Cool the burn</b> with <b>cool water</b> — <b>never ice</b>, never wrap in ice, no cold soaks longer than ~ <b>20 minutes</b> (worsens damage, causes hypothermia).",
"<b>Remove restrictive items:</b> jewelry, piercings, nonadherent clothing (edema comes fast). Leave <b>adherent</b> clothing in place.",
"<b>Cover</b> with a clean, dry cloth — <b>no ointments or salves</b> at the scene.",
"<b>Chemical burns:</b> brush off dry chemical first, remove contaminated clothing, then <b>irrigate</b> <b>immediately and continuously</b> with lots of water; flush eyes with cool clean water."
]
},
{
"p": "Primary survey = <b>ABCDE</b>: Airway (protect the c-spine), Breathing, Circulation, Disability (neuro), Exposure (examine while keeping warm). 100% O₂ if CO suspected; at least one large-bore IV."
},
{
"hook": "<b>Clinical judgment: airway first</b><br>Give <b>humidified 100% oxygen</b>. Severe respiratory distress or airway edema → <b>intubate and ventilate</b>. Keep <b>NPO</b> and position to <b>prevent aspiration</b> — nausea and vomiting are common."
},
{
"h": "4.4 Phases of Burn Care"
},
{
"p": "<i>From your textbook — Ch. 58 Burns</i>"
},
{
"table": {
"head": [
"Phase",
"Duration",
"Priorities"
],
"rows": [
[
"<b>Emergent / resuscitative</b>",
"Injury → end of fluid resuscitation",
"ABCDE; <b>prevent shock</b> and respiratory distress; find other injuries; initial wound care"
],
[
"<b>Acute / intermediate</b>",
"Start of diuresis → wound closure",
"Wound care and closure; prevent <b>infection</b> and VTE; <b>nutrition</b>"
],
[

"Wound closure → best physical and psychosocial function",
"Prevent <b>scars and contractures</b>; PT/OT/vocational rehab; reconstruction; counseling"
]
]
}
},
{
"h": "4.5 Burn Shock &amp; Fluid Shifts"
},
{
"p": "<i>From your textbook — Ch. 58 Burns</i>"
},
{
"p": "Burns trigger systemic inflammation → <b>capillary leak</b>. Plasma (not whole blood) leaks into tissues → edema and <b>hypovolemia</b>. This is <b>burn shock</b> — a hypovolemic shock that can become distributive without enough IV fluid. Catecholamines cause vasoconstriction and ↑ HR, which raise cardiac workload."
},
{
"table": {
"head": [
"Timeline",
"What happens"
],
"rows": [
[
"<b>Immediately</b>",
"Cardiac output drops — even before plasma loss"
],
[
"<b>Peaks at 6–8 hours</b>",
"Fluid leak is greatest"
],
[
"<b>First 24–36 hours</b>",
"Most intravascular fluid lost; edema forms (up to 18 h in deep burns)"
],
[
"<b>After capillaries heal</b>",
"Fluid shifts back into vessels → <b>diuresis</b> for several days to 2 weeks"
]
]
}
},
{
"hook": "<b>Edema becomes a tourniquet</b><br>In burns over <b>20% TBSA</b>, fluid shifts are systemic. Tight burned skin can't stretch over the swelling — especially <b>circumferential</b> burns — so distal pulses fade and <b>compartment syndrome</b> develops."
},
{
"table": {
"head": [
"System",
"Changes with severe burns"
],
"rows": [
[
"<b>Cardiovascular</b>",
"Cardiac depression, edema, hypovolemia"
],
[
"<b>Pulmonary</b>",
"Vasoconstriction, edema"
],
[
"<b>GI</b>",
"Slowed motility and absorption, <b>bacterial translocation</b> (gut bacteria enter blood)"
],
[
"<b>Kidney</b>",
"Vasoconstriction (watch urine output)"
],
[
"<b>Other</b>",
"Altered thermoregulation, <b>immunodepression</b>, <b>hypermetabolism</b>"
]
]
}
},
{

},
{
"p": "<i>Added from standard nursing content — your notes only say to assess for frostbite/gangrene and not to massage</i>"

{
"table": {
"head": [
"What it is",
"Tissue freezes → ice crystals damage cells and blood flow stops. Fingers, toes, ears, nose, cheeks"

"rows": [
[
"<b>Signs</b>",
"Superficial: white or waxy, numb, tingling. Deep: hard, white-gray or mottled, no sensation; blisters after rewarming; black tissue = gangrene"
],
[
"<b>Interventions</b>",
"Treat <b>hypothermia first</b>. Rewarm rapidly in <b>warm water (about 98.6–102°F / 37–39°C)</b> until tissue is pink and soft. <b>Pain meds BEFORE rewarming</b> — it is very painful. Elevate, loose sterile dressings between digits, tetanus"
],
[
"<b>Don't</b>",
"<b>Don't rub or massage</b>, don't use dry heat (heating pad, fire), don't walk on frostbitten feet, don't rewarm if it could refreeze"
],
[
"<b>Watch</b>",
"Compartment syndrome, infection, gangrene (may need amputation later)"
]
]
}

{
"h": "<span style=\"font-size:1.05em\">Part 7 · Cardiac Arrest (ACLS 2020)</span>"
},
{
"p": "In Perfusion you learned to recognize the lethal rhythms; here you treat them. In arrest the order is <b>CAB</b>: no pulse → start CPR, call for help, attach the defibrillator, then ask one question — <b>is the rhythm</b> <b>shockable?</b>"
},
{
"h": "7.1 Shockable vs. Non-Shockable"
},
{
"table": {
"head": [
"Shockable: VF / pulseless VT (torsades → add magnesium)",
"Non-shockable: asystole / PEA"
],
"rows": [
[
"1. <b>Shock ASAP</b>",
"1. <b>Epinephrine ASAP</b>"
],
[
"2. CPR 2 min, get IV/IO",
"2. CPR 2 min, IV/IO, consider advanced airway"
],
[
"3. Shock → CPR 2 min + epi every 3–5 min",
"3. Recheck rhythm; if it becomes shockable, switch to the left column"
],
[
"4. Shock → CPR 2 min + amiodarone or lidocaine",
"4. CPR + epi every 3–5 min; treat reversible causes"
]
]
}
},
{
"p": "Keep cycling until ROSC or the doctor calls it."
},
{
"hook": "<b>Never shock asystole or PEA</b><br>There is no chaotic electrical activity to reset. Treat with <b>CPR, epinephrine and the reversible causes</b>."
},
{
"h": "7.2 CPR Quality"
},
{
"list": [
"Push hard (<b>at least 2 in / 5 cm</b>) and fast (<b>100–120/min</b>); allow full chest recoil.",
"Minimize interruptions — stop only at 2-minute rhythm checks.",
"Avoid excessive ventilation; switch compressors every 2 minutes.",
"No advanced airway: <b>30:2</b>. Advanced airway: <b>1 breath every 6 seconds</b> with continuous compressions.",
"Low or falling ETCO₂ = reassess CPR quality."
]
},
{
"h": "7.3 Doses &amp; Energy"
},
{
"table": {
"head": [
"Drug / shock",
"Dose"
],
"rows": [
[
"<b>Epinephrine</b>",
"<b>1 mg IV/IO every 3–5 min</b>"
],
[
"<b>Amiodarone</b>",
"300 mg, then 150 mg"
],
[
"<b>Lidocaine</b>",
"1–1.5 mg/kg, then 0.5–0.75 mg/kg"
],
[
"<b>Biphasic shock</b>",
"120–200 J (or max available)"
],
[
"<b>Monophasic shock</b>",
"360 J"
]
]
}
},
{
"hook": "<b>ROSC signs</b><br>Pulse and BP return; abrupt sustained rise in <b>ETCO₂ (typically ≥ 40 mmHg)</b>."

"h": "7.5 Other Rhythms — PVCs &amp; V-Tach With a Pulse"
},
{
"p": "<i>Added from standard ACLS content — your notes cover pulseless V-tach; the Perfusion overview lists PVCs and V-tach</i>"
},
{
"p": "<i>as treated here</i>"
},
{
"table": {
"head": [
"Rhythm",
"What to do"
],
"rows": [
[
"<b>PVCs</b>",
"Assess the patient. <b>Find the cause</b>: hypoxia, low K⁺ or Mg²⁺, caffeine, stimulants, MI, vasopressors. Give O₂, replace electrolytes, notify provider. Frequent or runs of PVCs → can progress to V-tach"
],
[

"O₂, IV, 12-lead; antiarrhythmic (<b>amiodarone</b>) per order"
],
[

"<b>Synchronized cardioversion</b>"
],
[

"Cardiac arrest — CPR + <b>defibrillate</b> (7.1)"
]
]
}
},
{
"hook": "<b>First step for any rhythm: check the PATIENT</b><br>Same strip, different treatment: pulse and stable → meds; pulse but unstable → cardiovert; no pulse → CPR and defibrillate."

],

]
]

"list": [

"p": "<b>Unable to consent:</b> age, intoxication, disability, unconsciousness"

"p": "<b>Fragmented story:</b> trauma response — fight, flight or FREEZE (12–50%); stress hormones disrupt memory encoding. Normal, not lying"
},

"p": "<b>Which first:</b> medical needs before forensic"
},

"p": "<b>Police report:</b> No — VAWA makes the forensic exam free without a report"
},
{
"p": "<b>Prophylaxis:</b> ceftriaxone + doxycycline (chlamydia/gonorrhea), metronidazole (trichomoniasis), ondansetron (nausea), Plan B/levonorgestrel (pregnancy — won't end an existing one), ibuprofen (pain)"

},
{
"h": "<span style=\"font-size:1.05em\">2. Circulation &amp; Shock</span>"
},
{
"h": "2.1  Write the MAP formula. What is the goal MAP?"
},
{
"p": "MAP = (SBP + 2 × DBP) ÷ 3. Goal ≥ 60."
},
{
"h": "2.2  List six assessment findings of hemorrhage:"
},
{
"list": [
"HR ↑",
"RR ↑",
"BP ↓",
"Change in LOC",
"Poor cap refill; cold, diaphoretic skin",
"Weak pulses, syncope"
]
},
{
"h": "2.3  Where can a tourniquet be used? What do you do for a bleeding trunk or abdominal wound? How long can a tourniquet stay on?"
},
{
"p": "Extremities only (~6 hours before permanent damage). Trunk/abdomen: pack the wound, then apply pressure. No pulses → check carotid/femoral, use a Doppler."
},
{
"h": "2.4  Describe the fluid-responsive test. What do the two possible results mean?"
},
{
"p": "Lay the patient flat with legs up. BP rises → fluid-responsive, give fluids. BP unchanged → fluids won't help; start vasopressors."
},
{
"h": "2.5  Put the fluids in order and give an example of each:"
},
{
"table": {
"head": [
"Step",
"Fluid type",
"Examples / notes"
],
"rows": [
[
"<b>1st</b>",
"Isotonic crystalloids",
"NS, LR"
],
[
"<b>2nd</b>",
"Colloids",
"Albumin, blood products, volume expanders — stay where you put them"
],
[
"<b>3rd</b>",
"Vasopressors",
"Not fluid-responsive or nothing else works"
]
]
}
},
{
"h": "2.6  Vasopressors — answer each:"
},
{
"list": [
"<b>How do they work?</b>",
"<b>When do you titrate up vs. down?</b>",
"<b>Why do they need a large-bore IV or central line?</b>",
"<b>What lab should you check if they aren't working? Why?</b>",
"<b>Side effects to monitor:</b>"
]
},
{
"p": "<b>How:</b> constrict blood vessels → BP ↑"
},
{
"p": "<b>Titrate:</b> MAP &lt; 60 → start lowest dose, titrate up, add another pressor; MAP &gt; 60 → titrate down. Goal = get them off"
},
{
"p": "<b>Access:</b> vesicant — tissue damage if it infiltrates"
},
{
"p": "<b>Lab:</b> ABGs — pressors don't work in an acidic environment. Resp acidosis: blow off CO₂; metabolic: bicarb, insulin/D50 for hyperkalemia, dialysis"
},
{
"p": "<b>Side effects:</b> tachycardia, PVCs → V-tach; pale, cold, mottled fingers/toes/nose"
},
{
"h": "2.7  A vasopressor IV infiltrates. What is your FIRST action? What is the antidote and how is it given?"
},
{
"p": "Start a NEW IV ASAP — the patient needs the pressor. Then phentolamine SubQ infiltrated across the entire area."
},
{
"h": "2.8  Complete the shock chart:"
},
{
"table": {
"head": [
"Type",
"Cause",
"Key signs",
"Priority treatment"
],
"rows": [
[
"<b>Hypovolemic</b>",
"Fluid/blood loss (~20%); ↓ preload",
"Tachycardia, tachypnea → bradypnea, hypotension",
"Stop bleeding, NS/LR, PRBCs + clotting factors, legs up"
],
[
"<b>Septic</b>",
"Infection; systemic vasodilation",
"Tachycardia, late hypotension, hyper/hypothermia, warm flushed skin",
"Antibiotics, fluids, vasopressors"
],
[
"<b>Cardiogenic</b>",
"MI (most common), tamponade, myocarditis",
"Pump failure — massive left HF",
"Control dysrhythmias, ↑ contractility"
],
[
"<b>Anaphylactic</b>",
"Drugs, food, venom; histamine ↓ afterload",
"SOB, stridor, wheezing, rash, swelling",
"Epinephrine first, O₂, fluids"
],
[
"<b>Neurogenic</b>",
"Spinal cord injury, spinal anesthesia, TBI",
"Dysfunction at injury level (bladder)",
"Support perfusion"
]
]
}
},
{
"h": "2.9  List early vs. late signs of shock:"
},
{
"table": {
"head": [
"Early",
"Late"
],
"rows": [
[
"<b>Tachycardia, tachypnea, anxiety, restlessness, confusion</b>",
"Hypotension"
],
[
"<b>Prolonged cap refill, weak pulses, pallor, coolness</b>",
"Change in LOC"
],
[
"<b>Hypoactive bowel sounds</b>",
"↓ urine output, narrowing pulse pressure"
]
]
}
}
]
},

"blocks": [
{
"h": "<span style=\"font-size:1.05em\">3. IICP, Hydrocephalus &amp; Brain Death</span>"
},
{
"h": "3.1  Explain the Monro-Kellie hypothesis. What percentage of the skull is brain, CSF and blood?"
},
{
"p": "The skull is a closed box (except in babies) and can't expand — a rise in one component must be offset by another. Brain 80%, CSF 10%, blood 10%."
},
{
"h": "3.2  List the three ways the brain compensates for cerebral edema:"
},
{
"list": [
"Autoregulation — arterioles dilate/constrict",
"CSF — ↓ production or ↑ reabsorption",
"Shunting — CSF to the spinal canal; blood to the venous system (keep neck straight)"
]
},
{
"h": "3.3  Cranial nerves — fill in the name and how to assess each one:"
},
{
"table": {
"head": [
"#",
"Nerve",
"How to assess"
],
"rows": [
[
"<b>I</b>",
"Olfactory",
"Smell (alcohol swab)"
],
[
"<b>II</b>",
"Optic",
"Snellen chart / read name badge"
],
[
"<b>III</b>",
"Oculomotor",
"PERRLA, cardinal fields of gaze"
],
[
"<b>IV</b>",
"Trochlear",
"Cardinal fields of gaze (down and in)"
],
[
"<b>V</b>",
"Trigeminal",
"Clench jaw, touch face"
],
[
"<b>VI</b>",
"Abducens",
"Cardinal fields of gaze (lateral)"
],
[
"<b>VII</b>",
"Facial",
"Funny faces, smile"
],
[
"<b>VIII</b>",
"Acoustic",
"Hearing, balance"
],
[
"<b>IX</b>",
"Glossopharyngeal",
"Say \"ahh\", uvula midline"
],
[
"<b>X</b>",
"Vagus",
"Gag reflex"
],
[
"<b>XI</b>",
"Spinal accessory",
"Shrug shoulders"
],
[
"<b>XII</b>",
"Hypoglossal",
"Tongue out midline"
]
]
}
},
{
"p": "Mnemonic: \"Oh Oh Oh To Touch And Feel Very Good Velvet, AH!\""
},
{
"h": "3.4  Put the LOC assessment in order (1–10) and label where the patient is alert, lethargic or unresponsive:"
},
{
"table": {
"head": [
"Step",
"Stimulus",
"Responds here = ?"
],
"rows": [
[
"<b>1</b>",
"State their name",
"Alert"
],
[
"<b>2</b>",
"Touch arm",
"Lethargic"
],
[
"<b>3</b>",
"Lightly pat arm",
"Lethargic"
],
[
"<b>4</b>",
"Shake arm",
"Lethargic"
],
[
"<b>5</b>",
"Pinch arm",
"No response = unresponsive"
],
[
"<b>6</b>",
"Nailbed pressure",
"Unresponsive"
],
[
"<b>7</b>",
"Sternal rub",
"Unresponsive"
],
[
"<b>8</b>",
"Tap forehead",
"Reflex"
],
[
"<b>9</b>",
"Gag",
"Reflex"
],
[
"<b>10</b>",
"Brush cornea with sterile gauze",
"No reflexes → assess brain death"
]
]
}
},
{
"h": "3.5  Define:"
},
{
"list": [
"<b>Persistent vegetative state:</b>",
"<b>Locked-in syndrome:</b>"
]
},
{
"p": "<b>Persistent vegetative state:</b> awake but unresponsive — \"lights on, no one home\""
},
{
"p": "<b>Locked-in syndrome:</b> neurologically intact but fully paralyzed"
},
{
"h": "3.6  What is the FIRST sign of IICP? Is headache a reliable sign?"
},
{
"p": "Change in LOC (restless, lethargic, confused, any change from baseline). No — headache is not reliable."
},
{
"h": "3.7  Label each sign as early or late:"
},
{
"table": {
"head": [
"Sign",
"Early / late"
],
"rows": [
[
"<b>Unequal pupils</b>",
"Early"
],
[
"<b>Fixed, dilated pupils</b>",
"Late"
],
[
"<b>Vomiting without nausea</b>",
"Late"
],
[
"<b>Reflex impairment</b>",
"Very late"
],
[
"<b>Seizures</b>",
"Any time"
],
[
"<b>Cushing's triad</b>",
"Late"
]
]
}
},
{
"h": "3.8  List the three signs of Cushing's triad:"
},
{
"list": [
"Bradycardia",
"Hypertension with widened pulse pressure (SBP ↑, DBP ↓)",
"Bradypnea"
]
},
{
"h": "3.9  Posturing — match each to its brain level. Which is worse?"
},
{
"table": {
"head": [
"Posturing",
"Description",
"Level"
],
"rows": [
[
"<b>Decorticate</b>",
"Arms flexed in \"to the core\"",
"Above midbrain"
],
[
"<b>Decerebrate (worse)</b>",
"Arms extended, twisted out",
"Midbrain"
],
[
"<b>Arms extended, legs flexed</b>",
"—",
"Pons"
],
[
"<b>Flaccid</b>",
"Little or no response",
"Medulla"
]
]
}
},
{
"h": "3.10  Respiratory patterns — match each to its brain level:"
},
{
"table": {
"head": [
"Pattern",
"Level"
],
"rows": [
[
"<b>Cheyne-Stokes</b>",
"Cortex / upper brainstem"
],
[
"<b>Hyperventilation</b>",
"Midbrain / upper pons"
],
[
"<b>Cluster / ataxic</b>",
"Pons / medulla"
]
]
}
},
{
"h": "3.11  Central vs. peripheral fever — what causes each, and how is central fever treated?"
},
{
"p": "Central = pressure on the hypothalamus — erratic (\"neuro storm\"); cool externally. Peripheral = infection."
},
{
"h": "3.12  Complete the complications chart:"
},
{
"table": {
"head": [
"Complication",
"What happens",
"What you'll see"
],
"rows": [
[
"<b>Diabetes insipidus</b>",
"Too little ADH",
"Lots of urine"
],
[
"<b>SIADH</b>",
"Too much ADH",
"Fluid retention, swelling"
],
[
"<b>Herniation</b>",
"Brain shifts from high to low pressure",
"Loss of blood flow → brain death"
]
]
}
},
{
"h": "3.13  Ventriculostomy care — list four nursing responsibilities:"
},
{
"list": [
"Maintain the drain (works by gravity)",
"Keep the transducer level with the tragus of the ear",
"Keep the insertion site sterile",
"Fluid should be clear — never cloudy"
]
},
{
"h": "3.14  Write the CPP formula and fill in the values:"
},
{
"p": "CPP = MAP − ICP"
},
{
"table": {
"head": [
"Value",
"Meaning"
],
"rows": [
[
"<b>Normal ICP</b>",
"0–15 mmHg"
],
[
"<b>Normal CPP</b>",
"70–100 mmHg"
],
[
"<b>CPP &gt; 150</b>",
"Cerebral edema"
],
[
"<b>CPP &lt; 50</b>",
"Ischemia"
],
[
"<b>CPP &lt; 30</b>",
"Irreversible ischemia (necrosis)"
],
[
"<b>CPP = 0</b>",
"Brain death (ICP = MAP)"
]
]
}
},
{
"h": "3.15  Calculate: MAP 80, ICP 25. What is the CPP? Is it normal?"
},
{
"p": "80 − 25 = 55. Low (normal 70–100) — heading toward ischemia."
},
{
"h": "3.16  List interventions to decrease ICP and to manipulate MAP:"
},
{
"table": {
"head": [
"Decrease ICP",
"Manipulate MAP"
],
"rows": [
[
"<b>Mannitol (osmotic diuretic — needs good kidneys)</b>",
"BP low → vasopressors"
],
[
"<b>Decadron (steroid)</b>",
"BP low → blood transfusion"
],
[
"<b>Avoid Valsalva — stool softener, loose restraints</b>",
"BP high → nicardipine (CCB)"
],
[
"<b>HOB up if MAP good; hyperventilation</b>",
""
],
[
"<b>Induced coma (propofol); temperature control</b>",
""
]
]
}
},
{
"h": "3.17  Why is the patient hyperventilated? Why is HOB raised only if MAP is good?"
},
{
"p": "Hyperventilation → respiratory alkalosis → vasoconstriction (CO₂ is a vasodilator) → ↓ ICP. Raising the HOB lowers ICP but also lowers cerebral perfusion if MAP is already low."
},
{
"h": "3.18  Hydrocephalus — list priority assessments, diagnostics, post-shunt care and teaching:"
},
{
"table": {
"head": [
"",
"Answer"
],
"rows": [
[
"<b>Assessment</b>",
"Neuro checks, head circumference, bulging fontanel, pupils, LOC"
],
[
"<b>Diagnostics</b>",
"Ultrasound (ventricle size); CT in an emergency"
],
[
"<b>Post-shunt care</b>",
"HOB 15–30°, head circumference, neuro/pupil checks, seizure watch, dressing, feed as tolerated, prophylactic IV antibiotics"
],
[
"<b>Teaching</b>",
"Signs of IICP, no contact sports, protect from infection"
]
]
}
},
{
"h": "3.19  What three things are absent in brain death? Describe the caloric test and the doll's eye test."
},
{
"p": "No consciousness, no reflexes, no respirations. Caloric test: ice water against the eardrum — no eye response. Doll's eye: turn the head — eyes stay fixed (normal = eyes move)."
},
{
"h": "3.20  Why is an organ donor a \"very busy\" patient?"
},
{
"p": "The heart keeps beating and perfusing organs until oxygen runs out — every organ must be checked and supported."
}
]

{
"h": "<span style=\"font-size:1.05em\">4. Burns &amp; Smoke Inhalation</span>"
},
{
"h": "4.1  Complete the burn depth chart:"
},
{
"table": {
"head": [
"Depth",
"Appearance",
"Pain / sensation",
"Healing / treatment"
],
"rows": [
[
"<b>1st (superficial)</b>",
"Sunburn",
"Painful",
"Heals on its own"
],
[
"<b>2nd (partial thickness)</b>",
"Blisters, scalds",
"MOST painful — nerve endings exposed",
"Wound care"
],
[
"<b>3rd (full thickness)</b>",
"Red or waxy white, thick",
"Decreased",
"Weeks–months; eschar removal + grafting; contractures"
],
[
"<b>Deep full-thickness</b>",
"Black, hard inelastic eschar; fascia/muscle/bone",
"None — nerves destroyed",
"Months; grafts required"
]
]
}
},
{
"h": "4.2  A patient with a black, leathery burn says it doesn't hurt. Is this a good sign? Why?"
},
{
"p": "No. No pain means the nerve endings are destroyed — a deep full-thickness burn, the most serious type."
},
{
"h": "4.3  List five priority assessments for a burn patient:"
},
{
"list": [
"VS / ABCs; ABGs",
"Depth, extent, location",
"Urine output, HR, BP, MAP &gt; 60",
"Frequent temps (hypothermia, infection)",
"Pulse checks — compartment syndrome"
]
},
{
"h": "4.4  Complete the care-by-type chart:"
},
{
"table": {
"head": [
"Burn type",
"Priority care"
],
"rows": [
[
"<b>Chemical</b>",
"Remove the agent, flush with water, then treat as thermal"
],
[
"<b>Thermal</b>",
"Silver sulfadiazine (sterile application), dry sterile dressing, debridement, temperature control"
],
[
"<b>Electrical</b>",
"Cardiac monitoring, entry + exit wounds, electrolytes (K⁺), IV fluids for rhabdo, UOP, compartment syndrome"
]
]
}
},
{
"h": "4.5  Why is an electrical burn more dangerous than it looks? What is the priority?"
},
{
"p": "Current travels through the heart and muscle — small skin wound, big internal damage. Priority = continuous cardiac monitoring."
},
{
"h": "4.6  Why are burn patients at risk for hyperkalemia?"
},
{
"p": "Destroyed cells release potassium into the blood → dysrhythmias."
},
{
"h": "4.7  Burn location — what is the risk for each?"
},
{
"table": {
"head": [
"Location",
"Risk"
],
"rows": [
[
"<b>Head, neck, chest</b>",
"Pulmonary complications"
],
[
"<b>Face</b>",
"Corneal abrasion"
],
[
"<b>Ears</b>",
"Auricular chondritis"
],
[
"<b>Hands and joints</b>",
"Disability — aggressive therapy"
],
[
"<b>Perineum</b>",
"Contamination from urine/feces"
],
[
"<b>Circumferential limb</b>",
"Compartment syndrome"
],
[
"<b>Circumferential thorax</b>",
"Impaired chest expansion and ventilation"
]
]
}
},
{
"h": "4.8  When is a tetanus shot given? Is it needed for smoke inhalation alone?"
},
{
"p": "Any break in the skin (burns, bites, wounds) if none in 10 years. Not needed for smoke inhalation alone."
},
{
"h": "4.9  Smoke inhalation — fill in:"
},
{
"list": [
"<b>Signs of airway injury:</b>",
"<b>Carbon monoxide antidote:</b>",
"<b>Cyanide antidote (and its expected side effect):</b>",
"<b>When should the patient be intubated?</b>",
"<b>How long should they be observed?</b>"
]
},
{
"p": "<b>Airway injury:</b> facial burns, soot in sputum, hoarseness, stridor, wheezing"
},
{
"p": "<b>CO:</b> 100% oxygen via non-rebreather"
},
{
"p": "<b>Cyanide:</b> hydroxocobalamin — turns urine, skin, eyes RED"
},
{
"p": "<b>Intubate:</b> early rather than late — especially with stridor"
},
{
"p": "<b>Observe:</b> 12–24 hours for delayed airway injury"
},
{
"h": "4.10  List four burn teaching points:"
},
{
"list": [
"Burns alter fluid balance",
"May need debridement and skin grafting",
"Nutrition and hydration for healing",
"Signs of infection: pain, pus, foul odor, spreading redness"
]
},
{
"h": "<span style=\"font-size:1.05em\">5. Environmental Emergencies</span>"
},
{
"h": "5.1  Fill in the rule: Hypothermia → warm ________. Hyperthermia → cool ________."
},
{
"p": "Hypothermia → warm SLOWLY. Hyperthermia → cool QUICKLY."
},
{
"h": "5.2  List five interventions for hypothermia:"
},
{
"list": [
"Remove wet clothing",
"Warm blankets",
"Warm IV fluids and warm O₂",
"Cardiac monitoring",
"Check glucose and electrolytes; assess for frostbite"
]
},
{
"h": "5.3  What two things should you NOT do for a hypothermic patient?"
},
{
"list": [
"Don't massage extremities",
"Don't give atropine for the bradycardia"
]
},
{
"h": "5.4  Frostbite — answer each:"
},
{
"list": [
"<b>Signs (superficial vs. deep):</b>",
"<b>How is it rewarmed?</b>",
"<b>What should be given before rewarming? Why?</b>",
"<b>List three \"don'ts\":</b>"
]
},
{
"p": "<b>Signs:</b> superficial: white/waxy, numb, tingling; deep: hard, gray/mottled, no sensation, blisters after rewarming, black = gangrene"
},
{
"p": "<b>Rewarm:</b> rapidly in warm water (~98.6–102°F) until pink and soft — treat hypothermia first"
},
{
"p": "<b>Before:</b> pain medication — rewarming is very painful"
},
{
"p": "<b>Don'ts:</b> don't rub/massage, no dry heat, don't walk on it, don't rewarm if it could refreeze"
},
{
"h": "5.5  Heat exhaustion vs. heat stroke:"
},
{
"table": {
"head": [
"Heat exhaustion (early)",
"Heat stroke (late)"
],
"rows": [
[
"<b>Heavy sweating</b>",
"Core temp &gt; 104°F, NO sweating"
],
[
"<b>Muscle cramps</b>",
"Seizures, delirium, ataxia"
],
[
"<b>N/V, headache, dizziness, weakness</b>",
"Hypotension, arrhythmias, tachypnea"
],
[
"<b>Tachycardia</b>",
"Oliguria, rhabdomyolysis"
]
]
}
},
{
"h": "5.6  List the cooling measures for heat stroke. Why are antipyretics not used?"
},
{
"p": "Remove clothes; ice packs to groin, neck, armpits; ice bath; evaporative cooling. Plus airway, high-flow O₂, IV fluids, ECG, treat seizures. Antipyretics are ineffective — the hypothalamus set point isn't the problem."
},
{
"h": "5.7  Near drowning — list the signs, five interventions, and the key discharge teaching:"
},
{
"list": [
"<b>Signs:</b>",
"<b>Interventions:</b>",
"<b>Discharge teaching:</b>"
]
},
{
"p": "<b>Signs:</b> coughing, chest pain, dyspnea, cyanosis, crackles, tachy/brady"
},
{
"p": "<b>Interventions:</b> patent airway, 100% O₂, albuterol, high Fowler's, NT suction, remove wet clothes + warm, IV fluids"
},
{
"p": "<b>Teaching:</b> water safety; pulmonary edema up to 24 h later — return for cough, chest pain, dyspnea"
}
]
},
{
"id": "skynotes-wb-tox-acls",
"title": "Sky's Workbook — Bites, Poisoning &amp; ACLS",
"kicker": "Bites, Poisoning &amp; Overdose, Cardiac Arrest (ACLS)",
"blocks": [
{
"h": "<span style=\"font-size:1.05em\">6. Bites, Poisoning &amp; Overdose</span>"
},
{
"h": "6.1  Animal bites — what is the first wound care? What is the rabies vaccine schedule?"
},
{
"p": "Rinse, rinse, rinse the wound; tetanus. Rabies vaccine days 0, 3, 7, 14."
},
{
"h": "6.2  Snake bites — list the signs, the treatment, and two things you must NOT do:"
},
{
"list": [
"<b>Signs:</b>",
"<b>Treatment:</b>",
"<b>Do NOT:</b>"
]
},
{
"p": "<b>Signs:</b> swelling, SOB, intense pain, metallic/rubbery taste, numbness/tingling"
},
{
"p": "<b>Treatment:</b> antivenin within 4–6 h, IV fluids, morphine, EKG, coag labs, watch compartment syndrome, wound care"
},
{
"p": "<b>Do NOT:</b> use a tourniquet/anything constricting, or elevate — keep limb below the heart"
},
{
"h": "6.3  What reaction should you watch for with antivenin? Why?"
},
{
"p": "Allergic reaction — antivenin is made from horses."
},
{
"h": "6.4  Spider bites — list the signs and interventions:"
},
{
"p": "May be unnoticed; hours later redness, swelling, nausea, necrosis, ulcer. Soap and water, cool compress, elevate, pain meds, antihistamines, possible antibiotics/antivenom, surgery for necrosis."

},
{
"p": "Long-term users can go into lethal rhythms with sudden withdrawal; abrupt benzo withdrawal can cause lethal seizures."
},
{
"h": "6.7  List the nursing care and discharge teaching for an overdose patient:"
},
{
"p": "Monitor RR and HR, antiemetic, raise HOB, safety, telemetry. Discharge: social worker, education on drug dangers, how to give naloxone at home."

},

},

"Monitor VS, LOC, labs"

"h": "6.11  When is activated charcoal NOT given?"
},
{
"p": "Caustics (acids/alkalis), hydrocarbons, alcohol, iron, lithium, or an unprotected airway."
