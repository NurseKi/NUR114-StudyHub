const EM_BASICS = { title:"Emergency Basics", sub:"Airway, breathing, and circulation — the priority frame for every exemplar.", lessons:[
{ id:"em-abc", title:"The Basics: Airway, Breathing &amp; Circulation", kicker:"Every emergency starts with the ABCs",
  blocks:[
   {p:"Every medical emergency in this module is prioritized the same way: <strong>airway, breathing, circulation</strong>. The three feed each other — an airway that closes stops breathing, poor breathing starves the heart and brain of oxygen, and a failing circulation can't deliver the oxygen that breathing brings in."},
   {h:"Circulation"},
   {p:"Circulation depends on three things working together:"},
   {list:[
    "<strong>Volume</strong> — enough blood/fluid in the tank (lost in hemorrhage, burns, dehydration)",
    "<strong>Vessel diameter</strong> — vessels tight enough to hold pressure (lost when vessels dilate, as in anaphylaxis)",
    "<strong>Perfusion</strong> — a pump strong enough to move the blood to the tissues"]},
   {hook:"<strong>Low BP → lay the client flat</strong> (legs elevated if ordered) so blood returns to the heart and brain. <strong>High BP → sit the client up</strong> so blood pools in the legs and the pressure comes down. Exception: a client with <strong>IICP</strong> stays at HOB 30–45° with the head midline."},
   {table:{head:["Priority nursing diagnosis","When it fits"],rows:[
    ["<strong>Fluid volume deficit</strong>","Volume is lost or shifted out of the vessels — hemorrhage, hypovolemic shock, burns, heat exhaustion"],
    ["<strong>Decreased cardiac output</strong>","The pump or rhythm fails — lethal dysrhythmias, cardiac arrest, severe hypothermia"]
   ]}},
   {h:"Airway &amp; breathing"},
   {table:{head:["Priority nursing diagnosis","When it fits"],rows:[
    ["<strong>Impaired airway clearance</strong>","Something blocks the airway — swelling (anaphylaxis, smoke inhalation), secretions, the tongue in an unconscious client"],
    ["<strong>Impaired breathing pattern</strong>","The drive or mechanics to breathe fail — opioid/benzodiazepine overdose, IICP pressing on the brainstem"],
    ["<strong>Impaired gas exchange</strong>","Air moves but oxygen doesn't cross into the blood — carbon monoxide, aspirated water after submersion, pulmonary edema"]
   ]}},
   {p:"An endotracheal tube secures a threatened airway: the tube passes through the vocal cords into the trachea, and an inflated cuff seals it so air goes to the lungs instead of the esophagus."},
   {h:"Using the frame on each exemplar"},
   {p:"For every exemplar, ask: <strong>which of these diagnoses is the highest priority for this client right now?</strong>"},
   {table:{head:["Exemplar","Usual top priority","Why"],rows:[
    ["Increased intracranial pressure","Impaired breathing pattern","Brainstem pressure depresses the respiratory drive; a falling LOC also threatens the airway"],
    ["Burns with smoke inhalation","Impaired airway clearance","Airway swelling can close the airway within hours"],
    ["Large burns without inhalation injury","Fluid volume deficit","Massive fluid shifts out of the vessels"],
    ["Opioid / benzodiazepine overdose","Impaired breathing pattern","Respiratory depression"],
    ["Hypovolemic shock","Fluid volume deficit","Lost circulating volume"],
    ["Submersion injury","Impaired gas exchange","Water in the alveoli blocks oxygen exchange"],
    ["Anaphylaxis","Impaired airway clearance","Laryngeal and airway swelling, bronchospasm"]
   ]}},
   {hook:"<strong>A before B before C.</strong> If a client has both a fluid problem and an airway problem, the airway wins — a full tank does no good if no oxygen gets in."}
  ],
  check:{stem:"A client arrives with partial-thickness burns to the face and chest after a house fire. The client is hoarse and has soot around the nose. Which nursing diagnosis is the highest priority?", options:["Fluid volume deficit","Impaired airway clearance","Acute pain","Risk for infection"], answer:1, why:"Hoarseness and soot point to smoke inhalation, which can swell and close the airway. Airway comes before circulation (fluid volume), pain, and infection."}
},
{ id:"em-survey", title:"Primary &amp; Secondary Survey, Intubation &amp; ETCO₂", kicker:"ABCDE, then FGHI",
  blocks:[
   {p:"The <strong>primary survey</strong> finds and treats life threats in the first minutes. If a threat is found at any letter, fix it before moving on. The <strong>secondary survey</strong> comes after life threats are stabilized."},
   {h:"Primary survey — ABCDE"},
   {table:{head:["Step","Priority actions"],rows:[
    ["<strong>A</strong> — Airway &amp; C-spine","Check patency (tongue, blood, vomit); stabilize the cervical spine; <strong>jaw thrust</strong> to open the airway without moving the neck"],
    ["<strong>B</strong> — Breathing","Chest rise, rate, lung sounds; 100% O₂ by nonrebreather or bag-valve mask; find immediate killers such as a tension pneumothorax"],
    ["<strong>C</strong> — Circulation","Control hemorrhage (direct pressure, tourniquet); <strong>two large-bore (18-gauge) IVs</strong>; MAP 60 or higher = stable, below 60 = unstable"],
    ["<strong>D</strong> — Disability","Neuro status: AVPU and GCS, pupils, gross motor and sensation (wiggle toes, squeeze hands)"],
    ["<strong>E</strong> — Exposure","Undress fully to find hidden injuries; then <strong>prevent hypothermia</strong> (warm blankets, warm fluids)"]
   ]}},
   {h:"Secondary survey — FGHI"},
   {table:{head:["Step","Actions"],rows:[
    ["<strong>F</strong> — Full set of vital signs, focused adjuncts, family presence","Complete vitals including core temperature; adjuncts such as an NG tube, Foley, labs; support family presence during resuscitation"],
    ["<strong>G</strong> — Give comfort measures","Pain and anxiety relief — give analgesics (morphine, fentanyl) <strong>IV</strong>, not IM, when perfusion is poor"],
    ["<strong>H</strong> — History and head-to-toe","SAMPLE history (Symptoms, Allergies, Medications, Past history, Last meal, Events) and a head-to-toe assessment for hidden injuries"],
    ["<strong>I</strong> — Inspect posterior surfaces","Log-roll with in-line C-spine stabilization; check the back for wounds, burns, and entry/exit sites"]
   ]}},
   {h:"Escalating oxygen support"},
   {p:"High-flow nasal cannula, CPAP, and BiPAP help only if the client can <strong>inhale on their own</strong>. If not — or if GCS is 8 or below — the next step is intubation with an endotracheal tube."},
   {h:"The nurse's role in intubation"},
   {table:{head:["Before","After"],rows:[
    ["Continuous monitoring: telemetry, SpO₂, automatic BP","Suction"],
    ["Suction and crash cart at the bedside","Ventilator settings and alarms"],
    ["Bag-valve mask plugged into <strong>oxygen (not air)</strong>, turned all the way up","<strong>Secure the tube!</strong>"],
    ["Call respiratory therapy (ventilator) and anesthesia (brings its own drugs)","Chart the tube depth number <strong>at the lip</strong>"],
    ["Quick report and handoff","Sedation and pain control"],
    ["<strong>Pull the headboard off and pull the bed out</strong> from the wall","Oral care every 2 hours"],
    ["","Confirm placement: <strong>end-tidal CO₂ (gold standard)</strong>, bilateral breath sounds, symmetrical chest expansion, chest X-ray"]
   ]}},
   {h:"End-tidal CO₂ (ETCO₂)"},
   {table:{head:["Reading","Meaning"],rows:[
    ["35–45 mm Hg","Normal"],
    ["Below 10 mm Hg during CPR","Poor-quality compressions — push harder and faster"],
    ["Sudden jump to 35–45 during a code","Return of spontaneous circulation (ROSC)"]
   ]}},
   {hook:"After intubation, <strong>ETCO₂ confirms the tube is in the trachea</strong>; the chest X-ray confirms how deep it sits."}
  ],
  check:{stem:"A client was just intubated. Which finding best confirms the tube is in the trachea?", options:["The client's SpO₂ is 94%","A waveform end-tidal CO₂ reading of 38 mm Hg","The tube is taped at 22 cm","The client is no longer coughing"], answer:1, why:"End-tidal CO₂ is the gold standard for confirming tracheal placement — CO₂ is exhaled only from the lungs. Tube depth at the lip is documented, and a chest X-ray confirms depth."}
}
]};

const IICP_UNIT = { title:"Increased Intracranial Pressure", sub:"The closed box, the neuro assessment, IICP signs and complications, ICP monitoring and CPP, and brain death.", lessons:[
{ id:"iicp-mk", title:"Monro-Kellie &amp; Compensation", kicker:"The skull is a closed box",
  blocks:[
   {h:"The Monro-Kellie hypothesis"},
   {list:[
    "The skull is a <strong>CLOSED BOX</strong>.",
    "It <strong>CANNOT EXPAND</strong> to accommodate changes in volume.",
    "Three things share the space: <strong>brain tissue 80%</strong>, <strong>CSF 10%</strong>, <strong>blood 10%</strong>."]},
   {p:"If one of the three grows — a swollen brain, a bleed, a tumor, extra CSF — something else has to leave, or the pressure inside the box rises. That rise is <strong>increased intracranial pressure (IICP)</strong>."},
   {h:"Cerebral edema"},
   {p:"Swelling of the brain tissue itself is one of the most common reasons the box overfills. On a CT scan, an edematous brain looks crowded: the folds (sulci) are squeezed, and the <strong>lateral horns</strong> of the ventricles — the holders of CSF — are squished or gone. Missing lateral horns are a definitive cue for cerebral edema."},
   {h:"Compensatory mechanisms"},
   {table:{head:["Mechanism","How it makes room"],rows:[
    ["<strong>Autoregulation</strong>","Arterioles of the brain adjust their diameter to keep blood flow steady"],
    ["<strong>CSF production or reabsorption</strong>","The brain makes less CSF or reabsorbs more"],
    ["<strong>Shunting</strong>","CSF is pushed down into the spinal canal; blood is pushed out into the venous system"]
   ]}},
   {p:"These mechanisms buy time, but they are limited. Once they are used up, even a small added volume causes a <strong>sharp</strong> rise in pressure — and the client deteriorates quickly."},
   {p:"<strong>The exception: babies.</strong> An infant's skull sutures are still open, so the box can expand (see Hydrocephaly)."},
   {img:FIGS.monrokellie, caption:"Monro-Kellie: brain, CSF, and blood share a box that can't stretch"},
   {hook:"<strong>80 / 10 / 10 in a box that can't stretch.</strong> Brain, CSF, blood — if one goes up, another must come down, or the pressure climbs."}
  ],
  check:{stem:"Which statement best explains why a small brain bleed can cause a rapid rise in intracranial pressure once compensation is exhausted?", options:["The skull expands slowly and cannot keep up","The skull is a closed box that cannot expand, so added volume raises pressure","CSF production increases to dilute the blood","Brain tissue makes up only 10% of the intracranial volume"], answer:1, why:"Per the Monro-Kellie hypothesis the skull cannot expand. Once shunting CSF and blood is used up, added volume has nowhere to go. Brain tissue is 80% of the volume, not 10%."}
},
{ id:"iicp-assess", title:"Neuro Assessment: Cranial Nerves, LOC &amp; Posturing", kicker:"The tools for catching IICP early",
  blocks:[
   {h:"Cranial nerves"},
   {p:"Mnemonic: <strong>\"Oh Oh Oh To Take A Family Vacation, Go Vagus After Hours.\"</strong>"},
   {table:{head:["Cranial nerve","Quick assessment","How to test"],rows:[
    ["I — Olfactory","Smell","Alcohol swab under the nose"],
    ["II — Optic","Visual acuity","Snellen chart; read a name badge"],
    ["III — Oculomotor","PERRLA; up/down eye movement","Pupils; cardinal fields of gaze"],
    ["IV — Trochlear","Inferomedial (down and in) eye movement","Cardinal fields of gaze"],
    ["V — Trigeminal","Sense of touch on the face; clench the jaw","Touch the face; clench the jaw"],
    ["VI — Abducens","Lateral eye movement","Cardinal fields of gaze"],
    ["VII — Facial","Facial expressions; tearing","Make \"funny faces\" — smile, frown"],
    ["VIII — Acoustic (vestibulocochlear)","Hearing; equilibrium","Whisper test"],
    ["IX — Glossopharyngeal","Say \"ahh\" — uvula rises midline","Say \"ahh\""],
    ["X — Vagus","Gag reflex","Gag reflex (tested with IX)"],
    ["XI — Spinal accessory","Raise the shoulders","Shoulder shrug against resistance"],
    ["XII — Hypoglossal","Tongue protrudes midline","Stick out the tongue"]
   ]}},
   {list:[
    "<strong>III, IV, and VI</strong> are tested together with the six cardinal fields of gaze.",
    "<strong>V, VII, IX, XI, and XII</strong> can be checked together during a functional moment such as oral care or a meal.",
    "<strong>Corneal (blink) reflex:</strong> CN V is the sensory trigger (feeling the touch) and CN VII is the motor action (closing the lid). No blink means either the client didn't feel it (V) or can't move the eyelid (VII)."]},
   {hook:"CN III controls the pupil. A pupil that dilates on one side is often the first eye sign of IICP, because swelling presses on CN III."},
   {h:"Level of consciousness — the stimulus ladder"},
   {p:"Describe the client as <strong>alert</strong>, <strong>lethargic</strong>, or <strong>unresponsive</strong>. When the client doesn't respond, escalate the stimulus from least to most intense, and stop at the first one that gets a response:"},
   {table:{head:["Step","Category","Nursing action","Responds here → LOC"],rows:[
    ["1","Verbal","State the client's name in a normal voice — drop your pitch for older adults, who hear low voices better","<strong>Alert</strong>"],
    ["2","Tactile","Touch the arm","<strong>Lethargic</strong>"],
    ["3","Tactile","Lightly pat the arm","<strong>Lethargic</strong>"],
    ["4","Tactile","Shake the arm","<strong>Lethargic</strong>"],
    ["5","Pain","Pinch (trapezius or triceps)","<strong>Lethargic</strong> — responds only to pain"],
    ["6 &amp; 7<br><em>together</em>","Pain","Nailbed pressure and sternal rub — watch for a grimace or posturing","<strong>Lethargic</strong> — responds only to pain"],
    ["8, 9 &amp; 10<br><em>together</em>","Reflex","Gag reflex; brush the cornea with sterile gauze (corneal reflex); tap the forehead — the eyes should blink to protect","<strong>Unresponsive</strong> — no response to voice, touch, or pain; only reflexes are left to test"]
   ]}},
   {p:"Steps 6 and 7 are done together, and steps 8, 9, and 10 are done together. Steps 8–10 test <strong>brainstem reflexes</strong> in a client who does not respond to verbal, tactile, or painful stimuli."},
   {table:{head:["AVPU (rapid check)","Meaning"],rows:[
    ["<strong>A</strong>lert","Awake and oriented"],
    ["<strong>V</strong>erbal","Responds only when spoken to"],
    ["<strong>P</strong>ain","Responds only to a painful stimulus (sternal rub, nailbed pressure)"],
    ["<strong>U</strong>nresponsive","No response to any stimulus"]]}},
   {h:"Glasgow Coma Scale (GCS)"},
   {table:{head:["Category","Best response","Points"],rows:[
    ["Eye opening","Spontaneous · to sound · to pressure · none","4 · 3 · 2 · 1"],
    ["Verbal","Oriented · confused · words (inappropriate) · sounds (incomprehensible) · none","5 · 4 · 3 · 2 · 1"],
    ["Motor","Obeys commands · localizes · withdraws · flexion (decorticate) · extension (decerebrate) · none","6 · 5 · 4 · 3 · 2 · 1"]
   ]}},
   {list:[
    "Total ranges from <strong>3</strong> (deep coma) to <strong>15</strong> (fully alert and responsive).",
    "A score of <strong>8 or below</strong> = coma; the client can't protect the airway — <strong>\"less than 8, intubate.\"</strong>",
    "A <strong>drop of 2 points or more</strong> is a significant decline — report it."]},
   {h:"Posturing"},
   {table:{head:["Posture","What it looks like","Level of damage"],rows:[
    ["<strong>Decorticate</strong>","Arms flexed in toward the chest (\"to the core\"), wrists and fingers flexed, legs extended, feet plantar flexed","Above the midbrain"],
    ["<strong>Decerebrate</strong>","Arms extended and twisted out by the client's sides (internally rotated), wrists flexed, legs extended, feet plantar flexed","Midbrain — <strong>worse</strong> than decorticate"],
    ["Upper extremities extended, lower extremities flexed","Mixed posture","Pons"],
    ["Flaccid","Little or no motor response","Medulla — the worst sign"]
   ]}},
   {img:FIGS.posturing, caption:"Decorticate vs. decerebrate posturing — tap to enlarge"},
   {hook:"Decorticate = arms to the <strong>core</strong> — the \"mummy pose.\" Decerebrate = arms twisting out by the sides — a deeper, more serious level."},
   {h:"Disorders of consciousness"},
   {table:{head:["Term","Meaning"],rows:[
    ["Coma","Unarousable; may show posturing (decorticate or decerebrate)"],
    ["Persistent vegetative state","An <strong>unresponsive</strong> person — sleep–wake cycles and eyes may open, but no awareness. <em>Terri Schiavo:</em> at autopsy her brain weighed half of normal and she was blind; her \"tracking\" movements were brainstem reflexes, not awareness."],
    ["Locked-in syndrome","A <strong>paralyzed</strong> person with the \"lights on\" — fully aware, but can move only the eyes. <em>Jean-Dominique Bauby</em> wrote <em>The Diving Bell and the Butterfly</em> by blinking his left eye — the diving bell is the paralysis, the butterfly is his mind."]
   ]}},
  ],
  check:{stem:"A client with a head injury opens the eyes only to pain, makes incomprehensible sounds, and withdraws from pain. What is the GCS score?", options:["6","8","10","12"], answer:1, why:"Eyes to pain = 2, incomprehensible sounds = 2, withdraws = 4. Total = 8, which means coma: the client can't protect the airway."}
},
{ id:"iicp-signs", title:"IICP Signs, Cushing's Triad &amp; Complications", kicker:"Change in LOC comes first",
  blocks:[
   {h:"Signs and symptoms of IICP"},
   {list:[
    "<strong>CHANGE IN LOC</strong> — the earliest and most important sign (restlessness, confusion, lethargy)",
    "<strong>Pupillary changes</strong> — early: <strong>unilateral</strong> (one pupil dilates, sluggish); late: <strong>fixed and dilated</strong> (bilateral)",
    "Reflex impairment",
    "Seizures",
    "<strong>Projectile vomiting without nausea</strong> — a hallmark <strong>LATE</strong> sign of IICP"]},
   {p:"Assess the pupils <strong>every hour</strong>. A fixed, dilated pupil is called \"blown\" — pressure on CN III."},
   {h:"Case: Luke Kwon"},
   {p:"A golfer hit his head on a steel bridge railing while riding in a golf cart. He never lost consciousness, played seven more holes he can't remember, and drove about 40 minutes to his hotel with a worsening headache and sleepiness. Hours later he vomited repeatedly outside the ER, gave a nonsense answer to an orientation question, then seized and slipped in and out of a coma. That period of seeming \"fine\" is the <strong>lucid interval</strong> — pressure keeps building until it overwhelms compensation. His injury was an <strong>epidural hemorrhage</strong> — an arterial bleed, the classic cause of a lucid interval. (Full case in Worksheets.)"},
   {h:"Effects on motor movement"},
   {p:"As pressure moves down the brainstem, motor responses worsen: decorticate (above the midbrain) → decerebrate (midbrain) → arms extended with legs flexed (pons) → flaccid (medulla, the vital center). Pressure on the <strong>pons</strong> changes the breathing pattern; pressure on the <strong>medulla</strong> produces Cushing's triad and the need for a ventilator."},
   {h:"Effects on the respiratory pattern"},
   {table:{head:["Pattern","Level of the brain"],rows:[
    ["<strong>Cheyne-Stokes</strong> — the \"roller coaster\": fast and deep, slowing to a stop (apnea), then ramping back up","Cortex or upper brainstem"],
    ["<strong>Central neurogenic hyperventilation</strong> — rapid, deep, sustained","Midbrain or upper pons"],
    ["<strong>Cluster or ataxic</strong> — irregular, unpredictable","Pons or medulla"],
    ["<strong>Bradypnea</strong>","Overall CNS depression"]
   ]}},
   {h:"Effects on vital signs"},
   {p:"<strong>Cushing's triad</strong> — a <strong>late</strong> sign from pressure on the medulla:"},
   {list:[
    "<strong>Hypertension</strong> with a <strong>widened pulse pressure</strong> (systolic up, diastolic down)",
    "<strong>Bradycardia</strong>",
    "<strong>Bradypnea</strong> (irregular)"]},
   {table:{head:["Temperature","Meaning"],rows:[
    ["<strong>Central fever (neuro storm)</strong>","Pressure on the hypothalamus disrupts temperature control — acetaminophen won't help; use external cooling and ice"],
    ["<strong>Peripheral fever</strong>","From infection — treat the cause"]
   ]}},
   {p:"Either kind of fever raises the brain's oxygen demand."},
   {hook:"Cushing's triad is the brain fighting to push blood in against rising pressure: BP up and pulse pressure wide, heart rate down, breathing slow. It is a <strong>late</strong> sign — herniation may be close."},
   {h:"Stages of IICP"},
   {table:{head:["Stage","Mental status","Pupils","Breathing","Vital signs"],rows:[
    ["1 — Compensation","Awake and alert","Equal and reactive","Normal","Normal"],
    ["2 — Compensation","Episodes of confusion, restlessness, lethargy","Equal and reactive","Normal","Normal"],
    ["3 — Beginning decompensation","Can't stay awake → progressively deeper coma","Small and reactive → sluggish → <strong>one side dilates and fixes</strong>","May slow → Cheyne-Stokes → central neurogenic hyperventilation","Systolic BP rises, <strong>pulse pressure widens</strong>, pulse slows and is full and bounding"],
    ["4 — Decompensation (herniation)","Deep coma","<strong>Both dilated and fixed</strong>","Apneustic or ataxic","BP falls; pulse becomes irregular → death"]
   ]}},
   {p:"Intervention works best in stages 1–2, is urgently needed in stage 3, and is usually futile in stage 4."},
   {h:"Complications"},
   {table:{head:["Complication","What happens","Key findings"],rows:[
    ["<strong>Diabetes insipidus (DI)</strong>","The body stops producing ADH","A LOT of dilute urine, excessive thirst, dehydration, high serum sodium. <strong>Action:</strong> give fluids; administer vasopressin"],

  check:{stem:"A client with a closed head injury was oriented an hour ago and is now restless and confused. Pupils are equal and reactive. Vital signs are unchanged. What is the nurse's best action?", options:["Document the finding and reassess in 4 hours","Report the change in LOC to the provider promptly","Give the prescribed PRN sedative for restlessness","Wait for Cushing's triad before notifying the provider"], answer:1, why:"A change in LOC is the earliest and most important sign of IICP, so it is reported right away. Sedation would mask the neuro exam, and Cushing's triad is a late sign."}

{ id:"iicp-cpp", title:"ICP Monitoring, Cerebral Perfusion &amp; Management", kicker:"CPP = MAP − ICP",
  blocks:[
   {h:"Monitoring ICP"},
   {table:{head:["Device","Notes"],rows:[
    ["<strong>Ventriculostomy (external ventricular drain, EVD)</strong>","Surgeons drill through the skull and insert a catheter into a lateral ventricle — it measures ICP and can <strong>drain CSF</strong>. If the client can't get to the OR, the nurse clips the hair and brings the ventriculostomy cart."],

    ["Epidural monitor","Measures ICP; can't drain CSF"]

    "<strong>Drain too high</strong> → under-drains; CSF backs up and the pressure keeps building",

    "Strict sterile technique; watch for fever and other signs of infection"]},
   {table:{head:["CSF appearance","Meaning"],rows:[
    ["Clear, maybe a hint of yellow, sediment-free","Normal"],
    ["Bloody or pink (after the initial period)","Brain bleed"],
    ["Opaque / cloudy","Infection"]
   ]}},
   {img:FIGS.evd, caption:"Keep the drain level with the tragus — tap to enlarge"},
   {h:"Cerebral perfusion pressure"},
   {table:{head:["Value","Formula / normal"],rows:[
    ["Cerebral perfusion pressure (CPP)","<strong>CPP = MAP − ICP</strong>"],
    ["Normal ICP","<strong>0–15 mm Hg</strong> — over 20 = PROBLEM; sustained ICP above 20 needs immediate treatment (mannitol)"],
    ["Normal CPP","<strong>70–100 mm Hg</strong>"]
   ]}},
   {table:{head:["CPP","Result"],rows:[
    ["Above 150 mm Hg","Cerebral edema — excessive pressure, risk of further swelling"],
    ["Below 50 mm Hg","Ischemia — becomes irreversible if not fixed ASAP"],
    ["Below 30 mm Hg","Necrosis — irreversible tissue death"],
    ["0 (when ICP = MAP)","No blood flow to the brain — brain death"]
   ]}},
   {list:[
    "MAP of 60 is the absolute minimum for the body; neuro clients need a higher MAP to keep the CPP at 70–100.",
    "<strong>Avoid fast changes in blood pressure</strong> — autoregulation is already failing, and rapid swings can cause herniation.",
    "Normal central venous oxygen saturation (ScvO₂) is about <strong>70%</strong>; lower means the tissues are consuming more oxygen under stress."]},
   {img:FIGS.cpp, caption:"CPP zones — tap to enlarge"},
   {hook:"To raise CPP, either <strong>lower the ICP</strong> or <strong>raise the MAP</strong>."},
   {h:"Manipulating CPP"},
   {table:{head:["Decrease the ICP","Manipulate the MAP"],rows:[
    ["<strong>Diuretics</strong> — mannitol, an osmotic diuretic, pulls fluid from the brain into the vascular space (assumes the kidneys work)","<strong>Vasopressors</strong> — raise a low MAP"],
    ["<strong>Steroids</strong> — dexamethasone (Decadron) decreases inflammation when a tumor is the cause","<strong>Antihypertensives</strong> — <strong>nicardipine</strong> (calcium channel blocker), the #1 choice in neuro clients"],
    ["<strong>Avoid Valsalva</strong> — stool softener (Colace); avoid coughing (cough suppressant) and straining","<strong>Blood transfusion</strong> — only if needed"],
    ["<strong>HOB 30–45°</strong>, head <strong>midline</strong> — pillows or towel rolls keep the neck from twisting, which kinks the jugular vein and blocks drainage",""],
    ["<strong>Antiemetic</strong> — control nausea and vomiting",""],
    ["<strong>Hyperventilation</strong> — induces respiratory alkalosis: CO₂ is a natural vasodilator, so blowing it off constricts cerebral vessels and lowers ICP (brief use only; too much causes ischemia)",""],
    ["<strong>Induced coma</strong> — propofol lowers metabolic demand and protects the airway; its very short half-life lets the nurse turn it off for quick neuro checks",""],
    ["<strong>Temperature control</strong> — treat fever and prevent shivering; restraints only if necessary",""]
   ]}},
   {h:"Nursing care that protects ICP"},
   {list:[
    "<strong>Do not cluster care</strong> — unlike most clients, space out activities so the ICP can return to baseline between touches",

    "Monitor neuro status, I&amp;O, and serum sodium (DI and SIADH)"]}
  ],
  check:{stem:"A client's MAP is 80 mm Hg and ICP is 25 mm Hg. Which interpretation is correct?", options:["CPP is 105 mm Hg — hyperperfusion","CPP is 55 mm Hg — below normal; the brain is at risk for ischemia","CPP is 55 mm Hg — within normal limits","CPP is 3.2 mm Hg — brain death"], answer:1, why:"CPP = MAP − ICP = 80 − 25 = 55 mm Hg. Normal is 70–100, so perfusion is low and the brain is at risk; below 50 causes ischemia."}

{ id:"iicp-braindeath", title:"Brain Death &amp; Organ Donation", kicker:"No consciousness, no reflexes, no respirations",

   {hook:"Superficial = sunburn. Partial = <strong>blister, moist, ouch</strong>. Full = <strong>dry, discolored, no pain</strong> — a painless burn is the deep one, not the mild one."},
   {p:"Full-thickness burns are often surrounded by partial-thickness areas, so a client with a painless center may still have severe pain at the edges."},
   {h:"Scene safety and first steps"},
   {list:[
    "<strong>Stop the burning process</strong> — stop, drop, and roll; remove smoldering clothing and jewelry",
    "Chemical: remove all contaminated clothing immediately",
    "<strong>No ice</strong> on a burn — it constricts vessels and deepens the injury"]},
   {h:"Burn center referral"},
   {list:[
    "Partial-thickness burns over a large area of the body",
    "Any full-thickness burn, in any age group",
    "Burns of the <strong>face, hands, feet, genitalia, perineum, or major joints</strong>",
    "Electrical burns (including lightning), chemical burns, and inhalation injuries",
    "Burns in clients with pre-existing heart or kidney disease"]},
   {h:"Scope"},
   {p:"The rule of nines and body surface area methods, grafting, and long-term burn care are not covered in this module."}
  ],
  check:{stem:"A client's burn on the forearm is dry, leathery, and white, and the client says it doesn't hurt. How should the nurse classify this burn?", options:["Superficial","Partial thickness","Full thickness","Not a true burn"], answer:2, why:"Dry, discolored, painless skin is a full-thickness burn — the nerve endings are destroyed. Partial-thickness burns are blistered, moist, and painful."}
},
{ id:"burns-thermal", title:"The Emergent Phase: Airway, Fluids &amp; the Sludge", kicker:"The first 24 to 48 hours",
  blocks:[
   {h:"Primary survey for a burned client"},
   {table:{head:["Step","Burn-specific focus"],rows:[
    ["<strong>A</strong> — Airway","Protect the C-spine; <strong>humidified 100% O₂</strong> immediately. Facial or neck burns or soot in the mouth = airway edema risk; <strong>stridor = immediate intubation</strong>"],
    ["<strong>B</strong> — Breathing","Circumferential chest burns can keep the chest from expanding (escharotomy may be needed)"],
    ["<strong>C</strong> — Circulation","Watch for the tourniquet effect of tight burned skin — check pulses distal to the burn <strong>every hour</strong>"],
    ["<strong>D</strong> — Disability","Confusion often means hypoxia or carbon monoxide poisoning"],
    ["<strong>E</strong> — Exposure","Remove clothes and jewelry; thermoregulation is lost — heat lamps, warm blankets, warm IV fluids"]
   ]}},
   {h:"What happens in the emergent phase"},
   {table:{head:["Complication","Pathophysiology","Nursing action / cue"],rows:[
    ["<strong>Fluid shift</strong>","Capillary leak — fluid leaves the pipes and goes into the tissue","Edema and low blood pressure"],
    ["<strong>Burn shock</strong>","Massive fluid loss from the vascular space","Large-volume IV <strong>lactated Ringer's</strong>; titrate to keep <strong>SBP above 90</strong> and urine output on target"],
    ["<strong>Hyperkalemia</strong>","Cells \"explode\" and release potassium","Cardiac monitor — watch for <strong>peaked T waves</strong>; standard hyperkalemia treatment"],
    ["<strong>Myoglobin</strong>","Damaged muscle releases myoglobin → tea-colored urine that can clog the kidneys","Increase fluids to flush the kidneys"],
    ["<strong>Airway edema</strong>","Facial/neck burns, soot in the mouth","Stridor = immediate intubation"]
   ]}},
   {h:"Urine output targets"},
   {table:{head:["Burn","Target"],rows:[
    ["Thermal or chemical","<strong>30–50 mL/hr</strong> (at least 0.5 mL/kg/hr)"],
    ["Electrical (myoglobin risk)","<strong>75–100 mL/hr</strong>"]
   ]}},
   {h:"Emergent-phase labs — the \"sludge\""},
   {table:{head:["Lab","Why"],rows:[
    ["Hematocrit <strong>↑</strong>","Hemoconcentration — fluid left the pipes but the RBCs stayed behind"],
    ["Sodium <strong>↓</strong>","Sodium is trapped in the interstitial space with the leaked fluid"],
    ["Potassium <strong>↑</strong>","Cells pop and dump K⁺ into the blood"],
    ["BUN and creatinine <strong>↑</strong>","Prerenal kidney injury from poor blood flow"],
    ["Metabolic acidosis","Lost bicarbonate and lactic acid from poor perfusion"]
   ]}},
   {hook:"Emergent phase = <strong>sludge</strong>: Hct up, K⁺ up, Na⁺ down — fluid has left the vessels."},
   {h:"Other emergent-phase care"},
   {list:[
    "<strong>NPO</strong> — nausea and vomiting are common; position to prevent aspiration",
    "Pain: morphine or fentanyl <strong>IV only</strong> — IM and subcutaneous doses won't be absorbed without skin blood flow",
    "Hourly I&amp;O and vital signs"]}
  ],
  check:{stem:"Eight hours after a large partial-thickness burn, a client's urine output has been 15 mL/hr for the past 2 hours and BP is 86/50. What is the priority action?", options:["Decrease the IV rate to prevent overload","Notify the provider and anticipate an increase in the lactated Ringer's rate","Encourage oral fluids only","Document it as expected for the first day"], answer:1, why:"Urine output below 30 mL/hr and SBP below 90 signal inadequate fluid resuscitation during the leaking phase. The provider is notified so LR can be increased."}
},
{ id:"burns-acute", title:"The Acute Phase &amp; Burn Medications", kicker:"Diuresis, infection, eschar, and the topical drugs",
  blocks:[
   {h:"When the emergent phase ends"},
   {p:"<strong>Diuresis</strong> at about <strong>48–72 hours</strong> signals the emergent phase is ending: capillaries seal and fluid shifts back into the vascular space."},
   {h:"Side by side: emergent vs. acute phase"},
   {table:{head:["","Emergent phase","Acute phase"],rows:[
    ["Timing","First <strong>24–48 hours</strong>","From about <strong>48–72 hours</strong>, starting with diuresis, until the wounds close"],
    ["What's happening","Capillary leak — fluid leaves the vessels (third spacing)","Capillaries seal — fluid shifts back into the vessels"],
    ["Priority","<strong>Airway</strong> and <strong>fluid resuscitation</strong> (burn shock)","<strong>Infection control</strong> — the #1 cause of death in this phase"],
    ["Fluids","Large-volume <strong>lactated Ringer's</strong>; SBP above 90; urine 30–50 mL/hr (75–100 for electrical)","Fluids adjusted down to prevent <strong>fluid overload</strong>"],
    ["Hematocrit","<strong>↑</strong> (hemoconcentration)","<strong>↓</strong> (dilution as fluid returns)"],
    ["Potassium","<strong>↑</strong> (cells pop)","<strong>↓</strong> (lost in the diuresis)"],
    ["Sodium","<strong>↓</strong> (trapped with the leaked fluid)","<strong>↑</strong>"],
    ["Urine","Low output; tea-colored if myoglobin","<strong>Diuresis</strong> — large volumes"],
    ["Other threats","Airway edema, hyperkalemia, myoglobin clogging the kidneys","Compartment syndrome under eschar, Curling's ulcer, contractures"],
    ["Pain","Morphine or fentanyl <strong>IV only</strong>","Premedicate before wound care and debridement"],
    ["Nutrition","<strong>NPO</strong>","High calorie, high protein, high carbohydrate"]
   ]}},
   {p:"Once diuresis starts, fluids are adjusted to prevent <strong>fluid overload</strong>, and potassium is watched for a drop."},
   {h:"Infection"},
   {p:"<strong>Infection is the #1 cause of death in the acute phase.</strong> The skin barrier is gone — strict asepsis for all wound care."},
   {h:"Eschar as a tourniquet"},
   {p:"Taut, burned tissue doesn't stretch. A circumferential burn acts like a tourniquet as edema builds underneath — this is <strong>compartment syndrome</strong>."},
   {table:{head:["The 6 P's","Meaning"],rows:[
    ["<strong>Pain</strong>","Earliest and most reliable — intense, out of proportion to the injury, and <strong>unrelieved by opioids</strong> (the #1 cue)"],
    ["Paresthesia","Pins and needles, numbness — nerves becoming hypoxic"],
    ["Pallor","Pale or cyanotic limb; poor capillary refill"],
    ["Poikilothermia","Limb is cold, matching the room temperature"],
    ["Paralysis","Can't move the limb or digits — <strong>late</strong>"],
    ["Pulselessness","Weak or absent pulse — an ominous <strong>late</strong> sign"]
   ]}},
   {list:[
    "<strong>Escharotomy</strong> — cutting through the eschar to restore blood flow",
    "<strong>Fasciotomy</strong> — a deeper cut into the muscle fascia, if escharotomy doesn't restore pulses"]},
   {h:"Burn medications"},
   {table:{head:["Medication","Key points"],rows:[
    ["<strong>Silver sulfadiazine (Silvadene)</strong>","Topical antimicrobial cream. Check for a <strong>sulfa allergy</strong>; can cause <strong>leukopenia</strong>; apply with sterile technique; watch for sulfa crystals in the urine; not used on the face; can stain"],
    ["<strong>Mafenide acetate (Sulfamylon)</strong>","Alternative topical — <strong>penetrates thick eschar</strong> but <strong>stings</strong>; premedicate for pain"],
    ["<strong>Silver nitrate</strong>","Topical liquid antimicrobial — <strong>stains everything black</strong> (linens, skin, walls)"],
    ["<strong>Famotidine</strong> (H2 blocker) or a <strong>PPI</strong>","Prevents <strong>Curling's ulcer</strong> (stress ulcer)"],
    ["<strong>Tetanus toxoid</strong>","For any burn — a burn is an open, contaminated wound. Not required for smoke inhalation alone with no break in the skin"],
    ["<strong>Antibiotics</strong>","For infection"],
    ["<strong>Opioids</strong> (morphine, fentanyl)","IV for pain; premedicate before wound care and debridement"],
    ["<strong>Lactated Ringer's</strong>","Fluid resuscitation"]
   ]}},
   {h:"Nutrition"},
   {p:"Burned clients are <strong>hypermetabolic</strong> — they need high calories, high protein, and high carbohydrates (up to about 5,000 kcal/day) so the body doesn't break down its own muscle. Not meeting these needs delays healing and raises infection risk. The hypermetabolic state can last up to a year."},
   {h:"Psychosocial"},
   {list:[
    "High risk for anxiety and PTSD",
    "Body image: use therapeutic communication — no false reassurance about scarring",
    "Delirium from sleep deprivation and the ICU environment",
    "Splints and early physical therapy keep the skin from tightening into contractures"]}
  ],
  check:{stem:"A client with circumferential arm burns reports severe pain that is not relieved by IV morphine. What should the nurse suspect first?", options:["Opioid tolerance","Compartment syndrome","Wound infection","Expected burn pain"], answer:1, why:"Pain out of proportion and unrelieved by opioids is the earliest and #1 cue of compartment syndrome under a circumferential burn."}
},
{ id:"burns-special", title:"Chemical, Electrical &amp; Smoke Inhalation Injuries", kicker:"Same burn care — plus the special threats",
  blocks:[
   {h:"Chemical burns"},
   {table:{head:["Step","What to do"],rows:[
    ["1. Protect yourself","Gloves and PPE so the chemical doesn't burn you"],
    ["2. Remove the chemical","\"Strip and shower\": remove contaminated clothing. <strong>Powder:</strong> brush it off first, then wash. <strong>Liquid:</strong> irrigate immediately"],
    ["3. Neutralize the chemical","After irrigation, and only if the specific neutralizing agent is known and available"],
    ["4. Continue treatment as if a thermal burn","Same skin, circulation, and breathing care"]
   ]}},
   {p:"<strong>Chemical eye burns:</strong> continuous irrigation is the priority — use a Morgan lens if available."},
   {h:"Electrical burns — the iceberg effect"},
   {table:{head:["Immediate skin care","Cardiac monitoring"],rows:[
    ["Looks fine on the outside, but the inside is \"cooked\" — identify <strong>both entry and exit wounds</strong>","Electricity can damage the conduction system → dysrhythmias"],
    ["Treat the wounds as thermal burns","Cardiac monitor for <strong>24 hours</strong>"],
    ["<strong>Tea-colored urine</strong> = myoglobin from muscle breakdown","Increase fluids — urine output <strong>75–100 mL/hr</strong>"]
   ]}},
   {h:"Smoke inhalation"},
   {table:{head:["","Focus"],rows:[
    ["<strong>Assessment</strong>","<strong>Facial</strong> burns, singed nasal hair, darkened oral membranes · <strong>sputum</strong> with soot · <strong>ABGs</strong> · <strong>hoarseness</strong> — a voice change means the airway is likely to swell"],
    ["<strong>Chemical complications</strong>","<strong>Carbon monoxide</strong> · <strong>cyanide</strong>"],
    ["<strong>Interventions for airway protection</strong>","Bronchoscopy · <strong>intubation — early rather than later</strong>; stridor = immediate intubation"]
   ]}},
   {h:"Carbon monoxide and cyanide"},
   {table:{head:["Poison","What it does","Key points"],rows:[
    ["<strong>Carbon monoxide (CO)</strong>","Binds hemoglobin about <strong>200 times</strong> more readily than oxygen","<strong>Pulse oximetry reads falsely normal (98–100%)</strong> — use an ABG with a carboxyhemoglobin level. Give <strong>100% O₂ by nonrebreather</strong>: CO's half-life is about 4 hours on room air but only 30–60 minutes on 100% O₂. Cherry-red skin is a late sign"],
    ["<strong>Cyanide</strong>","From burning plastics and synthetics; blocks the cells from using oxygen","Antidote: <strong>hydroxocobalamin</strong>"]
   ]}},
   {h:"Breathing medications"},
   {list:[
    "<strong>Albuterol</strong> — bronchodilator for bronchospasm and wheezing",
    "<strong>Acetylcysteine</strong> — nebulized to thin and loosen thick secretions",
    "<strong>Hydroxocobalamin</strong> — cyanide antidote"]},
   {h:"Other burn mechanisms"},
   {table:{head:["Mechanism","Priorities"],rows:[
    ["<strong>Radiation</strong> — sunburn or cancer treatment (localized) or nuclear (systemic)","<strong>Time</strong> (limit exposure) · <strong>distance</strong> (move away from the source) · <strong>shielding</strong> (lead)"],
    ["<strong>Tar / asphalt</strong>","Flush with cool water immediately. <strong>Do not peel it off</strong> — loosen it with mineral oil, petroleum jelly, or mayonnaise"]
   ]}},
   {hook:"Smoke inhalation: <strong>face, sputum, ABGs</strong>. CO fools the pulse oximeter — trust the carboxyhemoglobin level and give 100% O₂."}
  ],
  check:{stem:"A client rescued from a house fire has an SpO₂ of 98% but a headache and confusion. Which action is the priority?", options:["Reassure the client because the SpO₂ is normal","Apply 100% oxygen by nonrebreather mask and obtain a carboxyhemoglobin level","Give acetaminophen for the headache","Place the client on room air and recheck in 1 hour"], answer:1, why:"Carbon monoxide makes pulse oximetry read falsely normal. Headache and confusion after smoke exposure call for 100% oxygen and a carboxyhemoglobin level."}
}
]};

// ===================== POISONINGS =====================
const POISON_UNIT = { title:"Poisonings", sub:"General poisoning management, overdoses (alcohol, opioids, benzodiazepines), and specific toxins with their antidotes.", lessons:[
{ id:"poison-general", title:"General Poisoning Management", kicker:"ABCs first, then call Poison Control",
  blocks:[
   {table:{head:["Intervention","How to","Safety and priorities"],rows:[
    ["<strong>Assessment</strong>","<strong>ABCs first</strong> — stabilize the airway before anything else","GCS of 8 or below = intubate <strong>before</strong> gastric lavage or charcoal, or the client can aspirate"],
    ["<strong>Poison Control</strong>","Call <strong>1-800-222-1222</strong>","Call <strong>first</strong>, before giving anything — they give the specific \"recipe\" for the toxin"],
    ["<strong>Gastric lavage</strong>","\"Stomach pumping\" through an OG/NG tube; client in the <strong>left side-lying</strong> position","Only effective within <strong>1 hour</strong> of ingestion; high aspiration risk. Left side-lying slows the toxin's passage into the small intestine"],
    ["<strong>Activated charcoal</strong>","Black slurry given PO or by tube; binds the toxin","<strong>Assess bowel sounds first.</strong> Stools will be black; may cause constipation (may be given with sorbitol). Does <strong>NOT</strong> work for alcohol, lithium, iron, or corrosives"],
    ["<strong>Whole bowel irrigation</strong>","GoLYTELY until the output is clear","For \"body packers\" (drug mules) or sustained-release overdoses"]
   ]}},
   {hook:"Charcoal won't touch <strong>alcohol, lithium, iron, or corrosives</strong>. For a corrosive, charcoal \"paints\" the esophagus black so the provider can't see the burns during endoscopy."},
   {h:"Never induce vomiting"},
   {list:[
    "<strong>Syrup of ipecac</strong> is strictly contraindicated — never used in modern emergency care; discard it if found at home.",
    "<strong>Corrosives</strong> (lye, bleach, drain cleaner): if it burned going down, it burns worse coming back up. Severe airway and esophageal burns, drooling. Water or milk to dilute only if ordered and the client is awake and can swallow without coughing.",
    "<strong>Hydrocarbons</strong> (gasoline, kerosene): choking, coughing, gasoline breath — high risk of <strong>aspiration pneumonia</strong>; treatment is supportive and airway."]},
   {h:"External chemical exposure"},
   {p:"<strong>\"Strip and shower\"</strong> — remove all contaminated clothing and irrigate with water immediately. Protect yourself with PPE so you don't become contaminated."},
   {h:"The \"coma cocktail\""},
   {p:"For an unknown \"found down\" client, the emergency department often gives <strong>naloxone, dextrose, and thiamine</strong> together."}
  ],
  check:{stem:"A client who swallowed drain cleaner 20 minutes ago is drooling and anxious. Which action should the nurse question?", options:["Calling Poison Control","Assessing the airway","An order to induce vomiting","Keeping the client NPO until evaluated"], answer:2, why:"Vomiting is never induced for a corrosive — it burns the esophagus a second time. Charcoal is also avoided."}
},
{ id:"poison-od", title:"Overdoses: Opioids, Benzodiazepines &amp; Alcohol", kicker:"Respiratory depression and aspiration kill",
  blocks:[
   {table:{head:["Substance","Critical cues","Reversal agent / nursing action"],rows:[
    ["<strong>Opioids</strong> (heroin, fentanyl, morphine)","Triad: <strong>pinpoint pupils, respiratory depression (RR below 10), decreased LOC</strong>; also bradycardia, constipation","<strong>Naloxone (Narcan).</strong> Naloxone's half-life is shorter than the opioid's — watch for <strong>re-sedation</strong> and repeat doses"],
    ["<strong>Benzodiazepines</strong> (alprazolam, lorazepam)","Slurred speech, ataxia, profound sedation; respiratory depression (especially when mixed with other depressants)","<strong>Flumazenil (Romazicon).</strong> Monitor for <strong>seizures</strong> if a chronic user is reversed too fast"],
    ["<strong>Alcohol (acute)</strong>","CNS depression, respiratory arrest, vomiting, aspiration risk","Supportive: <strong>aspiration precautions (side-lying)</strong>, IV fluids, \"banana bag\""],
    ["<strong>Alcohol (withdrawal)</strong>","Tremors, tachycardia, hypertension, hallucinations; delirium tremens (DTs)","<strong>Seizure precautions.</strong> Benzodiazepines (chlordiazepoxide, lorazepam) to taper the brain down safely, guided by the CIWA-Ar"]
   ]}},
   {list:[
    "<strong>Pinpoint pupils with a respiratory rate of 6</strong> → give naloxone before the lab results come back.",
    "Naloxone lasts about <strong>30–90 minutes</strong>; many opioids last <strong>4–6 hours</strong>. When the naloxone wears off, the client can stop breathing again.",
    "<strong>Aspiration is the killer</strong> in alcohol and drug overdoses — if not intubated, place the client in the recovery (side-lying) position."]},
   {h:"CIWA-Ar (Clinical Institute Withdrawal Assessment)"},
   {p:"The gold-standard tool for scoring alcohol withdrawal and titrating benzodiazepines. Most categories score <strong>0–7</strong>; orientation scores <strong>0–4</strong>; the maximum is <strong>67</strong>."},
   {table:{head:["Category","Assessment focus"],rows:[
    ["Nausea/vomiting","None → constant vomiting"],
    ["Tremor","Arms extended, fingers spread"],
    ["Paroxysmal sweats","Diaphoresis"],

   {h:"What is sexual assault?"},

   {table:{head:["Brain area / chemical","Effect during trauma"],rows:[

    ["Hippocampus","Processes information into memories; very sensitive to stress hormones"],
    ["Catecholamines","Natural adrenaline — fight or flight"],

   {p:"Recognize that clients may have many traumas, and avoid re-traumatizing them. Give back control and explain why you ask what you ask. Instead of \"What were you wearing?\" — which sounds like blame — explain the purpose: \"Would you tell me what you were wearing so I can find you on the surveillance video?\""},
