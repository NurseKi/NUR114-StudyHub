const MED_MATH = {"title": "Med Math", "sub": "", "lessons": [{"id": "mathdose", "title": "Dosage Calculations & Basic Conversions", "kicker": "The building blocks every other calculation relies on", "blocks": [{"p": "Before any drip rate or weight-based dose can be calculated, you need to be fluent in the basic conversions underneath them — pounds to kilograms, and the metric ladder from kilograms down to micrograms. Almost every calculation error in practice traces back to a mistake at this level, not the fancier formula built on top of it."}, {"h": "Basic Dosage Calculation"}, {"p": "<strong>Formula:</strong> (Desired ÷ Have) × Quantity = Amount to administer"}, {"p": "<strong>Worked example:</strong> Order is 500 mg PO; available as 250 mg tablets. (500 ÷ 250) × 1 tablet = <strong>2 tablets</strong>."}, {"p": "<strong>Worked example 2:</strong> Order is 2 mg lorazepam; available as a 4 mg/mL vial. (2 ÷ 4) × 1 mL = <strong>0.5 mL</strong>."}, {"h": "Weight Conversions"}, {"table": {"head": ["Conversion", "Formula", "Example"], "rows": [["Pounds → kilograms", "lbs ÷ 2.2 = kg", "154 lbs ÷ 2.2 = 70 kg"], ["Kilograms → pounds", "kg × 2.2 = lbs", "100 kg × 2.2 = 220 lbs"]]}}, {"hook": "Almost every weight-based drug calculation in this unit starts with converting the patient's weight to kilograms — if that first conversion is wrong, every step after it is wrong too, even if the rest of the math is done perfectly. This matters directly in this module for weight-based pediatric dosing (ADHD/ASD medications) and for BSA-based chemotherapy dosing."}, {"h": "Metric System Conversions — the 1000 rule"}, {"p": "Standard medical units (kg, g, mg, mcg) are each separated from their neighbor by a factor of 1000."}, {"table": {"head": ["Direction", "Rule", "Example"], "rows": [["Larger → smaller (kg→g, g→mg, mg→mcg)", "Multiply by 1000 (move the decimal 3 places right)", "2 g × 1000 = 2000 mg"], ["Smaller → larger (mcg→mg, mg→g, g→kg)", "Divide by 1000 (move the decimal 3 places left)", "2500 mcg ÷ 1000 = 2.5 mg"]]}}, {"h": "Volume Conversions"}, {"table": {"head": ["Conversion", "Formula", "Example"], "rows": [["Milliliters → liters", "mL ÷ 1000 = L", "2500 mL ÷ 1000 = 2.5 L"], ["Liters → milliliters", "L × 1000 = mL", "0.5 L × 1000 = 500 mL"]]}}, {"h": "Household & Volume Equivalents"}, {"table": {"head": ["Household/Metric", "Equivalent"], "rows": [["1 teaspoon (tsp)", "5 mL"], ["1 tablespoon (tbsp)", "15 mL (or 3 tsp)"], ["1 ounce (oz)", "30 mL (or 2 tbsp)"], ["1 cup", "240 mL (8 oz)"], ["1 quart (approx.)", "1000 mL (1 L)"]]}}]}, {"id": "mathiv", "title": "IV Flow Rates, Drip Rates & Concentration", "kicker": "Getting fluid and medication into the vein at the right speed", "blocks": [{"p": "These formulas answer one of two questions: how fast should this infusion pump run (mL/hr), or how many drops per minute should a gravity IV be set to (gtt/min) when there's no pump involved? A third formula, concentration, sets up weight-based drip calculations."}, {"h": "Flow Rate / Infusion Rate (mL/hr) — for infusion pumps"}, {"p": "<strong>Formula:</strong> Total Volume (mL) ÷ Total Time (hr) = mL/hr"}, {"p": "<strong>Worked example:</strong> Infuse 1000 mL of Normal Saline over 8 hours. 1000 ÷ 8 = <strong>125 mL/hr</strong>."}, {"h": "Infusion Time — working backward from a known rate"}, {"p": "<strong>Formula:</strong> Total Volume (mL) ÷ Flow Rate (mL/hr) = Time (hours)"}, {"p": "<strong>Worked example:</strong> A 1000 mL bag is infusing at 125 mL/hr. How long will it last? 1000 ÷ 125 = <strong>8 hours</strong>."}, {"h": "Drip Rate (gtt/min) — for gravity IV tubing without a pump"}, {"p": "There are two equivalent ways to reach the same answer, depending on whether you already know the mL/hr rate or are starting from the total order."}, {"table": {"head": ["Starting point", "Formula"], "rows": [["You already know mL/hr", "(mL/hr ÷ 60) × Drop Factor (gtt/mL) = gtt/min"], ["You're starting from the total order", "(Total Volume [mL] × Drop Factor [gtt/mL]) ÷ Time (minutes) = gtt/min"]]}}, {"p": "<strong>Worked example (method 1):</strong> Infuse at 125 mL/hr using tubing with a drop factor of 15 gtt/mL. First, mL/min: 125 ÷ 60 = 2.08 mL/min. Then: 2.08 × 15 = 31.2, rounded to <strong>31 gtt/min</strong>."}, {"p": "<strong>Worked example (method 2):</strong> Infuse 1000 mL over 8 hours (480 minutes) with a drop factor of 15 gtt/mL. (1000 × 15) ÷ 480 = 15,000 ÷ 480 = 31.25, rounded to <strong>31 gtt/min</strong> — the same answer either way."}, {"h": "IV Push Medication Rate"}, {"p": "A common general safety rule for IV push medications is roughly <strong>1 mL per minute</strong> unless the drug's specific administration guidelines say otherwise. <strong>Worked example:</strong> a 10 mL medication is administered over 10 minutes, consistent with the 1 mL/min rule. Pushing too fast is a common cause of adverse drug reactions — relevant here for IV push benzodiazepines (e.g., lorazepam for agitation/status epilepticus) and IV antihistamines."}, {"h": "Concentration Calculation — the setup step for weight-based drips"}, {"p": "<strong>Formula:</strong> (Total mg in the bag × 1000) ÷ Total mL in the bag = Concentration (mcg/mL)"}, {"p": "<strong>Worked example:</strong> A bag contains 400 mg of a drug in 250 mL of D5W. (400 × 1000) ÷ 250 = <strong>1600 mcg/mL</strong>."}]}, {"id": "mathcardiac", "title": "Cardiac & Vasoactive Drip Calculations", "kicker": "MAP, CPP, and weight-/unit-based infusions", "blocks": [{"p": "This lesson groups together the calculations that show up most often in critical care and high-alert medication administration — all of them either measure perfusion pressure directly, or calculate the pump rate for a drug that manipulates that pressure. Relevant here for a client in delirium tremens, an oncology patient in septic shock, or any client on a high-alert IV drip."}, {"h": "MAP — Mean Arterial Pressure"}, {"p": "<strong>Formula:</strong> (Systolic BP + [2 × Diastolic BP]) ÷ 3 = MAP"}, {"p": "<strong>Worked example:</strong> BP is 120/80. (120 + [2 × 80]) ÷ 3 = (120 + 160) ÷ 3 = <strong>93.3 mmHg</strong>."}, {"p": "MAP reflects the average pressure driving blood into the organs across the whole cardiac cycle — it's weighted toward diastole because the heart spends more time in diastole than systole. A MAP of roughly <strong>65 mmHg or higher</strong> is generally considered necessary to maintain adequate organ perfusion in a critically ill patient."}, {"h": "CPP — Cerebral Perfusion Pressure"}, {"p": "<strong>Formula:</strong> MAP − ICP = CPP"}, {"p": "<strong>Worked example:</strong> MAP is 93, ICP is 15. 93 − 15 = <strong>78 mmHg</strong>."}, {"hook": "CPP depends directly on MAP — if you already calculated MAP for a patient, you're one subtraction away from CPP. A CPP that drops too low (generally below ~60 mmHg) risks cerebral ischemia, which is why both numbers are tracked together in a patient with a head injury or elevated ICP."}, {"h": "Weight-Based Infusion (mcg/kg/min)"}, {"p": "<strong>Formula:</strong> (Desired mcg × kg × 60 minutes) ÷ Concentration (mcg/mL) = mL/hr"}, {"p": "<strong>Worked example:</strong> Order is 5 mcg/kg/min for an 80 kg patient, with a concentration of 1600 mcg/mL (from the concentration calculation in the previous lesson). (5 × 80 × 60) ÷ 1600 = <strong>15 mL/hr</strong>."}, {"h": "Units-Based Infusion (Units/kg/hr) — e.g., Heparin"}, {"p": "<strong>Formula:</strong> (Units × kg) ÷ Concentration (Units/mL) = mL/hr"}, {"p": "<strong>Worked example:</strong> Order is 12 Units/kg/hr for a 100 kg patient, with a concentration of 100 Units/mL. (12 × 100) ÷ 100 = <strong>12 mL/hr</strong>."}, {"hook": "Both weight-based and units-based drips are high-alert medications given by infusion pump only — the shared theme across every high-alert drug is a computerized pump, frequent reassessment, and a clear plan for what triggers stopping or adjusting the rate."}]}, {"id": "mathfluid", "title": "Fluid Balance, I&O & Tonicity", "kicker": "Tracking what goes in, what comes out, and what IV fluids do to cells", "blocks": [{"p": "Intake and output tracking is really just accounting for fluid — but a couple of categories have special rules that are easy to get wrong, and tonicity explains why the choice of IV fluid itself matters beyond just the volume. This is directly relevant to fluid management in cancer/chemotherapy patients, HIV/AIDS patients with diarrhea or wasting, and any client receiving IV psychiatric medications."}, {"h": "What counts as intake"}, {"list": ["<strong>Oral (PO) fluids</strong> — water, juice, soda, milk, coffee", "<strong>Liquid foods</strong> — soups, broths, gelatin, sherbet, sorbet, pudding", "<strong>Ice chips</strong> — recorded as <strong>half</strong> the original volume (200 mL of ice chips = 100 mL intake), since ice chips are mostly air/space between solid pieces", "<strong>IV fluids</strong> — maintenance fluids, boluses, and piggyback medications (like antibiotics)", "<strong>Tube feedings</strong> — formula and water flushes (relevant for a client with anorexia nervosa on enteral nutritional rehabilitation)"]}, {"h": "What counts as output"}, {"list": ["Urine — voided, catheterized, or urostomy drainage", "Emesis (vomitus) — relevant for a client with bulimia or chemotherapy-induced nausea", "Liquid stool — diarrhea or colostomy drainage", "Wound drainage — from JP drains, Hemovacs, or chest tubes", "Suction — gastric (NG) or respiratory"]}, {"h": "Net Fluid Balance"}, {"p": "<strong>Formula:</strong> Total Intake − Total Output = Net Balance"}, {"p": "<strong>Worked example:</strong> Intake of 3000 mL, output of 800 mL. 3000 − 800 = <strong>+2200 mL</strong> (a positive balance, meaning the patient is retaining more fluid than they're losing)."}, {"h": "Insensible Loss"}, {"p": "Fluid lost through the skin and lungs that can't be directly measured. Standard estimate: <strong>600–900 mL/day</strong>, or roughly <strong>0.5 mL/kg/hr</strong>. <strong>Worked example:</strong> a 70 kg patient: 0.5 × 70 = 35 mL/hr, or roughly 840 mL/day."}, {"h": "Fluid Weight Calculation"}, {"p": "<strong>Rule of thumb:</strong> a 1 kg weight change equals roughly 1 L of fluid change. <strong>Worked example:</strong> a patient's weight rises 2 kg over two days — that's roughly a 2 L fluid gain, not necessarily 2 kg of actual tissue."}, {"hook": "An output under <b>30 mL/hr</b> is always reported as a potential emergency — it signals inadequate perfusion to the kidneys."}, {"h": "Tonicity — what different IV fluids do to cells"}, {"table": {"head": ["Type", "Solute concentration vs. inside the cell", "Effect on the cell", "Examples", "Clinical use"], "rows": [["Hypertonic", "Higher outside the cell", "Water leaves the cell — it shrinks (plasmolysis)", "3% or 5% NaCl; 10% Dextrose in Water", "Cerebral edema, severe hyponatremia"], ["Hypotonic", "Lower outside the cell", "Water enters the cell — it swells or bursts (cytolysis)", "0.45% NaCl (half normal saline)", "Dehydration — pushes water back into cells"], ["Isotonic", "Equal inside and outside", "No net water movement — equilibrium maintained", "0.9% Normal Saline, Lactated Ringer's, D5W", "Routine IV fluid replacement and hydration"]]}}, {"hook": "A simple way to remember the direction: <b>hyper</b>tonic pulls water <b>OUT</b> of the cell (think 'hyper' = high solute outside, pulling water toward it), while <b>hypo</b>tonic pushes water <b>IN</b>. Isotonic is the 'do no harm' default fluid."}]}, {"id": "mathbody", "title": "Body Measurement: BMI & BSA", "kicker": "Calculations that scale a dose — or a diagnosis — to the patient's size", "blocks": [{"p": "These two calculations both answer a version of the same question — how big is this patient, in a way that's useful for dosing or risk assessment? BMI is a general screening number used constantly in this module's eating-disorder content; BSA is a more precise scaling factor used specifically for chemotherapy dosing in the Cancer unit."}, {"h": "BMI — Body Mass Index"}, {"table": {"head": ["System", "Formula"], "rows": [["Metric", "Weight (kg) ÷ [Height (m)]²"], ["Imperial", "[Weight (lbs) × 703] ÷ [Height (in)]²"]]}}, {"p": "<strong>Worked example (metric):</strong> Weight 70 kg, height 1.75 m. Square the height: 1.75 × 1.75 = 3.0625. Divide weight by that: 70 ÷ 3.0625 = <strong>22.86</strong> (normal weight range)."}, {"p": "<strong>Worked example (imperial):</strong> Weight 154 lbs, height 69 inches. 154 × 703 = 108,262. Square the height: 69 × 69 = 4,761. Divide: 108,262 ÷ 4,761 = <strong>22.74</strong> — the same result as the metric calculation, just arrived at with different starting units."}, {"hook": "This is exactly the calculation behind the BMI thresholds in the Anorexia Nervosa lesson: a BMI under 17 is a diagnostic marker of the disorder, and under 15 is considered extreme/life-threatening. Knowing how to compute BMI from a height and weight given in a case stem — not just recognize the threshold — is testable on its own."}, {"h": "BSA — Body Surface Area"}, {"p": "BSA approximates a patient's total skin surface area in square meters (m²), and it's used specifically for drugs with a narrow therapeutic index, chemotherapy agents, pediatric patients, and burn patients — situations where a small dosing error has an outsized effect. This is the calculation behind chemotherapy dosing in the Cancer unit."}, {"p": "<strong>Formula:</strong> BSA = √[(Height in cm × Weight in kg) ÷ 3600]"}, {"h": "Fully worked pediatric dosing example"}, {"p": "Order: a chemotherapy agent at 2 mg/m². Patient: 37 lb, 97 cm tall. Supply: 1 mg/mL."}, {"list": ["<strong>Step 1 — convert weight to kg:</strong> 37 lb ÷ 2.2 = 16.8 kg", "<strong>Step 2 — calculate BSA:</strong> √[(97 cm × 16.8 kg) ÷ 3600] = √[1629.6 ÷ 3600] = √0.4527 = <strong>0.67 m²</strong>", "<strong>Step 3 — calculate the dose in mg:</strong> 2 mg/m² × 0.67 m² = <strong>1.34 mg</strong>", "<strong>Step 4 — calculate the dose in mL:</strong> 1.34 mg ÷ 1 mg/mL = <strong>1.34 mL</strong> to administer"]}, {"hook": "Notice this whole calculation depends on the weight-to-kg conversion from the first Med Math lesson — get that first step wrong, and every subsequent step (BSA, mg dose, mL dose) inherits the error."}]}, {"id": "m3math-renal", "title": "Renal Math: Urine Output, Fluid Restriction & Daily Weights", "kicker": "The calculations behind the AKI, CKD, and fluid-balance lessons", "blocks": [{"h": "Hourly Urine Output (mL/kg/hr)"}, {"p": "<strong>Formula:</strong> Urine output (mL) ÷ Hours ÷ Weight (kg) = mL/kg/hr. The minimum acceptable adult output is about <strong>0.5 mL/kg/hr</strong> (roughly 30 mL/hr)."}, {"p": "<strong>Minimum for a given client:</strong> Weight (kg) × 0.5 = minimum mL/hr. A 70 kg client needs at least 70 × 0.5 = <strong>35 mL/hr</strong>."}, {"p": "<strong>Worked example:</strong> An 80 kg client voids 200 mL over 8 hours. 200 ÷ 8 = 25 mL/hr; 25 ÷ 80 = <strong>0.31 mL/kg/hr</strong> — below 0.5, so it's reported as an early warning of AKI."}, {"h": "24-Hour Output — naming the problem"}, {"table": {"head": ["24-hour urine output", "Term"], "rows": [["Less than 400–500 mL", "<strong>Oliguria</strong> (the oliguric phase of AKI: below 400 mL/day)"], ["Less than 50 mL", "<strong>Anuria</strong>"], ["4–5 L/day", "<strong>Diuretic phase</strong> of AKI — watch for fluid volume deficit"], ["More than 3 L/day after an obstruction is relieved", "<strong>Postobstructive diuresis</strong>"]]}}, {"h": "Fluid Restriction"}, {"p": "<strong>Formula:</strong> Previous 24-hour urine output + about 500–600 mL (insensible losses) = Fluid allowance for the next 24 hours. (Some references use 500–800 mL.)"}, {"p": "<strong>Worked example:</strong> A client in the oliguric phase put out 350 mL of urine yesterday. 350 + 500 = 850 mL to 350 + 600 = 950 mL — a fluid allowance of about <strong>850–950 mL</strong> for today."}, {"hook": "The fluid allowance is spread across all 24 hours — with sips, ice chips, and frequent mouth care for thirst — and it has to include the fluid used to take medications."}, {"h": "Daily Weights — 1 kg = 1 L"}, {"p": "<strong>Rule:</strong> a 1 kg weight change equals about 1 L of fluid (about 2.2 lb per liter). Weigh at the same time, on the same scale, in the same clothing."}, {"p": "<strong>Worked example:</strong> Yesterday 72.0 kg; today 74.5 kg. 74.5 − 72.0 = 2.5 kg = about <strong>2.5 L of retained fluid</strong>."}, {"p": "<strong>Worked example (pounds):</strong> A weight gain of 4.4 lb ÷ 2.2 = 2 kg = about <strong>2 L</strong> of fluid."}, {"h": "BUN:Creatinine Ratio"}, {"p": "<strong>Formula:</strong> BUN ÷ Creatinine. Normal is about 10:1 to 20:1; <strong>above 20:1</strong> points toward a <strong>prerenal</strong> cause (dehydration, low perfusion)."}, {"table": {"head": ["BUN", "Creatinine", "Ratio", "Points toward"], "rows": [["48 mg/dL", "1.2 mg/dL", "48 ÷ 1.2 = 40:1", "Prerenal — BUN rising out of proportion (dehydration)"], ["80 mg/dL", "8.0 mg/dL", "80 ÷ 8 = 10:1", "Intrarenal or postrenal — both rising together"]]}}, {"h": "Phosphate Binder Dose per Meal (Sevelamer)"}, {"p": "<strong>Formula:</strong> Total daily dose ÷ Number of meals the client actually eats = Dose per meal"}, {"p": "<strong>Worked example:</strong> Sevelamer 4,800 mg/day. Three meals a day: 4,800 ÷ 3 = <strong>1,600 mg with each meal</strong>. The same client skips breakfast and eats 2 meals: 4,800 ÷ 2 = <strong>2,400 mg with each meal</strong>."}, {"hook": "The number of meals comes from the client's eating pattern, not a standard schedule — fewer meals means a <b>bigger</b> dose with each meal. And no meal, no binder."}, {"h": "Maximum-Rate Problems"}, {"p": "<strong>Formula:</strong> Dose (mg) ÷ Maximum rate (mg/min) = Minimum time (minutes)"}, {"p": "<strong>Worked example:</strong> High-dose IV furosemide is infused no faster than <strong>4 mg/min</strong> (ototoxicity). For a 120 mg dose: 120 ÷ 4 = <strong>30 minutes minimum</strong>."}, {"hook": "Rapid IV furosemide is what causes the tinnitus and hearing loss — if the math says 30 minutes, it never goes in faster, even when the client is fluid overloaded."}, {"h": "Net Fluid Balance"}, {"p": "<strong>Formula:</strong> Total Intake − Total Output = Net Balance"}, {"p": "<strong>Worked example:</strong> Intake: PO 600 mL + IV 900 mL + ice chips 200 mL (counts as 100 mL) = 1,600 mL. Output: urine 450 mL + emesis 150 mL = 600 mL. 1,600 − 600 = <strong>+1,000 mL</strong> — a positive balance (fluid retention)."}]}, {"id": "m3math-dialysis", "title": "Dialysis Fluid Math: Hemodialysis, PD & CRRT", "kicker": "How much fluid came off — and how to count it", "blocks": [{"h": "Hemodialysis — Fluid Removal Goal"}, {"p": "<strong>Formula:</strong> Pre-dialysis weight − Dry (target) weight = Fluid to remove (1 kg = 1 L)"}, {"p": "<strong>Worked example:</strong> Pre-dialysis weight 78.4 kg; dry weight 76.0 kg. 78.4 − 76.0 = 2.4 kg = about <strong>2.4 L</strong> to remove. The post-dialysis weight confirms how much actually came off."}, {"h": "Peritoneal Dialysis — Net Ultrafiltration"}, {"p": "<strong>Formula:</strong> Outflow (drained) − Inflow (instilled) = Net fluid removed. A <strong>negative</strong> result means the client absorbed (retained) dialysate."}, {"table": {"head": ["Inflow", "Outflow", "Result", "Meaning"], "rows": [["2,000 mL", "2,500 mL", "+500 mL", "<strong>500 mL removed</strong> — recorded as output"], ["2,000 mL", "1,800 mL", "−200 mL", "<strong>200 mL retained</strong> — counts toward intake; check for kinks, constipation, and position"]]}}, {"p": "<strong>Multiple exchanges:</strong> add the net result of each one. Exchanges of +300, +150, and −100 mL = <strong>+350 mL</strong> net removed. If drainage is short by <strong>500 mL or more</strong> over several exchanges, evaluate for fluid retention and notify the provider."}, {"hook": "PD outflow is not urine. Record the client's <b>true urine output</b> separately from the dialysate drained."}, {"h": "CRRT — Hourly Fluid Balance"}, {"p": "The nurse totals all intake and output <strong>every hour</strong> and adjusts to meet the ordered hourly balance goal."}, {"p": "<strong>Formula:</strong> Hourly net fluid removal needed = Hourly intake (IV fluids, meds, feedings, replacement fluid) + Desired hourly fluid loss"}, {"p": "<strong>Worked example:</strong> The goal is a net loss of 100 mL/hr. This hour the client receives IV fluid 50 mL + tube feeding 60 mL + IV meds 40 mL = 150 mL. To achieve −100 mL, the machine must remove 150 + 100 = <strong>250 mL</strong> of fluid from the client this hour."}]}]};
Object.assign(QUIZ, {"mathdose": [{"stem": "An order calls for 750 mg of a medication PO. It is supplied as 250 mg tablets. Using the (Desired ÷ Have) × Quantity formula, how many tablets should the nurse give?", "options": ["3 tablets", "2 tablets", "4 tablets", "0.5 tablet"], "answer": 0, "why": "(750 ÷ 250) × 1 tablet = 3 tablets."}, {"stem": "A patient weighs 176 lbs. Using the standard conversion factor from this lesson, what is this weight in kilograms?", "options": ["80 kg", "70 kg", "88 kg", "160 kg"], "answer": 0, "why": "lbs ÷ 2.2 = kg, so 176 ÷ 2.2 = 80 kg."}, {"stem": "Using the metric 1000 rule, how many milligrams are in 3.5 g?", "options": ["3500 mg", "350 mg", "0.0035 mg", "35,000 mg"], "answer": 0, "why": "Converting a larger unit (g) to a smaller one (mg) means multiplying by 1000: 3.5 × 1000 = 3500 mg."}, {"stem": "An order calls for 2 tablespoons of a liquid medication. Using the household equivalents in this lesson, how many mL is this?", "options": ["30 mL", "10 mL", "60 mL", "15 mL"], "answer": 0, "why": "1 tablespoon = 15 mL, so 2 tablespoons = 2 × 15 mL = 30 mL."}, {"type": "sata", "stem": "Which of the following conversions from this lesson are correct? Select all that apply.", "options": ["1 kg = 1000 g", "1 mL = 1000 L", "1 tablespoon = 15 mL", "1 ounce = 30 mL", "154 lbs = 70 kg"], "answers": [0, 2, 3, 4], "why": "kg→g is a larger-to-smaller conversion (×1000, so 1 kg = 1000 g, not the reverse); 1 tbsp = 15 mL and 1 oz = 30 mL are both stated household equivalents; 154 lbs ÷ 2.2 = 70 kg is the lesson's own worked example. '1 mL = 1000 L' reverses the mL↔L relationship (it should be 1000 mL = 1 L)."}], "mathiv": [{"stem": "A patient is to receive 1500 mL of Normal Saline over 10 hours via infusion pump. What rate (mL/hr) should the pump be set to?", "options": ["150 mL/hr", "100 mL/hr", "125 mL/hr", "200 mL/hr"], "answer": 0, "why": "Total Volume ÷ Total Time = mL/hr, so 1500 ÷ 10 = 150 mL/hr."}, {"stem": "An 800 mL bag is infusing at 100 mL/hr. Approximately how long will it take to infuse completely?", "options": ["8 hours", "10 hours", "80 hours", "0.8 hour"], "answer": 0, "why": "Total Volume ÷ Flow Rate = Time, so 800 ÷ 100 = 8 hours."}, {"stem": "An order is to infuse 1000 mL over 6 hours (360 minutes) using tubing with a drop factor of 10 gtt/mL. What is the drip rate, rounded to the nearest whole drop?", "options": ["28 gtt/min", "21 gtt/min", "15 gtt/min", "10 gtt/min"], "answer": 0, "why": "(Total Volume × Drop Factor) ÷ Time in minutes = gtt/min: (1000 × 10) ÷ 360 = 10,000 ÷ 360 = 27.78, which rounds to 28 gtt/min."}, {"stem": "A bag contains 300 mg of a drug in 500 mL of D5W. What is the concentration in mcg/mL?", "options": ["600 mcg/mL", "300 mcg/mL", "1500 mcg/mL", "60 mcg/mL"], "answer": 0, "why": "(Total mg × 1000) ÷ Total mL = concentration: (300 × 1000) ÷ 500 = 300,000 ÷ 500 = 600 mcg/mL."}, {"type": "sata", "stem": "Which of the following statements about IV flow-rate calculations from this lesson are correct? Select all that apply.", "options": ["mL/hr is calculated as Total Volume (mL) ÷ Total Time (hr)", "Drip rate in gtt/min requires knowing the tubing's drop factor", "A general safety guideline for IV push medications, absent other guidance, is roughly 1 mL per minute", "Concentration in mcg/mL is found by dividing total mg by total mL, with no unit conversion needed", "The two methods for calculating gtt/min will always give different final answers for the same infusion"], "answers": [0, 1, 2], "why": "mL/hr and the 1 mL/min IV push guideline are both directly stated, and drop factor is required for any gtt/min calculation. Concentration requires converting mg to mcg first (×1000) before dividing by mL — skipping that step gives a wrong answer. And the lesson's own worked example shows both gtt/min methods arriving at the same answer (31 gtt/min), not different ones."}], "mathcardiac": [{"stem": "A patient's BP is 140/90. Using the MAP formula, what is this patient's mean arterial pressure?", "options": ["106.7 mmHg", "115 mmHg", "90 mmHg", "140 mmHg"], "answer": 0, "why": "(Systolic + [2 × Diastolic]) ÷ 3 = MAP: (140 + [2 × 90]) ÷ 3 = (140 + 180) ÷ 3 = 320 ÷ 3 = 106.7 mmHg."}, {"stem": "A patient's MAP is 90 mmHg and ICP is 20 mmHg. What is this patient's cerebral perfusion pressure (CPP)?", "options": ["70 mmHg", "110 mmHg", "20 mmHg", "90 mmHg"], "answer": 0, "why": "MAP − ICP = CPP, so 90 − 20 = 70 mmHg."}, {"stem": "An order is for a weight-based drip at 3 mcg/kg/min for a 60 kg patient, using a bag concentration of 400 mcg/mL. What rate (mL/hr) should the pump be set to?", "options": ["27 mL/hr", "3 mL/hr", "60 mL/hr", "7.5 mL/hr"], "answer": 0, "why": "(Desired mcg × kg × 60) ÷ Concentration = mL/hr: (3 × 60 × 60) ÷ 400 = 10,800 ÷ 400 = 27 mL/hr."}, {"stem": "A heparin order is for 15 Units/kg/hr for a 70 kg patient, using a concentration of 50 Units/mL. What rate (mL/hr) should the pump be set to?", "options": ["21 mL/hr", "15 mL/hr", "50 mL/hr", "70 mL/hr"], "answer": 0, "why": "(Units × kg) ÷ Concentration = mL/hr: (15 × 70) ÷ 50 = 1050 ÷ 50 = 21 mL/hr."}, {"type": "sata", "stem": "Which of the following statements from this lesson are accurate? Select all that apply.", "options": ["A MAP of at least approximately 65 mmHg is generally needed to maintain adequate organ perfusion", "CPP is calculated by adding ICP to MAP", "A CPP that drops below roughly 60 mmHg risks cerebral ischemia", "Weight-based and units-based infusions are both considered high-alert medications requiring an infusion pump", "MAP is weighted more toward systolic pressure because the heart spends more time in systole"], "answers": [0, 2, 3], "why": "A MAP of roughly 65+ mmHg and a CPP floor of roughly 60 mmHg are both stated thresholds, and both drip types are named as high-alert, pump-only medications. CPP is MAP minus ICP, not plus; and MAP is weighted toward diastole (not systole), since the heart spends more time in diastole."}], "mathfluid": [{"stem": "A patient's total intake for a shift is 2400 mL and total output is 1800 mL. What is the net fluid balance?", "options": ["+600 mL", "+4200 mL", "-600 mL", "+1800 mL"], "answer": 0, "why": "Total Intake − Total Output = Net Balance: 2400 − 1800 = +600 mL."}, {"stem": "A patient consumes 300 mL of ice chips. How much should be recorded as intake?", "options": ["150 mL", "300 mL", "600 mL", "75 mL"], "answer": 0, "why": "Ice chips are recorded as half their measured volume, since they're mostly air between solid pieces: 300 ÷ 2 = 150 mL."}, {"stem": "Using the 0.5 mL/kg/hr estimate, what is the approximate hourly insensible fluid loss for a 60 kg patient?", "options": ["30 mL/hr", "60 mL/hr", "15 mL/hr", "120 mL/hr"], "answer": 0, "why": "0.5 mL/kg/hr × 60 kg = 30 mL/hr."}, {"stem": "A patient's weight rises by 3 kg over three days, with no change in diet suggesting real tissue gain. Using the fluid weight rule of thumb, approximately how much fluid does this represent?", "options": ["3 L", "1 L", "6 L", "0.3 L"], "answer": 0, "why": "The rule of thumb is that a 1 kg weight change equals roughly 1 L of fluid change, so a 3 kg change is roughly 3 L."}, {"type": "sata", "stem": "Which of the following statements from this lesson are accurate? Select all that apply.", "options": ["Hypertonic solutions cause water to leave the cell, causing it to shrink", "Hypotonic solutions cause water to leave the cell", "0.9% Normal Saline is an isotonic solution", "Urine output under 30 mL/hr is a potential emergency signaling inadequate renal perfusion", "Ice chips are counted at their full measured volume, with no adjustment"], "answers": [0, 2, 3], "why": "Hypertonic fluids pull water out of the cell (shrinkage/plasmolysis), 0.9% NS is a classic isotonic fluid, and output under 30 mL/hr is flagged as a potential emergency. Hypotonic fluids push water INTO the cell (not out), and ice chips are counted at half their measured volume, not the full amount."}], "mathbody": [{"stem": "A patient weighs 60 kg and is 1.6 m tall. Using the metric BMI formula, what is this patient's BMI (rounded to the nearest tenth)?", "options": ["23.4", "24.0", "22.9", "25.6"], "answer": 0, "why": "Weight (kg) ÷ [Height (m)]²: 1.6 × 1.6 = 2.56; 60 ÷ 2.56 = 23.4."}, {"stem": "A patient weighs 180 lbs and is 72 inches tall. Using the imperial BMI formula, what is this patient's BMI (rounded to the nearest tenth)?", "options": ["24.4", "22.9", "26.0", "20.4"], "answer": 0, "why": "[Weight (lbs) × 703] ÷ [Height (in)]²: 180 × 703 = 126,540; 72 × 72 = 5184; 126,540 ÷ 5184 ≈ 24.4."}, {"stem": "A patient is 150 cm tall and weighs 50 kg. Using the BSA formula, what is this patient's approximate BSA (rounded to the nearest hundredth)?", "options": ["1.44 m²", "2.08 m²", "0.72 m²", "14.4 m²"], "answer": 0, "why": "BSA = √[(Height in cm × Weight in kg) ÷ 3600] = √[(150 × 50) ÷ 3600] = √[7500 ÷ 3600] = √2.083 ≈ 1.44 m²."}, {"stem": "A pediatric chemo order is 3 mg/m². The patient weighs 44 lb and is 106 cm tall, and the drug is supplied as 1 mg/mL. Following the same step-by-step process as the lesson's worked example, approximately how many mL should be given?", "options": ["≈2.3 mL", "≈3.0 mL", "≈0.77 mL", "≈6.9 mL"], "answer": 0, "why": "Step 1 — convert weight to kg: 44 ÷ 2.2 = 20 kg. Step 2 — BSA: √[(106 × 20) ÷ 3600] = √[2120 ÷ 3600] = √0.589 ≈ 0.77 m². Step 3 — dose in mg: 3 mg/m² × 0.77 m² ≈ 2.3 mg. Step 4 — dose in mL: 2.3 mg ÷ 1 mg/mL ≈ 2.3 mL."}, {"type": "sata", "stem": "Which of the following statements from this lesson are accurate? Select all that apply.", "options": ["A BMI under 17 is a diagnostic marker used for anorexia nervosa", "A BMI under 15 is considered extreme/life-threatening in anorexia nervosa", "BSA is used for chemotherapy dosing because it scales more precisely to a patient's size than weight alone", "The metric and imperial BMI formulas will give meaningfully different results for the same patient", "BSA is expressed in kilograms, not square meters"], "answers": [0, 1, 2], "why": "The BMI thresholds (<17 diagnostic, <15 extreme) and BSA's precision rationale for chemo dosing are both stated directly. The metric and imperial BMI formulas give the same result for the same patient (just starting from different units), and BSA is expressed in square meters (m²), not kilograms."}], "m3math-renal": [{"type": "fitb", "stem": "A 90 kg client with suspected AKI has voided a total of 240 mL over the last 8 hours. Calculate the client's urine output in mL/kg/hr. Record your answer to the nearest hundredth.", "answer": 0.33, "why": "240 mL ÷ 8 hr = 30 mL/hr; 30 ÷ 90 kg = 0.333 → 0.33 mL/kg/hr. This is below the 0.5 mL/kg/hr minimum (this client needs at least 90 × 0.5 = 45 mL/hr), so 30 mL/hr is not adequate for a 90 kg client and should be reported."}, {"type": "fitb", "stem": "A client in the oliguric phase of AKI had a urine output of 420 mL over the previous 24 hours. The provider orders a fluid allowance of the previous 24-hour output plus 500 mL. How many mL may the client have over the next 24 hours? Record your answer as a whole number.", "answer": 920, "why": "420 mL + 500 mL (insensible losses) = 920 mL. The allowance is spread across all 24 hours and includes fluid taken with medications and IV fluids."}, {"type": "fitb", "stem": "A client with CKD weighed 154 lb yesterday and 160.6 lb this morning on the same scale in the same clothing. About how many liters of fluid has the client retained? Record your answer to the nearest tenth.", "answer": 3, "why": "160.6 − 154 = 6.6 lb; 6.6 ÷ 2.2 = 3.0 kg; 1 kg = about 1 L, so about 3.0 L retained. A gain this size overnight is fluid, not fat, and needs to be reported."}, {"type": "fitb", "stem": "A client on hemodialysis is prescribed sevelamer 6,400 mg per day divided with meals. The client states, \"I never eat breakfast — I just eat lunch and dinner.\" How many mg of sevelamer should be given with each meal? Record your answer as a whole number.", "answer": 3200, "why": "Daily dose ÷ meals actually eaten: 6,400 mg ÷ 2 meals = 3,200 mg with each meal. The divisor is the client's real eating pattern, not a standard three meals — fewer meals means a larger dose with each one."}, {"type": "sata", "stem": "The nurse reviews data for a 60 kg client on a medical-surgical unit. Which findings should the nurse report to the provider? Select all that apply.", "options": ["Urine output of 25 mL/hr for the past 4 hours", "BUN 18 mg/dL and creatinine 1.0 mg/dL", "Weight up 1.5 kg since yesterday", "24-hour urine output of 1,600 mL", "IV furosemide 120 mg infusing over 15 minutes"], "answers": [0, 2, 4], "why": "25 ÷ 60 = 0.42 mL/kg/hr, below 0.5 (minimum 30 mL/hr for this client). A 1.5 kg overnight gain is about 1.5 L of retained fluid. 120 mg over 15 minutes is 8 mg/min — double the 4 mg/min maximum, risking ototoxicity (it needs at least 30 minutes). BUN/creatinine of 18/1.0 and a 1,600 mL daily output are normal."}], "m3math-dialysis": [{"type": "fitb", "stem": "A client's pre-hemodialysis weight is 82.6 kg. The client's dry (target) weight is 79.8 kg. How many liters of fluid is the goal to remove during this treatment? Record your answer to the nearest tenth.", "answer": 2.8, "why": "82.6 − 79.8 = 2.8 kg; 1 kg = about 1 L, so the goal is about 2.8 L. The post-dialysis weight confirms how much actually came off."}, {"type": "fitb", "stem": "A client on peritoneal dialysis completes three exchanges, each with 2,000 mL instilled. The outflow volumes are 2,250 mL, 1,850 mL, and 2,400 mL. What is the net fluid removed for the three exchanges, in mL? Record your answer as a whole number.", "answer": 500, "why": "Outflow − inflow for each exchange: +250, −150, +400. Net = 250 − 150 + 400 = +500 mL removed. The 150 mL retained in the second exchange is subtracted, not ignored."}, {"type": "fitb", "stem": "A client on CRRT has an ordered net fluid loss of 150 mL/hr. This hour the client receives IV fluid 75 mL, tube feeding 50 mL, and an IV antibiotic 25 mL. How many mL must the machine remove from the client this hour to meet the goal? Record your answer as a whole number.", "answer": 300, "why": "Hourly intake = 75 + 50 + 25 = 150 mL. Fluid to remove = intake + desired loss = 150 + 150 = 300 mL. Removing only 150 mL would just break even with intake."}, {"type": "matrix", "stem": "The nurse records peritoneal dialysis exchanges. For each exchange, indicate whether the result is fluid removed from the client or fluid retained by the client.", "rows": ["Inflow 2,000 mL — outflow 2,400 mL", "Inflow 2,000 mL — outflow 1,750 mL", "Inflow 1,500 mL — outflow 1,650 mL", "Inflow 2,500 mL — outflow 2,300 mL", "Inflow 1,000 mL — outflow 1,200 mL"], "cols": ["Fluid removed (record as output)", "Fluid retained (counts toward intake)"], "correct": [0, 1, 0, 1, 0], "why": "Outflow − inflow: a positive result (+400, +150, +200) is fluid removed; a negative result (−250, −200) means the client absorbed dialysate, which counts toward intake. Retained exchanges prompt a check for kinks, constipation, and position."}, {"type": "sata", "stem": "Over three peritoneal dialysis exchanges, a client's drainage is 550 mL less than the total instilled. Which actions should the nurse take? Select all that apply.", "options": ["Check the tubing for kinks and closed clamps", "Ask when the client last had a bowel movement", "Notify the provider of possible fluid retention", "Add the 550 mL to the client's urine output total", "Switch the next bag to 4.25% dextrose without an order"], "answers": [0, 1, 2], "why": "A drainage deficit of 500 mL or more over several exchanges is evaluated for fluid retention and reported; kinks, clamps, and constipation are common mechanical causes of poor outflow. Dialysate is never recorded as urine output, and changing dextrose strength requires a provider order."}]});

{"id":"elim-abg","title":"ABG Review & Compensation","kicker":"Normal values, who compensates for whom, and acute (uncompensated) vs. chronic (compensated)","blocks":[{"p":"The lungs and the kidneys are the body's two acid–base regulators. When the kidneys fail, they can no longer excrete acid or make bicarbonate, so metabolic acidosis is an expected finding in renal failure — and the lungs will try to make up for it."},{"h":"Normal values"},{"table":{"head":["Value","Normal range","What it represents"],"rows":[["<strong>pH</strong>","<strong>7.35–7.45</strong> (absolute normal is <strong>7.40</strong>)","Below 7.35 = acidosis; above 7.45 = alkalosis"],["<strong>PaCO<sub>2</sub></strong>","35–45 mmHg","The <strong>acid</strong> — controlled by the lungs (respiratory). Because CO<sub>2</sub> is an acid, the ends of its range are reversed: <strong>above 45 = acidotic</strong>, <strong>below 35 = alkalotic</strong>"],["<strong>HCO<sub>3</sub></strong>","22–26 mEq/L","The <strong>base</strong> — controlled by the kidneys (metabolic). <strong>Below 22 = acidotic</strong>, <strong>above 26 = alkalotic</strong>"],["<strong>PaO<sub>2</sub></strong>","80–100 mmHg","Oxygenation. Low = <strong>hypoxemia</strong>; high = usually oxygen therapy"],["<strong>SaO<sub>2</sub></strong>","95–100%","Oxygen saturation. Low = hypoxemia"]]}},{"p":"The body always tries to compensate to get back to <strong>7.40</strong>. Carbon dioxide and bicarbonate will fluctuate to make this happen."},{"h":"Who compensates, and how fast"},{"table":{"head":["System","Controls","Speed","How it compensates"],"rows":[["<strong>Lungs (respiratory)</strong>","CO<sub>2</sub> (acid)","<strong>Fast</strong> — within minutes to hours","Breathe <strong>fast</strong> to blow off CO<sub>2</sub> (raises pH); breathe <strong>slow</strong> to retain CO<sub>2</sub> (lowers pH)"],["<strong>Kidneys (metabolic)</strong>","HCO<sub>3</sub> (base)","<strong>Slow</strong> — may take days","Make <strong>more</strong> HCO<sub>3</sub> (raises pH); make <strong>less</strong> HCO<sub>3</sub> (lowers pH)"]]}},{"hook":"Kussmaul respirations — deep, rapid breathing — in a patient with renal failure or DKA are the lungs compensating for metabolic acidosis by blowing off CO<sub>2</sub>. In a renal patient, expect the pH to be low (below 7.35). That breathing pattern is a cue, not the primary problem."},{"h":"Uncompensated, partially compensated, fully compensated"},{"table":{"head":["","Uncompensated (acute)","Partially compensated","Fully compensated (chronic)"],"rows":[["<strong>pH</strong>","<strong>Abnormal</strong>","<strong>Still abnormal</strong>","<strong>Normal</strong> (7.35–7.45)"],["<strong>CO<sub>2</sub> and HCO<sub>3</sub></strong>","Only <strong>one</strong> is abnormal; the other is normal (or close to it)","<strong>All three values</strong> are abnormal","<strong>Both</strong> are abnormal"],["<strong>Why</strong>","One system is causing the problem, and the other hasn't started fixing it yet","The opposing system has started to help, but hasn't finished","The opposing system has pushed the pH back into range, but is working hard to hold it there"]]}},{"h":"Pattern tables"},{"table":{"head":["Uncompensated","pH","PaCO<sub>2</sub>","HCO<sub>3</sub>"],"rows":[["Respiratory acidosis","↓ Low (acid)","<strong>↑ High (acid)</strong>","Normal"],["Respiratory alkalosis","↑ High (alk)","<strong>↓ Low (alk)</strong>","Normal"],["Metabolic acidosis","↓ Low (acid)","Normal","<strong>↓ Low (acid)</strong>"],["Metabolic alkalosis","↑ High (alk)","Normal","<strong>↑ High (alk)</strong>"]]}},{"table":{"head":["Partially compensated","pH","PaCO<sub>2</sub>","HCO<sub>3</sub>"],"rows":[["Respiratory acidosis","↓ Low","<strong>↑ High (cause)</strong>","↑ High (fixing)"],["Respiratory alkalosis","↑ High","<strong>↓ Low (cause)</strong>","↓ Low (fixing)"],["Metabolic acidosis","↓ Low","↓ Low (fixing)","<strong>↓ Low (cause)</strong>"],["Metabolic alkalosis","↑ High","↑ High (fixing)","<strong>↑ High (cause)</strong>"]]}},{"table":{"head":["Fully compensated","pH","PaCO<sub>2</sub>","HCO<sub>3</sub>"],"rows":[["Respiratory acidosis","Normal (low side, 7.35–7.39)","<strong>↑ High</strong>","↑ High"],["Respiratory alkalosis","Normal (high side, 7.41–7.45)","<strong>↓ Low</strong>","↓ Low"],["Metabolic acidosis","Normal (low side, 7.35–7.39)","↓ Low","<strong>↓ Low</strong>"],["Metabolic alkalosis","Normal (high side, 7.41–7.45)","↑ High","<strong>↑ High</strong>"]]}},{"hook":"Worked example of partial compensation: pH 7.31 (acid), CO<sub>2</sub> 50 (acid), HCO<sub>3</sub> 28 (base). The pH is still abnormal, and all three values are abnormal. High CO<sub>2</sub> matches the acidosis, so this is respiratory acidosis — and the kidneys are partially compensating by raising HCO<sub>3</sub>."},{"h":"Reading a compensated gas — finding the \"problem child\""},{"list":["Look at which end of the scale the pH is closer to. Below 7.40 = the underlying problem is <strong>acidosis</strong>; above 7.40 = the underlying problem is <strong>alkalosis</strong>","You will <strong>never</strong> have a compensated problem with a pH right smack in the middle — it will always lean toward one end or the other","In a compensation situation, HCO<sub>3</sub> and CO<sub>2</sub> will <strong>both</strong> be high or <strong>both</strong> be low together","Too much base (high HCO<sub>3</sub>) or too little acid (low CO<sub>2</sub>) = <strong>alkalosis</strong>","Too much acid (high CO<sub>2</sub>) or too little base (low HCO<sub>3</sub>) = <strong>acidosis</strong>","Whichever value <em>matches</em> the direction of the pH is the problem child (the cause); the other value is the compensation"]},{"h":"Step-by-step method"},{"list":["<strong>Step 1 — pH:</strong> acidosis (&lt;7.35), alkalosis (&gt;7.45), or normal? If normal, note whether it leans below or above 7.40","<strong>Step 2 — CO<sub>2</sub>:</strong> is it high (acid excess), low (acid deficit), or normal?","<strong>Step 3 — HCO<sub>3</sub>:</strong> is it high (base excess), low (base deficit), or normal?","<strong>Step 4 — match:</strong> which value explains the pH direction? That names the disorder — respiratory if CO<sub>2</sub>, metabolic if HCO<sub>3</sub>","<strong>Step 5 — compensation:</strong> if the other value is normal = uncompensated; if all three are abnormal = partially compensated; if both are abnormal and pH is normal = fully compensated"]},{"hook":"ROME: <strong>R</strong>espiratory <strong>O</strong>pposite (pH and CO<sub>2</sub> move in opposite directions — pH down, CO<sub>2</sub> up in respiratory acidosis), <strong>M</strong>etabolic <strong>E</strong>qual (pH and HCO<sub>3</sub> move in the same direction — pH down, HCO<sub>3</sub> down in metabolic acidosis)."},{"h":"Causes and priority treatment for each imbalance"},{"table":{"head":["Imbalance","The problem","Common causes","Priority treatment"],"rows":[["<strong>Respiratory acidosis</strong> (CO<sub>2</sub> ↑)","Lungs are retaining CO<sub>2</sub> (hypoventilation)","COPD, asthma, <strong>opioid overdose</strong>, pneumonia, oversedation","<strong>Improve ventilation</strong> — oxygen, incentive spirometry, naloxone (Narcan) if opioid-induced, BiPAP or intubation"],["<strong>Respiratory alkalosis</strong> (CO<sub>2</sub> ↓)","Lungs are blowing off CO<sub>2</sub> (hyperventilation)","Anxiety/panic attack, pain, fever, high altitude","<strong>Slow the breathing</strong> — paper bag breathing, treat pain and anxiety"],["<strong>Metabolic acidosis</strong> (HCO<sub>3</sub> ↓)","Kidneys losing bicarbonate or retaining acid","<strong>Renal failure (AKI/CKD)</strong>, severe diarrhea, DKA (ketones)","<strong>Fix the cause</strong> — dialysis (renal), insulin (DKA), antidiarrheals"],["<strong>Metabolic alkalosis</strong> (HCO<sub>3</sub> ↑)","Stomach losing acid","Vomiting, NG suctioning, antacid overuse","<strong>Stop the loss</strong> — antiemetics, stop suctioning, replace electrolytes (K⁺)"]]}},{"hook":"Acidosis and potassium travel together. In acidosis, hydrogen ions move into cells and potassium moves out into the blood — so a patient in renal failure with metabolic acidosis is doubly at risk for hyperkalemia. Correcting the acidosis (for example, with sodium bicarbonate) pushes potassium back into cells."}],"check":{"stem":"An ABG shows pH 7.37, PaCO₂ 72, HCO₃ 36. How should the nurse interpret this result?","options":["Uncompensated respiratory acidosis","Compensated respiratory acidosis","Compensated metabolic alkalosis","Uncompensated metabolic alkalosis"],"answer":1,"why":"The pH is normal, so the gas is compensated. It leans toward the acid side (below 7.40), so the underlying problem is acidosis. A high CO₂ explains acidosis, so the lungs are the problem child; the high HCO₃ is the kidneys compensating."}},
{"id":"elim-abg-practice","title":"ABG Practice Set — Worked Answers","kicker":"The eight practice gases from the ABG review, worked step by step","blocks":[{"p":"Each gas below is worked using the same five steps: pH direction → CO<sub>2</sub> → HCO<sub>3</sub> → which value matches → is the other value normal or abnormal. Normal ranges: pH 7.35–7.45, CO<sub>2</sub> 35–45, HCO<sub>3</sub> 22–26."},{"h":"Set 1 — compensated or uncompensated?"},{"table":{"head":["#","pH","CO<sub>2</sub>","HCO<sub>3</sub>","Interpretation","Why"],"rows":[["1","7.22","72","23","<strong>Uncompensated respiratory acidosis</strong>","pH is acidotic; CO<sub>2</sub> is high (acid excess) and matches; HCO<sub>3</sub> is normal, so the kidneys haven't compensated yet"],["2","7.30","42","6","<strong>Uncompensated metabolic acidosis</strong>","pH is acidotic; HCO<sub>3</sub> is very low (base deficit) and matches; CO<sub>2</sub> is normal, so the lungs haven't compensated yet"],["3","7.50","25","23","<strong>Uncompensated respiratory alkalosis</strong>","pH is alkalotic; CO<sub>2</sub> is low (acid deficit) and matches; HCO<sub>3</sub> is normal"],["4","7.48","41","35","<strong>Uncompensated metabolic alkalosis</strong>","pH is alkalotic; HCO<sub>3</sub> is high (base excess) and matches; CO<sub>2</sub> is normal"]]}},{"h":"Set 2 — compensated or uncompensated, and who is causing the problem?"},{"table":{"head":["#","pH","CO<sub>2</sub>","HCO<sub>3</sub>","Interpretation","Why"],"rows":[["5","7.37","72","36","<strong>Compensated respiratory acidosis</strong>","pH is normal but leans acid (below 7.40); both values abnormal = compensated. High CO<sub>2</sub> causes acidosis → the <strong>lungs</strong> are the problem child; the kidneys raised HCO<sub>3</sub> to compensate"],["6","7.38","15","6","<strong>Compensated metabolic acidosis</strong>","pH is normal but leans acid; both values low together = compensated. Low HCO<sub>3</sub> causes acidosis → the <strong>kidneys</strong> are the problem child; the lungs blew off CO<sub>2</sub> to compensate (the pattern expected in renal failure)"],["7","7.42","25","18","<strong>Compensated respiratory alkalosis</strong>","pH is normal but leans alkaline (above 7.40); both values low. Low CO<sub>2</sub> causes alkalosis → the <strong>lungs</strong> are the problem child; the kidneys dropped HCO<sub>3</sub> to compensate"],["8","7.43","50","35","<strong>Compensated metabolic alkalosis</strong>","pH is normal but leans alkaline; both values high. High HCO<sub>3</sub> causes alkalosis → the <strong>kidneys</strong> are the problem child; the lungs retained CO<sub>2</sub> to compensate"]]}},{"hook":"In a compensated gas, the two abnormal values always point in the same direction (both high or both low), so they can't tell you the diagnosis by themselves. The pH's lean — even a tiny one like 7.38 vs. 7.42 — is what breaks the tie."},{"h":"Connecting the practice gases to patients"},{"list":["Gas 1 (7.22 / 72 / 23) fits a patient who was suddenly oversedated with opioids — acute hypoventilation, no time for the kidneys to respond","Gas 5 (7.37 / 72 / 36) fits a patient with long-standing COPD — the CO<sub>2</sub> has been high for so long that the kidneys have fully compensated","Gas 2 (7.30 / 42 / 6) and Gas 6 (7.38 / 15 / 6) both show the severe bicarbonate loss of kidney failure — Gas 6 is what it looks like once the lungs have caught up with Kussmaul breathing","Gas 4 (7.48 / 41 / 35) fits a patient with prolonged vomiting or NG suction — acid lost from the stomach"]}],"check":{"stem":"An ABG shows pH 7.38, PaCO₂ 15, HCO₃ 6. Which system is causing the problem?","options":["The lungs — this is compensated respiratory alkalosis","The kidneys — this is compensated metabolic acidosis","The lungs — this is uncompensated respiratory acidosis","Neither — both values are compensating for each other equally"],"answer":1,"why":"The pH is normal but below 7.40, so the underlying problem is acidosis. A low HCO₃ causes acidosis, so the kidneys (metabolic) are the problem child; the very low CO₂ is the lungs compensating."}},

Object.assign(QUIZ, {"elim-abg":[{"stem":"Which statement about compensation is correct?","options":["The kidneys compensate within minutes by changing the breathing rate","The lungs compensate quickly, within minutes to hours; the kidneys compensate slowly, over days","Both systems compensate at the same speed","Compensation only happens in metabolic disorders"],"answer":1,"why":"The lungs work fast (minutes to hours) by breathing faster or slower to adjust CO₂. The kidneys work slowly (days) by making more or less HCO₃."},{"stem":"In a fully compensated acid–base imbalance, which finding is expected?","options":["Abnormal pH with only one abnormal value","Normal pH with both CO₂ and HCO₃ abnormal","Normal pH with both CO₂ and HCO₃ normal","Abnormal pH with both values normal"],"answer":1,"why":"Chronic = compensated: the pH is normal, and both CO₂ and HCO₃ are abnormal. Acute = uncompensated: pH is abnormal, and only one value is abnormal."},{"stem":"A client in chronic kidney failure is breathing deeply and rapidly. What is the best explanation?","options":["The lungs are compensating for metabolic acidosis by blowing off CO₂","The client is developing respiratory acidosis","The kidneys are compensating for respiratory alkalosis","Fluid overload is causing metabolic alkalosis"],"answer":0,"why":"Kussmaul respirations are the lungs' fast compensation for metabolic acidosis — blowing off CO₂ (acid) raises the pH. Failing kidneys can't excrete acid or make bicarbonate."},{"stem":"An ABG shows pH 7.43, PaCO₂ 50, HCO₃ 35. How should the nurse interpret it?","options":["Compensated respiratory acidosis","Uncompensated metabolic alkalosis","Compensated metabolic alkalosis","Uncompensated respiratory acidosis"],"answer":2,"why":"pH is normal, and both values are abnormal, so the gas is compensated. The pH leans alkaline (above 7.40), and a high HCO₃ causes alkalosis, so the kidneys are the problem child; the high CO₂ is the lungs compensating."},{"type":"sata","stem":"Which statements about compensated ABGs are accurate? Select all that apply.","options":["A compensated problem will never have a pH exactly in the middle (7.40)","HCO₃ and CO₂ will both be high or both be low together","Too much base or too little acid equals alkalosis","Too much acid or too little base equals acidosis","In compensation, only one value is abnormal"],"answers":[0,1,2,3],"why":"In a compensated gas, the pH always leans to one end, HCO₃ and CO₂ move together in compensation, excess base or low acid = alkalosis, excess acid or low base = acidosis. Only one abnormal value describes an uncompensated gas."}],"elim-abg-practice":[{"type":"matrix","stem":"Classify each ABG as compensated or uncompensated.","rows":["pH 7.22 / CO₂ 72 / HCO₃ 23","pH 7.37 / CO₂ 72 / HCO₃ 36","pH 7.50 / CO₂ 25 / HCO₃ 23","pH 7.38 / CO₂ 15 / HCO₃ 6","pH 7.48 / CO₂ 41 / HCO₃ 35","pH 7.42 / CO₂ 25 / HCO₃ 18"],"cols":["Uncompensated","Compensated"],"correct":[0,1,0,1,0,1],"why":"Uncompensated gases have an abnormal pH and only one abnormal value. Compensated gases have a normal pH with both CO₂ and HCO₃ abnormal in the same direction."},{"stem":"pH 7.30, PaCO₂ 42, HCO₃ 6. What is the interpretation?","options":["Uncompensated metabolic acidosis","Compensated metabolic acidosis","Uncompensated respiratory acidosis","Compensated respiratory alkalosis"],"answer":0,"why":"The pH is acidotic, the HCO₃ is very low (base deficit), and the CO₂ is normal, so the lungs haven't compensated yet."},{"stem":"pH 7.48, PaCO₂ 41, HCO₃ 35. Which client history best fits this gas?","options":["Oversedation with opioids","Prolonged vomiting","Diabetic ketoacidosis","Chronic kidney disease"],"answer":1,"why":"This is uncompensated metabolic alkalosis — excess base. Prolonged vomiting removes stomach acid. Opioid oversedation causes respiratory acidosis, and DKA and CKD cause metabolic acidosis."},{"stem":"pH 7.42, PaCO₂ 25, HCO₃ 18. Who is causing the problem?","options":["The kidneys — metabolic acidosis","The lungs — respiratory alkalosis","The kidneys — metabolic alkalosis","The lungs — respiratory acidosis"],"answer":1,"why":"pH is normal but leans alkaline. A low CO₂ causes alkalosis, so the lungs are the problem child; the low HCO₃ is the kidneys compensating. This is compensated respiratory alkalosis."},{"stem":"pH 7.22, PaCO₂ 72, HCO₃ 23. Which nursing action is the priority?","options":["Encourage the client to breathe slowly into a paper bag","Assess airway and breathing, and stimulate/support ventilation","Give sodium bicarbonate orally","Encourage fluids to correct dehydration"],"answer":1,"why":"This is uncompensated respiratory acidosis from hypoventilation — CO₂ is being retained. The priority is airway and ventilation support. Rebreathing into a bag is for hyperventilation (respiratory alkalosis)."}],"m3-abgquiz":[{"stem":"A client's ABG shows pH 7.28, PaCO₂ 55 mmHg, HCO₃⁻ 24 mEq/L. How should the nurse interpret this result?","options":["Partially compensated respiratory acidosis","Uncompensated metabolic acidosis","Uncompensated respiratory acidosis","Fully compensated respiratory acidosis"],"answer":2,"why":"The pH is low (acidosis) and the PaCO₂ is high (acid excess), which matches — so the lungs are the cause. The HCO₃⁻ is normal, so the kidneys have not started compensating: uncompensated. Partial compensation would require a high HCO₃⁻, and full compensation a normal pH.","ref":"elim-abg-practice"},{"stem":"A client's ABG shows pH 7.25, PaCO₂ 40 mmHg, HCO₃⁻ 15 mEq/L. Which interpretation is correct?","options":["Uncompensated metabolic acidosis","Uncompensated respiratory acidosis","Partially compensated metabolic acidosis","Fully compensated metabolic acidosis"],"answer":0,"why":"The pH is low (acidosis) and the HCO₃⁻ is low (base deficit), which matches — metabolic. The PaCO₂ of 40 is normal, so the lungs have not compensated yet: uncompensated. With partial compensation the PaCO₂ would also be low.","ref":"elim-abg-practice"},{"stem":"A client's ABG shows pH 7.49, PaCO₂ 30 mmHg, HCO₃⁻ 20 mEq/L. How should the nurse interpret this result?","options":["Uncompensated respiratory alkalosis","Fully compensated respiratory alkalosis","Partially compensated metabolic acidosis","Partially compensated respiratory alkalosis"],"answer":3,"why":"The pH is high (alkalosis) and the PaCO₂ is low (acid deficit), which matches — respiratory. The HCO₃⁻ is also abnormal (low), so the kidneys have started to compensate, but the pH is still abnormal: all three values abnormal = partially compensated. It is not fully compensated because the pH is out of range.","ref":"elim-abg"},{"stem":"A client's ABG shows pH 7.50, PaCO₂ 49 mmHg, HCO₃⁻ 33 mEq/L. Which interpretation is correct?","options":["Partially compensated respiratory acidosis","Partially compensated metabolic alkalosis","Uncompensated metabolic alkalosis","Fully compensated metabolic alkalosis"],"answer":1,"why":"The pH is high (alkalosis). The HCO₃⁻ is high (base excess), which matches — metabolic. The PaCO₂ is also high because the lungs are retaining CO₂ to compensate, but the pH is still abnormal, so all three are abnormal: partially compensated. Respiratory acidosis would require a low pH.","ref":"elim-abg"},{"stem":"A client's ABG shows pH 7.36, PaCO₂ 29 mmHg, HCO₃⁻ 17 mEq/L. How should the nurse interpret this result?","options":["Fully compensated respiratory alkalosis","Partially compensated metabolic acidosis","Fully compensated metabolic acidosis","Uncompensated metabolic acidosis"],"answer":2,"why":"The pH is normal, but it leans toward the acid side (below 7.40), so the underlying problem is acidosis. A low HCO₃⁻ causes acidosis, so the kidneys are the problem child; the low PaCO₂ is the lungs compensating. Respiratory alkalosis would require the pH to lean above 7.40, and partial compensation would require an abnormal pH.","ref":"elim-abg-practice"},{"stem":"A client's ABG shows pH 7.44, PaCO₂ 48 mmHg, HCO₃⁻ 32 mEq/L. Which interpretation is correct?","options":["Fully compensated metabolic alkalosis","Fully compensated respiratory acidosis","Partially compensated metabolic alkalosis","Uncompensated respiratory acidosis"],"answer":0,"why":"The pH is normal but leans alkaline (above 7.40), so the underlying problem is alkalosis. A high HCO₃⁻ causes alkalosis, so the kidneys are the problem child; the high PaCO₂ is the lungs retaining CO₂ to compensate. Respiratory acidosis would make the pH lean below 7.40.","ref":"elim-abg-practice"},{"stem":"A client's ABG shows pH 7.35, PaCO₂ 45 mmHg, HCO₃⁻ 26 mEq/L. How should the nurse interpret this result?","options":["Uncompensated respiratory acidosis","Fully compensated respiratory acidosis","Uncompensated metabolic acidosis","Normal acid–base balance"],"answer":3,"why":"Every value sits exactly at the edge of its normal range: pH 7.35 (7.35–7.45), PaCO₂ 45 (35–45), HCO₃⁻ 26 (22–26). Boundary values count as normal, and with no abnormal PaCO₂ or HCO₃⁻ there is nothing to compensate for — this is a normal gas, not an acidosis.","ref":"ws-abg-chart"},{"stem":"A client's ABG shows pH 7.34, PaCO₂ 46 mmHg, HCO₃⁻ 26 mEq/L. Which interpretation is correct?","options":["Normal acid–base balance","Uncompensated respiratory acidosis","Partially compensated respiratory acidosis","Uncompensated metabolic acidosis"],"answer":1,"why":"The pH of 7.34 is just below 7.35 (acidosis), and the PaCO₂ of 46 is just above 45 (acid excess), so the lungs are the cause. The HCO₃⁻ of 26 is still within 22–26, so the kidneys have not compensated: uncompensated. It is not partially compensated because the HCO₃⁻ is not yet abnormal.","ref":"ws-abg-chart"},{"stem":"A client's ABG shows pH 7.45, PaCO₂ 33 mmHg, HCO₃⁻ 21 mEq/L. How should the nurse interpret this result?","options":["Partially compensated respiratory alkalosis","Fully compensated metabolic acidosis","Fully compensated respiratory alkalosis","Uncompensated respiratory alkalosis"],"answer":2,"why":"A pH of 7.45 is at the top of the normal range, so the gas is compensated, and it leans alkaline (above 7.40). A low PaCO₂ causes alkalosis, so the lungs are the problem child; the low HCO₃⁻ is the kidneys compensating. It is not partially compensated because the pH is still within 7.35–7.45.","ref":"elim-abg"},{"type":"matrix","stem":"The nurse reviews ABG results for several clients. Classify each gas by its compensation status.","rows":["pH 7.52, PaCO₂ 28, HCO₃⁻ 23","pH 7.32, PaCO₂ 52, HCO₃⁻ 29","pH 7.36, PaCO₂ 58, HCO₃⁻ 32","pH 7.53, PaCO₂ 44, HCO₃⁻ 34","pH 7.29, PaCO₂ 30, HCO₃⁻ 16","pH 7.44, PaCO₂ 31, HCO₃⁻ 20"],"cols":["Uncompensated","Partially compensated","Fully compensated"],"correct":[0,1,2,0,1,2],"why":"Uncompensated = pH abnormal with only one of PaCO₂/HCO₃⁻ abnormal (7.52/28/23 — HCO₃⁻ normal; 7.53/44/34 — PaCO₂ 44 still normal). Partially compensated = all three abnormal (7.32/52/29; 7.29/30/16). Fully compensated = pH back in range with both PaCO₂ and HCO₃⁻ abnormal (7.36/58/32; 7.44/31/20).","ref":"ws-abg-chart"},{"type":"matrix","stem":"For each ABG, identify whether the primary problem (the \"problem child\") is respiratory or metabolic.","rows":["pH 7.30, PaCO₂ 60, HCO₃⁻ 26","pH 7.47, PaCO₂ 32, HCO₃⁻ 24","pH 7.33, PaCO₂ 37, HCO₃⁻ 19","pH 7.38, PaCO₂ 24, HCO₃⁻ 14","pH 7.46, PaCO₂ 35, HCO₃⁻ 31","pH 7.43, PaCO₂ 30, HCO₃⁻ 20"],"cols":["Respiratory","Metabolic"],"correct":[0,0,1,1,1,0],"why":"The problem child is the value that matches the pH direction. 7.30/60/26: acidotic pH, high CO₂ = respiratory. 7.47/32/24: alkalotic pH, low CO₂ = respiratory. 7.33/37/19: acidotic pH, low HCO₃⁻ = metabolic. 7.38/24/14: normal pH leaning acid, low HCO₃⁻ causes acidosis = metabolic. 7.46/35/31: alkalotic pH, PaCO₂ 35 is normal, high HCO₃⁻ = metabolic. 7.43/30/20: normal pH leaning alkaline, low CO₂ causes alkalosis = respiratory.","ref":"elim-abg-practice"},{"type":"dragdrop","stem":"Sort each individual ABG value by what it indicates on its own.","items":["PaCO₂ 50 mmHg","HCO₃⁻ 19 mEq/L","PaCO₂ 30 mmHg","HCO₃⁻ 29 mEq/L","pH 7.35","PaCO₂ 45 mmHg"],"bins":["Acidosis","Alkalosis","Normal"],"correctBin":[0,0,1,1,2,2],"why":"CO₂ runs backward because it is an acid: above 45 = acidosis, below 35 = alkalosis. HCO₃⁻ reads the same direction as the imbalance: below 22 = acidosis, above 26 = alkalosis. Values right at the boundary (pH 7.35, PaCO₂ 45) are still normal.","ref":"ws-abg-chart"},{"type":"cloze","stem":"A client's ABG shows pH 7.32, PaCO₂ 52 mmHg, HCO₃⁻ 29 mEq/L. Complete the sentence.","template":"The pH indicates {0}. The PaCO₂ is {1}, and the HCO₃⁻ is {2}. The nurse interprets this gas as {3}.","blanks":[{"options":["alkalosis","acidosis","a normal acid–base state"],"correct":1},{"options":["normal","low, indicating alkalosis","high, indicating acidosis"],"correct":2},{"options":["high, indicating compensation","normal","low, indicating acidosis"],"correct":0},{"options":["uncompensated respiratory acidosis","partially compensated metabolic alkalosis","partially compensated respiratory acidosis"],"correct":2}],"why":"pH 7.32 is below 7.35 (acidosis). PaCO₂ 52 is above 45 (acid excess) and matches the pH, so the lungs are the cause. HCO₃⁻ 29 is above 26 — the kidneys are retaining base to compensate. With all three abnormal, it is partially compensated respiratory acidosis.","ref":"elim-abg"},{"type":"cloze","stem":"Complete the sentence about acid–base regulation.","template":"Using ROME, in respiratory disorders the pH and PaCO₂ move in {0} directions, while in metabolic disorders the pH and HCO₃⁻ move in {1} direction. The {2} compensate quickly, within minutes to hours, while the {3} compensate slowly and may take days.","blanks":[{"options":["the same","opposite"],"correct":1},{"options":["the same","opposite"],"correct":0},{"options":["kidneys","lungs","liver"],"correct":1},{"options":["lungs","kidneys","liver"],"correct":1}],"why":"ROME: Respiratory Opposite (pH down, CO₂ up in respiratory acidosis), Metabolic Equal (pH down, HCO₃⁻ down in metabolic acidosis). The lungs change CO₂ quickly by changing rate and depth of breathing; the kidneys adjust HCO₃⁻ slowly, over days.","ref":"elim-abg"},{"type":"ordering","stem":"Place the steps for interpreting an ABG in the correct order.","items":["Assess the pH: acidosis, alkalosis, or normal (and if normal, which side of 7.40 it leans toward)","Assess the PaCO₂: high (acid excess), low (acid deficit), or normal","Assess the HCO₃⁻: high (base excess), low (base deficit), or normal","Identify which value matches the pH direction to name the disorder as respiratory or metabolic","Determine compensation: other value normal (uncompensated), all three abnormal (partially), or pH normal with both abnormal (fully)"],"why":"Start with the pH because it defines the problem (acidosis or alkalosis), then check CO₂ (lungs) and HCO₃⁻ (kidneys). The value that matches the pH is the cause; the status of the other value, together with the pH, determines the level of compensation.","ref":"elim-abg"},{"stem":"A client with acute kidney injury has an ABG showing metabolic acidosis. Which compensatory finding should the nurse expect?","options":["Slow, shallow respirations to retain CO₂","Deep, rapid respirations to blow off CO₂","Increased renal production of bicarbonate","Retention of hydrogen ions by the lungs"],"answer":1,"why":"In metabolic acidosis, the lungs compensate by blowing off CO₂ (an acid) through deep, rapid Kussmaul respirations, which raises the pH. Slow breathing would retain acid and worsen the acidosis, and the failing kidneys are the cause, so they cannot make more bicarbonate.","ref":"elim-abg"},{"stem":"A client is found unresponsive after an opioid overdose. The ABG shows pH 7.21, PaCO₂ 70 mmHg, HCO₃⁻ 24 mEq/L. Why has this gas not compensated?","options":["The lungs compensate slowly and have not had time to respond","Opioids block the kidneys from producing bicarbonate","Respiratory acidosis cannot be compensated by any system","The kidneys compensate slowly and may take days to raise HCO₃⁻"],"answer":3,"why":"This is uncompensated respiratory acidosis from sudden hypoventilation. The kidneys are the compensating system for a respiratory problem, and they are slow — it can take days for HCO₃⁻ to rise. The lungs are the fast system, but here they are the cause, not the compensator.","ref":"elim-abg"},{"type":"sata","stem":"The nurse is reviewing acid–base compensation. Which statements are accurate? Select all that apply.","options":["The lungs compensate for metabolic disorders by changing the rate and depth of breathing","The kidneys compensate for respiratory disorders by retaining or excreting bicarbonate","In a compensated gas, PaCO₂ and HCO₃⁻ are both high or both low","The kidneys compensate faster than the lungs","A fully compensated gas will have a pH of exactly 7.40"],"answers":[0,1,2],"why":"The lungs (CO₂) compensate for metabolic problems and the kidneys (HCO₃⁻) compensate for respiratory problems, so in compensation the two values move in the same direction. The lungs are fast and the kidneys are slow, and a compensated pH always leans toward one side of 7.40 rather than sitting in the middle.","ref":"elim-abg"},{"stem":"A client with end-stage kidney disease has deep, rapid respirations. The ABG shows pH 7.30, PaCO₂ 31 mmHg, HCO₃⁻ 15 mEq/L. Which intervention addresses the underlying cause of this imbalance?","options":["Coach the client to rebreathe into a paper bag","Prepare the client for hemodialysis","Administer naloxone IV","Administer an antiemetic"],"answer":1,"why":"pH low, HCO₃⁻ low (cause), and PaCO₂ low (compensating) = partially compensated metabolic acidosis from kidney failure; the treatment is to fix the cause with dialysis. Slowing the breathing would stop the lungs' helpful compensation, naloxone treats opioid-induced respiratory acidosis, and antiemetics treat metabolic alkalosis from vomiting.","ref":"elim-abg"},{"stem":"The nurse reviews an ABG of pH 7.51, PaCO₂ 43 mmHg, HCO₃⁻ 33 mEq/L. Which client is most likely to have this result?","options":["A client with a nasogastric tube to low continuous suction for 3 days","A client with long-standing COPD","A client having a panic attack","A client with acute kidney injury"],"answer":0,"why":"pH high with a high HCO₃⁻ and a normal PaCO₂ = uncompensated metabolic alkalosis, which fits loss of stomach acid from NG suction or vomiting. COPD causes respiratory acidosis, a panic attack causes respiratory alkalosis, and kidney injury causes metabolic acidosis.","ref":"elim-abg"},{"stem":"A postoperative client using a morphine PCA has a respiratory rate of 8/min. The ABG shows pH 7.27, PaCO₂ 58 mmHg, HCO₃⁻ 25 mEq/L, PaO₂ 68 mmHg, SaO₂ 89%. What is the nurse's priority action?","options":["Administer sodium bicarbonate IV","Coach the client to breathe into a paper bag","Stop the PCA and administer naloxone as ordered","Prepare the client for dialysis"],"answer":2,"why":"This is uncompensated respiratory acidosis (pH low, PaCO₂ high, HCO₃⁻ normal) with hypoxemia (PaO₂ below 80, SaO₂ below 95%) caused by opioid-induced hypoventilation. The priority is to improve ventilation by reversing the opioid. Bicarbonate and dialysis treat metabolic acidosis, and paper-bag breathing would retain even more CO₂.","ref":"elim-abg"},{"stem":"A client is breathing rapidly, reports tingling in the fingers, and says \"I feel like I can't calm down.\" The ABG shows pH 7.50, PaCO₂ 29 mmHg, HCO₃⁻ 24 mEq/L. Which action should the nurse take first?","options":["Apply oxygen at 6 L/min by face mask","Prepare to administer sodium bicarbonate","Encourage the client to use the incentive spirometer every hour","Coach the client to slow the breathing, such as rebreathing into a paper bag"],"answer":3,"why":"pH high with a low PaCO₂ and normal HCO₃⁻ = uncompensated respiratory alkalosis from anxiety-driven hyperventilation. The priority is to slow the breathing so the client retains CO₂. Bicarbonate is a base and would worsen alkalosis, and incentive spirometry and oxygen do not correct hyperventilation.","ref":"elim-abg"},{"type":"sata","stem":"The nurse is caring for several clients. Which clients are at risk for metabolic acidosis? Select all that apply.","options":["A client with chronic kidney disease","A client with severe diarrhea for 4 days","A client with diabetic ketoacidosis","A client with prolonged vomiting","A client hyperventilating during a panic attack"],"answers":[0,1,2],"why":"Kidney failure (loss of bicarbonate and retained acid), severe diarrhea (bicarbonate loss), and DKA (ketones) all cause metabolic acidosis. Prolonged vomiting loses stomach acid and causes metabolic alkalosis; a panic attack causes respiratory alkalosis.","ref":"elim-abg"},{"type":"sata","stem":"A client with long-standing COPD has an ABG showing pH 7.36, PaCO₂ 56 mmHg, HCO₃⁻ 31 mEq/L, PaO₂ 74 mmHg, SaO₂ 92%. Which statements about this result are accurate? Select all that apply.","options":["The pH is within the normal range","The gas reflects fully compensated respiratory acidosis","The PaO₂ and SaO₂ indicate hypoxemia","The kidneys are the cause of the acid–base problem","The gas reflects an acute, uncompensated process"],"answers":[0,1,2],"why":"pH 7.36 is normal but leans acid; high PaCO₂ causes acidosis (lungs = problem child) and the high HCO₃⁻ is the kidneys compensating — fully compensated respiratory acidosis, a chronic pattern. PaO₂ below 80 and SaO₂ below 95% indicate hypoxemia. The kidneys are compensating, not causing, and a normal pH rules out an uncompensated gas.","ref":"elim-abg-practice"},{"type":"bowtie","stem":"A client with end-stage kidney disease missed two dialysis sessions. The client has deep, rapid respirations and a serum potassium of 6.1 mEq/L. The ABG shows pH 7.28, PaCO₂ 33 mmHg, HCO₃⁻ 14 mEq/L. Complete the diagram: the condition the client is most likely experiencing, 2 actions the nurse should take, and 2 parameters to monitor.","conditionOptions":["Uncompensated respiratory acidosis","Partially compensated metabolic acidosis","Fully compensated metabolic acidosis","Partially compensated respiratory alkalosis"],"correctCondition":1,"actionOptions":["Prepare the client for hemodialysis","Coach the client to rebreathe into a paper bag","Place the client on a cardiac monitor","Administer naloxone IV","Initiate nasogastric suction"],"correctActions":[0,2],"paramOptions":["Pupil size","Repeat ABG (pH and HCO₃⁻)","Stool frequency","Serum potassium and ECG rhythm","Blood glucose"],"correctParams":[1,3],"why":"pH low, HCO₃⁻ low (cause), and PaCO₂ low (lungs compensating with Kussmaul breathing) = partially compensated metabolic acidosis from missed dialysis. Dialysis fixes the cause; because acidosis shifts potassium out of cells, the client with K⁺ 6.1 needs cardiac monitoring. Monitor the repeat ABG and potassium/ECG. Paper-bag breathing would block compensation, and naloxone and NG suction treat unrelated imbalances.","ref":"elim-abg"}]});

MED_MATH.lessons.push({"id":"ws-abg-chart","title":"ABG Chart: Uncompensated, Partially & Fully Compensated","kicker":"Normal values and the arrow patterns for all four imbalances","blocks":[{"h":"ABG values"},{"table":{"head":["Test","Normal","↓ Value","↑ Value"],"rows":[["<strong>pH</strong>","7.35–7.45","Acidosis","Alkalosis"],["<strong>PaCO₂</strong>","35–45 mmHg","Alkalosis","Acidosis"],["<strong>HCO₃⁻</strong>","22–26 mEq/L","Acidosis","Alkalosis"],["<strong>PaO₂</strong>","80–100 mmHg","Hypoxemia","O₂ therapy"],["<strong>SaO₂</strong>","95–100%","Hypoxemia","—"]]}},{"hook":"PaCO₂ is the one that runs backward: CO₂ is an acid, so a <b>high</b> PaCO₂ means <b>acidosis</b> and a <b>low</b> PaCO₂ means <b>alkalosis</b>. pH and HCO₃⁻ read the same direction as the imbalance."},{"h":"Uncompensated (acute) — only one system is off"},{"table":{"head":["System","ABG","pH","PaCO₂","HCO₃⁻"],"rows":[["<strong>Lungs</strong>","<strong>Respiratory acidosis</strong>","<span style=\"color:#2e86c1;font-weight:900;font-size:1.9em;line-height:1\">↓</span>","<span style=\"color:#c0392b;font-weight:900;font-size:1.9em;line-height:1\">↑</span>","<span style=\"color:#1e8449;font-weight:700\">Normal</span>"],["<strong>Lungs</strong>","<strong>Respiratory alkalosis</strong>","<span style=\"color:#c0392b;font-weight:900;font-size:1.9em;line-height:1\">↑</span>","<span style=\"color:#2e86c1;font-weight:900;font-size:1.9em;line-height:1\">↓</span>","<span style=\"color:#1e8449;font-weight:700\">Normal</span>"],["<strong>Kidneys</strong>","<strong>Metabolic acidosis</strong>","<span style=\"color:#2e86c1;font-weight:900;font-size:1.9em;line-height:1\">↓</span>","<span style=\"color:#1e8449;font-weight:700\">Normal</span>","<span style=\"color:#2e86c1;font-weight:900;font-size:1.9em;line-height:1\">↓</span>"],["<strong>Kidneys</strong>","<strong>Metabolic alkalosis</strong>","<span style=\"color:#c0392b;font-weight:900;font-size:1.9em;line-height:1\">↑</span>","<span style=\"color:#1e8449;font-weight:700\">Normal</span>","<span style=\"color:#c0392b;font-weight:900;font-size:1.9em;line-height:1\">↑</span>"]]}},{"h":"Partially compensated — pH still abnormal, the other system has started to move"},{"table":{"head":["ABG","pH","PaCO₂","HCO₃⁻"],"rows":[["<strong>Respiratory acidosis</strong>","<span style=\"color:#2e86c1;font-weight:900;font-size:1.9em;line-height:1\">↓</span>","<span style=\"color:#c0392b;font-weight:900;font-size:1.9em;line-height:1\">↑</span>","<span style=\"color:#c0392b;font-weight:900;font-size:1.9em;line-height:1\">↑</span>"],["<strong>Respiratory alkalosis</strong>","<span style=\"color:#c0392b;font-weight:900;font-size:1.9em;line-height:1\">↑</span>","<span style=\"color:#2e86c1;font-weight:900;font-size:1.9em;line-height:1\">↓</span>","<span style=\"color:#2e86c1;font-weight:900;font-size:1.9em;line-height:1\">↓</span>"],["<strong>Metabolic acidosis</strong>","<span style=\"color:#2e86c1;font-weight:900;font-size:1.9em;line-height:1\">↓</span>","<span style=\"color:#2e86c1;font-weight:900;font-size:1.9em;line-height:1\">↓</span>","<span style=\"color:#2e86c1;font-weight:900;font-size:1.9em;line-height:1\">↓</span>"],["<strong>Metabolic alkalosis</strong>","<span style=\"color:#c0392b;font-weight:900;font-size:1.9em;line-height:1\">↑</span>","<span style=\"color:#c0392b;font-weight:900;font-size:1.9em;line-height:1\">↑</span>","<span style=\"color:#c0392b;font-weight:900;font-size:1.9em;line-height:1\">↑</span>"]]}},{"h":"Fully compensated (chronic) — pH back in range, both PaCO₂ and HCO₃⁻ abnormal"},{"table":{"head":["ABG","pH","PaCO₂","HCO₃⁻"],"rows":[["<strong>Respiratory acidosis</strong>","<span style=\"color:#1e8449;font-weight:700\">Normal</span> (7.35–7.39, acid side)","<span style=\"color:#c0392b;font-weight:900;font-size:1.9em;line-height:1\">↑</span>","<span style=\"color:#c0392b;font-weight:900;font-size:1.9em;line-height:1\">↑</span>"],["<strong>Respiratory alkalosis</strong>","<span style=\"color:#1e8449;font-weight:700\">Normal</span> (7.41–7.45, alkaline side)","<span style=\"color:#2e86c1;font-weight:900;font-size:1.9em;line-height:1\">↓</span>","<span style=\"color:#2e86c1;font-weight:900;font-size:1.9em;line-height:1\">↓</span>"],["<strong>Metabolic acidosis</strong>","<span style=\"color:#1e8449;font-weight:700\">Normal</span> (7.35–7.39, acid side)","<span style=\"color:#2e86c1;font-weight:900;font-size:1.9em;line-height:1\">↓</span>","<span style=\"color:#2e86c1;font-weight:900;font-size:1.9em;line-height:1\">↓</span>"],["<strong>Metabolic alkalosis</strong>","<span style=\"color:#1e8449;font-weight:700\">Normal</span> (7.41–7.45, alkaline side)","<span style=\"color:#c0392b;font-weight:900;font-size:1.9em;line-height:1\">↑</span>","<span style=\"color:#c0392b;font-weight:900;font-size:1.9em;line-height:1\">↑</span>"]]}},{"hook":"Same arrows, different pH. The PaCO₂ and HCO₃⁻ arrows look identical in partial and full compensation — the <b>pH</b> is what tells them apart. Abnormal pH = partial; normal pH = full. <b>Acute = uncompensated</b> (pH abnormal, only one value off); <b>chronic = compensated</b> (pH normal, both values off). To name the original problem in full compensation, look at which side of 7.40 the pH leans toward."},{"p":"<strong>ROME:</strong> <strong>R</strong>espiratory <strong>O</strong>pposite — pH and PaCO₂ arrows point in opposite directions. <strong>M</strong>etabolic <strong>E</strong>qual — pH and HCO₃⁻ arrows point in the same direction."}]});
