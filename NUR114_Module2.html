{ id:"iis-immunity-cells", title:"Immunity Types & the Cells That Carry It Out", kicker:"Four kinds of immunity, and which cell does what",
  blocks:[
   {p:"Before the specific inflammatory and autoimmune conditions in this section make sense, it helps to have the underlying immune vocabulary straight — both how immunity is acquired and which cell lineages are doing the work."},
   {h:"Four types of immunity"},
   {table:{head:["Type","How it's acquired"],rows:[
     ["Natural active","The body is exposed to a pathogen and produces its own antibodies in response (having and recovering from an actual infection)"],
     ["Natural passive","Antibodies are transferred from one person to another naturally, without the receiving person's own immune system producing them (maternal antibodies crossing the placenta or passing through breast milk)"],
     ["Artificial active","The body produces its own antibodies in response to a deliberately administered antigen (a vaccine)"],
     ["Artificial passive","Premade antibodies are administered directly (an immunoglobulin injection), giving immediate but temporary protection since the person's own immune system never had to build the response"]]}},
   {p:"\"Active\" always means the person's own immune system is doing the antibody manufacturing (whether triggered by natural infection or a vaccine); \"passive\" always means the antibodies came from somewhere else and the protection fades once those borrowed antibodies degrade."},
   {h:"Where immune cells come from"},
   {p:"All immune cells trace back to a single stem cell in the bone marrow, which branches into two major lines. The <strong>lymphoid</strong> line produces lymphocytes: B cells (which mature into antibody-producing plasma cells and long-lived memory cells), T cells (which branch further into helper T, cytotoxic T, and suppressor/regulatory T cells), and natural killer cells. The <strong>myeloid</strong> line produces granulocytes (neutrophils, eosinophils, basophils, and mast cells) along with monocytes, which themselves mature into macrophages and dendritic cells."},
   {h:"Three functional categories"},
   {table:{head:["Category","Cells","What they do"],rows:[
     ["Phagocytic","Neutrophils, macrophages, monocytes, eosinophils, basophils","Engulf and destroy pathogens directly — the immune system's cleanup crew"],
     ["Humoral","B cells, plasma cells, and the antibody classes IgA, IgM, IgG, IgE, IgD, plus memory cells","Antibody-based immunity: a B cell that encounters an antigen differentiates into an antibody-producing plasma cell and a long-lived memory cell that allows a faster response on re-exposure"],
     ["Cell-mediated","Helper T (CD4) cells, suppressor/regulatory T cells, cytotoxic T cells, natural killer cells","Direct cell-to-cell immune action: helper T cells coordinate the broader immune response, cytotoxic T cells and NK cells kill infected or abnormal cells directly, and suppressor/regulatory T cells dial the response back down once the threat has passed"]]}},
   {hook:"CD4 is the marker worth remembering on sight: helper T cells are also called CD4 cells, and CD4 count is exactly what's tracked to stage HIV/AIDS progression later in this section — the same cell type shows up again as the one HIV specifically targets and destroys."},
   {h:"The five immunoglobulin classes"},
   {table:{head:["Class","% of total Ig","Key role"],rows:[
     ["IgG","75%","In serum and tissue; the major player in bloodborne and tissue infections; activates complement; the only class that crosses the placenta"],
     ["IgA","15%","In secretions (saliva, tears, breast milk, mucus); protects the respiratory/GI/GU tracts and passes to a nursing infant for protection"],
     ["IgM","10%","Mostly intravascular; the first immunoglobulin produced in a new infection; activates complement"],
     ["IgD","0.2%","Small serum amounts; role in B-cell differentiation is not fully understood"],
     ["IgE","0.004%","Drives allergic and hypersensitivity reactions (the antibody behind Type I reactions in the next lesson); also fights parasitic infections"]]}},
   {h:"Complement — the amplification system behind antibody binding"},
   {p:"Complement is a group of circulating plasma proteins, made in the liver, that activate in a cascade once an antibody binds its antigen. Antibody-antigen binding alone doesn't destroy an invader — it also takes complement activation, arrival of killer T cells, or recruitment of macrophages. Complement can be triggered through three pathways (classic — antibody-triggered; lectin — a plasma protein binding microbial sugars; alternative — direct activation on a microbial surface) and, once active, increases blood vessel permeability, attracts phagocytes to the site, and can directly lyse cells. This is highly useful but a double-edged sword: chronic or inappropriate complement activation is part of the mechanism behind many autoimmune diseases and chronic inflammation."},
   {h:"Factors that affect immune function — what the health history screens for"},
   {list:[
    "<strong>Age (immunosenescence)</strong> — aging brings impaired B- and T-lymphocyte function, decreased antibody production, reduced phagocytic response, and a failing ability to distinguish self from non-self — the net effect is more infections, more cancer, more autoimmune disease, and often blunted or absent classic signs/symptoms of infection and inflammation in an older adult",
    "<strong>Nutrition</strong> — protein depletion causes lymphoid tissue atrophy, reduced antibody response, fewer circulating T cells, and impaired phagocytosis; specific micronutrient deficiencies (zinc in particular) are also linked to impaired immune function",
    "<strong>Gender/hormones</strong> — estrogen tends to enhance immunity while androgens tend to be immunosuppressive, which helps explain why autoimmune diseases are more common in females",
    "<strong>Genetics</strong> — a number of immunodeficiency and autoimmune disorders have known or suspected genetic/inheritance patterns, so a three-generation family history (both maternal and paternal sides) is part of a thorough immune assessment"]},
   {h:"Assessing for immune dysfunction, by system"},
   {p:"A focused immune assessment watches for cues across every system: respiratory (rate changes, cough, wheezing/crackles/rhonchi, rhinitis, bronchospasm), cardiovascular (hypotension, tachycardia, arrhythmia, vasculitis, anemia), gastrointestinal (hepatosplenomegaly, colitis, vomiting, diarrhea), genitourinary (frequency/burning, hematuria, discharge), musculoskeletal (joint mobility, edema, pain), skin (rashes, lesions, dermatitis, hematomas/purpura, edema/urticaria), and neurosensory (cognitive dysfunction, hearing/vision changes, headaches, ataxia, tetany). The health history itself also screens broadly: nutritional status, infection and immunization history, allergies, known autoimmune/neoplastic/chronic disease, surgeries, medications, and blood transfusions."}
  ],
  check:{stem:"A patient receives a vaccine and, over the following two weeks, produces their own antibodies against the antigen in it. Which type of immunity does this represent?",
   options:["Natural active","Natural passive","Artificial active","Artificial passive"],
   answer:2,
   why:"A vaccine is a deliberately administered antigen, and the person's own immune system manufactures the antibody response — that combination (deliberate exposure + the person's own antibody production) defines artificial active immunity."}
},
{ id:"iis-hypersensitivity", title:"Hypersensitivity Reactions & Allergies", kicker:"Four types, one timeline each, how each reaction actually presents, and the full medication lineup",
  blocks:[
   {p:"A hypersensitivity reaction is an undesirable reaction associated with an immune response acting against foreign antigens or an organism's own tissue — sometimes a genuine threat overreacted to, and sometimes a harmless substance (a food, a medication, pollen, latex) mistakenly treated as dangerous. There are four classically described types, and each has its own mediator, onset timeline, and hallmark example."},
   {table:{head:["Type","Mediator","Onset","Example"],rows:[
     ["Type I","IgE-mediated (mast cell degranulation)","Within 1 hour","Anaphylaxis"],
     ["Type II","IgG or IgM cytotoxic","Hours to days","Hemolytic anemia, hemolytic transfusion reaction, Goodpasture's syndrome"],
     ["Type III","Immune complex-mediated (with complement activation)","1–3 weeks","Serum sickness, SLE"],
     ["Type IV","T-cell-mediated (cytokine-driven, not antibody-driven)","Days to weeks","Contact rash, Stevens-Johnson syndrome"]]}},
   {p:"Type I is the one to recognize fastest in practice: it's IgE-driven, it happens within minutes to an hour of exposure, and it's the mechanism behind everything from a mosquito bite reaction to a full anaphylactic emergency — the same mechanism, just different severity and extent. Type IV stands out mechanistically, since it's driven by T cells and cytokines rather than antibodies at all, which is why it has the slowest onset of the four."},
   {h:"How Type I reactions actually present"},
   {list:[
    "<strong>Localized anaphylactic reaction</strong> — a pale, edematous wheal on the skin that contains fluid and is surrounded by a red flare; the classic example is a mosquito bite",
    "<strong>Systemic anaphylactic reaction</strong> — starts as edema and pruritus at the exposure site, then progresses to bronchiole constriction, airway obstruction, and shock — this is the life-threatening version and a medical emergency requiring rapid, advanced care",
    "<strong>Atopic reactions</strong> — a family of chronic, allergen-driven presentations rather than a single acute event (broken out below)"]},
   {h:"Anaphylaxis severity — a staged progression"},
   {p:"The faster the onset after exposure, the more severe the reaction tends to be — and prior reaction severity does <em>not</em> predict how severe the next exposure's reaction will be. <strong>Mild</strong> reactions bring peripheral tingling, warmth, fullness in the mouth/throat, nasal congestion, periorbital swelling, and tearing, usually within the first 2 hours of exposure. <strong>Moderate</strong> reactions add flushing, anxiety, itching, and — more seriously — bronchospasm and airway/laryngeal edema with dyspnea, cough, and wheezing. <strong>Severe</strong> reactions (anaphylactic shock) progress rapidly to laryngeal edema, severe dyspnea, cyanosis, and hypotension, plus dysphagia, abdominal cramping, vomiting, diarrhea, and seizures — cardiac arrest and coma can follow."},
   {h:"Common causes of anaphylaxis"},
   {list:[
    "<strong>Foods</strong> — peanuts, tree nuts (walnuts, pecans, cashews, almonds), shellfish (shrimp, lobster, crab), fish, milk, eggs, soy, wheat",
    "<strong>Medications</strong> — antibiotics (especially penicillin and sulfa drugs), allopurinol, radiocontrast agents, anesthetic agents (lidocaine, procaine), vaccines, hormones (insulin, vasopressin, ACTH), aspirin, NSAIDs — <strong>antibiotics and radiocontrast agents cause the most serious anaphylactic reactions</strong>, and penicillin is the most common medication trigger overall (about 10% of the population reports a penicillin allergy, though less than 5% have a clinically significant IgE- or T-cell-mediated allergy)",
    "<strong>Other pharmaceutical/biologic agents</strong> — animal serums (tetanus antitoxin, snake venom antitoxin, rabies antitoxin), antigens used in skin testing",
    "<strong>Insect stings</strong> — bees, wasps, hornets, yellow jackets, ants (including fire ants) — the Hymenoptera family causes the most common serious sting-related allergic reactions",
    "<strong>Latex</strong> — medical and nonmedical products containing latex"]},
   {p:"A closely related but distinct entity is an <strong>anaphylactoid reaction</strong> — it looks like anaphylaxis and is treated the same way, but it's triggered by non-IgE-mediated mast cell/basophil degranulation (from medications, food, exercise, or cytotoxic transfusions) rather than a true allergic mechanism. It's rarely fatal, but the nurse's response to it is identical to true anaphylaxis."},
   {h:"The atopic reactions"},
   {table:{head:["Reaction","Presentation"],rows:[
     ["Hay fever","Sneezing, nasal drainage, swelling of the nasal mucosa that can obstruct the airway, itching around the eyes and throat, excessive tearing"],
     ["Asthma reaction","Wheezing, chest tightness, thick sputum production, dyspnea"],
     ["Atopic dermatitis","Edematous skin lesions that contain vesicles"],
     ["Angioedema","Swelling starts in the face and progresses to other parts of the body; lesions the client describes as itching, burning, or stinging"],
     ["Urticaria (hives)","Raised, edematous, pink areas on the body that the client describes as itching"]]}},
   {h:"Type II and beyond"},
   {p:"A <strong>Type II hypersensitivity reaction</strong> shows up clinically as kidney injury, pulmonary hemorrhage (Goodpasture's syndrome), and hemolytic blood transfusion reactions — antibodies attacking cells or tissue directly, rather than forming circulating complexes the way Type III does (the mechanism behind SLE, covered in its own lesson). A reaction can also occur in response to immunotherapy itself once allergen injections have been initiated, which is exactly why immunotherapy sessions include a monitored observation period after each injection."},
   {hook:"Next Gen-style scenario worth knowing cold: a client sustains a hemolytic blood reaction from incorrect blood administration. This is a Type II hypersensitivity reaction — think ABO/Rh incompatibility. Expected cues include fever, chills, low back pain, flank pain, hypotension, tachycardia, and hemoglobinuria; the nurse's first action is always to stop the transfusion immediately, keep the IV line open with normal saline, and notify the provider — then send the remaining blood/tubing back to the blood bank per policy. The whole scenario is also a teaching moment on prevention: the two-nurse patient/blood product verification check at the bedside exists specifically to prevent this reaction."},
   {h:"Diagnosing an allergy: skin testing"},
   {list:[
    "<strong>Patch test</strong> — the allergen is placed on a patch applied to the skin; the reaction is delayed because the patch must be worn for 48–72 hours",
    "<strong>Scratch or prick test</strong> — the allergen is placed on the skin and a pricking device allows it to enter; a reaction appears in 5–10 minutes",
    "<strong>Intradermal test</strong> — the allergen is injected under the skin; a reaction appears in about 10 minutes",
    "<strong>A wheal-and-flare response</strong> to any of these tests indicates a positive reaction"]},
   {p:"Other diagnostic cues: sputum, nasal, and bronchial secretions showing eosinophils; a pulmonary function test showing deteriorated functioning; a CBC with white blood cell differential pointing toward immunodeficiency; and elevated total serum IgE, which supports the diagnosis since most allergic reactions are IgE-mediated. <strong>Before skin testing</strong>, antihistamines and corticosteroids (including OTC allergy medications) must be stopped 48–96 hours beforehand since they suppress skin test reactivity and would produce a false negative; testing is never performed during active bronchospasm, and emergency equipment must be on hand in case the test itself triggers a reaction."},
   {h:"Priority nursing interventions"},
   {list:[
    "Ensure all allergies are documented on the health record — medications, food, latex, and anything else",
    "Use latex-free gloves and supplies for any client with a latex allergy",
    "Provide prescribed pre-treatments as indicated before selected procedures, medications, or treatments",
    "Administer antihistamines, decongestants, anti-itch medications, corticosteroids, and leukotriene receptor antagonists as ordered",
    "Treat skin rashes and manage anaphylactic shock as needed",
    "For immunotherapy: rotate injection sites, and observe the client for 20–30 minutes after each injection to catch any adverse reaction",
    "Never leave a client alone during allergy skin testing — some clients are highly sensitive and can develop an anaphylactic reaction to the test itself",
    "Be aware that hypersensitivity responses can intensify with repeated exposure to the same allergen, not just the first one",
    "During an active anaphylactic reaction: assess airway, breathing, and vital signs first; notify the rapid response team/provider promptly; give epinephrine (1:1000 dilution, subcutaneous, upper extremity or thigh, may be followed by a continuous IV infusion) — antihistamines and corticosteroids are adjuncts and should never be substituted for epinephrine; give supplemental oxygen and IV fluids (normal saline, volume expanders, vasopressors) to support hemodynamics; older adults and those with hypertension, arteriopathy, or ischemic heart disease are at higher risk for adverse effects from epinephrine",
    "After epinephrine, transport/observe the patient in an ED-level setting — a <strong>biphasic (\"rebound\") reaction</strong> can occur 4–8 hours after the initial reaction, and longer observation is warranted for anyone who ingested the allergen, needed more than one epinephrine dose, had hypotension or pharyngeal edema, or has a history of asthma",
    "For insect-sting allergy, <strong>venom immunotherapy</strong> is used as a control measure (not a cure) to reduce systemic reaction risk; for penicillin or insulin allergy in a patient who needs the drug, <strong>desensitization</strong> (controlled anaphylaxis with gradual mediator release) may be used — patients must avoid lapses in therapy afterward, since a gap can let the allergic reaction reappear"]},
   {h:"Priority complications"},
   {list:["Anaphylactic shock","Soft tissue angioedema","Comorbidity with asthma and sinusitis"]},
   {h:"Priority medications"},
   {list:[
    "<strong>Diphenhydramine</strong> — oral/IV antihistamine for urticaria and allergic rhinitis; given together with famotidine (an H2 receptor blocker) and IV methylprednisolone for an emergent allergic reaction; causes drowsiness",
    "<strong>Pramoxine/calamine</strong> — topical antipruritic lotion; do not use on broken skin",
    "<strong>Epinephrine</strong> — subcutaneous, IM, or IV; a sympathomimetic drug for anaphylaxis that causes bronchodilation and stimulates heart rate; don't use if the solution is cloudy or contains particles; available in self-injector pens for clients at risk for allergic/anaphylactic reactions",
    "<strong>Pseudoephedrine</strong> — oral/nasal decongestant for allergic rhinitis; should not be used more than 2–3 days to avoid rebound congestion (some agents may be used long-term depending on the specific drug)",
    "<strong>Montelukast, zafirlukast</strong> — oral leukotriene receptor antagonists that block leukotriene-driven airway edema, bronchoconstriction, and mucus production",
    "<strong>Ketotifen, olopatadine, azelastine, cromolyn</strong> — nasal, oral, or inhaled (depending on the agent) mast cell stabilizers that inhibit the release of histamine and leukotriene to treat allergic rhinitis",
    "<strong>Flonase, Beconase, Nasocort, Rhinocort</strong> — nasal corticosteroids to treat allergic rhinitis; may be used long-term without rebound congestion risk, depending on the specific agent",
    "<strong>Immunotherapy</strong> — subcutaneous, titrated amounts of allergen; takes 1–2 years to reach maximum effect, with injections given at a clinic or provider's office; a home-based sublingual alternative exists, administered until hyposensitivity is achieved; used when usual drug therapy is ineffective or the client cannot avoid the allergen"]},
   {h:"Priority teaching/discharge needs"},
   {list:[
    "Avoid the allergen; observe for signs and symptoms of a hypersensitivity reaction",
    "How to administer prescribed medications, including nasal sprays",
    "The potential for a delayed reaction to immunotherapy injections, and what to do if a reaction occurs",
    "Seek medical assistance at the first sign of anaphylaxis",
    "Report all allergies at every health care visit, including latex"]},
   {h:"Using an epinephrine auto-injector"},
   {p:"Patient education on the auto-injector follows three steps worth walking through explicitly, since a patient or caregiver may need to do this under extreme stress: slide the device out of its carrying case, pull off the blue safety cap (never put a thumb over the orange needle end while doing this), and push the orange needle end firmly against the outer thigh until it clicks, holding it in place for the several seconds specified on the device before removing it."}
  ],
  check:{stem:"A nurse is administering a unit of packed red blood cells and the client suddenly develops fever, chills, and low back pain within minutes of the transfusion starting. What is the nurse's priority action, and which hypersensitivity mechanism is responsible?",
   options:["Slow the infusion rate and continue monitoring; this is a Type I, IgE-mediated reaction","Stop the transfusion immediately, keep the IV line open with normal saline, and notify the provider; this is a Type II, cytotoxic hemolytic reaction","Administer diphenhydramine and continue the transfusion; this is a Type IV, T-cell-mediated reaction","Document the finding and reassess in one hour; this is a Type III, immune complex-mediated reaction"],
   answer:1,
   why:"A hemolytic blood transfusion reaction is a Type II hypersensitivity reaction (cytotoxic antibody attack on the transfused cells), and it requires immediately stopping the transfusion, keeping the line open with normal saline, and notifying the provider — not slowing the rate or continuing."}
},
{ id:"iis-lupus", title:"Systemic Lupus Erythematosus", kicker:"A multisystem autoimmune disease with a signature facial rash — and a genuinely long medication list",
  blocks:[
   {p:"Systemic lupus erythematosus (SLE) is a chronic, progressive autoimmune disease that causes failure of major organ systems — the immune system attacks the body's own tissue, and because there's no single target organ, its symptom list looks scattered until it's organized by system."},
   {h:"Epidemiology, pathophysiology, and triggers"},
   {p:"SLE occurs 4–12 times more often in females than males. The disease starts when the immune system mistakenly recognizes components of the cell's nucleus as a foreign antigen; B cells overproduce antibodies with help from cytokines such as <strong>B-lymphocyte stimulator (BLyS)</strong>, and the resulting antigen-antibody immune complexes get trapped in capillaries of visceral organs and destroy host cells — this is the mechanism behind most SLE clinical manifestations. Given the strong female predominance, estrogen and X-linked genetic factors are thought to play a role. Exogenous/environmental triggers include cigarette smoke, alcohol, ultraviolet light (sunlight and fluorescent bulbs), certain medications (hydralazine, minocycline, procainamide — the classic drug-induced lupus triggers), viral infections, emotional or physical stress (surgery, pregnancy), and occupational silica dust exposure."},
   {h:"Neuropsychiatric SLE"},
   {p:"Central nervous system involvement in SLE spans the full range of neurologic disease: psychosis, cognitive impairment, seizures, peripheral and cranial neuropathies, transverse myelitis, and stroke. These often present subtly, as changes in behavior or cognitive ability, which is why the nurse specifically asks the patient and family about behavioral changes, not just physical symptoms."},
   {h:"Priority assessments/cues"},
   {list:[
    "Vital signs for fever",
    "Cough, difficulty breathing, cardiac dysrhythmias",
    "Polyarthralgia (pain in many joints) and stiffness in the morning",
    "Excessive fatigue, weight loss",
    "Redness to the face with a <strong>\"butterfly\" rash</strong> over the cheeks and bridge of the nose, and a scaly rash to the face and upper torso, erythema of the palms",
    "Feeling of malaise, weakness, and anorexia",
    "Ulcers of the mouth and nose, balding, lesions on the scalp",
    "Seizures, disordered thinking, impaired memory, peripheral neuropathy, photosensitivity"]},
   {h:"Symptoms of SLE, by system"},
   {table:{head:["System","Findings"],rows:[
     ["Skin & hair","Photosensitivity, butterfly rash, alopecia"],
     ["Mental","Cognitive dysfunction, psychosis, seizures, fever"],
     ["Lungs","Pleuritic chest pain, inflammation, pneumonia, pleuritis"],
     ["Heart","Pleuritic chest pain, heart murmur"],
     ["Kidneys","Inflammation, failure"],
     ["Joints & muscle","Swollen joints, arthritis"],
     ["Blood","Lab abnormalities, blood clots, anemia"],
     ["Mouth","Ulcers"]]}},
   {p:"The butterfly rash is the single most recognizable clinical clue for SLE, but it's neither universal (not every SLE patient has it) nor exclusive to SLE — it's a strong pointer, not a stand-alone diagnostic criterion. SLE is also the classic example of a <strong>Type III hypersensitivity reaction</strong> (covered in the previous lesson): circulating immune complexes deposit in tissue throughout the body and trigger complement-mediated inflammation, which is exactly why the damage shows up in so many organs rather than one localized site."},
   {h:"Priority laboratory tests/diagnostic cues"},
   {list:[
    "<strong>Antinuclear antibody (ANA)</strong> — positive in more than 99% of clients with SLE, giving it exceptional sensitivity (though not specificity — see the hook below)",
    "<strong>Anti-double-stranded DNA (anti-dsDNA)</strong> — antibody against DNA that is highly specific to SLE and helps differentiate it from drug-induced lupus",
    "<strong>Antiphospholipid antibodies (ALPs)</strong> — positive in about 30% of clients with SLE; this is the lab value that explains the blood-clot risk in the table above, and why warfarin shows up in the medication list below",
    "<strong>Anti-Smith antibody (Sm)</strong> — a specific nuclear protein antibody, positive in about 30% of clients with SLE",
    "<strong>C-reactive protein (CRP)</strong> — elevated; used to determine disease status and therapy effectiveness",
    "<strong>Erythrocyte sedimentation rate (ESR)</strong> — elevated; used the same way, to track disease status and therapy effectiveness",
    "<strong>Complete blood count (CBC) and coagulation studies</strong> — thrombocytopenia, anemia, leukocytosis or leukopenia, and impaired clotting"]},
   {hook:"ANA is positive in SLE about 97% of the time, but it's also positive in up to 30% of clients with rheumatoid arthritis — so a positive ANA alone doesn't distinguish the two. The anti-Smith antibody and antiphospholipid antibodies are more specific to SLE, while rheumatoid factor and anti-CCP (covered in the RA lesson) point toward RA."},
   {h:"Priority interventions/collaborative actions"},
   {list:[
    "Provide meticulous skin care; apply creams and ointments for skin rash as indicated",
    "Give medications to manage pain and decrease the inflammatory response",
    "Perform client care activities with built-in rest periods, due to fatigue",
    "Oxygen therapy as indicated",
    "Measure intake and output if the client is receiving corticosteroids (fluid retention risk)",
    "Ensure safety with memory deficits, personality changes, seizures, peripheral neuropathy, weakness, or paresthesia",
    "Diet high in iron, protein, folic acid, and vitamins if there's no contraindication — kidney disease would rule out a high-protein diet — and help maintain appropriate weight",
    "Provide emotional support and a supportive environment for the client to verbalize feelings"]},
   {h:"Priority actual & potential complications"},
   {p:"Complications of SLE can affect every system: stroke, seizures, memory impairment, myocardial infarction, dysrhythmias, pericarditis, heart failure, pleurisy, dyspnea, kidney failure, severe arthralgia, impaired mobility, and paralysis. Anxiety, depression, and psychosis are also common while a client is dealing with a life-altering, chronic illness."},
   {h:"Priority hypotheses for nursing care"},
   {list:[
    "SLE is a multisystem disorder, so the focus of care spans all body systems — it may cause hypertension, arrhythmias, nephritis, pericarditis, anemia, and coronary artery disease",
    "Monitor clients for depression from managing the many systemic complications SLE presents, and make appropriate referrals",
    "Decreased secretion of saliva and tears (<strong>Sjögren's syndrome</strong>) can occur, causing dry eyes, photosensitivity, and dry mouth",
    "Attend to the psychosocial needs of both the client and family"]},
   {h:"Priority medications"},
   {list:[
    "<strong>Indomethacin, naproxen, sulindac</strong> — oral NSAIDs for arthralgia and arthritis; most significant adverse effect is GI bleeding",
    "<strong>Hydroxychloroquine</strong> — oral antimalarial drug to treat fatigue, joint pain, and skin disorders; recommended eye exam every 6–12 months, since it causes retinopathy",
    "<strong>Dapsone</strong> — oral antileprosy drug used to manage urticaria, oral ulcers, and chronic symptoms; used if the client cannot tolerate hydroxychloroquine",
    "<strong>Methylprednisolone</strong> — IV/oral corticosteroid to treat severe skin disorders; tapering doses may manage polyarthritis flare-ups; high doses are effective but should be limited due to side effects",
    "<strong>Methotrexate</strong> — oral/IV steroid-sparing immunosuppressant, considered a standard treatment used as an alternative to corticosteroids; monitor CBC for hepatotoxicity and bone marrow suppression",
    "<strong>Tacrolimus, pimecrolimus</strong> — topical calcineurin inhibitors/immunosuppressants used instead of corticosteroids to manage skin rashes",
    "<strong>Azathioprine, cyclophosphamide, mycophenolic acid</strong> — oral/IV immunosuppressants used to treat severe organ involvement with SLE (most frequently lupus nephritis); prevents the need for long-term corticosteroid therapy; <strong>contraindicated in pregnancy</strong> along with methotrexate",
    "<strong>Warfarin</strong> — oral/IV anticoagulant to prevent blood clotting/DVTs (the clinical answer to that positive antiphospholipid antibody result); monitor INR",
    "<strong>Belimumab</strong> — IV monoclonal antibody specifically for SLE; binds and inactivates BLyS, preventing it from stimulating B cells to make antibodies against the body's own nuclei; <strong>live vaccines are contraindicated for 30 days</strong> before starting this medication",
    "<strong>Rituximab</strong> — an additional monoclonal antibody used for its immune-modulating effect in SLE"]},
   {h:"Priority teaching/discharge needs"},
   {list:[
    "Identify and avoid triggers for SLE",
    "Avoid sun or ultraviolet light exposure, or protect with sunscreen and appropriate clothing — sun/UV exposure can trigger a flare",
    "Use fragrance-free soap for skin care; avoid perfumed or harsh emollients",
    "Medication therapy, rationale, administration, and side effects",
    "Meal planning for optimal nutrition — consult a dietitian as needed, especially given the increased cardiovascular disease risk (hypertension, atherosclerosis) associated with SLE",
    "<strong>Smoking cessation</strong>, including e-cigarettes/ENDS — smoking worsens kidney function, inhibits liver function (which can blunt the effectiveness of medications like hydroxychloroquine), and raises the risk of osteoporosis, skin disease, and (in SLE specifically) lung cancer and other rare cancers",
    "<strong>Bone health monitoring</strong> — long-term corticosteroid use raises osteoporosis/fracture risk, so get a baseline bone mineral density test at diagnosis and before starting steroids, then every 2 years; encourage daily calcium and vitamin D and weight-bearing exercise",
    "Watch for signs of infection given corticosteroid-related immunosuppression, especially in acutely ill patients",
    "Information for SLE support groups and community resources"]}
  ],
  check:{stem:"A client with SLE has a new positive antiphospholipid antibody result. Which medication should the nurse anticipate being added to this client's regimen, and why?",
   options:["Warfarin, to prevent blood clotting from the antiphospholipid antibody-associated clot risk","Hydroxychloroquine, to treat the antibody directly","Dapsone, because it reverses antiphospholipid antibodies","No medication is needed since antiphospholipid antibodies are not clinically significant"],
   answer:0,

{ id:"iis-oa", title:"Osteoarthritis", kicker:"A mechanical, wear-and-tear joint disease — and how it differs from the autoimmune process in the next lesson",
  blocks:[
   {p:"Osteoarthritis (OA) is a progressive disorder marked by destruction of the articular cartilage of the joints — a mechanical, degenerative process rather than the autoimmune process behind rheumatoid arthritis (RA), covered in the next lesson."},
   {h:"Priority assessments/cues"},
   {list:[
    "Joint pain that is aggravated by activity, alleviated by rest",
    "Difficulty moving from sitting to standing, or joint stiffness after being in one position for extended periods",
    "Difficulty completing daily activities due to joint pain",
    "<strong>Heberden's nodes or Bouchard's nodes</strong> — redness, swelling, or bony outgrowths around the finger joints caused by osteophyte formation",
    "Asymmetry of affected extremities — OA is generally <strong>unilateral</strong>",
    "Crepitation in the joint; cartilage particles in the joint cavity",
    "Knees may be bowlegged or knock-kneed"]},
   {h:"Priority laboratory tests/diagnostic cues"},
   {list:[
    "CT scan, MRI, bone scan — arthritic changes to joints",
    "X-rays — stage the degree of damage to joints",
    "Synovial fluid analysis — differentiates OA from other types of arthritis; synovial fluid is <strong>normal</strong> with OA (compare to RA, where WBC count is elevated and viscosity is decreased)"]},
   {h:"Priority interventions/collaborative actions"},
   {list:[
    "Administer drug therapy as prescribed",
    "Assist with completion of activities of daily living (ADLs)",
    "Immobilize the affected joint with a brace or splint during the acute phase of inflammation",
    "Range-of-motion exercises; physical and occupational therapy consults",
    "Bed cradle to keep pressure from bed linens off the client's affected feet",
    "Moist heat to help with stiffness; ensure rest"]},
   {h:"Priority actual & potential complications"},
   {list:["Physical immobility and disability","Sleep disturbance and social isolation","Gout and bone death (osteonecrosis)"]},
   {h:"Priority hypotheses for nursing care"},
   {p:"OA can be debilitating in advanced stages, impacting all functionality of the client's life."},
   {h:"Priority medications"},
   {list:[
    "<strong>Ibuprofen</strong> — oral NSAID and analgesic; watch for gastrointestinal ulceration and bleeding",
    "<strong>Capsaicin cream</strong> — topical analgesic that blocks the pain impulse; available by prescription and over the counter",
    "<strong>Cortisone</strong> — intra-articular corticosteroid to decrease joint inflammation and swelling; further intervention is needed after 4 injections if pain and swelling are not relieved"]},
   {h:"Priority teaching/discharge needs"},
   {list:[
    "Heat for joint pain, cold compresses for active inflammation",
    "End exercise and rest if pain starts in the affected joint",
    "Take pain medications as prescribed",
    "Wear splints on the affected joint as prescribed",
    "Use assistive devices to help with immobility",
    "Weight loss to minimize stress on the joints",
    "Modify the home environment for safety",
    "Provide support and resources when arthritic changes require additional assistance with ADLs and mobility"]},
   {h:"OA vs. RA at a glance"},
   {table:{head:["Feature","Osteoarthritis","Rheumatoid Arthritis"],rows:[
     ["Underlying process","Degenerative — loss of articular cartilage, bone ends rub together","Autoimmune — swollen, inflamed synovial membrane, erosion of bone"],
     ["Joint pattern","Asymmetrical","Symmetrical"],
     ["Morning stiffness","Lasts less than 30 minutes","Lasts more than 30 minutes"],
     ["Symptoms","Pain and stiffness in movement","Pain, stiffness, and inflammation"]]}},
   {p:"The 30-minute stiffness cutoff and symmetrical-vs-asymmetrical pattern are the two fastest bedside discriminators — see the Rheumatoid Arthritis lesson for the full autoimmune picture, deformities, labs, and the much longer RA medication list."}
  ],
  check:{stem:"A client reports right knee pain that worsens with activity and improves with rest, with bony nodules noted at the finger joints. Synovial fluid analysis is normal. Which condition is most consistent with this presentation?",
   options:["Rheumatoid arthritis, because joint pain is present","Osteoarthritis, because of activity-related pain, Heberden's/Bouchard's nodes, and normal synovial fluid","Systemic lupus erythematosus, because of the joint involvement","Rheumatoid arthritis, because synovial fluid is always normal in RA"],
   answer:1,
   why:"Activity-aggravated, rest-relieved joint pain, bony nodules from osteophyte formation, and normal synovial fluid are all classic for osteoarthritis; RA synovial fluid shows an elevated WBC count with decreased viscosity, not a normal result."}
},
{ id:"iis-ra", title:"Rheumatoid Arthritis", kicker:"A chronic systemic autoimmune disease — deformities, specific antibodies, and the longest medication list in this section",
  blocks:[
   {p:"Rheumatoid arthritis (RA) is a chronic systemic immune disease characterized by inflammation and destruction of connective tissue and membranes within the synovial joints — a fundamentally different process from the mechanical wear-and-tear of osteoarthritis (OA), covered in the previous lesson."},
   {h:"Epidemiology and risk factors"},
   {p:"RA is an autoimmune disease of unknown origin, with females affected about 3 times more often than males. Onset can occur at any age but is most common between the third and sixth decades of life, and incidence increases with age. Identified risk factors include family history, environmental influences (diet, geographic location), nulliparity, and the modifiable factors of smoking and obesity — an elevated BMI increases the risk of RA and shortens the time to onset, an association strongest in women and smokers; obesity also worsens disease-related outcomes and lowers the likelihood of achieving remission."},
   {h:"Pathophysiology — how the joint gets destroyed"},
   {p:"An autoimmune reaction occurs in the synovial tissue: antigens are presented to T lymphocytes, triggering proliferation of T and B cells. B cells (plasma cells) produce antibodies that combine with antigens to form immune complexes, which deposit in synovial tissue and trigger inflammation. The RA synovium breaks down collagen, causing edema and proliferation of the synovial membrane. In chronic inflammation, this doesn't resolve — instead, <strong>pannus</strong> forms (a proliferation of new synovial tissue infiltrated with inflammatory cells), which destroys cartilage and erodes bone, producing loss of articular surfaces and joint motion. Muscle fibers degenerate, and tendon/ligament elasticity is lost. The same inflammatory process is also implicated in atherosclerosis (RA interferes with production of protective HDL cholesterol) and in neuropathies/paresthesias from synovial inflammation compressing adjacent nerves."},
   {h:"ACR/EULAR classification criteria"},
   {p:"The American College of Rheumatology and European League Against Rheumatism established a point-based scoring system for diagnosing RA: a total score of <strong>6 or greater</strong> is required. Points are assigned for joint involvement (number and size of joints affected), serology (low- or high-positive rheumatoid factor or anti-CCP), abnormal acute phase reactants (ESR or CRP), and symptom duration greater than 6 weeks. This applies to patients with at least one joint showing synovitis not explained by another disease."},
   {h:"Priority assessments/cues"},
   {list:[
    "Vital signs for elevated temperature — low-grade with inflammation, fever with infection",
    "Severity and duration of morning pain, usually lasting <strong>30 minutes or more</strong>, and may last throughout the day",
    "Joint pain, warmth, swelling, stiffness, tenderness to touch, limited range of motion, deformity, nodules at joints, and muscle atrophy",
    "Excessive fatigue, weight loss, anorexia",
    "Difficulty grasping objects, due to extensor and flexor tendon involvement in the wrist",
    "Decreased secretion of saliva and tears (<strong>Sjögren's syndrome</strong>), causing dry eyes, photosensitivity, and dry mouth",
    "Psychosocial needs of the client and family"]},
   {h:"The deformities of RA"},
   {list:[
    "<strong>Swan neck deformity</strong> — the middle joint of the finger is extended (bent back) more than normal, and the end joint is flexed (bent down)",
    "<strong>Boutonnière deformity</strong> — the finger permanently bends down at the middle joint while the end joint bends backward",
    "<strong>Ulnar drift</strong> — swelling of the metacarpophalangeal joints (the knuckles at the base of the fingers) causes the fingers to become displaced toward the little finger",
    "<strong>Hallux valgus (bunion)</strong> — lateral deviation of the hallux (great toe) on the first metatarsal"]},
   {h:"Priority laboratory tests/diagnostic cues"},
   {list:[
    "White blood cell count (WBC) in synovial fluid — elevated, with decreased viscosity",
    "C-reactive protein (CRP) — elevated, showing active inflammation",
    "Erythrocyte sedimentation rate (ESR) — elevated, showing active inflammation",
    "<strong>Rheumatoid factor (RF)</strong> — positive in up to 90% of clients with RA",
    "<strong>Anti-cyclic citrullinated peptide (anti-CCP)</strong> — positive in over 80% of clients with RA",
    "Antinuclear antibody (ANA) — positive in up to 30% of clients with RA (also positive in SLE — see that lesson's lab hook for how to tell the two apart)",
    "X-ray — erosion and narrowing of joint space, bony growths, and osteoporosis"]},
   {h:"Priority interventions/collaborative actions"},
   {list:[
    "Assist with activities and provide rest periods, being mindful of morning stiffness",
    "Provide range-of-motion exercises to maintain joint function",
    "Avoid weight bearing on inflamed extremities",
    "Use splints on affected extremities to prevent contractures",
    "Cold and heat applications to joints as indicated",
    "Medication as prescribed, to manage pain and decrease the inflammatory response",
    "Provide optimal nutrition to compensate for appetite loss due to pain and fatigue",
    "Provide meticulous skin care",
    "Measure intake and output — corticosteroids may cause fluid retention",
    "Provide emotional support and a therapeutic environment to verbalize feelings",
    "Consult physical and occupational therapy as indicated"]},
   {h:"Priority actual & potential complications"},
   {list:["Scleritis, Sjögren's syndrome (decreased tears/saliva)","Pericarditis, myocarditis, pleural effusion, pneumothorax","Physical immobility due to deformities","<strong>Cardiovascular disease</strong> — up to 40% of RA deaths trace to cardiovascular disease, driven by elevated lipids, chronic inflammation, endothelial dysfunction, or abnormal homocysteine levels"]},
   {h:"Priority hypotheses for nursing care"},
   {list:[
    "Clients with long-standing RA may develop <strong>Felty syndrome</strong> — low WBC and splenomegaly, raising infection risk",
    "RA is common in older adults, who may be on several medications already — polypharmacy issues should be considered"]},
   {h:"DMARDs — the two families, and where they fit in the treatment sequence"},
   {p:"Disease-modifying antirheumatic drugs (DMARDs) can suppress the autoimmune response, alter disease progression, and halt further tissue damage — unlike NSAIDs, they can actually slow or stop bone loss and destruction, which is why treatment starts with a DMARD within the first 3 months of diagnosis rather than waiting. <strong>Nonbiologic DMARDs</strong> (methotrexate is the preferred first agent, alongside leflunomide, sulfasalazine, and hydroxychloroquine) reduce proinflammatory cytokines and increase anti-inflammatory ones. <strong>Biologic DMARDs</strong> are engineered to target a specific inflammatory mediator — TNF-alpha, B cells, T cells, IL-1, or IL-6 — and tend to work faster with less radiologic progression, but are reserved for moderate-to-severe RA that hasn't responded adequately to nonbiologic DMARDs because of cost and shorter track record. A newer class, <strong>JAK inhibitors</strong> (tofacitinib, baricitinib), bind Janus kinase enzymes to block cytokine production, and are used after initial DMARD therapy has failed. Before starting biologic therapy, screen for latent TB (tuberculin skin test) and hepatitis B/C, since immunosuppression can reactivate these infections."},
   {h:"Priority medications"},
   {list:[
    "<strong>Aspirin</strong> — oral NSAID to decrease pain and inflammation; most significant adverse effect is GI bleeding; monitor serum salicylate levels for toxicity if dosage exceeds 3,600 mg daily",
    "<strong>Celecoxib</strong> — oral COX-2 inhibitor to decrease pain and inflammation; fewer GI side effects than traditional NSAIDs, though the risk still exists — NSAIDs and COX-2 inhibitors relieve symptoms only and do not prevent erosions or alter disease progression",
    "<strong>Hydroxychloroquine</strong> — oral antimalarial drug to treat fatigue and joint inflammation; recommended eye exam every 6–12 months, since it causes retinopathy",
    "<strong>Leflunomide, sulfasalazine</strong> — oral antirheumatic drugs; leflunomide blocks immune cell overproduction and is <strong>teratogenic</strong> — should not be administered unless pregnancy is ruled out; sulfasalazine decreases pain and inflammation and may prevent damage to joints",
    "<strong>Hydrocortisone, prednisone</strong> — intra-articular/oral corticosteroids to manage acute RA flare-ups, or as a short-term \"bridge\" while waiting for slower-acting DMARDs like methotrexate to take effect (roughly 6 weeks); not recommended long-term due to side effects, and weight gain is a leading reason patients stop taking them",
    "<strong>Methotrexate</strong> — oral/IV steroid-sparing immunosuppressant used as an alternative to corticosteroids; monitor CBC for hepatotoxicity and bone marrow suppression",
    "<strong>Tofacitinib, baricitinib</strong> — oral JAK inhibitors that interfere with Janus kinase enzymes that cause joint inflammation; used after initial DMARD therapy fails",
    "<strong>Adalimumab</strong> — a tumor necrosis factor (TNF) inhibitor that decreases immune and inflammatory response, used for clients who have not responded to other antirheumatic drugs (standard nursing pharmacology gives this as a <strong>subcutaneous</strong> biologic injection — worth double-checking against your instructor's materials if a source lists it as oral, since that would be unusual for a TNF inhibitor)",
    "<strong>Anakinra</strong> — subcutaneous interleukin-1 receptor antagonist that blocks the inflammatory response; used for clients who have not responded to, or cannot tolerate, other antirheumatic drugs",
    "Opioid analgesics are generally <strong>avoided</strong> in RA given the potential for continuing need for pain relief in a chronic disease; low-dose antidepressants (amitriptyline, paroxetine, sertraline) may be used short-term for sleep and mood"]},
   {h:"Nonpharmacologic management and surgery"},
   {list:[
    "<strong>Heat</strong> (warm baths/showers, moist compresses, paraffin dips for small joints — maximum benefit within 20 minutes) relieves pain, stiffness, and spasm; therapeutic exercise is more comfortable and effective after heat application",
    "Splints and braces rest acutely inflamed joints and limit motion; canes, crutches, and walkers offload painful weight-bearing joints",
    "Physical and occupational therapy for range-of-motion, muscle-strengthening, pacing activities, and work simplification",
    "<strong>Reconstructive surgery</strong> (synovectomy, tenorrhaphy, arthrodesis, joint replacement) is used when pain isn't relieved by conservative measures and independence is threatened; surgery is avoided during exacerbations",
    "A Mediterranean-style diet may reduce RA disease activity; smoking cessation should always be discussed given the RA-smoking-BMI risk relationship above"]},
   {h:"Priority teaching/discharge needs"},
   {list:[
    "Long-term expectations of the disease",
    "Medication administration and side effects",
    "Protection of small joints — avoid repetitive movements, use the strongest joints for tasks, modify activities to decrease stress on joints",
    "Modifications that may be needed to the home, and assistive devices to maintain a safe environment",
    "Potential for corticosteroid therapy to cause weight gain — counsel on a weight loss program and a tolerable exercise regimen that minimizes overexertion",
    "Aquatic exercises in warm water, cold and heat therapy to relieve stiffness, muscle spasms, and pain",
    "RA support groups and community resources, including the Arthritis Foundation"]}
  ],
  check:{stem:"A client with rheumatoid arthritis has laboratory results showing a positive rheumatoid factor and positive anti-CCP antibody. The nurse also notes ulnar drift on hand exam. Which teaching point is most important regarding this client's hand function?",
   options:["Encourage repetitive fine-motor tasks to strengthen the joints","Teach the client to protect small joints by avoiding repetitive movements and using the strongest joints available for tasks","Recommend immobilizing all hand joints permanently","No special teaching is needed since ulnar drift does not affect function"],
   answer:1,
   why:"Ulnar drift and RA's progressive joint destruction make small-joint protection a priority teaching point — avoiding repetitive movements and using the strongest joints for tasks helps preserve function and slow further deformity."}
}
]};

const IIS_IMMUNE = { title:"Immune: HIV Infection & AIDS", group:"iis", sub:"How HIV attacks the immune system, and how it's managed.", lessons:[
{ id:"iis-hiv", title:"HIV Infection & AIDS", kicker:"CD4 destruction, the full assessment and lab picture, and the ART/PrEP/PEP distinction",
  blocks:[
   {p:"HIV (human immunodeficiency virus) is a retrovirus that damages the immune system, making the host susceptible to infections that would otherwise be prevented by the body's immune response. It specifically targets and destroys <strong>CD4 (helper T) cells</strong> — the same cell type introduced earlier in this section as the coordinator of the broader cell-mediated immune response."},
   {h:"HIV infection vs. AIDS"},
   {p:"<strong>HIV infection</strong> describes the presence of the virus, which can exist for years without progressing further, especially with treatment. <strong>Acquired immunodeficiency syndrome (AIDS)</strong> is severe immunodeficiency and susceptibility to malignancies and infections resulting from untreated HIV — the advanced stage, diagnosed once CD4 count falls below a defined threshold or the client develops a defined AIDS-defining opportunistic illness."},
   {h:"CD4 staging, stage by stage"},
   {table:{head:["Stage","CD4+ T cells/µL","CD4+ %"],rows:[
     ["Stage 0","—","—"],
     ["Stage 1","≥ 500","≥ 26%"],
     ["Stage 2","200–499","14–25%"],
     ["Stage 3 (AIDS)","< 200","< 14%"]]}},
   {p:"If a stage 3–defining opportunistic illness has been diagnosed, the client is classified as stage 3 (AIDS) <strong>regardless of CD4 count</strong>. That list of stage-3-defining illnesses is long, but the highest-yield ones to recognize are: <em>Candida</em> of the bronchi/trachea/lungs or esophagus, invasive cervical cancer, disseminated or extrapulmonary coccidioidomycosis or cryptococcosis, chronic intestinal cryptosporidiosis (>1 month), CMV disease or CMV retinitis with vision loss, HIV encephalopathy, chronic herpes simplex ulcers (>1 month), disseminated/extrapulmonary histoplasmosis, Kaposi sarcoma, Burkitt/immunoblastic/primary brain lymphoma, disseminated <em>Mycobacterium avium complex</em> or <em>M. tuberculosis</em>, <em>Pneumocystis jirovecii</em> pneumonia (PCP), progressive multifocal leukoencephalopathy, recurrent Salmonella septicemia, cerebral toxoplasmosis, and HIV wasting syndrome."},
   {h:"Transmission"},
   {p:"HIV is transmitted through contact with infected blood, seminal fluid, vaginal secretions, amniotic fluid, and breast milk — <strong>not through casual contact</strong>. Higher viral concentration in the fluid raises transmission risk. Mother-to-child transmission can occur in utero, at delivery, or through breastfeeding, though most perinatal transmission happens during labor and delivery, which is why zidovudine is dosed as above around that window. Risk factors include sharing injection drug equipment, condomless sex with an infected partner (either gender), and (historically) receiving contaminated blood products or organ transplants — donated blood has been tested for HIV antibodies and the p24 antigen since 1999, making transfusion-related transmission now extremely rare."},
   {h:"Priority assessments/cues"},
   {list:[
    "Nausea, headache, malaise, swollen lymph nodes, sore throat, fever, joint pain, rash (typically 2–3 weeks after infection), and signs of opportunistic infections",
    "Pericardial friction rubs or murmurs, dyspnea, tachypnea, wheezing, cough",
    "Memory loss, slurred speech, tremors, agitation, seizures, paralysis, papilledema, eye exudate",
    "Candida patches, blisters, and other lesions in the mouth; white lesions on the sides of the tongue; white patches in the throat; tooth decay, gingivitis, vomiting, diarrhea, rectal lesions",
    "Pallor, cyanosis of tissues, alopecia, poor skin turgor, lesions and other skin eruptions, bruises on mucous membranes",
    "Lesions and discharge from the genitals, excoriation of the perineum",
    "Diagnostic criteria of HIV progression to AIDS"]},
   {h:"Priority laboratory tests/diagnostic cues"},
   {list:[
    "<strong>Rapid HIV screening test</strong> — if positive, followed by a confirmatory blood test",
    "<strong>In-home HIV testing</strong> — self-administered, with confidential results",
    "<strong>P24 antigen assay</strong> — measures the amount of HIV viral core protein in the blood",
    "<strong>CD4 T-cell count</strong> — monitors progression of HIV; normal is <strong>800–1,200 cells/mm³</strong>, and it decreases as the disease progresses",
    "<strong>Viral load</strong> — higher viral loads indicate disease progression; the treatment goal is an undetectable viral load",
    "<strong>Complete blood count (CBC)</strong> — pancytopenia"]},
   {h:"Priority interventions/collaborative actions"},
   {list:[
    "Provide antiretroviral therapy (ART); monitor for and treat side effects; monitor viral load and CD4 T-cell count",
    "Provide adequate oxygenation if the client has pneumonia",
    "Provide gentle care, since the client may be emaciated and experiencing pain and discomfort from muscle wasting; provide gentle skin care and protect bony prominences"]},
   {h:"Priority actual & potential complications"},
   {list:["Opportunistic infections, progression of HIV to AIDS","Social isolation, depression, coma"]},
   {h:"Priority hypotheses for nursing care"},
   {list:[
    "The prognosis and potential quality of life associated with HIV has improved such that life expectancy for a client with HIV who receives treatment is similar to a client without HIV",
    "ART interacts with many over-the-counter drugs and alternative therapies — clients should seek advice from their health care provider before adding anything"]},
   {h:"Priority medications (antiretroviral therapy, by class)"},
   {list:[
    "<strong>Nevirapine, delavirdine, efavirenz</strong> — oral non-nucleoside reverse transcriptase inhibitors (NNRTIs), block HIV cell replication",
    "<strong>Zidovudine, lamivudine, abacavir sulfate</strong> — oral/IV nucleoside reverse transcriptase inhibitors (NRTIs), block HIV cell replication; <strong>zidovudine given in pregnancy</strong> is dosed orally until labor, then administered IV until the umbilical cord is clamped, to prevent vertical transmission",
    "<strong>Indinavir</strong> — oral protease inhibitor, blocks protease and slows HIV growth",

   {hook:"The 72-hour window for PEP is the single most testable fact in this pairing: PEP started even one day late is far less likely to prevent seroconversion, which is why any needlestick or high-risk exposure is treated as a time-sensitive occupational health emergency, not something to schedule for the next routine appointment. For a health care worker with a needlestick involving HIV-infected blood, the actual occupational infection risk is low (about 0.3%) — but PEP (a 3-drug regimen) is still started immediately rather than waiting to see."},
   {p:"PrEP specifically combines <strong>tenofovir + emtricitabine</strong> in a single daily pill for an HIV-negative person at ongoing risk; HIV status is rechecked every 3 months while on PrEP. A person taking ART as prescribed who achieves and maintains an undetectable viral load has effectively no risk of transmitting HIV through sex (\"undetectable = untransmittable\") — but since PrEP and ART don't protect against other STIs, condom use is still recommended alongside them. Consistent, correct condom use remains the only effective method (besides abstinence) to reduce sexual transmission risk; nonlatex condoms protect against pregnancy for a client with a latex allergy but do <strong>not</strong> protect against HIV transmission the way latex condoms do."},

const IIS_CELLREG = { title:"Cellular Regulation: Cancer", group:"iis", sub:"Benign vs. malignant, symptom patterns, and treatment modalities.", lessons:[
{ id:"iis-cancer", title:"Cancer & Cellular Regulation", kicker:"Benign vs. malignant, primary vs. secondary symptoms, and the three treatment pillars",
  blocks:[
   {p:"Cancer is, at its core, a disorder of cellular regulation: normal cells follow built-in controls on when to divide and when to stop, and cancer arises when a cell line escapes those controls and proliferates unchecked, eventually forming a tumor."},
   {h:"Benign vs. malignant tumors"},
   {p:"Not every tumor is cancer. A <strong>benign</strong> tumor grows locally, stays within a defined capsule, does not invade surrounding tissue, and does not spread (metastasize) to distant sites — it can still cause problems by compressing nearby structures as it grows, but it is not cancer in the malignant sense. A <strong>malignant</strong> tumor invades surrounding tissue directly, lacks a well-defined capsule, and has the capacity to metastasize — spread to distant organs via the bloodstream or lymphatic system — which is the single feature that makes malignancy so much more dangerous than a benign growth of similar size."},
   {h:"Benign vs. malignant, side by side"},
   {table:{head:["Characteristic","Benign","Malignant"],rows:[
     ["Cells","Well-differentiated, resemble the tissue of origin","Undifferentiated, may bear little resemblance to the tissue of origin"],
     ["Mode of growth","Expansion; does not infiltrate surrounding tissue; usually encapsulated","Grows at the periphery and invades/infiltrates surrounding tissue"],
     ["Rate of growth","Usually slow","Variable — the more anaplastic (undifferentiated) the tumor, the faster it grows"],
     ["Metastasis","Does not metastasize","Gains access to blood/lymphatic channels and metastasizes to distant sites or across body cavities"],
     ["General effects","Usually localized, unless it compresses a vital structure","Often causes generalized effects — anemia, weakness, systemic inflammation, weight loss, cancer-associated cachexia syndrome (CACS)"],
     ["Tissue destruction","Not usual, unless it interferes with blood flow","Common, as the tumor outgrows its blood supply or produces cell-damaging substances"],
     ["Ability to cause death","Not usual, unless location interferes with vital function","Will eventually cause death unless growth is controlled"]]}},
   {h:"Grading and staging — how a cancer's severity gets a common language"},
   {p:"<strong>Grading</strong> is the pathologic classification of tumor cells — how much they resemble (or don't) the tissue they came from. Grade I is well-differentiated (closely resembles the tissue of origin, better prognosis); Grade IV is poorly differentiated/undifferentiated (barely resembles the tissue of origin, more aggressive, worse prognosis, less responsive to treatment). <strong>Staging</strong> describes tumor size, local invasion, lymph node involvement, and distant metastasis, most commonly with the <strong>TNM system</strong>: <strong>T</strong> (extent of the primary tumor, Tis = carcinoma in situ, T1–T4 = increasing size/local extent), <strong>N</strong> (regional lymph node involvement, N0 = none, N1–N3 = increasing involvement), and <strong>M</strong> (distant metastasis, M0 = none, M1 = present). These T/N/M values combine into an overall anatomic stage group (I–IV, increasing severity) that guides treatment decisions and prognosis."},
   {h:"Cancer prevention and detection"},
   {p:"<strong>Primary prevention</strong> reduces risk before disease develops — health promotion (weight management, physical activity, limiting high-calorie foods) and vaccination against infections linked to cancer (the HPV vaccine against cervical and head/neck cancers; the hepatitis B vaccine against liver cancer). <strong>Secondary prevention</strong> is screening and early detection in people who don't yet have symptoms — mammography, colonoscopy, Pap tests, and similar screening tools — aimed at catching precancerous lesions or early-stage disease, when treatment is simpler and outcomes are better."},
   {h:"Priority actual & potential complications — oncologic emergencies"},
   {p:"Certain complications of cancer or its treatment are true emergencies requiring immediate recognition:"},
   {table:{head:["Emergency","Recognize it by","First-line management"],rows:[
     ["Superior vena cava syndrome (SVCS)","Progressive dyspnea, facial/neck/arm edema, distended neck and chest wall veins, cough, hoarseness; most often from lung cancer or lymphoma compressing the SVC","Radiation or chemo to shrink the mass; elevate the head/upper body (semi-Fowler, never fully supine); avoid upper-extremity venipuncture and BP checks; avoid tight clothing/jewelry on the affected side"],
     ["Spinal cord compression","Local/radicular back or neck pain worsened by movement, coughing, or Valsalva; motor weakness progressing toward paralysis; bladder/bowel dysfunction — an emergency because delay risks permanent paralysis","Corticosteroids to reduce cord edema, radiation or surgical decompression; keep the patient still/positioned per spine precautions until stabilized; assess neuro status frequently"],
     ["Hypercalcemia","Fatigue, weakness, confusion, nausea/vomiting, constipation, polyuria, polydipsia, arrhythmias; serum calcium >10.4 mg/dL","IV hydration followed by diuretics (forced diuresis); bisphosphonates for longer-term control; treat the underlying malignancy"],
     ["Tumor lysis syndrome (TLS)","Follows rapid cell death from chemo/radiation, especially in leukemia/lymphoma; produces hyperkalemia, hyperphosphatemia (→ hypocalcemia), and hyperuricemia; watch for arrhythmias, seizures, and acute kidney injury","Aggressive IV hydration started 24–48h before cytotoxic therapy; allopurinol or rasburicase to control uric acid; treat hyperkalemia (cation-exchange resin, or insulin/dextrose to shift potassium intracellularly); hemodialysis if refractory"]]}},
   {h:"Palliative and hospice care — the distinction that matters"},
   {p:"<strong>Palliative care</strong> is an interdisciplinary approach to symptom management and psychosocial/spiritual support for anyone with a serious, life-limiting illness — it can start at diagnosis, run alongside curative or disease-directed treatment, and continue into bereavement support for the family; it is not only for the dying. <strong>Hospice</strong> is a specific type of palliative care focused on comfort at the end of life: enrolling in hospice means the patient has chosen to forgo disease-directed (curative) therapy in favor of comfort-focused care. The <strong>Medicare Hospice Benefit</strong> (Medicare Part A) covers interdisciplinary palliative care and services for patients with a terminal illness and a life expectancy of less than 6 months. <strong>Palliative sedation</strong> — controlled, monitored use of sedatives/nonopioids to reduce consciousness for otherwise-refractory pain or symptoms — is intended to relieve intractable suffering, not to hasten death."},
   {h:"Primary vs. secondary symptoms"},
   {p:"Cancer symptoms are usefully split into two categories. <strong>Primary symptoms</strong> come directly from the tumor itself — a mass effect from local growth, pain from compression of nearby structures, or bleeding and obstruction when a tumor is in a hollow organ or vessel. <strong>Secondary symptoms</strong> come from the body's broader systemic response to the cancer rather than the tumor's local presence — fatigue, unintended weight loss, anemia, and the metabolic and immune effects sometimes described as cancer cachexia. Recognizing which category a symptom falls into matters because it shapes the workup: a primary symptom points toward the tumor's location, while a cluster of secondary symptoms can be the first sign of a cancer that hasn't caused any localized symptoms yet."},
   {h:"Treatment: the three pillars"},
   {table:{head:["Modality","Options","Key nursing concerns"],rows:[
     ["Surgery","Debulking (removing as much tumor as possible without full cure intent), curative resection, hormone-producing tissue removal, palliative surgery, and reconstructive surgery","Post-operative recovery and body image concerns, especially after disfiguring or organ-removing procedures"],
     ["Chemotherapy","Administered through a variety of routes; a Port-a-Cath is commonly placed for reliable, repeated IV access, and many chemotherapy agents are vesicants (capable of causing severe tissue damage if they leak outside the vein), which makes secure venous access and careful administration a patient-safety priority","Tumor lysis syndrome (TLS), bone marrow suppression (with resulting infection and bleeding risk), anorexia, alopecia, family planning/fertility concerns, and risk of future secondary cancers"],
     ["Radiation","Internal (brachytherapy, where a radioactive source is placed inside or next to the tumor) or external beam radiation (with skin markers used to precisely and consistently target the same site each session)","Radiation precautions, skin damage at the treatment site, mucosal damage (especially with head/neck or GI-tract radiation), long-term tissue damage, and risk of future secondary cancers"]]}},
   {p:"Bone marrow suppression from chemotherapy deserves a specific callout because it cascades into the two supportive medications named in this section's blueprint: <strong>filgrastim</strong>, a granulocyte colony-stimulating factor that boosts neutrophil production to reduce infection risk during chemotherapy-induced neutropenia, and <strong>epoetin alfa</strong>, a synthetic erythropoietin that stimulates red blood cell production to manage chemotherapy-induced anemia. Both medications treat a downstream consequence of bone marrow suppression rather than the cancer itself."},
   {h:"The Port-a-Cath"},
   {p:"A Port-a-Cath is a small, surgically implanted reservoir placed under the skin (commonly on the upper chest) with a catheter that threads into a large central vein. It's accessed through the skin with a specialized non-coring needle (through the septum), which lets a patient receive repeated chemotherapy infusions, blood draws, or other IV therapy over months without needing a new peripheral IV every time — a particularly important feature given how many chemotherapy agents are vesicants that would be dangerous to infuse through a fragile, easily infiltrated peripheral line."}
  ],
  check:{stem:"A patient receiving chemotherapy develops a dangerously low neutrophil count. Which medication is most appropriate to address this specific complication?",
   options:["Epoetin alfa","Filgrastim","An NSAID","A DMARD"],
   answer:1,
   why:"Filgrastim is a granulocyte colony-stimulating factor that boosts neutrophil production, making it the targeted treatment for chemotherapy-induced neutropenia. Epoetin alfa addresses anemia (low red blood cells), not low neutrophils."}
}
]};
