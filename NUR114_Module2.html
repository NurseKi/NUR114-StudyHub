<script>
const MH_OVERVIEW = { title:"Module Overview", group:"mh", sub:"Course objectives and blueprint for Mental Health — read these first.", lessons:[

{ id:"mh-modblueprint", title:"Exemplars & Medications Blueprint", kicker:"The course blueprint for Mental Health",
  blocks:[
   {p:"This is the official topic blueprint for the Mental Health portion of NUR 114 Module 2, organized exactly as the course outline groups it. Detailed lessons for each exemplar and medication class are built out elsewhere in this app as source material becomes available — this page is a reference map of everything the section covers, not a restatement of the content itself."},

   {h:"Medication classes to know"},
   {p:"The pharmacology textbook has Prep U practice questions available for several of these medication classes — Chapters 20, 21, and 22 cover much of the Mental Health medication content."},
   {list:[
    "<strong>Antipsychotics</strong> (both typical and atypical) — Abilify (Aripiprazole), Zyprexa (Olanzapine), Seroquel (Quetiapine), Risperdal (Risperidone), Geodon (Ziprasidone)",
    "<strong>Anxiolytics</strong>",
    "<strong>Antidepressants</strong> — MAOI, TCA, SSRI &amp; SNRI",
    "<strong>Mood stabilizers</strong> (including some anticonvulsants used for this purpose)",
    "<strong>Stimulants</strong>",
    "<strong>Benzodiazepines</strong> — Diazepam (Valium), Clonazepam (Klonopin), Lorazepam (Ativan), Alprazolam (Xanax), Midazolam (Versed)",
    "<strong>Narcan</strong> (Naloxone)",
    "<strong>Benztropine</strong>"]}
  ]
},
{ id:"mh-moddiscussion", title:"Instructor Discussion Questions", kicker:"Reflection prompts flagged across the source slides, with short answers",
  blocks:[
   {p:"These questions were flagged as instructor discussion/reflection prompts across the original Mental Health slide decks. Short answers are provided below, all grounded in content taught elsewhere in this section."},
   {p:"<strong>Q: When you think of mental illness, what comes to mind — and are your ideas from TV, movies, or personal experience?</strong>"},
   {p:"This was an opening reflection prompt with no single correct answer, meant to surface that a lot of common mental-illness imagery comes from media portrayals (often exaggerated or focused on rare violent cases) rather than the much more ordinary, common presentations — depression, anxiety, and substance use disorders — that a nurse actually encounters most often."},
   {p:"<strong>Q: What indicates good mental health?</strong>"},
   {p:"Mental health is framed as a spectrum rather than a binary: the ability to adapt to stressors and cultural norms, with occasional stress or mild distress but no functional impairment, sits at the healthy end. Mental illness only enters the picture once symptoms interfere with daily functioning — it's described as \"a disease of exclusion,\" meaning other causes are ruled out first."},
   {p:"<strong>Q: What should the nurse assess for in a depressed client, and what would an appropriate care plan include?</strong>"},
   {p:"Assessment covers mood/affect congruence, neurovegetative symptoms (sleep, appetite, energy), cognitive symptoms (concentration, guilt, worthlessness), and — always — a direct suicide risk screen. An appropriate care plan starts with safety, then layers in small achievable activities, protected sleep and nutrition, patient involvement in treatment decisions, and combined medication plus psychotherapy."},
   {p:"<strong>Q: What are some signs and symptoms of ADHD, and how is it diagnosed?</strong>"},
   {p:"Inattentive features include distractibility, losing things, and difficulty following through; hyperactive-impulsive features include fidgeting, excessive talking, and acting without considering consequences. Diagnosis is clinical — a structured history from parents, teachers, and the patient documenting the pattern across more than one setting — since there is no lab test or imaging study that diagnoses ADHD."},
   {p:"<strong>Q: What nursing interventions and safety precautions are needed for a client with autism spectrum disorder?</strong>"},
   {p:"Care centers on minimizing unpredictability and sensory overload: consistent routines, advance notice before procedures or transitions, concrete language, and involving caregivers who know the patient's individual sensory sensitivities. Safety-wise, a sensory-overload reaction (covering ears, rocking, distress at loud noise) should be recognized as sensory overload rather than intentional defiance, and addressed by reducing the trigger."},
   {p:"<strong>Q: What cardiovascular changes in anorexia nervosa could be life-threatening, and what causes anorexia in the first place?</strong>"},
   {p:"If malnutrition leads to edema or hypokalemia, ventricular arrhythmias can occur — this is the life-threatening cardiac risk. No single cause of anorexia is known; it's thought to involve a combination of genetic, biological, and environmental factors."},
   {p:"<strong>Q: What complications can occur in bulimia nervosa, and which electrolyte imbalances are of concern?</strong>"},
   {p:"The life-threatening complications are dehydration and electrolyte imbalance from repeated purging — most importantly hypokalemia and metabolic alkalosis from the loss of stomach acid and gastric hydrochloric acid, both of which raise the risk of dangerous cardiac arrhythmias."},
   {p:"<strong>Q: How do you think a client with binge-eating disorder feels, and what nursing interventions and complications apply?</strong>"},
   {p:"Patients typically feel significant shame and guilt about their loss of control, often eating alone to hide it. Complications relate to the metabolic consequences of associated weight gain (type 2 diabetes, hypertension, dyslipidemia, cardiovascular disease). Nursing interventions include daily achievable goals, patient control over food choices, food journaling, trigger identification, routine weighing, alternative coping strategies, and nonjudgmental, shame-reducing communication."},
   {p:"<strong>Q: What are the major elements of PTSD, and what should guide the nursing approach?</strong>"},
   {p:"The major elements are trauma (re-experiencing via flashbacks/nightmares), emotions (hyperarousal, numbing, exaggerated startle), and guarding (hypervigilance, avoidance). The nursing approach should emphasize a calm, predictable approach, consistency, and awareness that guilt is a common accompanying emotion needing acknowledgment rather than dismissal."}
  ],
  check:{stem:"Per the discussion answers, why is mental health described as existing on a spectrum rather than as a simple healthy/ill binary?",
   options:["Because only positive symptoms count toward a diagnosis","Because functioning ranges from occasional stress with no impairment, through mild/temporary impairment, to marked distress and disabling impairment — illness is diagnosed only once other causes are excluded","Because medication always resolves the distinction","Because mental illness is always permanent once diagnosed"],
   answer:1,
   why:"The mental health-mental illness continuum runs from well-being (occasional stress, no impairment) through emotional problems (mild/temporary impairment) to mental illness (marked distress, moderate-to-disabling impairment), and illness is treated as a diagnosis of exclusion rather than a fixed binary."}

// ===================== MENTAL HEALTH CONTENT UNITS =====================

const MH_FOUND = { title:"Foundations of Psychiatric Nursing Care", group:"mh", sub:"The therapeutic relationship, communication, psychosis basics, coping mechanisms, and suicide risk — the skills every other lesson in this section builds on.", lessons:[
{ id:"mh-therapeutic-self", title:"The Therapeutic Nurse–Patient Relationship", kicker:"Self-awareness, rapport, and the empathy/sympathy line",
  blocks:[
   {p:"Psychiatric nursing runs on a different tool than most of the rest of nursing: the nurse's own self. A dressing change works the same way regardless of who applies it, but a therapeutic relationship only works if the nurse has done the work of understanding their own beliefs, attitudes, values, and even physical stance before walking into the room. A nurse who is uncomfortable with a topic — addiction, self-harm, a particular religion or lifestyle — will unconsciously communicate that discomfort through tone, facial expression, or body language long before they say anything judgmental out loud. That's why self-awareness is listed first: it isn't a soft skill tacked onto the real work, it's the precondition for the real work."},
   {h:"Building rapport: trust, respect, and genuineness"},
   {p:"Rapport is the foundation everything else in the relationship is built on, and it rests on three specific qualities. <strong>Trust</strong> is built through consistency — showing up when you say you will, following through on what you promise, and being honest even when the truth is uncomfortable (for example, telling a patient a procedure will be uncomfortable rather than promising it won't hurt). <strong>Respect</strong> means treating the patient as a capable adult with the right to make their own decisions whenever safety allows, rather than as a diagnosis to be managed. <strong>Genuineness</strong> means the nurse's warmth is real, not performed — patients, especially those with conditions like borderline personality disorder that heighten sensitivity to rejection, are often unusually good at detecting insincerity, and a performed rapport tends to backfire."},
   {h:"Empathy vs. sympathy"},
   {p:"These two words get used interchangeably in casual speech, but they describe different — and therapeutically unequal — stances. <strong>Sympathy</strong> is feeling sorry for someone from the outside; it keeps a distance between the nurse's experience and the patient's and can tip into pity, which subtly reinforces the patient's sense of being lesser-than. <strong>Empathy</strong> is entering into the patient's emotional experience enough to understand it accurately from the inside, while still keeping your own professional footing — you understand why they feel what they feel without drowning in the feeling alongside them. Empathy is the therapeutic goal; sympathy, however well-intentioned, is not."},
   {h:"Transference and countertransference"},
   {p:"<strong>Transference</strong> is when the patient unconsciously redirects feelings about someone from their past — often a parent or another authority figure — onto the nurse. A patient who was raised by a harsh, critical father might react to a nurse's ordinary correction with disproportionate anger, because the nurse has momentarily become a stand-in for that father figure. <strong>Countertransference</strong> is the mirror-image process happening in the nurse: the nurse's own unresolved feelings or past relationships get projected onto the patient, for example a nurse who was raised by an alcoholic parent feeling unusually irritated by or overly protective of a patient with alcohol use disorder. Neither phenomenon means something has gone wrong — they're a normal and expected part of close human interaction — but a nurse who can't recognize when countertransference is happening in themselves is at risk of letting it drive their care decisions instead of the patient's actual needs."},
   {h:"The four phases of the nurse-patient relationship (TRUST)"},
   {p:"The therapeutic relationship isn't a single static thing — it moves through four sequential phases, and knowing which phase a relationship is in tells you what work is actually appropriate to do right now. A mnemonic worth holding onto: <strong>T</strong>rust is built, <strong>R</strong>apport deepens, work is <strong>U</strong>ndertaken, <strong>S</strong>eparation happens, and the relationship <strong>T</strong>erminates."},
   {table:{head:["Phase","What happens","Nurse's task"],rows:[
     ["1. Preinteraction","Happens before the nurse ever meets the patient — reviewing the chart, prior notes, and the nurse's own self-awareness of biases or reactions the case might trigger","Prepare: gather background information and examine your own feelings about the upcoming interaction"],
     ["2. Orientation (introductory)","The first actual meeting. Roles, expectations, and the boundaries and terms of the relationship (confidentiality, its limits, how long it will last) are established","Introduce yourself and your role, begin building trust, and set the working agreement/contract for the relationship"],
     ["3. Working","The bulk of the relationship — the patient explores thoughts, feelings, and problems, and the nurse helps the patient develop coping skills, insight, and problem-solving ability","Facilitate change: this is where most of the actual therapeutic work of the relationship happens"],
     ["4. Termination","The planned ending of the relationship — discharge, transfer, or the end of a rotation — which is discussed in advance rather than sprung on the patient","Review progress made, help the patient process feelings about the ending (which can reopen old losses), and ensure a safe handoff or discharge plan"]]}},
   {hook:"A relationship that skips straight from orientation to termination without a working phase hasn't actually done the therapeutic work — and a termination phase that isn't planned and discussed in advance can feel like abandonment to a patient, especially one with a trauma history around loss."},
   {h:"Theoretical models of behavior (context, not memorization-heavy)"},
   {p:"Several theoretical models underpin why psychiatric nursing approaches behavior the way it does. These are lower-yield for direct recall than the four relationship phases above, but recognizing the name-to-idea pairing is still commonly tested."},
   {table:{head:["Model","Key figure(s)","Core idea"],rows:[
     ["Psychoanalytic","Freud","Behavior is driven by unconscious conflict, often rooted in early childhood experience"],
     ["Interpersonal","Sullivan, Peplau","Personality and behavior develop through relationships with others; anxiety is transmitted interpersonally"],
     ["Social","Caplan, Szasz","Social and environmental factors (poverty, culture, social support) shape mental health"],
     ["Existential","Frankl, Perls, May","Distress arises when a person is out of touch with themselves or their environment; focuses on meaning and self-awareness"],
     ["Nursing","Rogers, Orem, Sister Callista Roy, Peplau","Frames the person as a whole, adapting being in continuous interaction with their environment"],
     ["Medical","—","Views mental illness through diagnosis and biological/pharmacological treatment, similar to physical disease"],
     ["Communication","Berne, Bandler, Grindler","Behavior and dysfunction are understood through patterns of verbal and nonverbal communication"],
     ["Behavioral","Skinner, Wolpe, Eysenck","Behavior is learned and can be unlearned or reshaped through conditioning"],
     ["Humanistic","Maslow","Behavior is driven by a hierarchy of needs, from basic survival up through self-actualization"]]}}
  ],
  check:{stem:"A nurse notices she feels unusually frustrated with a patient who reminds her of her own difficult sibling. This reaction is an example of which phenomenon?",
   options:["Transference","Countertransference","Sympathy","Splitting"],
   answer:1,
   why:"Countertransference is the nurse's own unresolved feelings or past relationships being projected onto the patient — here, the nurse's feelings about her sibling are shaping her reaction to the patient. Transference would be the reverse: the patient redirecting feelings about someone from their own past onto the nurse."}
},
{ id:"mh-therapeutic-comm", title:"Therapeutic Communication & the Therapeutic Environment", kicker:"Techniques that open a conversation up, techniques that shut it down",
  blocks:[
   {p:"Therapeutic communication is not limited to the words a nurse chooses — it includes tone of voice, eye contact, posture, and touch, all of which can either build the relationship or quietly undermine it. A nurse can say all the technically correct words and still communicate poorly if their body language contradicts the message."},
   {hook:"Instructor example (used as a Kahoot exercise in class): a nurse talking with a patient while staring at the computer screen instead of the patient is a concrete example of communication that fails on the nonverbal channel even though nothing wrong was said out loud. The instructor's second example: a nurse responding to a patient's substance use disclosure with, \"If it were up to me, I would choose not to drink or use drugs,\" is a failure on the verbal channel — it inserts the nurse's personal judgment into a moment that calls for neutral, nonjudgmental listening. Both examples were flagged as the kind of subtle mistake that's easy to miss but breaks trust immediately."},
   {h:"Part I — techniques that encourage the expression of feelings and ideas"},
   {p:"Each of these is a specific, nameable technique — nursing exams test the name, the description, and the ability to recognize a matching example, not just the general idea of \"being a good listener.\""},
   {table:{head:["Technique","What it is","Example"],rows:[
     ["Active listening","Being attentive to what the client is saying, verbally and non-verbally: sit facing the client, open posture, lean toward the client, eye contact, and relax","(nonverbal — posture and attention itself is the technique)"],
     ["Sharing observations","Making observations by commenting on how the other person looks, sounds, or acts","\"You look tired\" / \"I haven't seen you eating anything today\""],
     ["Sharing empathy","The ability to understand and accept another person's reality, to accurately perceive feelings, and to communicate understanding","\"It must be very frustrating to know what you want and not be able to do it\""],
     ["Sharing hope","Communicating a \"sense of possibility\" to others — encouragement when appropriate, and positive feedback","\"I believe you will find a way to face your situation, because I have seen your courage in the past\""],
     ["Sharing humor","Contributes to feelings of togetherness, closeness, and friendliness; promotes positive communication through prevention, perception, and perspective","(used judiciously, matched to the moment)"],
     ["Sharing feelings","Helping clients express emotions by making observations, acknowledging feelings, giving permission to express \"negative\" feelings, and modeling healthy anger","(open acknowledgment rather than suppression of the feeling)"],
     ["Using touch","The most potent form of communication; comfort touch such as holding a hand is especially important for vulnerable clients experiencing severe illness","(holding a hand during a difficult moment)"],
     ["Silence","Time for the nurse and client to observe one another, sort out feelings, think of how to say things, and consider what has been communicated; the nurse should allow the client to break the silence","(deliberately not filling the pause)"],
     ["Providing information","Relevant information helps a client make decisions, experience less anxiety, and feel safe and secure","\"Susie is getting an echocardiogram right now, which is a test that uses painless sound waves to create a moving picture of her heart structures and valves and should tell us what is causing her murmur\""],
     ["Clarifying","Restating an unclear or ambiguous message to check whether understanding is accurate, or to better understand it","\"I'm not sure I understand what you mean by 'sicker than usual' — what is different now?\""],
     ["Focusing","Taking notice of a single idea expressed, or even a single word","\"On a scale of 0 to 10, tell me the level of the pain you are experiencing in your great toe right now\""],
     ["Paraphrasing","Restating another's message more briefly, in the nurse's own fresher words, capturing the essential idea","Client: \"I can't focus, my mind keeps wandering.\" Nurse: \"You're having difficulty concentrating?\""],
     ["Asking relevant questions","Seeking information needed for decision-making — one question at a time, fully exploring one topic before moving on; open-ended questions let the client take the conversational lead","\"What is your biggest problem at the moment?\" / \"How has your pain affected your life at home?\""],
     ["Summarizing","Pulls together information for documentation, gives the client a sense you understand, and brings closure to the interaction","\"It is my understanding that your arm pain is a level 1 since you've taken a Vicodin one hour ago... is this correct?\""],
     ["Self-disclosure","Subjectively true personal experiences intentionally revealed by the nurse to emphasize similarities and differences — used sparingly, and kept relevant, so the client stays the focus","\"That happened to me once, too... I went to counseling and it really helped. What are your thoughts about seeing a counselor?\""],
     ["Confrontation","Helping the client become more aware of inconsistencies in feelings, attitudes, beliefs, and behaviors — only after trust is established, and done gently, with sensitivity","\"You say you've already decided what to do, yet you're still talking a lot about your options\""]]}},
   {h:"Part II — non-therapeutic techniques (\"blocks\" to communication)"},
   {p:"Just as important as knowing the techniques that open a conversation up is recognizing the specific, nameable patterns that shut one down — these show up constantly as the \"wrong answer\" options on nursing exam questions, and the reasoning for why each one fails is testable in its own right."},
   {table:{head:["Block","Why it fails","Example / better alternative"],rows:[
     ["Asking personal questions","Asks about things not relevant to the situation, out of curiosity rather than clinical need","Avoid: \"Why aren't you married to Mary?\" — Better: \"How would you describe your relationship to Mary?\""],
     ["Giving personal opinions","Takes decision-making away from the client — the problem and the solution belong to the patient, not the nurse","Avoid: \"If I were you I'd put your father in a nursing home.\" — Better: \"Let's talk about what options are available to your father.\""],
     ["Changing the subject","Rude, shows a lack of empathy, and signals the nurse doesn't really care what the client is sharing","Avoid: \"Let's not talk about your insurance problems, it's time for your walk.\""],
     ["Automatic responses","Generalizations and stereotypes that reflect poor nursing judgment and threaten nurse-client or team relationships","Avoid: \"Administration doesn't care about the staff\" / \"Older adults are always confused.\""],
     ["False reassurance","Offers hope not based on fact or reality; can block conversation and discourage further expression of feelings even though it's meant kindly","Avoid: \"Don't worry, everything will be all right.\" — Better: \"It must be difficult not to know what the surgeon will find. What can I do to help?\""],
     ["Sympathy","Focuses on the nurse's own feelings rather than the client's — a subjective look at another's world that prevents a clear perspective on the issues confronting that person","Avoid: \"I'm so sorry about your amputation, it must be terrible to lose a leg.\" — Better: \"The loss of your leg is a major change — how do you think this will affect your life?\""],
     ["Asking for explanations (\"why\")","Clients frequently interpret \"why\" questions as accusations, which can cause resentment, insecurity, and mistrust","Avoid: \"Why are you so upset?\" — Better: \"You seem upset. What's on your mind?\""],
     ["Approval or disapproval","Imposes the nurse's own values and standards; approving implies only that behavior is acceptable, disapproving implies the client must meet the nurse's standards","Avoid: \"You shouldn't even think about assisted suicide, it's just not right.\" — Better: \"I'm surprised you are considering assisted suicide. Tell me more about it...\""],
     ["Defensive responses","Blocks the nurse from listening uncritically to discover the real reason for a client's anger or dissatisfaction","Avoid: \"No one here would intentionally lie to you.\" — Better: \"You believe people have been dishonest with you. It must be hard to trust anyone.\""],
     ["Passive or aggressive responses","Passive responses avoid conflict and reflect sadness, powerlessness, or hopelessness; aggressive responses provoke confrontation and reflect anger or frustration — assertive communication is the professional middle path","Avoid: \"Being sick is bad and it's all your fault.\""],
     ["Arguing","Challenging or denying the client's perceptions implies they are lying, misinformed, or uneducated","Avoid: \"How can you say you didn't sleep a wink when I heard you snoring all night!\" — Better: \"You feel like you didn't get any rest at all last night, even though I thought you slept well since I heard you snoring.\""]]}},
   {h:"What makes communication therapeutic (summary)"},
   {list:[
    "It is patient-centered — the goal is to understand the patient's experience, not to share the nurse's opinions or life story",
    "It uses active listening: eye contact, open body language, and reflecting back what the patient said to confirm understanding",
    "It avoids clichés, false reassurance, and judgmental language, all of which shut a conversation down rather than open it up",
    "Touch is used deliberately and only when appropriate — for some patients, especially those with trauma histories or active psychosis, unexpected touch can feel threatening rather than comforting"]},
   {h:"The therapeutic environment"},
   {p:"Nurses are also responsible for structuring the physical and social environment around a psychiatric patient, not just their own conversation with that patient. Three questions guide this: What is the priority? (Safety always outranks comfort or even the treatment plan itself.) What type of environment does this specific situation call for? (A patient in active psychosis needs a low-stimulation environment — dim lighting, few people, minimal noise — while a patient working through grief may need a private space to talk.) What boundaries need to be set and held? (Consistency in boundaries is itself therapeutic; boundaries that shift depending on the nurse or the patient's mood undermine the sense of safety a structured environment is supposed to provide.)"},
   {h:"The mental status examination (MSE)"},
   {p:"The MSE is an objective, structured snapshot of a patient's cognitive and psychological functioning at a single point in time — think of it as the psychiatric equivalent of a head-to-toe physical assessment. It's repeated over the course of care so the team can compare a patient against their own baseline rather than against a generic norm."},
   {list:[
    "<strong>Appearance</strong> — grooming, hygiene, dress appropriate to age/weather, eye contact",
    "<strong>Attitude/behavior</strong> — cooperative vs. guarded, hostile, or agitated",
    "<strong>Speech</strong> — rate, volume, rhythm, tone (pressured, slowed, slurred, mute)",
    "<strong>Motor activity</strong> — psychomotor agitation or retardation, tremors, tics, abnormal gait",
    "<strong>Mood</strong> (the patient's own subjective report, in their words) <strong>vs. affect</strong> (what the nurse objectively observes) — and whether the two are congruent",
    "<strong>Thought process</strong> — linear/logical/goal-directed vs. flight of ideas, loose associations, or thought blocking",
    "<strong>Thought content</strong> — presence or absence of hallucinations, delusions, obsessions, suicidal/homicidal ideation",
    "<strong>Orientation</strong> — person, place, time, and situation (\"oriented x4\")",
    "<strong>Insight</strong> — does the patient recognize they have an illness and need treatment?",
    "<strong>Judgment</strong> — can the patient make sound, safe decisions about their own care?"]},
   {hook:"Mood vs. affect is a frequent exam trap: mood is what the patient tells you (\"I'm good\"); affect is what you observe (flat, blunted, labile, or incongruent with the stated mood). A patient who reports feeling \"fine\" while showing no facial expression at all has a mood/affect incongruence worth documenting."},
   {h:"Putting it together: the nursing implications"},
   {p:"In practice, psychiatric nursing care flows through five linked implications: <strong>assessment</strong> comes first and never stops, because a patient's mental status can shift within a single shift; <strong>safety</strong> — of both the patient and the environment — is the organizing priority behind every other decision; <strong>therapeutic communication</strong> is the primary tool used to gather information and build the relationship; <strong>structuring the environment</strong> to match the clinical situation supports everything else; and <strong>medications</strong> are layered on top of, not instead of, all of the above."},
   {h:"Three channels of communication and congruence"},
   {p:"Communication travels through three simultaneous channels: <strong>verbal</strong> (the actual words spoken), <strong>non-verbal</strong> (posture, facial expression, gestures, and appearance), and <strong>para-verbal</strong> (tone, volume, pitch, and inflection). <strong>Congruence</strong> is when all three channels convey the same message; when they don't line up — for example, a client saying something positive in a flat or irritated tone — that incongruence is itself a red flag worth documenting, since it often signals unspoken distress or ambivalence the words alone don't capture."},
   {h:"Personal space, boundaries, and cultural factors"},
   {p:"Even routine nursing tasks — applying a blood pressure cuff, placing a pulse oximeter, taking a temperature — already invade a patient's personal space before any more invasive care even begins. Every individual has their own boundary threshold, and a nurse attentive to a patient stiffening, pulling away, or growing quiet during a routine task is picking up an early nonverbal cue about where that threshold sits. Touch, eye contact, and family decision-making hierarchy all vary meaningfully by culture and must be actively assessed for each patient rather than assumed from the nurse's own background."},
   {h:"Facilitators vs. barriers, answering the same client statement"},
   {p:"Seeing a facilitator and a barrier respond to the identical client statement side by side makes the exam pattern easier to recognize. Client: \"Do you think I'm doing the right thing having a bilateral mastectomy?\""},
   {table:{head:["Facilitator (therapeutic)","Example phrasing"],rows:[
     ["Offering self","\"How about I sit with you and we discuss your thoughts?\""],
     ["Focusing","\"What are your specific thoughts and concerns related to this surgery?\""],
     ["Seeking clarification","\"What led you to your decision?\""],
     ["Open-ended question","\"What options did the provider give you?\""],
     ["Acknowledging","\"This must have been a difficult decision for you.\""],
     ["Presenting reality","\"I read in your chart about your risk for breast cancer — was that part of your decision?\""]]}},
   {table:{head:["Barrier (non-therapeutic)","Example phrasing"],rows:[
     ["Probing","\"Have you really given this a lot of thought?\""],
     ["Changing the topic","\"Has the surgeon discussed your post-op exercises?\""],
     ["Being defensive","\"We provide the best care here.\""],
     ["Agreeing/disagreeing","\"I think surgery is a good idea\" / \"I don't think you should have this surgery\""],
     ["Stereotyping","\"Women your age respond well to this surgery.\""],
     ["Unwarranted reassurance","\"I'm sure you made the right decision.\""]]}},
   {hook:"NCLEX pattern to watch for: when an answer option is a quoted statement that opens with something like \"Tell me...\", it is very often the correct open-ended, therapeutic response. Quoted answer choices are usually testing recognition of a specific communication technique, not just general kindness."}
  ],
  check:{stem:"While talking with a patient, a nurse keeps her eyes on the computer screen instead of the patient. What is the primary problem with this interaction?",
   options:["The nurse is violating HIPAA","The nurse is failing to communicate therapeutically on the nonverbal channel","The nurse is not charting enough","The patient will file a complaint"],
   answer:1,
   why:"Therapeutic communication includes nonverbal elements like eye contact and body language. Staring at a screen instead of the patient communicates disengagement regardless of what is said, which is exactly the kind of subtle nonverbal failure this example was used to illustrate."}
},
{ id:"mh-psychosis", title:"Recognizing and Caring for Psychosis", kicker:"Key terms first, then how to respond safely",
  blocks:[
   {p:"Before any specific diagnosis is discussed, psychiatric nursing rests on a shared vocabulary. <strong>Psychosis</strong> is a state in which a person is detached from reality. <strong>Delusions</strong> are fixed false beliefs held despite clear evidence against them (believing you are being poisoned by a family member with no supporting evidence). <strong>Hallucinations</strong> are sensory perceptions with no external stimulus — hearing voices, seeing things, or feeling sensations that aren't there. Auditory hallucinations are the most common type seen in psychiatric care."},
   {h:"Rule out natural causes first"},
   {p:"This is one of the most important — and most frequently tested — principles in psychiatric assessment: <strong>psychosis is a symptom, not automatically a psychiatric diagnosis.</strong> New-onset psychosis in a patient always triggers a workup for medical causes before it's attributed to a primary psychiatric illness. Sleep deprivation, substance intoxication or withdrawal, an infection (especially a UTI in an older adult), a metabolic disturbance, a brain injury, or a high fever can all produce psychotic symptoms. Jumping straight to a psychiatric label without ruling out a treatable medical cause is a patient-safety failure, not just a diagnostic shortcut."},
   {h:"How to care for a patient experiencing psychosis"},
   {list:[
    "<strong>Positive, nonjudgmental demeanor</strong> — your affect sets the tone for the interaction",
    "<strong>Do not touch</strong> — unexpected touch can be perceived as a threat and provoke a defensive or aggressive response",
    "<strong>Empathy</strong> — acknowledge the emotion the delusion or hallucination is producing, even though you don't confirm the content itself",
    "<strong>Do not argue</strong> — you cannot logic a person out of a delusion or a hallucination; arguing only damages trust and rarely changes the belief",
    "<strong>Validate feelings, not the psychosis itself</strong> — \"I can see this is frightening for you\" validates the emotion without confirming voices are real",
    "<strong>Focus on reality (grounding)</strong> — gently redirect attention to real, verifiable things in the room",
    "<strong>Distract</strong> — a structured activity can reduce the intensity of internal stimuli; a concrete example is inviting the patient to the common room to watch television or engage in a group activity, shifting attention away from internal stimuli toward something shared and observable",
    "<strong>Monitor physical needs</strong> — psychosis can crowd out a patient's attention to their own food intake, elimination, hydration, and hygiene, so the nurse has to actively track these rather than assuming the patient will report a need",
    "<strong>Be aware of command hallucinations</strong> — voices instructing the patient to harm themselves or someone else are a safety emergency that overrides all other priorities"]},
   {p:"When command hallucinations are identified, the response escalates beyond routine monitoring: increase the level of observation (up to continuous one-on-one supervision), remove any means of carrying out the command, notify the treatment team immediately, and reassess whether the current level of restriction (unit privileges, environment) is still safe. Client and staff safety are evaluated together, since a command hallucination instructing harm toward others is as much of an emergency as one instructing self-harm."},
   {hook:"\"Validate feelings, not psychosis\" is the single line worth memorizing from this whole topic: you are always allowed to say \"that sounds scary\" and never allowed to say \"yes, they really are watching you.\""},
   {h:"A structured way to respond: the empathy model"},
   {p:"\"Focus on reality\" and \"validate feelings\" are easy to say and hard to do in the moment, so it helps to have a concrete, ordered script for responding to a disturbing delusion or hallucination rather than improvising. The empathy model breaks the response into four steps, moving from acknowledgment to exploration:"},
   {list:[
    "<strong>1. Acknowledge what the person has said</strong> — you don't need to reinforce the belief to acknowledge it. Use phrases like \"You say...\"",
    "<strong>2. Acknowledge your own understanding (or lack of it)</strong> — rather than stating that what the person believes is untrue, say something like \"I can't see that\" or \"I was told that...\"",
    "<strong>3. Try to imagine how the other person might feel</strong> — take cues from the person's affect, and check your intuitions tentatively rather than presenting them as certain: \"I imagine that I might feel... if I thought... Is that how it is for you?\" If you get it wrong, be genuinely interested and ask further open-ended questions rather than abandoning the approach",
    "<strong>4. Explore the feelings and methods of coping</strong> — \"When you have felt... in the past... what has helped?\" Sometimes just acknowledging the feeling is enough; other times, if the feelings are distressing, talking about coping — or what the person can do to cope with the feelings — is the more helpful direction"]},
   {h:"Worked example: \"I have worms eating my brain\""},
   {p:"Walking through the four steps against a single concrete delusion shows how they connect into one continuous conversation rather than four separate scripted lines:"},
   {list:[
    "<strong>Step 1 (acknowledge):</strong> \"You say you have worms eating your brain.\"",
    "<strong>Step 2 (acknowledge your understanding):</strong> \"I can't see that, and the tests don't show any worms in your head...\"",
    "<strong>Step 3 (imagine the feeling):</strong> \"...I don't know what it's like to think that worms are eating my brain, but I imagine it would feel very uncomfortable... can you tell me what it feels like?\" — the patient responds, \"It is more than uncomfortable, my head is throbbing.\"",
    "<strong>Step 4 (explore feelings/coping):</strong> \"Have you had this feeling before? What worked then?\""]},
   {p:"Notice what never happens across all four steps: the nurse never says the worms are real, and never flatly tells the patient they're wrong either. The whole model is a way of staying honest about reality while still treating the patient's distress as real and worth exploring — which is exactly the balance \"validate feelings, not psychosis\" is pointing at."}
  ],
  check:{stem:"A patient reports that the television is sending him secret messages. What is the nurse's best response?",
   options:["\"You're right, let's turn the TV off so it stops.\"","\"That's not possible — televisions can't send messages.\"","\"That sounds like it would be frightening. I don't hear any messages, but I'm here with you.\"","Ignore the statement and change the subject immediately"],
   answer:2,
   why:"This response validates the patient's emotional experience (fear) without confirming the delusion, and gently offers the nurse's own reality without arguing. Confirming the delusion or flatly arguing against it are both avoided; ignoring the disclosure entirely misses a chance to assess and connect."}
},
{ id:"mh-coping", title:"Ego Defense (Coping) Mechanisms", kicker:"Unconscious strategies the mind uses to manage anxiety",
  blocks:[
   {p:"Defense mechanisms are the different ways people handle emotional pain — originally conceived by Sigmund Freud, with much of their further development done by his daughter, Anna Freud. They aren't inherently pathological: defense mechanisms can be healthy or unhealthy depending on the circumstances and how much a person relies on them. Everyone uses some of these at some point, but certain patterns, used rigidly or in place of actually addressing a problem, are hallmarks of specific psychiatric conditions and show up constantly in nursing assessment questions."},
   {table:{head:["Mechanism","What it looks like","Example"],rows:[
     ["Repression","Burying a painful feeling or thought from your awareness, though it may resurface in symbolic form. Sometimes considered a basis of other defense mechanisms","You can't remember your father's funeral"],
     ["Denial","Not accepting reality because it is too painful","You are arrested for drunk driving several times but don't believe you have a problem with alcohol"],
     ["Regression","Reverting to an older, less mature way of handling stresses and feelings","You and your roommate have an argument so you stomp off into another room and pout"],
     ["Projection","Attributing your own unacceptable thoughts or feelings to someone or something else","You get really mad at your husband but scream that he's the one mad at you"],
     ["Splitting","Everything in the world is seen as all good or all bad, with nothing in between","You think your best friend is absolutely worthless because he forgot a lunch date with you"],
     ["Displacement","Channeling a feeling or thought from its actual source to something or someone else","When you get mad at your sister, you break your drinking glass by throwing it against the wall"],
     ["Reaction formation","Adopting beliefs, attitudes, and feelings contrary to what you really believe","When you say you're not angry when you really are"],
     ["Rationalization","Justifying one's behaviors and motivations by substituting \"good,\" acceptable reasons for these real motivations","\"I always study hard for tests and I know a lot of people who cheat so it's not a big deal I cheated this time.\""],
     ["Humor","Focusing on funny aspects of a painful situation","A person's treatment for cancer makes him lose his hair so he makes jokes about being bald"],
     ["Sublimation","Redirecting unacceptable, instinctual drives into personally and socially acceptable channels","Intense rage redirected in the form of participation in sports such as boxing or football"],
     ["Suppression","The effort to hide and control unacceptable thoughts or feelings","You are attracted to someone but say that you really don't like the person at all"],
     ["Compensation","Putting forth extra effort to counterbalance a perceived deficiency, real or imagined, often by excelling or overindulging in another area","A short business owner overcompensates by being unusually aggressive and controlling in business dealings"],
     ["Identification","Consciously or unconsciously adopting the personality characteristics, attitudes, values, and behavior of someone else — often someone admired — as a way to allay anxiety","A teenager adopts the hairstyle and mannerisms of a favorite celebrity"],
     ["Introjection","A type of identification in which a person incorporates the traits or values of others into their own personality, without exploring whether those values actually fit them","A child recites the same harsh rules their parent used, now as if they were their own beliefs"],
     ["Intellectualization","Also called isolation — using excessive, detached reasoning about an event to avoid the uncomfortable feelings connected to it","A person avoids the anxiety of a cancer diagnosis by focusing exclusively on statistics and treatment protocols instead of how they feel about it"],
     ["Isolation (of affect)","A person blocks the feelings associated with a distressing event or experience, even while discussing the event itself matter-of-factly","A nursing student describes a difficult trauma case in clinical detail without any visible emotional reaction"],
     ["Fantasy","Creating unrealistic or improbable situations to escape daily pressures, responsibilities, or boredom","Daydreaming excessively about being highly successful while actually feeling unsuccessful"],
     ["Undoing","Trying to \"undo\" or make up for harm the person feels they have caused someone else","Saying something hurtful to a friend, then immediately overcompensating with gifts or exaggerated kindness"],
     ["Acting out","Repeating certain actions or behaviors to ward off anxiety, without weighing the possible consequences of those actions","A patient with unresolved anger repeatedly picks fights on the unit instead of talking about what's bothering them"],
     ["Withdrawal","Growing emotionally uninvolved by pulling back and becoming passive rather than engaging with a stressor","A patient stops participating in group therapy and avoids conversation after a difficult family visit"],
     ["Dissociation","Blocking an anxiety-provoking event, or a period of time, from conscious awareness, memory, or perception — leaving the person unable to compartmentalize an uncomfortable experience","A person is found by police unable to explain who they are or where they have been for the past several hours"]]}},
   {p:"Two of these are worth flagging for exam purposes because they're easy to confuse with each other: <strong>intellectualization/isolation</strong> keeps the feeling out of conscious awareness by burying it under detached, over-cognitive reasoning, while <strong>rationalization</strong> keeps the behavior itself intact by supplying a socially acceptable excuse for it. Intellectualization hides the emotion; rationalization justifies the action."},
   {p:"Splitting deserves special attention because it directly explains a behavior pattern nurses see often on a psychiatric unit: a patient with borderline personality disorder may describe one staff member as \"the only nurse who understands me\" and another as \"completely incompetent\" within the same shift — often the same staff member can flip from one category to the other after a single perceived slight. Recognizing this as splitting, rather than reacting personally to being idealized or devalued, is what keeps the care team consistent instead of getting triangulated against each other."},
   {p:"Sublimation is worth distinguishing from suppression and repression because it's the one defense mechanism generally considered healthy and even encouraged: rather than burying or hiding an unacceptable impulse, sublimation actively channels it into something constructive. Directing a patient's anger toward a structured, appropriate outlet (physical activity, art, journaling) is, in effect, coaching them toward sublimation instead of displacement."}
  ],
  check:{stem:"A patient who is furious with her physician instead snaps angrily at her visiting sister. This is an example of which defense mechanism?",
   options:["Projection","Displacement","Reaction formation","Splitting"],
   answer:1,
   why:"Displacement is redirecting an emotional reaction from its real source (the physician, who feels unsafe to confront) onto a safer target (the sister). Projection would involve attributing the anger itself to someone else rather than just redirecting where it's expressed."}
},
{ id:"mh-suicide", title:"Suicidal Ideation: Assessment, Safety, and Resources", kicker:"The highest-priority assessment in mental health nursing",
  blocks:[
   {p:"Suicide risk assessment is treated as a priority screening item for essentially any patient with a mental illness or a family history of one — not just patients who volunteer the thought. Once suicidal ideation is identified, the entire care plan reorganizes around one word: <strong>safety.</strong>"},
   {h:"Clues and cues"},
   {p:"Suicidal ideation doesn't always announce itself directly. Nonverbal signs — giving away prized possessions, a sudden and uncharacteristic sense of calm after a period of severe depression, withdrawing from relationships — can precede a disclosure or an attempt. When a patient does begin to talk about it, that disclosure is a relief to them, not a burden on the nurse: talking openly about suicidal thoughts decreases the patient's isolation and helps them externalize and problem-solve the crisis rather than carrying it alone. This is also why asking directly about suicidal ideation does not \"plant the idea\" — a persistent myth. Asking a clear, direct question (\"Are you having thoughts of ending your life?\") opens the door to help rather than creating the risk."},
   {h:"Warning signs"},
   {list:[
    "Talking about wanting to die or to kill themselves",
    "Looking for a way to kill themselves, such as searching online or buying a weapon",
    "Talking about feeling hopeless or having no reason to live",
    "Talking about feeling trapped or in unbearable pain",
    "Talking about being a burden to others",
    "Increasing use of alcohol or drugs",
    "Acting anxious or agitated, or behaving recklessly",
    "Sleeping too little or too much",
    "Withdrawing or isolating themselves",
    "Showing rage or talking about seeking revenge",
    "Displaying extreme mood swings"]},
   {hook:"A common and dangerous misconception is that a patient who has attempted suicide before, or who talks about it repeatedly without acting, is \"just seeking attention\" and therefore lower risk. In reality, patients often attempt suicide multiple times, and a history of threats without a prior completed attempt does not predict that the next disclosure is any less serious. Every disclosure gets the same safety-first response."},
   {h:"Response and resources"},
   {p:"When suicidal ideation is identified with any plan or intent, the priority shifts immediately to safety — this can mean continuous observation, removing access to means, and inpatient psychiatric care when outpatient safety cannot be assured. Beyond the immediate crisis, the standard resources a nurse should be ready to connect a patient with include suicide hotlines, crisis centers, mental health apps and licensed mental health professionals, support groups, and simply consistent open communication that keeps the door open for the patient to talk again."},
   {h:"The SAD PERSONS Scale — standardized suicide-risk scoring"},
   {p:"SAD PERSONS gives one point for each positive finding, then a score band tells you the disposition:"},
   {list:[
    "<strong>S</strong>ex — male (males more often choose lethal/violent means; females attempt more often but with less lethal means)",
    "<strong>A</strong>ge — 15–24 or 75+ are the highest-risk age bands",
    "<strong>D</strong>epression — presence of a depressive disorder",
    "<strong>P</strong>revious attempts",
    "<strong>E</strong>thanol/drug use",
    "<strong>R</strong>ational thinking loss (psychosis, cognitive impairment)",
    "<strong>S</strong>ocial support lacking",
    "<strong>O</strong>rganized plan — the more specific and lethal the plan, the higher the risk",
    "<strong>N</strong>o spouse (single, divorced, widowed, or separated)",
    "<strong>S</strong>ickness (chronic, debilitating, or terminal illness)"]},
   {table:{head:["Score","Disposition"],rows:[
     ["0–2","No significant problems identified — continue routine monitoring"],
     ["3–4","Close follow-up; consider outpatient referral"],
     ["5–6","Strongly consider hospitalization, voluntary or involuntary, depending on confidence the patient will return for follow-up"],
     ["7–10","Hospitalize, involuntarily if necessary"]]}},
   {h:"IS PATH WARM — the other suicide-risk mnemonic worth knowing"},
   {p:"A second standardized set of warning signs used alongside SAD PERSONS: <strong>I</strong>deation, <strong>S</strong>ubstance use, <strong>P</strong>urposelessness, <strong>A</strong>nxiety, <strong>T</strong>rapped (feeling), <strong>H</strong>opelessness, <strong>W</strong>ithdrawal, <strong>A</strong>nger, <strong>R</strong>ecklessness, <strong>M</strong>ood change."},
   {hook:"Counterintuitive but high-yield: suicide risk can actually rise as a severe depressive episode starts to lift, not just while it's at its worst. A patient who was too psychomotor-retarded to act on suicidal thoughts may, as energy returns (whether from treatment response or a fresh burst of manic-range energy), now have the physical capability to carry out a plan they already had. Monitor closely through the improvement phase, not just the depths of the episode — this applies to any client recently started on an antidepressant, too."}
  ],
  check:{stem:"A patient who attempted suicide six months ago tells the nurse, \"I've thought about it again, but I probably won't actually do anything.\" What is the nurse's priority action?",
   options:["Document the statement and reassess at the next shift","Conclude the risk is low since the patient said they \"probably won't\" act","Take the statement seriously and complete a full suicide risk and safety assessment now","Avoid bringing it up further so as not to upset the patient"],
   answer:2,
   why:"Any disclosure of suicidal ideation is taken seriously regardless of qualifying language or prior attempt history — patients often attempt multiple times, and minimizing language doesn't reliably predict safety. The priority is a full risk and safety assessment now, not deferral or avoidance."}
},
{ id:"mh-crisis", title:"Crisis Intervention", kicker:"Four phases, three types, and why every crisis resolves one way or another",
  blocks:[
   {p:"A <strong>crisis</strong> is a sudden stressful event that is perceived as a threat, impacts an individual's problem-solving, and disrupts daily life. All people experience crises during their lives; crises are connected to a precipitating event or series of events, and are interpreted and perceived differently by each individual — a crisis for one person may not be one for another. Crises are typically resolved in a short period of time (1–3 months) and may provide an opportunity for personal growth, or may erode an individual's coping ability with subsequent problems and crises."},
   {h:"How a crisis is experienced"},
   {p:"A crisis response is based on the individual's perception of the event, availability of support, and availability of coping strategies. Human responses to crisis include feeling powerless, overwhelmed, and anxious. A person may perceive their coping strategies as inadequate and may become obsessive, solely directed on addressing the crisis, and may experience physical manifestations of anxiety. Hospitalization may be indicated if the client expresses potential to harm self or others."},
   {h:"The four phases of crisis"},
   {list:[
    "<strong>Phase 1</strong> — exposure to the problem or event, which causes anxiety and the initiation of strategies to cope with additional stress",
    "<strong>Phase 2</strong> — current coping mechanisms fail, anxiety increases, impairing functioning",
    "<strong>Phase 3</strong> — the person seeks assistance and/or uses all coping resources to resolve the conflict/crisis; resolution may occur",
    "<strong>Phase 4</strong> — if unresolved, leads to psychological distress, panic, and disordered thinking; may escalate to risk of harm to self and others"]},
   {h:"Three types of crises"},
   {list:[
    "<strong>Adventitious</strong> — unexpected stress over which the individual has no control (natural disasters, accidents, violence)",
    "<strong>Maturational/developmental</strong> — inability to cope with normal developmental stressors (adolescence to adulthood, marriage, childbirth, transitions in aging, retirement)",
    "<strong>Situational</strong> — unexpected and distressing life events (loss of job, death of a loved one, divorce, unplanned move)"]},
   {h:"Priority assessments/cues"},
   {list:[
    "Plan and/or capacity for harming self or others",
    "Precipitating event, detailed description including when it occurred",
    "Capacity to cope with crises, determine pre-crisis functioning",
    "Physical and emotional status, pre-existing psychiatric issues",
    "Previous experiences with this crisis, coping mechanisms employed",
    "Current coping mechanisms and their effectiveness, use of substances",
    "Existence and adequacy of support systems"]},
   {h:"Priority laboratory tests/diagnostic cues"},
   {p:"Serum blood alcohol levels and drug/toxicology screens."},
   {h:"Priority interventions/collaborative actions"},
   {list:[
    "Management emphasizes short-term problem identification, mobilization of resources",
    "Focus of management is safety, reducing anxiety, promoting problem-solving, and building support systems",
    "Establish a therapeutic relationship based on acceptance and active listening",
    "Set limits on aggressive, hostile, impulsive, or violent behavior",
    "Clarify the current crisis/problem, explore causes, and compare the nurse's perceptions with the client's",
    "Recognize feelings of anger, resentment, guilt, disappointment",
    "Discuss potential changes and strategies to deal with the crisis, advantages/disadvantages of different coping options, assist the client to select coping strategies",
    "Clarify components of the crisis that cannot be changed and the feelings those evoke",
    "Refer to resources and support systems"]},
   {h:"Priority medications"},
   {p:"No specific medications treat a crisis itself — clients may require medications to manage associated or underlying conditions."},
   {h:"Priority actual & potential complications"},
   {list:["Unresolved crisis may lead to anxiety, depression, and post-traumatic stress disorder","May harm self or others"]},
   {h:"Priority hypotheses for nursing care"},
   {list:[
    "Nurses may work with peer-support teams for clients in crisis, including those with personal experience dealing with crisis",
    "Nurses may use crisis intervention skills to help individuals after a disaster, a diagnosis with a life-threatening illness, or significant life change",
    "As clients learn to cope, nurses may be instrumental in fostering new coping mechanisms and ways to deal with future crises"]},
   {h:"Priority teaching/discharge needs"},
   {list:[
    "Ensure that clients and family members are aware of crisis hotlines, crisis centers, and hospital/agency resources focused on crisis intervention",
    "Reinforce personal strengths and effective coping"]},
   {hook:"Notice how directly this maps onto the Suicidal Ideation lesson: a suicide disclosure is very often phase 4 of an unresolved crisis, and the same core toolkit — safety first, a therapeutic and accepting relationship, active listening, and connecting the client to resources — is what both lessons are built around. Crisis intervention is the general framework; suicide risk assessment is its highest-stakes special case."},
   {h:"Aggression: risk factors and the prodromal syndrome"},
   {p:"Aggression on a psychiatric unit is associated with substance use disorders, rage, neurocognitive disorders or brain injury, social stressors, frustration, financial strain/poverty, and isolation — but the single strongest predictor of future violence is a <strong>past history of violence</strong>. Before aggression fully escalates, many clients pass through a <strong>prodromal syndrome</strong>: early warning behaviors that, if recognized and addressed promptly, give staff a real chance to prevent escalation to actual violence."},
   {list:[
    "Pacing",
    "Yelling",
    "Irritability",
    "Talking to self",
    "Threatening self-harm or harm to others",
    "Poor cooperativeness — refusing to sit for vital signs or paperwork",
    "Clenched fists",
    "Angry facial expression"]},
   {h:"De-escalation: least invasive first"},
   {p:"NCLEX questions about an escalating client almost always reward the <strong>least restrictive/invasive</strong> option among the answer choices. In roughly increasing intensity:"},
   {list:[
    "Reduce environmental stimulation — dim the lights, lower monitor/alarm volume if it's safe to do so",
    "Use a calm voice and a supportive (not irritated or fearful) facial expression",
    "Keep moderate eye contact — not an intense stare, but not avoidant either, and adjusted for cultural context",
    "Use extreme caution with touch — touch can escalate agitation rather than calm it",
    "Avoid \"why\" questions and accusatory language, which put the client on the defensive",
    "Offer a distraction if appropriate — food, a drink, a walk, a phone call",
    "Attempt a voluntary <strong>safety contract</strong> with the client if they are organized and cooperative enough to participate"]},
   {h:"When de-escalation fails: PMAB"},
   {p:"<strong>PMAB</strong> (Prevention and Management of Aggressive Behaviors) is the term for the structured, stepwise agency response once de-escalation alone isn't working: ensure adequate staffing, call security or activate the agency's emergency response, protect other clients on the unit, and only after those measures fail, a manual hold performed by a specially trained individual per agency policy, with sedating medication prepared as the next step."},
   {p:"During and after a manual hold: continuously monitor airway patency and respirations, and treat the client's decreasing struggle as one indicator that de-escalation is occurring. Establish and communicate clear release criteria — such as speaking normally and decreased struggling — before the hold begins, and continue close observation after any sedating medication is given, since these medications take time to reach full effect."},
   {h:"Debriefing after a violent episode"},
   {p:"A <strong>debriefing</strong> after any violent episode is a standard part of the response, not optional: staff review what happened, which interventions were and weren't effective and why, and how to prevent a recurrence. Other clients on the unit who witnessed the event may also need reassurance and support afterward — the event's impact isn't limited to the client and staff directly involved."}
  ],
  check:{stem:"A client's spouse died unexpectedly one week ago, and the client reports feeling unable to cope, overwhelmed, and \"stuck\" since the funeral. Which type of crisis does this best represent?",
   options:["Adventitious crisis","Maturational/developmental crisis","Situational crisis","This does not qualify as a crisis since grief is a normal response to loss"],
   answer:2,
   why:"An unexpected and distressing life event such as the death of a loved one is a situational crisis. Adventitious crises involve events like disasters or violence outside anyone's control, and maturational/developmental crises involve normal life-stage transitions rather than a sudden loss."}
},
{ id:"mh-legal-ethical", title:"Legal & Ethical Issues in Psychiatric Care", kicker:"Admission types, patient rights, informed consent, confidentiality, and restraints/seclusion",
  blocks:[
   {p:"Psychiatric patients keep every constitutional right any other citizen has — having a mental health disorder is never, by itself, grounds to restrict someone's liberty, and unknowingly violating a patient's rights can carry serious legal consequences for the nurse, the provider, and the facility. This lesson covers the legal framework that shows up constantly on exams: how patients are admitted, what rights they retain once admitted, how consent and confidentiality work, and when restraints/seclusion are legally permitted."},
   {h:"Voluntary vs. involuntary admission"},
   {table:{head:["Type","How it happens","Key rights retained"],rows:[
     ["Voluntary admission","The client (or their guardian) seeks admission for care on their own initiative","Free to request discharge/sign out at any time (with provider notification); retains full civil rights"],
     ["Involuntary admission","Ordered when a person is mentally ill and a danger to self or others, or unable to meet their own basic needs; requires a psychiatrist/PHCP certification, and in most cases a court hearing","Retains the right to informed consent and to refuse treatment (except in an immediate danger situation); can request a hearing to seek release (writ of habeas corpus)"]]}},
   {p:"A client on a voluntary hold who is later judged to be a danger to self or others can be converted to involuntary status while legal proceedings are pursued — voluntary admission is not an unconditional guarantee of same-day discharge if new safety concerns emerge."},
   {h:"The psychiatric patient's bill of rights"},
   {list:[
    "Right to treatment in the least restrictive setting appropriate to their needs",
    "Right to informed consent, and to refuse treatment (unless a legal exception applies)",
    "Right to confidentiality of their medical/psychiatric information",
    "Right to communicate with people outside the hospital, and to keep personal effects",
    "Right to periodic review of their status and to legal representation",
    "Right to habeas corpus — a hearing to challenge involuntary detention",
    "Right to enter contracts, manage property, marry/divorce, and vote — a psychiatric diagnosis alone does not strip these rights"]},
   {h:"Confidentiality and HIPAA"},
   {p:"All records concerning psychiatric care must be kept confidential unless the patient consents to disclosure — HIPAA is the law, and psychiatric information carries extra sensitivity because of the stigma attached to it. There are four recognized exceptions where disclosure is required even without patient consent:"},
   {list:["Suspected child (or vulnerable adult) abuse","Criminal cases/court order","Government requests","When the public has a right to know (for example, a credible, specific threat against an identifiable third party)"]},
   {hook:"A patient telling the nurse their suicidal thoughts \"in confidence\" is a common exam trap: the nurse cannot promise to keep information confidential when it conflicts with the duty to keep the patient safe. The nurse's duty is to inform the patient up front that anything relevant to safety will be shared with the treatment team — not to make (and then break) a private promise."},
   {h:"Informed consent"},
   {p:"Obtaining informed consent is the responsibility of the primary provider, not the nurse — but the nurse plays an essential supporting role: providing relevant information, clarifying questions, and documenting any concerns the patient raises. Before a treatment or procedure proceeds, the patient (or legal guardian) must understand what the treatment is, its risks and benefits, and the available alternatives — and must be able to communicate a choice. If a nurse has doubts about whether a patient truly understands or is competent to consent, the treatment team must be notified before proceeding."},
   {h:"Competency and legal guardianship"},
   {p:"A patient is assumed competent unless their thoughts or behavior strongly suggest otherwise — a psychiatric diagnosis by itself does not make someone incompetent. Only a judge can legally declare a person incompetent and appoint a guardian; it is not a clinical decision a nurse or even a psychiatrist can make unilaterally. For a hospitalized minor, a parent or court-appointed guardian must be established at admission; if parents have surrendered responsibility to an institution with proper documentation, the institution may hold that decision-making authority."},
   {h:"Restraints and seclusion"},
   {list:[
    "Used <strong>only</strong> to prevent the patient from injuring themselves or others, and only after less restrictive interventions have failed — never for staff convenience or punishment",
    "Requires an order from a licensed independent practitioner; some states allow emergency application followed promptly by an order",
    "Time-limited, with continuous observation and frequent, scheduled documentation of food, fluids, toileting, circulation, and safety",
    "Discontinued as soon as the patient regains control and can safely agree to remain in control",
    "Governed by facility policy and accrediting-body standards (e.g., The Joint Commission)"]},
   {hook:"Two points reinforce these standards in practice: a manual hold may only be performed by staff who have completed the agency's required specialized training, and a voluntary <strong>safety contract</strong> negotiated with a cooperative, organized client is itself a least-restrictive alternative worth attempting — and documenting — before any restraint or seclusion order is pursued."},
   {h:"Documentation"},
   {p:"Documentation is a legal and ethical duty, not paperwork for its own sake — it is the legal proof of the nature and quality of care provided, supports continuity of care, and confirms that ordered treatments were actually completed. Unclear, incomplete, or subjective documentation can result in denial of reimbursement and creates real liability exposure for the nurse, other providers, and the facility."}
  ],
  check:{stem:"A client who was admitted voluntarily now tells the nurse they want to leave the hospital immediately, but the treatment team believes the client is at high risk of harming themselves. What is the most accurate statement about this situation?",
   options:["A voluntary client can never be prevented from leaving under any circumstance","The client can be detained while the provider pursues involuntary commitment proceedings","The nurse can personally decide to restrain the client from leaving without any order","Voluntary status automatically becomes permanent and cannot change"],
   answer:1,
   why:"A voluntary client who is judged to be a danger to self or others can be detained while the provider seeks involuntary commitment through the appropriate legal process — voluntary admission doesn't guarantee unconditional same-day discharge once new safety concerns arise. The decision to detain and pursue commitment goes through the provider and legal process, not a unilateral nursing decision."}
},
{ id:"mh-therapies", title:"Treatment Modalities: Milieu, Psychotherapy, Behavior Therapy & ECT", kicker:"Individual, group, family, and environmental therapies — plus the somatic option (ECT)",
  blocks:[
   {p:"Medication is only one arm of psychiatric treatment. This lesson maps out the non-pharmacologic treatment modalities that show up across nearly every diagnosis in this section — knowing which therapy fits which situation, and recognizing the vocabulary each one uses, is tested independently of any single disorder."},
   {h:"Milieu therapy"},
   {p:"The <strong>milieu</strong> is the safe physical and social environment in which a patient receives treatment — more than just the physical unit, it's the therapeutic community that staff and patients build together. Safety is always the top priority within the milieu, and every member of the interprofessional team (RN, social worker, recreational/occupational/expressive therapists, psychologist, psychiatrist) contributes to it. Community meetings, activity and social-skills groups, and structured exercise programs are common milieu tools, and staff on psychiatric units often wear street clothes rather than uniforms to make the environment feel less clinical."},
   {h:"Levels of psychotherapy"},
   {table:{head:["Level","What it involves","Goal"],rows:[
     ["Supportive","Brief therapy, may extend over years; the therapist reinforces the client's existing coping mechanisms rather than introducing new ones","Help the client express feelings, explore alternatives, and make decisions in a safe environment"],
     ["Reeducative","A longer, more structured, planned approach — may use short-term techniques like reality therapy, cognitive restructuring, or behavior modification","Teach and practice new, more effective coping skills"],
     ["Reconstructive","Emotional and cognitive restructuring of the self takes place, aiming for deeper insight","Greater self-understanding, emotional freedom, and development of potential"]]}},
   {h:"Individual, group, and family therapy"},
   {list:[
    "<strong>Individual therapy</strong> — one-on-one counseling, short- or long-term, working toward goals the patient and therapist establish together",
    "<strong>Group therapy</strong> — a psychotherapist guides a group (ideally 4–10 members) with similar concerns; especially useful for addictions, and moves through predictable stages: initial (superficial, members sizing each other up), working (real therapeutic work, established norms/roles), and termination (processing the ending, applying what was learned)",
    "<strong>Family therapy</strong> — treats the family system, not just the identified patient; useful for childhood/adolescent adjustment issues, marital discord, and abusive family dynamics",
    "<strong>Cognitive therapy</strong> — targets the negative, distorted thinking patterns (\"the future is bleak and hopeless\") believed to drive depression; homework assignments (like tracking pleasurable activities) are a hallmark technique",
    "<strong>Crisis intervention</strong> — short-term, focused on restoring the client to their pre-crisis level of functioning; usually just the client and therapist, may be one session or several over months (see the dedicated Crisis Intervention lesson for the full framework)"]},
   {h:"Behavior therapy techniques"},
   {p:"Behavior therapy assumes maladaptive behavior was learned in response to a trigger, and can be unlearned through the same conditioning principles. Several named techniques fall under this umbrella:"},
   {table:{head:["Technique","How it works","Example use"],rows:[
     ["Systematic desensitization","Teach relaxation, then gradually introduce increasing exposure to the feared stimulus","Treatment of choice for phobias — a fear of flying is approached step-by-step from visualization to an actual flight"],
     ["Implosion therapy (flooding)","Direct, immediate exposure to the feared situation without a gradual buildup or relaxation training first","Contraindicated in fragile patients or those with a medical condition that exposure-induced anxiety could worsen (e.g., cardiac dysrhythmias)"],
     ["Aversion therapy","Pairs an unwanted stimulus with the habit to be eliminated","Disulfiram (Antabuse) makes a patient violently ill if they drink alcohol"],
     ["Assertiveness training","Teaches the patient to appropriately stand up for themselves while respecting others' rights","Role-modeling assertive vs. passive-aggressive or aggressive responses"],
     ["Operant conditioning","Behavior modification through positive or negative reinforcement","Token economy (below) is a direct application"],
     ["Token economy","Desired behavior is rewarded with tokens the patient exchanges for privileges or objects","Must be applied consistently and promptly to be effective"],
     ["Thought stopping","The patient learns to interrupt an unwanted thought pattern with a cue word (\"stop\") and redirect attention","Visualizing an actual stop sign while saying the word"]]}},
   {p:"Cognitive behavioral therapy (CBT) and dialectical behavior therapy (DBT) are the two most widely used therapeutic models built on these behavioral principles, and both are referenced repeatedly across the disorder-specific lessons in this section (DBT especially for borderline personality disorder)."},
   {h:"Electroconvulsive therapy (ECT) — in detail"},
   {p:"ECT delivers a brief electrical current through electrodes attached to the temples to induce a controlled, therapeutic seizure. It is <strong>not a cure</strong>, but it is highly effective and reserved for severe major depression or bipolar depression that hasn't responded to other treatments, especially when rapid symptom relief is needed (active suicidality, catatonia, psychotic depression, or a patient who cannot tolerate medication). Certain patients with schizophrenia may also be candidates."},
   {h:"Before the procedure"},
   {list:[
    "Written, signed informed consent is required, with patient/family education that directly addresses myths and fears about ECT — it is a treatment, not a punishment, and is done under anesthesia",
    "Consent must be obtained by the practitioner performing the procedure, and the client retains the right to withdraw consent at any point in the course of treatment, even after signing",
    "The client is kept NPO (nothing by mouth) for at least 6–8 hours before the procedure, exactly as for any other procedure requiring general anesthesia, to reduce aspiration risk",
    "A short-acting general anesthetic is given, followed by a muscle relaxant to minimize outward movement during the seizure",
    "Premedication relaxes the muscles specifically to prevent injury from the seizure activity",
    "An airway or mouth guard is placed to protect the client from biting the tongue",
    "ECT is generally considered a safer alternative to psychotropic medication for severe depression during pregnancy, since it avoids fetal drug exposure"]},
   {h:"During the procedure"},
   {p:"The electrical stimulus is administered and produces a brief seizure lasting about 15–70 seconds. The whole procedure is brief; outward movement is usually only a slight movement of the hands, feet, or a toe because of the premedication."},
   {h:"After the procedure"},
   {list:[
    "The client is transported to a recovery area with a blood pressure cuff and oximeter in place, with oxygen, suction, and emergency equipment available",
    "The client typically wakes about 15 minutes after the procedure",
    "Confusion and disorientation are expected for several hours afterward — provide frequent orientation that is brief, distinct, and simple, plus reassurance",
    "The client returns to the nursing unit once oxygen saturation is acceptable, vital signs are stable, and mental status is satisfactory",
    "<strong>Expected side effects:</strong> confusion, disorientation, and short-term memory loss; also headache, muscle soreness, nausea, and tachycardia. Memory usually recovers fully, though a minority of clients experience memory loss lasting up to 6 months",
    "<strong>Safety priority:</strong> monitor a client who has recently had ECT — and any client recently started on an antidepressant — closely for suicidal ideation. A sudden increase in energy without a corresponding lift in mood can mean the client now has the physical energy to act on suicidal thoughts they didn't have the energy to act on before"]},
   {h:"Course and maintenance"},
   {p:"The usual course is 6–12 treatments given 2–3 times per week (about 2–5 days apart initially). Maintenance ECT, roughly once a month, may help reduce the relapse rate for a client with recurrent depression."},
   {h:"Detoxification and dual diagnosis"},
