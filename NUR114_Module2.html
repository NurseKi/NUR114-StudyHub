    "The most common reason for antidepressant non-adherence is often <strong>sexual dysfunction</strong> (anorgasmia, impotence) — usually manageable, but worth asking about directly since clients rarely volunteer it",
    "In older adults, the greatest antidepressant-related risk to monitor for is <strong>hyponatremia</strong> — check sodium periodically, especially early in treatment",
    "TCAs also <strong>lower the seizure threshold</strong> and can cause a withdrawal reaction if stopped abruptly — taper rather than discontinue suddenly",
    "Antidepressants are prescribed for indications beyond depression, including severe anxiety, obesity, bulimia, smoking cessation, alcoholism, bipolar disorder, and premenstrual dysphoric disorder",
    "Some atypical antipsychotics (notably <strong>aripiprazole</strong>) are used adjunctively alongside an antidepressant to manage treatment-resistant major depressive disorder — a cross-topic fact worth remembering"]},
   {hook:"The black-box suicide warning has a clinical mechanism worth understanding, not just memorizing: as a depressive episode starts to lift, a client can regain enough energy and organization to act on suicidal thoughts that were present all along but that severe psychomotor slowing had prevented them from acting on. This is why close suicide-risk monitoring matters most in the earliest weeks of treatment or right after a dose change — not only at the point of diagnosis."}
  ]
},
{ id:"mh-meds-moodstabilizers", title:"Mood Stabilizers: Lithium & Anticonvulsants", kicker:"Lithium's narrow safety margin, plus the anticonvulsants borrowed for bipolar disorder",
  blocks:[
   {p:"Mood stabilizers are the backbone of bipolar disorder treatment, used to prevent both manic and depressive poles rather than treating a single episode type."},
   {h:"Lithium — the classic mood stabilizer"},
   {p:"Lithium has one of the narrowest therapeutic windows of any commonly used psychiatric drug (therapeutic level roughly 0.6–1.2 mEq/L), which is why it is one of the highest-yield medications in this entire course. Common, expected side effects are weight gain and dry mouth — the real testable content is toxicity."},
   {table:{head:["LITH mnemonic","Toxicity sign"],rows:[
     ["L","<strong>L</strong>ethargy / confusion"],
     ["I","<strong>I</strong>ncreased urination (early) progressing to renal impairment"],
     ["T","<strong>T</strong>remor (coarse, worsening from fine baseline tremor)"],
     ["H","<strong>H</strong>ypotension / cardiac dysrhythmias"]]}},
   {hook:"The trap: NSAIDs, thiazide diuretics, dehydration, a low-sodium diet, and excessive caffeine can all push lithium levels toward toxicity without the patient's lithium dose changing at all. Medication reconciliation for a lithium patient is really a search for anything that shifts fluid, sodium, or renal clearance — ACE inhibitors and NSAIDs are the two most commonly tested interacting drug classes."},
   {list:[
    "<strong>Monitoring</strong> — regular serum lithium levels, renal function, thyroid function (lithium can cause hypothyroidism), and steady sodium/fluid intake",
    "<strong>Patient teaching</strong> — maintain consistent daily fluid and sodium intake; don't start or stop an NSAID or diuretic without telling the prescriber; hold the dose and call the provider for any early toxicity sign (GI upset, coarse tremor, confusion)"]},
   {h:"Anticonvulsants used as mood stabilizers"},
   {p:"Several antiepileptic drugs are also first-line or adjunct options for bipolar disorder, especially when lithium is contraindicated or not tolerated."},
   {list:[
    "<strong>Valproic acid / divalproex (Depakote)</strong> — monitor liver function and platelet counts; teratogenic (avoid in pregnancy)",
    "<strong>Carbamazepine (Tegretol)</strong> — risk of agranulocytosis and aplastic anemia; monitor CBC",
    "<strong>Lamotrigine (Lamictal)</strong> — must be titrated slowly; rapid titration raises the risk of Stevens-Johnson syndrome, a life-threatening rash"]},
   {h:"Lithium — additional mechanism and practical details"},
   {p:"Lithium works by modulating neurotransmitter release and intracellular signaling to calm mania, though it is not effective for every client with bipolar disorder. Because lithium is administered as a <strong>sodium salt</strong>, it is one of the few medications that requires a <strong>consistently high sodium and fluid intake</strong> — a low-sodium diet or dehydration concentrates lithium in the body and pushes levels toward toxicity, so a sodium-restricted diet started for an unrelated reason (like a new cardiac diagnosis) is a genuine hidden danger for a client on lithium. Lithium is teratogenic and should be used cautiously in clients with thyroid disease."},
   {list:[
    "Additional expected side effects beyond weight gain and dry mouth: polyuria, thirst, edema, metallic taste, bloating",
    "Response typically takes <strong>1–2 weeks</strong> to lift bipolar symptoms, with frequent monitoring especially early in treatment; suicide risk should always be assessed alongside mood",
    "When lithium isn't effective or tolerated, anticonvulsants (valproate, carbamazepine) or haloperidol may be used as alternatives"]},
   {hook:"A unique adherence challenge in bipolar treatment: some clients miss the energy, productivity, and euphoria of a manic episode and stop taking their mood stabilizer voluntarily once they start feeling \"leveled out.\" Building the client's own insight into this pattern — rather than only reciting side effects — is a key nursing intervention for long-term adherence."},
   {h:"Anticonvulsant mood stabilizers — additional risks"},
   {list:[
    "<strong>Valproate/divalproex</strong> also carries risk of <strong>pancreatitis</strong> in addition to hepatotoxicity and teratogenicity",
    "<strong>Lamotrigine's</strong> Stevens-Johnson Syndrome risk typically starts with flu-like symptoms before progressing to a painful, peeling rash — teach clients to report any new rash immediately rather than waiting to see if it worsens"]}
  ]
},
{ id:"mh-meds-antipsychotics", title:"Antipsychotics: Brand/Generic Reference & EPS Management", kicker:"The specific drug names on the blueprint, plus what treats the movement side effects",
  blocks:[
   {p:"This lesson is the drug-name reference card for the typical-vs-atypical concepts already covered in the Psychotic Disorders unit — use that lesson for the pathophysiology (EPS, NMS, clozapine/agranulocytosis) and this one to lock in which brand name goes with which generic name."},
   {h:"Atypical antipsychotics (second-generation) — named on the blueprint"},
   {table:{head:["Brand name","Generic name"],rows:[
     ["Abilify","Aripiprazole"],
     ["Zyprexa","Olanzapine"],
     ["Seroquel","Quetiapine"],
     ["Risperdal","Risperidone"],
     ["Geodon","Ziprasidone"],
     ["Clozaril","Clozapine (agranulocytosis risk — requires regular WBC monitoring)"]]}},
   {p:"Notice the pattern from the earlier lesson: most of these generic names end in <strong>-pine</strong> or <strong>-done/-idone</strong> — a fast way to recognize an atypical antipsychotic on a medication list you haven't memorized."},
   {h:"Typical antipsychotics (first-generation)"},
   {p:"<strong>Haloperidol (Haldol)</strong> is the classic example — effective against positive symptoms, but with the highest EPS risk of any class."},
   {table:{head:["Brand name","Generic name"],rows:[
     ["Haldol","Haloperidol"],
     ["Thorazine","Chlorpromazine"],
     ["Prolixin","Fluphenazine"],
     ["Mellaril","Thioridazine"],
     ["Stelazine","Trifluoperazine"],
     ["Navane","Thiothixene"]]}},
   {h:"Treating EPS: benztropine"},
   {p:"<strong>Benztropine (Cogentin)</strong> is an anticholinergic medication used specifically to treat or prevent extrapyramidal symptoms (tremor, rigidity, akathisia, acute dystonia) caused by antipsychotics. <strong>Diphenhydramine (Benadryl)</strong>, also anticholinergic, is an alternative for the same purpose, particularly for acute dystonic reactions. Both work by restoring the dopamine-acetylcholine balance in motor pathways that antipsychotics disrupt — specifically, benztropine is thought to block central cholinergic receptors in the basal ganglia."},
   {list:[
    "<strong>Anticholinergic side effects to watch for with benztropine itself</strong> — dry mouth, blurred vision, urinary retention, constipation (the classic anticholinergic picture); watch especially closely in older adults and debilitated clients, who are more sensitive to these effects and to toxic psychosis (confusion, disorientation, memory impairment, visual hallucinations)",
    "<strong>Acute dystonia is an emergency-adjacent event</strong> — sudden muscle spasm (often neck/throat/eyes) that is frightening but treatable; IM/IV benztropine or diphenhydramine typically resolves it quickly, with IM/IV onset around 15 minutes versus about 1 hour PO",
    "<strong>Not for tardive dyskinesia</strong> — benztropine is specifically not recommended for tardive dyskinesia; at certain doses it produces atropine-like toxicity that can actually aggravate TD symptoms rather than treat them",
    "<strong>Never stop abruptly</strong> — benztropine is tapered down gradually rather than discontinued all at once",
    "<strong>Heat caution</strong> — benztropine can reduce sweating (anhidrosis), so clients should limit hot-weather activity to avoid overheating/heat stroke",
    "<strong>Look-alike/sound-alike alert</strong> — don't confuse benztropine with bromocriptine, a different drug entirely",
    "<strong>Additive anticholinergic risk</strong> — combining benztropine with amantadine, haloperidol, phenothiazines, or tricyclic antidepressants can cause additive anticholinergic effects (confusion, hallucinations, GI effects, fever, heat intolerance)"]}
  ]
},
{ id:"mh-meds-anxiolytics", title:"Anxiolytics & Benzodiazepines", kicker:"Fast-acting and dependence-prone vs. slow-onset and non-habit-forming",
  blocks:[
   {p:"Anxiolytic treatment splits into two philosophies: benzodiazepines, which work almost immediately but carry real dependence and withdrawal risk, and buspirone, which takes weeks to work but carries essentially no dependence risk. Choosing between them (or combining them short-term) is a recurring clinical decision."},
   {h:"Benzodiazepines — the blueprint list"},
   {table:{head:["Brand name","Generic name"],rows:[
     ["Valium","Diazepam"],
     ["Klonopin","Clonazepam"],
     ["Ativan","Lorazepam"],
     ["Xanax","Alprazolam"],
     ["Versed","Midazolam"]]}},
   {p:"Benzodiazepines enhance the effect of GABA (the brain's main inhibitory neurotransmitter), producing rapid anxiolytic, sedative, muscle-relaxant, and anticonvulsant effects. This is exactly why they're also first-line for alcohol withdrawal (covered in the Substance Use unit) — cross-tolerance with alcohol at the GABA receptor."},
   {list:[
    "<strong>Common side effects</strong> — sedation, dizziness, ataxia (fall risk, especially in older adults)",
    "<strong>Dependence/withdrawal</strong> — physical dependence develops with regular use; abrupt discontinuation after prolonged use can cause seizures, making these drugs dangerous to stop \"cold turkey\" — always taper",
    "<strong>Respiratory depression</strong> — the danger multiplies when combined with other CNS depressants (opioids, alcohol); this combination is a leading cause of overdose death",
    "<strong>Versed (midazolam)</strong> stands apart from the others on this list — it's primarily used for procedural sedation and anesthesia induction rather than outpatient anxiety management"]},
   {h:"Buspirone — the non-benzodiazepine option"},
   {p:"Buspirone is a non-habit-forming anxiolytic that does not act on GABA and carries no dependence or withdrawal risk, but it takes 2–4 weeks for full effect and does nothing for an acute panic attack in the moment — it's a maintenance drug, not a rescue drug. This is the direct trade-off nurses need to teach patients: benzodiazepines work now but carry dependence risk; buspirone is safer long-term but won't help today."},
   {h:"Additional indications and precautions"},
   {p:"Beyond anxiety, benzodiazepines are also used for acute alcohol withdrawal, skeletal muscle spasms, preoperative sedation, and seizures/status epilepticus. They are <strong>not intended for long-term use</strong> — tolerance and dependence develop with regular use, which is exactly why any benzodiazepine must be tapered rather than stopped abruptly."},
   {list:[
    "<strong>Black-box warning:</strong> benzodiazepines are used with extreme caution in clients with suicidal ideation — the same mechanism as antidepressants: raising a depressed client's energy level can give them the physical capability to act on a suicide plan even before their mood has fully lifted",
    "Contraindicated with alcohol; less effective when combined with high caffeine or nicotine intake",
    "Teratogenic — use caution in clients who are or may become pregnant",
    "Reduce the dose in older adults, who accumulate and excrete these medications more slowly"]},
   {h:"Buspirone — additional details"},
   {p:"Because buspirone doesn't cause CNS depression and carries no addiction potential, it's often the better choice for a client with a substance use disorder history. It generally produces fewer side effects than a benzodiazepine, but grapefruit and grapefruit juice should be restricted while taking it."},
   {hook:"A subtle but testable behavioral sign that an anxiolytic or antipsychotic is working: improved hygiene and grooming, and appropriate dress, often show up before the client can verbally describe feeling less anxious — mood and cognitive organization improving enough to reinvest in self-care is itself a positive clinical sign."}
  ]
},
{ id:"mh-meds-stimulants", title:"Stimulants (ADHD Medications)", kicker:"The mainstay ADHD treatment, plus the safety monitoring that goes with it",
  blocks:[
   {p:"Stimulant medications are first-line pharmacologic treatment for ADHD, working by increasing dopamine and norepinephrine availability in the prefrontal cortex — the paradox being that a stimulant improves focus and reduces impulsivity in ADHD rather than worsening hyperactivity. This <strong>paradoxical calming effect</strong> comes from stimulating dopamine and norepinephrine release while blocking their reuptake, which improves the signaling deficits underlying ADHD's inattention and impulsivity. Methylphenidate is also indicated for narcolepsy, and is classified as a <strong>Schedule II controlled substance</strong> — amphetamine-like, with high abuse and dependence potential."},
   {h:"Common agents"},
   {list:[
    "<strong>Methylphenidate</strong> (Ritalin, Concerta)",
    "<strong>Amphetamine/dextroamphetamine salts</strong> (Adderall)",
    "<strong>Lisdexamfetamine</strong> (Vyvanse) — a prodrug, which gives it a lower abuse potential than immediate-release stimulants"]},
   {h:"Monitoring and side effects"},
   {list:[
    "<strong>Cardiovascular</strong> — stimulants raise heart rate and blood pressure; a baseline cardiac history/EKG is prudent before starting, and ongoing vital sign monitoring continues through treatment",
    "<strong>Growth suppression</strong> — appetite suppression can affect growth velocity in children; height and weight are tracked at routine visits",
    "<strong>Insomnia</strong> — dosing earlier in the day helps; a common reason for a late-afternoon \"add-on\" low dose to be avoided",
    "<strong>Controlled substance</strong> — most stimulants are Schedule II, meaning strict prescribing rules and a real misuse/diversion potential that requires patient and caregiver education",
    "<strong>Full adverse effect profile</strong> — anorexia, nausea/vomiting, insomnia, agitation, diuresis, tachycardia, palpitations, dry mouth, growth retardation in children, rare stroke/CVA, and tolerance/dependence with chronic use"]},
   {p:"Medication is typically combined with behavioral therapy and structured environmental supports (covered in the ADHD lesson) rather than used as a stand-alone treatment."},
   {h:"Nursing and patient teaching"},
   {list:[
    "Administer stimulant doses early in the day to avoid insomnia",
    "Encourage a large, protein-rich breakfast to offset appetite suppression, since anorexia tends to worsen as the day goes on",
    "Discuss provider-guided \"drug holidays\" during school breaks to allow catch-up growth in children",
    "Taper rather than abruptly discontinue, given the potential for tolerance and withdrawal",
    "Avoid alcohol and other CNS stimulants",
    "For the methylphenidate transdermal patch: apply 2 hours before the needed effect, remove 9 hours later, and titrate the dose weekly as needed"]}
  ]
},
{ id:"mh-meds-emergency", title:"Naloxone: The Opioid Reversal Agent", kicker:"Mechanism, administration, and the re-sedation trap",
  blocks:[
   {p:"<strong>Naloxone (Narcan)</strong> is an opioid antagonist that rapidly displaces opioids from receptor sites, reversing respiratory depression in an opioid overdose. It is the definitive answer whenever a scenario describes an unresponsive patient with pinpoint pupils and a slow, shallow respiratory rate after opioid exposure."},
   {h:"Key facts"},
   {list:[
    "<strong>Onset</strong> — works within 2–5 minutes, whether given IV, IM, intranasally, or via auto-injector, which is why it's the community-distributed, layperson-administered antidote for suspected overdose",
    "<strong>Duration is shorter than most opioids</strong> — naloxone's effect can wear off before a long-acting opioid (like methadone or extended-release oxycodone) has cleared, so the patient can slip back into respiratory depression after the naloxone wears off; repeat dosing and close monitoring are required, not a single dose and discharge",
    "<strong>Precipitates withdrawal</strong> — in an opioid-dependent patient, naloxone can trigger acute, uncomfortable (though not typically life-threatening) opioid withdrawal symptoms — this is expected and is a sign the drug worked, not a paradoxical reaction",
    "<strong>No effect on non-opioid overdoses</strong> — naloxone won't reverse respiratory depression from benzodiazepines or other sedatives; the diagnosis has to actually be opioid-related for it to help"]},
   {h:"Dosing and routes"},
   {p:"Adult dosing is typically <strong>0.4–2 mg IV, IM, or subcutaneously</strong>, repeated every <strong>2–3 minutes</strong> if there's no response. The intranasal spray formulation (Narcan) comes as a single-dose device and can be repeated in alternating nostrils every 2–3 minutes."},
   {h:"Onset by route"},
   {table:{head:["Route","Onset"],rows:[
     ["IV","1–2 minutes"],
     ["IM or subcutaneous","2–5 minutes"],
     ["Intranasal","8–13 minutes"]]}},
   {h:"Cardiac risk on abrupt reversal"},
   {p:"Because naloxone is displacing opioids so quickly, abrupt reversal can trigger <strong>ventricular fibrillation, ventricular tachycardia, or cardiac arrest</strong> — cardiovascular status needs close monitoring after any dose, and this risk is specifically emphasized for <strong>postoperative</strong> reversal of opioid effects, not just street-overdose scenarios."},
   {h:"Look-alike/sound-alike alerts"},
   {list:[
    "Don't confuse <strong>naloxone</strong> with <strong>naltrexone</strong> (used for ongoing maintenance therapy, not emergency reversal), <strong>Lanoxin</strong>, or <strong>nalbuphine</strong>",
    "Don't confuse the brand name <strong>Narcan</strong> with <strong>Marcaine</strong>"]},
   {h:"Neonatal risk"},
   {p:"Precipitated opioid withdrawal from naloxone can be <strong>life-threatening in neonates under 4 weeks old</strong> — watch for excessive crying, hyperreflexia, and seizures in this population specifically, not just the adult withdrawal picture (nausea, vomiting, diaphoresis, tachycardia, CNS excitement, increased blood pressure)."},
   {h:"Patient and family teaching"},
   {list:[
    "Give naloxone <strong>immediately</strong> for a suspected opioid overdose — don't wait to be certain",
    "Seek emergency help <strong>immediately</strong> after giving the first dose",
    "Give additional doses every <strong>2–3 minutes</strong> if there's no response, while waiting for EMS to arrive"]}
  ]
}
,
{ id:"iis-meds-antiinflammatory", title:"NSAIDs, DMARDs, Corticosteroids & Antihistamines", kicker:"The consolidated drug-name reference card for RA, OA, SLE, and hypersensitivity — full detail lives in each condition's own lesson",
  blocks:[
   {p:"This lesson is the fast-reference med card pulling together every anti-inflammatory and immune-modulating drug named across the Osteoarthritis, Rheumatoid Arthritis, Lupus, and Hypersensitivity Reactions lessons — use those lessons for the full clinical picture (which drug treats which flare, specific monitoring detail) and this one to lock in which drug belongs to which class."},
   {h:"NSAIDs — symptom control, not disease-modifying"},
   {p:"<strong>Examples:</strong> ibuprofen (OA), aspirin, celecoxib — a COX-2 inhibitor (RA), indomethacin, naproxen, sulindac (SLE). NSAIDs inhibit cyclooxygenase (COX) enzymes, reducing prostaglandin production and, with it, pain, fever, and inflammation. They relieve symptoms in OA, RA, and SLE alike, but don't alter the underlying disease process."},
   {list:[
    "<strong>GI risk</strong> — prostaglandins normally protect the gastric lining, so NSAIDs raise the risk of gastric ulcers and GI bleeding — the most significant adverse effect named across every NSAID in this section's source material",
    "<strong>Aspirin-specific</strong> — monitor serum salicylate levels for toxicity if the daily dose exceeds 3,600 mg",
    "<strong>Renal risk</strong> — reduced renal blood flow, especially in older adults, with dehydration, or with concurrent ACE inhibitor/diuretic use",
    "<strong>Key interaction to remember</strong> — NSAIDs reduce renal clearance of lithium, pushing lithium toward toxicity (see the Mental Health Medications unit)"]},
   {h:"DMARDs — traditional/non-biologic (disease-modifying)"},
   {p:"<strong>Examples:</strong> methotrexate (RA and SLE), hydroxychloroquine (RA and SLE), leflunomide and sulfasalazine (RA). Unlike NSAIDs, DMARDs slow or halt joint/organ damage rather than just controlling symptoms."},
   {list:[
    "<strong>Methotrexate</strong> — oral/IV steroid-sparing immunosuppressant, used as an alternative to corticosteroids in both RA and SLE; monitor CBC for hepatotoxicity and bone marrow suppression",
    "<strong>Hydroxychloroquine</strong> — oral antimalarial, treats fatigue and joint inflammation (RA) or fatigue, joint pain, and skin disorders (SLE); requires an eye exam every 6–12 months due to retinopathy risk",
    "<strong>Leflunomide</strong> — blocks immune cell overproduction; <strong>teratogenic</strong> — rule out pregnancy before starting",
    "<strong>Sulfasalazine</strong> — decreases pain and inflammation, may prevent joint damage"]},
   {h:"DMARDs — targeted/biologic agents (RA)"},
   {list:[
    "<strong>Tofacitinib, baricitinib</strong> — oral Janus kinase (JAK) inhibitors that interfere with the enzymes driving joint inflammation; used after initial DMARD therapy fails",
    "<strong>Adalimumab</strong> — a tumor necrosis factor (TNF) inhibitor that decreases immune/inflammatory response; used when other antirheumatics haven't worked",
    "<strong>Anakinra</strong> — subcutaneous interleukin-1 receptor antagonist; used when other antirheumatics haven't worked or can't be tolerated",
    "<strong>Belimumab</strong> (SLE) — IV monoclonal antibody that binds and inactivates BLyS, halting the B-cell antibody production that drives lupus; live vaccines are contraindicated for 30 days before starting it",
    "<strong>Rituximab</strong> (SLE) — an additional monoclonal antibody used for its immune-modulating effect when belimumab or standard therapy isn't enough"]},
   {h:"Corticosteroids"},
   {list:[
    "<strong>Hydrocortisone, prednisone</strong> — intra-articular/oral, for acute RA flare-ups; low doses are typically bridged in until DMARDs take effect",
    "<strong>Methylprednisolone</strong> — IV/oral, for severe SLE skin disorders and tapering-dose management of polyarthritis flares",
    "<strong>Cortisone</strong> — intra-articular, for OA joint inflammation/swelling; if pain/swelling isn't relieved after 4 injections, further intervention is needed"]},
   {h:"Other immunosuppressants (severe SLE organ involvement)"},
   {list:[
    "<strong>Azathioprine, cyclophosphamide, mycophenolic acid</strong> — oral/IV; treat severe organ involvement (most often lupus nephritis), prevent the need for long-term corticosteroids; along with methotrexate, these are <strong>contraindicated in pregnancy</strong>",
    "<strong>Tacrolimus, pimecrolimus</strong> — topical calcineurin inhibitors, used instead of corticosteroids for SLE skin rashes",
    "<strong>Dapsone</strong> — oral antileprosy drug, an option for urticaria/oral ulcers/chronic SLE symptoms when hydroxychloroquine isn't tolerated",
    "<strong>Warfarin</strong> — anticoagulant for the clotting risk that comes with positive antiphospholipid antibodies in SLE; monitor INR"]},
   {h:"Antihistamines & allergy-specific drug classes"},
   {list:[
    "<strong>Diphenhydramine</strong> (first-generation, sedating) — urticaria and allergic rhinitis; loratadine/cetirizine/fexofenadine (second-generation, non-sedating) block H1 receptors without crossing the blood-brain barrier as readily",
    "<strong>Pseudoephedrine</strong> — decongestant; limit to 2–3 days to avoid rebound congestion",
    "<strong>Montelukast, zafirlukast</strong> — leukotriene receptor antagonists",
    "<strong>Ketotifen, olopatadine, azelastine, cromolyn</strong> — mast cell stabilizers",
    "<strong>Flonase, Beconase, Nasocort, Rhinocort</strong> — nasal corticosteroids",
    "<strong>Epinephrine</strong> — the reversal agent for anaphylaxis itself (see the Hypersensitivity Reactions lesson for full detail)"]},
   {h:"The shared risk to remember"},
   {p:"Every DMARD and immunosuppressant on this list shares the same core risk: <strong>immunosuppression</strong>, meaning increased infection risk. These patients need monitoring for signs of infection and are generally advised against live vaccines while on therapy — this is the one nursing consideration that applies no matter which specific agent is on the medication administration record. Before starting a <strong>biologic</strong> DMARD specifically, screen for latent TB (tuberculin skin test) and hepatitis B/C, since immunosuppression can reactivate these infections."}
  ]
},
{ id:"iis-meds-art", title:"ART for HIV/AIDS: PrEP vs. PEP", kicker:"One therapy category, and the timing distinction that shows up on every exam",
  blocks:[
   {p:"Antiretroviral therapy (ART) is the overarching category of medications used to manage HIV infection. For this course, the blueprint calls for knowing the category and the PrEP/PEP distinction rather than individual drug names."},
   {h:"ART as ongoing treatment"},
   {p:"ART combines multiple antiretroviral drug classes (reverse transcriptase inhibitors, protease inhibitors, integrase inhibitors, and others) to suppress HIV viral replication as much as possible, ideally to an undetectable viral load. ART doesn't cure HIV, but it allows CD4 counts to recover and dramatically reduces both disease progression and transmission risk. It's taken daily, indefinitely, and adherence is the single most important nursing teaching point — inconsistent dosing allows the virus to develop drug resistance."},
   {h:"PrEP vs. PEP — the timing distinction"},
   {table:{head:["","When it's used","Purpose"],rows:[
     ["<strong>PrEP</strong> (pre-exposure prophylaxis)","Taken ongoing, <em>before</em> any potential exposure, by an HIV-negative person at ongoing risk","Prevents infection from ever taking hold if exposure occurs"],
     ["<strong>PEP</strong> (post-exposure prophylaxis)","Started <em>within 72 hours after</em> a specific known or suspected exposure (needlestick, unprotected sex, assault)","A short course (about 28 days) to prevent the exposure from becoming an established infection"]]}},
   {p:"The fastest way to keep these straight: <strong>PrEP is proactive and ongoing; PEP is reactive and time-limited</strong>, with a hard 72-hour window that makes it a genuine time-sensitive nursing priority — a patient presenting after a needlestick or sexual assault needs PEP initiated as soon as possible, not \"whenever it's convenient.\""}
  ]
},
{ id:"iis-meds-oncsupport", title:"Chemotherapy Support: Filgrastim & Epoetin Alfa", kicker:"Targeting two specific chemo side effects — low neutrophils and low red cells",
  blocks:[
   {p:"Chemotherapy, as a general drug class, works by targeting rapidly dividing cells — which is why it kills cancer cells but also damages other fast-turnover tissues, including bone marrow. Two supportive medications exist specifically to counteract chemotherapy's effect on two different blood cell lines."},
   {h:"Filgrastim (Neupogen) — for neutropenia"},
   {p:"Filgrastim is a granulocyte colony-stimulating factor (G-CSF) that stimulates the bone marrow to produce more neutrophils. It's given when chemotherapy has caused (or is expected to cause) dangerously low neutrophil counts, since neutropenia leaves a patient highly vulnerable to infection with too few white cells available to fight it."},
   {list:[
    "<strong>Nursing priority</strong> — neutropenic precautions: monitor temperature closely (fever in a neutropenic patient is a medical emergency, since the usual signs of infection/inflammation may be blunted), reverse/protective isolation as ordered, meticulous hand hygiene, avoid fresh flowers/raw produce per facility policy",
    "<strong>Side effect</strong> — bone pain is common as the marrow ramps up production"]},
   {h:"Epoetin alfa (Epogen, Procrit) — for anemia"},
   {p:"Epoetin alfa is a synthetic erythropoietin that stimulates the bone marrow to produce more red blood cells. It's used for chemotherapy-induced (or chronic kidney disease-related) anemia to reduce fatigue and transfusion needs."},
   {list:[
    "<strong>Monitoring</strong> — hemoglobin/hematocrit trends, blood pressure (can cause or worsen hypertension), and iron stores (adequate iron is needed for the drug to work)",
    "<strong>Boxed warning</strong> — increased risk of thromboembolic events (DVT, stroke, MI) and, in cancer patients, a possible increased risk of tumor progression/recurrence in some studies — used at the lowest effective dose for the shortest duration needed"]},
   {p:"The clean way to keep these two apart: <strong>filgrastim → neutrophils → infection risk; epoetin alfa → red blood cells → anemia/fatigue.</strong> They treat two different chemotherapy complications and are never substitutes for each other."}
  ]
}
]};

const MED_MATH = { title:"Med Math", sub:"Dosage calculations, IV rates, and body-measurement formulas — the same core nursing math from Module 1, carried over because none of it is content-specific.", lessons:[
{ id:"mathdose", title:"Dosage Calculations & Basic Conversions", kicker:"The building blocks every other calculation relies on",
  blocks:[
   {p:"Before any drip rate or weight-based dose can be calculated, you need to be fluent in the basic conversions underneath them — pounds to kilograms, and the metric ladder from kilograms down to micrograms. Almost every calculation error in practice traces back to a mistake at this level, not the fancier formula built on top of it."},
   {h:"Basic Dosage Calculation"},
   {p:"<strong>Formula:</strong> (Desired ÷ Have) × Quantity = Amount to administer"},
   {p:"<strong>Worked example:</strong> Order is 500 mg PO; available as 250 mg tablets. (500 ÷ 250) × 1 tablet = <strong>2 tablets</strong>."},
   {p:"<strong>Worked example 2:</strong> Order is 2 mg lorazepam; available as a 4 mg/mL vial. (2 ÷ 4) × 1 mL = <strong>0.5 mL</strong>."},
   {h:"Weight Conversions"},
   {table:{head:["Conversion","Formula","Example"],rows:[
     ["Pounds → kilograms","lbs ÷ 2.2 = kg","154 lbs ÷ 2.2 = 70 kg"],
     ["Kilograms → pounds","kg × 2.2 = lbs","100 kg × 2.2 = 220 lbs"]]}},
   {hook:"Almost every weight-based drug calculation in this unit starts with converting the patient's weight to kilograms — if that first conversion is wrong, every step after it is wrong too, even if the rest of the math is done perfectly. This matters directly in this module for weight-based pediatric dosing (ADHD/ASD medications) and for BSA-based chemotherapy dosing."},
   {h:"Metric System Conversions — the 1000 rule"},
   {p:"Standard medical units (kg, g, mg, mcg) are each separated from their neighbor by a factor of 1000."},
   {table:{head:["Direction","Rule","Example"],rows:[
     ["Larger → smaller (kg→g, g→mg, mg→mcg)","Multiply by 1000 (move the decimal 3 places right)","2 g × 1000 = 2000 mg"],
     ["Smaller → larger (mcg→mg, mg→g, g→kg)","Divide by 1000 (move the decimal 3 places left)","2500 mcg ÷ 1000 = 2.5 mg"]]}},
   {h:"Volume Conversions"},
   {table:{head:["Conversion","Formula","Example"],rows:[
     ["Milliliters → liters","mL ÷ 1000 = L","2500 mL ÷ 1000 = 2.5 L"],
     ["Liters → milliliters","L × 1000 = mL","0.5 L × 1000 = 500 mL"]]}},
   {h:"Household & Volume Equivalents"},
   {table:{head:["Household/Metric","Equivalent"],rows:[
     ["1 teaspoon (tsp)","5 mL"],
     ["1 tablespoon (tbsp)","15 mL (or 3 tsp)"],
     ["1 ounce (oz)","30 mL (or 2 tbsp)"],
     ["1 cup","240 mL (8 oz)"],
     ["1 quart (approx.)","1000 mL (1 L)"]]}}
  ]
},
{ id:"mathiv", title:"IV Flow Rates, Drip Rates & Concentration", kicker:"Getting fluid and medication into the vein at the right speed",
  blocks:[
   {p:"These formulas answer one of two questions: how fast should this infusion pump run (mL/hr), or how many drops per minute should a gravity IV be set to (gtt/min) when there's no pump involved? A third formula, concentration, sets up weight-based drip calculations."},
   {h:"Flow Rate / Infusion Rate (mL/hr) — for infusion pumps"},
   {p:"<strong>Formula:</strong> Total Volume (mL) ÷ Total Time (hr) = mL/hr"},
   {p:"<strong>Worked example:</strong> Infuse 1000 mL of Normal Saline over 8 hours. 1000 ÷ 8 = <strong>125 mL/hr</strong>."},
   {h:"Infusion Time — working backward from a known rate"},
   {p:"<strong>Formula:</strong> Total Volume (mL) ÷ Flow Rate (mL/hr) = Time (hours)"},
   {p:"<strong>Worked example:</strong> A 1000 mL bag is infusing at 125 mL/hr. How long will it last? 1000 ÷ 125 = <strong>8 hours</strong>."},
   {h:"Drip Rate (gtt/min) — for gravity IV tubing without a pump"},
   {p:"There are two equivalent ways to reach the same answer, depending on whether you already know the mL/hr rate or are starting from the total order."},
   {table:{head:["Starting point","Formula"],rows:[
     ["You already know mL/hr","(mL/hr ÷ 60) × Drop Factor (gtt/mL) = gtt/min"],
     ["You're starting from the total order","(Total Volume [mL] × Drop Factor [gtt/mL]) ÷ Time (minutes) = gtt/min"]]}},
   {p:"<strong>Worked example (method 1):</strong> Infuse at 125 mL/hr using tubing with a drop factor of 15 gtt/mL. First, mL/min: 125 ÷ 60 = 2.08 mL/min. Then: 2.08 × 15 = 31.2, rounded to <strong>31 gtt/min</strong>."},
   {p:"<strong>Worked example (method 2):</strong> Infuse 1000 mL over 8 hours (480 minutes) with a drop factor of 15 gtt/mL. (1000 × 15) ÷ 480 = 15,000 ÷ 480 = 31.25, rounded to <strong>31 gtt/min</strong> — the same answer either way."},
   {h:"IV Push Medication Rate"},
   {p:"A common general safety rule for IV push medications is roughly <strong>1 mL per minute</strong> unless the drug's specific administration guidelines say otherwise. <strong>Worked example:</strong> a 10 mL medication is administered over 10 minutes, consistent with the 1 mL/min rule. Pushing too fast is a common cause of adverse drug reactions — relevant here for IV push benzodiazepines (e.g., lorazepam for agitation/status epilepticus) and IV antihistamines."},
   {h:"Concentration Calculation — the setup step for weight-based drips"},
   {p:"<strong>Formula:</strong> (Total mg in the bag × 1000) ÷ Total mL in the bag = Concentration (mcg/mL)"},
   {p:"<strong>Worked example:</strong> A bag contains 400 mg of a drug in 250 mL of D5W. (400 × 1000) ÷ 250 = <strong>1600 mcg/mL</strong>."}
  ]
},
{ id:"mathcardiac", title:"Cardiac & Vasoactive Drip Calculations", kicker:"MAP, CPP, and weight-/unit-based infusions",
  blocks:[
   {p:"This lesson groups together the calculations that show up most often in critical care and high-alert medication administration — all of them either measure perfusion pressure directly, or calculate the pump rate for a drug that manipulates that pressure. Relevant here for a client in delirium tremens, an oncology patient in septic shock, or any client on a high-alert IV drip."},
   {h:"MAP — Mean Arterial Pressure"},
   {p:"<strong>Formula:</strong> (Systolic BP + [2 × Diastolic BP]) ÷ 3 = MAP"},
   {p:"<strong>Worked example:</strong> BP is 120/80. (120 + [2 × 80]) ÷ 3 = (120 + 160) ÷ 3 = <strong>93.3 mmHg</strong>."},
   {p:"MAP reflects the average pressure driving blood into the organs across the whole cardiac cycle — it's weighted toward diastole because the heart spends more time in diastole than systole. A MAP of roughly <strong>65 mmHg or higher</strong> is generally considered necessary to maintain adequate organ perfusion in a critically ill patient."},
   {h:"CPP — Cerebral Perfusion Pressure"},
   {p:"<strong>Formula:</strong> MAP − ICP = CPP"},
   {p:"<strong>Worked example:</strong> MAP is 93, ICP is 15. 93 − 15 = <strong>78 mmHg</strong>."},
   {hook:"CPP depends directly on MAP — if you already calculated MAP for a patient, you're one subtraction away from CPP. A CPP that drops too low (generally below ~60 mmHg) risks cerebral ischemia, which is why both numbers are tracked together in a patient with a head injury or elevated ICP."},
   {h:"Weight-Based Infusion (mcg/kg/min)"},
   {p:"<strong>Formula:</strong> (Desired mcg × kg × 60 minutes) ÷ Concentration (mcg/mL) = mL/hr"},
   {p:"<strong>Worked example:</strong> Order is 5 mcg/kg/min for an 80 kg patient, with a concentration of 1600 mcg/mL (from the concentration calculation in the previous lesson). (5 × 80 × 60) ÷ 1600 = <strong>15 mL/hr</strong>."},
   {h:"Units-Based Infusion (Units/kg/hr) — e.g., Heparin"},
   {p:"<strong>Formula:</strong> (Units × kg) ÷ Concentration (Units/mL) = mL/hr"},
   {p:"<strong>Worked example:</strong> Order is 12 Units/kg/hr for a 100 kg patient, with a concentration of 100 Units/mL. (12 × 100) ÷ 100 = <strong>12 mL/hr</strong>."},
   {hook:"Both weight-based and units-based drips are high-alert medications given by infusion pump only — the shared theme across every high-alert drug is a computerized pump, frequent reassessment, and a clear plan for what triggers stopping or adjusting the rate."}
  ]
},
{ id:"mathfluid", title:"Fluid Balance, I&O & Tonicity", kicker:"Tracking what goes in, what comes out, and what IV fluids do to cells",
  blocks:[
   {p:"Intake and output tracking is really just accounting for fluid — but a couple of categories have special rules that are easy to get wrong, and tonicity explains why the choice of IV fluid itself matters beyond just the volume. This is directly relevant to fluid management in cancer/chemotherapy patients, HIV/AIDS patients with diarrhea or wasting, and any client receiving IV psychiatric medications."},
   {h:"What counts as intake"},
   {list:[
    "<strong>Oral (PO) fluids</strong> — water, juice, soda, milk, coffee",
    "<strong>Liquid foods</strong> — soups, broths, gelatin, sherbet, sorbet, pudding",
    "<strong>Ice chips</strong> — recorded as <strong>half</strong> the original volume (200 mL of ice chips = 100 mL intake), since ice chips are mostly air/space between solid pieces",
    "<strong>IV fluids</strong> — maintenance fluids, boluses, and piggyback medications (like antibiotics)",
    "<strong>Tube feedings</strong> — formula and water flushes (relevant for a client with anorexia nervosa on enteral nutritional rehabilitation)"]},
   {h:"What counts as output"},
   {list:["Urine — voided, catheterized, or urostomy drainage","Emesis (vomitus) — relevant for a client with bulimia or chemotherapy-induced nausea","Liquid stool — diarrhea or colostomy drainage","Wound drainage — from JP drains, Hemovacs, or chest tubes","Suction — gastric (NG) or respiratory"]},
   {h:"Net Fluid Balance"},
   {p:"<strong>Formula:</strong> Total Intake − Total Output = Net Balance"},
   {p:"<strong>Worked example:</strong> Intake of 3000 mL, output of 800 mL. 3000 − 800 = <strong>+2200 mL</strong> (a positive balance, meaning the patient is retaining more fluid than they're losing)."},
   {h:"Insensible Loss"},
   {p:"Fluid lost through the skin and lungs that can't be directly measured. Standard estimate: <strong>600–900 mL/day</strong>, or roughly <strong>0.5 mL/kg/hr</strong>. <strong>Worked example:</strong> a 70 kg patient: 0.5 × 70 = 35 mL/hr, or roughly 840 mL/day."},
   {h:"Fluid Weight Calculation"},
   {p:"<strong>Rule of thumb:</strong> a 1 kg weight change equals roughly 1 L of fluid change. <strong>Worked example:</strong> a patient's weight rises 2 kg over two days — that's roughly a 2 L fluid gain, not necessarily 2 kg of actual tissue."},
   {hook:"An output under <b>30 mL/hr</b> is always reported as a potential emergency — it signals inadequate perfusion to the kidneys."},
   {h:"Tonicity — what different IV fluids do to cells"},
   {table:{head:["Type","Solute concentration vs. inside the cell","Effect on the cell","Examples","Clinical use"],rows:[
     ["Hypertonic","Higher outside the cell","Water leaves the cell — it shrinks (plasmolysis)","3% or 5% NaCl; 10% Dextrose in Water","Cerebral edema, severe hyponatremia"],
     ["Hypotonic","Lower outside the cell","Water enters the cell — it swells or bursts (cytolysis)","0.45% NaCl (half normal saline)","Dehydration — pushes water back into cells"],
     ["Isotonic","Equal inside and outside","No net water movement — equilibrium maintained","0.9% Normal Saline, Lactated Ringer's, D5W","Routine IV fluid replacement and hydration"]]}},
   {hook:"A simple way to remember the direction: <b>hyper</b>tonic pulls water <b>OUT</b> of the cell (think 'hyper' = high solute outside, pulling water toward it), while <b>hypo</b>tonic pushes water <b>IN</b>. Isotonic is the 'do no harm' default fluid."}
  ]
},
{ id:"mathbody", title:"Body Measurement: BMI & BSA", kicker:"Calculations that scale a dose — or a diagnosis — to the patient's size",
  blocks:[
   {p:"These two calculations both answer a version of the same question — how big is this patient, in a way that's useful for dosing or risk assessment? BMI is a general screening number used constantly in this module's eating-disorder content; BSA is a more precise scaling factor used specifically for chemotherapy dosing in the Cancer unit."},
   {h:"BMI — Body Mass Index"},
   {table:{head:["System","Formula"],rows:[
     ["Metric","Weight (kg) ÷ [Height (m)]²"],
     ["Imperial","[Weight (lbs) × 703] ÷ [Height (in)]²"]]}},
   {p:"<strong>Worked example (metric):</strong> Weight 70 kg, height 1.75 m. Square the height: 1.75 × 1.75 = 3.0625. Divide weight by that: 70 ÷ 3.0625 = <strong>22.86</strong> (normal weight range)."},
   {p:"<strong>Worked example (imperial):</strong> Weight 154 lbs, height 69 inches. 154 × 703 = 108,262. Square the height: 69 × 69 = 4,761. Divide: 108,262 ÷ 4,761 = <strong>22.74</strong> — the same result as the metric calculation, just arrived at with different starting units."},
   {hook:"This is exactly the calculation behind the BMI thresholds in the Anorexia Nervosa lesson: a BMI under 17 is a diagnostic marker of the disorder, and under 15 is considered extreme/life-threatening. Knowing how to compute BMI from a height and weight given in a case stem — not just recognize the threshold — is testable on its own."},
   {h:"BSA — Body Surface Area"},
   {p:"BSA approximates a patient's total skin surface area in square meters (m²), and it's used specifically for drugs with a narrow therapeutic index, chemotherapy agents, pediatric patients, and burn patients — situations where a small dosing error has an outsized effect. This is the calculation behind chemotherapy dosing in the Cancer unit."},
   {p:"<strong>Formula:</strong> BSA = √[(Height in cm × Weight in kg) ÷ 3600]"},
   {h:"Fully worked pediatric dosing example"},
   {p:"Order: a chemotherapy agent at 2 mg/m². Patient: 37 lb, 97 cm tall. Supply: 1 mg/mL."},
   {list:[
    "<strong>Step 1 — convert weight to kg:</strong> 37 lb ÷ 2.2 = 16.8 kg",
    "<strong>Step 2 — calculate BSA:</strong> √[(97 cm × 16.8 kg) ÷ 3600] = √[1629.6 ÷ 3600] = √0.4527 = <strong>0.67 m²</strong>",
    "<strong>Step 3 — calculate the dose in mg:</strong> 2 mg/m² × 0.67 m² = <strong>1.34 mg</strong>",
    "<strong>Step 4 — calculate the dose in mL:</strong> 1.34 mg ÷ 1 mg/mL = <strong>1.34 mL</strong> to administer"]},
   {hook:"Notice this whole calculation depends on the weight-to-kg conversion from the first Med Math lesson — get that first step wrong, and every subsequent step (BSA, mg dose, mL dose) inherits the error."}
  ]
}
]};

     ["ALT/AST","ALT 4–36 U/L; AST 10–35 U/L","AST:ALT ratio &gt;2","Hallmark of alcoholic liver disease; also monitor with methotrexate use"],
     ["Creatinine","0.6–1.2 mg/dL","&gt;1.2 mg/dL","Mandatory check for lithium and for SLE nephritis"],
     ["BUN","10–20 mg/dL","Elevated","Suggests dehydration; raises lithium toxicity risk"]]}},
   {h:"The neutropenic fever threshold"},
   {table:{head:["Fact","Value"],rows:[
     ["Fever that is a medical emergency in a neutropenic patient","≥100.0°F (37.8°C) — a 'low-grade' fever elsewhere is a crisis here"],
     ["Time window to start antibiotics after a neutropenic fever","Within 1 hour (after pan-culturing: blood, sputum, urine, wound)"],
     ["Dietary restriction rationale","No fresh fruit/vegetables/flowers/raw pepper — bacteria on raw produce/spices can cause sepsis"]]}},
   {h:"Inflammatory cascade timing"},
   {table:{head:["Cell/marker","Arrival/behavior"],rows:[
     ["Neutrophils","Arrive 6–12 hours after injury — first responders, phagocytosis"],
     ["Monocytes → macrophages","Arrive 3–7 days after injury — cleanup crew, transform in tissue"],
     ["Lymphocytes","Last to arrive — humoral/cell-mediated immunity"],
     ["ESR/CRP","Nonspecific inflammatory markers; CRP rises/falls faster than ESR, useful for tracking an active flare"]]}},
   {h:"Infection control precaution numbers"},
   {table:{head:["Precaution","Equipment","Distance/duration"],rows:[
     ["Droplet","Surgical mask","Within 3–6 feet"],
     ["Airborne","N95 + negative-pressure room","Room air exchange per facility protocol (e.g., TB, measles, varicella)"],
     ["Contact","Gown and gloves","Direct contact / contaminated surfaces (e.g., C. diff, MRSA, VRE)"]]}}
  ]
},

const MH_ACRONYMS = { title:"Acronyms & Chart Reference", sub:"Mental Health and Immune/Inflammation/Cellular Regulation mnemonics and master charts, all in one place.", lessons:[
{ id:"chartrefmh", title:"Mental Health Master Chart Reference", kicker:"Every mnemonic and comparison table from this section, in one place",
  blocks:[
   {h:"Mnemonics used across this section"},
   {table:{head:["Mnemonic","Stands for","Where it's used"],rows:[
     ["TRUST","Trust, Rapport, Undertaking work, Separation, Termination — the four phases of the nurse-patient relationship (Preinteraction, Orientation, Working, Termination)","Therapeutic Nurse–Patient Relationship lesson"],
     ["PEPS","Psychotherapy, Education, Pharmacology, Strengths","ADHD treatment-component lesson"],
     ["PRESSURE","Psychiatric medications administered properly and monitored, Realistic perceptions/self-expectations, Environmental situations managed, Safety needs addressed, Self-care performed adequately, Use of community resources, Relationships developed/sustained, Establishment of family involvement","Antipsychotics & schizophrenia treatment-goals lesson"],
     ["RIGHTS","Refusal of nonemergency treatment, Individualized care, Grievances addressed, Health alternatives given, Treatment in the least restrictive setting, Security of civil rights","Legal & Ethical Issues lesson"],
     ["FEAR","Fear of an object/situation, Emotional conflict occurring unconsciously, Avoidant behavior demonstrated, Reacts with severe anxiety","Anxiety Disorders lesson (phobia symptom recall)"],
     ["CAGE","Cut down, Annoyed, Guilty, Eye-opener","Substance use screening"],
     ["CAUTION (oncology, cross-listed)","Change in bowel/bladder, A sore that doesn't heal, Unusual bleeding, Thickening/lump, Indigestion, Obvious change in wart/mole, Nagging cough","Cancer warning-signs mnemonic — see the Immune/Inflammation chart lesson"]]}},
   {h:"SOLER — nonverbal attending behavior"},
   {table:{head:["Letter","Behavior"],rows:[
     ["S","Sit squarely facing the client"],
     ["O","Open posture (arms/legs uncrossed)"],
     ["L","Lean slightly toward the client"],
     ["E","Eye contact, maintained appropriately"],
     ["R","Relax — avoid appearing tense or rushed"]]}},
   {h:"Therapeutic vs. non-therapeutic communication techniques"},
   {table:{head:["Category","Techniques","Effect"],rows:[
     ["Therapeutic","Silence, active listening, open-ended questions, reflecting, restating, clarifying, focusing, offering self, using broad openings, exploring, summarizing, giving information","Encourages the client to lead, express feelings, and process thoughts"],
     ["Non-therapeutic","Giving advice, false reassurance, asking 'why', changing the subject, minimizing feelings, agreeing/disagreeing, defending, approving/disapproving, belittling","Shuts down expression, imposes the nurse's judgment, or dismisses the client's experience"]]}},
   {h:"The Empathy Model"},
   {p:"A structured way to respond therapeutically: identify the client's feeling, identify the source/context of that feeling, and reflect both back in a nonjudgmental statement ('You feel ___ because ___'). Empathy — understanding and sharing the client's perspective without taking it on as your own — is distinct from sympathy, which centers the helper's own feelings about the client's situation."},
   {h:"Transference vs. countertransference"},
   {table:{head:["Term","Direction","Example"],rows:[
     ["Transference","Client → nurse","Client redirects feelings about someone from their own past onto the nurse"],
     ["Countertransference","Nurse → client","Nurse's own unresolved feelings/past relationships are projected onto the client"]]}},
   {h:"Levels of anxiety — quick chart"},
   {table:{head:["Level","Perceptual field","Learning/problem-solving possible?"],rows:[
     ["Mild","Increased","Yes — can motivate growth"],
     ["Moderate","Narrowed to immediate concerns","Yes, with effort"],
     ["Severe","Significantly narrowed to scattered details","No — needs direction to focus"],
     ["Panic","Lost — can't perceive reality accurately","No — can't communicate or function"]]}},
   {h:"Defense (coping) mechanisms — full list"},
   {table:{head:["Mechanism","One-line definition"],rows:[
     ["Repression","Burying a painful thought/feeling from awareness"],
     ["Denial","Not accepting a painful reality"],
     ["Regression","Reverting to an earlier, less mature coping style"],
     ["Projection","Attributing your own unacceptable feelings to someone else"],
     ["Splitting","Seeing everything as all-good or all-bad"],
     ["Displacement","Redirecting a feeling from its real source to a safer target"],
     ["Reaction formation","Adopting the opposite of what you really feel"],
     ["Rationalization","Substituting a more acceptable reason for the real one"],
     ["Humor","Finding the funny angle on a painful situation"],
     ["Sublimation","Channeling an unacceptable drive into a constructive outlet"],
     ["Suppression","Consciously hiding/controlling an unacceptable thought or feeling"],
     ["Compensation","Extra effort in one area to counterbalance a perceived deficiency"],
     ["Identification","Adopting another (often admired) person's traits or values"],
     ["Introjection","Incorporating another's values as your own without examining them"],
     ["Intellectualization (isolation)","Detached, over-cognitive reasoning to avoid feeling an event"],
     ["Fantasy","Escaping into unrealistic daydreams"],
     ["Undoing","Trying to symbolically make up for a perceived wrong"],
     ["Acting out","Repeating behaviors to relieve anxiety, without weighing consequences"],
     ["Withdrawal","Pulling back and disengaging rather than facing a stressor"],
     ["Dissociation","Blocking an event/period of time from awareness or memory"]]}},
   {h:"The four schizophrenia symptom clusters"},
   {table:{head:["Cluster","What it includes"],rows:[
     ["Positive symptoms","Delusions; hallucinations (distorted sensory perceptions); disorganized speech, including echolalia (echoing a previous word), incoherence, neologisms (new language), loose associations, \"word salad\" (speech or topics that do not make sense); disorganized behavior, including hyperactivity, hostility, agitation, catatonia, waxy flexibility, posturing, pacing, rocking, abnormal eye movement — symptoms that add something abnormal to experience"],
     ["Negative symptoms","Lack of speech, intonation, or gesturing; anhedonia, apathy, asociality, alogia, avolition (inability to move or initiate activity); poor hygiene, lack of self-care — symptoms that take something away from normal functioning"],
     ["Cognitive symptoms","Disorganized speech (a sign of disorganized thinking); concrete thinking (inability to think abstractly); anosognosia (the client does not believe they are ill); impairments possible in short-term memory, attention, information processing, and/or executive functioning"],
     ["Affective symptoms","Mood labile or incongruent with circumstances; flat or blunted affect, inappropriate or bizarre affect"]]}},
   {p:"\"Positive\" and \"negative\" don't mean good and bad — they describe whether the symptom adds an abnormal experience (positive) or removes a normal one (negative). Negative, cognitive, and affective symptoms are the hardest to treat and may not respond to medication — a well-medicated patient can still struggle with motivation and social withdrawal even once hallucinations are controlled."},
   {h:"Speech and thought vocabulary — the exam-favorite word list"},
   {table:{head:["Term","Meaning"],rows:[
     ["Clang association","Rhyming or sound-alike words strung together with no logical connection (\"It's the rain, train, pain\")"],
     ["Flight of ideas","Rapid, continuous flow of speech that jumps from topic to topic, with some thread of connection that's hard to follow — classically a manic-state finding as well"],
     ["Word salad (schizophasia)","Illogical, random word groupings with no discernible meaning"],
     ["Neologisms","Made-up words that have meaning only to the client"],
     ["Loose associations","Haphazard, illogical shifting from one topic to another with no logical connection between them"],
     ["Echolalia","Pathological, parrot-like repetition of another person's words or phrases"],
     ["Echopraxia","Pathological repetition/mimicking of another person's movements"],
     ["Thought blocking","Sudden interruption/cessation of a thought mid-sentence, followed by an unrelated new thought"],
     ["Circumstantiality","Getting caught up in excessive, unnecessary detail before finally getting to the point"],
     ["Tangentiality","Wandering off in a new direction before ever reaching or completing the original point"],
     ["Confabulation","Filling a memory gap with a fabricated but believed-true detail, to preserve self-esteem — classically seen in Korsakoff psychosis"],
     ["Perseveration","Persistent repetition of the same word or idea in response to different questions"],
     ["Mutism","Absence of verbal speech altogether"],
     ["Pressured speech","Speech that feels forced out rapidly, as if the words can't come fast enough"],
     ["Religiosity","Excessive, often disorganized preoccupation with religious ideas"],
     ["Verbigeration","Purposeless, stereotyped repetition of words or phrases"],
     ["Magical thinking","Belief that one's own thoughts or wishes can control other people or outside events"],
     ["Waxy flexibility","A limb or the body stays in whatever position it's placed, as if made of wax"],
     ["Anosognosia","The client lacks awareness or insight that they are ill at all — distinct from simple denial"],
     ["Anhedonia","Loss of interest or pleasure in activities that were previously enjoyable — a core negative symptom"],
     ["Avolition","Lack of motivation or drive to initiate and follow through on goal-directed activity — a core negative symptom"],
     ["Alogia","Poverty of speech — reduced speech output or content, speaking little even when prompted"],
     ["Apathy","Lack of feeling, emotion, interest, or concern"],
     ["Asociality","Lack of interest in, or withdrawal from, social relationships and interaction"],
     ["Catatonia","Marked psychomotor disturbance — ranges from stupor/immobility to excessive, purposeless motor activity"],
     ["Posturing","Voluntarily assuming and holding an inappropriate or bizarre body position for an extended time"],
     ["Incoherence","Speech that is disorganized and largely incomprehensible, lacking a logical connection between words or phrases"]]}},

   {h:"CIWA-Ar — full scale (Clinical Institute Withdrawal Assessment for Alcohol, revised)"},
   {p:"The standardized 10-item tool used to objectively score alcohol withdrawal severity and drive symptom-triggered dosing — reassessed at regular intervals (commonly every 1–4 hours per protocol/provider order), not just once on admission. Nine items are scored 0–7; the tenth (orientation) is scored 0–4, for a maximum total of 67."},
   {table:{head:["Symptom","Range of scores"],rows:[

     ["Orientation/clouding of sensorium","0 (oriented, can do serial additions) — 4 (disoriented for place and/or person)"]]}},

{ id:"chartrefiis", title:"Immune/Inflammation/Cellular Regulation Master Chart Reference", kicker:"Every comparison table and framework from this section, in one place",
  blocks:[
   {h:"Four types of immunity"},
   {table:{head:["Type","How it's acquired"],rows:[
     ["Natural active","Body is exposed to a pathogen and produces its own antibodies (recovering from an infection)"],
     ["Natural passive","Antibodies transferred naturally without the receiver's own immune system producing them (placenta, breast milk)"],
     ["Artificial active","Body produces its own antibodies in response to a deliberately administered antigen (a vaccine)"],
     ["Artificial passive","Premade antibodies administered directly (an immunoglobulin injection) — immediate but temporary"]]}},
   {h:"Hypersensitivity reactions — the ACID mnemonic"},
   {table:{head:["Letter (Type)","Name/mechanism","Clinical cues","Priority nursing"],rows:[
     ["A (Type I) Allergic/Anaphylactic","IgE-mediated, mast cells release histamine","Early: hives, itching, angioedema. Late: bronchoconstriction, hypotension","Airway first, epinephrine IM (outer thigh), stay with the patient"],
     ["C (Type II) Cytotoxic","Antibodies attack antigens on cell surfaces","Transfusion reaction: back/flank pain, fever, chills, tachycardia, hemoglobinuria","Stop the infusion immediately, disconnect at the hub, flush with NS via new tubing"],
     ["I (Type III) Immune Complex","Antigen-antibody complexes settle in tissue","SLE, RA — chronic inflammation/organ damage","Monitor systemic effects (nephritis, joint destruction), give immunosuppressants"],
     ["D (Type IV) Delayed","T-cell-mediated, no antibodies","Onset 48–72 hr: itching, erythema, induration (poison ivy, PPD/TB skin test)","Identify/remove allergen, topical corticosteroids or cool compresses"]]}},
   {h:"Immune cell 'military' roles"},
   {table:{head:["Cell type","Role","Clinical alteration/risk"],rows:[
     ["Neutrophils","'First responders' — phagocytosis, form pus","Neutropenia = 'front gate' open to infection; neutropenic precautions"],
     ["T-cells (CD4)","'Managers' — coordinate the immune response","Targeted/destroyed by HIV; AIDS = CD4 &lt;200 or an opportunistic infection"],
     ["B-cells","'Intelligence' — produce antibodies","Anaphylaxis: high IgE indicates a Type I reaction"],
     ["Monocytes","'Cleanup crew' — become macrophages in tissue","High levels suggest chronic infection or autoimmune flare"],
     ["Eosinophils","'Special ops' — attack parasites, drive allergic response","High levels linked to asthma and severe atopic reactions"],
     ["Basophils","'Alarm system' — release histamine, trigger vasodilation","Monitor for systemic vasodilation (hypotension) in severe reactions"]]}},
   {h:"OA vs. RA at a glance"},
   {table:{head:["Feature","Osteoarthritis","Rheumatoid Arthritis"],rows:[
     ["Underlying process","Degenerative — cartilage loss, 'wear and tear'","Autoimmune — synovial inflammation, pannus formation"],
     ["Joint pattern","Asymmetrical, weight-bearing joints","Symmetrical, small joints of hands/wrists"],
     ["Morning stiffness","&lt;30 minutes","&gt;30–60 minutes"],
     ["Synovial fluid","Normal (clear/straw-colored)","Cloudy/milky, elevated WBC, decreased viscosity"],
     ["ESR/CRP","Normal (non-systemic)","Elevated (systemic inflammation)"],
     ["Systemic features?","None — localized disease","Yes — Sjögren's syndrome, fatigue, fever, weight loss"],
     ["1st-line pharm","Acetaminophen, then NSAIDs","Methotrexate (DMARD), 'bridge' corticosteroids"]]}},
   {h:"SLE — ACR classification criteria (≥4 of 11 required)"},
   {table:{head:["Criterion","Finding"],rows:[
     ["Malar rash","Butterfly rash across cheeks/nose"],
     ["Discoid rash","Raised, scaly rash that can scar"],
     ["Photosensitivity","Reaction to sunlight"],
     ["Oral/nasopharyngeal ulcers","Usually painless"],
     ["Non-erosive arthritis","≥2 peripheral joints"],
     ["Serositis","Pleuritis or pericarditis"],
     ["Renal disorder","Persistent proteinuria — 'foamy urine' (lupus nephritis)"],
     ["Neurologic disorder","Seizures or psychosis, no other cause"],
     ["Hematologic disorder","Hemolytic anemia or low WBC/platelets"],
     ["Immunologic disorder","Anti-dsDNA or anti-Smith positive"],
     ["Positive ANA","Abnormal titer"]]}},
   {h:"TNM cancer staging system"},
   {table:{head:["Letter","What it measures","Scale"],rows:[
     ["T","Extent of the primary tumor","Tis (carcinoma in situ), T1–T4 (increasing size/extent)"],
     ["N","Regional lymph node involvement","N0 (none) to N3 (increasing involvement)"],
     ["M","Distant metastasis","M0 (none) or M1 (present)"]]}},
   {h:"Cancer warning signs — CAUTION"},
   {table:{head:["Letter","Stands for"],rows:[
     ["C","Change in bowel or bladder habits"],
     ["A","A sore that doesn't heal"],
     ["U","Unusual bleeding or discharge"],
     ["T","Thickening or lump"],
     ["I","Indigestion or difficulty swallowing"],
     ["O","Obvious change in a wart or mole"],
     ["N","Nagging cough or hoarseness"]]}},
   {h:"Benign vs. malignant discriminator matrix"},
   {table:{head:["Feature","Benign","Malignant"],rows:[
     ["Differentiation","Well-differentiated (looks like parent cell)","Undifferentiated/anaplastic (unrecognizable)"],
     ["Encapsulation","Encapsulated, defined border","Rarely encapsulated — invasive, infiltrating"],
     ["Metastasis","None","Frequent — via blood and lymph"],
     ["Growth rate","Slow and steady","Rapid, unpredictable, unregulated"],

   {h:"Histologic grading (G1–G4)"},
   {table:{head:["Grade","Description","Aggressiveness"],rows:[
     ["G1","Well-differentiated","Least aggressive"],
     ["G2","Moderately differentiated","Intermediate"],
     ["G3","Poorly differentiated","Aggressive"],
     ["G4","Undifferentiated (anaplastic)","Most malignant"]]}},
   {h:"Carcinogenesis — the three stages"},
   {table:{head:["Stage","What happens"],rows:[
     ["Initiation","DNA damage occurs in a cell"],
     ["Promotion","Damaged cells proliferate"],
     ["Progression","Angiogenesis and metastasis develop"]]}},
   {h:"PrEP vs. PEP"},
   {table:{head:["","When","Duration"],rows:[
     ["PrEP","Ongoing, before any exposure, for an HIV-negative person at risk","Daily, for as long as risk continues"],
     ["PEP","Within 72 hours of a specific exposure","~28-day course"]]}},
   {h:"HIV stages"},
   {table:{head:["Stage","Feature","Priority nursing"],rows:[

     ["2 — Latency","Chronic, often asymptomatic, can last 10+ years","Encourage strict ART adherence for an 'undetectable' viral load"],
     ["3 — AIDS","CD4 &lt;200 or an AIDS-defining opportunistic infection","Neutropenic/protective precautions, monitor for opportunistic infections"]]}},
   {h:"HIV opportunistic infections — recognize it by"},
   {table:{head:["Infection","Key recognition cue"],rows:[
     ["Pneumocystis jirovecii (PCP)","Dyspnea, dry cough, tachypnea"],
     ["Tuberculosis","Fever + night sweats — implement airborne precautions until ruled out"],
     ["Kaposi's sarcoma","Purplish-brown skin/mucous membrane lesions"],
     ["Candidiasis (thrush)","White oral patches"],
     ["Wasting syndrome","&gt;10% unintended weight loss"]]}},
   {h:"DMARDs — nonbiologic vs. biologic"},
   {table:{head:["Family","Examples","How they work"],rows:[
     ["Nonbiologic","Methotrexate (preferred first agent), leflunomide, sulfasalazine, hydroxychloroquine","Reduce proinflammatory cytokines, increase anti-inflammatory ones"],
     ["Biologic","TNF inhibitors (adalimumab), IL-1 blockers (anakinra), B-cell/T-cell-targeted agents","Engineered to target one specific inflammatory mediator; faster-acting, reserved for inadequate response to nonbiologics"],
     ["JAK inhibitors","Tofacitinib, baricitinib","Block Janus kinase enzymes to stop cytokine production; used after DMARD failure"]]}},
   {h:"Oncologic emergencies — recognize it by"},
   {table:{head:["Emergency","Key recognition cue"],rows:[
     ["Superior vena cava syndrome","Progressive dyspnea + facial/neck/arm edema + distended chest wall veins"],
     ["Spinal cord compression","Back/neck pain worse with movement/Valsalva + progressive motor weakness"],
     ["Hypercalcemia","Confusion, weakness, constipation, polyuria + serum calcium &gt;10.4 mg/dL"],
     ["Tumor lysis syndrome","Hyperkalemia + hyperphosphatemia + hyperuricemia + hypocalcemia after cytotoxic therapy"]]}},
   {h:"Exudate types"},
   {table:{head:["Type","Appearance","Meaning"],rows:[

     ["Antibacterials","Aminoglycosides","Nephrotoxic + ototoxic; peak/trough levels mandatory"],
     ["Antivirals","Acyclovir","Most effective started at first symptom (tingling/rash)"],
     ["Antifungals","Amphotericin B, nystatin","Ampho-B is highly nephrotoxic ('Ampho-terrible'); nystatin — swish and swallow"]]}},
   {h:"Immune & autoimmune 'must-knows' — one line per exemplar"},
   {table:{head:["Exemplar","Hallmark cue","Priority nursing"],rows:[
