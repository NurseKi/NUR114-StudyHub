   {p:"Outcomes for anorexia roughly follow a \"rule of thirds\": about one-third of patients recover fully, one-third improve but remain subthreshold (some lingering symptoms), and one-third go on to a chronic, unremitting course. This is the worst long-term prognosis of any eating disorder, which tracks with its having the highest psychiatric mortality rate."},
   {h:"CUES — patient/family teaching topics"},
   {p:"A memory jogger for what to cover in teaching: <strong>C</strong>auses of eating disorders; <strong>U</strong>nderstanding how to overcome power struggles and issues of separation and autonomy; <strong>E</strong>ffects of the eating disorder on physical and mental health; <strong>S</strong>ymptoms of eating disorders and signs of relapse."},
   {h:"Priority laboratory tests/diagnostic cues"},
   {list:[
    "Complete blood count (CBC) — elevated hematocrit (dehydration), low hemoglobin (anemia)",
    "Urine specific gravity — elevated (dehydration)",
    "Metabolic panel — abnormal electrolytes, glucose, protein",
    "Electrocardiogram (ECG) — ST segment and T wave changes associated with electrolyte changes"]},
   {h:"Priority interventions/collaborative actions"},
   {list:[
    "Hospitalization indicated in cases of malnutrition, dehydration with electrolyte disturbances, bradycardia, cardiac dysrhythmias, hypotension, hypothermia",
    "Address nutritional needs — if taking food by mouth, work with a dietitian to slowly increase calories; small, frequent feedings; encourage a diet high in fiber, low in sodium and caffeine",
    "Establish weight gain goals, weigh daily, use behavior modification strategies (privileges and consequences); monitor intake and output",
    "Contract for set mealtimes, stay with the client during and after meals, look for stashed or discarded food",
    "If refusing food by mouth or if condition deteriorates, may require nasogastric feedings",
    "Address emotional needs — explore feelings of inadequacy, coping mechanisms, underlying fears, family issues, feelings of control or lack of control; discuss body image and credibility of distorted perceptions; examine areas of personal self-worth other than appearance; refer for individual, group, or family therapy; determine risk for suicide"]},
   {h:"Specific numeric hospitalization criteria"},
   {p:"Beyond the general indications above, textbooks give concrete admission thresholds nursing exams like to test: weight loss ≥15% of expected body weight or BMI <16; heart rate ≤50 beats/min; systolic blood pressure ≤90 mmHg; core body temperature ≤97°F (36.1°C); and significant electrolyte disturbance. Any of these findings in a patient with an eating disorder should prompt urgent medical evaluation for inpatient stabilization, not outpatient management."},
   {h:"Nursing technique during refeeding — five named strategies"},
   {list:[
    "<strong>Person to person</strong> — maintain one-on-one supervision during meals and for 1–3 hours afterward to ensure compliance and prevent covert vomiting; remember that for a hospitalized patient with AN, <strong>food is considered a medication</strong>; give a limited time to complete each meal (such as 30 minutes); food choices are made in conjunction with a dietitian; allow the patient control over nonfood-related activities in the therapeutic environment",
    "<strong>Liquidation strategy</strong> — during an acute anorexic episode, nutritionally complete liquids are sometimes more acceptable than solid food because they don't require the patient to select foods, which patients with AN commonly find difficult; if tube feeding becomes necessary, explain the measures and address the patient's fears, but limit discussion about the food itself",
    "<strong>Pound by pound</strong> — weigh the patient daily (after voiding, before breakfast) on the same scale, at the same time, in the same clothing; monitor closely beforehand, since patients may hide objects in clothing or drink large amounts of fluid to falsely inflate their weight; anticipate a weight gain of about 1–3 lb/week",
    "<strong>Defusing fat fears</strong> — if edema or bloating occurs after resuming normal eating, reassure the patient this is temporary so they don't fear they're \"getting fat\" and stop complying; encourage the patient to recognize and assert feelings freely so they learn that expressing true feelings won't cause them to lose control or love; explain how improved nutrition reverses the effects of starvation; advise family members to avoid discussing food with the patient",
    "<strong>Preservation tactics</strong> — recognize that patients with AN use exercise, food preoccupation, ritualism, and even manipulation as ways to preserve the only sense of control they feel they have; maintain contact with outpatient treatment teams to promote a smooth transition after discharge; involve family therapy focused on communication strategies, since families often carry heavy guilt that should not be reinforced by assigning blame — patients and families are not responsible for causing the illness, but all are responsible for participating in treatment and recovery"]},
   {h:"A sample plan-of-care order set"},
   {p:"An example inpatient care plan for anorexia illustrates how concrete these interventions get in practice: daily weights with a new client gown provided by the nurse; obtain weight immediately upon waking, limiting water intake prior to weighing; goals focused on weight gained, not food eaten; supervise all meals, watch for hiding food; encourage solid food, limit fluids during meals; support mealtime normalization and interactions; limit meals to 30 minutes followed by 30 minutes of supervised rest; escort to the restroom or limit restroom use after meals; maintain boundaries, limit manipulation, communicate clear rewards and consequences; allow the client more meal choices, portions, and control as the client progresses; maintain a positive therapeutic relationship."},
   {h:"Priority actual & potential complications"},
   {list:["Malnutrition/emaciation","Electrolyte disturbances","Cardiac dysrhythmias","Heart disease, diabetes, and other consequences of obesity and renal failure (in binge-eating comorbidities)","<strong>Refeeding syndrome</strong>"]},
   {h:"The life-threatening cardiovascular risk"},
   {p:"The most dangerous complication of anorexia is cardiac, and it traces back to the malnutrition itself: if malnutrition leads to edema or hypokalemia (low potassium), <strong>ventricular arrhythmias</strong> can occur. This is why electrolyte monitoring, especially potassium, and cardiac monitoring are standard parts of caring for a patient with anorexia — the danger isn't only the visible weight loss, it's the invisible electrolyte and cardiac instability underneath it."},
   {h:"Refeeding syndrome"},
   {p:"Aggressive, rapid refeeding may cause refeeding syndrome in clients after prolonged periods of undernutrition — a dangerous shift of fluids and electrolytes (especially phosphate) as the body suddenly has carbohydrates to metabolize again. This is exactly why nutritional rehabilitation for anorexia starts slowly and is built up gradually under dietitian guidance rather than restoring full caloric intake all at once."},
   {h:"Priority hypotheses for nursing care"},
   {list:[
    "Nurses may be instrumental in building relationships with clients, ensuring that manipulative behaviors are limited",
    "Focus on healthy eating to meet body needs, consequences of over- or under-eating",
    "Nurses may play a key role in assessing and assisting clients and families to address issues such as control, coping, stress, and healthy communication"]},
   {h:"Priority medications"},
   {p:"<strong>Fluoxetine</strong> — oral SSRI antidepressant to assist with depression, bulimia (may decrease carbohydrate cravings), and anorexia; may take 1–2 weeks to take effect, may increase risk of suicide especially in adolescents; used in conjunction with counseling/therapy. There is no medication FDA-approved specifically to treat anorexia itself — low-dose <strong>olanzapine</strong> is sometimes used off-label after weight restoration has begun, to ease the ruminative anxiety around food and weight that persists even once weight is closer to normal."},
   {h:"Evidence-based psychotherapy"},
   {p:"The same family of therapies is used across all three eating disorders: <strong>CBT-E</strong> (enhanced cognitive behavioral therapy, tailored specifically for eating disorders), <strong>interpersonal psychotherapy (IPT)</strong>, and <strong>Maudsley/family-based therapy (FBT)</strong>, which is especially emphasized for adolescents with anorexia and actively involves the family in renourishing the patient at home rather than treating the family as a bystander."},
   {h:"Priority teaching/discharge needs"},
   {list:[
    "Provide client and family with education about the chronic nature of eating disorders and overall management of illness",
    "Assist the client and family to recognize the complexity of emotional and physical issues",
    "Refer to community organizations for all forms of eating disorders — support groups and websites such as the National Association of Anorexia Nervosa and Related Eating Disorders and the National Eating Disorders Association provide education and support",
    "Monitor internet and social media use, especially in adolescents — some websites and blogs perpetuate the myth that extreme thinness or disordered eating is a legitimate lifestyle choice and can actively undermine recovery"]},
   {h:"BMI-based severity scale (adults)"},
   {table:{head:["Severity","BMI"],rows:[
    ["Mild","≥17"],
    ["Moderate","16–16.99"],
    ["Severe","15–15.99"],
    ["Extreme","<15"]]}},
   {h:"Starvation physiology — why the body responds the way it does"},
   {p:"Decreased calorie intake depletes fat and protein stores, producing <strong>hypoglycemia</strong>, <strong>vitamin deficiencies</strong>, release of <strong>endogenous opioids</strong>, <strong>excess cortisol</strong>, and <strong>suppressed thyroid function</strong>. Loss of the fat needed as a lipid substrate for estrogen production drives the <strong>estrogen deficiency behind amenorrhea</strong>, and as the body is forced to use fat for energy, <strong>ketoacidosis</strong> can result. Anorexia affects females roughly <strong>10 times more often</strong> than males, and its mortality rate is higher than that of any other psychiatric disorder — <strong>suicide accounts for about 25% of deaths</strong> in anorexia, underscoring why a psychiatric safety assessment belongs alongside the medical workup."},
   {h:"Additional physical exam findings"},
   {list:[
    "<strong>Lanugo</strong> — fine, downy hair on the face/body, a compensatory response to loss of insulating subcutaneous fat",
    "<strong>Bradycardia, hypotension, and hypothermia</strong> as the body downshifts metabolically to conserve energy",
    "<strong>Calluses or abrasions on the knuckles</strong> — classically taught as a sign of self-induced vomiting (Russell sign), most relevant in the binge-eating/purging subtype",
    "<strong>Painless enlargement of the salivary glands</strong>",
    "<strong>Peripheral edema</strong> from low serum protein"]},
   {h:"Refeeding syndrome — expanded safety detail"},
   {p:"Refeeding syndrome describes the metabolic disturbances that occur as nutrition is restored after prolonged undernutrition. Risk correlates with both the degree of prior weight loss and the speed of refeeding, and is <strong>greatest during the first 2 weeks of treatment</strong>. Watch closely for <strong>hypophosphatemia</strong>, <strong>hypokalemia</strong>, <strong>hypomagnesemia</strong>, and <strong>volume overload with edema</strong> — this is exactly why nutritional rehabilitation is built up gradually rather than restoring full caloric intake all at once."},
   {h:"Hospitalization criteria — additional cited thresholds"},
   {p:"Other references add further concrete admission triggers to know for exams: weight <75% of expected, or a rapid loss of ≥15% of body mass; bradycardia ≤40 bpm; systolic BP <90 mmHg; core temperature ≤97°F (36.5°C); symptomatic hypoglycemia <60 mg/dL; serum potassium <3 mEq/L; serum phosphorus <2 mg/dL; severe dehydration; or suicidal ideation. Any of these warrants urgent inpatient stabilization."},
   {h:"1-on-1 meal supervision and weight-gain medication"},
   {p:"Supervise the patient one-on-one during meals <strong>and for a full hour afterward</strong> to prevent self-induced vomiting, and evaluate for medication hoarding as part of that same supervision. Negotiate food intake and set weekly (not just daily) weight-gain goals with the patient, and involve them in care decisions wherever possible — this builds a sense of control that counters the loss of control driving the illness. Note that <strong>olanzapine</strong> is used specifically as an adjunctive therapy to promote weight gain in anorexia, not as a first-line or stand-alone treatment."},
   {h:"DSM-5-TR diagnostic criteria"},
   {list:[
    "Persistent restriction of energy intake leading to a significantly low body weight",
    "Intense fear of gaining weight or becoming fat, or persistent behavior that interferes with weight gain, despite being at a significantly low weight",
    "Disturbance in the way body weight or shape is experienced, undue influence of body weight/shape on self-evaluation, or persistent lack of recognition of the seriousness of the current low body weight"]},
   {h:"Illustrative case: an adolescent athlete's presentation"},
   {p:"Bethany Cole, a 16-year-old female, is admitted at 94 lb (42.6 kg), <strong>BMI 15.6</strong> — meeting the severe category on the BMI scale above — after fainting during PE class, her third ED visit in 6 months for this issue. Her mother reports Bethany refuses to eat and that they \"argue constantly about food and meals\"; the family was referred to an eating disorder center but Bethany refused to go. Bethany minimizes the problem: \"I'm just not hungry, I'm fine, I do well in school...I'm on the track team. I just don't need a lot of food, and I need to keep my weight down for track. I haven't had my period in a few months, but that's just because I'm active. I do wish I wasn't always constipated, though. My belly gets huge and hard.\" On exam she is pale, anxious, and tearful, with dry mucous membranes, cool skin, fine lanugo on the shoulders and upper arms, and agitated pacing. Vitals — T 97.8°F (36.6°C), HR 66, RR 11, BP 88/58, SpO2 99% on room air — show the classic starvation-adaptation pattern of bradycardia, hypotension, and a low-normal respiratory rate. The case is a compact illustration of several exam-favorite cues at once: minimization/denial of illness severity, exercise-driven restriction rationalized as athletic performance, amenorrhea, constipation from dehydration and poor intake, and lanugo as compensatory thermoregulation."}
  ],
  check:{stem:"A nurse is caring for a client with severe anorexia nervosa and malnutrition-related hypokalemia. What is the priority concern?",
   options:["Risk for constipation","Risk for life-threatening ventricular arrhythmias","Risk for excessive weight gain","Risk for hypertension"],
   answer:1,
   why:"Malnutrition leading to hypokalemia or edema in anorexia nervosa can precipitate ventricular arrhythmias, making cardiac monitoring and electrolyte correction a top priority."}
},
{ id:"mh-bulimia", title:"Bulimia Nervosa", kicker:"The binge–purge cycle, its comorbidities, and its electrolyte consequences",
  blocks:[
   {p:"Bulimia nervosa involves episodic, uncontrolled, rapid, compulsive eating of large quantities of food over a short period of time, followed by attempts to rid the body of calories through purging (self-induced vomiting, inappropriate use of laxatives/diuretics) or other compensatory behaviors (vigorous exercise, prolonged fasting). It's most common in females during late adolescence/early adulthood. Unlike anorexia, body weight in bulimia is often normal or even above normal, which can make the disorder easier to conceal — patients often go to great lengths to hide the binge-purge cycle from family and providers alike."},
   {h:"RIDS BODY — the clinical features of bulimia"},
   {p:"A memory jogger, since not everyone with bulimia purges: <strong>R</strong>ecurrent binge-eating episodes; <strong>I</strong>ntense exercise; <strong>D</strong>iuretic, laxative, and enema use; <strong>S</strong>elf-induced vomiting; <strong>B</strong>ody image distortion; <strong>O</strong>rdinary eating alternating with episodes of binge-purge cycles; <strong>D</strong>epression and anxiety disorders may be present; <strong>Y</strong>o-yo effect of tension relief and pleasure experienced with bingeing, followed by guilt and depression after purging."},
   {h:"Myth busters"},
   {list:[
    "<strong>Myth:</strong> all patients with eating disorders are either very thin or very overweight. <strong>Reality:</strong> a patient with bulimia may have a weight within the normal range — this is exactly what makes the disorder so easy to miss on a routine visit",
    "<strong>Myth:</strong> open conflict and verbal fighting are common among families of adolescents with eating disorders. <strong>Reality:</strong> conflict <em>avoidance</em>, not open conflict, is the more typical family pattern"]},
   {h:"Prevalence, onset, and genetics"},
   {p:"Bulimia is more common than anorexia and carries a better prognosis. It usually begins in late adolescence or young adulthood, affects both sexes at roughly a 10:1 female-to-male ratio (though the true proportion of affected males may be underestimated, possibly as high as 20%), and about 1–3% of the population meets full diagnostic criteria, with up to 5–15% showing some symptoms — likely an underestimate, since many patients successfully hide their symptoms. Researchers have proposed genetic links at chromosomes 1, 3, and 10p."},
   {h:"Prognosis"},
   {p:"The prognosis for bulimia is more favorable than anorexia, with 50–70% recovery rates, though about half of those who recover may relapse. Unlike anorexia, there's an increased probability of eventual recovery from bulimia even after 10 years of illness."},
   {h:"Comorbidities across eating disorders"},
   {p:"Eating disorders as a group commonly co-occur with <strong>anxiety disorders</strong> (such as phobias and obsessive-compulsive disorder), <strong>trauma-related disorders</strong> (such as PTSD), <strong>substance use disorders</strong>, and <strong>depressive disorders</strong> (bipolar disorder, major depressive disorder, borderline personality disorder). Patients with bulimia specifically also carry an elevated risk of <strong>suicide and self-harm</strong> relative to the general population, which means a psychiatric safety assessment — not just a nutritional and electrolyte workup — is a standard part of the initial evaluation."},
   {h:"Signs, symptoms, and behavioral findings"},
   {list:[
    "Preoccupation with body shape and weight, alongside a self-evaluation that is unduly influenced by body shape and weight",
    "Evidence of binge eating: disappearance of large amounts of food, hoarding food, eating in secret",
    "Evidence of purging behavior: frequent trips to the bathroom after meals, running water to mask vomiting sounds, laxative or diuretic wrappers",
    "<strong>Russell's sign</strong> — calluses or scarring on the knuckles or back of the hand from self-induced vomiting",
    "Dental enamel erosion and increased dental caries from repeated stomach acid exposure",
    "Parotid gland swelling (\"chipmunk cheeks\")",
    "Menstrual irregularities",
    "Fluctuating weight that is often normal or above normal, unlike the low body weight seen in anorexia"]},
   {h:"Life-threatening medical complications"},
   {p:"The complications of bulimia center on <strong>dehydration</strong> and the <strong>electrolyte imbalances</strong> that result from repeated purging — most importantly <strong>hypokalemia</strong> and <strong>metabolic alkalosis</strong> from the loss of stomach acid and gastric hydrochloric acid through vomiting (laxative overuse instead tends to produce metabolic acidosis, from reduced sodium bicarbonate). Just as in anorexia, low potassium raises the risk of dangerous cardiac arrhythmias and ECG changes, which is why electrolyte panels are a standard, recurring part of monitoring a patient with bulimia, not a one-time admission lab. Other complications include esophageal erosion, ulcers, tears, and bleeding; tooth and gum erosion and dental caries; GERD; edema; and toxicity from substances like ipecac used to induce vomiting, which is associated with severe cardiac disease."},
   {h:"Hospitalization"},
   {p:"If binge eating and purging have caused serious physical harm, hospitalization provides around-the-clock observation of all eating and elimination (urinating, bowel movements, and vomiting). As symptoms stabilize, the patient gradually resumes control over their own eating."},
   {h:"Treatment: medication"},
   {p:"<strong>Fluoxetine (Prozac)</strong>, an SSRI, is the medication most associated with treating bulimia nervosa and is the only FDA-approved medication for this indication. As with any antidepressant, the nurse must monitor for the <strong>black-box warning of increased suicidal ideation</strong>, particularly in adolescents and young adults and especially in the first weeks of therapy or after a dose change — this matters even more here given the baseline elevated suicide risk in this population."},
   {h:"Evidence-based psychotherapy"},
   {p:"The same therapies effective for anorexia show effectiveness for bulimia: <strong>CBT-E</strong>, <strong>interpersonal psychotherapy (IPT)</strong>, and <strong>Maudsley/family-based therapy (FBT)</strong> and other family therapy approaches. Treatment addresses the issues that cause the behavior, not just the behavior itself, and typically combines individual, group, and family therapy with nutritional counseling."},
   {h:"Nursing interventions"},
   {list:[
    "Establish a <strong>behavioral contract</strong> with the patient that specifies expected food amounts and types to be consumed at meals",
    "Provide <strong>supervision during and for 1–2 hours after meals</strong> to prevent purging — this window covers the period when the urge to purge is highest; set a clear time limit for each meal and provide a pleasant, relaxed eating environment",
    "Discourage fasting or restrictive food intake, since this can itself trigger a binge episode",
    "Encourage <strong>journaling</strong> (a food diary documenting time of eating, food eaten, mood, life events, and binge urges/behaviors) to identify triggers such as hunger from inadequate intake, emotional distress, or an automatic conditioning response",
    "Provide assertiveness training to help the patient gain control over their behavior and achieve a realistic, positive self-image",
    "Encourage the patient to discuss stressful issues — achievement, independence, socialization, sexuality, family problems, and control — rather than managing them through the binge-purge cycle",
    "Assess passive and active suicide potential and risk for self-harm",
    "Monitor electrolytes and cardiac status routinely throughout treatment, not just on admission",
    "Recognize this is often a long haul — treatment may need to continue for years to prevent relapse — and refer to support groups such as Overeaters Anonymous"]},
   {h:"Bulimia vs. binge-eating disorder — the key differentiator"},
   {p:"The defining line between the two disorders is the <strong>compensatory behavior</strong>: bulimia nervosa is a binge <em>plus</em> an inappropriate compensatory behavior — purging, laxative/diuretic misuse, fasting, or excessive exercise — to prevent weight gain. Binge-eating disorder is a binge <em>without</em> any compensatory behavior. This single distinction is what separates the two diagnoses and explains why bulimia often presents with a normal-to-overweight body habitus while its medical complications center on purging trauma rather than on obesity."},
   {h:"DSM-5-TR severity specifier"},
   {p:"Diagnosis requires binge eating with compensatory behavior occurring, on average, at least once a week for 3 months. Severity is then graded by the average number of compensatory episodes per week: <strong>Mild</strong> 1–3, <strong>Moderate</strong> 4–7, <strong>Severe</strong> 8–13, <strong>Extreme</strong> 14 or more."},
   {h:"Bupropion is contraindicated — a critical safety alert"},
   {p:"<strong>Bupropion is contraindicated in patients with a current or past eating disorder</strong>, including bulimia, because it increases seizure risk specifically in this population. This is a distinct point from the fluoxetine black-box suicidality warning above — two separate medication safety issues to keep straight for this population."},
   {h:"Additional medications"},
   {p:"Besides fluoxetine as the only SSRI FDA-approved specifically for bulimia, <strong>sertraline</strong>, <strong>fluvoxamine</strong>, and <strong>escitalopram</strong> are used as second-line alternatives. <strong>Ondansetron</strong> may be added to help prevent vomiting, and <strong>psyllium</strong> can help prevent constipation during withdrawal from chronic laxative use."},
   {h:"Purge-specific complications beyond the esophagus"},
   {p:"Repeated purging can also produce <strong>Barrett esophagus</strong>, <strong>gastric dilation or rupture</strong>, <strong>parotid gland hypertrophy</strong>, <strong>rectal prolapse</strong>, and <strong>pancreatitis</strong> — a mechanical and chemical trauma profile that is distinct from the starvation-based complications of anorexia."}
  ],
  check:{stem:"A client with bulimia nervosa has been vomiting several times a day for two weeks. Which electrolyte imbalance is the nurse most concerned about?",
   options:["Hyperkalemia","Hypokalemia","Hypercalcemia","Hypernatremia"],
   answer:1,
   why:"Repeated vomiting causes loss of potassium and stomach acid, producing hypokalemia and metabolic alkalosis — hypokalemia in particular raises the risk of dangerous cardiac arrhythmias."}
},
{ id:"mh-binge-eating", title:"Binge-Eating Disorder", kicker:"Binging without the compensatory behaviors",
  blocks:[
   {p:"Binge-eating disorder involves recurrent eating of large amounts of food without compensatory behaviors — the person usually eats alone and may feel guilty or depressed after an episode. It's more common in females than males, most common in adults ages 46–55, and related to problems with impulse control/addiction. As a result, individuals with binge-eating disorder are often overweight or obese — binge eating causes substantial weight gain, and obesity, with a BMI that begins as normal and then increases — and the psychological experience is typically one of significant shame, guilt, and distress about the loss of control, often eating alone specifically to hide the behavior."},
   {h:"Physical assessment findings"},
   {p:"Signs of metabolic syndrome, abdominal distention, and gastrointestinal dysfunction are the physical assessment findings that distinguish binge-eating disorder from the malnutrition-driven findings seen in anorexia and bulimia. Insomnia is also common, and body weight ranges from normal to obesity (BMI >30)."},
   {h:"Prevalence, onset, and genetics"},
   {p:"Binge-eating disorder is the <strong>most common eating disorder in the United States</strong> — up to 3.5% of females and 2% of males will experience it at some point in their lives, with average onset in young adulthood, slightly later than for anorexia or bulimia. It affects women somewhat more than men. Heritability is estimated at 41–57%, and brain chemistry changes are seen as with the other eating disorders; stressful life events increase risk. Long-term outcomes are slightly more favorable than for the other eating disorders."},
   {h:"Diagnosis"},
   {p:"Diagnosis often includes a <strong>neuropsychological evaluation</strong> in addition to the clinical history, since binge-eating disorder is a psychiatric condition and the evaluation helps characterize the cognitive and emotional drivers of the binge pattern, not just the eating behavior itself."},
   {h:"Complications"},
   {p:"Because there's no purging to cause the electrolyte disturbances seen in bulimia, the complications of binge-eating disorder overlap heavily with those of clinical obesity: high blood pressure, high cholesterol, heart disease, type 2 diabetes, gallbladder disease, musculoskeletal problems, and obstructive sleep apnea — alongside the significant psychological burden of the disorder itself, including higher risk for suicide and self-harm compared to those without the disorder. Common comorbidities include anxiety disorders, mood disorders, and substance use disorders."},
   {h:"Treatment: two priorities"},
   {p:"Treatment is framed around two sequential priorities. The first and immediate priority is to <strong>interrupt the binge-eating pattern itself</strong> — through therapy (cognitive behavioral therapy in particular) and, where appropriate, medication. Only once the binge pattern is under control does the second priority — <strong>facilitating weight loss, if appropriate for the patient</strong> — become the focus. Leading with weight loss before the binge pattern is addressed tends to backfire, since dieting pressure is itself a common binge trigger."},
   {h:"Treatment: medication"},
   {list:[
    "<strong>SSRIs</strong> (e.g., fluoxetine) and <strong>SNRIs</strong> (e.g., venlafaxine/Effexor) are used to target the underlying mood and anxiety drivers of binge eating",
    "<strong>Lisdexamfetamine (Vyvanse)</strong>, a stimulant, is FDA-approved specifically for moderate-to-severe binge-eating disorder in adults",
    "<strong>Glucagon-like peptide (GLP) agonists</strong> are also used, targeting appetite regulation and satiety"]},
   {h:"Nursing interventions"},
   {list:[
    "Help the patient set <strong>daily, achievable goals</strong> rather than large, all-or-nothing changes",
    "Give the patient <strong>control over their own food choices</strong> rather than imposing a rigid diet, to reduce the sense of restriction that can trigger binges",
    "Encourage <strong>food journaling</strong> to build awareness of intake and patterns",
    "Help the patient <strong>identify triggers</strong> for binge episodes (emotional, situational, or social)",
    "Encourage <strong>routine weighing</strong> as a neutral data point rather than a source of shame",
    "Teach <strong>alternative coping strategies</strong> to replace binge eating as a response to stress or negative emotion",
    "Refer to support resources such as <strong>Overeaters Anonymous</strong> and eating-disorder-specific organizations for ongoing peer support",
    "Use nonjudgmental, shame-reducing communication throughout — shame is often what drives the secrecy that keeps the binge cycle going"]},
   {h:"Comparing the three eating disorders at a glance"},
   {table:{head:["Feature","Anorexia","Bulimia","Binge-eating disorder"],rows:[
    ["Weight/BMI","↓ weight, BMI <18.5","Normal to overweight, BMI 18.5–30","Tends toward overweight/obese"],
    ["Vital signs","↓ BP, ↓ HR (worsened by dehydration/electrolyte imbalance)","Usually near normal unless purging is severe","Usually normal; metabolic syndrome findings instead"],
    ["Compensatory behavior","Refuses to eat; typically does NOT purge","Purges after bingeing (vomiting, laxatives, diuretics)","No compensatory behavior after a binge"],
    ["Hallmark findings","Amenorrhea, lanugo, ↓ subcutaneous tissue → hypothermia, constipation from dehydration","Teeth erosion, bad breath, parotid swelling, Russell sign","Abdominal distention, GI dysfunction, insomnia"],
    ["Core fear/driver","Intense fear of gaining weight","Binge–purge cycle tied to body image","Binging triggered by depression, shame, or self-hatred"],
    ["Treatment emphasis","Increase weight slowly (2–3 lb/week), monitor exercise","Monitor during and after meals for purging","Interrupt the binge pattern first, weight loss second"]]}},
   {h:"The emotional-eating trigger cycle"},
   {p:"Binging in binge-eating disorder is frequently triggered by <strong>depression, shame, or self-hatred</strong> — the person eats in response to the emotion, feels worse (more shame and guilt) as a result of the binge, and that worsened emotional state feeds the next episode. Breaking this cycle is a core reason therapy targets the emotional trigger itself, not just the eating behavior."},
   {h:"Refeeding syndrome as a shared risk across eating disorders"},
   {p:"Refeeding syndrome is not unique to anorexia — it is a risk whenever nutrition is reintroduced to <strong>any</strong> malnourished client, across eating disorders. The nutritional rehabilitation must be done <strong>slowly</strong> regardless of which eating disorder is being treated."},
   {h:"Universal treatment principles for all eating disorders"},
   {list:[
    "Teach <strong>coping skills</strong> to replace the disordered eating behavior",
    "<strong>Maintain trust</strong> with the client throughout treatment",
    "Make the client <strong>part of the decision-making</strong> and plan of care",
    "Use <strong>therapy</strong> — group, individual, or family — as a core treatment component regardless of which eating disorder is involved"]}
  ],
  check:{stem:"A client with binge-eating disorder tells the nurse she feels intense shame and eats alone to hide her binges. What is the most therapeutic nursing response?",
   options:["\"You should just try to eat less at each meal.\"","Listen without judgment and explore the feelings driving the behavior","Tell her that binge eating is not a real medical condition","Recommend she avoid discussing this topic with her therapist"],
   answer:1,
   why:"Nonjudgmental exploration of the underlying emotional drivers is the therapeutic approach for binge-eating disorder, which is a psychiatric condition rooted in more than a simple lack of dietary willpower."}
}
]};

const MH_NEURODEV = { title:"Neurodevelopmental, Cognitive & Somatic Disorders", group:"mh", sub:"ADHD and autism spectrum disorder, plus delirium/dementia and somatic symptom disorders.", lessons:[
{ id:"mh-adhd", title:"Attention-Deficit/Hyperactivity Disorder", kicker:"Signs, drug-holiday logic, and the full stimulant/non-stimulant medication picture",
  blocks:[
   {p:"ADHD is characterized by behaviors of inattention and/or hyperactivity with impulsivity, ranging from mild to severe. <strong>Hyperactivity</strong> is increased psychomotor activity that may or may not be purposeful — rapid physical movements and verbal activity, and may include being highly distractible. <strong>Impulsivity</strong> is acting without reflection or thought to consequences, an inability to resist acting. The disorder is present across more than one setting (school and home, for example) rather than confined to a single environment — symptoms must be present before age 12 and occur in two or more settings (home, school, with others) to meet diagnostic criteria."},
   {h:"Three DSM-5-TR presentations"},
   {p:"ADHD is diagnosed as one of three presentations, and a client's presentation can change over time: <strong>Combined</strong> (meets criteria for both inattention and hyperactivity-impulsivity), <strong>Predominantly Inattentive</strong>, and <strong>Predominantly Hyperactive-Impulsive</strong>. DSM-5-TR criteria require 6 or more symptoms of inattention or hyperactivity-impulsivity for children age 16 and younger, but only 5 or more for adolescents age 17 and older and adults — symptoms must have been present for at least 6 months, with several symptoms evident before age 12, and present in two or more settings."},
   {h:"Causes and risk factors"},
   {p:"The underlying cause of ADHD isn't fully understood, but it has a strong genetic component — twin studies estimate heritability around 76% — and brain imaging shows structural differences that may relate to functional impairment. On average, 8–11% of school-age children have ADHD, roughly 6.1 million children in the U.S. Suspected risk factors include genetics, environmental toxin exposure (such as lead) at a young age, maternal use of drugs/alcohol/cigarettes or exposure to environmental poisons during pregnancy, prematurity or low birth weight, and brain injury."},
   {h:"Adult ADHD"},
   {p:"ADHD is frequently comorbid with anxiety disorders, mood disorders, and substance use disorders. In adults, ADHD affects those of all sexes at roughly equal rates — a sharp contrast to childhood diagnosis, which is skewed heavily male — underscoring that ADHD is not simply a childhood condition many outgrow."},
   {h:"Pathophysiology"},
   {p:"Proposed mechanisms include possible alterations in dopamine gene alleles and dopamine transmission. Prenatal hypoxia or hypotension may selectively damage frontal lobe neurons, which is one theory linking perinatal complications to later ADHD risk."},
   {h:"Why boys are diagnosed more often"},
   {p:"ADHD affects both sexes, but males are diagnosed more often — this doesn't necessarily mean more males actually have ADHD, just that they're more likely to be identified. One leading theory: males more often present with disruptive, hyperactive behavior that prompts earlier intervention, while females more often present with inattentive symptoms that are less disruptive and easier to overlook."},
   {h:"How presentation shifts with age"},
   {p:"Caregivers often report the child was very active even as a toddler, with hyperactivity and inattention becoming more visible in early elementary school. By adolescence, the outward, visible signs of hyperactivity often diminish and turn inward — showing up instead as a subjective sense of restlessness, annoyance, and impatience rather than obvious physical hyperactivity. Adolescents with ADHD frequently experience emotional dysregulation that negatively affects peer relationships, and those with prominent inattentive symptoms tend to struggle academically and socially."},
   {h:"Priority assessments/cues"},
   {list:[
    "Requires observation of the child in a variety of settings, and a history from family, teachers, and caregivers",
    "Standardized psychiatric testing methods",
    "Ability to perform age-appropriate tasks, complete activities, and stay with activities until completed",
    "Ability to engage in difficult tasks, length of attention span, ability to cooperate, ability to tolerate frustration, level of distractibility",
    "Ability to form relationships with peers, siblings, and classmates",
    "Difficulty with organization and time management, often loses objects, forgetful",
    "Level of activity, including fidgeting with hands/fingers, squirming in seat, or engaging in risky or dangerous behaviors",
    "Ability to hear and listen to others, observe for excessive talking or frequently using interruption to dominate conversation",
    "Impact on relationships with parents, siblings, teachers, and peers"]},
   {h:"Priority laboratory tests/diagnostic cues"},
   {p:"There is no single lab test or imaging study that diagnoses ADHD — diagnosis is clinical, requiring a complete medical and neurologic exam plus hearing/vision screening. Diagnostic tests instead target <strong>potential comorbidities</strong> (sleep disorders) and are used to <strong>rule out other medication or psychological causes</strong>: anxiety, depression, conduct disorder, developmental disorders, thyroid dysfunction, brain injury, and substance use disorder. A lead level may be drawn given lead exposure's link to ADHD risk. Standardized <strong>behavior rating scales</strong> (such as the Vanderbilt Assessment Scale) completed by parents and teachers are exceptionally helpful, and a psychiatric evaluation assessing intellectual ability, academic achievement, and possible learning disorders rounds out the workup — speech/language evaluation is added when indicated."},
   {h:"Priority interventions/collaborative actions"},
   {list:[
    "Ensure safety related to high levels of physical activity without cognitive controls",
    "Create a safe, consistent environment for learning and play, considering distractibility and impulsivity",
    "Focus on reinforcing coping skills and impulse control, improving social relationships, caregiver and family dynamics",
    "Set realistic goals for success and provide clear, concrete instructions",
    "Encourage a highly nutritious diet, eat early in day to avoid impact of anorexia related to medications, limit sugar and caffeine",
    "Reinforce the need for family/individual therapy along with medication management",
    "Form trusting relationships and ensure consistent caregivers; convey acceptance, positive regard, provide positive feedback",
    "Behavior plan with logical consequences for engagement in high-risk behaviors",
    "Expose to group learning and play as tolerated",
    "Monitor for insomnia related to stimulant medications, and monitor for substance use"]},
   {h:"Priority actual & potential complications"},
   {list:["Potential exists for misdiagnosis and incorrect treatment","Exacerbation of behavioral issues due to mismanagement","Increased rate of traffic accidents","Priapism — specifically associated with methylphenidate","Suicidal ideation"]},
   {h:"Priority hypotheses for nursing care"},
   {list:[
    "Early diagnosis increases effectiveness of interventions",
    "Ensure families understand the need for therapy along with medications",
    "Encourage frequent monitoring to ensure revisions in plan of care as children grow and change",
    "Nurses must be sensitive to and capable of working with clients with ADHD across the lifespan"]},
   {h:"Priority medications"},
   {list:[
    "<strong>Dextroamphetamine/amphetamine, methylphenidate</strong> — oral stimulants to calm hyperactivity and increase attentiveness; high risk of dependence; appetite depressants — give early in day and monitor for weight loss; monitor blood pressure and avoid over-the-counter medications; may disturb sleep, so give in the morning or at least 6 hours before bedtime (14 hours for extended-release); may cause growth retardation, so clients are encouraged to take <strong>\"drug holidays\"</strong> to allow for growth during summer or breaks from school",
    "<strong>Methylphenidate transdermal patch</strong> — apply to the hip approximately 2 hours before the intended effect is needed, and remove 9 hours later; timing the patch is a frequently tested administration detail",
    "<strong>Atomoxetine</strong> — oral non-stimulant, effective in clients with comorbid anxiety; monitor for increases in blood pressure, heart rate, and liver enzymes; use with caution in clients with comorbid depression, and monitor for increased suicidal ideation",
    "<strong>Viloxazine</strong> — a newer oral non-stimulant option, alongside atomoxetine, for clients who cannot tolerate or should avoid stimulants",
    "<strong>Guanfacine</strong> — oral non-stimulant (alpha-2 agonist); an option when stimulants are poorly tolerated or contraindicated; monitor for hypotension, orthostatic hypotension, bradycardia, and sedation rather than the cardiac-stimulant profile seen with methylphenidate/amphetamines — never discontinue abruptly, since stopping suddenly can cause rebound hypertension",
    "<strong>Bupropion</strong> — oral antidepressant used to manage mood swings, may be used in place of stimulants for adults with ADHD; may cause headache, sedation, and dizziness",
    "<strong>Tricyclic antidepressants (desipramine, nortriptyline)</strong> — alternatives to stimulants in select clients, carrying the same anticholinergic and cardiotoxicity concerns as TCAs used for depression"]},
   {p:"Methylphenidate and the other stimulants work by blocking the re-uptake of dopamine at the synapse — with the stimulant on board, dopamine accumulates in the synaptic cleft instead of being pulled back into the pre-synaptic terminal, which is the mechanism behind improved attentiveness and calmer, less impulsive behavior. It's worth naming out loud for a patient or family who assumes a stimulant should make hyperactivity worse, not better — this is the <strong>\"paradoxical effect\"</strong>: a CNS stimulant calms hyperactive behavior in ADHD because of how it shifts dopamine and norepinephrine signaling in the prefrontal cortex."},
   {h:"Why symptoms are more visible at school or work"},
   {p:"ADHD symptoms are often MORE pronounced in structured, demanding environments — school or work — and less noticeable at home, where expectations and structure are looser. This is a major reason ADHD can go undiagnosed until adolescence or adulthood: a child may function well enough at home that no one suspects ADHD until the structured demands of a classroom (or, later, a job) expose the inattention or impulsivity."},
   {h:"CNS stimulant side effects — full picture"},
   {list:["Anorexia","Growth retardation in children","Insomnia","Tachycardia and palpitations","Dry mouth","Potential for tolerance and dependence with chronic use","Rare risk of stroke/CVA"]},
   {hook:"Memory jogger for the major treatment components of ADHD: <strong>PEPS</strong> — Psychotherapy, Education, Pharmacology, Strengths (build on the child's individual strengths, not just manage the deficits)."},
   {h:"Priority teaching/discharge needs"},
   {p:"Reinforce the importance of ongoing care, behavioral surveillance, and collaboration with school/workplace, family, and health care providers — ADHD management is a long-term, multi-setting partnership rather than a medication prescribed once and left alone. The child may benefit from an <strong>individualized educational plan (IEP)</strong> built with special-education services to support identified vulnerabilities (untimed tests, repeated or reviewed instructions, tutoring). Teach caregivers that hunger, thirst, fatigue, and the need to urinate can all trigger or worsen hyperactive behavior, that a healthy meal/snack plan matters because poor nutrition can exacerbate symptoms, and that stimulant medications should never be stopped abruptly."},
   {list:[
    "Give stimulant medications EARLY in the day to avoid insomnia",
    "Encourage a large, protein-rich breakfast — appetite drops as the day goes on, so front-loading nutrition helps offset anorexia and growth retardation",
    "Discuss provider-guided \"drug holidays\" during summer or school breaks to allow catch-up growth",
    "Taper the medication rather than stopping abruptly, given the potential for tolerance and withdrawal",
    "Avoid alcohol and other CNS stimulants, including excess caffeine"]}
  ],
  check:{stem:"A college student who takes methylphenidate for ADHD stopped it over the summer and now, during midterms, reports she is tearful, agitated, flushed, diaphoretic, and \"can't cope with school.\" What is the most likely explanation, and what should the nurse do first?",
   options:["This is a new anxiety disorder unrelated to her ADHD medication; refer to psychiatry only","Her ADHD symptoms and the academic stress have returned now that she has stopped her stimulant; collect more history on her medication adherence and current coping before determining next steps","She is describing serotonin syndrome from her stimulant; hold all medications immediately","She should be restricted from all physical activity until she resumes her medication"],
   answer:1,
   why:"A patient who did fine over a low-demand summer and decompensates once academic demands return after stopping a stimulant is a classic ADHD-management scenario — the priority is gathering additional cues (adherence, coping strategies, safety) before jumping to a new diagnosis or an unrelated emergency."}
},
{ id:"mh-autism", title:"Autism Spectrum Disorder", kicker:"A spectrum with frequent overlapping conditions, and two controversial antipsychotics",
  blocks:[
   {p:"Autism spectrum disorder (ASD) is a varied set of neurodevelopmental syndromes characterized by a wide range of communication impairments, social withdrawal, and repetitive/unusual physical behaviors, which cause significant social impairment. ASD includes conditions previously diagnosed separately as autism, childhood disintegrative disorder, pervasive developmental disorder, and Asperger's disorder — all now grouped under the spectrum. It may be associated with other conditions such as epilepsy, genetic disorders (Rett syndrome), and intellectual disabilities."},
   {p:"ASD is more common in males and in those born before 26 weeks of gestation, with increased risk within families — the disorder occurs roughly four to five times more frequently in boys than girls, and about 1 in 59 children in the U.S. is diagnosed with ASD. Girls without obvious intellectual impairment or language delay may go unrecognized longer, since their presentation is easier to miss. It's diagnosed early in childhood — most children are diagnosed by ages 2–3, and signs may manifest as early as six months — and chronic symptoms persist into adulthood. Etiology is unknown, but is thought to involve genetic/chromosomal predisposition, environmental factors and exposures, and perinatal influences; brain scans in children with ASD show differences in brain shape and structure. There's no single definitive diagnostic tool — the interprofessional team (psychologist, neurologist, psychiatrist, speech therapist, and others) rules out other conditions first (hearing loss, speech problems, neurologic disorders, intellectual development disorder) before arriving at the diagnosis."},
   {h:"Three severity levels"},
   {p:"Severity for ASD is staged by how much support the person needs, based on the degree of impairment in social communication and the restrictiveness/repetitiveness of behaviors: <strong>Level 1</strong> requires support, <strong>Level 2</strong> requires substantial support, and <strong>Level 3</strong> requires very substantial support. This staging is what tells the care team how much scaffolding — not just what type of intervention — a given patient needs."},
   {table:{head:["Level","What it looks like"],rows:[
     ["1 — Requires support","Noticeable difficulty with social interaction; inflexible behavior may hamper independence; with appropriate support in place, impairments may not be readily noticed"],
     ["2 — Requires substantial support","Significant impairment in both verbal and nonverbal social communication; marked distress when routines or expectations change"],
     ["3 — Requires very substantial support","Severe impairment in social communication; minimal response to social overtures from others; great distress with change, and impairment interferes with functioning in all contexts"]]}},
   {h:"Epidemiology"},
   {p:"ASD is approximately four times more common in males and carries a heavy psychiatric comorbidity burden — about 70% of individuals with ASD have another mental disorder, and about 40% have two additional mental disorders."},
   {hook:"<strong>Vaccine safety — a common misconception to correct:</strong> no scientific link has been established between immunizations, including thimerosal-containing vaccines, and autism. Nurses should be prepared to address this myth directly and calmly with families, pointing them toward the actual evidence rather than dismissing the concern."},
   {h:"Developmental red flags (screening cues by age)"},
   {list:[
    "No or limited eye contact by 6 months",
    "Failure to babble, point, or reach by 12 months",
    "Failure to say single words by 16 months",
    "Failure to say two-word phrases by 24 months",
    "Persistent preference for solitude, or marked resistance to routine changes, at any age",
    "Loss of previously acquired language or social skills at any age — this regression pattern (normal development until roughly age 2, then rapid loss of skills) is a well-documented ASD presentation, distinct from a steady early delay"]},
   {p:"Common screening instruments include the <strong>Modified Checklist for Autism in Toddlers, Revised (M-CHAT-R)</strong> — a short parent questionnaire for 18-month-olds — the Autism Spectrum Screening Questionnaire (ASSQ), and the Screening Tool for Autism in 2-Year-Olds (STAT), which uses direct observation of play, motor imitation, and joint attention. No single screening tool is diagnostic on its own; a positive screen prompts referral for the full interprofessional evaluation."},
   {h:"Pathophysiology and risk factors"},
   {p:"ASD is thought to arise from CNS defects, possibly from prenatal complications or genetic factors, with cellular abnormalities identified in the frontal and temporal lobes and the cerebellum. Possible dysfunction of serotonin, neuropeptides, oxytocin, and vasopressin has also been implicated. Risk factors include having a sibling with autism, advanced parental age, low birth weight, fetal valproate exposure, and prenatal infections or teratogen exposure. During periods of significant stress, a patient with ASD may exhibit catatonic phenomena or an undifferentiated psychotic state."},
   {h:"Priority assessments/cues"},
   {list:[
    "Based on placement on the spectrum and level of functionality, amount of support needed",
    "Screen for intellectual disability and age-appropriate development (accelerated, delayed, or normal)",
    "Social and relational difficulties, including decreased interest in others, capacity to imitate others, demonstration and receipt of affection, attachment, imaginative activity, ability to empathize and process feelings of others, ability to play with others, ability to create and sustain friendships",
    "Verbal and/or non-verbal communication difficulties, including eye contact, using and interpreting facial expressions and gestures, ability to hold a reciprocal conversation; may demonstrate echolalia, idiosyncratic utterances, or monotone speech",
    "Physical activities and interests, including over- or under-reaction to stimuli (especially sounds), irritability, compulsivity, fascination with certain objects, need for consistent routine and surroundings, repetitive verbalizations, repetitive body movements (clapping, banging, rocking), self-injurious behaviors",
    "Altered family dynamics and strain on relationships with caregivers and siblings"]},
   {h:"Priority laboratory tests/diagnostic cues"},
   {list:["Developmental tests — delays in language and social skills","Hearing and vision tests — potential deficits","Diagnostic tests — potential comorbidities such as epilepsy"]},
   {h:"Priority interventions/collaborative actions"},
   {list:[
    "Ensure safety related to high levels of physical activity without cognitive control",
    "Create a safe, consistent environment for learning and play",
    "Provide familiar foods, objects, and routines",
    "Support the client's interactions with others, set goals for success, and provide clear, concrete instructions",
    "Form trusting relationships that convey acceptance; reinforce positive behaviors such as eye contact, socially acceptable behaviors, appropriate use of touch, and communication",
    "Only touch clients when they appear receptive — follow the client's cues",
    "Expose to group learning and play as tolerated",
    "Ensure a consistent, limited number of caregivers",
    "Encourage self-care and capitalize on individual, personal strengths to meet goals",
    "Avoid placing excessive demands on the client, and use simple, concrete, literal language — the client is likely to interpret words concretely",
    "Maintain a regular, predictable daily routine with consistent times for waking, dressing, eating, school, and bed; if the routine must change, prepare the client for the change in advance",
    "Use a picture board or visual schedule, especially for visual learners, to help make transitions easier",
    "Teach caregivers to recognize triggers and early behavioral cues (increased hand-flapping, irritability) that precede a tantrum or self-injurious episode, and intervene before it escalates",
    "For self-injurious behavior, use protective measures such as helmets or padding rather than punishment — punishment can worsen self-injurious behavior",
    "Make the home safer with locks and gates so the client cannot wander unsupervised",
    "Prepare the client for changes by explaining them BEFORE they happen — predictability reduces distress",
    "Help the family build strong one-on-one relationships with the client",
    "Reinforce the client's individual strengths rather than focusing only on deficits"]},
   {h:"Priority actual & potential complications"},
   {list:["Potential exists for misdiagnosis and incorrect treatment","Assumption of lower cognitive function related to communication impairment"]},
   {h:"Priority hypotheses for nursing care"},
   {list:[
    "Early diagnosis increases effectiveness of interventions",
    "Provide support with symptoms of self-injury, aggression, hyperactivity, and impulsivity",
    "Be aware of savants who may excel in music, art, puzzles/patterning, design, or memory",
    "Children and adults with autism may seek health care related to other physical needs/diagnoses — nurses need to be sensitive to and capable of working with clients with autism across the lifespan"]},
   {h:"Priority medications"},
   {list:[
    "<strong>Risperidone</strong> — oral antipsychotic; controversial use for irritability in children ages 5–15 years; assess for neuroleptic malignant syndrome, tardive dyskinesia, and hyperglycemia/diabetes mellitus",
    "<strong>Aripiprazole</strong> — oral antipsychotic; controversial use for irritability in children ages 6–17 years; may cause sedation, fatigue, weight gain, drooling, and tremoring",
    "<strong>Ziprasidone</strong> — short-term antipsychotic option specifically for aggression",
    "<strong>Atomoxetine or methylphenidate</strong> — used when comorbid ADHD symptoms are present alongside ASD",
    "<strong>Fluvoxamine (SSRI)</strong> — may reduce ritualistic behavior and improve language and mood"]},
   {hook:"Both antipsychotics used in ASD are flagged \"controversial\" in the source material for the same reason: they're prescribed off-label for the behavioral symptom of irritability rather than for autism itself, and they carry the full antipsychotic side-effect burden (EPS, NMS, metabolic derangement) in a pediatric population — which is exactly why the age ranges, and the specific monitoring for each drug, are worth locking in separately rather than lumping \"antipsychotic for autism\" into one fact."}
  ],
  check:{stem:"A hospitalized child with autism spectrum disorder becomes highly distressed and starts covering his ears and rocking when a loud alarm sounds nearby. What is the most appropriate nursing interpretation and response?",
   options:["The child is being intentionally disruptive and should be redirected firmly","This is likely a sensory overload response tied to over-reaction to stimuli, which is a documented feature of ASD; reduce the sensory trigger and provide a calm, low-stimulation environment","The child requires immediate psychiatric medication","This behavior indicates a new psychotic symptom"],
   answer:1,
   why:"Over- or under-reaction to stimuli, especially sounds, is a documented assessment finding in ASD, and a sudden loud noise can provoke a genuine sensory overload response rather than intentional misbehavior — the appropriate response is to reduce the sensory trigger, not to treat it as defiance or a psychiatric emergency."}
},
{ id:"mh-neurocognitive", title:"Neurocognitive Disorders: Delirium vs. Dementia", kicker:"Sudden and reversible vs. gradual and permanent — the single highest-yield bedside distinction in this unit",
  blocks:[
   {p:"<strong>Delirium</strong>, <strong>dementia</strong>, and <strong>depression</strong> can all present with confusion, memory complaints, or altered behavior — which is exactly why they get confused for each other at the bedside. The fastest way to tell them apart is onset and course: delirium arrives suddenly and is usually reversible, dementia creeps in gradually and is usually permanent, and depression can mimic either one but leaves memory largely intact underneath the low mood."},
   {h:"Delirium vs. Dementia vs. Depression — full comparison"},
   {table:{head:["Feature","Delirium","Dementia","Depression"],rows:[
     ["Onset","Sudden — often traceable to a single event (surgery, ICU stay, trauma, infection)","Slow, gradual, insidious","Gradual or sudden; may be reactive or chronic"],
     ["Duration/reversibility","Days to weeks — generally REVERSIBLE once the cause is treated","Progressive, chronic — generally IRREVERSIBLE","Highly variable — treatable"],
     ["Awareness","Impaired, fluctuating, not permanent","Deteriorates progressively as disease advances","Usually aware/intact, but may be selective or narrowed by mood"],
     ["Attention","Severely impaired, poor focus — often driven by hallucinations or disorganized thought","Relatively preserved early, affected late","Distorted — may struggle to attend to anything outside the depressed mood"],
     ["Memory","Short-term memory loss can appear early and acutely","Often the FIRST sign, worsens progressively (\"did I take my medication?\")","Usually INTACT — pseudodementia can mimic memory loss, but true memory is preserved"],
     ["Hallucinations","Common, especially visual/sensory — contributes to agitation","May occur LATE in the disease, often visual","Possible, but typically AUDITORY if present"],
     ["Sleep","Disturbed, disorganized","Disturbed, day-night reversal common (Sundowner's syndrome)","Variable — hypersomnia or insomnia, often worse in early morning"],
     ["Thought pattern","Disorganized, jumps from topic to topic","Impoverished/limited insight; may confabulate or use compensatory strategies (writing things down)","May be organized but empty/lacking substance, or perseverate on one or two themes"]]}},
   {hook:"<strong>Sundowner's syndrome</strong> — in dementia, confusion, wandering, and agitation characteristically worsen as evening approaches. It's a dementia-specific pattern worth naming separately from delirium's generally around-the-clock fluctuation."},
   {h:"Three vignettes — same complaint, three different diagnoses"},
   {p:"<strong>Mr. Jason Millar, 71</strong>, is postoperative day 6 from a total bowel resection. He is disoriented, agitated, pulling at his IV lines, and believes the hospital carts rolling by are trains he's late for. This is classic <strong>delirium</strong>: sudden onset tied directly to a recent surgery/hospitalization, with hallucination-driven, disorganized behavior."},
   {p:"<strong>Mrs. Viola Schmidt, 71</strong>, lives in assisted living and has grown increasingly confused over the past 6 months. She recently wandered off her unit, and her family is now considering a transfer to a memory-care unit. This is classic <strong>dementia</strong>: an insidious, progressive pattern with a concrete safety consequence (wandering)."},
   {p:"<strong>Mrs. Angela Petrie, 71</strong>, attends a senior center and reports feeling sad, saying her life feels \"useless\"; she admits to past suicidal ideation with no current intent. Depression in older adults can mimic cognitive impairment — a pattern called <strong>pseudodementia</strong> — and must always be screened for rather than assumed to be dementia. (Full depression content lives in the Mood Disorders unit; this is a cross-reference, not a duplicate.)"},
   {h:"NCLEX case in focus: postoperative delirium"},
   {p:"<strong>Graham Rice, 63</strong>, was admitted after a motor vehicle accident with traumatic brain injury and evacuation of an intracranial hematoma. He was extubated on day 7 and is now progressively disoriented, agitated, restless, and combative, hallucinating that people are touching him or his equipment; his blood pressure has been elevated above his baseline throughout. His family is confused and concerned about his slow recovery and behavior, and he becomes agitated trying to communicate his needs. This is <strong>postoperative/post-TBI delirium</strong> in the ICU/stepdown setting — a highly testable pattern. New-onset agitation plus hallucinations plus a fluctuating level of consciousness in a recent postoperative or neuro patient should make you think <strong>delirium first</strong> — not \"dementia\" (too gradual for this timeline) and not \"new psychosis\" (there is an obvious acute medical driver)."},
   {h:"Delirium — risk factors and manifestations"},
   {list:[
    "Risk factors: hospitalization, ICU stay, polypharmacy, old age, stroke, surgery, use of restraints",
    "Always secondary to an underlying medical condition — infection, electrolyte imbalance, substance use/withdrawal, and more — there is ALWAYS a cause to find and treat",
    "Manifestations: disorganization, impaired memory, anxiety/agitation, delusional thinking; level of arousal ranges from lethargic to hypervigilant",
    "Orientation to time and place is typically lost first and is the most common orientation deficit",
    "Symptoms are often worse at night"]},
   {hook:"Delirium is a MEDICAL EMERGENCY. It requires prompt diagnosis and treatment of the underlying cause — the confusion itself is a symptom, not the diagnosis."},
   {h:"Alzheimer's disease — risk factors"},
   {list:[
    "Genetics/family history in an immediate family member",
    "Head injury or traumatic brain injury",
    "Advanced age — risk is highest after age 65",
    "Cardiovascular disease and unhealthy lifestyle factors: inactivity, poor diet, high cholesterol, obesity, diabetes"]},
   {h:"Alzheimer's disease — staging"},
   {table:{head:["Stage","What it looks like"],rows:[
     ["Mild/early","Not noticeable to others; memory lapses, misplacing things, difficulty focusing; client can still accomplish their own ADLs"],
     ["Moderate/middle","Increasing forgetfulness and short-term memory loss; PERSONALITY CHANGES; client gets lost or wanders; unable to complete own ADLs/self-care; may become incontinent"],
     ["Severe/late","Needs full assistance with ALL ADLs; progressively loses physical skills such as walking, eating, and swallowing; may ultimately result in coma or death"]]}},
   {h:"Alzheimer's disease — priority interventions"},
   {list:[
    "Safety first — prevent physical harm, and avoid restraints whenever possible",
    "Attend to physical needs — hygiene, food, water, sleep",
    "Anti-anxiety or antipsychotic medications may be needed as ordered for severe agitation or distress"]},
   {h:"Alzheimer's disease — communication"},
   {list:[
    "Speak slowly",
    "Give one direction at a time",
    "Avoid complex or open-ended questions — ask simple, direct questions instead",
    "Face the client directly when speaking"]},
   {h:"Cholinesterase inhibitors — donepezil, galantamine, rivastigmine"},
   {p:"Generic <strong>donepezil (Aricept)</strong>, <strong>galantamine (Razadyne)</strong>, and <strong>rivastigmine (Exelon)</strong> are used in the early and moderate stages of dementia/Alzheimer's disease to improve quality of life — they do NOT cure the underlying disease. This class is also sometimes used in Parkinson's disease. Alzheimer's pathophysiology involves degeneration of cholinergic neurons (decreased acetylcholine) along with plaque and tangle buildup; cholinesterase inhibitors work by inhibiting the acetylcholinesterase enzyme, which increases acetylcholine availability at the synapse and improves cognitive function or slows memory deterioration."},
   {list:[
    "<strong>Rivastigmine</strong> is highly hepatically metabolized and should be used cautiously, with limited dosing, in liver disease — it can accumulate with hepatic impairment",
    "Side effects across this class: orthostatic hypotension, nausea/vomiting, diarrhea, anorexia",
    "Best taken WITH FOOD to reduce GI side effects"]},
   {hook:"Keep the vocabulary straight: <strong>dementia</strong> is the general umbrella term for a group of symptoms/decline in cognitive function; <strong>Alzheimer's disease</strong> is one specific disease that can cause a major neurocognitive disorder — the terms are not interchangeable. And remember the reversibility rule that ties this whole lesson together: delirium is REVERSIBLE if treated promptly; Alzheimer's and other major neurocognitive disorders are generally IRREVERSIBLE."}
  ],
  check:{stem:"An older adult is postoperative day 2 from hip surgery. The nurse notes the client was oriented and calm yesterday but is now agitated, pulling at the IV line, and intermittently unable to state the date or location, with symptoms that seem to wax and wane throughout the shift and worsen at night. The client's daughter asks if her mother \"has dementia now.\" What is the nurse's best response?",
   options:["\"Yes, this sudden change is typical of how dementia usually first appears after surgery.\"","\"This sudden, fluctuating confusion is more consistent with delirium, which is often reversible once the underlying cause — such as infection, medication effects, or metabolic changes — is identified and treated; dementia develops gradually over months to years.\"","\"This is a normal part of aging and requires no further assessment.\"","\"This is most likely a new psychotic disorder unrelated to the surgery.\"" ],
   answer:1,
   why:"A sudden, fluctuating change in orientation and attention that emerges in the days after surgery is the textbook presentation of delirium, not dementia — dementia has a gradual, insidious onset over a much longer timeframe. Delirium always has an underlying cause, is a medical emergency, and is generally reversible once that cause is treated, which is the key teaching point for the family."}
},
{ id:"mh-somatic", title:"Somatic Symptom & Related Disorders", kicker:"When psychological stress shows up as physical illness — and why the symptoms are real to the client either way",
  blocks:[
   {p:"<strong>Somatization</strong> is psychological stress that presents through physical manifestations that cannot be explained by any identifiable pathology or diagnosis. Somatic symptom and related disorders cover a spectrum of presentations, but they share one nursing principle above all others: the symptoms feel completely real to the client, even when no organic cause is found, and the nurse's job is to validate that experience rather than dismiss it."},
   {h:"Somatic Symptom Disorder"},
   {list:[
    "Client is consumed by physical symptoms to the point they disrupt daily life",
    "Seeks medical help from multiple providers/facilities — a \"doctor shopping\" pattern",
    "Pattern of remission and exacerbation over time",
    "May over-medicate with analgesics and antianxiety medications",
    "Direct relationship between stress and symptoms — increased stress leads to increased somatic symptoms"]},
   {h:"Assessment tool"},
   {p:"The <strong>PHQ-15 (Patient Health Questionnaire-15)</strong> is used to identify 15 of the most common somatic symptoms and screen for somatic symptom disorder."},
   {h:"Nursing considerations — Somatic Symptom Disorder"},
   {list:[
    "SAFETY is a priority — assess for symptoms or thoughts of self-harm or suicide",
    "Understand that the somatic symptoms feel REAL to the client even though no organic pathology is found — validate the client's experience rather than dismissing it",
    "Help the client verbalize feelings, while limiting the amount of time spent discussing the somatic symptoms themselves, to avoid reinforcing the symptom focus",
    "Assess coping mechanisms and educate on alternative, healthier coping strategies"]},
   {h:"Conversion Disorder"},
   {p:"Conversion disorder involves the sudden onset of neurological manifestations and physical symptoms WITHOUT a known neurological diagnosis. Symptoms can be related to a psychological conflict or need that is beyond the client's conscious control — they are NOT intentionally produced or faked."},
   {table:{head:["Type","Manifestations"],rows:[
     ["Motor","Paralysis, pseudoseizures"],
     ["Sensory","Blindness, deafness, sensations of burning or tingling, inability to smell or speak"]]}},
   {hook:"<strong>Pseudocyesis</strong> — signs and symptoms of pregnancy without the presence of an actual fetus. It may occur in a client who strongly desires to become pregnant, and it's a good example of how deeply a conversion presentation can mimic an organic condition."},
   {h:"Nursing considerations — Conversion Disorder"},
   {list:[
    "Ensure safety",
    "Gain trust and rapport with the client",
    "Assess coping mechanisms and educate on alternative ways of coping",
    "Assess stress-management methods",
    "Encourage therapy — individual, group, or support groups"]},
   {p:"Medications for conversion disorder may include antidepressants or anxiolytics, targeting the underlying anxiety or mood component rather than the physical symptom itself."},
   {p:"Nursing considerations for PTSD — relaxation techniques, anxiety-reduction strategies, support groups, and antidepressants — overlap substantially with somatic-disorder care. See the PTSD lesson in the Anxiety, OCD & Trauma-Related Disorders unit for the full content; it isn't duplicated here."}
  ],
  check:{stem:"A client has been evaluated by several providers over the past year for chronic abdominal pain, headaches, and fatigue. Extensive workups, including imaging and labs, have found no organic cause. The client becomes tearful and says, \"No one believes that I'm really in pain.\" What is the nurse's most therapeutic response?",
   options:["\"The tests are all normal, so there's nothing physically wrong with you.\"","\"I believe that your pain is real to you, even though we haven't found a physical cause — let's talk about how you've been coping with everything you're going through.\"","\"You should stop seeing so many different doctors about this.\"","\"These symptoms will go away once you stop worrying about them so much.\"" ],
   answer:1,
   why:"The core nursing principle in somatic symptom disorder is that the symptoms feel completely real to the client even without an identifiable organic cause. Dismissing the pain as fake or telling the client to simply stop worrying invalidates their experience and shuts down communication; validating the experience while redirecting toward feelings and coping is the therapeutic approach."}
}
]};

const MEDICATIONS = { title:"Medications", sub:"Every drug class on both blueprints — Mental Health and Immune/Inflammation/Cellular Regulation — as standalone med cards. Not tucked under either topic dropdown, so you can jump straight to a drug class from the main page.", lessons:[
{ id:"mh-meds-antidepressants", title:"Antidepressants: SSRI, SNRI, TCA & MAOI", kicker:"Four classes, one shared risk (serotonin syndrome), and a black-box warning that applies to all of them",
  blocks:[
   {p:"Antidepressants are grouped by which neurotransmitter(s) they act on and, for the older classes, by the specific safety problem that makes them second- or third-line today. All four classes carry the same FDA black-box warning: increased risk of suicidal thinking and behavior in children, adolescents, and young adults up to age 24, especially in the first weeks of therapy or after a dose change — this is the single highest-yield antidepressant fact across every class."},
   {h:"SSRIs (selective serotonin reuptake inhibitors) — first-line"},
   {p:"<strong>Examples:</strong> fluoxetine (Prozac), sertraline (Zoloft), paroxetine (Paxil), citalopram (Celexa), escitalopram (Lexapro). SSRIs block the reuptake of serotonin at the synapse, increasing its availability. They're first-line because their side-effect profile is the most tolerable of the four classes."},
   {list:[
    "<strong>Common side effects</strong> — nausea, sexual dysfunction, insomnia or drowsiness, weight changes",
    "<strong>Onset</strong> — full therapeutic effect takes 4–6 weeks; patients need to know this so they don't stop early believing the drug \"isn't working\"",
    "<strong>Never stop abruptly</strong> — taper to avoid discontinuation syndrome (dizziness, flu-like symptoms, \"brain zaps\", irritability)",
    "<strong>Key exam fact</strong> — fluoxetine is the SSRI most associated with treating bulimia nervosa and is FDA-approved for that indication"]},
   {h:"SNRIs (serotonin-norepinephrine reuptake inhibitors)"},
   {p:"<strong>Examples:</strong> venlafaxine (Effexor), duloxetine (Cymbalta). Act like SSRIs but also block norepinephrine reuptake, which can help with comorbid chronic pain and tends to produce a more \"activating\" effect. Same suicide-risk warning, same abrupt-discontinuation risk, plus a tendency to raise blood pressure at higher doses (monitor BP)."},
   {h:"TCAs (tricyclic antidepressants) — older, higher-risk"},
   {p:"<strong>Examples:</strong> amitriptyline, nortriptyline, imipramine. Effective, but largely replaced by SSRIs/SNRIs because of a much narrower safety margin."},
   {list:[
    "<strong>Anticholinergic side effects</strong> — dry mouth, blurred vision, urinary retention, constipation",
    "<strong>Cardiotoxicity</strong> — the defining danger: TCA overdose can cause fatal cardiac dysrhythmias, so a baseline EKG is often obtained and TCAs are prescribed cautiously (small quantities at a time) in patients with active suicidal ideation",
    "<strong>Orthostatic hypotension</strong> — fall risk, especially in older adults"]},
   {h:"MAOIs (monoamine oxidase inhibitors) — last-line, dietary restriction"},
   {p:"<strong>Examples:</strong> phenelzine, tranylcypromine. Block the enzyme that breaks down serotonin, norepinephrine, and dopamine. Reserved for treatment-resistant depression because of two serious interaction risks."},
   {list:[
    "<strong>Tyramine (\"cheese\") reaction</strong> — aged cheese, cured/processed meats, red wine, and fermented foods can trigger a hypertensive crisis in a patient on an MAOI, because tyramine normally gets broken down by the same enzyme the drug is blocking",
    "<strong>Serotonin syndrome risk</strong> — combining an MAOI with any other serotonergic drug (SSRI, SNRI, triptans, even St. John's Wort) can be life-threatening; a washout period is required when switching between an MAOI and an SSRI"]},
   {h:"Serotonin syndrome — the cross-class emergency"},
   {p:"Any combination of serotonergic agents can trigger serotonin syndrome: <strong>hyperthermia, agitation, tremor, hyperreflexia/clonus, diaphoresis, and tachycardia</strong>. It's a medical emergency — stop the offending agent(s) and provide supportive care. Recognize the pattern (fever + neuromuscular hyperactivity + autonomic instability) and distinguish it from NMS (antipsychotics, rigidity, and a slower onset) covered in the antipsychotics lesson."},
   {h:"Additional exam-relevant details"},
   {list:[
    "SSRIs/SNRIs are typically dosed in the <strong>morning</strong> since they can cause insomnia — a practical detail that often trips up dosing-schedule questions",
    "Avoid combining an SSRI/SNRI with <strong>St. John's Wort</strong> (serotonin syndrome risk) and limit grapefruit juice intake",
