  options:["This is an unrelated new neurologic problem requiring an immediate CT scan","NSAID use has reduced renal clearance of lithium, likely producing early lithium toxicity","This is an expected, benign side effect of lithium that requires no action","The client is experiencing serotonin syndrome from combining lithium and ibuprofen","The ibuprofen likely lowered the lithium dose and the client now needs an increased dose"],
  answer:1,
  why:"NSAIDs reduce renal clearance of lithium and can push levels toward toxicity without any change in the lithium dose itself. Coarse tremor and confusion are both LITH toxicity signs, so the new NSAID is the first thing to suspect."},
 {ref:"mh-meds-antipsychotics", stem:"A client receiving haloperidol suddenly develops a frightening spasm of the neck with the eyes rolling upward. Which medication should the nurse anticipate administering?",
  options:["Naloxone","Valproic acid","Benztropine","Lithium carbonate","Clozapine"],
  answer:2,
  why:"This presentation is an acute dystonic reaction, an emergency-adjacent extrapyramidal symptom. IM/IV benztropine (or diphenhydramine) restores the dopamine-acetylcholine balance and typically resolves it quickly."},
 {ref:"mh-antipsychotics-overview", type:"sata", stem:"A client has been taking an atypical antipsychotic for several months. Which findings should prompt the nurse to screen for metabolic syndrome? Select all that apply.",
  options:["Weight gain of 12 lb since starting the medication","Fasting blood glucose of 142 mg/dL","Resolution of auditory hallucinations","Blood pressure of 148/92 mmHg","Improved appetite with no other changes"],
  answers:[0,1,3],
  why:"Metabolic syndrome from atypical antipsychotics includes weight gain, hyperglycemia/new-onset diabetes, and hypertension. Resolved hallucinations reflect treatment success, not a side effect, and improved appetite alone is not evidence of metabolic syndrome."},
 {ref:"mh-meds-anxiolytics", stem:"A client with newly diagnosed generalized anxiety disorder asks why the provider prescribed buspirone instead of a benzodiazepine for daily use. What is the nurse's best explanation?",
  options:["Buspirone works within minutes, making it ideal for an acute panic attack","Buspirone enhances GABA activity just like benzodiazepines but is safer","Buspirone is used only for insomnia, not anxiety","Buspirone takes 2 to 4 weeks for full effect and carries little dependence risk, making it appropriate for long-term maintenance rather than acute relief","Buspirone should be taken only as needed whenever anxiety spikes"],
  answer:3,
  why:"Buspirone does not act on GABA and carries essentially no dependence risk, but it takes 2–4 weeks for full effect and does nothing for an acute panic attack — it is a maintenance drug, not a rescue drug, unlike benzodiazepines."},
 {ref:"mh-meds-stimulants", stem:"A child taking methylphenidate for ADHD returns for a routine follow-up visit. Which assessment finding is most important for the nurse to trend over time?",
  options:["Serum sodium level","Liver function tests","Thyroid-stimulating hormone","Platelet count","Height and weight percentiles"],
  answer:4,
  why:"Stimulant-related appetite suppression can affect growth velocity in children, so height and weight are tracked at routine visits alongside cardiovascular monitoring."},
 {ref:"mh-meds-emergency", stem:"Paramedics administer naloxone to a client found unresponsive after a suspected heroin overdose and respirations improve. Thirty minutes later the client becomes unresponsive again with slow, shallow breathing. What is the best explanation?",
  options:["Naloxone's duration of action is shorter than that of the opioid, so its effect wore off before the opioid cleared","The client developed an allergic reaction to the naloxone","This finding indicates the client never actually overdosed on an opioid","The client is now experiencing benzodiazepine withdrawal","Naloxone has no further therapeutic effect and repeat dosing is contraindicated"],
  answer:0,
  why:"Naloxone's effect can wear off before a longer-acting opioid has cleared the body, allowing the client to slip back into respiratory depression — this is why repeat dosing and close monitoring are required rather than a single dose and discharge."},
 {ref:"mh-bipolar", stem:"A nurse is caring for a client with bipolar disorder whose affect shifts rapidly from euphoria to irritability within minutes, unrelated to anything happening in the environment. Which term should the nurse use to document this finding?",
  options:["Blunted affect","Labile affect","Flat affect","Constricted affect","Inappropriate affect"],
  answer:1,
  why:"Labile affect is rapid, easily changing affective expression unrelated to external events or stimuli — a classic finding in mania, distinct from blunted, flat, or constricted affect, which all describe reduced expression."},
 {ref:"mh-bipolar", stem:"Which statement about lithium carbonate therapy for bipolar disorder is accurate?",
  options:["Lithium is effective in nearly all clients with bipolar disorder","Lithium has a wide safety margin, so frequent serum level monitoring is unnecessary","Lithium is effective in about one-third of clients and has a diuretic effect that requires monitoring serum sodium and water intake","Lithium may be combined freely with NSAIDs for comorbid pain without additional monitoring","Lithium is contraindicated in bipolar disorder and is used only for schizophrenia"],
  answer:2,
  why:"Lithium is effective in roughly one-third of clients with bipolar disorder, and its diuretic effect means monitoring serum sodium and water intake matters — the opposite of a wide safety margin, since narrow-window toxicity is the defining risk."},
 {ref:"mh-bipolar", type:"sata", stem:"A client is admitted during an acute manic episode. Which findings would the nurse expect to assess? Select all that apply.",
  options:["Decreased need for sleep","Flight of ideas and pressured speech","Flat, blunted affect","Grandiosity and impulsive spending","Significant weight gain from overeating"],
  answers:[0,1,3],
  why:"Mania presents with decreased need for sleep, racing thoughts with pressured/accelerated speech, and grandiosity with high-risk behaviors like impulsive spending. Flat affect is a negative symptom seen in psychotic disorders, and mania typically causes weight loss from not eating, not weight gain."},
 {ref:"mh-schizophrenia", stem:"A nurse is explaining the dopamine hypothesis of schizophrenia to a nursing student. Which statement correctly describes why antipsychotic medications control positive symptoms better than negative symptoms?",
  options:["Positive symptoms result from dopamine hypoactivity in the limbic system, which antipsychotics correct","Negative symptoms result from dopamine hyperactivity in the prefrontal cortex, which antipsychotics worsen","Antipsychotics increase dopamine equally throughout the entire brain","Positive symptoms result from dopamine hyperactivity in limbic regions, which dopamine-blocking antipsychotics address directly, while negative symptoms stem from prefrontal dopamine hypoactivity that blocking dopamine further does not fix","Positive and negative symptoms share an identical neurochemical cause and respond identically to treatment"],
  answer:3,
  why:"The dopamine hypothesis holds that limbic hyperactivity produces positive symptoms, which dopamine-blocking antipsychotics treat effectively, while prefrontal hypoactivity produces negative symptoms, which further dopamine blockade does not correct — explaining the treatment gap between the two symptom clusters."},
 {ref:"mh-psychosis", stem:"An older adult is brought to the emergency department with new-onset visual hallucinations and disorganized speech that began two days ago. Which action should the nurse anticipate first?",
  options:["Begin an antipsychotic medication immediately","Document a new diagnosis of schizophrenia","Transfer the client directly to the psychiatric unit without further workup","Reassure the client that the hallucinations are not real","A workup for medical causes such as infection, metabolic disturbance, or medication effect before attributing symptoms to a primary psychiatric illness"],
  answer:4,
  why:"Psychosis is a symptom, not automatically a psychiatric diagnosis. New-onset psychosis always triggers a medical workup first — a UTI in an older adult is a classic reversible cause — before it is attributed to a primary psychiatric illness like schizophrenia."},
 {ref:"mh-depression", stem:"A postpartum client tells the nurse she has felt persistently sad, hopeless, and disconnected from her newborn for the past three weeks, more severe than she expected from normal adjustment. How should the nurse interpret this?",
  options:["This exceeds typical baby blues and is consistent with postpartum depression, which can include psychotic features and warrants further assessment","This is a normal, transient response to childbirth requiring no follow-up","This finding indicates bipolar disorder rather than a depressive disorder","This is expected only if the client had a cesarean delivery","This should resolve without any intervention within 48 hours"],
  answer:0,
  why:"Postpartum depression is depressed mood after delivery that is more significant than the minor sadness of ordinary baby blues, may include psychotic features, and warrants further assessment rather than being dismissed as a normal adjustment reaction."},
 {ref:"mh-depression", type:"sata", stem:"A nurse is assessing a client with major depressive disorder. Which findings are consistent with this diagnosis? Select all that apply.",
  options:["Anhedonia and an inability to feel pleasure","Flat, monotone speech and psychomotor slowing","Increased energy and racing thoughts","Hypersomnia or insomnia","Grandiosity and inflated self-esteem"],
  answers:[0,1,3],
  why:"Depression presents with anhedonia, slowed monotone speech and blunted affect, and disrupted sleep in either direction (hypersomnia or insomnia). Increased energy with racing thoughts and grandiosity are manic, not depressive, findings."},
 {ref:"mh-therapies", stem:"A client is scheduled for electroconvulsive therapy (ECT) for severe, treatment-resistant depression with active suicidality. Which nursing action is most appropriate immediately after the procedure?",
  options:["Encourage the client to drive home once awake to promote independence","Provide frequent, brief, simple orientation and closely monitor for suicidal ideation as the client's energy returns","Withhold all pain relief regardless of any reported headache","Expect the client to have full memory of the entire procedure immediately upon waking","Discontinue all suicide precautions, since ECT eliminates suicide risk"],
  answer:1,
  why:"Confusion and disorientation are expected after ECT, so frequent, brief, simple orientation is appropriate. A client's physical energy can return before their mood lifts, so close monitoring for suicidal ideation is a stated safety priority, not something ECT eliminates."},
 {ref:"mh-gad", stem:"A client reports an attack that built rapidly to overwhelming physical symptoms within about 10 minutes and resolved within roughly 25 minutes, and the client is now preoccupied with worry about having another one. Which condition does this best describe?",
  options:["Generalized anxiety disorder","Specific phobia","Panic disorder","Social anxiety disorder","Obsessive-compulsive disorder"],
  answer:2,
  why:"Panic disorder involves unexpected attacks that peak within about 10–15 minutes and rarely last longer than 30 minutes, plus persistent between-attack worry about having another one — that ongoing worry is itself part of the diagnosis, not just the attacks."},
 {ref:"mh-gad", type:"sata", stem:"A client is having a panic attack in the emergency department. Which physical findings would the nurse expect to observe? Select all that apply.",
  options:["Tachycardia and palpitations","Hyperventilation and shortness of breath","Bradycardia and hypotension","Diaphoresis and trembling","Improved concentration and calm problem-solving"],
  answers:[0,1,3],
  why:"Panic-level anxiety produces sympathetic activation — tachycardia, hyperventilation, diaphoresis, and trembling — not bradycardia. At this level, learning and problem-solving are not possible, so calm problem-solving would not be expected."},
 {ref:"mh-ocd", stem:"A client with OCD performs handwashing rituals that consume more than four hours daily and cause raw, cracked skin, but the client continues despite recognizing the behavior is excessive. Which is the behavioral treatment of choice for this presentation?",
  options:["Aversion therapy","Implosion therapy without any gradual exposure","Token economy","Exposure and response prevention (ERP)","Electroconvulsive therapy"],
  answer:3,
  why:"Exposure and response prevention is the behavioral treatment of choice for OCD: the client is gradually exposed to the obsession-triggering stimulus while coached to resist the compulsion, used alone for mild-to-moderate OCD or combined with medication for more severe cases."},
 {ref:"mh-ptsd", stem:"A client with PTSD reports recurrent, distressing nightmares that disrupt sleep nightly. Which medication, used specifically to target this symptom, should the nurse anticipate the provider prescribing?",
  options:["Naloxone","Carbamazepine","Paroxetine","Amitriptyline","Prazosin"],
  answer:4,
  why:"Prazosin is an oral antihypertensive used specifically to manage recurrent nightmares in PTSD, distinct from paroxetine, amitriptyline, and carbamazepine, which address the broader mood and intrusive-thought symptoms of PTSD."},
 {ref:"iis-cancer", stem:"A biopsy report describes a tumor as well-differentiated, encapsulated, and confined to its site of origin with no tissue invasion noted. Which classification best fits these findings?",
  options:["Benign tumor","Malignant tumor, Grade IV","Malignant tumor with distant metastasis","Carcinoma in situ progressing to Stage IV","Sarcoma invading adjacent structures"],
  answer:0,
  why:"Benign tumors are well-differentiated, encapsulated, and localized without invasion or metastasis — the opposite of the features that define malignancy."},
 {ref:"iis-cancer", stem:"A pathology report classifies a client's tumor as Grade III. Which statement correctly interprets this finding?",
  options:["The tumor has invaded 3 regional lymph nodes","The tumor cells are poorly differentiated and more aggressive, resembling the tissue of origin less closely","The tumor is classified as Stage III using the TNM system","The tumor has produced 3 distant metastases","The tumor is well-differentiated with a favorable prognosis"],
  answer:1,
  why:"Grading (I–IV) measures cellular differentiation; a higher grade means the tumor resembles its tissue of origin less closely and behaves more aggressively — this is distinct from TNM staging, which tracks tumor size, node involvement, and metastasis."},
 {ref:"iis-cancer", stem:"A client with lung cancer develops progressive dyspnea, facial and neck edema, and distended chest wall veins. The nurse suspects superior vena cava syndrome. Which action should the nurse take first?",
  options:["Position the client flat and supine to reduce venous congestion","Obtain a peripheral IV in the client's arm for emergent fluids","Elevate the head of the bed to semi-Fowler's or higher and avoid upper-extremity venipuncture","Apply a tight blood pressure cuff to the affected arm to monitor closely","Encourage the client to lie on the affected side to promote drainage"],
  answer:2,
  why:"SVCS management prioritizes elevating the head and upper body (never fully supine) and avoiding upper-extremity venipuncture or blood pressure checks, which can worsen venous congestion in an already compressed superior vena cava."},
 {ref:"iis-cancer", type:"sata", stem:"A nurse is teaching about the difference between primary and secondary cancer symptoms. Which findings should the nurse identify as secondary symptoms, arising from the body's systemic response to the malignancy rather than a direct tumor mass effect? Select all that apply.",
  options:["Unintended weight loss","Fatigue","Pain from a tumor compressing an adjacent nerve","Anemia","Bleeding from a tumor eroding into a nearby vessel"],
  answers:[0,1,3],
  why:"Secondary symptoms come from the body's broader systemic response to cancer — fatigue, weight loss, and anemia/cachexia — while primary symptoms come directly from the tumor's local mass effect, such as compression pain or bleeding/obstruction."},
 {ref:"iis-meds-oncsupport", stem:"A client receiving epoetin alfa for chemotherapy-induced anemia has a hemoglobin of 12.6 g/dL at today's visit. Which action should the nurse anticipate?",
  options:["Increase the epoetin alfa dose to further raise hemoglobin","Administer the scheduled dose since this level is still below normal","Switch the client to filgrastim instead","Discontinue chemotherapy immediately","Hold epoetin alfa, since a hemoglobin above 11–12 g/dL raises thromboembolic risk"],
  answer:4,
  why:"Epoetin alfa carries a boxed warning for thromboembolic events; a hemoglobin above roughly 11–12 g/dL warrants holding the dose rather than continuing or increasing it."},
 {ref:"iis-hiv", stem:"A client's most recent CD4+ T-cell count is 220 cells/µL with no AIDS-defining opportunistic illness diagnosed. According to HIV staging criteria, which stage is this client in?",
  options:["Stage 2, since the count falls between 200–499 cells/µL","Stage 3 (AIDS), because any count below 500 automatically defines AIDS","Stage 1, since the client has no opportunistic illness","Stage 0, since staging requires an opportunistic illness","This client cannot be staged without a viral load result"],
  answer:0,
  why:"Stage 2 spans 200–499 CD4+ cells/µL; Stage 3 (AIDS) requires either a count below 200 or a defined AIDS-defining opportunistic illness, neither of which applies here."},
 {ref:"iis-hiv", stem:"A client newly diagnosed with HIV asks why the provider ordered a p24 antigen assay along with the rapid HIV screening test. Which explanation should the nurse provide?",
  options:["It replaces the need for any CD4 count monitoring","It measures the amount of HIV viral core protein in the blood to support diagnosis","It measures the client's antiretroviral drug levels","It is used only to screen donated blood, not individual clients","It determines whether the client has progressed to AIDS regardless of CD4 count"],
  answer:1,
  why:"The p24 antigen assay measures the amount of HIV viral core protein in the blood, supporting diagnosis alongside rapid and confirmatory testing — it is not a substitute for CD4 monitoring or AIDS staging."},
 {ref:"iis-hiv", stem:"A nurse is teaching a client newly started on ART about the concept of 'undetectable = untransmittable.' Which statement by the client best demonstrates understanding?",
  options:["Once my viral load is undetectable, I no longer need to take ART daily","An undetectable viral load means I am cured of HIV","If I take ART as prescribed and maintain an undetectable viral load, my risk of sexually transmitting HIV becomes effectively zero, but I should still use condoms to prevent other STIs","An undetectable viral load means my CD4 count is back to normal","I can stop taking ART once my viral load becomes undetectable"],
  answer:2,
  why:"A person who takes ART as prescribed and maintains an undetectable viral load has effectively no risk of sexually transmitting HIV, but ART must be continued indefinitely and condoms are still recommended, since ART doesn't protect against other STIs."},
 {ref:"iis-hiv", stem:"A nurse is caring for a client with HIV. Which nursing consideration reflects correct understanding of transmission-based precautions for routine care?",
  options:["Airborne precautions with an N95 respirator are required","Droplet precautions with a surgical mask are required","Contact precautions with a gown and gloves are required for all care","Standard precautions are sufficient, since transmission requires direct contact with specific body fluids rather than airborne or casual spread","The client should be placed in a negative-pressure isolation room"],
  answer:3,
  why:"HIV is transmitted through contact with specific body fluids (blood, semen, vaginal secretions, breast milk), not through casual or airborne spread, so standard precautions — not special isolation — are sufficient for routine care."},
 {ref:"iis-meds-art", stem:"A client presents to the emergency department 12 hours after a condom broke during sex with a partner of unknown HIV status. Which nursing action is the priority?",
  options:["Reassure the client that risk is negligible and no follow-up is needed","Schedule the client for HIV testing in 3 months and send them home","Start PrEP (tenofovir/emtricitabine) for ongoing daily use","Advise the client to wait and see if symptoms develop before seeking treatment","Initiate PEP as soon as possible, since it must begin within 72 hours of exposure to be effective"],
  answer:4,
  why:"PEP must be started within 72 hours of a known or suspected exposure to be effective, and 12 hours post-exposure is well within that window — a time-sensitive priority, not something to schedule later. PrEP is for ongoing use before an exposure, not after one."},
 {ref:"iis-hiv", type:"sata", stem:"A nurse is assessing a client in the acute (early) stage of HIV infection. Which findings would the nurse expect to assess? Select all that apply.",
  options:["Fever and malaise","Swollen lymph nodes and sore throat","A CD4 count already below 200 cells/µL","Joint pain and rash appearing 2–3 weeks after infection","A definitive AIDS diagnosis"],
  answers:[0,1,3],
  why:"Acute HIV infection presents with flu-like symptoms — fever, malaise, lymphadenopathy, sore throat, joint pain, and rash typically 2–3 weeks after exposure. A CD4 count below 200 or an AIDS diagnosis reflects advanced, untreated progression, not the acute stage."},
 {ref:"iis-meds-art", type:"sata", stem:"A nurse is teaching a client about antiretroviral therapy (ART) for HIV. Which statements should the nurse include in this teaching? Select all that apply.",
  options:["ART combines multiple drug classes to suppress viral replication toward an undetectable viral load","Adherence is the most important teaching point, since inconsistent dosing allows drug resistance to develop","ART is taken only during acute flares and stopped once symptoms resolve","ART cures HIV completely after a finite treatment course","ART allows CD4 counts to recover and reduces both disease progression and transmission risk"],
  answers:[0,1,4],
  why:"ART is a combination of antiretroviral drug classes taken daily and indefinitely to suppress viral replication, allow CD4 recovery, and reduce transmission risk — adherence is critical because inconsistent dosing promotes resistance. ART does not cure HIV or get stopped once symptoms improve."},
 {ref:"iis-lupus", stem:"A client with SLE has laboratory results showing a positive antinuclear antibody (ANA) and a positive anti-double-stranded DNA (anti-dsDNA) antibody. Which statement best explains the significance of the anti-dsDNA result?",
  options:["It confirms the client also has rheumatoid arthritis","It is positive in up to 30% of clients with RA, so it cannot help differentiate the two conditions","It is the least specific of the SLE antibody panel","It is highly specific to SLE and helps differentiate it from drug-induced lupus, unlike the less specific ANA","It indicates the client should be started on warfarin immediately"],
  answer:3,
  why:"Anti-dsDNA is highly specific to SLE and helps distinguish it from drug-induced lupus, whereas ANA — though positive in over 99% of SLE clients — is also positive in up to 30% of RA clients and therefore isn't specific on its own."},
 {ref:"iis-ra", stem:"A client meets ACR/EULAR classification criteria for rheumatoid arthritis with a total score of 8. Which statement correctly reflects this finding?",
  options:["A score of 6 or greater is required for an RA diagnosis, so this client's score of 8 supports the diagnosis","A score of 8 is below the diagnostic threshold and rules out RA","This scoring system is used only to stage cancer, not to diagnose RA","The score reflects the client's CD4 count rather than joint findings","A score of 8 indicates the client has osteoarthritis instead"],
  answer:0,
  why:"The ACR/EULAR classification system requires a total score of 6 or greater (based on joint involvement, serology, acute phase reactants, and symptom duration) to diagnose RA; a score of 8 exceeds that threshold and supports the diagnosis."},
 {ref:"iis-meds-antiinflammatory", stem:"A nurse is preparing to administer leflunomide to a client with rheumatoid arthritis. Which action is the priority before administration?",
  options:["Assess the client's serum salicylate level","Confirm that pregnancy has been ruled out, since leflunomide is teratogenic","Schedule an annual retinal eye exam","Check the client's INR","Screen for latent tuberculosis with a skin test"],
  answer:1,
  why:"Leflunomide is teratogenic, so pregnancy must be ruled out before it is administered — the eye exam applies to hydroxychloroquine, INR to warfarin, and TB screening specifically precedes biologic DMARD therapy."},
 {ref:"iis-lupus", type:"sata", stem:"A nurse is caring for a client newly diagnosed with SLE. Which findings would the nurse expect to assess? Select all that apply.",
  options:["A butterfly rash across the cheeks and bridge of the nose","Photosensitivity","Unilateral joint pain that improves with rest","Polyarthralgia with morning stiffness","Normal synovial fluid on analysis"],
  answers:[0,1,3],
  why:"SLE classically presents with a butterfly rash, photosensitivity, and polyarthralgia with morning stiffness; unilateral, rest-relieved joint pain and normal synovial fluid are features of osteoarthritis, not SLE."},
 {ref:"iis-ra", type:"sata", stem:"A nurse is assessing a client with long-standing rheumatoid arthritis for hand deformities. Which findings should the nurse expect to observe? Select all that apply.",
  options:["Swan neck deformity","Boutonnière deformity","Ulnar drift of the fingers toward the little finger","Heberden's nodes at the distal interphalangeal joints","Unilateral knee bowing"],
  answers:[0,1,2],
  why:"Swan neck deformity, boutonnière deformity, and ulnar drift are classic RA hand deformities from chronic synovial inflammation and pannus formation. Heberden's nodes and unilateral bowing are osteoarthritis findings, not RA."},
 {ref:"iis-hypersensitivity", stem:"A client is scheduled for allergy skin testing. Which instruction should the nurse reinforce beforehand?",
  options:["Continue all antihistamines and corticosteroids as usual up until testing","No special preparation is needed before skin testing","Stop antihistamines and corticosteroids 48–96 hours before testing, since they can suppress skin test reactivity and cause a false negative","Take an extra dose of antihistamine the morning of testing to prevent a severe reaction","Testing can proceed even during an active bronchospasm episode"],
  answer:2,
  why:"Antihistamines and corticosteroids must be stopped 48–96 hours before skin testing because they suppress skin test reactivity and can produce a false negative; testing is also never performed during active bronchospasm."},
 {ref:"iis-hypersensitivity", stem:"A client received an intradermal allergy test 8 minutes ago and now has a raised, red wheal with surrounding flare at the injection site. How should the nurse interpret this finding?",
  options:["A negative result, since redness alone does not indicate an allergy","An expected finding unrelated to allergy testing","A delayed Type IV hypersensitivity reaction","A positive reaction, since a wheal-and-flare response indicates sensitivity to the tested allergen","An indication that the test must be repeated with a lower allergen dose"],
  answer:3,
  why:"A wheal-and-flare response to skin testing indicates a positive reaction; an intradermal test reaction appears in about 10 minutes, so a wheal-and-flare at 8 minutes is consistent with a positive result."},
 {ref:"iis-hypersensitivity", stem:"A client received epinephrine for anaphylaxis in the emergency department, stabilized, and was discharged after 2 hours of observation. Which teaching point is most important for this client to understand before leaving?",
  options:["Anaphylaxis cannot recur once epinephrine has been given","No further monitoring is needed since symptoms have resolved","A repeat reaction, if it occurs, will always be milder than the first","The client should avoid carrying an epinephrine auto-injector unless a reaction has already started","A biphasic (rebound) reaction can occur 4–8 hours after the initial reaction, so extended observation or awareness of delayed symptoms is warranted"],
  answer:4,
  why:"A biphasic (rebound) anaphylactic reaction can occur 4–8 hours after the initial episode, so extended observation — or at minimum, clear teaching about delayed symptoms — is warranted, especially since prior reaction severity does not predict future severity."},
 {ref:"iis-hypersensitivity", stem:"A client with a documented shellfish allergy is scheduled for a CT scan requiring IV contrast. Which class of substance should the nurse recognize as carrying the highest risk of a serious anaphylactic reaction in this client?",
  options:["Radiocontrast agents","Oral antihistamines","Leukotriene receptor antagonists","Nasal corticosteroids","Mast cell stabilizers"],
  answer:0,
  why:"Along with antibiotics, radiocontrast agents cause the most serious anaphylactic reactions among common triggers, making pre-procedure allergy screening and premedication protocols important for at-risk clients."},
 {ref:"iis-hypersensitivity", type:"sata", stem:"A nurse is caring for a client during a systemic anaphylactic reaction. Which nursing actions are appropriate? Select all that apply.",
  options:["Administer epinephrine 1:1000 subcutaneously or intramuscularly in the thigh","Give supplemental oxygen and IV fluids to support hemodynamics","Substitute an oral antihistamine for epinephrine to avoid cardiac side effects","Notify the rapid response team or provider promptly","Delay treatment until a definitive allergen has been identified"],
  answers:[0,1,3],
  why:"Anaphylaxis management prioritizes epinephrine, supplemental oxygen and IV fluids, and prompt provider/rapid response notification; antihistamines and corticosteroids are adjuncts and should never be substituted for epinephrine, and treatment should never be delayed to identify the allergen first."},
 {ref:"iis-immunity-cells", stem:"A nurse is reviewing immune cell function with a student. Which statement correctly describes a humoral immune response?",
  options:["Cytotoxic T cells directly kill infected cells","Macrophages phagocytize pathogens directly","A B cell encounters an antigen and differentiates into an antibody-producing plasma cell and a memory cell","Natural killer cells destroy abnormal cells without prior sensitization","Suppressor T cells downregulate the immune response once the threat resolves"],
  answer:2,
  why:"Humoral immunity is antibody-based: a B cell that encounters an antigen differentiates into an antibody-producing plasma cell and a long-lived memory cell. The other options describe cell-mediated or phagocytic immune functions instead."},
 {ref:"iis-oa", stem:"A client reports bilateral knee pain that has worsened gradually over several years, aggravated by activity and relieved by rest, with crepitus noted on exam. Synovial fluid analysis is normal. Which teaching point is appropriate for this client's plan of care?",
  options:["Immobilize both knees completely and avoid all range-of-motion exercises","Expect morning stiffness lasting more than an hour, consistent with an autoimmune process","Anticipate starting a biologic DMARD as first-line therapy","Use moist heat for stiffness, engage in weight loss to reduce joint stress, and take scheduled pain medication as prescribed","Avoid all physical or occupational therapy referrals, since OA is not amenable to therapy"],
  answer:3,
  why:"Osteoarthritis management centers on moist heat for stiffness, weight loss to offload joints, appropriate pain management, and PT/OT referral — not immobilization or DMARD therapy, which treat the autoimmune process of RA rather than OA's mechanical wear."},
 {ref:"numsiis1", stem:"A nurse reviewing immunoglobulin classes recalls that IgG makes up about 75% of total immunoglobulin and is the only class that crosses the placenta. Which immunoglobulin class is described as the first antibody produced during a new infection and also activates complement?",
  options:["IgA","IgD","IgE","IgG","IgM"],
  answer:4,
  why:"IgM is mostly intravascular and is the first immunoglobulin produced in a new infection, also activating complement — distinct from IgG (crosses the placenta), IgA (mucosal secretions), IgE (allergic reactions), and IgD (role in B-cell differentiation, not fully understood)."},
 {ref:"iis-immunity-cells", type:"sata", stem:"A nurse is reviewing lab and assessment findings for three different clients: one with anemia, one with thrombocytopenia, and one with neutropenia. Which findings correctly match the low blood cell type responsible? Select all that apply.",
  options:["Fatigue and pallor — low red blood cells (anemia)","Easy bruising and prolonged bleeding from a venipuncture site — low platelets (thrombocytopenia)","Fever as the primary emergency warning sign, even without classic localized infection signs — low neutrophils (neutropenia)","Fever and chills — low platelets (thrombocytopenia)","Bleeding gums — low red blood cells (anemia)"],
  answers:[0,1,2],
  why:"Anemia (low RBCs) causes fatigue and pallor from reduced oxygen-carrying capacity; thrombocytopenia (low platelets) causes bruising and bleeding; neutropenia (low neutrophils) blunts the usual infection response, making fever itself the emergency warning sign rather than localized signs. Fever/chills reflect infection risk from neutropenia, not thrombocytopenia, and bleeding gums point to low platelets, not low red cells."},
],
"mh-moddiscussion":[
 {stem:"According to the discussion answers, what is the priority nursing assessment for any depressed client, regardless of other symptoms?",
  options:["Appetite history only","A direct suicide risk screen","Family financial history","Employment status"],
  answer:1,
  why:"Every depression assessment includes a direct suicide risk screen, since depression is the diagnosis most commonly associated with suicide — this is a non-negotiable priority alongside mood, neurovegetative, and cognitive assessment."},
 {stem:"Per the discussion answers, why is ADHD diagnosed clinically rather than with a lab test or imaging study?",
  options:["Because no lab test or scan can identify the disorder — diagnosis rests on a structured history documenting the symptom pattern across more than one setting","Because ADHD only affects adults","Because a single classroom observation is sufficient","Because insurance requires a clinical diagnosis instead of a lab result"],
  answer:0,
  why:"ADHD diagnosis is based on a structured history from parents, teachers, and the patient documenting onset in childhood and presence across multiple settings — there is no single lab test or imaging study that diagnoses it."},
 {type:"sata", stem:"Which of the following are accurate per the discussion answers on autism spectrum disorder nursing care? Select all that apply.",
  options:["Maintain consistent routines and give advance notice before procedures or transitions","Use concrete rather than abstract language","Treat any sign of sensory distress as intentional defiance requiring firm redirection","Involve caregivers who know the patient's individual sensory sensitivities","Assume all patients with ASD have identical sensory needs"],
  answers:[0,1,3],
  why:"Care for a hospitalized patient with ASD centers on consistent routines, concrete language, and involving caregivers who know the patient's individual communication and sensory profile — sensory distress should be recognized as overload, not defiance, and sensory needs vary enormously across the spectrum rather than being identical."},

 {type:"sata", stem:"Which of the following correctly pair a theoretical model of behavior with its key figure(s), per this lesson? Select all that apply.",

 {stem:"Per this lesson, what is the key difference between a patient's mood and their affect during a mental status examination?",

 {type:"sata", stem:"Which of the following are accurate elements of structuring the therapeutic environment, per this lesson? Select all that apply.",

"mh-psychosis":[
 {stem:"Per this lesson, what must always be ruled out before new-onset psychosis is attributed to a primary psychiatric illness?",

  answer:1,
  why:"The lesson stresses that psychosis is a symptom, not automatically a psychiatric diagnosis — new-onset psychosis always triggers a medical workup first, since sleep deprivation, substances, infection (especially UTI in older adults), metabolic disturbance, brain injury, or high fever can all cause it."},

 {stem:"A patient experiencing psychosis appears frightened by something only they perceive. According to the guidance in this lesson, what should the nurse avoid doing?",

 {type:"sata", stem:"Which of the following are part of caring for a patient experiencing psychosis, per this lesson? Select all that apply.",
  options:["Recognize command hallucinations as a safety emergency that overrides other priorities","Validate the emotion the delusion produces without validating the psychosis itself","Argue firmly with facts until the delusion resolves","Use a structured activity to distract from internal stimuli","Maintain a positive, nonjudgmental demeanor"],

 {type:"sata", stem:"Which of the following are listed as warning signs of suicidal ideation in this lesson? Select all that apply.",

  options:["Disulfiram should not be started until after 24 hours of alcohol abstinence","Naltrexone is an opiate antagonist that blocks the effects of narcotics and treats both alcohol and heroin addiction","Thiamine supplementation helps prevent Wernicke's encephalopathy","Disulfiram should be started immediately during active intoxication for best effect","Folic acid is part of standard vitamin supplementation with long-term alcohol use"],
  answers:[0,1,2,4],
  why:"Disulfiram must wait until after 24 hours of abstinence (not be started during active intoxication), naltrexone blocks narcotic effects and treats both alcohol and heroin addiction, and thiamine/folic acid supplementation prevents Wernicke's encephalopathy and corrects nutritional deficits."}
],
"mh-opioids":[

  options:["2 hours","30 hours","1 week","1 month"],
  answer:1,
  why:"Symptoms begin 6-12 hours after the last dose for short-acting opioids, or up to 30 hours after the last dose for long-acting opioids."},
 {stem:"Opioid withdrawal symptoms typically peak around what time point?",
  options:["6 hours","24 hours","72 hours","2 weeks"],

  why:"Opioid withdrawal symptoms typically peak around 72 hours after the last dose."},
 {stem:"Which standardized tool is used to track opioid-specific withdrawal symptoms, serving as the opioid counterpart to the CIWA-Ar?",
  options:["CAGE","Clinical Opiate Withdrawal Scale (COWS)","Michigan Alcoholism Screening Test","SCOFF"],
  answer:1,

 {stem:"What is the primary mechanism behind fatal opioid overdose?",

 {type:"sata", stem:"Which effects of opioids on the body are described in this lesson? Select all that apply.",

  why:"The lesson describes heart lining infection, collapsed veins, GI constipation, and increased infection vulnerability from opioid use — chronic use actually increases sensitivity to pain over time, not decreases it."}
],
"mh-benzo-withdrawal":[

  answer:1,
  why:"Abrupt discontinuation carries real medical risk, most seriously seizures, including grand mal seizures."},
 {stem:"Benzodiazepines produce sedation, muscle relaxation, and anticonvulsant effects primarily through which mechanism?",

 {stem:"The standard taper for a patient withdrawing from long-term, high-dose benzodiazepine use typically occurs over what timeframe?",
  options:["2-6 hours","2-6 days","2-6 months","2-6 years"],

 {stem:"Why is flumazenil used with caution in a patient with chronic benzodiazepine dependence?",

 {type:"sata", stem:"Which of the following are listed symptoms of benzodiazepine withdrawal? Select all that apply.",
  options:["Grand mal seizures","Muscle spasms","Anxiety and panic attacks","Improved mood and calm","Insomnia"],
  answers:[0,1,2,4],

],
"mh-substance-treatment":[

 {stem:"What is the key trade-off nurses should anticipate when administering naloxone for opioid overdose?",

  answer:1,
  why:"Naloxone reverses opioid overdose, but pushes the patient into abrupt, immediate withdrawal — an expected trade-off, not a sign anything went wrong."},
 {stem:"Which technique lets the client set their own recovery goals and identify their own strengths and obstacles to change?",
  options:["Motivational interviewing","Flumazenil administration","Restraint use","Naloxone titration"],
  answer:0,
  why:"Motivational interviewing lets the client set goals for their own recovery, identify assets and strengths, and determine obstacles to change."},
 {stem:"A client wants to start naltrexone for alcohol use disorder but is also currently using opioids. What must happen first?",

 {type:"sata", stem:"Which of the following are accurate about naloxone administration per this lesson? Select all that apply.",
  options:["It can be given intranasally, IV, IM, or subcutaneously","It can be repeated every 2-3 minutes as needed","It increases respiratory rate within 1-2 minutes","One dose always fully reverses overdose from potent synthetic opioids like fentanyl","Continued monitoring after reversal is essential because the patient can relapse into respiratory depression"],

"mh-anorexia":[
 {stem:"Anorexia nervosa carries a mortality rate of roughly what percentage, described as the highest of any psychiatric disorder?",
  options:["1-2%","10-20%","50-60%","80-90%"],
  answer:1,
  why:"Anorexia nervosa carries a mortality rate of roughly 10-20%, the highest of any psychiatric disorder, from either starvation-related medical complications or suicide."},
 {stem:"Which subtype of anorexia nervosa involves periodic binge eating followed by self-induced vomiting or purging, occurring alongside significantly low body weight?",
  options:["Restricting type","Binge-eating/purging type","Atypical type","Compulsive type"],
  answer:1,
  why:"The binge-eating/purging type involves periodic large-food episodes followed by self-induced vomiting or purging, occurring alongside the low body weight that defines anorexia."},
 {stem:"Which finding meets a specific numeric hospitalization criterion for anorexia nervosa listed in this lesson?",
  options:["Heart rate of 80 beats/min","Heart rate ≤50 beats/min","BMI of 22","Core body temperature of 98.6°F"],
  answer:1,
  why:"A heart rate ≤50 beats/min is one of the concrete numeric hospitalization thresholds, alongside weight loss ≥15% of expected body weight, BMI <16, systolic BP ≤90 mmHg, and core temperature ≤97°F."},
 {stem:"Aggressive, rapid refeeding after prolonged undernutrition can cause a dangerous shift of fluids and which electrolyte in particular?",
  options:["Sodium","Phosphate","Chloride","Bicarbonate"],
  answer:1,
  why:"Refeeding syndrome involves a dangerous shift of fluids and electrolytes, especially phosphate, as the body suddenly has carbohydrates to metabolize again."},
 {type:"sata", stem:"Which of the following are among the named nursing strategies for refeeding a client with anorexia nervosa? Select all that apply.",
  options:["Person to person — one-on-one supervision during and after meals","Pound by pound — daily weights at the same time, same clothing, same scale","Encourage rapid, unsupervised return to full caloric intake to speed recovery","Defusing fat fears — reassure that temporary edema/bloating is not weight gain","Preservation tactics — recognize behaviors as the client's way of preserving a sense of control"],
  answers:[0,1,3,4],
  why:"Person to person, pound by pound, defusing fat fears, and preservation tactics are named refeeding strategies; refeeding should proceed slowly and gradually under dietitian guidance, not rapidly and unsupervised, to avoid refeeding syndrome."}
],
"mh-bulimia":[
 {stem:"How does body weight typically present in bulimia nervosa, compared to anorexia nervosa?",
  options:["Always significantly below normal, identical to anorexia","Often normal or even above normal, which can make the disorder easier to conceal","Always morbidly obese","Weight is not a relevant assessment finding"],
  answer:1,
  why:"Unlike anorexia, body weight in bulimia is often normal or even above normal, which can make the disorder easier to conceal."},
 {stem:"Calluses or scarring on the knuckles or back of the hand from self-induced vomiting is known as what?",
  options:["Russell's sign","Chvostek's sign","Homans' sign","Trousseau's sign"],
  answer:0,
  why:"Russell's sign refers to calluses or scarring on the knuckles or back of the hand from self-induced vomiting."},
 {stem:"Repeated self-induced vomiting in bulimia most commonly leads to which electrolyte/acid-base disturbance?",
  options:["Hyperkalemia and metabolic acidosis","Hypokalemia and metabolic alkalosis","Hypernatremia and respiratory alkalosis","Hypocalcemia and respiratory acidosis"],
  answer:1,
  why:"Repeated vomiting causes loss of potassium and stomach acid, producing hypokalemia and metabolic alkalosis; laxative overuse instead tends to produce metabolic acidosis."},
 {stem:"Which medication is the only one FDA-approved specifically for treating bulimia nervosa?",
  options:["Olanzapine","Fluoxetine (Prozac)","Lisdexamfetamine","Naltrexone"],
  answer:1,
  why:"Fluoxetine (Prozac) is the medication most associated with treating bulimia nervosa and is the only FDA-approved medication for this indication."},
 {type:"sata", stem:"Which of the following are documented signs/symptoms of bulimia nervosa per this lesson? Select all that apply.",
  options:["Russell's sign — calluses on the knuckles from self-induced vomiting","Parotid gland swelling (\"chipmunk cheeks\")","Dental enamel erosion from repeated stomach acid exposure","Body weight that is always well below normal, as in anorexia","Menstrual irregularities"],
  answers:[0,1,2,4],
  why:"Russell's sign, parotid gland swelling, dental erosion, and menstrual irregularities are all documented findings — body weight in bulimia is often normal or above normal, not always well below normal as in anorexia."}
],
"mh-binge-eating":[

  options:["Anorexia nervosa","Bulimia nervosa","Binge-eating disorder","Avoidant/restrictive food intake disorder"],

 {stem:"Which stimulant medication is FDA-approved specifically for moderate-to-severe binge-eating disorder in adults?",

 {stem:"Per this lesson, what is the correct sequence of treatment priorities for binge-eating disorder?",

  answer:1,
  why:"The first and immediate priority is to interrupt the binge-eating pattern itself; only once that pattern is under control does facilitating weight loss, if appropriate, become the focus."},
 {stem:"Binge-eating disorder is most common in which age group?",
  options:["Ages 12-18","Ages 19-25","Ages 46-55","Ages 70 and older"],

 {type:"sata", stem:"Which complications are associated with binge-eating disorder per this lesson? Select all that apply.",

],
"mh-adhd":[
 {stem:"To meet diagnostic criteria for ADHD, symptoms must be present before what age and occur in how many settings?",
  options:["Before age 5, in only one setting","Before age 12, in two or more settings","Before age 18, in a single setting only","Before age 21, in three or more settings"],
  answer:1,
  why:"Symptoms must be present before age 12 and occur in two or more settings (home, school, with others) to meet diagnostic criteria."},
 {stem:"Twin studies estimate the heritability of ADHD at approximately what percentage?",
  options:["10%","30%","76%","100%"],
  answer:2,
  why:"Twin studies estimate ADHD heritability around 76%, reflecting a strong genetic component."},
 {stem:"Stimulant medications like methylphenidate improve attentiveness and reduce impulsivity in ADHD through which mechanism?",
  options:["Blocking the reuptake of dopamine at the synapse, increasing its availability","Blocking GABA receptors","Increasing serotonin reuptake","Blocking acetylcholine receptors"],
  answer:0,
  why:"Methylphenidate and other stimulants block the re-uptake of dopamine at the synapse, so dopamine accumulates in the synaptic cleft, improving attentiveness and calming impulsive behavior."},
 {stem:"Why are \"drug holidays\" from stimulant medication sometimes recommended for children with ADHD?",
  options:["To increase the risk of addiction","To allow for growth during breaks, since stimulants may cause growth retardation","To prevent all withdrawal symptoms","Because stimulants are only effective every other day"],

 {type:"sata", stem:"Which of the following are accurate about non-stimulant ADHD medications per this lesson? Select all that apply.",
  options:["Guanfacine should never be discontinued abruptly, since stopping suddenly can cause rebound hypertension","Atomoxetine is effective in clients with comorbid anxiety","Bupropion is an antidepressant that may be used in place of stimulants in adults","Guanfacine commonly causes tachycardia and hypertension rather than sedation","Atomoxetine requires monitoring for increased suicidal ideation"],
  answers:[0,1,2,4],

"mh-autism":[
 {stem:"Autism spectrum disorder occurs roughly how many times more frequently in boys than girls?",
  options:["Equally in both sexes","1.5 to 2 times more frequently in boys","4 to 5 times more frequently in boys","10 times more frequently in girls"],
  answer:2,
  why:"ASD occurs roughly four to five times more frequently in boys than girls."},
 {stem:"ASD severity is staged into three levels based primarily on what factor?",
  options:["The client's IQ score alone","The amount of support needed, based on impairment in social communication and repetitive/restrictive behaviors","The age at which the client was diagnosed","Whether the client has a comorbid seizure disorder"],
  answer:1,
  why:"Severity is staged (Level 1, 2, 3) by how much support the person needs, based on the degree of impairment in social communication and the restrictiveness/repetitiveness of behaviors."},
 {stem:"A child develops normally until about age 2, then rapidly loses previously acquired language and social skills. What does this represent?",
  options:["A normal developmental variation requiring no follow-up","A well-documented ASD presentation involving loss of previously acquired skills","Definitive proof of a hearing impairment only","Evidence the child cannot have ASD, since ASD only involves early delay, not regression"],
  answer:1,
  why:"Loss of previously acquired language or social skills — normal development until roughly age 2, then rapid loss — is a well-documented ASD presentation, distinct from a steady early delay."},
 {stem:"Which two antipsychotics are used off-label for irritability in children with autism spectrum disorder, and why are they described as \"controversial\"?",
  options:["Haloperidol and chlorpromazine; because they are first-generation agents","Risperidone and aripiprazole; because they treat a behavioral symptom rather than autism itself and carry the full antipsychotic side-effect burden in children","Fluoxetine and sertraline; because they are not approved for any age group","Lithium and valproate; because they require frequent blood draws"],
  answer:1,
  why:"Risperidone and aripiprazole are used off-label for irritability in ASD and are flagged as controversial because they address a behavioral symptom rather than autism itself, while carrying the full antipsychotic side-effect burden (EPS, NMS, metabolic derangement) in a pediatric population."},
 {type:"sata", stem:"Which of the following are appropriate nursing interventions for a client with autism spectrum disorder per this lesson? Select all that apply.",
  options:["Maintain a regular, predictable daily routine and prepare the client in advance for changes","Use protective measures such as helmets or padding for self-injurious behavior rather than punishment","Punish self-injurious behavior firmly to extinguish it quickly","Use a picture board or visual schedule to help make transitions easier","Only touch the client when they appear receptive, following their cues"],
  answers:[0,1,3,4],
  why:"Maintaining routine, using protective measures instead of punishment, using visual schedules, and touching only when receptive are all recommended — punishment can worsen self-injurious behavior and should be avoided."}
],
"iis-immunity-cells":[
 {stem:"A nursing infant receives protective antibodies through breast milk without producing any of their own. Which type of immunity does this represent?",
  options:["Natural active","Natural passive","Artificial active","Artificial passive"],
  answer:1,
  why:"Antibodies transferred naturally from one person to another (maternal antibodies via breast milk or placenta), without the receiving person's own immune system producing them, define natural passive immunity."},
 {stem:"Which immunoglobulin class is the only one that crosses the placenta, and makes up about 75% of total serum immunoglobulin?",
  options:["IgA","IgM","IgG","IgE"],
  answer:2,
  why:"IgG is the major immunoglobulin in serum and tissue (about 75% of total Ig), activates complement, and is the only class that crosses the placenta."},
 {stem:"Which cell lineage do helper T cells, cytotoxic T cells, B cells, and natural killer cells all descend from?",
  options:["Myeloid line","Lymphoid line","Erythroid line","Megakaryocytic line"],
  answer:1,
  why:"The lymphoid line (branching from the single bone marrow stem cell) produces B cells, T cells (helper, cytotoxic, suppressor/regulatory), and natural killer cells; the myeloid line produces granulocytes and monocytes/macrophages instead."},
 {stem:"An older adult presents with a serious infection but shows little fever and few classic signs of inflammation. What immune concept best explains this?",
  options:["Artificial passive immunity has worn off","Immunosenescence — impaired B- and T-lymphocyte function and blunted classic signs of infection with aging","A normal, expected finding unrelated to the immune system","Excess complement activation"],
  answer:0,
  why:"Immunosenescence brings impaired lymphocyte function, reduced antibody production and phagocytic response, and often blunted or absent classic signs/symptoms of infection and inflammation in older adults."},
 {type:"sata", stem:"Which statements about the complement system are accurate per this lesson? Select all that apply.",
  options:["Complement proteins are made in the liver and circulate in plasma","Complement can be activated through classic, lectin, and alternative pathways","Complement activation always requires prior antibody-antigen binding","Once active, complement increases vessel permeability, attracts phagocytes, and can lyse cells directly","Chronic or inappropriate complement activation is implicated in autoimmune disease and chronic inflammation"],
  answers:[0,1,3,4],
  why:"Complement is liver-made and plasma-circulating, activates via three pathways (classic/antibody-triggered, lectin, or alternative/direct microbial-surface activation — so antibody binding is not always required), and once active increases permeability, attracts phagocytes, lyses cells, and drives chronic inflammation/autoimmunity when inappropriately activated."}
],
"iis-hypersensitivity":[
 {stem:"A client develops a rash 2 days after starting a topical medication, driven by T cells and cytokines rather than antibodies. Which hypersensitivity type is this?",
  options:["Type I","Type II","Type III","Type IV"],
  answer:3,
  why:"Type IV reactions are T-cell-mediated (cytokine-driven, not antibody-driven), with an onset of days to weeks — the mechanism behind a contact rash or Stevens-Johnson syndrome."},
 {stem:"Which class of medications causes the most serious anaphylactic reactions, alongside radiocontrast agents?",
  options:["Antihistamines","Antibiotics","Leukotriene receptor antagonists","Mast cell stabilizers"],
  answer:1,
  why:"Antibiotics and radiocontrast agents cause the most serious anaphylactic reactions; penicillin is the single most common medication trigger overall, though less than 5% of those who report a penicillin allergy have a clinically significant IgE- or T-cell-mediated allergy."},
 {stem:"Before a client undergoes allergy skin testing, which medications must be stopped 48–96 hours beforehand to avoid a false negative?",
  options:["Antihistamines and corticosteroids","Antibiotics and NSAIDs","Insulin and antihypertensives","Immunotherapy injections only"],
  answer:0,
  why:"Antihistamines and corticosteroids (including OTC allergy medications) suppress skin test reactivity and must be stopped 48–96 hours before testing to avoid a false-negative result."},
 {stem:"A client is receiving epinephrine for anaphylaxis and is stabilized in the emergency department. Why is continued observation for several hours afterward important?",
  options:["To watch for a biphasic (rebound) reaction that can occur 4–8 hours after the initial reaction","Because epinephrine has no lasting effect and symptoms will return within minutes","To administer a second full course of immunotherapy","Because antihistamines must be given every hour indefinitely"],
  answer:0,
  why:"A biphasic (\"rebound\") reaction can occur 4–8 hours after the initial anaphylactic reaction, so extended observation is warranted, especially for anyone who ingested the allergen, needed more than one epinephrine dose, had hypotension/pharyngeal edema, or has a history of asthma."},
 {type:"sata", stem:"Which of the following are true about epinephrine administration for anaphylaxis per this lesson? Select all that apply.",
  options:["It is given via the 1:1000 dilution, subcutaneously, into the upper extremity or thigh","It may be followed by a continuous IV infusion in severe cases","Antihistamines and corticosteroids should be substituted for epinephrine when it is unavailable","The solution should not be used if cloudy or containing particles","Older adults and those with hypertension or ischemic heart disease are at higher risk for adverse effects from epinephrine"],
  answers:[0,1,3,4],
  why:"Epinephrine (1:1000, subcutaneous, upper extremity/thigh, possibly followed by IV infusion) is the first-line treatment and should never be replaced by antihistamines/corticosteroids, which are only adjuncts; cloudy/particulate solution should not be used, and older adults or those with cardiac disease carry higher risk of adverse effects from it."}
],
"iis-lupus":[
 {stem:"Which laboratory finding is highly specific to SLE and helps differentiate it from drug-induced lupus?",
  options:["Antinuclear antibody (ANA)","Anti-double-stranded DNA (anti-dsDNA)","Erythrocyte sedimentation rate (ESR)","C-reactive protein (CRP)"],
  answer:1,
  why:"Anti-dsDNA is highly specific to SLE and helps differentiate it from drug-induced lupus; ANA is highly sensitive (positive in >99% of SLE) but not specific, and ESR/CRP are nonspecific markers of inflammation used to track disease activity."},
 {stem:"Which classic drug-induced lupus triggers are named in this lesson?",
  options:["Hydralazine, minocycline, procainamide","Methotrexate, warfarin, insulin","Ibuprofen, acetaminophen, aspirin","Diphenhydramine, pseudoephedrine, montelukast"],
  answer:0,
  why:"Hydralazine, minocycline, and procainamide are the classic medication triggers named for drug-induced lupus, alongside environmental triggers like UV light, cigarette smoke, and viral infections."},
 {stem:"A client with SLE is starting belimumab. What is the key precaution regarding vaccination?",
  options:["No vaccines are ever needed again","Live vaccines are contraindicated for 30 days before starting belimumab","Only the flu vaccine needs to be avoided","Vaccination timing has no relevance to belimumab therapy"],
  answer:1,
  why:"Belimumab binds and inactivates BLyS, and live vaccines are contraindicated for 30 days before starting this medication due to the immunosuppressive effect."},
 {stem:"Why is a bone mineral density test recommended at SLE diagnosis and before starting corticosteroids?",
  options:["Corticosteroids have no effect on bone health","Long-term corticosteroid use raises osteoporosis/fracture risk, so a baseline is needed and repeated every 2 years","It is only needed if the client is over age 65","It replaces the need for calcium and vitamin D supplementation"],
  answer:1,
  why:"Long-term corticosteroid use in SLE raises osteoporosis/fracture risk, so a baseline bone mineral density test is obtained at diagnosis and before starting steroids, then every 2 years, alongside daily calcium/vitamin D and weight-bearing exercise."},
 {type:"sata", stem:"Which of the following are accurate about SLE per this lesson? Select all that apply.",
  options:["SLE occurs 4–12 times more often in females than males","The butterfly rash is universal and occurs in every client with SLE","SLE is an example of a Type III hypersensitivity reaction, with immune complexes depositing in tissue throughout the body","Sjögren's syndrome (decreased tears and saliva) can occur alongside SLE","Smoking cessation is recommended, since smoking worsens kidney function and raises cancer risk in SLE"],
  answers:[0,2,3,4],
  why:"SLE is far more common in females, is a Type III hypersensitivity process (circulating immune complexes depositing in tissue), can co-occur with Sjögren's syndrome, and smoking cessation is a priority teaching point — but the butterfly rash is a strong clue, not a universal finding present in every SLE client."}
],
"iis-oa":[
 {stem:"Which finding on synovial fluid analysis helps differentiate osteoarthritis from rheumatoid arthritis?",
  options:["OA synovial fluid is normal, while RA synovial fluid shows elevated WBC count with decreased viscosity","OA synovial fluid always shows elevated WBC count","Synovial fluid analysis cannot distinguish OA from RA","RA synovial fluid is always normal"],
  answer:0,
  why:"Synovial fluid analysis differentiates the two conditions: OA synovial fluid is normal, while RA synovial fluid shows an elevated WBC count and decreased viscosity from active inflammation."},
 {stem:"Bony outgrowths at the finger joints in osteoarthritis, caused by osteophyte formation, are known as what?",
  options:["Swan neck and boutonnière deformities","Heberden's and Bouchard's nodes","Ulnar drift","Hallux valgus"],
  answer:1,
  why:"Heberden's nodes (distal) and Bouchard's nodes (proximal) are bony outgrowths from osteophyte formation at the finger joints, characteristic of OA — the RA deformities (swan neck, boutonnière, ulnar drift) are a different, autoimmune-driven process."},
 {stem:"How does morning stiffness in OA typically compare to that of RA?",
  options:["OA stiffness lasts less than 30 minutes; RA stiffness lasts more than 30 minutes","OA stiffness lasts more than 30 minutes; RA stiffness lasts less than 30 minutes","Both last exactly the same amount of time","Neither condition involves morning stiffness"],
  answer:0,
  why:"The 30-minute cutoff is a fast bedside discriminator: OA morning stiffness lasts less than 30 minutes, while RA morning stiffness lasts more than 30 minutes."},
 {stem:"After how many intra-articular cortisone injections for OA is further intervention needed if pain and swelling are not relieved?",
  options:["1 injection","2 injections","4 injections","There is no limit on injections"],
  answer:2,
  why:"Cortisone is given as an intra-articular corticosteroid to decrease OA joint inflammation and swelling, and further intervention is needed after 4 injections if pain and swelling are not relieved."},
 {type:"sata", stem:"Which of the following are accurate about osteoarthritis per this lesson? Select all that apply.",
  options:["OA is generally asymmetrical, affecting one side more than the other","OA is a mechanical, degenerative process rather than an autoimmune one","Joint pain in OA is aggravated by activity and alleviated by rest","Ibuprofen is a priority medication, and GI ulceration/bleeding should be monitored","Weight loss has no impact on OA joint stress"],
  answers:[0,1,2,3],
  why:"OA is asymmetrical, degenerative rather than autoimmune, activity-aggravated/rest-relieved in its pain pattern, and ibuprofen (an NSAID) carries GI bleeding risk to monitor — weight loss is specifically taught to reduce stress on the joints, contrary to the last option."}
],
"iis-ra":[
 {stem:"What total score on the ACR/EULAR classification criteria is required to diagnose rheumatoid arthritis?",
  options:["2 or greater","4 or greater","6 or greater","10 or greater"],
  answer:2,
  why:"The ACR/EULAR point-based scoring system requires a total score of 6 or greater, combining points for joint involvement, serology (RF/anti-CCP), acute phase reactants (ESR/CRP), and symptom duration greater than 6 weeks."},
 {stem:"Which antibody is positive in over 80% of clients with RA and is more specific to RA than rheumatoid factor?",
  options:["Anti-double-stranded DNA","Anti-cyclic citrullinated peptide (anti-CCP)","Anti-Smith antibody","Antiphospholipid antibody"],
  answer:1,
  why:"Anti-CCP is positive in over 80% of RA clients; rheumatoid factor is positive in up to 90% but is less specific, since it can also appear in other conditions."},
 {stem:"A client with RA has swelling of the metacarpophalangeal joints causing the fingers to displace toward the little finger. What is this deformity called?",
  options:["Swan neck deformity","Boutonnière deformity","Ulnar drift","Hallux valgus"],
  answer:2,
  why:"Ulnar drift is caused by swelling of the metacarpophalangeal joints (knuckles), displacing the fingers toward the little finger — distinct from swan neck and boutonnière, which involve the finger's middle and end joints."},
 {stem:"Why does treatment for RA start with a DMARD within the first 3 months of diagnosis rather than relying on NSAIDs alone?",
  options:["NSAIDs are more expensive than DMARDs","DMARDs can slow or stop bone loss and joint destruction, while NSAIDs only relieve symptoms without altering disease progression","DMARDs work faster than NSAIDs for pain relief","NSAIDs are contraindicated in all RA clients"],
  answer:1,
  why:"Unlike NSAIDs, which relieve symptoms only, DMARDs can suppress the autoimmune response, alter disease progression, and halt further tissue damage — this is why DMARD therapy (methotrexate is the preferred first agent) starts within the first 3 months of diagnosis."},
 {type:"sata", stem:"Which of the following are accurate about RA per this lesson? Select all that apply.",
  options:["Pannus formation destroys cartilage and erodes bone in chronic RA inflammation","RA joint involvement is typically symmetrical","Before starting biologic DMARD therapy, screening for latent TB and hepatitis B/C is recommended","Up to 40% of RA deaths trace to cardiovascular disease","Opioid analgesics are the preferred first-line choice for chronic RA pain"],
  answers:[0,1,2,3],
  why:"Pannus formation, symmetrical joint involvement, pre-biologic TB/hepatitis screening, and the cardiovascular death burden are all accurate per this lesson — opioids are generally avoided in RA given the risk of continuing need in a chronic disease."}
],
"iis-hiv":[
 {stem:"A client with HIV has a CD4 count of 150 cells/mm³ and no opportunistic illness. Which stage does this correspond to?",
  options:["Stage 1","Stage 2","Stage 3 (AIDS)","This client does not have HIV"],
  answer:2,
  why:"A CD4 count below 200 cells/µL (and CD4% below 14%) meets the criteria for Stage 3 (AIDS), regardless of whether an opportunistic illness has occurred."},
 {stem:"A client is diagnosed with Pneumocystis jirovecii pneumonia (PCP) but has a CD4 count of 550 cells/µL. How is this client classified?",
  options:["Stage 1, since the CD4 count is above 500","Stage 2, based on CD4 percentage alone","Stage 3 (AIDS), because a stage 3-defining opportunistic illness is present regardless of CD4 count","This client cannot be staged without a viral load"],
  answer:2,
  why:"If a stage 3-defining opportunistic illness (such as PCP) has been diagnosed, the client is classified as Stage 3 (AIDS) regardless of CD4 count."},
 {stem:"A health care worker sustains a needlestick from HIV-infected blood. Within what window must PEP be started to be effective?",
  options:["72 hours","7 days","30 days","There is no time window"],
  answer:0,
  why:"PEP must begin within 72 hours of exposure to be effective; starting even one day late substantially reduces its ability to prevent seroconversion, making this a time-sensitive occupational health emergency."},
 {stem:"What does \"undetectable = untransmittable\" mean for a client on ART, and what precaution still applies?",
  options:["The client can stop all precautions entirely, including condom use","A client with a maintained undetectable viral load has effectively no risk of sexually transmitting HIV, but condoms are still recommended since ART doesn't protect against other STIs","This phrase only applies to PrEP, not ART","It means the client no longer needs CD4 monitoring"],
  answer:1,
  why:"A person taking ART as prescribed who achieves and maintains an undetectable viral load has effectively no risk of transmitting HIV through sex, but since ART doesn't protect against other STIs, condom use is still recommended alongside it."},
 {type:"sata", stem:"Which of the following are accurate about HIV/AIDS nursing care per this lesson? Select all that apply.",
  options:["Standard precautions (not special isolation) are sufficient for routine care of a client with HIV/AIDS","Normal CD4 count is 800–1,200 cells/mm³","PrEP combines tenofovir and emtricitabine in a daily pill for an HIV-negative person at ongoing risk","Nonlatex condoms protect against HIV transmission just as well as latex condoms","Donated blood has been tested for HIV antibodies and the p24 antigen since 1999, making transfusion-related transmission now extremely rare"],
  answers:[0,1,2,4],
  why:"Standard precautions suffice for HIV/AIDS care, normal CD4 is 800–1,200 cells/mm³, PrEP is tenofovir+emtricitabine, and blood-supply screening since 1999 has made transfusion transmission extremely rare — but nonlatex condoms do NOT protect against HIV transmission the way latex condoms do, though they do protect against pregnancy for a client with a latex allergy."}
],
"iis-cancer":[
 {stem:"In the TNM staging system, what does the \"N\" component represent?",
  options:["The extent of the primary tumor","Regional lymph node involvement","Distant metastasis","Tumor grade"],
  answer:1,
  why:"In the TNM system, T is the extent of the primary tumor, N is regional lymph node involvement, and M is distant metastasis — these combine into an overall anatomic stage group (I–IV)."},
 {stem:"A patient receiving chemotherapy for lymphoma develops hyperkalemia, hyperphosphatemia, and hyperuricemia shortly after treatment begins. Which oncologic emergency is this?",
  options:["Superior vena cava syndrome","Spinal cord compression","Hypercalcemia","Tumor lysis syndrome"],
  answer:3,
  why:"Tumor lysis syndrome follows rapid cell death from chemo/radiation, especially in leukemia/lymphoma, producing hyperkalemia, hyperphosphatemia (leading to hypocalcemia), and hyperuricemia, with risk of arrhythmias, seizures, and acute kidney injury."},
 {stem:"A patient with lung cancer develops progressive dyspnea, facial and neck edema, and distended neck veins. What is the priority positioning intervention?",
  options:["Keep the patient fully supine at all times","Elevate the head/upper body (semi-Fowler), never fully supine","Position in Trendelenburg","Position side-lying only, with legs elevated"],
  answer:1,
  why:"These findings are consistent with superior vena cava syndrome; the head/upper body should be elevated (semi-Fowler) and the patient never placed fully supine, along with avoiding upper-extremity venipuncture/BP checks."},
 {stem:"What is the key distinction between palliative care and hospice care?",
  options:["Palliative care is only for the dying, while hospice can start at diagnosis","Hospice requires forgoing disease-directed (curative) therapy in favor of comfort-focused care, while palliative care can run alongside curative treatment starting at diagnosis","There is no meaningful difference between the two","Hospice is covered by Medicare Part B only"],
  answer:1,
  why:"Palliative care can start at diagnosis and run alongside curative treatment; hospice is a specific type of palliative care in which the patient has chosen to forgo disease-directed therapy in favor of comfort-focused, end-of-life care, covered under the Medicare Hospice Benefit (Part A)."},
 {type:"sata", stem:"Which of the following distinguish a malignant tumor from a benign tumor per this lesson? Select all that apply.",
  options:["Malignant tumors invade surrounding tissue and lack a well-defined capsule","Malignant tumors can metastasize via blood or lymphatic channels","Benign tumors are usually well-differentiated and resemble the tissue of origin","Benign tumors commonly metastasize to distant organs","Malignant tumors can cause generalized effects such as cachexia and systemic inflammation"],
  answers:[0,1,2,4],
  why:"Malignant tumors invade tissue, lack a capsule, and can metastasize and cause systemic effects like cachexia, while benign tumors are well-differentiated, encapsulated, and — unlike the option claims — do not metastasize."}
],
"iis-meds-antiinflammatory":[

  options:["Biologic DMARDs","NSAIDs","JAK inhibitors","Monoclonal antibodies"],
  answer:1,
  why:"NSAIDs (ibuprofen, aspirin, celecoxib, indomethacin, naproxen, sulindac) inhibit COX enzymes to reduce pain, fever, and inflammation, but unlike DMARDs they don't alter the underlying disease process."},
 {stem:"Which nonbiologic DMARD requires an eye exam every 6–12 months due to a risk of retinopathy?",
  options:["Methotrexate","Hydroxychloroquine","Leflunomide","Sulfasalazine"],

  why:"Hydroxychloroquine, an oral antimalarial DMARD used in both RA and SLE, requires a recurring eye exam every 6–12 months because it can cause retinopathy."},
 {stem:"Which DMARD is teratogenic and should not be given unless pregnancy has been ruled out?",
  options:["Sulfasalazine","Hydroxychloroquine","Leflunomide","Methotrexate is the only teratogenic DMARD"],

 {stem:"Which monoclonal antibody used for SLE requires that live vaccines be avoided for 30 days before starting it?",
  options:["Adalimumab","Anakinra","Belimumab","Rituximab"],
  answer:2,

 {type:"sata", stem:"Which of the following are accurate about the medications on this reference card? Select all that apply.",
  options:["Every DMARD and immunosuppressant on this list shares an increased infection risk from immunosuppression","Second-generation antihistamines (loratadine, cetirizine, fexofenadine) are less sedating because they cross the blood-brain barrier less readily","Screening for latent TB and hepatitis B/C is recommended before starting a biologic DMARD","Pseudoephedrine can be used indefinitely without any rebound risk","Azathioprine, cyclophosphamide, and mycophenolic acid are contraindicated in pregnancy"],

],
"iis-meds-art":[
 {stem:"What is the primary goal of ongoing antiretroviral therapy (ART) for a client with HIV?",
  options:["To cure HIV completely","To suppress viral replication as much as possible, ideally to an undetectable viral load","To eliminate the need for CD4 monitoring","To replace the need for PrEP or PEP entirely"],
  answer:1,
  why:"ART combines multiple antiretroviral drug classes to suppress HIV viral replication, ideally to an undetectable viral load — it does not cure HIV, but allows CD4 recovery and reduces disease progression and transmission risk."},
 {stem:"What is the single most important nursing teaching point regarding ART?",
  options:["Taking it only when symptoms appear","Adherence — inconsistent dosing allows the virus to develop drug resistance","Switching drug classes every month","Doubling doses if a dose is missed"],
  answer:1,
  why:"ART is taken daily and indefinitely, and adherence is the single most important teaching point, since inconsistent dosing allows HIV to develop drug resistance."},
 {stem:"A patient presents to the emergency department after a sexual assault with possible HIV exposure. What is the priority regarding PEP?",
  options:["Schedule it for the next routine outpatient appointment","Start it as soon as possible, since it must begin within 72 hours to be effective","Wait for viral load results before starting anything","PEP is not indicated for sexual assault"],
  answer:1,
  why:"PEP must be started as soon as possible after a specific known or suspected exposure and must begin within 72 hours to be effective — a needlestick or sexual assault is treated as a time-sensitive occupational/emergency priority, not something to schedule later."},
 {stem:"Approximately how long is a typical PEP course?",
  options:["A single dose","About 28 days","6 months","Lifelong, like ART"],
  answer:1,
  why:"PEP is a defined, short course of about 28 days, started within 72 hours of a specific exposure — unlike PrEP or ART, which are taken ongoing/indefinitely."},
 {type:"sata", stem:"Which of the following correctly describe PrEP per this lesson? Select all that apply.",
  options:["It is taken ongoing, before any potential exposure occurs, by an HIV-negative person at ongoing risk","It is intended to prevent infection from taking hold if exposure occurs","It is started within 72 hours of a specific exposure and given for about 28 days","It is proactive rather than reactive","It is the same medication regimen and timing as PEP"],
  answers:[0,1,3],
  why:"PrEP is proactive and ongoing — taken before exposure by an HIV-negative person at risk, to prevent infection from taking hold — while the 72-hour/28-day description and \"same as PEP\" claims describe PEP, a reactive, time-limited regimen, not PrEP."}
],
"iis-meds-oncsupport":[

  answer:1,
  why:"Filgrastim is a granulocyte colony-stimulating factor (G-CSF) that stimulates the bone marrow to produce more neutrophils, given for chemotherapy-induced neutropenia."},
 {stem:"A patient on filgrastim reports new bone pain. What should the nurse understand about this finding?",

  answer:1,
  why:"Bone pain is a common side effect of filgrastim as the bone marrow ramps up production of neutrophils."},
 {stem:"What is the boxed warning associated with epoetin alfa?",
