 {stem:"A neutropenic patient on filgrastim develops a fever of 100.6°F. How should the nurse interpret this finding?",
  options:["As a benign, low-grade finding requiring no action","As a medical emergency, since usual signs of infection/inflammation may be blunted in a neutropenic patient","As an expected side effect of the medication itself","As a sign the filgrastim dose should be increased immediately without provider notification"],
  answer:1,

 {type:"sata", stem:"Which of the following correctly pair a chemotherapy support medication with its target complication? Select all that apply.",
  options:["Filgrastim targets neutropenia and infection risk","Epoetin alfa targets anemia and fatigue","Filgrastim and epoetin alfa are interchangeable substitutes for each other","Epoetin alfa monitoring includes hemoglobin/hematocrit trends, blood pressure, and iron stores","Filgrastim nursing priorities include neutropenic precautions and close temperature monitoring"],
  answers:[0,1,3,4],
  why:"Filgrastim targets neutrophils/infection risk and epoetin alfa targets red blood cells/anemia — they treat two different chemotherapy complications and are never substitutes for each other; epoetin alfa monitoring covers hemoglobin/hematocrit, BP, and iron, while filgrastim care centers on neutropenic precautions and temperature monitoring."}

"mathiv":[
 {stem:"A patient is to receive 1500 mL of Normal Saline over 10 hours via infusion pump. What rate (mL/hr) should the pump be set to?",
  options:["150 mL/hr","100 mL/hr","125 mL/hr","200 mL/hr"],
  answer:0,
  why:"Total Volume ÷ Total Time = mL/hr, so 1500 ÷ 10 = 150 mL/hr."},
 {stem:"An 800 mL bag is infusing at 100 mL/hr. Approximately how long will it take to infuse completely?",
  options:["8 hours","10 hours","80 hours","0.8 hour"],
  answer:0,
  why:"Total Volume ÷ Flow Rate = Time, so 800 ÷ 100 = 8 hours."},
 {stem:"An order is to infuse 1000 mL over 6 hours (360 minutes) using tubing with a drop factor of 10 gtt/mL. What is the drip rate, rounded to the nearest whole drop?",
  options:["28 gtt/min","21 gtt/min","15 gtt/min","10 gtt/min"],
  answer:0,
  why:"(Total Volume × Drop Factor) ÷ Time in minutes = gtt/min: (1000 × 10) ÷ 360 = 10,000 ÷ 360 = 27.78, which rounds to 28 gtt/min."},
 {stem:"A bag contains 300 mg of a drug in 500 mL of D5W. What is the concentration in mcg/mL?",
  options:["600 mcg/mL","300 mcg/mL","1500 mcg/mL","60 mcg/mL"],
  answer:0,
  why:"(Total mg × 1000) ÷ Total mL = concentration: (300 × 1000) ÷ 500 = 300,000 ÷ 500 = 600 mcg/mL."},
 {type:"sata", stem:"Which of the following statements about IV flow-rate calculations from this lesson are correct? Select all that apply.",
  options:["mL/hr is calculated as Total Volume (mL) ÷ Total Time (hr)","Drip rate in gtt/min requires knowing the tubing's drop factor","A general safety guideline for IV push medications, absent other guidance, is roughly 1 mL per minute","Concentration in mcg/mL is found by dividing total mg by total mL, with no unit conversion needed","The two methods for calculating gtt/min will always give different final answers for the same infusion"],
  answers:[0,1,2],
  why:"mL/hr and the 1 mL/min IV push guideline are both directly stated, and drop factor is required for any gtt/min calculation. Concentration requires converting mg to mcg first (×1000) before dividing by mL — skipping that step gives a wrong answer. And the lesson's own worked example shows both gtt/min methods arriving at the same answer (31 gtt/min), not different ones."}
],
"mathcardiac":[
 {stem:"A patient's BP is 140/90. Using the MAP formula, what is this patient's mean arterial pressure?",
  options:["106.7 mmHg","115 mmHg","90 mmHg","140 mmHg"],
  answer:0,
  why:"(Systolic + [2 × Diastolic]) ÷ 3 = MAP: (140 + [2 × 90]) ÷ 3 = (140 + 180) ÷ 3 = 320 ÷ 3 = 106.7 mmHg."},
 {stem:"A patient's MAP is 90 mmHg and ICP is 20 mmHg. What is this patient's cerebral perfusion pressure (CPP)?",
  options:["70 mmHg","110 mmHg","20 mmHg","90 mmHg"],
  answer:0,
  why:"MAP − ICP = CPP, so 90 − 20 = 70 mmHg."},
 {stem:"An order is for a weight-based drip at 3 mcg/kg/min for a 60 kg patient, using a bag concentration of 400 mcg/mL. What rate (mL/hr) should the pump be set to?",
  options:["27 mL/hr","3 mL/hr","60 mL/hr","7.5 mL/hr"],
  answer:0,
  why:"(Desired mcg × kg × 60) ÷ Concentration = mL/hr: (3 × 60 × 60) ÷ 400 = 10,800 ÷ 400 = 27 mL/hr."},
 {stem:"A heparin order is for 15 Units/kg/hr for a 70 kg patient, using a concentration of 50 Units/mL. What rate (mL/hr) should the pump be set to?",
  options:["21 mL/hr","15 mL/hr","50 mL/hr","70 mL/hr"],
  answer:0,
  why:"(Units × kg) ÷ Concentration = mL/hr: (15 × 70) ÷ 50 = 1050 ÷ 50 = 21 mL/hr."},
 {type:"sata", stem:"Which of the following statements from this lesson are accurate? Select all that apply.",
  options:["A MAP of at least approximately 65 mmHg is generally needed to maintain adequate organ perfusion","CPP is calculated by adding ICP to MAP","A CPP that drops below roughly 60 mmHg risks cerebral ischemia","Weight-based and units-based infusions are both considered high-alert medications requiring an infusion pump","MAP is weighted more toward systolic pressure because the heart spends more time in systole"],
  answers:[0,2,3],
  why:"A MAP of roughly 65+ mmHg and a CPP floor of roughly 60 mmHg are both stated thresholds, and both drip types are named as high-alert, pump-only medications. CPP is MAP minus ICP, not plus; and MAP is weighted toward diastole (not systole), since the heart spends more time in diastole."}
],
"mathfluid":[

 {stem:"A patient consumes 300 mL of ice chips. How much should be recorded as intake?",

 {stem:"Using the 0.5 mL/kg/hr estimate, what is the approximate hourly insensible fluid loss for a 60 kg patient?",

 {stem:"A patient's weight rises by 3 kg over three days, with no change in diet suggesting real tissue gain. Using the fluid weight rule of thumb, approximately how much fluid does this represent?",

 {type:"sata", stem:"Which of the following statements from this lesson are accurate? Select all that apply.",

"mathbody":[
 {stem:"A patient weighs 60 kg and is 1.6 m tall. Using the metric BMI formula, what is this patient's BMI (rounded to the nearest tenth)?",
  options:["23.4","24.0","22.9","25.6"],
  answer:0,
  why:"Weight (kg) ÷ [Height (m)]²: 1.6 × 1.6 = 2.56; 60 ÷ 2.56 = 23.4."},
 {stem:"A patient weighs 180 lbs and is 72 inches tall. Using the imperial BMI formula, what is this patient's BMI (rounded to the nearest tenth)?",
  options:["24.4","22.9","26.0","20.4"],
  answer:0,
  why:"[Weight (lbs) × 703] ÷ [Height (in)]²: 180 × 703 = 126,540; 72 × 72 = 5184; 126,540 ÷ 5184 ≈ 24.4."},
 {stem:"A patient is 150 cm tall and weighs 50 kg. Using the BSA formula, what is this patient's approximate BSA (rounded to the nearest hundredth)?",

  answer:0,

 {stem:"A pediatric chemo order is 3 mg/m². The patient weighs 44 lb and is 106 cm tall, and the drug is supplied as 1 mg/mL. Following the same step-by-step process as the lesson's worked example, approximately how many mL should be given?",

 {type:"sata", stem:"Which of the following statements from this lesson are accurate? Select all that apply.",
  options:["A BMI under 17 is a diagnostic marker used for anorexia nervosa","A BMI under 15 is considered extreme/life-threatening in anorexia nervosa","BSA is used for chemotherapy dosing because it scales more precisely to a patient's size than weight alone","The metric and imperial BMI formulas will give meaningfully different results for the same patient","BSA is expressed in kilograms, not square meters"],

function shuffleExam(bank){
  const caseBlock = bank.filter(q=>q.caseId);
  const others = bank.filter(q=>!q.caseId).slice();
  for(let i=others.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [others[i],others[j]] = [others[j],others[i]];
  }
  const insertAt = Math.floor(Math.random()*(others.length+1));
  return others.slice(0,insertAt).concat(caseBlock, others.slice(insertAt));
}

  const c = CASES[caseId];
  let h = '<div class="case-box"><div class="case-title">'+c.title+'</div><div class="case-tabs">';

    h += '<button class="case-tab'+(S.activeTab===i?" active":"")+'" data-tab="'+i+'">'+t.label+"</button>";

  c.tabs[S.activeTab].blocks.forEach(b => h += blk(b));

function anyQHTML(q, label){
  if(q.type === "sata") return sataHTML(q);
  if(q.type === "fitb") return fitbHTML(q);
  if(q.type === "gtpal") return gtpalHTML(q);
  if(q.type === "cloze") return clozeHTML(q);
  if(q.type === "hotspot") return hotspotHTML(q);
  if(q.type === "dragdrop") return dragdropHTML(q);
  if(q.type === "ordering") return orderingHTML(q);
  if(q.type === "matrix") return matrixHTML(q);
  if(q.type === "bowtie") return bowtieHTML(q);
  return qHTML(q, label);
}

function result(){
  const bank = curBank();
  const A = ["A","B","C","D","E","F"];
  let h = '<p class="count">'+L[S.id].title+'</p><p class="big">'+fmtScore(S.score)+"/"+bank.length+"</p>";
  if(S.wrong.length){
    h += '<div class="rev"><p>Review these:</p>';
    S.wrong.forEach(i=>{ const q = bank[i];
      let correctText;
      if(q.type === "sata") correctText = q.answers.map(idx=>A[idx]+". "+q.options[idx]).join("; ");
      else if(q.type === "fitb") correctText = String(q.answer);
      else if(q.type === "cloze") correctText = q.blanks.map(b=>b.options[b.correct]).join(" · ");
      else if(q.type === "gtpal") correctText = ["G","T","P","A","L"].map((l,idx)=>l+q.answers[idx]).join(" ");
      else if(q.type === "hotspot") correctText = "See the outlined region in the lesson/question image.";
      else if(q.type === "dragdrop") correctText = q.items.map((it,idx)=>it+" → "+q.bins[q.correctBin[idx]]).join("; ");
      else if(q.type === "ordering") correctText = q.items.join(" → ");
      else if(q.type === "matrix") correctText = q.rows.map((r,idx)=>r+" → "+q.cols[q.correct[idx]]).join("; ");
      else if(q.type === "bowtie") correctText = "Actions: "+q.correctActions.map(idx=>q.actionOptions[idx]).join(", ")+" · Condition: "+q.conditionOptions[q.correctCondition]+" · Parameters: "+q.correctParams.map(idx=>q.paramOptions[idx]).join(", ");
      else correctText = q.options[q.answer];
      h += "<h5>"+q.stem+"</h5><p><strong>"+correctText+"</strong></p><p>"+q.why+"</p>";
      if(q.ref && L[q.ref]) h += '<a class="reviewlink" href="#'+q.ref+'" target="_blank" rel="noopener">Review in: '+L[q.ref].title+" ↗</a>";
    });
    h += "</div>";
  } else h += "<p>All correct.</p>";
  h += '<div class="acts"><button data-q="'+S.id+'">Retake</button><button data-l="'+S.id+'">Reread the lesson</button><button data-home="1">All topics</button></div>';
  return h;
}

function draw(){
  back.hidden = S.view === "home";
  app.innerHTML = S.view==="home"?home():S.view==="lesson"?lesson():S.view==="quiz"?quiz():result();
}

app.addEventListener("change", e=>{
  const sel = e.target.closest("select[data-cloze-blank]");
  if(sel && !S.submitted){
    S.clozeSel[+sel.dataset.clozeBlank] = sel.value===""?undefined:+sel.value;
    return draw();
  }
});

app.addEventListener("click", e=>{
  const q0 = e.target.closest("[data-q]");
  if(q0){
    e.stopPropagation();
    const shuffled = q0.dataset.q === "examone" ? shuffleExam(QUIZ[q0.dataset.q]) : null;
    nav("quiz",{id:q0.dataset.q, i:0, score:0, wrong:[], shuffledBank:shuffled});
    return;
  }
  const hw = e.target.closest(".hotspot-wrap");
  if(hw && !S.submitted && S.view==="quiz" && curBank() && curBank()[S.i] && curBank()[S.i].type==="hotspot"){
    const rect = hw.getBoundingClientRect();
    const x = Math.max(0,Math.min(100, ((e.clientX-rect.left)/rect.width)*100));
    const y = Math.max(0,Math.min(100, ((e.clientY-rect.top)/rect.height)*100));
    S.clickPoint = {x,y};
    return draw();
  }
  const mr = e.target.closest("input[type=radio][data-matrix-row]");
  if(mr && !S.submitted){
    S.matrixSel[+mr.dataset.matrixRow] = +mr.dataset.matrixCol;
    return draw();
  }
  const t = e.target.closest("button");
  if(t && t.dataset.grouptoggle){ S.openGroups[t.dataset.grouptoggle] = !S.openGroups[t.dataset.grouptoggle]; return draw(); }
  if(!t){
    const ddBinEl = e.target.closest(".dd-bin");
    if(ddBinEl && !S.submitted && S.ddSel !== null){
      S.ddPlace[S.ddSel] = +ddBinEl.dataset.ddBin;
      S.ddSel = null;
      return draw();
    }
    return;
  }
  if(t.dataset.l) return nav("lesson",{id:t.dataset.l});
  if(t.dataset.home) return nav("home");
  if(t.dataset.tab !== undefined){
    S.activeTab = +t.dataset.tab;
    return draw();
  }
  if(t.dataset.t !== undefined){
    if(S.submitted) return;
    const idx = +t.dataset.t, pos = S.multi.indexOf(idx);
    if(pos === -1) S.multi.push(idx); else S.multi.splice(pos,1);
    return draw();
  }
  if(t.dataset.submit !== undefined){
    S.submitted = true;
    const q = curBank()[S.i];
    const ok = S.multi.slice().sort((a,b)=>a-b).join(",") === q.answers.slice().sort((a,b)=>a-b).join(",");
    if(S.view === "quiz"){ if(ok) S.score++; else S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.submitFitb !== undefined){
    const inputEl = document.getElementById("fitbInput");
    const val = inputEl ? inputEl.value.trim() : "";
    S.textAnswer = val;
    const q = curBank()[S.i];
    const userNum = parseFloat(val);
    const target = parseFloat(q.answer);
    const ok = !isNaN(userNum) && Math.abs(userNum - target) < 0.05;
    S.fitbCorrect = ok;
    S.submitted = true;
    if(S.view === "quiz"){ if(ok) S.score++; else S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.submitGtpal !== undefined){
    const q = curBank()[S.i];
    const vals = [0,1,2,3,4].map(i=>{
      const el = document.getElementById("gtpalInput"+i);
      return el ? el.value.trim() : "";
    });
    S.gtpalVals = vals;
    const ok = vals.every((v,i)=> parseInt(v) === q.answers[i]);
    S.submitted = true;
    if(S.view === "quiz"){ if(ok) S.score++; else S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.submitCloze !== undefined){
    const q = curBank()[S.i];
    const correctCount = q.blanks.filter((b,i)=>S.clozeSel[i]===b.correct).length;
    const pts = Math.round((correctCount/q.blanks.length)*100)/100;
    S.submitted = true;
    S.lastPoints = pts;
    if(S.view === "quiz"){ S.score += pts; if(pts < 1) S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.submitHotspot !== undefined){
    const q = curBank()[S.i];
    const pt = S.clickPoint, r = q.region;
    const ok = !!pt && pt.x>=r.x && pt.x<=r.x+r.w && pt.y>=r.y && pt.y<=r.y+r.h;
    const pts = ok ? 1 : 0;
    S.hotspotCorrect = ok;
    S.submitted = true;
    S.lastPoints = pts;
    if(S.view === "quiz"){ S.score += pts; if(pts < 1) S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.ddPick !== undefined){
    S.ddSel = S.ddSel === +t.dataset.ddPick ? null : +t.dataset.ddPick;
    return draw();
  }
  if(t.dataset.ddUnplace !== undefined){
    if(S.submitted) return;
    delete S.ddPlace[+t.dataset.ddUnplace];
    return draw();
  }
  if(t.dataset.submitDd !== undefined){
    const q = curBank()[S.i];
    const correctCount = q.items.filter((_,idx)=>S.ddPlace[idx]===q.correctBin[idx]).length;
    const pts = Math.round((correctCount/q.items.length)*100)/100;
    S.submitted = true;
    S.lastPoints = pts;
    if(S.view === "quiz"){ S.score += pts; if(pts < 1) S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.orderUp !== undefined){
    const pos = +t.dataset.orderUp;
    if(pos>0){ [S.orderArr[pos-1],S.orderArr[pos]] = [S.orderArr[pos],S.orderArr[pos-1]]; }
    return draw();
  }
  if(t.dataset.orderDown !== undefined){
    const pos = +t.dataset.orderDown;
    if(pos<S.orderArr.length-1){ [S.orderArr[pos+1],S.orderArr[pos]] = [S.orderArr[pos],S.orderArr[pos+1]]; }
    return draw();
  }
  if(t.dataset.submitOrder !== undefined){
    const correctCount = S.orderArr.filter((itemIdx,pos)=>itemIdx===pos).length;
    const pts = Math.round((correctCount/S.orderArr.length)*100)/100;
    S.submitted = true;
    S.lastPoints = pts;
    if(S.view === "quiz"){ S.score += pts; if(pts < 1) S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.submitMatrix !== undefined){
    const q = curBank()[S.i];
    const correctCount = q.rows.filter((_,rIdx)=>S.matrixSel[rIdx]===q.correct[rIdx]).length;
    const pts = Math.round((correctCount/q.rows.length)*100)/100;
    S.submitted = true;
    S.lastPoints = pts;
    if(S.view === "quiz"){ S.score += pts; if(pts < 1) S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.btAction !== undefined){
    if(S.submitted) return;
    const q = curBank()[S.i];
    const idx = +t.dataset.btAction, pos = S.bowtie.actions.indexOf(idx);
    if(pos===-1){ if(S.bowtie.actions.length < q.correctActions.length) S.bowtie.actions.push(idx); }
    else S.bowtie.actions.splice(pos,1);
    return draw();
  }
  if(t.dataset.btCondition !== undefined){
    if(S.submitted) return;
    S.bowtie.condition = +t.dataset.btCondition;
    return draw();
  }
  if(t.dataset.btParam !== undefined){
    if(S.submitted) return;
    const q = curBank()[S.i];
    const idx = +t.dataset.btParam, pos = S.bowtie.params.indexOf(idx);
    if(pos===-1){ if(S.bowtie.params.length < q.correctParams.length) S.bowtie.params.push(idx); }
    else S.bowtie.params.splice(pos,1);
    return draw();
  }
  if(t.dataset.submitBowtie !== undefined){
    const q = curBank()[S.i];
    const totalSlots = 1 + q.correctActions.length + q.correctParams.length;
    const conditionPts = S.bowtie.condition===q.correctCondition ? 1 : 0;
    const actionsPts = S.bowtie.actions.filter(a=>q.correctActions.includes(a)).length;
    const paramsPts = S.bowtie.params.filter(a=>q.correctParams.includes(a)).length;
    const pts = Math.round(((conditionPts+actionsPts+paramsPts)/totalSlots)*100)/100;
    S.submitted = true;
    S.lastPoints = pts;
    if(S.view === "quiz"){ S.score += pts; if(pts < 1) S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.p !== undefined){
    if(S.submitted) return;
    S.pick = +t.dataset.p;
    return draw();
  }
  if(t.dataset.submitMc !== undefined){
    if(S.pick === null) return;
    S.submitted = true;
    if(S.view === "quiz"){
      if(S.pick === curBank()[S.i].answer) S.score++; else S.wrong.push(S.i);
    }
    return draw();
  }
  if(t.dataset.next){
    const bank = curBank();
    if(S.i < bank.length-1){
      S.i++; S.pick = null; S.multi = []; S.submitted = false; S.textAnswer = ""; S.fitbCorrect = false; S.activeTab = 0;
      S.clickPoint = null; S.hotspotCorrect = false; S.ddSel = null; S.ddPlace = {}; S.orderArr = null; S.matrixSel = {};
      S.bowtie = {condition:null, actions:[], params:[]}; S.lastPoints = 0; S.clozeSel = {}; S.gtpalVals = ["","","","",""];
      return draw();
    }
    const b = S.best[S.id];
    if(b === undefined || S.score > b) S.best[S.id] = S.score;
    return nav("result");
  }
});

const initialHash = location.hash.slice(1);
if(initialHash && L[initialHash]){
  nav("lesson", {id: initialHash});
} else {
  draw();
}

</script>
</body>
</html>
