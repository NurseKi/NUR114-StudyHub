     ["Affective symptoms","Mood labile or incongruent with circumstances; flat or blunted affect, inappropriate or bizarre affect"]]}},
   {p:"\"Positive\" and \"negative\" here don't mean good and bad — they describe whether the symptom adds an abnormal experience (positive) or removes a normal one (negative). Negative, cognitive, and affective symptoms are the most difficult to treat, and may not respond to medication — this matters clinically because antipsychotic medications are generally far more effective against positive symptoms, which is why a well-medicated patient can still struggle significantly with motivation and social withdrawal even once hallucinations are controlled. Symptoms affect social functioning, relationships, quality of life, and the ability to perform ADLs and instrumental activities of daily living (IADLs)."},
   {h:"Speech and thought vocabulary — the exam-favorite word list"},
   {table:{head:["Term","Meaning"],rows:[
     ["Clang association","Rhyming or sound-alike words strung together with no logical connection (\"It's the rain, train, pain\")"],
     ["Flight of ideas","Rapid, continuous flow of speech that jumps from topic to topic, with some thread of connection that's hard to follow — classically a manic-state finding as well"],
     ["Word salad (schizophasia)","Illogical, random word groupings with no discernible meaning"],
     ["Neologisms","Made-up words that have meaning only to the client"],
     ["Loose associations","Haphazard, illogical shifting from one topic to another with no logical connection between them"],
     ["Echolalia","Pathological, parrot-like repetition of another person's words or phrases"],
     ["Echopraxia","Pathological repetition/mimicking of another person's movements"],
     ["Thought blocking","Sudden interruption/cessation of a thought mid-sentence, followed by an unrelated new thought"],
     ["Circumstantiality","Getting caught up in excessive, unnecessary detail before finally getting to the point"],
     ["Tangentiality","Wandering off in a new direction before ever reaching or completing the original point"],
     ["Confabulation","Filling a memory gap with a fabricated but believed-true detail, to preserve self-esteem — classically seen in Korsakoff psychosis"],
     ["Perseveration","Persistent repetition of the same word or idea in response to different questions"],
     ["Mutism","Absence of verbal speech altogether"],
     ["Pressured speech","Speech that feels forced out rapidly, as if the words can't come fast enough"],
     ["Religiosity","Excessive, often disorganized preoccupation with religious ideas"],
     ["Verbigeration","Purposeless, stereotyped repetition of words or phrases"],
     ["Magical thinking","Belief that one's own thoughts or wishes can control other people or outside events"],
     ["Waxy flexibility","A limb or the body stays in whatever position it's placed, as if made of wax"],
     ["Anosognosia","The client lacks awareness or insight that they are ill at all — distinct from simple denial"],
     ["Anhedonia","Loss of interest or pleasure in activities that were previously enjoyable — a core negative symptom"],
     ["Avolition","Lack of motivation or drive to initiate and follow through on goal-directed activity — a core negative symptom"],
     ["Alogia","Poverty of speech — reduced speech output or content, speaking little even when prompted"],
     ["Apathy","Lack of feeling, emotion, interest, or concern"],
     ["Asociality","Lack of interest in, or withdrawal from, social relationships and interaction"],
     ["Catatonia","Marked psychomotor disturbance — ranges from stupor/immobility to excessive, purposeless motor activity"],
     ["Posturing","Voluntarily assuming and holding an inappropriate or bizarre body position for an extended time"],
     ["Incoherence","Speech that is disorganized and largely incomprehensible, lacking a logical connection between words or phrases"],
     ["Thought broadcasting","A Schneiderian first-rank delusion: the belief that one's own thoughts are audible to others or are being transmitted/broadcast outward, distinct from thought withdrawal or thought insertion"]]}},
   {h:"Priority assessments/cues"},
   {p:"Client history helps determine progression of symptoms: frequency and severity of psychotic episodes, current medications and level of compliance, suicidal ideation and previous attempts, comorbid illnesses including physical illnesses, substance use, anxiety, and depression, and learning and support needs."},
   {h:"Priority laboratory tests/diagnostic cues"},
   {list:["Complete blood count (CBC) — neutropenia","Metabolic panel — physical conditions","Serum alcohol levels and drug toxicology screens"]},
   {h:"Priority interventions/collaborative actions"},
   {list:[
    "General management includes medications with therapy (individual, group, family, behavioral, assertive community) to enhance social skills and self-care; acute phase focuses on client safety until medications manage signs and symptoms; stabilized phase focuses on client/family education needs and ensuring effectiveness of medications; maintenance phase focuses on adherence to medications and preventing relapse",
    "<strong>Interventions for self-directed violence</strong> — frequent, irregularly timed observations, suicide precautions, one-on-one supervision, no harmful objects in environment, investigate for suicidal ideations or plans, develop a no-suicide contract if appropriate",
    "<strong>Interventions for other-directed violence</strong> — low stimulus environment, promote communication, increased supervision, de-escalation, distraction, use seclusion and restraints only as a last resort",
    "<strong>Interventions for hallucinations</strong> — assess content, but do not reinforce perceptions (state inability to see, hear, or sense what the client is experiencing, use words such as \"the voices\" to differentiate them from reality), avoid touch, focus on client emotions or needs, distract/engage in activities, promote reality testing by providing evidence to discredit hallucinations, discuss association between stress and hallucinations, teach clients to use voice dismissal (verbally counter hallucinations)",
    "<strong>Interventions for delusions</strong> — assess content, promote trusting relationships with consistent caregivers, avoid touch, avoid whispering or laughing around the client (may suspect it is about them), orient to surroundings, promote reality testing but do not argue, focus on underlying needs, provide packaged or home foods if the client is suspicious of agency foods (client may also suspect foods from home)",
    "<strong>Interventions for relationships</strong> — encourage hygiene, promote self-care, develop a toileting schedule, encourage independence and decision-making as appropriate"]},
   {h:"Worked example: therapeutic responses to hallucinations and delusions"},
   {p:"The general rule — validate the feeling, never the content — becomes easier to apply with concrete phrasing. In each case, the nurse acknowledges that the sensation or belief is real <em>to the client</em>, states their own perception honestly without arguing, and keeps the client's safety and trust intact:"},
   {list:[
    "Client: \"The voices tell me you are trying to kill me.\" Nurse: \"I know the voices are telling you that, but I do not believe that, and I have your best interest in mind — I am trying to keep you safe.\"",
    "Client: \"I believe I am being poisoned.\" Nurse: \"You are not being poisoned, although I know that belief feels very real to you.\" (A concrete follow-up intervention: offer food in sealed, unopened containers the client can open themselves, so they can see for themselves that it hasn't been tampered with.)",
    "Client: \"I have bugs crawling all over my body.\" Nurse: \"I'm standing right here, and I don't see any bugs on your body, although I know you feel them. Let's go to the day room for a while.\" — pairing a calm reality statement with a distraction/redirection",
    "Client: \"I smell a fire, I know you said there isn't one, but I smell it.\" Nurse: \"We've checked — the fire alarms and sprinklers aren't going off, and I don't smell a fire, although I know that sensation is real to you.\"",
    "Client: \"I stopped taking my medications because they're poison.\" Nurse: \"The medications are actually meant to help you feel better, although I understand that belief feels real to you right now.\""]},
   {hook:"Two response patterns to avoid: don't argue or try to logically disprove the hallucination/delusion, and don't pretend to see or hear what the client describes just to smooth over the conversation — both damage trust. Also avoid questions that could reinforce the belief that the voices are an external, independent presence (for example, asking a client whether the voice \"sounds like\" a specific deceased relative feeds the idea that the voice is a real outside entity rather than a symptom)."},
   {h:"Medication administration specifics"},
   {list:[
    "Confirm the medication is actually swallowed and not being \"cheeked\" (held in the cheek to spit out later) — a common way a nonadherent or suspicious client appears to be taking medication without actually doing so",
    "Obtain a baseline white blood cell count and a baseline blood pressure before starting clozapine specifically, in addition to the ongoing neutropenia/myocarditis monitoring already covered above"]},
   {h:"Physical and mental status findings on assessment"},
   {p:"Beyond the symptom clusters above, a few specific findings show up on exam and history: decreased emotional expression or social awkwardness, unusually long pauses before answering questions, right-left confusion, and an inability to identify objects by touch or numbers traced on the skin. A disturbed wake-sleep cycle and declining academic, social, and interpersonal functioning are also common findings in the history leading up to diagnosis."},
   {h:"Priority actual & potential complications"},
   {list:["Total social withdrawal and lack of participation in society","Depression, anxiety, suicidal ideation, substance use disorder","Side effects of medications — metabolic disorders, neurological damage","Frequent relapses associated with poor outcomes, leading to longer hospitalizations, higher costs, and greater disruptions to family and personal life"]},
   {h:"Priority hypotheses for nursing care"},
   {list:[
    "Be vigilant for clients who may be at risk for self- or other-directed harm",
    "Evaluate and treat for extrapyramidal symptoms — treatment may include changing the psychotropic medication, reducing the dose, or adding an anticholinergic agent",
    "Ensure a holistic, family approach to prevent caregiver role strain, abuse, neglect, and abandonment"]},
   {h:"Priority medications"},
   {list:[
    "<strong>Chlorpromazine</strong> — oral typical antipsychotic; risk for extrapyramidal symptoms (acute dystonic reaction, akathisia, pseudoparkinsonism, tardive dyskinesia), sedation, gynecomastia, metabolic syndrome, neuroleptic malignant syndrome",
    "<strong>Risperidone</strong> — oral atypical antipsychotic; encourage water or hard candy for dry mouth, may cause nausea and vomiting; risk for metabolic side effects, seizures, sexual dysfunction",
    "<strong>Clozapine</strong> — oral atypical antipsychotic; monitor for neutropenia and myocarditis; risk for metabolic side effects, sedation, orthostatic hypotension, anticholinergic toxicity",
    "<strong>Benztropine/diphenhydramine</strong> — oral anticholinergics to decrease extrapyramidal symptoms (EPS); increased anticholinergic effects: sedation, dry mouth, constipation, urinary retention, orthostatic hypotension"]},
   {h:"Priority teaching/discharge needs"},
   {list:[
    "Schizophrenia is chronic — importance of compliance with medications and therapy to reduce relapses and prolong functionality",
    "Smoking increases metabolism of antipsychotic drugs — refrain from smoking or adjust dosage accordingly",
    "Caution with activities, operating equipment, or work tasks due to orthostatic hypotension and sedation",
    "Maintain stable weight, sleep schedule, and stress-reduction activities",
    "Photosensitivity — importance of sunscreen",
    "Managing hallucinations and delusions by reducing stress and stimulation, using activities or other stimuli to distract or compete with sensory experiences, reality testing techniques, talking with a trusted friend or family member",
    "Support groups and reliable sources of education and support for both client and family",
    "Residential support options as recovery needs change: brief respite/crisis homes (24-hour clinical staff for acute stabilization), transitional group homes (structured daily living-skills training), foster/boarding homes and supported apartments (longer-term recovery and maintenance), and family or independent living for higher-functioning patients — matching the setting to the current phase of illness is itself a nursing judgment"]}
  ],
  check:{stem:"A client has experienced auditory hallucinations and disorganized speech continuously for the past seven months. Based on the diagnostic criteria, this presentation is most consistent with which condition?",
   options:["A brief psychotic episode","Schizophrenia","Normal grief reaction","Delirium"],
   answer:1,
   why:"Two or more characteristic symptoms (hallucinations and disorganized speech, both among the first three required symptoms) persisting for more than six months meets the diagnostic pattern for schizophrenia rather than a brief psychotic episode, which by definition resolves within one month."}
},
{ id:"mh-antipsychotics-overview", title:"Antipsychotics & Neuroleptic Malignant Syndrome", kicker:"Typical vs. atypical, and the emergency you can't miss",
  blocks:[
   {p:"Antipsychotic medications fall into two broad categories that differ in both their symptom coverage and their side effect profile."},
   {h:"Typical (conventional/first-generation) antipsychotics"},
   {p:"Typical antipsychotics work by blocking postsynaptic dopamine receptors and are effective primarily against positive symptoms (the \"+\" in the source material). Because of their side-effect burden, they've generally been replaced by atypicals as first-line therapy over the past decade, though a patient already stable and tolerating one may be kept on it. Their signature adverse effect is <strong>extrapyramidal symptoms (EPS)</strong> — caused by dopamine blockade in motor pathways rather than just the limbic system:"},
   {list:[
    "<strong>Dystonia</strong> — prolonged, repetitive muscle contractions causing twisting or jerking movements, especially of the face, tongue, neck, and back, including abnormal/involuntary upward eye deviation and laryngeal spasm that can cause respiratory distress; occurs in about 5% of clients within days of starting a typical antipsychotic — the earliest-appearing EPS",
    "<strong>Parkinsonism (drug-induced)</strong> — bradykinesia, muscle rigidity, shuffling gait, stooped posture, flat/masked facies, tremors, and drooling; may emerge anywhere from 1 week to several months after starting the drug",
    "<strong>Akathisia</strong> — subjective restlessness, an inability to sit or stand still, and pacing/rocking; occurs in about 20% of clients taking typical antipsychotics, also early in the course of treatment"]},
   {p:"EPS is treated with <strong>benztropine</strong> or <strong>diphenhydramine</strong>, both anticholinergic medications that counteract the movement side effects. High-potency typicals (haloperidol) carry the highest EPS risk; low-potency agents (chlorpromazine, thioridazine) are more sedating/anticholinergic and more likely to cause orthostatic hypotension, but carry less EPS risk. <strong>Examples:</strong> chlorpromazine, fluphenazine, haloperidol (Haldol), loxapine, molindone, perphenazine, pimozide, thioridazine, thiothixene, trifluoperazine."},
   {h:"Tardive dyskinesia"},
   {p:"A distinct, delayed-onset movement disorder from long-term antipsychotic use (typical or atypical): repetitive, involuntary, purposeless movements — grimacing, rapid eye blinking, tongue protrusion/rolling/smacking, lip puckering/sucking/chewing motions, and rapid movements of the hands, arms, legs, and trunk. It develops later in treatment than the other EPS types — in roughly 20–30% of clients who've taken typical antipsychotics for more than a year — and tends to be more severe in older adults and more prevalent among clients who smoke (smoking speeds metabolism of the medication). Symptoms may resolve or may become permanent even after the drug is stopped, which is why early recognition matters."},
   {p:"Management options beyond switching agents or lowering the dose include adding a benzodiazepine (helps akathisia, dystonia, and TD), a beta blocker (akathisia and TD), or a calcium channel blocker (TD); emerging options studied for TD specifically include vitamin E, clozapine, tetrabenazine (also used in Huntington disease), and amantadine."},
   {h:"Atypical (second-generation) antipsychotics"},
   {p:"Atypical antipsychotics cover both positive and negative symptoms (the \"+/-\") by combining dopamine blockade with increased serotonin activity, and as a class produce far fewer EPS/motor side effects and little to no prolactin elevation. Many atypical antipsychotic generic names end in \"-pine\" or \"-done,\" a pattern that's useful for quickly recognizing the drug class on an exam or a medication list. <strong>Examples:</strong> aripiprazole (Abilify), asenapine (Saphris), brexpiprazole (Rexulti), cariprazine (Vraylar), clozapine (Clozaril), iloperidone (Fanapt), lurasidone (Latuda), olanzapine (Zyprexa), paliperidone (Invega), quetiapine (Seroquel), risperidone (Risperdal), ziprasidone (Geodon)."},
   {p:"One atypical agent deserves a specific safety flag: <strong>clozapine</strong> can cause agranulocytosis — a dangerous drop in white blood cells (and neutrophils specifically) — which is why patients on clozapine require regular WBC/ANC monitoring throughout treatment; caught early, it's usually reversible. Clozapine also carries rare risk of cardiomyopathy and myocarditis, and should be used with extreme caution in older adults with dementia-related psychosis due to cardiovascular risk. Across the atypical class as a whole, the tradeoff for fewer motor side effects is <strong>metabolic syndrome</strong> — dyslipidemia, weight gain/obesity, hypertension, and hyperglycemia/new-onset diabetes — so baseline and ongoing metabolic monitoring (weight, glucose, lipids) is standard of care."},
   {h:"Long-acting injectable (depot) antipsychotics"},
   {p:"Several antipsychotics are available as long-acting injectable (LAI/depot) formulations given intramuscularly on a biweekly-to-monthly schedule, including aripiprazole, fluphenazine, haloperidol, olanzapine, paliperidone (both 4-week and 12-week versions), and risperidone. The clinical advantage is medication adherence: a patient who struggles to take a daily pill, or who has a history of stopping medication once symptoms improve, maintains steadier drug levels with an LAI, which helps prevent relapse, rehospitalization, and the difficult-course trajectory that comes with inconsistent treatment."},
   {h:"Neuroleptic malignant syndrome (NMS)"},
   {p:"NMS is a rare but life-threatening reaction to antipsychotic medications, marked by high fever, confusion, extremely rigid muscles, and altered consciousness (progressing to seizures if untreated) — it can occur hours to months after starting the drug or increasing the dose. Risk rises in clients who are agitated, fatigued, or dehydrated at the time they receive an antipsychotic. It is a medical emergency requiring immediate discontinuation of the antipsychotic and supportive medical treatment — recognizing the fever-plus-rigidity pattern quickly is what separates a good outcome from a fatal one."},
   {p:"NMS is classically remembered by <strong>four cardinal signs</strong>: <strong>hyperthermia</strong> (high fever), <strong>rigidity</strong> (extreme muscle rigidity), <strong>autonomic instability</strong> (tachycardia/dysrhythmias, blood pressure swings, diaphoresis), and <strong>altered mental status</strong>. Additional findings can include seizures and rhabdomyolysis (muscle breakdown). Left untreated, NMS can progress to renal failure, respiratory failure, or coma. Management: stop the antipsychotic immediately, apply a cooling/hypothermia blanket and aggressive IV hydration, and give supportive medications such as <strong>dantrolene</strong> (a direct-acting skeletal muscle relaxant), benzodiazepines, and antipyretics."},
   {hook:"Memory jogger for antipsychotic/schizophrenia treatment goals overall: <strong>PRESSURE</strong> — Psychiatric medications administered properly and monitored, Realistic perceptions and self-expectations developed, Environmental situations managed effectively, Safety needs addressed, Self-care performed adequately, Use of community resources on an ongoing basis, Relationships developed and sustained, Establishment and maintenance of family involvement in care."}
  ],
  check:{stem:"A patient taking clozapine requires which specific ongoing monitoring?",
   options:["Daily blood glucose checks","Regular white blood cell counts","Weekly EKGs","Monthly bone density scans"],
   answer:1,
   why:"Clozapine carries a risk of agranulocytosis (severely low white blood cell counts), so patients on this medication require regular WBC monitoring throughout treatment."}
}
]};
const MH_PERSONALITY = { title:"Personality Disorders", group:"mh", sub:"The 10-type taxonomy, borderline and antisocial personality disorder.", lessons:[
{ id:"mh-pd-overview", title:"Personality Disorders: The 10-Type Taxonomy", kicker:"Three categories, ten types — where borderline and antisocial fit in the bigger picture",
  blocks:[
   {p:"A personality disorder is the deviation of individual traits or characteristics from cultural norms or mores that is inflexible, impairs functioning, and contributes to dysfunctional behaviors. Causation is multifactorial, with both physiological and psychological influences. DSM-5 recognizes 10 types, officially grouped into three named <strong>clusters</strong> — know the cluster names themselves, since exam questions often test \"which cluster\" rather than the specific diagnosis. Personality disorders affect an estimated 12% of the U.S. population; some (antisocial, borderline) tend to soften in intensity by middle age, while others (obsessive-compulsive, schizotypal) tend to become more pronounced with age."},
   {table:{head:["Cluster","Behavior pattern","Types"],rows:[
     ["Cluster A","Odd or eccentric","Paranoid (pervasive distrust/suspicion of others' motives), schizoid (detached, indifferent to relationships, restricted emotional expression), schizotypal (odd thinking/speech, magical thinking, eccentricity — shares some features with schizophrenia but is a distinct diagnosis)"],
     ["Cluster B","Emotional, dramatic, erratic","Antisocial (disregard for rights of others, deceit, lack of remorse), borderline (unstable relationships/mood/self-image, impulsivity, fear of abandonment), histrionic (excessive emotionality, attention-seeking, seductive/theatrical), narcissistic (grandiosity, need for admiration, lack of empathy)"],
     ["Cluster C","Anxious or fearful","Avoidant (social inhibition, feelings of inadequacy, hypersensitivity to criticism), dependent (excessive need to be taken care of, difficulty making independent decisions), obsessive-compulsive personality disorder (perfectionism, rigidity, preoccupation with control and rules — distinct from OCD itself: no true obsessions/compulsions, and the person often sees the traits as correct rather than distressing)"]]}},
   {h:"General DSM-5 diagnostic criteria (applies across all 10 types)"},
   {p:"Every personality disorder is diagnosed against the same general framework, then further distinguished by disorder-specific criteria: an enduring pattern of inner experience and behavior that deviates markedly from the person's culture, showing up in two or more of cognition, affectivity, interpersonal functioning, or impulse control; the pattern is inflexible and pervasive across personal and social situations; it causes clinically significant distress or impairment; it's stable, long-standing, and traceable back to adolescence or early adulthood; and it isn't better explained by another mental disorder or by the physiologic effects of a substance or medical condition. In other words: patterns, not moments — a personality disorder doesn't develop overnight and isn't diagnosed off a single interaction."},
   {h:"Priority assessments/cues (shared across personality disorders)"},
   {list:[
    "Impaired social relationships, changes in cognition and affect, poor impulse control, emotional dysregulation",
    "Symptoms must be significant enough to impair functioning to meet the diagnostic threshold — individuals may manifest some characteristics of personality disorders at some point in their lives without meeting that bar",
    "Poor impulse control often manifests as acting out to manage internal pain — physical/verbal attacks, self-injurious behavior, manipulation, substance misuse, promiscuity, and suicide attempts",
    "Impaired judgment, impaired reality testing (often with projection of the person's own feelings onto others), impaired self-perception, and an impaired stimulus barrier (poor attention span, excessive response to noise/light, agitation)"]},
   {h:"Priority laboratory tests/diagnostic cues"},
   {list:["Tests to determine underlying physiological conditions — a genuine personality change can be the first sign of a neurologic, endocrine, or other medical illness (a frontal lobe tumor, for example), so this must be ruled out before attributing the presentation to a personality disorder","Serum toxicology if drugs or alcohol are suspected — intoxication can mimic personality-disorder features"]},
   {h:"General nursing interventions (apply across the personality-disorder family)"},
   {list:[
    "Maintain safety against self-destructive behaviors; ensure the whole care team responds consistently to acting-out behavior so the client can't play one staff member's response against another's",
    "Allow the client to make choices and be as independent as possible; encourage discussing feelings rather than acting them out, and consider a feelings journal",
    "Discuss expectations, responsibilities, and the consequences that follow specific behaviors; make clear that harm to self, others, or property is unacceptable",
    "Develop a written safety or behavioral contract with the client",
    "Identify and name splitting behavior directly when it occurs",
    "Encourage participation in group activities and praise nonmanipulative behavior; set and maintain limits to reduce manipulative behavior; remove the client from group situations where attention-seeking behavior is escalating",
    "Provide realistic praise for positive behaviors in social situations"]},
   {h:"Priority hypotheses for nursing care"},
   {list:[
    "Nurses may encounter clients with personality disorders in any clinical setting, not only psychiatric units",
    "Management of clients with personality disorders may pose significant challenges to health care professionals",
    "Personality disorders are often chronic, characterized by exacerbations and remissions"]},
   {h:"Common treatment modalities across the personality-disorder family"},
   {p:"No medications are FDA-approved to treat a personality disorder itself; drug therapy targets specific symptoms rather than the diagnosis. Across the 10 types, the medication classes that come up most are <strong>antidepressants</strong> (for depressive/anxious symptoms), <strong>anxiolytics</strong> (for acute anxiety), <strong>antipsychotics</strong> (for transient distortions in thinking, often in low doses), and <strong>mood stabilizers</strong> (for irritability and impulsivity). Therapy is the mainstay of treatment; the disorder-specific lessons that follow name the psychotherapy approaches most associated with each diagnosis, but psychoanalytic/psychodynamic, group, cognitive, and behavioral therapies are all used across the cluster depending on the individual client."},
   {p:"The next two lessons work through the two Cluster B disorders most heavily tested — borderline personality disorder, organized around fear of abandonment, and antisocial personality disorder, organized around disregard for the rights of others — with their own specific assessments, interventions, and medication use."}
  ],
  check:{stem:"A nurse is orienting to a psychiatric unit and is told several clients carry a personality disorder diagnosis. Which statement best reflects an accurate understanding of these diagnoses?",
   options:["Personality disorders only appear on inpatient psychiatric units","A personality disorder is diagnosed when personality traits deviate from cultural norms and are inflexible enough to significantly impair functioning — nurses may encounter these clients in any clinical setting","Anyone who shows a single personality quirk has a personality disorder","Personality disorders are always curable within a few weeks of treatment"],
   answer:1,
   why:"A personality disorder requires traits significant enough to impair functioning, not just an occasional quirk, and because of how common these traits are in some form, nurses encounter clients with personality disorders across every clinical setting, not just psychiatric units."}
},
{ id:"mh-bpd", title:"Borderline Personality Disorder", kicker:"Fear of abandonment as the organizing feature, plus the full care plan",
  blocks:[
   {p:"Borderline personality disorder (BPD) is organized around one central, driving fear: <strong>fear of abandonment</strong>. Much of the behavior that looks confusing or contradictory from the outside — intense, unstable relationships, rapid swings between idealizing and devaluing the same person, impulsivity, and self-harming behavior — makes more sense once it's understood as an attempt (often unsuccessful and self-defeating) to manage that underlying fear."},
   {h:"Priority assessments/cues"},
   {list:[
    "Mood swings, a perpetual state of crisis, impulsivity",
    "Depression, anger, acting out, agitation",
    "Inability to be alone, unstable relationships",
    "<strong>Splitting</strong> (all good/all bad), clinging/distancing behaviors",
    "Self-destructive behaviors (substance abuse, overspending, self-harm, unsafe sexual behaviors)"]},
   {h:"Splitting, revisited"},
   {p:"BPD is the disorder most classically associated with the defense mechanism of splitting, covered earlier in this section: seeing people as entirely good or entirely bad, with a single perceived slight capable of flipping someone from one category to the other. On an inpatient unit, this frequently shows up as a patient idealizing one staff member while devaluing another, which can fracture team consistency if the team isn't aware of the pattern and doesn't communicate about it. Splitting is understood as a primitive defense against the intolerable idea that the same person can be both loving and disappointing at once — collapsing that ambiguity into all-good or all-bad protects the client from the anxiety of holding both at the same time."},
   {h:"Epidemiology, causes, and risk factors"},
   {list:[
    "BPD occurs predominantly in females (up to 75% of diagnosed cases) and frequently coexists with other personality disorders, which can delay accurate diagnosis",
    "Prevalence is roughly 10% in outpatient psychiatric populations and 20% in inpatient psychiatric populations — far higher than the general-population rate",
    "Cause is largely unknown but is thought to be a combination of genetic factors, traumatic life experiences, and changes in the brain areas governing emotional regulation, impulsivity, and aggression",
    "Key risk factors: a history of childhood physical, emotional, or sexual abuse and neglect, and having a parent diagnosed with a personality disorder",
    "Physiologic theory points to <strong>frontal lobe dysfunction</strong> as a contributor to the impulsivity, cognitive inflexibility, poor self-monitoring, and perseveration seen in BPD",
    "Nearly 6% of people with BPD die by suicide — the single most important complication to screen for"]},
   {h:"DSM-5-TR diagnostic criteria"},
   {p:"Diagnosis requires <strong>five or more</strong> of the following nine criteria: frantic efforts to avoid real or imagined abandonment; a pattern of unstable and intense relationships; unstable self-image or sense of identity; impulsivity in at least two potentially self-damaging areas (overspending, sex, substance use, reckless driving, binge eating); recurrent suicidal behavior, gestures, or threats, or self-mutilating behavior; wide mood swings — irritability or anxiety usually lasting a few hours and only rarely more than a few days; chronic feelings of emptiness; inappropriate, intense anger or difficulty controlling anger (frequent temper displays, constant anger, recurrent physical fights); and transient, stress-related paranoia or dissociation/loss of contact with reality."},
   {h:"Priority interventions/collaborative actions"},
   {list:[
    "Provide frequent and irregular client observations",
    "Reinforce independence, decrease manipulation, rotate staff",
    "Ensure a safe environment, remove objects that could harm self or others, establish a no-harm contract",
    "Provide appropriate routes to ventilate anger and emotions, set limits on behavior",
    "Explore sources of anger, potential for grief, explore fears",
    "Ensure participation in counseling, reinforce counseling principles",
    "Encourage appropriate ventilation of anger",
    "During acute escalation, use medication, staff show of strength, and restraints as indicated",
    "Set clear expectations with an attitude of acceptance, encourage and reward positive behaviors, ensure the client is aware of consequences of behavior violations",
    "Promote development of personal insights",
    "Ensure participation in counseling and the plan of care"]},
   {h:"Priority actual & potential complications"},
   {list:["Harm to self or others","Poor social functioning, weak or lacking social relationships"]},
   {h:"Priority medications"},
   {p:"No medications are FDA-approved to treat personality disorders — psychotropic medications may be used off-label to treat symptoms for mood stabilization."},
   {list:[
    "<strong>Olanzapine</strong> — oral or intramuscular antipsychotic, antimanic agent to address mania; may become physically dependent and tolerant, with withdrawal if abruptly withdrawn",
    "<strong>Fluoxetine</strong> — oral SSRI antidepressant"]},
   {h:"Priority teaching/discharge needs"},
   {p:"Importance of ongoing adherence to medication and therapy/counseling — personality disorders are often chronic, characterized by exacerbations and remissions."},
   {h:"Dialectical behavior therapy (DBT)"},
   {p:"DBT is the psychotherapy most specifically developed for and studied in BPD, alongside other options such as cognitive behavior therapy, mentalization-based therapy, schema-focused therapy, and transference-focused psychotherapy. DBT combines individual therapy with skills-group training built around four skill modules:"},
   {list:[
    "<strong>Mindfulness</strong> — building the capacity to observe and describe one's own thoughts, emotions, and sensations nonjudgmentally, in the present moment, rather than being swept along by them",
    "<strong>Distress tolerance</strong> — skills for getting through a crisis without making it worse (impulsive self-harm, substance use), when the situation can't be changed in the moment",
    "<strong>Emotion regulation</strong> — identifying and naming emotions accurately and reducing vulnerability to intense mood swings",
    "<strong>Interpersonal effectiveness</strong> — asking for what one needs, setting boundaries, and maintaining relationships and self-respect while doing so"]},
   {h:"Managing self-harm and parasuicidal behavior"},
   {list:[
    "Treat every episode of self-harm or suicidal gesture as clinically significant rather than dismissing it as purely attention-seeking — intent and lethality still have to be assessed each time",
    "Institute safety precautions to prevent injury, and collaboratively develop a written safety plan that lists specific coping strategies and sources of support the client can use before acting on the urge",
    "Assess and document scarring or physical findings from prior self-mutilation as part of the physical exam",
    "Monitor anxiety level, use of coping strategies, impulsivity, and suicidal ideation on an ongoing basis, not only at admission",
    "Respond matter-of-factly and consistently rather than with visible alarm or excessive reassurance, which can inadvertently reinforce the behavior as a way to obtain attention or care"]},
   {h:"Boundary- and limit-setting specifics"},
   {list:[
    "Establish clear boundaries at the outset of care and maintain them without exception — boundaries that shift erode trust and can be experienced by the client as further evidence of instability",
    "State expectations and the consequences of violating them concretely and in advance, rather than reactively in the moment of a violation",
    "Keep a clear treatment alliance between staff and client, and stay well-integrated with other services (therapist, case manager, prescriber) through a multidisciplinary approach — communicate and review the plan of care across services specifically to prevent manipulation and splitting"]},
   {h:"Nursing approach"},
   {p:"Consistency across the entire care team is the single most protective nursing behavior with BPD: consistent limits, consistent responses to manipulative or testing behavior, and a team that communicates with each other so the patient can't (even unintentionally) play one staff member's interpretation against another's."}
  ],
  check:{stem:"A client with borderline personality disorder tells the nurse, \"You're the only one here who actually cares about me — the other nurse is terrible.\" What does this statement most likely represent?",
   options:["An accurate assessment of staff competence that should be reported","Splitting, a defense mechanism common in BPD where people are seen as all good or all bad","A sign the client is ready for discharge","Evidence of a formal complaint that requires disciplinary action"],
   answer:1,
   why:"This all-or-nothing framing of one staff member as entirely good and another as entirely bad is a textbook example of splitting, and the correct response is team consistency and communication rather than taking the statement as a literal, reliable evaluation of coworkers."}
},
{ id:"mh-antisocial", title:"Antisocial Personality Disorder", kicker:"Charm on the surface, disregard for laws and norms underneath",
  blocks:[
   {p:"Antisocial personality disorder sits in the same \"emotionally charged\" category as BPD, but the organizing feature is different: rather than fear of abandonment, it's a profound disregard for the rights of others, paired paradoxically with a surface charm that can make the underlying pattern easy to miss at first meeting."},
   {h:"Priority assessments/cues"},
   {list:[
    "Rage, anger, violence — may appear charming, cooperative",
    "Poor at delaying gratification, deceitful, manipulative",
    "Poor coping, replicating negative behaviors",
    "Criminal behaviors, disregard for laws and norms",
    "Profound lack of empathy, inability to feel guilt or remorse"]},
   {h:"Conduct disorder as a childhood precursor"},
   {p:"Antisocial personality disorder cannot be diagnosed before age 18, but a diagnostic requirement behind it looks backward into childhood: evidence of <strong>conduct disorder</strong> with onset before age 15. Conduct disorder involves a repetitive pattern of violating the basic rights of others or age-appropriate social norms — aggression toward people or animals, destruction of property, deceitfulness or theft, and serious rule violations (truancy, running away). A documented childhood or adolescent history along these lines is part of why a thorough history, not just the current presentation, matters for this diagnosis."},
   {h:"Priority interventions/collaborative actions"},
   {list:[
    "Reduce environmental stimuli, provide frequent and irregular observation of clients, ensure a safe environment",
    "The same general de-escalation, limit-setting, and counseling-participation principles covered for personality disorders overall (see the Personality Disorders overview lesson) apply here as well"]},
   {h:"Managing manipulation and lack of remorse"},
   {list:[
    "Maintain firm, consistent limits stated in concrete, matter-of-fact terms, and follow through on stated consequences every time — inconsistency is what manipulation is designed to find and exploit",
    "Avoid power struggles and debating the rules; state the limit once, calmly, and disengage rather than arguing the client's counterarguments point by point",
    "Confront manipulative or deceitful behavior directly and without judgmental language, using specific observed behavior rather than character attacks",
    "Do not rely on the client's expressed remorse or promises as evidence of behavior change — evaluate change by observed, sustained behavior over time instead",
    "Keep the whole care team communicating so the client cannot play one staff member's response against another's (the same principle that prevents splitting in BPD applies here to manipulation)"]},
   {h:"Priority actual & potential complications"},
   {list:["Harm to self or others","Altercations with law enforcement, incarceration"]},
   {h:"Legal and forensic context"},
   {p:"Because disregard for laws and the rights of others is core to the diagnosis, clients with antisocial personality disorder are overrepresented in the criminal justice system, and nurses may encounter them in forensic or correctional psychiatric settings as well as general inpatient units. Maintaining a therapeutic, nonjudgmental stance while still holding firm boundaries is a documented challenge in these settings, since the same charm that complicates recognition on a general unit can also complicate the therapeutic relationship in a secure or forensic setting."},
   {h:"Priority medications"},
   {list:["<strong>Lorazepam</strong> — oral, intramuscular, or intravenous benzodiazepine antianxiety agent to manage acute anxiety and distress; high potential for addiction and tolerance"]},
   {h:"Priority teaching/discharge needs"},
   {p:"As with other personality disorders, importance of ongoing adherence to medication and therapy/counseling, and awareness that the disorder is often chronic with exacerbations and remissions."},
   {hook:"The charming-but-manipulative presentation is what makes antisocial personality disorder genuinely risky to miss: a patient can be cooperative and likable with staff while showing a documented pattern of deceit, exploitation, and disregard for others outside the room — the profound lack of empathy and remorse is the feature to weigh, not the moment-to-moment charm."}
  ],
  check:{stem:"A client is pleasant and cooperative with the nursing staff but has a documented history of repeated legal trouble, deceiving family members for financial gain, and expressing no remorse when confronted about harming others. Which personality disorder does this pattern most strongly suggest?",
   options:["Borderline personality disorder","Antisocial personality disorder","Avoidant personality disorder","Dependent personality disorder"],
   answer:1,
   why:"Charm that coexists with deceit, manipulation, disregard for laws and the rights of others, and an absence of guilt or remorse is the classic antisocial personality disorder pattern — the surface charm is exactly what makes it easy to underestimate."}
}
]};

const MH_SUBSTANCE = { title:"Substance-Related & Addictive Disorders", group:"mh", sub:"Addiction fundamentals, alcohol, opioids, and benzodiazepines.", lessons:[
{ id:"mh-addiction-basics", title:"Understanding Addiction", kicker:"Why addiction is a disease, not a choice — plus the standardized screening tools",
  blocks:[
   {p:"Substance use disorder is the continued pathological use of a substance despite negative consequences — from impaired self-control, social and occupational functioning, to dangerous behaviors and physical side effects. Addiction describes the cycle of abuse, dependence, withdrawal, and relapse that often accompanies use of psychoactive substances or behaviors that activate the brain's reward or pleasure centers. Repeated substance use physically <strong>rewires the brain's dopamine reward pathway</strong>, so that the substance (or the associated cues) triggers dopamine release the way a natural reward normally would, while everyday sources of pleasure become comparatively less rewarding. This rewiring is a large part of why addiction is <strong>not simply a choice</strong> a person can reason their way out of once it's established, even though choices contributed to the initial use. There is also a documented <strong>familial and genetic component</strong> — a family history of addiction raises an individual's own risk independent of environment, alongside environmental and cultural etiological factors."},
   {h:"Key vocabulary: intoxication, tolerance, withdrawal"},
   {p:"<strong>Intoxication</strong> is a state of euphoria, exhilaration, lethargy, or stupor that occurs due to substance ingestion, and may have physical and emotional dimensions. <strong>Tolerance</strong> occurs when greater amounts of a substance are needed to produce intoxication. <strong>Withdrawal</strong> describes the physical and emotional symptoms that occur after addictive substances are discontinued abruptly; symptoms vary depending on the substance used and may be life-threatening if not properly managed — client intake of the substance may need to be maintained rather than allowed to become intoxicated, specifically to prevent withdrawal symptoms. The breadth of symptoms depends on the substance used, the amount used, and the duration of usage."},
   {h:"Behavioral (process) addiction"},
   {p:"Behavioral addiction results from uncontrollable patterns of behavior that continue despite adverse effects to financial status, relationships, or other functioning. Gambling addiction is the only behavioral addiction currently recognized in the DSM-5, though future editions may include shopping, sexual activity, gaming, or social media use. Behavioral addictions stimulate the same reward/pleasure pathways of the brain without the physiological effects of intoxication — withdrawal symptoms from a behavioral addiction are psychological rather than physical."},
   {h:"Standardized screening tools"},
   {list:[
    "<strong>CAGE</strong> — asking whether the client has ever felt a need to <strong>C</strong>ut down drinking, felt <strong>A</strong>nnoyed by others criticizing their drinking, felt <strong>G</strong>uilty about their drinking, or ever needed an <strong>E</strong>ye-opener drink in the morning (may be modified for substances other than alcohol)",
    "<strong>Michigan Alcoholism Screening Test</strong>",
    "<strong>Drug Abuse Screening Test (DAST)</strong>",
    "<strong>Clinical Institute Withdrawal Assessment of Alcohol Scale, Revised (CIWA-Ar)</strong> — covered in the Alcohol lesson",
    "<strong>Clinical Opiate Withdrawal Scale (COWS)</strong> — covered in the Opioids lesson"]},
   {h:"Stages: use, intoxication, withdrawal"},
   {p:"Addiction is understood as a disease that moves through stages of <strong>use</strong>, <strong>intoxication</strong>, and <strong>withdrawal</strong>, each with its own clinical presentation and its own nursing priorities — assessing which stage a patient is in changes what the nurse watches for and how urgently they need to act, since withdrawal from some substances (alcohol and benzodiazepines in particular) can be medically dangerous or fatal, while withdrawal from others (opioids) is miserable but rarely life-threatening on its own. Potential for dual diagnosis with mental health disorders is common, so comorbid psychological disorders (mood disorders, PTSD, schizophrenia) are part of every substance use assessment."},
   {h:"The use-to-addiction spectrum"},
   {p:"Beyond the use/intoxication/withdrawal stages above, it helps to think of substance involvement as a spectrum of increasing severity: <strong>use</strong> (intermittent, without adverse consequences) progresses to <strong>abuse</strong> (variable frequency, with some adverse consequences), which can progress to <strong>physical dependence</strong> (withdrawal symptoms occur on cessation, dose reduction, or antagonist administration) and/or <strong>psychological dependence</strong> (a subjective, felt need to keep using for the positive effects or to avoid negative ones). <strong>Addiction</strong> sits at the far end of this spectrum — a primary, chronic, neurobiological disease marked by loss of control and compulsive use despite ongoing harm, distinct from dependence alone."},
   {h:"Why the brain keeps seeking the substance"},
   {p:"Chronic, prolonged stress alters the body's <strong>corticotropin-releasing factor and hypothalamic-pituitary-adrenal (HPA) axis</strong>, and this alteration itself contributes to substance-seeking behavior — the brain undergoes adaptive changes as it tries to restore homeostasis, which is part of the neurobiological basis for why the reward-pathway rewiring described above is so difficult to reverse through willpower alone."},
   {h:"Screening tool score cutoffs worth memorizing"},
   {list:[
    "<strong>AUDIT</strong> (Alcohol Use Disorders Identification Test) — a score <strong>greater than 8</strong> indicates unhealthy alcohol use",
    "<strong>CRAFFT</strong> — used specifically with adolescents and young adults; <strong>2 or more</strong> affirmative answers suggests an alcohol use disorder",
    "<strong>Michigan Alcoholism Screening Test, brief version</strong> — a score of <strong>3 or higher</strong> suggests alcoholism",
    "<strong>CAGE</strong> — <strong>2</strong> affirmative answers suggest an alcohol problem (see above)",
    "<strong>Drug Abuse Screening Test (DAST)</strong> — any score <strong>greater than 0</strong> indicates a drug use disorder"]}
  ],
  check:{stem:"A nurse explains to a student that addiction involves changes to the brain's reward pathway. This best supports which statement about addiction?",
   options:["Addiction is purely a matter of personal choice and willpower","Addiction is a disease involving physical changes to brain chemistry, not simply a choice","Addiction only affects people with no family history of substance use","Addiction cannot be influenced by genetics"],
   answer:1,
   why:"The dopamine reward pathway rewiring described in this lesson is direct evidence that addiction has a physiological, disease-based component — which is also why willpower alone is rarely sufficient to resolve it."}
},
{ id:"mh-alcohol", title:"Alcohol Use Disorder & Withdrawal", kicker:"CIWA-Ar, the legal BAL threshold, a five-phase withdrawal timeline, and disulfiram/naltrexone",
  blocks:[
   {p:"Alcohol is the most commonly encountered substance in clinical practice, and its complications span nearly every organ system when use is chronic and heavy — peripheral neuropathy, alcoholic myopathy, alcoholic cardiomyopathy, esophagitis, gastritis, pancreatitis, alcoholic hepatitis, cirrhosis, leukopenia, thrombocytopenia, and sexual dysfunction."},
   {h:"Severity grading — DSM-5's four symptom clusters"},
   {p:"Alcohol use disorder is graded by how many symptoms are present across four clusters: <strong>impaired control</strong> (taking more than intended, unsuccessful attempts to cut down, excess time spent obtaining/using/recovering, intense craving), <strong>social impairment</strong> (failing role obligations, continuing use despite recurring problems, giving up activities), <strong>risky use</strong> (using in physically hazardous situations, continuing despite known harm), and <strong>pharmacologic dynamics</strong> (tolerance, withdrawal). <strong>2–3</strong> symptoms present = mild AUD; <strong>4–5</strong> = moderate; <strong>6 or more</strong> = severe."},
   {h:"Priority laboratory tests/diagnostic cues"},
   {list:[
    "<strong>Blood alcohol level</strong> — intoxication occurs between 100 and 200 mg/dL (long-term alcohol abuse may result in high blood alcohol levels without signs of intoxication, since tolerance shifts the dose-response curve)",
    "<strong>Breathalyzer</strong> — in most states, 0.08% is the legal intoxication threshold while driving",
    "Serum toxicology levels — detect other substances",
    "Metabolic panel — nutritional deficits, organ dysfunction",
    "<strong>Clinical Institute Withdrawal Assessment of Alcohol Scale, Revised (CIWA-Ar)</strong> — the standardized scoring tool used to objectively grade withdrawal severity and titrate symptom-triggered medication dosing; scored at regular intervals throughout the withdrawal course, not just once on admission"]},
   {h:"Major complications of alcohol addiction"},
   {list:[
    "<strong>Wernicke's encephalopathy / Korsakoff's psychosis</strong> — a thiamine (B1) deficiency-driven neurologic disorder causing confusion, ataxia, memory loss, lethargy, and stupor",
    "Peripheral neuropathy, alcoholic myopathy, alcoholic cardiomyopathy, esophagitis, gastritis, pancreatitis, hepatitis, cirrhosis, leukopenia, thrombocytopenia, sexual dysfunction",
    "<strong>Fetal alcohol syndrome</strong> — for pregnant patients, alcohol crosses the placenta and can cause lasting physical and cognitive impairment (craniofacial abnormalities, developmental delays, learning disabilities, organ dysfunction) — no amount of alcohol has been established as safe during pregnancy, and nurses need to instruct pregnant clients to abstain",
    "Alcohol withdrawal delirium (delirium tremens)",
    "For sedatives/hypnotics/opioids taken concurrently — respiratory depression, cough suppression",
    "For stimulants taken concurrently — myocardial infarction, cardiac dysrhythmias",
    "Hospital complications — patients admitted for unrelated reasons who are also alcohol-dependent are at risk for unrecognized withdrawal during the hospital stay itself, which is why alcohol use history is a standard admission screening question"]},
   {h:"The alcohol withdrawal timeline"},
   {p:"Alcohol withdrawal unfolds in a recognizable, time-based progression, and recognizing where a patient is on this timeline changes the urgency of the nursing response:"},
   {table:{head:["Timeframe","What to expect"],rows:[
     ["~6 hours","Anxiety, insomnia, possible seizures can begin"],
     ["12–24 hours","Auditory and visual hallucinations"],
     ["24–48 hours","Withdrawal symptoms intensify: shaking, heavy sweating"],
     ["48–72 hours","Delirium tremens (DTs): very high heart rate, elevated body temperature, seizures — this is the most dangerous window"],
     ["72+ hours","Illusions, racing heartbeat, high blood pressure, continued perspiration, high fever can persist"]]}},
   {hook:"Delirium tremens is the single most dangerous point on this entire timeline — the combination of severe autonomic instability (heart rate, temperature, blood pressure) and seizure risk makes the 48–72 hour window the period of highest mortality risk in untreated alcohol withdrawal, which is exactly why patients with a heavy drinking history are monitored closely rather than simply left to \"detox\" unsupervised. The <strong>Clinical Institute Withdrawal Assessment of Alcohol Scale, Revised (CIWA-Ar)</strong> is the standardized tool used to score withdrawal severity and titrate treatment along this exact timeline."},
   {h:"Priority interventions during withdrawal"},
   {list:[
    "Monitor vital signs and neurological status, reorient as needed",
    "Remove potentially harmful objects from the environment, minimize stimulation",
    "Seizure precautions, determine the need for restraints or security devices",
    "One-on-one supervision as appropriate",
    "Medications to control symptoms, intravenous fluids and electrolytes, vitamins",
    "Maintain hygiene"]},
   {h:"Medications specific to alcohol use disorder"},
   {list:[
    "<strong>Disulfiram</strong> — oral alcohol deterrent; generates unpleasant symptoms (nausea/vomiting, dyspnea, confusion, headache) if alcohol is ingested, with severity based on the amount of alcohol and individual sensitivity; should not be started until after 24 hours of alcohol abstinence; instruct the client about alcohol hidden in selected over-the-counter medications and other substances",
    "<strong>Naltrexone</strong> — oral opiate antagonist that blocks the effects of narcotics; treats both alcohol and heroin addiction",
    "<strong>Vitamin supplementation</strong> — oral folic acid, thiamine, and multivitamins with long-term alcohol use, to prevent Wernicke's encephalopathy and correct nutritional deficits"]},
   {h:"Acute withdrawal management — the fuller medication picture"},
   {list:[
    "<strong>IV glucose and fluids containing thiamine and B-complex vitamins</strong> — corrects nutritional deficiencies and supports glucose metabolism; give thiamine <strong>before</strong> the glucose load whenever possible, since IV glucose given to a thiamine-depleted patient can precipitate or worsen Wernicke's encephalopathy",
    "<strong>Furosemide (Lasix)</strong> — eases overhydration",
    "<strong>Magnesium sulfate</strong> — reduces CNS irritability",
    "<strong>Benzodiazepines (Ativan)</strong> — long-acting agents such as <strong>diazepam</strong> or short-acting agents such as <strong>lorazepam</strong> are the mainstay for controlling withdrawal; anticonvulsants, antiemetics, or antidiarrheals are added as needed for specific symptoms",
    "<strong>Antipsychotics</strong> — used to control hyperactivity and psychosis if present"]},
   {h:"A withdrawal-specific physical exam cue"},
   {p:"A patient describing a <strong>sensation of bugs crawling on the skin (formication)</strong> is a classic, testable physical exam cue for <strong>alcohol withdrawal</strong> specifically — worth recognizing alongside the tremor, diaphoresis, and hallucinations already covered on the timeline above."}
  ],
  check:{stem:"A patient with a history of heavy daily alcohol use was admitted 50 hours ago for an unrelated surgery and has had no alcohol since admission. The nurse should monitor most closely for which finding right now?",
   options:["Mild anxiety and insomnia only","Delirium tremens: very high heart rate, elevated temperature, and seizures","Complete resolution of withdrawal symptoms","Wernicke-Korsakoff syndrome only"],
   answer:1,
   why:"At 48–72 hours after the last drink, a heavy daily drinker is in the highest-risk window for delirium tremens, which involves dangerous autonomic instability and seizure risk — this is the period requiring the closest monitoring on the entire withdrawal timeline."}
},
{ id:"mh-opioids", title:"Opioid Use Disorder, Withdrawal & Body Effects", kicker:"Timeline, symptoms, and system-by-system impact",
  blocks:[
   {p:"Opioid withdrawal follows a more predictable, dose-and-half-life-driven timeline than alcohol withdrawal, and while it is intensely uncomfortable, it is rarely life-threatening on its own the way alcohol or benzodiazepine withdrawal can be."},
   {h:"Opioid withdrawal timeline"},
   {p:"Symptoms begin <strong>6–12 hours</strong> after the last dose for short-acting opioids, or up to <strong>30 hours</strong> after the last dose for long-acting opioids. Symptoms typically peak around <strong>72 hours</strong> and include nausea, vomiting, stomach cramps, diarrhea, goosebumps, irritability or depressed mood, weakness, anxiety, insomnia, tachycardia, hypertension, and intense drug cravings — dependent-substance-specific symptoms are tracked with the <strong>Clinical Opiate Withdrawal Scale (COWS)</strong>, the opioid-specific counterpart to the alcohol-focused CIWA-Ar."},
   {h:"Nutritional support during opioid treatment"},
   {p:"Nutritional support and a dietitian consult are part of the treatment plan, with protein limited and dietary sodium decreased if liver impairment exists from concurrent alcohol or hepatitis exposure, small frequent meals and non-irritating food provided if gastritis or esophagitis exists, and thiamine supplementation as indicated."},
   {h:"Effects of opioids on the body"},
   {table:{head:["System","Effect"],rows:[
     ["Brain","Heavy use can cause sedation"],
     ["Heart","Heart lining can become infected from contaminated heroin or crushed pills used intravenously"],
     ["Blood","IV injection of heroin or crushed pills can cause veins to collapse"],
     ["Lungs","Respiratory depression from slowed breathing — potentially fatal, and the primary mechanism of opioid overdose death"],
     ["Digestive system","Slowing of GI motility results in significant constipation"],
     ["Liver","Shared, infected needles can transmit hepatitis"],
     ["Nervous system","Chronic use can increase sensitivity to pain over time"],
     ["Immune system","Increased vulnerability to infection from reduced immune response"]]}},
   {p:"Respiratory depression is the line item that matters most in an emergency: it's the mechanism behind fatal opioid overdose, and it's exactly what naloxone (Narcan) is designed to reverse."},
   {h:"Physical exam cues that point to opioids specifically"},
   {list:[
    "<strong>Constricted (pinpoint) pupils</strong> — opiate use or withdrawal",
    "<strong>Lacrimation</strong> (excess tearing) — opiate withdrawal",
    "<strong>Rhinorrhea</strong> — opiate withdrawal (also seen with cocaine abuse)",
    "<strong>Drooping eyelids</strong> — opiates or other CNS depressants",
    "By contrast, <strong>dilated pupils</strong> point away from opioids and toward hallucinogens or amphetamines — a useful exam-cue contrast when the substance involved isn't yet known"]},
   {h:"A limit on what naloxone can do"},
   {p:"It's worth stating plainly in the opioid context: naloxone reverses <strong>opioids only</strong>. It has no pharmacologic activity of its own beyond displacing opioids from their receptors, so it will not reverse respiratory depression caused by benzodiazepines or other sedatives. And because naloxone's duration of action can be <strong>shorter</strong> than that of the opioid it's reversing — especially with long-acting or high-potency opioids — a patient can slip back into respiratory depression after an initial response, which is why repeat dosing and continued monitoring, not a single dose and discharge, is the expectation."}
  ],
  check:{stem:"A patient took their last dose of a short-acting opioid 8 hours ago. Which symptom would the nurse expect to see now that withdrawal has begun?",
   options:["No symptoms for another 24 hours","Nausea, goosebumps, and early withdrawal symptoms beginning","Symptoms already peaking","Respiratory depression from ongoing opioid effect"],
   answer:1,
   why:"Short-acting opioid withdrawal symptoms begin 6–12 hours after the last dose, so at 8 hours the patient would be expected to be entering early withdrawal, not yet at the roughly 72-hour peak."}
},
{ id:"mh-benzo-withdrawal", title:"Benzodiazepine Use & Withdrawal", kicker:"Why abrupt discontinuation is dangerous",
  blocks:[
   {p:"Benzodiazepines are highly effective for acute anxiety and seizure control, but they are also highly addictive, and abrupt discontinuation after regular use carries real medical risk — most seriously, <strong>seizures</strong>, including grand mal seizures. Benzodiazepines potentiate GABA, producing sedation, muscle relaxation, anti-anxiety, and anticonvulsant effects; the same class of drug acts as a hypnotic at high doses, an anxiolytic at moderate doses, and a sedative at low doses. Half-life ranges widely by agent, from about 4 to 20 hours."},
   {h:"Common benzodiazepine drug names"},
   {p:"alprazolam (Xanax), chlordiazepoxide (Librium), clonazepam (Klonopin), diazepam (Valium), flurazepam (Dalmane), lorazepam (Ativan), midazolam (Versed), oxazepam (Serax), temazepam (Restoril), triazolam (Halcion)."},
   {h:"Symptoms of benzodiazepine withdrawal"},
   {list:["Grand mal seizures","Aches and pains","Abnormal body sensations","Delirium or detachment from reality","Muscle spasms","Anxiety and panic attacks","Insomnia","Nausea","Depression"]},
   {p:"This symptom list overlaps closely with alcohol withdrawal, which makes sense physiologically — both alcohol and benzodiazepines act on the same GABA neurotransmitter system, which is exactly why benzodiazepines are used medically to treat alcohol withdrawal (a controlled, tapered substitution rather than an abrupt stop), and why benzodiazepine withdrawal itself must also be tapered rather than stopped cold."},
   {h:"Withdrawal timeline and taper strategy"},
   {p:"Withdrawal symptoms typically begin <strong>1–4 days</strong> after the last dose — sooner with a shorter-acting agent, later with a longer-acting one — and can persist for weeks to months (occasionally a year or longer) in a minority of patients. The standard approach for a patient withdrawing from long-term, high-dose use is <strong>substitution and taper</strong>: a rapid-onset agent such as IV lorazepam or diazepam is given first to control acute symptoms, the patient is then switched to an equivalent dose of a long-acting oral agent (milder withdrawal profile), and that agent is tapered slowly — typically over <strong>2–6 months</strong>. For milder withdrawal, non-cross-dependent anticonvulsants such as carbamazepine (Tegretol) or valproate (Depakote) have also been used successfully."},
   {h:"Flumazenil — use with caution"},
   {p:"<strong>Flumazenil (Romazicon)</strong>, a GABA antagonist given IV, is the only specific benzodiazepine antidote and rapidly reverses sedation and respiratory depression. It's generally reserved for severe poisoning, however, because in a patient with chronic benzodiazepine dependence it can precipitate acute withdrawal and seizures — the same trade-off nurses anticipate with naloxone in opioid overdose."},
   {h:"Physical exam cues tied to benzodiazepines as a CNS depressant"},
   {list:[
    "<strong>Nystagmus</strong> — a classic exam finding in intoxication with CNS depressants (including benzodiazepines) or PCP",
    "<strong>Drooping eyelids</strong> — seen with CNS depressant intoxication, including benzodiazepines, as well as with opiates"]}
  ],
  check:{stem:"A patient who has taken lorazepam daily for two years wants to stop taking it immediately. What is the primary safety concern with this plan?",
   options:["Mild headache only","Seizure risk, including grand mal seizures, from abrupt discontinuation","No withdrawal effects occur with benzodiazepines","Immediate improvement in anxiety symptoms"],
   answer:1,
   why:"Abrupt discontinuation of a benzodiazepine after long-term use carries a real risk of seizures, which is why benzodiazepines are tapered under medical supervision rather than stopped suddenly."}
},
{ id:"mh-substance-treatment", title:"Medical Treatment of Substance Use Disorders", kicker:"Stabilization, substitution therapy, and aftercare",
  blocks:[
   {p:"Regardless of which substance is involved, medical treatment of substance use disorders follows a similar overall structure."},
   {list:[
    "<strong>Assessment of immediate medical issues</strong> — identifying and addressing any acute, life-threatening complications first",
    "<strong>Tapered use under medical supervision</strong> — for substances where abrupt stopping is dangerous (alcohol, benzodiazepines)",
    "<strong>Vitamin and fluid replacement</strong> — correcting nutritional deficiencies (such as thiamine, to prevent Wernicke-Korsakoff syndrome) and dehydration",
    "<strong>Substitution therapy</strong> — using a longer-acting, more controllable medication to manage withdrawal: benzodiazepines for alcohol withdrawal, and suboxone or methadone for opioid withdrawal",
    "<strong>Naloxone (Narcan)</strong> — reverses opioid overdose, but pushes the patient into abrupt, immediate withdrawal, so administering it is a trade-off between saving a life and causing acute withdrawal symptoms",
    "<strong>Aftercare</strong> — individual ongoing counseling and group therapy, referrals to self-help, addiction therapy, and counseling services, encouraging support group participation, and addressing family/home situations that may support or undermine recovery"]},
   {h:"The nurse-client relationship and motivational interviewing"},
   {p:"Develop a nurse-client relationship that conveys an attitude of acceptance, discouraging manipulation, rationalization, denial, and projection. Address misconceptions about substance use with objective facts, and teach about the impact of substances on the body. <strong>Motivational interviewing</strong> is the specific technique used to let the client set goals for their own personal recovery, identify assets that support goal attainment, assess personal strengths to facilitate change, determine obstacles to change, and develop strategies for goal attainment — the emphasis throughout is on the client's own motivation rather than the nurse's prescription for what recovery should look like."},
   {h:"Additional reversal and deterrent agents"},
   {list:[
    "<strong>Naltrexone</strong> — oral opiate antagonist that blocks the effects of narcotics; treats both alcohol and heroin addiction; for alcohol use disorder it can be given orally daily or as a monthly injection, and if the client is also using opioids, those must be stopped 7–10 days before starting naltrexone to avoid precipitating withdrawal — acamprosate (Campral) is the alternative for a client who still needs pain control with opioids",
    "<strong>Flumazenil</strong> — intravenous antidote to benzodiazepine overdose",
    "<strong>Methadone</strong> — oral or intravenous; prevents withdrawal in clients addicted to opioids, part of a comprehensive cessation program",
    "<strong>Buprenorphine/naloxone (Suboxone)</strong> — sublingual tablet or film (once or twice daily) or a monthly injection; buprenorphine is a partial opioid agonist that suppresses cravings and withdrawal without producing the same level of euphoria as a full agonist, and combining it with psychosocial treatment significantly reduces relapse risk",
    "<strong>Disulfiram</strong> — oral alcohol deterrent (see the Alcohol lesson for the full detail)"]},
   {h:"Naloxone — administration specifics"},
   {p:"Naloxone (Narcan) is an opioid antagonist that works by displacing opioids from their CNS receptors. It can be given <strong>intranasally, IV, IM, or subcutaneously, repeated every 2–3 minutes as needed</strong> — it works fast, rapidly reversing CNS/respiratory depression and increasing respiratory rate within 1–2 minutes. Because many opioids (especially potent synthetic forms like fentanyl) last longer in the body than a single dose of naloxone, a patient who appears to be revived can relapse back into respiratory depression once the naloxone wears off — this is why continued monitoring of respiratory rate and depth after reversal is essential, not optional, and why today's more potent forms of heroin/fentanyl may require multiple naloxone doses to fully reverse an overdose."},
   {hook:"Naloxone deserves special attention here: it is a genuine, immediate life-saver in an opioid overdose, but nurses should anticipate that the patient will emerge from it in acute, unpleasant withdrawal — this is an expected trade-off, not a sign anything went wrong with the reversal. Flumazenil plays the same reversal role for benzodiazepine overdose specifically, and should not be confused with naloxone's opioid-specific mechanism — giving naloxone for a pure benzodiazepine overdose, or flumazenil for a pure opioid overdose, does nothing for the actual cause of the respiratory depression."},
   {h:"General nursing approach during withdrawal and treatment"},
   {list:[
    "Maintain a <strong>nonjudgmental approach</strong> throughout every interaction, regardless of the substance or the circumstances that led to admission",
    "<strong>Seizure precautions</strong> for any patient at risk (alcohol or benzodiazepine withdrawal in particular)",
    "<strong>Suicide precautions</strong> as appropriate, given how commonly substance use disorders co-occur with depression and suicidality",
    "A <strong>calm environment with minimized stimuli</strong> — overstimulation can worsen agitation and autonomic symptoms during withdrawal",
    "<strong>Small, frequent meals</strong> with fresh fruits and vegetables to help rebuild nutritional status",
    "Help the patient build a <strong>safety plan with concrete coping strategies</strong> for cravings and triggers, not just a plan for the inpatient stay",
    "<strong>Set clear limits</strong> around manipulative behavior, paired with <strong>positive reinforcement</strong> for progress — consistency among staff matters here just as it does in other conditions where manipulation is a coping pattern"]},
   {h:"Why early, effective treatment matters — the complications of untreated chronic substance use"},
   {p:"Chronic substance use disorders carry a long list of possible complications that make early identification and treatment a genuine safety issue, not just a quality-of-life one: <strong>cardiac or respiratory arrest, intracranial hemorrhage, AIDS, subacute bacterial endocarditis, hepatitis, cirrhosis, septicemia, pulmonary emboli, malnutrition, depression with suicide risk, and psychosis</strong>. Framing treatment this way — as prevention of these downstream complications, not just cessation of use — can also help make the case to a resistant or ambivalent patient."},
   {h:"A medication not yet covered: cocaine withdrawal"},
   {p:"For cocaine withdrawal specifically, <strong>amantadine</strong> or <strong>bromocriptine</strong> may be used to ease symptoms — worth knowing alongside the alcohol-, benzodiazepine-, and opioid-specific agents already covered in this unit, since cocaine withdrawal management looks different from all three."}
  ],
  check:{stem:"A nurse administers naloxone to a patient found unresponsive with slow, shallow respirations after opioid use. What should the nurse anticipate immediately afterward?",
   options:["The patient will wake up calm and comfortable with no further symptoms","The patient will likely go into acute opioid withdrawal","The patient will remain unresponsive with no change","Naloxone has no effect on respiratory rate"],
   answer:1,
   why:"Naloxone rapidly reverses opioid effects, which restores respiration but also precipitates immediate, acute withdrawal symptoms — an expected and necessary trade-off for reversing a life-threatening overdose."}
}

const MH_EATING = { title:"Eating Disorders", group:"mh", sub:"Anorexia nervosa, bulimia nervosa, and binge-eating disorder.", lessons:[
{ id:"mh-anorexia", title:"Anorexia Nervosa", kicker:"BMI thresholds, refeeding syndrome, and the deadliest mortality rate in psychiatry",
  blocks:[
   {p:"Anorexia nervosa involves fear of obesity, a distorted body image, preoccupation with food, and refusal to eat, with a perception of being overweight despite being emaciated. It may or may not be accompanied by a loss of appetite, and features reduced food intake/fasting, extensive exercising, self-induced vomiting, or use of laxatives or diuretics. It has a higher incidence in Western cultures with societal pressures on appearance and weight, primarily affects females ages 12–30 years (male incidence may be underestimated), and is associated with complex physiological, environmental, familial, and psychodynamic factors."},
   {hook:"Anorexia nervosa carries a mortality rate of roughly <strong>10–20%</strong> — the highest of any psychiatric disorder. Death results from either the medical complications of starvation (most often cardiac) or from suicide, which is why aggressive medical monitoring and psychiatric safety assessment both matter from the first encounter, not just after the patient is medically stable."},
   {h:"Two subtypes"},
   {list:[
    "<strong>Restricting type</strong> — weight loss is achieved through not eating and increased exercise",
    "<strong>Binge-eating/purging type</strong> — the person periodically eats a large amount of food and then self-induces vomiting or otherwise purges, similar in behavior to bulimia but occurring alongside the significantly low body weight that defines anorexia"]},
   {h:"Priority assessments/cues"},
   {list:[
    "<strong>Weight and BMI</strong> — weight may be less than 85% of normal weight; BMI less than 17, and less than 15 is considered extreme",
    "<strong>Eating pattern</strong> — restricted amount and/or timing of eating, may also include binging and purging",
    "<strong>Physical assessment</strong> — lanugo (downy-like body hair), peripheral edema from low serum protein levels, amenorrhea, emaciated appearance, muscle/bone loss, constipation, cold extremities, bradycardia, dehydration, orthostatic hypotension",
    "Depression, anxiety, guilt, self-blame, preoccupation with appearance, distorted perceptions of body and appearance, stressors, secrecy, boredom, low self-esteem, history of trauma or relationship dysfunction",
    "Use standardized screening tests including the Eating Disorders Inventory, Body Attitude Test, Eating Attitudes Test, or Diagnostic Survey for Eating Disorders"]},
   {h:"HUNGER — the key features of anorexia nervosa"},
   {p:"A memory jogger for the core clinical picture: <strong>H</strong>ates the way their body looks; <strong>U</strong>nrealistic image of their body (distorted body image); <strong>N</strong>ever satisfied with weight loss (never \"thin enough\"); <strong>G</strong>rossly reduced food intake; <strong>E</strong>xcessive exercise; <strong>R</strong>efusal to maintain a healthy/normal body weight."},
   {h:"SCOFF — a five-item screening questionnaire"},
   {p:"A quick screening tool for eating disorders (two or more \"yes\" answers suggests further evaluation is needed): do you make yourself <strong>S</strong>ick because you feel uncomfortably full? Do you worry you've lost <strong>C</strong>ontrol over how much you eat? Have you recently lost more than <strong>O</strong>ne stone (about 14 lb) in a 3-month period? Do you believe yourself to be <strong>F</strong>at when others say you are too thin? Would you say that <strong>F</strong>ood dominates your life?"},
   {h:"Prevalence, onset, and genetics"},
   {p:"Onset of anorexia is often associated with a stressful life event, most commonly in adolescence. Researchers suspect an interplay of genetic, biological, behavioral, environmental, family, and psychosocial factors — first-degree relatives of someone with anorexia have an increased incidence of the disorder, supporting a genetic component alongside the well-documented sociocultural pressure toward thinness."},
   {h:"Prognosis"},
