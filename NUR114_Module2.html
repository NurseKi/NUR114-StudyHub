    "Ensure clients' safety when suicide is a concern — ensure the client is taking medications, not \"stockpiling\" for overdose, make frequent rounds at irregular times",
    "Many antidepressant medications take <strong>2–4 weeks</strong> to take effect and should not be combined or stopped abruptly"]},
   {h:"Priority medications"},
   {list:[
    "<strong>Fluoxetine</strong> — oral SSRI antidepressant; take in the morning to avoid insomnia; educate the client on signs/symptoms of serotonin syndrome",
    "<strong>Duloxetine</strong> — oral SNRI antidepressant; may cause orthostatic hypotension, sweating, constipation; also treats anxiety, fibromyalgia, chronic musculoskeletal pain, and peripheral neuropathy",
    "<strong>Bupropion</strong> — oral norepinephrine-dopamine reuptake inhibitor (NDRI) antidepressant; also used for smoking cessation; may decrease seizure threshold; should not \"double-up\" doses if a dose is missed",
    "<strong>Amitriptyline</strong> — oral tricyclic antidepressant (TCA); take at night due to sedative effects; watch for anticholinergic side effects and signs of toxicity",
    "<strong>Phenelzine</strong> — oral MAOI antidepressant; a later agent used if depression is refractory to other treatments; large number of food and drug interactions which may lead to hypertensive crisis (see the Medications unit for the full tyramine/\"cheese reaction\" detail)"]},
   {p:"This is the drug-name reference card for the SSRI/SNRI/TCA/MAOI class concepts already covered in the Medications unit — use that lesson for the shared serotonin-syndrome risk and the black-box warning that applies across all four classes, and this one to lock in which specific drug (and route/timing pearl) belongs to depression specifically."},
   {h:"Common drug names by class — the full roster"},
   {list:[
    "<strong>SSRIs</strong> (first-line for most patients — fewer of the disturbing side effects of TCAs/MAOIs): fluoxetine (Prozac), sertraline (Zoloft), paroxetine (Paxil), citalopram (Celexa), escitalopram (Lexapro), fluvoxamine (Luvox)",
    "<strong>SNRIs</strong> (often second-line): venlafaxine (Effexor), duloxetine (Cymbalta)",
    "<strong>TCAs</strong> (older class, effective but a narrow safety margin — overdose can be quickly lethal, and most carry a black-box suicide warning, so they're generally not first-line anymore): amitriptyline (Elavil), imipramine (Tofranil), nortriptyline (Pamelor), desipramine (Norpramin), doxepin (Sinequan), amoxapine (Asendin), trimipramine (Surmontil)",
    "<strong>MAOIs</strong> (reserved for treatment-refractory depression given the food/drug interaction risk): phenelzine (Nardil), isocarboxazid (Marplan)",
    "<strong>Atypical antidepressants</strong> (mechanisms less well understood than the classes above; generally second-line): bupropion (Wellbutrin) and mirtazapine (Remeron)"]},
   {h:"Priority teaching/discharge needs"},
   {list:[
    "Referral to support groups, counseling services, mental health clinics, crisis intervention",
    "Encourage adherence to medication regimens, discuss expected outcomes and timing of anticipated effects, do not stop taking medications abruptly",
    "Recognize early signs of worsening depression and notify the health care provider",
    "Ensure family education and support, awareness of the client's risk for suicidality, potential signs of suicidality, means to keep the client safe, and emergency procedures"]}
  ],
  check:{stem:"A nurse is talking with a depressed client who says, \"Nothing I do matters anyway.\" Which response is most therapeutic?",
   options:["\"That's not true, plenty of things you do matter!\"","\"Try to think more positively — it will help.\"","\"It sounds like you're feeling really hopeless right now. Can you tell me more?\"","\"Everyone feels that way sometimes, it will pass.\""],
   answer:2,
   why:"Reflecting the feeling back and inviting the patient to elaborate is therapeutic; the other options minimize, argue with, or generalize away the patient's stated experience rather than exploring it."}
},
{ id:"mh-bipolar", title:"Bipolar Disorder", kicker:"Six named types, the Altman mania scale, and the full mood-stabilizer medication card",
  blocks:[
   {p:"Bipolar disorder is a chronic mood disorder manifested with cycles of depression and mania (a persistent elevation in mood, including exaggerated and risk-laden behaviors, hyperactivity, and symptoms of psychosis) or hypomania (distinct but less severe symptoms of mania). <strong>Mood</strong> is a significant and sustained emotion that impacts a person's perception of the world; <strong>affect</strong> is the external appearance of that emotional experience. Bipolar disorder impacts about 2.6% of the US population, with 83% of those affected profoundly impacted — it affects all sexes and ages equally, with onset typically between 18–20 (some sources cite an average around 25), and it's often misdiagnosed or undiagnosed."},
   {h:"Affect vocabulary — high-yield therapeutic-communication terms"},
   {p:"Affect and mood questions like to test precise vocabulary. Know these distinctions cold, since they show up across every mood and psychotic disorder lesson:"},
   {list:[
    "<strong>Blunted affect</strong> — a severe reduction in the intensity of outward emotional expression",
    "<strong>Flat affect</strong> — a complete or almost complete absence of outward emotional expression",
    "<strong>Constricted affect</strong> — a reduction (not a full restriction) in the intensity of outward emotional expression",
    "<strong>Inappropriate affect</strong> — affect that doesn't match the situation or the content of what's being said (e.g., laughing while discussing a death)",
    "<strong>Labile affect</strong> — rapid, easily changing affective expression unrelated to external events or stimuli — classic in mania"]},
   {h:"Six named types"},
   {list:[
    "<strong>Bipolar I</strong> — major depression with mania, the most severe form",
    "<strong>Bipolar II</strong> — major depression with hypomania, often misdiagnosed as depression alone",
    "<strong>Cyclothymic disorder</strong> — mild-to-moderate depression with hypomania that disrupts social and occupational functioning",
    "<strong>Rapid cycling</strong> — at least 4 distinct mood shifts in a 12-month period, associated with higher dysfunction and a poorer prognosis",
    "<strong>Substance/medication-induced bipolar disorder</strong> — directly caused by drugs during intoxication or withdrawal, or a reaction to other medications such as steroids",
    "<strong>Bipolar disorder due to a medical condition</strong> — electrolyte imbalance, brain tumor",
    "<strong>Disruptive mood dysregulation disorder</strong> — in childhood, manifested by severe irritability, temper tantrums, mood swings"]},
   {p:"Causation is attributed to hereditary, genetic, and physiological (neurotransmitter and neuroanatomical) elements along with stress and trauma. Bipolar disorder is comorbid with ADHD in children. Some patients with bipolar disorder do experience psychotic symptoms (hallucinations and/or delusions) — DSM-5 has a specific specifier, \"bipolar disorder with psychotic features,\" for this presentation. Don't assume psychosis always means schizophrenia."},
   {hook:"The risk-taking of a manic episode has real downstream consequences worth assessing for directly: increased risky sexual behavior raises the risk of STIs and unwanted pregnancy, and impulsive spending/gambling/investing can cause lasting financial harm. And the mood swings themselves carry serious mortality risk — the risk of suicide in bipolar disorder is 20- to 30-fold higher than in the general population, with a suicide attempt able to occur impulsively during either a manic or a depressive episode. Always screen directly, regardless of which pole the client currently presents in."},
   {h:"Priority assessments/cues"},
   {list:[
    "<strong>Altman Self-Rating Mania Scale</strong> — standardized screening tool",
    "Signs and symptoms of depression (see the Depression lesson)",
    "Mania, elation, inflated self-esteem, grandiosity, hyperactivity, agitation, distractibility, racing thoughts/flight of ideas, accelerated/forced speech, engagement in high-risk behaviors (substance use, promiscuity/unsafe sexual behaviors, excessive shopping, gambling, investing), irritability, frenzied motor activity, decreased need for sleep, rapid mood swings, lack of hygiene/self-care, weight loss (due to lack of eating), delusions",
    "May have mania behaviors severe enough to impact social and occupational functioning, or hypomania (similar behaviors that do not cause dysfunction), or may begin as cheerful but devolve to irritability and volatility",
    "Assess for danger to self and others, substance use disorder, eating disorders"]},
   {h:"Priority laboratory tests/diagnostic cues"},
   {list:["Electrolyte levels","Drug and toxicology screens"]},
   {h:"Priority interventions/collaborative actions"},
   {list:[
    "Individual or group therapy (self-help or support groups) and cognitive therapy",
    "Psychoeducational-focused family therapy concerning early warning signs and management of manic episodes",
    "Electroconvulsive therapy may be used in severe cases",
    "Consult a dietitian to ensure adequate calories, including finger foods and high-calorie shakes during acute episodes; monitor intake/output and calorie counts",
    "During acute manic episodes: decrease environmental stimuli such as lights and noise; remove dangerous objects, redirect energy to constructive activities when feasible; maintain a calm attitude, set limits on manipulation, and reinforce non-manipulative behaviors; use a team approach to care; support nutrition, sleep, and hygiene needs",
    "Support during depressive episodes (see the Depression lesson)"]},
   {h:"Priority actual & potential complications"},
   {list:["Negative events related to poor decision-making, high-risk behaviors","Physical exhaustion, life-threatening malnutrition","Delirious mania may lead to intensified symptoms that threaten safety of self and others, confused thinking, and stupor"]},
   {h:"Priority hypotheses for nursing care"},
   {list:[
    "Maintain calm, consistent care — allow staff to communicate openly and express frustrations to reduce staff splitting and promote consistent limit setting",
    "Treating with antidepressants may trigger a manic episode",
    "Medication non-compliance is a common cause of relapse — the client may enjoy symptoms of hypomania and mania and minimize negative consequences"]},
   {h:"Priority medications"},
   {list:[
    "<strong>Lithium carbonate</strong> — oral mood stabilizer, effective in about 1/3 of clients; a diuretic effect means monitoring serum sodium and water intake matters (see the Medications unit for the full LITH toxicity mnemonic)",
    "<strong>Valproic acid</strong> — oral anticonvulsant to stabilize moods; may increase suicidal thoughts and behaviors; may cause sedation, avoid alcohol; cannot be discontinued abruptly",
    "<strong>Olanzapine</strong> — oral atypical antipsychotic to manage symptoms associated with mania (impulsiveness, agitation, hyperactivity); take at night to enhance sleep; side effects include bloating, swelling, vision changes, poor balance"]},
   {h:"Priority teaching/discharge needs"},
   {list:[
    "Strictly adhere to the medication schedule per the discharge medication instruction sheet",
    "Know and watch for signs and symptoms of toxicity and side effects of each medication",
    "Avoid caffeine to ensure restful sleep",
    "See the follow-up record for scheduled blood draws or medication checks",
    "Attend scheduled therapy sessions to ensure management of acute and chronic signs and symptoms"]},
   {h:"Lithium: the mnemonic worth memorizing — LITH"},
   {p:"Lithium is the classic mood stabilizer for both bipolar disorder and, in some cases, schizophrenia, and its narrow safety margin makes it one of the highest-yield medications in this course. Its most common side effects are weight gain and dry mouth, but the real testable content is toxicity, which the mnemonic <strong>LITH</strong> organizes cleanly:"},
   {list:[
    "<strong>L</strong> — Levels over 1.5 mEq/L are toxic (therapeutic range is roughly 0.6–1.2)",
    "<strong>I</strong> — Increase fluid and salt intake, since sodium depletion raises lithium levels; lithium cannot be given to a dehydrated or hyponatremic patient, and diuretics — even caffeine — should be avoided because they promote fluid and sodium loss",
    "<strong>T</strong> — Toxic signs include excessive urination and thirst, vomiting and diarrhea, tremors, and confusion",
    "<strong>H</strong> — Hold NSAIDs, which can raise lithium levels to dangerous ranges by reducing renal clearance"]},
   {hook:"Notice the trap NSAIDs and diuretics both set: a patient on lithium who reaches for ibuprofen for a headache, or who starts a diuretic or a high-caffeine habit, can tip into toxicity without changing their lithium dose at all. Medication reconciliation for a lithium patient is really a search for anything that could shift fluid, sodium, or renal clearance."},
   {p:"Other mood stabilizers used alongside or instead of lithium include <strong>lamotrigine</strong> and <strong>divalproex</strong>, both of which lack lithium's narrow toxic window but carry their own monitoring requirements (lamotrigine for serious rash, divalproex for liver function and platelets)."}
  ],
  check:{stem:"A client with bipolar disorder has not slept in three days, is speaking rapidly about a plan to start five new businesses, and has spent her entire savings on supplies. Which symptom cluster best describes this presentation?",
   options:["Depressive episode","Hypomania","Manic episode with impulsivity and grandiosity","Generalized anxiety"],
   answer:2,
   why:"Decreased need for sleep, pressured speech, grandiose thinking, and impulsive spending together describe a manic episode — and the severity (emptying savings, days without sleep) points toward Bipolar I rather than the milder hypomania of Bipolar II."}
}

const MH_ANXIETY = { title:"Anxiety, OCD & Trauma-Related Disorders", group:"mh", sub:"Generalized anxiety, obsessive-compulsive disorder, and PTSD.", lessons:[
{ id:"mh-gad", title:"Anxiety Disorders", kicker:"Panic, phobias, and generalized worry — the full type breakdown, plus the anxiolytic medication card",
  blocks:[
   {p:"<strong>Anxiety</strong> is a subjective response to stress that impairs functioning in social and work contexts — feelings of dread, impending doom, fear, apprehension, or discomfort, which may or may not be associated with real stressors and may be out of proportion with the stressor. <strong>Fear</strong> is the cognitive response to a threat; <strong>anxiety</strong> is the emotional response. Anxiety is a common psychiatric disorder, twice as common in females than males, and can exist across the lifespan. It's attributed to biological, genetic, cognitive, and psychological causative factors, and often exists with comorbidities of depression, substance abuse, and other anxieties. Globally, roughly 3.6% of the population has an anxiety disorder, and anxiety disorders are the single most common mental health diagnosis across childhood, adolescence, and adulthood in the U.S. — with treatment, most people recover a full, productive life."},
   {h:"The four levels of anxiety — the single most-tested framework in this lesson"},
   {p:"Before memorizing any individual diagnosis, know this progression cold: as anxiety intensity rises, the perceptual field narrows and functioning drops in a predictable, stepwise way. This is exam gold because a case-stem description of behavior (\"pacing, screaming, unable to follow directions\") should let you name the level without the word \"anxiety\" ever appearing in the question."},
   {table:{head:["Level","Perceptual field","What it looks like"],rows:[
     ["Mild","Increased — sight and sound are sharper","Everyday tension; can motivate growth, creativity, and learning; restlessness, irritability, mild tension"],
     ["Moderate","Narrowed — selective inattention begins","Focus is on immediate concerns only; learning and problem-solving still occur, but require effort; physical symptoms (increased heart rate, GI upset, headache, urinary urgency, mild tremors)"],
     ["Severe","Significantly narrowed — focus on minute/scattered details","Feels like something bad is about to happen; all behavior is aimed at relieving the anxiety; learning and problem-solving are NOT possible; the client needs direction to focus; physical symptoms from sympathetic activation (nausea, dizziness, sleep disturbance, pounding heart, hyperventilation)"],
     ["Panic","Loss of rational thought/perceptual distortion","Dread and terror with a sense of impending doom; disorganized, can't perceive reality accurately or communicate/function effectively; increased or erratic motor activity (pacing, shouting) or complete withdrawal; if prolonged, can lead to exhaustion and death"]]}},
   {h:"Matching the intervention to the level"},
   {list:[
    "<strong>Mild–moderate:</strong> help the client identify the source of anxiety, encourage them to talk about feelings/concerns, identify thoughts and feelings that preceded the onset, encourage problem-solving, encourage gross motor exercise as an outlet",
    "<strong>Severe–panic:</strong> use a calm manner, remain with the client, minimize environmental stimuli, use clear/simple statements and a low-pitched voice, attend to physical needs first, provide gross motor activity (walk/pace with the nurse rather than trying to talk the client down with complex language) — the immediate priority at this level is always to decrease environmental stimuli and provide a calm, quiet environment"]},
   {hook:"A single line worth memorizing: the immediate nursing action for any client in acute anxiety is to decrease stimuli in the environment and provide a calm, quiet space — before anything else, including trying to talk through the trigger."},
   {h:"Types of anxiety disorders"},
   {list:[
    "<strong>Panic disorder</strong> — sudden feelings of doom, abrupt onset of physical symptoms, not triggered by a specific stressor or situation",
    "<strong>Generalized anxiety disorder (GAD)</strong> — unrealistic, persistent, and excessive worry about many stressors, occurring more days than not for a duration of at least 6 months, with impaired social and occupational functioning",
    "<strong>Phobias</strong> — persistent, exaggerated, irrational, and intense fear of a situation, object, or activity. <strong>Agoraphobia</strong> is fear of situations where escape may be difficult or help may not be available (being in a crowd of strangers, traveling in a car or airplane, being on a bridge), often leading to confinement to home. <strong>Social anxiety disorder</strong> is fear that one might do something embarrassing or be negatively evaluated by others, commonly manifested as fear of public speaking/performance but which can lead to chronic social isolation. Other specific phobias include fear of heights, snakes, dogs, and strangers",
    "<strong>Obsessive-compulsive disorder</strong> — see the OCD lesson",
    "<strong>Body dysmorphic disorder</strong> — an exaggerated belief that the body is deformed",
    "<strong>Trichotillomania</strong> — hair-pulling disorder",
    "<strong>Hoarding disorder</strong> — difficulty discarding and/or excessively acquiring objects regardless of value"]},
   {h:"Panic disorder — the details"},
   {p:"Panic disorder is anxiety in its most severe recurring form: unexpected panic attacks, plus persistent worry between attacks about having another one and about the consequences of the attacks — this in-between worry is itself part of the diagnosis, not just the attacks. A panic attack builds to peak intensity within about <strong>10–15 minutes</strong> and rarely lasts longer than <strong>30 minutes</strong>, though repeated attacks can recur for hours. Panic attacks can occur as a specifier of another condition (for example, \"PTSD with panic attacks\") rather than panic disorder itself — the label depends on context, not just the attack."},
   {p:"Roughly 4.7% of the U.S. population experiences panic disorder in their lifetime, twice as common in women, and it's genetically influenced (higher rates in first-degree relatives, higher concordance in identical twins). It's frequently complicated by major depressive disorder, and self-medication with alcohol or antianxiety drugs raises the risk of a co-occurring substance use disorder. Panic attacks and panic disorder both carry an increased risk of suicide attempts and suicidal ideation, especially with a comorbid mood disorder, personality disorder, or alcohol misuse."},
   {h:"Agoraphobia — the details"},
   {p:"Agoraphobia is an out-of-proportion fear of being in places or situations where escape might be difficult or embarrassing — open spaces, enclosed spaces, crowds, standing in line, or being outside the home alone. It can exist as its own diagnosis or alongside panic disorder, and without treatment it tends to worsen, in extreme cases confining the person to their home entirely. Women are diagnosed more often, and up to a third of people with agoraphobia also have a substance use disorder."},
   {h:"Generalized anxiety disorder — the diagnostic criteria box"},
   {p:"GAD has a moderate genetic risk (roughly 30%), closely tied to other anxiety and mood disorders. Diagnosis requires excessive anxiety and worry about several events/activities for more than 6 months, plus at least 3 of the following 6 symptoms, present more days than not: feeling restless or on edge, easily tired, poor attention/concentration, irritability, muscle tension, and sleep disturbance (trouble falling or staying asleep). The anxiety must cause significant distress or impaired functioning, without an underlying medical cause, concurrent substance use, or a better explanation from another mental health disorder."},
   {h:"Social anxiety disorder — the FEAR mnemonic"},
   {p:"Social anxiety disorder (social phobia) may be limited to performance situations (public speaking, playing music, athletics) or generalized to nearly any social interaction. The hallmark physical response is blushing; other physical signs include profuse sweating, trembling, nausea, and difficulty talking. Onset is typically in childhood/adolescence (median onset: mid-teens), it affects an estimated 3–7% of Americans, and people with social anxiety disorder carry a higher suicide rate than the general population."},
   {table:{head:["Letter","Stands for"],rows:[
     ["F","Fear of an object or a situation"],
     ["E","Emotional conflict occurring unconsciously"],
     ["A","Avoidant behavior demonstrated"],
     ["R","Reacts with severe anxiety"]]}},
   {h:"Specific phobia — the details"},
   {p:"Specific (simple) phobia is intense, irrational anxiety triggered by a specific object or situation — common enough to affect roughly 7.7–12.5% of the U.S. population over a lifetime, more common in women, with onset varying by the type of phobia. Left untreated, phobias tend to be lifelong (mean duration around 20 years), but exposure-based treatment carries an excellent prognosis. Three mechanisms are thought to explain how a specific phobia develops: <strong>direct conditioning</strong> (personally experiencing a traumatic event involving the object/situation), <strong>vicarious acquisition</strong> (watching someone else react fearfully, or witnessing a traumatic event involving the object/situation), and <strong>informational transmission</strong> (learning to be afraid through what other people or the media say about the object/situation)."},
   {h:"Priority assessments/cues"},
   {list:[
    "Consider use of standardized anxiety assessment scales",
    "Vital signs for tachycardia, tachypnea, hypertension",
    "Signs of vomiting, dyspnea, muscle tension, restlessness, diaphoresis, anxious expression, trembling, hyperventilation, syncope",
    "Symptoms of chest pain or pressure, nausea, palpitations, chills, hot flashes, feelings of choking, dizziness/lightheadedness, shortness of breath, abdominal pain, feeling unsteady, paresthesia, depersonalization, feeling of losing control, fear of dying, \"feeling on edge,\" excessive worry, feelings of powerlessness, lack of control, expressions of doubt about personal capacity, avoiding social events or activities, procrastination, withdrawal from decision-making or anxiety-producing situations, ritualistic behavior, preoccupation with stressor",
    "Manifestations may or may not have a trigger event or stressor",
    "Phobias include anxious response to the feared object, activity, or situation, including panic symptoms, sweating, tachycardia, dyspnea"]},
   {h:"Priority laboratory tests/diagnostic cues"},
   {list:["Serum toxicology — determine substance use","Labs based on physiological needs (hydration/nutritional status)","Diagnostic tests to rule out physiological etiology (cardiopulmonary disease)"]},
   {h:"Priority interventions/collaborative actions"},
   {list:[
    "Support the client in therapies: individual, cognitive, behavioral, along with medication",
    "Explore the client's perceptions of threat, discuss things that can and cannot be changed, explore coping and stress-management strategies, encourage independence and decision-making",
    "Provide structured activity and distractions, replacing behaviors with constructive thoughts and coping mechanisms; controlled systematic desensitization (gradual exposure to stimuli) or implosion therapy (flooding with stimuli); allow for exploration, discussion, and reflection on thoughts and feelings",
    "Engage in de-escalation techniques as indicated",
    "During acute panic episodes: stay with the client, maintain a calm demeanor, manage hyperventilation (have the client breathe into a bag or slow, deep breathing), decrease environmental stimuli, use sedation if needed",
    "After the acute episode: explore sources of anxiety, identify triggers, signs of early onset of anxiety, how to cope/de-escalate/avoid escalation"]},
   {h:"Priority actual & potential complications"},
   {list:["Lack of social and occupational functioning, social withdrawal","Inability to meet personal daily needs","Sleep disturbances leading to physical exhaustion"]},
   {h:"Priority hypotheses for nursing care"},
   {list:[
    "Anxiety is contagious — nurses have a role in maintaining calm when clients are escalating",
    "De-escalation techniques may be effective in addressing rising anxiety",
    "A variety of therapies, with medications, are often needed to address the complexity and chronicity of anxiety"]},
   {h:"Non-drug treatment techniques worth naming"},
   {list:[
    "<strong>Cognitive-behavioral therapy (CBT)</strong> — first-line, often paired with medication; includes cognitive restructuring (replacing catastrophic thoughts with realistic ones) and a \"worry ledger\" (recording worries and the evidence for/against them)",
    "<strong>Systematic desensitization</strong> — gradual, stepwise exposure to the feared stimulus paired with relaxation training",
    "<strong>Implosion therapy (flooding)</strong> — direct, repeated exposure to the fear-provoking stimulus without a gradual buildup, often paired with anxiety-provoking imagery",
    "<strong>Interoceptive conditioning</strong> — deliberately reproducing the physical sensations of a panic attack (e.g., via controlled hyperventilation or running stairs to induce tachycardia) so the client learns the sensation doesn't have to progress to a full attack",
    "<strong>Thought-stopping</strong> — the client learns to interrupt a negative/anxious thought with a distracting stimulus (snapping a rubber band, an internal \"stop\" cue) until the thought can be controlled without it",
    "<strong>Biofeedback</strong> — a device teaches the client to consciously control physiologic responses (heart rate, respiratory rate, skin temperature, perspiration) tied to anxiety",
    "<strong>Modeling/assertiveness training</strong> — the client observes appropriate behavior in the feared situation and practices standing up for themselves rather than responding passively or aggressively"]},
   {h:"Priority medications"},
   {list:[
    "<strong>Benzodiazepines</strong> — diazepam (Valium), alprazolam (Xanax), lorazepam (Ativan), clonazepam (Klonopin), chlordiazepoxide (Librium), clorazepate (Tranxene), oxazepam (Serax); oral or nasal for panic symptoms; increased potential for addiction and dependence — short-term or as-needed use only; client may become physically dependent and tolerant, may experience withdrawal symptoms; contraindicated in acute alcohol intoxication and narrow-angle glaucoma; monitor closely after each dose for a possible paradoxical disinhibitory (excitement) effect rather than calming, especially in older adults",
    "<strong>Buspirone (Buspar)</strong> — oral anti-anxiety drug; takes 10–14 days (up to 3–4 weeks) to be effective, not for as-needed use; causes less sedation and rarely leads to dependence or tolerance the way benzodiazepines do, but still interacts with alcohol as a central nervous system depressant; contraindicated with concurrent MAOI therapy",
    "<strong>SSRIs</strong> — sertraline (Zoloft), escitalopram (Lexapro), fluoxetine (Prozac), fluvoxamine (Luvox), paroxetine (Paxil) — first-line for GAD, panic disorder, social anxiety disorder, and specific phobia adjuncts; take with food in the morning; therapeutic effect may take up to 4 weeks; never stop abruptly (see the Medications unit for the full class detail and the black-box suicidality warning)",
    "<strong>SNRIs</strong> — venlafaxine XR (Effexor XR) and duloxetine (Cymbalta) — first-line alongside SSRIs for GAD and panic disorder; monitor blood pressure (can raise it at higher doses)",
    "<strong>Beta-blockers</strong> — propranolol (Inderal), used off-label specifically for performance-type social anxiety (public speaking, auditions); NOT effective for generalized social anxiety; take the apical pulse for a full minute before administering, and hold for bradycardia",
    "<strong>Alpha-2 agonist/ligand adjuncts</strong> — gabapentin (Neurontin) and pregabalin (Lyrica), used as first-line adjuncts particularly in social anxiety disorder",
    "<strong>Tricyclic antidepressants (TCAs)</strong> — imipramine (Tofranil), clomipramine (Anafranil) — older, second-line option; anticholinergic and cardiac side-effect burden is higher than SSRIs/SNRIs"]},
   {h:"Priority teaching/discharge needs"},
   {list:[
    "Reassure the client that healing is a long process, and there may be times of regression",
    "Encourage clients to maintain therapy and their medication regimen",
    "Counsel clients that most antianxiety agents cause sedation and orthostatic hypotension"]}
  ],
  check:{stem:"A client with generalized anxiety disorder reports feeling tense and on edge most days for the past eight months, with no single identifiable trigger. Which nursing intervention is most appropriate?",
   options:["Reassure the client repeatedly that nothing bad will happen","Explore the client's perceptions of threat and coping strategies, and support structured activity and cognitive/behavioral therapy along with medication","Encourage the client to avoid all stressful situations","Recommend the client stop attending work or school until anxiety resolves"],
   answer:1,
   why:"Exploring perceptions of threat and coping strategies, and combining therapy with medication, is the core nursing intervention for GAD. Repeated reassurance and avoidance both tend to reinforce anxious patterns rather than reduce them long-term."}

{ id:"mh-ocd", title:"Obsessive-Compulsive Disorder", kicker:"The obsession–anxiety–compulsion–relief cycle, plus the related-disorder family and medication card",
  blocks:[
   {p:"OCD is a group of disorders characterized by obsessive thoughts and compulsive behaviors. <strong>Obsessions</strong> are intrusive thoughts that are recurrent and stressful, may be recognized as irrational, but are so powerful and repetitive that they cannot be ignored — a person may try to repress or ignore them, but \"giving into\" the obsession allows for stress relief. <strong>Compulsions</strong> are repetitive and ritualistic behaviors or mental acts that individuals feel driven or forced to perform, are completed to reduce the associated anxiety that is generated by the obsession, and a significant dread of a negative event exists if the compulsion cannot be carried out. DSM-5 groups OCD together with a related-disorder family that shares the same obsession/compulsion structure:"},
   {list:[
    "<strong>Body dysmorphic disorder</strong> — fixation on a perceived flaw in appearance (often minimal or unnoticeable to others) with repetitive checking, grooming, reassurance-seeking, or surgery-seeking behavior; onset is usually before age 18, and roughly 70% of clients report a history of teasing or bullying; no medication carries an FDA indication specifically for BDD, but SSRIs are used off-label alongside CBT",
    "<strong>Hoarding disorder</strong> — persistent difficulty discarding possessions regardless of actual value, leading to clutter that congests living spaces; distinguished from ordinary collecting by disorganization and lack of pride in the items; frequently comorbid with depression, anxiety, and OCD itself; treated with CBT, motivational interviewing, skills training, and often an SSRI trial",
    "<strong>Trichotillomania</strong> (hair-pulling disorder) and <strong>excoriation disorder</strong> (skin-picking) — repetitive hair-pulling or skin-picking despite repeated attempts to stop, resulting in noticeable hair loss or skin lesions",
    "<strong>Substance/medication-induced obsessive-compulsive and related disorder</strong>, and <strong>obsessive-compulsive and related disorder due to another medical condition</strong> — obsessions, compulsions, or repetitive behaviors that developed during or after substance exposure or a diagnosed medical condition"]},
   {h:"The OCD cycle"},
   {p:"Engaging in compulsive behaviors is stress-relieving, but only temporarily — which is exactly why the cycle repeats. Common compulsions include handwashing, checking, ordering, praying, counting, and repeating words silently, and may be directly related to obsessive thoughts (fear of contamination leading to repeated handwashing). OCD involves obsessions and compulsions that cause social and/or occupational dysfunction, and behaviors take up more than one hour per day."},
   {h:"The four symptom dimensions"},
   {p:"OCD presentations cluster into four recognized symptom dimensions, and a client may show features of more than one at once:"},
   {list:[
    "<strong>Cleaning/contamination</strong> — fear of germs or contamination paired with excessive washing or cleaning rituals",
    "<strong>Symmetry/counting</strong> — need for exactness, evenness, or a \"just right\" feeling, paired with ordering, arranging, counting, or repeating rituals",
    "<strong>Forbidden or taboo thoughts</strong> — intrusive aggressive, sexual, or religious thoughts, often paired with mental rituals (silent praying, counting, reviewing)",
    "<strong>Harm</strong> — fear of causing harm to self or others, paired with checking rituals (locks, stove, that no one was hurt)"]},
   {hook:"OCD is equally common in males and females, affects roughly 2.3% of the general population, and usually begins gradually — adolescence/early adulthood in males, young adulthood in females. It's usually a chronic illness made more complex by a history of trauma, substance use, or a comorbid mood disorder (comorbid depression occurs in 20–60% of clients, and about 30% have a past or current tic disorder). It's associated with changes in the anatomy and physiology of the brain — hyperactivity in the cortico-striato-thalamo-cortical circuit on imaging — along with serotonin and dopamine signaling abnormalities. In children specifically, a sudden, dramatic onset of OCD symptoms following a streptococcal infection (strep throat, scarlet fever) raises suspicion for <strong>PANDAS</strong> (pediatric autoimmune neuropsychiatric disorders associated with streptococcal infections) — worth knowing as a pediatric red flag, though it is not the typical adult presentation. Cultural note: culturally prescribed rituals and practices (religious observance, mourning rituals) should not be mistaken for OCD unless they exceed what the person's culture prescribes, occur at times/places judged inappropriate by that culture, or interfere with social functioning."},
   {h:"Priority assessments/cues"},
   {list:[
    "Reports of ritualistic or compulsive behavior, obsessive thoughts, inability to meet basic needs or responsibilities",
    "Level of anxiety using standardized scales",
    "Level of anxiety when the client is unable to engage in OCD behaviors",
    "Engaging in alternative coping strategies to replace ritualistic behaviors",
    "<strong>Risk for suicide</strong> — up to half of clients with OCD report suicidal thoughts at some point; always screen directly, don't assume the ritualistic presentation rules it out",
    "<strong>Obsessive-Compulsive Inventory-Revised (OCI-R)</strong> — a self-rating questionnaire to assess severity of symptoms"]},
   {h:"Priority laboratory tests/diagnostic cues"},
   {p:"No lab tests diagnose OCD — diagnosis is clinical, based on DSM-5 criteria (time-consuming obsessions/compulsions, more than one hour per day, causing significant distress or impairment, not attributable to a substance or another medical condition)."},
   {h:"Priority interventions/collaborative actions"},
   {list:[
    "Foster a trusting environment, reassure clients that they are safe, use open-ended questions",
    "Stay with the client when in a panic or highly anxious",
    "Use brief messages, stay calm, describe agency routines",
    "Encourage slow, deep abdominal breaths",
    "Decrease environmental stimuli",
    "Manage hyperventilation — instruct the client to take several breaths in a paper bag, use sedation as needed",
    "Explore sources of anxiety once the \"attack\" has subsided",
    "Identify triggers or early onset of anxiety, how to deal with these including deep breathing, imagery, prayer, meditation, or exercise",
    "Ensure basic needs (food, rest, hygiene) are met first — compulsive rituals routinely crowd these out",
    "<strong>Do not interrupt a compulsive behavior unless it is unsafe</strong> — allow time for the ritual, but set limits on behaviors that would interfere with the client's physical well-being or safety",
    "Implement a structured schedule of simple activities, games, or tasks that distracts from and limits time available for rituals; establish a written contract with the client to gradually decrease the frequency of compulsive behaviors and reinforce nonritualistic behavior",
    "For specific OCD behaviors, consider use of controlled systematic desensitization (gradual exposure to stimuli) or implosion therapy (flooding with stimuli)",
    "<strong>Exposure and response prevention (ERP)</strong> — the behavioral treatment of choice: the client is gradually exposed to the feared obsession-triggering stimulus while being coached to resist performing the compulsion. Used alone as first-line for mild-to-moderate OCD, combined with medication for moderate-to-severe OCD; effective in roughly half of mild-to-moderate clients",
    "Explore coping strategies and anxiety-management methods to replace ritualistic behavior"]},
   {h:"The COPING mnemonic for nursing care"},
   {list:[
    "<strong>C</strong>oncerns and feelings discussed",
    "<strong>O</strong>ffer a structured routine that allows time for rituals",
    "<strong>P</strong>ractice thought-stopping skills",
    "<strong>I</strong>nitiate a behavioral contract to decrease rituals and reward nonritualistic behavior",
    "<strong>N</strong>urture effective problem-solving",
    "<strong>G</strong>et the patient to perform relaxation techniques"]},
   {h:"Priority actual & potential complications"},
   {list:["Substance use/abuse as self-medication","Generalized anxiety disorder","Major depressive disorder, risk for suicide"]},
   {h:"Priority hypotheses for nursing care"},
   {list:[
    "Times of stress, such as illness or trauma, may cause a client to revert to OCD behaviors, requiring the nurse to assist with coping mechanisms or refer to psychiatric consultation or counseling",
    "Provide methods to deal with stress including progressive muscle relaxation, yoga, exercise, music, meditation, imagery, prayer, or affirmations"]},
   {h:"Priority medications"},
   {list:[
    "<strong>SSRIs</strong> have been the first-line pharmacologic treatment for OCD for more than 30 years and are often dosed higher than for depression; five carry an FDA indication specifically for OCD — <strong>fluoxetine (Prozac), fluvoxamine (Luvox), paroxetine (Paxil), sertraline (Zoloft)</strong>, and the tricyclic <strong>clomipramine (Anafranil)</strong>; side effects of the SSRIs include sleep disturbance, headache, and restlessness",
    "<strong>Clomipramine</strong> — oral tricyclic antidepressant; may lower seizure threshold; side effects include orthostatic hypotension, sedation, sexual dysfunction",
    "SNRIs and other TCAs are also used, generally as second-line or augmentation options when SSRIs alone are insufficient"]},
   {h:"Priority teaching/discharge needs"},
   {list:[
    "Assist in recognizing and averting rising anxiety levels that lead to OCD behaviors",

    "Teach the client and family about the nature of the illness, management of illness, and the need for ongoing counseling"]}
  ],

{ id:"mh-ptsd", title:"Post-Traumatic Stress Disorder", kicker:"PTSD vs. acute stress disorder vs. adjustment disorder, and the full medication card",
  blocks:[
   {p:"Trauma occurs in response to an extremely stressful and distressing experience that leads to emotional shock and incurs significant and long-lasting psychological effects. A trauma response may arise from child abuse and neglect, sexual violence, accidents, injuries, prolonged illness, or exposure to natural disasters, war, or poverty. Post-traumatic stress disorder (PTSD) is a stress response to a triggering event that is outside usual human experience and of significant magnitude, with diagnosis based on severity of symptoms, persistence of more than a month, and significant impact on social or occupational functioning."},
   {h:"PTSD vs. acute stress disorder vs. adjustment disorder"},
   {list:[
    "<strong>Acute stress disorder</strong> — symptoms similar to PTSD, but resolution occurs within one month: recurrent memories, distressing dreams, intense reactions, depression, dissociative symptoms, avoidance behaviors, hypervigilance or hyperarousal",
    "<strong>Adjustment disorder</strong> — the triggering event is not as severe (such as failure, rejection, or divorce); the disorder is usually resolved within six months of the stressor, manifested as stress reactions to routine daily events, alterations in mood, difficulty coping, or altered relationships; ability to work and engage in social activities is retained; mood changes include tearfulness, feelings of hopelessness, nervousness, worry, restlessness; a history of conduct disorders — truancy, vandalism, reckless driving, fighting — may be present",
    "Adjustment disorders, as well as PTSD, may occur across the lifespan"]},
   {p:"Individual response to trauma is influenced by the severity and scope of the event and the individual's ego-strength, temperament, coping resources, perception of the event, and previous experiences with stress. Symptoms may occur immediately post-trauma or may be delayed, and emotional reactions may include guilt, anger, and aggression. Based on history (or family observations), a client may exhibit a pattern of difficulty accepting change or ineffective coping skills."},
   {h:"Priority assessments/cues"},
   {list:[
    "<strong>General</strong> — standardized tools to assess levels of depression and anxiety; risk for harm to self or others; elicit history from family and others as needed; substance use and abuse as a means to numb emotional response; nature of the triggering event, client's role in the event, timeframe of event, and any current effects of the event",
    "<strong>PTSD-specific</strong> — impact of trauma on self-care, relationships, work engagement in activities; determine event causing symptoms, client's role in event, current factors related to event; intrusive memories, dissociative reactions (flashbacks), nightmares, sleep disturbances; high level of anxiety or arousal (hypervigilance); avoidance behaviors of experiences or stimuli (noises, reminders of event); comorbid mood or substance use disorders; support systems, other coping mechanisms"]},
   {h:"Priority laboratory tests/diagnostic cues"},
   {p:"Serum alcohol levels and drug toxicology screens."},
   {h:"Priority interventions/collaborative actions"},
   {list:[
    "Encourage safety-related behaviors and provide precautions as needed",
    "Create a non-threatening environment with consistent caregivers",
    "Ensure a therapeutic, trusting relationship",
    "Stay with the client during flashbacks, nightmares, and intrusive memories",
    "Encourage communication about experiences and emotions at the client's pace",
    "Explore coping mechanisms and support systems — discuss coping mechanisms that were effective before the trauma",
    "Address the client's feelings of guilt or self-blame",
    "Promote healthy grieving (see the Grief priority exemplar)",
    "Allow for expression of pent-up anger, guilt, and frustration, including physical exercise, walking, work, and creative expression (artwork, poetry)",
    "Use role-play to act out stressful situations and potential responses",
    "Refer to trauma-informed therapy, including cognitive behavioral therapy, exposure therapy, group and family therapy, self-help groups, crisis intervention, and eye movement desensitization and reprocessing (allows the client to process traumatic events while focusing on external stimuli)",
    "Consider the impact of trauma on victims and the need for increased awareness and resources in the community, advocating for clients with these experiences as they work through their trauma"]},
   {h:"Priority actual & potential complications"},
   {list:["Suicide, harm to self or others","Debilitating social and/or occupational dysfunction","Substance use disorder"]},
   {h:"Priority hypotheses for nursing care"},
   {list:[
    "Need for trauma-informed care — nurses must recognize the prevalence of trauma-related incidents and identify signs/symptoms in clients to avoid retraumatizing",
    "Some clients experience a variety of traumas in their lives, and nurses should employ sensitive and astute assessments to ensure clients receive needed assistance"]},
   {h:"Priority medications"},
   {list:[
    "<strong>Paroxetine</strong> — oral SSRI antidepressant; may take 1–4 weeks to be effective",
    "<strong>Amitriptyline</strong> — oral tricyclic antidepressant",
    "<strong>Carbamazepine</strong> — oral anticonvulsant; reduces intrusive thoughts and flashbacks",
    "<strong>Cannabinoids</strong> — oral; may help to calm the client, control symptoms, and stimulate appetite; clients with PTSD may have low endogenous cannabinoid levels",
    "<strong>Prazosin</strong> — oral antihypertensive used to manage recurrent nightmares"]},
   {h:"Priority teaching/discharge needs"},
   {list:[
    "Educate the family on the nature of traumatic responses, methods of intervention, and ongoing supports",
    "Community resources to provide support, including self-help groups, peer counseling, education, and protective respite care",
    "Reinforce past coping mechanisms that have proven effective",
    "Provide teaching about relaxation techniques and anxiety-reducing strategies"]}
  ],
  check:{stem:"A nurse caring for a client with PTSD needs to change a wound dressing. What is the most important consideration before beginning?",
   options:["Complete the task as quickly as possible without explanation","Approach the client calmly, explain each step before doing it, and avoid sudden or unannounced touch","Have security present for every interaction","Avoid discussing the trauma under any circumstances"],
   answer:1,
   why:"A non-threatening environment with consistent caregivers and a calmly explained approach reduces the risk of triggering a trauma response from sudden or unannounced touch — a core nursing consideration for any patient with PTSD, not just during formal therapy sessions."}
}

const MH_PSYCHOTIC = { title:"Psychotic Disorders", group:"mh", sub:"Schizophrenia and the medications used to treat it.", lessons:[
{ id:"mh-schizophrenia", title:"Schizophrenia", kicker:"The full spectrum of psychotic disorders, four symptom clusters, and the complete medication card",
  blocks:[
   {p:"Schizophrenia spectrum disorders are a spectrum of disorders with a variety of etiological factors (biological, psychological, and environmental), with a wide variety of treatments that must be tailored to the individual and their symptoms. They're characterized by thoughts and experiences not grounded in reality, disorganized thoughts, speech, or behaviors, and difficulty with daily activities and relationships. This spectrum includes schizophrenia and other psychotic disorders — delusional disorders, psychotic disorder induced by a medical condition/medication/substance use, brief psychotic disorder, and schizophreniform disorder."},
   {h:"The rest of the psychotic-disorder spectrum"},
   {list:[
    "<strong>Delusional disorders</strong> — clients have delusions (fixed, false beliefs) without bizarre behaviors, and are not severe enough to impair functioning: <strong>erotomanic</strong> (belief that high-status people are in love with them), <strong>grandiose</strong> (delusions of grand status, personal worth, and talents), <strong>jealous</strong> (perseverating that a sexual partner is unfaithful), <strong>persecutory</strong> (belief that they are being mistreated or spied on), <strong>somatic</strong> (delusions that the body is changing or diseased), <strong>reference</strong> (belief that ordinary events, objects, or other people's behavior have special personal meaning directed at them), <strong>nihilistic</strong> (belief that a catastrophe is about to occur), <strong>control</strong> (belief that an outside force, group, or person controls their thoughts, feelings, or behavior — including <em>thought withdrawal</em>, belief that thoughts are being removed, and <em>thought insertion</em>, belief that outside thoughts are being placed in their mind). Unlike schizophrenia, day-to-day functioning and cognition often stay intact outside the delusion itself — the presentation can look almost unremarkable except for the fixed false belief",
    "<strong>Schizoaffective disorder</strong> — a combination of schizophrenia's psychotic symptoms (hallucinations and/or delusions, disorganized thinking) together with a mood episode (depression or mania) in the same illness; prognosis tends to fall between schizophrenia and a mood disorder alone, and treatment combines an antipsychotic with an antidepressant or mood stabilizer depending on the mood component",
    "<strong>Psychotic disorder induced by medical condition, medication, or substance use</strong>",
    "<strong>Brief psychotic disorder</strong> — sudden onset of psychotic symptoms lasting less than one month, with return to previous level of functioning",
    "<strong>Schizophreniform disorder</strong> — symptoms of schizophrenia accompanying an episode of major depression and/or mania, not associated with substance use or another medical condition"]},
   {p:"Schizophrenia affects about 1% of the population; onset is in late adolescence and early adulthood, and may begin in childhood. It's a progressive disease with exacerbations and a chronic course, with phases including premorbid, prodromal, active (psychotic/acute schizophrenic episodes), and residual. Suicide is highly prevalent — one-third of clients have suicidal ideations, and 10% die from suicide."},
   {h:"Genetics and the dopamine hypothesis"},
   {p:"Schizophrenia runs strongly in families: in monozygotic (identical) twins, the concordance rate is 40–50% — if one twin develops it, the other has roughly a 50% chance — versus only 10–15% in dizygotic (fraternal) twins, confirming a substantial genetic component layered on top of environmental triggers (prenatal infection, birth complications, malnutrition before birth). The leading biochemical explanation is the <strong>dopamine hypothesis</strong>: hyperactivity of dopamine in the brain's limbic regions produces positive symptoms (hallucinations, delusions, agitation), while hypoactivity of dopamine in the prefrontal cortex produces negative symptoms (flattened affect, anhedonia, executive-function deficits). This single hypothesis explains why antipsychotics — which block dopamine — are much better at controlling positive symptoms than negative ones."},
   {h:"Onset by age and sex"},
   {p:"The first psychotic episode typically occurs earlier in males (18–25 years) than in females (25–35 years). <strong>Late-onset schizophrenia (LOS)</strong> refers to onset after age 40, and <strong>very-late-onset schizophrenia-like psychosis (VLOSLP)</strong> refers to onset after age 60 — both are more common in women, and medications in this older population are typically dosed more conservatively to reduce the risk of falls, sedation, orthostatic hypotension, and confusion."},
   {h:"Disease course and phases"},
   {p:"The illness moves through four phases: the <strong>prodromal</strong> phase (months to years before the first hospitalization, marked by withdrawal, peculiar behavior, and declining hygiene/functioning), the <strong>acute</strong> phase (florid psychotic symptoms, often triggered by a stressful event, frequently requiring hospitalization), <strong>stabilization</strong> (symptoms begin to diminish, often supported by outpatient or partial hospitalization), and the <strong>residual</strong> phase (positive symptoms mostly resolve, but negative symptoms like blunted affect and impaired role functioning may become more pronounced). The overall course is classified as mild (adherent to treatment, only 1–2 major relapses by age 45), moderate (inconsistent adherence, several relapses, symptoms persisting between relapses), or severe/unstable (nonadherent, frequent relapses, significant ADL impairment) — adherence to the drug regimen is the single biggest driver of which course a given patient follows."},
   {h:"Psychosis vs. schizophrenia — the key distinction"},
   {p:"This distinction is tested constantly because the two terms are so often confused. <strong>Psychosis</strong> is an episode of detachment from reality — it is a symptom that can be caused by sleep deprivation, substance use, another mental illness, or a medical condition, and it can be temporary. <strong>Schizophrenia</strong> is a specific, chronic mental illness for which psychotic symptoms (delusions and hallucinations) are only two of the possible diagnostic features, alongside disorganized speech, disorganized or catatonic behavior, and negative symptoms — and the diagnosis requires the six-month duration criterion. In short: every case of schizophrenia involves psychotic-type symptoms, but not every episode of psychosis is schizophrenia."},
   {h:"The four symptom clusters"},
   {table:{head:["Cluster","What it includes"],rows:[
     ["Positive symptoms","Delusions; hallucinations (distorted sensory perceptions); disorganized speech, including echolalia (echoing a previous word), incoherence, neologisms (new language), loose associations, \"word salad\" (speech or topics that do not make sense); disorganized behavior, including hyperactivity, hostility, agitation, catatonia, waxy flexibility, posturing, pacing, rocking, abnormal eye movement — symptoms that add something abnormal to experience"],
     ["Negative symptoms","Lack of speech, intonation, or gesturing; anhedonia, apathy, asociality, alogia, avolition (inability to move or initiate activity); poor hygiene, lack of self-care — symptoms that take something away from normal functioning"],
     ["Cognitive symptoms","Disorganized speech (a sign of disorganized thinking); concrete thinking (inability to think abstractly); anosognosia (the client does not believe they are ill); impairments possible in short-term memory, attention, information processing, and/or executive functioning"],
     ["Affective symptoms","Mood labile or incongruent with circumstances; flat or blunted affect, inappropriate or bizarre affect"]]}},
   {p:"\"Positive\" and \"negative\" here don't mean good and bad — they describe whether the symptom adds an abnormal experience (positive) or removes a normal one (negative). Negative, cognitive, and affective symptoms are the most difficult to treat, and may not respond to medication — this matters clinically because antipsychotic medications are generally far more effective against positive symptoms, which is why a well-medicated patient can still struggle significantly with motivation and social withdrawal even once hallucinations are controlled. Symptoms affect social functioning, relationships, quality of life, and the ability to perform ADLs and instrumental activities of daily living (IADLs)."},
   {h:"Speech and thought vocabulary — the exam-favorite word list"},
   {table:{head:["Term","Meaning"],rows:[
     ["Clang association","Rhyming or sound-alike words strung together with no logical connection (\"It's the rain, train, pain\")"],
     ["Flight of ideas","Rapid, continuous flow of speech that jumps from topic to topic, with some thread of connection that's hard to follow — classically a manic-state finding as well"],
     ["Word salad (schizophasia)","Illogical, random word groupings with no discernible meaning"],
     ["Neologisms","Made-up words that have meaning only to the client"],
     ["Loose associations","Haphazard, illogical shifting from one topic to another with no logical connection between them"],
     ["Echolalia","Pathological, parrot-like repetition of another person's words or phrases"],
     ["Echopraxia","Pathological repetition/mimicking of another person's movements"],
     ["Thought blocking","Sudden interruption/cessation of a thought mid-sentence, followed by an unrelated new thought"],
     ["Circumstantiality","Getting caught up in excessive, unnecessary detail before finally getting to the point"],
     ["Tangentiality","Wandering off in a new direction before ever reaching or completing the original point"],
     ["Confabulation","Filling a memory gap with a fabricated but believed-true detail, to preserve self-esteem — classically seen in Korsakoff psychosis"],
     ["Perseveration","Persistent repetition of the same word or idea in response to different questions"],
     ["Mutism","Absence of verbal speech altogether"],
     ["Pressured speech","Speech that feels forced out rapidly, as if the words can't come fast enough"],
     ["Religiosity","Excessive, often disorganized preoccupation with religious ideas"],
     ["Verbigeration","Purposeless, stereotyped repetition of words or phrases"],
     ["Magical thinking","Belief that one's own thoughts or wishes can control other people or outside events"],
     ["Waxy flexibility","A limb or the body stays in whatever position it's placed, as if made of wax"],
     ["Anosognosia","The client lacks awareness or insight that they are ill at all — distinct from simple denial"]]}},
   {h:"Priority assessments/cues"},
   {p:"Client history helps determine progression of symptoms: frequency and severity of psychotic episodes, current medications and level of compliance, suicidal ideation and previous attempts, comorbid illnesses including physical illnesses, substance use, anxiety, and depression, and learning and support needs."},
   {h:"Priority laboratory tests/diagnostic cues"},
   {list:["Complete blood count (CBC) — neutropenia","Metabolic panel — physical conditions","Serum alcohol levels and drug toxicology screens"]},
   {h:"Priority interventions/collaborative actions"},
   {list:[
    "General management includes medications with therapy (individual, group, family, behavioral, assertive community) to enhance social skills and self-care; acute phase focuses on client safety until medications manage signs and symptoms; stabilized phase focuses on client/family education needs and ensuring effectiveness of medications; maintenance phase focuses on adherence to medications and preventing relapse",
    "<strong>Interventions for self-directed violence</strong> — frequent, irregularly timed observations, suicide precautions, one-on-one supervision, no harmful objects in environment, investigate for suicidal ideations or plans, develop a no-suicide contract if appropriate",
    "<strong>Interventions for other-directed violence</strong> — low stimulus environment, promote communication, increased supervision, de-escalation, distraction, use seclusion and restraints only as a last resort",
    "<strong>Interventions for hallucinations</strong> — assess content, but do not reinforce perceptions (state inability to see, hear, or sense what the client is experiencing, use words such as \"the voices\" to differentiate them from reality), avoid touch, focus on client emotions or needs, distract/engage in activities, promote reality testing by providing evidence to discredit hallucinations, discuss association between stress and hallucinations, teach clients to use voice dismissal (verbally counter hallucinations)",
    "<strong>Interventions for delusions</strong> — assess content, promote trusting relationships with consistent caregivers, avoid touch, avoid whispering or laughing around the client (may suspect it is about them), orient to surroundings, promote reality testing but do not argue, focus on underlying needs, provide packaged or home foods if the client is suspicious of agency foods (client may also suspect foods from home)",
    "<strong>Interventions for relationships</strong> — encourage hygiene, promote self-care, develop a toileting schedule, encourage independence and decision-making as appropriate"]},
   {h:"Priority actual & potential complications"},
   {list:["Total social withdrawal and lack of participation in society","Depression, anxiety, suicidal ideation, substance use disorder","Side effects of medications — metabolic disorders, neurological damage","Frequent relapses associated with poor outcomes, leading to longer hospitalizations, higher costs, and greater disruptions to family and personal life"]},
   {h:"Priority hypotheses for nursing care"},
   {list:[
    "Be vigilant for clients who may be at risk for self- or other-directed harm",
    "Evaluate and treat for extrapyramidal symptoms — treatment may include changing the psychotropic medication, reducing the dose, or adding an anticholinergic agent",
    "Ensure a holistic, family approach to prevent caregiver role strain, abuse, neglect, and abandonment"]},
   {h:"Priority medications"},
   {list:[
    "<strong>Chlorpromazine</strong> — oral typical antipsychotic; risk for extrapyramidal symptoms (acute dystonic reaction, akathisia, pseudoparkinsonism, tardive dyskinesia), sedation, gynecomastia, metabolic syndrome, neuroleptic malignant syndrome",
    "<strong>Risperidone</strong> — oral atypical antipsychotic; encourage water or hard candy for dry mouth, may cause nausea and vomiting; risk for metabolic side effects, seizures, sexual dysfunction",
    "<strong>Clozapine</strong> — oral atypical antipsychotic; monitor for neutropenia and myocarditis; risk for metabolic side effects, sedation, orthostatic hypotension, anticholinergic toxicity",
    "<strong>Benztropine/diphenhydramine</strong> — oral anticholinergics to decrease extrapyramidal symptoms (EPS); increased anticholinergic effects: sedation, dry mouth, constipation, urinary retention, orthostatic hypotension"]},
   {h:"Priority teaching/discharge needs"},
   {list:[
    "Schizophrenia is chronic — importance of compliance with medications and therapy to reduce relapses and prolong functionality",
    "Smoking increases metabolism of antipsychotic drugs — refrain from smoking or adjust dosage accordingly",
    "Caution with activities, operating equipment, or work tasks due to orthostatic hypotension and sedation",
    "Maintain stable weight, sleep schedule, and stress-reduction activities",
    "Photosensitivity — importance of sunscreen",
    "Managing hallucinations and delusions by reducing stress and stimulation, using activities or other stimuli to distract or compete with sensory experiences, reality testing techniques, talking with a trusted friend or family member",
    "Support groups and reliable sources of education and support for both client and family",
    "Residential support options as recovery needs change: brief respite/crisis homes (24-hour clinical staff for acute stabilization), transitional group homes (structured daily living-skills training), foster/boarding homes and supported apartments (longer-term recovery and maintenance), and family or independent living for higher-functioning patients — matching the setting to the current phase of illness is itself a nursing judgment"]}
  ],
  check:{stem:"A client has experienced auditory hallucinations and disorganized speech continuously for the past seven months. Based on the diagnostic criteria, this presentation is most consistent with which condition?",
   options:["A brief psychotic episode","Schizophrenia","Normal grief reaction","Delirium"],
   answer:1,
   why:"Two or more characteristic symptoms (hallucinations and disorganized speech, both among the first three required symptoms) persisting for more than six months meets the diagnostic pattern for schizophrenia rather than a brief psychotic episode, which by definition resolves within one month."}
},
{ id:"mh-antipsychotics-overview", title:"Antipsychotics & Neuroleptic Malignant Syndrome", kicker:"Typical vs. atypical, and the emergency you can't miss",
  blocks:[
   {p:"Antipsychotic medications fall into two broad categories that differ in both their symptom coverage and their side effect profile."},
   {h:"Typical (conventional/first-generation) antipsychotics"},
   {p:"Typical antipsychotics work by blocking postsynaptic dopamine receptors and are effective primarily against positive symptoms (the \"+\" in the source material). Because of their side-effect burden, they've generally been replaced by atypicals as first-line therapy over the past decade, though a patient already stable and tolerating one may be kept on it. Their signature adverse effect is <strong>extrapyramidal symptoms (EPS)</strong> — caused by dopamine blockade in motor pathways rather than just the limbic system:"},
   {list:[
    "<strong>Dystonia</strong> — prolonged, repetitive muscle contractions causing twisting or jerking movements, especially of the neck, mouth, and tongue",
    "<strong>Parkinsonism (drug-induced)</strong> — bradykinesia, muscle rigidity, shuffling gait, stooped posture, flat affect, tremors, and drooling; may emerge anywhere from 1 week to several months after starting the drug",
    "<strong>Akathisia</strong> — subjective restlessness, an inability to sit or stand still, and pacing"]},
   {p:"EPS is treated with <strong>benztropine</strong> or <strong>diphenhydramine</strong>, both anticholinergic medications that counteract the movement side effects. High-potency typicals (haloperidol) carry the highest EPS risk; low-potency agents (chlorpromazine) are more sedating/anticholinergic and more likely to cause orthostatic hypotension, but carry less EPS risk. <strong>Examples:</strong> chlorpromazine, fluphenazine, haloperidol (Haldol), loxapine, molindone, perphenazine, pimozide, thiothixene, trifluoperazine."},
   {h:"Tardive dyskinesia"},
   {p:"A distinct, delayed-onset movement disorder from long-term antipsychotic use (typical or atypical): repetitive, involuntary, purposeless movements — grimacing, rapid eye blinking, tongue protrusion/smacking, lip puckering, and rapid movements of the hands, arms, legs, and trunk. Symptoms may resolve or may become permanent even after the drug is stopped, which is why early recognition matters."},
   {h:"Atypical (second-generation) antipsychotics"},
   {p:"Atypical antipsychotics cover both positive and negative symptoms (the \"+/-\") by combining dopamine blockade with increased serotonin activity, and as a class produce far fewer EPS/motor side effects and little to no prolactin elevation. Many atypical antipsychotic generic names end in \"-pine\" or \"-done,\" a pattern that's useful for quickly recognizing the drug class on an exam or a medication list. <strong>Examples:</strong> aripiprazole (Abilify), asenapine (Saphris), brexpiprazole (Rexulti), cariprazine (Vraylar), clozapine (Clozaril), iloperidone (Fanapt), lurasidone (Latuda), olanzapine (Zyprexa), paliperidone (Invega), quetiapine (Seroquel), risperidone (Risperdal), ziprasidone (Geodon)."},
   {p:"One atypical agent deserves a specific safety flag: <strong>clozapine</strong> can cause agranulocytosis — a dangerous drop in white blood cells (and neutrophils specifically) — which is why patients on clozapine require regular WBC/ANC monitoring throughout treatment; caught early, it's usually reversible. Clozapine also carries rare risk of cardiomyopathy and myocarditis, and should be used with extreme caution in older adults with dementia-related psychosis due to cardiovascular risk. Across the atypical class as a whole, the tradeoff for fewer motor side effects is <strong>metabolic syndrome</strong> — dyslipidemia, weight gain/obesity, hypertension, and hyperglycemia/new-onset diabetes — so baseline and ongoing metabolic monitoring (weight, glucose, lipids) is standard of care."},
   {h:"Long-acting injectable (depot) antipsychotics"},
   {p:"Several antipsychotics are available as long-acting injectable (LAI/depot) formulations given intramuscularly on a biweekly-to-monthly schedule, including aripiprazole, fluphenazine, haloperidol, olanzapine, paliperidone (both 4-week and 12-week versions), and risperidone. The clinical advantage is medication adherence: a patient who struggles to take a daily pill, or who has a history of stopping medication once symptoms improve, maintains steadier drug levels with an LAI, which helps prevent relapse, rehospitalization, and the difficult-course trajectory that comes with inconsistent treatment."},
   {h:"Neuroleptic malignant syndrome (NMS)"},
   {p:"NMS is a rare but life-threatening reaction to antipsychotic medications, marked by high fever, confusion, extremely rigid muscles, and altered consciousness (progressing to seizures if untreated) — it can occur hours to months after starting the drug or increasing the dose. It is a medical emergency requiring immediate discontinuation of the antipsychotic and supportive medical treatment — recognizing the fever-plus-rigidity pattern quickly is what separates a good outcome from a fatal one."},
   {hook:"Memory jogger for antipsychotic/schizophrenia treatment goals overall: <strong>PRESSURE</strong> — Psychiatric medications administered properly and monitored, Realistic perceptions and self-expectations developed, Environmental situations managed effectively, Safety needs addressed, Self-care performed adequately, Use of community resources on an ongoing basis, Relationships developed and sustained, Establishment and maintenance of family involvement in care."}
  ],
  check:{stem:"A patient taking clozapine requires which specific ongoing monitoring?",
   options:["Daily blood glucose checks","Regular white blood cell counts","Weekly EKGs","Monthly bone density scans"],
   answer:1,
   why:"Clozapine carries a risk of agranulocytosis (severely low white blood cell counts), so patients on this medication require regular WBC monitoring throughout treatment."}
}
]};
const MH_PERSONALITY = { title:"Personality Disorders", group:"mh", sub:"The 10-type taxonomy, borderline and antisocial personality disorder.", lessons:[
{ id:"mh-pd-overview", title:"Personality Disorders: The 10-Type Taxonomy", kicker:"Three categories, ten types — where borderline and antisocial fit in the bigger picture",
  blocks:[
   {p:"A personality disorder is the deviation of individual traits or characteristics from cultural norms or mores that is inflexible, impairs functioning, and contributes to dysfunctional behaviors. Causation is multifactorial, with both physiological and psychological influences. DSM-5 recognizes 10 types, officially grouped into three named <strong>clusters</strong> — know the cluster names themselves, since exam questions often test \"which cluster\" rather than the specific diagnosis. Personality disorders affect an estimated 12% of the U.S. population; some (antisocial, borderline) tend to soften in intensity by middle age, while others (obsessive-compulsive, schizotypal) tend to become more pronounced with age."},
   {table:{head:["Cluster","Behavior pattern","Types"],rows:[
     ["Cluster A","Odd or eccentric","Paranoid (pervasive distrust/suspicion of others' motives), schizoid (detached, indifferent to relationships, restricted emotional expression), schizotypal (odd thinking/speech, magical thinking, eccentricity — shares some features with schizophrenia but is a distinct diagnosis)"],
     ["Cluster B","Emotional, dramatic, erratic","Antisocial (disregard for rights of others, deceit, lack of remorse), borderline (unstable relationships/mood/self-image, impulsivity, fear of abandonment), histrionic (excessive emotionality, attention-seeking, seductive/theatrical), narcissistic (grandiosity, need for admiration, lack of empathy)"],
     ["Cluster C","Anxious or fearful","Avoidant (social inhibition, feelings of inadequacy, hypersensitivity to criticism), dependent (excessive need to be taken care of, difficulty making independent decisions), obsessive-compulsive personality disorder (perfectionism, rigidity, preoccupation with control and rules — distinct from OCD itself: no true obsessions/compulsions, and the person often sees the traits as correct rather than distressing)"]]}},
   {h:"General DSM-5 diagnostic criteria (applies across all 10 types)"},
   {p:"Every personality disorder is diagnosed against the same general framework, then further distinguished by disorder-specific criteria: an enduring pattern of inner experience and behavior that deviates markedly from the person's culture, showing up in two or more of cognition, affectivity, interpersonal functioning, or impulse control; the pattern is inflexible and pervasive across personal and social situations; it causes clinically significant distress or impairment; it's stable, long-standing, and traceable back to adolescence or early adulthood; and it isn't better explained by another mental disorder or by the physiologic effects of a substance or medical condition. In other words: patterns, not moments — a personality disorder doesn't develop overnight and isn't diagnosed off a single interaction."},
   {h:"Priority assessments/cues (shared across personality disorders)"},
   {list:[
    "Impaired social relationships, changes in cognition and affect, poor impulse control, emotional dysregulation",
    "Symptoms must be significant enough to impair functioning to meet the diagnostic threshold — individuals may manifest some characteristics of personality disorders at some point in their lives without meeting that bar",
    "Poor impulse control often manifests as acting out to manage internal pain — physical/verbal attacks, self-injurious behavior, manipulation, substance misuse, promiscuity, and suicide attempts",
    "Impaired judgment, impaired reality testing (often with projection of the person's own feelings onto others), impaired self-perception, and an impaired stimulus barrier (poor attention span, excessive response to noise/light, agitation)"]},
   {h:"Priority laboratory tests/diagnostic cues"},
   {list:["Tests to determine underlying physiological conditions — a genuine personality change can be the first sign of a neurologic, endocrine, or other medical illness (a frontal lobe tumor, for example), so this must be ruled out before attributing the presentation to a personality disorder","Serum toxicology if drugs or alcohol are suspected — intoxication can mimic personality-disorder features"]},
   {h:"General nursing interventions (apply across the personality-disorder family)"},
   {list:[
    "Maintain safety against self-destructive behaviors; ensure the whole care team responds consistently to acting-out behavior so the client can't play one staff member's response against another's",

    "Discuss expectations, responsibilities, and the consequences that follow specific behaviors; make clear that harm to self, others, or property is unacceptable",
    "Develop a written safety or behavioral contract with the client",
    "Identify and name splitting behavior directly when it occurs",
    "Encourage participation in group activities and praise nonmanipulative behavior; set and maintain limits to reduce manipulative behavior; remove the client from group situations where attention-seeking behavior is escalating",
    "Provide realistic praise for positive behaviors in social situations"]},

   {list:[
    "Nurses may encounter clients with personality disorders in any clinical setting, not only psychiatric units",
    "Management of clients with personality disorders may pose significant challenges to health care professionals",
    "Personality disorders are often chronic, characterized by exacerbations and remissions"]},
   {p:"The next two lessons work through the two Cluster B disorders most heavily tested — borderline personality disorder, organized around fear of abandonment, and antisocial personality disorder, organized around disregard for the rights of others — with their own specific assessments, interventions, and medication use."}
  ],
  check:{stem:"A nurse is orienting to a psychiatric unit and is told several clients carry a personality disorder diagnosis. Which statement best reflects an accurate understanding of these diagnoses?",
   options:["Personality disorders only appear on inpatient psychiatric units","A personality disorder is diagnosed when personality traits deviate from cultural norms and are inflexible enough to significantly impair functioning — nurses may encounter these clients in any clinical setting","Anyone who shows a single personality quirk has a personality disorder","Personality disorders are always curable within a few weeks of treatment"],
