e 5: Medications From Previous Content & NUR 113</a>"],["<strong>Sodium Polystyrene Sulfonate with Sorbitol (Kayexalate)</strong>","<a href=\"NUR114_Module3.html#m3-meds-lytes\">Module 3: Electrolyte Replacements & Treatments</a>"],["<strong>Sodium Zirconium Cyclosilicate (Lokelma)</strong>","<a href=\"NUR114_Module3.html#m3-meds-lytes\">Module 3: Electrolyte Replacements & Treatments</a>"],["<strong>Spinal anesthesia</strong>","<a href=\"NUR114_Module1.html#medanalgesia\">Module 1: Labor Analgesics & Anesthesia</a>"],["<strong>Spironolactone (Aldactone)</strong>","<a href=\"NUR114_Module3.html#m3-meds-diuretics\">Module 3: Diuretics</a><br><a href=\"NUR114_Module4.html#m4-meds-hf\">Module 4: Other Heart Failure Drugs</a>"],["<strong>SSRIs (selective serotonin reuptake inhibitors)</strong>","<a href=\"NUR114_Module2.html#mh-meds-antidepressants\">Module 2: Antidepressants: SSRI, SNRI, TCA & MAOI</a>"],["<strong>Stimulants (ADHD)</strong>","<a href=\"NUR114_Module2.html#mh-meds-stimulants\">Module 2: Stimulants (ADHD Medications)</a>"]]}},{"h":"T"},{"table":{"head":["Medication","Where to study it"],"rows":[["<strong>TCAs (tricyclic antidepressants)</strong>","<a href=\"NUR114_Module2.html#mh-meds-antidepressants\">Module 2: Antidepressants: SSRI, SNRI, TCA & MAOI</a>"],["<strong>Tenecteplase</strong>","<a href=\"NUR114_Module4.html#m4-meds-antiplatelet-lytic\">Module 4: Antiplatelets & Thrombolytics</a>"],["<strong>Tetanus toxoid</strong>","<a href=\"NUR114_Module5.html#m5-meds-tetanus\">Module 5: Tetanus Immunization</a>"],["<strong>Thiamine</strong>","<a href=\"NUR114_Module5.html#m5-meds-prev\">Module 5: Medications From Previous Content & NUR 113</a>"],["<strong>Thioridazine (Mellaril)</strong>","<a href=\"NUR114_Module2.html#mh-meds-antipsychotics\">Module 2: Antipsychotics: Brand/Generic Reference & EPS Management</a>"],["<strong>Thiothixene (Navane)</strong>","<a href=\"NUR114_Module2.html#mh-meds-antipsychotics\">Module 2: Antipsychotics: Brand/Generic Reference & EPS Management</a>"],["<strong>Ticagrelor</strong>","<a href=\"NUR114_Module4.html#m4-meds-antiplatelet-lytic\">Module 4: Antiplatelets & Thrombolytics</a>"],["<strong>Timolol (Timoptic)</strong>","<a href=\"NUR114_Module3.html#m3-meds-eyedrops\">Module 3: Eye Medications</a>"],["<strong>Trifluoperazine (Stelazine)</strong>","<a href=\"NUR114_Module2.html#mh-meds-antipsychotics\">Module 2: Antipsychotics: Brand/Generic Reference & EPS Management</a>"],["<strong>Typical antipsychotics (first-generation)</strong>","<a href=\"NUR114_Module2.html#mh-meds-antipsychotics\">Module 2: Antipsychotics: Brand/Generic Reference & EPS Management</a>"]]}},{"h":"V"},{"table":{"head":["Medication","Where to study it"],"rows":[["<strong>Valsartan</strong>","<a href=\"NUR114_Module4.html#m4-meds-raas\">Module 4: ACE Inhibitors, ARBs & ARNI</a>"],["<strong>Vasopressin</strong>","<a href=\"NUR114_Module5.html#m5-meds-prev\">Module 5: Medications From Previous Content & NUR 113</a>"],["<strong>Verapamil</strong>","<a href=\"NUR114_Module4.html#m4-meds-bb-ccb\">Module 4: Beta Blockers & Calcium Channel Blockers</a>"],["<strong>Vitamin D Analogs</strong>","<a href=\"NUR114_Module3.html#m3-meds-lytes\">Module 3: Electrolyte Replacements & Treatments</a>"],["<strong>Vitamin K (Phytonadione)</strong>","<a href=\"NUR114_Module1.html#mednewborn\">Module 1: Newborn Medications</a>"]]}},{"h":"W"},{"table":{"head":["Medication","Where to study it"],"rows":[["<strong>Warfarin (Coumadin)</strong>","<a href=\"NUR114_Module4.html#m4-meds-anticoag\">Module 4: Anticoagulants</a>"]]}},{"h":"Z"},{"table":{"head":["Medication","Where to study it"],"rows":[["<strong>Ziprasidone (Geodon)</strong>","<a href=\"NUR114_Module2.html#mh-meds-antipsychotics\">Module 2: Antipsychotics: Brand/Generic Reference & EPS Management</a>"]]}}]}]};
const FINAL_GLOSSARY = {"title":"Glossary","sub":"Key terms from Modules 1–5, alphabetized.","lessons":[{"id":"final-gloss-a","title":"Glossary A–C","kicker":"40 key terms from Modules 1–5","blocks":[{"h":"A"},{"table":{"head":["Term","Meaning","Source"],"rows":[["<strong>★ Alogia</strong>","Poverty of speech — reduced speech output or content, speaking little even when prompted","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>★ Anhedonia</strong>","Loss of interest or pleasure in activities that were previously enjoyable — a core negative symptom","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>★ Anosognosia</strong>","The client lacks awareness or insight that they are ill at all — distinct from simple denial","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>★ Apathy</strong>","Lack of feeling, emotion, interest, or concern","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>★ Asociality</strong>","Lack of interest in, or withdrawal from, social relationships and interaction","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>★ Avolition</strong>","Lack of motivation or drive to initiate and follow through on goal-directed activity — a core negative symptom","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>Activated charcoal</strong>","Binds many ingested toxins; does not work for alcohol, lithium, iron, or corrosives. Check bowel sounds first.","<a href=\"NUR114_Module5.html#poison-general\">Module 5</a>"],["<strong>Afterdrop</strong>","Cold blood from the extremities returning to the core during rewarming, which can trigger V-fib.","<a href=\"NUR114_Module5.html#env-hypothermia\">Module 5</a>"],["<strong>Afterload</strong>","Resistance the ventricle must overcome to eject blood (the pressure)","<a href=\"NUR114_Module4.html#m4-hemo\">Module 4</a>"],["<strong>Angioedema</strong>","Swelling of the lips, tongue, and airway tissues in anaphylaxis.","<a href=\"NUR114_Module5.html#anaph\">Module 5</a>"],["<strong>Anuria</strong>","Less than 50 mL of urine in 24 hours — Essentially no urine output — a severe finding that needs immediate provider notification","<a href=\"NUR114_Module3.html#elim-keyterms\">Module 3</a>"],["<strong>Apnea test</strong>","A 2-minute pause from the ventilator; no spontaneous breath confirms brain death.","<a href=\"NUR114_Module5.html#iicp-braindeath\">Module 5</a>"],["<strong>ARDS</strong>","Acute respiratory distress syndrome — collapsed, fluid-filled alveoli and impaired gas exchange.","<a href=\"NUR114_Module5.html#submersion\">Module 5</a>"],["<strong>Arteriosclerosis</strong>","Hardening and loss of elasticity of the arteries","<a href=\"NUR114_Module4.html#m4-hemo\">Module 4</a>"],["<strong>Atherosclerosis</strong>","Fatty deposits (plaque) building up on the inner walls of arteries — the type of arteriosclerosis behind CAD and ischemic stroke","<a href=\"NUR114_Module4.html#m4-hemo\">Module 4</a>"],["<strong>Azotemia</strong>","A rise in BUN, creatinine, uric acid, and other nitrogenous wastes in the blood — A lab finding — wastes are building up, whether or not the patient has symptoms yet","<a href=\"NUR114_Module3.html#elim-keyterms\">Module 3</a>"]]}},{"h":"B"},{"table":{"head":["Term","Meaning","Source"],"rows":[["<strong>Bacteremia</strong>","Bacteria in the blood — An infection (e.g., pyelonephritis) has spread beyond the urinary tract — watch for urosepsis","<a href=\"NUR114_Module3.html#elim-keyterms\">Module 3</a>"],["<strong>Banana bag</strong>","IV infusion with thiamine, folic acid, a multivitamin, and magnesium for chronic alcohol use or malnutrition.","<a href=\"NUR114_Module5.html#poison-od\">Module 5</a>"],["<strong>Biphasic reaction</strong>","Anaphylaxis symptoms that return 1–72 hours after clearing.","<a href=\"NUR114_Module5.html#anaph\">Module 5</a>"],["<strong>Burn shock</strong>","Hypovolemic shock from capillary leak after a major burn; treated with lactated Ringer's.","<a href=\"NUR114_Module5.html#burns-thermal\">Module 5</a>"]]}},{"h":"C"},{"table":{"head":["Term","Meaning","Source"],"rows":[["<strong>★ Catatonia</strong>","Marked psychomotor disturbance — ranges from stupor/immobility to excessive, purposeless motor activity","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>★ Clang association</strong>","Rhyming or sound-alike words strung together with no logical connection (\"It's the rain, train, pain\")","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>Caloric test</strong>","Ice water placed in the ear; no eye movement indicates brain death.","<a href=\"NUR114_Module5.html#iicp-braindeath\">Module 5</a>"],["<strong>Carboxyhemoglobin</strong>","Hemoglobin bound to carbon monoxide; pulse oximetry reads falsely normal, so an ABG with a carboxyhemoglobin level is needed.","<a href=\"NUR114_Module5.html#burns-special\">Module 5</a>"],["<strong>Cardiac output</strong>","HR × SV; the amount of blood pumped per minute","<a href=\"NUR114_Module4.html#m4-hemo\">Module 4</a>"],["<strong>Cardiogenic shock</strong>","Pump failure — crackles, JVD, high CVP; no fluid boluses.","<a href=\"NUR114_Module5.html#shock-types\">Module 5</a>"],["<strong>Cerebral perfusion pressure (CPP)</strong>","CPP = MAP − ICP. Normal 70–100 mm Hg; below 50 ischemia, below 30 necrosis, above 150 cerebral edema.","<a href=\"NUR114_Module5.html#iicp-cpp\">Module 5</a>"],["<strong>Chain of custody</strong>","Signed record of everyone who handles evidence; a broken chain makes evidence unusable in court.","<a href=\"NUR114_Module5.html#crisis-sane\">Module 5</a>"],["<strong>Chorioamnionitis</strong>","Infection of amniotic fluid and membranes — Look for maternal fever and foul-smelling amniotic fluid","<a href=\"NUR114_Module1.html#chartref\">Module 1</a>"],["<strong>Circumstantiality</strong>","Getting caught up in excessive, unnecessary detail before finally getting to the point","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>CIWA-Ar</strong>","Clinical Institute Withdrawal Assessment for alcohol; scores withdrawal (max 67) to guide benzodiazepines.","<a href=\"NUR114_Module5.html#poison-od\">Module 5</a>"],["<strong>Colonization</strong>","Microorganisms are present and may even be multiplying on/in the body, but aren't causing tissue damage or symptoms","<a href=\"NUR114_Module2.html#chartrefiis\">Module 2</a>"],["<strong>Coma</strong>","Unarousable; may show posturing (decorticate or decerebrate)","<a href=\"NUR114_Module5.html#iicp-assess\">Module 5</a>"],["<strong>Compartment syndrome</strong>","Pressure in a closed compartment cuts off circulation; the earliest cue is pain out of proportion that opioids do not relieve (the 6 P's).","<a href=\"NUR114_Module5.html#burns-acute\">Module 5</a>"],["<strong>Compliance</strong>","Ability of the ventricle or vessel to stretch and expand with volume","<a href=\"NUR114_Module4.html#m4-hemo\">Module 4</a>"],["<strong>Confabulation</strong>","Filling a memory gap with a fabricated but believed-true detail, to preserve self-esteem — classically seen in Korsakoff psychosis","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>Contractility</strong>","Force of the heart muscle's contraction","<a href=\"NUR114_Module4.html#m4-hemo\">Module 4</a>"],["<strong>Curling's ulcer</strong>","A stress ulcer after major burns; prevented with famotidine or a PPI.","<a href=\"NUR114_Module5.html#burns-acute\">Module 5</a>"],["<strong>Cushing's triad</strong>","Late sign of IICP from pressure on the medulla: hypertension with a widened pulse pressure, bradycardia, and irregular bradypnea.","<a href=\"NUR114_Module5.html#iicp-signs\">Module 5</a>"],["<strong>CVA</strong>","Stroke; complication of severe HTN/preeclampsia — ACHES danger sign; look for sudden weakness/facial drooping","<a href=\"NUR114_Module1.html#chartref\">Module 1</a>"]]}}]},{"id":"final-gloss-d","title":"Glossary D–H","kicker":"27 key terms from Modules 1–5","blocks":[{"h":"D"},{"table":{"head":["Term","Meaning","Source"],"rows":[["<strong>Decerebrate posturing</strong>","Arms extended and internally rotated, legs extended — midbrain damage; worse than decorticate.","<a href=\"NUR114_Module5.html#iicp-assess\">Module 5</a>"],["<strong>Decorticate posturing</strong>","Arms flexed in toward the core, wrists flexed, legs extended — damage above the midbrain.","<a href=\"NUR114_Module5.html#iicp-assess\">Module 5</a>"],["<strong>Diabetes insipidus (DI)</strong>","Too little ADH — large amounts of dilute urine and a high serum sodium; give fluids and vasopressin.","<a href=\"NUR114_Module5.html#iicp-signs\">Module 5</a>"],["<strong>DIC</strong>","Disseminated intravascular coagulation — clotting and bleeding at the same time; oozing from IV sites.","<a href=\"NUR114_Module5.html#shock-hypo\">Module 5</a>"],["<strong>Doll's eye (oculocephalic reflex)</strong>","Normal: the eyes move opposite to a head turn. Abnormal: the eyes stay fixed and move with the head (absent brainstem reflex).","<a href=\"NUR114_Module5.html#iicp-braindeath\">Module 5</a>"]]}},{"h":"E"},{"table":{"head":["Term","Meaning","Source"],"rows":[["<strong>★ Echolalia</strong>","Pathological, parrot-like repetition of another person's words or phrases","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>Echopraxia</strong>","Pathological repetition/mimicking of another person's movements","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>Eclampsia</strong>","Onset of seizures in a preeclamptic woman — Medical emergency; priority is airway and safety","<a href=\"NUR114_Module1.html#chartref\">Module 1</a>"],["<strong>Ejection fraction</strong>","Percentage of the ventricle's end-diastolic volume pumped out per beat; normal 50–70%","<a href=\"NUR114_Module4.html#m4-hemo\">Module 4</a>"],["<strong>End-tidal CO₂ (ETCO₂)</strong>","Exhaled CO₂; normal 35–45 mm Hg. Gold standard for confirming ET tube placement; below 10 during CPR = poor compressions; a sudden jump = ROSC.","<a href=\"NUR114_Module5.html#em-survey\">Module 5</a>"],["<strong>Eschar</strong>","Taut, inelastic burned tissue that can act like a tourniquet as edema builds underneath.","<a href=\"NUR114_Module5.html#burns-acute\">Module 5</a>"],["<strong>Escharotomy</strong>","Cutting through eschar to restore blood flow.","<a href=\"NUR114_Module5.html#burns-acute\">Module 5</a>"]]}},{"h":"F"},{"table":{"head":["Term","Meaning","Source"],"rows":[["<strong>★ Flight of ideas</strong>","Rapid, continuous flow of speech that jumps from topic to topic, with some thread of connection that's hard to follow — classically a manic-state finding as well","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>Fasciotomy</strong>","A deeper cut into the muscle fascia when escharotomy does not restore pulses.","<a href=\"NUR114_Module5.html#burns-acute\">Module 5</a>"]]}},{"h":"G"},{"table":{"head":["Term","Meaning","Source"],"rows":[["<strong>GBS Screening</strong>","Testing for Group B Strep at 35–37 weeks — If positive, mother needs IV antibiotics during labor","<a href=\"NUR114_Module1.html#chartref\">Module 1</a>"],["<strong>Glasgow Coma Scale (GCS)</strong>","Eye (4) + verbal (5) + motor (6); range 3–15. 8 or below = coma — \"less than 8, intubate.\"","<a href=\"NUR114_Module5.html#iicp-assess\">Module 5</a>"],["<strong>Glomerular filtration rate (GFR)</strong>","The volume of water filtered out of the plasma per unit of time — normal is 100–120 mL/min — The single best overall measure of kidney function; it falls as kidney disease progresses and is used to stage chronic kidney disease","<a href=\"NUR114_Module3.html#elim-keyterms\">Module 3</a>"],["<strong>Gravida</strong>","Total number of pregnancies, regardless of outcome — includes the current one","<a href=\"NUR114_Module1.html#precon\">Module 1</a>"]]}},{"h":"H"},{"table":{"head":["Term","Meaning","Source"],"rows":[["<strong>Heart murmur</strong>","Abnormal sound from turbulent blood flow, usually from a narrowed or leaking valve or a defect","<a href=\"NUR114_Module4.html#m4-hemo\">Module 4</a>"],["<strong>Heat stroke</strong>","Temperature above 104°F with hot, dry skin and mental status changes — a medical emergency.","<a href=\"NUR114_Module5.html#env-hyperthermia\">Module 5</a>"],["<strong>HELLP Syndrome</strong>","Severe preeclampsia variant: Hemolysis, Elevated Liver enzymes, Low Platelets — Life-threatening; requires immediate stabilization and delivery","<a href=\"NUR114_Module1.html#chartref\">Module 1</a>"],["<strong>Hematuria</strong>","Blood in the urine — Glomerular damage (glomerulonephritis), stones, infection, trauma, cyst rupture, or bleeding after a biopsy","<a href=\"NUR114_Module3.html#elim-keyterms\">Module 3</a>"],["<strong>Herniation</strong>","Brain tissue shifts from an area of high pressure to an area of low pressure; cuts off blood flow and signals impending brain death.","<a href=\"NUR114_Module5.html#iicp-signs\">Module 5</a>"],["<strong>HRIG</strong>","Human rabies immune globulin — passive immunity infiltrated around a bite wound with the first rabies vaccine dose.","<a href=\"NUR114_Module5.html#env-animal\">Module 5</a>"],["<strong>Hydrocephaly (hydrocephalus)</strong>","Abnormal buildup of CSF in the ventricles. Communicating = impaired absorption; noncommunicating = a physical block.","<a href=\"NUR114_Module5.html#hydro\">Module 5</a>"],["<strong>Hyperproteinemia</strong>","An excess of protein in the blood — Not the same as proteinuria — don't mix up blood vs. urine","<a href=\"NUR114_Module3.html#elim-keyterms\">Module 3</a>"],["<strong>Hypovolemic shock</strong>","Shock from lost circulating volume — flat neck veins, low CVP, tachycardia, cool clammy skin.","<a href=\"NUR114_Module5.html#shock-hypo\">Module 5</a>"]]}}]},{"id":"final-gloss-i","title":"Glossary I–M","kicker":"18 key terms from Modules 1–5","blocks":[{"h":"I"},{"table":{"head":["Term","Meaning","Source"],"rows":[["<strong>★ Incoherence</strong>","Speech that is disorganized and largely incomprehensible, lacking a logical connection between words or phrases","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>Infection</strong>","Microorganisms invade tissue, multiply, and cause cellular injury","<a href=\"NUR114_Module2.html#chartrefiis\">Module 2</a>"],["<strong>Infectious disease</strong>","The clinical, symptomatic manifestation of an infection","<a href=\"NUR114_Module2.html#chartrefiis\">Module 2</a>"],["<strong>Intracranial pressure (ICP)</strong>","Pressure inside the skull. Normal 0–15 mm Hg; over 20 is a problem.","<a href=\"NUR114_Module5.html#iicp-cpp\">Module 5</a>"],["<strong>Ischemic</strong>","Lacking adequate blood supply (and therefore oxygen) to a tissue","<a href=\"NUR114_Module4.html#m4-hemo\">Module 4</a>"]]}},{"h":"K"},{"table":{"head":["Term","Meaning","Source"],"rows":[["<strong>Ketonuria</strong>","Ketones present in urine — Body burning fat for energy; common in hyperemesis gravidarum","<a href=\"NUR114_Module1.html#chartref\">Module 1</a>"]]}},{"h":"L"},{"table":{"head":["Term","Meaning","Source"],"rows":[["<strong>★ Loose associations</strong>","Haphazard, illogical shifting from one topic to another with no logical connection between them","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>Lactate</strong>","Product of anaerobic metabolism; above 2 mmol/L means cells are not perfused.","<a href=\"NUR114_Module5.html#shock-hypo\">Module 5</a>"],["<strong>Linea Nigra</strong>","Dark vertical line on the abdomen in pregnancy — Normal integumentary change; fades after birth","<a href=\"NUR114_Module1.html#chartref\">Module 1</a>"],["<strong>Locked-in syndrome</strong>","A paralyzed person with the \"lights on\" — fully aware, but can move only the eyes. Jean-Dominique Bauby wrote The Diving Bell and the Butterfly by blinking his left eye — the diving bell is the paralysis, the butterfly is his mind.","<a href=\"NUR114_Module5.html#iicp-assess\">Module 5</a>"],["<strong>Lucid interval</strong>","A period of seeming normal after a head injury while pressure builds; the classic sign of an arterial (epidural) bleed.","<a href=\"NUR114_Module5.html#iicp-signs\">Module 5</a>"]]}},{"h":"M"},{"table":{"head":["Term","Meaning","Source"],"rows":[["<strong>Magical thinking</strong>","Belief that one's own thoughts or wishes can control other people or outside events","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>MODS</strong>","Multiple organ dysfunction syndrome — organs fail like dominoes, usually lungs (ARDS) first, then kidneys.","<a href=\"NUR114_Module5.html#shock-hypo\">Module 5</a>"],["<strong>Monro-Kellie hypothesis</strong>","The skull is a closed box that cannot expand; brain (80%), CSF (10%), and blood (10%) share the space, so a rise in one must be offset by another or ICP rises.","<a href=\"NUR114_Module5.html#iicp-mk\">Module 5</a>"],["<strong>Multigravida</strong>","Been pregnant more than once","<a href=\"NUR114_Module1.html#precon\">Module 1</a>"],["<strong>Multipara</strong>","Has carried two or more pregnancies to viability","<a href=\"NUR114_Module1.html#precon\">Module 1</a>"],["<strong>Mutism</strong>","Absence of verbal speech altogether","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>Myoglobinuria</strong>","Myoglobin from damaged muscle in the urine — tea-colored urine that can injure the kidneys.","<a href=\"NUR114_Module5.html#burns-special\">Module 5</a>"]]}}]},{"id":"final-gloss-n","title":"Glossary N–R","kicker":"23 key terms from Modules 1–5","blocks":[{"h":"N"},{"table":{"head":["Term","Meaning","Source"],"rows":[["<strong>★ Neologisms</strong>","Made-up words that have meaning only to the client","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>Neurogenic shock</strong>","Loss of sympathetic tone after spinal cord injury — bradycardia, hypotension, warm dry skin.","<a href=\"NUR114_Module5.html#shock-types\">Module 5</a>"],["<strong>Nulligravida</strong>","Never pregnant","<a href=\"NUR114_Module1.html#precon\">Module 1</a>"],["<strong>Nullipara</strong>","Never completed a pregnancy beyond 20 weeks","<a href=\"NUR114_Module1.html#precon\">Module 1</a>"]]}},{"h":"O"},{"table":{"head":["Term","Meaning","Source"],"rows":[["<strong>Oliguria</strong>","Less than 500 mL of urine in 24 hours — The kidneys are not producing enough urine to clear the day's wastes — fluid, potassium, and nitrogenous wastes start to accumulate","<a href=\"NUR114_Module3.html#elim-keyterms\">Module 3</a>"]]}},{"h":"P"},{"table":{"head":["Term","Meaning","Source"],"rows":[["<strong>★ Posturing</strong>","Voluntarily assuming and holding an inappropriate or bizarre body position for an extended time","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>★ Pressured speech</strong>","Speech that feels forced out rapidly, as if the words can't come fast enough","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>Para</strong>","Number of deliveries at or beyond 20 weeks, regardless of outcome","<a href=\"NUR114_Module1.html#precon\">Module 1</a>"],["<strong>PEEP</strong>","Positive end-expiratory pressure — holds the alveoli open and pushes fluid back into the vascular space.","<a href=\"NUR114_Module5.html#submersion\">Module 5</a>"],["<strong>Perseveration</strong>","Persistent repetition of the same word or idea in response to different questions","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>Persistent vegetative state</strong>","An unresponsive person — sleep–wake cycles and eyes may open, but no awareness. Terri Schiavo: at autopsy her brain weighed half of normal and she was blind; her \"tracking\" movements were brainstem reflexes, not awareness.","<a href=\"NUR114_Module5.html#iicp-assess\">Module 5</a>"],["<strong>Placenta Abruption</strong>","Placenta prematurely detaches from the uterine wall — Painful dark red bleeding, board-like rigid abdomen","<a href=\"NUR114_Module1.html#chartref\">Module 1</a>"],["<strong>Placenta Previa</strong>","Placenta covers/is near the internal cervical opening — Painless bright red bleeding; NO vaginal exams allowed","<a href=\"NUR114_Module1.html#chartref\">Module 1</a>"],["<strong>Preeclampsia</strong>","New-onset high BP + proteinuria after 20 weeks — Monitor for danger signs (headache, vision changes)","<a href=\"NUR114_Module1.html#chartref\">Module 1</a>"],["<strong>Preload</strong>","Volume of blood in the ventricle at the end of diastole (the stretch)","<a href=\"NUR114_Module4.html#m4-hemo\">Module 4</a>"],["<strong>Primigravida</strong>","Pregnant for the first time","<a href=\"NUR114_Module1.html#precon\">Module 1</a>"],["<strong>Primipara</strong>","Has delivered one pregnancy past viability (≥20 wks)","<a href=\"NUR114_Module1.html#precon\">Module 1</a>"],["<strong>Proteinuria</strong>","Protein in the urine — The glomeruli are leaking — a hallmark of kidney damage and of nephrotic syndrome","<a href=\"NUR114_Module3.html#elim-keyterms\">Module 3</a>"],["<strong>Pulmonary vascular resistance (PVR)</strong>","Resistance to flow out of the right ventricle created by the pulmonary circulation","<a href=\"NUR114_Module4.html#m4-hemo\">Module 4</a>"]]}},{"h":"R"},{"table":{"head":["Term","Meaning","Source"],"rows":[["<strong>Religiosity</strong>","Excessive, often disorganized preoccupation with religious ideas","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>Rhabdomyolysis</strong>","Muscle breakdown releasing myoglobin; tea-colored urine.","<a href=\"NUR114_Module5.html#env-hyperthermia\">Module 5</a>"],["<strong>ROME</strong>","Respiratory Opposite, Metabolic Equal — compare the pH arrow with the PaCO₂ and HCO₃ arrows to find the cause of an acid–base imbalance.","<a href=\"NUR114_Module5.html#m5math-rome\">Module 5</a>"],["<strong>ROSC</strong>","Return of spontaneous circulation after cardiac arrest.","<a href=\"NUR114_Module5.html#ws-acls-arrest\">Module 5</a>"]]}}]},{"id":"final-gloss-s","title":"Glossary S–Z","kicker":"20 key terms from Modules 1–5","blocks":[{"h":"S"},{"table":{"head":["Term","Meaning","Source"],"rows":[["<strong>SANE</strong>","Sexual Assault Nurse Examiner — an RN with specialized forensic training.","<a href=\"NUR114_Module5.html#crisis-sane\">Module 5</a>"],["<strong>Septic shock</strong>","Infection causing widespread vasodilation; treated with the 1-hour sepsis bundle.","<a href=\"NUR114_Module5.html#shock-types\">Module 5</a>"],["<strong>SIADH</strong>","Too much ADH — fluid retention and a low (dilutional) serum sodium; restrict fluids.","<a href=\"NUR114_Module5.html#iicp-signs\">Module 5</a>"],["<strong>SIRS</strong>","Systemic inflammatory response syndrome — the body's alarm: fever, tachycardia, tachypnea.","<a href=\"NUR114_Module5.html#shock-hypo\">Module 5</a>"],["<strong>SLUDGE</strong>","Salivation, lacrimation, urination, defecation, GI distress, emesis — nerve agent (sarin) poisoning.","<a href=\"NUR114_Module5.html#prep-plans\">Module 5</a>"],["<strong>START triage</strong>","Simple Triage and Rapid Treatment — walking wounded are green; RPM (respirations, perfusion, mental status) identifies red.","<a href=\"NUR114_Module5.html#prep-triage\">Module 5</a>"],["<strong>Stroke volume</strong>","Amount of blood pumped out of the ventricle with each beat","<a href=\"NUR114_Module4.html#m4-hemo\">Module 4</a>"],["<strong>Systemic vascular resistance (SVR)</strong>","Resistance to flow in the systemic circulation (the left ventricle's afterload)","<a href=\"NUR114_Module4.html#m4-hemo\">Module 4</a>"]]}},{"h":"T"},{"table":{"head":["Term","Meaning","Source"],"rows":[["<strong>★ Tangentiality</strong>","Wandering off in a new direction before ever reaching or completing the original point","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>Tachysystole</strong>","&amp;gt;5 contractions in 10 minutes — Turn off Pitocin immediately to prevent fetal hypoxia","<a href=\"NUR114_Module1.html#chartref\">Module 1</a>"],["<strong>Thought blocking</strong>","Sudden interruption/cessation of a thought mid-sentence, followed by an unrelated new thought","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>Thought broadcasting</strong>","A Schneiderian first-rank delusion: the belief that one's own thoughts are audible to others or are being transmitted/broadcast outward, distinct from thought withdrawal or thought insertion","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>Tonic immobility</strong>","The freeze response during trauma.","<a href=\"NUR114_Module5.html#crisis-sane\">Module 5</a>"]]}},{"h":"U"},{"table":{"head":["Term","Meaning","Source"],"rows":[["<strong>Uremia</strong>","Azotemia with symptoms — hyperkalemia, edema, anemia, and other systemic effects — A clinical syndrome — the waste buildup is now affecting other body systems","<a href=\"NUR114_Module3.html#elim-keyterms\">Module 3</a>"]]}},{"h":"V"},{"table":{"head":["Term","Meaning","Source"],"rows":[["<strong>Ventriculoperitoneal (VP) shunt</strong>","Tubing that drains excess CSF from a ventricle into the peritoneal cavity.","<a href=\"NUR114_Module5.html#hydro\">Module 5</a>"],["<strong>Ventriculostomy (EVD)</strong>","Catheter in a lateral ventricle that measures ICP and drains CSF; level the transducer with the tragus of the ear.","<a href=\"NUR114_Module5.html#iicp-cpp\">Module 5</a>"],["<strong>Verbigeration</strong>","Purposeless, stereotyped repetition of words or phrases","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"]]}},{"h":"W"},{"table":{"head":["Term","Meaning","Source"],"rows":[["<strong>★ Waxy flexibility</strong>","A limb or the body stays in whatever position it's placed, as if made of wax","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>★ Word salad (schizophasia)</strong>","Illogical, random word groupings with no discernible meaning","<a href=\"NUR114_Module2.html#mh-schizophrenia\">Module 2</a>"],["<strong>Wernicke's encephalopathy</strong>","Brain damage from thiamine deficiency; prevented by giving thiamine before or with glucose.","<a href=\"NUR114_Module5.html#poison-od\">Module 5</a>"]]}}]}]};
