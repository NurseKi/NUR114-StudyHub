 {type:"sata", stem:"Which findings are considered POSITIVE (definitive) signs of pregnancy? Select all that apply.",
  options:["Fetal heart tones detected by Doppler or fetoscope","Uterine enlargement","Fetal movement palpated by the examiner","Positive urine hCG test","Ultrasound visualization of the fetus"],
  answers:[0,2,4],
  why:"Positive signs are caused by nothing but the fetus itself: fetal heart tones, examiner-palpated fetal movement, and ultrasound visualization. Uterine enlargement and a positive hCG test are probable signs — objective but explainable by other conditions."},
 {type:"sata", stem:"Which assessments/tests are appropriately scheduled for the THIRD trimester? Select all that apply.",
  options:["Group B streptococcus culture at 35–37 weeks","1-hour glucose screen at 24–28 weeks","Fetal anatomy ultrasound","Non-stress testing for fetal well-being","Weekly visits beginning around 36 weeks"],
  answers:[0,3,4],
  why:"GBS culture (35–37 wks), non-stress testing, and weekly visits near term are third-trimester activities. The 1-hour glucose screen (24–28 wks) and the fetal anatomy ultrasound (18–22 wks) both occur in the second trimester."}
],
physio:[
 {stem:"A patient at 38 weeks has a fundal height 2 cm less than at her last visit. What is the nurse's best interpretation?",
  options:["This indicates fetal growth restriction requiring immediate ultrasound","This is expected — the fetus is descending into the pelvis (lightening)","This indicates the membranes have ruptured","This means the due date was miscalculated"],
  answer:1,
  why:"A decrease in fundal height near term reflects lightening — the fetal head descending into the pelvis. This is an expected finding, not a red flag."},
 {stem:"Why does a pregnant patient's hematocrit typically appear lower despite an actual increase in red blood cell mass?",
  options:["Red blood cells are being destroyed faster than normal","Plasma volume increases proportionally more than RBC mass, diluting the blood","Iron intake is universally inadequate in pregnancy","The placenta consumes maternal red blood cells"],
  answer:1,
  why:"Plasma volume rises 40–60% while RBC mass rises only 20–30%, producing physiologic (dilutional) anemia of pregnancy rather than true iron-deficiency anemia."},
 {stem:"A postpartum patient's WBC count is 24,000/mm³. She is afebrile with a clean, dry incision and normal afterpains. What is the nurse's best action?",
  options:["Notify the provider of probable infection immediately","Document this as an expected postpartum finding and continue routine assessment","Begin empiric antibiotics","Place the patient in isolation"],
  answer:1,
  why:"Leukocytosis is expected in pregnancy and can reach 25,000/mm³ postpartum. Without fever, drainage, or pain, this is a normal physiologic finding."},
 {type:"sata", stem:"Which interventions help address the hypercoagulable state of pregnancy and the postpartum period? Select all that apply.",
  options:["Early and frequent ambulation","Sequential compression devices or TED hose","Strict bed rest for the first week postpartum","Adequate hydration","Smoking cessation"],
  answers:[0,1,3,4],
  why:"Ambulation, SCDs/TED hose, hydration, and smoking cessation all reduce clot risk. Strict bed rest increases venous stasis and actually raises thrombosis risk — the opposite of the goal."},
 {type:"sata", stem:"Which gestational milestones are correctly matched to their timing? Select all that apply.",
  options:["Viability — 23–24 weeks","Term — 37 weeks","Full term — 40 weeks","Postdates — 38 weeks","Postdates — 40.1+ weeks"],
  answers:[0,1,2,4],
  why:"Viability begins at 23–24 weeks, term at 37 weeks, full term at 40 weeks, and postdates is 40.1+ weeks. 38 weeks is within the term range, not postdates."}
],
teach:[
 {stem:"Which statement by a patient at 10 weeks gestation indicates a need for further teaching?",
  options:["I will have my husband change the litter box","I will take Tylenol instead of ibuprofen for headaches","I will limit myself to one cup of coffee a day","I will relax in the hot tub for my back pain"],
  answer:3,
  why:"Hot tubs are avoided in pregnancy due to hyperthermia risk. Delegating litter box duty (toxoplasmosis), using acetaminophen, and staying under the 200 mg caffeine limit are all correct."},
 {stem:"A pregnant patient asks why douching is discouraged during pregnancy. What is the nurse's best explanation?",
  options:["It has no effect either way","It disrupts normal vaginal flora and increases infection risk","It is only a concern in the third trimester","It increases the risk of preterm labor only if performed after 20 weeks"],
  answer:1,
  why:"Douching disrupts the vagina's normal protective flora, increasing the risk of ascending infection."},
 {stem:"A patient reports light spotting at 9 weeks with no pain. What is the nurse's most appropriate response?",
  options:["Go to the emergency department immediately","Explain that light spotting can be normal, then review findings that DO require a call to the provider","Tell her the pregnancy is likely lost","Recommend using a tampon to monitor the amount"],
  answer:1,
  why:"Small amounts of spotting can be a normal finding. Findings requiring a call are heavy bleeding, leaking fluid, high BP/swelling, and abdominal pain. Tampons are avoided in pregnancy due to infection risk."},
 {type:"sata", stem:"Which patient statements about pregnancy practices are accurate? Select all that apply.",
  options:["'Exercise is encouraged, and I can generally continue what I did before pregnancy'","'I should stop exercising completely once I find out I'm pregnant'","'My seat belt should sit below my abdomen, not across it'","'Some vaccines, like Tdap, are recommended during pregnancy'","'I should start a brand-new intense workout routine now that I'm pregnant'"],
  answers:[0,2,3],
  why:"Moderate exercise, including continuing a pre-existing routine, is encouraged; seat belts should sit below the abdomen; and inactivated vaccines like Tdap are recommended. Pregnancy is not the time to start a new intense exercise regimen, and exercise should not be stopped entirely without cause."},
 {type:"sata", stem:"Which findings should a pregnant patient be instructed to report to her provider immediately? Select all that apply.",
  options:["Vaginal bleeding","Leaking of vaginal fluid","Mild round ligament pain with position changes","Decreased fetal movement","Severe or persistent headache with visual changes"],
  answers:[0,1,3,4],
  why:"Vaginal bleeding, fluid leakage, decreased fetal movement, and severe headache with visual changes (possible preeclampsia) all warrant immediate provider contact. Mild round ligament pain with position change is a common, benign finding."}
],
admit:[
 {stem:"Which admission assessment sequence is correct?",
  options:["Cervical exam first, then maternal vitals","Assess mom (vitals/history/birth plan), assess baby (FHR), ask about ROM/contractions, then perform the cervical exam","Ask about the birth plan only at discharge","Assess the fetus only after epidural placement"],
  answer:1,
  why:"The standard sequence is: assess mom, assess baby, ask mom about ROM/contractions, then check mom with a cervical exam."},
 {stem:"What is the normal fetal heart rate baseline range?",
  options:["90–110 bpm","110–160 bpm","160–200 bpm","60–100 bpm"],
  answer:1,
  why:"A normal FHR baseline is 110–160 bpm."},
 {stem:"Why is Leopold's maneuvers performed before applying continuous fetal monitors?",
  options:["To measure maternal blood pressure","To determine fetal lie, presentation, and position through abdominal palpation","To rupture the membranes","To assess cervical dilation"],
  answer:1,
  why:"Leopold's maneuvers are a systematic four-step abdominal palpation used to determine fetal lie, presentation, position, and estimated size before applying monitors or performing a vaginal exam."},
 {type:"sata", stem:"Which components are assessed on FHR monitoring? Select all that apply.",
  options:["Baseline rate","Variability","Accelerations","Decelerations","Maternal deep tendon reflexes"],
  answers:[0,1,2,3],
  why:"FHR monitoring evaluates baseline rate, variability, accelerations, and decelerations. Maternal deep tendon reflexes are a separate assessment, typically for suspected preeclampsia/magnesium toxicity."},
 {type:"sata", stem:"Which statements about fetal circulation are correct? Select all that apply.",
  options:["The umbilical cord normally contains two arteries and one vein","Oxygenation occurs in the fetal lungs before birth","The ductus arteriosus connects the pulmonary artery to the aorta","The foramen ovale allows blood to bypass the fetal lungs","The ductus venosus connects the umbilical vein to the inferior vena cava"],
  answers:[0,2,3,4],
  why:"The cord has 2 arteries and 1 vein. Oxygenation occurs at the placenta, NOT the fetal lungs. The ductus arteriosus (pulmonary artery→aorta) and foramen ovale (right atrium→left atrium) both bypass the fetal lungs, and the ductus venosus (umbilical vein→IVC) bypasses the liver."}
],
cervixpos:[
 {stem:"A cervical exam is charted as 6 cm/80%/+1. What does the '+1' indicate?",
  options:["The cervix is 1 cm thick","The fetal presenting part is 1 cm below the ischial spines","The patient has had one prior delivery","The cervix is 1 cm dilated"],
  answer:1,
  why:"Station is measured relative to the ischial spines (0 station). A positive number means the presenting part has descended past the spines toward the outlet."},
 {stem:"Which fetal position is associated with 'poor pushing' and back labor?",
  options:["Occiput anterior (OA)","Occiput posterior (OP)","Frank breech","Transverse lie"],
  answer:1,
  why:"Occiput posterior ('sunny side up') is associated with poor pushing, prolonged labor, and back pain — mom tires more easily and delivery is more difficult."},
 {stem:"Immediately after a patient's membranes rupture spontaneously, what is the nurse's priority action?",
  options:["Document the time of rupture","Assess the fetal heart rate","Change the bed linens","Notify housekeeping"],
  answer:1,
  why:"The umbilical cord can prolapse with the gush of fluid, compressing the cord and causing fetal distress — FHR is assessed immediately to rule this out."},
 {type:"sata", stem:"A patient is admitted at 8 cm dilation with the fetal head at −2 station, compared to another patient at 6 cm dilation with the head at +1 station. Which statements are accurate? Select all that apply.",
  options:["The patient at 6 cm may actually be closer to delivery","Dilation alone reliably predicts how close a patient is to delivery","Descent (station) matters as much as dilation in judging labor progress","The 8 cm patient will definitely deliver first","Fetal descent must occur before birth can happen regardless of cervical dilation"],
  answers:[0,2,4],
  why:"Station and dilation both matter — a fetus at +1 has descended past the spines and may be closer to delivery than one at 8 cm but still high at −2. Dilation alone does not reliably predict timing, and descent must still occur before birth regardless of how dilated the cervix is."},
 {type:"sata", stem:"Which findings should be assessed and documented immediately after rupture of membranes? Select all that apply.",
  options:["Color of the fluid","Amount of fluid","Odor/composition of the fluid","Fetal heart rate","Maternal shoe size"],
  answers:[0,1,2,3],
  why:"After ROM, the nurse assesses and documents fluid color, amount, composition (e.g., meconium staining), and fetal heart rate — all clinically relevant. Shoe size is irrelevant."}
],
stages:[
 {stem:"A patient is 2 cm dilated with mild contractions; her membranes just ruptured. Which phase of labor is this?",
  options:["Latent phase","Active phase","Transition phase","Second stage"],
  answer:0,
  why:"The latent phase spans 0–3 cm dilation with mild contractions, rupture of membranes, and fetal descent/engagement."},
 {stem:"Why is pushing encouraged WITH contractions rather than continuously?",
  options:["Pushing between contractions causes perineal tearing","The uterine contraction is already generating expulsive force — adding maternal effort during it uses less total energy","It prevents fetal heart rate changes","It shortens the third stage of labor"],
  answer:1,
  why:"The contraction itself provides expulsive force; coordinating voluntary pushing with it uses maternal energy more efficiently and reduces fatigue."},
 {stem:"How long does the third stage of labor (birth of infant to delivery of placenta) typically last?",
  options:["Immediately, with no time lag","5–30 minutes","1–4 hours","24 hours"],
  answer:1,
  why:"The third stage — from birth of the infant to placental delivery — typically lasts 5–30 minutes."},
 {type:"sata", stem:"Which assessments are part of the fourth-stage (recovery) maternal assessment? Select all that apply.",
  options:["Fundus","Lochia","Bladder","APGAR score","Perineum"],
  answers:[0,1,2,4],
  why:"Fourth-stage maternal assessment includes fundus, lochia, bladder, and perineum, along with pain, vital signs, and bonding. APGAR is a newborn assessment, not a maternal one."},
 {type:"sata", stem:"Which findings would the nurse expect during the transition phase (8–10 cm) of the first stage of labor? Select all that apply.",
  options:["Bloody show","Rectal pressure","Increased anxiety and hyperventilation","Mild, easily tolerated contractions","Nausea and vomiting"],
  answers:[0,1,2,4],
  why:"Transition is marked by bloody show, rectal pressure, hyperventilation/increased anxiety, and N/V as the fetus descends toward full dilation. Mild, easily tolerated contractions describe the latent phase, not transition."}
],
painmgmt:[
 {stem:"A patient at 9 cm and progressing rapidly requests an opioid analgesic. What is the nurse's greatest concern?",
  options:["It will completely stop labor","Opioids cross the placenta and can decrease the newborn's respiratory drive if given close to delivery","She will become addicted after a single dose","It will raise her blood pressure significantly"],
  answer:1,
  why:"Opioid analgesics cross to the fetus; a dose given too close to delivery can produce a newborn with a depressed respiratory drive."},
 {stem:"Which type of regional anesthesia is a single dose with no catheter, well suited to a procedure of predictable, finite length like a cesarean birth?",
  options:["Epidural","Spinal","Local infiltration only","Pudendal block only"],
  answer:1,
  why:"Spinal anesthesia is a single injection with no catheter left in place — appropriate for a cesarean birth's predictable, finite duration. An epidural, with its catheter, better fits labor's unpredictable length."},
 {stem:"A patient's blood pressure drops from 122/76 to 88/50 fifteen minutes after epidural placement. What is the nurse's priority concern?",
  options:["Spinal headache","Decreased placental perfusion affecting the fetus","Epidural catheter migration","Inability to push effectively later"],
  answer:1,
  why:"Sympathetic blockade from the epidural drops maternal blood pressure, which reduces placental perfusion — the fetus is affected before the mother notices symptoms herself. This is why BP is closely monitored after placement."},
 {type:"sata", stem:"Which medications/agents may be used for first-stage labor pain management? Select all that apply.",
  options:["Butorphanol","Nalbuphine","Epidural anesthesia","Magnesium sulfate","Meperidine"],
  answers:[0,1,2,4],
  why:"Butorphanol, nalbuphine, and meperidine are opioid analgesics; epidural anesthesia is also used for labor pain. Magnesium sulfate is used for seizure prophylaxis in preeclampsia and as a tocolytic — not a labor analgesic."},
 {type:"sata", stem:"Which nursing actions are appropriate after epidural placement? Select all that apply.",
  options:["Monitor maternal blood pressure closely for hypotension","Monitor fetal heart rate closely","Assist the patient to ambulate independently immediately after placement","Position the patient side-lying or supine with a wedge, avoiding flat supine positioning","Assess bladder for distention"],
  answers:[0,1,3,4],
  why:"After epidural placement, the priorities are monitoring maternal BP and FHR, avoiding flat supine positioning (risk of supine hypotension), and monitoring for bladder distention (sensation is reduced). Independent ambulation is unsafe immediately after placement due to motor block."}
],
complications:[
 {stem:"Two hours postpartum, a patient has heavy lochia and a boggy fundus displaced to the right of midline. What is the nurse's first action?",
  options:["Administer ordered oxytocin","Have the patient empty her bladder, or catheterize her","Notify the provider of a suspected laceration","Place the patient in Trendelenburg position"],
  answer:1,
  why:"A fundus displaced off midline suggests a full bladder preventing uterine contraction. Emptying the bladder is the first, mechanical fix before escalating to medication or notifying the provider."},
 {stem:"A patient in labor has a Bishop score of 3. What does this indicate?",
  options:["The cervix is fully ready for induction","The cervix is not yet favorable — a cervical ripening agent may be needed first","Labor will begin spontaneously within hours","No further assessment is needed"],
  answer:1,
  why:"A Bishop score of 8 or higher indicates readiness for induction. A score of 4 or less typically calls for a cervical ripening agent (e.g., Cervadil or Cytotec) before oxytocin induction. (Score is also adjusted: subtract 1 point for nulliparity, add 1 for each prior vaginal delivery.)"},
 {stem:"Which finding requires the nurse to STOP an oxytocin infusion immediately?",
  options:["Contractions every 3 minutes lasting 60 seconds","Uterine tachysystole with a non-reassuring fetal heart rate pattern","Maternal request for pain medication","A cervical change from 5 cm to 6 cm"],
  answer:1,
  why:"Uterine tachysystole (excessively frequent/prolonged contractions) with non-reassuring FHR indicates the uterus and fetus cannot tolerate the current stimulation — the infusion must be stopped immediately."},
 {type:"sata", stem:"Which are risk factors for postpartum hemorrhage from uterine atony? Select all that apply.",
  options:["Prolonged labor","Retained placental fragments","Bladder distention","A cephalopelvic disproportion diagnosed before labor began","Induction or augmentation of labor"],
  answers:[0,1,2,4],
  why:"Prolonged labor, retained placenta, bladder distention, and induction/augmentation are all listed uterine atony risk factors. Cephalopelvic disproportion is an indication for cesarean birth, not itself a hemorrhage risk factor."},
 {type:"sata", stem:"Magnesium sulfate is being administered for preeclampsia. Which findings indicate possible toxicity requiring the nurse to stop the infusion? Select all that apply.",
  options:["Absent deep tendon reflexes","Respiratory rate of 10/min","Urine output of 20 mL/hr for 2 hours","Blood pressure of 130/82 mmHg","Serum magnesium within the therapeutic range"],
  answers:[0,1,2],
  why:"Magnesium toxicity presents as loss of deep tendon reflexes, respiratory depression (RR <12/min), and decreased urine output. A blood pressure of 130/82 and a therapeutic magnesium level are not signs of toxicity."}
],
emergencies:[
 {stem:"A laboring patient develops a fever of 101.5°F, and the amniotic fluid has a foul odor. Which condition should the nurse suspect?",
  options:["Chorioamnionitis","Placental abruption","HELLP syndrome","Uterine rupture","Placenta previa"],
  answer:0,
  why:"Fever with foul-smelling amniotic fluid is the classic presentation of chorioamnionitis, an infection of the amniotic fluid and membranes — this ties to the 'odor' component of the COAT amniotic fluid assessment."},
 {stem:"A nurse notes a loop of umbilical cord protruding from the vagina before the fetal head. What is the priority nursing action?",
  options:["Attempt to push the cord back into the vagina","Position the patient in knee-chest or Trendelenburg and use a gloved hand to relieve pressure off the cord","Encourage the patient to push with the next contraction","Perform a fundal massage"],
  answer:1,
  why:"Cord prolapse is an obstetric emergency. The nurse positions the patient to relieve cord compression (knee-chest or Trendelenburg) and uses a gloved hand to hold the presenting part off the cord while preparing for immediate cesarean birth. The cord is never pushed back in."},
 {stem:"A postpartum patient develops a sudden seizure. She was previously diagnosed with preeclampsia. How is this classified?",
  options:["HELLP syndrome","Eclampsia","Chorioamnionitis","Placental abruption"],
  answer:1,
  why:"Eclampsia is defined as the onset of seizures in a patient with preeclampsia — a medical emergency where airway and safety are the priority."},
 {type:"sata", stem:"Which findings are consistent with HELLP syndrome? Select all that apply.",
  options:["Hemolysis","Elevated liver enzymes","Low platelets","Elevated blood glucose","Epigastric or right upper quadrant pain"],
  answers:[0,1,2,4],
  why:"HELLP stands for Hemolysis, Elevated Liver enzymes, and Low Platelets — a severe preeclampsia variant. Epigastric/RUQ pain is a classic associated symptom. Elevated blood glucose is not part of HELLP."},
 {type:"sata", stem:"Which maternal findings require the nurse to notify the provider immediately? Select all that apply.",
  options:["Severe headache with blurred vision","Decreased fetal movement","Epigastric or right upper quadrant pain","Mild ankle edema at the end of the day","Fever greater than 100.4°F (38°C)"],
  answers:[0,1,2,4],
  why:"Severe headache with vision changes, decreased fetal movement, epigastric/RUQ pain, and fever are all maternal danger signs requiring immediate provider notification. Mild, dependent ankle edema at day's end is a common, benign finding in pregnancy — facial/hand edema would be the concerning version."}
],
transition:[
 {stem:"Which three functions must the newborn take over independently at birth?",
  options:["Cardiac, respiratory, and body temperature regulation","Digestion, immunity, and vision","Hearing, motor function, and speech","Renal, hepatic, and endocrine function"],
  answer:0,
  why:"At birth the newborn becomes responsible for cardiac, respiratory, and thermoregulatory function — the placenta no longer performs these tasks."},
 {stem:"When is the APGAR score assessed?",
  options:["1 and 5 minutes only","1, 5, and 10 minutes","Every 15 minutes for the first hour","At birth and at discharge only"],
  answer:1,
  why:"APGAR is scored at 1, 5, and 10 minutes after birth, with an expected score of 8–10."},
 {stem:"At 1 minute, a newborn has HR 90, slow irregular respirations, some flexion, a grimace with stimulation, and a pale blue body. What is the APGAR score?",
  options:["3","4","5","6"],
  answer:1,
  why:"Pulse <100 scores 1, slow/irregular respirations score 1, some flexion scores 1, minimal response to stimulation scores 1, pale/blue color scores 0 — total 4."},
 {type:"sata", stem:"Which findings are expected during the newborn's FIRST period of reactivity (birth to ~30 minutes)? Select all that apply.",
  options:["Alert and active behavior","A strong sucking reflex","Ideal time for bonding and initiating breastfeeding","Difficult to arouse, decreased responsiveness","Increased heart and respiratory rate"],
  answers:[0,1,2,4],
  why:"The first period of reactivity is marked by alertness, strong sucking, and increased HR/RR — an ideal window for bonding and feeding. Difficulty arousing and decreased responsiveness describe the sleep phase that follows, not the first period."},
 {type:"sata", stem:"An APGAR score is calculated using which of the following categories? Select all that apply.",
  options:["Appearance (color)","Pulse (heart rate)","Grimace (reflex irritability)","Axillary temperature","Respiratory effort"],
  answers:[0,1,2,4],
  why:"APGAR = Appearance, Pulse, Grimace, Activity (muscle tone), Respiration. Axillary temperature is not part of the APGAR score."}
],
assess:[
 {stem:"What is the normal newborn apical pulse range?",
  options:["80–100 bpm","100–120 bpm","120–160 bpm","160–200 bpm"],
  answer:2,
  why:"Normal newborn apical pulse, counted for a full minute, is 120–160 bpm; a murmur or sinus arrhythmia can be a normal finding."},
 {stem:"How does newborn chest circumference typically compare to head circumference?",
  options:["About half the head circumference","Approximately equal to head circumference","Twice the head circumference","No expected relationship"],
  answer:1,
  why:"Chest circumference is approximately equal to head circumference; the two measurements should be close."},
 {stem:"A newborn has a soft skull swelling that crosses suture lines and is expected to resolve without treatment. What is this finding?",
  options:["Cephalohematoma","Caput succedaneum","Microcephaly","Craniosynostosis"],
  answer:1,
  why:"Caput succedaneum crosses suture lines and resolves on its own — unlike cephalohematoma, which does not cross suture lines and can add to the newborn's bilirubin load."},
 {type:"sata", stem:"Which newborn vital sign findings are WITHIN normal limits? Select all that apply.",
  options:["Axillary temperature of 98.3°F","Respiratory rate of 70/min, sustained","Apical pulse of 140 bpm","Oxygen saturation of 97%","Respiratory rate of 44/min"],
  answers:[0,2,3,4],
  why:"Normal ranges: temp 97.8–99.0°F, apical pulse 120–160 bpm, O2 sat 95–100%, respirations 30–60/min. A sustained respiratory rate of 70/min exceeds the normal range and would indicate tachypnea/possible respiratory distress."},
 {type:"sata", stem:"Which newborn skin findings are considered normal, benign variations that require documentation but no treatment? Select all that apply.",
  options:["Milia","Erythema toxicum","Mongolian spot","Circumoral cyanosis","Vernix caseosa"],
  answers:[0,1,2,4],
  why:"Milia, erythema toxicum, Mongolian spots, and vernix are all normal, benign newborn findings. Circumoral cyanosis (blue around the mouth) is NOT benign — it requires further respiratory/cardiac assessment."}
],
reflexmeds:[
 {stem:"Which reflex involves the newborn's arms flinging outward and then back in when startled?",
  options:["Rooting","Moro","Babinski","Tonic neck"],
  answer:1,
  why:"The Moro (startle) reflex causes the arms to fling outward symmetrically and then return inward."},
 {stem:"Parents refuse the vitamin K injection for their newborn. What is the nurse's most appropriate action?",
  options:["Administer it anyway, since it is required by law","Educate parents on the purpose of vitamin K and document their informed refusal","Tell them the baby will die without it","Substitute the hepatitis B vaccine instead"],
  answer:1,
  why:"Consent is required for vitamin K — it is a refusable intervention. The nurse's role is education and documentation of the informed refusal, not administering it without consent."},
 {stem:"Why is antibiotic (erythromycin) eye ointment given to newborns shortly after birth?",
  options:["To prevent skin infections","To prevent ophthalmia neonatorum from organisms like gonorrhea or chlamydia encountered in the birth canal","To improve visual acuity","To prevent jaundice"],
  answer:1,
  why:"Erythromycin ophthalmic ointment is given as prophylaxis against ophthalmia neonatorum caused by maternal gonorrhea or chlamydia exposure during birth; it is required by law in most states."},
 {type:"sata", stem:"Which of the following are normal newborn reflexes? Select all that apply.",
  options:["Rooting","Babinski (positive, with toe fanning)","Moro","Positive patellar clonus","Sucking"],
  answers:[0,1,2,4],
  why:"Rooting, a positive (fanning) Babinski, Moro, and sucking are all normal newborn reflexes. Sustained clonus is not a normal newborn reflex and would warrant further neurologic evaluation."},
 {type:"sata", stem:"Which are among the three medications routinely given in the newborn period? Select all that apply.",
  options:["Vitamin K (phytonadione)","Erythromycin ophthalmic ointment","Hepatitis B vaccine (first dose)","RhoGam","MMR vaccine"],
  answers:[0,1,2],
  why:"The three standard newborn medications are vitamin K, erythromycin eye ointment, and the first hepatitis B vaccine dose. RhoGam is given to the Rh-negative mother, not the newborn, and MMR is a live vaccine not given in the newborn period."}
],
dailycare:[
 {stem:"How many wet diapers per day should parents expect from an adequately hydrated newborn?",
  options:["1–2","3–4","6–12","15–20"],
  answer:2,
  why:"6–12 wet diapers per day (and 1–2 dirty diapers) are expected, with meconium transitioning to milk stool around day 3."},
 {stem:"When does the umbilical cord stump typically fall off?",
  options:["1–3 days","7–10 days","3–4 weeks","6 weeks"],
  answer:1,
  why:"The cord typically falls off within 7–10 days; the nurse checks for bleeding, irritation, or drainage in the meantime."},
 {stem:"When is the newborn's bilirubin level checked, per universal screening protocols?",
  options:["Only if visible jaundice appears","At least once prior to hospital discharge","At the 1-week follow-up visit only","Only if the mother is breastfeeding"],
  answer:1,
  why:"Bilirubin level is checked at least once prior to discharge as part of routine newborn screening, along with the state-mandated metabolic screen and hearing screen."},
 {type:"sata", stem:"Which measures are appropriate for circumcision pain management? Select all that apply.",
  options:["EMLA topical numbing cream","A dorsal penile nerve block","Swaddling during the procedure","A sucrose pacifier","Withholding all feeding for 24 hours after"],
  answers:[0,1,2,3],
  why:"EMLA cream, a nerve block, swaddling, and a sucrose pacifier are all evidence-based pain relief measures for circumcision. Withholding feeding is not indicated and is not a pain-relief measure."},
 {type:"sata", stem:"Which findings should prompt the nurse to notify the provider about a circumcision site? Select all that apply.",
  options:["Bright red bleeding beyond a few drops","Foul-smelling drainage","A thin yellowish exudate/granulation tissue forming a few days after the procedure","Increasing swelling or redness","Fever"],
  answers:[0,1,3,4],
  why:"Active bleeding, foul odor, increasing swelling/redness, and fever all suggest infection or hemorrhage and should be reported. A thin yellow-white exudate (granulation tissue) 2–3 days after circumcision is a normal part of healing, not a concerning sign."}
],
concerns:[
 {stem:"At what bilirubin level does the nurse typically anticipate phototherapy being initiated?",
  options:["2–4 mg/dL","6–8 mg/dL","12–15 mg/dL","20–25 mg/dL"],
  answer:2,
  why:"Phototherapy is typically initiated around 12–15 mg/dL, though exact thresholds vary by a nomogram based on the infant's age in hours and risk factors."},
 {stem:"How is newborn hypoglycemia generally defined in the first 72 hours of life?",
  options:["Blood glucose <30 mg/dL","Blood glucose <60 mg/dL","Blood glucose <80 mg/dL","Blood glucose <100 mg/dL"],
  answer:0,
  why:"Newborn hypoglycemia in the first 72 hours is generally defined as blood glucose less than 30 mg/dL."},
 {stem:"Which nursing priority applies to a child diagnosed with cerebral palsy?",
  options:["Safety — preventing aspiration, urinary tract infections, and falls","Preventing disease progression, since CP is progressive","Restricting all physical activity","Strict isolation precautions"],
  answer:0,
  why:"Cerebral palsy is non-progressive by definition. The nursing priority is safety — preventing aspiration (impaired swallowing), UTIs (from immobility), and falls (from unsteady gait)."},
 {type:"sata", stem:"Which findings are signs of neonatal respiratory distress? Select all that apply.",
  options:["Nasal flaring","Grunting","Retractions","A respiratory rate of 40/min with smooth, easy breathing","Cyanosis"],
  answers:[0,1,2,4],
  why:"Grunting, flaring, retracting, and cyanosis are all signs of respiratory distress. A respiratory rate of 40/min with smooth, easy breathing is within normal limits and not a distress sign."},

involution:[
 {stem:"On postpartum day 12, a patient's discharge changes from pinkish back to dark red and heavier. What does this suggest?",

  answer:0,

 {type:"sata", stem:"Which findings would classify a perineal laceration as a FOURTH-degree laceration? Select all that apply.",

systemic:[

   {p:"These questions were flagged as instructor discussion/reflection prompts across the original slide decks. Short answers are provided below, all grounded in content taught elsewhere in this app."},
   {p:"<strong>Q: Which indications of pregnancy carry more diagnostic \u2018weight\u2019 \u2014 presumptive vs. probable vs. positive signs?</strong>"},
   {p:"Positive signs carry the most weight \u2014 fetal heart tones, examiner-felt fetal movement, and ultrasound visualization can't be explained by anything except an actual fetus. Probable signs (positive hCG, cervical softening) are objective but still explainable by other causes. Presumptive signs (amenorrhea, nausea) are subjective and carry the least diagnostic weight."},
   {p:"<strong>Q: Why would fundal height decrease in the final weeks of pregnancy?</strong>"},
   {p:"This is lightening \u2014 the fetus descends into the pelvis in preparation for labor, which lowers the top of the fundus even though the fetus hasn't gotten smaller. It's an expected sign of approaching labor, not a red flag."},
   {p:"<strong>Q: Why does a pregnant patient need increased blood volume, and how does it affect lab values?</strong>"},
   {p:"The body builds a larger blood volume reserve (up to a 45% increase) in advance of the blood loss that will happen at delivery. Because plasma volume rises more than red blood cell mass, the blood is diluted, producing physiologic (dilutional) anemia \u2014 a lower H&H on labs without true iron deficiency."},
   {p:"<strong>Q: How can hypercoagulability in pregnancy/postpartum be addressed clinically?</strong>"},
   {p:"Early and frequent ambulation, SCDs or TED hose, adequate hydration, and smoking cessation all reduce clot risk during this naturally hypercoagulable period."},
   {p:"<strong>Q: Why does a laboring patient push with contractions rather than continuously?</strong>"},
   {p:"The uterine contraction is already generating expulsive force on its own. Coordinating voluntary pushing with the contraction accomplishes the same fetal descent with less total maternal fatigue than pushing continuously regardless of contraction timing."},
   {p:"<strong>Q: When can menopause officially be \u2018declared,\u2019 and when does perimenopause begin?</strong>"},
   {p:"Menopause is confirmed retrospectively after 12 consecutive months without a period. Perimenopause is the transition leading up to it, typically starting about 4 years before the final period, marked by fluctuating hormones and irregular cycles."},
   {p:"<strong>Q: Who is an ideal candidate for each major contraceptive class, and what are the contraindications?</strong>"},
   {p:"Broadly: hormonal methods (like combined OCPs) fit patients without a history of clots, estrogen-sensitive cancers, or smoking after age 35. Barrier methods fit patients wanting non-hormonal, on-demand protection (and STI prevention). Surgical/permanent methods fit patients certain they don't want future fertility. Contraindications cluster around thromboembolic disease, uncontrolled hypertension, cardiac disease, and \u2014 for estrogen-containing methods \u2014 heavy smoking after 35."}
  ],

function shuffleExam(bank){
  const caseBlock = bank.filter(q=>q.caseId);
  const others = bank.filter(q=>!q.caseId).slice();
  for(let i=others.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [others[i],others[j]] = [others[j],others[i]];
  }
  const insertAt = Math.floor(Math.random()*(others.length+1));
  return others.slice(0,insertAt).concat(caseBlock, others.slice(insertAt));
}

function renderCaseTabs(caseId){
  const c = CASES[caseId];
  let h = '<div class="case-box"><div class="case-title">'+c.title+'</div><div class="case-tabs">';
  c.tabs.forEach((t,i)=>{
    h += '<button class="case-tab'+(S.activeTab===i?" active":"")+'" data-tab="'+i+'">'+t.label+"</button>";
  });
  h += '</div><div class="case-panel">';
  c.tabs[S.activeTab].blocks.forEach(b => h += blk(b));
  h += "</div></div>";
  return h;
}

function blk(b){
  if(b.h) return "<h4>"+b.h+"</h4>";
  if(b.p) return "<p>"+b.p+"</p>";
  if(b.list) return "<ul>"+b.list.map(i=>"<li>"+i+"</li>").join("")+"</ul>";
  if(b.hook) return '<div class="hook">'+b.hook+"</div>";
  if(b.img) return '<figure class="figure"><img src="'+b.img+'" alt="'+(b.caption||"")+'" loading="lazy">'+(b.caption?'<figcaption>'+b.caption+"</figcaption>":"")+"</figure>";
  if(b.table) return "<table><thead><tr>"+b.table.head.map(x=>"<th>"+x+"</th>").join("")+
    "</tr></thead><tbody>"+b.table.rows.map(r=>"<tr>"+r.map(c=>"<td>"+c+"</td>").join("")+"</tr>").join("")+
    "</tbody></table>";
  return "";
}

function qHTML(q, label){
  const A = ["A","B","C","D","E","F"], p = S.pick, sub = S.submitted;
  let h = '<div class="q">'+(label?'<div class="lbl">'+label+"</div>":"")+'<p class="stem">'+q.stem+"</p>";
  q.options.forEach((o,i)=>{
    let c = "opt";
    if(sub){ if(i===q.answer) c+=" right"; else if(i===p) c+=" mine"; }
    else if(i===p) c+=" picked";
    h += '<button class="'+c+'" data-p="'+i+'"'+(sub?" disabled":"")+"><b>"+A[i]+"</b>  "+o+"</button>";
  });
  if(!sub){
    h += '<div class="acts"><button data-submit-mc="1"'+(p===null?" disabled":"")+'>Submit answer</button></div>';
  } else {
    const ok = p === q.answer;
    h += '<p class="verdict '+(ok?"y":"n")+'">'+(ok?"Correct":"Answer: "+A[q.answer])+"</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function sataHTML(q){
  const A = ["A","B","C","D","E","F"], sel = S.multi, sub = S.submitted;
  let h = '<div class="q"><div class="sata-note">Select all that apply</div><p class="stem">'+q.stem+"</p>";
  q.options.forEach((o,i)=>{
    let c = "opt sata", isSel = sel.includes(i), isCorrect = q.answers.includes(i);
    if(sub){
      if(isCorrect && isSel) c+=" right";
      else if(isCorrect && !isSel) c+=" missed";
      else if(!isCorrect && isSel) c+=" mine";
    } else if(isSel) c+=" picked";
    h += '<button class="'+c+'" data-t="'+i+'"'+(sub?" disabled":"")+"><b>"+(isSel?"\u2611":"\u2610")+"</b>  "+o+"</button>";
  });
  if(!sub){
    h += '<div class="acts"><button data-submit="1">Submit answer</button></div>';
  } else {
    const ok = sel.slice().sort((a,b)=>a-b).join(",") === q.answers.slice().sort((a,b)=>a-b).join(",");
    const ansText = q.answers.map(i=>A[i]).join(", ");
    h += '<p class="verdict '+(ok?"y":"n")+'">'+(ok?"Correct":"Answer: "+ansText)+"</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function bowtieHTML(q){

  let h = '<div class="q"><div class="sata-note">Bowtie — pick actions, the condition, and parameters</div><p class="stem">'+q.stem+"</p>";

    const sel = S.bowtie.condition===idx;

    h += '<button class="'+c+'" data-bt-condition="'+idx+'"'+(sub?" disabled":"")+'>'+opt+"</button>";
  });

    h += '<button class="'+c+'" data-bt-param="'+idx+'"'+(sub?" disabled":"")+'>'+opt+"</button>";

  if(!sub){
    h += '<div class="acts"><button data-submit-bowtie="1"'+(!ready?" disabled":"")+'>Submit answer</button></div>';

    const totalSlots = 1 + q.correctActions.length + q.correctParams.length;
    const ok = S.lastPoints === 1;
    h += '<p class="verdict '+(ok?"y":"n")+'">'+Math.round(S.lastPoints*totalSlots)+" of "+totalSlots+" correct — "+S.lastPoints.toFixed(2)+" pt (partial credit)</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function anyQHTML(q, label){
  if(q.type === "sata") return sataHTML(q);
  if(q.type === "fitb") return fitbHTML(q);
  if(q.type === "gtpal") return gtpalHTML(q);
  if(q.type === "cloze") return clozeHTML(q);
  if(q.type === "hotspot") return hotspotHTML(q);
  if(q.type === "dragdrop") return dragdropHTML(q);
  if(q.type === "ordering") return orderingHTML(q);
  if(q.type === "matrix") return matrixHTML(q);
  if(q.type === "bowtie") return bowtieHTML(q);
  return qHTML(q, label);
}

function home(){
  let h = '<p class="lede"><strong>How to use this:</strong> Each topic features a lesson ending with one review question. Many topics also include a standalone 5-question quiz (including select-all-that-apply items) — tap a title to read, or Quiz where available to jump straight to the questions. The colored dot next to each unit carries through to that unit\'s lessons and quizzes.</p>';
  UNITS.forEach((u,ui)=>{
    const color = UNIT_COLORS[ui] || "#333";
    h += '<section class="unit"><h2><span class="unit-chip" style="background:'+color+'"></span>'+u.title+"</h2>"+(u.sub?"<p>"+u.sub+"</p>":"");
    u.lessons.forEach(x=>{
      const hasQuiz = !!QUIZ[x.id];
      const b = S.best[x.id];
      h += '<button class="row" data-l="'+x.id+'"><span class="t">'+x.title+"</span>"+
        (hasQuiz && b!==undefined ? '<span class="s">'+fmtScore(b)+"/"+QUIZ[x.id].length+"</span>" : "")+
        (hasQuiz ? '<span class="qz" data-q="'+x.id+'">Quiz</span>' : "")+
        "</button>";
    });
    h += "</section>";
  });
  return h;
}

function lesson(){
  const x = L[S.id];
  const ui = unitIndexOf(S.id);
  let h = '<div class="unit-banner" style="background:'+UNIT_COLORS[ui]+'">'+UNITS[ui].title+"</div>";
  h += '<h3 class="title">'+x.title+"</h3>"+(x.kicker?'<p class="kick">'+x.kicker+"</p>":"");
  x.blocks.forEach(b => h += blk(b));
  if(x.check){
    h += qHTML(x.check, "Check your understanding");
    if(S.submitted){
      const n = ORDER.indexOf(x.id);
      h += '<div class="acts"><button data-q="'+x.id+'">Quiz me on this</button>';
      if(n > 0) h += '<button data-l="'+ORDER[n-1]+'">Previous: '+L[ORDER[n-1]].title+"</button>";
      if(n < ORDER.length-1) h += '<button data-l="'+ORDER[n+1]+'">Next: '+L[ORDER[n+1]].title+"</button>";
      h += '<button data-home="1">All topics</button></div>';
    }
  } else {
    const n = ORDER.indexOf(x.id);
    h += '<div class="acts">';
    if(n > 0) h += '<button data-l="'+ORDER[n-1]+'">Previous: '+L[ORDER[n-1]].title+"</button>";
    if(n < ORDER.length-1) h += '<button data-l="'+ORDER[n+1]+'">Next: '+L[ORDER[n+1]].title+"</button>";
    h += '<button data-home="1">All topics</button></div>';
  }
  return h;
}

function fmtScore(n){ return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0+$/,"").replace(/\.$/,""); }
function quiz(){
  const bank = curBank();
  const q = bank[S.i];
  const ui = unitIndexOf(S.id);
  let h = '<div class="unit-banner" style="background:'+UNIT_COLORS[ui]+'">'+UNITS[ui].title+"</div>";
  h += '<h3 class="title">'+L[S.id].title+'</h3><p class="count">Question '+(S.i+1)+" of "+bank.length+" · score "+fmtScore(S.score)+"</p>";
  if(q.caseId) h += renderCaseTabs(q.caseId);
  h += anyQHTML(q, "");
  const answered = S.submitted;
  if(answered) h += '<div class="acts"><button data-next="1">'+(S.i<bank.length-1?"Next question":"See results")+"</button></div>";
  return h;
}

function result(){
  const bank = curBank();
  const A = ["A","B","C","D","E","F"];
  let h = '<p class="count">'+L[S.id].title+'</p><p class="big">'+fmtScore(S.score)+"/"+bank.length+"</p>";
  if(S.wrong.length){
    h += '<div class="rev"><p>Review these:</p>';
    S.wrong.forEach(i=>{ const q = bank[i];
      let correctText;
      if(q.type === "sata") correctText = q.answers.map(idx=>A[idx]+". "+q.options[idx]).join("; ");
      else if(q.type === "fitb") correctText = String(q.answer);
      else if(q.type === "cloze") correctText = q.blanks.map(b=>b.options[b.correct]).join(" · ");
      else if(q.type === "gtpal") correctText = ["G","T","P","A","L"].map((l,idx)=>l+q.answers[idx]).join(" ");
      else if(q.type === "hotspot") correctText = "See the outlined region in the lesson/question image.";
      else if(q.type === "dragdrop") correctText = q.items.map((it,idx)=>it+" → "+q.bins[q.correctBin[idx]]).join("; ");
      else if(q.type === "ordering") correctText = q.items.join(" → ");
      else if(q.type === "matrix") correctText = q.rows.map((r,idx)=>r+" → "+q.cols[q.correct[idx]]).join("; ");
      else if(q.type === "bowtie") correctText = "Actions: "+q.correctActions.map(idx=>q.actionOptions[idx]).join(", ")+" · Condition: "+q.conditionOptions[q.correctCondition]+" · Parameters: "+q.correctParams.map(idx=>q.paramOptions[idx]).join(", ");
      else correctText = q.options[q.answer];
      h += "<h5>"+q.stem+"</h5><p><strong>"+correctText+"</strong></p><p>"+q.why+"</p>";
      if(q.ref && L[q.ref]) h += '<a class="reviewlink" href="#'+q.ref+'" target="_blank" rel="noopener">Review in: '+L[q.ref].title+" ↗</a>";
    });
    h += "</div>";
  } else h += "<p>All correct.</p>";
  h += '<div class="acts"><button data-q="'+S.id+'">Retake</button><button data-l="'+S.id+'">Reread the lesson</button><button data-home="1">All topics</button></div>';
  return h;
}

function draw(){
  back.hidden = S.view === "home";
  app.innerHTML = S.view==="home"?home():S.view==="lesson"?lesson():S.view==="quiz"?quiz():result();
}

app.addEventListener("change", e=>{
  const sel = e.target.closest("select[data-cloze-blank]");
  if(sel && !S.submitted){
    S.clozeSel[+sel.dataset.clozeBlank] = sel.value===""?undefined:+sel.value;
    return draw();
  }
});

app.addEventListener("click", e=>{
  const q0 = e.target.closest("[data-q]");
  if(q0){
    e.stopPropagation();
    const shuffled = q0.dataset.q === "examone" ? shuffleExam(QUIZ[q0.dataset.q]) : null;
    nav("quiz",{id:q0.dataset.q, i:0, score:0, wrong:[], shuffledBank:shuffled});
    return;
  }
  const hw = e.target.closest(".hotspot-wrap");
  if(hw && !S.submitted && S.view==="quiz" && curBank() && curBank()[S.i] && curBank()[S.i].type==="hotspot"){
    const rect = hw.getBoundingClientRect();
    const x = Math.max(0,Math.min(100, ((e.clientX-rect.left)/rect.width)*100));
    const y = Math.max(0,Math.min(100, ((e.clientY-rect.top)/rect.height)*100));
    S.clickPoint = {x,y};
    return draw();
  }
  const mr = e.target.closest("input[type=radio][data-matrix-row]");
  if(mr && !S.submitted){
    S.matrixSel[+mr.dataset.matrixRow] = +mr.dataset.matrixCol;
    return draw();
  }
  const t = e.target.closest("button");
  if(!t){
    const ddBinEl = e.target.closest(".dd-bin");
    if(ddBinEl && !S.submitted && S.ddSel !== null){
      S.ddPlace[S.ddSel] = +ddBinEl.dataset.ddBin;
      S.ddSel = null;
      return draw();
    }
    return;
  }
  if(t.dataset.l) return nav("lesson",{id:t.dataset.l});
  if(t.dataset.home) return nav("home");
  if(t.dataset.tab !== undefined){
    S.activeTab = +t.dataset.tab;
    return draw();
  }
  if(t.dataset.t !== undefined){
    if(S.submitted) return;
    const idx = +t.dataset.t, pos = S.multi.indexOf(idx);
    if(pos === -1) S.multi.push(idx); else S.multi.splice(pos,1);
    return draw();
  }
  if(t.dataset.submit !== undefined){
    S.submitted = true;
    const q = curBank()[S.i];
    const ok = S.multi.slice().sort((a,b)=>a-b).join(",") === q.answers.slice().sort((a,b)=>a-b).join(",");
    if(S.view === "quiz"){ if(ok) S.score++; else S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.submitFitb !== undefined){
    const inputEl = document.getElementById("fitbInput");
    const val = inputEl ? inputEl.value.trim() : "";
    S.textAnswer = val;
    const q = curBank()[S.i];
    const userNum = parseFloat(val);
    const target = parseFloat(q.answer);
    const ok = !isNaN(userNum) && Math.abs(userNum - target) < 0.05;
    S.fitbCorrect = ok;
    S.submitted = true;
    if(S.view === "quiz"){ if(ok) S.score++; else S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.submitGtpal !== undefined){
    const q = curBank()[S.i];
    const vals = [0,1,2,3,4].map(i=>{
      const el = document.getElementById("gtpalInput"+i);
      return el ? el.value.trim() : "";
    });
    S.gtpalVals = vals;
    const ok = vals.every((v,i)=> parseInt(v) === q.answers[i]);
    S.submitted = true;
    if(S.view === "quiz"){ if(ok) S.score++; else S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.submitCloze !== undefined){
    const q = curBank()[S.i];
    const correctCount = q.blanks.filter((b,i)=>S.clozeSel[i]===b.correct).length;
    const pts = Math.round((correctCount/q.blanks.length)*100)/100;
    S.submitted = true;
    S.lastPoints = pts;
    if(S.view === "quiz"){ S.score += pts; if(pts < 1) S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.submitHotspot !== undefined){
    const q = curBank()[S.i];
    const pt = S.clickPoint, r = q.region;
    const ok = !!pt && pt.x>=r.x && pt.x<=r.x+r.w && pt.y>=r.y && pt.y<=r.y+r.h;
    const pts = ok ? 1 : 0;
    S.hotspotCorrect = ok;
    S.submitted = true;
    S.lastPoints = pts;
    if(S.view === "quiz"){ S.score += pts; if(pts < 1) S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.ddPick !== undefined){
    S.ddSel = S.ddSel === +t.dataset.ddPick ? null : +t.dataset.ddPick;
    return draw();
  }
  if(t.dataset.ddUnplace !== undefined){
    if(S.submitted) return;
    delete S.ddPlace[+t.dataset.ddUnplace];
    return draw();
  }
  if(t.dataset.submitDd !== undefined){
    const q = curBank()[S.i];
    const correctCount = q.items.filter((_,idx)=>S.ddPlace[idx]===q.correctBin[idx]).length;
    const pts = Math.round((correctCount/q.items.length)*100)/100;
    S.submitted = true;
    S.lastPoints = pts;
    if(S.view === "quiz"){ S.score += pts; if(pts < 1) S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.orderUp !== undefined){
    const pos = +t.dataset.orderUp;
    if(pos>0){ [S.orderArr[pos-1],S.orderArr[pos]] = [S.orderArr[pos],S.orderArr[pos-1]]; }
    return draw();
  }
  if(t.dataset.orderDown !== undefined){
    const pos = +t.dataset.orderDown;
    if(pos<S.orderArr.length-1){ [S.orderArr[pos+1],S.orderArr[pos]] = [S.orderArr[pos],S.orderArr[pos+1]]; }
    return draw();
  }
  if(t.dataset.submitOrder !== undefined){
    const correctCount = S.orderArr.filter((itemIdx,pos)=>itemIdx===pos).length;
    const pts = Math.round((correctCount/S.orderArr.length)*100)/100;
    S.submitted = true;
    S.lastPoints = pts;
    if(S.view === "quiz"){ S.score += pts; if(pts < 1) S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.submitMatrix !== undefined){
    const q = curBank()[S.i];
    const correctCount = q.rows.filter((_,rIdx)=>S.matrixSel[rIdx]===q.correct[rIdx]).length;
    const pts = Math.round((correctCount/q.rows.length)*100)/100;
    S.submitted = true;
    S.lastPoints = pts;
    if(S.view === "quiz"){ S.score += pts; if(pts < 1) S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.btAction !== undefined){
    if(S.submitted) return;
    const q = curBank()[S.i];
    const idx = +t.dataset.btAction, pos = S.bowtie.actions.indexOf(idx);
    if(pos===-1){ if(S.bowtie.actions.length < q.correctActions.length) S.bowtie.actions.push(idx); }
    else S.bowtie.actions.splice(pos,1);
    return draw();
  }
  if(t.dataset.btCondition !== undefined){
    if(S.submitted) return;
    S.bowtie.condition = +t.dataset.btCondition;
    return draw();
  }
  if(t.dataset.btParam !== undefined){
    if(S.submitted) return;
    const q = curBank()[S.i];
    const idx = +t.dataset.btParam, pos = S.bowtie.params.indexOf(idx);
    if(pos===-1){ if(S.bowtie.params.length < q.correctParams.length) S.bowtie.params.push(idx); }
    else S.bowtie.params.splice(pos,1);
    return draw();
  }
  if(t.dataset.submitBowtie !== undefined){
    const q = curBank()[S.i];
    const totalSlots = 1 + q.correctActions.length + q.correctParams.length;
    const conditionPts = S.bowtie.condition===q.correctCondition ? 1 : 0;
    const actionsPts = S.bowtie.actions.filter(a=>q.correctActions.includes(a)).length;
    const paramsPts = S.bowtie.params.filter(a=>q.correctParams.includes(a)).length;
    const pts = Math.round(((conditionPts+actionsPts+paramsPts)/totalSlots)*100)/100;
    S.submitted = true;
    S.lastPoints = pts;
    if(S.view === "quiz"){ S.score += pts; if(pts < 1) S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.p !== undefined){
    if(S.submitted) return;
    S.pick = +t.dataset.p;
    return draw();
  }
  if(t.dataset.submitMc !== undefined){
    if(S.pick === null) return;
    S.submitted = true;
    if(S.view === "quiz"){
      if(S.pick === curBank()[S.i].answer) S.score++; else S.wrong.push(S.i);
    }
    return draw();
  }
  if(t.dataset.next){
    const bank = curBank();
    if(S.i < bank.length-1){
      S.i++; S.pick = null; S.multi = []; S.submitted = false; S.textAnswer = ""; S.fitbCorrect = false; S.activeTab = 0;
      S.clickPoint = null; S.hotspotCorrect = false; S.ddSel = null; S.ddPlace = {}; S.orderArr = null; S.matrixSel = {};
      S.bowtie = {condition:null, actions:[], params:[]}; S.lastPoints = 0; S.clozeSel = {}; S.gtpalVals = ["","","","",""];
      return draw();
    }
    const b = S.best[S.id];
    if(b === undefined || S.score > b) S.best[S.id] = S.score;
    return nav("result");
  }
});

const initialHash = location.hash.slice(1);
if(initialHash && L[initialHash]){
  nav("lesson", {id: initialHash});
} else {
  draw();
}

</script>
</body>
</html>
