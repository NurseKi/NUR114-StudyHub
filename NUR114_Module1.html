{ id:"reflexmeds", title:"Reflexes & Newborn Medications", kicker:"The starred reflexes, and the three meds every newborn gets",
  blocks:[
   {p:"Newborn reflexes — also called primitive reflexes — are innate, involuntary responses present at birth that serve as a window into the neonatal nervous system's development. Each reflex has a predictable stimulus, a predictable response, and a predictable age at which it fades as the central nervous system matures and voluntary control takes over. The presence, quality, and eventual disappearance of these reflexes are all diagnostic information."},
   {table:{head:["Reflex","How to elicit","Disappears by"],rows:[
     ["Moro (startle) ★","Drop head back slightly, or loud noise","4–6 months"],
     ["Rooting ★","Stroke the cheek near the mouth","3–4 months"],
     ["Sucking ★","Place nipple/gloved finger in mouth","Up to 12 months"],
     ["Palmar grasp","Place finger in the palm","3–4 months (hand); foot version ~8 months"],
     ["Plantar grasp","Place finger at base of toes","8 months"],
     ["Tonic neck (fencing)","Turn head to one side while supine","3–4 months"],
     ["Babinski ★","Stroke outer edge of sole, heel to toe","1–2 years"],
     ["Stepping (walking)","Hold upright, feet touching a surface","1–2 months"],
     ["Truncal incurvation (Galant)","Stroke one side of the spine while prone","4 weeks"],
     ["Crawling (Bower)","Place prone; apply gentle pressure to soles","A few weeks to ~2 months"],
     ["Doll's eyes","Turn the head; eyes move opposite the turn","~10 days"]]}},
   {p:"Two of these — rooting and sucking — exist specifically to get the newborn fed, guiding it toward a nipple and then drawing milk from it, which is exactly why an absent or weak version of either reflex is treated as a feeding concern rather than just a neurologic curiosity. Stepping and tonic neck are thought of as previews of voluntary motor skills to come (walking, reaching) rather than functional behaviors in the moment."},
   {hook:"An <b>absent or asymmetrical</b> reflex (present on one side only) suggests nerve damage or CNS depression — that asymmetry is the real red flag, more than the reflex itself. Babinski is <b>normal in a newborn</b> (until 1–2 years) and abnormal in an older child/adult — the nervous system is still immature. Classic test item. Note: exact disappearance ages vary a bit by source (e.g., sucking listed anywhere from ~4 months, when it becomes voluntary, up to 12 months) — the pattern (present at birth, fades as the CNS matures) matters more than memorizing the single exact week."},
   {h:"Newborn medications — three given to essentially every newborn"},
   {list:[
    "<strong>Vitamin K</strong> — IM, prevents vitamin K deficiency bleeding. Newborns are born with very low vitamin K stores because it crosses the placenta poorly, and the sterile newborn gut hasn't yet developed the bacteria that normally help produce it — administration requires consent and is a refusable intervention",
    "<strong>Antibiotic eye ointment</strong> — protects against ophthalmia neonatorum from organisms encountered in the birth canal (e.g., gonorrhea, chlamydia); required by law in most jurisdictions regardless of documented maternal STI status",
    "<strong>Hepatitis B vaccine</strong> — first dose, typically given before discharge"]},
   {hook:"IM injections in infants (vitamin K, Hep B) are given in the <b>vastus lateralis</b> — the largest part of the quadriceps, on the anterolateral thigh — since the newborn gluteal muscle isn't developed enough to be a safe injection site."}
  ],
  check:{stem:"The nurse strokes a 2-day-old's sole and the toes fan outward. What does this indicate?",
   options:["A normal Babinski reflex for this age","Neurologic injury requiring immediate reporting","An absent Moro reflex","A positive Galant reflex"],
   answer:0,
   why:"Toe fanning on sole stroking is a normal Babinski reflex in newborns, due to nervous system immaturity — abnormal only in older children/adults."}
},
{ id:"dailycare", title:"Feeding, Cord, Circumcision & Screening", kicker:"Daily care and discharge prep",
  blocks:[
   {p:"Everything in this lesson is really answering one question from a different angle: is this newborn ready to go home? Feeding pattern and diaper output tell you nutrition is adequate, healing cord and circumcision sites tell you there's no active bleeding or infection risk, and the screening/safety checklist confirms the mandated tests and parent education are complete before discharge."},
   {h:"Intake & output — how you know feeding is going well"},
   {p:"Feeding pattern and diaper output are the two easiest ways to confirm a newborn is getting enough nutrition without needing a lab test."},
   {list:[
    "Breastfeed on demand, roughly every 2–3 hours",
    "Formula: 2–3 oz every 3 hours, not stretching beyond 4 hours",
    "<strong>6–12 wet diapers/day</strong>, <strong>1–2 dirty diapers/day</strong> — a rough proxy for adequate hydration and intake",
    "Stool progresses from meconium (thick, black, tarry — the first stool) to a transitional stool around day 3, and then to a milk stool (yellow and seedy if breastfed; firmer and paler if formula-fed)"]},
   {h:"Cord care"},
   {p:"The umbilical cord stump typically falls off within <strong>7–10 days</strong>. Nursing care is mostly about leaving it alone: check for bleeding, irritation, or drainage, and fold the diaper down below the cord so urine doesn't keep it damp — a moist cord takes longer to fall off and is more prone to infection."},
   {h:"Circumcision care"},
   {p:"Circumcision is an optional procedure requiring parental consent. Pain management includes EMLA numbing cream, a dorsal penile nerve block, swaddling, and a sucrose pacifier for non-pharmacologic comfort. Afterward, watch for bleeding and infection, and apply petroleum jelly with diaper changes to keep the site from sticking to the diaper. <strong>No tub bath is given until the cord has fallen off AND the circumcision site has healed</strong> — both healing sites drive the same restriction."},
   {h:"Screening & safety before discharge"},
   {hook:"<strong>Instructor emphasis:</strong> the safety answer students most often miss. Matching ID bands on baby, mom, AND the caregiver going home with them, applied immediately after birth, is a top priority — this is the core of abduction prevention alongside newborn security sensors. Two other discharge musts she stressed: the <strong>car seat must be visualized</strong> before discharge (not just asked about), and safe sleep must be taught explicitly, including that <strong>co-sleeping is never recommended</strong> due to SIDS risk."},
   {list:[
    "State-mandated newborn screen (metabolic screening, historically shorthanded as the 'PKU test'), hearing screen, and a bilirubin level — all completed before discharge",
    "Infant abduction prevention: matching ID bands on infant/mother/caregiver applied immediately, identify all visitors, use newborn security monitors, and take a newborn photo/handprint/footprint for identification",
    "Car seat visualized by staff before discharge — not just confirmed verbally",
    "Safe sleep teaching: 'Back to Sleep' — always place the infant on its back in a crib with a firm mattress and no pillows, stuffed animals, or loose blankets, and never co-sleeping"]}
  ],
  check:{stem:"A parent of a 2-day-old asks about umbilical cord care. Which instruction is correct?",
   options:["Clean it with alcohol wipes at every diaper change","Keep it clean and dry, fold the diaper below it","Cover it with petroleum jelly","Give a daily tub bath"],
   answer:1,
   why:"Alcohol wipes aren't recommended — keep clean and dry, diaper folded below the cord. Petroleum jelly is for circumcision care, and no tub bath until the cord is off."}
},
{ id:"concerns", title:"Common Concerns & Developmental Issues", kicker:"Jaundice, hypoglycemia, RDS — and CP, Down syndrome, FTT",
  blocks:[
   {h:"The cold stress chain — why thermoregulation is a safety issue, not a comfort issue"},
   {p:"Newborns can't shiver to generate heat the way adults do. Instead, they rely on <strong>non-shivering thermogenesis</strong> — metabolizing a limited reserve of brown fat to produce warmth. This creates a domino effect worth memorizing as a chain: <strong>Cold Stress → Increased Metabolic Rate → Hypoglycemia → Respiratory Distress.</strong> A cold newborn burns through its brown fat and glucose reserves trying to stay warm; once glucose runs low, the baby becomes hypoglycemic; and the combined metabolic and glucose stress can tip into respiratory distress and worsening acidosis. This is exactly why keeping a newborn warm is treated as a priority nursing action rather than a comfort measure — it's metabolic protection, not just cozying up a baby."},
   {h:"Hyperbilirubinemia"},
   {list:["Appears <strong>day 1–3</strong> (physiologic) — driven by an immature liver plus a shortened newborn red blood cell lifespan, both of which mean bilirubin is produced faster than it can be cleared","Treated with feeding (bilirubin is excreted in the stool, so a well-fed baby clears it faster) plus phototherapy at <strong>12–15 mg/dL</strong>","Left untreated → kernicterus, permanent neurologic damage from bilirubin crossing into brain tissue"]},

      {h:"Rh incompatibility — a pathologic cause of severe jaundice"},
   {p:"Physiologic jaundice is a slow liver catching up. Rh-incompatibility jaundice is a completely different mechanism, and a much more urgent one. When an Rh-negative mother is sensitized (has anti-Rh antibodies) and carries an Rh-positive fetus, her IgG antibodies cross the placenta and attack fetal RBCs — <strong>hemolysis</strong>. The chain: hemolysis → fetal anemia → the fetal heart compensates with increased cardiac output → this can progress to heart failure → edema/<strong>hydrops fetalis</strong> and hepatosplenomegaly (the liver and spleen enlarge trying to manufacture replacement RBCs) → massive bilirubin release from all that ongoing red cell breakdown → severe jaundice → if untreated, kernicterus."},
   {hook:"This is why jaundice in an Rh-sensitized pregnancy is treated far more urgently than routine physiologic jaundice — it's not a slow liver catching up, it's ongoing red cell destruction. RhoGam prevents this entire cascade by stopping sensitization from ever occurring in the first place, which is why it's given prophylactically rather than as a treatment after the fact."},
   {h:"Hypoglycemia"},
   {list:["Glucose <strong>&lt;30 mg/dL</strong> in first 72 hours","S/S: jittery, low temperature, lethargy, cyanosis, poor feeding — note the overlap with cold stress and early sepsis, which is why a glucose check is often the fastest way to narrow things down","Risk factors: infant of a diabetic mother, preterm birth, IUGR, sepsis","Treatment: glucose (IV or PO), early feeding, frequent monitoring"]},
   {h:"Respiratory distress"},
   {p:"Signs are <strong>grunting, flaring, retracting</strong>. This is more common in preterm, infected, or C-section-born babies — the C-section connection exists because a vaginal birth's chest compression through the birth canal helps squeeze fluid out of the lungs, a mechanical assist that a cesarean birth simply doesn't provide."},

{ id:"nas", title:"Neonatal Abstinence Syndrome (NAS)", kicker:"Withdrawal symptoms in an opioid-exposed newborn",
  blocks:[
   {p:"When a pregnant woman uses opioids — whether illicit (heroin) or prescribed (codeine, fentanyl, methadone, buprenorphine) — those substances cross the placenta freely and the fetus's nervous system adapts to their constant presence over the course of the pregnancy, the same way any body adapts to a substance it's chronically exposed to. The moment the umbilical cord is clamped at birth, that supply is cut off abruptly, and the newborn's nervous system — now suddenly without the substance it adapted to — reacts with a cluster of physiologic and neurobehavioral withdrawal symptoms collectively called Neonatal Abstinence Syndrome. This happens in an estimated <strong>55–94%</strong> of opioid-exposed infants, which makes it common enough that every newborn nurse needs to recognize the pattern."},
   {h:"Timing"},
   {p:"Because withdrawal depends on how quickly the specific substance clears the newborn's system, symptoms don't all appear at the same moment — they typically emerge as early as <strong>24 hours</strong> after birth and as late as <strong>7 days</strong> of age, depending on the drug involved and its half-life."},
   {h:"Clinical manifestations — grouped by the system driving them"},
   {table:{head:["System","Signs"],rows:[
     ["Neurologic (hallmark)","High-pitched, shrill, inconsolable cry; tremors; hyperactivity; wakefulness; increased muscle tone (hypertonia); seizures"],
     ["Autonomic","Fever, excessive sweating"],
     ["Gastrointestinal","Vomiting, loose stools, poor feeding"]]}},
   {hook:"A key physical cue: a newborn with <b>no head lag</b> when pulled to sitting (i.e., excessive muscle tone/rigidity) can be a sign of withdrawal — the opposite of the floppy tone seen in some other newborn conditions. Hypertonia, not hypotonia, is the NAS pattern to watch for."},
   {h:"Assessment & diagnosis"},
   {list:[
    "<strong>Finnegan Neonatal Abstinence Scoring System</strong> — a standardized tool used to score withdrawal severity at regular intervals and guide the decision of whether pharmacologic treatment is needed",
    "Urine and meconium drug screens sent soon after birth to confirm exposure"]},
   {h:"Treatment — escalates with severity, exactly like the pain-management ladder in other units"},
   {table:{head:["Severity","Approach"],rows:[
     ["Mild (first line)","Nonpharmacologic: low-stimulation environment (quiet, dark room), swaddling in a flexed position, frequent holding, swinging/swaying, pacifier for non-nutritive sucking"],
     ["Moderate–severe","Pharmacologic: methadone or morphine sulfate to control symptoms and prevent excessive weight loss"]]}},
   {list:[
    "<strong>Nutrition:</strong> frequent feedings, possibly increased caloric density, since withdrawal itself raises the infant's metabolic demand well above baseline",
    "<strong>Breastfeeding is NOT an absolute contraindication</strong> — the care team weighs the benefits of breastfeeding against the risk of drug passage into breast milk on a case-by-case basis; it IS contraindicated if the mother is actively using street drugs"]},
   {hook:"NAS 'bow-tie' logic: <b>Actions</b> — low-stimulation environment, swaddle in flexion → <b>Condition</b> — NAS → <b>Parameters to monitor</b> — Finnegan scores every 2–4 hours, daily weight (for weight loss from poor feeding/diarrhea)."}
  ],
  check:{stem:"A newborn exposed to opioids in utero has a high-pitched cry, tremors, and hypertonia at 36 hours of age. Which nursing action is the appropriate FIRST-line approach?",
   options:["Immediately start morphine sulfate","Reduce environmental stimulation and swaddle the infant snugly in a flexed position","Encourage bright lighting and frequent handling to keep the infant alert","Withhold all feedings until symptoms resolve"],
   answer:1,
   why:"Nonpharmacologic measures — a low-stimulation environment and snug, flexed swaddling — are first-line for mild NAS symptoms. Pharmacologic treatment (methadone/morphine) is reserved for moderate-to-severe symptoms unresponsive to these measures."}
}

{ id:"involution", title:"Involution, Lochia & Perineal Care", kicker:"The uterus comes back down; the discharge changes color",
  blocks:[
   {p:"Involution is the process by which the uterus shrinks back down to its non-pregnant size and position after birth, and it is genuinely one and the same assessment as hemorrhage risk: a fundus that is firm, midline, and steadily descending is a uterus that is clamping down on the open vessels left behind where the placenta was attached. A fundus that is soft, displaced, or not descending on schedule is a uterus that isn't doing that job well — and a <strong>full bladder is one of the most common, most fixable reasons why.</strong> A distended bladder sits directly behind the uterus and physically pushes it up and off the midline, which mechanically prevents the muscle fibers from contracting fully."},
   {h:"Fundus high and displaced to the right — the exact action order"},
   {p:"This is one of the highest-yield sequences in postpartum nursing, precisely because the correct first step (assisting the patient to void) is a simple nursing action, not a call to the provider or a medication — and choosing the wrong first step is a common trap."},
   {table:{head:["Order","Action","Why"],rows:[
     ["1st","Assist the client to void","A full bladder pushes the uterus up and to the side, preventing contraction"],
     ["2nd","Re-assess the fundus","After voiding, the fundus should return toward midline"],

   {h:"BUBBL-HE — the standard postpartum head-to-toe assessment"},

      {h:"REEDA — perineal/incision assessment"},
   {p:"When there's an episiotomy, laceration, or incision to assess, REEDA gives a structured way to describe what you see: <strong>R</strong>edness, <strong>E</strong>dema, <strong>E</strong>cchymosis, <strong>D</strong>ischarge, <strong>A</strong>pproximation (are the wound edges closed together, without gaps?). Documenting all five elements every time gives the next nurse a clear baseline to compare against."},
   {hook:"Some materials use a similar mnemonic, <b>RETA</b> (Redness, Edema, Tenderness, Approximation) — same idea, one fewer letter. Either way you're checking for infection/healing complications versus a clean, well-approximated repair."},
   {h:"Lochia progression"},
   {p:"Lochia is the postpartum vaginal discharge, and its color is meant to progress in one direction only — from blood-heavy to serous to essentially clear — as the uterine lining heals."},
   {table:{head:["Stage","Color","Duration"],rows:[
     ["Rubra","Bright red, small clots","Days 1–3"],
     ["Serosa","Pinkish-brown","Days 4–10"],
     ["Alba","Yellow/white","Day 11+ (up to 6 weeks)"]]}},
   {hook:"Lochia going <b>backward</b> (alba back to rubra) or suddenly increasing suggests a uterus that stopped contracting or retained tissue — report it. Saturating a pad in under 15–60 minutes, or foul odor, both warrant provider notification. The 'red zone' danger sign for both mother and newborn is <b>oliguria — urine output &lt;30 mL/hr</b>."},
   {h:"RhoGam (Rho(D) immune globulin)"},
   {p:"This connects directly back to the Rh incompatibility pathophysiology covered in the Newborn unit — RhoGam is how that entire hemolysis cascade gets prevented before it can start."},
   {list:[
    "Given to <strong>Rh-negative</strong> mothers who deliver an Rh-positive infant (indirect Coombs must be <strong>negative</strong>, meaning she hasn't already formed antibodies)",
    "Administered <strong>IM at 28 weeks gestation</strong> and again <strong>within 72 hours of delivery</strong> (also after amniocentesis or other sensitizing events like trauma or miscarriage)",
    "Do NOT give with live-virus vaccines (e.g., rubella given same visit is fine per protocol, but timing/coordination matters) or estrogen-containing meds"]},
   {h:"Perineal & incision care"},
   {list:["Episiotomy/laceration: ice packs (10 min/hr for first 24 hrs), Tucks/hydrocortisone, sitz baths twice daily, keep clean","Episiotomy degrees: 1st = skin only; 2nd = perineal muscles; 3rd = extends into anal sphincter; 4th = through rectal mucosa","Vagina takes 6–10 weeks to regain size/contour","C-section incision: assess bleeding, open to air after first night; pain control per orders"]}
  ],
  check:{stem:"On day 12 postpartum, a patient's discharge turns from pinkish back to dark red and heavier. What does this suggest?",
   options:["Normal lochia progression","The uterus may have stopped contracting or retained tissue","The start of lochia alba","An expected breastfeeding response"],
   answer:1,
   why:"Lochia should progress forward — reversing or suddenly increasing suggests retained tissue or a uterus that isn't contracting."}
},
{ id:"systemic", title:"Systemic Postpartum Changes", kicker:"Where all the extra fluid and volume goes",
  blocks:[
   {p:"Pregnancy added roughly 45% more blood volume and months of hormonal support to nearly every organ system. All of that has to be reversed in a matter of weeks after delivery, and each system does it a slightly different way."},
   {h:"Cardiovascular"},
   {p:"With the uterus and placenta no longer part of the circulatory loop, blood that was flowing through them returns to central circulation, and cardiac output actually <strong>increases</strong> in the immediate postpartum period before gradually normalizing. The body sheds the extra plasma volume through <strong>diuresis</strong> (increased urination) and <strong>diaphoresis</strong> (sweating) — both are expected, sometimes dramatic, and not signs of illness. At the same time, clotting factors remain <strong>elevated</strong> for weeks after birth, which is protective against hemorrhage but also raises the risk of dangerous clots — this hypercoagulable state doesn't switch off the moment the placenta is delivered."},
   {h:"Gastrointestinal"},
   {p:"Constipation is the expected GI complaint, driven by decreased bowel tone from pregnancy, decreased activity during labor, and often genuine fear of pain with a tender perineum. The first postpartum stool is expected around <strong>2–3 days</strong> after birth; stool softeners and hydration are the standard preventive approach."},
   {h:"Urinary"},
   {p:"Increased bladder capacity combines with decreased sensation to create a real risk of urinary retention that the patient herself may not feel coming. This matters clinically because <strong>a distended bladder displaces the uterus</strong>, which in turn reduces uterine contraction and increases bleeding — the exact mechanical chain covered in the Involution lesson."},
   {hook:"Bladder distention signs: fundus off midline, excessive lochia, small frequent voids (<b>&lt;150 mL</b>) — she's overflowing around a full bladder, not actually emptying it. Frequent small voids can look reassuring on a flow sheet if you don't stop to calculate the volume."},
   {h:"Musculoskeletal"},
   {p:"Muscle fatigue and aches are common in the first 1–2 days as the body recovers from the physical work of labor. <strong>Diastasis recti</strong> — a separation of the abdominal rectus muscles that occurred to accommodate the growing uterus — is also common and generally improves gradually with time and targeted core exercises."},
   {h:"Endocrine"},
   {p:"As pregnancy hormone levels fall, the body's normal cycle tries to restart — but it doesn't always announce itself with a period first. <strong>Ovulation can occur before the return of the first postpartum menstrual period</strong>, which is exactly why breastfeeding is <strong>not a reliable method of contraception</strong> on its own, no matter how frequently the mother is nursing."}
  ],
  check:{stem:"A postpartum patient voids three times in an hour, ~80 mL each time. What does the nurse conclude?",
   options:["She's emptying appropriately","She's likely retaining urine and overflowing around a full bladder","She's dehydrated and needs IV fluids","This is normal diuresis"],
   answer:1,
   why:"Small, frequent voids under 150 mL are a sign of bladder distention — she's overflowing, not emptying, and the full bladder risks displacing the uterus."}
},
{ id:"focused", title:"Focused Assessment & Risk Factors", kicker:"What you assess, and who's at risk",
  blocks:[
   {p:"A postpartum focused assessment isn't a general check-in — it's a specific list of systems chosen because they're the ones most likely to reveal a developing complication before it becomes an emergency."},
   {list:[
    "<strong>Vital signs</strong> — watch specifically for orthostatic hypotension, since blood loss and fluid shifts raise fall risk with first ambulation",
    "<strong>Fundus</strong> — firm, midline, appropriately descending",
    "<strong>Lochia</strong> — color, amount, odor",
    "<strong>Perineum</strong> — using REEDA/RETA",
    "<strong>Bladder</strong> — emptying appropriately, not retaining",
    "<strong>Breasts</strong> — for engorgement, cracking, or signs of mastitis",
    "Lower extremities — a DVT check (Homan's sign, though a negative Homan's does not fully rule out DVT), edema, deep tendon reflexes",
    "<strong>Emotional status</strong> — assessed as part of every focused assessment, not an optional add-on, given how common mood changes are in this period"]},
   {h:"Overlapping risk factors — hemorrhage and infection share a cause"},
   {p:"It's not a coincidence that certain risk factors show up on both lists below. Anything that stretches labor out, or puts hands and instruments inside the uterus, raises both risks simultaneously — a stressed, overworked uterus is both more likely to bleed and more likely to become infected."},
   {table:{head:["Hemorrhage risk factors","Infection risk factors"],rows:[
     ["Grand multiparity, prolonged/precipitous labor, retained placenta, operative delivery","Operative delivery, multiple vaginal exams, prolonged ROM (>24h), diabetes"]]}},
   {hook:"The lists overlap on purpose — anything that stretches labor or puts instruments/hands in the uterus raises both risks at once. When you see a patient flagged for one, it's worth checking whether her history also flags her for the other."}
  ],
  check:{stem:"Which postpartum patient is at highest risk for BOTH hemorrhage and infection?",
   options:["A primigravida with a 4-hour spontaneous vaginal delivery","A patient with 26-hour labor, ROM 30 hours, forceps-assisted delivery","A patient at 39 weeks with no interventions","A scheduled cesarean with intact membranes"],
   answer:1,
   why:"Prolonged labor, prolonged ROM (>24h), and forceps all appear on both risk lists — this patient is flagged twice."}
},
{ id:"mood", title:"Mood & Discharge", kicker:"Rubin's phases, blues vs. depression vs. psychosis, and what goes home with her",
  blocks:[
   {h:"Rubin's phases — maternal psychological adjustment"},
   {p:"Becoming a mother is a psychological transition as much as a physical one, and Rubin described it as unfolding in three predictable phases. Recognizing which phase a patient is in tells you how much teaching she's ready to absorb right now."},
   {table:{head:["Phase","Timing","What it looks like"],rows:[
     ["Taking-In","Day 1–2","Passive, dependent, focused on own needs (sleep, food); recounts the birth experience repeatedly as she processes it"],
     ["Taking-Hold","Day 2+","Active, takes charge of infant care, seeks information, may have self-doubt — the PRIME time for teaching"],
     ["Letting-Go","Later","Assumes the parenting role; sees the infant as a separate individual; resumes her role as a partner"]]}},
   {hook:"<b>Taking-Hold is the teaching window</b> — she's motivated and ready to learn, but also vulnerable to feeling like she's failing, so frame teaching supportively, not critically. Trying to teach detailed newborn care during Taking-In, when she's still passive and focused inward, tends to fall flat — she isn't in the headspace to absorb it yet."},
   {h:"Postpartum blues, depression, and psychosis — a spectrum, not one condition"},
   {p:"These three terms get used loosely outside of clinical settings, but they describe genuinely different severities that call for different responses."},
   {list:["<strong>Postpartum blues</strong> affects <strong>70–80%</strong> of new mothers, should NOT last longer than <strong>2 weeks</strong>, and is not the same thing as postpartum depression or psychosis"]},
   {hook:"The 2-week line is the exam point: mild + resolves within 2 weeks = blues. Persistent, worsening, or beyond 2 weeks = depression → needs referral."},
   {h:"Postpartum psychosis — a psychiatric emergency"},
   {p:"Red flags: confusion, disorganized thinking/behavior, hallucinations (e.g., conversations with herself), paranoia, or thoughts of harming self or infant. This is <strong>NOT</strong> managed like blues — it requires <strong>immediate evaluation</strong> (ER or emergency psychiatric assessment), not outpatient follow-up or a medication pickup. The distinguishing feature from blues and even from depression is the presence of psychotic symptoms — losing touch with reality — which carries real risk to both mother and infant and cannot wait for a routine appointment."},
   {h:"Discharge — medications to confirm were given"},
   {list:["RhoGam (if Rh-negative)","Rubella vaccine (if non-immune — a live vaccine, so timing around future pregnancy matters)","Tdap"]},
   {h:"Discharge teaching — ACHES"},
   {p:"For any patient going home on estrogen-containing contraception, ACHES gives a memorable list of warning signs tied to serious vascular complications."},
   {table:{head:["Letter","Warning sign"],rows:[
     ["A","Abdominal pain"],
     ["C","Chest pain"],
     ["H","Headaches (severe)"],
     ["E","Eye problems (vision changes)"],
     ["S","Severe leg pain/swelling (calf)"]]}},
   {h:"Other signs to report immediately postpartum"},
   {list:["Saturating a pad within 1 hour, or pooling of blood under the buttocks","Foul-smelling discharge, fever/chills","Worsening or new perineal/uterine pain","Dyspnea, chest pain","Depression or mood changes affecting relationships/function","Oliguria — urine output <30 mL/hr (the 'red zone' danger sign)"]},
   {h:"Newborns' & Mothers' Health Protection Act (1995)"},
   {list:["Insurance must cover <strong>48-hr stay (vaginal)</strong> / <strong>96-hr stay (C-section)</strong>","Patient cannot be coerced into early discharge"]},
   {h:"Postpartum discharge basics"},
   {list:["Follow-up visit within first 3 weeks, then again before 12 weeks postpartum","No heavy lifting (nothing heavier than the baby in its carrier)","Resume intercourse 2–4 weeks after birth once bleeding stopped and perineum healed","Lactation suppression (non-breastfeeding): supportive bra x72 hrs, avoid nipple stimulation/warm water, ice packs/cold cabbage leaves for engorgement"]}
  ],
  check:{stem:"A significant other calls reporting the postpartum client is confused, having conversations with herself, and acting paranoid. What's the priority response?",
   options:["Tell him to bring her to the office for medication","Tell him she needs outpatient behavioral therapy","Tell him to take her to the emergency room for evaluation","Reassure him this is normal postpartum blues"],
   answer:2,
   why:"These symptoms are consistent with postpartum psychosis, a psychiatric emergency with risk of harm to self or infant — it requires immediate evaluation and likely hospitalization, not routine outpatient care."}
},
{ id:"lactation", title:"Lactation & Breastfeeding", kicker:"Oxytocin, prolactin, colostrum, and getting the latch right",
  blocks:[
   {h:"Key hormones — production and delivery are two separate jobs"},
   {table:{head:["Hormone/substance","Role"],rows:[
     ["Oxytocin","Causes milk ejection (the 'let-down' reflex) — this is the same hormone responsible for uterine contraction, which is why breastfeeding also supports involution"],
     ["Prolactin","Stimulates milk production itself"],
     ["Colostrum","Early, antibody-rich first milk, produced in small quantities before mature milk comes in"]]}},
   {h:"Breastfeeding advantages"},
   {list:["Enhanced infant immunity","Optimal nutrition","Promotes maternal-infant bonding","Decreases risk of certain infant diseases","Supports maternal uterine involution, since the oxytocin release from nursing helps the uterus contract","Cost-effective"]},
   {h:"Positioning & technique"},
   {list:[
    "Common holds: <strong>cradle</strong> and <strong>football</strong> hold",
    "Feed 15–20 minutes per side; begin each feeding on the side last nursed (track with a reminder like a bracelet)",
    "Break the latch by inserting a clean finger into the baby's mouth before removing from breast — <strong>never pull the baby off</strong> (causes nipple trauma)",
    "For cracked nipples: use <strong>lanolin cream</strong> and leave nipples open to air after feeding; ensure latch includes the whole areola, rotate/limit time on the sore side",
    "For engorgement: ice packs or chilled cabbage leaves between feedings; warm soaks/shower just before feeding to encourage let-down"]},
   {hook:"Waterproof pads inside the bra trap moisture and <b>cause skin breakdown</b> — not a fix for leaking. Use absorbent breast pads instead."},
   {h:"Newborn hunger cues — read the early signs, not just the cry"},
   {p:"Teach parents that crying is actually a <strong>LATE</strong> sign of hunger — by the time an infant is crying, it's already frustrated and may latch less effectively. Early cues include stretching, eyes opening, yawning, rooting, and sticking the tongue out. Feeding on these earlier cues, rather than waiting for crying, generally produces a calmer feeding session and a better latch."},
   {h:"Nutrition & supplementation"},
   {list:[
    "Continue prenatal vitamins; increase hydration and 300–500 kcal/day while breastfeeding",
    "Ensure iron supplementation for exclusively breastfed infants — iron stores deplete around 4 months",
    "Caregivers should watch for foods baby may not tolerate in breast milk (e.g., caffeine, cruciferous vegetables, chocolate)"]},
   {h:"Mastitis vs. engorgement — tell them apart"},
   {p:"Both present with breast discomfort, but the distribution and systemic symptoms point in different directions, and they call for different treatment."},
   {table:{head:["","Mastitis","Engorgement"],rows:[
     ["Distribution","Usually UNILATERAL","Typically BILATERAL"],
     ["Systemic symptoms","Fever, chills, flu-like symptoms","None — localized fullness/discomfort only"],
     ["Resolves with","Antibiotics + continued feeding/emptying","Feeding or manual expression"]]}}
  ],
  check:{stem:"The nurse teaches a first-time breastfeeding mother how to reduce her risk of skin breakdown. Which recommendation is correct?",
   options:["Wear waterproof pads inside your bra","Insert your finger into the baby's mouth before removing the baby from your breast","Breastfeed every 4 hours only","Feed from only one breast per session, alternating breasts at each feeding"],
   answer:1,
   why:"Breaking the latch with a clean finger before removing the baby prevents nipple trauma. Waterproof pads trap moisture and cause breakdown; breastfeeding is on-demand (roughly every 2–3 hrs), and both breasts are used at each feeding."}
}
]};

const U5 = { title:"Sexuality", sub:"Male sexual health, menstrual function, infertility, family planning, and STIs.", lessons:[
{ id:"ed", title:"Erectile Dysfunction", kicker:"Inability to attain/maintain an erection sufficient for intercourse",
  blocks:[
   {p:"Erectile dysfunction affects roughly <strong>30 million American men</strong>, with prevalence rising sharply with age — about <strong>47% of men over 75</strong> are affected. Understanding the mechanism makes the whole topic click into place: an erection depends on autonomic nerve signaling that triggers arteriolar dilation, which fills the corpus cavernosum with blood. Neurologic dysfunction — from any cause — interrupts that signal, reduces the dilation, and compromises the perfusion needed to sustain an erection. Once you see ED as fundamentally a blood-flow and nerve-signaling problem, the entire risk factor list below stops looking like an arbitrary list of unrelated conditions."},
   {h:"Primary vs. secondary — a distinction based on history, not cause"},
   {table:{head:["Type","Definition"],rows:[
     ["Primary","Patient has never achieved a sufficient erection"],
     ["Secondary","Patient has achieved an erection and completed intercourse successfully in the past, but can no longer do so reliably"]]}},
   {h:"Assessment & risk factors — nearly all of them are vascular or neurologic"},
   {list:["Detailed health/sexual/psychosocial history, medication list, smoking habits","Physical findings: anxious appearance, signs of depression, reduced body hair, testicular atrophy, penis deformity","Risk factors, almost all traceable back to vascular or nerve damage: overweight, stress, smoking, certain medications, inactivity, obstructive sleep apnea, restless leg syndrome, pelvic injury/surgery, prostate cancer treatment"]},
   {h:"Diagnostics — each test rules something specific in or out"},
   {list:["CBC (rule out infection)","PSA (rule out prostate cancer)","Testosterone (checks for a hormonal contributor)","HgbA1C (uncontrolled diabetes damages both nerves and blood vessels)","Lipid profile (atherosclerosis is a vascular cause of ED)","Blood flow studies/ultrasound and angiography (directly assess the vascular supply itself)"]},
   {h:"How the workup drives treatment choice"},
   {p:"ED treatment isn't one-size-fits-all — it follows directly from what the workup finds. <strong>Organic ED</strong> (a physical cause identified through the diagnostics above — vascular, neurologic, hormonal) is treated by addressing that underlying cause alongside symptomatic medication. <strong>Psychogenic ED</strong> (no physical cause found, often tied to performance anxiety or depression) responds better to therapy/counseling than to medication alone. This is exactly why the history and diagnostics come before treatment selection in the first place — treating a hormonal cause with a PDE5 inhibitor alone, for example, misses the actual driver of the problem."},
   {h:"Treatment"},
   {list:[
    "<strong>PDE5 inhibitors:</strong> sildenafil, tadalafil, vardenafil — relax smooth muscle and vasodilate, directly addressing the mechanism described above; <strong>tadalafil may be safer for patients with cardiac history</strong>",
    "Injectable medications, hormone/testosterone replacement (gel absorbs in ~2 hrs — cover the area before contact with others to avoid transferring hormone; patch applied daily to hairless skin, rotating sites)",
    "Mechanical devices: vacuum devices, O-rings, implants — options that work around the vascular/nerve problem rather than treating it directly"]},
   {h:"Sildenafil (Viagra) — the SATA goldmine"},
   {list:[
    "Side effects: <strong>priapism</strong> (erection >4 hours), headache, and <strong>blue-tinted vision</strong> (a distinctive visual side effect worth remembering specifically because it's unusual enough to be tested)",
    "Take <strong>30–60 minutes</strong> before anticipated intercourse; wait <strong>at least 24 hours</strong> between doses",
    "<strong>Absolute contraindication</strong> with any nitrate (nitroglycerin, isosorbide) — risk of cardiovascular collapse"]},
   {hook:"PDE5 inhibitors + nitrates = <b>profound hypotension/cardiac arrest risk</b> — never combine. Both drug classes work by vasodilation, so stacking them doesn't just add their effects, it compounds them into a genuinely dangerous blood pressure drop. Also watch for priapism (erection >4 hours = emergency, seek care immediately)."}
  ],
  check:{stem:"A 58-year-old with a history of angina asks about starting sildenafil. Which history item requires notifying the provider first?",
   options:["He uses sublingual nitroglycerin for chest pain","He drinks two cups of coffee daily","He had a UTI last year","He takes a daily multivitamin"],
   answer:0,
   why:"Both nitrates and PDE5 inhibitors are vasodilators. Combining them causes profound, potentially fatal hypotension — this is the absolute contraindication to catch."}
},
{ id:"menomen", title:"Menstrual Dysfunction & Menopause", kicker:"Amenorrhea, dysmenorrhea, PMS/PMDD, endometriosis, and the transition to menopause",
  blocks:[
   {h:"Amenorrhea"},
   {p:"Amenorrhea is the absence of menstrual periods, and the distinction between primary and secondary matters because it points toward completely different causes. <strong>Primary amenorrhea</strong> means no menses by age 15 despite otherwise normal growth and development. <strong>Secondary amenorrhea</strong> means periods that were previously regular have stopped for 3 or more cycles, or 6 months. Whenever a sexually active patient of reproductive age presents with secondary amenorrhea, pregnancy is always the first thing ruled out before any other workup begins — it's the most common cause by far, and treating it as anything else first risks missing an actual pregnancy."},
   {h:"Menstrual bleeding pattern terms"},
   {list:[
    "<strong>Menorrhagia</strong> — excessive or prolonged menstrual bleeding",
    "<strong>Metrorrhagia</strong> — bleeding between periods, at unexpected times in the cycle"]},
   {h:"Dysmenorrhea — painful periods, and why they're painful"},
   {p:"Dysmenorrhea is caused by excessive <strong>prostaglandins</strong>, which trigger stronger uterine contractions than necessary and reduce blood flow to the uterine muscle — the same basic mechanism behind other kinds of cramping pain caused by muscle ischemia. Primary and secondary dysmenorrhea are distinguished mainly by timing and cause:"},
   {table:{head:["","Primary dysmenorrhea","Secondary dysmenorrhea"],rows:[
     ["Cycle type","Occurs in ovulatory cycles","Not limited to ovulatory cycles"],
     ["Onset","Within about 1 year of menarche","Develops later in life"],
     ["Pattern over time","Tends to decrease with age","Tends to persist or worsen"],
     ["Cause","Functional — excess prostaglandins, no structural disease","Pathologic — an underlying condition like endometriosis, fibroids, or ovarian cysts"]]}},
   {p:"Dysmenorrhea affects <strong>50–90%</strong> of females, with about <strong>10%</strong> incapacitated for 1–3 days per cycle — it's genuinely common, not a rare complaint. Early age of menarche is a recognized risk factor."},
   {list:[
    "<strong>NSAIDs (ibuprofen/naproxen) are first-line</strong> — and the timing matters: teach patients to take them BEFORE pain becomes severe, since NSAIDs work by blocking prostaglandin production going forward, not by reversing pain that's already underway",
    "Non-pharmacologic measures: heating pad to the lower abdomen, light exercise, increased fluid intake, a low-sodium/low-sugar diet",
    "Supplements sometimes used: ginger, vitamin B1/B6/D3/E"]},
   {hook:"When a patient takes NSAIDs regularly for dysmenorrhea, teach them to watch for and report <b>dark, tarry stools</b> — a sign of GI bleeding from chronic NSAID use, since NSAIDs also reduce the protective prostaglandins that normally shield the stomach lining."},
   {h:"PMS & PMDD"},
   {list:[
    "<strong>PMS:</strong> physical/emotional symptoms occurring 5 days before to 4 days after menses (bloating, irritability, fatigue, food cravings)",
    "<strong>PMDD (Premenstrual Dysphoric Disorder):</strong> a more extreme variant of the same timing pattern, but with severe mood shifts, panic attacks, and depression layered on top of the usual PMS symptoms"]},
   {h:"Endometriosis"},
   {p:"Endometriosis is endometrial-like tissue implanted outside the uterus — on the ovaries, colon, or other abdominal organs. Because this tissue still responds to the menstrual cycle's hormonal signals, it bleeds every month just like the uterine lining does, except this blood has nowhere to go, which is exactly why it produces pelvic pain, painful intercourse (dyspareunia), infertility, and abnormal bleeding. Management focuses on suppressing that monthly cyclical stimulation — hormonal contraceptives to shrink the tissue, other medications, or surgery when needed."},
   {h:"Menopause — definitions and the perimenopausal lead-up"},
   {list:[
    "Definition: permanent cessation of menses, confirmed retrospectively after <strong>12 months without a period</strong>",
    "<strong>Perimenopause</strong> = the irregular transition period leading up to it, typically starting around 4 years before the final period, marked by fluctuating hormone levels",
    "Average age: <strong>51</strong>",
    "Estrogen drops by roughly 90%, with downstream effects on breast tissue, skin, bone density, and cardiovascular risk"]},
   {h:"Why menopause raises cardiovascular risk — the estrogen connection"},
   {p:"Estrogen isn't just a reproductive hormone — while present, it actively protects the cardiovascular system by raising HDL and lowering LDL cholesterol, improving vascular elasticity through vasodilation (which also helps keep blood pressure lower), and suppressing pro-inflammatory substances that damage blood vessel walls. When estrogen drops sharply at menopause, all three of those protective effects fade at once, which is exactly why coronary heart disease risk rises in the postmenopausal years."},
   {h:"Treatment"},
   {list:["Hormone Replacement Therapy (estrogen most effective, ± progesterone; vaginal estrogen for localized dryness) vs. non-hormonal options (antidepressants for hot flashes, lubricants for dryness)","Osteoporosis prevention: calcium + vitamin D, weight-bearing exercise, bone density testing","Comfort measures: dress in layers, use an overhead fan, avoid caffeine/alcohol to reduce hot flash triggers"]},
   {hook:"The <b>Women's Health Initiative</b> study (updated <b>2002</b>) found HT has a complex risk/benefit pattern — appropriate for symptom relief but <b>not supported for chronic disease prevention</b>, and contraindicated after breast cancer, MI, stroke, or blood clot. In other words: HRT treats the symptoms of falling estrogen, but it is not prescribed as a strategy to prevent the cardiovascular risk that falling estrogen also causes."}
  ],
  check:{stem:"A 52-year-old whose periods stopped 14 months ago wants estrogen to 'prevent heart attacks.' What's the correct response?",
   options:["That's correct — estrogen prevents coronary disease after menopause","HRT can relieve symptoms like hot flashes, but research doesn't support its use to prevent chronic disease","Estrogen is safe for everyone if progesterone is added","She'll need it for life once she starts"],
   answer:1,
   why:"WHI findings: hormone therapy is appropriate for symptom management in some women but is not supported for chronic disease prevention."}
},
{ id:"infertfam", title:"Infertility & Family Planning", kicker:"Diagnosis, treatment ladder, and contraception",
  blocks:[
   {h:"Infertility"},
   {list:[
    "Definition: no conception after <strong>≥12 months</strong> of unprotected intercourse",
    "Affects <strong>1 in 6 couples</strong>",
    "Causes split roughly: male 33% / female 33% / unknown 33% — a genuinely even three-way split, which is why both partners are worked up rather than assuming the problem lies with one",
    "Male factor: <strong>varicocele is the most common cause</strong>; also heat exposure (hot tubs, tight clothing) can impair sperm production",
    "<strong>Ovulation detection:</strong> the LH surge occurs 12–36 hours before ovulation, which is the basis for ovulation predictor kits; basal body temperature rises after ovulation has already occurred"]},
   {hook:"<b>The 'Rule of 1 Year'</b> — both menopause (12 months without a period) and infertility (12 months of unprotected intercourse without conception) share this same one-year benchmark. Easy to mix up which direction it points."},
   {h:"Infertility diagnostic workup"},
   {p:"Semen analysis is typically done first specifically because it's the least invasive and least expensive test available — it makes sense to rule out or confirm a male factor before moving to more invasive female testing."},
   {table:{head:["Partner","Test","Purpose"],rows:[
     ["Male","Semen analysis","First test performed — non-invasive; checks count/motility"],
     ["Female","Hysterosalpingogram (HSG)","Radiopaque dye to check tubal patency"],
     ["Female","Hormonal assays","FSH, LH, progesterone — evaluate ovulation"],
     ["Female","Transvaginal ultrasound","Visualizes pelvic anatomy and follicular development"],
     ["Couple","Postcoital test","Evaluates sperm survival in cervical mucus"]]}},
   {h:"The infertility treatment ladder — escalating from least to most invasive"},
   {p:"Treatment doesn't jump straight to the most advanced option — it escalates step by step, trying the least invasive and least expensive approach first before moving on."},
   {table:{head:["Step","Treatment","What it does"],rows:[
     ["1","Clomiphene (Clomid)","Improves the chances of ovulating regularly — first-line for ovulatory dysfunction"],
     ["2","Hormone injections","Improves ovulation chances if Clomid alone isn't successful"],
     ["3","Intrauterine insemination (IUI)","A catheter places sperm directly into the uterus, timed right before ovulation"],
     ["4","In vitro fertilization (IVF)","A multi-step process, typically the last-line option (~35% success rate, can cost thousands out of pocket)"]]}},
   {p:"IVF itself unfolds in four distinct steps: hormone injections for several weeks to stimulate the ovaries to mature multiple eggs at once; a minor procedure using a thin needle to retrieve the eggs directly from the ovaries; fertilization of the eggs with sperm in a laboratory dish; and finally, transfer of the resulting embryo(s) into the uterus, where implantation hopefully occurs."},

   {table:{head:["Method","Mechanism","Key teaching point"],rows:[
     ["Combined OCP","Inhibits ovulation","Increases clot (DVT/PE) risk — contraindicated in smokers over 35 or history of clots; use backup if a dose is missed; report ACHES"],
     ["IUD (hormonal)","Thins lining, thickens cervical mucus","Risk of perforation/spotting; check the string monthly; contraindicated with current pelvic infection or undiagnosed vaginal bleeding"],
     ["Depo-Provera (medroxyprogesterone)","Delays ovulation","Risk of decreased BONE DENSITY — counsel on calcium/vitamin D and weight-bearing exercise"],
     ["Emergency contraception (Plan B)","Delays ovulation","Must be taken within 72 hours; nausea/cycle changes common; contraindicated if already pregnant"],
     ["NuvaRing","Continuous hormone release","Stays in the vagina 3 weeks, then removed for 1 week to allow menstruation"],
     ["Diaphragm","Barrier","Must stay in place at least 6 hours after intercourse to be effective"],
     ["Vasectomy","Blocks sperm transport (vas deferens)","NOT immediately sterile — sperm can remain viable in the reproductive tract for up to 6 months; couples need a backup method until <strong>two consecutive negative semen analyses</strong> confirm sterility"]]}},

   {hook:"Hormonal contraceptives prevent pregnancy, <b>not infection</b> — condoms should still be used with all sexual activity. Best to be off oral contraceptives 1–2 months before attempting to conceive. Antibiotics can reduce OCP effectiveness — backup contraception is needed until the start of the next menstrual period."}

{ id:"stis", title:"Sexually Transmitted Infections", kicker:"Organism categories, curability, and reporting",
  blocks:[
   {p:"STIs are caused by organisms from five categories — bacteria, viruses, fungi, protozoa, and parasites — and which category an infection falls into determines almost everything else about it: whether it's curable, how urgently it needs partner treatment, and what the reporting requirements are. As a rule, <strong>bacterial and protozoal/fungal STIs are curable</strong> with the right antibiotic or antifungal; <strong>viral STIs are not curable</strong>, only manageable."},
   {h:"Gonorrhea"},
   {p:"Caused by <em>Neisseria gonorrhoeae</em> (bacteria), incubation period 2–8 days. In females: purulent urethral/vaginal discharge, a red and edematous urethral meatus, a friable cervix with greenish-yellow discharge, and risk of pelvic inflammatory disease. In males: mucopurulent or purulent urethral discharge and penile edema. Either sex can develop fever, rectal or pharyngeal infection, or arthritis. <strong>Gonorrhea frequently co-occurs with chlamydia</strong>, which is why treatment covers both."},
   {p:"Treatment: <strong>ceftriaxone IM (single dose)</strong>, plus doxycycline for presumptive chlamydia coverage in nonpregnant patients. Curable: yes. Report all cases to public health authorities; partners must be notified and treated."},
   {h:"Chlamydia"},
   {p:"Caused by <em>Chlamydia trachomatis</em> (bacteria). Often asymptomatic, especially in men. In females: cervicitis, urethritis, intermenstrual bleeding, and mucopurulent discharge. In males: dysuria and urethral discharge."},
   {p:"Treatment: <strong>doxycycline</strong> first-line (azithromycin or levofloxacin as alternatives; azithromycin preferred in pregnancy). Curable: yes."},
   {h:"Syphilis"},
   {p:"Caused by <em>Treponema pallidum</em> (bacteria), incubation 3–6 weeks. Progresses through stages if untreated: a <strong>painless chancre</strong> at the primary stage, then a rash — classically on the palms and soles — at the secondary stage, then a latent period with no symptoms, and finally late-stage neurologic and cardiovascular damage."},
   {p:"Treatment: <strong>penicillin G (IM)</strong>, the gold-standard treatment. Curable: yes, especially when treated early. Report all cases to public health."},
   {hook:"<b>Jarisch-Herxheimer reaction:</b> watch for this after giving penicillin for syphilis — a systemic response (fever, hypotension, tachycardia) as spirochetes are killed off and release inflammatory material. It typically lasts about 24 hours and is <b>not</b> a penicillin allergy — don't withhold future penicillin doses because of it."},
   {h:"Genital yeast infection (not classified as an STI, but sexually transmissible)"},
   {p:"Caused by <em>Candida</em> (fungus). Presents with vulvar itching, redness, and a thick white ('cottage cheese') discharge. Treatment: antifungals — oral fluconazole or topical agents. Curable: yes."},
   {h:"Bacterial vaginosis (BV)"},
   {p:"Caused by an overgrowth of <em>Gardnerella vaginalis</em> and other normal vaginal bacteria. Presents with a <strong>gray, thin, fishy-smelling discharge</strong>, confirmed on exam by a positive <strong>whiff test</strong> (an amine/fishy odor released when a sample is mixed with potassium hydroxide). Treatment: <strong>metronidazole</strong>. Curable: yes."},
   {h:"Trichomoniasis"},
   {p:"Caused by <em>Trichomonas vaginalis</em> (a protozoan) — the most common curable STI in the US. Classically presents with a <strong>frothy, malodorous, yellow-green discharge</strong> and the hallmark <strong>'strawberry cervix'</strong> on exam. Treatment: <strong>metronidazole (Flagyl)</strong> — and partner treatment is essential, since reinfection from an untreated partner is common."},
   {hook:"Metronidazole (used for both BV and trichomoniasis) causes a <b>disulfiram-like reaction</b> with alcohol — it inhibits acetaldehyde dehydrogenase, letting toxic acetaldehyde build up. Symptoms (severe flushing, vomiting, tachycardia, hypotension) appear within <b>10–30 minutes</b> of drinking. Teach patients to avoid all alcohol during treatment and for a period after finishing it."},
   {h:"HPV (Human Papillomavirus)"},
   {p:"A virus, and the primary risk factor for cervical cancer. May cause cauliflower-like genital warts, or may be entirely asymptomatic. Treatment: topical medications or cryotherapy to remove visible warts — but this treats the lesions, not the underlying viral infection. Prevention: the <strong>Gardasil vaccine</strong>. Curable: no."},
   {h:"HSV (Herpes Simplex Virus)"},
   {p:"A virus, causing painful vesicles/ulcers and malaise. Treatment: <strong>acyclovir</strong> (or related antivirals) to control outbreak frequency and severity. Curable: no — antivirals suppress outbreaks, they don't eliminate the virus, and viral shedding (and transmission risk) can occur even without visible lesions."},
   {h:"Quick reference — organism and curability at a glance"},
   {table:{head:["Infection","Organism","Curable?"],rows:[
     ["Gonorrhea","Neisseria gonorrhoeae (bacteria)","Yes"],
     ["Chlamydia","Chlamydia trachomatis (bacteria)","Yes"],
     ["Syphilis","Treponema pallidum (bacteria)","Yes (esp. treated early)"],
     ["Genital yeast","Candida (fungus)","Yes"],
     ["Bacterial vaginosis","Gardnerella vaginalis (bacteria)","Yes"],
     ["Trichomoniasis","Trichomonas vaginalis (protozoa)","Yes"],
     ["HPV","Papillomavirus (virus)","No"],
     ["HSV","Herpesvirus hominis (virus)","No"]]}},
   {h:"Neonatal transmission (why maternal screening matters)"},
   {list:[
    "<strong>Gonorrhea/Chlamydia →</strong> neonatal conjunctivitis (ophthalmia neonatorum) or pneumonia — this is why <strong>erythromycin ophthalmic ointment</strong> is given to every newborn shortly after birth (<strong>required by law in all 50 states</strong>)",
    "Chlamydia conjunctivitis may also present with hypertrophic pyloric stenosis features (watch for projectile vomiting, feeding intolerance)",
    "<strong>Syphilis</strong> crosses the placenta as early as 18 weeks — congenital syphilis causes physical anomalies, CNS damage, and hearing loss",
    "<strong>HSV</strong> active genital lesions at term → indication for cesarean birth to prevent neonatal transmission"]},
   {p:"Note: HIV/AIDS is covered later this semester; Hepatitis was covered in NUR 113."}
  ],
  check:{stem:"A patient asks whether treatment for genital warts (HPV) will cure the infection. What's the accurate response?",
   options:["Yes, the topical medication eliminates the virus","Treatment removes/clears the lesions, but HPV itself is not curable — barrier methods are still needed","Warts falling off with cryotherapy means it's cured","Only the vaccine can cure an existing infection"],
   answer:1,
   why:"HPV is not curable — treatments address the lesions, not the virus. Barrier methods and avoiding contact until lesions heal remain part of teaching."}
}
]};

{ id:"medlabor", title:"Labor, Induction & Ripening Drugs", kicker:"Oxytocin, Cervadil, Cytotec, and Magnesium Sulfate",
  blocks:[
   {h:"Oxytocin (Pitocin)"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","Induce or augment labor (start ~1 milliunit/min, titrate by 1–2 mU every 30–60 min); control postpartum hemorrhage (10–40 units IV)"],
     ["Mechanism of action","A synthetic version of the natural hormone oxytocin — causes potent, selective stimulation of uterine and mammary smooth muscle. Unlike the natural hormone, it does NOT cross the blood-brain barrier, so it does not trigger the endorphin release that naturally blunts labor pain"],
     ["Adverse reactions","Uterine tachysystole; fetal distress; water retention/fluid overload (antidiuretic effect); rare but serious: seizures, subarachnoid hemorrhage; postpartum hemorrhage from uterine hypersensitivity/fatigue"],
     ["Contraindications","Situations where vaginal delivery isn't advised: placenta previa, active genital herpes, fetal malpresentation, severe fetal distress, prior classical uterine incision"],
     ["Nursing interventions","IV via infusion pump ONLY — never a free-flowing line; monitor contractions, maternal HR/BP, FHR, and blood loss every 15 minutes; monitor I&O for fluid overload; STOP the infusion for tachysystole or non-reassuring FHR"],
     ["Patient education","Explain that induced contractions may feel more continuous/intense than spontaneous labor, since the drug doesn't trigger the body's natural pain-modulating endorphin response"]]}},
   {hook:"Oxytocin shows up on <b>both sides</b> of the postpartum hemorrhage story — it's the treatment for uterine atony after delivery, and prolonged exposure to it during labor is itself a listed risk factor for that same atony. An overstimulated uterus can become too fatigued to contract well once the baby is out."},

   {table:{head:["Category","Detail"],rows:[

     ["Adverse reactions","Uterine tachysystole; non-reassuring FHR"],
     ["Contraindications","Prior cesarean/classical uterine incision (rupture risk); fetal distress"],

{ id:"mednewborn", title:"Newborn Medications", kicker:"Vitamin K, Erythromycin, and Hepatitis B vaccine",

   {h:"Vitamin K (Phytonadione)"},
   {table:{head:["Category","Detail"],rows:[

     ["Mechanism of action","Vitamin K is essential for synthesizing clotting factors II, VII, IX, and X in the liver. It crosses the placenta poorly, and the newborn gut is sterile (no bacteria yet to help produce it), so every newborn is born with very low vitamin K stores and is at risk for bleeding without supplementation"],

{ id:"medrhogam", title:"RhoGam (Rho(D) Immune Globulin)", kicker:"One drug, an entire prevention strategy",
  blocks:[
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","Antenatal prophylaxis for Rh-negative pregnant patients; postpartum prophylaxis if the newborn is Rh-positive; also given after any potential fetal-maternal blood mixing (miscarriage, trauma, amniocentesis, ectopic pregnancy)"],
     ["Mechanism of action","Suppresses the maternal immune system's ability to recognize and mount an antibody response against Rh-positive fetal red blood cells that have entered her circulation — it neutralizes those cells before her body can build antibodies against them"],
     ["Adverse reactions","Chills, fever, dizziness, headache, weakness; hypersensitivity reaction; local injection site redness/soreness (expected, since it's a blood product)"],
     ["Contraindications","<strong>Rh-POSITIVE patients</strong> (nothing to prevent); patients already sensitized — a <strong>positive indirect Coombs test</strong> means antibodies already exist and RhoGam can no longer help; immune thrombocytopenic purpura (ITP), due to intravascular hemolysis risk; do not give with live-virus vaccines or estrogen-containing medications"],
     ["Nursing interventions","Given IM; monitor for hypersensitivity/anaphylaxis for about 20 minutes after administration; monitor ITP patients for at least 8 hours due to higher complication risk; administer slowly in patients with kidney disease"],
     ["Patient education","Explain that this is prophylaxis for FUTURE pregnancies, not treatment for this one — it prevents her from forming antibodies that would attack a future Rh-positive fetus; report back pain, shaking, chills, fever, discolored urine, or hematuria"]]}},
   {h:"The exact timing that makes RhoGam work"},
   {hook:"<strong>Instructor point worth remembering:</strong> if BOTH parents are Rh-negative, RhoGam is not needed at all — there's no way the fetus can be Rh-positive, so there's nothing to sensitize against. RhoGam only matters when the mother is Rh-negative and there's a possibility the fetus is Rh-positive (i.e., the father is Rh-positive or unknown)."},
   {table:{head:["When","Why"],rows:[
     ["~28 weeks gestation","Covers the small amount of fetal-maternal blood mixing that can happen silently throughout pregnancy"],
     ["Within 72 hours of delivery","Covers the much larger blood mixing that happens at birth itself, IF the newborn is confirmed Rh-positive"],
     ["After any sensitizing event","Miscarriage, amniocentesis, trauma, ectopic pregnancy — any event that could mix fetal and maternal blood outside the routine schedule"]]}},
   {hook:"The whole drug only works on a very narrow window: it has to be given <b>before</b> the maternal immune system has already recognized Rh-positive cells and started making antibodies. That's exactly why a positive indirect Coombs test is a contraindication rather than a reason to give a bigger dose — once sensitization has happened, RhoGam can no longer prevent what's already occurred."}
  ],
  check:{stem:"A nurse is preparing to administer RhoGam. Which finding would make the nurse question the order?",

   answer:1,
   why:"A positive indirect Coombs test means the patient is already sensitized — she has already formed anti-Rh antibodies. RhoGam prevents sensitization from occurring; it cannot reverse sensitization that has already happened, so a positive Coombs test is a contraindication."}
},

const U8 = { title:"Med Math", sub:"", lessons:[
{ id:"mathdose", title:"Dosage Calculations & Basic Conversions", kicker:"The building blocks every other calculation relies on",
  blocks:[
   {p:"Before any drip rate or weight-based dose can be calculated, you need to be fluent in the basic conversions underneath them — pounds to kilograms, and the metric ladder from kilograms down to micrograms. Almost every calculation error in practice traces back to a mistake at this level, not the fancier formula built on top of it."},
   {h:"Basic Dosage Calculation"},
   {p:"<strong>Formula:</strong> (Desired ÷ Have) × Quantity = Amount to administer"},
   {p:"<strong>Worked example:</strong> Order is 500 mg PO; available as 250 mg tablets. (500 ÷ 250) × 1 tablet = <strong>2 tablets</strong>."},
   {p:"<strong>Worked example 2:</strong> Order is 2 mg Lorazepam; available as a 4 mg/mL vial. (2 ÷ 4) × 1 mL = <strong>0.5 mL</strong>."},
   {h:"Weight Conversions"},
   {table:{head:["Conversion","Formula","Example"],rows:[
     ["Pounds → kilograms","lbs ÷ 2.2 = kg","154 lbs ÷ 2.2 = 70 kg"],
     ["Kilograms → pounds","kg × 2.2 = lbs","100 kg × 2.2 = 220 lbs"]]}},
   {hook:"Almost every weight-based drug calculation in this unit (Dopamine, Heparin, BSA dosing) starts with converting the patient's weight to kilograms — if that first conversion is wrong, every step after it is wrong too, even if the rest of the math is done perfectly."},
   {h:"Metric System Conversions — the 1000 rule"},
   {p:"Standard medical units (kg, g, mg, mcg) are each separated from their neighbor by a factor of 1000."},
   {table:{head:["Direction","Rule","Example"],rows:[
     ["Larger → smaller (kg→g, g→mg, mg→mcg)","Multiply by 1000 (move the decimal 3 places right)","2 g × 1000 = 2000 mg"],
     ["Smaller → larger (mcg→mg, mg→g, g→kg)","Divide by 1000 (move the decimal 3 places left)","2500 mcg ÷ 1000 = 2.5 mg"]]}},
   {h:"Volume Conversions"},
   {table:{head:["Conversion","Formula","Example"],rows:[
     ["Milliliters → liters","mL ÷ 1000 = L","2500 mL ÷ 1000 = 2.5 L"],
     ["Liters → milliliters","L × 1000 = mL","0.5 L × 1000 = 500 mL"]]}},
   {h:"Household & Volume Equivalents"},
   {table:{head:["Household/Metric","Equivalent"],rows:[

   {hook:"Two of the formulas in your source material — <b>GTPAL</b> and <b>Naegele's Rule</b> — are OB-specific calculations already covered in depth in the Antepartum unit and the Quick Reference unit. They're genuinely 'math,' but they're taught there with the full clinical reasoning behind them rather than repeated here as a bare formula."}

{ id:"mathiv", title:"IV Flow Rates, Drip Rates & Concentration", kicker:"Getting fluid and medication into the vein at the right speed",
  blocks:[
   {p:"These formulas answer one of two questions: how fast should this infusion pump run (mL/hr), or how many drops per minute should a gravity IV be set to (gtt/min) when there's no pump involved? A third formula, concentration, sets up the weight-based drip calculations in the next lesson."},
   {h:"Flow Rate / Infusion Rate (mL/hr) — for infusion pumps"},
   {p:"<strong>Formula:</strong> Total Volume (mL) ÷ Total Time (hr) = mL/hr"},
   {p:"<strong>Worked example:</strong> Infuse 1000 mL of Normal Saline over 8 hours. 1000 ÷ 8 = <strong>125 mL/hr</strong>."},
   {h:"Infusion Time — working backward from a known rate"},
   {p:"<strong>Formula:</strong> Total Volume (mL) ÷ Flow Rate (mL/hr) = Time (hours)"},
   {p:"<strong>Worked example:</strong> A 1000 mL bag is infusing at 125 mL/hr. How long will it last? 1000 ÷ 125 = <strong>8 hours</strong>."},
   {h:"Drip Rate (gtt/min) — for gravity IV tubing without a pump"},
   {p:"There are two equivalent ways to reach the same answer, depending on whether you already know the mL/hr rate or are starting from the total order."},
   {table:{head:["Starting point","Formula"],rows:[
     ["You already know mL/hr","(mL/hr ÷ 60) × Drop Factor (gtt/mL) = gtt/min"],
     ["You're starting from the total order","(Total Volume [mL] × Drop Factor [gtt/mL]) ÷ Time (minutes) = gtt/min"]]}},
   {p:"<strong>Worked example (method 1):</strong> Infuse at 125 mL/hr using tubing with a drop factor of 15 gtt/mL. First, mL/min: 125 ÷ 60 = 2.08 mL/min. Then: 2.08 × 15 = 31.2, rounded to <strong>31 gtt/min</strong>."},
   {p:"<strong>Worked example (method 2):</strong> Infuse 1000 mL over 8 hours (480 minutes) with a drop factor of 15 gtt/mL. (1000 × 15) ÷ 480 = 15,000 ÷ 480 = 31.25, rounded to <strong>31 gtt/min</strong> — the same answer either way, since both methods describe the same infusion."},
   {h:"IV Push Medication Rate"},
   {p:"A common general safety rule for IV push medications is roughly <strong>1 mL per minute</strong> unless the drug's specific administration guidelines say otherwise. <strong>Worked example:</strong> a 10 mL medication is administered over 10 minutes, consistent with the 1 mL/min rule. Pushing too fast is a common cause of adverse drug reactions."},
   {h:"Concentration Calculation — the setup step for weight-based drips"},
   {p:"<strong>Formula:</strong> (Total mg in the bag × 1000) ÷ Total mL in the bag = Concentration (mcg/mL)"},
   {p:"<strong>Worked example:</strong> A bag contains 400 mg of Dopamine in 250 mL of D5W. (400 × 1000) ÷ 250 = <strong>1600 mcg/mL</strong>. This concentration number is exactly what feeds into the weight-based infusion formulas in the next lesson."}
  ],
  check:{stem:"A 500 mL bolus is ordered to infuse over 2 hours using an infusion pump. What rate should the nurse program?",
   options:["100 mL/hr","150 mL/hr","250 mL/hr","500 mL/hr"],
   answer:2,
   why:"500 mL ÷ 2 hr = 250 mL/hr."}
},
{ id:"mathcardiac", title:"Cardiac & Vasoactive Drip Calculations", kicker:"MAP, CPP, and weight-/unit-based infusions",
  blocks:[
   {p:"This lesson groups together the calculations that show up most often in critical care and high-alert medication administration — all of them either measure perfusion pressure directly, or calculate the pump rate for a drug that manipulates that pressure."},
   {h:"MAP — Mean Arterial Pressure"},
   {p:"<strong>Formula:</strong> (Systolic BP + [2 × Diastolic BP]) ÷ 3 = MAP"},
   {p:"<strong>Worked example:</strong> BP is 120/80. (120 + [2 × 80]) ÷ 3 = (120 + 160) ÷ 3 = <strong>93.3 mmHg</strong>."},
   {p:"MAP reflects the average pressure driving blood into the organs across the whole cardiac cycle — it's weighted toward diastole because the heart spends more time in diastole than systole. A MAP of roughly <strong>65 mmHg or higher</strong> is generally considered necessary to maintain adequate organ perfusion in a critically ill patient."},
   {h:"CPP — Cerebral Perfusion Pressure"},
   {p:"<strong>Formula:</strong> MAP − ICP = CPP"},
   {p:"<strong>Worked example:</strong> MAP is 93, ICP is 15. 93 − 15 = <strong>78 mmHg</strong>."},
   {hook:"CPP depends directly on MAP — if you already calculated MAP for a patient, you're one subtraction away from CPP. A CPP that drops too low (generally below ~60 mmHg) risks cerebral ischemia, which is why both numbers are tracked together in a patient with a head injury or elevated ICP."},
   {h:"Weight-Based Infusion (mcg/kg/min) — e.g., Dopamine"},
   {p:"<strong>Formula:</strong> (Desired mcg × kg × 60 minutes) ÷ Concentration (mcg/mL) = mL/hr"},
   {p:"<strong>Worked example:</strong> Order is 5 mcg/kg/min for an 80 kg patient, with a concentration of 1600 mcg/mL (from the concentration calculation in the previous lesson). (5 × 80 × 60) ÷ 1600 = <strong>15 mL/hr</strong>."},
   {h:"Units-Based Infusion (Units/kg/hr) — e.g., Heparin"},
   {p:"<strong>Formula:</strong> (Units × kg) ÷ Concentration (Units/mL) = mL/hr"},
   {p:"<strong>Worked example:</strong> Order is 12 Units/kg/hr for a 100 kg patient, with a concentration of 100 Units/mL. (12 × 100) ÷ 100 = <strong>12 mL/hr</strong>."},
   {hook:"Both weight-based and units-based drips are high-alert medications given by infusion pump only, exactly like oxytocin in the OB units — the shared theme across every high-alert drug in this app is a computerized pump, frequent reassessment, and a clear plan for what triggers stopping or adjusting the rate."}
  ],
  check:{stem:"A patient's blood pressure is 108/60. What is the calculated MAP?",
   options:["68 mmHg","72 mmHg","76 mmHg","84 mmHg"],
   answer:2,
   why:"(108 + [2 × 60]) ÷ 3 = (108 + 120) ÷ 3 = 228 ÷ 3 = 76 mmHg."}
},
{ id:"mathfluid", title:"Fluid Balance, I&O & Tonicity", kicker:"Tracking what goes in, what comes out, and what IV fluids do to cells",
  blocks:[
   {p:"Intake and output tracking is really just accounting for fluid — but two categories (ice chips and continuous bladder irrigation) have special rules that are easy to get wrong, and tonicity explains why the choice of IV fluid itself matters beyond just the volume."},
   {h:"What counts as intake"},
   {list:[
    "<strong>Oral (PO) fluids</strong> — water, juice, soda, milk, coffee",
    "<strong>Liquid foods</strong> — soups, broths, gelatin, sherbet, sorbet, pudding",
    "<strong>Ice chips</strong> — recorded as <strong>half</strong> the original volume (200 mL of ice chips = 100 mL intake), since ice chips are mostly air/space between solid pieces",
    "<strong>IV fluids</strong> — maintenance fluids, boluses, and piggyback medications (like antibiotics)",
    "<strong>Tube feedings</strong> — formula and water flushes",
    "<strong>Irrigation</strong> — only counted as intake if the fluid is NOT recovered in the output"]},
   {h:"What counts as output"},
   {list:["Urine — voided, catheterized, or urostomy drainage","Emesis (vomitus)","Liquid stool — diarrhea or colostomy drainage","Wound drainage — from JP drains, Hemovacs, or chest tubes","Suction — gastric (NG) or respiratory"]},
   {h:"Net Fluid Balance"},
   {p:"<strong>Formula:</strong> Total Intake − Total Output = Net Balance"},
   {p:"<strong>Worked example:</strong> Intake of 3000 mL, output of 800 mL. 3000 − 800 = <strong>+2200 mL</strong> (a positive balance, meaning the patient is retaining more fluid than they're losing)."},
   {h:"Continuous Bladder Irrigation — adjusting urine output"},
   {p:"<strong>Formula:</strong> Total Output − Total Irrigation Volume = Actual Urine Output"},
   {p:"<strong>Worked example:</strong> 24-hour total output is 2500 mL; total irrigation fluid instilled was 1500 mL. 2500 − 1500 = <strong>1000 mL</strong> actual urine output. Without subtracting the irrigation fluid, you'd wildly overestimate how much urine the patient is actually making."},
   {h:"Insensible Loss"},
   {p:"Fluid lost through the skin and lungs that can't be directly measured. Standard estimate: <strong>600–900 mL/day</strong>, or roughly <strong>0.5 mL/kg/hr</strong>. <strong>Worked example:</strong> a 70 kg patient: 0.5 × 70 = 35 mL/hr, or roughly 840 mL/day."},
   {h:"Fluid Weight Calculation"},
   {p:"<strong>Rule of thumb:</strong> a 1 kg weight change equals roughly 1 L of fluid change. <strong>Worked example:</strong> a patient's weight rises 2 kg over two days — that's roughly a 2 L fluid gain, not necessarily 2 kg of actual tissue."},
   {hook:"An output under <b>30 mL/hr</b> is always reported as a potential emergency — it signals inadequate perfusion to the kidneys. This is the exact same 'red zone' oliguria threshold already flagged in the Postpartum and Newborn units for shock/distress — one number, used across every system in the body."},
   {h:"Tonicity — what different IV fluids do to cells"},
   {table:{head:["Type","Solute concentration vs. inside the cell","Effect on the cell","Examples","Clinical use"],rows:[
     ["Hypertonic","Higher outside the cell","Water leaves the cell — it shrinks (plasmolysis)","3% or 5% NaCl; 10% Dextrose in Water","Cerebral edema, severe hyponatremia"],
     ["Hypotonic","Lower outside the cell","Water enters the cell — it swells or bursts (cytolysis)","0.45% NaCl (half normal saline)","Dehydration — pushes water back into cells"],
     ["Isotonic","Equal inside and outside","No net water movement — equilibrium maintained","0.9% Normal Saline, Lactated Ringer's, D5W","Routine IV fluid replacement and hydration"]]}},
   {hook:"A simple way to remember the direction: <b>hyper</b>tonic pulls water <b>OUT</b> of the cell (think 'hyper' = high solute outside, pulling water toward it), while <b>hypo</b>tonic pushes water <b>IN</b>. Isotonic is the 'do no harm' default fluid when you don't want to shift fluid into or out of cells at all."}
  ],
  check:{stem:"A patient's 24-hour output totals 2200 mL, with 900 mL of that being continuous bladder irrigation fluid recovered. What is the patient's actual urine output?",
   options:["900 mL","1300 mL","2200 mL","3100 mL"],
   answer:1,
   why:"Total output (2200 mL) minus the irrigation fluid instilled and recovered (900 mL) = 1300 mL of actual urine output."}
},
{ id:"mathbody", title:"Body Measurement: BMI & BSA", kicker:"Calculations that scale a dose to the patient's size",
  blocks:[
   {p:"These two calculations both answer a version of the same question — how big is this patient, in a way that's useful for dosing or risk assessment? BMI is a general screening number; BSA is a more precise scaling factor used specifically for drugs where getting the dose right really matters."},
   {h:"BMI — Body Mass Index"},
   {table:{head:["System","Formula"],rows:[
     ["Metric","Weight (kg) ÷ [Height (m)]²"],
     ["Imperial","[Weight (lbs) × 703] ÷ [Height (in)]²"]]}},
   {p:"<strong>Worked example (metric):</strong> Weight 70 kg, height 1.75 m. Square the height: 1.75 × 1.75 = 3.0625. Divide weight by that: 70 ÷ 3.0625 = <strong>22.86</strong> (normal weight range)."},
   {p:"<strong>Worked example (imperial):</strong> Weight 154 lbs, height 69 inches. 154 × 703 = 108,262. Square the height: 69 × 69 = 4,761. Divide: 108,262 ÷ 4,761 = <strong>22.74</strong> — the same result as the metric calculation, just arrived at with different starting units."},
   {h:"BSA — Body Surface Area"},
   {p:"BSA approximates a patient's total skin surface area in square meters (m²), and it's used specifically for drugs with a narrow therapeutic index, chemotherapy agents, pediatric patients, and burn patients — situations where a small dosing error has an outsized effect."},
   {p:"<strong>Formula:</strong> BSA = √[(Height in cm × Weight in kg) ÷ 3600]"},
   {h:"Fully worked pediatric dosing example"},
   {p:"Order: Ceftriaxone 2 mg/m². Patient: 37 lb, 97 cm tall. Supply: 1 mg/mL."},
   {list:[
    "<strong>Step 1 — convert weight to kg:</strong> 37 lb ÷ 2.2 = 16.8 kg",
    "<strong>Step 2 — calculate BSA:</strong> √[(97 cm × 16.8 kg) ÷ 3600] = √[1629.6 ÷ 3600] = √0.4527 = <strong>0.67 m²</strong>",
    "<strong>Step 3 — calculate the dose in mg:</strong> 2 mg/m² × 0.67 m² = <strong>1.34 mg</strong>",
    "<strong>Step 4 — calculate the dose in mL:</strong> 1.34 mg ÷ 1 mg/mL = <strong>1.34 mL</strong> to administer"]},
   {hook:"Notice this whole calculation depends on the weight-to-kg conversion from the very first Med Math lesson — get that first step wrong, and every subsequent step (BSA, mg dose, mL dose) inherits the error. This is exactly why that basic conversion lesson exists: it's the foundation everything else in this unit is built on."}
  ],
  check:{stem:"A pediatric patient weighs 44 lb and is 110 cm tall. What is the patient's weight in kilograms, rounded to the nearest tenth?",
   options:["18.2 kg","20.0 kg","22.0 kg","24.2 kg"],
   answer:1,
   why:"44 lb ÷ 2.2 = 20.0 kg."}
}
]};
