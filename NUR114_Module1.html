<header><div class="bannerwrap"><div class="toprow"><div><a class="hublink" href="index.html">&larr; Study Hub</a><h1>NUR 114 · Module 1</h1><div class="sub">Maternal–Newborn Nursing · Growth &amp; Development / Health Promotion</div></div><button id="back" hidden>Back</button></div></div></header>
<main class="wrap" id="app"></main>
<script>
const U1 = { title:"Antepartum", sub:"Prenatal care from preconception through the third trimester.", lessons:[
{ id:"precon", title:"Preconception & Confirming Pregnancy", kicker:"Care ideally begins before conception",
  blocks:[
   {p:"Prenatal care is often described as starting at the first missed period, but the healthiest version of it actually starts earlier than that — before conception happens at all. This matters clinically because several of the most damaging things to a developing fetus happen in the first few weeks after conception, often before a woman even knows she's pregnant. A preconception visit is the nurse's chance to fix problems while there's no fetus yet to be affected by the fix itself."},
   {h:"What's covered at a preconception visit, and why each item matters"},
   {list:[
    "<strong>STI screening</strong> — untreated infections like chlamydia or syphilis can cause infertility, miscarriage, or congenital infection if pregnancy occurs while they're active; better to clear them beforehand",
    "<strong>Health history, sexual history, vaccination status</strong> — specifically <strong>rubella immunity</strong> is checked here because the MMR vaccine is a <strong>live vaccine</strong> and cannot be given during pregnancy. If she's not immune, she needs the vaccine now and then to wait to conceive, or she'll have to wait until after delivery to get it",
    "<strong>Previous pregnancies and problems</strong> — prior complications (preterm birth, preeclampsia, gestational diabetes) are the single best predictor of risk in the next pregnancy",
    "<strong>Current medications and contraceptives</strong> — some medications are teratogenic (harmful to a developing fetus) and need to be swapped out before conception, not after a positive test; contraception also needs to be stopped in a way that lets you date the pregnancy accurately",
    "<strong>Illicit drug use, alcohol, smoking</strong> — all cross the placenta once pregnancy begins; addressing use before conception protects the fetus from day one instead of from the day of diagnosis",
    "<strong>Menstrual cycle history</strong> — needed to estimate ovulation timing and, later, to calculate the due date",
    "<strong>Prenatal vitamins with folic acid</strong> — this is the single most time-sensitive item on this list, explained below"]},
   {h:"Why folic acid can't wait for a positive pregnancy test"},
   {p:"Folic acid prevents neural tube defects (like spina bifida) by supporting closure of the fetal neural tube. That closure happens by about <strong>day 28 of gestation</strong> — roughly 4 weeks after the last menstrual period, which is right around the time a period would be expected and well before most home pregnancy tests are even taken. Waiting for a positive test to start folic acid means starting it after the window that matters most has already passed. That's why folic acid supplementation (typically 400–800 mcg/day) is recommended for any woman who could become pregnant, not just those trying to conceive."},
   {h:"Gravida and Para — the basic obstetric shorthand"},
   {hook:"<strong>Instructor emphasis:</strong> \"Zero in on and understand these two words.\" Gravida and Para specifically — not the full GTPAL breakdown — are what she said to focus on for this exam. Her example: 3 kids at home + currently pregnant = <strong>Gravida 4, Para 3</strong> (twins would still be 1 Gravida, 1 Para — but 2 living). The fuller GTPAL system is still covered in depth later in this app (and in the GTPAL Calculation Quiz under Practice Exams) since it's genuinely useful for other exams and for practice — but confirm with her directly how deep this particular test goes."},
   {table:{head:["Term","Definition"],rows:[
     ["Gravida","Total number of pregnancies, regardless of outcome — includes the current one"],
     ["Para","Number of deliveries at or beyond 20 weeks, regardless of outcome"]]}},
   {p:"Both terms are counted by the same two rules, and both rules are easy to get backwards under exam pressure: outcome is <strong>irrelevant</strong> to whether something counts (a miscarriage still counts toward gravida; a stillbirth at 24 weeks still counts toward para), and para counts <strong>delivery events, not babies</strong> — a woman who delivered twins in one birth is para 1, not para 2. Multiples only get counted individually later, in the 'L' (living children) column of GTPAL — never in gravida or para itself."},
   {h:"The first prenatal visit"},
   {list:[
    "<strong>Estimated due date (EDD)</strong> is calculated from the last menstrual period (see Naegele's rule below)",
    "<strong>Ultrasound</strong> confirms the pregnancy and refines the due date; a fetal heartbeat is typically detectable by 8–12 weeks",
    "<strong>Baseline labs:</strong> CBC (to know her starting hemoglobin/hematocrit before the normal dilutional anemia of pregnancy sets in), rubella titer (in case she wasn't already screened preconception), hepatitis B/C and HIV screening (both treatable in ways that reduce transmission to the fetus if caught early), and an antibody screen (to catch Rh sensitization or other red cell antibodies before they become a problem)",
    "Diet and health promotion education begins here and continues at every visit after"]},
   {h:"Naegele's Rule — calculating the due date"},
   {p:"Naegele's rule estimates the due date from the first day of the last menstrual period (LMP), assuming a textbook 28-day cycle with ovulation on day 14. The rule: <strong>subtract 3 months from the first day of the LMP, then add 7 days, then add 1 year.</strong> This works out to roughly 280 days, or 40 weeks, from the LMP — which is why pregnancy is described as a 40-week process even though conception itself happens about 2 weeks after the LMP."},
   {p:"<strong>Worked example 1:</strong> LMP = June 5th. Subtract 3 months → March 5th. Add 7 days → March 12th. Add 1 year → <strong>March 12th of the following year</strong> is the EDD."},
   {p:"<strong>Worked example 2:</strong> LMP = October 20th. Subtract 3 months → July 20th. Add 7 days → July 27th. Add 1 year → <strong>July 27th of the following year</strong> is the EDD."},
   {hook:"Naegele's rule assumes a regular 28-day cycle — it's an estimate, not a guarantee, which is exactly why the first-trimester ultrasound is used to confirm or adjust the EDD. If a patient has irregular cycles, the ultrasound dating is considered more reliable than the LMP-based calculation."},
   {h:"GTPAL — the fuller obstetric history"},
   {p:"Gravida and para alone don't distinguish a term birth from a preterm one, or tell you how many of a woman's pregnancies resulted in a child who is alive today. GTPAL is a 5-part expansion that captures all of that in one string."},
   {table:{head:["Letter","Stands for","The trap to watch for"],rows:[
     ["G","Gravida — total pregnancies, including the current one","Multiples still count as ONE pregnancy"],
     ["T","Term births (≥37 weeks)","Counts delivery EVENTS, not babies — twins born at 38 weeks is one T, not two"],
     ["P","Preterm births (20 weeks–36 6/7 weeks)","Includes stillbirths ≥20 weeks; again, one delivery event per birth, regardless of how many babies"],
     ["A","Abortions/losses BEFORE 20 weeks","Includes spontaneous miscarriage, elective abortion, AND ectopic pregnancy"],
     ["L","Living children","The ONE letter where multiples ARE counted individually — twins currently alive = 2 toward L"]]}},
   {p:"Put another way: G, T, P, and A all track <strong>events</strong> (pregnancies or deliveries), while L tracks <strong>people</strong>. That single distinction is what almost every GTPAL exam question is testing."},
   {h:"Two fully worked GTPAL examples"},
   {p:"<strong>Example A:</strong> A woman has been pregnant 3 times and is not currently pregnant. History: one delivery at 39 weeks, and two losses before 20 weeks. Gravida = 3 (all three pregnancies count). Term = 1 (the 39-week delivery). Preterm = 0. Abortions = 2 (the two early losses). Living children = 1 (assuming that one baby is alive). Written out: <strong>G3 T1 P0 A2 L1</strong>."},
   {p:"<strong>Example B:</strong> A woman is currently pregnant with twins at 30 weeks; this is her first pregnancy ever. Right now: Gravida = 1 (the current pregnancy), Term = 0, Preterm = 0 (nothing has been delivered yet), Abortions = 0, Living children = 0. If she goes on to deliver the twins at 37 weeks: Gravida is still 1 (it was already counted), but now Term = 1 (one delivery event, even though it produced two babies), and Living children = 2 (both twins, counted individually). Final: <strong>G1 T1 P0 A0 L2</strong>."},
   {h:"GTPAL as a single 5-digit string"},
   {p:"In many charts you'll see GTPAL written as five digits with no letters at all, in G-T-P-A-L order. Example B above, after delivery, would be written as <strong>11002</strong>. Reading a bare string like this requires knowing the fixed order — there's no way to tell G from T from the digits alone if you don't already know the sequence."},
   {h:"GTPAL vs. the simpler Gravida/Para (G/P) system"},
   {table:{head:["","GTPAL","Simple G/P"],rows:[
     ["Gravida","Same — total pregnancies","Same — total pregnancies"],
     ["Para","Split into Term (T) and Preterm (P) separately","One combined number — ALL births ≥20 weeks, term or preterm, live or stillborn, counted together"]]}},
   {p:"Both systems are used in real clinical practice — some units and some exam questions want the simple 2-digit G/P, others want the full 5-digit GTPAL. You should be comfortable producing either one from the same patient history, since the underlying facts (how many pregnancies, how many reached term, how many were lost early, how many children are living) don't change — only how they're packaged does."},
   {h:"Primi-/Multi-/Nulli- terminology"},
   {table:{head:["Term","Meaning"],rows:[
     ["Primigravida","Pregnant for the first time"],
     ["Primipara","Has delivered one pregnancy past viability (≥20 wks)"],
     ["Multigravida","Been pregnant more than once"],
     ["Multipara","Has carried two or more pregnancies to viability"],
     ["Nulligravida","Never pregnant"],
     ["Nullipara","Never completed a pregnancy beyond 20 weeks"]]}},
   {p:"These labels matter beyond vocabulary — parity actually predicts how labor will unfold. The <strong>latent phase</strong> of labor runs longer in a nullipara (roughly 8–9 hours) than a multipara (roughly 5–6 hours), because a cervix and pelvic floor that have never stretched to accommodate a birth take longer to do so the first time. <strong>Lightening</strong> — the fetal head dropping into the pelvis — typically happens about 2 weeks before birth in a primipara, but in a multipara it often doesn't happen until labor itself begins, because her pelvic tissues have already been stretched once and offer less resistance. Fetal head <strong>engagement</strong> similarly tends to occur at 36–38 weeks in a first pregnancy but may not occur until labor starts in a later one. This is also the clinical logic behind the Bishop score's parity adjustment (covered in the Complications lesson) — a first-time cervix genuinely has more physiologic work left to do."}
  ],
  check:{stem:"A woman has had two term births and one miscarriage at 9 weeks. She is currently pregnant. How is this documented?",
   options:["G3 P2","G4 P2","G3 P3","G4 P3"],
   answer:0,
   why:"Gravida counts every pregnancy regardless of outcome, including the current one: 2 term + 1 miscarriage + current = G3. Para counts only deliveries at or beyond 20 weeks: the 2 term births = P2. The 9-week loss counts as gravida only."}
},
{ id:"trim", title:"Indications of Pregnancy & The Trimesters", kicker:"Presumptive, probable, positive — and what happens in each trimester",
  blocks:[
   {p:"Every finding that suggests pregnancy falls into one of three tiers — often shorthanded as <strong>PPP: Presumptive, Probable, Positive</strong> — and the tier is determined by one question: <strong>could this finding be explained by anything other than an actual fetus?</strong> The more confidently you can answer 'no,' the higher the tier. This isn't just an academic sorting exercise — it's the same logic a clinician uses at the bedside to decide how much weight to put on a finding before ordering the next test."},
   {h:"Presumptive signs — subjective, reported by the woman"},
   {p:"These are things the patient notices and reports: <strong>amenorrhea</strong> (missed period), nausea and vomiting, breast tenderness/enlargement, fatigue, urinary frequency, and quickening (the woman's own perception of fetal movement, usually first felt 16–20 weeks). Every one of these can also be explained by something else entirely — stress can cause amenorrhea, a stomach bug causes nausea, and fatigue has a hundred causes. Presumptive signs raise suspicion; they prove nothing, and a good nurse never documents a presumptive sign as if it were diagnostic."},
   {h:"Probable signs — objective, found by the examiner"},
   {table:{head:["Sign","What it is","Why it's still only 'probable'"],rows:[
     ["Goodell's sign","Softening of the cervix","Cervical softening can occur with other hormonal or inflammatory changes"],
     ["Hegar's sign","Softening of the lower uterine segment (isthmus)","Same limitation — a hormonally softened uterus isn't unique to pregnancy"],
     ["Chadwick's sign","Bluish-violet discoloration of the cervix and vaginal mucosa","Caused by increased vascularity/congestion, which has other possible causes"],
     ["Ballottement","The fetus rebounds against the examiner's fingers when the uterus is tapped, felt when the fetus is not yet engaged","A pattern that can theoretically be mimicked by a mobile uterine mass"],
     ["Braxton Hicks contractions","Irregular practice contractions","Not unique to pregnancy in isolation — the uterus can contract for other reasons"],
     ["Positive hCG (pregnancy test)","Detects human chorionic gonadotropin in blood or urine","Certain tumors (molar pregnancy, some ovarian and testicular tumors) also produce hCG"],
     ["Uterine/abdominal enlargement","The uterus growing beyond its normal size","Fibroids and other pelvic masses can also enlarge the uterus/abdomen"]]}},
   {p:"These are a step up from presumptive — they're measured or observed by a clinician, not just reported by the patient — but they're still not proof, for the specific reasons in the table above. That's the whole reason this tier is called 'probable' rather than 'positive': the finding is objective, but the underlying cause still isn't certain."},
   {h:"Positive signs — definitive, caused by nothing but a fetus"},
   {p:"Only three findings belong here, because only three findings cannot be explained by anything except an actual fetus: <strong>fetal heart tones</strong> detected by Doppler or fetoscope, <strong>fetal movement felt by the examiner</strong> (not just reported by the mother — that's presumptive quickening), and <strong>ultrasound visualization of the fetus</strong>. If a question asks you to pick the one sign that proves pregnancy beyond doubt, it has to come from this short list — and it's worth noticing that all three require equipment or a trained examiner; none of them are things a woman can determine about her own body without help."},
   {h:"Prenatal visit schedule — the general pattern"},
   {p:"Visit frequency isn't random — it tracks how quickly things can change at each stage of pregnancy. The typical schedule is <strong>every 4 weeks until 28 weeks</strong>, <strong>every 2 weeks from 28 to 36 weeks</strong>, and <strong>weekly from 36 weeks until delivery</strong>. Visits compress as term approaches because the complications that matter most in late pregnancy — blood pressure changes, labor onset, changes in fetal position — can develop quickly and benefit from closer surveillance."},
   {h:"Trimester by trimester — what's assessed and why"},
   {table:{head:["Trimester","Weeks","Key events and the reasoning behind them"],rows:[
     ["1st","1–12","Confirm the pregnancy, draw baseline labs (CBC, blood type and Rh, rubella titer, hepatitis/HIV screening, urinalysis and culture, Pap smear, STI cultures as indicated), and get a dating ultrasound. This is also the period of <strong>organogenesis</strong> — the fetus's organs are forming — which is why it's the highest-risk window for teratogen exposure (medications, alcohol, certain infections). Nausea and vomiting also peak here, driven by rising hCG."],
     ["2nd","13–27","FHR checks by Doppler or ultrasound, fundal height measurements at every visit, growth checks, and the <strong>fetal anatomy ultrasound at 18–22 weeks</strong> — the detailed structural scan that looks at every organ system and is also when most parents learn fetal sex. Maternal serum screening (e.g., quad screen) for chromosomal or neural tube abnormalities is typically offered in this window as well, and many women report feeling noticeably better in this trimester as first-trimester nausea resolves."],
     ["3rd","28–40","The <strong>1-hour glucose screen</strong> (with the <strong>3-hour test</strong> to confirm gestational diabetes if the screen is positive), monitoring CBC for the anemia that can worsen as blood volume peaks, <strong>RhoGam if Rh-negative</strong>, daily fetal movement counts (kick counts), non-stress testing if indicated, <strong>Group B strep testing at 35–37 weeks</strong>, and a shift to weekly visits from 35–36 weeks onward as the pregnancy approaches term."]]}},
   {hook:"The 1-hour glucose test is a <b>screen only</b> — a positive result does not diagnose gestational diabetes by itself. Only the 3-hour glucose tolerance test can confirm the diagnosis. Don't let a patient (or a test question) treat the screen as the diagnosis."},
   {h:"Putting it together: a quick scenario"},
   {p:"A patient at 10 weeks reports a missed period, nausea, and breast tenderness (all <strong>presumptive</strong>). On exam, her cervix is soft and bluish (Goodell's and Chadwick's signs — <strong>probable</strong>), and her urine hCG is positive (also <strong>probable</strong>). None of this proves pregnancy on its own. It isn't until the ultrasound that week shows a visible fetus with a heartbeat that you've reached a <strong>positive</strong> sign — and only then can the pregnancy be confirmed beyond doubt."}
  ],
  check:{stem:"A patient has a positive home pregnancy test and a softened cervix on exam. Which of these is a POSITIVE sign of pregnancy?",
 ref:"trim",
   options:["The positive hCG test","The softened cervix","Neither — both are probable signs","Amenorrhea"],
   answer:2,
   why:"hCG and cervical softening are both probable signs — objective but still explainable by something else. Positive signs are limited to fetal heart tones, examiner-felt fetal movement, and ultrasound visualization of the fetus."}
},
{ id:"physio", title:"Gestational Milestones & Physiologic Changes", kicker:"Fundal height, viability, and why the labs look 'off'",
  blocks:[
   {h:"Key gestational milestones"},
   {table:{head:["Milestone","Timing","What it means"],rows:[
     ["Viability","23–24 weeks","The earliest point at which survival outside the uterus is possible, with intensive support"],
     ["Term","37 weeks","The pregnancy is no longer considered preterm"],
     ["Full term","40 weeks","The calculated due date"],
     ["Postdates","40.1+ weeks","Past the due date; monitoring intensifies as placental function can begin to decline"]]}},
   {h:"Fundal height as a growth check"},
   {p:"From about 18 to 32 weeks, fundal height measured in centimeters (symphysis pubis to the top of the fundus) tracks closely with the number of weeks pregnant, give or take about 2 cm — a rough but genuinely useful way to catch growth problems between ultrasounds. A measurement that's consistently too small can suggest intrauterine growth restriction or low amniotic fluid; consistently too large can suggest a multiple pregnancy, excess amniotic fluid, or a larger-than-expected fetus."},
   {hook:"Fundal height can <b>decrease</b> in the final weeks of pregnancy — that's expected, not a red flag. It happens because the fetus drops down into the pelvis in preparation for labor, a process called <b>lightening</b>. The measurement dropping near term is a sign of progress, not a problem."},
   {h:"Blood volume changes — and why they matter"},
   {list:[
    "Total blood volume increases by as much as <strong>45%</strong>",
    "Plasma volume increases <strong>40–60%</strong> (about 1200–1600 mL)",
    "Red blood cell mass increases only <strong>20–30%</strong> (about 250–450 mL)"]},
   {p:"Notice that plasma volume rises much more than red cell mass does. The extra plasma dilutes the concentration of red cells in the blood, which is exactly what produces the <strong>physiologic (dilutional) anemia of pregnancy</strong> — a hemoglobin/hematocrit that looks lower on a lab report without the woman actually being iron-deficient. It's a normal, expected side effect of a body building a larger blood volume reserve in advance of the blood loss that will happen at delivery."},
   {h:"Other lab changes that look abnormal but aren't"},
   {list:[
    "<strong>Leukocytosis</strong> is normal throughout pregnancy and can climb as high as <strong>25,000/mm³ in the immediate postpartum period</strong> — the stress of labor itself drives this number up, independent of any infection",
    "Pregnancy and the postpartum period are a state of <strong>hypercoagulability</strong> — clotting factors increase, which helps limit blood loss at delivery but also raises the risk of dangerous clots (DVT/PE)"]},
   {h:"Addressing hypercoagulability"},
   {list:["Early and frequent ambulation","Sequential compression devices (SCDs) or TED hose","Adequate hydration","Smoking cessation"]},
   {hook:"The clinical trap here is treating an elevated postpartum WBC as automatic proof of infection. It isn't — 25,000/mm³ can be entirely normal. What actually points to infection is the <b>company it keeps</b>: fever, foul-smelling drainage, incision redness/warmth, or worsening pain. A lab number in isolation, without those clinical signs, doesn't justify starting antibiotics."}
  ],
  check:{stem:"A postpartum patient's WBC is 24,000/mm³. She's afebrile with a clean, dry incision and normal afterpains. What's the nurse's best action?",
   options:["Notify the provider of probable infection","Document as an expected postpartum finding and continue assessment","Start antibiotics","Place in isolation"],
   answer:1,
   why:"Leukocytosis is expected in pregnancy and can reach 25,000/mm³ postpartum. Without fever, drainage, or pain, this is a normal physiologic finding."}
},
{ id:"teach", title:"Patient Teaching & Avoidances", kicker:"The 'Big NO's' and when to call the provider",
  blocks:[
   {p:"Most of prenatal nursing is teaching, and most of prenatal teaching is answering the same handful of 'is this safe?' questions. Knowing the reasoning behind each answer — not just the answer itself — is what lets you handle the version of the question that isn't phrased exactly like your notes."},
   {table:{head:["Avoid","Why"],rows:[
     ["Handling dirty cat litter","Risk of toxoplasmosis, a parasitic infection that can cause serious fetal harm — have someone else change the litter box"],
     ["Ibuprofen/aspirin (NSAIDs)","NSAIDs are avoided, especially later in pregnancy; acetaminophen (Tylenol) is the safe alternative for pain/fever"],
     ["Tampons","Increased infection risk during pregnancy"],
     ["Hot tubs and saunas","Raised core body temperature (hyperthermia) is linked to neural tube defects and other complications, especially in the first trimester"],
     ["Raw sushi/oysters, undercooked meat, unpasteurized soft cheeses, raw eggs, cold deli meats","Risk of foodborne illness (listeria, salmonella, toxoplasmosis) that can cross the placenta"],
     ["Excessive caffeine","Limit to <strong>200 mg or less per day</strong> (roughly one 12-oz cup of coffee)"],
     ["Alcohol, smoking, vaping, illicit drugs","No safe amount established; all are linked to fetal growth restriction, congenital anomalies, and neurodevelopmental problems"]]}},
   {h:"Everyday practices patients ask about"},
   {list:[
    "<strong>Exercise</strong> — encouraged, with modification; a patient can generally continue whatever activity level she had before pregnancy, but this isn't the time to start a brand-new intense routine",
    "<strong>Working</strong> — generally safe unless the job involves heavy lifting, prolonged standing, or exposure to toxins",
    "<strong>Sexual activity</strong> — safe unless a specific contraindication exists (e.g., placenta previa, preterm labor signs, ruptured membranes)",
    "<strong>Seat belts</strong> — essential; the lap belt should sit low, below the abdomen, not across it",
    "<strong>Immunizations</strong> — inactivated vaccines (like Tdap and flu shot) are safe and recommended; live vaccines (like MMR) are not given during pregnancy",
    "<strong>Over-the-counter medications</strong> — many are contraindicated; check with the provider before taking anything not already approved",
    "<strong>Douching</strong> — not recommended; it disrupts normal vaginal flora and increases infection risk"]},
   {h:"When to call the provider"},
   {p:"Some findings are simply part of a normal pregnancy and don't need a call: light spotting in small amounts, or nausea/fatigue that eases after the first trimester. Others need immediate follow-up: <strong>high blood pressure or new swelling, leaking of vaginal fluid, abdominal pain, vaginal bleeding, decreased fetal movement, or a severe/persistent headache with vision changes.</strong> The pattern worth remembering is that the 'call now' list is built almost entirely around the earliest warning signs of the complications covered in the High-Risk Complications lesson later in this unit — preeclampsia, placental problems, and preterm labor all announce themselves through one of these symptoms first."},
   {hook:"Per the original course materials: pre-eclampsia/pregnancy-induced hypertension, gestational or Type 1/2 diabetes, hyperemesis gravidarum, and placenta previa/abruption were flagged as <b>not tested this semester</b> in the base module. Your supplemental review materials do cover these in real depth (see the High-Risk Complications & Emergencies lesson), so know the names and the basic picture either way — just confirm with your instructor how deep you need to go for this particular exam."}
  ],
  check:{stem:"Which statement by a patient at 10 weeks needs further teaching?",
   options:["I'll have my husband change the litter box","I'll take Tylenol instead of ibuprofen for headaches","I'll limit myself to one cup of coffee a day","I'll relax in the hot tub for my back pain"],
   answer:3,
   why:"Hot tubs are avoided due to heat exposure. Delegating litter box duty, using Tylenol, and staying under the 200 mg caffeine limit are all correct."}
}
]};

{ id:"admit", title:"Admission & Fetal Monitoring", kicker:"Assess mom, assess baby, ask mom, check mom",
  blocks:[
   {p:"When a patient arrives in labor and delivery, the admission assessment follows a deliberate order — you're triaging both a mother and a fetus at the same time, and the sequence is designed to catch anything urgent before moving on to routine documentation."},
   {list:[
    "<strong>Assess mom</strong> — vital signs, health history, birth plan",
    "<strong>Assess baby</strong> — fetal heart rate",
    "<strong>Ask mom</strong> — rupture of membranes (when, color, amount), contraction frequency/duration",
    "<strong>Check mom</strong> — cervical exam: dilation, effacement, station, position"]},
   {h:"Distinguishing true labor from false labor"},
   {p:"Not every patient who arrives contracting is actually in labor, and telling the difference is one of the first clinical judgments made at triage."},
   {table:{head:["True labor","False labor (Braxton Hicks)"],rows:[
     ["Contractions intensify with activity (e.g., walking)","Irregular; doesn't intensify with activity"],
     ["Does NOT resolve with rest or a warm shower","Relieved by rest or a warm shower"],
     ["Produces progressive cervical change (dilation/effacement)","No cervical change over time"]]}},
   {p:"The single most reliable differentiator is the last row — progressive cervical change. Contractions can feel intense and come regularly without actually being labor; only real cervical change confirms it."},
   {h:"Leopold's maneuvers"},
   {p:"Before applying continuous monitors or attempting a vaginal exam, the nurse performs Leopold's maneuvers — a systematic four-step abdominal palpation used to determine fetal lie (the relationship of the fetal spine to the mother's spine), presentation (what part of the fetus is coming first), position, and estimated fetal size. Doing this first tells you what you're about to feel on exam and where best to place the fetal monitor to pick up heart tones clearly."},
   {h:"Reading the fetal monitor strip"},
   {hook:"<strong>Instructor emphasis:</strong> she said directly that she will NOT ask you to read off a specific heart rate number from a strip. What she WILL do is show you a strip and ask you to recognize variability, spot accelerations, judge whether a deceleration pattern is reassuring, and count the number of contractions shown — recognition and interpretation, not number-reading."},
   {table:{head:["Tracing","Shows","Watch for"],rows:[
     ["Top — FHR","Rate, variability, accelerations, decelerations","Variability = reassuring · accelerations = good · prolonged decelerations = distress"],
     ["Bottom — contractions","Frequency, strength","Interval between peaks, height of peaks"]]}},
   {hook:"A flat FHR line is <b>not a calm baby</b> — some beat-to-beat variability is actually the reassuring finding, because it shows an intact fetal nervous system responding moment to moment to changes in oxygenation. A truly flat line is more concerning than a wiggly one. Normal FHR baseline is <b>110–160 bpm</b>."},

      {h:"VEAL CHOP — making sense of decelerations"},
   {p:"Decelerations are temporary drops in FHR below baseline, and their shape and timing relative to contractions tell you what's causing them. VEAL CHOP pairs the deceleration pattern (VEAL) with its likely cause (CHOP):"},
   {table:{head:["Deceleration shape (VEAL)","Likely cause (CHOP)","Nursing action"],rows:[
     ["Variable — abrupt, jagged V/W shape, unrelated to contraction timing","Cord compression","Reposition the patient (side-lying); consider amnioinfusion if ordered"],
     ["Early — gradual, smoothly mirrors the contraction","Head compression","None needed — this is a normal, benign finding; continue routine monitoring"],
     ["Accelerations — abrupt rise, ≥15 bpm for ≥15 seconds","Okay! — a reassuring sign of fetal well-being","Document; no intervention needed"],
     ["Late — begins AFTER the contraction peaks, returns to baseline after the contraction ends","Placental (uteroplacental) insufficiency","Stop Pitocin, position on the left side, give O2, bolus IV fluids"]]}},
   {p:"A second way to remember the same three deceleration types is by their visual shape: <strong>early</strong> decelerations mirror the contraction almost exactly, producing a smooth, uniform pattern that rises and falls right along with uterine activity. <strong>Late</strong> decelerations form a shallow, delayed 'U' shape — think 'U' for Uteroplacental insufficiency — because the drop doesn't start until after the contraction has already peaked. <strong>Variable</strong> decelerations are abrupt and jagged, forming sharp 'V' shapes at unpredictable, Variable times relative to contractions, because cord compression can happen at any point in the contraction cycle."},
   {p:"Only early decelerations and accelerations are reassuring findings that need no intervention. Both late and variable decelerations are non-reassuring and require the nurse to act — reposition the patient, consider oxygen and IV fluids, and stop any oxytocin infusion until the pattern resolves."},
   {h:"Fetal circulation shunts — bypassing the lungs and liver in utero"},
   {p:"A fetus doesn't breathe air, so its circulation is built around three temporary shunts that redirect blood away from the non-functional lungs and liver, sending oxygen-rich blood from the placenta straight to where it's needed most."},
   {table:{head:["Shunt","Connects","Closes"],rows:[
     ["Ductus venosus","Umbilical vein → inferior vena cava (bypasses the liver)","Shortly after the umbilical cord is clamped"],
     ["Foramen ovale","Right atrium → left atrium (bypasses the lungs)","Functionally within hours to days, as lung expansion raises left atrial pressure"],
     ["Ductus arteriosus","Pulmonary artery → aorta (bypasses the lungs)","Within about 10–15 hours to a few days, triggered by rising oxygen levels after the first breaths"]]}},
   {p:"The umbilical cord carries this traffic with <strong>3 vessels</strong> — 2 umbilical arteries carrying deoxygenated blood from the fetus back to the placenta, and 1 umbilical vein carrying oxygenated blood from the placenta to the fetus. Oxygenation itself happens at the <strong>placenta</strong>, which functions as the fetal 'lung' throughout pregnancy — the actual fetal lungs stay fluid-filled and non-functional until birth."},
   {h:"Why the shunts exist: it's a pressure problem"},
   {p:"In the fetus, the <strong>right side of the heart runs at higher pressure than the left</strong>, because the fluid-filled lungs create high pulmonary vascular resistance — blood doesn't want to flow into stiff, collapsed lung tissue. That pressure difference is exactly what pushes blood through the foramen ovale and ductus arteriosus, away from the lungs and out to the rest of the body instead. At birth, the first breaths inflate the lungs and pulmonary resistance drops sharply. Left-side pressure now exceeds right-side pressure for the first time, and that pressure flip is what functionally closes the foramen ovale and starts the ductus arteriosus constricting."},
   {hook:"If you remember only one thing about the fetal shunts, make it this: it's a <b>plumbing problem solved by pressure</b>. High right-side pressure in utero pushes blood away from the lungs; the pressure reversal at the first breath is what closes the shunts. A shunt that fails to close after birth — a patent foramen ovale or patent ductus arteriosus — is a real congenital heart defect, not just a delayed normal process."}

   why:"Beat-to-beat variability is the reassuring finding. A flat line is concerning, not calm."}
},
{ id:"cervixpos", title:"Cervical Exam, Presentation & Position", kicker:"Dilation, effacement, station, and where the occiput points",
  blocks:[
   {p:"A cervical exam gives you three numbers, and each one is measuring a different physical change happening to the cervix and pelvis at the same time."},
   {table:{head:["Component","Scale","What it's measuring"],rows:[
     ["Dilation","0–10 cm, closed → fully dilated","How wide the cervical opening is; 10 cm is required before pushing can begin"],
     ["Effacement","0–100%, thick → thin","How thinned-out the cervix has become"],
     ["Station","−4 to +4, with the ischial spines defined as 0","How far the presenting part has descended relative to the ischial spines — negative numbers are higher up, positive numbers are lower, with +4 essentially at the perineum"]]}},
   {p:"These three numbers are usually charted together as one string, for example '4 cm / 60% / −1' — meaning 4 cm dilated, 60% effaced, and the presenting part sitting 1 cm above the ischial spines."},
   {hook:"<strong>Memory trick:</strong> negative station = <b>\"no go\"</b> (the baby is still high/floating above the spines); positive station = <b>\"positively coming out\"</b> (the baby has descended past the spines); +4 = crowning."},
   {hook:"Dilation alone doesn't tell you how close a patient is to delivery. A patient at 8 cm with the fetal head still at station −2 is actually farther from birth than one at 6 cm with the head at station +1 — <b>descent matters just as much as dilation</b>, and a good assessment always reports both together rather than leaning on dilation alone."},
   {h:"Rupture of membranes"},
   {list:["<strong>SROM</strong> = spontaneous rupture of membranes","<strong>AROM</strong> = artificial rupture of membranes (performed by the provider)","Whenever membranes rupture, assess color, amount, and composition of the fluid, and check <strong>FHR immediately</strong> — the sudden fluid shift carries a real risk of umbilical cord prolapse, and a cord that prolapses with the fluid can be compressed against the cervix, cutting off fetal blood flow."]},
   {h:"Amniotic fluid assessment — COAT"},
   {p:"Once membranes have ruptured, the fluid itself is assessed using four categories, conveniently remembered as COAT:"},
   {table:{head:["Letter","Expected/normal","Abnormal/risk"],rows:[
     ["C — Color","Clear or straw-colored","Green/brown (suggests meconium, a marker of fetal distress); yellow (suggests infection)"],
     ["O — Odor","Not foul (mild, earthy smell)","Foul-smelling (suggests infection/chorioamnionitis)"],
     ["A — Amount","Roughly 500–1200 mL","Oligohydramnios (too little fluid) or polyhydramnios (too much)"],
     ["T — Time","Document the exact time of rupture","Rupture lasting more than 24 hours significantly increases infection risk — this is the whole reason the clock starts the moment membranes break, not when labor was originally admitted"]]}},
   {h:"Fetal position — where the occiput points"},
   {table:{head:["Position","Clinical picture"],rows:[
     ["Occiput Anterior (OA)","The favorable position — sometimes remembered as 'awesome, accelerated,' since labor tends to progress more smoothly"],
     ["Occiput Posterior (OP)","'Poor pushing' — associated with prolonged labor, intense back pain ('back labor'), and a mother who tires out more quickly because she's working against a less favorable angle of descent"]]}},
   {h:"Cardinal movements of labor (2nd stage)"},
   {p:"As the fetus travels through the maternal pelvis during the second stage, it moves through a fixed sequence of positional changes, in this order: <strong>Engagement → Descent → Flexion → Internal Rotation → Extension → Restitution (external rotation) → Expulsion.</strong> Engagement happens first, when the fetal head settles into the pelvic inlet (often before labor even begins with a first pregnancy). From there, each step exists because the fetal head and shoulders are navigating a pelvis that isn't a simple straight tube — the baby has to flex its chin to present the smallest head diameter, rotate internally to align with the widest part of the pelvic outlet, extend as the head passes under the pubic bone, and then rotate externally (restitution) to realign the shoulders with the pelvis so they, too, can be delivered without getting caught."}
  ],
  check:{stem:"Immediately after a patient's membranes rupture, what's the nurse's priority?",
   options:["Document the time","Assess FHR","Change the linens","Notify housekeeping"],
   answer:1,
   why:"The cord can prolapse with the gush of fluid, compressing it and causing fetal distress. FHR is assessed immediately."}
},
{ id:"stages", title:"Stages of Labor", kicker:"First through fourth stage",
  blocks:[
   {h:"1st Stage — from onset of labor to full dilation, in three phases"},
   {table:{head:["Phase","Dilation","Signs"],rows:[
     ["Latent","0–3 cm","Mild contractions, possible rupture of membranes, fetal descent/engagement beginning"],
     ["Active","4–7 cm","Contractions intensify, descent continues, anxiety increases"],
     ["Transition","8–10 cm","Fetal descent, bloody show, rectal pressure, the patient often becomes withdrawn and hyperventilates, nausea/vomiting, requests for pain medication"]]}},
   {hook:"A patient who was coping well and suddenly becomes withdrawn, nauseated, and hyperventilating, or is demanding pain medication she previously declined, is showing you the classic behavior cluster of <b>transition</b>. This is a landmark you can recognize just from watching the patient — check her cervix before assuming she needs medication, because she may already be close enough to pushing that medication timing (or type) needs to change."},
   {h:"Average duration by parity"},
   {p:"How long each phase and stage takes depends heavily on whether this is a first birth or not — a first-time cervix and pelvic floor genuinely take longer to do the same physical work."},
   {table:{head:["Stage/Phase","Nulliparous","Multiparous"],rows:[
     ["1st Stage — Latent (0–6 cm)","9–19 hours","6–14 hours"],
     ["1st Stage — Active (6–10 cm)","1.2–1.5 cm/hour","1.5–2.0 cm/hour"],
     ["2nd Stage — Pushing","30 min–3 hours","5–30 minutes"],
     ["3rd Stage — Placenta","5–30 minutes","5–30 minutes"],
     ["4th Stage — Recovery","2 hours (fixed)","2 hours (fixed)"]]}},
   {p:"Notice that the difference disappears in the 3rd and 4th stages — placental delivery and immediate postpartum recovery take roughly the same amount of time no matter how many babies a woman has delivered before. It's specifically the process of dilating and pushing a fetus through tissue that hasn't stretched this way before that takes longer in a first labor. This is the same physiologic logic behind the Bishop score subtracting a point for nulliparity — a first-time cervix genuinely has more work ahead of it."},
   {h:"2nd Stage — from full dilation to birth"},
   {p:"This stage covers fetal descent, the urge to push, crowning, the cardinal movements described in the previous lesson, and finally birth itself. Pushing is coordinated with contractions rather than done continuously, because the uterine contraction is already generating expulsive force on its own — adding voluntary maternal effort during that window accomplishes the same descent with less total maternal fatigue than pushing constantly regardless of contraction timing."},
   {h:"3rd Stage — from birth of the infant to delivery of the placenta"},
   {p:"This stage typically lasts <strong>5–30 minutes</strong>. The most important nursing task here is confirming the placenta is delivered <strong>intact</strong> — a retained fragment left behind in the uterus physically prevents the uterine muscle from clamping down fully, which is one of the leading causes of postpartum hemorrhage covered later in this unit."},
   {h:"4th Stage — the first 1–4 hours postpartum"},
   {p:"The mother undergoes rapid physiologic readjustment: blood pressure tends to drop, heart rate rises, and thirst, hunger, and shaking are all common and expected as the body compensates for blood loss and the sudden change in blood volume distribution now that the uterus and placenta are no longer part of the circuit. Nursing assessment in this window covers lochia, fundus, bladder, perineum, pain, vital signs, and early bonding."}
  ],
  check:{stem:"A laboring patient who was calm suddenly becomes withdrawn, hyperventilates, and demands pain medication. What should the nurse do first?",
   options:["Give the ordered analgesic","Check her cervix — this suggests transition (8–10 cm)","Call anesthesia","Dim the lights and reassure her"],
   answer:1,
   why:"This behavior cluster is the landmark for transition. Check her before medicating — she may be too far along for it to help, or ready to push."}
},
{ id:"painmgmt", title:"Pain Management & Anesthesia", kicker:"From breathing to the epidural",
  blocks:[
   {p:"Labor pain management ranges from purely behavioral techniques to full regional anesthesia, and the choice of method shapes what the nurse needs to watch for afterward."},
   {hook:"<strong>Instructor emphasis:</strong> \"Know your spinal/epidural\" and \"know Zofran\" — those were her exact priorities. The individual analgesic/sedative drug names below do NOT need to be memorized in detail; just know that this whole category exists and can cause neonatal respiratory depression if timed too close to delivery. Put your real study time into the epidural-vs-spinal comparison and into ondansetron (Zofran) as the antiemetic that pairs with them."},
   {list:[
    "<strong>Natural/non-pharmacologic:</strong> relaxation, controlled breathing, water immersion, hypnosis, doula support",
    "<strong>Analgesics (opioid agonists/agonist-antagonists):</strong> butorphanol, nalbuphine, meperidine",
    "<strong>Anti-emetic:</strong> ondansetron, often given alongside opioids since nausea is a common side effect",
    "<strong>Sedatives:</strong> barbiturates, benzodiazepines",
    "<strong>Anesthesia:</strong> epidural, spinal, general, or local"]},
   {hook:"Opioid analgesics cross the placenta to the fetus and can <b>decrease fetal respiratory drive</b>. The clinical concern isn't the drug itself so much as timing — a dose given too close to delivery doesn't have time to be metabolized before birth, and can produce a newborn who needs active help establishing respirations."},
   {h:"Spinal vs. Epidural — two different tools for two different jobs"},
   {table:{head:["","Spinal","Epidural"],rows:[
     ["Dosing","Single injection, no catheter left in place","Catheter placed and left in, allowing repeated or continuous dosing"],
     ["Onset","Fast, dense block","Slower onset, builds over time"],
     ["Best fits","Cesarean birth — a procedure of predictable, finite length","Labor itself — a process of unpredictable length that may need medication adjusted over many hours"]]}},
   {p:"The mismatch to avoid is picking the wrong tool for the job: a single-shot spinal doesn't help with a labor that could still run for hours, and a labor epidural with its slower onset isn't ideal for a situation (like an urgent cesarean) where anesthesia needs to be dense and immediate."},
   {hook:"Watch blood pressure closely after either type of block: sympathetic nervous system blockade drops maternal BP, which in turn drops placental perfusion — and the <b>fetus feels the drop in perfusion before the mother notices any symptoms of her own low BP</b>. This is exactly why continuous FHR monitoring becomes even more important right after a block is placed."},
   {h:"The epidural cue chain — connecting BP, the fetal strip, and your response"},
   {p:"This sequence shows up constantly in practice and on exams: BP drop after an epidural leads to reduced placental perfusion, which shows up on the monitor as <strong>late decelerations</strong> — the classic sign of uteroplacental insufficiency covered in the Admission lesson. The priority actions, in order, are to position the patient on her <strong>left side</strong> (relieves vena cava compression and improves venous return/cardiac output), increase IV fluids, and give supplemental O2. All three interventions are aimed at the same root cause — restoring adequate blood flow to the placenta — rather than treating the deceleration pattern directly."},
   {h:"The spinal cue — watch respiratory effort, not just blood pressure"},
   {p:"Spinal anesthesia is typically used for elective or planned cesarean births, and its anesthesia level tends to be higher on the body and more immediate in onset than an epidural's. This creates a different priority: if the spinal block <strong>travels too high</strong> up the spinal cord, it can reach the nerves controlling the diaphragm and paralyze respiratory muscles. For this reason, <strong>respiratory effort</strong> — not just blood pressure — is the priority assessment immediately after a spinal is placed."}
  ],
  check:{stem:"15 minutes after epidural placement, a patient's BP drops from 122/76 to 88/50. What's the greatest concern?",
   options:["Spinal headache","Decreased placental perfusion affecting the fetus","Catheter migration","Inability to push"],
   answer:1,
   why:"Sympathetic blockade drops maternal BP, which drops placental perfusion — the fetus feels it first. This is the expected complication that's closely monitored."}
},
{ id:"complications", title:"Complications, Cesarean, Induction & VBAC", kicker:"When labor needs help — or an OR",
  blocks:[
   {h:"Hemorrhage risk factors (4th stage)"},
   {p:"Postpartum hemorrhage happens for one of two basic reasons: the uterus won't clamp down (atony), or something is physically torn (a laceration). Recognizing which category a patient is heading toward changes what you do about it."},
   {list:["<strong>Uterine atony</strong> (prolonged labor, retained placenta, bladder distention) — the uterine muscle simply isn't contracting effectively enough to pinch shut the blood vessels at the old placental site","<strong>Lacerations</strong> (precipitous delivery, forceps/vacuum, macrosomia) — physical tearing of the cervix, vagina, or perineum","Hematoma — bleeding that collects under intact tissue rather than flowing out visibly"]},
   {hook:"A boggy uterus bleeds because a soft uterus can't compress the open vessels left behind where the placenta was attached. If the fundus is displaced off midline, <b>check the bladder first</b> — a full bladder physically pushes the uterus out of position and prevents it from contracting, so the fix may be as simple as helping the patient void before you assume something more serious is happening."},
   {h:"Dystocia — dysfunctional, difficult, or abnormal labor"},
   {p:"Dystocia describes a lack of progress in dilation, descent, or expulsion — labor that has, for one reason or another, stalled. Before inducing or augmenting a stalled labor, the cervix itself needs to be assessed for readiness, which is exactly what the Bishop score does."},
   {list:[
    "<strong>Bishop score</strong> (0–13) assesses cervical readiness for induction — it scores cervical dilation, effacement, consistency, position, and fetal station, each worth 0–3 points; <strong>≥8 = favorable</strong> for induction, <strong>≤4 = needs a cervical ripening agent first</strong> to soften/prepare the cervix before oxytocin will do much good",
    "Parity adjustment: subtract 1 point for nulliparity, add 1 point for each prior vaginal delivery — because a cervix that has stretched to accommodate birth before starts from a more favorable position",
    "Priority complications to watch for: fetal hypoxia/injury, maternal infection, hemorrhage, and cesarean-related complications if augmentation fails"]},
   {h:"Cervical ripening & induction agents"},
   {table:{head:["Drug","Role","Key nursing point"],rows:[
     ["Oxytocin (Pitocin)","Augments/induces contractions; also reduces PP bleeding","High-alert drug — infusion pump only; monitor closely for uterine tachysystole & non-reassuring FHR; contraindicated with fetal malpresentation, severe fetal distress, or prior uterine incision"],
     ["Cervadil (dinoprostone)","Cervical ripening agent, vaginal, for Bishop score ≤4","Monitor for uterine tachysystole and non-reassuring FHR"],
     ["Cytotec (misoprostol)","Cervical ripening/induction, vaginal or oral, Bishop score ≤4 — more potent than Cervadil","Do NOT start oxytocin within <strong>4 hours</strong> of the last misoprostol dose (risk of uterine rupture)"],
     ["Magnesium sulfate","Seizure prophylaxis (preeclampsia) + tocolytic","Toxicity: loss of deep tendon reflexes, respiratory depression (RR <12), decreased urine output — have calcium gluconate available as antidote"]]}},
   {hook:"<b>Uterine tachysystole</b> = more than 5 contractions in 10 minutes, averaged over a 30-minute window — it can reduce fetal oxygenation and is a reason to stop an oxytocin infusion."},
   {h:"Why synthetic oxytocin hurts differently than natural labor"},
   {p:"Natural oxytocin crosses the blood-brain barrier and triggers <strong>endorphin release</strong>, which naturally regulates contraction intensity and blunts pain. Synthetic oxytocin (Pitocin) does <strong>NOT</strong> cross the blood-brain barrier — no endorphin release — so contractions can feel more continuous and intense without the body's own natural pain-modulation. This is genuinely useful for patients to understand, because it explains why an induced labor often feels different from a spontaneous one, independent of anything going wrong."},
   {h:"Typical oxytocin administration protocol"},
   {list:[
    "IV via a computerized infusion pump — never a free-flowing line",
    "Start low: ~<strong>1 milliunit/min</strong>",
    "Increase in small increments (1–2 mU) every <strong>30–60 minutes</strong> until contractions are effective — about every 2–3 minutes",
    "Continuous maternal/fetal monitoring throughout",
    "Reduce or stop the infusion if contractions become too frequent/intense (uterine rest)"]},
   {h:"BRAIN — a framework for informed decisions about interventions like induction"},
   {table:{head:["Letter","Question to ask"],rows:[
     ["B","Benefits — what are they?"],
     ["R","Risks — what are they?"],
     ["A","Alternatives — what else could we try?"],
     ["I","Intuition — what does my gut say?"],
     ["N","Nothing — what if we do nothing/wait?"]]}},
   {hook:"BRAIN isn't just patient-facing language — as the nurse, you can use the same framework to organize your own teaching before a patient consents to an intervention like induction."},
   {h:"Cesarean section"},
   {list:[
    "<strong>Skin incision does NOT indicate uterine incision location</strong> — the two are made independently and don't have to match, which matters enormously for VBAC eligibility since it's the uterine incision type that determines whether a future vaginal birth is safe",
    "<strong>Indications and the reasoning behind each:</strong> non-vertex presentation (a breech or transverse fetus generally can't deliver safely through the pelvis), active genital herpes (avoids exposing the newborn to active lesions during vaginal passage), cord prolapse (the fastest way to relieve cord compression is immediate delivery), cephalopelvic disproportion (the fetal head is simply too large for the maternal pelvis), and fetal distress (delivery is the definitive treatment when in-utero resuscitation measures aren't enough)",
    "Anesthesia: <strong>spinal</strong> is typical for a planned C-section — a single injection, no catheter, rapid dense block. The mother is awake and can feel pressure/tugging, but not pain"]},
   {h:"C-section newborn vs. vaginal-birth newborn — physical differences"},
   {table:{head:["Finding","C-section baby","Vaginal-birth baby"],rows:[
     ["Head shape","Rounded — no molding, since the head never passed through the birth canal","Molded, elongated shape from birth canal pressure (resolves in days)"],
     ["Vernix caseosa","Often more intact — protective coating largely undisturbed","Often more wiped away during passage through the canal"]]}},
   {hook:"A rounded, unmolded head on a newborn is a normal, expected finding after a C-section — don't mistake it for macrocephaly or another abnormality."},
   {h:"VBAC"},
   {p:"Vaginal birth after cesarean is a safe, often successful alternative to a repeat cesarean — but the plan always keeps a cesarean backup available in case labor doesn't progress or the uterine scar shows signs of strain."},
   {hook:"Prolonged oxytocin use is itself a <b>hemorrhage risk factor</b> — an overstimulated uterus can be too fatigued to contract after delivery. It's worth noticing that oxytocin shows up on both sides of the hemorrhage story: it's the treatment for atony after delivery, and prolonged exposure to it during labor is also a risk factor for that same atony."}
  ],
  check:{stem:"A patient requesting VBAC says her horizontal scar means she must have had a low transverse uterine incision. What does the nurse know?",
   options:["She's correct","The skin incision doesn't indicate the uterine incision — the operative record is needed","VBAC is never an option after a C-section","Classical incisions are most common"],
   answer:1,
   why:"Skin incision type does not tell you the uterine incision type. The operative record is required, and it determines whether VBAC is safe."}
},
{ id:"emergencies", title:"High-Risk Complications & Emergencies", kicker:"Previa vs. abruption, preeclampsia/HELLP, and cord emergencies",
  blocks:[
   {p:"Some of this goes beyond what your original module deck flagged as tested this semester — but your review materials cover it in depth, so it's worth knowing. Check with your instructor on exact scope. What ties everything in this lesson together is that each condition threatens the same basic thing — adequate oxygen delivery to the fetus, or blood supply to the mother — through a different mechanism, and the nursing priority in each case follows directly from that mechanism."},
   {h:"Placenta previa vs. placental abruption — two very different bleeds"},
   {p:"Both conditions present with third-trimester vaginal bleeding, but the underlying problem — and therefore the nursing response — is almost opposite in each case."},
   {table:{head:["","Placenta previa","Placental abruption"],rows:[
     ["What it is","The placenta implants over or near the internal cervical opening","The placenta prematurely separates from the uterine wall before delivery"],
     ["Bleeding","Painless, bright red","Painful, dark red"],
     ["Abdomen","Soft","Board-like/rigid"],
     ["Key nursing rule","NO vaginal exams allowed — a digital exam could tear the low-lying placenta and cause catastrophic hemorrhage","Monitor for hemorrhagic shock and fetal distress; abruption can conceal significant bleeding behind the placenta even when visible bleeding looks modest"]]}},
   {p:"The mnemonic worth keeping in mind: previa is <strong>p</strong>ainless, abruption is <strong>p</strong>ainful with a rigid, <strong>a</strong>bdomen. If you remember nothing else, remember that a soft abdomen with painless bleeding rules toward previa, and a hard, tender abdomen with painful bleeding rules toward abruption — and that only one of the two (previa) makes a vaginal exam dangerous."},
   {h:"Preeclampsia, eclampsia & HELLP — a spectrum of the same underlying process"},
   {table:{head:["Condition","Definition","Nursing priority"],rows:[
     ["Preeclampsia","New-onset high blood pressure plus proteinuria, developing after 20 weeks gestation","Monitor for 'danger signs': headache, vision changes, epigastric/RUQ pain, facial/hand edema — each of these reflects a different organ system starting to be affected by the vascular changes of the disease"],
     ["Eclampsia","The onset of seizures in a patient who has preeclampsia","A medical emergency — the priority is airway and safety, exactly as it would be for any seizure"],
     ["HELLP syndrome","A severe preeclampsia variant: Hemolysis, Elevated Liver enzymes, Low Platelets","Life-threatening — requires immediate stabilization and delivery, since delivery of the placenta is the only definitive treatment for preeclampsia and its variants"]]}},
   {hook:"Magnesium sulfate is the seizure-prophylaxis drug for preeclampsia — see the Complications lesson for its toxicity signs (loss of DTRs, RR &lt;12, oliguria). It's worth noticing that the goal of magnesium sulfate isn't to lower blood pressure — it's specifically to prevent the seizures that mark the transition from preeclampsia to eclampsia."},
   {h:"Chorioamnionitis"},
   {p:"This is an infection of the amniotic fluid and membranes. Look for <strong>maternal fever and foul-smelling amniotic fluid</strong> — this ties directly back to the 'O' (odor) category in the COAT amniotic fluid assessment from the Cervical Exam lesson, and it's exactly why prolonged rupture of membranes (>24 hours) is flagged as an infection risk throughout this unit: the longer the membranes have been open, the more time bacteria have had to ascend into a normally sterile space."},
   {h:"Umbilical cord emergencies — all variations on the same threat"},
   {p:"Every condition in this table threatens the fetus the same way: something is compressing, obstructing, or exposing the umbilical vessels that carry the fetus's entire oxygen and nutrient supply."},
   {table:{head:["Condition","What it is","Priority action"],rows:[
     ["Cord prolapse","The cord descends into the vagina ahead of the presenting part","EMERGENCY — knee-chest or Trendelenburg position to use gravity to relieve pressure off the cord; a gloved hand pushes the presenting part off the cord until delivery; prepare for immediate C-section"],
     ["Nuchal cord","The cord is wrapped around the fetal neck","Usually managed at delivery — the provider slips it over the head or clamps and cuts it if it's wrapped too tightly to slip off"],
     ["Occult prolapse","The cord is hidden and compressed alongside the presenting part, rather than protruding visibly","Suspected when the monitor shows variable decelerations; reposition the mother to relieve pressure"],
     ["True knot","An actual knot has formed in the cord, usually from fetal movement earlier in pregnancy","Monitor for fetal distress/decelerations, since the knot can tighten further as the fetus descends"],
     ["Vasa previa","Fetal blood vessels cross the internal cervical os unprotected by the umbilical cord or placenta","High risk of fetal exsanguination if the membranes rupture and tear through an exposed vessel; usually managed with a planned cesarean before labor can begin"]]}},
   {hook:"Cord prolapse and vasa previa are both true obstetric emergencies because they directly cut off fetal oxygen/nutrient supply — and in both cases, recognizing <b>variable decelerations</b> on the monitor is often your very first clue that something is compressing the cord, well before the problem becomes visible."},
   {h:"Maternal danger signs — call the provider immediately"},
   {p:"Each of these signs is the earliest outward warning of one of the conditions above — recognizing the sign is what lets you intervene before the underlying condition progresses further."},
   {list:[
    "Vaginal bleeding after the first trimester — think previa or abruption",
    "A gush of fluid from the vagina — possible PROM, carrying infection and cord prolapse risk",
    "Severe headache or blurred vision — a preeclampsia/eclampsia warning sign",
    "Epigastric or RUQ pain — a preeclampsia/HELLP warning sign, reflecting liver involvement",
    "Swelling of the face and hands, not just feet/ankles — dependent ankle swelling is common and benign in pregnancy, but facial/hand edema is not",
    "Decreased fetal movement — a sign of possible fetal compromise",
    "Persistent vomiting — think hyperemesis gravidarum and the dehydration/electrolyte problems it causes",
    "Fever greater than 100.4°F (38°C) — think infection, including chorioamnionitis",
    "Dysuria or cloudy urine — a UTI, which if untreated is a leading cause of preterm labor"]}
  ],
  check:{stem:"A patient at 34 weeks reports sudden, painful dark red vaginal bleeding with a rigid, board-like abdomen. What does the nurse suspect?",
   options:["Placenta previa","Placental abruption","Normal Braxton Hicks contractions","Cervical insufficiency"],
   answer:1,
   why:"Painful dark red bleeding with a rigid, board-like abdomen is the classic presentation of placental abruption. Previa causes painless, bright red bleeding with a soft abdomen."}
}
]};

const U3 = { title:"Newborn Care", sub:"Transition, assessment, and daily care of the newborn.", lessons:[
{ id:"transition", title:"Transition & APGAR", kicker:"A-B-C-T, and scoring the first minutes of life",
  blocks:[
   {p:"For 40 weeks, the placenta did the newborn's breathing, feeding, and temperature regulation for it. The moment the cord is clamped, all of that responsibility transfers to an organ system that has never had to work alone before. This handoff is the single most important concept in newborn nursing, because nearly every problem covered later in this unit — cold stress, hypoglycemia, respiratory distress — is really just a variation on this transition not going smoothly."},
   {h:"Immediate priorities — A-B-C-T"},
   {list:["<strong>A</strong>irway — clear secretions","<strong>B</strong>reathing — establish and support respiratory effort","<strong>C</strong>irculation — assess heart rate and perfusion","<strong>T</strong>hermoregulation — prevent heat loss immediately, since a newborn's ability to generate heat is limited (see the Common Concerns lesson for the full cold-stress chain)"]},
   {h:"APGAR — scoring how well that transition is going"},
   {p:"The APGAR score is a quick, standardized snapshot of how the newborn is tolerating the transition to life outside the uterus. It's scored at <strong>1, 5, and 10 minutes</strong> after birth (the 10-minute score is repeated if the 5-minute score is still low), using five categories, each worth 0, 1, or 2 points."},
   {table:{head:["Category","0 points","1 point","2 points"],rows:[
     ["Appearance (color)","Blue/pale all over","Pink body, blue extremities (acrocyanosis)","Completely pink"],
     ["Pulse (heart rate)","Absent","Below 100 bpm","Above 100 bpm"],
     ["Grimace (reflex irritability)","No response to stimulation","Grimace/minimal response","Vigorous cry, cough, or sneeze"],
     ["Activity (muscle tone)","Limp","Some flexion of extremities","Active motion"],
     ["Respiration","Absent","Slow, irregular","Vigorous cry"]]}},
   {table:{head:["Total score","Meaning"],rows:[
     ["7–10","Normal"],
     ["4–6","Mild distress"],
     ["0–3","Severe distress"]]}},
   {hook:"Acrocyanosis (blue hands/feet, pink body) scores only a 1 for Appearance — which is why very few babies score a true 10 at one minute. A totally normal, healthy newborn very commonly scores an 8 or 9 at one minute simply because its hands and feet haven't pinked up yet; don't mistake a 9 for a bad sign."},
   {h:"Periods of reactivity — what's normal in the first hours"},
   {p:"A healthy newborn doesn't stay in one behavioral state after birth — it moves through a predictable sequence over the first several hours, and knowing this sequence keeps you from misreading a normal sleep phase as lethargy."},
   {table:{head:["Period","Timing","What's happening"],rows:[
     ["1st period of reactivity","Birth → ~30 min","Alert, active, strong sucking reflex — the ideal window for bonding and first feeding, since the newborn is naturally at its most engaged right after birth"],
     ["Sleep phase","~30 min → 2 hours","Newborn is difficult to arouse, with decreased responsiveness — a normal deep-sleep phase, not a warning sign"],
     ["2nd period of reactivity","~2–8 hrs after birth","Increased responsiveness returns; the newborn may pass meconium during this window; brief, self-resolving apnea can occur and should be watched but isn't automatically alarming"]]}}
  ],
  check:{stem:"A 1-minute-old has HR 130, vigorous cry, active movement, prompt response to suction, and a pink body with blue hands/feet. What's the APGAR score?",
   options:["10","9","8","7"],
   answer:1,
   why:"Every category scores 2 except Appearance (acrocyanosis scores 1), giving a total of 9."}
},
{ id:"assess", title:"Physical Assessment, Vital Signs & Skin", kicker:"The general survey and normal ranges",
  blocks:[
   {h:"Vital signs (MEMORIZE)"},
   {table:{head:["Parameter","Normal range"],rows:[
     ["Temperature","97.8–99.0°F / 36.6–37.2°C (axillary)"],
     ["Apical pulse","110–160 bpm (up to 190 briefly if active), full minute"],

   {h:"Assessment sequence — least invasive first, for a reason"},
   {p:"The order you assess vital signs in isn't arbitrary — it's designed to get accurate respiratory and heart rate readings before the baby is disturbed enough to cry, since crying changes both numbers. The sequence is: <strong>respirations → heart rate → temperature</strong> (temperature is always last, since babies dislike it and it's the most likely step to trigger crying) <strong>→ weight → length → head circumference → chest circumference</strong>. Apical pulse in an infant is auscultated at the <strong>4th intercostal space</strong>, lateral to the midclavicular line — one space higher than the adult landmark (5th ICS), reflecting the newborn heart's slightly different position in a smaller chest."},
   {hook:"A newborn's <b>WBC count can normally rise to 30,000/µL</b> during the stress of labor and birth — don't mistake this for infection without other clinical signs (fever, poor feeding, lethargy)."},
   {h:"Level of consciousness — assess BEFORE handling"},
   {p:"Before you even touch the newborn, observing its behavioral state tells you a lot about comfort and readiness for exam:"},
   {list:["Sleeping","Quiet alert (awake, calmly observing)","Active alert (moving, may be feeding)","Crying (may indicate distress/discomfort)"]},
   {h:"Face & mouth"},
   {p:"<strong>Epstein's pearls</strong> are small, white-yellow cysts on the newborn's gums or palate — a completely normal finding, not thrush. It's worth being able to distinguish three look-alike findings in this area: Epstein's pearls (normal, no treatment), a <strong>cleft palate</strong> (a structural defect requiring further evaluation), and <strong>thrush</strong> (white patches that don't wipe off, caused by Candida, which does need treatment)."},
   {h:"Measurements"},
   {list:[
    "Head circumference ≈ ¼ of length ≈ <strong>13–14 in (33–35 cm)</strong>; chest circumference ≈ <strong>12–13 in (30–33 cm)</strong> — the head is normally about 2–3 cm LARGER than the chest at birth",
    "Weight loss up to <strong>10%</strong> in week 1 is expected, driven by fluid shifts and the gap before a full milk supply comes in — the newborn should be back to birth weight by <strong>2–3 weeks</strong>"]},
   {h:"Skin findings — harmless vs. flag"},
   {table:{head:["Finding","Meaning"],rows:[
     ["Erythema toxicum, milia, vernix, lanugo","Harmless, normal newborn findings"],
     ["Mongolian spot","Document so it's not mistaken for bruising later"],
     ["Cephalohematoma","Doesn't cross suture lines — adds to bilirubin load, since it represents trapped blood breaking down"],
     ["Caput succedaneum","Crosses suture lines — resolves on its own, since it's just soft tissue swelling from delivery pressure"],
     ["Acrocyanosis","Blue extremities/hands/feet — NORMAL for the first 24 hours after birth"],
     ["Central cyanosis","Blue LIPS/chest — NOT normal; suggests cardiac/respiratory distress"]]}},

   {h:"Additional findings to know"},
   {list:[
    "<strong>Sacral dimple</strong> — a small indentation near the lower back/spine; may signal an underlying spinal anomaly (e.g., spina bifida occulta) and needs further evaluation",
    "<strong>Hypospadias</strong> — urethral opening on the UNDERSIDE (ventral) of the penis; <strong>Epispadias</strong> — opening on the TOP (dorsal) side. Both are abnormal and reportable",
    "<strong>Uric acid crystals</strong> in urine can cause a rust/pink-colored stain in the diaper in the first 24 hours — a normal finding parents often mistake for blood",
    "<strong>Pseudomenstruation</strong> — small blood-tinged vaginal discharge in a female newborn from maternal hormone withdrawal — normal"]},
   {hook:"A key gentle-handling tip: examine the eyes with a dim light rather than forcing them open, and save the temperature for last — both reduce unnecessary crying that would otherwise skew your respiratory and heart rate counts."},
   {h:"⚠️ A note on conflicting numbers in your materials"},
   {p:"Your sources give slightly different cutoffs for a couple of newborn values — heart rate range (110–160 vs. 100–190 bpm under 1 month) and head/chest circumference (33–35 cm vs. 33–38 cm head; chest ~1–3 cm smaller than head, depending on source). This is common — different textbooks, review guides, and instructors round differently. Use whatever specific number your instructor/course has emphasized as the 'official' one for your exam, and treat these two ranges as a general ballpark rather than a single hard cutoff."}

  check:{stem:"A newborn weighed 3400g at birth; on day 4 it's 3150g. Interpretation?",
   options:["This is an expected ~7% loss","This indicates failure to thrive","This suggests dehydration needing IV fluids","The birth weight was recorded wrong"],
   answer:0,
   why:"Newborns can lose up to 10% of birth weight in week 1. A 250g loss from 3400g is about 7% — within expected range. Watch for return to birth weight by 2–3 weeks."}
