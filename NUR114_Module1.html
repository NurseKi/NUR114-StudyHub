     ["Bacterial Vaginosis","G. vaginalis (bacteria)","N/A","Gray, fishy-smelling discharge","Metronidazole; Yes"],
     ["HSV (Herpes)","Virus (HSV-1/2)","Variable","Painful vesicles/ulcers, malaise","Acyclovir; No"],
     ["HPV (Warts)","Virus (papillomavirus)","Variable","Cauliflower-like warts; often asymptomatic","Topical/cryo; No — primary cervical cancer risk; prevention: Gardasil vaccine"],
     ["Trichomoniasis","T. vaginalis (protozoan)","5–28 days","F: frothy yellow-green discharge, 'strawberry cervix'; M: often asymptomatic, urethritis","Metronidazole (Flagyl); Yes — treat partner! Avoid alcohol (disulfiram-like reaction: flushing, vomiting, tachycardia, hypotension within 10–30 min)"]]}}

  check:{stem:"Using the GTPAL vs. G/P mapping, if a patient's GTPAL is G4 T2 P1 A1 L3, what would her simple Gravida/Para (G/P) be?",

examone:[
// ===== DOSE CALCULATION (3 — FITB only) =====
{ ref:"mathdose",type:"fitb", stem:"A prescriber orders 1.5 g of an oral antibiotic. The medication is supplied as 500 mg tablets. How many tablets should the nurse administer? (Round to the nearest tenth if the answer is not a whole number.)",
 answer:3,
 why:"Convert 1.5 g to 1500 mg. 1500 mg ÷ 500 mg/tablet = 3 tablets."},
{ ref:"mathiv",type:"fitb", stem:"A prescriber orders an IV infusion of 1500 mL to run over 10 hours via an infusion pump. At how many mL/hr should the nurse set the pump? (Round to the nearest tenth if needed.)",
 answer:150,
 why:"1500 mL ÷ 10 hr = 150 mL/hr."},
{ ref:"precon",type:"gtpal", stem:"A client reports being pregnant 4 times. Her history includes twins delivered at 36 weeks (both twins living), a single delivery at 39 weeks (living), and two early pregnancy losses at 8 and 10 weeks. She is not currently pregnant. Calculate this client's GTPAL.",
 answers:[4,1,1,2,3],
 why:"G = 4 (all four pregnancies count, regardless of outcome). T = 1 (the 39-week delivery, since it's ≥37 weeks). P = 1 (the twins at 36 weeks — a preterm delivery counts as ONE event regardless of how many babies). A = 2 (both losses before 20 weeks). L = 3 (both twins plus the term baby — three living children; twins DO count individually here, unlike in G, T, and P). Together: G4 T1 P1 A2 L3."},

// ===== SEXUALITY (9 — 7 MC + 2 SATA) =====
{ ref:"medsexual",stem:"A client taking sildenafil for erectile dysfunction reports he also uses sublingual nitroglycerin PRN for angina. What is the nurse's priority action?",
 options:["Notify the prescriber immediately due to the risk of severe hypotension","Instruct the client to take both medications together as needed","Advise the client to space the doses 2 hours apart","Instruct the client to double the sildenafil dose if chest pain occurs","Reassure the client this combination is safe"],
 answer:0,
 why:"PDE5 inhibitors and nitrates both cause vasodilation; combining them can cause severe, potentially fatal hypotension. This combination is never safe regardless of spacing."},
{ ref:"menomen",stem:"A nurse is teaching a client about primary dysmenorrhea. Which statement indicates effective teaching?",
 options:["\"I should wait until the pain is severe before taking ibuprofen.\"","\"I will take an NSAID as soon as symptoms begin, before the pain becomes severe.\"","\"This pain is usually caused by pelvic scarring.\"","\"This type of pain usually starts more than five years after my first period.\"","\"I should schedule surgery to correct this.\""],
 answer:1,
 why:"NSAIDs are most effective for primary dysmenorrhea when taken before pain becomes severe. Primary dysmenorrhea is caused by excess prostaglandins (not scarring), begins within about a year of menarche, and is managed medically, not surgically."},
{ ref:"infertfam",stem:"A couple has been trying to conceive for 13 months without success. Which diagnostic test should be performed FIRST?",
 options:["Hysterosalpingogram","Endometrial biopsy","Semen analysis","Laparoscopy","Postcoital test"],
 answer:2,
 why:"Semen analysis is the first test performed in an infertility workup because it is non-invasive and cost-effective, and male factors account for roughly a third of infertility cases."},
{ ref:"menomen",stem:"A client is being evaluated for secondary amenorrhea. Which test should the nurse anticipate FIRST?",
 options:["Serum FSH","Thyroid-stimulating hormone","Prolactin level","Pregnancy test","Pelvic ultrasound"],
 answer:3,
 why:"Pregnancy is the most common cause of secondary amenorrhea and must be ruled out before pursuing other endocrine or structural workups."},
{ ref:"menomen",stem:"A 53-year-old client asks the nurse when menopause is considered official. Which response is correct?",
 options:["\"After 3 months without a period.\"","\"After you turn 55.\"","\"After your estrogen level reaches zero.\"","\"After your first hot flash.\"","\"After 12 consecutive months without a menstrual period.\""],
 answer:4,
 why:"Menopause is confirmed retrospectively after 12 consecutive months without a menstrual period — it is not defined by a specific age or a single symptom."},
{ ref:"menomen",stem:"A client is prescribed hormone replacement therapy (HRT) for menopausal symptoms. Which finding in the client's history would be a contraindication?",
 options:["History of breast cancer","Seasonal allergies","Family history of osteoporosis","Mild hypothyroidism, controlled","History of migraines without aura"],
 answer:0,
 why:"HRT is contraindicated in patients with a history of breast cancer, as well as MI, stroke, or blood clot history. The other findings listed are not contraindications."},
{ ref:"stis",stem:"A client with trichomoniasis is prescribed metronidazole. Which instruction is most important for the nurse to include?",
 options:["\"Take this medication with a high-fat meal.\"","\"Avoid alcohol during treatment and for a period afterward.\"","\"This medication may turn your urine orange.\"","\"You do not need your partner to be treated.\"","\"This infection cannot be cured.\""],
 answer:1,
 why:"Metronidazole causes a disulfiram-like reaction with alcohol (flushing, vomiting, tachycardia, hypotension). Trichomoniasis is curable, and partners must also be treated to prevent reinfection."},
{ ref:"infertfam",type:"sata", stem:"A nurse is teaching a client about combined oral contraceptives. Which findings should the nurse instruct the client to report immediately? Select all that apply.",
 options:["Abdominal pain","Severe headache","Sudden vision changes","Mild breast tenderness","Slight weight gain of 1 lb"],
 answers:[0,1,2],
 why:"Abdominal pain, severe headache, and sudden vision changes are part of the ACHES warning signs for estrogen-containing contraceptives, signaling possible clot or hypertensive complications. Mild breast tenderness and slight weight gain are common, benign side effects."},
{ ref:"stis",type:"sata", stem:"A nurse is caring for a client recently diagnosed with gonorrhea. Which actions should the nurse include in the plan of care? Select all that apply.",
 options:["Administer a single IM dose of ceftriaxone","Report the case to the public health department","No follow-up testing is needed once treated","Instruct the client to notify all sexual partners","Explain that treatment provides lifelong immunity against reinfection"],
 answers:[0,1,3],
 why:"Ceftriaxone IM, public health reporting, and partner notification are all standard components of gonorrhea management. Follow-up testing IS needed (reinfection is common), and treatment does not confer immunity — reinfection can occur again after successful treatment."},

// ===== ANTEPARTUM (7 — 6 MC + 1 SATA) =====
{ ref:"precon",stem:"A nurse calculates a client's estimated due date using Naegele's rule. The client's last menstrual period began on May 10. What is the estimated due date?",
 options:["January 17 of the following year","February 3 of the following year","February 17 of the following year","March 10 of the following year","April 17 of the current year"],
 answer:2,
 why:"Subtract 3 months from May 10 → February 10. Add 7 days → February 17. Add 1 year → February 17 of the following year."},
{ ref:"trim",stem:"A nurse is caring for a pregnant client at 26 weeks gestation. Which finding should the nurse identify as a POSITIVE sign of pregnancy?",
 options:["Positive urine hCG","Braxton Hicks contractions","Chadwick's sign","Fetal heart tones auscultated by the nurse","Amenorrhea"],
 answer:3,
 why:"Fetal heart tones detected by the examiner are a positive sign — caused by nothing but an actual fetus. hCG, Braxton Hicks, and Chadwick's sign are probable signs; amenorrhea is presumptive."},
{ ref:"teach",stem:"A nurse is providing dietary teaching to a pregnant client. Which statement by the client indicates a need for further teaching?",
 options:["\"I will avoid unpasteurized soft cheeses.\"","\"I will limit my coffee to one cup a day.\"","\"I will avoid deli meats unless they are heated first.\"","\"I will avoid raw cookie dough.\"","\"I will eat sushi made with raw tuna twice a week.\""],
 answer:4,
 why:"Raw fish/sushi is avoided in pregnancy due to foodborne illness risk. The other statements all reflect correct, safe practices."},
{ ref:"physio",stem:"A client at 38 weeks gestation reports that her fundal height, which had been increasing steadily, decreased by 2 cm since her last visit. How should the nurse interpret this finding?",
 options:["This is an expected finding related to lightening","This suggests intrauterine growth restriction","This indicates the membranes have ruptured","This suggests a multiple gestation","This requires immediate ultrasound to rule out fetal demise"],
 answer:0,
 why:"A decrease in fundal height near term reflects lightening, as the fetus descends into the pelvis in preparation for labor — an expected finding, not a red flag."},
{ ref:"physio",type:"cloze", stem:"Complete the explanation of physiologic anemia in pregnancy.",
 template:"A pregnant client's total blood volume increases by up to {0}% during pregnancy, but red blood cell mass increases by only {1}%, producing a state of {2} that is a normal, expected adaptation rather than a nutritional deficiency.",
 blanks:[
   {options:["45","20","70"], correct:0},
   {options:["20–30","40–60","60–80"], correct:0},
   {options:["physiologic hemodilution (dilutional anemia)","true iron-deficiency anemia","polycythemia"], correct:0}
 ],
 why:"Total blood volume rises up to 45%, driven mostly by a 40–60% plasma increase, while red blood cell mass rises only 20–30% — producing physiologic (dilutional) anemia, a normal adaptation rather than a nutritional deficiency."},
{ ref:"complications",stem:"A client is diagnosed with placenta previa at 34 weeks gestation. Which action should the nurse avoid?",
 options:["Monitoring fetal heart rate","Assessing vital signs frequently","Performing a digital vaginal examination","Preparing for possible blood transfusion","Educating the client on activity restriction"],
 answer:2,
 why:"A digital vaginal exam can disrupt a low-lying placenta and cause severe hemorrhage — it is contraindicated with known or suspected placenta previa."},
{ ref:"precon",type:"sata", stem:"A nurse is providing preconception counseling to a client planning to become pregnant. Which teaching points should the nurse include? Select all that apply.",
 options:["Begin taking folic acid before you conceive","Check your rubella immunity status","Wait until your first missed period to start prenatal vitamins","Schedule an amniocentesis before conceiving","Review your current medications for anything that may be harmful in pregnancy"],
 answers:[0,1,4],
 why:"Folic acid, rubella immunity screening, and medication review should all happen BEFORE conception. Waiting for a missed period to start folic acid is too late for neural tube closure, and amniocentesis is a diagnostic test performed during an established pregnancy, not before conception."},

// ===== FETAL CIRCULATION (4 — 3 MC + 1 SATA) =====
{ ref:"admit",stem:"A nursing instructor is teaching students about fetal circulation. Which statement by a student indicates correct understanding of the foramen ovale?",
 options:["\"It connects the pulmonary artery to the aorta.\"","\"It allows blood to bypass the liver.\"","\"It closes before birth in a healthy fetus.\"","\"It allows blood to flow from the right atrium to the left atrium.\"","\"It carries oxygenated blood from the placenta to the fetus.\""],
 answer:3,
 why:"The foramen ovale allows blood to flow directly from the right atrium to the left atrium, bypassing the fetal lungs. It normally closes functionally AFTER birth, not before."},
{ ref:"admit",stem:"Which structure is responsible for allowing fetal blood to bypass the liver?",
 options:["Foramen ovale","Ductus arteriosus","Umbilical artery","Umbilical vein","Ductus venosus"],
 answer:4,
 why:"The ductus venosus connects the umbilical vein to the inferior vena cava, allowing oxygenated blood to bypass the fetal liver."},
{ ref:"admit",stem:"A newborn is diagnosed with a patent ductus arteriosus shortly after birth. The nurse understands this occurs because of a failure of which process?",
 options:["Decreased pulmonary vascular resistance and increased oxygen levels after birth, which normally trigger closure","Increased right atrial pressure at birth","Clamping of the umbilical cord","Decreased left atrial pressure after birth","Increased pulmonary vascular resistance after the first breath"],
 answer:0,
 why:"After birth, the first breaths inflate the lungs, dropping pulmonary vascular resistance and raising oxygen tension — this normally triggers ductus arteriosus closure. A patent (still open) ductus reflects failure of this process."},
{ ref:"admit",type:"sata", stem:"Which statements accurately describe fetal circulation? Select all that apply.",
 options:["The umbilical cord contains two arteries and one vein","Oxygenation occurs in the fetal lungs","Right-sided heart pressure is higher than left-sided pressure in the fetus","The placenta functions as the fetal organ of gas exchange","The umbilical vein carries deoxygenated blood away from the fetus"],
 answers:[0,2,3],
 why:"The cord has 2 arteries/1 vein, right-sided pressure exceeds left in the fetus (driving the shunts), and the placenta is the fetal gas-exchange organ. Oxygenation does NOT occur in the fetal lungs (they're fluid-filled and non-functional), and the umbilical vein carries OXYGENATED blood TO the fetus, not deoxygenated blood away."},

// ===== INTRAPARTUM (11 — 9 MC + 2 SATA) =====
{ ref:"admit",stem:"A nurse is monitoring a client in active labor and notes fetal heart rate decelerations that begin after the peak of the contraction and return to baseline after the contraction ends. Which action should the nurse take FIRST?",
 options:["Continue routine monitoring, this is a normal finding","Discontinue the oxytocin infusion and reposition the client onto her left side","Prepare for immediate forceps delivery","Encourage the client to begin pushing","Increase the oxytocin infusion rate"],
 answer:1,
 why:"This describes a late deceleration, indicating uteroplacental insufficiency. The priority is to stop oxytocin, reposition to the left side, give oxygen, and bolus IV fluids to improve placental perfusion."},
{ ref:"admit",stem:"A nurse observes early decelerations on a client's fetal monitor strip during active labor. What is the appropriate nursing action?",
 options:["Reposition the client immediately","Administer oxygen via face mask","Continue routine monitoring — no intervention is required","Notify the healthcare provider immediately","Prepare for an emergency cesarean birth"],
 answer:2,
 why:"Early decelerations mirror the contraction and result from head compression — a normal, benign finding that requires no intervention."},
{ ref:"cervixpos",stem:"A client's cervix is 6 cm dilated with the fetal head at 0 station. Another client is 8 cm dilated with the fetal head at -2 station. Which statement is accurate?",
 options:["The second client will deliver first because she is more dilated","Station is not a relevant factor once dilation reaches 6 cm","Both clients are equally close to delivery","The second client requires an emergency cesarean","The first client may be closer to delivery due to increased fetal descent"],
 answer:4,
 why:"Descent (station) matters as much as dilation. A fetus at 0 station has descended further than one at -2 station, even with less cervical dilation."},
{ ref:"complications",stem:"A client is receiving an oxytocin infusion for labor induction. The nurse notes contractions occurring every 90 seconds lasting 100 seconds each, with a resting tone that does not return to baseline between contractions. What is the priority nursing action?",
 options:["Stop the oxytocin infusion and notify the provider","Increase the oxytocin infusion rate","Document the finding and continue monitoring","Encourage the client to change positions and reassess in 30 minutes","Administer a bolus of oxytocin"],
 answer:0,
 why:"This describes uterine tachysystole with inadequate uterine rest between contractions — the oxytocin infusion must be stopped immediately to prevent fetal hypoxia and uterine rupture."},
{ ref:"painmgmt",stem:"A nurse is caring for a client receiving epidural anesthesia during labor. Fifteen minutes after placement, the client's blood pressure drops from 118/72 to 82/48 mmHg. What is the nurse's priority action?",
 options:["Increase the epidural infusion rate","Position the client on her left side, increase IV fluids, and administer oxygen","Discontinue all IV fluids","Prepare the client for an emergency cesarean birth","Administer a vasopressor without further assessment"],
 answer:1,
 why:"Epidural-associated hypotension reduces placental perfusion. The priority actions are left-side positioning, an IV fluid bolus, and oxygen — aimed at restoring blood flow to the placenta."},
{ ref:"emergencies",stem:"A nurse notes a prolapsed umbilical cord on vaginal examination of a laboring client. What is the priority nursing action?",
 options:["Encourage the client to push with the next contraction","Administer oxytocin to speed delivery","Place the client in a knee-chest or Trendelenburg position and relieve pressure on the cord with a gloved hand","Perform fundal massage","Document the finding and continue routine monitoring"],
 answer:2,
 why:"Cord prolapse is an obstetric emergency. The nurse relieves cord compression using knee-chest or Trendelenburg positioning and a gloved hand, while preparing for immediate cesarean birth."},
{ ref:"complications",type:"sata", stem:"A nurse is assessing a postpartum client's risk factors for hemorrhage from uterine atony. Which findings are recognized risk factors? Select all that apply.",
 options:["Prolonged labor","Retained placental fragments","A primigravida with a 3-hour labor","Uterine atony on prior assessment","A scheduled cesarean birth with no labor"],
 answers:[0,1,3],
 why:"Prolonged labor, retained placental fragments, and a history of uterine atony are all recognized hemorrhage risk factors. A short labor or a cesarean with no labor at all are actually LOWER-risk scenarios for atony-related hemorrhage."},
{ ref:"admit",type:"sata", stem:"A nurse is teaching a client about the difference between true and false labor. Which characteristics are consistent with TRUE labor? Select all that apply.",
 options:["Contractions intensify with walking","Contractions are relieved by a warm shower","Contractions occur at irregular intervals","Progressive cervical dilation occurs","Contractions do not resolve with rest"],
 answers:[0,3,4],
 why:"True labor contractions intensify with activity, produce progressive cervical change, and do not resolve with rest. Contractions relieved by a shower or occurring at irregular intervals describe false (Braxton Hicks) labor."},

// ===== POSTPARTUM (12 — 9 MC + 3 SATA) =====
{ ref:"systemic",stem:"A postpartum client on day 3 reports unilateral calf pain, warmth, and swelling. Which physiologic change makes this finding especially concerning?",
 options:["Decreased clotting factors postpartum","Increased clotting factors and a hypercoagulable state postpartum","Decreased cardiac output postpartum","Increased bladder capacity postpartum","Decreased venous pooling in the legs postpartum"],
 answer:1,
 why:"The postpartum period is a hypercoagulable state due to increased clotting factors, raising the risk for venous thromboembolism — unilateral calf pain, warmth, and swelling should be investigated for possible DVT rather than dismissed as a routine discomfort."},
{ ref:"involution",stem:"A nurse is assessing lochia on a client who delivered vaginally 5 days ago. Which finding should the nurse document as expected?",
 options:["Bright red lochia with small clots","Pink to brownish lochia","Absence of any lochia","Foul-smelling yellow discharge","Return to bright red lochia after several days of lighter flow"],
 answer:1,
 why:"By day 5, lochia serosa (pink to brownish) is expected. Bright red lochia rubra is expected days 1–3; foul odor and reversion to rubra are both concerning findings."},
{ ref:"involution",stem:"A nurse is providing discharge teaching to a postpartum client regarding lochia. Which statement indicates a need for further teaching?",
 options:["\"I should call my provider if I see large clots.\"","\"My lochia should progress from red to pink to white or yellow.\"","\"A foul odor should be reported to my provider.\"","\"It's normal for my lochia to go back to red after it has turned white.\"","\"I should change my pad every 2 to 3 hours.\""],
 answer:3,
 why:"Lochia should progress forward (rubra → serosa → alba), never reverse. A return to red bleeding after it has lightened suggests retained tissue or a uterus not contracting well, and needs to be reported — this statement reflects a misunderstanding."},
{ ref:"medrhogam",stem:"A client who is Rh-negative delivers an Rh-positive newborn. When should the nurse anticipate administering RhoGAM?",
 options:["Within 72 hours of delivery","Only if the client has a history of miscarriage","Only if requested by the client","Within 30 days of delivery","RhoGAM is not indicated in this situation"],
 answer:0,
 why:"RhoGAM is given within 72 hours of delivery when an Rh-negative mother delivers an Rh-positive infant, to prevent maternal sensitization in future pregnancies."},
{ ref:"mood",stem:"A nurse is caring for a client who delivered 3 weeks ago. The client reports persistent sadness, difficulty sleeping even when the baby sleeps, and feelings of worthlessness that have not improved. What is the priority nursing action?",
 options:["Reassure the client that postpartum blues affect most new mothers and will resolve","Refer the client for further evaluation of postpartum depression","Tell the client to wait two more weeks before seeking help","Explain that this is postpartum psychosis and requires hospitalization","Instruct the client to increase her fluid intake"],
 answer:1,
 why:"Symptoms persisting beyond 2 weeks and worsening suggest postpartum depression, not the self-limited postpartum blues — this warrants referral for evaluation, not reassurance or delay."},
{ ref:"lactation",stem:"A nurse is providing discharge teaching about lactation to a breastfeeding client. Which statement indicates a need for further teaching?",
 options:["\"I will use lanolin cream if my nipples become cracked.\"","\"I will break the latch with my finger before removing the baby from my breast.\"","\"I do not need contraception since I am breastfeeding exclusively and haven't had a period.\"","\"I will feed on demand, roughly every 2 to 3 hours.\"","\"I will alternate which breast I start with at each feeding.\""],
 answer:2,
 why:"Ovulation can occur before the return of the first postpartum period, so breastfeeding is NOT a reliable method of contraception — this statement reflects a misunderstanding requiring further teaching."},
{ ref:"systemic",type:"sata", stem:"A nurse is assessing a client for signs of bladder distention on postpartum day 1. Which findings support this assessment? Select all that apply.",
 options:["Voiding 400 mL of clear urine","Fundus displaced from the midline","Excessive lochia","Small, frequent voids of less than 150 mL","Active bowel sounds"],
 answers:[1,2,3],
 why:"A displaced fundus, excessive lochia, and small/frequent voids under 150 mL are all signs of bladder distention overflow. Voiding a normal 400 mL amount and active bowel sounds are both reassuring, normal findings."},
{ ref:"medsexual",type:"sata", stem:"A nurse is teaching a client about warning signs associated with combined hormonal contraceptives. Which symptoms should the client be instructed to report immediately? Select all that apply.",
 options:["Mild breast tenderness in the first few weeks","Sudden chest pain","Severe leg pain and swelling","Slight nausea after taking the pill","Sudden vision loss or double vision"],
 answers:[1,2,4],
 why:"Chest pain, severe leg pain/swelling (possible DVT), and sudden vision changes are ACHES warning signs requiring immediate reporting. Mild breast tenderness and slight nausea are common, benign early side effects."},
{ ref:"involution",type:"sata", stem:"A nurse is caring for a client 6 hours postpartum following a vaginal birth. Which findings require the nurse to notify the provider? Select all that apply.",
 options:["Fundus firm and at the level of the umbilicus","Temperature of 100.6°F (38.1°C)","Moderate lochia rubra with small clots","Foul-smelling lochia","Saturation of a perineal pad within 15 minutes"],
 answers:[1,3,4],
 why:"Fever, foul-smelling lochia, and rapid pad saturation are all concerning findings requiring provider notification. A firm fundus at the umbilicus and moderate lochia rubra with small clots are both normal, expected findings this early postpartum."},

// ===== NEWBORN / DEVELOPMENTAL (14 — 11 MC + 3 SATA) =====
{ ref:"concerns",stem:"A nurse is caring for a newborn with suspected Down syndrome. Which finding is most consistent with this diagnosis?",
 options:["Low-set ears and a single palmar crease","Cleft lip and polydactyly","Webbed neck and low hairline","Microcephaly and cutis marmorata","Hypertonia and clenched fists"],
 answer:0,
 why:"Low-set ears and a single palmar (simian) crease are classic physical characteristics of Down syndrome, along with hypotonia, a flattened facial profile, and upward-slanting eyes — not the findings listed in the other options, which describe different conditions."},
{ ref:"concerns",stem:"A nurse is caring for a newborn exhibiting jitteriness, poor feeding, and a temperature of 96.2°F (35.7°C). What should the nurse assess FIRST?",
 options:["Bilirubin level","Blood glucose level","Hematocrit","Hearing screen result","Head circumference"],
 answer:1,
 why:"Jitteriness, poor feeding, and low temperature overlap across hypoglycemia, sepsis, and cold stress. A glucose check is fast and hypoglycemia is immediately correctable, making it the priority assessment."},
{ ref:"nas",stem:"A nurse is caring for a newborn diagnosed with Neonatal Abstinence Syndrome. Which nonpharmacologic intervention should the nurse implement FIRST?",
 options:["Increase environmental stimulation to keep the infant alert","Withhold feedings until symptoms resolve","Administer morphine sulfate immediately","Encourage frequent handling by multiple caregivers","Swaddle the infant snugly in a flexed position in a low-stimulation environment"],
 answer:4,
 why:"Nonpharmacologic measures — a low-stimulation environment and snug, flexed swaddling — are first-line for NAS. Increased stimulation, withholding feeds, and immediate pharmacologic treatment are all inappropriate first steps."},
{ ref:"concerns",stem:"A nurse is caring for a 4-month-old diagnosed with cerebral palsy. Which nursing priority should guide the plan of care?",
 options:["Preventing disease progression","Safety, including prevention of aspiration and falls","Restricting all physical activity","Strict isolation precautions","Preventing all use of assistive devices"],
 answer:1,
 why:"Cerebral palsy is non-progressive by definition. The nursing priority is safety — preventing aspiration from impaired swallowing and falls from abnormal muscle tone/movement."},
{ ref:"concerns",stem:"A nurse is assessing an infant diagnosed with failure to thrive. Which finding is consistent with this diagnosis?",
 options:["Height is the first parameter to drop below the 5th percentile","Head circumference is the first parameter affected","Weight is the first parameter to drop below the 5th percentile","All growth parameters decline at the same rate","Head circumference is never affected"],
 answer:2,
 why:"In failure to thrive, weight drops below the 5th percentile first, followed by height, with head circumference affected last — the body prioritizes brain growth even when nutrition is inadequate."},
{ ref:"mednewborn",stem:"A nurse is preparing to administer vitamin K to a newborn. The parents ask why this is necessary. What is the nurse's best response?",
 options:["\"It prevents jaundice.\"","\"It boosts the newborn's immune system.\"","\"It is required only for preterm infants.\"","\"It prevents infection at the umbilical cord site.\"","\"Vitamin K does not cross the placenta well, so newborns are born with very low levels needed for clotting.\""],
 answer:4,
 why:"Vitamin K crosses the placenta poorly, leaving newborns with very low stores of a vitamin essential for clotting factor synthesis — this is why vitamin K is given to ALL newborns, not just preterm infants, and it does not prevent jaundice or infection."},
{ ref:"assess",type:"sata", stem:"A nurse is assessing a newborn's skin. Which findings are considered normal, benign variations? Select all that apply.",
 options:["Central cyanosis of the lips","Acrocyanosis lasting into the second week of life","Mongolian spots","Erythema toxicum","Milia"],
 answers:[2,3,4],
 why:"Mongolian spots, erythema toxicum, and milia are all normal, benign newborn skin findings. Central cyanosis is never normal, and acrocyanosis is expected only in the first 24 hours, not into the second week."},
{ ref:"assess",type:"sata", stem:"A nurse is caring for a newborn and reviewing vital signs. Which findings fall within the expected range for a healthy newborn? Select all that apply.",
 options:["Heart rate of 140 bpm","Axillary temperature of 98.3°F (36.8°C)","Oxygen saturation of 97% on room air","Respiratory rate of 70 breaths/min, sustained","Blood pressure of 130/85 mmHg"],
 answers:[0,1,2],
 why:"A heart rate of 140 bpm, temperature of 98.3°F, and O2 saturation of 97% are all within normal newborn ranges. A sustained RR of 70/min exceeds the normal 30–60/min range, and a BP of 130/85 is far too high for a newborn (normal is roughly 60–80 systolic/30–45 diastolic)."},
{ ref:"dailycare",type:"sata", stem:"A nurse is teaching new parents about safe sleep practices. Which statements indicate correct understanding? Select all that apply.",
 options:["\"I will place the baby on their back to sleep.\"","\"I will keep stuffed animals out of the crib.\"","\"I will use a soft mattress with bumper pads for comfort.\"","\"I will avoid loose blankets in the crib.\"","\"I will let the baby sleep in bed with me for easier nighttime feeding.\""],
 answers:[0,1,3],
 why:"Back-sleeping, an empty crib free of stuffed animals, and avoiding loose blankets are all correct safe sleep practices. Soft mattresses/bumper pads and bed-sharing are both unsafe practices that increase SIDS/suffocation risk."},

// ===== CASE STUDY (6 linked questions — shared reference tabs, 1 point each) =====
{ ref:"admit",caseId:"rivera", stem:"CASE STUDY (1 of 6): Review the Face Sheet and Admission Vitals tabs. Immediately after confirming the finding documented under 'Membranes,' what should the nurse assess FIRST?",
 options:["Cervical dilation","Fetal heart rate","Maternal temperature","Amount of amniotic fluid","Maternal blood type"],
 answer:1,
 why:"The Admission Vitals tab documents that membranes ruptured spontaneously. Immediately after rupture of membranes, FHR is assessed first due to the risk of umbilical cord prolapse, which can compress the cord and cause fetal distress."},
{ ref:"stages",caseId:"rivera", stem:"CASE STUDY (2 of 6): Review the Nursing Notes tab. Compare the client's presentation at 0800 to her presentation at 1200. What does this change most likely indicate, and what should the nurse do FIRST?",
 options:["A new complication requiring an urgent epidural","Reassure her and dim the lights, since this is just anxiety","Perform a cervical exam, since this behavior suggests she may be in transition","Administer the ordered opioid analgesic immediately, without further assessment","Increase the oxytocin infusion rate"],
 answer:2,
 why:"The notes show a patient who was coping well at 0800 (3 cm) becoming withdrawn and hyperventilating by 1200 (8 cm) — the classic behavior cluster of transition. The nurse checks her cervix before medicating, since she may be too far along for medication to be appropriate or may be close to pushing."},
{ ref:"transition",caseId:"rivera", stem:"CASE STUDY (3 of 6): Using the 1-minute findings documented in the Newborn Data tab, calculate the newborn's 1-minute APGAR score.",
 options:["9","10","8","7","6"],
 answer:0,
 why:"HR >100 (2 pts), vigorous cry (2 pts), active motion (2 pts), prompt response to stimulation (2 pts), and body pink with blue extremities/acrocyanosis (1 pt) totals 9 — not a perfect 10, since acrocyanosis only scores 1 point for Appearance."},
{ ref:"mednewborn",caseId:"rivera", stem:"CASE STUDY (4 of 6): Per the Newborn Data tab, the nurse prepares to administer the ordered vitamin K. Which injection site should be used?",
 options:["Deltoid","Dorsogluteal","Vastus lateralis","Ventrogluteal","Subcutaneous tissue of the abdomen"],
 answer:2,
 why:"Vitamin K is given IM in the vastus lateralis, since a newborn's gluteal muscle is not developed enough to be a safe IM injection site."},
{ ref:"involution",caseId:"rivera", stem:"CASE STUDY (5 of 6): The 1730 entry in the Nursing Notes tab describes a change in the fundus and lochia compared to the 1530 entry. Referencing the Orders/Discharge Plan tab, what should the nurse do FIRST?",
 options:["Notify the provider immediately","Perform fundal massage","Administer oxytocin","Prepare Ms. Rivera to return to the operating room","Assist Ms. Rivera to void"],
 answer:4,
 why:"A fundus displaced off midline (1730 note) suggests a full bladder, which prevents the uterus from contracting fully. Assisting the client to void is the first, mechanical action — before massage or notifying the provider — and is consistent with the postpartum orders on file."},
{ ref:"involution",caseId:"rivera", stem:"CASE STUDY (6 of 6): Referencing the 'notify provider' criteria on the Orders/Discharge Plan tab, which statement by Ms. Rivera indicates she understood the discharge teaching about when to call her provider?",
 options:["\"A small amount of pink discharge next week is an emergency.\"","\"I will call if I soak through a pad in under an hour.\"","\"I should expect my lochia to turn red again after a week — that's normal.\"","\"Mild afterpains are a sign of infection.\"","\"I don't need to monitor my temperature.\""],
 answer:1,
 why:"The orders specifically list 'pad saturation in under 1 hour' as a reason to notify the provider — this statement matches that criterion exactly. The other statements all reflect misunderstanding: light pink discharge later on is expected lochia alba, lochia reverting to red is concerning (not normal), mild afterpains are expected cramping, and temperature is part of infection surveillance that should still be monitored."},

moddiscussion:[

 {type:"sata", stem:"In the fully worked pediatric Ceftriaxone example (37 lb, 97 cm, order of 2 mg/m², supply 1 mg/mL), which steps are part of the correct calculation sequence? Select all that apply.",

 {stem:"A Bishop score of 3 is documented for a laboring patient. What does this indicate?",

 {type:"sata", stem:"Which statements about maternal blood volume changes in pregnancy are correct? Select all that apply.",

 {type:"sata", stem:"Which statements about Rubin's postpartum psychological phases are correct? Select all that apply.",

medlabor:[
 {stem:"Which finding requires the nurse to stop an oxytocin infusion immediately?",
  options:["Contractions every 4 minutes lasting 60 seconds","Uterine tachysystole with a non-reassuring FHR pattern","Maternal request for pain medication","Cervical change from 5 cm to 6 cm"],
  answer:1,
  why:"Tachysystole with non-reassuring FHR means the uterus and fetus can't tolerate the current stimulation — the infusion must be stopped immediately."},
 {stem:"A patient received the last dose of misoprostol (Cytotec) 2 hours ago and now needs augmentation. What should the nurse do?",
  options:["Start oxytocin now per protocol","Wait until at least 4 hours have passed since the last misoprostol dose before starting oxytocin","Give another dose of misoprostol instead","Start oxytocin at half the usual rate"],
  answer:1,
  why:"Oxytocin should not be started within 4 hours of the last misoprostol dose, due to the risk of uterine rupture from stacking two potent uterine stimulants."},
 {stem:"A patient receiving magnesium sulfate for preeclampsia has a respiratory rate of 10/min and absent deep tendon reflexes. What should the nurse have readily available?",
  options:["Naloxone","Calcium gluconate","Vitamin K","RhoGam"],
  answer:1,
  why:"Calcium gluconate is the antidote for magnesium sulfate toxicity, which presents as loss of DTRs, respiratory depression, and decreased urine output."},
 {type:"sata", stem:"Which nursing actions are appropriate when administering IV oxytocin for labor induction? Select all that apply.",
  options:["Administer via a computerized infusion pump only","Monitor contractions, maternal vitals, and FHR every 15 minutes","Allow the infusion to run freely if contractions seem mild","Monitor intake and output for signs of fluid overload","Stop the infusion for uterine tachysystole"],
  answers:[0,1,3,4],
  why:"Oxytocin is a high-alert medication given only by infusion pump, with frequent monitoring of contractions/vitals/FHR and I&O (due to its antidiuretic effect). It should never be allowed to run freely, and it's stopped for tachysystole."},
 {type:"sata", stem:"Which are contraindications to starting oxytocin for induction? Select all that apply.",
  options:["Placenta previa","Active genital herpes","A Bishop score of 9","Severe fetal distress","Prior classical uterine incision"],
  answers:[0,1,3,4],
  why:"Oxytocin is contraindicated whenever vaginal delivery isn't advised: placenta previa, active genital herpes, severe fetal distress, and a prior classical uterine incision (rupture risk). A Bishop score of 9 is favorable for induction, not a contraindication."}
],
mednewborn:[
 {stem:"Why are newborns at risk for vitamin K deficiency bleeding without supplementation?",
  options:["Vitamin K is destroyed by breast milk","Vitamin K crosses the placenta poorly and the newborn gut is sterile, so stores are very low at birth","Newborns produce excess vitamin K naturally","Vitamin K is not needed until 6 months of age"],
  answer:1,
  why:"Vitamin K does not cross the placenta well, and the newborn's sterile gut hasn't yet developed the bacteria that normally help produce it — both leave the newborn with very low stores at birth."},
 {stem:"Why is erythromycin ophthalmic ointment given to every newborn regardless of documented maternal STI status?",
  options:["It is only given if the mother tests positive for an STI","It is required by law in all 50 states as universal prophylaxis against ophthalmia neonatorum","It treats existing neonatal conjunctivitis","It prevents jaundice"],

 {type:"sata", stem:"Which statements about newborn medications are correct? Select all that apply.",
  options:["Vitamin K and Hepatitis B vaccine are both given IM in the vastus lateralis","Erythromycin ointment is applied topically to the eyes","Vitamin K administration requires parental consent and is refusable","All three medications are optional and rarely given","Erythromycin ointment can cause temporary blurred vision"],

  why:"Vitamin K and Hepatitis B vaccine are IM in the vastus lateralis; erythromycin is topical to the eyes; vitamin K requires consent and is refusable; and blurred vision is a recognized temporary effect of the ointment. These three medications are standard of care, not rare or optional in practice."},
 {type:"sata", stem:"Which adverse effects/considerations are associated with newborn medications? Select all that apply.",
  options:["Vitamin K can increase bilirubin levels in neonates, requiring caution","Erythromycin ointment may cause mild chemical conjunctivitis","Hepatitis B vaccine may cause injection site soreness","All three medications are contraindicated in preterm infants","Vitamin K bruising/swelling can occur at the injection site"],

  why:"Vitamin K requires caution regarding bilirubin, erythromycin can cause mild chemical conjunctivitis, the Hep B vaccine can cause injection site soreness, and vitamin K injection sites can bruise/swell. None of the three are blanket-contraindicated in preterm infants."}

medrhogam:[
 {stem:"A couple asks why RhoGam wasn't ordered even though the mother is Rh-negative. Records confirm the father is also Rh-negative. What is the nurse's best explanation?",
  options:["Since both parents are Rh-negative, the fetus cannot be Rh-positive, so there is no risk of sensitization and RhoGam isn't needed","RhoGam is only given during a first pregnancy","RhoGam is only needed if the mother is anxious about the pregnancy","This was an error and RhoGam should be given anyway"],
  answer:0,
  why:"RhoGam is only necessary when there's a possibility the fetus is Rh-positive. If both parents are Rh-negative, the fetus cannot be Rh-positive, so there's nothing to sensitize against."},
 {stem:"What is the mechanism by which RhoGam prevents hemolytic disease of the newborn in future pregnancies?",
  options:["It directly treats fetal anemia","It suppresses the maternal immune system's ability to recognize and form antibodies against Rh-positive fetal cells","It replaces the mother's Rh-negative blood with Rh-positive blood","It cures existing Rh sensitization"],
  answer:1,
  why:"RhoGam works by neutralizing Rh-positive fetal cells in the maternal circulation before the mother's immune system can recognize them and mount an antibody response — it prevents sensitization from occurring at all."},
 {stem:"An Rh-negative patient had a car accident with abdominal trauma at 32 weeks. What should the nurse anticipate?",
  options:["No action needed until 36 weeks","RhoGam administration, since trauma is a potential sensitizing event","Immediate delivery","Withholding RhoGam until after delivery only"],
  answer:1,
  why:"RhoGam is given after any potential fetal-maternal blood mixing event, including trauma, not just at the standard 28-week and postpartum time points."},
 {type:"sata", stem:"Which situations warrant RhoGam administration in an Rh-negative patient? Select all that apply.",
  options:["Routine administration at approximately 28 weeks gestation","Within 72 hours of delivery if the newborn is Rh-positive","After a miscarriage","After an amniocentesis","When the newborn is confirmed Rh-negative"],
  answers:[0,1,2,3],
  why:"RhoGam is given at 28 weeks, within 72 hours postpartum if the infant is Rh-positive, and after any sensitizing event like miscarriage or amniocentesis. It is NOT needed if the newborn is Rh-negative, since there's no Rh-positive exposure to prevent sensitization against."},
 {type:"sata", stem:"Which are true statements about RhoGam? Select all that apply.",
  options:["It is contraindicated in Rh-positive patients","It is a blood product and can cause local injection site redness/soreness","It should not be given with live-virus vaccines","It treats existing hemolytic disease in the current fetus","Patients should be monitored for hypersensitivity for about 20 minutes after administration"],
  answers:[0,1,2,4],
  why:"RhoGam is contraindicated in Rh-positive patients (nothing to prevent), is a blood product with expected injection site soreness, shouldn't be combined with live vaccines, and requires a short monitoring period for hypersensitivity. It is prophylaxis for future pregnancies — it does not treat hemolytic disease already present in a current fetus."}
],
medanalgesia:[
 {stem:"A patient receiving IV nalbuphine for labor pain also receives ondansetron. What is the primary purpose of the ondansetron?",
  options:["To prevent or treat nausea/vomiting, a common opioid side effect, by blocking the vomiting reflex centrally","To reverse respiratory depression caused by the opioid","To potentiate the analgesic effect of the opioid","To treat maternal hypotension caused by the opioid"],
  answer:0,
  why:"Ondansetron is a serotonin antagonist that blocks the vomiting reflex centrally, rather than treating the stomach directly — it's frequently paired with opioids since nausea is one of their most common side effects."},
 {stem:"Why is nalbuphine used cautiously in a patient with a known opioid dependency?",
  options:["It has no analgesic effect in opioid-dependent patients","As an opioid agonist-antagonist, it can precipitate acute withdrawal symptoms","It is more sedating in opioid-dependent patients","It requires a higher dose in this population, raising toxicity risk"],
  answer:1,
  why:"Nalbuphine and butorphanol are opioid agonist-antagonists, which can precipitate acute withdrawal in a patient who is dependent on full opioid agonists."},
 {stem:"Fifteen minutes after epidural placement, a patient's blood pressure drops significantly and the FHR strip shows late decelerations. What is the nurse's priority intervention?",
  options:["Increase the epidural dose","Position the patient on her left side, increase IV fluids, and administer oxygen","Discontinue all IV fluids","Prepare for immediate cesarean birth"],
  answer:1,
  why:"Epidural-associated hypotension reduces placental perfusion, producing late decelerations. The priority interventions are left-side positioning, IV fluid bolus, and oxygen — all aimed at restoring placental blood flow."},
 {type:"sata", stem:"Which nursing actions are appropriate when a patient receives an opioid analgesic during labor? Select all that apply.",
  options:["Time doses with expected delivery in mind","Have naloxone available","Monitor maternal sedation level and respiratory rate","Assume no effect on the newborn regardless of timing","Notify the newborn care team if a dose was given close to delivery"],
  answers:[0,1,2,4],
  why:"Timing doses relative to delivery, having naloxone available, monitoring maternal sedation/RR, and alerting the newborn team about doses given close to delivery are all appropriate. Opioids can affect the newborn regardless of dose size if timing is close to birth."},
 {type:"sata", stem:"Which are true statements about spinal anesthesia for a planned cesarean birth? Select all that apply.",
  options:["It is a single injection with no catheter left in place","The anesthesia level is generally higher than an epidural","Respiratory effort is a priority assessment due to the risk of a high block","It has a slower onset than an epidural","A post-dural puncture headache is a recognized complication"],
  answers:[0,1,2,4],
  why:"Spinal anesthesia is a single, no-catheter injection with a higher, faster-onset block than an epidural — the opposite of 'slower onset.' Respiratory effort is prioritized due to high-block risk, and post-dural headache is a known complication."}
],

medsti:[
 {stem:"A patient is diagnosed with late latent syphilis (infection duration unknown, more than 1 year). How does treatment differ from primary syphilis?",
  options:["Three weekly IM doses of penicillin G benzathine are required instead of a single dose","A completely different antibiotic class must be used","Treatment is given orally instead of IM","No treatment is needed once the disease reaches the latent stage"],
  answer:0,
  why:"A single dose of penicillin G benzathine treats primary, secondary, and early latent syphilis (under 1 year); late latent or late-stage syphilis requires three weekly doses instead."},
 {stem:"A patient develops fever, hypotension, and tachycardia a few hours after her first penicillin injection for syphilis. What should the nurse recognize?",
  options:["A severe penicillin allergy requiring immediate discontinuation","The Jarisch-Herxheimer reaction, a self-limited response to dying spirochetes","Anaphylaxis requiring epinephrine","A sign the antibiotic is not working"],
  answer:1,
  why:"The Jarisch-Herxheimer reaction is a systemic response to spirochetes being killed off rapidly, typically resolving within 24 hours. It is not a penicillin allergy, and future doses should not be withheld because of it."},
 {stem:"Which antibiotic is first-line for chlamydia in a nonpregnant patient, but avoided during pregnancy?",
  options:["Azithromycin","Doxycycline","Amoxicillin","Ceftriaxone"],
  answer:1,
  why:"Doxycycline is first-line for chlamydia in nonpregnant patients but is avoided in pregnancy due to effects on fetal bone/teeth development; azithromycin is used instead, with amoxicillin as a backup."},
 {type:"sata", stem:"Which STI medications are administered as antibiotics against a bacterial infection? Select all that apply.",
  options:["Ceftriaxone (gonorrhea)","Doxycycline (chlamydia)","Penicillin G (syphilis)","Acyclovir (HSV)","Metronidazole (trichomoniasis/BV)"],
  answers:[0,1,2,4],
  why:"Ceftriaxone, doxycycline, penicillin G, and metronidazole all treat infections caused by bacteria or bacteria-like/protozoal organisms. Acyclovir treats a viral infection (HSV) and is not an antibiotic."},
 {type:"sata", stem:"Which teaching points are appropriate for a patient prescribed metronidazole? Select all that apply.",
  options:["Avoid all alcohol during treatment and for a period afterward","A disulfiram-like reaction can occur within 10–30 minutes of drinking alcohol","This medication is safe to combine with any amount of alcohol","Symptoms of the alcohol interaction include flushing, vomiting, and tachycardia","This medication treats trichomoniasis and bacterial vaginosis"],
  answers:[0,1,3,4],
  why:"Metronidazole requires strict alcohol avoidance due to a disulfiram-like reaction (flushing, vomiting, tachycardia, hypotension) that can occur within 10–30 minutes of drinking, and it is used for both trichomoniasis and bacterial vaginosis. It is never safe to combine with alcohol."}
