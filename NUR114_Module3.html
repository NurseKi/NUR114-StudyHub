<style>

.hublink{display:inline-block;color:#bcd6d3;font-size:12.5px;font-weight:700;text-decoration:none;margin-bottom:6px}

.unit-chip{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.unit-banner{color:#fff;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.3px;

.lede{margin:22px 0 24px;color:#3a4d4f;max-width:56ch;font-size:14.5px;background:#fff;border:1px solid var(--line);

.row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 0;
  border-bottom:1px solid var(--line);text-align:left}
.row .t{flex:1;font-weight:600;font-size:15px}
.row .qz{font-size:13.5px;color:var(--ink);font-weight:700;white-space:nowrap}

h3.title{font-size:25px;font-weight:600;letter-spacing:-.01em;margin:14px 0 4px}
.kick{color:var(--dim);margin:0 0 24px;font-size:14.5px;font-style:italic}

p,li{max-width:64ch}
p{margin:0 0 12px}
ul{margin:0 0 14px;padding-left:20px}

.opt:hover:not(:disabled){border-color:var(--ink)}

.cloze-text{font-size:15.5px;line-height:2.4;margin:10px 0}
.blank-select{font-size:14px;font-weight:600;padding:5px 8px;border:1px solid var(--ink);border-radius:6px;background:var(--okbg);color:var(--ink);margin:0 3px}

.hotspot-wrap{position:relative;display:inline-block;max-width:100%;cursor:crosshair;margin:10px 0;line-height:0}

.hotspot-marker{position:absolute;width:18px;height:18px;background:rgba(200,60,50,.85);border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.4)}

.dd-pool{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.dd-chip{padding:8px 12px;border:1px solid var(--line);border-radius:20px;font-size:13.5px;background:#fff}

.dd-bins{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap}

.order-list{list-style:none;margin:10px 0;padding:0}
.order-item{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:6px;font-size:14px;background:#fff}

.order-item .txt{flex:1}
.order-btns button{padding:4px 9px;margin-left:4px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13px}

.matrix-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
.matrix-table th,.matrix-table td{border:1px solid var(--line);padding:8px;text-align:center}
.matrix-table td:first-child{text-align:left}
.matrix-table input[type=radio]{width:16px;height:16px}

.bowtie-wrap{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.bowtie-col{flex:1;min-width:150px}
.bowtie-col-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--dim);margin-bottom:8px;text-align:center}
.bowtie-opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px;background:#fff}
.bowtie-opt.sel{border-color:var(--ink);background:#EEF6F4}
.bowtie-opt.right{border-color:var(--ok);background:var(--okbg)}

.verdict.y{color:var(--ok)} .verdict.n{color:var(--no)}
.acts{display:flex;gap:16px;flex-wrap:wrap;margin-top:22px}
.acts button{color:var(--ink);font-weight:700;font-size:14.5px}
.count{font-size:13.5px;color:var(--dim);margin:24px 0 4px;font-weight:600}
.big{font-size:42px;font-weight:700;letter-spacing:-.02em;margin:26px 0 0;font-family:Georgia,serif}
.rev{margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.rev h5{margin:18px 0 6px;font-size:15px;font-weight:700}
.topic-group{margin:0 0 16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.topic-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 18px;text-align:left;background:#F1F0E9}
.topic-group.open .topic-toggle{background:#FDFCF9;border-bottom:1px solid var(--line)}
.topic-toggle-label{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.topic-toggle-icon{flex:none;font-size:18px;font-weight:700;color:var(--ink);width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;line-height:1;margin-left:14px}

<header><div class="bannerwrap"><div class="toprow"><div><a class="hublink" href="index.html">&larr; Study Hub</a><h1>NUR 114 · Module 3</h1><div class="sub">Functional Ability &middot; Elimination &amp; Sensory Perception</div></div><button id="back" hidden>Back</button></div></div></header>
<main class="wrap" id="app"></main>
<script>
const M3_OVERVIEW = { title:"Module Overview", noChip:true, sub:"Course objectives and the exemplar/medication blueprint for Functional Ability — read these first.", lessons:[
{ id:"m3-modobjectives", title:"Learning Objectives", kicker:"What this module is building toward",
  blocks:[
   {p:"After completing this module, you will be able to:"},
   {list:[
    "Utilize elements of clinical decision making for patients with selected concepts and alterations.",
    "Integrate health promotion, specialized modalities and pharmacological agents for patients with selected health concepts and alterations.",
    "Distinguish clinical manifestations and diagnostic findings for patients with selected health concepts and alterations.",
    "Prioritize nursing interventions for selected health concepts and alterations, while recognizing scope of practice for the practical and registered nurse.",
    "Analyze foundational concepts and emergent care.",
    "Apply relevant informatics related to selected health concepts/alterations."]}
  ]
},
{ id:"m3-modblueprint", title:"Exemplars & Medications Blueprint", kicker:"The course blueprint for Functional Ability",
  blocks:[
   {h:"Exemplars — Elimination"},
   {list:[
    "<strong>Renal failure</strong> (acute &amp; chronic) — including fluid &amp; electrolyte concepts, ABG compensation, and dialysis types",
    "<strong>Nephritis</strong> — pyelonephritis and glomerulonephritis",
    "<strong>Nephrotic syndrome</strong>",
    "<strong>Nephrosclerosis</strong>"]},
   {h:"Exemplars — Sensory Perception"},
   {list:[
    "Hearing",
    "Verbal",
    "Impaired vision",
    "Cataract",
    "Glaucoma",
    "Macular degeneration",
    "Detached retina",
    "Eye injuries"]},
   {h:"Medication classes to know"},
   {list:[
    "<strong>Diuretics</strong> — loop, potassium-sparing, osmotic",
    "<strong>Electrolyte replacements and/or treatments</strong> (examples, not all-inclusive) — phosphorus binders, calcium gluconate, vitamin D medications, polystyrene with sorbitol, patiromer, sodium zirconium cyclosilicate (Lokelma)",
    "<strong>Epoetin alfa</strong>",
    "<strong>Corticosteroids</strong>",
    "<strong>Acetylcysteine</strong>",
    "<strong>Bicarbonate</strong>",
    "<strong>Eye drops</strong> — beta blockers, prostaglandin analogs"]}
  ]
}
]};

// ===================== ELIMINATION: RENAL FOUNDATIONS & ACID–BASE =====================

const ELIM_FOUND = { title:"Renal Foundations & Acid–Base Balance", group:"elim", sub:"Key renal terms, age-related changes, and ABG interpretation with compensation — the vocabulary and lab logic every renal lesson builds on.", lessons:[
{ id:"elim-keyterms", title:"Key Renal Terms & Gerontologic Considerations", kicker:"GFR, oliguria, anuria, azotemia, uremia — and what aging does to the kidney",
  blocks:[
   {p:"The kidneys' elimination job is to filter the blood, pull out metabolic wastes and excess water and electrolytes, and hold on to what the body needs. Almost every renal disorder in this module is ultimately a story about that filter failing — too little blood reaching it, the filter itself being damaged, or the outflow being blocked — so the vocabulary for measuring how well it's working comes first."},
   {h:"Key terms"},
   {table:{head:["Term","Definition","What it tells the nurse"],rows:[
    ["<strong>Glomerular filtration rate (GFR)</strong>","The volume of water filtered out of the plasma per unit of time — normal is <strong>100–120 mL/min</strong>","The single best overall measure of kidney function; it falls as kidney disease progresses and is used to stage chronic kidney disease"],
    ["<strong>Oliguria</strong>","Less than <strong>500 mL</strong> of urine in 24 hours","The kidneys are not producing enough urine to clear the day's wastes — fluid, potassium, and nitrogenous wastes start to accumulate"],
    ["<strong>Anuria</strong>","Less than <strong>50 mL</strong> of urine in 24 hours","Essentially no urine output — a severe finding that needs immediate provider notification"],
    ["<strong>Azotemia</strong>","A rise in BUN, creatinine, uric acid, and other nitrogenous wastes in the blood","A <em>lab</em> finding — wastes are building up, whether or not the patient has symptoms yet"],
    ["<strong>Hematuria</strong>","Blood in the urine","Glomerular damage (glomerulonephritis), stones, infection, trauma, cyst rupture, or bleeding after a biopsy"],
    ["<strong>Proteinuria</strong>","Protein in the urine","The glomeruli are leaking — a hallmark of kidney damage and of nephrotic syndrome"],
    ["<strong>Hyperproteinemia</strong>","An excess of protein in the <em>blood</em>","Not the same as proteinuria — don't mix up blood vs. urine"],
    ["<strong>Bacteremia</strong>","Bacteria in the blood","An infection (e.g., pyelonephritis) has spread beyond the urinary tract — watch for urosepsis"],
    ["<strong>Uremia</strong>","Azotemia <em>with symptoms</em> — hyperkalemia, edema, anemia, and other systemic effects","A <em>clinical</em> syndrome — the waste buildup is now affecting other body systems"]
   ]}},
   {hook:"<b>Uremia</b> = an excess of urea and other nitrogenous wastes in the blood (with symptoms). <b>Azotemia</b> = the concentration of nitrogenous wastes in the blood. The <b>-uria</b> terms are in the urine (hematuria, proteinuria); the <b>-emia</b> terms are in the blood (hyperproteinemia, bacteremia)."},
   {hook:"Azotemia vs. uremia is a lab-vs-symptoms distinction: azotemia is the numbers going up; uremia is the patient showing the effects. A patient can be azotemic without being uremic, but not uremic without being azotemic."},
   {h:"Labs used alongside these terms"},
   {list:[
    "<strong>BUN (blood urea nitrogen)</strong> — typical adult range about 10–20 mg/dL; rises with kidney failure but is also raised by dehydration, GI bleeding, high protein intake, and catabolism, so it's less specific than creatinine",
    "<strong>Serum creatinine</strong> — typical adult range about 0.6–1.2 mg/dL; a byproduct of muscle metabolism that is cleared almost entirely by the kidneys, making it the more specific marker of kidney function. It rises only after roughly <strong>half of kidney function is lost</strong>, so a \"slightly high\" creatinine is significant",
    "<strong>BUN-to-creatinine ratio</strong> — normally about 10:1 to 20:1; a ratio <strong>above 20:1</strong> points toward a <em>prerenal</em> cause such as dehydration, because BUN rises out of proportion to creatinine when perfusion is low",
    "<strong>Urine output</strong> — the minimum acceptable adult output is about <strong>0.5 mL/kg/hr</strong> (roughly 30 mL/hr); falling below this for several hours is an early cue of kidney injury",
    "<strong>Urine specific gravity</strong> — normal about 1.005–1.030; concentrated (high) urine suggests the kidney is trying to conserve water, as in dehydration; a urine fixed near 1.010 suggests the tubules have lost their ability to concentrate or dilute"]},
   {h:"Collecting urine specimens"},
   {list:[
    "<strong>Urinalysis:</strong> first morning voiding if possible, clean container; note menstruation on the requisition",
    "<strong>Culture and sensitivity:</strong> clean-catch midstream specimen in a sterile container (or straight catheter if the client can't); collect <strong>before antibiotics</strong>; send to the lab immediately",
    "<strong>24-hour urine / creatinine clearance:</strong> at the start time, have the client void and <strong>discard</strong> that urine; collect all urine for 24 hours, keep it on ice or refrigerated; at the end, have the client void and <strong>add</strong> that final urine. If a void is missed, the test usually must restart",
    "<strong>Contrast studies:</strong> check allergies and kidney function (BUN, creatinine) beforehand; afterward encourage fluids (unless restricted) and monitor urine output — contrast is nephrotoxic, especially in older or dehydrated clients"]},
   {h:"Gerontologic considerations"},
   {p:"Aging changes the kidney and bladder in predictable ways, and each one shifts how the nurse interprets findings in an older adult:"},
   {list:[
    "<strong>GFR decreases</strong> with age — medications cleared by the kidneys (many antibiotics, digoxin, metformin, low-molecular-weight heparins) accumulate more easily and often need dose adjustment",
    "<strong>Structural and functional changes</strong> — the kidney loses mass and nephrons, and the ability to concentrate urine declines, so older adults dehydrate more easily and more quickly",
    "<strong>Sclerosis of the glomerulus and renal vessels</strong> — the same hardening process that underlies nephrosclerosis, accelerated by long-standing hypertension and atherosclerosis",
    "<strong>Bladder constriction</strong> — decreased bladder capacity and tone lead to frequency, urgency, nocturia, and incomplete emptying",
    "<strong>BPH (benign prostatic hyperplasia)</strong> — in older men, prostate enlargement can obstruct urine outflow and cause <em>postrenal</em> kidney injury",
    "<strong>Urinary incontinence</strong> — common with aging, but never assumed to be \"normal\"; it raises the risk of skin breakdown, falls (rushing to the bathroom), and social isolation"]},
   {hook:"Serum creatinine can look deceptively \"normal\" in a frail older adult. Creatinine comes from muscle, so someone with low muscle mass produces less of it — a creatinine of 1.1 in a frail 89-year-old may actually reflect a markedly reduced GFR."}
  ],
  check:{stem:"A client's 24-hour urine output is 40 mL. Which term correctly describes this finding?",
   options:["Oliguria","Anuria","Azotemia","Uremia"],
   answer:1,
   why:"Anuria is less than 50 mL of urine in 24 hours. Oliguria is less than 500 mL in 24 hours. Azotemia and uremia describe waste buildup in the blood, not urine volume."}
},
{ id:"elim-procedures", title:"Renal Biopsy & Kidney Stone Prevention", kicker:"Post-biopsy bleeding watch, and the dietary side of stone prevention",
  blocks:[
   {h:"Renal biopsy — before the procedure"},
   {list:["Verify informed consent","Baseline vital signs and <strong>coagulation studies</strong> — report abnormal results before the biopsy","NPO as prescribed","During the procedure the client lies <strong>prone</strong> with a pillow under the abdomen"]},
   {h:"Renal biopsy — post-procedure care"},
   {p:"The kidneys are highly vascular, so the primary red flag after a renal biopsy is <strong>hemorrhage</strong>. Apply pressure to the site (about 30 minutes or as prescribed), then keep the client on <strong>strict bed rest, supine (often with a back roll for pressure), for 2 to 6 hours</strong>. Encourage fluids (about 1,500–2,000 mL as prescribed), check under the client for bleeding, and teach the client to avoid heavy lifting and strenuous activity for 1–2 weeks and to report fever or hematuria after the first 24 hours."},
   {table:{head:["Watch for","Red flags"],rows:[
    ["<strong>Vital signs</strong>","<strong>Hypotension and tachycardia</strong>"],
    ["<strong>Pain</strong>","Intense, aching pain in the <strong>flank</strong> or back"],
    ["<strong>Urine</strong>","Gross or microscopic hematuria — pink-tinged urine is common at first, but <strong>bright red blood or clots</strong> are emergency signals"],
    ["<strong>Biopsy site</strong>","Visible bleeding, or blood soaking through to the skin under the client's back"],
    ["<strong>Labs</strong>","Decreasing hemoglobin and hematocrit"],
    ["<strong>Infection</strong>","Temperature above 100°F (37.8°C)"]
   ]}},
   {hook:"<b>After a nephrectomy,</b> the flank incision sits just under the diaphragm, so <b>altered breathing pattern</b> and <b>risk for ineffective airway clearance</b> are common problems. Aim to keep SpO₂ at <b>90% or higher</b> and the lungs clear of adventitious sounds; monitor I&amp;O for a urine output <b>above 30 mL/hour</b>; control pain well enough to allow movement, deep breathing, and rest. <b>Blood-tinged drainage</b> from the JP drain is expected in the early postoperative period."},
   {h:"Kidney stones (urolithiasis) — dietary prevention"},
   {list:[
    "Depending on the stone type, avoid <strong>high-oxalate foods</strong> — spinach, rhubarb, chocolate",
    "…and <strong>high-purine foods</strong> — sardines, organ meats",
    "Stones are also a <strong>postrenal</strong> cause of AKI when they obstruct urine flow — relieved by lithotripsy, surgery, or a urinary catheter"]}
  ],
  check:{stem:"Two hours after a renal biopsy, a client's HR has risen from 82 to 118, BP has dropped to 94/58, and the client reports aching flank pain. What should the nurse suspect?",
   options:["Expected post-procedure discomfort","Hemorrhage","Urinary tract infection","Kidney stone"],
   answer:1,
   why:"The kidneys are highly vascular. Tachycardia, hypotension, and flank pain after a biopsy are signs of internal bleeding, the primary post-biopsy red flag."}
},
{ id:"elim-abg", title:"ABG Review & Compensation", kicker:"Normal values, who compensates for whom, and acute (uncompensated) vs. chronic (compensated)",
  blocks:[
   {p:"Arterial blood gas (ABG) interpretation belongs in the Elimination module because the kidneys are one of the body's two acid–base regulators. When the kidneys fail, they can no longer excrete acid or make bicarbonate, so metabolic acidosis is an expected finding in renal failure — and the lungs will try to make up for it."},
   {h:"Normal values"},
   {table:{head:["Value","Normal range","What it represents"],rows:[
    ["<strong>pH</strong>","<strong>7.35–7.45</strong> (absolute normal is <strong>7.40</strong>)","Below 7.35 = acidosis; above 7.45 = alkalosis"],
    ["<strong>PaCO<sub>2</sub></strong>","35–45 mmHg","The <strong>acid</strong> — controlled by the lungs (respiratory). Because CO<sub>2</sub> is an acid, the ends of its range are reversed: <strong>above 45 = acidotic</strong>, <strong>below 35 = alkalotic</strong>"],
    ["<strong>HCO<sub>3</sub></strong>","22–26 mEq/L","The <strong>base</strong> — controlled by the kidneys (metabolic). <strong>Below 22 = acidotic</strong>, <strong>above 26 = alkalotic</strong>"],
    ["<strong>PaO<sub>2</sub></strong>","80–100 mmHg","Oxygenation. Low = <strong>hypoxemia</strong>; high = usually oxygen therapy"],
    ["<strong>SaO<sub>2</sub></strong>","95–100%","Oxygen saturation. Low = hypoxemia"]
   ]}},
   {p:"The body always tries to compensate to get back to <strong>7.40</strong>. Carbon dioxide and bicarbonate will fluctuate to make this happen."},
   {h:"Who compensates, and how fast"},
   {table:{head:["System","Controls","Speed","How it compensates"],rows:[
    ["<strong>Lungs (respiratory)</strong>","CO<sub>2</sub> (acid)","<strong>Fast</strong> — within minutes to hours","Breathe <strong>fast</strong> to blow off CO<sub>2</sub> (raises pH); breathe <strong>slow</strong> to retain CO<sub>2</sub> (lowers pH)"],
    ["<strong>Kidneys (metabolic)</strong>","HCO<sub>3</sub> (base)","<strong>Slow</strong> — may take days","Make <strong>more</strong> HCO<sub>3</sub> (raises pH); make <strong>less</strong> HCO<sub>3</sub> (lowers pH)"]
   ]}},
   {hook:"Kussmaul respirations — deep, rapid breathing — in a patient with renal failure or DKA are the lungs compensating for metabolic acidosis by blowing off CO<sub>2</sub>. In a renal patient, expect the pH to be low (below 7.35). That breathing pattern is a cue, not the primary problem."},
   {h:"Uncompensated, partially compensated, fully compensated"},
   {table:{head:["","Uncompensated (acute)","Partially compensated","Fully compensated (chronic)"],rows:[
    ["<strong>pH</strong>","<strong>Abnormal</strong>","<strong>Still abnormal</strong>","<strong>Normal</strong> (7.35–7.45)"],
    ["<strong>CO<sub>2</sub> and HCO<sub>3</sub></strong>","Only <strong>one</strong> is abnormal; the other is normal (or close to it)","<strong>All three values</strong> are abnormal","<strong>Both</strong> are abnormal"],
    ["<strong>Why</strong>","One system is causing the problem, and the other hasn't started fixing it yet","The opposing system has started to help, but hasn't finished","The opposing system has pushed the pH back into range, but is working hard to hold it there"]
   ]}},
   {h:"Pattern tables"},
   {table:{head:["Uncompensated","pH","PaCO<sub>2</sub>","HCO<sub>3</sub>"],rows:[
    ["Respiratory acidosis","↓ Low (acid)","<strong>↑ High (acid)</strong>","Normal"],
    ["Respiratory alkalosis","↑ High (alk)","<strong>↓ Low (alk)</strong>","Normal"],
    ["Metabolic acidosis","↓ Low (acid)","Normal","<strong>↓ Low (acid)</strong>"],
    ["Metabolic alkalosis","↑ High (alk)","Normal","<strong>↑ High (alk)</strong>"]
   ]}},
   {table:{head:["Partially compensated","pH","PaCO<sub>2</sub>","HCO<sub>3</sub>"],rows:[
    ["Respiratory acidosis","↓ Low","<strong>↑ High (cause)</strong>","↑ High (fixing)"],
    ["Respiratory alkalosis","↑ High","<strong>↓ Low (cause)</strong>","↓ Low (fixing)"],
    ["Metabolic acidosis","↓ Low","↓ Low (fixing)","<strong>↓ Low (cause)</strong>"],
    ["Metabolic alkalosis","↑ High","↑ High (fixing)","<strong>↑ High (cause)</strong>"]
   ]}},
   {table:{head:["Fully compensated","pH","PaCO<sub>2</sub>","HCO<sub>3</sub>"],rows:[
    ["Respiratory acidosis","Normal (low side, 7.35–7.39)","<strong>↑ High</strong>","↑ High"],
    ["Respiratory alkalosis","Normal (high side, 7.41–7.45)","<strong>↓ Low</strong>","↓ Low"],
    ["Metabolic acidosis","Normal (low side, 7.35–7.39)","↓ Low","<strong>↓ Low</strong>"],
    ["Metabolic alkalosis","Normal (high side, 7.41–7.45)","↑ High","<strong>↑ High</strong>"]
   ]}},
   {hook:"Worked example of partial compensation: pH 7.31 (acid), CO<sub>2</sub> 50 (acid), HCO<sub>3</sub> 28 (base). The pH is still abnormal, and all three values are abnormal. High CO<sub>2</sub> matches the acidosis, so this is respiratory acidosis — and the kidneys are partially compensating by raising HCO<sub>3</sub>."},
   {h:"Reading a compensated gas — finding the \"problem child\""},
   {list:[
    "Look at which end of the scale the pH is closer to. Below 7.40 = the underlying problem is <strong>acidosis</strong>; above 7.40 = the underlying problem is <strong>alkalosis</strong>",
    "You will <strong>never</strong> have a compensated problem with a pH right smack in the middle — it will always lean toward one end or the other",
    "In a compensation situation, HCO<sub>3</sub> and CO<sub>2</sub> will <strong>both</strong> be high or <strong>both</strong> be low together",
    "Too much base (high HCO<sub>3</sub>) or too little acid (low CO<sub>2</sub>) = <strong>alkalosis</strong>",
    "Too much acid (high CO<sub>2</sub>) or too little base (low HCO<sub>3</sub>) = <strong>acidosis</strong>",
    "Whichever value <em>matches</em> the direction of the pH is the problem child (the cause); the other value is the compensation"]},
   {h:"Step-by-step method"},
   {list:[
    "<strong>Step 1 — pH:</strong> acidosis (&lt;7.35), alkalosis (&gt;7.45), or normal? If normal, note whether it leans below or above 7.40",
    "<strong>Step 2 — CO<sub>2</sub>:</strong> is it high (acid excess), low (acid deficit), or normal?",
    "<strong>Step 3 — HCO<sub>3</sub>:</strong> is it high (base excess), low (base deficit), or normal?",
    "<strong>Step 4 — match:</strong> which value explains the pH direction? That names the disorder — respiratory if CO<sub>2</sub>, metabolic if HCO<sub>3</sub>",
    "<strong>Step 5 — compensation:</strong> if the other value is normal = uncompensated; if all three are abnormal = partially compensated; if both are abnormal and pH is normal = fully compensated"]},
   {hook:"ROME: <strong>R</strong>espiratory <strong>O</strong>pposite (pH and CO<sub>2</sub> move in opposite directions — pH down, CO<sub>2</sub> up in respiratory acidosis), <strong>M</strong>etabolic <strong>E</strong>qual (pH and HCO<sub>3</sub> move in the same direction — pH down, HCO<sub>3</sub> down in metabolic acidosis)."},
   {h:"Causes and priority treatment for each imbalance"},
   {table:{head:["Imbalance","The problem","Common causes","Priority treatment"],rows:[
    ["<strong>Respiratory acidosis</strong> (CO<sub>2</sub> ↑)","Lungs are retaining CO<sub>2</sub> (hypoventilation)","COPD, asthma, <strong>opioid overdose</strong>, pneumonia, oversedation","<strong>Improve ventilation</strong> — oxygen, incentive spirometry, naloxone (Narcan) if opioid-induced, BiPAP or intubation"],
    ["<strong>Respiratory alkalosis</strong> (CO<sub>2</sub> ↓)","Lungs are blowing off CO<sub>2</sub> (hyperventilation)","Anxiety/panic attack, pain, fever, high altitude","<strong>Slow the breathing</strong> — paper bag breathing, treat pain and anxiety"],
    ["<strong>Metabolic acidosis</strong> (HCO<sub>3</sub> ↓)","Kidneys losing bicarbonate or retaining acid","<strong>Renal failure (AKI/CKD)</strong>, severe diarrhea, DKA (ketones)","<strong>Fix the cause</strong> — dialysis (renal), insulin (DKA), antidiarrheals"],
    ["<strong>Metabolic alkalosis</strong> (HCO<sub>3</sub> ↑)","Stomach losing acid","Vomiting, NG suctioning, antacid overuse","<strong>Stop the loss</strong> — antiemetics, stop suctioning, replace electrolytes (K⁺)"]
   ]}},
   {hook:"Acidosis and potassium travel together. In acidosis, hydrogen ions move into cells and potassium moves out into the blood — so a patient in renal failure with metabolic acidosis is doubly at risk for hyperkalemia. Correcting the acidosis (for example, with sodium bicarbonate) pushes potassium back into cells."}
  ],
  check:{stem:"An ABG shows pH 7.37, PaCO₂ 72, HCO₃ 36. How should the nurse interpret this result?",
   options:["Uncompensated respiratory acidosis","Compensated respiratory acidosis","Compensated metabolic alkalosis","Uncompensated metabolic alkalosis"],
   answer:1,
   why:"The pH is normal, so the gas is compensated. It leans toward the acid side (below 7.40), so the underlying problem is acidosis. A high CO₂ explains acidosis, so the lungs are the problem child; the high HCO₃ is the kidneys compensating."}
},
{ id:"elim-abg-practice", title:"ABG Practice Set — Worked Answers", kicker:"The eight practice gases from the ABG review, worked step by step",
  blocks:[
   {p:"Each gas below is worked using the same five steps: pH direction → CO<sub>2</sub> → HCO<sub>3</sub> → which value matches → is the other value normal or abnormal. Normal ranges: pH 7.35–7.45, CO<sub>2</sub> 35–45, HCO<sub>3</sub> 22–26."},
   {h:"Set 1 — compensated or uncompensated?"},
   {table:{head:["#","pH","CO<sub>2</sub>","HCO<sub>3</sub>","Interpretation","Why"],rows:[
    ["1","7.22","72","23","<strong>Uncompensated respiratory acidosis</strong>","pH is acidotic; CO<sub>2</sub> is high (acid excess) and matches; HCO<sub>3</sub> is normal, so the kidneys haven't compensated yet"],
    ["2","7.30","42","6","<strong>Uncompensated metabolic acidosis</strong>","pH is acidotic; HCO<sub>3</sub> is very low (base deficit) and matches; CO<sub>2</sub> is normal, so the lungs haven't compensated yet"],
    ["3","7.50","25","23","<strong>Uncompensated respiratory alkalosis</strong>","pH is alkalotic; CO<sub>2</sub> is low (acid deficit) and matches; HCO<sub>3</sub> is normal"],
    ["4","7.48","41","35","<strong>Uncompensated metabolic alkalosis</strong>","pH is alkalotic; HCO<sub>3</sub> is high (base excess) and matches; CO<sub>2</sub> is normal"]
   ]}},
   {h:"Set 2 — compensated or uncompensated, and who is causing the problem?"},
   {table:{head:["#","pH","CO<sub>2</sub>","HCO<sub>3</sub>","Interpretation","Why"],rows:[
    ["5","7.37","72","36","<strong>Compensated respiratory acidosis</strong>","pH is normal but leans acid (below 7.40); both values abnormal = compensated. High CO<sub>2</sub> causes acidosis → the <strong>lungs</strong> are the problem child; the kidneys raised HCO<sub>3</sub> to compensate"],
    ["6","7.38","15","6","<strong>Compensated metabolic acidosis</strong>","pH is normal but leans acid; both values low together = compensated. Low HCO<sub>3</sub> causes acidosis → the <strong>kidneys</strong> are the problem child; the lungs blew off CO<sub>2</sub> to compensate (the pattern expected in renal failure)"],
    ["7","7.42","25","18","<strong>Compensated respiratory alkalosis</strong>","pH is normal but leans alkaline (above 7.40); both values low. Low CO<sub>2</sub> causes alkalosis → the <strong>lungs</strong> are the problem child; the kidneys dropped HCO<sub>3</sub> to compensate"],
    ["8","7.43","50","35","<strong>Compensated metabolic alkalosis</strong>","pH is normal but leans alkaline; both values high. High HCO<sub>3</sub> causes alkalosis → the <strong>kidneys</strong> are the problem child; the lungs retained CO<sub>2</sub> to compensate"]
   ]}},
   {hook:"In a compensated gas, the two abnormal values always point in the same direction (both high or both low), so they can't tell you the diagnosis by themselves. The pH's lean — even a tiny one like 7.38 vs. 7.42 — is what breaks the tie."},
   {h:"Connecting the practice gases to patients"},
   {list:[
    "Gas 1 (7.22 / 72 / 23) fits a patient who was suddenly oversedated with opioids — acute hypoventilation, no time for the kidneys to respond",
    "Gas 5 (7.37 / 72 / 36) fits a patient with long-standing COPD — the CO<sub>2</sub> has been high for so long that the kidneys have fully compensated",
    "Gas 2 (7.30 / 42 / 6) and Gas 6 (7.38 / 15 / 6) both show the severe bicarbonate loss of kidney failure — Gas 6 is what it looks like once the lungs have caught up with Kussmaul breathing",
    "Gas 4 (7.48 / 41 / 35) fits a patient with prolonged vomiting or NG suction — acid lost from the stomach"]}
  ],
  check:{stem:"An ABG shows pH 7.38, PaCO₂ 15, HCO₃ 6. Which system is causing the problem?",

   answer:1,

}

const ELIM_RF = { title:"Renal Failure: Acute & Chronic", group:"elim", sub:"Acute kidney injury, chronic kidney disease, fluid and electrolyte concepts, dialysis types, and the renal diet.", lessons:[
{ id:"elim-aki", title:"Acute Kidney Injury (AKI)", kicker:"Prerenal, intrarenal, postrenal — and the oliguric and diuretic phases",
  blocks:[
   {p:"Acute kidney injury (AKI), still often called acute renal failure, is a <strong>sudden</strong> loss of kidney function over hours to days. BUN and creatinine rise, urine output usually falls, and fluid, electrolytes, and acid–base balance all start to drift. The key difference from chronic kidney disease is that AKI is <strong>potentially reversible</strong> if the cause is found and treated quickly."},
   {h:"The three categories of cause"},
   {table:{head:["Category","Where the problem is","Common causes","Priority treatment","Key clue"],rows:[
    ["<strong>Prerenal</strong>","<em>Before</em> the kidney — a perfusion/flow problem","<strong>Hypovolemia:</strong> dehydration, hemorrhage, burns. <strong>Low cardiac output:</strong> heart failure, shock. Also sepsis, poor oral intake","<strong>Restore perfusion</strong> — fluids, blood products, or vasopressors","BUN:creatinine ratio above 20:1; concentrated urine (high specific gravity). Reversible if perfusion is restored quickly"],
    ["<strong>Intrarenal</strong>","<em>Inside</em> the kidney — direct tissue damage","<strong>Nephrotoxins:</strong> NSAIDs, contrast dye, gentamicin, vancomycin. Glomerulonephritis. Prolonged ischemia (acute tubular necrosis)","<strong>Remove the toxin/cause</strong> — restrict fluids if oliguric; dialysis if severe","Urine specific gravity fixed near 1.010; casts on urinalysis. Untreated prerenal injury can progress to intrarenal"],
    ["<strong>Postrenal</strong>","<em>After</em> the kidney — obstruction/blockage","Renal calculi (stones), <strong>BPH</strong> (enlarged prostate), tumors, a kinked or blocked catheter","<strong>Relieve the obstruction</strong> — surgery, lithotripsy, or a Foley catheter","Bladder distention or hydronephrosis on ultrasound; output may stop abruptly"]
   ]}},
   {hook:"Before calling a patient anuric, rule out the easy postrenal cause: any sudden, complete stop in urine flow in a client with a Foley should prompt the nurse to <strong>inspect, flush, or change the catheter</strong>, and a client without one gets a bladder scan. A distended bladder means the kidneys are making urine that just can't get out."},
   {h:"How the labs tell the three types apart"},
   {table:{head:["Value","Prerenal","Intrarenal (ATN)","Postrenal"],rows:[
    ["<strong>Urine volume</strong>","Oliguria","Anuria, oliguria, or non-oliguric","May alternate between anuria and polyuria"],
    ["<strong>Urine specific gravity</strong>","<strong>Increased (above 1.020)</strong> — the kidney is concentrating urine to save water","<strong>About 1.010</strong> (fixed) — tubules can't concentrate","Varies"],
    ["<strong>Urine sodium</strong>","<strong>Low (below 20 mEq/L)</strong> — the kidney is holding sodium","<strong>High (above 40 mEq/L)</strong> — damaged tubules can't hold sodium","Varies"],
    ["<strong>Urine sediment</strong>","Normal, few casts","<strong>Muddy-brown granular casts</strong>, tubular epithelial cells","Normal; may show crystals (stones)"],
    ["<strong>BUN:creatinine</strong>","<strong>Above 20:1</strong>","10:1–15:1 (both rise together)","10:1–15:1"]
   ]}},
   {p:"<strong>Prerenal AKI and ischemic ATN are a continuum</strong> — if low perfusion isn't corrected quickly, tubular cells die and restoring blood flow no longer fixes the problem. A fluid bolus that improves urine output is both treatment and proof that the cause was prerenal. Note that raising BP with vasoconstrictors (e.g., norepinephrine) doesn't guarantee better kidney perfusion — urine output is the better gauge."},
   {p:"<strong>Aminoglycoside</strong> nephrotoxicity typically starts <strong>5–10 days</strong> into therapy — monitor peak and trough levels and creatinine. <strong>Contrast-induced AKI</strong> appears within <strong>3–5 days</strong> of contrast and is usually non-oliguric and reversible; nephrotoxic drugs are ideally stopped 24 hours before contrast."},
   {p:"<strong>Postobstructive diuresis:</strong> after an obstruction is relieved (e.g., a catheter placed for BPH), output can exceed <strong>3 L/day</strong>. This is potentially life-threatening — monitor closely for dehydration, electrolyte loss, and hypovolemic shock, and replace fluids and electrolytes."},
   {h:"Phases of AKI"},
   {table:{head:["Phase","Key signs & symptoms","Critical labs & risks","Nursing priority"],rows:[
    ["<strong>Initiation (onset)</strong>","The initial insult — hours to days","Rising creatinine begins","Recognize the cause early; prevent progression"],
    ["<strong>Oliguric</strong>","Urine output <strong>below 400 mL/day</strong>; fluid overload (edema, HTN)","<strong>Hyperkalemia</strong> (peaked T waves), metabolic acidosis, high BUN/creatinine; also dilutional hyponatremia, hyperphosphatemia/hypocalcemia","<strong>Restrict fluids and potassium</strong>; monitor for dysrhythmias"],
    ["<strong>Diuretic</strong>","Urine output <strong>4–5 L/day</strong>; fluid volume deficit (hypotension)","<strong>Hypokalemia and hyponatremia</strong> (electrolytes lost in the urine); GFR starts improving","<strong>Replace fluids and electrolytes</strong>; monitor BP (fall risk)"],
    ["<strong>Recovery</strong>","Urine output normalizes; energy returns","GFR normalizes; BUN/creatinine return to baseline","Maintain hydration and monitor labs — recovery can take up to <strong>12 months</strong>; some clients are left with permanently reduced function (CKD)"]
   ]}},
   {hook:"<b>Sodium polystyrene sulfonate (Kayexalate)</b> is used to lower the potassium level seen in <b>acute renal failure</b> — it pulls potassium out through the stool."},
   {h:"Priority assessments/cues"},
   {list:[
    "<strong>Anorexia, nausea, and vomiting</strong> — may indicate uremia",
    "<strong>Drowsiness, confusion, stupor</strong>, paresthesia of fingers and toes",
    "Fluid overload: <strong>distended neck veins, crackles</strong>, edema, pulmonary edema, hypertension, heart failure",
    "<strong>Pericarditis</strong> — friction rub, chest pain on inspiration",
    "<strong>Kussmaul respirations</strong> from metabolic acidosis (depletion of bicarbonate)",
    "Manifestations of infection — fever, pain, malaise",
    "Urine output — hourly in the acute setting; less than 0.5 mL/kg/hr is an early warning",
    "<strong>Daily weight</strong> — same time, same scale, same clothing; a 1 kg gain equals about 1 L of retained fluid",
    "Strict intake and output",
    "Fluid volume excess cues: crackles, dyspnea, edema, JVD, hypertension, bounding pulses, weight gain",
    "Fluid volume deficit cues (prerenal cause or diuretic phase): tachycardia, hypotension, dry mucous membranes, weak/thready pulses, poor skin turgor",
    "ECG changes of hyperkalemia — peaked T waves, widened QRS, dysrhythmias",
    "Mental status — confusion, lethargy, and drowsiness from rising nitrogenous wastes and sodium shifts",
    "Recent exposures: IV contrast, aminoglycosides, NSAIDs, surgery, hypotension, sepsis"]},
   {hook:"<b>AKI criteria:</b> an abrupt loss of kidney function — serum creatinine up <b>0.3 mg/dL or more within 48 hours</b>, or <b>1.5 times baseline within 1 week</b> — with a falling GFR and a sudden drop in urine output (<b>below 0.5 mL/kg/hr for 6–12 hours</b>). Example: a client losing blood from esophageal varices who develops these findings has AKI from volume loss (prerenal)."},
   {hook:"<b>Prerenal azotemia</b> — nitrogenous wastes (urea and other nitrogen compounds) build up in the blood because the kidneys are <b>underperfused from a nonrenal cause</b>. The early lab clue is a <b>BUN:creatinine ratio above 20:1</b>. Prerenal azotemia is also a probable indicator for <b>hospitalization in community-acquired pneumonia (CAP)</b>. <b>Intrarenal</b> AKI instead shows ↑ BUN, ↑ creatinine, a <b>low (fixed) urine specific gravity</b>, and ↑ urine sodium."},
   {h:"Priority laboratory/diagnostic cues"},
   {list:[
    "<strong>Metabolic panel</strong> — in the oliguric phase, serum <strong>sodium and bicarbonate are decreased</strong> while <strong>potassium, BUN, and creatinine are increased</strong>",
    "ABGs — metabolic acidosis (low HCO<sub>3</sub>, low pH)",
    "<strong>Urinalysis</strong> — elevated WBCs, casts, hematuria, pyuria, and protein point to an <strong>intrarenal</strong> cause; also specific gravity",
    "<strong>ECG</strong> — widening QRS and ST changes from hyperkalemia",
    "<strong>Kidney ultrasound</strong> — obstructions or other abnormalities (postrenal); <strong>CT</strong> — renal masses and vascular abnormalities",
    "<strong>Renal scan</strong> — tubular function and kidney blood flow; <strong>renal biopsy</strong> — to determine the cause",
    "CBC — anemia may develop as erythropoietin production falls"]},
   {h:"Priority interventions/collaborative actions"},
   {list:[
    "<strong>Treat the cause:</strong> IV fluids for prerenal (dehydration/hypovolemia); stop nephrotoxic drugs for intrarenal; relieve the obstruction (e.g., indwelling catheter) for postrenal",
    "<strong>Fluid restriction</strong> in the oliguric phase — commonly the previous 24-hour output plus about 500–600 mL to cover insensible losses",
    "Cardiac monitoring and treatment of hyperkalemia (see the Fluid &amp; Electrolyte lesson)",
    "Avoid nephrotoxic drugs; adjust doses of renally cleared medications",
    "Diuretics (loop) may be ordered once volume status is corrected, to manage fluid overload",
    "Nutrition — may be <strong>low protein with high carbohydrates and fats</strong> (spares protein); <strong>sodium restricted in the oliguric phase</strong>; restrict potassium and phosphorus as ordered; enteral feeding if the client can't tolerate oral intake",
    "<strong>CRRT</strong> if prescribed — assess vital signs, I&amp;O, and hemodynamic status <strong>hourly</strong>; assess the vascular access site; the ultrafiltrate should be <strong>clear yellow</strong> — <strong>stop treatment if it becomes bloody</strong> (ruptured filter membrane)",
    "Infection prevention — <strong>infection is a leading cause of death in AKI</strong>; avoid unnecessary catheters and invasive lines",
    "Avoid <strong>lactated Ringer's</strong> in renal failure — it contains potassium, which can worsen hyperkalemia",
    "Dialysis or CRRT if fluid overload, hyperkalemia, acidosis, or uremic symptoms can't be controlled"]},
   {h:"Preventing contrast-induced kidney injury"},
   {list:[
    "Identify at-risk patients before contrast studies: existing kidney disease, diabetes, dehydration, older age, heart failure",
    "<strong>Hydration</strong> before and after the procedure (IV isotonic fluid as ordered) is the main preventive measure",
    "<strong>Acetylcysteine</strong> may be ordered before and after contrast as a renal-protective agent",
    "Metformin is typically held around contrast administration in patients at risk, and resumed only once kidney function is confirmed stable",
    "Monitor creatinine and urine output for 48–72 hours afterward"]},
   {h:"Priority actual & potential complications"},
   {list:["Hyperkalemia → dysrhythmias and cardiac arrest","Fluid overload → pulmonary edema and heart failure","Metabolic acidosis","Infection and sepsis","Progression to chronic kidney disease and need for dialysis or transplant"]},
   {h:"Priority hypotheses for nursing care"},
   {list:[
    "<strong>Older adults</strong> may not recover from AKI or regain full kidney function",
    "<strong>Nephrotoxic contrast media must not be used</strong> in tests for clients with AKI"]},
   {h:"Priority medications"},
   {list:[
    "<strong>Furosemide</strong> (IV) — loop diuretic for fluid overload in the oliguric phase; potassium-wasting, so monitor potassium",
    "<strong>Sodium bicarbonate</strong> (IV) — alkalinizing agent that also lowers potassium (shifts it into cells)",
    "<strong>Sodium polystyrene sulfonate</strong> — potassium-removing agent",
    "<strong>Calcium gluconate</strong> (IV) — reduces myocardial irritability from hyperkalemia"]},
   {h:"Priority teaching/discharge needs"},
   {list:[
    "Monitor urine output if taking nephrotoxic drugs or working with chemicals toxic to the kidneys; report decreased output immediately",
    "Full recovery may take several months; dialysis or transplant if full recovery isn't attained",
    "Avoid drugs that decrease kidney function, such as <strong>NSAIDs</strong> (and ACE inhibitors during the acute injury)",
    "Resources for counseling, if requested"]}
  ],
  check:{stem:"A client in the diuretic phase of AKI is producing 3 L of urine per day. For which complication is the nurse most concerned?",
   options:["Hyperkalemia and fluid overload","Hypokalemia and fluid volume deficit","Hypernatremia and hypertension","Metabolic alkalosis from bicarbonate retention"],
   answer:1,
   why:"In the diuretic phase, the kidneys produce large volumes of dilute urine but can't yet regulate electrolytes, so the risks flip from the oliguric phase: fluid volume deficit, hypotension, and potassium and sodium loss."}
},
{ id:"elim-ckd", title:"Chronic Kidney Disease (CKD) & ESRD", kicker:"Progressive, irreversible loss of function — the five stages and uremia body system by body system",
  blocks:[
   {h:"AKI vs. CKD at a glance"},
   {table:{head:["Feature","Acute kidney injury (AKI)","Chronic kidney disease (CKD)"],rows:[
    ["<strong>Onset</strong>","Sudden/rapid (hours to days)","Gradual/progressive (months to years)"],
    ["<strong>Reversibility</strong>","<strong>Potentially reversible</strong> with prompt treatment","<strong>Irreversible</strong> — function can't be recovered, only maintained"],
    ["<strong>Primary causes</strong>","Prerenal: hypovolemia, shock, heart failure. Intrarenal: nephrotoxic drugs, infection, ischemia. Postrenal: obstruction (stones, BPH)","<strong>Diabetes mellitus</strong> (leading cause) and <strong>hypertension</strong>; also other systemic diseases, hereditary disorders (e.g., PKD), toxic agents, infections, and medications"],
    ["<strong>Diagnostic criteria</strong>","Sudden increase in creatinine/BUN and/or rapid decrease in urine output (oliguria)","<strong>GFR below 60 mL/min for 3 months or more</strong>, or evidence of kidney damage (proteinuria)"],
    ["<strong>Key symptoms</strong>","Oliguria (below 400 mL/day), fluid overload (edema), metabolic acidosis, hyperkalemia","Uremia (fatigue, anorexia), anemia (low EPO), pruritus (\"uremic frost\"), bone disease"],
    ["<strong>Treatment focus</strong>","<strong>Rescue:</strong> treat the underlying cause (fluids for prerenal, remove obstruction for postrenal), manage acute electrolyte shifts","<strong>Maintenance:</strong> slow progression (BP and glucose control), manage complications (phosphate binders, epoetin alfa), prepare for dialysis/transplant"],
    ["<strong>Mortality risk</strong>","<strong>Infection</strong> is a leading cause of death","<strong>Cardiovascular disease</strong> is the leading cause of death"]
   ]}},
   {p:"Chronic kidney disease (CKD) is kidney damage or a decreased GFR lasting <strong>3 months or longer</strong>. Unlike AKI, it is progressive and <strong>irreversible</strong>. The two leading causes are <strong>diabetes</strong> and <strong>hypertension</strong>; others include glomerulonephritis, pyelonephritis, polycystic kidney disease, nephrosclerosis, and nephrotoxic drugs. When it reaches stage 5 and the patient needs dialysis or a transplant to survive, it's called <strong>end-stage renal disease (ESRD)</strong>."},
   {h:"Stages of CKD (by GFR)"},
   {table:{head:["Stage","GFR (mL/min/1.73 m²)","Description"],rows:[
    ["1","90 or above","Kidney damage with normal or increased GFR"],
    ["2","60–89","Mildly decreased GFR"],
    ["3a / 3b","45–59 / 30–44","Moderately decreased GFR"],
    ["4","15–29","Severely decreased GFR — preparation for dialysis or transplant begins"],
    ["5","Below 15 (or on dialysis)","Kidney failure — <strong>ESRD</strong>"]
   ]}},
   {hook:"<b>Once kidney disease becomes chronic,</b> expect manifestations such as <b>lethargy, dry skin, muscle cramps, and bleeding of the oral mucous membranes</b> (uremic platelet dysfunction)."},
   {hook:"<b>Untreated CKD that has progressed to ESKD</b> — expected serum values and signs: <b>calcium 7.5 mg/dL</b> with hypotension and irritability; <b>potassium 6.4 mEq/L</b> with dysrhythmias and abdominal distention; <b>phosphate 5.0 mg/dL</b> with tachycardia, nausea, and vomiting."},
   {h:"Uremia — how CKD affects every body system"},
   {table:{head:["System","Findings","Why"],rows:[
    ["<strong>Cardiovascular</strong>","Hypertension, heart failure, edema, pericarditis (friction rub), dysrhythmias","Sodium and water retention, renin–angiotensin activation, uremic toxins, hyperkalemia"],
    ["<strong>Respiratory</strong>","Crackles, pulmonary edema, <strong>Kussmaul respirations</strong>, uremic pleuritis","Fluid overload; compensation for metabolic acidosis"],
    ["<strong>Hematologic</strong>","<strong>Anemia</strong>, fatigue, bleeding tendency","Kidneys stop producing <strong>erythropoietin</strong>; uremia impairs platelet function"],
    ["<strong>GI</strong>","Anorexia, nausea, vomiting, <strong>uremic fetor</strong> (ammonia/urine breath odor), metallic taste, stomatitis","Urea breaks down to ammonia in saliva; uremic irritation of the GI tract"],
    ["<strong>Neurologic</strong>","Fatigue, difficulty concentrating, confusion, peripheral neuropathy, restless legs, muscle twitching, <strong>asterixis</strong> (flapping tremor), tremors, seizures","Accumulating uremic toxins and electrolyte shifts"],
    ["<strong>Integumentary</strong>","Pruritus (itching), dry flaky skin, <strong>gray-bronze</strong> or yellow-gray skin tone, ecchymosis and purpura, thin brittle nails, coarse thinning hair, <strong>uremic frost</strong> (late — urea crystals on the skin)","Retained urochromes, high phosphorus, uremic toxins"],
    ["<strong>Musculoskeletal</strong>","Bone pain, fractures, <strong>renal osteodystrophy</strong> (CKD-mineral and bone disorder)","High phosphorus + low calcium + low active vitamin D → secondary hyperparathyroidism pulls calcium out of bone"],
    ["<strong>Fluid/electrolyte</strong>","Edema, weight gain, hyperkalemia, hyperphosphatemia, hypocalcemia, hypermagnesemia, metabolic acidosis","The kidney can no longer excrete water, potassium, phosphorus, magnesium, or acid"],
    ["<strong>Endocrine/metabolic</strong>","Hypoglycemia risk in diabetic patients; changing insulin needs","The failing kidney clears insulin and some oral hypoglycemics more slowly"],
    ["<strong>Psychosocial</strong>","Depression, anxiety, body image changes, role changes","Chronic illness, dialysis schedule, dietary restrictions, financial strain"]
   ]}},
   {hook:"A diabetic patient whose kidneys are failing may suddenly start having low blood sugars on a dose that used to work. The kidney normally clears insulin and drugs like glipizide; as function falls, those drugs linger longer and hit harder."},
   {h:"Priority assessments/cues"},
   {list:[
    "Anorexia, nausea, vomiting, lethargy, fatigue",
    "<strong>Metallic taste</strong>, <strong>uremic fetor</strong> (urine-like breath/body odor)",
    "Confusion, headache, drowsiness, and <strong>encephalopathy</strong> (accumulating wastes)",
    "Peripheral neuropathy, <strong>burning sensation in the feet</strong>, <strong>asterixis</strong> (flapping tremor)",
    "Fractures from deficiencies of calcium, vitamin D, and parathyroid hormone imbalance",
    "<strong>Itching</strong> from uremic frost (urea crystallizing on the skin)",
    "Use of prescription and over-the-counter medications — many are toxic to the kidneys",
    "Fluid status — daily weight, I&amp;O, edema, lung sounds, BP, JVD, pulmonary edema, heart failure",
    "Signs of hyperkalemia (muscle weakness, paresthesias, ECG changes) and hyperglycemia",
    "Signs of hypocalcemia — tingling, muscle cramps, positive Chvostek's and Trousseau's signs",
    "Kussmaul respirations — metabolic acidosis from bicarbonate depletion",
    "Bleeding (impaired clotting) and infections",
    "Concurrent heart failure, coronary artery disease, pneumonia",
    "Dialysis access, if present (thrill and bruit)",
    "Coping, <strong>long-term support system</strong>, and ability to get to dialysis — CKD is life-altering"]},
   {h:"Priority laboratory/diagnostic cues"},
   {list:[
    "GFR (declining — degree of kidney damage), BUN and creatinine (rising)",
    "Urine dipstick — <strong>proteinuria</strong>; urinalysis — albumin, WBCs, protein, casts, glucose; specific gravity fixed near 1.010",
    "Potassium ↑, phosphorus ↑, calcium ↓, magnesium ↑, sodium variable",
    "Hemoglobin and hematocrit ↓ (anemia of CKD); serum ferritin (iron stores)",
    "ABGs — metabolic acidosis",
    "ECG — hyperkalemia changes",
    "CT (renal masses, vascular abnormalities), kidney ultrasound (obstructions), renal scan (tubular function, blood flow), renal biopsy (cause of CKD)"]},
   {h:"Priority interventions/collaborative actions"},
   {list:[
    "Manage fluid: restriction as ordered, <strong>daily weights using the same scale at the same time of day</strong>, I&amp;O",
    "Control blood pressure and blood glucose — the two biggest drivers of progression; clients with diabetes need glycemic control and periodic urine albumin checks",
    "Renal diet — sodium <strong>less than 4 g/day</strong>, phosphate <strong>less than 1 g/day</strong>, restrict potassium and fluid; protein restricted before dialysis, then <em>increased</em> (high-quality protein) once on dialysis because dialysis removes protein. Dietitian consult; enteral feeding if the client can't tolerate oral intake",
    "Medications: phosphate binders with meals, vitamin D (calcitriol), epoetin alfa with iron, sodium bicarbonate, potassium binders, statins for dyslipidemia, antihypertensives, diuretics (while there's still urine output)",
    "<strong>Stool softeners</strong> for iron-associated constipation",
    "Allow adequate rest; manage itching; manage <strong>burning and tearing of the eyes</strong> from calcium deposits; monitor for <strong>restless legs</strong> (common during dialysis)",
    "Monitor clients taking nephrotoxic drugs; organize medications with a pill box; avoid aspirin (excreted by the kidneys; prolongs bleeding)",
    "Continuous cardiac monitoring (telemetry) when hyperkalemia is a risk",
    "Give oral iron at a different time than phosphate binders; blood transfusions only when necessary — they suppress red cell production and create antibodies that make transplant matching harder",
    "For pruritus: avoid soaps (dry the skin), meticulous skin care, antihistamines as prescribed, keep nails trimmed",
    "Note that early CKD can cause <strong>polyuria and nocturia</strong> (the kidney can't concentrate urine) before oliguria develops later; infection may present <strong>without fever or a high WBC</strong>",
    "<strong>Avoid</strong> magnesium-containing antacids and laxatives (Milk of Magnesia), phosphate-containing enemas (Fleet), NSAIDs, and nephrotoxic drugs",
    "<strong>Avoid aluminum-based antacids</strong> — risk of aluminum toxicity, which can lead to bone disease and even dementia",
    "Lactated Ringer's is often avoided in renal failure because it contains potassium",
    "Skin care for pruritus — <strong>tepid</strong> (not hot) baths, unscented moisturizing lotion, short nails",
    "Protect the nondominant arm's veins early (no BP, venipuncture, or IVs) in patients who will need an AV fistula",
    "Prepare for renal replacement therapy — dialysis or transplant — and support the patient and family through the decision"]},
   {hook:"<b>After a kidney transplant,</b> watch urinary function closely — rejection, infection, and other serious complications are real risks. A drop in urine output below <b>30 mL/hour</b> is significant and warrants <b>immediate</b> provider notification. Findings such as K⁺ 4.9 mEq/L, Na⁺ 135 mEq/L, and a temperature of 99.2°F are normal."},
   {h:"Priority actual & potential complications"},
   {list:["<strong>Cardiovascular complications</strong> — the most common cause of death in CKD; dyslipidemia","Hyperkalemia and dysrhythmias","Pericarditis, pericardial effusion, tamponade","Pulmonary edema and heart failure","Anemia","Bone disease (renal osteodystrophy) and fractures","ESRD requiring dialysis or transplant","Catheter-site infection and peritonitis with PD; fistula infection or malfunction","Depression"]},
   {h:"Priority hypotheses for nursing care"},
   {list:[
    "Cardiovascular disease is the most common cause of death in CKD — conduct vigilant cardiovascular assessments",
    "No blood pressures or venous access devices in the arm with a fistula",
    "Temporary access in the femoral or jugular veins is used until a fistula or graft matures",
    "Clients on dialysis may be anuric"]},
   {h:"Priority medications"},
   {list:[
    "<strong>Sodium bicarbonate</strong> — alkalinizing agent to correct acidosis",
    "<strong>Sodium polystyrene sulfonate</strong> (oral, rectal) and <strong>patiromer</strong> (oral, titrated to potassium level) — remove potassium",
    "<strong>Calcium acetate</strong> — phosphate binder taken with each meal",
    "<strong>Calcium gluconate</strong> (IV) — reduces myocardial irritability from hyperkalemia",
    "<strong>Calcitriol</strong> — vitamin D analog to treat secondary hyperparathyroidism in ESRD; measure serum calcium at least twice weekly when starting",
    "<strong>Erythropoietin (epoetin alfa)</strong> — treats anemia; monitor iron stores and give iron if serum ferritin is below 100 ng/mL; monitor hemoglobin to prevent cardiovascular complications",
    "<strong>Atorvastatin</strong> (statin) and <strong>gemfibrozil</strong> (fibrate, adjunct to diet) — dyslipidemia"]},
   {h:"Priority teaching/discharge needs"},
   {list:[
    "Diet low in protein (before dialysis), phosphate, sodium, and potassium",
    "<strong>Peritoneal dialysis:</strong> teach the process with return demonstration; examine the catheter site for infection; teach the signs of peritonitis and to <strong>report cloudy outflow immediately</strong>; teach timing (nightly or intermittent)",
    "<strong>Hemodialysis:</strong> never allow an IV or BP in the graft/fistula arm; avoid submerging the access; signs of access infection and when to call the provider; information on <strong>transportation to dialysis</strong> and other resources",
    "Avoid drugs that decrease kidney function, including NSAIDs and other nephrotoxic medications. ACE inhibitors can lower GFR — they're used for kidney protection in stable CKD with close monitoring of creatinine and potassium, but held with acute injury or volume depletion"]}
  ],
  check:{stem:"A client with CKD asks why he needs epoetin alfa injections. Which explanation is accurate?",
   options:["It replaces the vitamin D the kidneys can no longer activate","It replaces the erythropoietin the damaged kidneys no longer produce, treating anemia","It binds phosphorus in the GI tract","It shifts potassium back into the cells"],
   answer:1,
   why:"The kidneys produce erythropoietin, the hormone that signals the bone marrow to make red blood cells. In CKD, production falls and anemia develops; epoetin alfa replaces it."}
},
{ id:"elim-kidney-mgmt", title:"Managing Kidney Injury: Complications by Body System", kicker:"How AKI and CKD affect each system, and what the nurse monitors and does",
  blocks:[
   {p:"AKI and CKD share most of the same complications. Management starts with treating the primary cause, then supporting each body system the failing kidney affects."},
   {h:"Fluid balance"},
   {list:[
    "<strong>AKI:</strong> prompt fluid replacement matched to the loss (blood for hemorrhage, crystalloids for dehydration) when the cause is prerenal; in a sustained oliguric state, fluid is limited to the previous day's output plus about 500–800 mL",
    "<strong>CKD:</strong> fluid and sodium restriction; fluid limited to about 500 mL plus the previous day's urine output. Diuretics work until GFR falls very low (about 10–15), after which dialysis is needed",
    "Loop diuretics are used short-term for volume overload; high-dose IV furosemide is infused no faster than <strong>4 mg/min</strong> (ototoxicity)",
    "Spread the fluid allowance over 24 hours, with periodic sips and ice chips to ease thirst; frequent mouth care"]},
   {h:"Cardiovascular"},
   {list:[
    "<strong>Hypertension</strong> — from sodium/water retention and renin–angiotensin activation; managed with fluid/sodium restriction, diuretics, antihypertensives, dialysis. Target BP in CKD is generally below 130/80",
    "<strong>Hyperkalemia ECG progression:</strong> about 6–7 mEq/L — tall, peaked T waves, prolonged PR, ST depression; about 8–9 — P waves disappear; about 10–11 — QRS widens toward a sine-wave pattern, then ventricular fibrillation or standstill. Muscle weakness typically starts in the legs and ascends",
    "Clients with long-standing high potassium tolerate it better than those whose potassium rises suddenly — always read the potassium <strong>with</strong> the ECG",
    "<strong>Uremic pericarditis</strong> (mainly stage 5 CKD): sharp chest pain that is <strong>relieved by sitting forward</strong> and worse with deep breathing, fever, and a pericardial <strong>friction rub</strong>. Treated with aggressive (often daily) dialysis with low or no heparin",
    "<strong>Cardiac tamponade</strong> — distended neck veins, muffled heart sounds, narrowed pulse pressure, pulsus paradoxus, decreased LOC — is an emergency requiring pericardiocentesis",
    "Cardiovascular disease is the leading cause of death in CKD — statins are recommended for CKD clients 50 and older"]},
   {h:"Pulmonary"},
   {list:[
    "<strong>Pulmonary edema</strong> — dyspnea, crackles, <strong>pink frothy sputum</strong>, tachypnea, tachycardia, low SpO₂. Managed with fluid and sodium restriction, diuretics if the kidneys can respond, HOB elevation, and often emergent dialysis or intubation",
    "Also pleural effusion, uremic pleuritis/pneumonitis, and pulmonary infections — teach coughing and deep breathing; incentive spirometer"]},
   {h:"Gastrointestinal"},
   {list:[
    "<strong>GI bleeding</strong> is a potentially life-threatening complication — check vomit and stool for blood; monitor H&amp;H and signs of volume loss; H2 blockers or PPIs",
    "Anorexia, nausea, vomiting, stomatitis, metallic taste, uremic fetor — good oral hygiene, antiemetics, adequate dialysis",
    "<strong>Constipation</strong> (from fluid restriction, inactivity, iron, and phosphate binders) — bulk and stool softeners; <strong>avoid magnesium-containing cathartics</strong> (magnesium citrate) and <strong>phosphate (Fleet) enemas</strong>"]},
   {h:"Neuromuscular"},
   {list:[
    "Sleep disturbances, difficulty concentrating, short-term memory loss, lethargy, muscle irritability",
    "<strong>Restless leg syndrome</strong> and <strong>burning feet syndrome</strong> (paresthesias and numbness of the soles and lower legs) — teach protection from heat and injury",
    "Rising BUN can cause cerebral edema → seizures, projectile vomiting, coma — seizure precautions",
    "Teach in <strong>short, frequent sessions</strong> with reinforcement, and include family — uremia impairs concentration and memory"]},
   {h:"Hematologic"},
   {list:[
    "<strong>Bleeding tendency</strong> — uremia impairs platelet function; monitor platelets and coagulation studies; avoid NSAIDs and aspirin when possible; soft toothbrush. Heparin during dialysis can cause heparin-induced thrombocytopenia (HIT), which requires stopping heparin",
    "<strong>Immune impairment</strong> — infection is a major cause of death. Uremic clients have a <strong>lower baseline temperature</strong>, so <strong>any rise above baseline is significant</strong>. Hand hygiene; remove invasive catheters as soon as possible",
    "<strong>Anemia</strong> — mainly from erythropoietin deficiency (plus shortened RBC survival — about 70 days instead of 120 — and blood loss). Treated with ESAs (epoetin alfa, darbepoetin), iron, vitamins, and transfusion for profound anemia, since ESAs take weeks to work",
    "<strong>Oral iron is poorly absorbed</strong> when taken with phosphate binders, antacids, H2 blockers, or PPIs — separate the timing. IV iron works better but can cause allergic reactions"]},
   {h:"Drug elimination"},
   {list:["Many drugs are excreted by the kidneys — doses and intervals are adjusted to GFR (which may change daily in AKI)","Monitor therapeutic drug levels","Know which drugs are removed by dialysis so they're timed after treatment"]},
   {h:"Skeletal — renal bone disease"},
   {list:[
    "High phosphorus + low calcium + low active vitamin D → rising PTH (secondary hyperparathyroidism) → calcium and phosphate pulled from bone",
    "When the calcium × phosphorus product exceeds about <strong>55</strong>, calcium-phosphate crystals deposit in soft tissue (<strong>metastatic calcifications</strong>) — blood vessels, heart valves, lungs, joints, skin, and eyes (\"red eye\")",
    "Complications: bone pain, fractures, spontaneous tendon rupture, proximal muscle weakness, pruritus",
    "<strong>Phosphate binders:</strong> calcium acetate (PhosLo), calcium carbonate (Tums), <strong>sevelamer</strong> (Renagel/Renvela) and lanthanum (calcium-free — preferred when calcium is high), iron-based binders (ferric citrate). Aluminum binders are rarely used because of aluminum toxicity (bone and nervous system)",
    "<strong>Active vitamin D</strong> (calcitriol, paricalcitol) suppresses PTH — watch for hypercalcemia and hyperphosphatemia",
    "<strong>Calcimimetics</strong> (cinacalcet, etelcalcetide) lower PTH — risk of <strong>hypocalcemia</strong>; cinacalcet can cause nausea/vomiting",
    "Parathyroidectomy for refractory cases"]},
   {h:"Integumentary"},
   {hook:"<b>Itching in chronic renal failure:</b> bathe in <b>tepid</b> water — hot water strips more oil from the skin and increases dryness and itching. Use moisturizing lotions and creams <b>without perfume</b>, avoid scratching, and keep nails trimmed."},
   {list:["Dry skin (xerosis), <strong>pruritus</strong>, pallor, bruising, yellow or darkened pigmentation, hair loss, nail changes (\"half-and-half\" nails)","<strong>Uremic frost</strong> — white powdery urate crystals on the skin, seen only with severe, untreated uremia","Keep skin clean and moisturized (superfatted or lanolin-based soap, emollients), trim fingernails, antihistamines for itching, turn every 2 hours"]},
   {h:"Nutrition"},
   {list:["Restrict fluid, sodium, potassium, and phosphorus; supplement iron, vitamins, and calcium as ordered","High-calorie diet with most calories from carbohydrates and fats, to prevent catabolism","Adequate protein, at least half of high biological value (e.g., eggs, meat); protein restriction must never cause malnutrition — in AKI, protein restriction isn't recommended","Monitor weight, albumin, prealbumin, total protein, H&amp;H; dietitian consult; small, frequent feedings"]},
   {h:"Psychosocial"},
   {list:["Fear, anxiety, powerlessness, body image changes, disrupted family roles","Thorough teaching, active involvement of client and family, adequate rest, explore feelings, social services and clergy as appropriate"]}
  ],
  check:{stem:"A client with ESRD has a temperature of 99.4°F; his usual temperature runs 97.2°F. How should the nurse interpret this?",
   options:["Normal — below 100.4°F is not a fever","Significant — uremic clients have a lower baseline temperature, so a rise above baseline may signal infection","Expected after dialysis from warming of the blood, requiring no follow-up","A sign of hyperkalemia"],
   answer:1,
   why:"Uremia lowers the baseline temperature and blunts the fever response, so any rise above the client's baseline is significant as a sign of infection, a major cause of death in kidney injury."}
},
{ id:"elim-lytes", title:"Fluid & Electrolyte Concepts in Renal Failure", kicker:"Potassium, phosphorus, calcium, sodium, magnesium, and fluid volume — and how each is treated",
  blocks:[
   {p:"Most of the life-threatening problems in renal failure are fluid and electrolyte problems. The kidney normally excretes potassium, phosphorus, magnesium, acid, and excess water — so when it fails, all of these build up, while calcium falls."},
   {h:"The renal failure electrolyte pattern at a glance"},
   {table:{head:["Electrolyte","Typical range","Direction in renal failure","Why"],rows:[
    ["<strong>Potassium (K⁺)</strong>","3.5–5.5 mEq/L (many references: 3.5–5.0)","<strong>↑ High</strong> (above 5.5)","Kidneys can't excrete it; acidosis shifts K⁺ out of cells"],
    ["<strong>Phosphorus</strong>","About 2.5–4.5 mg/dL","<strong>↑ High</strong> (above 4.5)","Kidneys can't excrete it; dialysis removes only a small amount"],
    ["<strong>Calcium (Ca²⁺)</strong>","About 8.5–10.5 mg/dL","<strong>↓ Low</strong> (below 8.5)","Inverse relationship with phosphorus, plus the kidney can't activate vitamin D, so less calcium is absorbed from the gut"],
    ["<strong>Magnesium (Mg²⁺)</strong>","About 1.5–2.5 mEq/L","<strong>↑ High</strong> (above 2.5)","Kidneys can't excrete it — worsened by Mg-containing antacids and laxatives"],
    ["<strong>Sodium (Na⁺)</strong>","135–145 mEq/L","Variable — often <strong>↓ low (dilutional)</strong> with fluid overload","Water retained in excess of sodium dilutes it; dehydration concentrates it"],
    ["<strong>Bicarbonate (HCO₃)</strong>","22–26 mEq/L","<strong>↓ Low</strong> (metabolic acidosis)","Kidneys can't excrete acid or regenerate bicarbonate"]
   ]}},
   {h:"Hyperkalemia — the most immediately dangerous"},
   {list:[
    "<strong>Heart rate pattern:</strong> as potassium climbs, the heart gets more irritable — <strong>tachycardia first</strong>, then it crashes to <strong>bradycardia and asystole</strong> at critical levels. A slowing heart rate in hyperkalemia is <strong>not</strong> improvement; it can be the step before arrest",
    "<strong>Cues:</strong> muscle weakness, paresthesias, fatigue, abdominal cramping/diarrhea, bradycardia, and ECG changes — <strong>tall peaked T waves</strong>, flattened or absent P waves, prolonged PR, <strong>widened QRS</strong>, progressing to ventricular fibrillation or asystole",
    "<strong>Priority action:</strong> place the patient on a cardiac monitor and notify the provider",
    "<strong>Rising BUN and creatinine predict a high potassium</strong> (not the other way around) — when the BUN/creatinine climb, the first electrolyte to check is potassium, because it kills first"]},
   {table:{head:["Goal","Treatment","How it works","Nursing points"],rows:[
    ["<strong>1. Protect the heart</strong>","<strong>Calcium gluconate IV</strong>","Stabilizes the cardiac cell membrane","Works within minutes but does <strong>not</strong> lower K⁺ — it buys time. Cardiac monitoring during administration"],
    ["","<strong>Calcium chloride IV</strong>","Same job as gluconate — stabilizes the heart","About <strong>3 times more concentrated</strong> than calcium gluconate and works faster; doses may be repeated (e.g., every 30 minutes) in critical hyperkalemia"],
    ["<strong>2. Shift K⁺ into cells</strong>","<strong>Regular insulin IV + D50 (50% dextrose)</strong>","Insulin drives K⁺ into cells; dextrose prevents hypoglycemia","<strong>Regular insulin</strong> (the only insulin given IV) — about 10 units <strong>IV, not subQ</strong> — given together with D50. D5 or D10 isn't enough to cover the insulin. Monitor blood glucose closely for hours afterward"],
    ["","<strong>Sodium bicarbonate IV</strong>","Corrects acidosis, which pushes K⁺ back into cells","Most useful when metabolic acidosis is present"],
    ["","<strong>Albuterol (nebulized)</strong>","Beta-2 stimulation shifts K⁺ into cells","Monitor for tachycardia"],
    ["<strong>3. Remove K⁺ from the body</strong>","<strong>Sodium polystyrene sulfonate with sorbitol, patiromer, sodium zirconium cyclosilicate (Lokelma)</strong>","Bind K⁺ in the GI tract so it's eliminated in stool","Slower onset — not a stand-alone emergency treatment"],
    ["","<strong>Loop diuretics</strong>","Increase renal K⁺ excretion","Only useful if the kidneys still produce urine"],
    ["","<strong>Hemodialysis</strong>","Removes K⁺ directly from the blood","The definitive treatment in ESRD or when other measures fail"]
   ]}},
   {hook:"Shifting is temporary — insulin, bicarbonate, and albuterol only move potassium into cells, and it drifts back out within hours. Only binders, diuretics, and dialysis actually remove it from the body."},
   {hook:"Before giving sodium polystyrene sulfonate (Kayexalate), <strong>assess bowel sounds</strong>. If the gut isn't moving, the potassium can't leave the body, and the drug can cause intestinal necrosis."},
   {h:"Hyperphosphatemia and hypocalcemia — the pair"},
   {list:[
    "Phosphorus and calcium have an <strong>inverse relationship</strong>: as phosphorus rises, calcium falls",
    "<strong>High phosphorus cues:</strong> itching (pruritus), calcium-phosphate deposits in soft tissue, blood vessels, heart, and lungs; weak, brittle bones over time",
    "<strong>Chvostek = cheek</strong> (tap in front of the ear → facial twitch); <strong>Trousseau = tourniquet</strong> (BP cuff → hand/carpal spasm). If you see Chvostek's and aren't sure of the diagnosis, the client needs calcium",
    "<strong>Progression:</strong> paresthesias (fingers, toes, lips) first → Chvostek/Trousseau → cramps, weakness, tetany → seizures, bronchospasm, QT prolongation and dysrhythmias → coma. The gap between tingling and life-threatening is small — replace calcium urgently",
    "<strong>Mental status:</strong> the client is usually <strong>alert and oriented — but terrified</strong>, fully aware their body is spasming and they can't control it. Altered mental status and coma come late",
    "<strong>Low calcium cues:</strong> numbness and tingling around the mouth and fingers, muscle cramps, tetany, <strong>positive Chvostek's sign</strong> (facial twitch when the facial nerve is tapped) and <strong>Trousseau's sign</strong> (carpal spasm with a BP cuff inflated), hyperactive reflexes, seizures, prolonged QT",
    "<strong>Safety:</strong> positive Trousseau's or Chvostek's sign means a high risk of <strong>seizures and laryngeal spasm</strong> — implement seizure precautions",
    "<strong>Treatment:</strong> low-phosphorus diet, <strong>phosphate binders with the first bite of every meal</strong>, active vitamin D (calcitriol) to improve calcium absorption, calcium supplements, IV <strong>calcium gluconate</strong> for symptomatic hypocalcemia, dialysis",
    "Because of the inverse relationship, <strong>treating the high phosphorus first</strong> helps the calcium rise",
    "<strong>The calcium–phosphorus see-saw:</strong> when phosphorus rises, calcium drops, and the body steals calcium from the bones to balance the blood — <strong>secondary hyperparathyroidism</strong> and \"renal bone disease\" (renal osteodystrophy)",
    "In renal failure the kidneys fail to excrete most electrolytes <em>and</em> fail to activate vitamin D — producing the trio of high phosphorus, low calcium, and bone disease"]},
   {h:"Magnesium imbalances"},
   {p:"Magnesium is mainly an <strong>intracellular</strong> electrolyte (about 60% is in bone) that controls neuromuscular and cardiac irritability and helps the body make parathyroid hormone — so it's tied to calcium and potassium. The kidneys are the main route of excretion, which is why <strong>kidney failure is the most common cause of hypermagnesemia</strong>. Course range: about <strong>1.5–2.5 mEq/L</strong> (some references use 1.3–2.1 mEq/L). Because about 30% of magnesium is bound to albumin, check the <strong>albumin</strong> with the magnesium — a low albumin makes the total magnesium read low."},
   {table:{head:["","Hypermagnesemia (high)","Hypomagnesemia (low)"],rows:[
    ["<strong>Effect on nerves & muscles</strong>","<strong>Depresses</strong> — blocks neuromuscular transmission","<strong>Irritates</strong> — nerves and muscles become hyperexcitable"],
    ["<strong>Renal causes</strong>","<strong>Kidney failure</strong> (most common); magnesium-containing <strong>antacids and laxatives</strong> (Milk of Magnesia, magnesium citrate); magnesium-rich dialysate; magnesium sulfate infusions; untreated DKA; older age; adrenal insufficiency","Hemodialysis; <strong>loop and thiazide diuretics</strong>; aminoglycosides (gentamicin, tobramycin), cisplatin, cyclosporine, amphotericin B; glomerulonephritis and pyelonephritis (impaired reabsorption); diarrhea, NG suction, alcohol use disorder, PPIs"],
    ["<strong>Cues</strong>","Flushing and warmth, hypotension, nausea/vomiting, <strong>diminished or absent DTRs</strong>, weakness progressing to flaccid paralysis, drowsiness/lethargy, <strong>slow, shallow respirations</strong>, <strong>bradycardia</strong>, heart block, cardiac arrest","<strong>Hyperactive DTRs</strong>, tremors, twitching, <strong>tetany</strong>, <strong>+ Chvostek and Trousseau</strong> (with low calcium), seizures, confusion, dysphagia, laryngeal stridor, tachycardia, <strong>dysrhythmias</strong> (torsades de pointes, V-tach, A-fib), <strong>digoxin toxicity</strong>"],
    ["<strong>ECG</strong>","Prolonged PR, widened QRS, tall T waves","Prolonged PR and QT, widened QRS, ST depression, flattened T waves, prominent U waves"],
    ["<strong>Treatment</strong>","Stop all magnesium products; IV/oral fluids and a <strong>loop diuretic</strong> if the kidneys work; <strong>IV calcium gluconate</strong> (the antagonist) in an emergency; <strong>dialysis with magnesium-free dialysate</strong> in renal failure; ventilation or pacing if needed","Magnesium-rich diet and oral supplements for mild cases; <strong>IV magnesium sulfate</strong> for severe cases (assess renal function first)"],
    ["<strong>Nursing</strong>","Frequent VS (hypotension, bradycardia, respiratory depression); DTRs and muscle strength; continuous cardiac monitoring; monitor BUN/creatinine and urine output; <strong>flag the chart \"No magnesium products\"</strong>; calcium gluconate and resuscitation equipment ready","Seizure precautions; check swallowing before oral intake; cardiac monitoring when below about 1 mEq/L; monitor K⁺ and Ca²⁺ (they fall together); watch for digoxin toxicity"]
   ]}},
   {h:"Hypermagnesemia — symptoms climb with the level"},
   {table:{head:["Serum magnesium (about)","Signs & symptoms"],rows:[
    ["3 mEq/L","Feeling of warmth, flushing, mild hypotension, nausea and vomiting"],
    ["4 mEq/L","Facial paresthesia, <strong>diminished DTRs</strong>, muscle weakness, drowsiness"],
    ["5 mEq/L","ECG changes, bradycardia, worsening hypotension"],
    ["7 mEq/L","<strong>Loss of DTRs</strong> — an absent patellar reflex is reported immediately"],
    ["8 mEq/L","Respiratory compromise, heart block"],
    ["12 mEq/L","Flaccid paralysis, coma"],
    ["15 mEq/L","Respiratory arrest"],
    ["20 mEq/L","Cardiac arrest"]
   ]}},
   {hook:"<b>RENAL</b> = hypermagnesemia, because poor renal excretion is the main cause: <b>R</b>eflexes decreased (weakness, paralysis), <b>E</b>CG changes (bradycardia) and hypotension, <b>N</b>ausea and vomiting, <b>A</b>ppearance flushed, <b>L</b>ethargy (drowsiness, coma). For low magnesium, think <b>STARVED</b>: <b>S</b>eizures, <b>T</b>etany, <b>A</b>norexia and arrhythmias, <b>R</b>apid heart rate, <b>V</b>omiting, <b>E</b>motional lability, <b>D</b>TRs increased."},
   {h:"IV magnesium sulfate safety"},
   {list:[
    "Infusion pump only — no faster than <strong>150 mg/minute</strong>; a rapid bolus can cause cardiac arrest",
    "Check VS and DTRs; watch for hypotension and respiratory distress (signs of excess) about every 15 minutes",
    "Monitor urine output before, during, and after — notify the provider if output is <strong>less than 100 mL in 4 hours</strong> (magnesium is excreted by the kidneys)",
    "Continuous cardiac monitoring; keep <strong>calcium gluconate</strong> at the bedside",
    "Always <strong>write out \"magnesium sulfate\"</strong> — MgSO₄ is easily confused with MSO₄ (morphine sulfate)"]},
   {h:"Sodium imbalances"},
   {p:"Sodium is the main <strong>extracellular</strong> cation (normal <strong>135–145 mEq/L</strong>) — it controls where water goes. \"Think sodium, think water\": sodium problems are really water-balance problems, and their signs are mainly <strong>neurologic</strong> because water moves into or out of brain cells. Renal failure causes both: the kidney can't excrete water (dilutional hyponatremia) or sodium (sodium and water retention, hypertension)."},
   {table:{head:["","Hyponatremia (below 135 mEq/L)","Hypernatremia (above 145 mEq/L)"],rows:[
