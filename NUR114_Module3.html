"examtwo":[
 {"caseId":"exam2case","type":"matrix","ref":"elim-lytes","stem":"CASE STUDY (1 of 5): Using the Nursing Notes, Vitals, and Labs tabs, match each of the client's findings to the imbalance it best represents.","rows":["Crackles to mid-lung fields and sleeping in a recliner for 2 nights","Tall peaked T waves with a widened QRS","Tingling around the mouth with a positive Chvostek's sign","Admit weight 4.5 kg above dry weight","Serum sodium 131 mEq/L with 3+ pitting edema","Muscle weakness that started in the legs and is moving up into the arms"],"cols":["Fluid volume excess","Hyperkalemia","Hypocalcemia"],"correct":[0,1,2,0,0,1],"why":"Crackles, orthopnea, weight gain over dry weight, and a dilutional low sodium with edema all point to fluid volume excess from missed dialysis. Peaked T waves, a wide QRS, and weakness that starts in the legs and ascends are hyperkalemia; perioral tingling and a positive Chvostek's sign (cheek) are hypocalcemia, driven by the phosphorus of 8.2."},
 {"caseId":"exam2case","ref":"elim-lytes","stem":"CASE STUDY (2 of 5): Using the Vitals and Nursing Notes tabs, the client's heart rate has fallen from 118/min at 0800 to 54/min at 0845. How should the nurse interpret this change?","options":["Improvement — the oxygen therapy has relieved the tachycardia","An expected vagal response triggered by testing Chvostek's sign","Worsening hyperkalemia — the heart is moving from irritability toward bradycardia and asystole, so treatment is needed immediately","A sign that the fluid overload is resolving now that the head of the bed is raised"],"answer":2,"why":"As potassium climbs, the heart rate rises first and then crashes to bradycardia and asystole. A slowing rate with a widening QRS and a potassium of 7.1 is not improvement; it can be the step before arrest. Nothing has removed fluid yet, so overload has not resolved."},
 {"caseId":"exam2case","type":"bowtie","ref":"elim-lytes","stem":"CASE STUDY (3 of 5): Using the Labs, Vitals, and Orders tabs, complete the diagram: the condition the nurse must address first, the two actions to take now, and the two parameters to monitor.","conditionOptions":["Hyperkalemia with cardiac toxicity","Dialysis disequilibrium syndrome","Hypermagnesemia","Hypocalcemic tetany with laryngospasm"],"correctCondition":0,"actionOptions":["Give calcium gluconate IV slowly with cardiac monitoring","Give sodium polystyrene sulfonate as the stand-alone emergency treatment","Give regular insulin 10 units IV with 50% dextrose","Give furosemide 80 mg IV to remove the potassium","Offer a salt substitute to lower the client's sodium intake"],"correctActions":[0,2],"paramOptions":["Continuous ECG — T waves, QRS width, and heart rate","Urine specific gravity","Blood glucose after the insulin dose","Intraocular pressure","Aminoglycoside trough level"],"correctParams":[0,2],"why":"A potassium of 7.1 with peaked T waves, a widening QRS, and a falling heart rate is hyperkalemia with cardiac toxicity. Calcium gluconate protects the heart within minutes, and IV regular insulin with D50 shifts potassium into the cells; the ECG and blood glucose are monitored. Binders are too slow to stand alone, furosemide won't work in an anuric client, and salt substitutes are potassium chloride."},
 {"caseId":"exam2case","ref":"elim-ckd","stem":"CASE STUDY (4 of 5): Using the Nursing Notes, Labs, and Orders tabs, which prescription should the nurse clarify with the provider before giving it?","options":["Furosemide 80 mg IV now","Calcium gluconate 1 g IV over 10 minutes","Epoetin alfa 4,000 units IV during dialysis","Calcium acetate 1,334 mg PO with each meal"],"answer":0,"why":"The client states he has not made urine in over a year and the bladder scan shows 20 mL. Diuretics only work while there is still urine output, and anuria is a contraindication to furosemide. Calcium gluconate is indicated, epoetin is appropriate with a hemoglobin of 8.6, and calcium acetate treats the phosphorus of 8.2."},
 {"caseId":"exam2case","type":"sata","ref":"elim-dialysis","stem":"CASE STUDY (5 of 5): After emergent hemodialysis, the nurse evaluates the client. Using the dry weight on the Face Sheet, which findings indicate the treatment was effective? Select all that apply.","options":["SpO₂ 96% on room air and lungs clear to auscultation","Sinus rhythm at 80/min with normal T waves and a narrow QRS","Post-dialysis weight of 78.2 kg","Potassium of 3.2 mEq/L drawn 10 minutes after the run ended","BP 82/46 mmHg with dizziness when sitting up"],"answers":[0,1,2],"why":"Clear lungs with normal oxygenation, a normal rhythm, and a weight within 0.2 kg of the 78.0 kg dry weight show the fluid and potassium were removed. Labs drawn right after dialysis are falsely low while solutes re-equilibrate (draw 2–3 hours later), and hypotension with dizziness is overcorrection into fluid volume deficit."},
 {"ref":"elim-abg","stem":"The nurse reviews ABG results for four clients. Which client should the nurse see first?","options":["Client with CKD: pH 7.37, PaCO₂ 30 mmHg, HCO₃ 17 mEq/L","Postoperative client using a morphine PCA with a respiratory rate of 8/min: pH 7.24, PaCO₂ 62 mmHg, HCO₃ 25 mEq/L","Client awaiting surgery who is anxious: pH 7.47, PaCO₂ 32 mmHg, HCO₃ 24 mEq/L","Client with long-standing COPD: pH 7.36, PaCO₂ 56 mmHg, HCO₃ 31 mEq/L"],"answer":1,"why":"The PCA client has uncompensated (acute) respiratory acidosis from opioid-induced hypoventilation — the kidneys haven't had time to help, and ventilation must be improved now (naloxone, oxygen). The CKD and COPD gases are fully compensated chronic problems, and the mild respiratory alkalosis from anxiety is not life-threatening."},
 {"ref":"elim-abg-practice","stem":"A client with ESRD who missed two dialysis sessions has an ABG of pH 7.26, PaCO₂ 33 mmHg, HCO₃ 14 mEq/L. How should the nurse interpret this result?","options":["Uncompensated metabolic acidosis","Compensated respiratory alkalosis","Partially compensated respiratory acidosis","Partially compensated metabolic acidosis"],"answer":3,"why":"The pH is acidotic and the low HCO₃ matches it, so the kidneys are the problem child (metabolic acidosis). The PaCO₂ is also abnormal (low) and the pH is still out of range, so all three are abnormal: partially compensated. Uncompensated would require a normal PaCO₂."},
 {"type":"cloze","ref":"ws-abg-chart","stem":"Complete the sentence.","template":"A client with CKD has an ABG of pH 7.33, PaCO₂ 29 mmHg, HCO₃ 14 mEq/L. This is {0} metabolic acidosis; the low PaCO₂ reflects {1}, and the treatment that addresses the underlying cause is {2}.","blanks":[{"options":["uncompensated","partially compensated","fully compensated"],"correct":1},{"options":["a primary respiratory problem","the kidneys retaining bicarbonate","the lungs blowing off CO₂ to compensate"],"correct":2},{"options":["paper-bag breathing","dialysis","naloxone"],"correct":1}],"why":"The pH is still abnormal and all three values are abnormal, so the gas is partially compensated. The low HCO₃ matches the acidosis (the kidneys are the problem child), and the low CO₂ is the lungs compensating with Kussmaul breathing. In renal failure, dialysis fixes the cause."},
 {"type":"sata","ref":"elim-abg","stem":"A client with ESRD has deep, rapid respirations. ABG: pH 7.30, PaCO₂ 32 mmHg, HCO₃ 15 mEq/L; potassium is 6.2 mEq/L. Which statements are accurate? Select all that apply.","options":["The low bicarbonate is the primary cause of the acidosis","The deep, rapid breathing is compensation rather than the primary problem","Correcting the acidosis with sodium bicarbonate can shift potassium back into the cells","The ABG shows full compensation because both values are abnormal","The nurse should have the client breathe into a paper bag to raise the CO₂"],"answers":[0,1,2],"why":"The low HCO₃ matches the low pH, so this is metabolic acidosis, partially compensated (pH still abnormal) by Kussmaul breathing. Acidosis pushes potassium out of cells, so correcting it helps shift potassium back in. Stopping the compensation with paper-bag breathing would worsen the acidosis."},
 {"ref":"elim-abg","stem":"A client who has been hiking at high altitude for the past 2 weeks has an ABG of pH 7.44, PaCO₂ 30 mmHg, HCO₃ 20 mEq/L. How should the nurse interpret this result?","options":["Compensated metabolic acidosis","Partially compensated respiratory alkalosis","Uncompensated metabolic acidosis","Compensated respiratory alkalosis"],"answer":3,"why":"The pH is normal, so the gas is compensated, and it leans alkaline (above 7.40). A low CO₂ causes alkalosis, so the lungs (hyperventilation at altitude) are the problem child; the kidneys lowered HCO₃ over days to compensate."},
 {"ref":"elim-aki","stem":"The nurse receives report on four clients with AKI. Which client should the nurse assess first?","options":["A client with prerenal AKI whose urine output rose from 15 to 40 mL/hr after a fluid bolus","A client with contrast-induced AKI whose creatinine rose from 1.2 to 1.8 mg/dL and who is voiding normally","A client in the oliguric phase with a potassium of 6.4 mEq/L who reports new leg weakness and whose heart rate has dropped from 96 to 48/min","A client in the diuretic phase with a potassium of 3.6 mEq/L who is asking for help to the bathroom"],"answer":2,"why":"Hyperkalemia kills first. Ascending muscle weakness and a heart rate that has fallen sharply suggest the potassium is reaching the bradycardia–asystole stage. Rising output after a bolus is an expected response, contrast AKI is usually non-oliguric and reversible, and the diuretic-phase client needs fall precautions but is not unstable."},
 {"type":"sata","ref":"elim-dialysis","stem":"A client with AKI has a new temporary, non-tunneled dialysis catheter (Vascath) in the right internal jugular vein. Which actions are appropriate? Select all that apply.","options":["Confirm placement by chest x-ray before the first dialysis","Keep the catheter clamped except when it is being prepared for dialysis","Use strict sterile technique for dressing changes","Infuse the maintenance IV fluid through the blue lumen","Flush the lumens with normal saline and leave them unclamped"],"answers":[0,1,2],"why":"Placement is confirmed by x-ray before first use, and the lumens hold concentrated heparin, so they stay clamped and are never used for IV fluids or medications (unclamping lets blood fill and clot the lumen). Temporary catheters carry a high infection risk, so dressing changes are sterile."},
 {"type":"dragdrop","ref":"elim-aki","stem":"Sort each finding into the phase of AKI in which it is most expected.","items":["Urine output of 180 mL in 24 hours","Potassium 3.1 mEq/L with muscle weakness","Crackles, JVD, and BP 168/96 mmHg","Urine output of 4.6 L in 24 hours with dizziness on standing","Tall, peaked T waves on the monitor","Weight down 3 kg in 2 days with dry mucous membranes"],"bins":["Oliguric phase","Diuretic phase"],"correctBin":[0,1,0,1,0,1],"why":"The oliguric phase brings output below 400 mL/day, fluid overload, and hyperkalemia. In the diuretic phase the kidneys put out 4–5 L/day but can't yet regulate electrolytes, so the risks flip to hypokalemia and fluid volume deficit (weight loss, dry membranes, orthostatic hypotension)."},
 {"ref":"elim-aki","stem":"A client had a CT scan with IV contrast 4 days ago. Creatinine has risen from 1.0 to 1.9 mg/dL, and urine output has been about 1,800 mL/day. How should the nurse interpret these findings?","options":["Contrast-induced AKI, which is usually non-oliguric and reversible — avoid further nephrotoxins and monitor creatinine","A postrenal obstruction that requires an indwelling catheter","Not related to the contrast, because the urine output is normal","The diuretic phase of AKI, requiring replacement of 4–5 L of fluid per day"],"answer":0,"why":"Contrast-induced AKI typically appears within 3–5 days of contrast and is usually non-oliguric and reversible, so a normal urine output does not rule it out. Nephrotoxic drugs and further contrast are avoided while creatinine and output are monitored. An output of 1.8 L/day is not the 4–5 L/day of the diuretic phase."},
 {"ref":"elim-aki","stem":"A client with rising BUN and creatinine has a bladder scan showing 850 mL, and a kidney ultrasound shows bilateral hydronephrosis. What is the classification of this AKI, and what is the priority treatment?","options":["Prerenal — give an IV fluid bolus","Postrenal — relieve the obstruction, such as with an indwelling catheter","Intrarenal — stop nephrotoxic medications","Intrarenal — begin emergent hemodialysis"],"answer":1,"why":"Bladder distention and hydronephrosis mean the kidneys are making urine that can't get out — a postrenal cause. The priority is relieving the obstruction (catheter, lithotripsy, or surgery), then watching for postobstructive diuresis. Fluids treat prerenal causes, and stopping toxins treats intrarenal ones."},
 {"ref":"elim-kidney-mgmt","stem":"A client in the oliguric phase of AKI (220 mL of urine in 24 hours) is dyspneic with crackles throughout, pink frothy sputum, SpO₂ 86%, and BP 176/98 mmHg. Which action should the nurse take first?","options":["Encourage incentive spirometry every hour to clear the fluid","Suction the frothy secretions from the airway","Give a 250 mL normal saline bolus to support the kidneys","Raise the head of the bed to high Fowler's and apply oxygen"],"answer":3,"why":"This is pulmonary edema from fluid overload. Positioning and oxygen support breathing immediately; IV furosemide (while the kidneys still make some urine) and possibly dialysis then remove the fluid. Incentive spirometry and suctioning don't remove edema fluid, and a bolus worsens overload."},
 {"type":"sata","ref":"elim-aki","stem":"A client is admitted with AKI after a week of flu with poor oral intake. Potassium is 5.9 mEq/L and creatinine is 2.8 mg/dL (baseline 1.0). Which home medications should the nurse expect to be held? Select all that apply.","options":["Ibuprofen 800 mg three times daily","Lisinopril 20 mg daily","Potassium chloride 20 mEq daily","Levothyroxine 75 mcg daily","Acetaminophen 650 mg as needed for aches"],"answers":[0,1,2],"why":"NSAIDs are nephrotoxic, ACE inhibitors are held during acute injury and volume depletion because they lower GFR and raise potassium, and a potassium supplement would worsen a potassium of 5.9. Levothyroxine and acetaminophen don't harm the injured kidney."},
 {"type":"ordering","ref":"elim-aki","stem":"Place the phases of AKI in the order they occur, as described by their key findings.","items":["Initiation — the insult occurs and creatinine begins to rise","Oliguric — output below 400 mL/day with fluid overload and hyperkalemia","Diuretic — output of 4–5 L/day with hypokalemia and fluid volume deficit","Recovery — GFR returns toward baseline over as long as 12 months"],"why":"AKI moves from the initial insult (initiation) to the oliguric phase (retention of fluid, potassium, and wastes), then the diuretic phase (large output with electrolyte loss as GFR begins to improve), and finally recovery, which can take up to a year and may leave the client with CKD."},
 {"ref":"elim-aki","stem":"A client with hemorrhage-induced hypotension went 2 days before perfusion was restored. The BP is now normal, but urine output remains low, the urine specific gravity is fixed at 1.010, and muddy-brown casts are present. What should the nurse conclude?","options":["The injury has progressed from prerenal to intrarenal acute tubular necrosis","The prerenal injury will resolve with another fluid bolus","A postrenal obstruction has developed","The client has entered the diuretic phase of AKI"],"answer":0,"why":"Prerenal AKI and ischemic ATN are a continuum: if low perfusion isn't corrected quickly, tubular cells die and restoring blood flow no longer fixes the problem. A specific gravity fixed near 1.010 and muddy-brown casts show the tubules can no longer concentrate urine."},
 {"ref":"elim-lytes","stem":"One hour ago, a client with AKI and a potassium of 6.5 mEq/L received regular insulin 10 units IV with 50 mL of D50. Which finding requires the nurse's immediate action?","options":["Potassium 5.2 mEq/L","T waves less peaked than on admission","Heart rate 88/min in sinus rhythm","Blood glucose 58 mg/dL with diaphoresis"],"answer":3,"why":"Insulin drives potassium into cells, and blood glucose must be monitored for hours afterward because hypoglycemia can follow even with D50. A potassium that has fallen to 5.2 mEq/L (back within the 3.5–5.5 range), less-peaked T waves, and a normal rhythm are expected responses to treatment."},
 {"type":"sata","ref":"elim-aki","stem":"The nurse is planning care for an older adult with AKI. Which statements are accurate? Select all that apply.","options":["Infection is a leading cause of death in clients with AKI","Older adults may not regain full kidney function after AKI","Recovery can take up to 12 months, and some clients are left with CKD","IV contrast is the preferred choice for imaging to find the cause","Lactated Ringer's is preferred because it replaces potassium"],"answers":[0,1,2],"why":"Infection is a leading cause of death in AKI, older adults may not recover fully, and recovery can take up to a year with some clients left with CKD. Nephrotoxic contrast must not be used in clients with AKI, and lactated Ringer's is avoided because its potassium can worsen hyperkalemia."},
 {"ref":"elim-kidney-mgmt","stem":"The nurse receives report on four clients with kidney failure. Which client should the nurse see first?","options":["A client on hemodialysis whose BP is 102/64 mmHg after treatment and whose leg cramps have resolved","A client with stage 5 CKD and pericarditis who now has muffled heart sounds, distended neck veins, and BP 88/70 mmHg","A client on peritoneal dialysis whose outflow is blood-tinged on the second exchange after catheter placement yesterday","A client with an AV fistula who has a palpable thrill and reports itching"],"answer":1,"why":"Muffled heart sounds, JVD, and a narrow pulse pressure (18 mmHg) in a client with uremic pericarditis signal cardiac tamponade, an emergency requiring pericardiocentesis. Blood-tinged outflow in the first few exchanges is expected, a thrill means the fistula is patent, and the post-dialysis client is stable."},
 {"type":"sata","ref":"elim-kidney-mgmt","stem":"A client with ESRD on hemodialysis has a bleeding tendency from uremia. Which nursing actions are appropriate? Select all that apply.","options":["Provide a soft-bristled toothbrush","Check emesis and stool for blood and trend the H&amp;H","Avoid aspirin and NSAIDs when possible","Give IM injections instead of oral medications","Continue heparin during dialysis if the platelet count falls sharply"],"answers":[0,1,2],"why":"Uremia impairs platelet function and GI bleeding is a potentially life-threatening complication, so the nurse protects the mucosa, watches for blood loss, and avoids aspirin and NSAIDs. IM injections add bleeding risk, and a sharp platelet drop with heparin suggests heparin-induced thrombocytopenia, which requires stopping heparin."},
 {"ref":"elim-dialysis","stem":"A client is scheduled for hemodialysis at 0900. Which 0730 medication should the nurse expect to hold until after the treatment, per protocol?","options":["Calcium acetate with breakfast","Levothyroxine 100 mcg","Amlodipine 10 mg","Insulin lispro with breakfast based on glucose"],"answer":2,"why":"Antihypertensives are held before hemodialysis because rapid fluid removal commonly causes hypotension. The phosphate binder is given with the meal, and levothyroxine and mealtime insulin are not held for dialysis."},
 {"ref":"elim-dialysis","stem":"Two days after a Tenckhoff catheter is placed, the nurse notices clear fluid leaking around the catheter exit site during a peritoneal dialysis exchange. Which action will confirm whether the fluid is dialysate?","options":["Test the fluid with a glucose test strip","Send the fluid for culture and sensitivity","Test the fluid's pH with litmus paper","Measure the specific gravity of the fluid"],"answer":0,"why":"Dialysate contains dextrose, so a leak of dialysate tests positive on a glucose strip. Smaller fill volumes are used for about 1–2 weeks after placement while the cuffs heal in, to prevent this kind of leak. A culture is sent for cloudy effluent (peritonitis), not a clear leak."},
 {"ref":"elim-dialysis","stem":"After the needles are removed from a client's AV fistula at the end of hemodialysis, one site continues to ooze. What is the nurse's best action?","options":["Apply firm pressure that stops the flow through the fistula for 20 minutes","Wrap the arm tightly with an elastic pressure dressing","Apply a tourniquet above the site until the bleeding stops","Apply just enough pressure to stop the bleeding without occluding the fistula"],"answer":3,"why":"Heparin used during treatment makes needle sites bleed, but occluding the fistula promotes clotting of the access. Gentle pressure that stops the bleeding while keeping flow (a palpable thrill) protects patency; tight wraps and tourniquets are not used on the access arm."},
 {"ref":"m3-meds-renal","stem":"A client on hemodialysis is due for epoetin alfa during today's treatment. Hemoglobin is 11.6 g/dL, and the nurse cannot palpate a thrill or hear a bruit over the left arm AV fistula. What is the nurse's best action?","options":["Give the epoetin as scheduled and recheck the fistula after dialysis","Apply a warm compress to the fistula and give the epoetin","Increase the epoetin dose to strengthen blood flow through the fistula","Hold the epoetin and report the absent thrill and bruit to the provider immediately"],"answer":3,"why":"An absent thrill and bruit means the access may be clotted and must be reported immediately. Epoetin carries a black box warning for thromboembolic events, including clotting of the dialysis access, and it is held when the hemoglobin is above about 10–11 g/dL."},
 {"ref":"elim-lytes","stem":"The nurse is caring for four clients on a renal unit. Which client should the nurse assess first?","options":["A client with a sodium of 116 mEq/L who has become lethargic with new muscle twitching","A client 1 hour after a renal biopsy whose first void is pink-tinged","A client taking furosemide with a potassium of 3.6 mEq/L who asks for a banana","A client collecting a 24-hour urine who forgot to save one void"],"answer":0,"why":"A sodium of 116 with lethargy and twitching means brain cells are swelling, and seizures and coma can follow near 110 mEq/L, so this client is seen first. Pink-tinged urine is common at first after a biopsy, 3.6 is a normal potassium, and a missed void means restarting the collection."},
 {"type":"sata","ref":"m3-meds-diuretics","stem":"IV mannitol is prescribed for a client with acute angle-closure glaucoma who also has CKD stage 3. Which actions should the nurse take? Select all that apply.","options":["Draw up and give the mannitol through a filter needle","Auscultate lung sounds for crackles during and after the infusion","Monitor serum osmolality","Refrigerate the prepared dose until just before hanging it","Expect urine output to decrease as the eye pressure falls"],"answers":[0,1,2],"why":"Mannitol crystallizes, especially when cold, so a filter needle is required and the solution is inspected for crystals — refrigerating it makes crystals more likely. It first pulls fluid into the bloodstream, so a client with reduced kidney function is watched for crackles and pulmonary edema, and serum osmolality is the key lab. Urine output should increase, not decrease."},
 {"ref":"elim-lytes","stem":"The nurse reviews IV fluid prescriptions for four clients. Which prescription should the nurse question?","options":["0.9% sodium chloride for hypovolemia after a GI hemorrhage","0.45% sodium chloride for a client with a traumatic head injury","3% saline by pump for a sodium of 114 mEq/L with seizures in the ICU","0.45% sodium chloride for severe cellular dehydration from HHS"],"answer":1,"why":"Hypotonic fluid moves into cells and can cause cerebral edema, so it is never given to a head-injury client. Isotonic saline replaces vascular volume, hypertonic saline treats severe symptomatic hyponatremia, and hypotonic fluid is appropriate for severe cellular dehydration such as HHS."},
 {"ref":"elim-lytes","stem":"A client with CKD and fluid volume excess has a distended abdomen. Which assessment finding best supports ascites?","options":["Tympany over the entire abdomen","A rigid, board-like abdomen with rebound tenderness","Dullness to percussion and a fluid wave felt across the abdomen","Hyperactive bowel sounds in all four quadrants"],"answer":2,"why":"A fluid-filled abdomen percusses dull (air is tympanic) and produces a positive fluid wave when one side is tapped. A rigid, board-like abdomen with rebound tenderness suggests peritonitis, and bowel sounds don't identify ascites."},
 {"ref":"elim-lytes","stem":"A client with CKD has gained 2 kg in 2 days, has 2+ ankle edema, a headache, and mild confusion. Serum sodium is 128 mEq/L. Which prescription should the nurse question?","options":["Sodium chloride tablets 1 g PO three times daily","Fluid restriction of 1,000 mL/24 hours","Neuro checks every 4 hours with seizure precautions","Daily weight on the same scale"],"answer":0,"why":"Weight gain and edema with a low sodium mean dilutional hyponatremia — too much water, not too little sodium. The treatment is to remove the water (fluid restriction), not to add salt, which worsens the overload. Neuro checks and daily weights are appropriate."},
 {"ref":"elim-keyterms","stem":"A febrile client has a new order for a urine culture and sensitivity and a first dose of IV ceftriaxone. The antibiotic is due now, but the client can't void yet. What is the nurse's best action?","options":["Give the antibiotic now and collect the urine when the client is able to void","Obtain the urine specimen first (by straight catheter if prescribed), then start the antibiotic","Send a urinalysis instead, since the culture is less important than timely antibiotics","Collect urine from the client's bedpan once the client voids"],"answer":1,"why":"A culture must be collected before antibiotics start, or the results may be falsely negative. If the client can't provide a clean-catch midstream specimen, a straight catheter specimen is obtained in a sterile container. A bedpan specimen isn't sterile."},
 {"ref":"elim-keyterms","stem":"A client with an upper GI bleed has a BUN of 38 mg/dL and a creatinine of 0.9 mg/dL. How should the nurse interpret these results?","options":["The client has intrinsic kidney failure with uremia","BUN is raised by the bleeding and volume loss, while the normal creatinine — the more specific marker — suggests kidney function is not yet impaired","Both values show azotemia from nephrotoxic injury","The results are inconsistent and should be redrawn before any action"],"answer":1,"why":"BUN is also raised by GI bleeding (digested blood protein), dehydration, and catabolism, so it is less specific than creatinine. A normal creatinine with a BUN:creatinine ratio above 20:1 points to a prerenal picture rather than intrinsic kidney damage, and the client is monitored for falling perfusion."},
 {"ref":"elim-lytes","stem":"A client with ESRD has a potassium of 6.9 mEq/L with peaked T waves. Which prescribed treatment actually removes potassium from the body?","options":["Calcium chloride IV","Regular insulin IV with 50% dextrose","Nebulized albuterol","Hemodialysis"],"answer":3,"why":"Calcium stabilizes the heart without lowering potassium, and insulin with dextrose and albuterol only shift potassium into cells temporarily — it drifts back out within hours. Dialysis, binders, and diuretics (if the kidneys make urine) remove it."},
 {"type":"sata","ref":"elim-lytes","stem":"An older adult with 3 days of fever and poor oral intake has a serum sodium of 153 mEq/L. Which findings would the nurse expect? Select all that apply.","options":["Intense thirst","Flushed skin with a low-grade fever","Restlessness and agitation","Diminished deep tendon reflexes","Weight gain with crackles"],"answers":[0,1,2],"why":"SALT: Skin flushed, Agitation, Low-grade fever, Thirst. Cells shrink in hypernatremia, causing restlessness, twitching, and hyperreflexia (not diminished reflexes). Water loss brings dry membranes and weight loss rather than weight gain and crackles."},
 {"ref":"elim-nephrotic","stem":"The nurse receives report on four clients. Which client should the nurse assess first?","options":["A client with nephrotic syndrome who suddenly reports sharp chest pain with breathing, dyspnea, and an SpO₂ of 88%","A client with acute glomerulonephritis who has periorbital edema, cola-colored urine, and a BP of 146/90 mmHg","A client on day 2 of IV antibiotics for pyelonephritis with a temperature of 100.2°F and flank pain of 4/10","A client with polycystic kidney disease who reports nocturia and has a BP of 148/90 mmHg"],"answer":0,"why":"Clotting proteins lost in the urine make the nephrotic client hypercoagulable; sudden pleuritic chest pain, dyspnea, and hypoxemia suggest pulmonary embolism, an emergency. Periorbital edema, cola-colored urine, and moderate hypertension are expected in glomerulonephritis, the pyelonephritis client is improving, and the PKD findings are chronic."},
 {"type":"sata","ref":"elim-nephrotic","stem":"A client with nephrotic syndrome is receiving prednisone and furosemide. Which findings require the nurse's follow-up? Select all that apply.","options":["Unilateral calf swelling and pain","Sudden shortness of breath with pleuritic chest pain","Temperature of 101°F with a new productive cough","Foamy urine","Periorbital edema in the morning"],"answers":[0,1,2],"why":"Clotting proteins lost in the urine make the blood hypercoagulable (DVT, pulmonary embolism), and lost immunoglobulins plus steroids raise infection risk. Foamy urine and edema are expected hallmarks of nephrotic syndrome."},
 {"ref":"elim-nephrosclerosis","stem":"A client with nephrosclerosis asks why the provider keeps adjusting blood pressure medications when the client feels fine. Which explanation is accurate?","options":["High blood pressure only affects the kidneys once symptoms appear","Blood pressure control prevents the cysts from enlarging","The pills are needed only until the kidney infection clears","High pressure hardens the kidney's arteries, and the damaged kidney activates hormones that raise pressure further"],"answer":3,"why":"Nephrosclerosis is hardening of the renal arteries from long-standing hypertension. The ischemic kidney activates the renin–angiotensin–aldosterone system, raising BP further, so aggressive BP control is the only way to slow progression — even without symptoms."},
 {"ref":"elim-nephrotic","stem":"Which diet order should the nurse anticipate for a client with nephrotic syndrome and anasarca?","options":["High-protein diet to replace the protein lost in the urine","Fluid intake of at least 3 L/day to flush the kidneys","High-sodium diet to raise the blood pressure","Low-sodium, low-saturated-fat diet with moderate protein"],"answer":3,"why":"Nephrotic syndrome calls for a low-sodium diet to limit edema, low saturated fat for the hyperlipidemia, and moderate — not high — protein. Extra protein doesn't correct the loss and adds stress on the glomerulus."},
 {"ref":"elim-nephrotic","stem":"Which finding best distinguishes nephrotic syndrome from acute glomerulonephritis?","options":["Cola-colored urine with an elevated ASO titer","Anasarca with a normal blood pressure and a cholesterol of 310 mg/dL","Hypertension with periorbital edema","Palpable enlarged kidneys and a parent on dialysis"],"answer":1,"why":"Nephrotic syndrome brings massive proteinuria, hypoalbuminemia, severe edema, and hyperlipidemia with normal or low BP. Cola-colored urine, a positive ASO titer, and hypertension point to glomerulonephritis; enlarged kidneys with a family history point to PKD."},
 {"ref":"elim-pyelo","stem":"Ten minutes into an IV vancomycin infusion for pyelonephritis, a client develops itching and flushing of the face, neck, and upper chest. BP is 124/78 mmHg and breathing is unlabored. What is the nurse's best action?","options":["Stop the infusion, then restart it more slowly as ordered after notifying the provider","Increase the rate to finish the dose before the reaction worsens","Continue the infusion and apply cool compresses","Give a dose of ciprofloxacin instead"],"answer":0,"why":"Flushing and itching of the head, face, neck, and upper torso during vancomycin is red man syndrome, caused by infusing too quickly. The infusion is stopped and resumed at a slower rate per the provider; speeding it up worsens the reaction, and the nurse cannot substitute another antibiotic."},
 {"type":"sata","ref":"elim-pyelo","stem":"A client is admitted with acute pyelonephritis. Which actions should the nurse include in the plan of care? Select all that apply.","options":["Collect a urine culture before the first antibiotic dose","Encourage 2–3 L of fluid per day unless contraindicated","Apply warm, moist heat to the flank for pain","Restrict fluids to 1 L/day to rest the kidney","Stop the antibiotics once the client has been afebrile for 24 hours"],"answers":[0,1,2],"why":"Cultures are collected before antibiotics, high fluid intake flushes bacteria, and moist heat eases flank pain. Fluids are not restricted, and the full antibiotic course must be finished to clear the infection and prevent scarring."},
 {"ref":"elim-pkd","stem":"A client with ADPKD has a temperature of 102.2°F, chills, worsening right flank pain, a WBC of 15,800/mm³, and cloudy urine. Which prescription should the nurse anticipate?","options":["Ibuprofen around the clock for the flank pain","Tolvaptan to slow cyst growth","Antibiotics for an infected cyst, with possible percutaneous drainage","Genetic testing to confirm the diagnosis"],"answer":2,"why":"Fever, chills, flank pain, and leukocytosis in PKD point to an infected cyst, treated with antibiotics and sometimes percutaneous drainage for an abscess. NSAIDs are avoided in PKD, tolvaptan is a long-term therapy, and genetic testing doesn't treat the infection."},
 {"type":"sata","ref":"elim-pkd","stem":"The nurse is teaching a client with polycystic kidney disease. Which instructions are appropriate? Select all that apply.","options":["Apply dry heat to the flank or abdomen for comfort","Report bright red urine promptly","Take ibuprofen for flank pain","Prevent constipation with fiber, fluids, and activity","Restrict all sodium and water in early disease"],"answers":[0,1,3],"why":"Dry heat eases cyst pain, gross hematuria can mean a cyst has ruptured, and enlarged kidneys press on the colon, so constipation is prevented. NSAIDs are avoided (bleeding and nephrotoxicity), and in early PKD some clients lose sodium, so sodium and water may actually be encouraged as prescribed."},
 {"ref":"elim-gn","stem":"A 24-year-old client had a sore throat 2 weeks ago and now has periorbital edema, BP 168/100 mmHg, cola-colored urine, and an elevated ASO titer. Which prescription should the nurse question?","options":["Sodium restriction","Antihypertensive medication","Encourage 3 L of fluid per day","Daily weights"],"answer":2,"why":"Acute poststreptococcal glomerulonephritis causes sodium and water retention, so care includes sodium and fluid restriction, antihypertensives, and daily weights. Pushing 3 L of fluid (appropriate for pyelonephritis) would worsen the overload and hypertension."},
 {"ref":"elim-nephrosclerosis","stem":"The nurse teaches a client with benign nephrosclerosis. Which statement indicates the teaching was effective?","options":["\"I can stop my blood pressure pills once my readings are normal.\"","\"I'll take my blood pressure medicine every day even when I feel fine, and I'll quit smoking.\"","\"I'll eat extra protein to help my kidneys heal.\"","\"This disease causes symptoms early, so I'll know when it gets worse.\""],"answer":1,"why":"Aggressive, continuous BP control is the only way to slow progression, and smoking cessation is part of the lifestyle plan. Nephrosclerosis is a \"silent killer\" with few early symptoms, so the client can't rely on feeling unwell, and stopping medication lets pressure climb."},
 {"ref":"sens-emergencies","stem":"The eye clinic nurse is returning four phone calls. Which caller should the nurse speak with first?","options":["A client with dry AMD who noticed this morning that the lines on her Amsler grid look wavy","A client with diabetic retinopathy asking to schedule an annual dilated exam","A client with left hemianopsia after a stroke asking whether he may drive","A client who splashed drain cleaner into his eye 5 minutes ago"],"answer":3,"why":"Chemical exposure — especially an alkali like drain cleaner, which penetrates deeply — needs immediate, copious irrigation for at least 15 minutes before anything else. The Amsler grid change is reported promptly (possible wet AMD) but is not a minutes-count emergency."},
 {"type":"sata","ref":"sens-hemianopsia","stem":"A client had a right-hemisphere stroke 2 days ago and has left homonymous hemianopsia. Which actions are appropriate in this acute phase? Select all that apply.","options":["Place the call light and water pitcher on the client's right side","Approach and speak to the client from the right side","Teach the client to turn the head to the left to scan the environment","Place all meal-tray items on the client's left side","Tell the family the new glasses the client needs will correct the problem"],"answers":[0,1,2],"why":"A right-brain stroke causes loss of the left visual field, so in the acute phase items and approach go on the unaffected (right) side, and the client learns to scan toward the blind side. Placing everything on the left comes later in rehabilitation, if at all, and hemianopsia is a brain problem that glasses don't fix."},
 {"ref":"sens-aphasia","stem":"After a left-hemisphere stroke, a client speaks in long, fluent sentences that make little sense and does not follow the nurse's instructions. Which approach is most effective?","options":["Ask yes/no questions and wait for a verbal answer","Speak louder and repeat the instructions","Use gestures, demonstration, and pictures with short, one-step instructions","Give written instructions for the client to read"],"answer":2,"why":"Fluent speech with poor comprehension is receptive (Wernicke's) aphasia; the client can't understand spoken or written language, so gestures, demonstration, and pictures with simple one-step instructions work best. Yes/no questions suit expressive aphasia, and shouting doesn't help."},
 {"ref":"sens-menieres","stem":"During an acute vertigo attack, a client with Ménière's disease says she needs to urinate. What is the nurse's best action?","options":["Have her walk to the bathroom with her walker and call when finished","Insert an indwelling catheter to avoid getting her up","Help her to the bedside commode with the bed in the low position and stay with her","Turn on the overhead lights so she can see the path clearly"],"answer":2,"why":"Safety and fall prevention come first during an attack: the client must not walk alone, a bedside commode keeps the distance short, and the room stays quiet and dark because bright light worsens vertigo. A catheter adds infection risk without need."},
 {"ref":"sens-retinopathy","stem":"A client with nephrosclerosis has a BP of 236/130 mmHg, a severe headache, and blurred vision. The provider notes retinal hemorrhages and optic disc swelling. How should the nurse interpret these findings?","options":["Expected silver wiring that needs routine follow-up only","Dry age-related macular degeneration","Hypertensive emergency with retinopathy requiring immediate BP management","A cataract causing blurred vision"],"answer":2,"why":"Severe hypertension can cause retinal hemorrhages and optic disc swelling; visual changes and headache with very high BP are a hypertensive emergency cue, sharing the vascular process of nephrosclerosis. Silver wiring is the chronic finding, not an emergency."},
 {"ref":"sens-amd","stem":"A client had photodynamic therapy for wet AMD this morning. She asks whether she can sit outside at her grandson's soccer game tomorrow afternoon. What is the nurse's best response?","options":["\"You'll need to keep your skin covered and stay out of sunlight for 5 days, so the game isn't safe to attend outdoors.\"","\"Yes, as long as you wear sunglasses.\"","\"Yes, the treatment only affects your eyes.\"","\"You can go if you sit in the shade for the first hour.\""],"answer":0,"why":"The light-activated drug remains in the skin, so sunlight can cause burns. The client must keep skin covered and avoid intense light and sunlight for 5 days; sunglasses or partial shade don't protect the skin."},
 {"ref":"sens-hemianopsia","stem":"Which client description is most consistent with hemianopsia?","options":["\"There's a dark blur in the middle of everything I look at.\"","\"I see patchy dark spots, and my vision changes from day to day.\"","\"I keep bumping into doorframes on one side and only eat half my plate.\"","\"I saw flashes of light, then a painless curtain came down.\""],"answer":2,"why":"Hemianopsia cuts off half of the visual field, so the client misses objects on one side. A central blur is AMD, patchy fluctuating vision is diabetic retinopathy, and flashes followed by a curtain signal retinal detachment."},
 {"ref":"sens-emergencies","stem":"A client has a hyphema after being struck in the eye by a baseball. Which prescription should the nurse question?","options":["Semi-Fowler's position with the HOB at 30–45 degrees","Ibuprofen 400 mg PO every 6 hours for pain","Eye shield over the affected eye","Cycloplegic eye drops as ordered"],"answer":1,"why":"Aspirin and NSAIDs such as ibuprofen are avoided with a hyphema because they increase bleeding. Semi-Fowler's positioning helps the blood settle, and an eye shield and cycloplegic drops are expected care."},
 {"type":"fitb","ref":"mathdose","stem":"A client on hemodialysis is prescribed sevelamer 4,800 mg per day, divided equally among the meals the client actually eats. Sevelamer is supplied as 800 mg tablets. Today the client skipped breakfast and will eat only lunch and dinner. How many tablets should the nurse give with each meal? Record your answer to the nearest whole number.","answer":3,"why":"Dose per meal = daily dose ÷ meals eaten = 4,800 mg ÷ 2 = 2,400 mg. Tablets = (Desired ÷ Have) × Quantity = (2,400 mg ÷ 800 mg) × 1 tablet = 3 tablets with each meal, given with the first bite. No meal, no binder."},
 {"type":"fitb","ref":"mathiv","stem":"A client with prerenal AKI from dehydration is prescribed 500 mL of 0.9% sodium chloride over 2 hours. No pump is available, and the gravity tubing has a drop factor of 20 gtt/mL. How many drops per minute should the nurse set? Record your answer to the nearest whole number.","answer":83,"why":"2 hours = 120 minutes. (500 mL × 20 gtt/mL) ÷ 120 min = 10,000 ÷ 120 = 83.3, rounded to 83 gtt/min."},
 {"type":"fitb","ref":"m3math-renal","stem":"A client with CKD and fluid overload is prescribed furosemide 160 mg IV, mixed in 100 mL of normal saline. High-dose IV furosemide must not infuse faster than 4 mg/min. What is the maximum rate, in mL/hr, the nurse may set on the pump? Record your answer to the nearest whole number.","answer":150,"why":"Concentration: 160 mg ÷ 100 mL = 1.6 mg/mL. Maximum mL/min: 4 mg/min ÷ 1.6 mg/mL = 2.5 mL/min. × 60 = 150 mL/hr. (Check: 160 mg ÷ 4 mg/min = 40 minutes minimum; 100 mL ÷ 40 min = 2.5 mL/min = 150 mL/hr.)"},
 {"type":"fitb","ref":"m3math-renal","stem":"A client with CKD has the following 8-hour shift totals. Intake: oral fluids 480 mL, ice chips 300 mL, two IV piggyback antibiotics of 50 mL each, and maintenance IV fluid at 30 mL/hr for the full 8 hours. Output: urine 310 mL and NG tube drainage 200 mL. What is the client's net fluid balance in mL? Record your answer to the nearest whole number (use a negative number for a negative balance).","answer":460,"why":"Intake: 480 + 150 (ice chips count as half of 300) + 100 (2 × 50) + 240 (30 mL/hr × 8 hr) = 970 mL. Output: 310 + 200 = 510 mL. Net: 970 − 510 = +460 mL, a positive balance (fluid retention)."},
 {"type":"fitb","ref":"m3math-dialysis","stem":"A client on peritoneal dialysis completes three exchanges, each with 2,000 mL instilled. The outflows are 2,300 mL, 2,100 mL, and 1,900 mL. The client also voids 350 mL. What is the net volume of fluid removed by peritoneal dialysis, in mL? Record your answer to the nearest whole number.","answer":300,"why":"Net ultrafiltration = outflow − inflow for each exchange: (2,300 − 2,000) + (2,100 − 2,000) + (1,900 − 2,000) = 300 + 100 − 100 = 300 mL removed. The 350 mL voided is not dialysate; it is recorded separately as true urine output."}
]
});

Object.assign(QUIZ, {
"m3-abgquiz":[
 {stem:"A client's ABG shows pH 7.28, PaCO₂ 55 mmHg, HCO₃⁻ 24 mEq/L. How should the nurse interpret this result?",
  options:["Partially compensated respiratory acidosis","Uncompensated metabolic acidosis","Uncompensated respiratory acidosis","Fully compensated respiratory acidosis"],
  answer:2,
  why:"The pH is low (acidosis) and the PaCO₂ is high (acid excess), which matches — so the lungs are the cause. The HCO₃⁻ is normal, so the kidneys have not started compensating: uncompensated. Partial compensation would require a high HCO₃⁻, and full compensation a normal pH.",
  ref:"elim-abg-practice"},
 {stem:"A client's ABG shows pH 7.25, PaCO₂ 40 mmHg, HCO₃⁻ 15 mEq/L. Which interpretation is correct?",
  options:["Uncompensated metabolic acidosis","Uncompensated respiratory acidosis","Partially compensated metabolic acidosis","Fully compensated metabolic acidosis"],
  answer:0,
  why:"The pH is low (acidosis) and the HCO₃⁻ is low (base deficit), which matches — metabolic. The PaCO₂ of 40 is normal, so the lungs have not compensated yet: uncompensated. With partial compensation the PaCO₂ would also be low.",
  ref:"elim-abg-practice"},
 {stem:"A client's ABG shows pH 7.49, PaCO₂ 30 mmHg, HCO₃⁻ 20 mEq/L. How should the nurse interpret this result?",
  options:["Uncompensated respiratory alkalosis","Fully compensated respiratory alkalosis","Partially compensated metabolic acidosis","Partially compensated respiratory alkalosis"],
  answer:3,
  why:"The pH is high (alkalosis) and the PaCO₂ is low (acid deficit), which matches — respiratory. The HCO₃⁻ is also abnormal (low), so the kidneys have started to compensate, but the pH is still abnormal: all three values abnormal = partially compensated. It is not fully compensated because the pH is out of range.",
  ref:"elim-abg"},
 {stem:"A client's ABG shows pH 7.50, PaCO₂ 49 mmHg, HCO₃⁻ 33 mEq/L. Which interpretation is correct?",
  options:["Partially compensated respiratory acidosis","Partially compensated metabolic alkalosis","Uncompensated metabolic alkalosis","Fully compensated metabolic alkalosis"],
  answer:1,
  why:"The pH is high (alkalosis). The HCO₃⁻ is high (base excess), which matches — metabolic. The PaCO₂ is also high because the lungs are retaining CO₂ to compensate, but the pH is still abnormal, so all three are abnormal: partially compensated. Respiratory acidosis would require a low pH.",
  ref:"elim-abg"},
 {stem:"A client's ABG shows pH 7.36, PaCO₂ 29 mmHg, HCO₃⁻ 17 mEq/L. How should the nurse interpret this result?",
  options:["Fully compensated respiratory alkalosis","Partially compensated metabolic acidosis","Fully compensated metabolic acidosis","Uncompensated metabolic acidosis"],
  answer:2,
  why:"The pH is normal, but it leans toward the acid side (below 7.40), so the underlying problem is acidosis. A low HCO₃⁻ causes acidosis, so the kidneys are the problem child; the low PaCO₂ is the lungs compensating. Respiratory alkalosis would require the pH to lean above 7.40, and partial compensation would require an abnormal pH.",
  ref:"elim-abg-practice"},
 {stem:"A client's ABG shows pH 7.44, PaCO₂ 48 mmHg, HCO₃⁻ 32 mEq/L. Which interpretation is correct?",
  options:["Fully compensated metabolic alkalosis","Fully compensated respiratory acidosis","Partially compensated metabolic alkalosis","Uncompensated respiratory acidosis"],
  answer:0,
  why:"The pH is normal but leans alkaline (above 7.40), so the underlying problem is alkalosis. A high HCO₃⁻ causes alkalosis, so the kidneys are the problem child; the high PaCO₂ is the lungs retaining CO₂ to compensate. Respiratory acidosis would make the pH lean below 7.40.",
  ref:"elim-abg-practice"},
 {stem:"A client's ABG shows pH 7.35, PaCO₂ 45 mmHg, HCO₃⁻ 26 mEq/L. How should the nurse interpret this result?",
  options:["Uncompensated respiratory acidosis","Fully compensated respiratory acidosis","Uncompensated metabolic acidosis","Normal acid–base balance"],
  answer:3,
  why:"Every value sits exactly at the edge of its normal range: pH 7.35 (7.35–7.45), PaCO₂ 45 (35–45), HCO₃⁻ 26 (22–26). Boundary values count as normal, and with no abnormal PaCO₂ or HCO₃⁻ there is nothing to compensate for — this is a normal gas, not an acidosis.",
  ref:"ws-abg-chart"},
 {stem:"A client's ABG shows pH 7.34, PaCO₂ 46 mmHg, HCO₃⁻ 26 mEq/L. Which interpretation is correct?",
  options:["Normal acid–base balance","Uncompensated respiratory acidosis","Partially compensated respiratory acidosis","Uncompensated metabolic acidosis"],
  answer:1,
  why:"The pH of 7.34 is just below 7.35 (acidosis), and the PaCO₂ of 46 is just above 45 (acid excess), so the lungs are the cause. The HCO₃⁻ of 26 is still within 22–26, so the kidneys have not compensated: uncompensated. It is not partially compensated because the HCO₃⁻ is not yet abnormal.",
  ref:"ws-abg-chart"},
 {stem:"A client's ABG shows pH 7.45, PaCO₂ 33 mmHg, HCO₃⁻ 21 mEq/L. How should the nurse interpret this result?",
  options:["Partially compensated respiratory alkalosis","Fully compensated metabolic acidosis","Fully compensated respiratory alkalosis","Uncompensated respiratory alkalosis"],
  answer:2,
  why:"A pH of 7.45 is at the top of the normal range, so the gas is compensated, and it leans alkaline (above 7.40). A low PaCO₂ causes alkalosis, so the lungs are the problem child; the low HCO₃⁻ is the kidneys compensating. It is not partially compensated because the pH is still within 7.35–7.45.",
  ref:"elim-abg"},
 {type:"matrix", stem:"The nurse reviews ABG results for several clients. Classify each gas by its compensation status.",

  cols:["Uncompensated","Partially compensated","Fully compensated"],

 {type:"matrix", stem:"For each ABG, identify whether the primary problem (the \"problem child\") is respiratory or metabolic.",

 {type:"dragdrop", stem:"Sort each individual ABG value by what it indicates on its own.",
  items:["PaCO₂ 50 mmHg","HCO₃⁻ 19 mEq/L","PaCO₂ 30 mmHg","HCO₃⁻ 29 mEq/L","pH 7.35","PaCO₂ 45 mmHg"],

 {type:"ordering", stem:"Place the steps for interpreting an ABG in the correct order.",

  why:"Start with the pH because it defines the problem (acidosis or alkalosis), then check CO₂ (lungs) and HCO₃⁻ (kidneys). The value that matches the pH is the cause; the status of the other value, together with the pH, determines the level of compensation.",

 {stem:"A client with acute kidney injury has an ABG showing metabolic acidosis. Which compensatory finding should the nurse expect?",

 {stem:"A postoperative client using a morphine PCA has a respiratory rate of 8/min. The ABG shows pH 7.27, PaCO₂ 58 mmHg, HCO₃⁻ 25 mEq/L, PaO₂ 68 mmHg, SaO₂ 89%. What is the nurse's priority action?",

 {stem:"A client is breathing rapidly, reports tingling in the fingers, and says \"I feel like I can't calm down.\" The ABG shows pH 7.50, PaCO₂ 29 mmHg, HCO₃⁻ 24 mEq/L. Which action should the nurse take first?",

 {type:"sata", stem:"The nurse is caring for several clients. Which clients are at risk for metabolic acidosis? Select all that apply.",

 {stem:"Severe itching and calcium deposits in the soft tissues of a client with ESRD.", options:["Hypophosphatemia","Hypercalcemia","Hyponatremia","Hyperphosphatemia"], answer:3, why:"High phosphorus causes pruritus and calcium–phosphate deposits in soft tissue, vessels, heart, and lungs. It's part of the renal failure pattern.", ref:"elim-lytes"},
 {stem:"Profound muscle weakness and dysphagia after a client doubled their own sevelamer doses.", options:["Hypophosphatemia","Hyperphosphatemia","Hypermagnesemia","Hypernatremia"], answer:0, why:"Overusing phosphate binders can drive phosphorus below 2.5 mg/dL; muscle weakness is the most common sign, along with dysphagia, confusion, and respiratory failure.", ref:"m3chart-imbalances"},
 {stem:"Kidney stones, constipation, and bone pain in a client taking calcitriol.", options:["Hypocalcemia","Hypercalcemia","Hypophosphatemia","Hyperkalemia"], answer:1, why:"Active vitamin D raises calcium absorption; too much causes hypercalcemia — stones, constipation, bone pain, weakness, and confusion.", ref:"m3chart-imbalances"},
 {stem:"Thirst, flushed skin, agitation, and a low-grade fever.", options:["Hyponatremia","Hypermagnesemia","Hypernatremia","Fluid volume overload"], answer:2, why:"SALT — Skin flushed, Agitation, Low-grade fever, Thirst — is hypernatremia: too little water for the sodium, so cells shrink.", ref:"elim-lytes"},
 {stem:"Headache, confusion, and nausea in a client with SIADH.", options:["Hyponatremia","Hypernatremia","Hypokalemia","Hypercalcemia"], answer:0, why:"SIADH retains water, diluting sodium. Water moves into brain cells, so hyponatremia shows up as neuro changes — headache, confusion, nausea, then seizures.", ref:"elim-lytes"},
 {stem:"Crackles, JVD, and bounding pulses in a client who missed dialysis.", options:["Fluid volume deficit","Hypokalemia","Hypernatremia","Fluid volume overload"], answer:3, why:"Crackles, JVD, bounding pulses, and hypertension are fluid volume excess — a missed dialysis run means the fluid has nowhere to go.", ref:"elim-lytes"},
 {stem:"Weak, thready pulse and poor skin turgor in a client in the diuretic phase of AKI.", options:["Fluid volume overload","Fluid volume deficit","Hyperkalemia","Hypermagnesemia"], answer:1, why:"The diuretic phase puts out 4–5 L/day, so the risk flips to fluid volume deficit — tachycardia, hypotension, weak pulses, poor turgor.", ref:"elim-aki"},

 {stem:"Hematocrit is falling while hemoglobin stays stable.", options:["Fluid volume overload","Fluid volume deficit","Hypernatremia","Hyperphosphatemia"], answer:0, why:"Hematocrit is a percentage, so added water drops it while the absolute hemoglobin holds steady — dilution from fluid gain. Both falling together suggests bleeding.", ref:"elim-lytes"},
 {stem:"BUN:creatinine ratio of 28:1 with dark, concentrated urine.", options:["Fluid volume overload","Hyperkalemia","Fluid volume deficit","Hyponatremia"], answer:2, why:"A ratio above 20:1 with concentrated urine points to underperfusion from volume loss — fluid volume deficit and prerenal azotemia.", ref:"m3chart-imbalances"},

 {stem:"\"Carrying my grocery bags on my fistula arm will help keep it strong.\"", options:["Understands","Needs more teaching"], answer:1, noShuffle:true, why:"No heavy carrying, tight clothing, or sleeping on the access arm. Squeezing a ball helps a new fistula mature; heavy loads can compress it.", ref:"elim-dialysis"},
 {stem:"\"I'll warm my peritoneal dialysis bags in the microwave so they're body temperature.\"", options:["Understands","Needs more teaching"], answer:1, noShuffle:true, why:"Microwaves heat unevenly and can burn the peritoneum. Use a commercial dialysate warmer.", ref:"elim-dialysis"},
 {stem:"\"If my hemoglobin gets above about 11, my epoetin shot may be held.\"", options:["Understands","Needs more teaching"], answer:0, noShuffle:true, why:"Epoetin is held when Hgb rises above about 10–11 g/dL because higher levels raise stroke, MI, and clot risk.", ref:"m3-meds-renal"},
 {stem:"\"After my timolol drop, I'll press on the inner corner of my eye for a minute or two.\"", options:["Understands","Needs more teaching"], answer:0, noShuffle:true, why:"Punctal occlusion for 1–2 minutes limits systemic absorption, preventing bradycardia, hypotension, and bronchospasm.", ref:"m3-meds-eyedrops"},
 {stem:"\"I'll use my latanoprost drops twice a day so they work even better.\"", options:["Understands","Needs more teaching"], answer:1, noShuffle:true, why:"Latanoprost is given once nightly — using it more often can actually make it less effective.", ref:"m3-meds-eyedrops"},
 {stem:"\"After my cataract surgery, I'll sleep on my back or on the side that wasn't operated on.\"", options:["Understands","Needs more teaching"], answer:0, noShuffle:true, why:"Positioning off the operative side avoids pressure on the eye; the client also wears a shield at night.", ref:"sens-cataract"},
 {stem:"A client awaiting retinal detachment repair says, \"Both of my eyes are covered because my eyes move together.\"", options:["Understands","Needs more teaching"], answer:0, noShuffle:true, why:"Both eyes are patched to minimize eye movement until surgery, since moving the good eye moves the affected eye.", ref:"sens-retina"},
 {stem:"\"For my Ménière's, I'll keep sodium to about 1,000 to 2,000 mg a day and cut out caffeine.\"", options:["Understands","Needs more teaching"], answer:0, noShuffle:true, why:"A low-sodium diet reduces endolymph fluid retention, and caffeine, alcohol, and MSG are common triggers to avoid.", ref:"sens-menieres"},
 {stem:"\"I'll leave my hearing aid in when I shower so I don't misplace it.\"", options:["Understands","Needs more teaching"], answer:1, noShuffle:true, why:"Hearing aids are removed for bathing and at night and kept away from water, heat, and hair spray; store them in a labeled, dry case.", ref:"sens-hearing"},
 {stem:"\"Once my fever and flank pain go away, I can stop the antibiotics for my kidney infection.\"", options:["Understands","Needs more teaching"], answer:1, noShuffle:true, why:"The full course (often about 2 weeks) must be finished to clear the infection and prevent kidney scarring, followed by a repeat culture.", ref:"elim-pyelo"},
 {stem:"\"I'll spread my fluid allowance across the whole day and use ice chips and mouth care when I'm thirsty.\"", options:["Understands","Needs more teaching"], answer:0, noShuffle:true, why:"Spacing the allowance over 24 hours with sips, ice chips, and frequent mouth care makes a fluid restriction easier to keep.", ref:"elim-kidney-mgmt"},
 {stem:"\"I only need to weigh myself on days when my ankles look puffy.\"", options:["Understands","Needs more teaching"], answer:1, noShuffle:true, why:"Daily weights — same time, same scale, same clothing — catch fluid gain before edema shows; 1 kg equals about 1 L.", ref:"elim-lytes"},
 {stem:"\"Loose stools are normal with my Kayexalate, but I'll call about severe belly pain or no bowel movement.\"", options:["Understands","Needs more teaching"], answer:0, noShuffle:true, why:"Sorbitol causes loose stools on purpose; severe pain, bloating, or no stool could mean impaction or intestinal necrosis.", ref:"m3-meds-lytes"}
],
"game-numberline":[
 {stem:"K⁺ 6.2 mEq/L", options:["Low","Normal","High"], answer:2, noShuffle:true, why:"The course range is 3.5–5.5 mEq/L, so 6.2 is hyperkalemia — put the client on a cardiac monitor and look for peaked T waves.", ref:"m3nums-lytes"},
 {stem:"K⁺ 5.5 mEq/L (course range)", options:["Low","Normal","High"], answer:1, noShuffle:true, why:"Using the course range of 3.5–5.5 mEq/L, 5.5 is the top of normal. Hyperkalemia is above 5.5 — though spironolactone is still contraindicated above 5.0.", ref:"m3nums-lytes"},
 {stem:"K⁺ 3.1 mEq/L in a client on furosemide", options:["Low","Normal","High"], answer:0, noShuffle:true, why:"Below 3.5 is hypokalemia; loop diuretics waste potassium and raise the risk of digoxin toxicity.", ref:"m3nums-lytes"},
 {stem:"Calcium 7.8 mg/dL", options:["Low","Normal","High"], answer:0, noShuffle:true, why:"Normal calcium is about 8.5–10.5 mg/dL; 7.8 is hypocalcemia — check for Chvostek's and Trousseau's signs.", ref:"m3nums-lytes"},
 {stem:"Calcium 10.5 mg/dL", options:["Low","Normal","High"], answer:1, noShuffle:true, why:"10.5 is the upper limit of the 8.5–10.5 mg/dL range, so it's still normal.", ref:"m3nums-lytes"},
 {stem:"Phosphorus 6.1 mg/dL in a client with stage 4 CKD", options:["Low","Normal","High"], answer:2, noShuffle:true, why:"The target for CKD stages 3–4 is 2.7–4.6 mg/dL; 6.1 is high — binders with meals and a low-phosphorus diet.", ref:"m3nums-lytes"},
 {stem:"Phosphorus 2.1 mg/dL", options:["Low","Normal","High"], answer:0, noShuffle:true, why:"Below 2.5 mg/dL is hypophosphatemia — review binder use and watch for muscle weakness.", ref:"m3nums-lytes"},
 {stem:"Magnesium 3.4 mEq/L", options:["Low","Normal","High"], answer:2, noShuffle:true, why:"Normal is about 1.5–2.5 mEq/L. Around 3, expect warmth, flushing, mild hypotension, and nausea; check DTRs.", ref:"m3nums-lytes"},
 {stem:"Magnesium 1.2 mEq/L", options:["Low","Normal","High"], answer:0, noShuffle:true, why:"Below 1.5 mEq/L is hypomagnesemia — seizure precautions and monitor K⁺ and Ca²⁺, which tend to fall with it.", ref:"m3nums-lytes"},
 {stem:"Sodium 128 mEq/L in a client with fluid overload", options:["Low","Normal","High"], answer:0, noShuffle:true, why:"Below 135 is hyponatremia; with overload it's dilutional — restrict fluid rather than add salt.", ref:"m3nums-lytes"},
 {stem:"Sodium 145 mEq/L", options:["Low","Normal","High"], answer:1, noShuffle:true, why:"145 is the top of the 135–145 mEq/L range — normal. Hypernatremia is above 145.", ref:"m3nums-lytes"},
 {stem:"Sodium 152 mEq/L", options:["Low","Normal","High"], answer:2, noShuffle:true, why:"Above 145 is hypernatremia — replace water gradually over about 48 hours to avoid cerebral edema.", ref:"m3nums-lytes"},
 {stem:"Intraocular pressure 28 mmHg", options:["Low","Normal","High"], answer:2, noShuffle:true, why:"Normal IOP is about 10–21 mmHg; 28 is elevated, consistent with glaucoma.", ref:"m3nums-sens"},
 {stem:"Intraocular pressure 16 mmHg", options:["Low","Normal","High"], answer:1, noShuffle:true, why:"16 mmHg is within the normal 10–21 mmHg range. Document the time, since IOP is usually highest in the morning.", ref:"m3nums-sens"},
 {stem:"Hgb 11.8 g/dL in a client on epoetin alfa (compare with the epoetin target)", options:["Low","Normal","High"], answer:2, noShuffle:true, why:"For epoetin, this is above the hold level of about 10–11 g/dL. Hold the dose and notify the provider because of stroke, MI, and clot risk.", ref:"m3-meds-renal"},
 {stem:"Urine output 25 mL/hr in a 70-kg adult", options:["Low","Normal","High"], answer:0, noShuffle:true, why:"The minimum is 0.5 mL/kg/hr, which is 35 mL/hr for 70 kg. At 25 mL/hr, output is low — an early AKI warning.", ref:"m3nums-renal"},
 {stem:"BUN:creatinine ratio 25:1", options:["Low","Normal","High"], answer:2, noShuffle:true, why:"Normal is 10:1–20:1; above 20:1 points to a prerenal cause such as dehydration.", ref:"m3nums-renal"},
 {stem:"Serum creatinine 0.9 mg/dL", options:["Low","Normal","High"], answer:1, noShuffle:true, why:"Normal creatinine is 0.6–1.2 mg/dL, and creatinine is the best indicator of kidney function.", ref:"m3nums-renal"},
 {stem:"HCO₃⁻ 17 mEq/L in a client with ESRD", options:["Low","Normal","High"], answer:0, noShuffle:true, why:"Normal bicarbonate is 22–26 mEq/L. Failing kidneys can't regenerate bicarbonate, causing metabolic acidosis.", ref:"m3nums-lytes"},
 {stem:"Vancomycin trough 14 mcg/mL", options:["Low","Normal","High"], answer:1, noShuffle:true, why:"The target trough is about 10–20 mcg/mL, so 14 is within range. Still monitor creatinine and hearing, since vancomycin is nephrotoxic and ototoxic.", ref:"m3nums-renal"}
],
"game-oddone":[
 {stem:"Which one doesn't belong?", options:["Sodium polystyrene sulfonate","Patiromer","Sodium zirconium cyclosilicate","Sevelamer"], answer:3, why:"The other three bind potassium in the gut. Sevelamer is a phosphate binder.", ref:"m3-meds-lytes"},
 {stem:"Which hyperkalemia treatment doesn't belong?", options:["Regular insulin IV + D50","Nebulized albuterol","Calcium gluconate IV","Sodium bicarbonate IV"], answer:2, why:"Insulin with dextrose, albuterol, and bicarbonate all shift potassium into cells. Calcium gluconate only stabilizes the heart and doesn't move or lower potassium.", ref:"elim-lytes"},
 {stem:"Which drug doesn't belong?", options:["Gentamicin","High-dose IV furosemide","Cisplatin","Latanoprost"], answer:3, why:"Gentamicin, high-dose IV furosemide, and cisplatin are ototoxic, so watch for tinnitus. Latanoprost is a glaucoma eye drop.", ref:"sens-hearing"},
 {stem:"Which glaucoma drug doesn't belong?", options:["Timolol","Dorzolamide","Brimonidine","Latanoprost"], answer:3, why:"Timolol, dorzolamide, and brimonidine lower IOP by decreasing aqueous humor production. Latanoprost increases outflow instead.", ref:"m3-meds-eyedrops"},
 {stem:"Which eye condition doesn't belong?", options:["Cataract","Retinal detachment","Primary open-angle glaucoma","Acute angle-closure glaucoma"], answer:3, why:"Cataracts, retinal detachment, and open-angle glaucoma are painless. Acute angle-closure glaucoma causes severe eye pain, headache, and vomiting.", ref:"sens-glaucoma"},
 {stem:"In renal failure, which electrolyte doesn't belong?", options:["Potassium","Phosphorus","Magnesium","Calcium"], answer:3, why:"Potassium, phosphorus, and magnesium build up when the kidneys fail. Calcium falls (inverse to phosphorus, and vitamin D isn't activated).", ref:"elim-lytes"},
 {stem:"Which finding doesn't belong with hypocalcemia?", options:["Positive Chvostek's sign","Positive Trousseau's sign","Perioral tingling","Diminished DTRs"], answer:3, why:"Low calcium makes nerves irritable — Chvostek, Trousseau, tingling, and hyperactive reflexes. Diminished DTRs point to high magnesium or high calcium.", ref:"m3chart-imbalances"},
 {stem:"Which finding doesn't belong with nephrotic syndrome?", options:["Proteinuria above 3.5 g/day","Hypoalbuminemia","Hyperlipidemia","Elevated ASO titer"], answer:3, why:"Massive proteinuria, low albumin, and high lipids are nephrotic hallmarks. An elevated ASO titer points to post-strep (nephritic) glomerulonephritis.", ref:"elim-nephrotic"},
 {stem:"Which AKI cause doesn't belong?", options:["Hemorrhage","Heart failure","Severe dehydration","Benign prostatic hyperplasia"], answer:3, why:"Hemorrhage, heart failure, and dehydration reduce kidney perfusion (prerenal). BPH obstructs outflow (postrenal).", ref:"elim-aki"},
 {stem:"For the AV fistula arm, which one doesn't belong?", options:["Blood pressure cuff","Venipuncture","A tight wristwatch","Palpating for a thrill"], answer:3, why:"BP cuffs, needle sticks, and tight jewelry are all avoided on the access arm. Feeling for the thrill is a patency check the nurse does every shift.", ref:"elim-dialysis"},
 {stem:"Which feature doesn't belong with expressive (Broca's) aphasia?", options:["Understands spoken language","Slow, halting short phrases","Aware of errors and frustrated","Fluent speech that makes little sense"], answer:3, why:"Broca's means broken speech: the client understands, struggles to speak, and knows it. Fluent \"word salad\" is receptive (Wernicke's) aphasia.", ref:"sens-aphasia"},
 {stem:"After eye surgery, which one doesn't belong?", options:["Bending at the waist","Lifting a heavy laundry basket","Straining at stool","Sleeping on the non-operative side"], answer:3, why:"Bending, heavy lifting, and straining raise intraocular pressure and are avoided. Sleeping on the back or non-operative side is the recommended position.", ref:"sens-emergencies"}
],
"game-twotruths":[
 {stem:"Calcium gluconate for hyperkalemia — which statement is the lie?", options:["It stabilizes the cardiac cell membrane within minutes.","It lowers the serum potassium level.","It is given with cardiac monitoring."], answer:1, why:"Calcium gluconate protects the heart but doesn't lower potassium. Insulin with dextrose shifts it, and binders, diuretics, or dialysis remove it.", ref:"m3-meds-lytes"},
 {stem:"Sodium zirconium cyclosilicate (Lokelma) — which statement is the lie?", options:["It is mixed right before giving and drunk immediately.","It contains sodium, so watch for edema.","It can be given as a retention enema."], answer:2, why:"Lokelma is oral only. Kayexalate is the binder that can be given as a retention enema.", ref:"m3-meds-lytes"},
 {stem:"Sodium polystyrene sulfonate (Kayexalate) — which statement is the lie?", options:["It is the fastest stand-alone fix for hyperkalemia with ECG changes.","Bowel sounds are assessed before giving it.","A retention enema is held 30–60 minutes."], answer:0, why:"Kayexalate acts over hours. With ECG changes, calcium gluconate comes first, then insulin with D50 to shift potassium.", ref:"m3-meds-lytes"},
 {stem:"Epoetin alfa — which statement is the lie?", options:["It replaces erythropoietin the failing kidneys no longer make.","Hypertension is a common adverse effect.","The higher the hemoglobin climbs, the safer it is to keep giving."], answer:2, why:"Epoetin is held when Hgb rises above about 10–11 g/dL. Higher levels raise stroke, MI, and clotting risk.", ref:"m3-meds-renal"},
 {stem:"Timolol eye drops — which statement is the lie?", options:["It decreases production of aqueous humor.","It is a safe first choice for a client with asthma.","Systemic absorption can cause bradycardia."], answer:1, why:"Timolol is a nonselective beta blocker. Absorbed through the nasolacrimal duct, it can cause bronchospasm, so it is contraindicated in asthma/COPD.", ref:"m3-meds-eyedrops"},
 {stem:"Latanoprost — which statement is the lie?", options:["Contact lenses can go back in right after the drop.","It is given once nightly.","It can permanently darken the iris."], answer:0, why:"Remove contact lenses before instilling and wait about 15 minutes to reinsert them.", ref:"m3-meds-eyedrops"},
 {stem:"Furosemide — which statement is the lie?", options:["It is contraindicated in anuria.","It causes potassium loss.","Pushing it rapidly IV prevents ototoxicity."], answer:2, why:"Rapid IV push increases ototoxicity. High-dose IV furosemide goes no faster than 4 mg/min.", ref:"m3-meds-diuretics"},
 {stem:"Spironolactone — which statement is the lie?", options:["It retains potassium while excreting sodium and water.","Salt substitutes are a safe way to season food while taking it.","It is contraindicated with K⁺ above 5.0."], answer:1, why:"Salt substitutes are potassium chloride, and with a potassium-sparing diuretic they can cause dangerous hyperkalemia.", ref:"m3-meds-diuretics"},
 {stem:"Mannitol — which statement is the lie?", options:["It is drawn up with a filter needle because it crystallizes.","It pulls fluid out of the eye in acute angle-closure glaucoma.","It is the first-line diuretic for pulmonary edema in kidney failure."], answer:2, why:"Mannitol pulls fluid into the bloodstream first, so without working kidneys it can worsen pulmonary edema. It's less commonly used in kidney failure; furosemide and dialysis remove the fluid.", ref:"m3-meds-diuretics"},
 {stem:"Ménière's disease — which statement is the lie?", options:["The triad is vertigo, tinnitus, and hearing loss.","Watching TV during an attack helps distract from the spinning.","A low-sodium diet helps prevent attacks."], answer:1, why:"Flickering light worsens vertigo. During an attack the client rests in a quiet, darkened room with fall precautions.", ref:"sens-menieres"},
 {stem:"AV fistula — which statement is the lie?", options:["It is ready for dialysis a few days after it's created.","A thrill and bruit mean it's patent.","It has a lower infection and clotting risk than a graft."], answer:0, why:"A fistula needs about 1–3 months to mature. A graft is usable in about 2–3 weeks, and a dialysis catheter can be used immediately.", ref:"elim-dialysis"},
 {stem:"Peritoneal dialysis — which statement is the lie?", options:["Shortness of breath during the dwell means drain the fluid.","Cloudy effluent suggests peritonitis.","If outflow is less than inflow, the difference counts as output."], answer:2, why:"Fluid that stays in is absorbed and counted as intake. Outflow should equal or exceed inflow.", ref:"elim-dialysis"}
]
});

 {type:"sata", ref:"elim-dialysis",

 {type:"sata", ref:"elim-ckd",

 {type:"sata", ref:"m3-meds-lytes",

 {type:"sata", ref:"elim-aki",
