   {list:["Visual acuity test — vision impairment","Slit lamp exam — cataract on the lens","Glare testing — vision loss","Pupil dilation test — extent of the cataract's impact on vision"]},
   {h:"Treatment: cataract surgery"},
   {p:"Surgery is the only cure. The clouded lens is removed (usually by <strong>phacoemulsification</strong> — ultrasound breaks up the lens) and replaced with an <strong>intraocular lens (IOL)</strong> implant. It's usually done as an outpatient procedure under local anesthesia, one eye at a time. Dilating drops are given before surgery."},
   {h:"Pre-op care"},
   {list:["Teach what to expect from surgery and post-op care","Administer <strong>mydriatic</strong> (dilating) eye drops as prescribed","<strong>Decrease lighting</strong> after the mydriatic is given (photophobia)"]},
   {h:"Post-op care and home teaching"},
   {list:[
    "Maintain eye coverage with a patch as prescribed; analgesics as needed",
    "Position <strong>off the operative side</strong> (back or non-operative side), head of bed elevated about <strong>30–45 degrees</strong>; place belongings on the non-operative side; side rails and assist with ambulation (depth perception is decreased with a patch)",
    "Eye drops are usually needed several times a day for <strong>2–4 weeks</strong>; wipe drainage with a sterile wet cotton ball from the inner to the outer canthus",
    "Avoid lifting more than about <strong>5 lb</strong>, bending, straining, coughing, sneezing, and rapid movements",
    "Mild itching and discomfort for a few days are normal; decreased vision, severe pain, increased redness, or discharge are not",
    "Wear the <strong>eye shield at night</strong> (and as directed) to prevent rubbing or pressure on the eye",
    "Visual acuity may not return for <strong>1–2 weeks</strong> after surgery",
    "Wear sunglasses outdoors",
    "Avoid activities that <strong>raise intraocular pressure</strong>: bending at the waist, heavy lifting, straining (prevent constipation), vigorous coughing, sneezing, or vomiting",
    "Don't rub or press on the eye",
    "Sleep on the back or on the <strong>non-operative side</strong>",
    "Instill prescribed drops correctly — antibiotic, corticosteroid, and/or NSAID drops — with hand hygiene first",
    "Avoid swimming and eye makeup for the period directed",
    "<strong>Report immediately:</strong> sudden or increasing eye pain, decreased vision, increased redness or drainage, flashes of light, floaters, or a curtain over the vision (possible retinal detachment)"]},
   {h:"Emergency potential?"},
   {p:"Cataracts themselves are not an emergency — they develop slowly. The emergencies are post-operative: infection, bleeding, increased intraocular pressure, <strong>dislocation of the implanted lens</strong>, and retinal detachment."},
   {h:"Helping the client adjust"},
   {list:[
    "Use bright lighting while reducing glare; avoid night driving until treated",
    "Cataracts in older adults may cost independence (driving, reading) — be supportive and give information on ways to stay independent"]}
  ],
  check:{stem:"A client is going home after cataract surgery. Which statement indicates the client understands the discharge teaching?",
   options:["\"I'll bend over to tie my shoes carefully.\"","\"I'll wear my eye shield at night and avoid lifting heavy objects.\"","\"A little eye pain that keeps getting worse is expected.\"","\"I'll sleep on my operative side to protect the eye.\""],
   answer:1,
   why:"After cataract surgery, the client should wear the shield at night and avoid activities that raise intraocular pressure, such as bending at the waist and heavy lifting. Increasing pain must be reported, and the client should sleep on the non-operative side or back."}
},
{ id:"sens-glaucoma", title:"Glaucoma", kicker:"Increased intraocular pressure damaging the optic nerve — peripheral vision goes first",
  blocks:[
   {p:"Glaucoma is a group of conditions in which <strong>increased intraocular pressure (IOP)</strong> damages the optic nerve. Normally, aqueous humor is produced and drained at a balanced rate; when drainage is blocked, pressure builds. Glaucoma is called the <strong>\"quiet thief of sight\"</strong>. The damage causes <strong>loss of peripheral vision first</strong> — the lecture image shows a clear center surrounded by darkness (\"<strong>tunnel vision</strong>\"). Vision lost to glaucoma <strong>cannot be restored</strong>; treatment only prevents further loss."},
   {p:"Normal IOP is about <strong>10–21 mmHg</strong>. IOP varies through the day and is usually highest in the morning, so the time of measurement is documented. Early signs of glaucoma are diminished accommodation and rising IOP; because central vision is spared, gradual peripheral loss can go unnoticed. Contact tonometry uses a topical anesthetic — the client must not rub the numbed eye afterward."},
   {h:"Open-angle vs. angle-closure"},
   {table:{head:["","Primary open-angle glaucoma","Acute angle-closure glaucoma"],rows:[
    ["<strong>What happens</strong>","Drainage through the trabecular meshwork gradually becomes less efficient","The iris bulges forward and suddenly blocks the drainage angle"],
    ["<strong>Onset</strong>","Slow, gradual, usually both eyes","Sudden"],
    ["<strong>Symptoms</strong>","<strong>Painless</strong>, often no symptoms until significant peripheral vision is lost; difficulty adjusting to darkness; halos","<strong>Severe eye pain</strong>, headache, <strong>nausea and vomiting</strong>, blurred vision, <strong>halos around lights</strong>, red eye, cloudy cornea, fixed mid-dilated pupil"],
    ["<strong>Urgency</strong>","Chronic — lifelong management","<strong>Medical emergency</strong> — can cause permanent blindness within hours to days"]
   ]}},
   {h:"Diagnosis"},
   {list:["<strong>Tonometry</strong> — elevated IOP","Visual acuity test and <strong>perimetry</strong> (visual field testing) — maps peripheral vision loss","<strong>Slit lamp exam</strong> — fixed pupil and flat anterior chamber angle in angle-closure; normal angle in open-angle","Gonioscopy — examines the drainage angle","Ophthalmoscopy — a deeper, wider optic disc (cupping) in open-angle glaucoma"]},
   {p:"Other cues: diminished accommodation; the client's understanding of the condition and ability to follow a lifelong treatment regimen."},
   {h:"Treatment and medications"},
   {list:[
    "<strong>Lifelong eye drops</strong> — the mainstay for open-angle glaucoma:",
    "<strong>Beta blockers</strong> (timolol) — <em>decrease production</em> of aqueous humor",
    "<strong>Prostaglandin analogs</strong> (latanoprost) — <em>increase outflow</em> of aqueous humor; given once daily at bedtime",
    "Other classes: alpha-adrenergic agonists, carbonic anhydrase inhibitors, miotics (pilocarpine — constricts the pupil to open the drainage angle)",
    "Laser trabeculoplasty or surgery (trabeculectomy, drainage devices) when drops aren't enough"]},
   {h:"Acute angle-closure glaucoma — emergency care"},
   {list:[
    "Notify the provider immediately — the goal is to lower IOP fast",
    "Medications as ordered: <strong>miotic drops</strong> (pilocarpine), topical beta blockers, carbonic anhydrase inhibitors (acetazolamide), and an IV <strong>osmotic diuretic (mannitol)</strong> to pull fluid out of the eye",
    "Treat pain and nausea/vomiting — vomiting raises IOP further",
    "<strong>Laser peripheral iridotomy or surgical iridectomy</strong> once pressure is lowered, to create a permanent drainage opening",
    "Post-op: eye patch, analgesics, position off the operative side with HOB 30–40 degrees, assist with ambulation, prevent bending and coughing",
    "<strong>No atropine</strong> — never give drugs that dilate the pupil (mydriatics and anticholinergics) to a client with glaucoma; dilation blocks outflow and spikes IOP"]},
   {hook:"Detached retina is <strong>painless</strong>; acute angle-closure glaucoma is <strong>extremely painful</strong>. Both are emergencies — pain is the cue that tells them apart."},
   {h:"Helping the client adjust"},
   {list:[
    "Teach that the drops must be used <strong>every day for life</strong>, even with no symptoms — skipping doses lets pressure rise silently",
    "Teach correct drop technique, including <strong>punctal occlusion</strong> (pressing on the inner corner of the eye) to avoid systemic effects, and waiting 5–10 minutes between different drops",
    "Teach the client to scan by turning the head, since peripheral vision is lost; remove fall hazards",
    "Open-angle glaucoma is treated with medications to <strong>control, not cure</strong>, the condition",
    "Avoid lifting and actions that increase eye pressure — <strong>lifting restricted to 5 lb</strong>",
    "Encourage regular eye exams, and screening for family members",
    "Wear a <strong>medical alert ID</strong>; tell all providers about the glaucoma before new medications are prescribed (avoid atropine-containing products)"]}
  ],
  check:{stem:"A client reports sudden severe eye pain, headache, nausea, and seeing halos around lights. Which condition should the nurse suspect?",
   options:["Cataract","Acute angle-closure glaucoma","Dry age-related macular degeneration","Primary open-angle glaucoma"],
   answer:1,
   why:"Sudden severe eye pain with headache, nausea/vomiting, blurred vision, and halos is the classic presentation of acute angle-closure glaucoma, a medical emergency. Open-angle glaucoma and cataracts are painless and gradual."}
},
{ id:"sens-amd", title:"Age-Related Macular Degeneration (AMD)", kicker:"Central vision loss — the peripheral vision stays",
  blocks:[
   {p:"Age-related macular degeneration (AMD) is deterioration of the <strong>macula</strong>, the central part of the retina responsible for sharp, detailed central vision. The lecture image shows the <strong>center of the picture blurred and darkened</strong> while the edges remain visible — the opposite pattern from glaucoma."},
   {h:"Dry vs. wet AMD"},
   {table:{head:["","Dry (atrophic) AMD","Wet (exudative / neovascular) AMD"],rows:[
    ["<strong>What happens</strong>","Gradual thinning of the macula with yellow deposits called <strong>drusen</strong>","<strong>Abnormal new blood vessels</strong> grow under the retina and leak blood and fluid"],
    ["<strong>Frequency</strong>","Most cases","Fewer cases, but responsible for most severe vision loss"],
    ["<strong>Course</strong>","Slow, gradual","Rapid — vision can drop over days to weeks"],
    ["<strong>Treatment</strong>","No cure; AREDS2 vitamin/mineral supplements (vitamins C and E, zinc, copper, lutein, zeaxanthin) may slow progression; stop smoking","<strong>Anti-VEGF intravitreal injections</strong> (such as ranibizumab, aflibercept) to stop abnormal vessel growth; photodynamic or laser therapy"]
   ]}},
   {h:"Risk factors"},
   {list:["Age","<strong>Smoking</strong> (the most important modifiable risk)","Family history","Hypertension and cardiovascular disease","Light-colored eyes, UV exposure"]},
   {h:"Priority assessments/cues"},
   {list:[
    "Blurred or dark spot in the <strong>center</strong> of vision",
    "Straight lines appear <strong>wavy or distorted</strong>",
    "Difficulty reading (words blurred), recognizing faces, and doing close work",
    "Floaters or spots in the field of vision — <strong>scotomas</strong>",
    "Needing brighter light to work"]},
   {h:"Diagnostics"},
   {list:[
    "<strong>Amsler grid</strong> — the client looks at a grid of straight lines; distorted or missing areas indicate macular damage",
    "Ophthalmoscopy — <strong>drusen</strong> deposits",
    "Optical coherence tomography (OCT) — anatomy of the retina and macula; also used to assess response to treatment",
    "Fundus photography and angiography — clarifies extent and whether AMD is wet or dry"]},
   {h:"Helping the client adjust"},
   {list:[
    "Teach daily home monitoring with the <strong>Amsler grid</strong> — a sudden change can mean dry AMD has converted to wet AMD and needs prompt treatment",
    "Low-vision aids: electronic hand-held magnifiers, electronic readers, image zooming, large print, bright task lighting, audio books",
    "Assist with intravitreal injections; monitor afterward for eye irritation, photosensitivity, and eye pain",
    "After <strong>photodynamic therapy</strong> (a light-activated drug plus laser destroys abnormal vessels), keep all skin covered and avoid intense light and sunlight for <strong>5 days</strong> — sunlight activates the drug and causes burns",
    "Teach the client to use peripheral vision by looking slightly to the side of an object (eccentric viewing)",
    "Stop smoking; protect eyes from UV light; eat leafy greens",
    "Driving safety evaluation; safety at home"]},
   {h:"Emergency potential?"},
   {p:"AMD isn't usually an emergency, but a <strong>sudden change</strong> in central vision or the Amsler grid should be reported promptly, because wet AMD responds best to early treatment."}
  ],
  check:{stem:"A client with dry AMD notices that the lines on her Amsler grid have suddenly become wavy. What is the priority action?",
   options:["Reassure her this is expected with aging","Report the change to the provider promptly — it may indicate conversion to wet AMD","Increase her AREDS2 supplement dose","Tell her to stop using the grid, since it causes anxiety"],
   answer:1,
   why:"A sudden change on the Amsler grid can mean abnormal vessels are growing (wet AMD). Wet AMD responds best to early anti-VEGF treatment, so the change should be reported promptly."}
},
{ id:"sens-retina", title:"Detached Retina", kicker:"Flashes, floaters, and a curtain over the vision — a surgical emergency",
  blocks:[
   {p:"A retinal detachment is a <strong>separation of the retina</strong> from the underlying layer (the choroid) that supplies it with oxygen and nutrients. Without that supply, the detached retina stops working. The lecture image shows a <strong>wedge of the visual field blacked out</strong> — the area served by the detached portion. It is <strong>painless</strong> and a <strong>medical emergency</strong>: vision can be saved only if the retina is reattached quickly."},
   {h:"Risk factors"},
   {list:["Aging","Severe nearsightedness (myopia)","Eye trauma","Previous eye surgery (including cataract surgery)","Diabetic retinopathy","Family history or previous detachment in the other eye"]},
   {h:"Priority assessments/cues"},
   {list:[
    "Sudden <strong>floaters</strong> (spots or cobwebs in the vision)",
    "<strong>Flashes of light</strong> (photopsia)",
    "A <strong>curtain, veil, or shadow</strong> moving across part of the visual field",
    "<strong>No pain</strong>"]},
   {h:"Emergency care"},
   {list:[
    "Notify the provider/ophthalmologist immediately — see a specialist ASAP",
    "<strong>Immediate bed rest</strong>; keep the client quiet",
    "<strong>Cover BOTH eyes</strong> (eye patches) to minimize eye movement until surgery — both eyes move together",
    "Position as ordered (often so the detached area is dependent)",
    "Avoid activities that raise IOP; prepare for surgery"]},
   {h:"Surgical repair"},
   {list:[
    "<strong>Laser photocoagulation or cryotherapy</strong> — seals retinal tears",
    "<strong>Scleral buckle</strong> — a silicone band placed around the eye pushes the wall of the eye against the retina",
    "<strong>Pneumatic retinopexy</strong> — a gas bubble is injected into the eye to press the retina back into place",
    "<strong>Vitrectomy</strong> — the vitreous gel is removed and replaced with gas, air, or silicone oil"]},
   {h:"Post-op care and home teaching"},
   {list:[
    "Speak to the client before approaching (both eyes may be patched); avoid jerky head movements",
    "<strong>Prevent nausea and vomiting</strong> and restlessness (they raise IOP and can cause hemorrhage); encourage deep breathing but avoid coughing",
    "<strong>Sudden, sharp eye pain</strong> → notify the provider",
    "Limit reading for about 3–5 weeks; dark glasses during the day and an eye patch/shield at night",
    "Keep follow-up appointments — detachment can recur or occur in the other eye",
    "<strong>Positioning is critical</strong> after a gas bubble — the client may need to keep the head in a specific position (sometimes face-down) for days so the bubble presses on the right spot",
    "With a gas bubble in the eye: <strong>no air travel, no high altitudes</strong>, and no nitrous oxide anesthesia until the bubble is absorbed — the gas expands and can dangerously raise IOP",
    "Avoid bending, heavy lifting, straining, and rubbing the eye",
    "Instill drops as ordered; wear the eye shield as directed",
    "Report increased pain, decreased vision, new floaters or flashes, or nausea"]}
  ],
  check:{stem:"A client reports seeing flashing lights and many new floaters, followed by a shadow moving across the vision of one eye. There is no pain. What should the nurse suspect?",
   options:["Cataract","Retinal detachment","Open-angle glaucoma","Conjunctivitis"],
   answer:1,
   why:"Flashes, new floaters, and a painless curtain or shadow across the visual field are the classic signs of retinal detachment, an emergency requiring prompt repair."}
},
{ id:"sens-hemianopsia", title:"Hemianopsia", kicker:"Loss of half the visual field — usually after a stroke",
  blocks:[
   {p:"Hemianopsia is <strong>blindness in half of the visual field</strong>. The lecture image shows the right half of the picture completely blocked out. The most common form, <strong>homonymous hemianopsia</strong>, affects the same side of the visual field in both eyes and results from damage to the visual pathway in the brain — most often a <strong>stroke</strong>, but also tumors or head injury. The eyes themselves are healthy; the brain can't process that half of what they see."},
   {p:"Hemianopsia is a <strong>neurological</strong> problem, not an eye problem: a \"disconnect\" in the visual pathway interrupts signals from the retina to the brain, so the brain can't stitch together a full image. Causes include <strong>stroke</strong> (the leading cause of permanent visual field defects), traumatic brain injury, tumors pressing on the optic chiasm or occipital lobe, and CNS infections. Unlike macular degeneration, the central point of focus often stays sharp — the \"panorama\" is cut in half."},
   {h:"Types"},
   {table:{head:["Type","Characteristics"],rows:[
    ["<strong>Homonymous hemianopsia</strong>","Loss of the <strong>same side</strong> of the visual field in both eyes (e.g., both left halves)"],
    ["<strong>Bitemporal hemianopsia</strong>","Loss of the <strong>outer (peripheral) halves</strong> of the visual field in both eyes — often from pressure on the optic chiasm"],
    ["<strong>Quadrantanopia</strong>","Loss of <strong>one-quarter</strong> of the visual field rather than a full half"]
   ]}},
   {hook:"The visual field loss is on the <strong>same side as the paralysis</strong>, which is the side opposite the brain lesion. A client with a right-sided brain stroke typically has left-sided weakness and loses the left half of the visual field."},
   {h:"Priority assessments/cues"},
   {list:[
    "Bumping into furniture or doorframes on the \"blind\" side",
    "Reading difficulty — \"losing\" the beginning or end of a sentence on a page",
    "Eating only half the food on the plate",
    "Difficulty driving and navigating crowded spaces",
    "Not noticing people or objects on the affected side",
    "The client may be <strong>unaware</strong> of the deficit, especially with neglect",
    "New-onset hemianopsia with other stroke signs is a stroke emergency — activate the stroke protocol"]},
   {h:"Helping the client adjust"},
   {list:[
    "In the acute phase, <strong>approach and place items on the unaffected side</strong> — call light, water, phone, tray",
    "<strong>Teach scanning</strong>: turn the head toward the affected side to bring that half of the environment into view",
    "As rehabilitation progresses, gradually encourage attention to the affected side (for example, rotate the meal tray, place some items on the affected side)",
    "Fall precautions; keep the environment uncluttered",
    "Remind the client and family that the client cannot see objects on the affected side; driving is usually not safe",
    "Occupational therapy and vision rehabilitation"]},
   {h:"Treatment and management"},
   {table:{head:["Stage","Management"],rows:[
    ["<strong>Early diagnosis</strong>","Neurological imaging (MRI/CT) and formal visual field testing (perimetry)"],
    ["<strong>Vision restoration</strong>","Vision restorative therapy to stimulate neural plasticity"],
    ["<strong>Compensatory training</strong>","<strong>Saccadic scanning</strong> training — teaching the eyes to glance quickly toward the blind side"],
    ["<strong>Optical aids</strong>","<strong>Prisms</strong> fitted to eyeglasses to shift images from the blind field into the seeing field"]
   ]}},
   {p:"The vision loss may be permanent, but scanning techniques can significantly improve quality of life. <strong>Safety first:</strong> clients have a high risk of falls and accidents because they are unaware of objects in the blind spot."},
   {h:"Emergency potential?"},
   {p:"No — hemianopsia is a chronic, post-stroke deficit and isn't treated with an emergency procedure. Its <em>sudden onset</em>, however, signals a stroke, which is a time-critical emergency."}
  ],
  check:{stem:"A client with left homonymous hemianopsia after a stroke is eating lunch. The nurse notices food left on the left side of the plate. What should the nurse do?",
   options:["Remove the tray; the client has finished eating","Teach the client to turn the head to the left to scan the plate, or rotate the plate","Tell the client to eat more slowly","Place all future food on the client's left side only"],
   answer:1,
   why:"The client can't see the left half of the plate. Teaching the client to scan by turning the head toward the affected side, or rotating the plate, helps the client see the whole meal."}
},
{ id:"sens-retinopathy", title:"Retinopathy (Diabetic & Hypertensive)", kicker:"Damage to the retina's small blood vessels from high glucose or high pressure",
  blocks:[
   {p:"Retinopathy is a general term for damage to the retina. While macular degeneration specifically targets the macula, retinopathy usually involves broader damage to the retinal blood vessels. It is primarily <strong>vascular</strong>: persistent high blood sugar or high blood pressure damages the small vessels, causing <strong>leakage</strong> of fluid or lipids, <strong>ischemia</strong>, <strong>neovascularization</strong> (fragile new vessels prone to bleeding, much like wet AMD), and eventually <strong>fibrotic scarring</strong> or retinal detachment."},
   {p:"Other forms include <strong>retinopathy of prematurity</strong> (abnormal vessel growth in some premature infants). The two main adult forms connect directly to this module's renal content: <strong>diabetic retinopathy</strong> shares the same microvascular damage as diabetic kidney disease, and <strong>hypertensive retinopathy</strong> shares the same vascular process as nephrosclerosis."},
   {h:"Diabetic retinopathy"},
   {table:{head:["Stage","What happens"],rows:[
    ["<strong>Nonproliferative</strong>","High glucose weakens capillary walls → microaneurysms, small hemorrhages, and leaking fluid. Leakage into the macula causes <strong>macular edema</strong> and blurred central vision"],
    ["<strong>Proliferative</strong>","The ischemic retina grows fragile <strong>new blood vessels</strong> (neovascularization) that can bleed into the vitreous and cause scar tissue that pulls the retina off — <strong>retinal detachment</strong>"]
   ]}},
   {list:[
    "<strong>Cues:</strong> early stages are often <strong>asymptomatic</strong>. Later: <strong>floaters</strong> (spots or dark cobweb-like strings), <strong>fluctuating vision</strong> that changes day to day with blood sugar, <strong>dark or empty \"patchy\" areas</strong> (rather than the consistent central blur of AMD), impaired color vision, and sudden vision loss (vitreous hemorrhage or detachment)",
    "<strong>Annual dilated eye exam</strong> for clients with diabetes — because early stages have no symptoms, exams are essential for detection"]},
   {table:{head:["Stage","Management"],rows:[
    ["<strong>Prevention / early stage</strong>","Strict control of blood sugar, blood pressure, and cholesterol; smoking cessation"],
    ["<strong>Advanced proliferative</strong>","<strong>Panretinal photocoagulation</strong> (laser) to shrink abnormal blood vessels"],
    ["<strong>Macular edema</strong>","Intravitreal injections of <strong>anti-VEGF</strong> agents (e.g., aflibercept)"],
    ["<strong>Severe bleeding</strong>","<strong>Vitrectomy</strong> — surgery to remove the blood-stained vitreous gel"]
   ]}},
   {h:"Hypertensive retinopathy"},
   {list:[
    "Chronic high blood pressure narrows and hardens retinal arterioles — the classic finding is <strong>\"silver wiring\"</strong> of the arteries",
    "Severe or malignant hypertension can cause retinal hemorrhages and swelling of the optic disc — visual changes and headache in a client with very high BP are a hypertensive emergency cue",
    "<strong>Treatment:</strong> blood pressure control"]},
   {h:"Helping the client adjust"},
   {list:[
    "Emphasize glucose and BP control as the way to protect remaining vision",
    "Low-vision aids; adaptive devices for diabetes self-care (talking glucometers, large-print or preset insulin pens) as vision declines",
    "Teach to report sudden vision loss, a shower of floaters, or a curtain over the vision — possible hemorrhage or detachment"]}
  ],
  check:{stem:"Which instruction is most important for preventing progression of diabetic retinopathy?",
   options:["Wear sunglasses at all times outdoors","Maintain tight blood glucose control and have a dilated eye exam every year","Use artificial tears four times a day","Avoid reading in dim light"],
   answer:1,
   why:"Diabetic retinopathy is caused by high glucose damaging the retinal vessels. Tight glucose control (along with BP and lipid control) and annual dilated eye exams to catch changes early are the key prevention measures."}
},
{ id:"sens-emergencies", title:"Eye Emergencies, Eye Injuries & Eye Surgery", kicker:"Penetrating trauma, chemical exposure, other emergencies, and post-op care and home teaching",
  blocks:[
   {h:"Penetrating trauma care"},
   {list:[
    "<strong>Do not remove</strong> the penetrating object",
    "Stabilize the object and cover the eye with a <strong>rigid shield</strong> (such as a paper cup or metal shield) — <strong>no pressure</strong> on the eye",
    "Cover the <strong>unaffected eye</strong> too, since both eyes move together (sympathetic movement) — movement of the good eye moves the injured eye",
    "Keep the client calm, head of bed elevated; <strong>no bending over and no lying flat</strong> (can move the object); <strong>no pressure</strong> on the eye",
    "X-ray or CT of the orbit is used — <strong>MRI is contraindicated</strong> (a metal object could move)",
    "Keep NPO in anticipation of surgery; give antiemetics as ordered — vomiting raises IOP",
    "Do not irrigate or apply medication; tetanus status; transport for emergency ophthalmology care"]},
   {h:"Exposure (chemical) trauma care"},
   {list:[
    "<strong>Irrigate immediately</strong> — this comes before anything else, including a full history",
    "Use copious water or normal saline for <strong>at least 15 minutes</strong>, continuing until the eye's pH is neutral (about 7.0–7.4, checked with pH paper); document visual acuity once irrigation is underway",
    "Irrigate from the <strong>inner canthus to the outer canthus</strong>, so contaminated fluid runs away from the other eye",
    "Remove contact lenses if they don't come out with irrigation",
    "Alkali burns (lye, cleaning products, cement) are generally more damaging than acids because they penetrate deeper",
    "Then: pain control, visual acuity, and ophthalmology evaluation"]},
   {h:"Other eye emergencies"},
   {table:{head:["Emergency","Cues","Care"],rows:[
    ["<strong>Acute angle-closure glaucoma</strong>","Severe eye pain, headache, N/V, halos, red eye","Lower IOP immediately — miotics, osmotic diuretic (mannitol), laser iridotomy"],
    ["<strong>Retinal detachment</strong>","Painless flashes, floaters, curtain over vision","Limit activity, notify immediately, surgical repair"],
    ["<strong>Blunt trauma / hyphema</strong> (blood in the anterior chamber)","Visible blood in front of the iris, pain, blurred vision","Semi-Fowler's (HOB 30–45 degrees), rest, avoid sudden eye movements for 3–5 days, eye shield/patch, cycloplegic drops as ordered, avoid aspirin/NSAIDs; usually resolves in 5–7 days"],
    ["<strong>Contusion</strong> (\"black eye\")","Bruising, pain, photophobia, edema, diplopia","<strong>Ice immediately</strong>; thorough eye exam"],
    ["<strong>Foreign body</strong> (superficial)","Pain, tearing, feeling of something in the eye","Don't rub; irrigate. A visible particle on the lower lid can be lifted with a saline-moistened cotton-tipped applicator (have the client look up while the lower lid is pulled down). Embedded objects are removed by the provider"],
    ["<strong>Orbital fracture</strong>","Swelling, double vision, limited eye movement","Ice, head elevation, <strong>no nose blowing</strong>"],
    ["<strong>Central retinal artery occlusion</strong>","Sudden, painless loss of vision in one eye","Emergency — immediate ophthalmology care"]
   ]}},
   {h:"Eye surgery — which disorders?"},
   {list:[
    "<strong>Cataract</strong> — lens removal with intraocular lens implant",
    "<strong>Glaucoma</strong> — laser trabeculoplasty, laser iridotomy, trabeculectomy",
    "<strong>Detached retina</strong> — scleral buckle, pneumatic retinopexy, vitrectomy, laser/cryotherapy",
    "<strong>Diabetic retinopathy / wet AMD</strong> — laser photocoagulation, intravitreal injections, vitrectomy",
    "<strong>Penetrating trauma</strong> — surgical repair"]},
   {h:"General post-op care"},
   {list:[
    "Protect the eye — shield as directed, especially at night",
    "Avoid increased IOP: no bending at the waist, heavy lifting, straining, or forceful coughing/sneezing; treat nausea and prevent constipation",
    "Position as ordered (back or non-operative side; specific head positioning after a gas bubble)",
    "Pain control; <strong>sudden sharp or increasing pain</strong> may signal hemorrhage or increased IOP and must be reported",
    "Safety — depth perception is altered; fall precautions"]},
   {h:"Teaching for home care"},
   {list:[
    "Hand hygiene before touching the eye or instilling drops",
    "<strong>Eye drop technique:</strong> tilt the head back, pull down the lower lid, and instill into the <strong>conjunctival sac</strong> (not directly on the cornea); never let the dropper tip touch the eye or lashes; close the eye gently (don't squeeze); and apply <strong>punctal occlusion</strong> — press the inner canthus for 1–2 minutes (at least 60 seconds) to prevent systemic absorption",
    "<strong>Wait 5–10 minutes</strong> between different eye drops to prevent \"washing out\" the first medication; instill <strong>drops before ointments</strong>",

    "Avoid swimming, eye makeup, and dusty environments for the directed period",
    "Keep follow-up appointments",
    "<strong>Report:</strong> increased pain, decreased vision, increased redness, swelling or drainage, fever, flashes, floaters, or a curtain over the vision"]}

{ id:"sens-hearing", title:"Hearing Loss & Communicating with the Hearing Impaired", kicker:"Conductive vs. sensorineural, ototoxic drugs, and communication techniques",
  blocks:[

    ["<strong>Hard of hearing, speech difficult to understand</strong>","Give <strong>full attention</strong> — look and listen, don't do another task while listening. Start with conversation where you can anticipate the replies to get used to the speech pattern. Use context to fill in details. <strong>Don't pretend to understand</strong> — if in doubt, have the person <strong>write the message</strong>, then repeat it in speech. Written material at about a <strong>third-grade level</strong>"],

{ id:"sens-menieres", title:"Ménière's Disease & Labyrinthitis", kicker:"Vertigo, tinnitus, and hearing loss from inner-ear disorders — safety first",
  blocks:[
   {p:"Ménière's disease and labyrinthitis are disorders of the inner ear that affect balance and cause dizziness. In <strong>Ménière's disease</strong>, a buildup of fluid (endolymphatic <strong>hydrops</strong>) distends and can rupture the labyrinth, causing episodic attacks and a sensorineural hearing loss that can become permanent. <strong>Labyrinthitis</strong> is inflammation of the vestibular nerve."},
   {h:"Priority assessments/cues"},
   {list:[
    "The Ménière's triad: <strong>vertigo</strong> (intense, even when lying down), <strong>tinnitus</strong>, and <strong>hearing loss</strong> — usually <strong>unilateral</strong>, on the affected side",
    "A feeling of <strong>fullness</strong> in the ear",
    "Nausea and vomiting; lack of balance",
    "Nystagmus, difficulty focusing vision",
    "Headaches, which may be severe",
    "Spatial disorientation — a feeling of spinning in space or being pulled to the ground",
    "Symptoms lasting hours or days"]},
   {h:"Diagnostics"},
   {list:[
    "Audiometry — determines hearing loss",
    "Vestibular testing — isolates the cause",
    "<strong>Electronystagmography (ENG)</strong> — reduced balance response in one ear with Ménière's",
    "<strong>Glycerol test</strong> — audiograms after an oral dose of glycerol; hearing and speech discrimination improve with Ménière's",
    "EEG — rules out other causes (labyrinthitis)"]},
   {h:"1. Acute vertigo attack (the \"spinning\" phase)"},
   {list:[
    "<strong>Priority #1: safety / fall prevention</strong> — the client is at high fall risk. Bed wheels locked, side rails up, bed in the low position; <strong>do not let the client walk alone</strong>; bedside commode and call bell within reach",
    "<strong>Environment:</strong> bed rest in a <strong>quiet, darkened room</strong>. Avoid bright or flickering lights (no TV) and sudden head movements, which worsen vertigo",
    "Teach the client to <strong>move the head slowly</strong>",
    "<strong>Medications:</strong> <strong>antiemetics</strong> for nausea/vomiting and antivertiginous drugs such as <strong>meclizine (Antivert)</strong> to sedate the vestibular system; monitor for adverse effects"]},
   {h:"2. Maintenance (preventing future attacks)"},
   {list:[
    "<strong>Low-sodium diet</strong> (1,000–2,000 mg/day) to reduce endolymphatic fluid retention",
    "<strong>Avoid triggers</strong> that alter fluid balance: <strong>caffeine, alcohol, and MSG</strong>; fluid restriction may be prescribed; <strong>stop smoking</strong>",
    "During attacks avoid watching TV — flickering light worsens symptoms",
    "Vestibular rehabilitation as prescribed; hearing loss becomes permanent as attacks become more frequent",
    "<strong>Diuretics</strong> such as hydrochlorothiazide may be prescribed to reduce fluid pressure in the ear",
    "Change positions slowly; avoid jerking and quick head motions",
    "Remove fall hazards from the home; smoking cessation; avoid allergens",
    "Labyrinthitis: diet low in processed foods; vestibular exercises"]},
   {h:"Priority medications"},
   {table:{head:["Medication","Route","Purpose"],rows:[
    ["<strong>Diphenhydramine</strong>","PO, IV","Antihistamine to decrease sensations (both conditions)"],
    ["<strong>Lorazepam</strong>","PO, IV","Benzodiazepine to decrease sensations (both conditions)"],
    ["<strong>Meclizine</strong>","PO","Antihistamine to treat vertigo (both conditions)"],
    ["<strong>Prochlorperazine</strong>","PO, IV","Antiemetic for nausea and vomiting (both conditions)"],
    ["<strong>Hydrochlorothiazide</strong>","PO","Diuretic to reduce inner-ear fluid (Ménière's)"],
    ["<strong>Prednisone</strong>","PO","Corticosteroid to control swelling (labyrinthitis); <strong>taper</strong> — never stop abruptly (adrenal insufficiency/withdrawal)"]
   ]}},
   {h:"Surgery"},
   {list:[
    "Options include endolymphatic sac decompression with shunt placement, vestibular nerve section, or labyrinthectomy",
    "Post-op: monitor the neurological system; assess dressing/packing for bleeding and infection; medications for vertigo and nausea; bedside commode; call bell in reach; don't let the client ambulate alone; <strong>speak to the client on the nonoperative side</strong>"]},
   {h:"Nursing process: care of the patient with vertigo"},
   {table:{head:["Nursing diagnosis","Goal","Key nursing interventions"],rows:[
    ["<strong>Risk for fall-related injury</strong> — impaired balance, gait disturbance, vertigo","Free of physical trauma from imbalance and falls","Assess attacks (onset, duration, frequency, hearing loss, tinnitus, aural fullness); check for nystagmus and a positive Romberg; assess vision and proprioception for ADLs; reinforce vestibular/balance therapy; give or teach antivertiginous/vestibular sedative meds; have the client <strong>sit down and restrict activity when dizzy</strong>; <strong>pillow on each side of the head</strong> to limit movement; help identify the <strong>aura</strong> (ear fullness/pressure) so meds can be taken before an attack; <strong>keep eyes open and stare straight ahead</strong> when lying down with vertigo; remove home hazards/use assistive devices"],
    ["<strong>Risk for negative quality of life</strong> — unpredictability of vertigo","Modifies lifestyle to decrease disability; maximum control and independence","Identify strengths and roles that can still be fulfilled; teach about vertigo and what to expect; include family in rehab; let the client make decisions and take on more of their own care"],
    ["<strong>Risk for hypovolemia</strong> — increased fluid output, altered intake, medications","Normal fluid and electrolyte balance","Monitor I&amp;O (emesis, liquid stools, urine, diaphoresis) and electrolytes; assess for dehydration (orthostatic BP, pulse, skin turgor, mucous membranes, LOC); oral fluids as tolerated; <strong>discourage caffeine</strong> (a vestibular stimulant); antiemetics as prescribed"],
    ["<strong>Anxiety</strong> — threat of, or change in, health status and disabling effects of vertigo","Less or no anxiety","Assess anxiety and past coping skills; teach about vertigo and its treatment; let the client discuss concerns about attacks; teach stress management (stress can worsen attacks) or refer; comfort measures; avoid stress-producing activities"],
    ["<strong>Self-care deficits</strong> (feeding, hygiene, dressing, toileting) — labyrinth dysfunction and vertigo","Able to care for self","Antiemetics/sedatives to relieve nausea, vomiting, and vertigo; encourage self-care during <strong>vertigo-free periods</strong>; review the diet (<strong>sodium restriction</strong> helps inner-ear fluid balance) and offer fluids"],
    ["<strong>Risk for powerlessness</strong> — illness regimen and helplessness from vertigo/balance disturbance","Increased sense of control over life and activities","Assess needs, values, and readiness; let the client express feelings about self and illness; identify coping behaviors that worked before"]
   ]}},
   {h:"Complications"},
   {list:["Hearing loss","Loss of balance, fall risk","Social isolation","Meningitis (with labyrinthitis)"]}
  ],
  check:{stem:"A client with Ménière's disease is having an acute vertigo attack. What is the nurse's priority?",
   options:["Encourage ambulation to reduce dizziness","Fall prevention — bed rest in a quiet, darkened room with side rails up","Turn on the TV as a distraction","Teach a high-sodium diet"],
   answer:1,
   why:"During an acute vertigo attack, the client is at high fall risk. Safety comes first: bed rest, side rails up, bed low, assistance with ambulation, and a quiet, darkened room without flickering lights."}
},
{ id:"sens-aphasia", title:"Verbal: Aphasia (Global, Expressive, Receptive)", kicker:"When the brain can't produce or understand language",
  blocks:[
   {p:"<strong>Aphasia</strong> is a loss of the ability to use or understand language, caused by damage to the language centers of the brain — most often a <strong>stroke</strong> affecting the <strong>left hemisphere</strong> (the dominant hemisphere for language in most people), but also brain tumors and head injury. Aphasia affects language, not intelligence."},
   {h:"The three types"},
   {table:{head:["Type","Brain area","What the client can and can't do","Communication strategies"],rows:[
    ["<strong>Expressive</strong> (Broca's, nonfluent)","Frontal lobe (Broca's area)","<strong>Understands</strong> what is said but has great difficulty <strong>producing</strong> speech or writing; speech is slow, halting, with short phrases. Clients are usually aware of the problem and <strong>frustrated</strong>","Ask <strong>yes/no questions</strong>; give plenty of time; use picture/communication boards, gestures, and writing; don't finish sentences for the client"],
    ["<strong>Receptive</strong> (Wernicke's, fluent)","Temporal lobe (Wernicke's area)","Speech flows easily but may make <strong>little sense</strong>; the client <strong>can't understand</strong> spoken or written language and may be unaware of errors","Use <strong>gestures, demonstration, and pictures</strong>; short, simple sentences; one-step instructions; point to objects"],
    ["<strong>Global</strong>","Extensive damage to both language areas","Severe impairment of <strong>both</strong> understanding and expression","Rely heavily on nonverbal communication — gestures, facial expression, touch, pictures; establish a simple yes/no system"]
   ]}},
   {hook:"Broca's = <strong>B</strong>roken speech (knows what to say, can't get it out). Wernicke's = <strong>W</strong>ord salad (speech flows, but meaning doesn't get in or out)."},
   {hook:"Aphasia vs. dysarthria: aphasia is a <em>language</em> problem in the brain. Dysarthria is a <em>motor</em> problem — weak or uncoordinated muscles of the mouth, tongue, and throat cause slurred speech, but the client understands language and chooses words normally. A client with dysarthria may also have swallowing problems, so assess swallowing before giving anything by mouth."},
   {h:"General nursing interventions for aphasia"},
   {list:[
    "Speak slowly and clearly in a normal tone — <strong>don't shout</strong> and don't talk down to the client",
    "Face the client; reduce distractions and background noise",
    "Use short, simple sentences and ask one question at a time",
    "<strong>Allow time</strong> to respond; don't rush or interrupt",
    "Use communication boards, pictures, gestures, and writing as appropriate for the type",
    "Praise efforts; acknowledge frustration",
    "Don't pretend to understand when you don't",
    "Involve family in learning the strategies that work",
    "Refer to a <strong>speech-language pathologist (SLP)</strong>",
    "Keep the call light within reach and make sure the client has a reliable way to signal needs"]}
  ],
  check:{stem:"A client with a left-hemisphere stroke understands everything the nurse says but can speak only a few halting words and becomes visibly frustrated. Which type of aphasia is this?",
   options:["Receptive (Wernicke's) aphasia","Expressive (Broca's) aphasia","Global aphasia","Dysarthria"],
   answer:1,
   why:"Intact understanding with slow, effortful, limited speech and frustration is expressive (Broca's) aphasia. Receptive aphasia impairs understanding, and global aphasia impairs both."}
}
]};

const M3_MEDS = { title:"Medications", sub:"", lessons:[
{ id:"m3-meds-diuretics", title:"Diuretics", kicker:"Furosemide, Spironolactone, and Mannitol",
  blocks:[
   {h:"Furosemide (Lasix) — Loop Diuretic"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","PO/IV, daily or BID. Renal failure with <strong>fluid volume overload/edema</strong>, pulmonary edema, edema in glomerulonephritis and nephrotic syndrome, hyperkalemia (while the kidneys still make urine). Still works at a low GFR. High-dose IV furosemide is infused no faster than <strong>4 mg/min</strong> (ototoxicity). Related loops: bumetanide, torsemide"],
     ["Mechanism of action","Inhibits sodium and chloride reabsorption in the <strong>ascending loop of Henle</strong> — the most potent class of diuretics. Water follows the sodium out, and potassium is lost with it"],
     ["Adverse reactions","<strong>Hypokalemia</strong>; <strong>ototoxicity</strong> (tinnitus, hearing loss — worse with rapid IV push, high doses, kidney impairment, or other ototoxic drugs such as aminoglycosides); dehydration/hypovolemia and <strong>orthostatic hypotension</strong>; hyponatremia, hypomagnesemia, hypocalcemia; hyperglycemia; hyperuricemia (gout); metabolic alkalosis"],
     ["Contraindications","<strong>Anuria</strong>; <strong>sulfonamide (sulfa) allergy</strong> — furosemide and bumetanide are sulfonamide derivatives"],
     ["Nursing interventions","Monitor <strong>K⁺ levels and BP</strong> (including orthostatic), daily weight, I&amp;O, lung sounds, and edema; give IV doses slowly; hypokalemia raises the risk of <strong>digoxin toxicity</strong>; loop diuretics can raise <strong>lithium</strong> levels; report new ringing in the ears"],
     ["Patient education","Eat <strong>potassium-rich foods</strong> (unless the client has renal failure with hyperkalemia); <strong>rise slowly</strong>; take it in the morning to avoid nocturia; report tinnitus, muscle weakness, or dizziness"]]}},
   {h:"Spironolactone (Aldactone) — Potassium-Sparing Diuretic"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","PO, daily. Renal/fluid management: <strong>edema without potassium depletion</strong>; heart failure; hyperaldosteronism; often combined with a loop or thiazide diuretic. Related drugs: eplerenone, amiloride, triamterene"],
     ["Mechanism of action","Blocks <strong>aldosterone</strong> in the distal tubule — sodium and water are excreted while <strong>potassium is retained</strong>"],
     ["Adverse reactions","<strong>Hyperkalemia</strong>; gynecomastia; menstrual changes"],
     ["Contraindications","<strong>Hyperkalemia (K⁺ above 5.0)</strong>; severe renal failure"],
     ["Nursing interventions","Monitor potassium and the ECG for <strong>dysrhythmias</strong>; use cautiously with ACE inhibitors and ARBs (they also raise potassium); no potassium supplements"],
     ["Patient education","<strong>Avoid salt substitutes</strong> — they're made of potassium chloride; don't overdo high-potassium foods; report muscle weakness or an irregular heartbeat"]]}},
   {h:"Mannitol (Osmitrol) — Osmotic Diuretic"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","IV, emergent. <strong>Acute angle-closure glaucoma</strong> — rapidly reduces intraocular pressure; also pulls fluid from the brain (increased ICP)"],
     ["Mechanism of action","Increases the <strong>osmotic pressure</strong> of the plasma and filtrate, pulling fluid out of the tissues (eye, brain) into the blood, where it's excreted by the kidneys"],
     ["Adverse reactions","Tachycardia; <strong>pulmonary edema</strong> and fluid overload (it pulls fluid <em>into</em> the bloodstream before it's excreted); electrolyte shifts; dehydration"],
     ["Contraindications","<strong>Active intracranial bleed</strong>; severe dehydration; use caution with anuria and severe heart failure"],
     ["Nursing interventions","<strong>Must use a filter needle</strong> — mannitol crystallizes, especially at low temperatures; inspect for crystals. Key lab: <strong>serum osmolality</strong>. Monitor neuro status, I&amp;O, electrolytes, and lung sounds for <strong>crackles</strong>; watch for heart failure"],
     ["Patient education","Explain the increase in urination; report shortness of breath, chest tightness, or new swelling"]]}},
   {hook:"<b>Loop = Lose</b> potassium. <b>Potassium-sparing = Keep</b> potassium. With hyperkalemia and fluid overload, the loop is the diuretic you reach for — the potassium-sparing is the one you avoid."}
  ],
  check:{stem:"A client is receiving IV furosemide. Which finding should the nurse report immediately?",
   options:["Urine output of 200 mL in the first hour","New ringing in the ears","Potassium of 4.2 mEq/L","Decreased ankle edema"],

{ id:"m3-meds-lytes", title:"Electrolyte Replacements & Treatments", kicker:"Phosphorus binders, Calcium gluconate, Vitamin D, and the potassium binders",
  blocks:[
   {h:"Phosphorus (Phosphate) Binders — Calcium Acetate (PhosLo), Calcium Carbonate, Sevelamer (Renvela), Lanthanum"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","PO, <strong>with meals</strong> (and snacks). CKD/ESRD — lowers phosphorus and prevents secondary hyperparathyroidism. Calcium-based: calcium acetate, calcium carbonate. Non-calcium: sevelamer (used when calcium is already high), lanthanum"],
     ["Mechanism of action","Binds dietary phosphate in the GI tract so it's excreted in stool instead of absorbed — a \"sponge\" for phosphorus"],
     ["Adverse reactions","Constipation, nausea, diarrhea, GI upset; <strong>hypercalcemia</strong> with calcium-based binders"],
     ["Contraindications","Hypophosphatemia; bowel obstruction"],
     ["Nursing interventions","Give with the <strong>first bite of every meal</strong> — if the client doesn't eat, don't give it; separate from other oral meds as directed (binders can bind other drugs); lanthanum must be <strong>chewed</strong> thoroughly; monitor phosphorus and calcium"],
     ["Patient education","\"Skip the meal, skip the pill.\" A low-phosphorus diet is still needed for binders to work; tell the provider and dietitian about all supplements — some contain phosphorus"]]}},
   {h:"Calcium Gluconate (IV)"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","IV, emergent. <strong>Hyperkalemia</strong> — cardiac protection in renal failure; symptomatic <strong>hypocalcemia</strong> (tetany, seizures); hypermagnesemia"],
     ["Mechanism of action","Antagonizes the effect of high potassium on <strong>cardiac membrane excitability</strong> — it stabilizes the heart but does <strong>not</strong> lower potassium"],
     ["Adverse reactions","<strong>Bradycardia</strong>, hypotension, syncope, dysrhythmias (especially with rapid administration); <strong>extravasation → tissue necrosis</strong>; hypercalcemia"],
     ["Contraindications","Hypercalcemia; <strong>digitalis (digoxin) toxicity</strong> — calcium increases the risk of digoxin toxicity"],
     ["Nursing interventions","Requires <strong>cardiac monitoring</strong>; give <strong>slowly</strong>; <strong>stop the infusion if bradycardia occurs</strong>; confirm IV patency; do not mix with sodium bicarbonate (forms a precipitate); monitor serum calcium and ECG"],
     ["Patient education","Explain the heart monitor; report burning or pain at the IV site, dizziness, or palpitations"]]}},
   {hook:"Calcium gluconate <b>buys time</b> — it protects the heart within minutes, but the potassium is still high. Insulin + dextrose (shift), then binders, diuretics, or dialysis (remove) have to follow."},
   {h:"Vitamin D Analogs — Calcitriol (active); Cholecalciferol (D3) / Ergocalciferol (D2)"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","PO, daily. <strong>Renal bone disease</strong> — compensates for the failing kidney's inability to activate vitamin D. Calcitriol is the <strong>active</strong> form; D3 and D2 are nutritional (inactive) forms used to replace low stores"],
     ["Mechanism of action","Increases intestinal <strong>absorption of calcium</strong>; calcitriol also suppresses parathyroid hormone"],
     ["Adverse reactions","<strong>Hypercalcemia</strong> — fatigue, weakness, constipation, nausea, confusion; headache; dry mouth"],
     ["Contraindications","Hypercalcemia; vitamin D toxicity. Active vitamin D <strong>cannot be taken if calcium or phosphorus is too high</strong> — it raises the risk of calcium–phosphorus deposits in arteries, lungs, eyes, and skin"],
     ["Nursing interventions","Monitor <strong>calcium and phosphorus</strong> closely — they're inversely related"],
     ["Patient education","Report symptoms of high calcium (constipation, nausea, weakness, confusion); keep all lab appointments"]]}},
   {h:"Sodium Polystyrene Sulfonate with Sorbitol (Kayexalate) — Cation Exchange Resin"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","PO or PR (retention enema — hold 30–60 minutes), daily. <strong>Hyperkalemia</strong> — fecal excretion of potassium. Acts over hours, so it isn't a stand-alone emergency treatment"],
     ["Mechanism of action","Exchanges <strong>sodium for potassium</strong> in the intestines; sorbitol causes diarrhea to speed elimination"],
     ["Adverse reactions","Constipation, fecal impaction, gastric irritation; diarrhea; <strong>intestinal necrosis</strong>; sodium retention and hypernatremia; hypokalemia"],
     ["Contraindications","<strong>Bowel obstruction</strong>; <strong>paralytic ileus</strong>"],
     ["Nursing interventions","<strong>Assess bowel sounds first</strong> — if the gut isn't moving, potassium can't leave the body and the drug can cause necrosis; monitor potassium, sodium, and for fluid overload"],
     ["Patient education","Expect loose stools; report severe abdominal pain, bloating, or no bowel movement"]]}},
   {h:"Patiromer (Veltassa) — Potassium Binder"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","PO, daily, with food. <strong>Chronic renal failure — long-term K⁺ management</strong>. <strong>Delayed onset</strong> (hours to days) — <strong>not for emergency use</strong>"],
     ["Mechanism of action","A non-absorbed polymer that binds K⁺ (in exchange for calcium) in the GI tract so it's excreted in stool"],
     ["Adverse reactions","<strong>Hypomagnesemia</strong>; constipation; hypokalemia"],
     ["Contraindications","Severe constipation; bowel obstruction"],
     ["Nursing interventions","Give <strong>at least 3 hours apart</strong> from other oral medications; monitor potassium and magnesium"],
     ["Patient education","Mix the powder with water and take with food; keep the 3-hour spacing from other meds; report constipation"]]}},
   {h:"Sodium Zirconium Cyclosilicate (Lokelma) — Potassium Binder"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","PO. Hyperkalemia — the fastest-acting binder (onset about 1 hour)"],
     ["Mechanism of action","Traps potassium in exchange for sodium and hydrogen throughout the GI tract"],
     ["Adverse reactions","<strong>Edema</strong> and fluid overload (it contains sodium); hypokalemia"],
     ["Contraindications","Hypersensitivity; use caution with heart failure or other conditions that require sodium restriction"],
     ["Nursing interventions","Monitor potassium for hypokalemia; watch for edema and weight gain; separate some oral meds by 2 hours"],
     ["Patient education","Mix the powder with water and drink right away; report swelling or rapid weight gain"]]}},
   {hook:"All three potassium binders work in the gut and need time. An acute hyperkalemia with ECG changes still gets <b>calcium gluconate first</b> (protect the heart) and <b>insulin + dextrose</b> (shift K⁺ into cells) while the binders and dialysis remove it."}
  ],
  check:{stem:"A client with ESRD is prescribed sevelamer. Which instruction should the nurse include?",
   options:["Take it at bedtime on an empty stomach","Take it with meals and snacks","Take it only when phosphorus is above 8 mg/dL","Take it with an antacid containing magnesium to improve absorption"],
   answer:1,
   why:"Sevelamer is a phosphorus binder; it works by binding phosphorus in food, so it must be taken with meals and snacks. Magnesium-containing antacids should be avoided in renal failure."}
},
{ id:"m3-meds-renal", title:"Epoetin Alfa, Corticosteroids, Acetylcysteine & Sodium Bicarbonate", kicker:"The rest of the renal medication list",
  blocks:[
   {h:"Epoetin Alfa (Epogen, Procrit) — Erythropoiesis-Stimulating Agent"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","SubQ or IV, <strong>1–3 times weekly</strong> (IV during hemodialysis is common). <strong>Anemia of renal failure</strong> — replaces the erythropoietin the failing kidneys no longer make"],
     ["Mechanism of action","Stimulates red blood cell production in the bone marrow"],
     ["Adverse reactions","<strong>Hypertension</strong>; seizures; <strong>thromboembolic events</strong> (stroke, MI, clotting of the dialysis access — black box warning); headache"],
     ["Contraindications","<strong>Uncontrolled hypertension</strong>"],
     ["Nursing interventions","Monitor <strong>BP and Hgb</strong>; <strong>hold if Hgb is above about 10–11 g/dL</strong> (stroke risk) and notify the provider; check iron levels; don't shake the vial"],
     ["Patient education","<strong>Iron supplements</strong> may be needed for it to work; the hemoglobin rises gradually over weeks; report headache, chest pain, or swelling/pain in a leg"]]}},
   {h:"Corticosteroids — Prednisone, Methylprednisolone (Prednisolone Acetate Eye Drops)"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","PO/IV, daily, then <strong>taper</strong>. <strong>Nephritis/glomerulonephritis</strong> — reduces kidney inflammation; <strong>nephrotic syndrome</strong> (especially minimal change disease); kidney transplant rejection. Eye drops reduce inflammation after cataract and retinal surgery"],
     ["Mechanism of action","Suppresses inflammation and the immune response"],
     ["Adverse reactions","<strong>Hyperglycemia</strong>; weight gain; <strong>infection risk</strong> (and masking of infection signs); sodium and fluid retention (edema, HTN); hypokalemia; osteoporosis; GI ulcers; mood changes; delayed wound healing; adrenal suppression. Long-term eye drops can raise IOP and promote cataracts"],
     ["Contraindications","<strong>Systemic fungal infections</strong>"],
     ["Nursing interventions","Monitor <strong>blood glucose</strong>, BP, weight, electrolytes, and for signs of infection; give oral doses in the morning with food"],
     ["Patient education","<strong>Never stop abruptly</strong> — taper to avoid adrenal crisis; <strong>wash hands often</strong> and avoid sick contacts; report fever or signs of infection"]]}},
   {h:"Acetylcysteine (Mucomyst) — Mucolytic / Renal Protectant"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","PO/IV, <strong>prior to scans with contrast</strong> (sometimes after as well), alongside IV hydration. <strong>Contrast protection</strong> — prevents AKI during imaging. Other uses: acetaminophen overdose antidote; inhaled mucolytic"],
     ["Mechanism of action","An <strong>antioxidant</strong> that scavenges free radicals"],
     ["Adverse reactions","Nausea, vomiting; <strong>bronchospasm</strong> (caution in asthma); IV can cause an anaphylactoid reaction (rash, flushing)"],
     ["Contraindications","Hypersensitivity"],
     ["Nursing interventions","<strong>Dilute the PO dose in juice or cola</strong> to mask the \"rotten egg\" (sulfur) smell; confirm it's given before the contrast study; monitor creatinine and urine output afterward"],
     ["Patient education","Explain it protects the kidneys from the contrast dye; the smell and taste are expected; drink fluids as instructed"]]}},
   {h:"Sodium Bicarbonate — Alkalinizer"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","PO/IV, PRN per ABG. <strong>Metabolic acidosis (pH below 7.35)</strong> in renal failure — oral daily for CKD, IV for severe acidosis; IV in hyperkalemia with acidosis (shifts K⁺ into cells)"],
     ["Mechanism of action","Buffers excess hydrogen ions in the blood"],
     ["Adverse reactions","<strong>Metabolic alkalosis</strong>; <strong>sodium and fluid overload</strong> (hypernatremia) (edema, HTN, heart failure); hypokalemia (K⁺ shifts into cells); gas and bloating with oral forms"],
     ["Contraindications","<strong>Respiratory alkalosis</strong>; severe edema"],
     ["Nursing interventions","Monitor <strong>ABGs and serum sodium</strong>, bicarbonate, potassium, and fluid status; don't mix IV bicarbonate with calcium (precipitate)"],
     ["Patient education","Separate oral bicarbonate from other oral meds (it changes stomach pH); report swelling or shortness of breath"]]}}
  ],
  check:{stem:"A client with CKD receiving epoetin alfa has a hemoglobin of 12.2 g/dL and a blood pressure of 168/98. What is the nurse's best action?",
   options:["Give the dose as scheduled","Hold the dose and notify the provider","Double the dose to maintain the hemoglobin","Give the dose with an iron supplement to boost its effect"],
   answer:1,
   why:"In CKD, epoetin alfa is reduced or held as hemoglobin approaches about 11 g/dL because higher levels raise the risk of heart attack, stroke, and blood clots. Hypertension is also a known adverse effect, so the nurse holds the dose and notifies the provider."}
},
{ id:"m3-meds-eyedrops", title:"Eye Medications", kicker:"Timolol, Latanoprost, Pilocarpine, Dorzolamide, and Atropine",
  blocks:[
   {h:"Timolol (Timoptic) — Beta Blocker Eye Drops"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","Eye drops, <strong>BID</strong> (once or twice daily). <strong>Glaucoma</strong> maintenance — lowers intraocular pressure (IOP). Related: betaxolol (cardioselective — safer for the lungs), levobunolol"],
     ["Mechanism of action","<strong>Decreases production</strong> of aqueous humor"],
     ["Adverse reactions","Local stinging, burning, blurred vision. Absorbed systemically through the nasolacrimal duct → <strong>bradycardia</strong>, hypotension, <strong>bronchospasm</strong>, fatigue; can mask hypoglycemia; can worsen heart failure"],
     ["Contraindications","<strong>Asthma/COPD</strong>; <strong>bradycardia</strong>; <strong>heart block</strong>; caution in heart failure and diabetes"],
     ["Nursing interventions","Check <strong>apical pulse and BP</strong> before giving — usually hold and contact the provider if the pulse is <strong>60 or less</strong> or systolic BP is <strong>below 90</strong> (get parameters); apply <strong>punctal occlusion</strong> (press the inner canthus) for <strong>1–2 minutes</strong> to prevent systemic absorption; additive effect with oral beta blockers"],
     ["Patient education","Use the drops for life — glaucoma has no symptoms until vision is lost; apply punctal occlusion after every dose; report shortness of breath, dizziness, or a slow pulse; tell every provider about the drops"]]}},
   {h:"Latanoprost (Xalatan) — Prostaglandin Analog Eye Drops"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","Eye drops, <strong>nightly</strong> (once daily at bedtime — using it more often can make it less effective). <strong>Glaucoma</strong> — lowers IOP. Related: bimatoprost, travoprost"],
     ["Mechanism of action","<strong>Increases outflow</strong> of aqueous humor"],
     ["Adverse reactions","<strong>Permanent darkening of the iris</strong> (brown, especially in hazel/green eyes); <strong>eyelash growth</strong> (longer, thicker, darker); eye redness; darkening of the eyelid skin. Systemic effects are minimal"],
     ["Contraindications","<strong>Pregnancy</strong> (relative); eye inflammation"],
     ["Nursing interventions","Refrigerate unopened bottles as directed; remove contact lenses before instilling and wait about 15 minutes to reinsert; punctal occlusion"],
     ["Patient education","It <strong>may permanently change eye color</strong> (especially noticeable if only one eye is treated); use it <strong>at bedtime</strong>; don't use extra doses"]]}},
   {hook:"Timolol <b>turns off the faucet</b> (less aqueous made); latanoprost <b>opens the drain</b> (more aqueous out). Either way, pressure falls."},
   {h:"Pilocarpine — Miotic (Cholinergic) Eye Drops"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","Eye drops. <strong>Glaucoma</strong>, including emergency angle-closure glaucoma. Related cholinergic: carbachol"],
     ["Mechanism of action","<strong>Constricts the pupil</strong> (miosis), contracting the iris sphincter so the trabecular meshwork opens and aqueous flows out"],
     ["Adverse reactions","<strong>Poor night vision</strong> / dim vision in low light (the pupil can't dilate in the dark); systemic: bradycardia, bronchospasm, increased salivation, sweating"],
     ["Contraindications","Conditions where pupil constriction is undesirable (e.g., acute eye inflammation); caution with asthma and cardiac disease"],
     ["Nursing interventions","Punctal occlusion; fall precautions in dim lighting; monitor HR"],
     ["Patient education","<strong>Avoid driving at night</strong>; use good lighting at home"]]}},
   {h:"Dorzolamide (drops) / Acetazolamide (PO/IV) — Carbonic Anhydrase Inhibitors"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","Eye drops (dorzolamide); PO/IV (acetazolamide). <strong>Glaucoma</strong>"],
     ["Mechanism of action","<strong>Decreases production</strong> of aqueous humor"],
     ["Adverse reactions","Paresthesias of fingers, toes, and face; polyuria; <strong>hypokalemia</strong>; renal calculi; photosensitivity; lethargy"],
     ["Contraindications","<strong>Sulfa (sulfonamide) allergy</strong>"],
     ["Nursing interventions","<strong>Assess for sulfa allergy</strong> before giving; monitor potassium; increase fluids unless contraindicated"],
     ["Patient education","<strong>Remove contact lenses</strong> before use; <strong>wait 15 minutes</strong> to reinsert; report tingling or muscle weakness"]]}},
   {h:"Atropine / Tropicamide — Mydriatics & Cycloplegics"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","Eye drops. <strong>Dilate the pupil</strong> for eye exams or surgery (tropicamide also paralyzes the ciliary muscle); cycloplegic drops after some eye injuries"],
     ["Mechanism of action","Blocks the muscles that constrict the pupil (dilation) and focus the lens (cycloplegia)"],
     ["Adverse reactions","Blurred vision, photophobia. Atropine toxicity: dry mouth, tachycardia, fever, urinary retention, confusion"],
     ["Contraindications","<strong>Never give to clients with glaucoma</strong> — dilation blocks outflow and spikes IOP"],
     ["Nursing interventions","Confirm there's no glaucoma history; arrange for a driver after the exam"],
     ["Patient education","<strong>Wear sunglasses</strong>; vision will be blurred and light-sensitive; don't drive for 24 hours unless told otherwise"]]}},
   {h:"Other Eye Medications to Know"},
   {table:{head:["Medication","Purpose","Critical safety & nursing tips"],rows:[
    ["<strong>Mannitol</strong> (IV osmotic diuretic)","Rapidly pulls fluid from the eye into the blood — emergency angle-closure glaucoma","<strong>Filter needle</strong> (crystallizes at low temperatures); watch for fluid overload and pulmonary edema (crackles). Full card in the Diuretics lesson"],
    ["<strong>Adrenergic agonists</strong> (dipivefrin, brimonidine)","Decrease production of aqueous humor (glaucoma)","Local irritation; monitor BP"],
    ["<strong>Anti-VEGF agents</strong> (ranibizumab, aflibercept, pegaptanib)","Intravitreal injection — inhibit abnormal blood vessel growth; slow vision loss in <strong>wet AMD</strong>","Monitor for eye pain, redness, vision change, discharge (endophthalmitis); increased IOP"],
    ["<strong>Ketorolac</strong> ophthalmic","NSAID drops — reduce inflammation and pain (post-op)","Local burning/stinging"],
    ["<strong>Post-op drops</strong> after cataract surgery","Antibiotic, corticosteroid, and NSAID drops","Hand hygiene, correct technique, follow the schedule. Long-term corticosteroid drops can raise IOP, cause cataracts, and mask infection"]
   ]}},
   {h:"General Administration \"Golden Rules\""},
   {list:[
    "<strong>Wait time:</strong> 5–10 minutes between different eye drops to prevent \"washing out\" the first one",
    "<strong>Asepsis:</strong> never let the dropper tip touch the eye, lashes, or any surface",
    "<strong>Position:</strong> tilt the head back, pull down the lower lid, and instill into the <strong>conjunctival sac</strong> — not directly on the cornea",
    "<strong>Punctal occlusion:</strong> press the inner canthus for 1–2 minutes (at least 60 seconds) after instilling to prevent systemic absorption",
    "Instill <strong>drops before ointments</strong>; apply ointment in a thin ribbon along the lower conjunctival sac from inner to outer canthus, ideally at bedtime (it blurs vision)",
    "Soft contact lenses can absorb some eye medications; preservatives can discolor lenses"]}
  ],
  check:{stem:"A client with glaucoma and a history of asthma is prescribed timolol eye drops. Which is the nurse's priority concern?",
   options:["Iris color change","Bronchospasm from systemic absorption","Eyelash growth","Photosensitivity"],
   answer:1,
   why:"Timolol is a nonselective beta blocker. Absorbed systemically through the nasolacrimal duct, it can cause bronchospasm, which is dangerous in asthma. Iris color change and eyelash growth are effects of prostaglandin analogs."}
}
]};

{
"h": "<span style=\"font-size:1.05em\">Part 5 · Fluid Volume Overload, Hyperkalemia &amp; Hypocalcemia</span>"
},
{
"h": "5.1  List signs of fluid volume overload for each category:"
},
{
"list": [
"VS: ↑ BP, ↑ HR, ↑ RR, ↓ O₂ sat",
"Resp: crackles, dyspnea, orthopnea, hypoxia, pink frothy sputum",
"Cardiac: bounding pulses, edema, JVD, weight gain, dysrhythmias",
"Skin: ascites, weeping skin, breakdown, anasarca",
"Labs: ↓ Hgb/Hct, ↓ albumin, ↓ Na⁺ (hemodiluted)",
"Neuro: restlessness/anxiety, confusion, seizures, ↑ ICP"
]
},
{
"h": "5.2  List six nursing interventions for fluid volume overload:"
},
{
"list": [
"Elevate HOB (high Fowler's); O₂ PRN",
"Daily weights (same time, scale, clothing)",
"Strict I&amp;O",
"Fluid and Na⁺ restriction",
"Diuretics (furosemide, spironolactone)",
"Measure abdominal girth; monitor lungs, skin, labs; dialysis if needed"
]
},
{
"h": "5.3  Why is sodium low in fluid volume overload? Should the nurse give sodium?"
},
{
"p": "Na⁺ is diluted by extra water. No — \"you treat the fluid, NOT the Na⁺.\" Remove the water."
},
{
"h": "5.4  What is the best indicator of fluid status? What does 1 kg of weight gain equal?"
},
{
"p": "Daily weight. 1 kg ≈ 1 L of fluid."
},
{
"h": "5.5  Hyperkalemia: What level is hyperkalemia? What EKG changes occur? List other signs."
},
{
"list": [
"K⁺ &gt; 5.0. Peaked T waves, widened QRS, flattened P, PVCs → V-tach/V-fib, cardiac arrest.",
"Other: N/V, abdominal cramps, diarrhea, muscle weakness/cramps, paralysis, fatigue."
]
},
{
"h": "5.6  Hyperkalemia medications:"
},
{
"table": {
"head": [
"Drug",
"What it does",
"Nursing consideration"
],
"rows": [
[
"Calcium gluconate",
"Stabilizes heart (\"calms the heart\")",
"Given FIRST with EKG changes; does NOT lower K⁺; monitor for bradycardia"
],
[
"Regular insulin + dextrose",
"Shifts K⁺ into cells",
"Temporary; check glucose often (hypoglycemia)"
],
[
"Sodium bicarbonate",
"Corrects acidosis; shifts K⁺ into cells",
"Monitor ABGs, fluid (Na⁺ load)"
],
[
"Lokelma / patiromer / Kayexalate",
"Remove K⁺ through the GI tract",
"Monitor K⁺, bowel function"
],
[
"Dialysis",
"Removes K⁺ from blood",
"Last resort / definitive"
]
]
}
},
{
"h": "5.7  A patient's K⁺ is 6.8 and the monitor shows peaked T waves. What is the priority medication and why?"
},
{
"p": "IV calcium gluconate — protects the heart from lethal dysrhythmias while insulin/dextrose, binders, or dialysis lower the K⁺."
},
{
"h": "5.8  What should the nurse teach about potassium? What common product must be avoided?"
},
{
"p": "Avoid high-K⁺ foods (bananas, oranges, tomatoes, potatoes, dairy). Avoid salt substitutes (potassium chloride)."
},
{
"h": "5.9  Why do hypocalcemia and hyperphosphatemia occur together in CKD?"
},
{
"p": "Kidneys can't excrete phosphorus → phos ↑ → calcium ↓ (they move opposite). Kidneys also can't activate vitamin D → less calcium absorbed."
},
{
"h": "5.10  Define and describe how you test:"
},
{
"list": [
"Chvostek's: tap the facial nerve in front of the ear → facial twitch",
"Trousseau's: inflate a BP cuff on the arm → carpal (hand) spasm"
]
},
{
"h": "5.11  What is the PRIORITY assessment in hypocalcemia? What meds and teaching are used?"
},
{
"list": [
"Airway — laryngospasm (stridor, dyspnea).",
"Meds: phosphate binders (sevelamer, calcium carbonate), calcium supplements, vitamin D. Monitor EKG (prolonged QT), DTRs, electrolytes, PTH.",
"Teach: avoid high-phos foods, adequate hydration, weight-bearing exercise, daily weights."
]
},
{

"Bleeding / blood loss (heparin)",
"Infection; muscle cramps; noncompliance"

{
"h": "6.8  Define disequilibrium syndrome and list its signs."
},
{
"p": "Rapid fluid/solute shifts during dialysis → headache, N/V, confusion, restlessness, seizures."
},
{
"h": "6.9  A patient's BP drops to 82/50 during hemodialysis. What is the likely cause and what should be done?"
},
{
"p": "Too much fluid removed too fast. Notify dialysis nurse/provider to slow or stop fluid removal, lower HOB/raise legs, give NS bolus per protocol, monitor vitals."
},
{
"h": "6.10  Peritoneal dialysis: What does cloudy outflow indicate? What should the nurse do if outflow is less than inflow? Why does constipation matter?"
},
{
"list": [
"Cloudy = peritonitis → report (with fever, abdominal pain).",
"Outflow &lt; inflow → check tubing for kinks, reposition patient, check for constipation.",
"A full bowel blocks the catheter and slows drainage. Also warm solution with dry heat (never microwave)."
]
},
{
"h": "<span style=\"font-size:1.05em\">Part 7 · Renal Diet</span>"
},
{
"h": "7.1  What should the patient on dialysis be taught about the following? How would you explain this as the nurse?"
},
{
"list": [
"a. Potassium: limit fruits, vegetables, dairy high in K⁺ (bananas, OJ, tomatoes, potatoes); builds up between HD treatments and affects the heart",
"b. Phosphorus: limit dairy, protein foods, nuts, seeds, dried beans, chocolate, colas, whole grains",
"c. Binders: take with every meal and snack — they soak up phosphorus in the gut",
"d. Sodium: fresh/no-salt-added foods; rinse canned foods; avoid canned soups, pickles, processed foods",
"e. Fluids: follow fluid limit; ice, soup, gelatin count as fluid",
"f. Protein: low in AKI/pre-dialysis; HIGHER once on dialysis (dialysis removes protein)",
"g. Salt substitutes: avoid — they contain potassium chloride"
]
},

],

]
]

{
"h": "7.3  Why might a peritoneal dialysis patient be told to eat MORE potassium? Do PD patients still limit phosphorus?"

"p": "PD runs daily and removes K⁺ well → they can run low. Yes — phosphorus is poorly removed by PD, so they still limit it."
},

},

}

{ id:"mathdose", title:"Dosage Calculations & Basic Conversions", kicker:"The building blocks every other calculation relies on",

   {h:"Basic Dosage Calculation"},
   {p:"<strong>Formula:</strong> (Desired ÷ Have) × Quantity = Amount to administer"},
   {p:"<strong>Worked example:</strong> Order is 500 mg PO; available as 250 mg tablets. (500 ÷ 250) × 1 tablet = <strong>2 tablets</strong>."},
   {p:"<strong>Worked example 2:</strong> Order is 2 mg lorazepam; available as a 4 mg/mL vial. (2 ÷ 4) × 1 mL = <strong>0.5 mL</strong>."},
