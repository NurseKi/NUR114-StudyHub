"game-lightning":[
 {stem:"Calcium gluconate lowers serum potassium.", options:["True","False"], noShuffle:true, answer:1, why:"Calcium gluconate stabilizes the heart against high potassium but does not lower the level — insulin with dextrose shifts it and binders or dialysis remove it.", ref:"m3-meds-lytes"},
 {stem:"IV regular insulin given with dextrose shifts potassium into the cells.", options:["True","False"], noShuffle:true, answer:0, why:"Insulin drives potassium into cells within minutes; dextrose is given with it to prevent hypoglycemia.", ref:"elim-lytes"},
 {stem:"A potassium level of 5.3 mEq/L is hyperkalemia.", options:["True","False"], noShuffle:true, answer:1, why:"Normal potassium is 3.5–5.5 mEq/L, so 5.3 is still within range.", ref:"elim-lytes"},
 {stem:"Spironolactone is the diuretic of choice for a client with hyperkalemia and fluid overload.", options:["True","False"], noShuffle:true, answer:1, why:"Spironolactone retains potassium and is contraindicated with K⁺ above 5.0; a loop diuretic such as furosemide is used instead.", ref:"m3-meds-diuretics"},
 {stem:"Lokelma can be given as a retention enema.", options:["True","False"], noShuffle:true, answer:1, why:"Lokelma is oral only — mix it right before giving and have the client drink it immediately; Kayexalate is the binder that can be given rectally.", ref:"m3-meds-lytes"},
 {stem:"The nurse assesses bowel sounds before giving Kayexalate.", options:["True","False"], noShuffle:true, answer:0, why:"Kayexalate removes potassium through the stool, so a gut that isn't moving can't clear it and the drug can cause intestinal necrosis.", ref:"m3-meds-lytes"},
 {stem:"Patiromer is a good choice for emergency hyperkalemia.", options:["True","False"], noShuffle:true, answer:1, why:"Patiromer has a delayed onset of hours to days, so it's for long-term potassium control, not emergencies.", ref:"m3-meds-lytes"},
 {stem:"Phosphate binders are given with the first bite of a meal.", options:["True","False"], noShuffle:true, answer:0, why:"Binders soak up phosphorus from food in the gut, so they must be in the stomach when the food arrives.", ref:"m3-meds-lytes"},
 {stem:"If the client skips a meal, the phosphate binder for that meal is skipped too.", options:["True","False"], noShuffle:true, answer:0, why:"Skip the meal, skip the pill — with no food there is no dietary phosphorus to bind.", ref:"m3-meds-lytes"},
 {stem:"Chvostek's sign is tested by inflating a BP cuff on the upper arm.", options:["True","False"], noShuffle:true, answer:1, why:"Chvostek is a facial twitch when the cheek (facial nerve) is tapped; the BP cuff test is Trousseau's sign.", ref:"elim-lytes"},
 {stem:"A slowing heart rate in a client with hyperkalemia means the potassium is improving.", options:["True","False"], noShuffle:true, answer:1, why:"Hyperkalemia causes tachycardia first, then bradycardia and asystole — slowing can be the step before arrest.", ref:"elim-lytes"},
 {stem:"Rising BUN and creatinine should prompt the nurse to check the potassium level.", options:["True","False"], noShuffle:true, answer:0, why:"When the kidneys stop clearing wastes they also stop clearing potassium, and potassium is the electrolyte that kills first.", ref:"elim-lytes"},
 {stem:"A weight gain of 1 kg equals about 1 L of retained fluid.", options:["True","False"], noShuffle:true, answer:0, why:"1 kg = 1 L, which is why daily weights are the best measure of fluid gain or loss.", ref:"m3math-renal"},
 {stem:"Incentive spirometry removes fluid from the lungs in pulmonary edema.", options:["True","False"], noShuffle:true, answer:1, why:"IS helps prevent atelectasis but doesn't move fluid out of the lungs — HOB up, O₂, diuretics, and dialysis do.", ref:"elim-lytes"},
 {stem:"Anuria is a urine output of less than 50 mL in 24 hours.", options:["True","False"], noShuffle:true, answer:0, why:"Anuria is below 50 mL/24 h; oliguria is below about 400–500 mL/24 h.", ref:"elim-keyterms"},
 {stem:"The minimum acceptable adult urine output is about 30 mL/hr.", options:["True","False"], noShuffle:true, answer:0, why:"The minimum is about 0.5 mL/kg/hr, roughly 30 mL/hr for an average adult.", ref:"elim-keyterms"},
 {stem:"A BUN:creatinine ratio above 20:1 points toward prerenal AKI.", options:["True","False"], noShuffle:true, answer:0, why:"In prerenal AKI the underperfused kidney reabsorbs urea, so BUN rises out of proportion to creatinine.", ref:"elim-aki"},
 {stem:"In the diuretic phase of AKI, the main risks are fluid volume deficit and potassium loss.", options:["True","False"], noShuffle:true, answer:0, why:"The kidneys make large volumes of dilute urine but can't yet regulate electrolytes, so fluid, potassium, and sodium are lost.", ref:"elim-aki"},
 {stem:"Lactated Ringer's is the preferred IV fluid in renal failure.", options:["True","False"], noShuffle:true, answer:1, why:"LR contains potassium and is usually avoided in renal failure because it can worsen hyperkalemia.", ref:"elim-aki"},
 {stem:"Diabetes is the leading cause of chronic kidney disease.", options:["True","False"], noShuffle:true, answer:0, why:"Diabetes is the leading cause of CKD, followed by hypertension.", ref:"elim-ckd"},
 {stem:"Protein intake usually increases once a client starts dialysis.", options:["True","False"], noShuffle:true, answer:0, why:"Dialysis removes protein, so high-quality protein is increased once treatments begin.", ref:"elim-ckd"},
 {stem:"Epoetin alfa should be held if the hemoglobin is above about 11 g/dL.", options:["True","False"], noShuffle:true, answer:0, why:"A hemoglobin above about 10–11 g/dL on epoetin raises the risk of stroke and clotting, so the dose is held and the provider notified.", ref:"m3-meds-renal"},
 {stem:"A blood pressure may be taken in the fistula arm if the other arm has an IV.", options:["True","False"], noShuffle:true, answer:1, why:"No BP, IVs, or venipuncture in the fistula arm, ever — compression can clot the access.", ref:"elim-dialysis"},
 {stem:"An absent thrill and bruit means the AV fistula is working normally.", options:["True","False"], noShuffle:true, answer:1, why:"A thrill and bruit mean the access is patent; their absence suggests clotting and is reported immediately.", ref:"elim-dialysis"},
 {stem:"An AV graft is ready to use sooner than an AV fistula.", options:["True","False"], noShuffle:true, answer:0, why:"A graft can be used in about 2–3 weeks, while a fistula needs about 1–3 months to mature.", ref:"elim-dialysis"},
 {stem:"Cloudy peritoneal dialysis effluent suggests peritonitis.", options:["True","False"], noShuffle:true, answer:0, why:"Any cloudy PD outflow is peritonitis until proven otherwise and is reported right away.", ref:"elim-dialysis"},
 {stem:"Post-dialysis labs are drawn immediately after the treatment ends.", options:["True","False"], noShuffle:true, answer:1, why:"Labs are drawn at least 2–3 hours afterward; values drawn right away are falsely low while solutes re-equilibrate.", ref:"elim-dialysis"},
 {stem:"Antihypertensives are commonly held before hemodialysis.", options:["True","False"], noShuffle:true, answer:0, why:"Dialysis removes fluid and can drop the BP, so antihypertensives are usually held until after treatment.", ref:"elim-dialysis"},
 {stem:"Acute glomerulonephritis often follows a strep infection by about 2–3 weeks.", options:["True","False"], noShuffle:true, answer:0, why:"Antigen–antibody complexes from a recent strep infection lodge in the glomeruli about 2–3 weeks later.", ref:"elim-gn"},
 {stem:"Cola-colored urine is a classic sign of nephrotic syndrome.", options:["True","False"], noShuffle:true, answer:1, why:"Cola-colored (smoky) urine is hematuria from nephritic disease; nephrotic urine is foamy from protein.", ref:"elim-nephrotic"},
 {stem:"WBC casts show that a urinary infection involves the kidney.", options:["True","False"], noShuffle:true, answer:0, why:"WBC casts form in the renal tubules, so they place the infection in the kidney rather than only the bladder.", ref:"elim-pyelo"},
 {stem:"A client with pyelonephritis should limit fluids to 1 L per day.", options:["True","False"], noShuffle:true, answer:1, why:"Fluids are encouraged to 2–3 L/day, unless contraindicated, to flush bacteria from the urinary tract.", ref:"elim-pyelo"},
 {stem:"Nephrotic syndrome increases the risk of blood clots.", options:["True","False"], noShuffle:true, answer:0, why:"Clotting-regulating proteins are lost in the urine, making the blood hypercoagulable — watch for DVT, PE, and renal vein thrombosis.", ref:"elim-nephrotic"},
 {stem:"Ibuprofen is a safe choice for flank pain in polycystic kidney disease.", options:["True","False"], noShuffle:true, answer:1, why:"NSAIDs are avoided in PKD — they raise bleeding risk from cysts and are nephrotoxic.", ref:"elim-pkd"},
 {stem:"Blood pressure control is the priority for slowing nephrosclerosis.", options:["True","False"], noShuffle:true, answer:0, why:"Nephrosclerosis is driven by hypertension hardening the renal arteries, so aggressive BP control slows it.", ref:"elim-nephrosclerosis"},
 {stem:"Furosemide is a potassium-sparing diuretic.", options:["True","False"], noShuffle:true, answer:1, why:"Furosemide is a loop diuretic that wastes potassium — monitor for hypokalemia; spironolactone is the potassium-sparing one.", ref:"m3-meds-diuretics"},
 {stem:"Open-angle glaucoma is usually painless.", options:["True","False"], noShuffle:true, answer:0, why:"Open-angle glaucoma causes gradual, painless peripheral vision loss; acute angle-closure is the painful emergency.", ref:"sens-glaucoma"},
 {stem:"Atropine eye drops are safe for a client with glaucoma.", options:["True","False"], noShuffle:true, answer:1, why:"Atropine dilates the pupil, which blocks aqueous outflow and spikes intraocular pressure.", ref:"m3-meds-eyedrops"},
 {stem:"Timolol lowers intraocular pressure by decreasing aqueous humor production.", options:["True","False"], noShuffle:true, answer:0, why:"Timolol, a beta blocker, turns off the faucet — less aqueous humor is made, so pressure falls.", ref:"m3-meds-eyedrops"},
 {stem:"Latanoprost works best when used several times a day.", options:["True","False"], noShuffle:true, answer:1, why:"Latanoprost is given once daily at bedtime; using it more often can make it less effective.", ref:"m3-meds-eyedrops"},
 {stem:"A detached retina usually causes severe eye pain.", options:["True","False"], noShuffle:true, answer:1, why:"Retinal detachment is painless; severe eye pain points to acute angle-closure glaucoma.", ref:"sens-retina"},
 {stem:"Flashes, new floaters, and a curtain over the vision suggest retinal detachment.", options:["True","False"], noShuffle:true, answer:0, why:"These are the classic signs of retinal detachment, an emergency that needs prompt repair.", ref:"sens-retina"},
 {stem:"A sudden change on the Amsler grid should be reported promptly.", options:["True","False"], noShuffle:true, answer:0, why:"New wavy or missing lines can mean dry AMD has turned wet, which responds best to early treatment.", ref:"sens-amd"},
 {stem:"Macular degeneration affects peripheral vision first.", options:["True","False"], noShuffle:true, answer:1, why:"AMD damages the macula, so central vision blurs while peripheral vision is kept.", ref:"sens-amd"},
 {stem:"Cataracts cause a sudden, painful loss of vision.", options:["True","False"], noShuffle:true, answer:1, why:"Cataracts develop slowly and painlessly, causing gradually blurred, hazy vision.", ref:"sens-cataract"},
 {stem:"After cataract surgery, the client should avoid bending at the waist.", options:["True","False"], noShuffle:true, answer:0, why:"Bending at the waist and heavy lifting raise intraocular pressure and can damage the surgical site.", ref:"sens-cataract"},
 {stem:"For a chemical splash to the eye, irrigation comes before taking a history.", options:["True","False"], noShuffle:true, answer:0, why:"Immediate, copious irrigation for at least 15 minutes limits damage; history and acuity come after it starts.", ref:"sens-emergencies"},
 {stem:"The nurse should irrigate the eye to remove an embedded object.", options:["True","False"], noShuffle:true, answer:1, why:"Embedded or penetrating objects are not irrigated or removed by the nurse — stabilize and get emergency ophthalmology care.", ref:"sens-emergencies"},

labs:{title:"Lab Ranges & Thresholds", cards:[
 {f:"Serum creatinine — normal", b:"<strong>0.6–1.2 mg/dL</strong>. Best, most specific marker of kidney function; rises only after about 50% of function is lost, so a \"slightly high\" value is significant."},
 {f:"BUN — normal", b:"<strong>About 10–20 mg/dL</strong>. Less specific than creatinine — also raised by dehydration, GI bleeding, high protein intake, and catabolism."},
 {f:"BUN:creatinine ratio", b:"Normal <strong>10:1–20:1</strong>. <strong>Above 20:1 → prerenal</strong> (dehydration/low perfusion). 10:1–15:1 with both high → intrarenal or postrenal."},
 {f:"GFR — normal", b:"<strong>About 100–120 mL/min</strong>. Best overall measure of kidney function; decreases with age. CKD = GFR below 60 for 3 months or more (or kidney damage)."},
 {f:"CKD stages by GFR", b:"1: 90 or above · 2: 60–89 · 3a/3b: 45–59 / 30–44 · <strong>4: 15–29 (prepare for dialysis/transplant)</strong> · 5: below 15 or on dialysis (ESRD)."},
 {f:"Potassium (K⁺) — normal", b:"<strong>3.5–5.5 mEq/L</strong>. Hyperkalemia = above 5.5 (peaked T waves). Hypokalemia = below 3.5 (U waves). Spironolactone contraindicated with K⁺ above 5.0."},
 {f:"Sodium (Na⁺) — normal", b:"<strong>135–145 mEq/L</strong>. Often low (dilutional) in renal failure with fluid overload."},
 {f:"Calcium (Ca²⁺) — normal", b:"<strong>8.5–10.5 mg/dL</strong>. Low in renal failure (check albumin). Inversely related to phosphorus."},
 {f:"Phosphorus — normal", b:"<strong>2.5–4.5 mg/dL</strong>. High in renal failure → pruritus, soft tissue calcifications, bone disease, low calcium."},
 {f:"Phosphorus targets in CKD", b:"<strong>CKD stages 3–4: 2.7–4.6 mg/dL</strong>. <strong>Dialysis: 3.0–5.5 mg/dL</strong>."},
 {f:"Magnesium (Mg²⁺) — normal", b:"<strong>1.5–2.5 mEq/L</strong>. High in renal failure (kidneys can't excrete it) → avoid Milk of Magnesia and Mg antacids."},
 {f:"Bicarbonate (HCO₃⁻) — normal", b:"<strong>22–26 mEq/L</strong>. Low in renal failure = metabolic acidosis (pH below 7.35) → Kussmaul respirations."},
 {f:"ABG normals", b:"pH <strong>7.35–7.45</strong> · PaCO₂ <strong>35–45 mmHg</strong> · HCO₃⁻ <strong>22–26 mEq/L</strong> · PaO₂ <strong>80–100 mmHg</strong> · SaO₂ <strong>95–100%</strong>."},
 {f:"Fully compensated ABG — pH clue", b:"pH normal but CO₂ and HCO₃⁻ both abnormal. <strong>7.35–7.39 → acidosis origin</strong>; <strong>7.41–7.45 → alkalosis origin</strong>."},
 {f:"Epoetin alfa — hold parameter", b:"<strong>Hold if Hgb above about 10–11 g/dL</strong> and notify the provider — stroke, MI, and clot risk. Also hold/report with uncontrolled hypertension."},
 {f:"Minimum adult urine output", b:"<strong>At least 0.5 mL/kg/hr (about 30 mL/hr)</strong>. Falling below this for several hours is an early cue of kidney injury."},
 {f:"Oliguria vs. anuria", b:"<strong>Oliguria:</strong> less than 400–500 mL/24 hr. <strong>Anuria:</strong> less than 50 mL/24 hr — notify the provider immediately."},
 {f:"Fluid restriction formula", b:"<strong>Previous 24-hr output + about 500–600 mL</strong> (insensible losses). IV fluids and IV meds count toward the limit."},
 {f:"Daily weight rule", b:"<strong>1 kg = 1 L</strong> of fluid. Rapid weight gain = fluid retention; dialysis weight loss = fluid removed."},
 {f:"Nephrotic proteinuria", b:"<strong>More than 3.5 g/day</strong> of protein in the urine, with low serum albumin (e.g., 1.8 g/dL) and hyperlipidemia."},
 {f:"Intraocular pressure (IOP) — normal", b:"<strong>About 10–21 mmHg</strong>. Usually highest in the morning — document the time. Elevated IOP damages the optic nerve (glaucoma)."},
 {f:"Urine specific gravity", b:"Normal <strong>about 1.005–1.030</strong>. High = concentrated (dehydration/prerenal). Fixed near 1.010 = tubules can't concentrate or dilute (intrarenal)."},
 {f:"Timolol — hold parameters", b:"Usually hold and contact the provider if <strong>pulse 60 or less</strong> or <strong>systolic BP below 90</strong> (get the provider's parameters)."}
]},
renalmeds:{title:"Renal & F&amp;E Medications", cards:[
 {f:"Furosemide (Lasix)", b:"<strong>Loop diuretic</strong> · fluid overload, pulmonary edema, hyperkalemia (works at low GFR) · monitor K⁺, BP, weight, I&amp;O; IV no faster than 4 mg/min · <strong>hypokalemia, ototoxicity (tinnitus)</strong>; contraindicated with anuria or sulfa allergy."},
 {f:"Spironolactone (Aldactone)", b:"<strong>Potassium-sparing diuretic</strong> (blocks aldosterone) · edema without K⁺ loss, HF · monitor K⁺ and ECG; no K⁺ supplements or salt substitutes · <strong>hyperkalemia</strong>; contraindicated with K⁺ above 5.0 or severe renal failure."},
 {f:"Mannitol (Osmitrol)", b:"<strong>Osmotic diuretic</strong> · acute angle-closure glaucoma, increased ICP · <strong>filter needle</strong> (crystallizes); key lab serum osmolality; monitor lung sounds · <strong>pulmonary edema/fluid overload</strong>; no active intracranial bleed. Less commonly used in kidney failure."},
 {f:"Calcium acetate (PhosLo)", b:"<strong>Calcium-based phosphate binder</strong> · lowers phosphorus in CKD/ESRD · give with the <strong>first bite of every meal</strong> — skip the meal, skip the pill · <strong>hypercalcemia</strong>, constipation."},
 {f:"Sevelamer (Renvela)", b:"<strong>Non-calcium phosphate binder</strong> (used when calcium is already high) · lowers phosphorus · with meals; <strong>dose per meal = daily dose ÷ meals actually eaten</strong>; separate from other oral meds · constipation, GI upset; contraindicated in bowel obstruction."},
 {f:"Calcium gluconate (IV)", b:"<strong>Electrolyte / cardiac protectant</strong> · hyperkalemia (FIRST — stabilizes the heart, doesn't lower K⁺), symptomatic hypocalcemia, hypermagnesemia · cardiac monitor; give slowly; don't mix with bicarbonate · <strong>bradycardia, extravasation necrosis</strong>; caution with digoxin toxicity."},
 {f:"Vitamin D (calcitriol; D3)", b:"<strong>Vitamin D analog</strong> · renal bone disease — failing kidneys can't activate vitamin D; ↑ Ca absorption, suppresses PTH · monitor Ca and phosphorus (inverse) · <strong>hypercalcemia</strong>; not given if Ca or P is too high."},
 {f:"Kayexalate (sodium polystyrene sulfonate)", b:"<strong>Cation-exchange resin</strong> · hyperkalemia (removes K⁺ in stool) · PO or retention enema (hold 30–60 min); <strong>assess bowel sounds first</strong> · <strong>intestinal necrosis</strong>, Na⁺ retention; contraindicated with ileus/obstruction."},
 {f:"Patiromer (Veltassa)", b:"<strong>Potassium binder</strong> · long-term K⁺ control in CKD · <strong>3 hours apart from other oral meds</strong>; with food · onset hours–days, <strong>not for emergencies</strong>; hypomagnesemia, constipation."},
 {f:"Lokelma (sodium zirconium cyclosilicate)", b:"<strong>Potassium binder</strong> · hyperkalemia — fastest binder (about 1 hr) · <strong>oral only</strong>; mix right before giving and drink immediately · <strong>edema/fluid overload</strong> (contains sodium), hypokalemia."},
 {f:"Epoetin alfa (Epogen, Procrit)", b:"<strong>Erythropoiesis-stimulating agent</strong> · anemia of CKD · monitor BP and Hgb; <strong>hold if Hgb above ~10–11</strong>; check iron; don't shake · <strong>hypertension, stroke/MI/clots</strong>; contraindicated with uncontrolled HTN."},
 {f:"Corticosteroids (prednisone, methylprednisolone)", b:"<strong>Anti-inflammatory/immunosuppressant</strong> · glomerulonephritis, nephrotic syndrome, transplant rejection · monitor glucose, BP, weight, infection; give AM with food; <strong>taper — never stop abruptly</strong> · <strong>hyperglycemia, infection</strong>, fluid retention."},
 {f:"Acetylcysteine (Mucomyst)", b:"<strong>Antioxidant / renal protectant</strong> · prevents contrast-induced AKI · <strong>give before the contrast scan</strong> with IV hydration; mask the rotten-egg smell in juice; monitor creatinine and UO after · <strong>bronchospasm</strong> (caution asthma), N/V."},
 {f:"Sodium bicarbonate", b:"<strong>Alkalinizer</strong> · metabolic acidosis (pH below 7.35); shifts K⁺ into cells in hyperkalemia · monitor ABGs, Na⁺, K⁺, fluid status; don't mix with calcium · <strong>metabolic alkalosis, Na⁺/fluid overload</strong>, hypokalemia."},
 {f:"Regular insulin + D50 (hyperkalemia)", b:"<strong>Shift</strong> step · about 10 units regular insulin <strong>IV (not subQ)</strong> with D50 drives K⁺ into cells · monitor blood glucose closely · <strong>hypoglycemia</strong>; K⁺ is shifted, not removed."}
]},
eyemeds:{title:"Eye Medications & Golden Rules", cards:[
 {f:"Timolol (Timoptic)", b:"<strong>Beta blocker drops</strong> — ↓ aqueous production (turns off the faucet). Check apical pulse/BP; <strong>punctal occlusion</strong> 1–2 min. <strong>Avoid in asthma/COPD, bradycardia, heart block</strong> — systemic absorption causes bradycardia, bronchospasm."},
 {f:"Latanoprost (Xalatan)", b:"<strong>Prostaglandin analog</strong> — ↑ aqueous outflow (opens the drain). <strong>Once nightly</strong> (more often = less effective). Permanent <strong>iris darkening</strong>, longer/thicker lashes. Remove contacts; wait 15 min."},
 {f:"Pilocarpine", b:"<strong>Miotic (cholinergic)</strong> — constricts the pupil to open the trabecular meshwork; glaucoma incl. emergency angle-closure. <strong>Poor night vision</strong> — avoid night driving, good lighting, fall precautions."},
 {f:"Dorzolamide / acetazolamide", b:"<strong>Carbonic anhydrase inhibitors</strong> — ↓ aqueous production. <strong>Check for sulfa allergy</strong>. Paresthesias, hypokalemia, kidney stones. Remove contacts; wait 15 min to reinsert."},
 {f:"Atropine / tropicamide", b:"<strong>Mydriatics / cycloplegics</strong> — dilate the pupil for exams/surgery. <strong>Never in glaucoma</strong> (dilation blocks outflow, spikes IOP). Sunglasses; no driving for 24 hr; arrange a driver."},
 {f:"Mannitol (eye use)", b:"<strong>IV osmotic diuretic</strong> — rapidly pulls fluid from the eye into the blood in <strong>emergency angle-closure glaucoma</strong>. Filter needle; watch for fluid overload and crackles."},
 {f:"Anti-VEGF agents (ranibizumab, aflibercept)", b:"<strong>Intravitreal injection</strong> — inhibit abnormal vessel growth in <strong>wet AMD</strong> (and diabetic macular edema). Report eye pain, redness, vision change, discharge (endophthalmitis); ↑ IOP."},
 {f:"Post-op cataract drops", b:"<strong>Antibiotic, corticosteroid, and NSAID (ketorolac) drops</strong> several times daily for 2–4 weeks. Hand hygiene and technique. Long-term steroid drops can raise IOP, cause cataracts, mask infection."},
 {f:"Golden rule: wait time", b:"Wait <strong>5–10 minutes between different eye drops</strong> so the second doesn't wash out the first. Drops before ointments."},
 {f:"Golden rule: asepsis", b:"<strong>Never let the dropper tip touch</strong> the eye, lashes, or any surface."},
 {f:"Golden rule: position", b:"Tilt the head back, pull down the lower lid, instill into the <strong>conjunctival sac</strong> — not directly on the cornea."},
 {f:"Golden rule: punctal occlusion", b:"Press the <strong>inner canthus 1–2 minutes</strong> (at least 60 seconds) after instilling to prevent systemic absorption — essential with timolol."}
]},
mnemonics:{title:"Mnemonics", cards:[
 {f:"ROME", b:"<strong>Respiratory Opposite</strong> — pH and CO₂ move in opposite directions. <strong>Metabolic Equal</strong> — pH and HCO₃⁻ move the same direction. (ABG interpretation)"},
 {f:"AEIOU", b:"Indications for emergent dialysis: <strong>A</strong>cidosis · <strong>E</strong>lectrolytes (hyperkalemia) · <strong>I</strong>ntoxication · <strong>O</strong>verload (fluid) · <strong>U</strong>remia."},
 {f:"RENAL", b:"Hypermagnesemia: <strong>R</strong>eflexes decreased · <strong>E</strong>CG changes (bradycardia) and hypotension · <strong>N</strong>ausea/vomiting · <strong>A</strong>ppearance flushed · <strong>L</strong>ethargy."},
 {f:"STARVED", b:"Hypomagnesemia: <strong>S</strong>eizures · <strong>T</strong>etany · <strong>A</strong>norexia and arrhythmias · <strong>R</strong>apid heart rate · <strong>V</strong>omiting · <strong>E</strong>motional lability · <strong>D</strong>TRs increased."},
 {f:"SALT", b:"Hypernatremia (cells shrink): <strong>S</strong>kin flushed · <strong>A</strong>gitation · <strong>L</strong>ow-grade fever · <strong>T</strong>hirst."},
 {f:"SUCTION", b:"Hypokalemia: <strong>S</strong>keletal muscle weakness · <strong>U</strong> waves · <strong>C</strong>onstipation · <strong>T</strong>oxicity (digoxin) · <strong>I</strong>rregular/weak pulse · <strong>O</strong>rthostatic hypotension · <strong>N</strong>umbness."},
 {f:"A-W-E-T-B-E-D", b:"Seven kidney functions: <strong>A</strong>cid–base balance · <strong>W</strong>ater balance · <strong>E</strong>lectrolytes · <strong>T</strong>oxin removal (BUN/creatinine) · <strong>B</strong>lood pressure (renin) · <strong>E</strong>rythropoietin · vitamin <strong>D</strong> activation."},
 {f:"CBIGKD (\"see big kid\")", b:"Hyperkalemia treatment: <strong>C</strong>alcium gluconate · <strong>B</strong>icarbonate · <strong>I</strong>nsulin · <strong>G</strong>lucose · <strong>K</strong>ayexalate · <strong>D</strong>ialysis."},
 {f:"Stabilize → Shift → Remove", b:"Hyperkalemia order: <strong>Stabilize</strong> the heart (calcium gluconate first) → <strong>Shift</strong> K⁺ into cells (IV regular insulin + D50, bicarbonate, albuterol) → <strong>Remove</strong> K⁺ (furosemide, Kayexalate/Lokelma, dialysis)."},
 {f:"Loop = Lose / Sparing = Keep", b:"<strong>Loop</strong> diuretics (furosemide) <strong>lose</strong> potassium. Potassium-<strong>sparing</strong> diuretics (spironolactone) <strong>keep</strong> it — avoid them in hyperkalemia."},
 {f:"Chvostek = cheek / Trousseau = tourniquet", b:"Hypocalcemia signs. <strong>Chvostek:</strong> tap the cheek → facial twitch. <strong>Trousseau:</strong> inflate a BP cuff → carpal spasm."},
 {f:"Broca's = Broken / Wernicke's = Word salad", b:"<strong>Broca's (expressive):</strong> understands but speech is broken, halting — frustrated. <strong>Wernicke's (receptive):</strong> fluent speech that makes little sense — often unaware."},
 {f:"Faucet vs. drain", b:"<strong>Timolol turns off the faucet</strong> (less aqueous made). <strong>Latanoprost opens the drain</strong> (more aqueous out). Either way, IOP falls."},
 {f:"Skip the meal, skip the pill", b:"<strong>Phosphate binders</strong> (calcium acetate, sevelamer) only work with food — give with the first bite of each meal; no meal, no dose."},
 {f:"Feel the thrill, hear the bruit", b:"<strong>AV fistula/graft patency</strong> every shift: palpate the thrill (vibration), auscultate the bruit (swish). Absent = report (possible clot)."},
 {f:"NephrItic vs. NephrOtic", b:"<strong>NephrItic</strong> (glomerulonephritis) = blood/HTN — cola-colored urine. <strong>NephrOtic</strong> = protein/edema — massive proteinuria, anasarca."},
 {f:"Pre / Intra / Post", b:"AKI types: <strong>Prerenal</strong> — before the kidney (perfusion). <strong>Intrarenal</strong> — in the kidney (tissue damage). <strong>Postrenal</strong> — after the kidney (obstruction)."},
 {f:"Curtain = call now", b:"A <strong>curtain or shadow</strong> over the vision with flashes and floaters = <strong>retinal detachment</strong> — an emergency."},
 {f:"Weber: louder in the bad ear = conductive", b:"<strong>Conductive</strong> loss → sound lateralizes to the affected ear. <strong>Sensorineural</strong> → sound lateralizes to the unaffected ear."}
]},
terms:{title:"Key Terms", cards:[
 {f:"Azotemia", b:"A rise in BUN, creatinine, uric acid, and other nitrogenous wastes in the blood — a <strong>lab finding</strong>, with or without symptoms."},
 {f:"Uremia", b:"<strong>Azotemia with symptoms</strong> — hyperkalemia, edema, anemia, and other systemic effects of waste buildup."},
 {f:"Oliguria", b:"Urine output <strong>less than 400–500 mL in 24 hours</strong>."},
 {f:"Anuria", b:"Urine output <strong>less than 50 mL in 24 hours</strong> — notify the provider immediately."},
 {f:"Hematuria", b:"<strong>Blood in the urine</strong> — glomerulonephritis, stones, infection, trauma, cyst rupture, or post-biopsy bleeding."},
 {f:"Proteinuria", b:"<strong>Protein in the urine</strong> — leaking glomeruli; a hallmark of kidney damage and nephrotic syndrome."},
 {f:"Hyperproteinemia", b:"An excess of protein <strong>in the blood</strong> — not the same as proteinuria (-emia = blood, -uria = urine)."},
 {f:"Bacteremia", b:"<strong>Bacteria in the blood</strong> — infection (e.g., pyelonephritis) has spread beyond the urinary tract; watch for urosepsis."},
 {f:"GFR", b:"<strong>Glomerular filtration rate</strong> — volume of plasma filtered per minute (normal about 100–120 mL/min); best overall measure of kidney function; stages CKD."},
 {f:"ATN", b:"<strong>Acute tubular necrosis</strong> — intrarenal AKI from prolonged ischemia or nephrotoxins; tubular cells die, so restoring flow no longer fixes it."},
 {f:"CRRT", b:"<strong>Continuous renal replacement therapy</strong> — slow, 24-hr dialysis for unstable ICU clients; gentle on BP. Hourly VS and I&amp;O; watch the filter for clotting."},
 {f:"CAPD / APD / CCPD", b:"Peritoneal dialysis types. <strong>CAPD:</strong> manual exchanges about 4×/day. <strong>APD:</strong> cycler machine overnight. <strong>CCPD:</strong> cycler overnight plus a long daytime dwell."},
 {f:"Ultrafiltration", b:"Fluid removal by a pressure gradient. PD math: <strong>dialysate out − dialysate in</strong> (2,000 in, 2,500 out = 500 mL removed)."},
 {f:"Dry weight", b:"The weight at which the client has <strong>no fluid excess or deficit</strong> — guides how much fluid dialysis removes."},
 {f:"Steal syndrome", b:"The AV access <strong>diverts too much arterial blood from the hand</strong> → pale, cold hand, pain, numbness, poor capillary refill. Red flag."},
 {f:"Disequilibrium syndrome", b:"Urea is removed from the blood faster than the brain → water shifts into brain cells → <strong>headache, N/V, restlessness, confusion, seizures</strong>. Highest risk in first treatments."},
 {f:"Uremic frost", b:"<strong>White, powdery urea crystals on the skin</strong> — a late sign of severe, untreated uremia; causes itching."},
 {f:"Asterixis", b:"<strong>Flapping tremor</strong> of the hands — a neurologic sign of uremia."},
 {f:"Kussmaul respirations", b:"<strong>Deep, rapid breathing</strong> — the lungs blowing off CO₂ to compensate for metabolic acidosis (pH below 7.35)."},
 {f:"Anasarca", b:"<strong>Massive generalized edema</strong> — classic in nephrotic syndrome and severe fluid overload."},
 {f:"Third spacing", b:"Fluid shifting out of the vessels into interstitial spaces/body cavities (e.g., <strong>ascites</strong>). Albumin may be given to pull it back into the vessels."},
 {f:"Presbycusis", b:"<strong>Age-related sensorineural hearing loss</strong> — gradual, bilateral; \"people are mumbling\"; hears but can't understand words."},
 {f:"Nystagmus", b:"<strong>Involuntary, rhythmic eye movements</strong> — seen with vertigo in Ménière's disease and labyrinthitis."},
 {f:"Hemianopsia", b:"<strong>Blindness in half the visual field</strong> — usually after a stroke; a brain (visual pathway) problem, not an eye problem."},
 {f:"Photopsia", b:"<strong>Flashes of light</strong> — with floaters and a curtain, a warning sign of retinal detachment."},
 {f:"Hyphema", b:"<strong>Blood in the anterior chamber</strong> of the eye after blunt trauma. HOB 30–45°; avoid sudden eye movements."},
 {f:"Amsler grid", b:"Grid of straight lines for <strong>daily home AMD monitoring</strong>; wavy, distorted, or missing areas = macular damage. Sudden change → report (dry may have turned wet)."},
 {f:"Weber test", b:"Tuning fork on top of the head. <strong>Conductive:</strong> louder in the affected ear. <strong>Sensorineural:</strong> louder in the unaffected ear."},
 {f:"Rinne test", b:"Bone vs. air conduction. <strong>Conductive:</strong> bone ≥ air (abnormal). <strong>Sensorineural:</strong> air greater than bone (normal pattern, reduced time)."},
 {f:"Aphasia — expressive, receptive, global", b:"<strong>Expressive (Broca's, frontal):</strong> understands; halting speech. <strong>Receptive (Wernicke's, temporal):</strong> fluent nonsense; doesn't understand. <strong>Global:</strong> can't speak or understand — rely on nonverbal."}
]},
exemplars:{title:"Exemplars: Cues & Priority Actions", cards:[
 {f:"Acute kidney injury (AKI)", b:"<strong>Cues:</strong> sudden ↑ BUN/creatinine, oliguria (below 400 mL/day), fluid overload, hyperkalemia, metabolic acidosis. <strong>Priority:</strong> treat the cause (pre/intra/post); restrict fluid and K⁺ in the oliguric phase; replace fluids/electrolytes in the diuretic phase."},
 {f:"Chronic kidney disease (CKD)", b:"<strong>Cues:</strong> GFR below 60 for 3+ months; uremia (fatigue, anorexia), anemia, pruritus/uremic frost, bone disease, high K⁺/phosphorus. <strong>Priority:</strong> slow progression (BP/glucose control); binders, epoetin, renal diet; prepare for dialysis/transplant."},
 {f:"Acute glomerulonephritis", b:"<strong>Cues:</strong> 2–3 weeks after strep; cola-colored urine, periorbital edema, hypertension, positive ASO titer. <strong>Priority:</strong> restrict sodium and fluids, manage BP; watch for hypertensive encephalopathy."},
 {f:"Pyelonephritis", b:"<strong>Cues:</strong> CVA (flank) tenderness, fever, chills, dysuria. <strong>Priority:</strong> fluids 2–3 L/day, IV then oral antibiotics — complete the full course to prevent scarring."},
 {f:"Nephrotic syndrome", b:"<strong>Cues:</strong> massive proteinuria (above 3.5 g/day), anasarca/periorbital edema, hypoalbuminemia, hyperlipidemia; BP normal or low. <strong>Priority:</strong> skin care, infection prevention, corticosteroids."},
 {f:"Nephrosclerosis", b:"<strong>Cues:</strong> long-standing uncontrolled HTN or diabetes; slowly rising BUN/creatinine, few symptoms (\"silent killer\"). <strong>Priority:</strong> aggressive BP control (ACE inhibitors, beta blockers)."},
 {f:"Polycystic kidney disease (PKD)", b:"<strong>Cues:</strong> inherited; flank/abdominal pain and fullness, hematuria, HTN, recurrent UTIs, stones. <strong>Priority:</strong> BP control; pain control <strong>without NSAIDs/aspirin</strong>; genetic counseling."},
 {f:"Cataracts", b:"<strong>Cues:</strong> painless, gradual cloudy/blurred vision; glare at night; faded colors. <strong>Priority:</strong> surgery; post-op no bending, straining, or heavy lifting; drops as scheduled."},
 {f:"Open-angle glaucoma", b:"<strong>Cues:</strong> painless, gradual peripheral loss (tunnel vision), ↑ IOP — the \"quiet thief of sight.\" <strong>Priority:</strong> lifelong drops (timolol, latanoprost) with punctal occlusion; loss can't be reversed."},
 {f:"Angle-closure glaucoma", b:"<strong>Cues:</strong> sudden severe eye pain, halos around lights, blurred vision, nausea/vomiting. <strong>Priority:</strong> emergency — lower IOP fast (IV mannitol, miotics, iridotomy); <strong>no atropine</strong>."},
 {f:"Age-related macular degeneration (AMD)", b:"<strong>Cues:</strong> central vision loss (dark spot), wavy lines on the Amsler grid; peripheral vision kept. <strong>Priority:</strong> daily Amsler grid; report sudden change (wet AMD → anti-VEGF); smoking cessation, vitamins."},
 {f:"Detached retina", b:"<strong>Cues:</strong> painless curtain/shadow, flashes (photopsia), floaters, sudden vision loss. <strong>Priority:</strong> emergency — bed rest, <strong>cover BOTH eyes</strong>, surgery ASAP."},
 {f:"Hemianopsia", b:"<strong>Cues:</strong> loss of half the visual field after stroke; bumps into things, eats half the plate. <strong>Priority:</strong> teach scanning (turn head toward the affected side); items on the unaffected side acutely; fall precautions."},
 {f:"Retinopathy (diabetic / hypertensive)", b:"<strong>Cues:</strong> floaters, fluctuating or patchy vision; \"silver wiring\" in HTN; early stages silent. <strong>Priority:</strong> tight glucose/BP control; annual dilated eye exam; report sudden loss or a shower of floaters."},
 {f:"Conductive hearing loss", b:"<strong>Cues:</strong> outer/middle ear block (cerumen, otitis media, otosclerosis); Weber louder in the bad ear; Rinne bone ≥ air. <strong>Priority:</strong> remove the obstruction/treat infection — often reversible; hearing aids work well."},
 {f:"Sensorineural hearing loss", b:"<strong>Cues:</strong> inner ear/CN VIII (presbycusis, ototoxic drugs, noise, Ménière's); Weber louder in the good ear. <strong>Priority:</strong> usually permanent — face the client, normal tone, cochlear implant; monitor ototoxic drugs."},
 {f:"Ménière's disease", b:"<strong>Cues:</strong> triad of vertigo, tinnitus, unilateral hearing loss; ear fullness, N/V, nystagmus. <strong>Priority:</strong> fall prevention during attacks — bed rest in a quiet, dark room; low-sodium diet; avoid caffeine, alcohol, MSG."},
 {f:"Labyrinthitis", b:"<strong>Cues:</strong> inflammation of the inner ear (labyrinth) affecting the vestibular nerve — vertigo, N/V, imbalance, nystagmus. <strong>Priority:</strong> fall safety; meclizine/antiemetics; prednisone taper; vestibular exercises; watch for meningitis."},
 {f:"Expressive (Broca's) aphasia", b:"<strong>Cues:</strong> frontal lobe; understands but speech is slow, halting, effortful — aware and frustrated. <strong>Priority:</strong> allow time, yes/no questions, communication board; don't rush or interrupt."},
 {f:"Receptive (Wernicke's) aphasia", b:"<strong>Cues:</strong> temporal lobe; fluent speech that makes little sense (word salad), poor comprehension, often unaware. <strong>Priority:</strong> short, simple sentences, gestures and pictures; check understanding."},
 {f:"Global aphasia", b:"<strong>Cues:</strong> both language areas — can't speak or understand. <strong>Priority:</strong> rely on nonverbal communication — gestures, pictures, touch, facial expression; simple yes/no system."}
]}
});
