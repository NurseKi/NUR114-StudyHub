const M3_ACRONYMS = { title:"Acronyms & Chart Reference", sub:"Elimination and Sensory Perception mnemonics and master charts.", lessons:[
{ id:"m3chart-elim", title:"Elimination Master Chart Reference", kicker:"Mnemonics, AKI vs. CKD, renal disorders, and dialysis — side by side",
  blocks:[
   {h:"Mnemonics used across this section"},
   {table:{head:["Mnemonic","Stands for","Where it's used"],rows:[
     ["<strong>A-W-E-T-B-E-D</strong>","Acid–base balance, Water balance, Electrolytes, Toxin removal (BUN/creatinine), Blood pressure (renin), Erythropoietin, vitamin D activation","The seven functions of the kidneys"],
     ["<strong>ROME</strong>","Respiratory Opposite (pH and CO₂ move in opposite directions), Metabolic Equal (pH and HCO₃⁻ move the same direction)","ABG interpretation"],
     ["<strong>AEIOU</strong>","Acidosis, Electrolytes (hyperkalemia), Intoxication, Overload, Uremia","Indications for emergent dialysis"],
     ["<strong>Loop = Lose / Sparing = Keep</strong>","Loop diuretics lose potassium; potassium-sparing diuretics keep it","Diuretics"],
     ["<strong>Skip the meal, skip the pill</strong>","Phosphate binders only work with food — give with the first bite","Phosphorus binders"],
     ["<strong>Feel the thrill, hear the bruit</strong>","Palpate for the thrill (vibration) and auscultate for the bruit (swish) every shift","AV fistula/graft patency"],
     ["<strong>NephrItic vs. NephrOtic</strong>","Nephritic = blood/HTN; Nephrotic = protein/edema","Glomerular disorders"],
     ["<strong>RENAL</strong>","Reflexes decreased, ECG changes (bradycardia) and hypotension, Nausea/vomiting, Appearance flushed, Lethargy","Hypermagnesemia (poor renal excretion is the main cause)"],
     ["<strong>STARVED</strong>","Seizures, Tetany, Anorexia and arrhythmias, Rapid heart rate, Vomiting, Emotional lability, DTRs increased","Hypomagnesemia"],
     ["<strong>SALT</strong>","Skin flushed, Agitation, Low-grade fever, Thirst","Hypernatremia"],
     ["<strong>Chvostek = cheek, Trousseau = tourniquet</strong>","Tap the cheek → facial twitch; BP cuff → carpal spasm","Hypocalcemia"],
     ["<strong>Stabilize → Shift → Remove</strong>","Calcium (stabilize the heart); insulin + D50, bicarbonate, albuterol (shift K⁺ into cells); furosemide, Kayexalate/Lokelma, dialysis (remove K⁺)","Hyperkalemia treatment"],
     ["<strong>Pre / Intra / Post</strong>","Before the kidney (perfusion), in the kidney (tissue damage), after the kidney (obstruction)","AKI types"]]}},
   {h:"Acute Kidney Injury (AKI) vs. Chronic Kidney Disease (CKD)"},
   {table:{head:["Feature","AKI","CKD"],rows:[
     ["<strong>Onset</strong>","Sudden/rapid (hours to days)","Gradual/progressive (months to years)"],
     ["<strong>Reversibility</strong>","<strong>Potentially reversible</strong> with prompt treatment","<strong>Irreversible</strong> — function can't be recovered, only maintained"],
     ["<strong>Primary causes</strong>","Prerenal: hypovolemia, shock, heart failure. Intrarenal: nephrotoxic drugs, infection, ischemia. Postrenal: obstruction (stones, BPH)","<strong>Diabetes mellitus</strong> (leading cause) and <strong>hypertension</strong>"],
     ["<strong>Diagnostic criteria</strong>","Sudden rise in creatinine/BUN and/or a rapid drop in urine output (oliguria)","GFR below 60 mL/min for 3 months or more, or evidence of kidney damage (proteinuria)"],
     ["<strong>Key symptoms</strong>","Oliguria (below 400 mL/day), fluid overload (edema), metabolic acidosis, hyperkalemia","Uremia (fatigue, anorexia), anemia (low EPO), pruritus (\"uremic frost\"), bone disease"],
     ["<strong>Treatment focus</strong>","<strong>Rescue:</strong> treat the underlying cause (fluids for prerenal, remove obstruction for postrenal), manage acute electrolyte shifts","<strong>Maintenance:</strong> slow progression (BP/glucose control), manage complications (phosphate binders, epoetin alfa), prepare for dialysis/transplant"],
     ["<strong>Mortality risk</strong>","Infection is a leading cause of death","Cardiovascular disease is the leading cause of death"]]}},
   {h:"AKI classifications"},
   {table:{head:["Type","Location & problem","Common causes","Priority treatment"],rows:[
     ["<strong>Prerenal</strong>","<em>Before</em> the kidney — perfusion/flow issue","<strong>Hypovolemia:</strong> dehydration, hemorrhage, burns. <strong>Low cardiac output:</strong> heart failure, shock","<strong>Restore perfusion</strong> — fluids, blood products, or vasopressors"],
     ["<strong>Intrarenal</strong>","<em>Inside</em> the kidney — direct tissue damage","<strong>Nephrotoxins:</strong> NSAIDs, contrast dye, gentamicin, vancomycin. <strong>Infection:</strong> glomerulonephritis","<strong>Remove the toxin/cause</strong> — restrict fluids (if oliguric), dialysis if severe"],
     ["<strong>Postrenal</strong>","<em>After</em> the kidney — obstruction/blockage","<strong>Stones</strong> (renal calculi), <strong>BPH</strong> (enlarged prostate), tumors","<strong>Relieve the obstruction</strong> — surgery, lithotripsy, or Foley catheter"]]}},
   {h:"AKI phases"},
   {table:{head:["Phase","Key signs & symptoms","Critical labs & risks","Nursing priority"],rows:[
     ["<strong>Oliguric</strong>","Urine output below 400 mL/day; fluid overload (edema, HTN)","<strong>Hyperkalemia</strong> (peaked T waves), metabolic acidosis, high BUN/creatinine","<strong>Restrict fluids and potassium</strong>; monitor for dysrhythmias"],
     ["<strong>Diuretic</strong>","Urine output 4–5 L/day; fluid deficit (hypotension)","<strong>Hypokalemia and hyponatremia</strong> (electrolytes lost in the urine); GFR starts improving","<strong>Replace fluids and electrolytes</strong>; monitor BP (fall risk)"],
     ["<strong>Recovery</strong>","Urine output normalizes; energy returns","GFR normalizes; BUN/creatinine return to baseline","Maintain hydration and monitor labs (can take up to 12 months)"]]}},
   {h:"Glomerulonephritis vs. nephrotic syndrome"},
   {p:"These are often confused. Remember: <strong>Nephritic = blood/HTN</strong>; <strong>Nephrotic = protein/edema</strong>."},
   {table:{head:["Feature","Acute glomerulonephritis (nephritic)","Nephrotic syndrome"],rows:[
     ["<strong>Primary cause</strong>","Post-infectious — often strep throat 2–3 weeks earlier","Glomerular damage causing massive \"leaking\""],
     ["<strong>Key symptom</strong>","<strong>Cola-colored (smoky) urine</strong> (hematuria)","<strong>Massive edema</strong> (anasarca/periorbital)"],
     ["<strong>Urinalysis</strong>","RBCs, mild protein","<strong>Massive proteinuria</strong> (more than 3.5 g/day)"],
     ["<strong>Blood pressure</strong>","Hypertension is common","Normal or low (fluid shift)"],
     ["<strong>Key lab</strong>","Positive <strong>ASO titer</strong> (strep antibodies)","<strong>Hypoalbuminemia</strong> and <strong>hyperlipidemia</strong>"],
     ["<strong>Nursing priority</strong>","Manage BP, fluid restriction, antibiotics (if strep is active)","Skin care (edema), infection prevention (loss of immunoglobulins), corticosteroids"]]}},
   {h:"Renal exemplars — key cues and priority actions"},
   {table:{head:["Exemplar","Key assessment cues","Priority action / teaching"],rows:[
     ["<strong>Acute glomerulonephritis</strong>","Periorbital edema, hypertension, cola-colored urine (hematuria); often follows a strep infection","Restrict <strong>sodium and fluids</strong>. Monitor for <strong>hypertensive encephalopathy</strong> (severe headache, neuro changes) — an emergency"],
     ["<strong>Pyelonephritis</strong>","Not a simple UTI: <strong>CVA tenderness</strong> (flank pain), fever, chills, painful urination","<strong>Increase fluids (2–3 L/day)</strong> and IV antibiotics; complete the full course to prevent kidney scarring"],
     ["<strong>Nephrosclerosis</strong>","Hardening of the renal arteries — a \"silent killer\" from prolonged, uncontrolled HTN or diabetes (type 1 or 2); rising BUN/creatinine with minimal symptoms at first","<strong>Aggressive BP control</strong> (ACE inhibitors, beta blockers) — the only way to slow progression to ESRD"],
     ["<strong>Polycystic kidney disease</strong>","Inherited; fluid-filled cysts enlarge the kidneys — flank/abdominal pain and fullness, hematuria, hypertension, recurrent UTIs, stones; family history","BP control; pain control <strong>without NSAIDs/aspirin</strong>; prevent/treat UTIs; tolvaptan; genetic counseling; prepare for dialysis/transplant"],
     ["<strong>Kidney stones</strong> (urolithiasis)","Flank pain; a postrenal cause of AKI when obstructing","Diet depends on stone type: avoid high-oxalate foods (spinach, rhubarb, chocolate) and high-purine foods (sardines, organ meats)"],
     ["<strong>Renal biopsy</strong> (post-procedure)","The kidney is highly vascular — the priority is watching for <strong>hemorrhage</strong>","Monitor VS and flank pain; strict bed rest 2–6 hours"]]}},
   {h:"Renal biopsy — bleeding red flags"},
   {table:{head:["Assess","Red flag"],rows:[
     ["<strong>Vital signs</strong>","Hypotension and tachycardia"],
     ["<strong>Pain</strong>","Intense, aching flank or back pain"],
     ["<strong>Urine</strong>","Gross or microscopic hematuria. Pink-tinged urine is common at first; <strong>bright red blood or clots</strong> are emergency signals"],
     ["<strong>Site</strong>","Visible bleeding, or soaking through to the skin under the client's back"],
     ["<strong>Labs</strong>","Falling hemoglobin and hematocrit"],
     ["<strong>Infection</strong>","Temperature greater than 100°F (37.8°C)"]]}},
   {h:"Hemodialysis vs. peritoneal dialysis"},
   {table:{head:["Feature","Hemodialysis (HD)","Peritoneal dialysis (PD)"],rows:[
     ["<strong>Access</strong>","AV fistula or graft","Tenckhoff catheter (abdominal)"],
     ["<strong>Critical assessment</strong>","<strong>Feel the thrill</strong> (vibration), <strong>hear the bruit</strong> (swish)","Check the effluent — should be <strong>straw-colored/clear</strong>"],
     ["<strong>Major complication</strong>","<strong>Disequilibrium syndrome</strong> — headache, N/V, confusion from rapid fluid/solute shifts","<strong>Peritonitis</strong> (infection of the lining)"],
     ["<strong>Red flag signs</strong>","Pale, cold hand (<strong>steal syndrome</strong>); no thrill/bruit","<strong>Cloudy effluent</strong>; rigid, board-like abdomen"],
     ["<strong>Nursing safety</strong>","No BP, IVs, or constrictive clothing on the fistula arm","Strict aseptic technique; warm the dialysate (<strong>do not microwave</strong>)"],
     ["<strong>Diet</strong>","Strict fluid, K⁺, phosphorus, and Na⁺ restrictions","Slightly more liberal, especially with potassium"]]}},
   {h:"Dialysis access types"},
   {table:{head:["Access","Description","Pros","Cons","Nursing care"],rows:[
     ["<strong>Vascath</strong>","Temporary, non-tunneled, double-lumen catheter","Immediate use for acute needs (AKI)","High infection risk; not permanent","Strict sterile dressing changes; do not use for fluids/meds"],
     ["<strong>Permacath</strong>","Tunneled catheter under the skin","Immediate long-term access; lasts longer than a Vascath","Clotting and infection","Monitor the exit site for redness; maintain the heparin lock"],
     ["<strong>AV graft</strong>","Synthetic tube connecting an artery and a vein","Usable in 2–3 weeks; good for poor veins","Higher risk of clotting (thrombosis) and infection","Check bruit and thrill; no BP or blood draws on that arm"],
     ["<strong>AV fistula</strong>","Surgical connection of the client's own artery and vein","<strong>Gold standard</strong> — lowest infection/clot risk","Takes months to mature before use","Check bruit and thrill; no BP or blood draws on that arm"],
     ["<strong>Tenckhoff catheter</strong>","Surgically placed in the peritoneum","Allows home-based peritoneal dialysis","Peritonitis (abdominal infection)","Monitor drainage (should be clear); assess for cloudy effluent"]]}},
   {h:"Dialysis types — nursing care and priorities"},
   {table:{head:["Type","Description","Pros","Cons","Nursing care & priorities"],rows:[
     ["<strong>Hemodialysis</strong>","Blood filtered through a machine (artificial kidney)","Rapid removal of toxins and fluid","Strict schedule; rapid BP drops","<strong>Weight</strong> before and after (1 kg = 1 L). <strong>Meds:</strong> hold antihypertensives and water-soluble vitamins before. <strong>Access:</strong> assess bruit/thrill"],
     ["<strong>CRRT</strong>","Continuous, slow dialysis","Gentle on BP; ideal for unstable ICU clients who can't tolerate the rapid shifts of HD","Requires 1:1 ICU nursing care","<strong>Vitals hourly</strong> for hemodynamic shifts; <strong>check the filter for clotting</strong>; frequent electrolytes to prevent rapid imbalances"],
     ["<strong>Peritoneal</strong>","Uses the peritoneal membrane as the filter","More freedom; fewer diet restrictions","High risk of infection (peritonitis)","<strong>Effluent</strong> must be clear (cloudy = infection). <strong>Sluggish flow:</strong> reposition side to side. Strict aseptic technique for all connections"]]}},
   {h:"Dialysis access care"},
   {table:{head:["Access","Rules"],rows:[
     ["<strong>AV fistula / graft</strong> — \"rules of the arm\"","<strong>Assess:</strong> palpate for a thrill and auscultate for a bruit every shift. <strong>Protect:</strong> no BPs, no IV starts, no blood draws on that arm. <strong>Teach:</strong> no carrying heavy bags, no tight clothing or jewelry, don't sleep on that arm"],
     ["<strong>Peritoneal (Tenckhoff) catheter</strong>","<strong>Peritonitis:</strong> the most common PD emergency — cloudy outflow, fever, abdominal pain. <strong>Respiratory alert:</strong> shortness of breath during the dwell means the fluid may be pushing on the diaphragm — <strong>drain the fluid immediately</strong>"]]}},
   {h:"Dialysis I&amp;O math"},
   {list:[
    "(Total output) − (amount of dialysate/irrigant put in) = true output",
    "2,000 mL of dialysate in and 2,500 mL out = <strong>500 mL</strong> of ultrafiltration (fluid removed)"]}
  ]
},
{ id:"m3chart-imbalances", title:"Fluid & Electrolyte Imbalances: Signs, Symptoms & Interventions", kicker:"Every high and low side by side — what you'll see and what you'll do",
  blocks:[
   {p:"<span style=\"color:#c0392b;font-weight:900;font-size:1.3em\">↑</span> = too high &nbsp; <span style=\"color:#2e86c1;font-weight:900;font-size:1.3em\">↓</span> = too low &nbsp; <strong style=\"color:#943126\">★ Renal failure pattern</strong> = the imbalances expected when the kidneys fail (fluid overload, high K⁺, high phosphorus, low calcium, high Mg²⁺, low HCO₃⁻)"},
   {table:{head:["Imbalance","Signs & symptoms","Interventions"],rows:[
    ["<span style=\"color:#c0392b;font-weight:900;font-size:1.3em\">↑</span> <strong>Fluid volume overload</strong><br><strong style=\"color:#943126\">★ Renal failure pattern</strong><br><span style=\"font-size:.92em\">↓ Na⁺ (dilutional), ↓ H&amp;H</span>","<strong>Neuro:</strong> headache, altered mental status, seizures (↑ ICP), fatigue, ↓ appetite. <strong>Resp:</strong> pulmonary edema, dyspnea, <strong>orthopnea</strong>, crackles/wheezing, wet cough, <strong>pink frothy sputum</strong>, ↑ RR, ↓ O₂ sat. <strong>CV:</strong> hypertension, tachycardia, <strong>S3</strong>, murmur, <strong>bounding pulse</strong>, JVD. <strong>Skin/fluid:</strong> pitting edema, anasarca, weeping skin, cool/clammy, third spacing, ascites. <strong>Rapid weight gain</strong>; ↑ BUN/creatinine","<strong>Raise HOB</strong>; O₂ as needed; strict I&amp;O and <strong>daily weights</strong>; <strong>restrict fluid and sodium</strong> (count IV fluids too); renal diet; turn q2h; elevate extremities; furosemide (monitor K⁺); bed rest until stable, then activity as tolerated; neuro checks; seizure and fall precautions; incentive spirometer (prevents atelectasis — doesn't remove edema fluid); albumin as ordered for third spacing; mannitol less common in kidney failure; <strong>dialysis</strong>"],
    ["<span style=\"color:#2e86c1;font-weight:900;font-size:1.3em\">↓</span> <strong>Fluid volume deficit</strong><br><span style=\"font-size:.92em\">↑ H&amp;H (hemoconcentration), often ↑ Na⁺, ↑ BUN:Cr (above 20:1)</span>","Weight loss, tachycardia, hypotension (orthostatic), <strong>weak, thready pulse</strong>, dry mucous membranes, poor skin turgor, concentrated urine/oliguria, thirst, confusion in older adults","Isotonic IV fluids (NS, LR); oral fluids; strict I&amp;O and daily weights; orthostatic VS; fall precautions; replace fluids and electrolytes in the diuretic phase of AKI"],
    ["<span style=\"color:#c0392b;font-weight:900;font-size:1.3em\">↑</span> <strong>Hyperkalemia</strong><br><strong style=\"color:#943126\">★ Renal failure pattern</strong><br><span style=\"font-size:.92em\">K⁺ above 5.5 mEq/L</span>","<strong>Cardiac:</strong> <strong>peaked T waves</strong>, widened QRS, irregular rate and rhythm, PVCs, <strong>tachycardia or bradycardia</strong>, ↓ BP, V-tach → V-fib/asystole. <strong>Neuromuscular:</strong> muscle irritability, paresthesia, fatigue, weakness starting in the legs → flaccid paralysis. <strong>GI:</strong> abdominal cramps, diarrhea, nausea. <strong>Metabolic acidosis</strong> with Kussmaul respirations. Severe: seizures, coma, death","<strong>Cardiac monitor (ECG).</strong> <strong>Calcium gluconate FIRST</strong> (protect the heart); <strong>IV regular insulin (about 10 units IV, not subQ) + D50 together</strong> (monitor blood glucose); calcium chloride works faster than gluconate; sodium bicarbonate; albuterol; <strong>furosemide</strong> (a non-K⁺-sparing diuretic); Kayexalate/Lokelma/patiromer (assess bowel sounds); <strong>dialysis</strong>. <strong>No spironolactone</strong> or K⁺ supplements; <strong>no salt substitutes</strong>; limit K⁺ in the diet; monitor I&amp;O and BUN/creatinine; seizure and fall precautions"],
    ["<span style=\"color:#2e86c1;font-weight:900;font-size:1.3em\">↓</span> <strong>Hypokalemia</strong><br><span style=\"font-size:.92em\">K⁺ below 3.5 mEq/L</span>","<strong>SUCTION:</strong> Skeletal muscle weakness, U waves, Constipation, Toxicity (digoxin), Irregular/weak pulse, Orthostatic hypotension, Numbness. Also leg cramps, decreased DTRs, flattened T waves, polyuria, decreased bowel sounds. Seen with loop diuretics, the diuretic phase of AKI, vomiting/NG suction","K⁺-rich diet; oral or IV potassium — <strong>IV only diluted on a pump, never IV push</strong>; confirm urine output first; cardiac monitor; watch for digoxin toxicity; K⁺-sparing diuretic if needed; check magnesium"],
    ["<span style=\"color:#2e86c1;font-weight:900;font-size:1.3em\">↓</span> <strong>Hyponatremia</strong><br><span style=\"font-size:.92em\">Na⁺ below 135 mEq/L</span>","Cells <strong>swell</strong>: headache, irritability, confusion, lethargy, muscle twitching, weakness, abdominal cramps, nausea/vomiting → seizures, coma. Hypovolemic: poor turgor, orthostatic hypotension. Hypervolemic/dilutional: edema, hypertension, weight gain, bounding pulse","<strong>Fluid restriction</strong> (dilutional); isotonic saline if hypovolemic; <strong>3% saline</strong> only for severe symptomatic cases, slowly, in the ICU; neuro checks; daily weights; strict I&amp;O; seizure precautions"],
    ["<span style=\"color:#c0392b;font-weight:900;font-size:1.3em\">↑</span> <strong>Hypernatremia</strong><br><span style=\"font-size:.92em\">Na⁺ above 145 mEq/L</span>","Cells <strong>shrink</strong> —<strong>SALT:</strong> Skin flushed, Agitation, Low-grade fever, Thirst. Also restlessness, twitching, hyperreflexia, confusion → seizures, coma. Water loss: dry mucous membranes, oliguria. Sodium gain: hypertension, bounding pulse, dyspnea","Treat the cause; replace water <strong>gradually over about 48 hours</strong> (D5W, then ½ NS) to prevent cerebral edema; restrict sodium; watch sodium-containing meds (sodium bicarbonate, Kayexalate); neuro checks; mouth care; seizure precautions"],
    ["<span style=\"color:#2e86c1;font-weight:900;font-size:1.3em\">↓</span> <strong>Hypocalcemia</strong><br><strong style=\"color:#943126\">★ Renal failure pattern</strong><br><span style=\"font-size:.92em\">Ca²⁺ below 8.5 mg/dL (check albumin)</span>","<strong>Tetany</strong>, tingling fingers, numbness around the mouth, muscle cramps, pain/aches, <strong>+ Chvostek</strong>, <strong>+ Trousseau</strong>, <strong>laryngeal and bronchospasm</strong>, dysrhythmias, prolonged ST and <strong>QT prolongation</strong>, tachycardia, muscle weakness, respiratory distress, seizures, altered mental status → coma, cardiac arrest, hyperactive reflexes. Usually <strong>alert and oriented but terrified</strong> — AMS and coma come late","<strong>Cardiac monitor</strong>; <strong>IV calcium gluconate</strong> (or chloride); oral calcium supplements (e.g., calcium carbonate/Tums); low-phosphorus diet (not a high-calcium diet); vitamin D; magnesium replacement if Mg is low; <strong>seizure precautions</strong> (padded rails, suction, O₂ at bedside); fall precautions; airway precautions; treat high phosphorus first (low-phosphorus diet); teach about long-term PPI use"],
    ["<span style=\"color:#c0392b;font-weight:900;font-size:1.3em\">↑</span> <strong>Hypercalcemia</strong><br><span style=\"font-size:.92em\">Ca²⁺ above 10.5 mg/dL</span>","Muscle weakness, <strong>hyporeflexia</strong>, lethargy, confusion, depression, bone pain, fractures, constipation, nausea/vomiting, anorexia, polyuria, extreme thirst, kidney stones, dysrhythmias, hypertension. In CKD, can come from calcium-based binders or active vitamin D","Hydration (IV NS) and a loop diuretic if the kidneys work; limit calcium intake; hold calcium-based binders and vitamin D as ordered; bisphosphonates/corticosteroids as ordered; cardiac monitor; strain urine for stones; dialysis if life-threatening"],
    ["<span style=\"color:#c0392b;font-weight:900;font-size:1.3em\">↑</span> <strong>Hyperphosphatemia</strong><br><strong style=\"color:#943126\">★ Renal failure pattern</strong><br><span style=\"font-size:.92em\">Phosphorus above 4.5 mg/dL</span>","Signs of the low calcium that comes with it (tetany, paresthesia, + Chvostek/Trousseau); <strong>severe itching (pruritus/uremic frost)</strong>; soft tissue and vascular calcifications; <strong>weak bones/renal osteodystrophy</strong>, low bone density, ↑ fracture risk, bone and joint pain; dry scaly skin, brittle nails, skin rash; hypotension; fatigue","<strong>Phosphate binders</strong> (sevelamer, calcium acetate/PhosLo) with the <strong>first bite of every meal</strong> — daily dose ÷ number of meals; low-phosphorus diet (and low sodium); active vitamin D only if Ca/P aren't too high; calcimimetic; DEXA scan; weight-bearing exercise; adequate high-quality protein once on dialysis; slow introduction of nutrients/food; avoid phosphate-containing laxatives and enemas; <strong>dialysis</strong>"],
    ["<span style=\"color:#2e86c1;font-weight:900;font-size:1.3em\">↓</span> <strong>Hypophosphatemia</strong><br><span style=\"font-size:.92em\">Phosphorus below 2.5 mg/dL (severe below 1)</span>","Muscle weakness (most common), slurred speech, dysphagia, confusion, hypotension, decreased cardiac output, rhabdomyolysis, respiratory failure. Causes include overuse of phosphate binders/antacids, refeeding, alcohol use disorder, DKA","Oral phosphorus supplements and diet; IV phosphate (potassium or sodium phosphate) if below 1 mg/dL; review binder use; monitor Ca²⁺, phosphorus, and K⁺"],
    ["<span style=\"color:#c0392b;font-weight:900;font-size:1.3em\">↑</span> <strong>Hypermagnesemia</strong><br><strong style=\"color:#943126\">★ Renal failure pattern</strong><br><span style=\"font-size:.92em\">Mg²⁺ above 2.5 mEq/L</span>","<strong>RENAL:</strong> Reflexes decreased (weakness → flaccid paralysis), ECG changes/bradycardia and hypotension, Nausea/vomiting, Appearance flushed (warmth), Lethargy → coma. Slow, shallow respirations; heart block","Stop all magnesium products (<strong>no Milk of Magnesia or Mg antacids</strong>) and flag the chart; IV/oral fluids + loop diuretic if the kidneys work; <strong>calcium gluconate</strong> (antagonist); cardiac monitor; check DTRs and respirations; <strong>dialysis</strong> with magnesium-free dialysate; ventilation if needed"],
    ["<span style=\"color:#2e86c1;font-weight:900;font-size:1.3em\">↓</span> <strong>Hypomagnesemia</strong><br><span style=\"font-size:.92em\">Mg²⁺ below 1.5 mEq/L (check albumin)</span>","<strong>STARVED:</strong> Seizures, Tetany, Anorexia and arrhythmias (torsades), Rapid heart rate, Vomiting, Emotional lability, DTRs increased. Also tremors, + Chvostek/Trousseau, dysphagia, laryngeal stridor; digoxin toxicity. Seen with loop diuretics, hemodialysis, aminoglycosides","Magnesium-rich diet and oral supplements; <strong>IV magnesium sulfate</strong> no faster than 150 mg/min (check renal function and urine output first); cardiac monitor; seizure precautions; check swallowing before PO intake; monitor K⁺ and Ca²⁺; calcium gluconate at the bedside"]
   ]}},
   {h:"Mnemonics on this chart"},
   {table:{head:["Mnemonic","Stands for","Imbalance"],rows:[
    ["<strong>SUCTION</strong>","Skeletal muscle weakness, U waves, Constipation, Toxicity (digoxin), Irregular/weak pulse, Orthostatic hypotension, Numbness","Hypokalemia"],
    ["<strong>CBIGKD</strong> (\"see big kid\")","Calcium gluconate, Bicarbonate, Insulin, Glucose, Kayexalate, Dialysis","Hyperkalemia treatment"],
    ["<strong>SALT</strong>","Skin flushed, Agitation, Low-grade fever, Thirst","Hypernatremia"],
    ["<strong>RENAL</strong>","Reflexes decreased, ECG changes, Nausea/vomiting, Appearance flushed, Lethargy","Hypermagnesemia"],
    ["<strong>STARVED</strong>","Seizures, Tetany, Anorexia/arrhythmias, Rapid heart rate, Vomiting, Emotional lability, DTRs increased","Hypomagnesemia"]]}},
   {hook:"<b>Reflexes sort the pairs:</b> low calcium and low magnesium make nerves <b>twitchy</b> (hyperactive DTRs, tetany, Chvostek/Trousseau); high calcium and high magnesium make them <b>sluggish</b> (diminished DTRs, weakness, lethargy). Potassium is the exception — both high and low cause muscle weakness, so read it with the <b>ECG</b>: peaked T waves when high, U waves when low."},
   {p:"Mannitol, listed on the class fluid volume overload poster, is less commonly used in kidney failure — it pulls fluid into the bloodstream first, so without working kidneys or dialysis it can worsen pulmonary edema. Patiromer, listed on the hyperphosphatemia poster, binds potassium, not phosphorus."}
  ]
},
{ id:"m3chart-lytes", title:"Fluids, Electrolytes, ABGs & Renal Diet Charts", kicker:"Acid–base imbalances, compensation, IV fluids, renal electrolytes, and the renal diet",
  blocks:[
   {h:"Acid–base imbalances"},
   {table:{head:["Imbalance","The problem","Common causes","Priority treatment"],rows:[
     ["<strong>Respiratory acidosis</strong>","Lungs are retaining CO₂ (hypoventilation)","COPD, asthma, opioid overdose, pneumonia","<strong>Improve ventilation</strong> — oxygen, incentive spirometry, naloxone (if opioid), BiPAP/intubation"],
     ["<strong>Respiratory alkalosis</strong>","Lungs are blowing off CO₂ (hyperventilation)","Anxiety/panic attack, pain, fever, high altitude","<strong>Slow the breathing</strong> — paper bag breathing, treat pain/anxiety"],
     ["<strong>Metabolic acidosis</strong>","Kidneys losing bicarbonate or retaining acid","Renal failure (AKI/CKD), severe diarrhea, DKA (ketones)","<strong>Fix the cause</strong> — dialysis (renal), insulin (DKA), antidiarrheals"],
     ["<strong>Metabolic alkalosis</strong>","Stomach losing acid","Vomiting, NG suctioning, antacid overuse","<strong>Stop the loss</strong> — antiemetics, stop suctioning, replace electrolytes (K⁺)"]]}},
   {h:"Legend: normal ranges"},
   {table:{head:["Value","Range","Reading it"],rows:[
     ["<strong>pH</strong>","7.35–7.45","Below 7.35 = acidic; above 7.45 = alkalotic"],
     ["<strong>PaCO₂</strong> (respiratory)","35–45 mmHg","35 = alkalotic end; 45 = acidic end. <strong>CO₂ is an acid</strong>"],
     ["<strong>HCO₃⁻</strong> (metabolic)","22–26 mEq/L","22 = acidic end; 26 = alkalotic end. <strong>Bicarb is a base</strong>"]]}},
   {h:"Uncompensated (acute) — pH abnormal; one system is causing the problem and the other hasn't started fixing it"},
   {table:{head:["Imbalance","pH","PaCO₂","HCO₃⁻"],rows:[
     ["<strong>Respiratory acidosis</strong>","↓ Low (acid)","↑ High (acid)","Normal"],
     ["<strong>Respiratory alkalosis</strong>","↑ High (alk)","↓ Low (alk)","Normal"],
     ["<strong>Metabolic acidosis</strong>","↓ Low (acid)","Normal","↓ Low (acid)"],
     ["<strong>Metabolic alkalosis</strong>","↑ High (alk)","Normal","↑ High (alk)"]]}},
   {h:"Partially compensated — pH still abnormal; the opposing system has started to help, so all three are abnormal"},
   {table:{head:["Imbalance","pH","PaCO₂","HCO₃⁻"],rows:[
     ["<strong>Respiratory acidosis</strong>","↓ Low","↑ High (cause)","↑ High (fixing)"],
     ["<strong>Respiratory alkalosis</strong>","↑ High","↓ Low (cause)","↓ Low (fixing)"],
     ["<strong>Metabolic acidosis</strong>","↓ Low","↓ Low (fixing)","↓ Low (cause)"],
     ["<strong>Metabolic alkalosis</strong>","↑ High","↑ High (fixing)","↑ High (cause)"]]}},
   {h:"Fully compensated (chronic) — pH back to normal; CO₂ and HCO₃⁻ both abnormal because the body is working hard to hold the balance"},
   {table:{head:["Imbalance (original cause)","pH (normal)","PaCO₂","HCO₃⁻"],rows:[
     ["<strong>Respiratory acidosis</strong>","Normal (low side, 7.35–7.39)","↑ High","↑ High"],
     ["<strong>Respiratory alkalosis</strong>","Normal (high side, 7.41–7.45)","↓ Low","↓ Low"],
     ["<strong>Metabolic acidosis</strong>","Normal (low side, 7.35–7.39)","↓ Low","↓ Low"],
     ["<strong>Metabolic alkalosis</strong>","Normal (high side, 7.41–7.45)","↑ High","↑ High"]]}},
   {h:"ABG compensation logic (quick check)"},
   {table:{head:["Status","Rule"],rows:[
     ["<strong>Uncompensated (acute)</strong>","pH abnormal, and either CO₂ <strong>or</strong> HCO₃⁻ is normal (one organ hasn't started helping yet)"],
     ["<strong>Partially compensated</strong>","All three values (pH, CO₂, HCO₃⁻) are abnormal"],
     ["<strong>Fully compensated (chronic)</strong>","pH normal (7.35–7.45), but CO₂ and HCO₃⁻ are still abnormal"]]}},
   {hook:"pH 7.31 (acid), CO₂ 50 (acid), HCO₃⁻ 28 (base) = <b>partially compensated respiratory acidosis</b> — the kidneys (HCO₃⁻) are trying to fix a respiratory problem, but the pH isn't back to normal yet."},
   {h:"Clinical applications"},
   {table:{head:["Topic","Clinical application"],rows:[
     ["<strong>Kussmaul respirations</strong>","The lungs' attempt to compensate for metabolic acidosis by blowing off CO₂. In a renal client, expect the pH to be low (below 7.35)"],
     ["<strong>Trousseau's & Chvostek's signs</strong>","Caused by hypocalcemia. If positive, the client is at high risk for seizures and laryngeal spasm"]]}},
   {h:"IV fluid solutions \"cheat sheet\""},
   {table:{head:["Type","Examples","Fluid shift","Primary use & safety risks"],rows:[
     ["<strong>Isotonic</strong>","0.9% normal saline, lactated Ringer's (LR)","<strong>Stays put</strong> — expands intravascular volume without moving fluid in or out of cells","<strong>Use:</strong> volume replacement (hypovolemia, shock, CPR). <strong>Risk:</strong> fluid volume overload — check lung sounds"],
     ["<strong>Hypotonic</strong>","0.45% saline (½ NS), 2.5% dextrose","<strong>Moves into cells</strong> — pulls fluid from the vessels into the cells","<strong>Use:</strong> severe cellular dehydration (DKA, HHS). <strong>Risk:</strong> cerebral edema — never give with a head injury"],
     ["<strong>Hypertonic</strong>","3% saline, D10W, D50W, albumin (colloid)","<strong>Moves out of cells</strong> — pulls fluid from cells/tissue into the vessels","<strong>Use:</strong> severe hyponatremia or cerebral edema. <strong>Risk:</strong> rapid fluid overload (pulmonary edema) — give slowly"]]}},
   {h:"The contradiction rule"},
   {table:{head:["Product","Why it's a problem in renal failure"],rows:[
     ["<strong>Lactated Ringer's</strong>","Great for volume, but often contraindicated in renal failure because it contains <strong>potassium</strong>, which can worsen hyperkalemia"],
     ["<strong>Aluminum-based antacids</strong>","Avoided in CKD — risk of <strong>aluminum toxicity</strong>, which can lead to bone disease and even dementia"],
     ["<strong>Magnesium-containing antacids/laxatives</strong> (Milk of Magnesia)","The kidneys can't excrete magnesium — hypermagnesemia"]]}},
   {h:"Renal-specific electrolyte imbalances"},
   {table:{head:["Imbalance","Lab cue","Recognize (cues/red flags)","Take action"],rows:[
     ["<strong>Hyperkalemia</strong>","K⁺ above 5.5 mEq/L","Tall, peaked T waves; widened QRS; muscle weakness; cardiac arrest","<strong>Cardiac monitor immediately.</strong> Stabilize the heart: IV <strong>calcium gluconate</strong>; remove K⁺ (Kayexalate)"],
     ["<strong>Hyperphosphatemia</strong>","PO₄³⁻ above 4.5 mg/dL","Severe itching (pruritus/uremic frost), soft tissue calcifications, bone pain","<strong>Bind it:</strong> sevelamer or calcium acetate (PhosLo) with the <strong>first bite of every meal</strong>"],
     ["<strong>Hypocalcemia</strong>","Ca²⁺ below 8.5 mg/dL","<strong>Trousseau's</strong> (BP-cuff spasm), <strong>Chvostek's</strong> (facial twitch), tetany, seizures","<strong>Seizure precautions.</strong> Inverse relationship: treat the high phosphorus first to help calcium rise; vitamin D and calcium supplements"],
     ["<strong>Hypermagnesemia</strong>","Mg²⁺ above 2.5 mEq/L","Diminished deep tendon reflexes (DTRs), lethargy, bradycardia","Avoid magnesium-containing antacids or laxatives (Milk of Magnesia)"]]}},
   {h:"Sodium & magnesium imbalances"},
   {table:{head:["Imbalance","Lab cue","Recognize","Take action"],rows:[
     ["<strong>Hyponatremia</strong>","Na⁺ below 135 mEq/L","Headache, confusion, lethargy, twitching, N/V, seizures (cells swell)","Fluid restriction for dilutional; 3% saline only if severe/symptomatic — slowly; seizure precautions"],
     ["<strong>Hypernatremia</strong>","Na⁺ above 145 mEq/L","SALT: flushed skin, agitation, low-grade fever, thirst (cells shrink)","Replace water gradually (about 48 hours) to avoid cerebral edema; restrict sodium"],
     ["<strong>Hypermagnesemia</strong>","Mg²⁺ above 2.5 mEq/L","RENAL: reflexes decreased, ECG changes/bradycardia, N/V, flushed, lethargy; respiratory depression","Stop magnesium products; fluids + loop diuretic if kidneys work; calcium gluconate; dialysis (magnesium-free dialysate)"],
     ["<strong>Hypomagnesemia</strong>","Mg²⁺ below 1.5 mEq/L","STARVED: seizures, tetany, arrhythmias, rapid HR, hyperactive DTRs; digoxin toxicity","Magnesium replacement (IV no faster than 150 mg/min); cardiac monitor; seizure precautions"]]}},
   {hook:"<b>The calcium–phosphorus see-saw:</b> when phosphorus rises because the kidneys can't excrete it, calcium drops. The failing kidney also can't activate vitamin D. The body steals calcium from the bones to balance the blood — that's <b>renal bone disease</b>."},
   {h:"The renal diet (CKD & ESRD focus)"},
   {table:{head:["Nutrient","High (avoid/limit)","Low (safer)","Nurse tip"],rows:[
     ["<strong>Potassium (K⁺)</strong>","Bananas, oranges, potatoes, spinach, tomatoes, avocados","Apples, berries, grapes, green beans, cabbage","<strong>Avoid salt substitutes</strong> (potassium chloride). The kidneys can't excrete it → lethal dysrhythmias"],
     ["<strong>Phosphorus</strong>","Dairy (milk, cheese, yogurt), nuts, dark colas, whole grains","Rice milk, sorbet, clear sodas, white bread/rice","\"Double jeopardy\" foods like chocolate and dairy are high in both K⁺ and phosphorus. High phosphorus pulls calcium from bones"],
     ["<strong>Sodium (Na⁺)</strong>","Canned soups, processed meats, pickled foods, soy sauce","Fresh herbs, lemon juice, \"no salt added\" canned vegetables","Rinse canned fish or vegetables to remove excess salt. Sodium causes water retention, HTN, and edema"],
     ["<strong>Protein</strong>","Excessive meat, poultry, or eggs (pre-dialysis CKD)","Small portions of high-biological-value protein (egg whites)","Limit protein before dialysis; once on dialysis, protein may be increased to replace losses"],
     ["<strong>Fluid</strong>","Prevents fluid volume overload","Count as fluid: water, ice, Jell-O, ice cream — anything liquid at room temperature","Use small cups; suck on hard candy or gum for thirst"]]}},
   {hook:"<b>Renal diet rule of thumb:</b> if it's \"healthy\" elsewhere, it's often dangerous in renal failure — bananas, spinach, whole grains, and oranges are all restricted for their potassium and phosphorus."}
  ]
},
{ id:"m3chart-meds", title:"Medication Safety Charts", kicker:"Renal and sensory medications — critical assessments, contraindications, and strategic tips",
  blocks:[
   {h:"Key renal medications & safety"},
   {table:{head:["Drug class","Examples","Purpose","Critical nursing actions"],rows:[
     ["<strong>Phosphate binders</strong>","Calcium acetate (PhosLo), sevelamer","Lower phosphorus in CKD","Must give with meals — if they don't eat, don't give"],
     ["<strong>Erythropoietin</strong>","Epoetin alfa (Epogen)","Treats anemia by stimulating RBC production","Monitor BP (hypertension). <strong>Hold if Hgb above 10–11</strong> (stroke risk)"],
     ["<strong>K⁺ removers</strong>","Polystyrene sulfonate (Kayexalate)","Binds K⁺ in the gut to excrete it in stool","<strong>Assess bowel sounds first</strong> — risk of necrosis if ileus is present"],
     ["<strong>K⁺-sparing diuretic</strong>","Spironolactone","Diuresis without losing potassium","Avoid salt substitutes (they're made of K⁺)"],
     ["<strong>Osmotic diuretic</strong>","Mannitol","Pulls fluid from the eye (glaucoma) or brain","Use a <strong>filter needle</strong> (crystallizes); monitor for fluid overload/HF"],
     ["<strong>Renal protection</strong>","Acetylcysteine (Mucomyst)","Protects the kidneys from IV contrast dye","Give <strong>prior to</strong> CT scans with contrast"]]}},
   {h:"Pharmacology: safety first"},
   {table:{head:["Medication","Critical assessment / lab","Absolute contraindication / alert"],rows:[
     ["<strong>Mannitol</strong> (osmotic)","<strong>Lab:</strong> serum osmolality. Monitor for pulmonary edema (crackles)","Must use a filter needle. <strong>Do not give with an active brain bleed</strong>"],
     ["<strong>Patiromer</strong> (K⁺ binder)","<strong>Lab:</strong> potassium","Delayed onset (hours/days) — not for emergencies. Give at least <strong>3 hours apart</strong> from other meds"],
     ["<strong>Calcium gluconate</strong>","<strong>ECG:</strong> used to protect the heart during hyperkalemia","Monitor for bradycardia and extravasation (tissue necrosis). <strong>Give slowly</strong>"],
     ["<strong>Sodium bicarbonate</strong>","<strong>ABG:</strong> used for metabolic acidosis (pH below 7.35)","Monitor for metabolic alkalosis or fluid overload (high sodium)"],
     ["<strong>Vitamin D</strong> (calcitriol)","CKD clients can't activate vitamin D → bone disease","Monitor calcium and phosphorus closely — they're inversely related"],
     ["<strong>Punctal occlusion</strong> (all eye drops)","—","Apply pressure to the tear duct to prevent systemic absorption"]]}},
   {h:"Eye medications & safety priorities"},
   {table:{head:["Medication","Purpose","Critical safety & nursing tips"],rows:[
     ["<strong>Beta blockers</strong> (timolol)","Decrease production of aqueous humor (glaucoma maintenance)","<strong>Punctal occlusion</strong> 1–2 minutes. <strong>Do not give</strong> with asthma, COPD, or bradycardia (heart block). Check HR and BP before giving"],
     ["<strong>Prostaglandin analogs</strong> (latanoprost)","Increase outflow of fluid (glaucoma maintenance)","Permanent darkening of the iris; longer, thicker eyelashes. Dose at bedtime"],
     ["<strong>Miotics</strong> (pilocarpine)","Constrict the pupil to pull the meshwork open (glaucoma)","Poor night vision — avoid driving at night"],
     ["<strong>Carbonic anhydrase inhibitors</strong> (dorzolamide)","Decrease production of aqueous humor (glaucoma)","<strong>Check for sulfa allergy.</strong> Remove contact lenses; wait 15 minutes to reinsert"],
     ["<strong>Osmotic diuretics</strong> (IV mannitol)","Rapidly pull fluid from the eye into the blood (emergency angle-closure)","Filter needle (crystallizes at low temps). Watch for fluid overload and pulmonary edema (crackles)"],
     ["<strong>Mydriatics / cycloplegics</strong> (atropine)","Dilate the pupil for exams or surgery","<strong>Never give with glaucoma</strong> — dilation blocks outflow and spikes IOP. Wear sunglasses; vision will be blurred and light-sensitive"]]}},
   {h:"Eye drop \"golden rules\""},
   {list:[
    "<strong>Wait time:</strong> 5–10 minutes between different eye drops to prevent \"washing out\" the first one",
    "<strong>Asepsis:</strong> never let the dropper tip touch the eye or lashes",
    "<strong>Position:</strong> tilt the head back, pull down the lower lid, and instill into the conjunctival sac (not directly on the cornea)"]},
   {h:"The ototoxic list — drugs that damage CN VIII"},
   {table:{head:["Class","Examples","Nursing note"],rows:[
     ["<strong>Aminoglycosides</strong> (and vancomycin)","Gentamicin, tobramycin; vancomycin","Monitor peak/trough levels and kidney function"],
     ["<strong>Loop diuretics</strong>","IV furosemide","<strong>Push slowly</strong>"],
     ["<strong>NSAIDs/salicylates</strong>","High-dose aspirin","Tinnitus is an early sign"],
     ["<strong>Chemotherapy</strong>","Cisplatin","Can cause permanent hearing loss"]]}},
   {h:"Strategic tips"},
   {table:{head:["Rule","Application"],rows:[
     ["<strong>The \"first bite\" rule</strong>","Phosphate binders are taken with meals (the first bite) to bind the phosphorus in food before it reaches the bloodstream. \"If you skip the meal, skip the pill\""],
     ["<strong>The EPO limit</strong>","Hemoglobin is the safety \"stop sign\" — if Hgb is above 10–11, hold epoetin (stroke and thromboembolic risk)"],
     ["<strong>Punctal occlusion</strong>","For beta blocker eye drops (timolol), press the inner canthus for 60 seconds so the drug doesn't become a \"systemic\" heart med that causes bradycardia"],
     ["<strong>Kayexalate</strong>","Assess bowel sounds before giving — if the gut isn't moving, K⁺ can't leave the body, and it can cause intestinal necrosis"],
     ["<strong>Patiromer vs. Kayexalate</strong>","Kayexalate is for acute use; patiromer is for long-term K⁺ management — give 3 hours apart from other oral meds"]]}}
  ]
},
{ id:"m3chart-sens", title:"Sensory Master Chart Reference", kicker:"Mnemonics, eye disorders, hearing loss, Ménière's, and communication — side by side",
  blocks:[
   {h:"Mnemonics used across this section"},
   {table:{head:["Mnemonic","Stands for","Where it's used"],rows:[
     ["<strong>Faucet vs. drain</strong>","Timolol turns off the faucet (less aqueous made); latanoprost opens the drain (more aqueous out)","Glaucoma drops"],
     ["<strong>Broca's = Broken, Wernicke's = Word salad</strong>","Expressive aphasia: knows what to say, can't get it out. Receptive aphasia: speech flows, meaning doesn't get in or out","Aphasia"],
     ["<strong>No atropine in glaucoma</strong>","Dilating the pupil blocks outflow and spikes IOP","Mydriatics"],
     ["<strong>Quiet thief of sight</strong>","Glaucoma — painless, gradual peripheral loss","Glaucoma vs. macular degeneration (central loss)"],
     ["<strong>Curtain = call now</strong>","A curtain or shadow over the vision with flashes and floaters is a retinal detachment — an emergency","Detached retina"],
     ["<strong>Weber: louder in the bad ear = conductive</strong>","Conductive loss → sound lateralizes to the affected ear; sensorineural → to the unaffected ear","Tuning fork tests"]]}},
   {h:"Sensory disorders comparison"},
   {table:{head:["Condition","Vision change","Key symptoms/cues","Treatment/priority"],rows:[
     ["<strong>Cataracts</strong>","Blurry/cloudy overall","Painless; glare from lights; decreased color perception","Surgery. Post-op: no bending, straining, or heavy lifting"],
     ["<strong>Glaucoma (open-angle)</strong>","Peripheral loss (tunnel vision)","Painless, gradual increase in IOP","Meds: timolol, latanoprost. Prevent blindness (can't be reversed)"],
     ["<strong>Glaucoma (angle-closure)</strong>","Sudden severe blur/halos","<strong>Severe eye pain</strong>, halos around lights, nausea","<strong>Emergency.</strong> IV mannitol, miotics. <strong>No atropine</strong>"],
     ["<strong>Retinal detachment</strong>","Curtain/shadow","Flashes of light, floaters, sudden <strong>painless</strong> loss","<strong>Emergency.</strong> Bed rest, eye patch, surgery"],
     ["<strong>Macular degeneration</strong>","Central loss (black spot)","Wavy lines (Amsler grid), loss of detail vision","Slow progression (vitamins, smoking cessation)"]]}},
   {hook:"<b>Pain is the tiebreaker:</b> a detached retina is <b>painless</b>; angle-closure glaucoma is <b>extremely painful</b>. Both are emergencies."},
   {h:"Sensory stations — recognition and coping"},
   {table:{head:["Station","Medical emergency?","Difficulty / recognition","How to teach the client to cope"],rows:[
     ["<strong>Cataracts</strong>","No (chronic)","Cloudy/blurred vision; glare at night","Use bright lights; post-op: avoid bending or heavy lifting"],
     ["<strong>Glaucoma</strong>","Yes (angle-closure)","Loss of peripheral vision; halos around lights","<strong>Meds for life:</strong> teach punctal occlusion to avoid systemic effects"],
     ["<strong>Hemianopsia</strong>","No (post-stroke)","Loss of half the visual field (blind spots)","<strong>Scan the room:</strong> turn the head to see both sides"],
     ["<strong>Detached retina</strong>","<strong>Yes</strong> (emergency)","Painless curtain/shadow over vision","Immediate bed rest; <strong>cover both eyes</strong>; see a specialist ASAP"],
     ["<strong>Macular degeneration</strong>","No (chronic/age)","Loss of central vision (dark spot in the center)","Amsler grid to monitor progression; maximize peripheral vision"]]}},
   {h:"Sensory exemplars — key cues and priority actions"},
   {table:{head:["Exemplar","Key assessment cues","Priority action / teaching"],rows:[
     ["<strong>Retinal detachment</strong>","\"Curtain\" or \"shadow\" over vision; flashes of light (photopsia); floaters. Painless","Bed rest. <strong>Cover BOTH eyes</strong> to minimize eye movement until surgery"],
     ["<strong>Eye injury (penetrating)</strong>","Visible object in the eye (pencil, metal shard); bleeding or fluid leak","<strong>Do NOT remove the object.</strong> Secure it with a protective shield (like a paper cup), cover both eyes to prevent sympathetic movement, and get immediate emergency care"],
     ["<strong>Ménière's disease</strong>","Vertigo, tinnitus, and (unilateral) hearing loss","Low-sodium diet; avoid caffeine and alcohol; move the head slowly during attacks to prevent falls"],
     ["<strong>Verbal impairment / communication barriers</strong>","Hearing or speech deficit","Get the client's attention first; face the client directly and keep eye contact (lip-reading); speak in a normal tone (don't shout); use simple gestures"]]}},
   {h:"Hearing loss comparison"},
   {table:{head:["Feature","Conductive","Sensorineural"],rows:[
     ["<strong>Location</strong>","Outer or middle ear","Inner ear (cochlea) or cranial nerve VIII (vestibulocochlear)"],
     ["<strong>Pathophysiology</strong>","Sound waves are mechanically blocked from reaching the inner ear","Damage to the sensory fibers or the nerve that carries sound to the brain"],
     ["<strong>Common causes</strong>","<strong>Obstruction:</strong> cerumen impaction, foreign bodies. <strong>Infection:</strong> otitis media. <strong>Structural:</strong> otosclerosis, tympanic membrane perforation","<strong>Aging:</strong> presbycusis. <strong>Ototoxicity:</strong> gentamicin, furosemide, aspirin, chemo. <strong>Trauma:</strong> prolonged loud noise. <strong>Disease:</strong> Ménière's, acoustic neuroma"],
     ["<strong>Reversibility</strong>","Often reversible (remove the wax, treat the infection)","Usually permanent and progressive"],
     ["<strong>Weber test</strong> (tuning fork on the head)","Louder in the <strong>affected (bad)</strong> ear","Louder in the <strong>unaffected (good)</strong> ear"],
     ["<strong>Rinne test</strong> (bone vs. air)","Bone conduction ≥ air conduction (abnormal)","Air conduction > bone conduction (normal pattern, just reduced time)"],
     ["<strong>Treatment</strong>","Remove the obstruction, antibiotics, hearing aids (amplification works well)","Cochlear implants (bypass damaged hair cells); hearing aids less effective — they just make distorted sound louder"]]}},
   {h:"Ménière's disease — key interventions"},
   {table:{head:["Phase","Interventions"],rows:[

 {stem:"A 70 kg client had a CT scan with IV contrast 36 hours ago. Creatinine has risen from 1.0 to 1.6 mg/dL, and urine output has been 20 mL/hr for 3 hours. Which interpretation is correct?",
  options:["Expected — contrast-induced injury does not appear until at least 7 days after the scan","Contrast-induced AKI may be developing — report the findings to the provider","Output is adequate because it exceeds 400 mL/day","The creatinine change is too small to matter because kidney function is still over 50%"],
  answer:1,
  why:"Contrast-induced AKI appears within 3–5 days, which is why creatinine and output are monitored for 48–72 hours. 20 mL/hr is below this client's minimum of 35 mL/hr (70 × 0.5), and a 60% creatinine rise is significant — creatinine rises only after substantial function is lost."}
],
"m3nums-lytes":[
 {stem:"A client with ESRD who missed two dialysis sessions has a potassium of 8.6 mEq/L. Which cardiac rhythm finding should the nurse anticipate at this level?",
  options:["Prominent U waves and flattened T waves","Peaked T waves with P waves disappearing","A shortened QT interval with normal T waves","Normal sinus rhythm — changes do not occur until above 12 mEq/L"],
  answer:1,
  why:"Around 6–7 mEq/L the T waves peak and PR lengthens; around 8–9 mEq/L P waves disappear; around 10–11 the QRS widens toward a sine wave and V-fib or standstill. U waves and flat T waves are hypokalemia."},
 {type:"matrix", stem:"The nurse reviews morning labs for a client with CKD stage 5. Classify each result.",
  rows:["Potassium 5.3 mEq/L","Phosphorus 6.8 mg/dL","Calcium 7.6 mg/dL","Magnesium 2.9 mEq/L","Bicarbonate 18 mEq/L","Sodium 138 mEq/L"],

  correct:[1,2,0,2,0,1],
  why:"K⁺ 3.5–5.5 (5.3 is normal but high-normal — keep watching); phosphorus 2.5–4.5 (high); calcium 8.5–10.5 (low); magnesium 1.5–2.5 (high); HCO₃⁻ 22–26 (low = metabolic acidosis); sodium 135–145 (normal). This is the classic renal failure pattern: high K⁺, phosphorus, and Mg²⁺; low calcium and bicarbonate."},
 {type:"sata", stem:"A client is receiving IV magnesium sulfate for hypomagnesemia. Which actions are appropriate? Select all that apply.",
  options:["Infuse no faster than 150 mg/min","Assess deep tendon reflexes during the infusion","Notify the provider if urine output is less than 100 mL in 4 hours","Give the dose by IV push over 1 minute","Expect hyperactive reflexes as a sign the dose is therapeutic"],
  answers:[0,1,2],
  why:"Magnesium is infused no faster than 150 mg/min, DTRs are checked because diminishing reflexes are the early sign of toxicity, and magnesium is excreted by the kidneys, so output below 100 mL in 4 hours is reported. Hyperactive reflexes are a sign of low magnesium, not a therapeutic effect."},
 {stem:"A client with a sodium of 112 mEq/L and new confusion is receiving 3% saline. Four hours later the sodium is 122 mEq/L. What is the nurse's best action?",

  answer:3,

 {stem:"A client on hemodialysis asks which snack bar is kidney-friendly. Which label meets the renal diet targets per bar?",
  options:["Protein 10 g, potassium 150 mg, phosphorus 100 mg, sodium 200 mg","Protein 20 g, potassium 350 mg, phosphorus 120 mg, sodium 250 mg","Protein 18 g, potassium 180 mg, phosphorus 140 mg, sodium 280 mg","Protein 16 g, potassium 190 mg, phosphorus 210 mg, sodium 290 mg"],
  answer:2,

"m3nums-dialysis":[
 {stem:"A client with worsening CKD had an AV fistula created 3 weeks ago and now has a potassium of 7.0 mEq/L that requires dialysis today. Which access should the nurse anticipate?",

  answer:2,
  why:"A fistula takes about 1–3 months to mature, so it can't be used at 3 weeks. A Vascath can be used immediately. Waiting is unsafe with K⁺ of 7.0, and a new PD catheter uses smaller volumes for 1–2 weeks while the cuffs heal in."},
 {type:"dragdrop", stem:"Sort each dialysis access by when it can typically be used after placement.",
  items:["Temporary non-tunneled catheter (Vascath)","Tunneled catheter (Permacath)","AV graft","AV fistula"],
  bins:["Immediately","About 2–3 weeks","About 1–3 months"],
  correctBin:[0,0,1,2],
  why:"Both catheters can be used right away (the Vascath generally up to 3–4 weeks; the Permacath lasts longer). A synthetic graft is ready in about 2–3 weeks, while the client's own vein in a fistula needs about 1–3 months to mature."},
 {type:"sata", stem:"Ninety minutes into acute hemodialysis, the client's BP drops to 84/50 mmHg and the client reports muscle cramping. Which actions are appropriate? Select all that apply.",

  why:"Hypotension during dialysis is treated with a 100–200 mL saline bolus and slower fluid removal; every 30 minutes is the minimum, so an unstable client is checked more often. Antihypertensives are often held 4–6 hours before dialysis, and pulling fluid faster worsens the hypotension."},
 {stem:"Labs drawn 20 minutes after a hemodialysis session show potassium 3.3 mEq/L. What should the nurse do?",

 {stem:"During an acute peritoneal dialysis exchange, the dialysate has been draining by gravity for 35 minutes and outflow is slow. What is the nurse's best action?",

"m3nums-sens":[
 {stem:"A client's eye was splashed with an alkaline cleaning solution. After 15 minutes of continuous irrigation with normal saline, the pH of the eye is 8.6. What should the nurse do next?",

 {type:"sata", stem:"The nurse is teaching a client going home after cataract surgery. Which instructions are appropriate? Select all that apply.",
  options:["Keep the head of the bed at about 30–45 degrees","Bend at the waist to pick things up so you don't strain your back","Use the prescribed eye drops several times a day for 2–4 weeks","Vision in the operative eye may not be clear for 1–2 weeks","Stop the eye drops once vision clears"],

 {stem:"Before instilling timolol eye drops, the nurse finds a pulse of 56/min and BP of 118/72 mmHg. There are no specific provider parameters. What should the nurse do?",

 {type:"matrix", stem:"For each finding, indicate whether it is expected/within range or needs follow-up.",

 {stem:"The nurse is planning discharge teaching for a client who is deaf and says, \"I read lips really well.\" Which plan is best?",

"m3nums-meds":[

"m3chart-elim":[
 {type:"matrix", stem:"For each finding, indicate whether it is more characteristic of acute kidney injury (AKI) or chronic kidney disease (CKD).",

  correct:[0,1,0,1,0,1],
  why:"AKI is sudden, often reversible, and caused by perfusion loss, nephrotoxins, or obstruction, with infection as a leading cause of death. CKD is gradual and irreversible, defined by GFR below 60 for 3 months or more, caused mainly by diabetes and hypertension, and brings anemia from low EPO."},
 {type:"dragdrop", stem:"Sort each cause of AKI into its classification.",

 {type:"matrix", stem:"For each finding, indicate whether it points to acute glomerulonephritis (nephritic) or nephrotic syndrome.",

 {type:"sata", stem:"A client has a left-arm AV fistula for hemodialysis. Which nursing actions are appropriate? Select all that apply.",

"m3chart-imbalances":[

 {type:"dragdrop", stem:"Sort each finding into the fluid imbalance it suggests.",

 {type:"sata", stem:"A client with CKD has a potassium of 6.8 mEq/L and peaked T waves. Which interventions should the nurse anticipate? Select all that apply.",

 {stem:"A client with CKD has phosphorus 7.2 mg/dL and calcium 7.8 mg/dL. The client is alert and oriented but frightened and reports tingling around the mouth. Which diet teaching is correct?",

 {stem:"A client taking furosemide has a potassium of 3.0 mEq/L, and IV potassium chloride is ordered. What should the nurse do before starting the infusion?",

"m3chart-lytes":[
 {type:"matrix", stem:"For each cause, indicate whether it leads to respiratory acidosis or respiratory alkalosis.",

  why:"Hypoventilation retains CO₂ (respiratory acidosis): opioids, COPD, pneumonia. Hyperventilation blows off CO₂ (respiratory alkalosis): anxiety or panic, high altitude, fever, pain."},
 {type:"dragdrop", stem:"Sort each cause into the metabolic imbalance it produces.",

 {type:"sata", stem:"A client with CKD has potassium 5.9 mEq/L and phosphorus 6.4 mg/dL. Which foods are safer choices? Select all that apply.",

 {type:"sata", stem:"The nurse reviews a client's medication list for ototoxic drugs that damage cranial nerve VIII. Which medications are ototoxic? Select all that apply.",

 {type:"cloze", stem:"Complete the sentence.",

 {ref:"m3-meds-diuretics",
  stem:"The nurse reviews diuretic prescriptions for several clients. Which pairing of drug and nursing precaution is correct?",
  options:["Mannitol — draw it up through a filter needle and inspect for crystals","Spironolactone — encourage salt substitutes to limit sodium","Furosemide — safe to give to a client with a sulfonamide allergy","Furosemide — push high doses rapidly to speed diuresis"],
  answer:0,
  why:"Mannitol crystallizes, so it is drawn up with a filter needle. Spironolactone retains potassium, and salt substitutes are potassium chloride. Furosemide is a sulfonamide derivative and is given slowly (no faster than 4 mg/min at high doses) to prevent ototoxicity."},
 {ref:"elim-lytes",
  stem:"An 84-year-old client admitted with dehydration has a sodium of 158 mEq/L, and D5W is prescribed. The client's daughter asks why the nurse won't \"just run it wide open.\" Which response is accurate?",
  options:["\"Running it fast would raise the sodium even higher.\"","\"D5W is hypertonic, so it can only be given slowly.\"","\"Fast infusion would cause the potassium to rise.\"","\"The sodium has to come down gradually, because correcting it too fast shifts water into brain cells and causes swelling.\""],
  answer:3,
  why:"Hypernatremia is corrected gradually, over about 48 hours, because rapid correction shifts water into brain cells and causes cerebral edema. D5W is not hypertonic, and a fast infusion would not raise the sodium."},
 {ref:"elim-lytes",
  stem:"A client with oliguric AKI had a hemoglobin of 12.1 g/dL and hematocrit of 36% yesterday. Today the hemoglobin is 12.0 g/dL, the hematocrit is 31%, and the client has gained 2 kg. How should the nurse interpret these results?",
  options:["Dilution from fluid gain","Active bleeding","Hemoconcentration from dehydration","A lab error, because hemoglobin and hematocrit always change together"],
  answer:0,
  why:"Hematocrit is a percentage of the blood that is cells, so added water lowers it, while hemoglobin is an absolute amount that stays more stable. A falling hematocrit with a stable hemoglobin plus weight gain means fluid gain; if both fell together, the nurse would think bleeding."},
 {ref:"m3-meds-diuretics",
  stem:"A client taking digoxin and furosemide has a potassium of 3.1 mEq/L and reports nausea and an irregular heartbeat. What is the nurse's priority concern?",
  options:["Furosemide-induced hyperkalemia","Hypokalemia increasing the risk of digoxin toxicity","An expected effect of furosemide that needs no follow-up","Hypercalcemia caused by furosemide"],
  answer:1,
  why:"Loop diuretics waste potassium, and hypokalemia raises the risk of digoxin toxicity, which can cause nausea and dysrhythmias. The nurse reports the findings and anticipates potassium replacement."},
 {type:"sata", ref:"elim-lytes",
  stem:"Which findings should the nurse expect in a client with a serum calcium of 7.4 mg/dL? Select all that apply.",
  options:["Numbness and tingling around the mouth","Coma as an early finding","Carpal spasm when a BP cuff is inflated","A prolonged QT interval","Diminished deep tendon reflexes"],
  answers:[0,2,3],
  why:"Low calcium makes nerves irritable: perioral tingling, a positive Trousseau's sign, hyperactive reflexes, and QT prolongation. The client is usually alert and oriented but frightened — altered mental status and coma come late."},
 {type:"ordering", ref:"elim-keyterms",
  stem:"Place in order the steps for collecting a 24-hour urine specimen for creatinine clearance.",
  items:["Have the client void at the start time, discard that urine, and record the time","Save all urine voided over the next 24 hours in a container kept on ice or refrigerated","At the end time, have the client void and add this urine to the container","Send the entire labeled collection to the lab"],
  why:"The first void is discarded because it was made before the test began; every void after that is kept cold, and the final void at the 24-hour mark is added. If a void is missed, the collection usually has to restart."},
 {ref:"elim-keyterms",
  stem:"A frail 88-year-old client who weighs 45 kg has a serum creatinine of 1.1 mg/dL. How should the nurse interpret this result?",
  options:["Normal kidney function, since the value is within the adult range","A possibly significant decrease in GFR, because low muscle mass produces less creatinine","Dehydration, because creatinine is the first lab to rise with fluid loss","No kidney disease, because creatinine rises early in kidney injury"],
  answer:1,
  why:"Creatinine comes from muscle, so a frail older adult with little muscle mass makes less of it, and a \"normal-looking\" value can hide a markedly reduced GFR. Creatinine also rises only after about half of kidney function is lost."},

 {ref:"elim-gn",

 {ref:"elim-pyelo",

 {type:"sata", ref:"elim-pyelo",

 {ref:"elim-pyelo",

 {ref:"elim-pyelo",
  stem:"A client discharged on oral ciprofloxacin for pyelonephritis calls to report new pain and swelling at the back of the heel. What should the nurse tell the client?",

 {ref:"elim-nephrotic",

 {ref:"elim-nephrosclerosis",

 {ref:"elim-pkd",

 // ---------- ABGs (5) ----------
 {ref:"elim-abg",
  stem:"A postoperative client receiving IV morphine by PCA has been drowsy for most of the day. ABG: pH 7.30, PaCO₂ 54 mmHg, HCO₃ 29 mEq/L. How should the nurse interpret this?",
  options:["Uncompensated metabolic acidosis","Partially compensated respiratory acidosis","Fully compensated respiratory acidosis","Partially compensated metabolic alkalosis"],
  answer:1,
  why:"The pH is low (acidosis) and the high PaCO₂ matches, so the lungs are the cause — hypoventilation from opioids. All three values are abnormal and the pH is still out of range, so the kidneys have started but not finished compensating."},
 {ref:"elim-abg",
  stem:"A client who has had NG suction for 3 days has pH 7.51, PaCO₂ 43 mmHg, HCO₃ 33 mEq/L, and potassium 3.2 mEq/L. Which intervention addresses the cause?",
  options:["Administer IV sodium bicarbonate","Have the client breathe into a paper bag","Administer naloxone","Reduce or stop the NG suction as prescribed and replace potassium"],
  answer:3,
  why:"This is uncompensated metabolic alkalosis from acid lost through NG suction. Treatment stops the loss and replaces electrolytes such as potassium. Bicarbonate would worsen the alkalosis, and paper-bag breathing and naloxone treat respiratory problems."},
 {type:"sata", ref:"elim-abg",
  stem:"Which ABG results show full compensation? Select all that apply.",
  options:["pH 7.31, PaCO₂ 50, HCO₃ 28","pH 7.36, PaCO₂ 55, HCO₃ 31","pH 7.38, PaCO₂ 28, HCO₃ 17","pH 7.44, PaCO₂ 30, HCO₃ 20","pH 7.25, PaCO₂ 40, HCO₃ 16"],
  answers:[1,2,3],
  why:"Full compensation means a normal pH with both PaCO₂ and HCO₃ abnormal in the same direction: 7.36/55/31 (compensated respiratory acidosis), 7.44/30/20 (compensated respiratory alkalosis), and 7.38/28/17 (compensated metabolic acidosis). 7.31/50/28 is only partially compensated because the pH is still abnormal, and 7.25/40/16 is uncompensated."},
 {ref:"elim-abg",
  stem:"A client having a panic attack has a respiratory rate of 34/min and tingling fingers. ABG: pH 7.52, PaCO₂ 28 mmHg, HCO₃ 24 mEq/L. Which interpretation and action are correct?",
  options:["Uncompensated respiratory alkalosis; coach slow breathing and address the anxiety","Uncompensated metabolic alkalosis; give an antiemetic","Partially compensated respiratory acidosis; prepare for BiPAP","Compensated respiratory alkalosis; no action is needed"],
  answer:0,
  why:"The pH is high and the low PaCO₂ matches, so the lungs are blowing off CO₂; the HCO₃ is normal, so there is no compensation yet. Treatment slows the breathing — coaching, paper-bag breathing, and treating the anxiety."},
 {ref:"elim-abg",
  stem:"A client with oliguric AKI has a pH of 7.24, HCO₃ of 13 mEq/L, and potassium of 6.3 mEq/L. After IV sodium bicarbonate is given, what change in the potassium level should the nurse anticipate?",
  options:["It rises, because bicarbonate pulls potassium out of the cells","It falls, because correcting the acidosis shifts potassium back into the cells","It stays the same, because bicarbonate affects only the pH","It falls, because bicarbonate increases potassium loss in the urine"],
  answer:1,
  why:"In acidosis, hydrogen ions move into cells and potassium moves out into the blood. Correcting the acidosis with bicarbonate pushes potassium back into the cells — a temporary shift, not removal from the body."},
