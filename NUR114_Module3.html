Object.assign(QUIZ, {
"drill-sata-elim":[
 {type:"sata", ref:"elim-aki", stem:"A client with diabetes had a contrast CT 3 days ago and is now on day 6 of gentamicin. Which findings point to intrarenal AKI? Select all that apply.",
  options:["Urine specific gravity fixed at 1.010","BUN:creatinine ratio of 26:1","Urine sodium of 52 mEq/L","Muddy-brown granular casts on urinalysis","Urine sodium of 12 mEq/L"],
  answers:[0,2,3],
  why:"Damaged tubules can't concentrate urine (fixed SG near 1.010) or hold sodium (urine Na above 40), and they shed muddy-brown casts. A BUN:creatinine ratio above 20:1 and a low urine sodium are prerenal clues — the kidney is still working hard to save sodium and water."},
 {type:"sata", ref:"elim-ckd", stem:"A client with stage 4 CKD will need an AV fistula in the nondominant arm. Which actions help preserve the client's future access? Select all that apply.",
  options:["Take blood pressures on the dominant arm only","Use the nondominant arm for routine lab draws","Avoid PICC lines","Start IVs in the nondominant hand, since hand veins don't affect the fistula","Avoid subclavian central catheters"],
  answers:[0,2,4],
  why:"Veins in the nondominant arm are protected early — no BPs, venipunctures, or IVs. PICC lines and subclavian catheters cause central vein stenosis, which can ruin a future fistula."},
 {type:"sata", ref:"elim-gn", stem:"A client is admitted with acute poststreptococcal glomerulonephritis, BP 166/100, and periorbital edema. Which prescriptions does the nurse anticipate? Select all that apply.",
  options:["Sodium and fluid restriction","Daily weights","High-protein diet to replace urinary losses","Antihypertensive medication","Rest until the urine clears and BP normalizes"],
  answers:[0,1,3,4],
  why:"Acute GN causes sodium and water retention, so care centers on sodium/fluid restriction, daily weights, BP control, and rest during the acute phase. Protein is restricted, not increased, when azotemia is significant."},
 {type:"sata", ref:"elim-pyelo", stem:"A client is being discharged on oral antibiotics for acute pyelonephritis. Which client statements show understanding? Select all that apply.",
  options:["\"I'll take every dose, even after I feel better.\"","\"I'll aim for 2 to 3 liters of fluid a day unless I'm told otherwise.\"","\"I can stop the antibiotic once the burning goes away.\"","\"I only need another urine culture if my fever comes back.\"","\"Holding my urine as long as I can will strengthen my bladder.\""],
  answers:[0,1],
  why:"Finishing the full course prevents relapse and kidney scarring, and 2–3 L/day of fluid flushes bacteria. A follow-up culture is done after the course regardless of symptoms, and clients should void frequently rather than hold urine."},
 {type:"sata", ref:"elim-nephrotic", stem:"A client with nephrotic syndrome has anasarca and a serum albumin of 1.9 g/dL. Which complications should the nurse monitor for? Select all that apply.",
  options:["Unilateral calf swelling and pain","Sudden dyspnea with chest pain","Fever and other signs of infection","Skin breakdown over edematous areas","Prolonged bleeding from a hypocoagulable state"],
  answers:[0,1,2,3],
  why:"Clotting-regulating proteins are lost in the urine, making the blood hypercoagulable (DVT, PE, renal vein thrombosis) — not prone to bleeding. Lost immunoglobulins raise infection risk, and stretched, edematous skin breaks down easily."},
 {type:"sata", ref:"elim-nephrosclerosis", stem:"Which statements about nephrosclerosis are accurate? Select all that apply.",
  options:["It is usually caused by long-standing hypertension or diabetes","It is a bacterial infection of the renal pelvis treated with antibiotics","ACE inhibitors are often preferred because they also protect the kidney","Severe flank pain is the classic early symptom","Increasing fluids to 3 L/day is the primary intervention"],
  answers:[0,2],
  why:"Nephrosclerosis is hardening of the renal arteries from chronic hypertension or diabetes; it is silent early, and aggressive BP control (often with ACE inhibitors or ARBs) is the core intervention. Infection describes pyelonephritis."},
 {type:"sata", ref:"elim-pkd", stem:"The nurse is teaching a client with autosomal dominant polycystic kidney disease. Which instructions are appropriate? Select all that apply.",
  options:["Use acetaminophen rather than ibuprofen for flank pain","Limit fluids as much as possible to shrink the cysts","Take antihypertensives as prescribed and track blood pressure","Report bright red urine right away","Apply dry heat to the flank for comfort"],
  answers:[0,2,3,4],
  why:"NSAIDs are avoided (bleeding and nephrotoxicity), BP control slows decline, gross hematuria can signal cyst rupture, and dry heat eases pain. Adequate fluids are encouraged — fluid restriction does not shrink cysts."},
 {type:"sata", ref:"elim-dialysis", stem:"The nurse is reviewing a client's continuous ambulatory peritoneal dialysis exchanges. Which findings require action? Select all that apply.",
  options:["Cloudy effluent on day 30 of PD","Brown-tinged effluent","Clear, straw-colored effluent","Shortness of breath during the dwell","Mild cramping during inflow in the first few exchanges"],
  answers:[0,1,3],
  why:"Cloudy effluent signals peritonitis, brown effluent suggests bowel perforation, and dyspnea during the dwell means fluid is pressing on the diaphragm — drain it. Clear straw-colored effluent is normal, and mild inflow cramping is common early on."},
 {type:"sata", ref:"elim-lytes", stem:"A client with ESRD has been taking Milk of Magnesia daily for constipation. Serum magnesium is 7.2 mEq/L. Which findings should the nurse expect? Select all that apply.",
  options:["Tetany and a positive Trousseau's sign","Absent patellar reflexes","Bradycardia","Hyperactive reflexes and tremors","Hypotension"],
  answers:[1,2,4],
  why:"Magnesium depresses nerves and muscles: around 7 mEq/L the DTRs disappear, with bradycardia and hypotension. Tetany, tremors, and hyperactive reflexes fit low magnesium or low calcium."},
 {type:"sata", ref:"m3-meds-lytes", stem:"The nurse is giving medications to several clients with ESRD. Which actions are correct? Select all that apply.",
  options:["Give calcium acetate with the first bite of the meal","Give epoetin alfa to a client whose hemoglobin is 11.8 g/dL","Give patiromer together with the client's other morning oral meds","Assess bowel sounds before giving sodium polystyrene sulfonate","Mix Lokelma right before giving and have the client drink it right away"],
  answers:[0,3,4],
  why:"Phosphate binders go with the first bite of food; Kayexalate needs a working gut; Lokelma settles, so it's mixed and taken immediately. Epoetin is held when Hgb is above about 10–11 g/dL, and patiromer must be separated from other oral meds by 3 hours."}
],
"drill-sata-sens":[
 {type:"sata", ref:"sens-cataract", stem:"A 74-year-old client reports changes in vision over the past year. Which findings are consistent with a cataract? Select all that apply.",
  options:["Gradual, painless blurring of vision","A sudden curtain across part of the visual field","Severe eye pain with nausea and vomiting","Glare and halos that make night driving difficult","Tunnel vision with a clear center"],
  answers:[0,3],
  why:"A clouded lens causes gradual, painless blurring with glare, halos, and faded colors. A sudden curtain suggests retinal detachment, severe pain with N/V suggests angle-closure glaucoma, and tunnel vision fits glaucoma."},
 {type:"sata", ref:"sens-glaucoma", stem:"Which statements about glaucoma are accurate? Select all that apply.",
  options:["Open-angle glaucoma is usually painless and takes peripheral vision first","Angle-closure glaucoma may present with a red eye and a fixed, mid-dilated pupil","Vision lost to glaucoma returns once the IOP is lowered","Atropine and other pupil-dilating drugs are contraindicated","Open-angle glaucoma requires emergency surgery within hours"],
  answers:[0,1,3],
  why:"Open-angle glaucoma is a slow, painless loss of peripheral vision managed with lifelong drops; angle-closure is the painful emergency. Lost vision cannot be restored, and dilating drugs block outflow and spike IOP."},
 {type:"sata", ref:"sens-amd", stem:"The nurse is comparing age-related macular degeneration (AMD) with diabetic retinopathy. Which statements are accurate? Select all that apply.",
  options:["Dry AMD shows yellow drusen deposits on the macula","AMD takes peripheral vision first and spares central vision","Wet AMD and proliferative diabetic retinopathy both involve fragile new vessels that can leak or bleed","Early diabetic retinopathy causes obvious symptoms, so eye exams are needed only when vision changes","Tight glucose and BP control helps protect vision in diabetic retinopathy"],
  answers:[0,2,4],
  why:"AMD destroys central vision (drusen in dry, leaking new vessels in wet); proliferative retinopathy also grows fragile vessels. Early retinopathy is often silent, so annual dilated exams and glucose/BP control are key."},
 {type:"sata", ref:"sens-retina", stem:"A client with severe myopia reports painless flashes of light, a shower of floaters, and a shadow over part of the vision in one eye. Which actions should the nurse take? Select all that apply.",
  options:["Notify the ophthalmologist immediately","Place the client on bed rest and keep the client quiet","Patch only the affected eye so the client can still read","Cover both eyes","Position the client as prescribed"],
  answers:[0,1,3,4],
  why:"These are signs of retinal detachment, a surgical emergency. Both eyes are covered because they move together, and activity is limited until repair. Patching one eye and reading would keep both eyes moving."},
 {type:"sata", ref:"sens-hemianopsia", stem:"A client with a left-hemisphere stroke has right homonymous hemianopsia and expressive (Broca's) aphasia. Which actions are appropriate in the acute phase? Select all that apply.",
  options:["Place the call light and water on the client's left side","Finish the client's sentences to reduce frustration","Ask yes/no questions and allow plenty of time to respond","Teach the client to turn the head to the right to scan","Speak loudly so the client understands"],
  answers:[0,2,3],
  why:"With right hemianopsia, items go on the unaffected left side and the client scans by turning toward the blind right side. Expressive aphasia leaves understanding intact, so use yes/no questions and patience — don't finish sentences or shout."},
 {type:"sata", ref:"sens-emergencies", stem:"A client arrives after drain cleaner splashed into the left eye. Which actions are appropriate? Select all that apply.",
  options:["Irrigate immediately with copious water or normal saline","Obtain a full history of the product before starting irrigation","Irrigate from the inner canthus to the outer canthus","Continue irrigating until the eye's pH is neutral","Remove contact lenses if they don't come out with irrigation"],
  answers:[0,2,3,4],
  why:"Chemical exposure is irrigated first — at least 15 minutes and until pH is about 7.0–7.4 — flowing inner to outer canthus away from the other eye. History and acuity come after irrigation is underway."},
 {type:"sata", ref:"sens-hearing", stem:"A client with severe hearing loss relies on lip reading. Which actions by the nurse support communication? Select all that apply.",
  options:["Stand with a bright window behind the nurse","Face the client directly with light on the nurse's face","Tell the client the topic before starting","Chew gum to keep the nurse's breath fresh during teaching","Rephrase the message if the client doesn't understand"],
  answers:[1,2,4],
  why:"Lip readers need a well-lit, unobstructed view of the face and the topic up front for context; rephrasing helps more than repeating. A backlit face and anything in the mouth make lip reading nearly impossible."},
 {type:"sata", ref:"sens-menieres", stem:"A client with Ménière's disease is having an acute vertigo attack. Which interventions are appropriate? Select all that apply.",
  options:["Bed rest in a quiet, darkened room","Turn on the TV to distract the client from the spinning","Encourage quick head turns to help reset balance","Keep the bed low with side rails up","Encourage a salty snack to settle the stomach"],
  answers:[0,3],
  why:"The priority is fall prevention in a calm, dark environment. Flickering TV light and sudden head movements worsen vertigo, and sodium increases inner-ear fluid."},
 {type:"sata", ref:"m3-meds-eyedrops", stem:"A client with open-angle glaucoma is prescribed timolol and latanoprost. Which instructions should the nurse include? Select all that apply.",
  options:["Wait 5–10 minutes between the two different drops","Use latanoprost every morning and again whenever vision seems blurry","Press on the inner corner of the eye for 1–2 minutes after each drop","Latanoprost may permanently darken the iris","Report shortness of breath or a slow pulse"],
  answers:[0,2,3,4],
  why:"Spacing drops prevents washout, punctal occlusion limits systemic absorption, latanoprost can permanently darken the iris, and timolol can cause bradycardia and bronchospasm. Latanoprost is given once nightly — extra doses make it less effective."},
 {type:"sata", ref:"m3-meds-diuretics", stem:"The nurse is reviewing diuretic orders on a unit. Which situations should the nurse question? Select all that apply.",
  options:["Spironolactone for a client with a potassium of 5.6 mEq/L","Furosemide IV for a client with K⁺ 5.8 mEq/L and crackles who is still making urine","Mannitol drawn up without a filter needle","High-dose IV furosemide infused no faster than 4 mg/min","IV mannitol for acute angle-closure glaucoma"],
  answers:[0,2],
  why:"Spironolactone retains potassium and is contraindicated with K⁺ above 5.0, and mannitol can crystallize, so a filter needle is required. Furosemide helps hyperkalemia and overload while the kidneys make urine, the slow infusion rate prevents ototoxicity, and mannitol is used in angle-closure glaucoma."}
],
"drill-matrix":[
 {type:"matrix", ref:"elim-aki", stem:"For each finding, indicate which category of AKI it suggests.",
  rows:["BUN:creatinine 28:1 with urine specific gravity 1.030","Urine sodium 55 mEq/L with muddy-brown casts","Bladder scan shows 900 mL in a client with BPH","Urine sodium 12 mEq/L after a GI hemorrhage","Creatinine rising on day 7 of gentamicin; SG fixed at 1.010"],
  cols:["Prerenal","Intrarenal","Postrenal"],
  correct:[0,1,2,0,1],
  why:"Prerenal kidneys conserve sodium and water (ratio above 20:1, high SG, low urine Na). Intrarenal damage leaves tubules unable to concentrate or hold sodium, with casts; nephrotoxins like gentamicin are intrarenal. A distended bladder is a postrenal obstruction."},
 {type:"matrix", ref:"elim-nephrotic", stem:"For each nursing priority, indicate whether it best fits acute glomerulonephritis or nephrotic syndrome.",
  rows:["Monitor BP closely and give antihypertensives","Assess for unilateral leg swelling and pain","Teach the client to fully treat future strep infections","Provide meticulous skin care over areas of anasarca","Give a statin for elevated LDL","Watch for severe headache and neuro changes from very high BP"],
  cols:["Acute glomerulonephritis (nephritic)","Nephrotic syndrome"],
  correct:[0,1,0,1,1,0],
  why:"Nephritic = blood and hypertension: BP control, strep follow-up, and hypertensive encephalopathy. Nephrotic = protein loss: anasarca (skin care), hypercoagulability (DVT), and hyperlipidemia (statins)."},
 {type:"matrix", ref:"elim-dialysis", stem:"For each finding in a client receiving dialysis, indicate whether it is expected or requires follow-up.",
  rows:["Blood-tinged PD effluent in the second exchange after a new catheter","Cloudy PD effluent three weeks after starting PD","Slight temperature rise during hemodialysis that resolves afterward","No thrill palpable over the AV fistula","Weight 2 kg lower after hemodialysis than before","Headache, vomiting, and confusion near the end of the first hemodialysis session"],
  cols:["Expected","Requires follow-up"],
  correct:[0,1,0,1,0,1],
  why:"Blood-tinged effluent early after placement, a mild temperature rise from warmed blood, and post-dialysis weight loss are expected. Cloudy effluent (peritonitis), an absent thrill (clotted access), and neuro changes in a first session (disequilibrium syndrome) need follow-up."},
 {type:"matrix", ref:"elim-lytes", stem:"For each finding, indicate the electrolyte imbalance it most likely reflects.",
  rows:["Tall, peaked T waves","Carpal spasm when a BP cuff is inflated","Absent patellar reflexes","Flushing and a feeling of warmth","Numbness and tingling around the mouth","Tachycardia progressing to bradycardia with a widening QRS"],
  cols:["Hyperkalemia","Hypocalcemia","Hypermagnesemia"],
  correct:[0,1,2,2,1,0],
  why:"Peaked T waves and a heart rate that speeds up then crashes are hyperkalemia. Trousseau's sign and perioral tingling are hypocalcemia. Magnesium depresses nerves — flushing, warmth, and lost DTRs."},
 {type:"matrix", ref:"sens-hearing", stem:"For each finding or cause, indicate the type of hearing loss.",
  rows:["Cerumen impaction","Presbycusis","Weber test: sound louder in the affected ear","Rinne test: air conduction greater than bone, with reduced time","Gentamicin toxicity","Otitis media"],
  cols:["Conductive","Sensorineural"],
  correct:[0,1,0,1,1,0],
  why:"Conductive loss is a mechanical block in the outer or middle ear (wax, otitis media), and Weber lateralizes to the bad ear. Sensorineural loss involves the cochlea or CN VIII (aging, ototoxic drugs); Rinne keeps the normal air-over-bone pattern with less time."},
 {type:"matrix", ref:"sens-glaucoma", stem:"For each finding or treatment, indicate the type of glaucoma it fits.",
  rows:["Painless, gradual loss of peripheral vision","Fixed, mid-dilated pupil","IV mannitol to rapidly lower IOP","Lifelong daily eye drops as the mainstay","Severe headache with nausea and vomiting","Optic disc cupping on ophthalmoscopy"],
  cols:["Primary open-angle","Acute angle-closure"],
  correct:[0,1,1,0,1,0],
  why:"Open-angle glaucoma is chronic and silent, with cupping of the optic disc and lifelong drops. Angle-closure is a sudden, painful emergency with a fixed mid-dilated pupil, nausea, and emergent IOP-lowering drugs such as mannitol."},
 {type:"matrix", ref:"m3-meds-diuretics", stem:"For each situation, indicate whether the nurse should give the medication or hold it and notify the provider.",
  rows:["Spironolactone due; potassium 5.3 mEq/L","Furosemide IV due; K⁺ 5.9 mEq/L, crackles, urine output 40 mL/hr","Mannitol infusing; new crackles and shortness of breath","Acetylcysteine due the morning of a contrast CT","Calcium gluconate ordered; client shows signs of digoxin toxicity","Prednisone taper dose due with breakfast"],
  cols:["Give","Hold and notify"],
  correct:[1,0,1,0,1,0],
  why:"Spironolactone is held with K⁺ above 5.0, mannitol can cause pulmonary edema, and calcium increases digoxin toxicity. Furosemide treats overload and high potassium while urine is still made, acetylcysteine protects the kidneys before contrast, and steroids are given in the morning with food — never stopped abruptly."},
 {type:"matrix", ref:"elim-aki", stem:"For each finding or nursing priority, indicate the phase of AKI it best matches.",
  rows:["Peaked T waves with a potassium of 6.2 mEq/L","Hypotension with a potassium of 3.1 mEq/L","Urine output of 4 L in 24 hours","Edema, hypertension, and dilutional hyponatremia","Fluid limited to the previous 24-hour output plus about 500–600 mL","Replace fluids and electrolytes; fall precautions for orthostatic BP"],
  cols:["Oliguric phase","Diuretic phase"],
  correct:[0,1,1,0,0,1],
  why:"The oliguric phase retains fluid and potassium, so fluid and potassium are restricted. In the diuretic phase, large volumes of urine carry off water, potassium, and sodium, so the risks flip to deficit and hypotension."},
 {type:"matrix", ref:"sens-aphasia", stem:"For each description, indicate the type of aphasia.",
  rows:["Understands speech but produces slow, halting phrases","Speaks fluently, but the words make little sense, and seems unaware of errors","Severe impairment of both understanding and speaking","Damage to Broca's area in the frontal lobe","Damage to Wernicke's area in the temporal lobe","Communication relies on touch, facial expression, and a simple yes/no system"],
  cols:["Expressive","Receptive","Global"],
  correct:[0,1,2,0,1,2],
  why:"Broca's (frontal) = broken speech with intact understanding. Wernicke's (temporal) = word salad with poor comprehension. Global aphasia impairs both, so care leans on nonverbal communication."},
 {type:"matrix", ref:"sens-emergencies", stem:"For each eye injury and action, indicate whether the action is appropriate or contraindicated.",
  rows:["Chemical splash: begin irrigating before taking a full history","Penetrating object: remove it to prevent further damage","Orbital fracture: have the client blow the nose to clear blood","Hyphema: keep the HOB at 30–45 degrees","Contusion: apply ice immediately","Hyphema: give aspirin for eye pain"],
  cols:["Appropriate","Contraindicated"],
  correct:[0,1,1,0,0,1],
  why:"Chemical burns are irrigated first, hyphema is managed in semi-Fowler's, and contusions get ice. Penetrating objects stay in place, nose blowing is avoided with orbital fractures, and aspirin/NSAIDs are avoided with hyphema because they worsen bleeding."}
],
"drill-cloze":[
 {type:"cloze", ref:"elim-aki", stem:"A client has had 3 days of vomiting and diarrhea. Complete the sentence.",
  template:"The client's BUN:creatinine ratio is likely {0} with a urine specific gravity of {1}. These findings point to {2} AKI, which the nurse expects to be treated first with {3}.",
  blanks:[{options:["10:1–15:1","above 20:1","below 5:1"],correct:1},{options:["1.010 (fixed)","1.002","1.030"],correct:2},{options:["intrarenal","postrenal","prerenal"],correct:2},{options:["IV fluids","fluid restriction","a Foley catheter"],correct:0}],
  why:"Volume loss starves the kidney of perfusion; the kidney responds by conserving water (high SG) and urea (ratio above 20:1). Restoring volume with IV fluids is both the treatment and the proof the cause was prerenal."},
 {type:"cloze", ref:"elim-lytes", stem:"A client with ESRD has a potassium of 6.9 mEq/L and peaked T waves. Complete the sentence.",
  template:"The nurse first anticipates {0} to {1}, followed by regular insulin IV given with {2} to shift potassium into the cells.",
  blanks:[{options:["sodium polystyrene sulfonate","calcium gluconate IV","furosemide IV","spironolactone"],correct:1},{options:["stabilize the cardiac membrane","remove potassium in the stool","lower the serum potassium","correct acidosis"],correct:0},{options:["D5W","D50","0.9% normal saline"],correct:1}],
  why:"Calcium gluconate protects the heart within minutes but does not lower potassium. Regular insulin IV drives potassium into cells, and D50 (not D5 or D10) prevents the resulting hypoglycemia."},
 {type:"cloze", ref:"elim-lytes", stem:"A client with CKD and a phosphorus of 7.6 mg/dL reports numbness around the mouth. Complete the sentence.",
  template:"Tapping in front of the client's ear causes a facial twitch, a positive {0} sign. The client is most likely {1}, and the nurse implements {2}.",
  blanks:[{options:["Trousseau's","Chvostek's","Romberg"],correct:1},{options:["alert and oriented but frightened","comatose","drowsy and difficult to arouse"],correct:0},{options:["a high-calcium dairy diet","seizure precautions","a fluid bolus"],correct:1}],
  why:"Chvostek = cheek; Trousseau = tourniquet. The hypocalcemic client is usually alert and terrified; coma comes late. Seizure and airway precautions are needed, and dairy is avoided because its phosphorus drives calcium down further."},
 {type:"cloze", ref:"elim-aki", stem:"A client with oliguric AKI had a 24-hour urine output of 350 mL. Complete the sentence.",
  template:"The client's fluid allowance for the next 24 hours is about {0}. An output of 350 mL/24 h is classified as {1}, and a 1.5-kg overnight weight gain represents about {2} of retained fluid.",
  blanks:[{options:["350 mL","850–950 mL","2,000 mL"],correct:1},{options:["anuria","polyuria","oliguria"],correct:2},{options:["1.5 L","150 mL","3 L"],correct:0}],
  why:"Fluid restriction = previous 24-hour output + about 500–600 mL (350 + 500–600 = 850–950 mL). Oliguria is below 400–500 mL/24 h; anuria is below 50. Each kilogram gained equals about 1 L of fluid."},
 {type:"cloze", ref:"elim-dialysis", stem:"A client on peritoneal dialysis is being assessed. Complete the sentence.",
  template:"Cloudy effluent indicates {0}, so the nurse should {1}. If the client becomes short of breath during the dwell, the nurse should {2}.",
  blanks:[{options:["bladder perforation","peritonitis","a normal exchange"],correct:1},{options:["lengthen the next dwell time","add potassium to the dialysate","send a sample for culture and notify the provider"],correct:2},{options:["drain the dialysate","instill more dialysate","lower the HOB flat"],correct:0}],
  why:"Cloudy effluent is peritonitis until proven otherwise — culture it and notify the provider. Dyspnea during a dwell means the fluid is pushing on the diaphragm, so it is drained right away."},
 {type:"cloze", ref:"m3-meds-eyedrops", stem:"A client with open-angle glaucoma is starting eye drops. Complete the sentence.",
  template:"Timolol {0} the production of aqueous humor, while latanoprost increases aqueous outflow and is given {1}. A client with glaucoma should never receive {2}.",
  blanks:[{options:["increases","decreases","does not change"],correct:1},{options:["every 4 hours","with meals","once daily at bedtime"],correct:2},{options:["pilocarpine","atropine","acetazolamide"],correct:1}],
  why:"Timolol turns off the faucet; latanoprost opens the drain and works best once nightly. Atropine dilates the pupil, blocks outflow, and spikes IOP. Pilocarpine and acetazolamide both lower IOP."},
 {type:"cloze", ref:"sens-retina", stem:"Complete the sentence comparing two eye emergencies.",
  template:"A detached retina is {0} and presents with flashes, floaters, and {1}. Until surgery, the nurse covers {2} to limit eye movement.",
  blanks:[{options:["severely painful","painless","accompanied by vomiting"],correct:1},{options:["halos around lights","a curtain over part of the vision","tunnel vision"],correct:1},{options:["only the affected eye","both eyes","neither eye"],correct:1}],
  why:"Pain separates the two emergencies: angle-closure glaucoma hurts, a detached retina does not. Both eyes are covered because the eyes move together."},
 {type:"cloze", ref:"sens-hearing", stem:"Complete the sentence about tuning fork testing.",
  template:"When the Weber test sound is louder in the affected ear, the client has {0} hearing loss, commonly caused by {1}. {2} usually work well for this type.",
  blanks:[{options:["sensorineural","conductive","mixed"],correct:1},{options:["presbycusis","gentamicin toxicity","cerumen impaction"],correct:2},{options:["Hearing aids","Cochlear implants alone","Prism glasses"],correct:0}],
  why:"In conductive loss, sound lateralizes to the bad ear because outside noise is blocked. Causes are mechanical — wax, otitis media, otosclerosis — and amplification with hearing aids works well."},
 {type:"cloze", ref:"sens-menieres", stem:"Complete the sentence about Ménière's disease.",
  template:"The Ménière's triad is vertigo, tinnitus, and {0}. During an acute attack, the priority is {1}, and to prevent future attacks the nurse teaches a {2} diet.",
  blanks:[{options:["unilateral hearing loss","eye pain","facial droop"],correct:0},{options:["early ambulation","fall prevention","a fluid bolus"],correct:1},{options:["high-potassium","high-sodium","low-sodium"],correct:2}],
  why:"Endolymphatic fluid buildup causes vertigo, tinnitus, and hearing loss on the affected side. The spinning creates a high fall risk, and a 1,000–2,000 mg/day sodium limit reduces inner-ear fluid."},
 {type:"cloze", ref:"m3-meds-lytes", stem:"A client on hemodialysis is prescribed calcium acetate. Complete the sentence.",
  template:"The client should take calcium acetate {0}. If the client skips a meal, the client should {1}.",
  blanks:[{options:["at bedtime on an empty stomach","with the first bite of each meal","2 hours after meals"],correct:1},{options:["skip that dose","double the next dose","take it with a glass of milk"],correct:0}],
  why:"Phosphate binders soak up phosphorus from food in the gut, so they only work with a meal — \"skip the meal, skip the pill.\" Milk adds phosphorus."}
],
"drill-bowtie":[
 {type:"bowtie", ref:"elim-lytes", stem:"A client with stage 4 CKD started using a salt substitute and ate a large bowl of potato soup. The client reports leg weakness moving upward. HR 52; ECG shows tall peaked T waves and a widening QRS. Complete the diagram: the condition the client is most likely experiencing, 2 actions the nurse should take, and 2 parameters to monitor.",
  conditionOptions:["Hypokalemia","Hypermagnesemia","Hyperkalemia","Hypocalcemia"],
  correctCondition:2,
  actionOptions:["Offer a banana to ease the leg cramps","Administer calcium gluconate IV as prescribed","Give the scheduled spironolactone","Prepare regular insulin IV with D50 as prescribed","Give NPH insulin subcutaneously"],
  correctActions:[1,3],
  paramOptions:["Continuous ECG rhythm","Pupil size","Intraocular pressure","Serial serum potassium","Urine specific gravity"],
  correctParams:[0,3],
  why:"Salt substitutes are potassium chloride; with failing kidneys the K⁺ climbs, and peaked T waves, a widening QRS, and a slowing HR signal danger. Calcium gluconate protects the heart and regular insulin IV with D50 shifts K⁺; the nurse watches the ECG and serial potassium. Spironolactone and bananas add potassium, and NPH is never used for this."},
 {type:"bowtie", ref:"elim-lytes", stem:"A client with ESRD missed dialysis for 4 days. The client is sitting upright, gasping, with crackles throughout, pink frothy sputum, BP 184/102, SpO₂ 86%, and weight up 3.5 kg. Complete the diagram: the condition, 2 priority actions, and 2 parameters to monitor.",
  conditionOptions:["Pneumonia","Pulmonary edema from fluid volume overload","Fluid volume deficit","Hypocalcemia"],
  correctCondition:1,
  actionOptions:["Coach hourly incentive spirometry","Raise the HOB to high Fowler's and apply oxygen","Suction frequently to clear the frothy sputum","Infuse a 0.9% normal saline bolus","Prepare the client for emergent dialysis"],
  correctActions:[1,4],
  paramOptions:["Daily weight","Capillary blood glucose","Lung sounds and SpO₂","Pupil response","Stool for occult blood"],
  correctParams:[0,2],
  why:"Missed dialysis with crackles, pink frothy sputum, hypertension, and rapid weight gain is pulmonary edema from overload. Positioning and O₂ support breathing while dialysis removes the fluid. Incentive spirometry and suctioning don't remove edema fluid, and a saline bolus worsens it."},
 {type:"bowtie", ref:"elim-lytes", stem:"A client with CKD has a phosphorus of 7.8 mg/dL. The client reports tingling around the mouth and fingers, and the hand spasms when the BP cuff is inflated. The client is oriented but frightened. Complete the diagram: the condition, 2 actions, and 2 parameters to monitor.",
  conditionOptions:["Hypocalcemia","Hypercalcemia","Hypermagnesemia","Hyperkalemia"],
  correctCondition:0,
  actionOptions:["Implement seizure precautions","Encourage milk and cheese to raise the calcium","Administer IV calcium gluconate as prescribed","Give a magnesium-containing antacid","Hold all phosphate binders"],
  correctActions:[0,2],
  paramOptions:["Serum calcium and phosphorus","Intraocular pressure","QT interval on the ECG","Urine culture","Abdominal girth"],
  correctParams:[0,2],
  why:"High phosphorus drives calcium down; perioral tingling and Trousseau's sign mean symptomatic hypocalcemia with seizure and laryngospasm risk. IV calcium and seizure precautions come first; the nurse trends Ca/phos and the QT interval. Dairy adds phosphorus, Mg antacids are avoided in renal failure, and binders lower phosphorus."},
 {type:"bowtie", ref:"elim-aki", stem:"A client on day 8 of IV gentamicin has a 24-hour urine output of 220 mL. Creatinine rose from 0.9 to 2.6 mg/dL, K⁺ is 5.8 mEq/L, and fine crackles are heard in the bases. Complete the diagram: the condition, 2 actions, and 2 parameters to monitor.",
  conditionOptions:["Diuretic phase of AKI","Postobstructive diuresis","Stage 2 chronic kidney disease","Oliguric phase of AKI"],
  correctCondition:3,
  actionOptions:["Infuse lactated Ringer's at 125 mL/hr","Encourage 3 L of oral fluid a day","Restrict fluid to the previous 24-hour output plus about 500–600 mL","Provide a high-potassium diet","Hold the next gentamicin dose and notify the provider"],
  correctActions:[2,4],
  paramOptions:["Visual fields","Hourly urine output","Blood ketones","Serum potassium","Serum albumin"],
  correctParams:[1,3],
  why:"A nephrotoxic drug, a sudden creatinine rise, and output below 400 mL/day define the oliguric phase of intrarenal AKI. Stop the toxin and restrict fluids; trend urine output and potassium. LR contains potassium, and extra fluid worsens overload."},
 {type:"bowtie", ref:"elim-dialysis", stem:"A client on continuous ambulatory peritoneal dialysis drains cloudy effluent and reports diffuse abdominal pain. T 101.6°F; the abdomen is rigid with rebound tenderness. Complete the diagram: the condition, 2 actions, and 2 parameters to monitor.",
  conditionOptions:["Bladder perforation","Hyperglycemia from dextrose absorption","Peritonitis","Constipation causing poor outflow"],
  correctCondition:2,
  actionOptions:["Lengthen the dwell time","Send a sample of the effluent for culture","Warm the next bag in the microwave","Notify the provider","Add potassium to the dialysate"],
  correctActions:[1,3],
  paramOptions:["Temperature","Visual acuity","Serum magnesium","Clarity of the effluent","Deep tendon reflexes"],
  correctParams:[0,3],
  why:"Cloudy effluent with fever, pain, and a rigid abdomen is peritonitis. The nurse cultures the effluent, notifies the provider, and trends temperature and effluent clarity. Microwaving burns the peritoneum, and a longer dwell does nothing for infection."},
 {type:"bowtie", ref:"sens-glaucoma", stem:"After leaving a dark movie theater, a client develops severe left eye pain, headache, vomiting, and halos around lights. The eye is red and the pupil is fixed and mid-dilated. Complete the diagram: the condition, 2 actions, and 2 parameters to monitor.",
  conditionOptions:["Detached retina","Acute angle-closure glaucoma","Primary open-angle glaucoma","Cataract"],
  correctCondition:1,
  actionOptions:["Administer atropine drops as prescribed","Administer pilocarpine drops as prescribed","Advise the client to rest and follow up in the morning","Prepare IV mannitol using a filter needle","Patch both eyes and keep the client flat"],
  correctActions:[1,3],
  paramOptions:["Intraocular pressure","Lung sounds for crackles","Blood glucose","Weber test results","Urine specific gravity"],
  correctParams:[0,1],
  why:"Sudden severe pain, halos, vomiting, and a fixed mid-dilated pupil after dim light is angle-closure glaucoma — an emergency. A miotic opens the angle and mannitol pulls fluid from the eye; the nurse trends IOP and listens for crackles because mannitol can cause fluid overload. Atropine dilates the pupil and worsens the block."},
 {type:"bowtie", ref:"sens-retina", stem:"A client with severe myopia reports a sudden burst of floaters and flashing lights, then a dark shadow spreading across the upper vision of the right eye. There is no pain. Complete the diagram: the condition, 2 actions, and 2 parameters to monitor.",
  conditionOptions:["Wet AMD","Acute angle-closure glaucoma","Detached retina","Cataract"],
  correctCondition:2,
  actionOptions:["Encourage the client to read to stay calm","Notify the ophthalmologist immediately","Apply a warm compress to the right eye","Allow the client to walk to the restroom alone","Cover both eyes and maintain bed rest"],
  correctActions:[1,4],
  paramOptions:["Changes in the shadow, flashes, or floaters","Hearing acuity","Nausea, vomiting, and restlessness","Serum phosphorus","Peak expiratory flow"],
  correctParams:[0,2],
  why:"Painless flashes, floaters, and a spreading curtain are a retinal detachment. The nurse notifies the specialist, covers both eyes, and limits activity. Visual changes show progression, and vomiting or restlessness raises IOP."},
 {type:"bowtie", ref:"elim-gn", stem:"Two weeks after a sore throat, a 22-year-old reports a headache and dark, cola-colored urine. Periorbital edema; BP 170/104; weight up 2 kg; urine output decreased. Complete the diagram: the condition, 2 actions, and 2 parameters to monitor.",
  conditionOptions:["Nephrotic syndrome","Acute glomerulonephritis","Acute pyelonephritis","Benign nephrosclerosis"],
  correctCondition:1,
  actionOptions:["Encourage 3 L of fluid a day","Restrict sodium and fluids as prescribed","Provide a high-protein diet","Administer antihypertensives as prescribed","Encourage vigorous activity to mobilize edema"],
  correctActions:[1,3],
  paramOptions:["Blood pressure","Intraocular pressure","Daily weight","Serum glucose","Hearing acuity"],
  correctParams:[0,2],
  why:"A recent strep infection followed by hematuria, periorbital edema, and hypertension is acute (nephritic) glomerulonephritis. Sodium/fluid restriction and BP control are central, with rest during the acute phase; BP and daily weight track response and fluid status."},
 {type:"bowtie", ref:"elim-pyelo", stem:"An 82-year-old with an indwelling catheter is newly confused. T 102.4°F, HR 118, BP 86/50. Urine is cloudy and foul-smelling, and the client winces when the right flank is tapped. Complete the diagram: the condition, 2 actions, and 2 parameters to monitor.",
  conditionOptions:["Acute glomerulonephritis","Pyelonephritis progressing to urosepsis","Nephrotic syndrome","Benign nephrosclerosis"],
  correctCondition:1,
  actionOptions:["Obtain urine and blood cultures before the first antibiotic dose","Restrict fluids to 1 L/day","Clamp the catheter for 4 hours","Administer IV antibiotics and IV fluids as prescribed","Delay antibiotics until culture results return"],
  correctActions:[0,3],
  paramOptions:["Blood pressure and heart rate","Intraocular pressure","Level of consciousness","Serum phosphorus","Visual fields"],
  correctParams:[0,2],
  why:"Fever, flank tenderness, cloudy urine, and new confusion in an older adult with a catheter suggest pyelonephritis, and hypotension with tachycardia signals urosepsis. Culture first, then start IV antibiotics and fluids without delay; trend hemodynamics and mental status."},
 {type:"bowtie", ref:"sens-menieres", stem:"A client reports intense spinning even while lying still, ringing and fullness in the right ear, and muffled hearing on that side. The client has vomited twice. Complete the diagram: the condition, 2 actions, and 2 parameters to monitor.",
  conditionOptions:["Presbycusis","Hyperkalemia","Detached retina","Acute attack of Ménière's disease"],
  correctCondition:3,
  actionOptions:["Keep the bed low with side rails up and assist with all movement","Turn on the TV as a distraction","Encourage walking in the hallway","Administer meclizine and an antiemetic as prescribed","Offer coffee to relieve the headache"],
  correctActions:[0,3],
  paramOptions:["Intraocular pressure","Intake and output and signs of dehydration","Serum phosphorus","Visual fields","Frequency, duration, and severity of vertigo"],
  correctParams:[1,4],
  why:"Vertigo, tinnitus, aural fullness, and one-sided hearing loss are the Ménière's triad. Safety and vestibular/antiemetic drugs come first; vomiting makes fluid balance a concern, and attack patterns guide treatment. TV flicker and caffeine worsen symptoms."}
],
"drill-dragdrop":[
 {type:"dragdrop", ref:"elim-aki", stem:"Sort each treatment or clue by the AKI category it fits.",
  items:["Restore perfusion with IV fluids or blood","Stop the gentamicin","Insert or flush a Foley catheter","Lithotripsy for an obstructing stone","Vasopressors for shock","Muddy-brown casts on urinalysis"],
  bins:["Prerenal","Intrarenal","Postrenal"],
  correctBin:[0,1,2,2,0,1],
  why:"Prerenal care restores flow to the kidney; intrarenal care removes the toxin, and casts point to tubular damage; postrenal care relieves the obstruction."},
 {type:"dragdrop", ref:"m3-meds-eyedrops", stem:"A client's medication history lists several eye drugs. Sort each by its role in glaucoma.",
  items:["Betaxolol","Bimatoprost","Carbachol","Acetazolamide","Brimonidine","Travoprost","Any anticholinergic pupil-dilating drop"],
  bins:["Turns off the faucet (less aqueous made)","Opens the drain (more aqueous out)","Avoid in glaucoma"],
  correctBin:[0,1,1,0,0,1,2],
  why:"Beta blockers (betaxolol), carbonic anhydrase inhibitors (acetazolamide), and adrenergic agonists (brimonidine) reduce aqueous production. Prostaglandin analogs (bimatoprost, travoprost) and cholinergic miotics (carbachol) increase outflow. Dilating drugs block outflow."},
 {type:"dragdrop", ref:"elim-diet", stem:"A client on hemodialysis is planning meals. Sort each item.",
  items:["Banana","Apple","Dark cola","Rice milk","Cheese","Green beans","Salt substitute"],
  bins:["Kidney-friendly choice","Limit or avoid"],
  correctBin:[1,0,1,0,1,0,1],
  why:"Bananas are high in potassium, dark colas and cheese are high in phosphorus (cheese also in potassium), and salt substitutes are potassium chloride. Apples, rice milk, and green beans are the lower-potassium, lower-phosphorus swaps."},
 {type:"dragdrop", ref:"elim-dialysis", stem:"Sort each feature by the dialysis type it describes.",
  items:["Tenckhoff catheter","AV fistula with a thrill and bruit","Usually 3 sessions a week at a center","More liberal potassium intake","Hyperglycemia from absorbed dextrose","Dialysis disequilibrium syndrome","Cloudy outflow signals infection"],
  bins:["Hemodialysis","Peritoneal dialysis"],
  correctBin:[1,0,0,1,1,0,1],
  why:"HD uses vascular access and rapid sessions, which raises the risk of disequilibrium syndrome. PD uses the peritoneum and a Tenckhoff catheter and runs daily, so potassium is cleared more steadily; its dextrose dialysate can raise glucose, and cloudy outflow means peritonitis."},
 {type:"dragdrop", ref:"sens-cataract", stem:"A client calls the clinic 2 days after cataract surgery. Sort each finding.",
  items:["Mild itching around the eye","Eye pain that keeps increasing","Vision still somewhat blurry","Flashes of light and new floaters","More redness with yellow drainage","Reduced depth perception while the eye is patched"],
  bins:["Expected","Report now"],
  correctBin:[0,1,0,1,1,0],
  why:"Mild itching, blurry vision for 1–2 weeks, and altered depth perception with a patch are expected. Increasing pain (bleeding or high IOP), flashes and floaters (retinal detachment), and purulent drainage (infection) are reported right away."},
 {type:"dragdrop", ref:"sens-hemianopsia", stem:"Sort each finding by the visual field loss it describes.",
  items:["Age-related macular degeneration","Open-angle glaucoma","Homonymous hemianopsia","Wavy lines on the Amsler grid","Tunnel vision","Eats only the food on one side of the plate"],
  bins:["Central vision loss","Peripheral vision loss","Half of the visual field"],
  correctBin:[0,1,2,0,1,2],
  why:"AMD destroys the macula, which gives central vision, and the Amsler grid detects it. Glaucoma takes the periphery first (tunnel vision). Hemianopsia cuts the same half of the field in both eyes, so the client misses one side of the plate."},
 {type:"dragdrop", ref:"elim-lytes", stem:"A client's potassium is 7.0 mEq/L. Sort each treatment by its goal.",
  items:["Calcium gluconate IV","Calcium chloride IV","Regular insulin IV with D50","Nebulized albuterol","Sodium bicarbonate IV","Sodium zirconium cyclosilicate (Lokelma)","Hemodialysis"],
  bins:["Stabilize the heart","Shift K⁺ into cells","Remove K⁺ from the body"],
  correctBin:[0,0,1,1,1,2,2],
  why:"Calcium protects the myocardium but doesn't lower K⁺. Insulin, albuterol, and bicarbonate move K⁺ into cells only temporarily. Binders like Lokelma and dialysis actually remove it."},
 {type:"dragdrop", ref:"elim-pyelo", stem:"Sort each finding or fact by the disorder it fits.",
  items:["Elevated ASO titer","White blood cell casts","E. coli on urine culture","Cola-colored urine with periorbital edema","Fever, chills, and CVA tenderness","Immune complexes lodge in the glomeruli 2–3 weeks after strep"],
  bins:["Acute glomerulonephritis","Acute pyelonephritis"],
  correctBin:[0,1,1,0,1,0],
  why:"Glomerulonephritis is an immune reaction after strep — ASO titer, hematuria, edema, hypertension. Pyelonephritis is a bacterial kidney infection — E. coli, WBC casts, fever, and flank/CVA tenderness — treated with antibiotics."},
 {type:"dragdrop", ref:"elim-lytes", stem:"Sort each finding or cause by the magnesium imbalance it fits.",
  items:["Absent deep tendon reflexes","Torsades de pointes","Flushing and warmth","Tetany and seizures","Slow, shallow respirations","Daily Milk of Magnesia in a client with CKD","Long-term loop diuretic use"],
  bins:["Hypermagnesemia","Hypomagnesemia"],
  correctBin:[0,1,0,1,0,0,1],
  why:"High magnesium depresses nerves and muscles (lost DTRs, flushing, respiratory depression) and is most often caused by kidney failure plus Mg-containing products. Low magnesium makes them irritable (tetany, seizures, torsades) and is caused by losses such as loop diuretics."},
 {type:"dragdrop", ref:"sens-menieres", stem:"Sort each intervention for a client with Ménière's disease by when it is used.",
  items:["Bed rest in a quiet, darkened room","Sodium limited to 1,000–2,000 mg/day","Avoid caffeine and alcohol","Meclizine and an antiemetic","Bed low, side rails up, assist with ambulation","Hydrochlorothiazide","Vestibular rehabilitation"],
  bins:["Acute vertigo attack","Maintenance / preventing attacks"],
  correctBin:[0,1,1,0,0,1,1],
  why:"During an attack, the focus is safety, a calm dark room, and drugs that calm the vestibular system and nausea. Between attacks, sodium limits, trigger avoidance, diuretics, and vestibular rehab reduce inner-ear fluid and disability."}
]
});

        { t: "Seat him in the waiting area until a dialysis chair opens and recheck vitals in an hour", next: "n1x", good: false, fb: "Dialysis is the cure, but he can't wait unmonitored. Peaked T waves mean the myocardium is already irritable." },

      n1x: { text: "Forty minutes later, the receptionist calls you: Mr. D. looks gray.<br>• HR now <strong>46</strong><br>• The monitor shows <strong>widening QRS</strong> complexes<br>• He's drowsy but responds to his name<br>His potassium is rising and the heart is slowing.", choices: [
        { t: "Call the rapid response team, put him on the monitor, and get the provider at the bedside for orders", next: "n2", good: true, fb: "Bradycardia after tachycardia is the warning that asystole may follow. Rescue now and start treatment." },
        { t: "Help him to a stretcher and recheck the HR in 15 minutes", next: "endBad", good: false, fb: "A widening QRS with bradycardia can progress to ventricular fibrillation or asystole within minutes. This needs immediate action." } ] },
      n2: { text: "The provider orders:<br>• <strong>Calcium gluconate</strong> IV<br>• <strong>Regular insulin 10 units IV + D50</strong><br>• <strong>Lokelma</strong> PO<br>• Emergent <strong>hemodialysis</strong><br>The monitor still shows peaked T waves. Which do you give first?", choices: [
        { t: "Calcium gluconate IV", next: "n3", good: true, fb: "Stabilize first. Calcium protects the cardiac membrane within minutes. It doesn't lower K⁺, but it buys time for shifting and removal." },
        { t: "Lokelma PO, because it removes potassium from the body", next: "n2x", good: false, fb: "Binders work over hours. Removal comes last. The heart needs protecting right now." },
        { t: "Regular insulin IV with D50", next: "n3", good: null, fb: "Shifting matters, but it comes second. Until calcium is in, the heart is still unprotected. Remember the order: stabilize, shift, remove." } ] },
      n2x: { text: "You are mixing the Lokelma when the monitor alarms.<br>• HR <strong>52</strong><br>• P waves are flattening and the <strong>QRS is widening</strong><br>• He says his chest feels \"heavy\"<br>The calcium gluconate is still in the med room.", choices: [
        { t: "Give the calcium gluconate IV now and stay at the bedside watching the monitor", next: "n3", good: true, fb: "This is the right recovery. Calcium is the drug that protects the heart while you shift and remove the K⁺." },
        { t: "Finish giving the Lokelma and wait for it to work", next: "endBad", good: false, fb: "Lokelma can't act fast enough to prevent a lethal rhythm. Stabilize the myocardium first." } ] },
      n3: { text: "Calcium gluconate is in and the rhythm is holding. Next you'll give <strong>regular insulin 10 units</strong> with <strong>D50</strong>.<br>• Glucose <strong>118 mg/dL</strong><br>• K⁺ still <strong>7.0</strong><br>How do you give it?", choices: [
        { t: "Regular insulin 10 units IV, given together with D50, then frequent glucose checks", next: "n4", good: true, fb: "Regular insulin is the only insulin given IV. It drives K⁺ into cells, and D50 prevents hypoglycemia. The shift is temporary, so removal still has to follow." },
        { t: "Regular insulin 10 units subQ, skip the D50 because the glucose is normal", next: "n3x", good: false, fb: "SubQ insulin is too slow for this emergency. Giving it without dextrose to a client with normal glucose causes hypoglycemia." },
        { t: "Albuterol nebulizer only, to avoid insulin risks", next: "n4", good: null, fb: "Albuterol helps shift K⁺, but it's an add-on, not a replacement for IV insulin + D50 in a client with ECG changes." } ] },
      n3x: { text: "Ninety minutes later, Mr. D. is <strong>sweaty and shaky</strong>.<br>• Glucose <strong>52 mg/dL</strong><br>• K⁺ <strong>6.8</strong>, so it has barely moved<br>• HR 104", choices: [
        { t: "Give D50 IV per protocol, notify the provider, and ask for the IV regular insulin + D50 order", next: "n4", good: true, fb: "Correct the hypoglycemia with IV dextrose and get the proper IV insulin regimen going to shift the K⁺." },
        { t: "Give 8 oz of orange juice", next: "n4", good: null, fb: "It treats the low glucose, but orange juice is high in potassium. The ESRD client also has a fluid limit. IV D50 is the better choice." },
        { t: "Recheck the glucose in an hour", next: "endBad", good: false, fb: "Untreated hypoglycemia and an uncorrected K⁺ are two emergencies at once. Both need action now." } ] },
      n4: { text: "Thirty minutes after the insulin + D50:<br>• K⁺ <strong>6.1</strong><br>• Glucose 96<br>• He makes almost no urine (<strong>anuric</strong>)<br>• Bowel sounds are present<br>The dialysis chair will be ready in 2 hours.", choices: [
        { t: "Mix the Lokelma right before giving it, have him drink it right away, and confirm emergent dialysis", next: "n5", good: true, fb: "Shifting wears off within hours. Removal has to follow, using a binder plus dialysis. Lokelma is oral only and should be drunk as soon as it's mixed." },
        { t: "Ask for IV furosemide to flush out the potassium", next: "n4x", good: false, fb: "Loop diuretics remove K⁺ only while the kidneys still make urine. In an anuric client, furosemide does nothing and only delays real removal." },
        { t: "Recheck the K⁺ before giving any binder", next: "n5", good: null, fb: "Trending the K⁺ is important, but the drop came from shifting, not removal. The potassium will drift back out of the cells, so give the binder." } ] },
      n4x: { text: "Two hours later the furosemide has produced no urine.<br>• K⁺ is back up to <strong>6.8</strong> because the shift has worn off<br>• HR <strong>108</strong><br>• T waves are peaking again", choices: [
        { t: "Notify the provider, give the binder, and push for emergent dialysis now", next: "n5", good: true, fb: "Insulin, bicarbonate, and albuterol only move K⁺ temporarily. For this client, dialysis is the definitive way to remove it." },
        { t: "Give a second dose of furosemide", next: "endBad", good: false, fb: "Repeating a diuretic in an anuric client fails again, and the K⁺ keeps climbing toward a lethal rhythm." } ] },
      n5: { text: "While Mr. D. waits for dialysis, he says, \"I feel so much calmer now.\"<br>• HR dropped from 104 to <strong>54</strong><br>• BP 118/70<br>• His legs feel <strong>weaker</strong> than before<br>What is your interpretation?", choices: [
        { t: "Run an ECG strip now, notify the provider, and prepare repeat calcium and emergent dialysis. The bradycardia may mean the K⁺ is rising.", next: "n6", good: true, fb: "This is the trap: hyperkalemia causes tachycardia first, then bradycardia, then asystole. A falling HR with more weakness means the K⁺ is getting worse." },
        { t: "Document that he is improving because the tachycardia has resolved", next: "n5x", good: false, fb: "A slower HR here isn't recovery. With rising K⁺, bradycardia comes before asystole." },
        { t: "Recheck vital signs in 30 minutes", next: "n6", good: null, fb: "Watching the trend is fine, but new bradycardia with worsening weakness in hyperkalemia needs an ECG and a provider call now." } ] },
      n5x: { text: "Twenty minutes later the monitor alarms.<br>• HR <strong>36</strong><br>• The QRS is <strong>wide and blending into the T wave</strong> in a sine-wave pattern<br>• Mr. D. is barely responsive", choices: [
        { t: "Call a code or rapid response, give calcium per protocol, and start emergent dialysis", next: "endOk", good: true, fb: "A sine-wave pattern means arrest is imminent. Stabilize the heart and remove the potassium immediately." },
        { t: "Keep him on the schedule for the next dialysis chair", next: "endBad", good: false, fb: "A sine-wave rhythm progresses to ventricular fibrillation or standstill. Waiting is not an option." } ] },
      n6: { text: "Mr. D. completes emergent hemodialysis.<br>• K⁺ <strong>4.6</strong><br>• HR 82<br>• The ECG has normalized<br>He is getting ready to go home. Which teaching is most important?", choices: [
        { t: "Never skip dialysis, follow the low-potassium diet, avoid salt substitutes, and report weakness or an irregular heartbeat", next: "endGood", good: true, fb: "Missed dialysis caused this. Salt substitutes are potassium chloride, so they're a hidden K⁺ source." },
        { t: "Use a salt substitute instead of table salt to protect your blood pressure", next: "endBad", good: false, fb: "Salt substitutes are made of potassium chloride. This advice would send him back with hyperkalemia." },
        { t: "Bananas are fine in moderation, and if you're busy you can reschedule a session", next: "endOk", good: null, fb: "Diet matters, but the root problem was missed dialysis. Rescheduling or skipping sessions isn't safe." } ] },
      endGood: { end: "good", text: "<strong>Rescued.</strong> Mr. D. stabilized without arrest and went home understanding why dialysis can't be skipped.<br>• <strong>Stabilize → shift → remove:</strong> calcium gluconate first, then regular insulin IV + D50, then binders or dialysis.<br>• Shifting is temporary, and furosemide doesn't help an anuric client.<br>• <strong>HR goes tachy, then brady, then asystole.</strong> A slowing HR is a red flag." },
      endOk: { end: "ok", text: "<strong>Survived, with a close call.</strong> Mr. D. got through it, but delays or gaps in his teaching left him at risk.<br>• Treat K⁺ above 5.5 with ECG changes as an emergency. Don't wait.<br>• A falling HR in hyperkalemia means it's getting worse, not better.<br>• Teaching must address the cause: missed dialysis." },
      endBad: { end: "bad", text: "<strong>Lost the rescue.</strong> The potassium kept rising until the rhythm deteriorated, or the teaching set him up to come back.<br>• Calcium gluconate protects the heart within minutes, so give it first.<br>• Binders and diuretics are too slow, or don't work in anuria. Dialysis removes the K⁺.<br>• Salt substitutes are potassium chloride." }
    }
  },

  fluidover: {
    title: "Drowning From the Inside: AKI Fluid Overload",
    intro: "An oliguric AKI client is short of breath with pink, frothy sputum. Stop the flood.",
    start: "n1",
    nodes: {
      n1: { text: "Ms. R., 66, is on day 3 of <strong>oliguric AKI</strong>. She is suddenly very short of breath.<br>• UO <strong>15 mL/hr</strong>, up <strong>3 kg</strong> since admission<br>• RR <strong>32</strong>, SpO₂ <strong>86%</strong>, BP 170/96, HR 118<br>• Crackles throughout, <strong>pink frothy sputum</strong><br>• NS running at 125 mL/hr<br>First action?", choices: [
        { t: "Raise the HOB to high Fowler's and apply oxygen", next: "n2", good: true, fb: "These are classic pulmonary edema cues. Positioning and O₂ improve breathing right away while you get more orders." },
        { t: "Increase the IV rate to help \"flush\" the kidneys", next: "n1x", good: false, fb: "Her kidneys can't excrete this fluid. More volume goes straight to the lungs." },
        { t: "Coach her to use the incentive spirometer every 10 minutes", next: "n2", good: null, fb: "Incentive spirometry doesn't remove pulmonary edema fluid. Positioning and O₂ come first." } ] },
      n1x: { text: "Fifteen minutes later:<br>• SpO₂ <strong>80%</strong>, RR <strong>38</strong><br>• She is restless and gasping<br>• The frothy sputum has increased", choices: [
        { t: "Stop the infusion, sit her upright, apply O₂, and call the rapid response team", next: "n3", good: true, fb: "Stop adding volume and support oxygenation. She needs fluid removed, not added." },
        { t: "Lay her flat and suction her airway", next: "endBad", good: false, fb: "Lying flat worsens pulmonary edema, and suctioning doesn't remove fluid from the alveoli." } ] },
      n2: { text: "She is sitting upright on O₂ and her SpO₂ is <strong>90%</strong>. The NS is still running at <strong>125 mL/hr</strong>, and she has two IV antibiotics due today.<br>What's next?", choices: [
        { t: "Reduce the IV to the lowest ordered rate, notify the provider, and ask for a fluid restriction that counts IV meds and fluids", next: "n3", good: true, fb: "A fluid restriction counts every source: PO, maintenance IV, and the fluid IV meds are mixed in." },
        { t: "Ask for a 500 mL NS bolus to boost her urine output", next: "n2x", good: false, fb: "Low UO in oliguric AKI comes from kidney failure, not dehydration. A bolus floods the lungs." },
        { t: "Suction her mouth often to clear the frothy sputum", next: "n3", good: null, fb: "Suctioning clears the mouth, but it doesn't remove edema fluid from the lungs. Stopping the fluid is the priority." } ] },
      n2x: { text: "Halfway through the bolus:<br>• SpO₂ <strong>78%</strong><br>• She's <strong>confused</strong><br>• Crackles are heard to the apices<br>• BP 182/100", choices: [
        { t: "Stop the bolus, call the rapid response team, and keep her upright on high-flow O₂", next: "n3", good: true, fb: "Recognize the harm, stop the volume, and escalate. She needs fluid removed fast." },
        { t: "Finish the bolus, since the provider ordered it", next: "endBad", good: false, fb: "Question an order that's harming the client. More volume here worsens respiratory failure." } ] },
      n3: { text: "The provider orders <strong>furosemide 80 mg IV</strong>.<br>• UO is still about <strong>15 mL/hr</strong>, so she's oliguric, not anuric<br>• K⁺ 5.6<br>• Allergies: none listed<br>What do you do?", choices: [
        { t: "Confirm she's still making some urine and has no sulfa allergy, give it, then monitor UO, BP, and K⁺", next: "n4", good: true, fb: "Furosemide works only while the kidneys make urine, so it can help here. It's contraindicated in anuria and sulfa allergy." },
        { t: "Hold the furosemide because her urine output is low", next: "n3x", good: false, fb: "Low UO isn't anuria. A diuretic is part of treating her pulmonary edema while she still makes urine." },
        { t: "Insert an indwelling catheter first so you can measure the response", next: "n4", good: null, fb: "Accurate I&amp;O helps, but don't delay a drug for acute pulmonary edema to place a catheter first." } ] },
      n3x: { text: "One hour later:<br>• SpO₂ <strong>84%</strong> on 6 L<br>• Crackles throughout<br>• She can only speak 2–3 words at a time", choices: [
        { t: "Call the provider, report UO 15 mL/hr (not anuric), give the furosemide, and anticipate dialysis", next: "n4", good: true, fb: "Good recovery. Give the diuretic and escalate, because she may need emergent fluid removal." },
        { t: "Wait for the morning lab results before doing anything", next: "endBad", good: false, fb: "She's in respiratory failure now. Waiting for labs lets the pulmonary edema progress." } ] },
      n4: { text: "One hour after the furosemide:<br>• UO only <strong>20 mL/hr</strong><br>• SpO₂ <strong>89%</strong> on 6 L, crackles persist<br>• K⁺ now <strong>6.1</strong><br>• She says she's \"so thirsty\"", choices: [
        { t: "Notify the provider: she's not responding to diuretics and K⁺ is rising. Anticipate emergent dialysis or CRRT.", next: "n5", good: true, fb: "Dialysis or CRRT is started when fluid overload, hyperkalemia, acidosis, or uremia can't be controlled." },
        { t: "Let her drink freely, since thirst is a sign of dehydration", next: "n4x", good: false, fb: "She's fluid overloaded, not dehydrated. Use mouth care and counted ice chips for thirst within the restriction." },
        { t: "Increase the O₂ and reassess in 2 hours", next: "n5", good: null, fb: "Supportive, but it doesn't fix the problem. The diuretic has failed and the K⁺ is climbing, so escalate now." } ] },
      n4x: { text: "By evening:<br>• She has had <strong>900 mL</strong> by mouth<br>• Weight is up another <strong>1 kg</strong><br>• SpO₂ <strong>82%</strong><br>• K⁺ <strong>6.4</strong>", choices: [
        { t: "Restart the counted restriction with mouth care, notify the provider, and anticipate emergent dialysis or CRRT", next: "n5", good: true, fb: "1 kg equals about 1 L of retained fluid. Restrict intake and get the fluid removed." },
        { t: "Encourage her to keep drinking to stay comfortable", next: "endBad", good: false, fb: "Every liter she keeps ends up in her lungs and tissues." } ] },
      n5: { text: "She's transferred to the ICU and <strong>CRRT</strong> is started.<br>• BP 142/84<br>• SpO₂ 92%<br>• Ultrafiltrate is <strong>clear yellow</strong><br>How often do you assess VS, I&amp;O, and hemodynamics?", choices: [
        { t: "Hourly, plus the access site and the ultrafiltrate color", next: "n6", good: true, fb: "CRRT requires hourly VS, I&amp;O, and hemodynamic checks. Bloody ultrafiltrate means a ruptured filter, so stop treatment." },
        { t: "Every 4 hours, so she can rest", next: "n5x", good: false, fb: "CRRT shifts fluid continuously. Problems such as hypotension or a ruptured filter develop between checks." },
        { t: "A daily weight is enough to track fluid removal", next: "n6", good: null, fb: "Daily weights matter, but CRRT also needs hourly monitoring." } ] },
      n5x: { text: "At the 4-hour check:<br>• The ultrafiltrate is <strong>red-tinged</strong><br>• BP <strong>94/58</strong><br>• HR 112", choices: [
        { t: "Stop the CRRT and notify the provider immediately", next: "n6", good: true, fb: "Bloody ultrafiltrate means the filter membrane ruptured. Stop treatment." },
        { t: "Keep CRRT running and recheck in 4 hours", next: "endBad", good: false, fb: "Continuing with a ruptured filter causes blood loss and instability." } ] },
      n6: { text: "Next morning:<br>• She's down <strong>2.5 kg</strong> and her lungs are much clearer<br>• BP <strong>88/52</strong>, HR <strong>116</strong><br>• She's dizzy when she sits up<br>• A scheduled furosemide dose is due", choices: [
        { t: "Recognize overcorrection (fluid volume deficit). Hold the diuretic and call the provider to adjust fluid removal. Use fall precautions.", next: "n7", good: true, fb: "Dialysis and diuretics can overshoot into deficit: hypotension, tachycardia, and dizziness." },
        { t: "Give the scheduled furosemide to keep her lungs dry", next: "n6x", good: false, fb: "She is now hypotensive and tachycardic. More diuresis worsens the deficit." },
        { t: "Recheck the BP in an hour", next: "n7", good: null, fb: "Trending helps, but new hypotension with dizziness after fluid removal needs a provider call now." } ] },
      n6x: { text: "Two hours later, she <strong>nearly faints</strong> standing to use the commode.<br>• BP <strong>76/44</strong><br>• HR 128", choices: [
        { t: "Help her back to bed, hold further diuretics, notify the provider, and start fall precautions", next: "endOk", good: true, fb: "Recognize fluid volume deficit, stop the removal, and keep her safe." },
        { t: "Have her walk it off to improve circulation", next: "endBad", good: false, fb: "Severe hypotension plus walking leads to a fall and possible injury." } ] },
      n7: { text: "She's stable and still oliguric. The provider asks you to set her fluid limit.<br>• <strong>Previous 24-h output: 400 mL</strong><br>What is a reasonable daily restriction?", choices: [
        { t: "About 900–1,000 mL/day, counting all IV and PO fluids, with daily weights on the same scale", next: "endGood", good: true, fb: "Previous 24-h output plus about 500–600 mL covers insensible losses. Daily weights: 1 kg equals 1 L." },
        { t: "2–3 L/day to protect the kidneys", next: "endBad", good: false, fb: "That's pyelonephritis teaching. In oliguric AKI, it would put her back in pulmonary edema." },
        { t: "400 mL/day, exactly matching her output", next: "endOk", good: null, fb: "Too strict. It ignores insensible losses from the skin and lungs." } ] },
      endGood: { end: "good", text: "<strong>Rescued.</strong> Ms. R.'s lungs cleared, her BP held steady, and she has a safe fluid plan.<br>• Pulmonary edema: <strong>HOB up, O₂, stop or limit fluids</strong>, furosemide if she still makes urine, then dialysis or CRRT if uncontrolled.<br>• Incentive spirometry and suctioning don't remove edema fluid.<br>• Restriction = previous 24-h output + 500–600 mL. Watch for overcorrection." },
      endOk: { end: "ok", text: "<strong>Survived, with setbacks.</strong> Ms. R. recovered, but a deficit or a poor fluid plan put her at risk.<br>• Overcorrection looks like hypotension, tachycardia, and dizziness after dialysis or diuretics.<br>• Restrictions must cover insensible losses (+500–600 mL).<br>• Weigh daily on the same scale. 1 kg equals 1 L." },
      endBad: { end: "bad", text: "<strong>Lost the rescue.</strong> She went into respiratory failure, or became unstable, from too much or too little fluid.<br>• Never add volume to an oliguric client in pulmonary edema.<br>• Stop CRRT for bloody ultrafiltrate.<br>• Hold diuretics when she's hypotensive and tachycardic after fluid removal." }
    }
  },

  eyeemerg: {
    title: "The Red Eye After Movie Night",
    intro: "Sudden eye pain, halos, and vomiting after time in a dark room. Save the sight.",
    start: "n1",
    nodes: {
      n1: { text: "Mrs. L., 64, watched a movie in the dim dayroom. An hour later she reports <strong>severe right eye pain</strong>, a headache, and <strong>halos around lights</strong>. She has vomited twice.<br>• Right eye is <strong>red</strong> with a <strong>cloudy cornea</strong><br>• Right pupil is <strong>fixed and mid-dilated</strong><br>• Vision is blurred<br>First action?", choices: [
        { t: "Recognize possible acute angle-closure glaucoma and notify the provider immediately", next: "n2", good: true, fb: "Severe pain, halos, N/V, and a fixed mid-dilated pupil point to angle-closure, an emergency. IOP must come down fast to save her vision." },
        { t: "Give the PRN antiemetic, dim the lights for a migraine, and recheck in an hour", next: "n1x", good: false, fb: "Dim light makes the pupil dilate and block the drainage angle further. Losing an hour risks permanent vision loss." },
        { t: "Check visual acuity with a Snellen chart before calling", next: "n2", good: null, fb: "Acuity is a useful baseline, but don't delay the provider call for it. This is an emergency." } ] },
      n1x: { text: "One hour later:<br>• Pain is <strong>10/10</strong> and she's still vomiting<br>• Right eye vision is down to <strong>hand motion only</strong><br>• The pupil is still fixed", choices: [
        { t: "Notify the provider immediately and report the angle-closure cues", next: "n2", good: true, fb: "Escalate now. Lost vision can't be restored, so lowering the IOP is urgent." },
        { t: "Give a second antiemetic and keep the room dark", next: "endBad", good: false, fb: "Darkness keeps the pupil dilated and the angle closed. Without treatment, the optic nerve is damaged permanently." } ] },
      n2: { text: "Orders: <strong>pilocarpine</strong> drops, <strong>timolol</strong> drops, <strong>acetazolamide IV</strong>, <strong>mannitol IV</strong>.<br>Her bedside drawer still holds <strong>tropicamide</strong> drops from yesterday's dilated cataract exam. Both bottles are small with similar caps.<br>Which drop do you instill first?", choices: [
        { t: "Pilocarpine, the miotic, after checking the label against the order", next: "n3", good: true, fb: "A miotic constricts the pupil and pulls the iris away from the angle, opening drainage." },
        { t: "Tropicamide, because it's already at the bedside and labeled for her eye", next: "n2x", good: false, fb: "Tropicamide is a mydriatic. It dilates the pupil, which closes the angle further and raises the IOP." },
        { t: "Wait for ophthalmology to examine her before giving any drops", next: "n3", good: null, fb: "Emergency drops shouldn't wait for the consult. Start the ordered IOP-lowering meds now." } ] },
      n2x: { text: "You uncap the tropicamide and scan it. The barcode scanner alerts: <strong>\"Not ordered — mydriatic.\"</strong> Mrs. L. adds, \"That's the one that made my eyes huge yesterday.\"<br>The dropper is above her eye.", choices: [
        { t: "Stop. Don't instill it. Give the ordered pilocarpine and report the near miss.", next: "n3", good: true, fb: "Near miss avoided. Mydriatics and anticholinergics dilate the pupil and are dangerous in glaucoma. Remove discontinued meds from the bedside." },
        { t: "Override the alert. It's just a drop, and the provider can sort it out.", next: "n2y", good: false, fb: "Overriding a safety alert to give a dilating drug in angle-closure makes the emergency worse." } ] },
      n2y: { text: "After the tropicamide:<br>• Pain is now <strong>10/10</strong><br>• The pupil is <strong>widely dilated</strong><br>• The cornea is cloudier<br>• IOP measures <strong>62 mmHg</strong> (normal 10–21)", choices: [
        { t: "Notify the provider immediately, report the error, and give the ordered pilocarpine and other IOP-lowering meds", next: "n3", good: true, fb: "Disclose the error and treat the result. The miotic and IOP-lowering meds are now even more urgent." },
        { t: "Give a second drop to finish the dose", next: "endBad", good: false, fb: "More mydriatic further blocks outflow. The optic nerve can be damaged permanently." } ] },
      n3: { text: "Pilocarpine and timolol are in. Before you hang <strong>acetazolamide IV</strong>, Mrs. L.'s chart lists \"no known allergies.\" She once mentioned a rash from an antibiotic.<br>What do you do before giving it?", choices: [
        { t: "Ask specifically about a sulfa allergy", next: "n4", good: true, fb: "She confirms hives from sulfamethoxazole. You hold the acetazolamide and notify the provider. Carbonic anhydrase inhibitors are sulfonamides, so a sulfa allergy is a contraindication." },
        { t: "Give it now. The chart says no known allergies.", next: "n3x", good: false, fb: "A vague allergy history needs clarifying, especially before a sulfonamide drug." },
        { t: "Check her potassium level first", next: "n4", good: null, fb: "CAIs can lower K⁺, so monitoring matters, but ruling out a sulfa allergy comes first." } ] },
      n3x: { text: "Ten minutes into the infusion:<br>• <strong>Hives</strong> on her chest<br>• Mild <strong>wheezing</strong><br>• She says, \"This is like the rash I had from that antibiotic.\"", choices: [
        { t: "Stop the infusion, stay with her, assess her airway, and call the provider or rapid response", next: "n4", good: true, fb: "Stop the drug that is causing the reaction and protect her airway." },
        { t: "Slow the infusion and finish the dose", next: "endBad", good: false, fb: "Continuing an allergen risks anaphylaxis." } ] },
      n4: { text: "The provider cancels acetazolamide and wants <strong>mannitol IV</strong> now. The vial from the cold supply room shows <strong>small crystals</strong>.", choices: [
        { t: "Warm it per pharmacy guidance until the crystals dissolve, then give it through a filter needle or in-line filter", next: "n5", good: true, fb: "Mannitol crystallizes at low temperatures. Always use a filter, and never give it with visible crystals." },
        { t: "Draw it up with a standard needle. The crystals are tiny.", next: "n4x", good: false, fb: "Crystals must never be infused. Mannitol always requires a filter needle." },
        { t: "Send it back and wait for pharmacy to send a new vial", next: "n5", good: null, fb: "Safe, but slower. Warming per protocol and using a filter is acceptable and faster in an emergency." } ] },
      n4x: { text: "The pharmacist calls the unit: crystals were reported in the vial lot you used.<br>• The infusion line looks <strong>cloudy</strong><br>• Mrs. L. reports <strong>burning at the IV site</strong>", choices: [
        { t: "Stop the infusion, notify the provider, and restart with a new dose through a filter", next: "n5", good: true, fb: "Stop crystal-containing fluid right away. Mannitol must go through a filter." },
        { t: "Flush the line to clear it and continue", next: "endBad", good: false, fb: "Flushing pushes crystals into her vein and still delays lowering the IOP." } ] },
      n5: { text: "Mannitol is infusing. Mrs. L. has a history of <strong>heart failure</strong>.<br>• New <strong>crackles</strong> in both bases<br>• SpO₂ <strong>97% → 91%</strong><br>• RR 26<br>• Urine output is increasing", choices: [
        { t: "Stop the infusion, raise the HOB, apply O₂, and notify the provider", next: "n6", good: true, fb: "Mannitol pulls fluid into the bloodstream before it's excreted, which can cause fluid overload and pulmonary edema, especially in HF." },
        { t: "Continue. Crackles are expected while she diureses.", next: "n5x", good: false, fb: "Crackles with a falling SpO₂ point to pulmonary edema, a known adverse effect. Report it." },
        { t: "Have her cough and deep breathe", next: "n6", good: null, fb: "Coughing doesn't clear edema fluid, and coughing raises IOP. Address the infusion first." } ] },
