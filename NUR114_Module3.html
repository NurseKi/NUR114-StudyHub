<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NUR 114 · Module 3 Study App</title>
<style>
:root{
  --bg:#FAF9F5; --card:#FFFFFF; --line:#E2DFD3; --ink:#0F5B52; --inkdim:#3E8F82;
  --text:#221F19; --dim:#6E6A5C;
  --ok:#1B7A57; --okbg:#EAF4EE; --no:#B23A48; --nobg:#FBEEEF;
  --crit:#b03a2e; --critbg:#fdecea; --caut:#9a6a00; --cautbg:#fef5e0; --tip:#1e8449; --tipbg:#e9f7ef; --say:#6c3483; --saybg:#f4ecf7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.55 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
h1,h2,h3.title{font-family:Georgia,"Iowan Old Style","Times New Roman",serif}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
.wrap{max-width:700px;margin:0 auto;padding:0 20px 90px}
header{background:linear-gradient(135deg,#1b2a4a,#33507e);box-shadow:0 4px 18px rgba(20,40,80,.18)}
header .bannerwrap{max-width:700px;margin:0 auto;padding:22px 20px 20px}
header .toprow{display:flex;gap:16px;align-items:center;justify-content:space-between}
h1{font-size:22px;font-weight:700;margin:0;color:#fff;letter-spacing:-.01em}
header .sub{color:#bcd6d3;font-size:13.5px;font-weight:600;margin-top:4px}
#back{color:#fff;font-weight:700;font-size:14px;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:20px}
#back[hidden]{display:none}
.hublink{display:inline-block;color:#bcd6d3;font-size:12.5px;font-weight:700;text-decoration:none;margin-bottom:6px}
.hublink:hover{color:#fff}
.unit-chip{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.unit-banner{color:#fff;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.3px;
  margin:24px 0 10px;display:inline-block;text-transform:uppercase}

.lede{margin:22px 0 24px;color:#3a4d4f;max-width:56ch;font-size:14.5px;background:#fff;border:1px solid var(--line);
  border-left:5px solid var(--ink);border-radius:0 10px 10px 0;padding:14px 16px}
.unit{margin-bottom:30px}
.unit h2{font-size:15px;font-weight:700;margin:0 0 2px;color:var(--ink)}
.unit p{margin:0 0 10px;font-size:13.5px;color:var(--dim)}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 0;
  border-bottom:1px solid var(--line);text-align:left}
.row .t{flex:1;font-weight:600;font-size:15px}
.row .qz{font-size:13.5px;color:var(--ink);font-weight:700;white-space:nowrap}
.row .s{font-size:13px;color:var(--ok);font-weight:700;white-space:nowrap}

h3.title{font-size:25px;font-weight:600;letter-spacing:-.01em;margin:14px 0 4px}
.kick{color:var(--dim);margin:0 0 24px;font-size:14.5px;font-style:italic}
h4{font-size:15.5px;margin:24px 0 8px;font-weight:700}
p,li{max-width:64ch}
p{margin:0 0 12px}
ul{margin:0 0 14px;padding-left:20px}
li{margin-bottom:6px}
strong{font-weight:700}
table{width:100%;border-collapse:collapse;margin:8px 0 18px;font-size:14.5px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:#F1F0E9;font-weight:700;font-size:13.5px}
.hook{border-radius:10px;padding:11px 14px;margin:16px 0 18px;font-size:14.5px;border:1px solid var(--tip);background:var(--tipbg)}
.hook::before{content:"TIP";display:block;font-weight:800;font-size:11px;letter-spacing:.6px;color:var(--tip);margin-bottom:3px}
.figure{margin:16px 0 20px;text-align:center}
.figure img{max-width:100%;border-radius:8px;border:1px solid var(--line)}
.figure figcaption{font-size:13px;color:var(--dim);margin-top:6px;font-style:italic}

.q{margin:24px 0 0;padding-top:20px;border-top:1px solid var(--line)}
.lbl{font-size:13px;color:var(--dim);margin-bottom:10px;font-weight:600}
.stem{font-weight:600;margin-bottom:13px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;margin-bottom:8px;background:var(--card);line-height:1.45;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.mine{background:var(--nobg);border-color:var(--no)}
.opt.picked{background:#EEF6F4;border-color:var(--ink)}
.opt.missed{background:#FFF6E2;border-color:#B8860B}
.opt.sata b{display:inline-block;width:18px}
.sata-note{font-size:13px;color:var(--ink);font-weight:700;margin-bottom:10px;text-transform:uppercase;letter-spacing:.03em}
.reviewlink{display:inline-block;font-size:12.5px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:#F1F0E9;margin:2px 0 14px;color:var(--ink)}
.case-box{border:1px solid var(--line);border-radius:10px;margin-bottom:20px;overflow:hidden;background:#FDFCF9}
.case-title{background:var(--ink);color:#fff;font-size:13.5px;font-weight:700;padding:9px 14px}
.case-tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);background:#F1F0E9}
.case-tab{padding:9px 12px;font-size:13px;font-weight:600;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap}
.case-tab.active{color:var(--ink);border-bottom:2px solid var(--ink);background:#fff}
.case-panel{padding:12px 14px;max-height:280px;overflow-y:auto;font-size:14.5px}
.case-panel h4{margin:10px 0 6px;font-size:14px}
.case-panel h4:first-child{margin-top:0}
.case-panel table{font-size:13.5px;margin:6px 0 10px}
.case-panel p,.case-panel li{max-width:none}
.fitb-input{width:180px;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:6px 0 4px;display:block}
.fitb-input:disabled{background:#F4F3EE;color:var(--text);border-color:var(--line)}
.gtpal-inputs{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.gtpal-field{display:flex;flex-direction:column;align-items:center;gap:4px}
.gtpal-letter{font-weight:800;font-size:13px;color:var(--ink)}
.gtpal-input{width:52px;text-align:center;font-size:17px;font-weight:700;padding:8px 4px;border:1px solid var(--line);border-radius:8px}
.gtpal-input:disabled{background:#F4F3EE;color:var(--text)}
.cloze-text{font-size:15.5px;line-height:2.4;margin:10px 0}
.blank-select{font-size:14px;font-weight:600;padding:5px 8px;border:1px solid var(--ink);border-radius:6px;background:var(--okbg);color:var(--ink);margin:0 3px}
.blank-select.right{border-color:var(--ok);background:var(--okbg)}
.blank-select.wrong{border-color:var(--no);background:var(--nobg)}
.hotspot-wrap{position:relative;display:inline-block;max-width:100%;cursor:crosshair;margin:10px 0;line-height:0}
.hotspot-img{max-width:100%;display:block;border-radius:8px;border:1px solid var(--line)}
.hotspot-marker{position:absolute;width:18px;height:18px;background:rgba(200,60,50,.85);border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.hotspot-region{position:absolute;border:2px dashed var(--ok);background:rgba(46,125,90,.18);pointer-events:none;border-radius:4px}
.dd-pool{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.dd-chip{padding:8px 12px;border:1px solid var(--line);border-radius:20px;font-size:13.5px;background:#fff}
.dd-chip.sel{border-color:var(--ink);background:var(--okbg)}
.dd-bins{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap}
.dd-bin{flex:1;min-width:140px;border:1px dashed var(--line);border-radius:8px;padding:10px;min-height:70px;background:#FDFCF9}
.dd-bin-label{font-size:12.5px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
.dd-bin .dd-chip{display:block;margin-bottom:6px;cursor:pointer}
.dd-chip.right{border-color:var(--ok);background:var(--okbg)}
.dd-chip.wrong{border-color:var(--no);background:var(--nobg)}
.order-list{list-style:none;margin:10px 0;padding:0}
.order-item{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:6px;font-size:14px;background:#fff}
.order-item .num{font-weight:700;color:var(--dim);margin-right:10px;min-width:18px}
.order-item .txt{flex:1}
.order-btns button{padding:4px 9px;margin-left:4px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13px}
.order-item.right{border-color:var(--ok);background:var(--okbg)}
.order-item.wrong{border-color:var(--no);background:var(--nobg)}
.matrix-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
.matrix-table th,.matrix-table td{border:1px solid var(--line);padding:8px;text-align:center}
.matrix-table td:first-child{text-align:left}
.matrix-table input[type=radio]{width:16px;height:16px}
.matrix-row-right td{background:var(--okbg)}
.matrix-row-wrong td{background:var(--nobg)}
.bowtie-wrap{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.bowtie-col{flex:1;min-width:150px}
.bowtie-col-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--dim);margin-bottom:8px;text-align:center}
.bowtie-opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px;background:#fff}
.bowtie-opt.sel{border-color:var(--ink);background:#EEF6F4}
.bowtie-opt.right{border-color:var(--ok);background:var(--okbg)}
.bowtie-opt.wrong{border-color:var(--no);background:var(--nobg)}
.verdict{font-weight:700;margin:14px 0 6px}
.verdict.y{color:var(--ok)} .verdict.n{color:var(--no)}
.acts{display:flex;gap:16px;flex-wrap:wrap;margin-top:22px}
.acts button{color:var(--ink);font-weight:700;font-size:14.5px}
.count{font-size:13.5px;color:var(--dim);margin:24px 0 4px;font-weight:600}
.big{font-size:42px;font-weight:700;letter-spacing:-.02em;margin:26px 0 0;font-family:Georgia,serif}
.rev{margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.rev h5{margin:18px 0 6px;font-size:15px;font-weight:700}
.topic-group{margin:0 0 16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.topic-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 18px;text-align:left;background:#F1F0E9}
.topic-group.open .topic-toggle{background:#FDFCF9;border-bottom:1px solid var(--line)}
.topic-toggle-label{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.topic-toggle-icon{flex:none;font-size:18px;font-weight:700;color:var(--ink);width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;line-height:1;margin-left:14px}
.topic-body{padding:18px 18px 4px}
.topic-body .unit{margin-bottom:26px}
.topic-body .unit:last-child{margin-bottom:6px}
@media(max-width:520px){body{font-size:15.5px}h3.title{font-size:21px}table{font-size:13.5px}th,td{padding:6px}}
</style>
</head>
<body>
<header><div class="bannerwrap"><div class="toprow"><div><a class="hublink" href="index.html">&larr; Study Hub</a><h1>NUR 114 · Module 3</h1><div class="sub">Functional Ability &middot; Elimination &amp; Sensory Perception</div></div><button id="back" hidden>Back</button></div></div></header>
<main class="wrap" id="app"></main>
<script>
const M3_OVERVIEW = { title:"Module Overview", sub:"Course objectives and the exemplar/medication blueprint for Functional Ability — read these first.", lessons:[
{ id:"m3-modobjectives", title:"Learning Objectives", kicker:"What this module is building toward",
  blocks:[
   {p:"After completing this module, you will be able to:"},
   {list:[
    "Utilize elements of clinical decision making for patients with selected concepts and alterations.",
    "Integrate health promotion, specialized modalities and pharmacological agents for patients with selected health concepts and alterations.",
    "Distinguish clinical manifestations and diagnostic findings for patients with selected health concepts and alterations.",
    "Prioritize nursing interventions for selected health concepts and alterations, while recognizing scope of practice for the practical and registered nurse.",
    "Analyze foundational concepts and emergent care.",
    "Apply relevant informatics related to selected health concepts/alterations."]}
  ]
},
{ id:"m3-modblueprint", title:"Exemplars & Medications Blueprint", kicker:"The course blueprint for Functional Ability",
  blocks:[
   {h:"Exemplars — Elimination"},
   {list:[
    "<strong>Renal failure</strong> (acute &amp; chronic) — including fluid &amp; electrolyte concepts, ABG compensation, and dialysis types",
    "<strong>Nephritis</strong> — pyelonephritis and glomerulonephritis",
    "<strong>Nephrotic syndrome</strong>",
    "<strong>Nephrosclerosis</strong>"]},
   {h:"Exemplars — Sensory Perception"},
   {list:[
    "Hearing",
    "Verbal",
    "Impaired vision",
    "Cataract",
    "Glaucoma",
    "Macular degeneration",
    "Detached retina",
    "Eye injuries"]},
   {h:"Medication classes to know"},
   {list:[
    "<strong>Diuretics</strong> — loop, potassium-sparing, osmotic",
    "<strong>Electrolyte replacements and/or treatments from NUR 113</strong> (examples, not all-inclusive) — phosphorus binders, calcium gluconate, vitamin D medications, polystyrene with sorbitol, patiromer, sodium zirconium cyclosilicate (Lokelma)",
    "<strong>Epoetin alfa</strong>",
    "<strong>Corticosteroids</strong>",
    "<strong>Acetylcysteine</strong>",
    "<strong>Bicarbonate</strong>",
    "<strong>Eye drops</strong> — beta blockers, prostaglandin analogs"]}
  ]
}
]};

const UNITS = [M3_OVERVIEW];

const UNIT_COLORS = ["#34495e"];
function unitIndexOf(id){
  for(let i=0;i<UNITS.length;i++){ if(UNITS[i].lessons.some(l=>l.id===id)) return i; }
  return 0;
}

const QUIZ = {};

const CASES = {};

const L = {}; const ORDER = [];
UNITS.forEach(u => u.lessons.forEach(x => { L[x.id] = x; ORDER.push(x.id); }));


const S = { view:"home", id:null, i:0, pick:null, multi:[], submitted:false, textAnswer:"", fitbCorrect:false, activeTab:0,
  clickPoint:null, hotspotCorrect:false, ddSel:null, ddPlace:{}, orderArr:null, matrixSel:{}, bowtie:{condition:null, actions:[], params:[]}, lastPoints:0,
  shuffledBank:null, clozeSel:{}, gtpalVals:["","","","",""],
  score:0, wrong:[], best:{}, openGroups:{}, openUnits:{} };
const app = document.getElementById("app");
const back = document.getElementById("back");
back.onclick = () => nav("home");
function nav(v, o){ Object.assign(S, {view:v, pick:null, multi:[], submitted:false, textAnswer:"", fitbCorrect:false, activeTab:0,
  clickPoint:null, hotspotCorrect:false, ddSel:null, ddPlace:{}, orderArr:null, matrixSel:{}, bowtie:{condition:null, actions:[], params:[]}, lastPoints:0, shuffledBank:null, clozeSel:{}, gtpalVals:["","","","",""]}, o||{}); draw(); scrollTo(0,0); }

function shuffleExam(bank){
  const caseBlock = bank.filter(q=>q.caseId);
  const others = bank.filter(q=>!q.caseId).slice();
  for(let i=others.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [others[i],others[j]] = [others[j],others[i]];
  }
  const insertAt = Math.floor(Math.random()*(others.length+1));
  return others.slice(0,insertAt).concat(caseBlock, others.slice(insertAt));
}
function curBank(){ return S.shuffledBank || QUIZ[S.id]; }


function renderCaseTabs(caseId){
  const c = CASES[caseId];
  let h = '<div class="case-box"><div class="case-title">'+c.title+'</div><div class="case-tabs">';
  c.tabs.forEach((t,i)=>{
    h += '<button class="case-tab'+(S.activeTab===i?" active":"")+'" data-tab="'+i+'">'+t.label+"</button>";
  });
  h += '</div><div class="case-panel">';
  c.tabs[S.activeTab].blocks.forEach(b => h += blk(b));
  h += "</div></div>";
  return h;
}

function blk(b){
  if(b.h) return "<h4>"+b.h+"</h4>";
  if(b.p) return "<p>"+b.p+"</p>";
  if(b.list) return "<ul>"+b.list.map(i=>"<li>"+i+"</li>").join("")+"</ul>";
  if(b.hook) return '<div class="hook">'+b.hook+"</div>";
  if(b.img) return '<figure class="figure"><img src="'+b.img+'" alt="'+(b.caption||"")+'" loading="lazy">'+(b.caption?'<figcaption>'+b.caption+"</figcaption>":"")+"</figure>";
  if(b.table) return "<table><thead><tr>"+b.table.head.map(x=>"<th>"+x+"</th>").join("")+
    "</tr></thead><tbody>"+b.table.rows.map(r=>"<tr>"+r.map(c=>"<td>"+c+"</td>").join("")+"</tr>").join("")+
    "</tbody></table>";
  return "";
}

function qHTML(q, label){
  const A = ["A","B","C","D","E","F"], p = S.pick, sub = S.submitted;
  let h = '<div class="q">'+(label?'<div class="lbl">'+label+"</div>":"")+'<p class="stem">'+q.stem+"</p>";
  q.options.forEach((o,i)=>{
    let c = "opt";
    if(sub){ if(i===q.answer) c+=" right"; else if(i===p) c+=" mine"; }
    else if(i===p) c+=" picked";
    h += '<button class="'+c+'" data-p="'+i+'"'+(sub?" disabled":"")+"><b>"+A[i]+"</b>  "+o+"</button>";
  });
  if(!sub){
    h += '<div class="acts"><button data-submit-mc="1"'+(p===null?" disabled":"")+'>Submit answer</button></div>';
  } else {
    const ok = p === q.answer;
    h += '<p class="verdict '+(ok?"y":"n")+'">'+(ok?"Correct":"Answer: "+A[q.answer])+"</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function sataHTML(q){
  const A = ["A","B","C","D","E","F"], sel = S.multi, sub = S.submitted;
  let h = '<div class="q"><div class="sata-note">Select all that apply</div><p class="stem">'+q.stem+"</p>";
  q.options.forEach((o,i)=>{
    let c = "opt sata", isSel = sel.includes(i), isCorrect = q.answers.includes(i);
    if(sub){
      if(isCorrect && isSel) c+=" right";
      else if(isCorrect && !isSel) c+=" missed";
      else if(!isCorrect && isSel) c+=" mine";
    } else if(isSel) c+=" picked";
    h += '<button class="'+c+'" data-t="'+i+'"'+(sub?" disabled":"")+"><b>"+(isSel?"\u2611":"\u2610")+"</b>  "+o+"</button>";
  });
  if(!sub){
    h += '<div class="acts"><button data-submit="1">Submit answer</button></div>';
  } else {
    const ok = sel.slice().sort((a,b)=>a-b).join(",") === q.answers.slice().sort((a,b)=>a-b).join(",");
    const ansText = q.answers.map(i=>A[i]).join(", ");
    h += '<p class="verdict '+(ok?"y":"n")+'">'+(ok?"Correct":"Answer: "+ansText)+"</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function fitbHTML(q){
  const sub = S.submitted;
  let h = '<div class="q"><div class="sata-note">Fill in the blank</div><p class="stem">'+q.stem+"</p>";
  if(!sub){
    h += '<input type="text" inputmode="decimal" class="fitb-input" id="fitbInput" placeholder="Your answer" value="'+S.textAnswer+'">';
    h += '<div class="acts"><button data-submit-fitb="1">Submit answer</button></div>';
  } else {
    const ok = S.fitbCorrect;
    h += '<input type="text" class="fitb-input" value="'+S.textAnswer+'" disabled>';
    h += '<p class="verdict '+(ok?"y":"n")+'">'+(ok?"Correct":"Correct answer: "+q.answer)+"</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function gtpalHTML(q){
  const sub = S.submitted;
  const letters = ["G","T","P","A","L"];
  let h = '<div class="q"><div class="sata-note">Fill in the blank — GTPAL</div><p class="stem">'+q.stem+"</p>";
  h += '<div class="gtpal-inputs">';
  letters.forEach((letter,i)=>{
    const val = sub ? (S.gtpalVals[i]||"") : "";
    h += '<label class="gtpal-field"><span class="gtpal-letter">'+letter+'</span><input type="text" inputmode="numeric" class="gtpal-input" id="gtpalInput'+i+'" placeholder="—" value="'+val+'"'+(sub?" disabled":"")+"></label>";
  });
  h += "</div>";
  if(!sub){
    h += '<div class="acts"><button data-submit-gtpal="1">Submit answer</button></div>';
  } else {
    const ok = letters.every((_,i)=>parseInt(S.gtpalVals[i]) === q.answers[i]);
    const correctStr = letters.map((l,i)=>l+q.answers[i]).join(" ");
    h += '<p class="verdict '+(ok?"y":"n")+'">'+(ok?"Correct":"Correct answer: "+correctStr)+"</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function clozeHTML(q){
  const sub = S.submitted;
  let text = q.template;
  q.blanks.forEach((b,i)=>{
    const selVal = S.clozeSel[i];
    let opts = '<option value="">choose…</option>'+b.options.map((o,oi)=>'<option value="'+oi+'"'+(selVal===oi?" selected":"")+'>'+o+"</option>").join("");
    let cls = "blank-select";
    if(sub) cls += selVal===b.correct ? " right" : " wrong";
    text = text.replace("{"+i+"}", '<select class="'+cls+'" data-cloze-blank="'+i+'"'+(sub?" disabled":"")+'>'+opts+"</select>");
  });
  let h = '<div class="q"><div class="sata-note">Drop-Down (Cloze) — choose the correct word for each blank</div><p class="cloze-text">'+text+"</p>";
  const allAnswered = q.blanks.every((_,i)=>S.clozeSel[i]!==undefined);
  if(!sub){
    h += '<div class="acts"><button data-submit-cloze="1"'+(!allAnswered?" disabled":"")+'>Submit answer</button></div>';
  } else {
    const correctCount = q.blanks.filter((b,i)=>S.clozeSel[i]===b.correct).length;
    const ok = correctCount === q.blanks.length;
    h += '<p class="verdict '+(ok?"y":"n")+'">'+correctCount+" of "+q.blanks.length+" blanks correct — "+S.lastPoints.toFixed(2)+" pt (partial credit)</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function hotspotHTML(q){
  const sub = S.submitted;
  let h = '<div class="q"><div class="sata-note">Hot Spot — click the image</div><p class="stem">'+q.stem+"</p>";
  h += '<div class="hotspot-wrap" id="hotspotWrap">';
  h += '<img src="'+q.image+'" class="hotspot-img" draggable="false">';
  if(S.clickPoint) h += '<div class="hotspot-marker" style="left:'+S.clickPoint.x+'%;top:'+S.clickPoint.y+'%"></div>';
  if(sub){
    const r = q.region;
    h += '<div class="hotspot-region" style="left:'+r.x+'%;top:'+r.y+'%;width:'+r.w+'%;height:'+r.h+'%"></div>';
  }
  h += "</div>";
  if(!sub){
    h += '<div class="acts"><button data-submit-hotspot="1"'+(!S.clickPoint?" disabled":"")+'>Submit answer</button></div>';
  } else {
    const ok = S.hotspotCorrect;
    h += '<p class="verdict '+(ok?"y":"n")+'">'+(ok?"Correct — 1/1 pt":"Not quite — 0/1 pt. The correct area is outlined above")+"</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function dragdropHTML(q){
  const sub = S.submitted;
  let h = '<div class="q"><div class="sata-note">Drag and Drop — tap an item, then tap its category</div><p class="stem">'+q.stem+"</p>";
  const unplaced = q.items.map((_,idx)=>idx).filter(idx => S.ddPlace[idx] === undefined);
  h += '<div class="dd-pool">';
  unplaced.forEach(idx=>{
    h += '<button class="dd-chip'+(S.ddSel===idx?" sel":"")+'" data-dd-pick="'+idx+'"'+(sub?" disabled":"")+'>'+q.items[idx]+"</button>";
  });
  if(!unplaced.length) h += '<span style="color:var(--dim);font-size:13px">All items placed</span>';
  h += "</div>";
  h += '<div class="dd-bins">';
  q.bins.forEach((bin,binIdx)=>{
    h += '<div class="dd-bin" data-dd-bin="'+binIdx+'"><div class="dd-bin-label">'+bin+"</div>";
    q.items.forEach((item,idx)=>{
      if(S.ddPlace[idx] !== binIdx) return;
      let c = "dd-chip";
      if(sub){ c += q.correctBin[idx] === binIdx ? " right" : " wrong"; }
      h += '<button class="'+c+'" data-dd-unplace="'+idx+'"'+(sub?" disabled":"")+'>'+item+"</button>";
    });
    h += "</div>";
  });
  h += "</div>";
  const allPlaced = q.items.every((_,idx)=>S.ddPlace[idx] !== undefined);
  if(!sub){
    h += '<div class="acts"><button data-submit-dd="1"'+(!allPlaced?" disabled":"")+'>Submit answer</button></div>';
  } else {
    const correctCount = q.items.filter((_,idx)=>S.ddPlace[idx]===q.correctBin[idx]).length;
    const ok = correctCount === q.items.length;
    h += '<p class="verdict '+(ok?"y":"n")+'">'+correctCount+" of "+q.items.length+" placed correctly — "+S.lastPoints.toFixed(2)+" pt (partial credit)</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function orderingHTML(q){
  const sub = S.submitted;
  if(!S.orderArr){
    S.orderArr = q.items.map((_,i)=>i);
    for(let i=S.orderArr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [S.orderArr[i],S.orderArr[j]]=[S.orderArr[j],S.orderArr[i]]; }
  }
  let h = '<div class="q"><div class="sata-note">Ordering — arrange in the correct sequence</div><p class="stem">'+q.stem+"</p>";
  h += '<ul class="order-list">';
  S.orderArr.forEach((itemIdx,pos)=>{
    let c = "order-item";
    if(sub) c += itemIdx === pos ? " right" : " wrong";
    h += '<li class="'+c+'"><span class="num">'+(pos+1)+".</span><span class=\"txt\">"+q.items[itemIdx]+'</span>';
    if(!sub){
      h += '<span class="order-btns">'+
        (pos>0?'<button data-order-up="'+pos+'">↑</button>':"")+
        (pos<S.orderArr.length-1?'<button data-order-down="'+pos+'">↓</button>':"")+
        "</span>";
    }
    h += "</li>";
  });
  h += "</ul>";
  if(!sub){
    h += '<div class="acts"><button data-submit-order="1">Submit answer</button></div>';
  } else {
    const correctCount = S.orderArr.filter((itemIdx,pos)=>itemIdx===pos).length;
    const ok = correctCount === S.orderArr.length;
    h += '<p class="verdict '+(ok?"y":"n")+'">'+correctCount+" of "+S.orderArr.length+" in the correct position — "+S.lastPoints.toFixed(2)+" pt (partial credit)</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function matrixHTML(q){
  const sub = S.submitted;
  let h = '<div class="q"><div class="sata-note">Matrix/Grid — one answer per row</div><p class="stem">'+q.stem+"</p>";
  h += '<table class="matrix-table"><thead><tr><th></th>'+q.cols.map(c=>"<th>"+c+"</th>").join("")+"</tr></thead><tbody>";
  q.rows.forEach((row,rIdx)=>{
    let rc = "";
    if(sub) rc = S.matrixSel[rIdx]===q.correct[rIdx] ? " matrix-row-right" : " matrix-row-wrong";
    h += '<tr class="'+rc+'"><td>'+row+"</td>";
    q.cols.forEach((_,cIdx)=>{
      const checked = S.matrixSel[rIdx]===cIdx;
      h += '<td><input type="radio" name="mrow'+rIdx+'" data-matrix-row="'+rIdx+'" data-matrix-col="'+cIdx+'"'+(checked?" checked":"")+(sub?" disabled":"")+"></td>";
    });
    h += "</tr>";
  });
  h += "</tbody></table>";
  const allAnswered = q.rows.every((_,rIdx)=>S.matrixSel[rIdx]!==undefined);
  if(!sub){
    h += '<div class="acts"><button data-submit-matrix="1"'+(!allAnswered?" disabled":"")+'>Submit answer</button></div>';
  } else {
    const correctCount = q.rows.filter((_,rIdx)=>S.matrixSel[rIdx]===q.correct[rIdx]).length;
    const ok = correctCount === q.rows.length;
    h += '<p class="verdict '+(ok?"y":"n")+'">'+correctCount+" of "+q.rows.length+" rows correct — "+S.lastPoints.toFixed(2)+" pt (partial credit)</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function bowtieHTML(q){
  const sub = S.submitted;
  let h = '<div class="q"><div class="sata-note">Bowtie — pick actions, the condition, and parameters</div><p class="stem">'+q.stem+"</p>";
  h += '<div class="bowtie-wrap">';
  h += '<div class="bowtie-col"><div class="bowtie-col-label">Actions to Take (choose '+q.correctActions.length+')</div>';
  q.actionOptions.forEach((opt,idx)=>{
    let c = "bowtie-opt";
    const sel = S.bowtie.actions.includes(idx);
    if(sub){ c += q.correctActions.includes(idx) ? " right" : (sel ? " wrong" : ""); }
    else if(sel) c += " sel";
    h += '<button class="'+c+'" data-bt-action="'+idx+'"'+(sub?" disabled":"")+'>'+opt+"</button>";
  });
  h += '</div><div class="bowtie-col"><div class="bowtie-col-label">Condition</div>';
  q.conditionOptions.forEach((opt,idx)=>{
    let c = "bowtie-opt";
    const sel = S.bowtie.condition===idx;
    if(sub){ c += idx===q.correctCondition ? " right" : (sel ? " wrong" : ""); }
    else if(sel) c += " sel";
    h += '<button class="'+c+'" data-bt-condition="'+idx+'"'+(sub?" disabled":"")+'>'+opt+"</button>";
  });
  h += '</div><div class="bowtie-col"><div class="bowtie-col-label">Parameters to Monitor (choose '+q.correctParams.length+')</div>';
  q.paramOptions.forEach((opt,idx)=>{
    let c = "bowtie-opt";
    const sel = S.bowtie.params.includes(idx);
    if(sub){ c += q.correctParams.includes(idx) ? " right" : (sel ? " wrong" : ""); }
    else if(sel) c += " sel";
    h += '<button class="'+c+'" data-bt-param="'+idx+'"'+(sub?" disabled":"")+'>'+opt+"</button>";
  });
  h += "</div></div>";
  const ready = S.bowtie.condition!==null && S.bowtie.actions.length && S.bowtie.params.length;
  if(!sub){
    h += '<div class="acts"><button data-submit-bowtie="1"'+(!ready?" disabled":"")+'>Submit answer</button></div>';
  } else {
    const totalSlots = 1 + q.correctActions.length + q.correctParams.length;
    const ok = S.lastPoints === 1;
    h += '<p class="verdict '+(ok?"y":"n")+'">'+Math.round(S.lastPoints*totalSlots)+" of "+totalSlots+" correct — "+S.lastPoints.toFixed(2)+" pt (partial credit)</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function anyQHTML(q, label){
  if(q.type === "sata") return sataHTML(q);
  if(q.type === "fitb") return fitbHTML(q);
  if(q.type === "gtpal") return gtpalHTML(q);
  if(q.type === "cloze") return clozeHTML(q);
  if(q.type === "hotspot") return hotspotHTML(q);
  if(q.type === "dragdrop") return dragdropHTML(q);
  if(q.type === "ordering") return orderingHTML(q);
  if(q.type === "matrix") return matrixHTML(q);
  if(q.type === "bowtie") return bowtieHTML(q);
  return qHTML(q, label);
}

const TOPIC_GROUPS = [
  {key:"elim", label:"Elimination"},
  {key:"sens", label:"Sensory Perception"}
];

        (hasQuiz && b!==undefined ? '<span class="s">'+fmtScore(b)+"/"+QUIZ[x.id].length+"</span>" : "")+

        "</button>";

function home(){
  let h = '<p class="lede"><strong>How to use this:</strong> Each topic features a lesson ending with one review question. Many topics also include a standalone 5-question quiz (including select-all-that-apply items) — tap a title to read, or Quiz where available to jump straight to the questions. The colored dot next to each unit carries through to that unit\'s lessons and quizzes.</p>';

  TOPIC_GROUPS.forEach(g=>{
    const groupUnits = [];
    UNITS.forEach((u,ui)=>{ if(u.group === g.key) groupUnits.push({u,ui}); });
    if(!groupUnits.length) return;
    const isOpen = !!S.openGroups[g.key];
    h += '<section class="topic-group'+(isOpen?" open":"")+'"><button class="topic-toggle" data-grouptoggle="'+g.key+'"><span class="topic-toggle-label">'+g.label+'</span><span class="topic-toggle-icon">'+(isOpen?"\u2212":"+")+'</span></button>';
    if(isOpen){
      h += '<div class="topic-body">';
      groupUnits.forEach(({u,ui}) => h += unitSectionHTML(u, ui));
      h += '</div>';
    }
    h += '</section>';
  });

  UNITS.forEach((u,ui)=>{
    if(u.group) return;
    h += unitSectionCollapsibleHTML(u, ui);
  });

  return h;
}

function lesson(){
  const x = L[S.id];
  const ui = unitIndexOf(S.id);
  let h = '<div class="unit-banner" style="background:'+UNIT_COLORS[ui]+'">'+UNITS[ui].title+"</div>";
  h += '<h3 class="title">'+x.title+"</h3>"+(x.kicker?'<p class="kick">'+x.kicker+"</p>":"");
  x.blocks.forEach(b => h += blk(b));
  const n = ORDER.indexOf(x.id);
  if(x.check){
    h += qHTML(x.check, "Check your understanding");
    h += '<div class="acts">';
    if(S.submitted) h += '<button data-q="'+x.id+'">Quiz me on this</button>';
    if(n > 0) h += '<button data-l="'+ORDER[n-1]+'">Previous: '+L[ORDER[n-1]].title+"</button>";
    if(n < ORDER.length-1) h += '<button data-l="'+ORDER[n+1]+'">Next: '+L[ORDER[n+1]].title+"</button>";
    h += '<button data-home="1">All topics</button></div>';
  } else {
    h += '<div class="acts">';
    if(n > 0) h += '<button data-l="'+ORDER[n-1]+'">Previous: '+L[ORDER[n-1]].title+"</button>";
    if(n < ORDER.length-1) h += '<button data-l="'+ORDER[n+1]+'">Next: '+L[ORDER[n+1]].title+"</button>";
    h += '<button data-home="1">All topics</button></div>';
  }
  return h;
}

function fmtScore(n){ return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0+$/,"").replace(/\.$/,""); }
function quiz(){
  const bank = curBank();
  const q = bank[S.i];
  const ui = unitIndexOf(S.id);
  let h = '<div class="unit-banner" style="background:'+UNIT_COLORS[ui]+'">'+UNITS[ui].title+"</div>";
  h += '<h3 class="title">'+L[S.id].title+'</h3><p class="count">Question '+(S.i+1)+" of "+bank.length+" · score "+fmtScore(S.score)+"</p>";
  if(q.caseId) h += renderCaseTabs(q.caseId);
  h += anyQHTML(q, "");
  const answered = S.submitted;
  if(answered) h += '<div class="acts"><button data-next="1">'+(S.i<bank.length-1?"Next question":"See results")+"</button></div>";
  return h;
}

function result(){
  const bank = curBank();
  const A = ["A","B","C","D","E","F"];
  let h = '<p class="count">'+L[S.id].title+'</p><p class="big">'+fmtScore(S.score)+"/"+bank.length+"</p>";
  if(S.wrong.length){
    h += '<div class="rev"><p>Review these:</p>';
    S.wrong.forEach(i=>{ const q = bank[i];
      let correctText;
      if(q.type === "sata") correctText = q.answers.map(idx=>A[idx]+". "+q.options[idx]).join("; ");
      else if(q.type === "fitb") correctText = String(q.answer);
      else if(q.type === "cloze") correctText = q.blanks.map(b=>b.options[b.correct]).join(" · ");
      else if(q.type === "gtpal") correctText = ["G","T","P","A","L"].map((l,idx)=>l+q.answers[idx]).join(" ");
      else if(q.type === "hotspot") correctText = "See the outlined region in the lesson/question image.";
      else if(q.type === "dragdrop") correctText = q.items.map((it,idx)=>it+" → "+q.bins[q.correctBin[idx]]).join("; ");
      else if(q.type === "ordering") correctText = q.items.join(" → ");
      else if(q.type === "matrix") correctText = q.rows.map((r,idx)=>r+" → "+q.cols[q.correct[idx]]).join("; ");
      else if(q.type === "bowtie") correctText = "Actions: "+q.correctActions.map(idx=>q.actionOptions[idx]).join(", ")+" · Condition: "+q.conditionOptions[q.correctCondition]+" · Parameters: "+q.correctParams.map(idx=>q.paramOptions[idx]).join(", ");
      else correctText = q.options[q.answer];
      h += "<h5>"+q.stem+"</h5><p><strong>"+correctText+"</strong></p><p>"+q.why+"</p>";
      if(q.ref && L[q.ref]) h += '<a class="reviewlink" href="#'+q.ref+'" target="_blank" rel="noopener">Review in: '+L[q.ref].title+" ↗</a>";
    });
    h += "</div>";
  } else h += "<p>All correct.</p>";
  h += '<div class="acts"><button data-q="'+S.id+'">Retake</button><button data-l="'+S.id+'">Reread the lesson</button><button data-home="1">All topics</button></div>';
  return h;
}

function draw(){
  back.hidden = S.view === "home";
  app.innerHTML = S.view==="home"?home():S.view==="lesson"?lesson():S.view==="quiz"?quiz():result();
}

app.addEventListener("change", e=>{
  const sel = e.target.closest("select[data-cloze-blank]");
  if(sel && !S.submitted){
    S.clozeSel[+sel.dataset.clozeBlank] = sel.value===""?undefined:+sel.value;
    return draw();
  }
});

app.addEventListener("click", e=>{
  const q0 = e.target.closest("[data-q]");
  if(q0){
    e.stopPropagation();
    const shuffled = q0.dataset.q && q0.dataset.q.startsWith("exam") ? shuffleExam(QUIZ[q0.dataset.q]) : null;
    nav("quiz",{id:q0.dataset.q, i:0, score:0, wrong:[], shuffledBank:shuffled});
    return;
  }
  const hw = e.target.closest(".hotspot-wrap");
  if(hw && !S.submitted && S.view==="quiz" && curBank() && curBank()[S.i] && curBank()[S.i].type==="hotspot"){
    const rect = hw.getBoundingClientRect();
    const x = Math.max(0,Math.min(100, ((e.clientX-rect.left)/rect.width)*100));
    const y = Math.max(0,Math.min(100, ((e.clientY-rect.top)/rect.height)*100));
    S.clickPoint = {x,y};
    return draw();
  }
  const mr = e.target.closest("input[type=radio][data-matrix-row]");
  if(mr && !S.submitted){
    S.matrixSel[+mr.dataset.matrixRow] = +mr.dataset.matrixCol;
    return draw();
  }
  const t = e.target.closest("button");
  if(t && t.dataset.grouptoggle){ S.openGroups[t.dataset.grouptoggle] = !S.openGroups[t.dataset.grouptoggle]; return draw(); }
  if(t && t.dataset.unittoggle){ S.openUnits[t.dataset.unittoggle] = !S.openUnits[t.dataset.unittoggle]; return draw(); }
  if(!t){
    const ddBinEl = e.target.closest(".dd-bin");
    if(ddBinEl && !S.submitted && S.ddSel !== null){
      S.ddPlace[S.ddSel] = +ddBinEl.dataset.ddBin;
      S.ddSel = null;
      return draw();
    }
    return;
  }
  if(t.dataset.l) return nav("lesson",{id:t.dataset.l});
  if(t.dataset.home) return nav("home");
  if(t.dataset.tab !== undefined){
    S.activeTab = +t.dataset.tab;
    return draw();
  }
  if(t.dataset.t !== undefined){
    if(S.submitted) return;
    const idx = +t.dataset.t, pos = S.multi.indexOf(idx);
    if(pos === -1) S.multi.push(idx); else S.multi.splice(pos,1);
    return draw();
  }
  if(t.dataset.submit !== undefined){
    S.submitted = true;
    const q = curBank()[S.i];
    const ok = S.multi.slice().sort((a,b)=>a-b).join(",") === q.answers.slice().sort((a,b)=>a-b).join(",");
    if(S.view === "quiz"){ if(ok) S.score++; else S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.submitFitb !== undefined){
    const inputEl = document.getElementById("fitbInput");
    const val = inputEl ? inputEl.value.trim() : "";
    S.textAnswer = val;
    const q = curBank()[S.i];
    const userNum = parseFloat(val);
    const target = parseFloat(q.answer);
    const ok = !isNaN(userNum) && Math.abs(userNum - target) < 0.05;
    S.fitbCorrect = ok;
    S.submitted = true;
    if(S.view === "quiz"){ if(ok) S.score++; else S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.submitGtpal !== undefined){
    const q = curBank()[S.i];
    const vals = [0,1,2,3,4].map(i=>{
      const el = document.getElementById("gtpalInput"+i);
      return el ? el.value.trim() : "";
    });
    S.gtpalVals = vals;
    const ok = vals.every((v,i)=> parseInt(v) === q.answers[i]);
    S.submitted = true;
    if(S.view === "quiz"){ if(ok) S.score++; else S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.submitCloze !== undefined){
    const q = curBank()[S.i];
    const correctCount = q.blanks.filter((b,i)=>S.clozeSel[i]===b.correct).length;
    const pts = Math.round((correctCount/q.blanks.length)*100)/100;
    S.submitted = true;
    S.lastPoints = pts;
    if(S.view === "quiz"){ S.score += pts; if(pts < 1) S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.submitHotspot !== undefined){
    const q = curBank()[S.i];
    const pt = S.clickPoint, r = q.region;
    const ok = !!pt && pt.x>=r.x && pt.x<=r.x+r.w && pt.y>=r.y && pt.y<=r.y+r.h;
    const pts = ok ? 1 : 0;
    S.hotspotCorrect = ok;
    S.submitted = true;
    S.lastPoints = pts;
    if(S.view === "quiz"){ S.score += pts; if(pts < 1) S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.ddPick !== undefined){
    S.ddSel = S.ddSel === +t.dataset.ddPick ? null : +t.dataset.ddPick;
    return draw();
  }
  if(t.dataset.ddUnplace !== undefined){
    if(S.submitted) return;
    delete S.ddPlace[+t.dataset.ddUnplace];
    return draw();
  }
  if(t.dataset.submitDd !== undefined){
    const q = curBank()[S.i];
    const correctCount = q.items.filter((_,idx)=>S.ddPlace[idx]===q.correctBin[idx]).length;
    const pts = Math.round((correctCount/q.items.length)*100)/100;
    S.submitted = true;
    S.lastPoints = pts;
    if(S.view === "quiz"){ S.score += pts; if(pts < 1) S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.orderUp !== undefined){
    const pos = +t.dataset.orderUp;
    if(pos>0){ [S.orderArr[pos-1],S.orderArr[pos]] = [S.orderArr[pos],S.orderArr[pos-1]]; }
    return draw();
  }
  if(t.dataset.orderDown !== undefined){
    const pos = +t.dataset.orderDown;
    if(pos<S.orderArr.length-1){ [S.orderArr[pos+1],S.orderArr[pos]] = [S.orderArr[pos],S.orderArr[pos+1]]; }
    return draw();
  }
  if(t.dataset.submitOrder !== undefined){
    const correctCount = S.orderArr.filter((itemIdx,pos)=>itemIdx===pos).length;
    const pts = Math.round((correctCount/S.orderArr.length)*100)/100;
    S.submitted = true;
    S.lastPoints = pts;
    if(S.view === "quiz"){ S.score += pts; if(pts < 1) S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.submitMatrix !== undefined){
    const q = curBank()[S.i];
    const correctCount = q.rows.filter((_,rIdx)=>S.matrixSel[rIdx]===q.correct[rIdx]).length;
    const pts = Math.round((correctCount/q.rows.length)*100)/100;
    S.submitted = true;
    S.lastPoints = pts;
    if(S.view === "quiz"){ S.score += pts; if(pts < 1) S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.btAction !== undefined){
    if(S.submitted) return;
    const q = curBank()[S.i];
    const idx = +t.dataset.btAction, pos = S.bowtie.actions.indexOf(idx);
    if(pos===-1){ if(S.bowtie.actions.length < q.correctActions.length) S.bowtie.actions.push(idx); }
    else S.bowtie.actions.splice(pos,1);
    return draw();
  }
  if(t.dataset.btCondition !== undefined){
    if(S.submitted) return;
    S.bowtie.condition = +t.dataset.btCondition;
    return draw();
  }
  if(t.dataset.btParam !== undefined){
    if(S.submitted) return;
    const q = curBank()[S.i];
    const idx = +t.dataset.btParam, pos = S.bowtie.params.indexOf(idx);
    if(pos===-1){ if(S.bowtie.params.length < q.correctParams.length) S.bowtie.params.push(idx); }
    else S.bowtie.params.splice(pos,1);
    return draw();
  }
  if(t.dataset.submitBowtie !== undefined){
    const q = curBank()[S.i];
    const totalSlots = 1 + q.correctActions.length + q.correctParams.length;
    const conditionPts = S.bowtie.condition===q.correctCondition ? 1 : 0;
    const actionsPts = S.bowtie.actions.filter(a=>q.correctActions.includes(a)).length;
    const paramsPts = S.bowtie.params.filter(a=>q.correctParams.includes(a)).length;
    const pts = Math.round(((conditionPts+actionsPts+paramsPts)/totalSlots)*100)/100;
    S.submitted = true;
    S.lastPoints = pts;
    if(S.view === "quiz"){ S.score += pts; if(pts < 1) S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.p !== undefined){
    if(S.submitted) return;
    S.pick = +t.dataset.p;
    return draw();
  }
  if(t.dataset.submitMc !== undefined){
    if(S.pick === null) return;
    S.submitted = true;
    if(S.view === "quiz"){
      if(S.pick === curBank()[S.i].answer) S.score++; else S.wrong.push(S.i);
    }
    return draw();
  }
  if(t.dataset.next){
    const bank = curBank();
    if(S.i < bank.length-1){
      S.i++; S.pick = null; S.multi = []; S.submitted = false; S.textAnswer = ""; S.fitbCorrect = false; S.activeTab = 0;
      S.clickPoint = null; S.hotspotCorrect = false; S.ddSel = null; S.ddPlace = {}; S.orderArr = null; S.matrixSel = {};
      S.bowtie = {condition:null, actions:[], params:[]}; S.lastPoints = 0; S.clozeSel = {}; S.gtpalVals = ["","","","",""];
      return draw();
    }
    const b = S.best[S.id];
    if(b === undefined || S.score > b) S.best[S.id] = S.score;
    return nav("result");
  }
});

const initialHash = location.hash.slice(1);
if(initialHash && L[initialHash]){
  nav("lesson", {id: initialHash});
} else {
  draw();
}
