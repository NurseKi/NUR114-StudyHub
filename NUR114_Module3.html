{ id:"elim-ckd", title:"Chronic Kidney Disease (CKD) & ESRD", kicker:"Progressive, irreversible loss of function — the five stages and uremia body system by body system",
  blocks:[
   {h:"AKI vs. CKD at a glance"},
   {table:{head:["Feature","Acute kidney injury (AKI)","Chronic kidney disease (CKD)"],rows:[
    ["<strong>Onset</strong>","Sudden/rapid (hours to days)","Gradual/progressive (months to years)"],
    ["<strong>Reversibility</strong>","<strong>Potentially reversible</strong> with prompt treatment","<strong>Irreversible</strong> — function can't be recovered, only maintained"],
    ["<strong>Primary causes</strong>","Prerenal: hypovolemia, shock, heart failure. Intrarenal: nephrotoxic drugs, infection, ischemia. Postrenal: obstruction (stones, BPH)","<strong>Diabetes mellitus</strong> (leading cause) and <strong>hypertension</strong>"],
    ["<strong>Diagnostic criteria</strong>","Sudden increase in creatinine/BUN and/or rapid decrease in urine output (oliguria)","<strong>GFR below 60 mL/min for 3 months or more</strong>, or evidence of kidney damage (proteinuria)"],
    ["<strong>Key symptoms</strong>","Oliguria (below 400 mL/day), fluid overload (edema), metabolic acidosis, hyperkalemia","Uremia (fatigue, anorexia), anemia (low EPO), pruritus (\"uremic frost\"), bone disease"],
    ["<strong>Treatment focus</strong>","<strong>Rescue:</strong> treat the underlying cause (fluids for prerenal, remove obstruction for postrenal), manage acute electrolyte shifts","<strong>Maintenance:</strong> slow progression (BP and glucose control), manage complications (phosphate binders, epoetin alfa), prepare for dialysis/transplant"],
    ["<strong>Mortality risk</strong>","<strong>Infection</strong> is a leading cause of death","<strong>Cardiovascular disease</strong> is the leading cause of death"]
   ]}},
   {p:"Chronic kidney disease (CKD) is kidney damage or a decreased GFR lasting <strong>3 months or longer</strong>. Unlike AKI, it is progressive and <strong>irreversible</strong>. The two leading causes are <strong>diabetes</strong> and <strong>hypertension</strong>; others include glomerulonephritis, pyelonephritis, polycystic kidney disease, nephrosclerosis, and nephrotoxic drugs. When it reaches stage 5 and the patient needs dialysis or a transplant to survive, it's called <strong>end-stage renal disease (ESRD)</strong>."},
   {h:"Stages of CKD (by GFR)"},
   {table:{head:["Stage","GFR (mL/min/1.73 m²)","Description"],rows:[
    ["1","90 or above","Kidney damage with normal or increased GFR"],
    ["2","60–89","Mildly decreased GFR"],
    ["3a / 3b","45–59 / 30–44","Moderately decreased GFR"],
    ["4","15–29","Severely decreased GFR — preparation for dialysis or transplant begins"],
    ["5","Below 15 (or on dialysis)","Kidney failure — <strong>ESRD</strong>"]
   ]}},
   {h:"Uremia — how CKD affects every body system"},
   {table:{head:["System","Findings","Why"],rows:[
    ["<strong>Cardiovascular</strong>","Hypertension, heart failure, edema, pericarditis (friction rub), dysrhythmias","Sodium and water retention, renin–angiotensin activation, uremic toxins, hyperkalemia"],
    ["<strong>Respiratory</strong>","Crackles, pulmonary edema, <strong>Kussmaul respirations</strong>, uremic pleuritis","Fluid overload; compensation for metabolic acidosis"],
    ["<strong>Hematologic</strong>","<strong>Anemia</strong>, fatigue, bleeding tendency","Kidneys stop producing <strong>erythropoietin</strong>; uremia impairs platelet function"],
    ["<strong>GI</strong>","Anorexia, nausea, vomiting, <strong>uremic fetor</strong> (ammonia/urine breath odor), metallic taste, stomatitis","Urea breaks down to ammonia in saliva; uremic irritation of the GI tract"],
    ["<strong>Neurologic</strong>","Fatigue, difficulty concentrating, confusion, peripheral neuropathy, restless legs, muscle twitching, seizures","Accumulating uremic toxins and electrolyte shifts"],
    ["<strong>Integumentary</strong>","Pruritus (itching), dry skin, yellow-gray skin tone, bruising, <strong>uremic frost</strong> (late — urea crystals on the skin)","Retained urochromes, high phosphorus, uremic toxins"],
    ["<strong>Musculoskeletal</strong>","Bone pain, fractures, <strong>renal osteodystrophy</strong> (CKD-mineral and bone disorder)","High phosphorus + low calcium + low active vitamin D → secondary hyperparathyroidism pulls calcium out of bone"],
    ["<strong>Fluid/electrolyte</strong>","Edema, weight gain, hyperkalemia, hyperphosphatemia, hypocalcemia, hypermagnesemia, metabolic acidosis","The kidney can no longer excrete water, potassium, phosphorus, magnesium, or acid"],
    ["<strong>Endocrine/metabolic</strong>","Hypoglycemia risk in diabetic patients; changing insulin needs","The failing kidney clears insulin and some oral hypoglycemics more slowly"],
    ["<strong>Psychosocial</strong>","Depression, anxiety, body image changes, role changes","Chronic illness, dialysis schedule, dietary restrictions, financial strain"]
   ]}},
   {hook:"A diabetic patient whose kidneys are failing may suddenly start having low blood sugars on a dose that used to work. The kidney normally clears insulin and drugs like glipizide; as function falls, those drugs linger longer and hit harder."},
   {h:"Priority assessments/cues"},
   {list:[
    "Anorexia, nausea, vomiting, lethargy, fatigue",
    "<strong>Metallic taste</strong>, <strong>uremic fetor</strong> (urine-like breath/body odor)",
    "Confusion, headache, drowsiness, and <strong>encephalopathy</strong> (accumulating wastes)",
    "Peripheral neuropathy, <strong>burning sensation in the feet</strong>, <strong>asterixis</strong> (flapping tremor)",
    "Fractures from deficiencies of calcium, vitamin D, and parathyroid hormone imbalance",
    "<strong>Itching</strong> from uremic frost (urea crystallizing on the skin)",
    "Use of prescription and over-the-counter medications — many are toxic to the kidneys",
    "Fluid status — daily weight, I&amp;O, edema, lung sounds, BP, JVD, pulmonary edema, heart failure",
    "Signs of hyperkalemia (muscle weakness, paresthesias, ECG changes) and hyperglycemia",
    "Signs of hypocalcemia — tingling, muscle cramps, positive Chvostek's and Trousseau's signs",
    "Kussmaul respirations — metabolic acidosis from bicarbonate depletion",
    "Bleeding (impaired clotting) and infections",
    "Concurrent heart failure, coronary artery disease, pneumonia",
    "Dialysis access, if present (thrill and bruit)",
    "Coping, <strong>long-term support system</strong>, and ability to get to dialysis — CKD is life-altering"]},
   {h:"Priority laboratory/diagnostic cues"},
   {list:[
    "GFR (declining — degree of kidney damage), BUN and creatinine (rising)",
    "Urine dipstick — <strong>proteinuria</strong>; urinalysis — albumin, WBCs, protein, casts, glucose; specific gravity fixed near 1.010",
    "Potassium ↑, phosphorus ↑, calcium ↓, magnesium ↑, sodium variable",
    "Hemoglobin and hematocrit ↓ (anemia of CKD); serum ferritin (iron stores)",
    "ABGs — metabolic acidosis",
    "ECG — hyperkalemia changes",
    "CT (renal masses, vascular abnormalities), kidney ultrasound (obstructions), renal scan (tubular function, blood flow), renal biopsy (cause of CKD)"]},
   {h:"Priority interventions/collaborative actions"},
   {list:[
    "Manage fluid: restriction as ordered, <strong>daily weights using the same scale at the same time of day</strong>, I&amp;O",
    "Control blood pressure and blood glucose — the two biggest drivers of progression; clients with diabetes need glycemic control and periodic urine albumin checks",
    "Renal diet — sodium <strong>less than 4 g/day</strong>, phosphate <strong>less than 1 g/day</strong>, restrict potassium and fluid; protein restricted before dialysis, then <em>increased</em> (high-quality protein) once on dialysis because dialysis removes protein. Dietitian consult; enteral feeding if the client can't tolerate oral intake",
    "Medications: phosphate binders with meals, vitamin D (calcitriol), epoetin alfa with iron, sodium bicarbonate, potassium binders, statins for dyslipidemia, antihypertensives, diuretics (while there's still urine output)",
    "<strong>Stool softeners</strong> for iron-associated constipation",
    "Allow adequate rest; manage itching; manage <strong>burning and tearing of the eyes</strong> from calcium deposits; monitor for <strong>restless legs</strong> (common during dialysis)",
    "Monitor clients taking nephrotoxic drugs; organize medications with a pill box; avoid aspirin (excreted by the kidneys; prolongs bleeding)",
    "Continuous cardiac monitoring (telemetry) when hyperkalemia is a risk",
    "Give oral iron at a different time than phosphate binders; blood transfusions only when necessary — they suppress red cell production and create antibodies that make transplant matching harder",
    "For pruritus: avoid soaps (dry the skin), meticulous skin care, antihistamines as prescribed, keep nails trimmed",
    "Note that early CKD can cause <strong>polyuria and nocturia</strong> (the kidney can't concentrate urine) before oliguria develops later; infection may present <strong>without fever or a high WBC</strong>",
    "<strong>Avoid</strong> magnesium-containing antacids and laxatives (Milk of Magnesia), phosphate-containing enemas (Fleet), NSAIDs, and nephrotoxic drugs",
    "<strong>Avoid aluminum-based antacids</strong> — risk of aluminum toxicity, which can lead to bone disease and even dementia",
    "Lactated Ringer's is often avoided in renal failure because it contains potassium",
    "Skin care for pruritus — cool baths, lotion, short nails",
    "Protect the nondominant arm's veins early (no BP, venipuncture, or IVs) in patients who will need an AV fistula",
    "Prepare for renal replacement therapy — dialysis or transplant — and support the patient and family through the decision"]},
   {h:"Priority actual & potential complications"},
   {list:["<strong>Cardiovascular complications</strong> — the most common cause of death in CKD; dyslipidemia","Hyperkalemia and dysrhythmias","Pericarditis, pericardial effusion, tamponade","Pulmonary edema and heart failure","Anemia","Bone disease (renal osteodystrophy) and fractures","ESRD requiring dialysis or transplant","Catheter-site infection and peritonitis with PD; fistula infection or malfunction","Depression"]},
   {h:"Priority hypotheses for nursing care"},
   {list:[
    "Cardiovascular disease is the most common cause of death in CKD — conduct vigilant cardiovascular assessments",
    "No blood pressures or venous access devices in the arm with a fistula",
    "Temporary access in the femoral or jugular veins is used until a fistula or graft matures",
    "Clients on dialysis may be anuric"]},
   {h:"Priority medications"},
   {list:[
    "<strong>Sodium bicarbonate</strong> — alkalinizing agent to correct acidosis",
    "<strong>Sodium polystyrene sulfonate</strong> (oral, rectal) and <strong>patiromer</strong> (oral, titrated to potassium level) — remove potassium",
    "<strong>Calcium acetate</strong> — phosphate binder taken with each meal",
    "<strong>Calcium gluconate</strong> (IV) — reduces myocardial irritability from hyperkalemia",
    "<strong>Calcitriol</strong> — vitamin D analog to treat secondary hyperparathyroidism in ESRD; measure serum calcium at least twice weekly when starting",
    "<strong>Erythropoietin (epoetin alfa)</strong> — treats anemia; monitor iron stores and give iron if serum ferritin is below 100 ng/mL; monitor hemoglobin to prevent cardiovascular complications",
    "<strong>Atorvastatin</strong> (statin) and <strong>gemfibrozil</strong> (fibrate, adjunct to diet) — dyslipidemia"]},
   {h:"Priority teaching/discharge needs"},
   {list:[
    "Diet low in protein (before dialysis), phosphate, sodium, and potassium",
    "<strong>Peritoneal dialysis:</strong> teach the process with return demonstration; examine the catheter site for infection; teach the signs of peritonitis and to <strong>report cloudy outflow immediately</strong>; teach timing (nightly or intermittent)",
    "<strong>Hemodialysis:</strong> never allow an IV or BP in the graft/fistula arm; avoid submerging the access; signs of access infection and when to call the provider; information on <strong>transportation to dialysis</strong> and other resources",
    "Avoid drugs that decrease kidney function, including NSAIDs and other nephrotoxic medications. ACE inhibitors can lower GFR — they're used for kidney protection in stable CKD with close monitoring of creatinine and potassium, but held with acute injury or volume depletion"]}
  ],
  check:{stem:"A client with CKD asks why he needs epoetin alfa injections. Which explanation is accurate?",
   options:["It replaces the vitamin D the kidneys can no longer activate","It replaces the erythropoietin the damaged kidneys no longer produce, treating anemia","It binds phosphorus in the GI tract","It shifts potassium back into the cells"],
   answer:1,
   why:"The kidneys produce erythropoietin, the hormone that signals the bone marrow to make red blood cells. In CKD, production falls and anemia develops; epoetin alfa replaces it."}
},
{ id:"elim-kidney-mgmt", title:"Managing Kidney Injury: Complications by Body System", kicker:"How AKI and CKD affect each system, and what the nurse monitors and does",
  blocks:[
   {p:"AKI and CKD share most of the same complications. Management starts with treating the primary cause, then supporting each body system the failing kidney affects."},
   {h:"Fluid balance"},
   {list:[
    "<strong>AKI:</strong> prompt fluid replacement matched to the loss (blood for hemorrhage, crystalloids for dehydration) when the cause is prerenal; in a sustained oliguric state, fluid is limited to the previous day's output plus about 500–800 mL",
    "<strong>CKD:</strong> fluid and sodium restriction; fluid limited to about 500 mL plus the previous day's urine output. Diuretics work until GFR falls very low (about 10–15), after which dialysis is needed",
    "Loop diuretics are used short-term for volume overload; high-dose IV furosemide is infused no faster than <strong>4 mg/min</strong> (ototoxicity)",
    "Spread the fluid allowance over 24 hours, with periodic sips and ice chips to ease thirst; frequent mouth care"]},
   {h:"Cardiovascular"},
   {list:[
    "<strong>Hypertension</strong> — from sodium/water retention and renin–angiotensin activation; managed with fluid/sodium restriction, diuretics, antihypertensives, dialysis. Target BP in CKD is generally below 130/80",
    "<strong>Hyperkalemia ECG progression:</strong> about 6–7 mEq/L — tall, peaked T waves, prolonged PR, ST depression; about 8–9 — P waves disappear; about 10–11 — QRS widens toward a sine-wave pattern, then ventricular fibrillation or standstill. Muscle weakness typically starts in the legs and ascends",
    "Clients with long-standing high potassium tolerate it better than those whose potassium rises suddenly — always read the potassium <strong>with</strong> the ECG",
    "<strong>Uremic pericarditis</strong> (mainly stage 5 CKD): sharp chest pain that is <strong>relieved by sitting forward</strong> and worse with deep breathing, fever, and a pericardial <strong>friction rub</strong>. Treated with aggressive (often daily) dialysis with low or no heparin",
    "<strong>Cardiac tamponade</strong> — distended neck veins, muffled heart sounds, narrowed pulse pressure, pulsus paradoxus, decreased LOC — is an emergency requiring pericardiocentesis",
    "Cardiovascular disease is the leading cause of death in CKD — statins are recommended for CKD clients 50 and older"]},
   {h:"Pulmonary"},
   {list:[
    "<strong>Pulmonary edema</strong> — dyspnea, crackles, <strong>pink frothy sputum</strong>, tachypnea, tachycardia, low SpO₂. Managed with fluid and sodium restriction, diuretics if the kidneys can respond, HOB elevation, and often emergent dialysis or intubation",
    "Also pleural effusion, uremic pleuritis/pneumonitis, and pulmonary infections — teach coughing and deep breathing; incentive spirometer"]},
   {h:"Gastrointestinal"},
   {list:[
    "<strong>GI bleeding</strong> is a potentially life-threatening complication — check vomit and stool for blood; monitor H&amp;H and signs of volume loss; H2 blockers or PPIs",
    "Anorexia, nausea, vomiting, stomatitis, metallic taste, uremic fetor — good oral hygiene, antiemetics, adequate dialysis",
    "<strong>Constipation</strong> (from fluid restriction, inactivity, iron, and phosphate binders) — bulk and stool softeners; <strong>avoid magnesium-containing cathartics</strong> (magnesium citrate) and <strong>phosphate (Fleet) enemas</strong>"]},
   {h:"Neuromuscular"},
   {list:[
    "Sleep disturbances, difficulty concentrating, short-term memory loss, lethargy, muscle irritability",
    "<strong>Restless leg syndrome</strong> and <strong>burning feet syndrome</strong> (paresthesias and numbness of the soles and lower legs) — teach protection from heat and injury",
    "Rising BUN can cause cerebral edema → seizures, projectile vomiting, coma — seizure precautions",
    "Teach in <strong>short, frequent sessions</strong> with reinforcement, and include family — uremia impairs concentration and memory"]},
   {h:"Hematologic"},
   {list:[
    "<strong>Bleeding tendency</strong> — uremia impairs platelet function; monitor platelets and coagulation studies; avoid NSAIDs and aspirin when possible; soft toothbrush. Heparin during dialysis can cause heparin-induced thrombocytopenia (HIT), which requires stopping heparin",
    "<strong>Immune impairment</strong> — infection is a major cause of death. Uremic clients have a <strong>lower baseline temperature</strong>, so <strong>any rise above baseline is significant</strong>. Hand hygiene; remove invasive catheters as soon as possible",
    "<strong>Anemia</strong> — mainly from erythropoietin deficiency (plus shortened RBC survival — about 70 days instead of 120 — and blood loss). Treated with ESAs (epoetin alfa, darbepoetin), iron, vitamins, and transfusion for profound anemia, since ESAs take weeks to work",
    "<strong>Oral iron is poorly absorbed</strong> when taken with phosphate binders, antacids, H2 blockers, or PPIs — separate the timing. IV iron works better but can cause allergic reactions"]},
   {h:"Drug elimination"},
   {list:["Many drugs are excreted by the kidneys — doses and intervals are adjusted to GFR (which may change daily in AKI)","Monitor therapeutic drug levels","Know which drugs are removed by dialysis so they're timed after treatment"]},
   {h:"Skeletal — renal bone disease"},
   {list:[
    "High phosphorus + low calcium + low active vitamin D → rising PTH (secondary hyperparathyroidism) → calcium and phosphate pulled from bone",
    "When the calcium × phosphorus product exceeds about <strong>55</strong>, calcium-phosphate crystals deposit in soft tissue (<strong>metastatic calcifications</strong>) — blood vessels, heart valves, lungs, joints, skin, and eyes (\"red eye\")",
    "Complications: bone pain, fractures, spontaneous tendon rupture, proximal muscle weakness, pruritus",
    "<strong>Phosphate binders:</strong> calcium acetate (PhosLo), calcium carbonate (Tums), <strong>sevelamer</strong> (Renagel/Renvela) and lanthanum (calcium-free — preferred when calcium is high), iron-based binders (ferric citrate). Aluminum binders are rarely used because of aluminum toxicity (bone and nervous system)",
    "<strong>Active vitamin D</strong> (calcitriol, paricalcitol) suppresses PTH — watch for hypercalcemia and hyperphosphatemia",
    "<strong>Calcimimetics</strong> (cinacalcet, etelcalcetide) lower PTH — risk of <strong>hypocalcemia</strong>; cinacalcet can cause nausea/vomiting",
    "Parathyroidectomy for refractory cases"]},
   {h:"Integumentary"},
   {list:["Dry skin (xerosis), <strong>pruritus</strong>, pallor, bruising, yellow or darkened pigmentation, hair loss, nail changes (\"half-and-half\" nails)","<strong>Uremic frost</strong> — white powdery urate crystals on the skin, seen only with severe, untreated uremia","Keep skin clean and moisturized (superfatted or lanolin-based soap, emollients), trim fingernails, antihistamines for itching, turn every 2 hours"]},
   {h:"Nutrition"},
   {list:["Restrict fluid, sodium, potassium, and phosphorus; supplement iron, vitamins, and calcium as ordered","High-calorie diet with most calories from carbohydrates and fats, to prevent catabolism","Adequate protein, at least half of high biological value (e.g., eggs, meat); protein restriction must never cause malnutrition — in AKI, protein restriction isn't recommended","Monitor weight, albumin, prealbumin, total protein, H&amp;H; dietitian consult; small, frequent feedings"]},
   {h:"Psychosocial"},
   {list:["Fear, anxiety, powerlessness, body image changes, disrupted family roles","Thorough teaching, active involvement of client and family, adequate rest, explore feelings, social services and clergy as appropriate"]}
  ],
  check:{stem:"A client with ESRD has a temperature of 99.4°F; his usual temperature runs 97.2°F. How should the nurse interpret this?",
   options:["Normal — below 100.4°F is not a fever","Significant — uremic clients have a lower baseline temperature, so a rise above baseline may signal infection","Expected after dialysis from warming of the blood, requiring no follow-up","A sign of hyperkalemia"],
   answer:1,
   why:"Uremia lowers the baseline temperature and blunts the fever response, so any rise above the client's baseline is significant as a sign of infection, a major cause of death in kidney injury."}
},
{ id:"elim-lytes", title:"Fluid & Electrolyte Concepts in Renal Failure", kicker:"Potassium, phosphorus, calcium, sodium, magnesium, and fluid volume — and how each is treated",
  blocks:[
   {p:"Most of the life-threatening problems in renal failure are fluid and electrolyte problems. The kidney normally excretes potassium, phosphorus, magnesium, acid, and excess water — so when it fails, all of these build up, while calcium falls."},
   {h:"The renal failure electrolyte pattern at a glance"},
   {table:{head:["Electrolyte","Typical range","Direction in renal failure","Why"],rows:[
    ["<strong>Potassium (K⁺)</strong>","3.5–5.0 mEq/L","<strong>↑ High</strong> (above 5.0)","Kidneys can't excrete it; acidosis shifts K⁺ out of cells"],
    ["<strong>Phosphorus</strong>","About 2.5–4.5 mg/dL","<strong>↑ High</strong> (above 4.5)","Kidneys can't excrete it; dialysis removes only a small amount"],
    ["<strong>Calcium (Ca²⁺)</strong>","About 8.5–10.5 mg/dL","<strong>↓ Low</strong> (below 8.5)","Inverse relationship with phosphorus, plus the kidney can't activate vitamin D, so less calcium is absorbed from the gut"],
    ["<strong>Magnesium (Mg²⁺)</strong>","About 1.5–2.5 mEq/L","<strong>↑ High</strong> (above 2.5)","Kidneys can't excrete it — worsened by Mg-containing antacids and laxatives"],
    ["<strong>Sodium (Na⁺)</strong>","135–145 mEq/L","Variable — often <strong>↓ low (dilutional)</strong> with fluid overload","Water retained in excess of sodium dilutes it; dehydration concentrates it"],
    ["<strong>Bicarbonate (HCO₃)</strong>","22–26 mEq/L","<strong>↓ Low</strong> (metabolic acidosis)","Kidneys can't excrete acid or regenerate bicarbonate"]
   ]}},
   {h:"Hyperkalemia — the most immediately dangerous"},
   {list:[
    "<strong>Cues:</strong> muscle weakness, paresthesias, fatigue, abdominal cramping/diarrhea, bradycardia, and ECG changes — <strong>tall peaked T waves</strong>, flattened or absent P waves, prolonged PR, <strong>widened QRS</strong>, progressing to ventricular fibrillation or asystole",
    "<strong>Priority action:</strong> place the patient on a cardiac monitor and notify the provider"]},
   {table:{head:["Goal","Treatment","How it works","Nursing points"],rows:[
    ["<strong>1. Protect the heart</strong>","<strong>Calcium gluconate IV</strong>","Stabilizes the cardiac cell membrane","Works within minutes but does <strong>not</strong> lower K⁺ — it buys time. Cardiac monitoring during administration"],
    ["<strong>2. Shift K⁺ into cells</strong>","<strong>Regular insulin IV + dextrose</strong>","Insulin drives K⁺ into cells; dextrose prevents hypoglycemia","Monitor blood glucose closely for hours afterward"],
    ["","<strong>Sodium bicarbonate IV</strong>","Corrects acidosis, which pushes K⁺ back into cells","Most useful when metabolic acidosis is present"],
    ["","<strong>Albuterol (nebulized)</strong>","Beta-2 stimulation shifts K⁺ into cells","Monitor for tachycardia"],
    ["<strong>3. Remove K⁺ from the body</strong>","<strong>Sodium polystyrene sulfonate with sorbitol, patiromer, sodium zirconium cyclosilicate (Lokelma)</strong>","Bind K⁺ in the GI tract so it's eliminated in stool","Slower onset — not a stand-alone emergency treatment"],
    ["","<strong>Loop diuretics</strong>","Increase renal K⁺ excretion","Only useful if the kidneys still produce urine"],
    ["","<strong>Hemodialysis</strong>","Removes K⁺ directly from the blood","The definitive treatment in ESRD or when other measures fail"]
   ]}},
   {hook:"Shifting is temporary — insulin, bicarbonate, and albuterol only move potassium into cells, and it drifts back out within hours. Only binders, diuretics, and dialysis actually remove it from the body."},
   {hook:"Before giving sodium polystyrene sulfonate (Kayexalate), <strong>assess bowel sounds</strong>. If the gut isn't moving, the potassium can't leave the body, and the drug can cause intestinal necrosis."},
   {h:"Hyperphosphatemia and hypocalcemia — the pair"},
   {list:[
    "Phosphorus and calcium have an <strong>inverse relationship</strong>: as phosphorus rises, calcium falls",
    "<strong>High phosphorus cues:</strong> itching (pruritus), calcium-phosphate deposits in soft tissue, blood vessels, heart, and lungs; weak, brittle bones over time",
    "<strong>Low calcium cues:</strong> numbness and tingling around the mouth and fingers, muscle cramps, tetany, <strong>positive Chvostek's sign</strong> (facial twitch when the facial nerve is tapped) and <strong>Trousseau's sign</strong> (carpal spasm with a BP cuff inflated), hyperactive reflexes, seizures, prolonged QT",
    "<strong>Safety:</strong> positive Trousseau's or Chvostek's sign means a high risk of <strong>seizures and laryngeal spasm</strong> — implement seizure precautions",
    "<strong>Treatment:</strong> low-phosphorus diet, <strong>phosphate binders with the first bite of every meal</strong>, active vitamin D (calcitriol) to improve calcium absorption, calcium supplements, IV <strong>calcium gluconate</strong> for symptomatic hypocalcemia, dialysis",
    "Because of the inverse relationship, <strong>treating the high phosphorus first</strong> helps the calcium rise",
    "<strong>The calcium–phosphorus see-saw:</strong> when phosphorus rises, calcium drops, and the body steals calcium from the bones to balance the blood — <strong>secondary hyperparathyroidism</strong> and \"renal bone disease\" (renal osteodystrophy)",
    "In renal failure the kidneys fail to excrete most electrolytes <em>and</em> fail to activate vitamin D — producing the trio of high phosphorus, low calcium, and bone disease"]},
   {h:"Magnesium imbalances"},
   {p:"Magnesium is mainly an <strong>intracellular</strong> electrolyte (about 60% is in bone) that controls neuromuscular and cardiac irritability and helps the body make parathyroid hormone — so it's tied to calcium and potassium. The kidneys are the main route of excretion, which is why <strong>kidney failure is the most common cause of hypermagnesemia</strong>. Course range: about <strong>1.5–2.5 mEq/L</strong> (some references use 1.3–2.1 mEq/L). Because about 30% of magnesium is bound to albumin, check the <strong>albumin</strong> with the magnesium — a low albumin makes the total magnesium read low."},
   {table:{head:["","Hypermagnesemia (high)","Hypomagnesemia (low)"],rows:[
    ["<strong>Effect on nerves & muscles</strong>","<strong>Depresses</strong> — blocks neuromuscular transmission","<strong>Irritates</strong> — nerves and muscles become hyperexcitable"],
    ["<strong>Renal causes</strong>","<strong>Kidney failure</strong> (most common); magnesium-containing <strong>antacids and laxatives</strong> (Milk of Magnesia, magnesium citrate); magnesium-rich dialysate; magnesium sulfate infusions; untreated DKA; older age; adrenal insufficiency","Hemodialysis; <strong>loop and thiazide diuretics</strong>; aminoglycosides (gentamicin, tobramycin), cisplatin, cyclosporine, amphotericin B; glomerulonephritis and pyelonephritis (impaired reabsorption); diarrhea, NG suction, alcohol use disorder, PPIs"],
    ["<strong>Cues</strong>","Flushing and warmth, hypotension, nausea/vomiting, <strong>diminished or absent DTRs</strong>, weakness progressing to flaccid paralysis, drowsiness/lethargy, <strong>slow, shallow respirations</strong>, <strong>bradycardia</strong>, heart block, cardiac arrest","<strong>Hyperactive DTRs</strong>, tremors, twitching, <strong>tetany</strong>, <strong>+ Chvostek and Trousseau</strong> (with low calcium), seizures, confusion, dysphagia, laryngeal stridor, tachycardia, <strong>dysrhythmias</strong> (torsades de pointes, V-tach, A-fib), <strong>digoxin toxicity</strong>"],
    ["<strong>ECG</strong>","Prolonged PR, widened QRS, tall T waves","Prolonged PR and QT, widened QRS, ST depression, flattened T waves, prominent U waves"],
    ["<strong>Treatment</strong>","Stop all magnesium products; IV/oral fluids and a <strong>loop diuretic</strong> if the kidneys work; <strong>IV calcium gluconate</strong> (the antagonist) in an emergency; <strong>dialysis with magnesium-free dialysate</strong> in renal failure; ventilation or pacing if needed","Magnesium-rich diet and oral supplements for mild cases; <strong>IV magnesium sulfate</strong> for severe cases (assess renal function first)"],
    ["<strong>Nursing</strong>","Frequent VS (hypotension, bradycardia, respiratory depression); DTRs and muscle strength; continuous cardiac monitoring; monitor BUN/creatinine and urine output; <strong>flag the chart \"No magnesium products\"</strong>; calcium gluconate and resuscitation equipment ready","Seizure precautions; check swallowing before oral intake; cardiac monitoring when below about 1 mEq/L; monitor K⁺ and Ca²⁺ (they fall together); watch for digoxin toxicity"]
   ]}},
   {h:"Hypermagnesemia — symptoms climb with the level"},
   {table:{head:["Serum magnesium (about)","Signs & symptoms"],rows:[
    ["3 mEq/L","Feeling of warmth, flushing, mild hypotension, nausea and vomiting"],
    ["4 mEq/L","Facial paresthesia, <strong>diminished DTRs</strong>, muscle weakness, drowsiness"],
    ["5 mEq/L","ECG changes, bradycardia, worsening hypotension"],
    ["7 mEq/L","<strong>Loss of DTRs</strong> — an absent patellar reflex is reported immediately"],
    ["8 mEq/L","Respiratory compromise, heart block"],
    ["12 mEq/L","Flaccid paralysis, coma"],
    ["15 mEq/L","Respiratory arrest"],
    ["20 mEq/L","Cardiac arrest"]
   ]}},
   {hook:"<b>RENAL</b> = hypermagnesemia, because poor renal excretion is the main cause: <b>R</b>eflexes decreased (weakness, paralysis), <b>E</b>CG changes (bradycardia) and hypotension, <b>N</b>ausea and vomiting, <b>A</b>ppearance flushed, <b>L</b>ethargy (drowsiness, coma). For low magnesium, think <b>STARVED</b>: <b>S</b>eizures, <b>T</b>etany, <b>A</b>norexia and arrhythmias, <b>R</b>apid heart rate, <b>V</b>omiting, <b>E</b>motional lability, <b>D</b>TRs increased."},
   {h:"IV magnesium sulfate safety"},
   {list:[
    "Infusion pump only — no faster than <strong>150 mg/minute</strong>; a rapid bolus can cause cardiac arrest",
    "Check VS and DTRs; watch for hypotension and respiratory distress (signs of excess) about every 15 minutes",
    "Monitor urine output before, during, and after — notify the provider if output is <strong>less than 100 mL in 4 hours</strong> (magnesium is excreted by the kidneys)",
    "Continuous cardiac monitoring; keep <strong>calcium gluconate</strong> at the bedside",
    "Always <strong>write out \"magnesium sulfate\"</strong> — MgSO₄ is easily confused with MSO₄ (morphine sulfate)"]},
   {h:"Sodium imbalances"},
   {p:"Sodium is the main <strong>extracellular</strong> cation (normal <strong>135–145 mEq/L</strong>) — it controls where water goes. \"Think sodium, think water\": sodium problems are really water-balance problems, and their signs are mainly <strong>neurologic</strong> because water moves into or out of brain cells. Renal failure causes both: the kidney can't excrete water (dilutional hyponatremia) or sodium (sodium and water retention, hypertension)."},
   {table:{head:["","Hyponatremia (below 135 mEq/L)","Hypernatremia (above 145 mEq/L)"],rows:[
    ["<strong>What's happening</strong>","Too much water for the sodium — cells <strong>swell</strong> (cerebral edema)","Too little water for the sodium — cells <strong>shrink</strong>"],
    ["<strong>Types / causes</strong>","<strong>Hypovolemic</strong> (sodium lost more than water): vomiting, diarrhea, diuretics, burns, adrenal insufficiency. <strong>Hypervolemic</strong> (water gained more than sodium): heart failure, liver failure, <strong>nephrotic syndrome</strong>, excess hypotonic IV fluids. <strong>Isovolemic</strong> (dilutional): <strong>kidney failure</strong>, <strong>SIADH</strong>, hypothyroidism","<strong>Water loss:</strong> fever, burns, vomiting/diarrhea, diabetes insipidus, osmotic diuresis, older adults with an impaired thirst response, clients who can't drink. <strong>Sodium gain:</strong> sodium bicarbonate, <strong>sodium polystyrene sulfonate (Kayexalate)</strong>, hypertonic saline, tube feedings, corticosteroids"],
    ["<strong>Cues</strong>","Headache, irritability, confusion, lethargy, muscle twitching, weakness, abdominal cramps, nausea/vomiting (often starting around 115–120 mEq/L); stupor, seizures, coma near 110 mEq/L. Hypovolemic: poor turgor, orthostatic hypotension, weak rapid pulse. Hypervolemic: edema, hypertension, weight gain, bounding pulse","Intense <strong>thirst</strong>, restlessness/agitation, low-grade fever, flushed skin, twitching, hyperreflexia, confusion → seizures, coma. Water loss: dry mucous membranes, oliguria, orthostatic hypotension. Sodium gain: hypertension, bounding pulse, dyspnea"],
    ["<strong>Treatment</strong>","<strong>Fluid restriction</strong> (primary treatment for dilutional; about 1 L/day in SIADH); isotonic saline if hypovolemic; <strong>3% saline</strong> only for severe, symptomatic cases (below 120) in the ICU — slowly, no more than about 1–2 mEq/L per hour (no more than 25 mEq/L in 48 hours) to avoid brain injury","Treat the cause; replace water <strong>gradually over about 48 hours</strong> (D5W, then ½ NS) — correcting too fast shifts water into brain cells (<strong>cerebral edema</strong>); restrict sodium"],
    ["<strong>Nursing</strong>","Neuro checks; daily weights; strict I&amp;O; post fluid restriction signs; seizure precautions; infusion pump for any saline","Neuro checks; daily weights; strict I&amp;O; mark cups and give a target intake per shift; mouth care; seizure precautions; infusion pump"]
   ]}},
   {hook:"<b>SALT</b> = hypernatremia: <b>S</b>kin flushed, <b>A</b>gitation, <b>L</b>ow-grade fever, <b>T</b>hirst. Whichever direction the sodium is off, <b>correct it slowly</b>."},
   {h:"Sodium and fluid volume"},
   {table:{head:["","Fluid volume excess (overload)","Fluid volume deficit (dehydration)"],rows:[
    ["<strong>When seen</strong>","Oliguric AKI, CKD/ESRD, missed dialysis, nephrotic syndrome, glomerulonephritis","Prerenal AKI, diuretic phase of AKI, poor intake, vomiting/diarrhea, over-diuresis"],
    ["<strong>Cues</strong>","Weight gain, edema, crackles, dyspnea, JVD, <strong>bounding pulses</strong>, hypertension, low SpO₂","Weight loss, tachycardia, hypotension, <strong>weak/thready pulses</strong>, dry mucous membranes, poor turgor, concentrated urine, confusion (older adults)"],
    ["<strong>Sodium</strong>","Often <strong>low (dilutional hyponatremia)</strong>","Often <strong>high (hypernatremia)</strong> when water is lost in excess of sodium"],
    ["<strong>Hematocrit</strong>","Low (diluted)","High (<strong>hemoconcentration</strong>)"],
    ["<strong>Priority actions</strong>","High Fowler's, oxygen, fluid and sodium restriction, loop diuretics (if still making urine), dialysis","Isotonic IV fluids; correct hypernatremia <strong>slowly</strong> to avoid cerebral edema; monitor for overload in older/cardiac patients"]
   ]}},
   {hook:"Hyponatremia and hypernatremia both show up as neurologic changes — confusion, lethargy, seizures — because sodium shifts pull water into or out of brain cells. That's also why correcting either one too fast is dangerous."},
   {h:"Metabolic acidosis in renal failure"},
   {list:[
    "Kidneys can't excrete hydrogen ions or regenerate bicarbonate → low HCO<sub>3</sub>, low pH",
    "<strong>Cues:</strong> Kussmaul respirations (compensation), headache, confusion, lethargy, nausea, hyperkalemia",
    "<strong>Treatment:</strong> oral <strong>sodium bicarbonate</strong> in CKD; IV bicarbonate for severe acidosis (pH below 7.35); dialysis"]},
   {h:"Class poster review — fluid volume overload"},
   {table:{head:["Signs & symptoms","Interventions"],rows:[
    ["<strong>Neuro:</strong> altered mental status, seizures, fatigue<br><strong>Respiratory:</strong> pulmonary edema, shortness of breath, crackles/wheezing, <strong>pink frothy sputum</strong>, cough, ↑ RR, ↓ O₂ sat<br><strong>Cardiovascular:</strong> hypertension, tachycardia, <strong>bounding pulse</strong>, JVD, cool/clammy skin<br><strong>Fluid:</strong> pitting edema, <strong>anasarca</strong>, third spacing, weeping skin, <strong>rapid weight gain</strong><br><strong>Labs:</strong> hyponatremia, <strong>low H&amp;H</strong> (dilution); severe electrolyte dilution can lead to seizures and death","Raise the HOB; administer/titrate O₂ as needed<br>Strict I&amp;O; daily weights<br>Bed rest until stable, then activity as tolerated<br><strong>Fluid restriction</strong>; low-sodium diet<br>Neuro checks; fall-risk precautions<br><strong>Furosemide (Lasix)</strong> — monitor K⁺<br>Encourage voiding; incentive spirometer<br>Albumin (to pull third-spaced fluid back into the vessels, given with a diuretic)<br>Dialysis<br><em>Note:</em> <strong>mannitol</strong> appeared on the class board, but it is <strong>not</strong> a treatment for fluid volume overload — it first pulls fluid <em>into</em> the bloodstream and can worsen pulmonary edema and heart failure"]
   ]}},
   {h:"Class poster review — hyperkalemia"},
   {table:{head:["Signs & symptoms","Interventions"],rows:[
    ["<strong>Cardiac:</strong> dysrhythmias, <strong>peaked T waves</strong>, prolonged (wide) QRS, irregular pulse/PVCs, <strong>V-tach</strong><br><strong>Neuromuscular:</strong> muscle irritability, paresthesia, seizures<br><strong>GI:</strong> abdominal cramps<br><strong>Acid–base:</strong> metabolic acidosis","<strong>EKG monitoring</strong><br><strong>Calcium gluconate</strong> — protect the heart<br><strong>IV insulin + dextrose</strong> — monitor blood sugar<br>Sodium bicarbonate<br><strong>Lokelma / Kayexalate</strong><br>Non-potassium-sparing diuretic (<strong>furosemide</strong>)<br>Monitor BUN/creatinine<br><strong>No salt substitutes</strong><br>Dialysis (last resort)"]
   ]}},
   {h:"Class poster review — hypocalcemia / hyperphosphatemia"},
   {table:{head:["Signs & symptoms","Interventions"],rows:[
    ["<strong>Hypocalcemia:</strong> <strong>tetany</strong>, tingling fingers, numbness around the mouth, muscle cramps, pain/aches, <strong>+ Chvostek</strong>, <strong>+ Trousseau</strong>, <strong>laryngeal and bronchospasm</strong>, dysrhythmias, prolonged ST and QT, tachycardia, seizures, altered mental status<br><strong>Hyperphosphatemia:</strong> weak bones/osteoporosis, ↑ fracture risk, fatigue","Heart monitor<br><strong>IV calcium gluconate</strong> (or calcium chloride); oral/parenteral calcium replacement; Tums (calcium carbonate)<br>Vitamin D<br><strong>Sevelamer</strong> (phosphate binder)<br>Low-sodium, <strong>low-phosphorus</strong> diet<br><strong>Seizure precautions</strong> (padded rails, suction and O₂ at bedside); fall precautions<br>Magnesium sulfate if magnesium is also low (low Mg keeps calcium from correcting)<br>Education on long-term PPI use (can lower magnesium, and with it calcium)<br>Weight-bearing exercise; dialysis<br><em>Note:</em> <strong>patiromer</strong> appeared on the class board, but it binds <strong>potassium</strong>, not phosphorus — it belongs with hyperkalemia"]
   ]}},
   {h:"IV fluid solutions"},
   {table:{head:["Type","Examples","Fluid shift","Primary use","Safety risk"],rows:[
    ["<strong>Isotonic</strong>","0.9% normal saline, lactated Ringer's (LR)","<strong>Stays put</strong> — expands intravascular volume without moving fluid in or out of cells","Volume replacement — hypovolemia, shock","<strong>Fluid volume overload</strong> — check lung sounds. LR contains potassium and is often avoided in renal failure"],
    ["<strong>Hypotonic</strong>","0.45% saline (½ NS), 2.5% dextrose","Moves <strong>into cells</strong> — pulls fluid from the vessels into the cells","Severe cellular dehydration (DKA, HHS)","<strong>Cerebral edema</strong> — never give to head-injury clients"],
    ["<strong>Hypertonic</strong>","3% saline, D10W, D50W, albumin (colloid)","Moves <strong>out of cells</strong> — pulls fluid from cells and tissue into the vessels","Severe hyponatremia, cerebral edema","<strong>Rapid fluid overload</strong> (pulmonary edema) — give slowly"]
   ]}}
  ],
  check:{stem:"A client with ESRD has a potassium level of 6.8 mEq/L and peaked T waves. The provider orders calcium gluconate IV. What is the purpose of this medication?",
   options:["To bind potassium in the GI tract for elimination","To stabilize the cardiac cell membrane and protect against dysrhythmias","To shift potassium into the cells","To correct the client's metabolic acidosis"],
   answer:1,
   why:"Calcium gluconate stabilizes the myocardium against the effects of hyperkalemia within minutes, but it does not lower the potassium level. Insulin with dextrose shifts potassium into cells, and binders or dialysis remove it."}
},
{ id:"elim-dialysis", title:"Dialysis Types: Hemodialysis, Peritoneal Dialysis & CRRT", kicker:"How each one works, access types and care, and the complications to watch for",
  blocks:[
   {p:"Dialysis takes over the kidneys' filtering job by moving wastes, excess electrolytes, and water across a semipermeable membrane. It relies on three principles: <strong>diffusion</strong> (solutes move from higher to lower concentration — urea, creatinine, and potassium move out of the blood), <strong>osmosis</strong> (water moves toward the higher solute concentration), and <strong>ultrafiltration</strong> (water is pushed out by a pressure gradient). The three types differ in <em>where</em> the membrane is and <em>how often</em> they run."},
   {h:"When is dialysis needed? — AEIOU"},
   {table:{head:["","Indication"],rows:[
    ["<strong>A</strong>","<strong>Acidosis</strong> — metabolic acidosis not controlled by bicarbonate"],
    ["<strong>E</strong>","<strong>Electrolytes</strong> — severe hyperkalemia (or hyperphosphatemia) refractory to medical treatment"],
    ["<strong>I</strong>","<strong>Intoxication</strong> — dialyzable drug or toxin overdose (e.g., salicylates, lithium)"],
    ["<strong>O</strong>","<strong>Overload</strong> — symptomatic fluid overload/pulmonary edema not responding to diuretics"],
    ["<strong>U</strong>","<strong>Uremia</strong> — uremic complications such as pericarditis or encephalopathy; also anuria"]
   ]}},
   {h:"Comparing the three types"},
   {table:{head:["","Hemodialysis (HD)","Peritoneal dialysis (PD)","Continuous renal replacement therapy (CRRT)"],rows:[
    ["<strong>Membrane</strong>","Artificial membrane in an external dialyzer (the \"artificial kidney\")","The patient's own <strong>peritoneum</strong> acts as the semipermeable membrane","Artificial filter, run continuously at the bedside"],
    ["<strong>Access</strong>","AV fistula, AV graft, or a temporary central venous dialysis catheter","<strong>Tenckhoff catheter</strong> surgically placed into the peritoneal cavity","Large-bore central venous dialysis catheter"],
    ["<strong>Schedule</strong>","Usually 3 times a week, about 3–4 hours per session, at a center","Daily — manual exchanges several times a day (CAPD) or overnight by a machine (APD, cycler)","24 hours a day in the ICU"],
    ["<strong>Best for</strong>","Rapid removal of fluid, K⁺, and wastes; most ESRD patients","Patients who want independence at home; those who can't tolerate rapid fluid shifts","<strong>Hemodynamically unstable</strong> ICU patients who can't tolerate the rapid shifts of HD"],
    ["<strong>Diet</strong>","More restrictive — K⁺, phosphorus, sodium, and fluid build up between treatments","More liberal — K⁺ is removed daily; phosphorus still limited; higher protein because protein is lost into the dialysate","Managed by the ICU team"]
   ]}},
   {h:"Hemodialysis access types"},
   {table:{head:["Access","What it is","Timing","Key points"],rows:[
    ["<strong>AV fistula</strong>","Surgical connection of an artery directly to a vein (usually in the forearm), so the vein enlarges and thickens","Needs about <strong>1–3 months</strong> to mature before use (ideally created months before dialysis starts)","Preferred access — longest-lasting, lowest infection and clotting risk. Over years the vein can become visibly enlarged and bulging"],
    ["<strong>AV graft</strong>","A synthetic tube tunneled under the skin connecting an artery to a vein","Usable in about <strong>2–3 weeks</strong>","For patients whose vessels are not suitable for a fistula; higher risk of clotting and infection than a fistula"],
    ["<strong>Vascath</strong> (temporary central catheter)","Temporary, non-tunneled, double-lumen catheter","Usable <strong>immediately</strong> — for acute needs (AKI)","High infection risk; not permanent. Strict sterile dressing changes; <strong>do not use for fluids or meds</strong>"],
    ["<strong>Permacath</strong> (tunneled catheter)","Tunneled, long-term catheter under the skin","Usable immediately; lasts longer than a Vascath","Risk of clotting and infection. Monitor the exit site for redness; maintain the <strong>heparin lock</strong>"]
   ]}},
   {p:"The AV fistula is the <strong>gold standard</strong> — lowest infection and clotting risk — but takes months to mature. The graft is a good option for clients with poor veins but has a higher risk of clotting (thrombosis), infection, aneurysm, and stenosis."},
   {h:"More access details"},
   {list:[
    "<strong>Dialysis catheters:</strong> placement in the upper chest is confirmed by <strong>x-ray</strong> before first use; the lumens are filled with concentrated heparin, so <strong>don't inject IV fluids or meds</strong> into them and <strong>don't unclamp</strong> unless preparing for dialysis (blood will fill the lumen and clot). The <strong>red</strong> lumen is \"arterial\" (blood to the machine) and the <strong>blue</strong> lumen is \"venous\" (blood back to the client). Temporary catheters are generally used for up to about 3–4 weeks. After removal, apply pressure and check the site for several hours — dialysis catheters are large and bleed more",
    "<strong>AV fistula:</strong> ideally created months before dialysis is expected to start; after healing, the client <strong>exercises the arm</strong> (e.g., squeezing a ball) to help it mature. Check patency more often when the client is <strong>hypotensive</strong> (low BP promotes clotting). For post-dialysis needle-site bleeding, apply just enough pressure to stop the bleeding <strong>without occluding the vessel</strong>",
    "<strong>AV graft:</strong> avoid puncturing a new graft for about 2–4 weeks while tissue grows into it",
    "<strong>Vein preservation:</strong> in clients who may need a fistula someday, avoid PICC lines and subclavian catheters (they cause central vein stenosis) and protect the nondominant arm's veins",
    "<strong>Fistula teaching:</strong> wash the site daily with antibacterial soap and before dialysis; don't pick scabs; check for redness, warmth, or a pimple-like spot; feel for the thrill several times a day and report any change; ask staff to rotate needle sites"]},
   {h:"Caring for an AV fistula or graft"},
   {list:[
    "<strong>Palpate for a thrill</strong> (a buzzing vibration) and <strong>auscultate for a bruit</strong> (a whooshing sound) every shift — their presence means the access is patent; absence means possible clotting and must be reported <strong>immediately</strong>",
    "<strong>No</strong> blood pressures, venipunctures, IVs, or injections in the access arm",
    "No tight clothing, jewelry, or restraints on the access arm; don't carry heavy objects with it or sleep on it",
    "Post a sign or band identifying the access limb",
    "Assess for infection — redness, warmth, drainage, fever",
    "Check distal circulation — a <strong>pale, cold hand</strong> (with pain or numbness) can signal <strong>steal syndrome</strong> (the access diverts too much arterial blood from the hand) — a red flag, along with an absent thrill or bruit",
    "After dialysis, apply gentle pressure to needle sites to control bleeding (heparin is used during the treatment)"]},
   {h:"Nursing care before and after hemodialysis"},
   {list:[
    "<strong>Before:</strong> weigh the patient (1 kg = 1 L), take vital signs, check labs, assess the access, and <strong>hold antihypertensives and water-soluble vitamins</strong> (and other drugs removed by dialysis, such as some antibiotics) until after treatment, per orders",
    "<strong>After:</strong> weigh again (weight loss reflects fluid removed), take vital signs, assess for bleeding at the access and for hypotension, and watch for disequilibrium syndrome"]},
   {h:"CRRT nursing care"},
   {list:[
    "A slower, 24/7 form of dialysis — gentle on blood pressure, so it's used for <strong>hemodynamically unstable</strong> ICU clients who can't tolerate the rapid fluid shifts of hemodialysis",
    "Requires close (often 1:1) ICU nursing care",
    "<strong>Vital signs hourly</strong> for hemodynamic shifts",
    "<strong>Check the filter for clotting</strong> — early sign is a falling ultrafiltration rate; then rising venous pressure and dark blood lines",
    "<strong>Frequent electrolyte monitoring</strong> (at least twice daily) to prevent rapid imbalances; daily weights",
    "An hourly fluid-balance goal is set; the nurse totals all intake and output each hour and adjusts replacement fluid to meet it",
    "<strong>Blood leak alarm</strong> — blood in the ultrafiltrate means the filter has ruptured; gross blood = don't return the circuit blood to the client",
    "<strong>Hypothermia</strong> — blood cools outside the body; use a blood warmer or warming blanket (hypothermia can also mask fever)",
    "Hold ACE inhibitors before CRRT as ordered (risk of severe hypotension or reaction)"]},
   {h:"During and after hemodialysis"},
   {list:[
    "Vital signs <strong>before, during, and after</strong> dialysis — a slight temperature rise is expected from warming of the blood, but a persistent elevation suggests infection; watch for any precipitous drop in BP",
    "Monitor for bleeding — heparin is used during dialysis to prevent clotting (reversed with protamine); watch platelets for heparin-induced thrombocytopenia",
    "BP and pulse at least every 30 minutes during acute hemodialysis; keep the access visible at all times (a disconnected line can cause rapid blood loss); discourage eating during treatment (can trigger hypotension and nausea)",
    "Draw post-dialysis labs at least <strong>2–3 hours after</strong> treatment — values drawn immediately afterward are falsely low while solutes re-equilibrate",
    "<strong>Dry weight</strong> — the weight at which the client has no fluid excess or deficit — guides how much fluid to remove",
    "Monitor for fluid overload <em>before</em> dialysis and for hypovolemia <em>after</em>",
    "A client with a <strong>femoral catheter</strong> should sit up at <strong>less than a 45-degree angle</strong> and not lean forward, to avoid occlusion or kinking",
    "Monitor the graft/fistula for clotting — inability to feel a thrill or hear a bruit, or client complaints of arm discomfort and paresthesia",
    "The thrill feels like a \"purring\"; the bruit sounds like rushing water (\"like a washing machine\")"]},
   {h:"Complications of hemodialysis"},
   {list:[
    "<strong>Hypotension</strong> — from rapid removal of blood volume; the most common complication",
    "Nausea, vomiting, chest pain, visual changes",
    "<strong>Muscle cramps</strong> — from rapid fluid and electrolyte shifts (and low-sodium dialysis solution)",
    "<strong>Steal syndrome</strong> — pain distal to the access site, poor capillary refill, paresthesia",
    "Insertion/access site bleeding, hematoma, or infection",
    "<strong>Dialysis disequilibrium syndrome</strong> — urea is removed from the blood faster than from the brain, pulling water into brain cells → headache, nausea/vomiting, restlessness, confusion, seizures. Highest risk in first treatments or after a long gap with a very high BUN; prevented with shorter sessions (e.g., 1–2 hours on 3–4 consecutive days)",
    "Hypotension is treated with a <strong>normal saline bolus (about 100–200 mL)</strong> and slowing fluid removal; antihypertensives are often held 4–6 hours before dialysis and sedatives avoided. Muscle cramps are treated by lowering the ultrafiltration rate and giving a saline bolus",
    "Dysrhythmias and angina in clients with heart disease — slow the fluid removal",
    "<strong>Bleeding</strong> — from heparin used during treatment",
    "<strong>Infection</strong> — especially with central catheters",
    "<strong>Air embolism</strong> — rare but serious"]},
   {h:"Peritoneal dialysis — how an exchange works"},
   {list:[
    "<strong>Fill:</strong> warmed dialysate (dextrose solution) flows in by gravity through the Tenckhoff catheter",
    "<strong>Dwell:</strong> it stays in the peritoneal cavity for a prescribed time while wastes and water move across the peritoneum by diffusion and osmosis (the dextrose pulls water out)",
    "<strong>Drain:</strong> the bag is lowered below the abdomen and the fluid drains out by gravity, carrying wastes and excess water",
    "<strong>CAPD</strong> (continuous ambulatory PD) — manual exchanges about 4 times a day; <strong>APD</strong> (automated PD) — a cycler machine performs exchanges overnight"]},
   {h:"Peritoneal dialysis nursing care"},
   {list:[
    "Before starting: baseline vital signs and weight; have the client <strong>empty the bladder</strong> (if still making urine); assess the abdomen and catheter site",
    "Warm dialysate to body temperature using a dry heating pad or warmer — <strong>never a microwave</strong> (uneven heating can burn the peritoneum)",
    "Typical exchange: fill by gravity over about 5–10 minutes, dwell about 30–45 minutes (acute) or hours (CAPD), drain by gravity in no more than about 20 minutes. Dextrose strengths are 1.5%, 2.5%, or 4.25% — higher concentrations pull off more fluid",
    "If drainage is short by 500 mL or more after several exchanges, evaluate for fluid retention (abdominal distention, fullness, weight gain)",
    "Clear fluid leaking around the catheter can be confirmed as dialysate with a <strong>glucose test strip</strong> (positive because of the dextrose)",
    "Hypokalemia is common (dialysate usually has no potassium) — KCl may be added; insulin may be added for hyperglycemia",
    "PD is contraindicated with existing peritonitis, recent or extensive abdominal surgery, or abdominal adhesions; in cardiac arrest, the abdomen is drained immediately",
    "Strict aseptic technique with every connection; mask during exchanges; daily catheter exit-site care",
    "Outflow (effluent) should be <strong>clear, straw-colored / pale yellow</strong>. Blood-tinged outflow is expected in the first few exchanges after catheter placement",
    "<strong>Outflow color guide:</strong> clear straw-colored = normal; <strong>cloudy</strong> = peritonitis; <strong>bloody</strong> after the first few exchanges = vascular complication; <strong>brown</strong> = bowel perforation; <strong>urine-colored</strong> = bladder perforation — report anything other than clear",
    "Don't let the dwell run longer than prescribed (more glucose absorbed → hyperglycemia). If outflow is less than inflow, the difference has been absorbed and is counted as <strong>intake</strong>",
    "Abdominal cramping is common during inflow in the first few exchanges (warm dialysate helps). After catheter placement, smaller volumes are used for about 1–2 weeks while the cuffs heal in, to prevent leaking",
    "<strong>Cloudy outflow = peritonitis</strong> until proven otherwise — along with fever, abdominal pain, rebound tenderness, and a <strong>rigid, board-like abdomen</strong>; send a sample for culture and notify the provider",
    "<strong>Poor (sluggish) outflow:</strong> the main cause is a <strong>full colon</strong> — prevent constipation with fiber and stool softeners. Also check for kinks and closed clamps, keep the bag below the abdomen, and <strong>reposition the client side to side</strong> (or elevate the HOB, gently massage the abdomen); fibrin clots may need heparin added to the dialysate as ordered",
    "<strong>Shortness of breath during the dwell</strong> means the fluid may be pushing on the diaphragm — <strong>drain the fluid immediately</strong>"]},
   {h:"Intake and output math for dialysis"},
   {list:[
    "<strong>True urine output</strong> = total output − the amount of dialysate/irrigant instilled",
    "<strong>Ultrafiltration</strong> (fluid removed) = dialysate drained out − dialysate put in. Example: 2,000 mL in, 2,500 mL out → <strong>500 mL</strong> of fluid removed",
    "Outflow should equal or exceed inflow; if less drains out than went in, the client is retaining fluid"]},
   {h:"Complications of peritoneal dialysis"},
   {list:[
    "<strong>Peritonitis</strong> — the most serious; cloudy outflow, abdominal pain, fever",
    "Exit-site or tunnel infection",
    "Hyperglycemia and weight gain from dextrose absorbed from the dialysate",
    "Hernias and <strong>back pain</strong> from the weight of the dialysate (orthopedic binders may help back pain)",
    "<strong>Pneumonia and atelectasis</strong> from pressure on the diaphragm during the dwell",
    "Ongoing protein loss and malnutrition — monitor nutritional status"]},
   {hook:"The two access-patency checks are paired senses: you <strong>feel</strong> a thrill and <strong>hear</strong> a bruit. For PD, the eyes do the work — any cloudy bag is peritonitis until proven otherwise."}
  ],
  check:{stem:"The nurse drains a peritoneal dialysis exchange and notes the outflow is cloudy. The client reports abdominal pain. What does the nurse suspect?",
   options:["Normal outflow after the first few exchanges","Peritonitis","Constipation blocking the catheter","Dialysis disequilibrium syndrome"],
   answer:1,
   why:"Cloudy outflow with abdominal pain is the hallmark of peritonitis. Blood-tinged outflow is expected only in the first few exchanges after catheter placement, and constipation causes poor outflow rather than cloudy fluid."}
},
{ id:"elim-diet", title:"The Renal Diet: Potassium, Phosphorus & Sodium", kicker:"From the GU diet handout — what to limit, why, and the \"double jeopardy\" foods",
  blocks:[
   {h:"Why potassium matters"},
   {p:"Potassium is a mineral found in most foods. It helps with muscle movement, keeps the nervous system healthy, and helps balance the amount of water in the body. The kidneys control the blood potassium level, so in kidney disease it can build up to high levels — <strong>hyperkalemia</strong> — which can be dangerous for the heart."},
   {h:"Why phosphorus matters"},
   {p:"Phosphorus helps build strong bones and teeth and helps convert food into energy. Kidneys normally release extra phosphorus into the urine; kidney disease prevents this, and the buildup causes problems for the bones and heart."},
   {h:"Hemodialysis diet"},
   {list:[
    "<strong>Potassium is limited</strong> because it builds up between dialysis treatments, causing weakness, muscle cramps, tiredness, irregular heartbeat, and even heart attack",
    "Potassium is found mostly in <strong>fruits, vegetables, and dairy products</strong>. Eating a large amount of a low-potassium food can still add up to a dangerous level",
    "Most foods contain some potassium — meat, poultry, bread, pasta. <strong>Butter, margarine, and oils are the only potassium-free foods</strong>",
    "<strong>Phosphorus is limited</strong> because hemodialysis removes only a small amount. Without diet limits and phosphorus binders, levels climb — causing itching, weak and brittle bones, and calcium deposits in blood vessels and organs including the heart and lungs",
    "Phosphorus is highest in <strong>high-protein foods, dairy, nuts, seeds, dried beans and peas, chocolate, colas, and whole-grain foods</strong>"]},
   {h:"Peritoneal dialysis diet"},
   {list:[
    "Because PD is performed <strong>daily</strong>, the diet is a little more liberal",
    "Potassium is usually removed well through PD, so most PD patients keep a normal or even <strong>low</strong> potassium — those with low levels may be told to eat potassium-rich foods such as tomatoes, orange juice, and bananas",
    "Phosphorus is <strong>not</strong> removed well during PD, so PD patients still need to limit phosphorus"]},
   {h:"Double jeopardy foods — high in both potassium and phosphorus"},
   {p:"Most high-potassium foods come from plants (fruits and vegetables). High-protein foods such as meats, along with dried beans and peas, tend to be high in phosphorus. Foods high in <em>both</em> — dairy, nuts, seeds, chocolate, and some whole-grain foods — are best avoided or used in very small amounts."},
   {table:{head:["Double jeopardy food","Kidney-friendly alternative"],rows:[
    ["Cheese","Vegan rella cheese, low-fat cottage cheese, a sprinkle of parmesan (very small amounts of extra-sharp cheese for maximum flavor)"],
    ["Chocolate","Desserts made with lemon or apple, white cake, rice-crispy treats"],
    ["Cream soup","Broth-based soups with pureed vegetables, or soups made with acceptable milk substitutes"],
    ["Dried beans and peas","Green beans, wax beans"],
    ["Ice cream","Sorbet, sherbet, popsicles"],
    ["Milk","Almond milk, Rice Dream original, unenriched rice beverage"],
    ["Nuts","Low-salt snack foods — pretzels, tortilla chips, popcorn, crackers, Sun Chips"],
    ["Peanut butter","Low-fat cream cheese, jam, or fruit spread"]
   ]}},
   {h:"Phosphorus targets"},
   {list:[

{ id:"elim-nephrotic", title:"Nephrotic Syndrome (and Nephritic vs. Nephrotic)", kicker:"A leaky glomerulus — massive proteinuria, low albumin, severe edema, high lipids",
  blocks:[
   {p:"In nephrotic syndrome, damage to the glomerulus makes it abnormally <strong>permeable to protein</strong> — the lecture's \"leaky glomerulus lets protein out.\" Large amounts of protein, mainly albumin, spill into the urine. The loss of albumin lowers the blood's oncotic pressure, fluid leaks into the tissues, and severe edema follows. The liver responds to low protein by making more lipoproteins, so cholesterol rises."},

    "<strong>Severe edema</strong> — periorbital, peripheral, and generalized (anasarca), plus ascites",
    "<strong>Hyperlipidemia</strong> — high LDL cholesterol",
    "Urine appears <strong>foamy or frothy</strong> from the protein"]},

   {list:[

{ id:"elim-nephrosclerosis", title:"Nephrosclerosis", kicker:"Hardening of the renal arteries — the kidney damage of long-standing hypertension",
  blocks:[
   {p:"Nephrosclerosis is <strong>hardening of the renal arteries</strong>. The lecture image shows <strong>plaque building up</strong> where the renal arteries leave the aorta, <strong>narrowing the renal artery</strong>. As the vessels thicken and narrow, blood flow to the kidney falls, the tissue becomes ischemic, and nephrons are gradually lost. It is typically caused by prolonged, <strong>uncontrolled hypertension</strong> or <strong>diabetes</strong> (type 1 or 2), along with atherosclerosis, and it's a major cause of CKD. It's a \"silent killer\": BUN and creatinine rise with minimal symptoms at first."},
   {h:"A two-way street with hypertension"},
   {p:"High blood pressure damages the renal arterioles, and the damaged, underperfused kidney then activates the renin–angiotensin–aldosterone system, which raises blood pressure further. Each problem worsens the other, which is why blood pressure control is the core of management."},
   {h:"Two forms"},
   {table:{head:["","Benign nephrosclerosis","Accelerated (malignant) nephrosclerosis"],rows:[
    ["<strong>Associated with</strong>","Long-standing, often moderate hypertension; aging; atherosclerosis","Severely elevated blood pressure (hypertensive emergency)"],
    ["<strong>Course</strong>","Slow and gradual; often no symptoms early","Rapid — kidney function can decline over weeks"],

    "Kidney function labs over time — BUN, creatinine, GFR",
    "Urine — protein, blood",
    "Risk factors — hypertension, diabetes, smoking, hyperlipidemia, older age",
    "Vision changes and headache (malignant form)",
    "Signs of CKD as it progresses"]},
   {h:"Priority interventions/collaborative actions"},
   {list:[

    "Lipid control (statins) and glucose control",
    "Monitor kidney function regularly",
    "Teach medication adherence — uncontrolled BP drives progression",
    "As function declines, CKD management and eventually dialysis or transplant"]},
