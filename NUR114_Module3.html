  why:"Acute pyelonephritis causes fever, chills, flank pain, and CVA tenderness, often with lower UTI symptoms."},
 {stem:"When should the urine culture be collected for a client with suspected pyelonephritis?",
  options:["After the first antibiotic dose","Before antibiotics are started","After the full antibiotic course","Only if symptoms don't improve"],
  answer:1,
  why:"The culture is collected before antibiotics so the organism and its sensitivities can be identified accurately."},
 {stem:"A client with pyelonephritis feels better after 4 days of a 14-day antibiotic course. What should the nurse teach?",
  options:["Stop the antibiotic once symptoms resolve","Finish the entire course, and return for a follow-up urine culture","Cut the dose in half","Save the remaining pills for the next infection"],
  answer:1,
  why:"Stopping early risks recurrence, resistance, and chronic pyelonephritis. The full course and a follow-up culture confirm the infection is cleared."},
 {stem:"Which complication of pyelonephritis is the most immediately life-threatening?",
  options:["Scarring of the cortex","Urosepsis","Nocturia","Mild hypertension"],
  answer:1,
  why:"Urosepsis can progress to septic shock. The nurse watches for hypotension, tachycardia, high fever, and confusion."},
 {type:"sata", stem:"Which are risk factors for pyelonephritis? Select all that apply.",
  options:["Indwelling urinary catheter","Kidney stones","Vesicoureteral reflux","Pregnancy","High fluid intake"],
  answers:[0,1,2,3],
  why:"Catheters, obstruction (stones), reflux, and pregnancy all increase risk. High fluid intake helps flush bacteria and is protective."}
],
"elim-nephrotic":[
 {stem:"Which finding is a hallmark of nephrotic syndrome?",
  options:["Proteinuria greater than 3.5 g/day","Cola-colored urine","A positive ASO titer","CVA tenderness with fever"],
  answer:0,
  why:"Massive proteinuria (more than 3.5 g/day), hypoalbuminemia, severe edema, and hyperlipidemia are the hallmarks of nephrotic syndrome."},
 {stem:"Why is a client with nephrotic syndrome at increased risk for blood clots?",
  options:["Platelets are lost in the urine","Clotting-regulating proteins are lost in the urine, making the blood hypercoagulable","High blood pressure damages vessel walls","Dehydration thickens the blood"],
  answer:1,
  why:"Proteins that normally prevent clotting are lost through the leaky glomerulus, making the blood hypercoagulable — DVT, PE, and renal vein thrombosis are risks."},
 {stem:"Which medication is used to reduce protein loss in nephrotic syndrome by lowering pressure in the glomerulus?",
  options:["Spironolactone","An ACE inhibitor","Sodium bicarbonate","Epoetin alfa"],
  answer:1,
  why:"ACE inhibitors (and ARBs) lower glomerular pressure and reduce proteinuria. Corticosteroids, loop diuretics, and statins are also used."},
 {type:"matrix", stem:"Classify each finding as typical of nephritic or nephrotic syndrome.",
  rows:["Cola-colored urine (hematuria)","Massive proteinuria","Hypertension","Hyperlipidemia","Oliguria","Hypoalbuminemia"],
  cols:["Nephritic","Nephrotic"],
  correct:[0,1,0,1,0,1],
  why:"Nephritic = inflammation: hematuria, hypertension, oliguria. Nephrotic = protein overflow: massive proteinuria, hypoalbuminemia, hyperlipidemia, severe peripheral edema."},
 {type:"sata", stem:"Which interventions are appropriate for a client with nephrotic syndrome? Select all that apply.",
  options:["Low-sodium diet","Daily weight and abdominal girth","Meticulous skin care over edematous areas","Infection precautions","High-sodium diet to raise blood pressure"],
  answers:[0,1,2,3],
  why:"Sodium restriction, daily weight and girth, skin care, and infection prevention are all appropriate. A high-sodium diet would worsen edema."}
],
"elim-nephrosclerosis":[
 {stem:"Nephrosclerosis is best described as:",
  options:["Bacterial infection of the renal pelvis","Hardening of the renal arteries","Inflammation of the glomeruli after strep infection","Massive protein loss through a leaky glomerulus"],
  answer:1,
  why:"Nephrosclerosis is hardening of the renal arteries — plaque and thickening narrow the vessels, reducing blood flow to the kidney. Infection, post-strep inflammation, and massive protein loss describe pyelonephritis, glomerulonephritis, and nephrotic syndrome."},
 {stem:"Which condition is most closely associated with nephrosclerosis?",
  options:["Long-standing hypertension","Recent strep throat","Urinary catheter use","Pregnancy"],
  answer:0,
  why:"Nephrosclerosis is tied to long-standing hypertension and atherosclerosis. The damaged kidney also raises BP further through the renin–angiotensin system."},
 {stem:"Which medication class is often preferred for BP control in nephrosclerosis because it also protects the kidney?",
  options:["Potassium-sparing diuretics","ACE inhibitors or ARBs","Corticosteroids","Osmotic diuretics"],
  answer:1,
  why:"ACE inhibitors and ARBs lower BP and reduce proteinuria, protecting the kidney."},
 {stem:"A client with a BP of 238/134 reports a severe headache and blurred vision, and his creatinine has risen sharply over two weeks. What does the nurse suspect?",
  options:["Benign nephrosclerosis","Accelerated (malignant) nephrosclerosis","Acute pyelonephritis","Nephrotic syndrome"],
  answer:1,
  why:"Severe hypertension with headache, visual changes, and rapidly declining kidney function fits accelerated (malignant) nephrosclerosis, a hypertensive emergency."},
 {type:"sata", stem:"Which lifestyle teaching supports slowing nephrosclerosis? Select all that apply.",
  options:["Restrict sodium","Stop smoking","Take antihypertensives even when feeling well","Control lipids and blood glucose","Stop BP medication once the reading is normal"],
  answers:[0,1,2,3],
  why:"Sodium restriction, smoking cessation, adherence to antihypertensives, and lipid and glucose control all slow progression. Stopping BP medication when the reading is normal lets BP rise again."}
],
"sens-lowvision":[
 {stem:"Which action should the nurse take when entering the room of a client with severely impaired vision?",
  options:["Touch the client's shoulder without speaking","Announce name and role on entering","Speak loudly","Move the bedside table closer without telling the client"],
  answer:1,
  why:"Announcing yourself avoids startling the client. There's no need to speak loudly, and items shouldn't be moved without telling the client."},
 {stem:"How should the nurse describe a meal tray to a client who is blind?",
  options:["Use the clock method to describe where each item is","Tell the client to feel around the tray","Feed the client without explanation","Describe the colors of the food"],
  answer:0,
  why:"The clock method (\"your coffee is at 2 o'clock\") lets the client locate food independently."},
 {stem:"What is the definition of legal blindness?",
  options:["Visual acuity of 20/40 in either eye","Central visual acuity of 20/200 or less in the better eye with correction, or a visual field of 20 degrees or less","Any loss of peripheral vision","Needing glasses to read"],
  answer:1,
  why:"Legal blindness is central visual acuity of 20/200 or less in the better eye with correction, or a visual field of 20 degrees or less."},
 {stem:"Which environmental change best supports safety for a client with low vision?",
  options:["Dim lighting to reduce eye strain","Frequently rearranging furniture","High-contrast colors and consistent placement of belongings","Leaving doors half open"],
  answer:2,
  why:"High contrast helps the client distinguish objects, and consistent placement prevents falls. Doors should be fully open or fully closed."},
 {type:"sata", stem:"Which strategies help a client adjust to vision loss? Select all that apply.",
  options:["Low-vision aids such as magnifiers and talking devices","Referral to low-vision services and occupational therapy","Encouraging independence in self-care","Monitoring for depression and isolation","Doing all self-care for the client to prevent falls"],
  answers:[0,1,2,3],
  why:"Aids, referrals, encouraging independence, and emotional support all help adjustment. Doing everything for the client undermines independence."}
],
"sens-cataract":[
 {stem:"Which symptom is most characteristic of a cataract?",
  options:["Sudden severe eye pain","Gradual, painless blurred vision with glare at night","Loss of peripheral vision","A curtain over the visual field"],
  answer:1,
  why:"Cataracts cause gradual, painless clouding of vision with glare and halos, especially when driving at night."},
 {stem:"On inspection, the nurse notes a cloudy white pupil. Which condition does this suggest?",
  options:["Glaucoma","Cataract","Retinal detachment","AMD"],
  answer:1,
  why:"A cloudy, white, or gray pupil is the visible lens opacity of a cataract. Glaucoma, retinal detachment, and AMD don't change the pupil's color."},
 {stem:"What is the treatment for a cataract that interferes with daily life?",
  options:["Prostaglandin analog drops","Removal of the lens with an intraocular lens implant","Anti-VEGF injections","Laser iridotomy"],
  answer:1,
  why:"Surgery is the only cure: the clouded lens is removed (usually by phacoemulsification) and replaced with an intraocular lens."},
 {stem:"A client calls the day after cataract surgery reporting sudden, increasing eye pain. What should the nurse advise?",
  options:["Take acetaminophen and rest","Come in for evaluation — this may indicate increased IOP or infection","This is expected for 2 weeks","Apply a warm compress"],
  answer:1,
  why:"Sudden or increasing pain after eye surgery can signal increased IOP, hemorrhage, or infection and needs prompt evaluation."},
 {type:"sata", stem:"Which activities should a client avoid after cataract surgery? Select all that apply.",
  options:["Bending at the waist","Heavy lifting","Straining during bowel movements","Rubbing the eye","Walking"],
  answers:[0,1,2,3],
  why:"Bending, lifting, straining, and rubbing all raise IOP or risk injury. Walking is encouraged."}
],
"sens-glaucoma":[
 {stem:"Which vision change is characteristic of glaucoma?",
  options:["Central vision loss","Peripheral vision loss (tunnel vision)","Half of the visual field lost","Blurred vision across the whole field"],
  answer:1,
  why:"Glaucoma damages the optic nerve and causes peripheral vision loss first — tunnel vision. Central loss is AMD, half-field loss is hemianopsia, and overall blur is a cataract."},
 {stem:"What is the normal range for intraocular pressure?",
  options:["0–5 mmHg","10–21 mmHg","25–35 mmHg","40–50 mmHg"],
  answer:1,
  why:"Normal IOP is about 10–21 mmHg."},
 {stem:"Which medication is contraindicated for a client at risk for acute angle-closure glaucoma?",
  options:["Pilocarpine","Atropine","Timolol","Acetazolamide"],
  answer:1,
  why:"Atropine dilates the pupil, which can block the drainage angle and trigger acute angle closure. Pilocarpine, timolol, and acetazolamide lower IOP."},
 {stem:"A client with open-angle glaucoma says, \"My eyes feel fine, so I only use my drops when I remember.\" What is the nurse's best response?",
  options:["\"That's fine as long as you feel well.\"","\"Glaucoma has no symptoms until vision is lost, and lost vision can't be restored — the drops need to be used every day.\"","\"You can switch to using them weekly.\"","\"Use them only when you notice halos.\""],
  answer:1,
  why:"Open-angle glaucoma is painless and silent, and vision lost to it is permanent. Lifelong daily adherence prevents further loss."},
 {type:"sata", stem:"Which findings suggest acute angle-closure glaucoma? Select all that apply.",
  options:["Severe eye pain","Nausea and vomiting","Halos around lights","Gradual painless vision loss over years","Red eye with a fixed, mid-dilated pupil"],
  answers:[0,1,2,4],
  why:"Acute angle closure causes sudden severe pain, nausea and vomiting, halos, and a red eye with a fixed mid-dilated pupil. Gradual painless loss fits open-angle glaucoma."}
],
"sens-amd":[
 {stem:"Which part of the visual field is lost in AMD?",
  options:["Peripheral","Central","One half","Upper quadrant only"],
  answer:1,
  why:"AMD damages the macula, causing loss of central vision while peripheral vision is preserved."},
 {stem:"Which tool does a client with AMD use at home to monitor for changes?",
  options:["Snellen chart","Amsler grid","Tonometer","Ishihara plates"],
  answer:1,
  why:"The Amsler grid shows distortion (wavy lines) or missing areas in central vision, signaling macular changes."},
 {stem:"Which is the treatment for wet AMD?",
  options:["AREDS2 vitamins only","Anti-VEGF intravitreal injections","Prostaglandin analog drops","Cataract surgery"],
  answer:1,
  why:"Wet AMD involves abnormal blood vessel growth; anti-VEGF injections stop that growth. AREDS2 supplements are used for dry AMD."},
 {stem:"Which is the most important modifiable risk factor for AMD?",
  options:["Age","Smoking","Family history","Eye color"],
  answer:1,
  why:"Smoking is the most important risk factor the client can change. Age, family history, and eye color can't be modified."},
 {type:"sata", stem:"Which strategies help a client with AMD maintain independence? Select all that apply.",
  options:["Magnifiers and large-print materials","Bright task lighting","Looking slightly to the side of objects to use peripheral vision","Daily Amsler grid checks","Relying only on central vision"],
  answers:[0,1,2,3],
  why:"Low-vision aids, lighting, eccentric viewing (using the intact peripheral vision), and monitoring all support independence. Central vision is the part that's lost."}
],
"sens-retina":[
 {stem:"Which symptom is typical of retinal detachment?",
  options:["Severe eye pain","A painless curtain or shadow over part of the vision","Gradual blurring over years","Itching and redness"],
  answer:1,
  why:"Retinal detachment is painless and causes flashes, floaters, and a curtain or shadow over part of the visual field."},
 {stem:"A client has a gas bubble in the eye after pneumatic retinopexy. Which activity must be avoided?",
  options:["Walking","Air travel","Watching TV","Eating a regular diet"],
  answer:1,
  why:"The gas expands at high altitude and can dangerously raise IOP. Air travel, high altitudes, and nitrous oxide anesthesia are avoided until the bubble is absorbed."},
 {stem:"Why is positioning so important after retinal repair with a gas bubble?",
  options:["To prevent pressure injuries","So the bubble presses against the correct area of the retina","To improve blood pressure","To prevent aspiration"],
  answer:1,
  why:"The bubble floats upward, so specific head positioning (sometimes face-down) keeps it pressing on the reattached area."},
 {stem:"A client calls reporting a sudden shower of floaters and flashing lights. What should the nurse advise?",
  options:["Rest and call back in a week","Seek emergency eye care immediately","Use artificial tears","Increase fluid intake"],
  answer:1,
  why:"Sudden floaters and flashes may signal a retinal tear or detachment, which requires immediate evaluation to save vision."},
 {type:"sata", stem:"Which are risk factors for retinal detachment? Select all that apply.",
  options:["Severe nearsightedness","Previous cataract surgery","Eye trauma","Diabetic retinopathy","Farsightedness in children"],
  answers:[0,1,2,3],
  why:"Severe myopia, prior eye surgery, trauma, and diabetic retinopathy all increase risk."}
],
"sens-hemianopsia":[
 {stem:"What is homonymous hemianopsia?",
  options:["Loss of central vision in both eyes","Loss of the same half of the visual field in both eyes","Loss of vision in one eye only","Clouding of the lens"],
  answer:1,
  why:"Homonymous hemianopsia is loss of the same half of the visual field in both eyes, caused by damage to the visual pathway in the brain."},
 {stem:"What is the most common cause of hemianopsia?",
  options:["Cataracts","Stroke","Glaucoma","Diabetic retinopathy"],
  answer:1,
  why:"Stroke is the most common cause. Tumors and head injury can also damage the visual pathway."},
 {stem:"In the acute phase after a stroke causing hemianopsia, where should the nurse place the call light?",
  options:["On the affected side","On the unaffected side","At the foot of the bed","Anywhere, as long as it's plugged in"],
  answer:1,
  why:"Initially, items are placed in the unaffected field so the client can see and reach them. Scanning toward the affected side is taught as rehabilitation progresses."},
 {stem:"Which teaching best helps a client compensate for hemianopsia?",
  options:["Wear an eye patch","Turn the head toward the affected side to scan the environment","Use eye drops daily","Avoid looking to the affected side"],
  answer:1,
  why:"Scanning (turning the head toward the affected side) brings the unseen half of the environment into view."},
 {type:"sata", stem:"Which findings may indicate hemianopsia? Select all that apply.",
  options:["Eating only half the food on the plate","Bumping into objects on one side","Not noticing people on one side","Halos around lights","Unawareness of the deficit"],
  answers:[0,1,2,4],
  why:"Eating half the plate, bumping into things, missing people on one side, and being unaware of the deficit are cues. Halos are associated with glaucoma and cataracts."}
],
"sens-retinopathy":[
 {stem:"What causes diabetic retinopathy?",
  options:["Clouding of the lens","High glucose damaging the retina's small blood vessels","Increased intraocular pressure","Bacterial infection"],
  answer:1,
  why:"Chronic hyperglycemia damages the retinal microvasculature, causing leakage, hemorrhage, and eventually abnormal vessel growth."},
 {stem:"How often should a client with diabetes have a dilated eye exam?",
  options:["Every 5 years","Annually","Only when symptoms appear","Every 10 years"],
  answer:1,
  why:"Annual dilated eye exams catch retinopathy early, often before symptoms appear."},
 {stem:"What happens in proliferative diabetic retinopathy?",
  options:["The lens clouds","Fragile new blood vessels grow and can bleed or cause retinal detachment","Drusen deposit in the macula","The optic nerve is compressed by high IOP"],
  answer:1,
  why:"The ischemic retina grows fragile new vessels that can bleed into the vitreous and form scar tissue that pulls the retina off."},
 {stem:"A client with diabetic retinopathy reports a sudden shower of dark spots and vision loss. What does the nurse suspect?",
  options:["Cataract","Vitreous hemorrhage or retinal detachment","Normal progression that needs no action","Dry eye"],
  answer:1,
  why:"Sudden floaters and vision loss in proliferative retinopathy suggest bleeding into the vitreous or retinal detachment — both need urgent care."},
 {type:"sata", stem:"Which measures help prevent progression of diabetic retinopathy? Select all that apply.",
  options:["Tight blood glucose control","Blood pressure control","Lipid control","Smoking cessation","Increasing carbohydrate intake"],
  answers:[0,1,2,3],
  why:"Glucose, BP, and lipid control and smoking cessation all protect the retinal vessels."}
],
"sens-emergencies":[
 {stem:"A client arrives with a metal fragment protruding from the eye. What is the correct action?",
  options:["Remove the object and irrigate","Stabilize the object and cover both eyes with a rigid shield, without pressure","Apply a tight pressure patch","Irrigate around the object"],
  answer:1,
  why:"Never remove a penetrating object. Stabilize it and cover the injured eye with a rigid shield without pressure; covering the unaffected eye limits movement of both eyes."},
 {stem:"How long should the nurse irrigate an eye after a chemical splash?",
  options:["30 seconds","At least 15 minutes, or until pH is neutral","Only until the client's pain improves","Irrigation is contraindicated"],
  answer:1,
  why:"Copious irrigation for at least 15 minutes, or until the pH is neutral, limits chemical damage."},
 {stem:"In which direction should the nurse irrigate an eye after chemical exposure?",
  options:["From the outer canthus to the inner canthus","From the inner canthus to the outer canthus","Directly onto the cornea","From the lower lid upward"],
  answer:1,
  why:"Irrigating from the inner to the outer canthus runs contaminated fluid away from the other eye and the tear duct."},
 {stem:"A client has an orbital fracture. Which instruction is most important?",
  options:["Blow the nose gently","Do not blow the nose","Lie flat","Apply heat"],
  answer:1,
  why:"Blowing the nose can force air into the orbit through the fracture. Ice and head elevation reduce swelling."},
 {type:"ordering", stem:"Arrange the steps for instilling eye drops in the correct order.",
  items:["Perform hand hygiene","Tilt the head back and pull down the lower lid to form a pocket","Instill the drop into the pocket without touching the tip to the eye","Close the eye gently without squeezing","Press on the inner corner of the eye for 1–2 minutes"],
  why:"Hand hygiene, form the conjunctival pocket, instill without touching the tip, close gently, then nasolacrimal occlusion to reduce systemic absorption."}
],
"sens-stations":[
 {type:"matrix", stem:"Classify each disorder by whether it can present as an acute eye emergency.",
  rows:["Retinal detachment","Acute angle-closure glaucoma","Cataract (preoperative)","Dry AMD","Penetrating eye trauma","Chemical splash to the eye"],
  cols:["Emergency","Not usually an emergency"],
  correct:[0,0,1,1,0,0],
  why:"Retinal detachment, acute angle-closure glaucoma, penetrating trauma, and chemical exposure all threaten vision within hours. Cataracts and dry AMD progress gradually."},
 {stem:"Which disorder causes loss of peripheral vision first?",
  options:["AMD","Glaucoma","Cataract","Hemianopsia"],
  answer:1,
  why:"Glaucoma damages the optic nerve and causes peripheral (tunnel) vision loss first. AMD causes central loss, and cataracts cause overall blurring."},
 {stem:"Which disorder causes loss of central vision?",
  options:["AMD","Glaucoma","Retinal detachment","Hemianopsia"],
  answer:0,
  why:"AMD damages the macula, which provides central vision."},
 {stem:"Which medication class for glaucoma causes the iris to darken?",
  options:["Beta blockers","Prostaglandin analogs","Miotics","Carbonic anhydrase inhibitors"],
  answer:1,
  why:"Prostaglandin analogs such as latanoprost can cause permanent darkening of the iris and eyelash growth."},
 {type:"sata", stem:"Which descriptions of how each disorder affects the visual field are accurate? Select all that apply.",
  options:["Glaucoma: clear center with dark edges","Cataract: the whole image is blurred and hazy","AMD: the center is blurred or dark","Hemianopsia: half of the image is blocked out","Detached retina: the entire field is black"],
  answers:[0,1,2,3],
  why:"Glaucoma causes tunnel vision, a cataract blurs the whole field, AMD blurs or darkens the center, and hemianopsia removes half the field. A detached retina blacks out the part of the field served by the detached area (a curtain or wedge), not the entire field."}
],
"sens-hearing":[
 {stem:"Which type of hearing loss is caused by cerumen impaction?",
  options:["Sensorineural","Conductive","Central","Mixed only"],
  answer:1,
  why:"Cerumen blocks sound from being carried through the outer ear, causing conductive hearing loss, which is often correctable."},
 {stem:"A client receiving IV furosemide and gentamicin reports ringing in the ears. What should the nurse do?",
  options:["Document it as expected","Report it — it may be ototoxicity","Increase the IV rate","Give aspirin"],
  answer:1,
  why:"Tinnitus is an early sign of ototoxicity. Loop diuretics and aminoglycosides are both ototoxic, and the risk is additive."},
 {stem:"Which communication technique is appropriate for a client with hearing loss?",
  options:["Shouting","Facing the client with light on the nurse's face","Speaking with a hand over the mouth","Repeating the same words louder"],
  answer:1,
  why:"Facing the client with good light on the nurse's face allows lip reading. Shouting distorts sound, and rephrasing works better than repeating."},
 {stem:"How should a hearing aid be stored at night?",
  options:["In a glass of water","Turned off or battery door open, in a dry case","Left in the ear","In the bathroom"],
  answer:1,
  why:"Hearing aids are removed at night, turned off (battery door open), and stored in a dry, labeled case away from moisture."},
 {type:"sata", stem:"Which medications are potentially ototoxic? Select all that apply.",
  options:["Furosemide","Gentamicin","Vancomycin","High-dose aspirin","Acetaminophen"],
  answers:[0,1,2,3],
  why:"Loop diuretics, aminoglycosides, vancomycin, and high-dose salicylates can all damage hearing."}
],
"sens-aphasia":[
 {stem:"A client speaks fluently but uses words that make no sense and doesn't follow instructions. Which type of aphasia is this?",
  options:["Expressive","Receptive","Global","Dysarthria"],
  answer:1,
  why:"Receptive (Wernicke's) aphasia causes fluent but meaningless speech and impaired comprehension."},
 {stem:"Which communication strategy is best for a client with expressive aphasia?",
  options:["Ask open-ended questions","Ask yes/no questions and allow time to respond","Finish the client's sentences","Speak loudly"],
  answer:1,
  why:"Clients with expressive aphasia understand but struggle to produce speech. Yes/no questions and patience reduce frustration."},
 {stem:"A client can't understand speech or produce meaningful speech. Which type of aphasia is this?",
  options:["Expressive","Receptive","Global","Dysarthria"],
  answer:2,
  why:"Global aphasia severely impairs both understanding and expression."},
 {stem:"How does dysarthria differ from aphasia?",
  options:["Dysarthria is a language problem; aphasia is a motor problem","Dysarthria is a motor problem causing slurred speech, with language and comprehension intact","They're the same","Dysarthria only affects writing"],
  answer:1,
  why:"Dysarthria is weakness or poor coordination of the speech muscles. Aphasia is a problem with language itself."},
 {type:"sata", stem:"Which interventions support a client with aphasia? Select all that apply.",
  options:["Reduce background noise","Use pictures and communication boards","Allow extra time to respond","Refer to a speech-language pathologist","Speak loudly and quickly"],
  answers:[0,1,2,3],
  why:"Reducing distractions, visual aids, extra time, and SLP referral all help. Speaking loudly and quickly doesn't help — aphasia isn't a hearing problem."}
],
"m3-meds-diuretics":[
 {stem:"Where do loop diuretics act?",
  options:["Proximal tubule","Ascending loop of Henle","Collecting duct aldosterone receptors","Glomerulus"],
  answer:1,
  why:"Loop diuretics block sodium and chloride reabsorption in the ascending loop of Henle, making them the most potent diuretics."},
 {stem:"Which lab result is most important to monitor in a client taking spironolactone?",
  options:["Sodium","Potassium","Glucose","Hemoglobin"],
  answer:1,
  why:"Spironolactone is potassium-sparing, so hyperkalemia is the major risk."},
 {stem:"A client with a sulfa allergy is prescribed furosemide. What should the nurse do?",
  options:["Give the dose as ordered","Check with the provider — furosemide is a sulfonamide derivative","Give it with food","Double the dose"],
  answer:1,
  why:"Furosemide and bumetanide are sulfonamide derivatives, so a sulfa allergy is flagged with the provider before giving them."},
 {stem:"Why is mannitol given in acute angle-closure glaucoma?",
  options:["To dilate the pupil","To pull fluid out of the eye and lower IOP","To treat infection","To lower potassium"],
  answer:1,
  why:"Mannitol is an osmotic diuretic that pulls fluid from tissues (including the eye) into the bloodstream, lowering IOP."},
 {type:"sata", stem:"Which nursing actions apply to a client receiving a loop diuretic? Select all that apply.",
  options:["Monitor potassium","Monitor daily weight","Give IV doses slowly","Assess for orthostatic hypotension","Encourage potassium-based salt substitutes for all clients"],
  answers:[0,1,2,3],
  why:"Potassium, weight, slow IV administration (to prevent ototoxicity), and orthostatic precautions all apply. Potassium-based salt substitutes are not appropriate for all clients, especially those with renal failure."}
],
"m3-meds-lytes":[
 {stem:"Why is calcium gluconate given in hyperkalemia?",
  options:["To lower potassium","To stabilize the cardiac membrane","To bind potassium in the gut","To shift potassium into cells"],
  answer:1,
  why:"Calcium gluconate protects the heart from hyperkalemia but does not lower the potassium level."},
 {stem:"What must the nurse avoid when giving IV calcium gluconate?",
  options:["Giving it slowly","Mixing it with sodium bicarbonate","Using a cardiac monitor","Checking IV patency"],
  answer:1,
  why:"Calcium and bicarbonate form a precipitate when mixed. Calcium gluconate is given slowly with cardiac monitoring and a patent IV."},
 {stem:"Which potassium binder has the fastest onset?",
  options:["Sodium polystyrene sulfonate","Patiromer","Sodium zirconium cyclosilicate (Lokelma)","All are equal"],
  answer:2,
  why:"Lokelma is the fastest-acting binder, with an onset of about 1 hour. Patiromer has a delayed onset (hours to days) and sodium polystyrene sulfonate acts over hours."},
 {stem:"Why is calcitriol used in CKD?",
  options:["It binds phosphorus","It is the active form of vitamin D, which failing kidneys can't produce","It lowers potassium","It treats anemia"],
  answer:1,
  why:"The kidneys activate vitamin D. In CKD, calcitriol replaces the active form, improving calcium absorption and suppressing PTH."},
 {type:"sata", stem:"Which nursing points apply to sodium polystyrene sulfonate with sorbitol? Select all that apply.",
  options:["Monitor for hypokalemia","Monitor for sodium and fluid retention","Report severe abdominal pain","It is the only treatment needed for acute hyperkalemia with ECG changes","Assess bowel sounds before giving"],
  answers:[0,1,2,4],
  why:"Monitor for hypokalemia and sodium/fluid retention, report severe abdominal pain (intestinal necrosis risk), and assess bowel sounds first — it is contraindicated with ileus or bowel obstruction. Its slow onset means it's not a stand-alone emergency treatment."}
],
"m3-meds-renal":[
 {stem:"What must be adequate for epoetin alfa to be effective?",
  options:["Potassium","Iron","Calcium","Sodium"],
  answer:1,
  why:"Iron is needed to make red blood cells, so iron levels are checked and supplements are often given with epoetin alfa."},
 {stem:"Which adverse effect is most common with epoetin alfa?",
  options:["Hypotension","Hypertension","Hypokalemia","Hearing loss"],
  answer:1,
  why:"Hypertension is a common adverse effect, and BP is monitored."},

{ id:"mathdose", title:"Dosage Calculations & Basic Conversions", kicker:"The building blocks every other calculation relies on",
  blocks:[
   {p:"Before any drip rate or weight-based dose can be calculated, you need to be fluent in the basic conversions underneath them — pounds to kilograms, and the metric ladder from kilograms down to micrograms. Almost every calculation error in practice traces back to a mistake at this level, not the fancier formula built on top of it."},
   {h:"Basic Dosage Calculation"},
   {p:"<strong>Formula:</strong> (Desired ÷ Have) × Quantity = Amount to administer"},
   {p:"<strong>Worked example:</strong> Order is 500 mg PO; available as 250 mg tablets. (500 ÷ 250) × 1 tablet = <strong>2 tablets</strong>."},
   {p:"<strong>Worked example 2:</strong> Order is 2 mg lorazepam; available as a 4 mg/mL vial. (2 ÷ 4) × 1 mL = <strong>0.5 mL</strong>."},

   {table:{head:["Conversion","Formula","Example"],rows:[
     ["Pounds → kilograms","lbs ÷ 2.2 = kg","154 lbs ÷ 2.2 = 70 kg"],
     ["Kilograms → pounds","kg × 2.2 = lbs","100 kg × 2.2 = 220 lbs"]]}},
   {hook:"Almost every weight-based drug calculation in this unit starts with converting the patient's weight to kilograms — if that first conversion is wrong, every step after it is wrong too, even if the rest of the math is done perfectly. This matters directly in this module for weight-based pediatric dosing (ADHD/ASD medications) and for BSA-based chemotherapy dosing."},
   {h:"Metric System Conversions — the 1000 rule"},
   {p:"Standard medical units (kg, g, mg, mcg) are each separated from their neighbor by a factor of 1000."},
   {table:{head:["Direction","Rule","Example"],rows:[
     ["Larger → smaller (kg→g, g→mg, mg→mcg)","Multiply by 1000 (move the decimal 3 places right)","2 g × 1000 = 2000 mg"],

{ id:"mathiv", title:"IV Flow Rates, Drip Rates & Concentration", kicker:"Getting fluid and medication into the vein at the right speed",
  blocks:[
   {p:"These formulas answer one of two questions: how fast should this infusion pump run (mL/hr), or how many drops per minute should a gravity IV be set to (gtt/min) when there's no pump involved? A third formula, concentration, sets up weight-based drip calculations."},
   {h:"Flow Rate / Infusion Rate (mL/hr) — for infusion pumps"},
   {p:"<strong>Formula:</strong> Total Volume (mL) ÷ Total Time (hr) = mL/hr"},
   {p:"<strong>Worked example:</strong> Infuse 1000 mL of Normal Saline over 8 hours. 1000 ÷ 8 = <strong>125 mL/hr</strong>."},
   {h:"Infusion Time — working backward from a known rate"},
   {p:"<strong>Formula:</strong> Total Volume (mL) ÷ Flow Rate (mL/hr) = Time (hours)"},
   {p:"<strong>Worked example:</strong> A 1000 mL bag is infusing at 125 mL/hr. How long will it last? 1000 ÷ 125 = <strong>8 hours</strong>."},
   {h:"Drip Rate (gtt/min) — for gravity IV tubing without a pump"},
   {p:"There are two equivalent ways to reach the same answer, depending on whether you already know the mL/hr rate or are starting from the total order."},
   {table:{head:["Starting point","Formula"],rows:[
     ["You already know mL/hr","(mL/hr ÷ 60) × Drop Factor (gtt/mL) = gtt/min"],
     ["You're starting from the total order","(Total Volume [mL] × Drop Factor [gtt/mL]) ÷ Time (minutes) = gtt/min"]]}},
   {p:"<strong>Worked example (method 1):</strong> Infuse at 125 mL/hr using tubing with a drop factor of 15 gtt/mL. First, mL/min: 125 ÷ 60 = 2.08 mL/min. Then: 2.08 × 15 = 31.2, rounded to <strong>31 gtt/min</strong>."},
   {p:"<strong>Worked example (method 2):</strong> Infuse 1000 mL over 8 hours (480 minutes) with a drop factor of 15 gtt/mL. (1000 × 15) ÷ 480 = 15,000 ÷ 480 = 31.25, rounded to <strong>31 gtt/min</strong> — the same answer either way."},
   {h:"IV Push Medication Rate"},
   {p:"A common general safety rule for IV push medications is roughly <strong>1 mL per minute</strong> unless the drug's specific administration guidelines say otherwise. <strong>Worked example:</strong> a 10 mL medication is administered over 10 minutes, consistent with the 1 mL/min rule. Pushing too fast is a common cause of adverse drug reactions — relevant here for IV push benzodiazepines (e.g., lorazepam for agitation/status epilepticus) and IV antihistamines."},
   {h:"Concentration Calculation — the setup step for weight-based drips"},
   {p:"<strong>Formula:</strong> (Total mg in the bag × 1000) ÷ Total mL in the bag = Concentration (mcg/mL)"},
   {p:"<strong>Worked example:</strong> A bag contains 400 mg of a drug in 250 mL of D5W. (400 × 1000) ÷ 250 = <strong>1600 mcg/mL</strong>."}
  ]
},
{ id:"mathcardiac", title:"Cardiac & Vasoactive Drip Calculations", kicker:"MAP, CPP, and weight-/unit-based infusions",
  blocks:[
   {p:"This lesson groups together the calculations that show up most often in critical care and high-alert medication administration — all of them either measure perfusion pressure directly, or calculate the pump rate for a drug that manipulates that pressure. Relevant here for a client in delirium tremens, an oncology patient in septic shock, or any client on a high-alert IV drip."},
   {h:"MAP — Mean Arterial Pressure"},
   {p:"<strong>Formula:</strong> (Systolic BP + [2 × Diastolic BP]) ÷ 3 = MAP"},
   {p:"<strong>Worked example:</strong> BP is 120/80. (120 + [2 × 80]) ÷ 3 = (120 + 160) ÷ 3 = <strong>93.3 mmHg</strong>."},
   {p:"MAP reflects the average pressure driving blood into the organs across the whole cardiac cycle — it's weighted toward diastole because the heart spends more time in diastole than systole. A MAP of roughly <strong>65 mmHg or higher</strong> is generally considered necessary to maintain adequate organ perfusion in a critically ill patient."},
   {h:"CPP — Cerebral Perfusion Pressure"},
   {p:"<strong>Formula:</strong> MAP − ICP = CPP"},
   {p:"<strong>Worked example:</strong> MAP is 93, ICP is 15. 93 − 15 = <strong>78 mmHg</strong>."},
   {hook:"CPP depends directly on MAP — if you already calculated MAP for a patient, you're one subtraction away from CPP. A CPP that drops too low (generally below ~60 mmHg) risks cerebral ischemia, which is why both numbers are tracked together in a patient with a head injury or elevated ICP."},
   {h:"Weight-Based Infusion (mcg/kg/min)"},
   {p:"<strong>Formula:</strong> (Desired mcg × kg × 60 minutes) ÷ Concentration (mcg/mL) = mL/hr"},
   {p:"<strong>Worked example:</strong> Order is 5 mcg/kg/min for an 80 kg patient, with a concentration of 1600 mcg/mL (from the concentration calculation in the previous lesson). (5 × 80 × 60) ÷ 1600 = <strong>15 mL/hr</strong>."},
   {h:"Units-Based Infusion (Units/kg/hr) — e.g., Heparin"},
   {p:"<strong>Formula:</strong> (Units × kg) ÷ Concentration (Units/mL) = mL/hr"},
   {p:"<strong>Worked example:</strong> Order is 12 Units/kg/hr for a 100 kg patient, with a concentration of 100 Units/mL. (12 × 100) ÷ 100 = <strong>12 mL/hr</strong>."},
   {hook:"Both weight-based and units-based drips are high-alert medications given by infusion pump only — the shared theme across every high-alert drug is a computerized pump, frequent reassessment, and a clear plan for what triggers stopping or adjusting the rate."}
  ]
},

  blocks:[
   {p:"Intake and output tracking is really just accounting for fluid — but a couple of categories have special rules that are easy to get wrong, and tonicity explains why the choice of IV fluid itself matters beyond just the volume. This is directly relevant to fluid management in cancer/chemotherapy patients, HIV/AIDS patients with diarrhea or wasting, and any client receiving IV psychiatric medications."},
   {h:"What counts as intake"},
   {list:[
    "<strong>Oral (PO) fluids</strong> — water, juice, soda, milk, coffee",
    "<strong>Liquid foods</strong> — soups, broths, gelatin, sherbet, sorbet, pudding",
    "<strong>Ice chips</strong> — recorded as <strong>half</strong> the original volume (200 mL of ice chips = 100 mL intake), since ice chips are mostly air/space between solid pieces",
    "<strong>IV fluids</strong> — maintenance fluids, boluses, and piggyback medications (like antibiotics)",
    "<strong>Tube feedings</strong> — formula and water flushes (relevant for a client with anorexia nervosa on enteral nutritional rehabilitation)"]},
   {h:"What counts as output"},
   {list:["Urine — voided, catheterized, or urostomy drainage","Emesis (vomitus) — relevant for a client with bulimia or chemotherapy-induced nausea","Liquid stool — diarrhea or colostomy drainage","Wound drainage — from JP drains, Hemovacs, or chest tubes","Suction — gastric (NG) or respiratory"]},
   {h:"Net Fluid Balance"},
   {p:"<strong>Formula:</strong> Total Intake − Total Output = Net Balance"},
   {p:"<strong>Worked example:</strong> Intake of 3000 mL, output of 800 mL. 3000 − 800 = <strong>+2200 mL</strong> (a positive balance, meaning the patient is retaining more fluid than they're losing)."},
   {h:"Insensible Loss"},
   {p:"Fluid lost through the skin and lungs that can't be directly measured. Standard estimate: <strong>600–900 mL/day</strong>, or roughly <strong>0.5 mL/kg/hr</strong>. <strong>Worked example:</strong> a 70 kg patient: 0.5 × 70 = 35 mL/hr, or roughly 840 mL/day."},
   {h:"Fluid Weight Calculation"},
   {p:"<strong>Rule of thumb:</strong> a 1 kg weight change equals roughly 1 L of fluid change. <strong>Worked example:</strong> a patient's weight rises 2 kg over two days — that's roughly a 2 L fluid gain, not necessarily 2 kg of actual tissue."},
   {hook:"An output under <b>30 mL/hr</b> is always reported as a potential emergency — it signals inadequate perfusion to the kidneys."},
   {h:"Tonicity — what different IV fluids do to cells"},
   {table:{head:["Type","Solute concentration vs. inside the cell","Effect on the cell","Examples","Clinical use"],rows:[
     ["Hypertonic","Higher outside the cell","Water leaves the cell — it shrinks (plasmolysis)","3% or 5% NaCl; 10% Dextrose in Water","Cerebral edema, severe hyponatremia"],
     ["Hypotonic","Lower outside the cell","Water enters the cell — it swells or bursts (cytolysis)","0.45% NaCl (half normal saline)","Dehydration — pushes water back into cells"],
     ["Isotonic","Equal inside and outside","No net water movement — equilibrium maintained","0.9% Normal Saline, Lactated Ringer's, D5W","Routine IV fluid replacement and hydration"]]}},
   {hook:"A simple way to remember the direction: <b>hyper</b>tonic pulls water <b>OUT</b> of the cell (think 'hyper' = high solute outside, pulling water toward it), while <b>hypo</b>tonic pushes water <b>IN</b>. Isotonic is the 'do no harm' default fluid."}
  ]
},
{ id:"mathbody", title:"Body Measurement: BMI & BSA", kicker:"Calculations that scale a dose — or a diagnosis — to the patient's size",
  blocks:[
   {p:"These two calculations both answer a version of the same question — how big is this patient, in a way that's useful for dosing or risk assessment? BMI is a general screening number used constantly in this module's eating-disorder content; BSA is a more precise scaling factor used specifically for chemotherapy dosing in the Cancer unit."},
   {h:"BMI — Body Mass Index"},
   {table:{head:["System","Formula"],rows:[
     ["Metric","Weight (kg) ÷ [Height (m)]²"],
     ["Imperial","[Weight (lbs) × 703] ÷ [Height (in)]²"]]}},
   {p:"<strong>Worked example (metric):</strong> Weight 70 kg, height 1.75 m. Square the height: 1.75 × 1.75 = 3.0625. Divide weight by that: 70 ÷ 3.0625 = <strong>22.86</strong> (normal weight range)."},
   {p:"<strong>Worked example (imperial):</strong> Weight 154 lbs, height 69 inches. 154 × 703 = 108,262. Square the height: 69 × 69 = 4,761. Divide: 108,262 ÷ 4,761 = <strong>22.74</strong> — the same result as the metric calculation, just arrived at with different starting units."},
   {hook:"This is exactly the calculation behind the BMI thresholds in the Anorexia Nervosa lesson: a BMI under 17 is a diagnostic marker of the disorder, and under 15 is considered extreme/life-threatening. Knowing how to compute BMI from a height and weight given in a case stem — not just recognize the threshold — is testable on its own."},
   {h:"BSA — Body Surface Area"},
   {p:"BSA approximates a patient's total skin surface area in square meters (m²), and it's used specifically for drugs with a narrow therapeutic index, chemotherapy agents, pediatric patients, and burn patients — situations where a small dosing error has an outsized effect. This is the calculation behind chemotherapy dosing in the Cancer unit."},
   {p:"<strong>Formula:</strong> BSA = √[(Height in cm × Weight in kg) ÷ 3600]"},
   {h:"Fully worked pediatric dosing example"},
   {p:"Order: a chemotherapy agent at 2 mg/m². Patient: 37 lb, 97 cm tall. Supply: 1 mg/mL."},
   {list:[
    "<strong>Step 1 — convert weight to kg:</strong> 37 lb ÷ 2.2 = 16.8 kg",
    "<strong>Step 2 — calculate BSA:</strong> √[(97 cm × 16.8 kg) ÷ 3600] = √[1629.6 ÷ 3600] = √0.4527 = <strong>0.67 m²</strong>",
    "<strong>Step 3 — calculate the dose in mg:</strong> 2 mg/m² × 0.67 m² = <strong>1.34 mg</strong>",
    "<strong>Step 4 — calculate the dose in mL:</strong> 1.34 mg ÷ 1 mg/mL = <strong>1.34 mL</strong> to administer"]},
   {hook:"Notice this whole calculation depends on the weight-to-kg conversion from the first Med Math lesson — get that first step wrong, and every subsequent step (BSA, mg dose, mL dose) inherits the error."}
  ]
},
{ id:"m3math-renal", title:"Renal Math: Urine Output, Fluid Restriction & Daily Weights", kicker:"The calculations behind the AKI, CKD, and fluid-balance lessons",
  blocks:[
   {h:"Hourly Urine Output (mL/kg/hr)"},
   {p:"<strong>Formula:</strong> Urine output (mL) ÷ Hours ÷ Weight (kg) = mL/kg/hr. The minimum acceptable adult output is about <strong>0.5 mL/kg/hr</strong> (roughly 30 mL/hr)."},
   {p:"<strong>Minimum for a given client:</strong> Weight (kg) × 0.5 = minimum mL/hr. A 70 kg client needs at least 70 × 0.5 = <strong>35 mL/hr</strong>."},
   {p:"<strong>Worked example:</strong> An 80 kg client voids 200 mL over 8 hours. 200 ÷ 8 = 25 mL/hr; 25 ÷ 80 = <strong>0.31 mL/kg/hr</strong> — below 0.5, so it's reported as an early warning of AKI."},
   {h:"24-Hour Output — naming the problem"},
   {table:{head:["24-hour urine output","Term"],rows:[
     ["Less than 400–500 mL","<strong>Oliguria</strong> (the oliguric phase of AKI: below 400 mL/day)"],
     ["Less than 50 mL","<strong>Anuria</strong>"],
     ["4–5 L/day","<strong>Diuretic phase</strong> of AKI — watch for fluid volume deficit"],
     ["More than 3 L/day after an obstruction is relieved","<strong>Postobstructive diuresis</strong>"]]}},
   {h:"Fluid Restriction"},
   {p:"<strong>Formula:</strong> Previous 24-hour urine output + about 500–600 mL (insensible losses) = Fluid allowance for the next 24 hours. (Some references use 500–800 mL.)"},
   {p:"<strong>Worked example:</strong> A client in the oliguric phase put out 350 mL of urine yesterday. 350 + 500 = 850 mL to 350 + 600 = 950 mL — a fluid allowance of about <strong>850–950 mL</strong> for today."},
   {hook:"The fluid allowance is spread across all 24 hours — with sips, ice chips, and frequent mouth care for thirst — and it has to include the fluid used to take medications."},
   {h:"Daily Weights — 1 kg = 1 L"},
   {p:"<strong>Rule:</strong> a 1 kg weight change equals about 1 L of fluid (about 2.2 lb per liter). Weigh at the same time, on the same scale, in the same clothing."},
   {p:"<strong>Worked example:</strong> Yesterday 72.0 kg; today 74.5 kg. 74.5 − 72.0 = 2.5 kg = about <strong>2.5 L of retained fluid</strong>."},
   {p:"<strong>Worked example (pounds):</strong> A weight gain of 4.4 lb ÷ 2.2 = 2 kg = about <strong>2 L</strong> of fluid."},
   {h:"BUN:Creatinine Ratio"},
   {p:"<strong>Formula:</strong> BUN ÷ Creatinine. Normal is about 10:1 to 20:1; <strong>above 20:1</strong> points toward a <strong>prerenal</strong> cause (dehydration, low perfusion)."},
   {table:{head:["BUN","Creatinine","Ratio","Points toward"],rows:[
     ["48 mg/dL","1.2 mg/dL","48 ÷ 1.2 = 40:1","Prerenal — BUN rising out of proportion (dehydration)"],
     ["80 mg/dL","8.0 mg/dL","80 ÷ 8 = 10:1","Intrarenal or postrenal — both rising together"]]}},
   {h:"Phosphate Binder Dose per Meal (Sevelamer)"},
   {p:"<strong>Formula:</strong> Total daily dose ÷ Number of meals the client actually eats = Dose per meal"},
   {p:"<strong>Worked example:</strong> Sevelamer 4,800 mg/day. Three meals a day: 4,800 ÷ 3 = <strong>1,600 mg with each meal</strong>. The same client skips breakfast and eats 2 meals: 4,800 ÷ 2 = <strong>2,400 mg with each meal</strong>."},
   {hook:"The number of meals comes from the client's eating pattern, not a standard schedule — fewer meals means a <b>bigger</b> dose with each meal. And no meal, no binder."},
   {h:"Maximum-Rate Problems"},
   {p:"<strong>Formula:</strong> Dose (mg) ÷ Maximum rate (mg/min) = Minimum time (minutes)"},
   {p:"<strong>Worked example:</strong> High-dose IV furosemide is infused no faster than <strong>4 mg/min</strong> (ototoxicity). For a 120 mg dose: 120 ÷ 4 = <strong>30 minutes minimum</strong>."},
   {hook:"Rapid IV furosemide is what causes the tinnitus and hearing loss — if the math says 30 minutes, it never goes in faster, even when the client is fluid overloaded."},
   {h:"Net Fluid Balance"},
   {p:"<strong>Formula:</strong> Total Intake − Total Output = Net Balance"},
   {p:"<strong>Worked example:</strong> Intake: PO 600 mL + IV 900 mL + ice chips 200 mL (counts as 100 mL) = 1,600 mL. Output: urine 450 mL + emesis 150 mL = 600 mL. 1,600 − 600 = <strong>+1,000 mL</strong> — a positive balance (fluid retention)."}
  ]
},
{ id:"m3math-dialysis", title:"Dialysis Fluid Math: Hemodialysis, PD & CRRT", kicker:"How much fluid came off — and how to count it",
  blocks:[
   {h:"Hemodialysis — Fluid Removal Goal"},
   {p:"<strong>Formula:</strong> Pre-dialysis weight − Dry (target) weight = Fluid to remove (1 kg = 1 L)"},
   {p:"<strong>Worked example:</strong> Pre-dialysis weight 78.4 kg; dry weight 76.0 kg. 78.4 − 76.0 = 2.4 kg = about <strong>2.4 L</strong> to remove. The post-dialysis weight confirms how much actually came off."},
   {h:"Peritoneal Dialysis — Net Ultrafiltration"},
   {p:"<strong>Formula:</strong> Outflow (drained) − Inflow (instilled) = Net fluid removed. A <strong>negative</strong> result means the client absorbed (retained) dialysate."},
   {table:{head:["Inflow","Outflow","Result","Meaning"],rows:[
     ["2,000 mL","2,500 mL","+500 mL","<strong>500 mL removed</strong> — recorded as output"],
     ["2,000 mL","1,800 mL","−200 mL","<strong>200 mL retained</strong> — counts toward intake; check for kinks, constipation, and position"]]}},
   {p:"<strong>Multiple exchanges:</strong> add the net result of each one. Exchanges of +300, +150, and −100 mL = <strong>+350 mL</strong> net removed. If drainage is short by <strong>500 mL or more</strong> over several exchanges, evaluate for fluid retention and notify the provider."},
   {hook:"PD outflow is not urine. Record the client's <b>true urine output</b> separately from the dialysate drained."},
   {h:"CRRT — Hourly Fluid Balance"},
   {p:"The nurse totals all intake and output <strong>every hour</strong> and adjusts to meet the ordered hourly balance goal."},
   {p:"<strong>Formula:</strong> Hourly net fluid removal needed = Hourly intake (IV fluids, meds, feedings, replacement fluid) + Desired hourly fluid loss"},
   {p:"<strong>Worked example:</strong> The goal is a net loss of 100 mL/hr. This hour the client receives IV fluid 50 mL + tube feeding 60 mL + IV meds 40 mL = 150 mL. To achieve −100 mL, the machine must remove 150 + 100 = <strong>250 mL</strong> of fluid from the client this hour."}
  ]
}
]};

{ id:"elim-dialysis-chart", title:"Dialysis Chart: Access Types & Dialysis Types", kicker:"The dialysis assignment — description, pros, cons, and nursing care for each access and each modality",
  blocks:[
   {p:"Dialysis requires reliable vascular or peritoneal access to remove waste products and excess fluid. The access types — Vascath, Permacath, AV graft, AV fistula, and Tenckhoff catheter — differ in design, longevity, infection risk, and which dialysis type they support."},
   {h:"Dialysis access types"},
   {table:{head:["Access","Brief description","Pros","Cons","Nursing care for this access"],rows:[
    ['<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#c0392b;margin-right:6px"></span><strong>Vascath</strong>',"A temporary, non-tunneled, double-lumen central venous catheter inserted into a large vein (internal jugular, femoral, or subclavian)","• Can be used <strong>immediately</strong><br>• Suitable for short-term/emergency dialysis (AKI)<br>• Inserted quickly at the bedside","• <strong>Highest infection risk</strong><br>• Not for long-term use<br>• Risk of thrombosis and central vein stenosis","• Strict aseptic dressing changes<br>• Monitor for infection<br>• Maintain patency (lock per protocol)<br>• <strong>Do not use for IV fluids, meds, or blood draws</strong>"],
    ['<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#d68910;margin-right:6px"></span><strong>Permacath</strong>',"A <strong>tunneled</strong>, cuffed central venous catheter designed for longer-term use","• Can be used <strong>immediately</strong><br>• Lasts longer than a Vascath<br>• Tunnel and cuff give <strong>lower infection risk than a Vascath</strong><br>• Bridge while a fistula or graft matures","• Still a higher infection risk than a fistula or graft<br>• Clotting and catheter malfunction","• Regular sterile catheter/dressing care<br>• Monitor the exit site for redness, drainage<br>• Maintain the <strong>heparin lock</strong><br>• Monitor for infection and thrombosis<br>• Dialysis staff use only"],
    ['<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#2e86c1;margin-right:6px"></span><strong>AV graft</strong>',"A synthetic tube tunneled under the skin connecting an artery to a vein","• Usable sooner than a fistula (about <strong>2–3 weeks</strong>)<br>• Option when the client's veins aren't suitable for a fistula","• <strong>Higher clotting (thrombosis) and infection risk</strong> than a fistula<br>• May need repeated interventions to stay open","• Palpate <strong>thrill</strong>, auscultate <strong>bruit</strong> every shift<br>• <strong>No BP, IVs, or blood draws</strong> on that arm<br>• Monitor for infection and clotting<br>• Teach access-arm care"],
    ['<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#1e8449;margin-right:6px"></span><strong>AV fistula</strong>',"A surgical connection of the client's own artery and vein, creating a durable access point","• <strong>Gold standard</strong> — best long-term access<br>• <strong>Lowest</strong> infection and clotting rates<br>• Longest-lasting","• Takes about <strong>1–3 months to mature</strong> before use<br>• Not suitable for every client (vessel quality)","• Palpate <strong>thrill</strong>, auscultate <strong>bruit</strong> every shift<br>• <strong>No BP, IVs, or blood draws</strong> on that arm<br>• No tight clothing/jewelry, heavy carrying, or sleeping on the arm<br>• Watch for steal syndrome (pale, cold hand)"],
    ['<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#8e44ad;margin-right:6px"></span><strong>Tenckhoff catheter</strong>',"A catheter surgically placed into the peritoneal cavity for <strong>peritoneal dialysis</strong>","• Allows <strong>home-based</strong> dialysis<br>• Avoids vascular access<br>• An alternative to hemodialysis","• <strong>Risk of peritonitis</strong><br>• Requires client training and adherence","• <strong>Strict aseptic technique</strong> for all connections/exchanges; mask<br>• Daily exit-site care<br>• Outflow should be clear; <strong>cloudy = infection</strong><br>• Monitor for fever and abdominal pain"]
   ]}},
   {h:"Dialysis types"},
   {table:{head:["Dialysis type","Brief description","Access that can be used","Pros","Cons"],rows:[
    ["<strong>Hemodialysis</strong>","Blood is filtered through a machine (artificial kidney) outside the body — usually about 3–4 hours, 3 times a week","Vascath, Permacath, AV graft, AV fistula","• Rapid, effective removal of wastes, fluid, and potassium<br>• In-center, or at home with training","• Requires vascular access<br>• Infection and clotting risk<br>• Rapid fluid shifts → hypotension, cramps, disequilibrium syndrome<br>• Strict schedule and diet; time-consuming"],
    ["<strong>CRRT</strong> (continuous renal replacement therapy)","A slower, continuous (24/7) form of blood filtration used in the ICU","Temporary dialysis catheter (Vascath); a tunneled catheter may also be used","• <strong>Gentle on BP</strong> — suited to hemodynamically unstable clients<br>• Continuous, steady fluid and solute removal","• ICU only; requires specialized equipment and close (often 1:1) nursing<br>• Filter clotting; frequent electrolyte monitoring<br>• Client is immobilized at the bedside"],
    ["<strong>Peritoneal dialysis</strong>","Dialysate is instilled into the abdomen, and the <strong>peritoneal membrane</strong> acts as the filter (fill, dwell, drain)","Tenckhoff catheter","• Daily, gradual dialysis with steadier fluid balance<br>• Done at home; more independence<br>• <strong>Avoids vascular access</strong><br>• More liberal diet (especially potassium)","• <strong>Risk of peritonitis</strong><br>• Requires client/caregiver training and adherence<br>• Glucose absorption (hyperglycemia, weight gain), protein loss, hernia risk"]
   ]}},
   {h:"Key insights"},
   {list:[
    "Vascular access types differ mainly in <strong>how long they last</strong>, their <strong>infection risk</strong>, and whether the client's vessels are suitable",
    "<strong>AV fistulas</strong> are the preferred long-term access because of low complication rates and durability, but they need time to mature and suitable veins",
    "<strong>Vascaths</strong> are essential for immediate dialysis but carry the highest infection and clotting risk",
    "<strong>Permacaths</strong> bridge short- and long-term use; tunneling reduces infection risk",
    "<strong>AV grafts</strong> are the alternative when a fistula isn't feasible, with higher complication risk",
    "The <strong>Tenckhoff catheter</strong> enables home peritoneal dialysis without vascular access but demands strict infection control",
    "<strong>CRRT</strong> is chosen for critically ill, unstable clients because it is gentle and continuous; it is not a home therapy"]},
   {h:"Nursing care across all access types"},
   {list:[
    "Infection prevention is paramount — strict aseptic technique, regular monitoring, client education",
    "Check patency: thrill and bruit for fistulas and grafts",
    "Teach limb protection, hygiene, and signs of complications",
    "Catheter care: dressing changes, locking/flushing protocols, surveillance for clotting or infection",
    "Peritoneal dialysis: make sure the client can perform sterile exchanges and recognizes early signs of peritonitis",
    "CRRT: hourly vital signs, filter checks, and frequent electrolytes"]}
  ],
  check:{stem:"A client with AKI needs dialysis today. Which access can be used immediately?",
   options:["AV fistula","AV graft","Vascath","Tenckhoff catheter"],
   answer:2,
   why:"A Vascath is a temporary central venous catheter that can be used right away. A fistula needs about 1–3 months to mature and a graft about 2–3 weeks."}
},
{ id:"sens-stations", title:"Sensory Stations Summary Chart", kicker:"The three station questions answered for all six disorders",
  blocks:[
   {p:"The sensory stations asked three questions for each disorder: (1) two ways the nurse can help the client adjust, (2) whether the alteration can cause an emergency and what the care is, and (3) which medications are appropriate and the nursing care for them."},
   {table:{head:["Disorder","Two ways to help the client adjust","Emergency? Care","Medications and nursing care"],rows:[
    ["<strong>Detached retina</strong>","Teach positioning and activity limits after repair; fall precautions and orientation while vision is impaired","<strong>YES</strong> — painless curtain/shadow, flashes, floaters. Immediate bed rest, <strong>cover both eyes</strong>, specialist ASAP","Post-op antibiotic and corticosteroid drops, dilating drops, analgesics, antiemetics (vomiting raises IOP). Teach drop technique; no air travel with a gas bubble"],
    ["<strong>Glaucoma</strong>","Teach lifelong daily drop use; teach head-turning to scan for lost peripheral vision; safety at home","<strong>Yes — acute angle-closure</strong>: severe pain, N/V, halos. Lower IOP fast (miotics, mannitol), then laser iridotomy","<strong>Beta blockers</strong> (timolol) — check HR/BP, caution in asthma/COPD, nasolacrimal occlusion. <strong>Prostaglandin analogs</strong> (latanoprost) — bedtime, iris darkening, eyelash growth. Avoid mydriatics/anticholinergics"],
    ["<strong>Cataracts</strong>","Reduce glare and improve lighting; safety for night driving; teach post-op activity restrictions","Not usually — gradual. Post-op complications (infection, increased IOP, detachment) are the emergencies","Pre-op dilating drops; post-op antibiotic, corticosteroid, and NSAID drops. Teach hand hygiene, technique, and schedule"],
    ["<strong>Hemianopsia</strong>","Place items on the unaffected side initially; teach the client to <strong>scan the room</strong> by turning the head to see both sides","<strong>No</strong> — a chronic post-stroke deficit. (New onset with other stroke signs = activate stroke protocol)","No eye drops for the hemianopsia itself; medications treat the stroke cause (anticoagulants, antiplatelets, antihypertensives)"],
    ["<strong>AMD</strong>","Daily Amsler grid monitoring; low-vision aids, magnifiers, bright task lighting; stop smoking","Not usually — but a sudden change may mean wet AMD; report promptly","Dry: AREDS2 vitamins. Wet: anti-VEGF intravitreal injections — monitor for eye pain, redness, vision change after injection (infection)"],
    ["<strong>Retinopathy</strong>","Tight glucose and BP control; annual dilated eye exams; adaptive devices for diabetes self-care","Can be — vitreous hemorrhage or detachment causes sudden vision loss","Diabetes and BP medications; anti-VEGF injections; laser therapy"]
   ]}}
  ],
  check:{stem:"Which two sensory station disorders are true emergencies when they present acutely?",
   options:["Cataracts and dry AMD","Retinal detachment and acute angle-closure glaucoma","Hemianopsia and cataracts","Open-angle glaucoma and dry AMD"],
   answer:1,
   why:"Retinal detachment and acute angle-closure glaucoma both threaten permanent vision loss within hours to days and need immediate treatment. Cataracts, dry AMD, and open-angle glaucoma develop gradually."}
},
{ id:"elim-cj", title:"Clinical Judgment Activity: Marie vs. Frank", kicker:"Two patients with the same BUN and creatinine — and opposite fluid problems",
  blocks:[
   {p:"This NurseThink activity compares two patients with <strong>identical</strong> BUN (80) and creatinine (3.96) whose presentations point in opposite directions. The patient charts are in the case tabs of this lesson's quiz. The worked answers below follow the activity's four clinical judgment steps."},
   {h:"The two patients"},
   {table:{head:["","Marie Hunter, 89","Frank Woods, 56"],rows:[
    ["<strong>Setting</strong>","Admitted from SNF — altered mental status, gradual decline over a week, poor intake","ED — shortness of breath and fatigue for 2 weeks"],
    ["<strong>History</strong>","GERD, cataracts, right-sided stroke 5 years ago (no residual effects), pacemaker for 3rd-degree heart block; Eliquis and Protonix daily; <strong>sulfa allergy</strong>","Diabetes, HTN, <strong>ESRD on dialysis for 10 years</strong>, CHF, COPD. Missed dialysis — wife has been sick and unable to drive him, no other support"],
    ["<strong>Assessment</strong>","Lethargic, confused, follows minimal commands; lungs clear; 1+ pulses; no edema; no urine output, no bladder distention","A&amp;O x4; <strong>crackles</strong>; <strong>bounding pulses</strong>, 2+ lower-extremity edema; + thrill and bruit in left AV fistula; small amount of urine"],
    ["<strong>Vitals</strong>","T 99.5, HR 115, RR 14, BP 105/62, SpO₂ 95%","T 98, HR 115, <strong>RR 32</strong>, <strong>BP 178/94</strong>, <strong>SpO₂ 84%</strong>"],
    ["<strong>Labs</strong>","<strong>Na 156</strong>, K 4.7, glucose 70, BUN 80, Cr 3.96, WBC 10.6, <strong>HCT 49</strong>, Hgb 12, Plt 200","<strong>Na 130</strong>, <strong>K 6.7</strong>, glucose 214, BUN 80, Cr 3.96, WBC 8.4, <strong>HCT 29, Hgb 8</strong>, Plt 215"]
   ]}},
   {h:"1. Recognizing cues"},
   {p:"<strong>Most concerning assessment / highest priority:</strong> For Marie, the combination of altered mental status, no urine output, tachycardia with a soft BP, and weak (1+) pulses — she is volume depleted and not perfusing her kidneys. For Frank, the <strong>SpO₂ of 84% with RR 32 and crackles</strong> is the highest priority (airway/breathing), immediately followed by the <strong>potassium of 6.7</strong>, which can cause a fatal dysrhythmia at any moment."},
   {p:"<strong>Interpreting the labs:</strong>"},
   {table:{head:["Lab","Marie","Frank"],rows:[
    ["<strong>Sodium</strong>","156 — <strong>hypernatremia</strong>: water lost/not taken in, so sodium is concentrated","130 — <strong>dilutional hyponatremia</strong>: retained water dilutes sodium"],
    ["<strong>Potassium</strong>","4.7 — normal","6.7 — <strong>critical hyperkalemia</strong>; kidneys can't excrete it and he's missed dialysis"],
    ["<strong>BUN / creatinine</strong>","80 / 3.96 — azotemia; ratio about 20:1, consistent with a <strong>prerenal</strong> (perfusion) cause","80 / 3.96 — azotemia from ESRD with no dialysis to clear wastes"],
    ["<strong>HCT / Hgb</strong>","49 / 12 — HCT <strong>elevated</strong> = <strong>hemoconcentration</strong> from dehydration","29 / 8 — <strong>anemia</strong> of CKD (no erythropoietin), made to look worse by dilution"],
    ["<strong>Glucose</strong>","70 — low-normal; poor intake","214 — hyperglycemia; diabetic"],
    ["<strong>WBC</strong>","10.6 — upper-normal; with a low-grade temp, keep infection on the radar as a cause of decline","8.4 — normal"]
   ]}},
   {h:"2. Analyzing cues — what's going on?"},
   {list:[
    "<strong>Marie:</strong> <strong>prerenal acute kidney injury</strong> from dehydration/hypovolemia (a week of poor intake in a frail older adult), with hypernatremia causing her altered mental status. No bladder distention argues against a postrenal cause",
    "<strong>Frank:</strong> <strong>ESRD with missed dialysis</strong> → fluid volume excess with pulmonary edema, critical hyperkalemia, dilutional hyponatremia, and uremic fatigue. The root cause is social — no transportation to dialysis"]},
   {h:"3. Prioritizing hypotheses and generating solutions"},
   {table:{head:["","Marie","Frank"],rows:[
    ["<strong>Priority treatment</strong>","<strong>IV fluid replacement</strong> to restore renal perfusion, correcting sodium <strong>slowly</strong>","<strong>Breathing and the heart first:</strong> high Fowler's, oxygen, cardiac monitor, emergency hyperkalemia treatment (calcium gluconate, insulin + dextrose, K⁺ binder), then <strong>emergent hemodialysis</strong> to remove both fluid and potassium"],
    ["<strong>Nursing care</strong>","Strict I&amp;O and hourly urine output; daily weight; lung sounds and vitals frequently (watch for overload — age, pacemaker/cardiac history); serial sodium, BUN, creatinine; neuro checks; fall, aspiration, and skin-breakdown precautions; bleeding precautions (Eliquis); goals-of-care discussion with the family","Continuous cardiac monitoring; frequent respiratory assessment and SpO₂; fluid and sodium restriction; protect the AV fistula arm (no BP/IV/lab draws) and confirm thrill and bruit; monitor glucose after insulin; strict I&amp;O and weights; <strong>social work / case management</strong> referral for dialysis transportation"]
   ]}},
   {h:"4. Evaluating outcomes"},
   {table:{head:["","Marie","Frank"],rows:[
    ["<strong>Expected outcomes</strong>","Urine output at least 0.5 mL/kg/hr; HR and BP normalizing; sodium trending down gradually; BUN/creatinine improving; mental status returning to baseline","SpO₂ above 92%, RR and lung sounds improving; K⁺ back to 3.5–5.5 with no dysrhythmias; BP down and weight back to dry weight; a transportation plan in place so he doesn't miss dialysis again"],
    ["<strong>Potential complications of treatment</strong>","<strong>Fluid overload</strong>/pulmonary edema from resuscitation in an 89-year-old with cardiac history; <strong>cerebral edema</strong> if sodium is corrected too fast; progression to intrarenal injury (ATN) if perfusion isn't restored; bleeding and fall injuries on Eliquis","Dysrhythmia or cardiac arrest before potassium is controlled; <strong>hypoglycemia</strong> after IV insulin; <strong>dialysis disequilibrium syndrome</strong> (very high BUN after a long gap); <strong>hypotension</strong> and cramping from rapid fluid removal; respiratory failure needing intubation"]
   ]}},
   {h:"Venn diagram — Marie, Frank, and the overlap"},
   {table:{head:["Marie only","Both","Frank only"],rows:[
    ["Fluid volume <strong>deficit</strong>; hypernatremia; hemoconcentration (HCT 49); low-normal BP; weak pulses; clear lungs; altered mental status; prerenal AKI (potentially reversible); sulfa allergy; on an anticoagulant","<strong>BUN 80, creatinine 3.96</strong>; HR 115; hypoactive bowel sounds; kidney failure driving a fluid and electrolyte crisis; need for close I&amp;O, weights, and lab trending; full code","Fluid volume <strong>excess</strong>; dilutional hyponatremia; <strong>hyperkalemia</strong>; anemia; hypertension; bounding pulses; crackles and hypoxemia; ESRD (irreversible); AV fistula; social barrier to care"]
   ]}},
   {hook:"Same kidney numbers, opposite fluid problems. The BUN and creatinine confirm that the kidneys aren't clearing waste — but the vital signs, lung sounds, pulses, sodium, and hematocrit are what tell you which direction the fluid has gone, and that decides whether the patient gets fluids or fluid removal."},
   {hook:"Marie's sulfa allergy matters for this module: furosemide and bumetanide are sulfonamide-derived loop diuretics. If she becomes fluid overloaded from resuscitation, flag the allergy before a loop diuretic is given."}
  ],
  check:{stem:"Marie and Frank have identical BUN and creatinine values. Which finding best distinguishes Marie's fluid problem from Frank's?",
   options:["Heart rate of 115","Hematocrit of 49 with a sodium of 156","Hypoactive bowel sounds","BUN of 80"],
   answer:1,
   why:"Marie's elevated hematocrit (hemoconcentration) and hypernatremia point to fluid volume deficit. Both patients share the heart rate, bowel sounds, and BUN, so those findings don't tell them apart."}
}
]};
