{ id:"mathiv", title:"IV Flow Rates, Drip Rates & Concentration", kicker:"Getting fluid and medication into the vein at the right speed",
  blocks:[
   {p:"These formulas answer one of two questions: how fast should this infusion pump run (mL/hr), or how many drops per minute should a gravity IV be set to (gtt/min) when there's no pump involved? A third formula, concentration, sets up weight-based drip calculations."},
   {h:"Flow Rate / Infusion Rate (mL/hr) — for infusion pumps"},
   {p:"<strong>Formula:</strong> Total Volume (mL) ÷ Total Time (hr) = mL/hr"},
   {p:"<strong>Worked example:</strong> Infuse 1000 mL of Normal Saline over 8 hours. 1000 ÷ 8 = <strong>125 mL/hr</strong>."},
   {h:"Infusion Time — working backward from a known rate"},
   {p:"<strong>Formula:</strong> Total Volume (mL) ÷ Flow Rate (mL/hr) = Time (hours)"},
   {p:"<strong>Worked example:</strong> A 1000 mL bag is infusing at 125 mL/hr. How long will it last? 1000 ÷ 125 = <strong>8 hours</strong>."},
   {h:"Drip Rate (gtt/min) — for gravity IV tubing without a pump"},
   {p:"There are two equivalent ways to reach the same answer, depending on whether you already know the mL/hr rate or are starting from the total order."},
   {table:{head:["Starting point","Formula"],rows:[
     ["You already know mL/hr","(mL/hr ÷ 60) × Drop Factor (gtt/mL) = gtt/min"],
     ["You're starting from the total order","(Total Volume [mL] × Drop Factor [gtt/mL]) ÷ Time (minutes) = gtt/min"]]}},
   {p:"<strong>Worked example (method 1):</strong> Infuse at 125 mL/hr using tubing with a drop factor of 15 gtt/mL. First, mL/min: 125 ÷ 60 = 2.08 mL/min. Then: 2.08 × 15 = 31.2, rounded to <strong>31 gtt/min</strong>."},
   {p:"<strong>Worked example (method 2):</strong> Infuse 1000 mL over 8 hours (480 minutes) with a drop factor of 15 gtt/mL. (1000 × 15) ÷ 480 = 15,000 ÷ 480 = 31.25, rounded to <strong>31 gtt/min</strong> — the same answer either way."},
   {h:"IV Push Medication Rate"},
   {p:"A common general safety rule for IV push medications is roughly <strong>1 mL per minute</strong> unless the drug's specific administration guidelines say otherwise. <strong>Worked example:</strong> a 10 mL medication is administered over 10 minutes, consistent with the 1 mL/min rule. Pushing too fast is a common cause of adverse drug reactions — relevant here for IV push benzodiazepines (e.g., lorazepam for agitation/status epilepticus) and IV antihistamines."},
   {h:"Concentration Calculation — the setup step for weight-based drips"},
   {p:"<strong>Formula:</strong> (Total mg in the bag × 1000) ÷ Total mL in the bag = Concentration (mcg/mL)"},
   {p:"<strong>Worked example:</strong> A bag contains 400 mg of a drug in 250 mL of D5W. (400 × 1000) ÷ 250 = <strong>1600 mcg/mL</strong>."}
  ]
},
{ id:"mathcardiac", title:"Cardiac & Vasoactive Drip Calculations", kicker:"MAP, CPP, and weight-/unit-based infusions",
  blocks:[
   {p:"This lesson groups together the calculations that show up most often in critical care and high-alert medication administration — all of them either measure perfusion pressure directly, or calculate the pump rate for a drug that manipulates that pressure. Relevant here for a client in delirium tremens, an oncology patient in septic shock, or any client on a high-alert IV drip."},
   {h:"MAP — Mean Arterial Pressure"},
   {p:"<strong>Formula:</strong> (Systolic BP + [2 × Diastolic BP]) ÷ 3 = MAP"},
   {p:"<strong>Worked example:</strong> BP is 120/80. (120 + [2 × 80]) ÷ 3 = (120 + 160) ÷ 3 = <strong>93.3 mmHg</strong>."},
   {p:"MAP reflects the average pressure driving blood into the organs across the whole cardiac cycle — it's weighted toward diastole because the heart spends more time in diastole than systole. A MAP of roughly <strong>65 mmHg or higher</strong> is generally considered necessary to maintain adequate organ perfusion in a critically ill patient."},
   {h:"CPP — Cerebral Perfusion Pressure"},
   {p:"<strong>Formula:</strong> MAP − ICP = CPP"},
   {p:"<strong>Worked example:</strong> MAP is 93, ICP is 15. 93 − 15 = <strong>78 mmHg</strong>."},
   {hook:"CPP depends directly on MAP — if you already calculated MAP for a patient, you're one subtraction away from CPP. A CPP that drops too low (generally below ~60 mmHg) risks cerebral ischemia, which is why both numbers are tracked together in a patient with a head injury or elevated ICP."},
   {h:"Weight-Based Infusion (mcg/kg/min)"},
   {p:"<strong>Formula:</strong> (Desired mcg × kg × 60 minutes) ÷ Concentration (mcg/mL) = mL/hr"},
   {p:"<strong>Worked example:</strong> Order is 5 mcg/kg/min for an 80 kg patient, with a concentration of 1600 mcg/mL (from the concentration calculation in the previous lesson). (5 × 80 × 60) ÷ 1600 = <strong>15 mL/hr</strong>."},
   {h:"Units-Based Infusion (Units/kg/hr) — e.g., Heparin"},
   {p:"<strong>Formula:</strong> (Units × kg) ÷ Concentration (Units/mL) = mL/hr"},
   {p:"<strong>Worked example:</strong> Order is 12 Units/kg/hr for a 100 kg patient, with a concentration of 100 Units/mL. (12 × 100) ÷ 100 = <strong>12 mL/hr</strong>."},
   {hook:"Both weight-based and units-based drips are high-alert medications given by infusion pump only — the shared theme across every high-alert drug is a computerized pump, frequent reassessment, and a clear plan for what triggers stopping or adjusting the rate."}
  ]
},
{ id:"mathfluid", title:"Fluid Balance, I&O & Tonicity", kicker:"Tracking what goes in, what comes out, and what IV fluids do to cells",
  blocks:[
   {p:"Intake and output tracking is really just accounting for fluid — but a couple of categories have special rules that are easy to get wrong, and tonicity explains why the choice of IV fluid itself matters beyond just the volume. This is directly relevant to fluid management in cancer/chemotherapy patients, HIV/AIDS patients with diarrhea or wasting, and any client receiving IV psychiatric medications."},
   {h:"What counts as intake"},
   {list:[
    "<strong>Oral (PO) fluids</strong> — water, juice, soda, milk, coffee",
    "<strong>Liquid foods</strong> — soups, broths, gelatin, sherbet, sorbet, pudding",
    "<strong>Ice chips</strong> — recorded as <strong>half</strong> the original volume (200 mL of ice chips = 100 mL intake), since ice chips are mostly air/space between solid pieces",
    "<strong>IV fluids</strong> — maintenance fluids, boluses, and piggyback medications (like antibiotics)",
    "<strong>Tube feedings</strong> — formula and water flushes (relevant for a client with anorexia nervosa on enteral nutritional rehabilitation)"]},
   {h:"What counts as output"},
   {list:["Urine — voided, catheterized, or urostomy drainage","Emesis (vomitus) — relevant for a client with bulimia or chemotherapy-induced nausea","Liquid stool — diarrhea or colostomy drainage","Wound drainage — from JP drains, Hemovacs, or chest tubes","Suction — gastric (NG) or respiratory"]},
   {h:"Net Fluid Balance"},
   {p:"<strong>Formula:</strong> Total Intake − Total Output = Net Balance"},
   {p:"<strong>Worked example:</strong> Intake of 3000 mL, output of 800 mL. 3000 − 800 = <strong>+2200 mL</strong> (a positive balance, meaning the patient is retaining more fluid than they're losing)."},
   {h:"Insensible Loss"},
   {p:"Fluid lost through the skin and lungs that can't be directly measured. Standard estimate: <strong>600–900 mL/day</strong>, or roughly <strong>0.5 mL/kg/hr</strong>. <strong>Worked example:</strong> a 70 kg patient: 0.5 × 70 = 35 mL/hr, or roughly 840 mL/day."},
   {h:"Fluid Weight Calculation"},
   {p:"<strong>Rule of thumb:</strong> a 1 kg weight change equals roughly 1 L of fluid change. <strong>Worked example:</strong> a patient's weight rises 2 kg over two days — that's roughly a 2 L fluid gain, not necessarily 2 kg of actual tissue."},
   {hook:"An output under <b>30 mL/hr</b> is always reported as a potential emergency — it signals inadequate perfusion to the kidneys."},
   {h:"Tonicity — what different IV fluids do to cells"},
   {table:{head:["Type","Solute concentration vs. inside the cell","Effect on the cell","Examples","Clinical use"],rows:[
     ["Hypertonic","Higher outside the cell","Water leaves the cell — it shrinks (plasmolysis)","3% or 5% NaCl; 10% Dextrose in Water","Cerebral edema, severe hyponatremia"],
     ["Hypotonic","Lower outside the cell","Water enters the cell — it swells or bursts (cytolysis)","0.45% NaCl (half normal saline)","Dehydration — pushes water back into cells"],
     ["Isotonic","Equal inside and outside","No net water movement — equilibrium maintained","0.9% Normal Saline, Lactated Ringer's, D5W","Routine IV fluid replacement and hydration"]]}},
   {hook:"A simple way to remember the direction: <b>hyper</b>tonic pulls water <b>OUT</b> of the cell (think 'hyper' = high solute outside, pulling water toward it), while <b>hypo</b>tonic pushes water <b>IN</b>. Isotonic is the 'do no harm' default fluid."}
  ]
},
{ id:"mathbody", title:"Body Measurement: BMI & BSA", kicker:"Calculations that scale a dose — or a diagnosis — to the patient's size",
  blocks:[
   {p:"These two calculations both answer a version of the same question — how big is this patient, in a way that's useful for dosing or risk assessment? BMI is a general screening number used constantly in this module's eating-disorder content; BSA is a more precise scaling factor used specifically for chemotherapy dosing in the Cancer unit."},
   {h:"BMI — Body Mass Index"},
   {table:{head:["System","Formula"],rows:[
     ["Metric","Weight (kg) ÷ [Height (m)]²"],
     ["Imperial","[Weight (lbs) × 703] ÷ [Height (in)]²"]]}},
   {p:"<strong>Worked example (metric):</strong> Weight 70 kg, height 1.75 m. Square the height: 1.75 × 1.75 = 3.0625. Divide weight by that: 70 ÷ 3.0625 = <strong>22.86</strong> (normal weight range)."},
   {p:"<strong>Worked example (imperial):</strong> Weight 154 lbs, height 69 inches. 154 × 703 = 108,262. Square the height: 69 × 69 = 4,761. Divide: 108,262 ÷ 4,761 = <strong>22.74</strong> — the same result as the metric calculation, just arrived at with different starting units."},
   {hook:"This is exactly the calculation behind the BMI thresholds in the Anorexia Nervosa lesson: a BMI under 17 is a diagnostic marker of the disorder, and under 15 is considered extreme/life-threatening. Knowing how to compute BMI from a height and weight given in a case stem — not just recognize the threshold — is testable on its own."},
   {h:"BSA — Body Surface Area"},
   {p:"BSA approximates a patient's total skin surface area in square meters (m²), and it's used specifically for drugs with a narrow therapeutic index, chemotherapy agents, pediatric patients, and burn patients — situations where a small dosing error has an outsized effect. This is the calculation behind chemotherapy dosing in the Cancer unit."},
   {p:"<strong>Formula:</strong> BSA = √[(Height in cm × Weight in kg) ÷ 3600]"},
   {h:"Fully worked pediatric dosing example"},
   {p:"Order: a chemotherapy agent at 2 mg/m². Patient: 37 lb, 97 cm tall. Supply: 1 mg/mL."},
   {list:[
    "<strong>Step 1 — convert weight to kg:</strong> 37 lb ÷ 2.2 = 16.8 kg",
    "<strong>Step 2 — calculate BSA:</strong> √[(97 cm × 16.8 kg) ÷ 3600] = √[1629.6 ÷ 3600] = √0.4527 = <strong>0.67 m²</strong>",
    "<strong>Step 3 — calculate the dose in mg:</strong> 2 mg/m² × 0.67 m² = <strong>1.34 mg</strong>",
    "<strong>Step 4 — calculate the dose in mL:</strong> 1.34 mg ÷ 1 mg/mL = <strong>1.34 mL</strong> to administer"]},
   {hook:"Notice this whole calculation depends on the weight-to-kg conversion from the first Med Math lesson — get that first step wrong, and every subsequent step (BSA, mg dose, mL dose) inherits the error."}
  ]
},
{ id:"m3math-renal", title:"Renal Math: Urine Output, Fluid Restriction & Daily Weights", kicker:"The calculations behind the AKI, CKD, and fluid-balance lessons",
  blocks:[
   {h:"Hourly Urine Output (mL/kg/hr)"},
   {p:"<strong>Formula:</strong> Urine output (mL) ÷ Hours ÷ Weight (kg) = mL/kg/hr. The minimum acceptable adult output is about <strong>0.5 mL/kg/hr</strong> (roughly 30 mL/hr)."},
   {p:"<strong>Minimum for a given client:</strong> Weight (kg) × 0.5 = minimum mL/hr. A 70 kg client needs at least 70 × 0.5 = <strong>35 mL/hr</strong>."},
   {p:"<strong>Worked example:</strong> An 80 kg client voids 200 mL over 8 hours. 200 ÷ 8 = 25 mL/hr; 25 ÷ 80 = <strong>0.31 mL/kg/hr</strong> — below 0.5, so it's reported as an early warning of AKI."},
   {h:"24-Hour Output — naming the problem"},
   {table:{head:["24-hour urine output","Term"],rows:[
     ["Less than 400–500 mL","<strong>Oliguria</strong> (the oliguric phase of AKI: below 400 mL/day)"],
     ["Less than 50 mL","<strong>Anuria</strong>"],
     ["4–5 L/day","<strong>Diuretic phase</strong> of AKI — watch for fluid volume deficit"],
     ["More than 3 L/day after an obstruction is relieved","<strong>Postobstructive diuresis</strong>"]]}},
   {h:"Fluid Restriction"},
   {p:"<strong>Formula:</strong> Previous 24-hour urine output + about 500–600 mL (insensible losses) = Fluid allowance for the next 24 hours. (Some references use 500–800 mL.)"},
   {p:"<strong>Worked example:</strong> A client in the oliguric phase put out 350 mL of urine yesterday. 350 + 500 = 850 mL to 350 + 600 = 950 mL — a fluid allowance of about <strong>850–950 mL</strong> for today."},
   {hook:"The fluid allowance is spread across all 24 hours — with sips, ice chips, and frequent mouth care for thirst — and it has to include the fluid used to take medications."},
   {h:"Daily Weights — 1 kg = 1 L"},
   {p:"<strong>Rule:</strong> a 1 kg weight change equals about 1 L of fluid (about 2.2 lb per liter). Weigh at the same time, on the same scale, in the same clothing."},
   {p:"<strong>Worked example:</strong> Yesterday 72.0 kg; today 74.5 kg. 74.5 − 72.0 = 2.5 kg = about <strong>2.5 L of retained fluid</strong>."},
   {p:"<strong>Worked example (pounds):</strong> A weight gain of 4.4 lb ÷ 2.2 = 2 kg = about <strong>2 L</strong> of fluid."},
   {h:"BUN:Creatinine Ratio"},
   {p:"<strong>Formula:</strong> BUN ÷ Creatinine. Normal is about 10:1 to 20:1; <strong>above 20:1</strong> points toward a <strong>prerenal</strong> cause (dehydration, low perfusion)."},
   {table:{head:["BUN","Creatinine","Ratio","Points toward"],rows:[
     ["48 mg/dL","1.2 mg/dL","48 ÷ 1.2 = 40:1","Prerenal — BUN rising out of proportion (dehydration)"],
     ["80 mg/dL","8.0 mg/dL","80 ÷ 8 = 10:1","Intrarenal or postrenal — both rising together"]]}},
   {h:"Maximum-Rate Problems"},
   {p:"<strong>Formula:</strong> Dose (mg) ÷ Maximum rate (mg/min) = Minimum time (minutes)"},
   {p:"<strong>Worked example:</strong> High-dose IV furosemide is infused no faster than <strong>4 mg/min</strong> (ototoxicity). For a 120 mg dose: 120 ÷ 4 = <strong>30 minutes minimum</strong>."},
   {hook:"Rapid IV furosemide is what causes the tinnitus and hearing loss — if the math says 30 minutes, it never goes in faster, even when the client is fluid overloaded."},
   {h:"Net Fluid Balance"},
   {p:"<strong>Formula:</strong> Total Intake − Total Output = Net Balance"},
   {p:"<strong>Worked example:</strong> Intake: PO 600 mL + IV 900 mL + ice chips 200 mL (counts as 100 mL) = 1,600 mL. Output: urine 450 mL + emesis 150 mL = 600 mL. 1,600 − 600 = <strong>+1,000 mL</strong> — a positive balance (fluid retention)."}
  ]
},
{ id:"m3math-dialysis", title:"Dialysis Fluid Math: Hemodialysis, PD & CRRT", kicker:"How much fluid came off — and how to count it",
  blocks:[
   {h:"Hemodialysis — Fluid Removal Goal"},
   {p:"<strong>Formula:</strong> Pre-dialysis weight − Dry (target) weight = Fluid to remove (1 kg = 1 L)"},
   {p:"<strong>Worked example:</strong> Pre-dialysis weight 78.4 kg; dry weight 76.0 kg. 78.4 − 76.0 = 2.4 kg = about <strong>2.4 L</strong> to remove. The post-dialysis weight confirms how much actually came off."},
   {h:"Peritoneal Dialysis — Net Ultrafiltration"},
   {p:"<strong>Formula:</strong> Outflow (drained) − Inflow (instilled) = Net fluid removed. A <strong>negative</strong> result means the client absorbed (retained) dialysate."},
   {table:{head:["Inflow","Outflow","Result","Meaning"],rows:[
     ["2,000 mL","2,500 mL","+500 mL","<strong>500 mL removed</strong> — recorded as output"],
     ["2,000 mL","1,800 mL","−200 mL","<strong>200 mL retained</strong> — counts toward intake; check for kinks, constipation, and position"]]}},
   {p:"<strong>Multiple exchanges:</strong> add the net result of each one. Exchanges of +300, +150, and −100 mL = <strong>+350 mL</strong> net removed. If drainage is short by <strong>500 mL or more</strong> over several exchanges, evaluate for fluid retention and notify the provider."},
   {hook:"PD outflow is not urine. Record the client's <b>true urine output</b> separately from the dialysate drained."},
   {h:"CRRT — Hourly Fluid Balance"},
   {p:"The nurse totals all intake and output <strong>every hour</strong> and adjusts to meet the ordered hourly balance goal."},
   {p:"<strong>Formula:</strong> Hourly net fluid removal needed = Hourly intake (IV fluids, meds, feedings, replacement fluid) + Desired hourly fluid loss"},
   {p:"<strong>Worked example:</strong> The goal is a net loss of 100 mL/hr. This hour the client receives IV fluid 50 mL + tube feeding 60 mL + IV meds 40 mL = 150 mL. To achieve −100 mL, the machine must remove 150 + 100 = <strong>250 mL</strong> of fluid from the client this hour."}
  ]
}
]};

{ id:"m3nums-lytes", title:"Electrolytes, ABGs & the Renal Diet", kicker:"Ranges, the renal failure pattern, hyperkalemia ECG progression, and diet targets",

{ id:"elim-dialysis-chart", title:"Dialysis Chart: Access Types & Dialysis Types", kicker:"The dialysis assignment — description, pros, cons, and nursing care for each access and each modality",
  blocks:[
   {p:"Dialysis requires reliable vascular or peritoneal access to remove waste products and excess fluid. The access types — Vascath, Permacath, AV graft, AV fistula, and Tenckhoff catheter — differ in design, longevity, infection risk, and which dialysis type they support."},
   {h:"Dialysis access types"},
   {table:{head:["Access","Brief description","Pros","Cons","Nursing care for this access"],rows:[
    ['<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#c0392b;margin-right:6px"></span><strong>Vascath</strong>',"A temporary, non-tunneled, double-lumen central venous catheter inserted into a large vein (internal jugular, femoral, or subclavian)","• Can be used <strong>immediately</strong><br>• Suitable for short-term/emergency dialysis (AKI)<br>• Inserted quickly at the bedside","• <strong>Highest infection risk</strong><br>• Not for long-term use<br>• Risk of thrombosis and central vein stenosis","• Strict aseptic dressing changes<br>• Monitor for infection<br>• Maintain patency (lock per protocol)<br>• <strong>Do not use for IV fluids, meds, or blood draws</strong>"],
    ['<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#d68910;margin-right:6px"></span><strong>Permacath</strong>',"A <strong>tunneled</strong>, cuffed central venous catheter designed for longer-term use","• Can be used <strong>immediately</strong><br>• Lasts longer than a Vascath<br>• Tunnel and cuff give <strong>lower infection risk than a Vascath</strong><br>• Bridge while a fistula or graft matures","• Still a higher infection risk than a fistula or graft<br>• Clotting and catheter malfunction","• Regular sterile catheter/dressing care<br>• Monitor the exit site for redness, drainage<br>• Maintain the <strong>heparin lock</strong><br>• Monitor for infection and thrombosis<br>• Dialysis staff use only"],
    ['<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#2e86c1;margin-right:6px"></span><strong>AV graft</strong>',"A synthetic tube tunneled under the skin connecting an artery to a vein","• Usable sooner than a fistula (about <strong>2–3 weeks</strong>)<br>• Option when the client's veins aren't suitable for a fistula","• <strong>Higher clotting (thrombosis) and infection risk</strong> than a fistula<br>• May need repeated interventions to stay open","• Palpate <strong>thrill</strong>, auscultate <strong>bruit</strong> every shift<br>• <strong>No BP, IVs, or blood draws</strong> on that arm<br>• Monitor for infection and clotting<br>• Teach access-arm care"],
    ['<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#1e8449;margin-right:6px"></span><strong>AV fistula</strong>',"A surgical connection of the client's own artery and vein, creating a durable access point","• <strong>Gold standard</strong> — best long-term access<br>• <strong>Lowest</strong> infection and clotting rates<br>• Longest-lasting","• Takes about <strong>1–3 months to mature</strong> before use<br>• Not suitable for every client (vessel quality)","• Palpate <strong>thrill</strong>, auscultate <strong>bruit</strong> every shift<br>• <strong>No BP, IVs, or blood draws</strong> on that arm<br>• No tight clothing/jewelry, heavy carrying, or sleeping on the arm<br>• Watch for steal syndrome (pale, cold hand)"],
    ['<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#8e44ad;margin-right:6px"></span><strong>Tenckhoff catheter</strong>',"A catheter surgically placed into the peritoneal cavity for <strong>peritoneal dialysis</strong>","• Allows <strong>home-based</strong> dialysis<br>• Avoids vascular access<br>• An alternative to hemodialysis","• <strong>Risk of peritonitis</strong><br>• Requires client training and adherence","• <strong>Strict aseptic technique</strong> for all connections/exchanges; mask<br>• Daily exit-site care<br>• Outflow should be clear; <strong>cloudy = infection</strong><br>• Monitor for fever and abdominal pain"]
   ]}},
   {h:"Dialysis types"},
   {table:{head:["Dialysis type","Brief description","Access that can be used","Pros","Cons"],rows:[
    ["<strong>Hemodialysis</strong>","Blood is filtered through a machine (artificial kidney) outside the body — usually about 3–4 hours, 3 times a week","Vascath, Permacath, AV graft, AV fistula","• Rapid, effective removal of wastes, fluid, and potassium<br>• In-center, or at home with training","• Requires vascular access<br>• Infection and clotting risk<br>• Rapid fluid shifts → hypotension, cramps, disequilibrium syndrome<br>• Strict schedule and diet; time-consuming"],
    ["<strong>CRRT</strong> (continuous renal replacement therapy)","A slower, continuous (24/7) form of blood filtration used in the ICU","Temporary dialysis catheter (Vascath); a tunneled catheter may also be used","• <strong>Gentle on BP</strong> — suited to hemodynamically unstable clients<br>• Continuous, steady fluid and solute removal","• ICU only; requires specialized equipment and close (often 1:1) nursing<br>• Filter clotting; frequent electrolyte monitoring<br>• Client is immobilized at the bedside"],
    ["<strong>Peritoneal dialysis</strong>","Dialysate is instilled into the abdomen, and the <strong>peritoneal membrane</strong> acts as the filter (fill, dwell, drain)","Tenckhoff catheter","• Daily, gradual dialysis with steadier fluid balance<br>• Done at home; more independence<br>• <strong>Avoids vascular access</strong><br>• More liberal diet (especially potassium)","• <strong>Risk of peritonitis</strong><br>• Requires client/caregiver training and adherence<br>• Glucose absorption (hyperglycemia, weight gain), protein loss, hernia risk"]

   {h:"Key insights"},
   {list:[
    "Vascular access types differ mainly in <strong>how long they last</strong>, their <strong>infection risk</strong>, and whether the client's vessels are suitable",

    "<strong>Vascaths</strong> are essential for immediate dialysis but carry the highest infection and clotting risk",
    "<strong>Permacaths</strong> bridge short- and long-term use; tunneling reduces infection risk",
    "<strong>AV grafts</strong> are the alternative when a fistula isn't feasible, with higher complication risk",
    "The <strong>Tenckhoff catheter</strong> enables home peritoneal dialysis without vascular access but demands strict infection control",
    "<strong>CRRT</strong> is chosen for critically ill, unstable clients because it is gentle and continuous; it is not a home therapy"]},

   {table:{head:["Disorder","Two ways to help the client adjust","Emergency? Care","Medications and nursing care"],rows:[
    ["<strong>Detached retina</strong>","Teach positioning and activity limits after repair; fall precautions and orientation while vision is impaired","<strong>YES</strong> — painless curtain/shadow, flashes, floaters. Immediate bed rest, <strong>cover both eyes</strong>, specialist ASAP","Post-op antibiotic and corticosteroid drops, dilating drops, analgesics, antiemetics (vomiting raises IOP). Teach drop technique; no air travel with a gas bubble"],
    ["<strong>Glaucoma</strong>","Teach lifelong daily drop use; teach head-turning to scan for lost peripheral vision; safety at home","<strong>Yes — acute angle-closure</strong>: severe pain, N/V, halos. Lower IOP fast (miotics, mannitol), then laser iridotomy","<strong>Beta blockers</strong> (timolol) — check HR/BP, caution in asthma/COPD, nasolacrimal occlusion. <strong>Prostaglandin analogs</strong> (latanoprost) — bedtime, iris darkening, eyelash growth. Avoid mydriatics/anticholinergics"],
    ["<strong>Cataracts</strong>","Reduce glare and improve lighting; safety for night driving; teach post-op activity restrictions","Not usually — gradual. Post-op complications (infection, increased IOP, detachment) are the emergencies","Pre-op dilating drops; post-op antibiotic, corticosteroid, and NSAID drops. Teach hand hygiene, technique, and schedule"],
    ["<strong>Hemianopsia</strong>","Place items on the unaffected side initially; teach the client to <strong>scan the room</strong> by turning the head to see both sides","<strong>No</strong> — a chronic post-stroke deficit. (New onset with other stroke signs = activate stroke protocol)","No eye drops for the hemianopsia itself; medications treat the stroke cause (anticoagulants, antiplatelets, antihypertensives)"],
    ["<strong>AMD</strong>","Daily Amsler grid monitoring; low-vision aids, magnifiers, bright task lighting; stop smoking","Not usually — but a sudden change may mean wet AMD; report promptly","Dry: AREDS2 vitamins. Wet: anti-VEGF intravitreal injections — monitor for eye pain, redness, vision change after injection (infection)"],
    ["<strong>Retinopathy</strong>","Tight glucose and BP control; annual dilated eye exams; adaptive devices for diabetes self-care","Can be — vitreous hemorrhage or detachment causes sudden vision loss","Diabetes and BP medications; anti-VEGF injections; laser therapy"]
   ]}}
  ],
  check:{stem:"Which two sensory station disorders are true emergencies when they present acutely?",
   options:["Cataracts and dry AMD","Retinal detachment and acute angle-closure glaucoma","Hemianopsia and cataracts","Open-angle glaucoma and dry AMD"],
   answer:1,
   why:"Retinal detachment and acute angle-closure glaucoma both threaten permanent vision loss within hours to days and need immediate treatment. Cataracts, dry AMD, and open-angle glaucoma develop gradually."}
},
{ id:"elim-cj", title:"Clinical Judgment Activity: Marie vs. Frank", kicker:"Two patients with the same BUN and creatinine — and opposite fluid problems",
  blocks:[
   {p:"This NurseThink activity compares two patients with <strong>identical</strong> BUN (80) and creatinine (3.96) whose presentations point in opposite directions. The patient charts are in the case tabs of this lesson's quiz. The worked answers below follow the activity's four clinical judgment steps."},
   {h:"The two patients"},
   {table:{head:["","Marie Hunter, 89","Frank Woods, 56"],rows:[
    ["<strong>Setting</strong>","Admitted from SNF — altered mental status, gradual decline over a week, poor intake","ED — shortness of breath and fatigue for 2 weeks"],
    ["<strong>History</strong>","GERD, cataracts, right-sided stroke 5 years ago (no residual effects), pacemaker for 3rd-degree heart block; Eliquis and Protonix daily; <strong>sulfa allergy</strong>","Diabetes, HTN, <strong>ESRD on dialysis for 10 years</strong>, CHF, COPD. Missed dialysis — wife has been sick and unable to drive him, no other support"],
    ["<strong>Assessment</strong>","Lethargic, confused, follows minimal commands; lungs clear; 1+ pulses; no edema; no urine output, no bladder distention","A&amp;O x4; <strong>crackles</strong>; <strong>bounding pulses</strong>, 2+ lower-extremity edema; + thrill and bruit in left AV fistula; small amount of urine"],
    ["<strong>Vitals</strong>","T 99.5, HR 115, RR 14, BP 105/62, SpO₂ 95%","T 98, HR 115, <strong>RR 32</strong>, <strong>BP 178/94</strong>, <strong>SpO₂ 84%</strong>"],
    ["<strong>Labs</strong>","<strong>Na 156</strong>, K 4.7, glucose 70, BUN 80, Cr 3.96, WBC 10.6, <strong>HCT 49</strong>, Hgb 12, Plt 200","<strong>Na 130</strong>, <strong>K 6.7</strong>, glucose 214, BUN 80, Cr 3.96, WBC 8.4, <strong>HCT 29, Hgb 8</strong>, Plt 215"]
   ]}},
   {h:"1. Recognizing cues"},
   {p:"<strong>Most concerning assessment / highest priority:</strong> For Marie, the combination of altered mental status, no urine output, tachycardia with a soft BP, and weak (1+) pulses — she is volume depleted and not perfusing her kidneys. For Frank, the <strong>SpO₂ of 84% with RR 32 and crackles</strong> is the highest priority (airway/breathing), immediately followed by the <strong>potassium of 6.7</strong>, which can cause a fatal dysrhythmia at any moment."},
   {p:"<strong>Interpreting the labs:</strong>"},
   {table:{head:["Lab","Marie","Frank"],rows:[
    ["<strong>Sodium</strong>","156 — <strong>hypernatremia</strong>: water lost/not taken in, so sodium is concentrated","130 — <strong>dilutional hyponatremia</strong>: retained water dilutes sodium"],
    ["<strong>Potassium</strong>","4.7 — normal","6.7 — <strong>critical hyperkalemia</strong>; kidneys can't excrete it and he's missed dialysis"],
    ["<strong>BUN / creatinine</strong>","80 / 3.96 — azotemia; ratio about 20:1, consistent with a <strong>prerenal</strong> (perfusion) cause","80 / 3.96 — azotemia from ESRD with no dialysis to clear wastes"],
    ["<strong>HCT / Hgb</strong>","49 / 12 — HCT <strong>elevated</strong> = <strong>hemoconcentration</strong> from dehydration","29 / 8 — <strong>anemia</strong> of CKD (no erythropoietin), made to look worse by dilution"],
    ["<strong>Glucose</strong>","70 — low-normal; poor intake","214 — hyperglycemia; diabetic"],
    ["<strong>WBC</strong>","10.6 — upper-normal; with a low-grade temp, keep infection on the radar as a cause of decline","8.4 — normal"]
   ]}},
   {h:"2. Analyzing cues — what's going on?"},
   {list:[
    "<strong>Marie:</strong> <strong>prerenal acute kidney injury</strong> from dehydration/hypovolemia (a week of poor intake in a frail older adult), with hypernatremia causing her altered mental status. No bladder distention argues against a postrenal cause",
    "<strong>Frank:</strong> <strong>ESRD with missed dialysis</strong> → fluid volume excess with pulmonary edema, critical hyperkalemia, dilutional hyponatremia, and uremic fatigue. The root cause is social — no transportation to dialysis"]},
   {h:"3. Prioritizing hypotheses and generating solutions"},
   {table:{head:["","Marie","Frank"],rows:[
    ["<strong>Priority treatment</strong>","<strong>IV fluid replacement</strong> to restore renal perfusion, correcting sodium <strong>slowly</strong>","<strong>Breathing and the heart first:</strong> high Fowler's, oxygen, cardiac monitor, emergency hyperkalemia treatment (calcium gluconate, insulin + dextrose, K⁺ binder), then <strong>emergent hemodialysis</strong> to remove both fluid and potassium"],
    ["<strong>Nursing care</strong>","Strict I&amp;O and hourly urine output; daily weight; lung sounds and vitals frequently (watch for overload — age, pacemaker/cardiac history); serial sodium, BUN, creatinine; neuro checks; fall, aspiration, and skin-breakdown precautions; bleeding precautions (Eliquis); goals-of-care discussion with the family","Continuous cardiac monitoring; frequent respiratory assessment and SpO₂; fluid and sodium restriction; protect the AV fistula arm (no BP/IV/lab draws) and confirm thrill and bruit; monitor glucose after insulin; strict I&amp;O and weights; <strong>social work / case management</strong> referral for dialysis transportation"]
   ]}},
   {h:"4. Evaluating outcomes"},
   {table:{head:["","Marie","Frank"],rows:[
    ["<strong>Expected outcomes</strong>","Urine output at least 0.5 mL/kg/hr; HR and BP normalizing; sodium trending down gradually; BUN/creatinine improving; mental status returning to baseline","SpO₂ above 92%, RR and lung sounds improving; K⁺ back to 3.5–5.0 with no dysrhythmias; BP down and weight back to dry weight; a transportation plan in place so he doesn't miss dialysis again"],
    ["<strong>Potential complications of treatment</strong>","<strong>Fluid overload</strong>/pulmonary edema from resuscitation in an 89-year-old with cardiac history; <strong>cerebral edema</strong> if sodium is corrected too fast; progression to intrarenal injury (ATN) if perfusion isn't restored; bleeding and fall injuries on Eliquis","Dysrhythmia or cardiac arrest before potassium is controlled; <strong>hypoglycemia</strong> after IV insulin; <strong>dialysis disequilibrium syndrome</strong> (very high BUN after a long gap); <strong>hypotension</strong> and cramping from rapid fluid removal; respiratory failure needing intubation"]
   ]}},
   {h:"Venn diagram — Marie, Frank, and the overlap"},
   {table:{head:["Marie only","Both","Frank only"],rows:[
    ["Fluid volume <strong>deficit</strong>; hypernatremia; hemoconcentration (HCT 49); low-normal BP; weak pulses; clear lungs; altered mental status; prerenal AKI (potentially reversible); sulfa allergy; on an anticoagulant","<strong>BUN 80, creatinine 3.96</strong>; HR 115; hypoactive bowel sounds; kidney failure driving a fluid and electrolyte crisis; need for close I&amp;O, weights, and lab trending; full code","Fluid volume <strong>excess</strong>; dilutional hyponatremia; <strong>hyperkalemia</strong>; anemia; hypertension; bounding pulses; crackles and hypoxemia; ESRD (irreversible); AV fistula; social barrier to care"]
   ]}},
   {hook:"Same kidney numbers, opposite fluid problems. The BUN and creatinine confirm that the kidneys aren't clearing waste — but the vital signs, lung sounds, pulses, sodium, and hematocrit are what tell you which direction the fluid has gone, and that decides whether the patient gets fluids or fluid removal."},
   {hook:"Marie's sulfa allergy matters for this module: furosemide and bumetanide are sulfonamide-derived loop diuretics. If she becomes fluid overloaded from resuscitation, flag the allergy before a loop diuretic is given."}
  ],
  check:{stem:"Marie and Frank have identical BUN and creatinine values. Which finding best distinguishes Marie's fluid problem from Frank's?",
   options:["Heart rate of 115","Hematocrit of 49 with a sodium of 156","Hypoactive bowel sounds","BUN of 80"],
   answer:1,
   why:"Marie's elevated hematocrit (hemoconcentration) and hypernatremia point to fluid volume deficit. Both patients share the heart rate, bowel sounds, and BUN, so those findings don't tell them apart."}
}
]};

   {h:"Mnemonics used across this section"},

   {h:"Acute Kidney Injury (AKI) vs. Chronic Kidney Disease (CKD)"},
   {table:{head:["Feature","AKI","CKD"],rows:[

     ["<strong>Primary causes</strong>","Prerenal: hypovolemia, shock, heart failure. Intrarenal: nephrotoxic drugs, infection, ischemia. Postrenal: obstruction (stones, BPH)","<strong>Diabetes mellitus</strong> (leading cause) and <strong>hypertension</strong>"],
     ["<strong>Diagnostic criteria</strong>","Sudden rise in creatinine/BUN and/or a rapid drop in urine output (oliguria)","GFR below 60 mL/min for 3 months or more, or evidence of kidney damage (proteinuria)"],

     ["<strong>Treatment focus</strong>","<strong>Rescue:</strong> treat the underlying cause (fluids for prerenal, remove obstruction for postrenal), manage acute electrolyte shifts","<strong>Maintenance:</strong> slow progression (BP/glucose control), manage complications (phosphate binders, epoetin alfa), prepare for dialysis/transplant"],

     ["<strong>Intrarenal</strong>","<em>Inside</em> the kidney — direct tissue damage","<strong>Nephrotoxins:</strong> NSAIDs, contrast dye, gentamicin, vancomycin. <strong>Infection:</strong> glomerulonephritis","<strong>Remove the toxin/cause</strong> — restrict fluids (if oliguric), dialysis if severe"],
     ["<strong>Postrenal</strong>","<em>After</em> the kidney — obstruction/blockage","<strong>Stones</strong> (renal calculi), <strong>BPH</strong> (enlarged prostate), tumors","<strong>Relieve the obstruction</strong> — surgery, lithotripsy, or Foley catheter"]]}},

   {h:"Dialysis access types"},
   {table:{head:["Access","Description","Pros","Cons","Nursing care"],rows:[
     ["<strong>Vascath</strong>","Temporary, non-tunneled, double-lumen catheter","Immediate use for acute needs (AKI)","High infection risk; not permanent","Strict sterile dressing changes; do not use for fluids/meds"],

   {table:{head:["Access","Rules"],rows:[

{ id:"m3chart-lytes", title:"Fluids, Electrolytes, ABGs & Renal Diet Charts", kicker:"Acid–base imbalances, compensation, IV fluids, renal electrolytes, and the renal diet",
  blocks:[
   {h:"Acid–base imbalances"},
   {table:{head:["Imbalance","The problem","Common causes","Priority treatment"],rows:[
     ["<strong>Respiratory acidosis</strong>","Lungs are retaining CO₂ (hypoventilation)","COPD, asthma, opioid overdose, pneumonia","<strong>Improve ventilation</strong> — oxygen, incentive spirometry, naloxone (if opioid), BiPAP/intubation"],
     ["<strong>Respiratory alkalosis</strong>","Lungs are blowing off CO₂ (hyperventilation)","Anxiety/panic attack, pain, fever, high altitude","<strong>Slow the breathing</strong> — paper bag breathing, treat pain/anxiety"],
     ["<strong>Metabolic acidosis</strong>","Kidneys losing bicarbonate or retaining acid","Renal failure (AKI/CKD), severe diarrhea, DKA (ketones)","<strong>Fix the cause</strong> — dialysis (renal), insulin (DKA), antidiarrheals"],
     ["<strong>Metabolic alkalosis</strong>","Stomach losing acid","Vomiting, NG suctioning, antacid overuse","<strong>Stop the loss</strong> — antiemetics, stop suctioning, replace electrolytes (K⁺)"]]}},
   {h:"Legend: normal ranges"},
   {table:{head:["Value","Range","Reading it"],rows:[
     ["<strong>pH</strong>","7.35–7.45","Below 7.35 = acidic; above 7.45 = alkalotic"],
     ["<strong>PaCO₂</strong> (respiratory)","35–45 mmHg","35 = alkalotic end; 45 = acidic end. <strong>CO₂ is an acid</strong>"],
     ["<strong>HCO₃⁻</strong> (metabolic)","22–26 mEq/L","22 = acidic end; 26 = alkalotic end. <strong>Bicarb is a base</strong>"]]}},
   {h:"Uncompensated — pH abnormal; one system is causing the problem and the other hasn't started fixing it"},
   {table:{head:["Imbalance","pH","PaCO₂","HCO₃⁻"],rows:[
     ["<strong>Respiratory acidosis</strong>","↓ Low (acid)","↑ High (acid)","Normal"],
     ["<strong>Respiratory alkalosis</strong>","↑ High (alk)","↓ Low (alk)","Normal"],
     ["<strong>Metabolic acidosis</strong>","↓ Low (acid)","Normal","↓ Low (acid)"],
     ["<strong>Metabolic alkalosis</strong>","↑ High (alk)","Normal","↑ High (alk)"]]}},
   {h:"Partially compensated — pH still abnormal; the opposing system has started to help, so all three are abnormal"},
   {table:{head:["Imbalance","pH","PaCO₂","HCO₃⁻"],rows:[
     ["<strong>Respiratory acidosis</strong>","↓ Low","↑ High (cause)","↑ High (fixing)"],
     ["<strong>Respiratory alkalosis</strong>","↑ High","↓ Low (cause)","↓ Low (fixing)"],
     ["<strong>Metabolic acidosis</strong>","↓ Low","↓ Low (fixing)","↓ Low (cause)"],
     ["<strong>Metabolic alkalosis</strong>","↑ High","↑ High (fixing)","↑ High (cause)"]]}},
   {h:"Fully compensated — pH back to normal; CO₂ and HCO₃⁻ both abnormal because the body is working hard to hold the balance"},
   {table:{head:["Imbalance (original cause)","pH (normal)","PaCO₂","HCO₃⁻"],rows:[
     ["<strong>Respiratory acidosis</strong>","Normal (low side, 7.35–7.39)","↑ High","↑ High"],
     ["<strong>Respiratory alkalosis</strong>","Normal (high side, 7.41–7.45)","↓ Low","↓ Low"],
     ["<strong>Metabolic acidosis</strong>","Normal (low side, 7.35–7.39)","↓ Low","↓ Low"],
     ["<strong>Metabolic alkalosis</strong>","Normal (high side, 7.41–7.45)","↑ High","↑ High"]]}},
   {h:"ABG compensation logic (quick check)"},
   {table:{head:["Status","Rule"],rows:[
     ["<strong>Uncompensated</strong>","pH abnormal, and either CO₂ <strong>or</strong> HCO₃⁻ is normal (one organ hasn't started helping yet)"],
     ["<strong>Partially compensated</strong>","All three values (pH, CO₂, HCO₃⁻) are abnormal"],
     ["<strong>Fully compensated</strong>","pH normal (7.35–7.45), but CO₂ and HCO₃⁻ are still abnormal"]]}},
   {hook:"pH 7.31 (acid), CO₂ 50 (acid), HCO₃⁻ 28 (base) = <b>partially compensated respiratory acidosis</b> — the kidneys (HCO₃⁻) are trying to fix a respiratory problem, but the pH isn't back to normal yet."},
   {h:"Clinical applications"},
   {table:{head:["Topic","Clinical application"],rows:[
     ["<strong>Kussmaul respirations</strong>","The lungs' attempt to compensate for metabolic acidosis by blowing off CO₂. In a renal client, expect the pH to be low (below 7.35)"],
     ["<strong>Trousseau's & Chvostek's signs</strong>","Caused by hypocalcemia. If positive, the client is at high risk for seizures and laryngeal spasm"]]}},
   {h:"IV fluid solutions \"cheat sheet\""},
   {table:{head:["Type","Examples","Fluid shift","Primary use & safety risks"],rows:[
     ["<strong>Isotonic</strong>","0.9% normal saline, lactated Ringer's (LR)","<strong>Stays put</strong> — expands intravascular volume without moving fluid in or out of cells","<strong>Use:</strong> volume replacement (hypovolemia, shock, CPR). <strong>Risk:</strong> fluid volume overload — check lung sounds"],
     ["<strong>Hypotonic</strong>","0.45% saline (½ NS), 2.5% dextrose","<strong>Moves into cells</strong> — pulls fluid from the vessels into the cells","<strong>Use:</strong> severe cellular dehydration (DKA, HHS). <strong>Risk:</strong> cerebral edema — never give with a head injury"],
     ["<strong>Hypertonic</strong>","3% saline, D10W, D50W, albumin (colloid)","<strong>Moves out of cells</strong> — pulls fluid from cells/tissue into the vessels","<strong>Use:</strong> severe hyponatremia or cerebral edema. <strong>Risk:</strong> rapid fluid overload (pulmonary edema) — give slowly"]]}},
   {h:"The contradiction rule"},
   {table:{head:["Product","Why it's a problem in renal failure"],rows:[
     ["<strong>Lactated Ringer's</strong>","Great for volume, but often contraindicated in renal failure because it contains <strong>potassium</strong>, which can worsen hyperkalemia"],
     ["<strong>Aluminum-based antacids</strong>","Avoided in CKD — risk of <strong>aluminum toxicity</strong>, which can lead to bone disease and even dementia"],
     ["<strong>Magnesium-containing antacids/laxatives</strong> (Milk of Magnesia)","The kidneys can't excrete magnesium — hypermagnesemia"]]}},
   {h:"Renal-specific electrolyte imbalances"},
   {table:{head:["Imbalance","Lab cue","Recognize (cues/red flags)","Take action"],rows:[
     ["<strong>Hyperkalemia</strong>","K⁺ above 5.0 mEq/L","Tall, peaked T waves; widened QRS; muscle weakness; cardiac arrest","<strong>Cardiac monitor immediately.</strong> Stabilize the heart: IV <strong>calcium gluconate</strong>; remove K⁺ (Kayexalate)"],
     ["<strong>Hyperphosphatemia</strong>","PO₄³⁻ above 4.5 mg/dL","Severe itching (pruritus/uremic frost), soft tissue calcifications, bone pain","<strong>Bind it:</strong> sevelamer or calcium acetate (PhosLo) with the <strong>first bite of every meal</strong>"],
     ["<strong>Hypocalcemia</strong>","Ca²⁺ below 8.5 mg/dL","<strong>Trousseau's</strong> (BP-cuff spasm), <strong>Chvostek's</strong> (facial twitch), tetany, seizures","<strong>Seizure precautions.</strong> Inverse relationship: treat the high phosphorus first to help calcium rise; vitamin D and calcium supplements"],
     ["<strong>Hypermagnesemia</strong>","Mg²⁺ above 2.5 mEq/L","Diminished deep tendon reflexes (DTRs), lethargy, bradycardia","Avoid magnesium-containing antacids or laxatives (Milk of Magnesia)"]]}},
   {h:"Sodium & magnesium imbalances"},
   {table:{head:["Imbalance","Lab cue","Recognize","Take action"],rows:[
     ["<strong>Hyponatremia</strong>","Na⁺ below 135 mEq/L","Headache, confusion, lethargy, twitching, N/V, seizures (cells swell)","Fluid restriction for dilutional; 3% saline only if severe/symptomatic — slowly; seizure precautions"],
     ["<strong>Hypernatremia</strong>","Na⁺ above 145 mEq/L","SALT: flushed skin, agitation, low-grade fever, thirst (cells shrink)","Replace water gradually (about 48 hours) to avoid cerebral edema; restrict sodium"],
     ["<strong>Hypermagnesemia</strong>","Mg²⁺ above 2.5 mEq/L","RENAL: reflexes decreased, ECG changes/bradycardia, N/V, flushed, lethargy; respiratory depression","Stop magnesium products; fluids + loop diuretic if kidneys work; calcium gluconate; dialysis (magnesium-free dialysate)"],
     ["<strong>Hypomagnesemia</strong>","Mg²⁺ below 1.5 mEq/L","STARVED: seizures, tetany, arrhythmias, rapid HR, hyperactive DTRs; digoxin toxicity","Magnesium replacement (IV no faster than 150 mg/min); cardiac monitor; seizure precautions"]]}},
   {hook:"<b>The calcium–phosphorus see-saw:</b> when phosphorus rises because the kidneys can't excrete it, calcium drops. The failing kidney also can't activate vitamin D. The body steals calcium from the bones to balance the blood — that's <b>renal bone disease</b>."},
   {h:"The renal diet (CKD & ESRD focus)"},
   {table:{head:["Nutrient","High (avoid/limit)","Low (safer)","Nurse tip"],rows:[
     ["<strong>Potassium (K⁺)</strong>","Bananas, oranges, potatoes, spinach, tomatoes, avocados","Apples, berries, grapes, green beans, cabbage","<strong>Avoid salt substitutes</strong> (potassium chloride). The kidneys can't excrete it → lethal dysrhythmias"],
     ["<strong>Phosphorus</strong>","Dairy (milk, cheese, yogurt), nuts, dark colas, whole grains","Rice milk, sorbet, clear sodas, white bread/rice","\"Double jeopardy\" foods like chocolate and dairy are high in both K⁺ and phosphorus. High phosphorus pulls calcium from bones"],
     ["<strong>Sodium (Na⁺)</strong>","Canned soups, processed meats, pickled foods, soy sauce","Fresh herbs, lemon juice, \"no salt added\" canned vegetables","Rinse canned fish or vegetables to remove excess salt. Sodium causes water retention, HTN, and edema"],
     ["<strong>Protein</strong>","Excessive meat, poultry, or eggs (pre-dialysis CKD)","Small portions of high-biological-value protein (egg whites)","Limit protein before dialysis; once on dialysis, protein may be increased to replace losses"],
     ["<strong>Fluid</strong>","Prevents fluid volume overload","Count as fluid: water, ice, Jell-O, ice cream — anything liquid at room temperature","Use small cups; suck on hard candy or gum for thirst"]]}},
   {hook:"<b>Renal diet rule of thumb:</b> if it's \"healthy\" elsewhere, it's often dangerous in renal failure — bananas, spinach, whole grains, and oranges are all restricted for their potassium and phosphorus."}
  ]
},
{ id:"m3chart-meds", title:"Medication Safety Charts", kicker:"Renal and sensory medications — critical assessments, contraindications, and strategic tips",

function shuffleExam(bank){
  const caseBlock = bank.filter(q=>q.caseId);
  const others = bank.filter(q=>!q.caseId).slice();
  for(let i=others.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [others[i],others[j]] = [others[j],others[i]];
  }
  const insertAt = Math.floor(Math.random()*(others.length+1));
  return others.slice(0,insertAt).concat(caseBlock, others.slice(insertAt));
}
function curBank(){ return S.shuffledBank || QUIZ[S.id]; }


function renderCaseTabs(caseId){
  const c = CASES[caseId];
  let h = '<div class="case-box"><div class="case-title">'+c.title+'</div><div class="case-tabs">';
  c.tabs.forEach((t,i)=>{
    h += '<button class="case-tab'+(S.activeTab===i?" active":"")+'" data-tab="'+i+'">'+t.label+"</button>";
  });
  h += '</div><div class="case-panel">';
  c.tabs[S.activeTab].blocks.forEach(b => h += blk(b));
  h += "</div></div>";
  return h;
}

function blk(b){
  if(b.h) return "<h4>"+b.h+"</h4>";
  if(b.p) return "<p>"+b.p+"</p>";
  if(b.list) return "<ul>"+b.list.map(i=>"<li>"+i+"</li>").join("")+"</ul>";
  if(b.hook) return '<div class="hook">'+b.hook+"</div>";
  if(b.img) return '<figure class="figure"><img src="'+b.img+'" alt="'+(b.caption||"")+'" loading="lazy">'+(b.caption?'<figcaption>'+b.caption+"</figcaption>":"")+"</figure>";
  if(b.table) return '<div class="tbl-wrap"><table><thead><tr>'+b.table.head.map(x=>"<th>"+x+"</th>").join("")+
    "</tr></thead><tbody>"+b.table.rows.map(r=>"<tr>"+r.map(c=>"<td>"+c+"</td>").join("")+"</tr>").join("")+
    "</tbody></table></div>";
  return "";
}

function qHTML(q, label){
  const A = ["A","B","C","D","E","F"], p = S.pick, sub = S.submitted;
  let h = '<div class="q">'+(label?'<div class="lbl">'+label+"</div>":"")+'<p class="stem">'+q.stem+"</p>";
  q.options.forEach((o,i)=>{
    let c = "opt";
    if(sub){ if(i===q.answer) c+=" right"; else if(i===p) c+=" mine"; }
    else if(i===p) c+=" picked";
    h += '<button class="'+c+'" data-p="'+i+'"'+(sub?" disabled":"")+"><b>"+A[i]+"</b>  "+o+"</button>";
  });
  if(!sub){
    h += '<div class="acts"><button data-submit-mc="1"'+(p===null?" disabled":"")+'>Submit answer</button></div>';
  } else {
    const ok = p === q.answer;
    h += '<p class="verdict '+(ok?"y":"n")+'">'+(ok?"Correct":"Answer: "+A[q.answer])+"</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function sataHTML(q){
  const A = ["A","B","C","D","E","F"], sel = S.multi, sub = S.submitted;
  let h = '<div class="q"><div class="sata-note">Select all that apply</div><p class="stem">'+q.stem+"</p>";
  q.options.forEach((o,i)=>{
    let c = "opt sata", isSel = sel.includes(i), isCorrect = q.answers.includes(i);
    if(sub){
      if(isCorrect && isSel) c+=" right";
      else if(isCorrect && !isSel) c+=" missed";
      else if(!isCorrect && isSel) c+=" mine";
    } else if(isSel) c+=" picked";
    h += '<button class="'+c+'" data-t="'+i+'"'+(sub?" disabled":"")+"><b>"+(isSel?"\u2611":"\u2610")+"</b>  "+o+"</button>";
  });
  if(!sub){
    h += '<div class="acts"><button data-submit="1">Submit answer</button></div>';
  } else {
    const ok = sel.slice().sort((a,b)=>a-b).join(",") === q.answers.slice().sort((a,b)=>a-b).join(",");
    const ansText = q.answers.map(i=>A[i]).join(", ");
    h += '<p class="verdict '+(ok?"y":"n")+'">'+(ok?"Correct":"Answer: "+ansText)+"</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function fitbHTML(q){
  const sub = S.submitted;
  let h = '<div class="q"><div class="sata-note">Fill in the blank</div><p class="stem">'+q.stem+"</p>";
  if(!sub){
    h += '<input type="text" inputmode="decimal" class="fitb-input" id="fitbInput" placeholder="Your answer" value="'+S.textAnswer+'">';
    h += '<div class="acts"><button data-submit-fitb="1">Submit answer</button></div>';
  } else {
    const ok = S.fitbCorrect;

    h += '<p class="verdict '+(ok?"y":"n")+'">'+(ok?"Correct":"Correct answer: "+q.answer)+"</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function gtpalHTML(q){

    h += '<div class="acts"><button data-submit-gtpal="1">Submit answer</button></div>';
  } else {

    const correctStr = letters.map((l,i)=>l+q.answers[i]).join(" ");

}

function clozeHTML(q){
  const sub = S.submitted;
  let text = q.template;
  q.blanks.forEach((b,i)=>{
    const selVal = S.clozeSel[i];
    let opts = '<option value="">choose…</option>'+b.options.map((o,oi)=>'<option value="'+oi+'"'+(selVal===oi?" selected":"")+'>'+o+"</option>").join("");
    let cls = "blank-select";
    if(sub) cls += selVal===b.correct ? " right" : " wrong";
    text = text.replace("{"+i+"}", '<select class="'+cls+'" data-cloze-blank="'+i+'"'+(sub?" disabled":"")+'>'+opts+"</select>");
  });
  let h = '<div class="q"><div class="sata-note">Drop-Down (Cloze) — choose the correct word for each blank</div><p class="cloze-text">'+text+"</p>";
  const allAnswered = q.blanks.every((_,i)=>S.clozeSel[i]!==undefined);
  if(!sub){
    h += '<div class="acts"><button data-submit-cloze="1"'+(!allAnswered?" disabled":"")+'>Submit answer</button></div>';
  } else {
    const correctCount = q.blanks.filter((b,i)=>S.clozeSel[i]===b.correct).length;
    const ok = correctCount === q.blanks.length;
    h += '<p class="verdict '+(ok?"y":"n")+'">'+correctCount+" of "+q.blanks.length+" blanks correct — "+S.lastPoints.toFixed(2)+" pt (partial credit)</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function hotspotHTML(q){

function dragdropHTML(q){
  const sub = S.submitted;
  let h = '<div class="q"><div class="sata-note">Drag and Drop — tap an item, then tap its category</div><p class="stem">'+q.stem+"</p>";
  const unplaced = q.items.map((_,idx)=>idx).filter(idx => S.ddPlace[idx] === undefined);
  h += '<div class="dd-pool">';
  unplaced.forEach(idx=>{
    h += '<button class="dd-chip'+(S.ddSel===idx?" sel":"")+'" data-dd-pick="'+idx+'"'+(sub?" disabled":"")+'>'+q.items[idx]+"</button>";
  });
  if(!unplaced.length) h += '<span style="color:var(--dim);font-size:13px">All items placed</span>';
  h += "</div>";
  h += '<div class="dd-bins">';
  q.bins.forEach((bin,binIdx)=>{
    h += '<div class="dd-bin" data-dd-bin="'+binIdx+'"><div class="dd-bin-label">'+bin+"</div>";
    q.items.forEach((item,idx)=>{
      if(S.ddPlace[idx] !== binIdx) return;
      let c = "dd-chip";
      if(sub){ c += q.correctBin[idx] === binIdx ? " right" : " wrong"; }
      h += '<button class="'+c+'" data-dd-unplace="'+idx+'"'+(sub?" disabled":"")+'>'+item+"</button>";
    });
    h += "</div>";
  });
  h += "</div>";
  const allPlaced = q.items.every((_,idx)=>S.ddPlace[idx] !== undefined);
  if(!sub){
    h += '<div class="acts"><button data-submit-dd="1"'+(!allPlaced?" disabled":"")+'>Submit answer</button></div>';
  } else {
    const correctCount = q.items.filter((_,idx)=>S.ddPlace[idx]===q.correctBin[idx]).length;
    const ok = correctCount === q.items.length;
    h += '<p class="verdict '+(ok?"y":"n")+'">'+correctCount+" of "+q.items.length+" placed correctly — "+S.lastPoints.toFixed(2)+" pt (partial credit)</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function orderingHTML(q){

    S.orderArr = q.items.map((_,i)=>i);
    for(let i=S.orderArr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [S.orderArr[i],S.orderArr[j]]=[S.orderArr[j],S.orderArr[i]]; }

      h += '<span class="order-btns">'+
        (pos>0?'<button data-order-up="'+pos+'">↑</button>':"")+

  if(!sub){
    h += '<div class="acts"><button data-submit-order="1">Submit answer</button></div>';
  } else {
    const correctCount = S.orderArr.filter((itemIdx,pos)=>itemIdx===pos).length;
    const ok = correctCount === S.orderArr.length;
    h += '<p class="verdict '+(ok?"y":"n")+'">'+correctCount+" of "+S.orderArr.length+" in the correct position — "+S.lastPoints.toFixed(2)+" pt (partial credit)</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function matrixHTML(q){

  let h = '<div class="q"><div class="sata-note">Matrix/Grid — one answer per row</div><p class="stem">'+q.stem+"</p>";
  h += '<table class="matrix-table"><thead><tr><th></th>'+q.cols.map(c=>"<th>"+c+"</th>").join("")+"</tr></thead><tbody>";
  q.rows.forEach((row,rIdx)=>{

      const checked = S.matrixSel[rIdx]===cIdx;
      h += '<td><input type="radio" name="mrow'+rIdx+'" data-matrix-row="'+rIdx+'" data-matrix-col="'+cIdx+'"'+(checked?" checked":"")+(sub?" disabled":"")+"></td>";
    });
    h += "</tr>";
  });
  h += "</tbody></table>";
  const allAnswered = q.rows.every((_,rIdx)=>S.matrixSel[rIdx]!==undefined);
  if(!sub){
    h += '<div class="acts"><button data-submit-matrix="1"'+(!allAnswered?" disabled":"")+'>Submit answer</button></div>';
  } else {
    const correctCount = q.rows.filter((_,rIdx)=>S.matrixSel[rIdx]===q.correct[rIdx]).length;
    const ok = correctCount === q.rows.length;
    h += '<p class="verdict '+(ok?"y":"n")+'">'+correctCount+" of "+q.rows.length+" rows correct — "+S.lastPoints.toFixed(2)+" pt (partial credit)</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function bowtieHTML(q){
  const sub = S.submitted;
  let h = '<div class="q"><div class="sata-note">Bowtie — pick actions, the condition, and parameters</div><p class="stem">'+q.stem+"</p>";
  h += '<div class="bowtie-wrap">';
  h += '<div class="bowtie-col"><div class="bowtie-col-label">Actions to Take (choose '+q.correctActions.length+')</div>';
  q.actionOptions.forEach((opt,idx)=>{
    let c = "bowtie-opt";
    const sel = S.bowtie.actions.includes(idx);
    if(sub){ c += q.correctActions.includes(idx) ? " right" : (sel ? " wrong" : ""); }
    else if(sel) c += " sel";
    h += '<button class="'+c+'" data-bt-action="'+idx+'"'+(sub?" disabled":"")+'>'+opt+"</button>";
  });
  h += '</div><div class="bowtie-col"><div class="bowtie-col-label">Condition</div>';
  q.conditionOptions.forEach((opt,idx)=>{
    let c = "bowtie-opt";
    const sel = S.bowtie.condition===idx;
    if(sub){ c += idx===q.correctCondition ? " right" : (sel ? " wrong" : ""); }
    else if(sel) c += " sel";
    h += '<button class="'+c+'" data-bt-condition="'+idx+'"'+(sub?" disabled":"")+'>'+opt+"</button>";
  });
  h += '</div><div class="bowtie-col"><div class="bowtie-col-label">Parameters to Monitor (choose '+q.correctParams.length+')</div>';
  q.paramOptions.forEach((opt,idx)=>{
    let c = "bowtie-opt";
    const sel = S.bowtie.params.includes(idx);
    if(sub){ c += q.correctParams.includes(idx) ? " right" : (sel ? " wrong" : ""); }
    else if(sel) c += " sel";
    h += '<button class="'+c+'" data-bt-param="'+idx+'"'+(sub?" disabled":"")+'>'+opt+"</button>";
  });
  h += "</div></div>";
  const ready = S.bowtie.condition!==null && S.bowtie.actions.length && S.bowtie.params.length;
  if(!sub){
    h += '<div class="acts"><button data-submit-bowtie="1"'+(!ready?" disabled":"")+'>Submit answer</button></div>';
  } else {
    const totalSlots = 1 + q.correctActions.length + q.correctParams.length;
    const ok = S.lastPoints === 1;
    h += '<p class="verdict '+(ok?"y":"n")+'">'+Math.round(S.lastPoints*totalSlots)+" of "+totalSlots+" correct — "+S.lastPoints.toFixed(2)+" pt (partial credit)</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function anyQHTML(q, label){
  if(q.type === "sata") return sataHTML(q);
  if(q.type === "fitb") return fitbHTML(q);
  if(q.type === "gtpal") return gtpalHTML(q);
  if(q.type === "cloze") return clozeHTML(q);
  if(q.type === "hotspot") return hotspotHTML(q);
  if(q.type === "dragdrop") return dragdropHTML(q);
  if(q.type === "ordering") return orderingHTML(q);
  if(q.type === "matrix") return matrixHTML(q);
  if(q.type === "bowtie") return bowtieHTML(q);
  return qHTML(q, label);
}

const TOPIC_GROUPS = [
  {key:"elim", label:"Elimination"},
  {key:"sens", label:"Sensory Perception"}
];

    const hasQuiz = !!QUIZ[x.id];
    const b = S.best[x.id];
    h += '<button class="row" data-l="'+x.id+'"><span class="t">'+x.title+"</span>"+
      (hasQuiz && b!==undefined ? '<span class="s">'+fmtScore(b)+"/"+QUIZ[x.id].length+"</span>" : "")+
      (hasQuiz ? '<span class="qz" data-q="'+x.id+'">Quiz</span>' : "")+
      "</button>";

        (hasQuiz ? '<span class="qz" data-q="'+x.id+'">Quiz</span>' : "")+
        "</button>";

function home(){
  let h = '<p class="lede"><strong>How to use this:</strong> Each topic features a lesson ending with one review question. Many topics also include a standalone 5-question quiz (including select-all-that-apply items) — tap a title to read, or Quiz where available to jump straight to the questions. The colored dot next to each unit carries through to that unit\'s lessons and quizzes.</p>';

  const doneGroups = {};
  UNITS.forEach((u,ui)=>{
    if(!u.group){ h += unitSectionCollapsibleHTML(u, ui); return; }
    if(doneGroups[u.group]) return;
    doneGroups[u.group] = true;
    const g = TOPIC_GROUPS.find(x=>x.key===u.group);
    const groupUnits = [];
    UNITS.forEach((uu,uj)=>{ if(uu.group === u.group) groupUnits.push({u:uu,ui:uj}); });
    const isOpen = !!S.openGroups[g.key];
    h += '<section class="topic-group'+(isOpen?" open":"")+'"><button class="topic-toggle" data-grouptoggle="'+g.key+'"><span class="topic-toggle-label">'+g.label+'</span><span class="topic-toggle-icon">'+(isOpen?"\u2212":"+")+'</span></button>';
    if(isOpen){
      h += '<div class="topic-body">';
      groupUnits.forEach(({u,ui}) => h += unitSectionHTML(u, ui));
      h += '</div>';
    }
    h += '</section>';
  });

  return h;
}

  const ui = unitIndexOf(S.id);

  h += '<h3 class="title">'+x.title+"</h3>"+(x.kicker?'<p class="kick">'+x.kicker+"</p>":"");

    h += '<button data-home="1">All topics</button></div>';
  } else {
    h += '<div class="acts">';

function fmtScore(n){ return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0+$/,"").replace(/\.$/,""); }
function quiz(){
  const bank = curBank();
  const q = bank[S.i];
  const ui = unitIndexOf(S.id);
  let h = '<div class="unit-banner" style="background:'+UNIT_COLORS[ui]+'">'+UNITS[ui].title+"</div>";
  h += '<h3 class="title">'+L[S.id].title+'</h3><p class="count">Question '+(S.i+1)+" of "+bank.length+" · score "+fmtScore(S.score)+"</p>";
  if(q.caseId) h += renderCaseTabs(q.caseId);
  h += anyQHTML(q, "");
  const answered = S.submitted;
  if(answered) h += '<div class="acts"><button data-next="1">'+(S.i<bank.length-1?"Next question":"See results")+"</button></div>";
  return h;
}

function result(){
  const bank = curBank();
  const A = ["A","B","C","D","E","F"];
  let h = '<p class="count">'+L[S.id].title+'</p><p class="big">'+fmtScore(S.score)+"/"+bank.length+"</p>";
  if(S.wrong.length){
    h += '<div class="rev"><p>Review these:</p>';
    S.wrong.forEach(i=>{ const q = bank[i];
      let correctText;
      if(q.type === "sata") correctText = q.answers.map(idx=>A[idx]+". "+q.options[idx]).join("; ");
      else if(q.type === "fitb") correctText = String(q.answer);
      else if(q.type === "cloze") correctText = q.blanks.map(b=>b.options[b.correct]).join(" · ");
      else if(q.type === "gtpal") correctText = ["G","T","P","A","L"].map((l,idx)=>l+q.answers[idx]).join(" ");
      else if(q.type === "hotspot") correctText = "See the outlined region in the lesson/question image.";
      else if(q.type === "dragdrop") correctText = q.items.map((it,idx)=>it+" → "+q.bins[q.correctBin[idx]]).join("; ");
      else if(q.type === "ordering") correctText = q.items.join(" → ");
      else if(q.type === "matrix") correctText = q.rows.map((r,idx)=>r+" → "+q.cols[q.correct[idx]]).join("; ");
      else if(q.type === "bowtie") correctText = "Actions: "+q.correctActions.map(idx=>q.actionOptions[idx]).join(", ")+" · Condition: "+q.conditionOptions[q.correctCondition]+" · Parameters: "+q.correctParams.map(idx=>q.paramOptions[idx]).join(", ");
      else correctText = q.options[q.answer];
      h += "<h5>"+q.stem+"</h5><p><strong>"+correctText+"</strong></p><p>"+q.why+"</p>";
      if(q.ref && L[q.ref]) h += '<a class="reviewlink" href="#'+q.ref+'" target="_blank" rel="noopener">Review in: '+L[q.ref].title+" ↗</a>";
    });
    h += "</div>";
  } else h += "<p>All correct.</p>";
  h += '<div class="acts"><button data-q="'+S.id+'">Retake</button><button data-l="'+S.id+'">Reread the lesson</button><button data-home="1">All topics</button></div>';
  return h;
}

function draw(){
  back.hidden = S.view === "home";
  app.innerHTML = S.view==="home"?home():S.view==="lesson"?lesson():S.view==="quiz"?quiz():result();
}

app.addEventListener("change", e=>{
  const sel = e.target.closest("select[data-cloze-blank]");
  if(sel && !S.submitted){
    S.clozeSel[+sel.dataset.clozeBlank] = sel.value===""?undefined:+sel.value;
    return draw();
  }
});

app.addEventListener("click", e=>{
  const q0 = e.target.closest("[data-q]");
  if(q0){
    e.stopPropagation();
    const shuffled = q0.dataset.q && q0.dataset.q.startsWith("exam") ? shuffleExam(QUIZ[q0.dataset.q]) : null;
    nav("quiz",{id:q0.dataset.q, i:0, score:0, wrong:[], shuffledBank:shuffled});
    return;
  }
  const hw = e.target.closest(".hotspot-wrap");
  if(hw && !S.submitted && S.view==="quiz" && curBank() && curBank()[S.i] && curBank()[S.i].type==="hotspot"){
    const rect = hw.getBoundingClientRect();
    const x = Math.max(0,Math.min(100, ((e.clientX-rect.left)/rect.width)*100));
    const y = Math.max(0,Math.min(100, ((e.clientY-rect.top)/rect.height)*100));
    S.clickPoint = {x,y};
    return draw();
  }
  const mr = e.target.closest("input[type=radio][data-matrix-row]");
  if(mr && !S.submitted){
    S.matrixSel[+mr.dataset.matrixRow] = +mr.dataset.matrixCol;
    return draw();
  }
  const t = e.target.closest("button");
  if(t && t.dataset.grouptoggle){ S.openGroups[t.dataset.grouptoggle] = !S.openGroups[t.dataset.grouptoggle]; return draw(); }
  if(t && t.dataset.unittoggle){ S.openUnits[t.dataset.unittoggle] = !S.openUnits[t.dataset.unittoggle]; return draw(); }
  if(!t){
    const ddBinEl = e.target.closest(".dd-bin");
    if(ddBinEl && !S.submitted && S.ddSel !== null){
      S.ddPlace[S.ddSel] = +ddBinEl.dataset.ddBin;
      S.ddSel = null;
      return draw();
    }
    return;
  }
  if(t.dataset.l) return nav("lesson",{id:t.dataset.l});
  if(t.dataset.home) return nav("home");
  if(t.dataset.tab !== undefined){
    S.activeTab = +t.dataset.tab;
    return draw();
  }
  if(t.dataset.t !== undefined){
    if(S.submitted) return;
    const idx = +t.dataset.t, pos = S.multi.indexOf(idx);
    if(pos === -1) S.multi.push(idx); else S.multi.splice(pos,1);
    return draw();
  }
  if(t.dataset.submit !== undefined){
    S.submitted = true;
    const q = curBank()[S.i];
    const ok = S.multi.slice().sort((a,b)=>a-b).join(",") === q.answers.slice().sort((a,b)=>a-b).join(",");
    if(S.view === "quiz"){ if(ok) S.score++; else S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.submitFitb !== undefined){
    const inputEl = document.getElementById("fitbInput");
    const val = inputEl ? inputEl.value.trim() : "";
    S.textAnswer = val;
    const q = curBank()[S.i];
    const userNum = parseFloat(val);
    const target = parseFloat(q.answer);
    const ok = !isNaN(userNum) && Math.abs(userNum - target) < 0.05;
    S.fitbCorrect = ok;
    S.submitted = true;
    if(S.view === "quiz"){ if(ok) S.score++; else S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.submitGtpal !== undefined){
    const q = curBank()[S.i];
    const vals = [0,1,2,3,4].map(i=>{
      const el = document.getElementById("gtpalInput"+i);
      return el ? el.value.trim() : "";
    });
    S.gtpalVals = vals;
    const ok = vals.every((v,i)=> parseInt(v) === q.answers[i]);
    S.submitted = true;
    if(S.view === "quiz"){ if(ok) S.score++; else S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.submitCloze !== undefined){
    const q = curBank()[S.i];
    const correctCount = q.blanks.filter((b,i)=>S.clozeSel[i]===b.correct).length;
    const pts = Math.round((correctCount/q.blanks.length)*100)/100;
    S.submitted = true;
    S.lastPoints = pts;
    if(S.view === "quiz"){ S.score += pts; if(pts < 1) S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.submitHotspot !== undefined){
    const q = curBank()[S.i];
    const pt = S.clickPoint, r = q.region;
    const ok = !!pt && pt.x>=r.x && pt.x<=r.x+r.w && pt.y>=r.y && pt.y<=r.y+r.h;
    const pts = ok ? 1 : 0;
    S.hotspotCorrect = ok;
    S.submitted = true;
    S.lastPoints = pts;
    if(S.view === "quiz"){ S.score += pts; if(pts < 1) S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.ddPick !== undefined){
    S.ddSel = S.ddSel === +t.dataset.ddPick ? null : +t.dataset.ddPick;
    return draw();
  }
  if(t.dataset.ddUnplace !== undefined){
    if(S.submitted) return;
    delete S.ddPlace[+t.dataset.ddUnplace];
    return draw();
  }
  if(t.dataset.submitDd !== undefined){
    const q = curBank()[S.i];
    const correctCount = q.items.filter((_,idx)=>S.ddPlace[idx]===q.correctBin[idx]).length;
    const pts = Math.round((correctCount/q.items.length)*100)/100;
    S.submitted = true;
    S.lastPoints = pts;
    if(S.view === "quiz"){ S.score += pts; if(pts < 1) S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.orderUp !== undefined){
    const pos = +t.dataset.orderUp;
    if(pos>0){ [S.orderArr[pos-1],S.orderArr[pos]] = [S.orderArr[pos],S.orderArr[pos-1]]; }
    return draw();
  }
  if(t.dataset.orderDown !== undefined){
    const pos = +t.dataset.orderDown;
    if(pos<S.orderArr.length-1){ [S.orderArr[pos+1],S.orderArr[pos]] = [S.orderArr[pos],S.orderArr[pos+1]]; }
    return draw();
  }
  if(t.dataset.submitOrder !== undefined){
    const correctCount = S.orderArr.filter((itemIdx,pos)=>itemIdx===pos).length;
    const pts = Math.round((correctCount/S.orderArr.length)*100)/100;
    S.submitted = true;
    S.lastPoints = pts;
    if(S.view === "quiz"){ S.score += pts; if(pts < 1) S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.submitMatrix !== undefined){
    const q = curBank()[S.i];
    const correctCount = q.rows.filter((_,rIdx)=>S.matrixSel[rIdx]===q.correct[rIdx]).length;
    const pts = Math.round((correctCount/q.rows.length)*100)/100;
    S.submitted = true;
    S.lastPoints = pts;
    if(S.view === "quiz"){ S.score += pts; if(pts < 1) S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.btAction !== undefined){
    if(S.submitted) return;
    const q = curBank()[S.i];
    const idx = +t.dataset.btAction, pos = S.bowtie.actions.indexOf(idx);
    if(pos===-1){ if(S.bowtie.actions.length < q.correctActions.length) S.bowtie.actions.push(idx); }
    else S.bowtie.actions.splice(pos,1);
    return draw();
  }
  if(t.dataset.btCondition !== undefined){
    if(S.submitted) return;
    S.bowtie.condition = +t.dataset.btCondition;
    return draw();
  }
  if(t.dataset.btParam !== undefined){
    if(S.submitted) return;
    const q = curBank()[S.i];
    const idx = +t.dataset.btParam, pos = S.bowtie.params.indexOf(idx);
    if(pos===-1){ if(S.bowtie.params.length < q.correctParams.length) S.bowtie.params.push(idx); }
    else S.bowtie.params.splice(pos,1);
    return draw();
  }
  if(t.dataset.submitBowtie !== undefined){
    const q = curBank()[S.i];
    const totalSlots = 1 + q.correctActions.length + q.correctParams.length;
    const conditionPts = S.bowtie.condition===q.correctCondition ? 1 : 0;
    const actionsPts = S.bowtie.actions.filter(a=>q.correctActions.includes(a)).length;
    const paramsPts = S.bowtie.params.filter(a=>q.correctParams.includes(a)).length;
    const pts = Math.round(((conditionPts+actionsPts+paramsPts)/totalSlots)*100)/100;
    S.submitted = true;
    S.lastPoints = pts;
    if(S.view === "quiz"){ S.score += pts; if(pts < 1) S.wrong.push(S.i); }
    return draw();
  }
  if(t.dataset.p !== undefined){
    if(S.submitted) return;
    S.pick = +t.dataset.p;
    return draw();
  }
  if(t.dataset.submitMc !== undefined){
    if(S.pick === null) return;
    S.submitted = true;
    if(S.view === "quiz"){
      if(S.pick === curBank()[S.i].answer) S.score++; else S.wrong.push(S.i);
    }
    return draw();
  }
  if(t.dataset.next){
    const bank = curBank();
    if(S.i < bank.length-1){
      S.i++; S.pick = null; S.multi = []; S.submitted = false; S.textAnswer = ""; S.fitbCorrect = false; S.activeTab = 0;
      S.clickPoint = null; S.hotspotCorrect = false; S.ddSel = null; S.ddPlace = {}; S.orderArr = null; S.matrixSel = {};
      S.bowtie = {condition:null, actions:[], params:[]}; S.lastPoints = 0; S.clozeSel = {}; S.gtpalVals = ["","","","",""];
      return draw();
    }
    const b = S.best[S.id];
    if(b === undefined || S.score > b) S.best[S.id] = S.score;
    return nav("result");
  }
});

const initialHash = location.hash.slice(1);
if(initialHash && L[initialHash]){
  nav("lesson", {id: initialHash});
} else {
  draw();
}

</script>
