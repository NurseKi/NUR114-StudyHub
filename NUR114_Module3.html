    ["<strong>What's happening</strong>","Too much water for the sodium — cells <strong>swell</strong> (cerebral edema)","Too little water for the sodium — cells <strong>shrink</strong>"],
    ["<strong>Types / causes</strong>","<strong>Hypovolemic</strong> (sodium lost more than water): vomiting, diarrhea, diuretics, burns, adrenal insufficiency. <strong>Hypervolemic</strong> (water gained more than sodium): heart failure, liver failure, <strong>nephrotic syndrome</strong>, excess hypotonic IV fluids. <strong>Isovolemic</strong> (dilutional): <strong>kidney failure</strong>, <strong>SIADH</strong>, hypothyroidism","<strong>Water loss:</strong> fever, burns, vomiting/diarrhea, diabetes insipidus, osmotic diuresis, older adults with an impaired thirst response, clients who can't drink. <strong>Sodium gain:</strong> sodium bicarbonate, <strong>sodium polystyrene sulfonate (Kayexalate)</strong>, hypertonic saline, tube feedings, corticosteroids"],
    ["<strong>Cues</strong>","Headache, irritability, confusion, lethargy, muscle twitching, weakness, abdominal cramps, nausea/vomiting (often starting around 115–120 mEq/L); stupor, seizures, coma near 110 mEq/L. Hypovolemic: poor turgor, orthostatic hypotension, weak rapid pulse. Hypervolemic: edema, hypertension, weight gain, bounding pulse","Intense <strong>thirst</strong>, restlessness/agitation, low-grade fever, flushed skin, twitching, hyperreflexia, confusion → seizures, coma. Water loss: dry mucous membranes, oliguria, orthostatic hypotension. Sodium gain: hypertension, bounding pulse, dyspnea"],
    ["<strong>Treatment</strong>","<strong>Fluid restriction</strong> (primary treatment for dilutional; about 1 L/day in SIADH); isotonic saline if hypovolemic; <strong>3% saline</strong> only for severe, symptomatic cases (below 120) in the ICU — slowly, no more than about 1–2 mEq/L per hour (no more than 25 mEq/L in 48 hours) to avoid brain injury","Treat the cause; replace water <strong>gradually over about 48 hours</strong> (D5W, then ½ NS) — correcting too fast shifts water into brain cells (<strong>cerebral edema</strong>); restrict sodium"],
    ["<strong>Nursing</strong>","Neuro checks; daily weights; strict I&amp;O; post fluid restriction signs; seizure precautions; infusion pump for any saline","Neuro checks; daily weights; strict I&amp;O; mark cups and give a target intake per shift; mouth care; seizure precautions; infusion pump"]
   ]}},
   {hook:"<b>SALT</b> = hypernatremia: <b>S</b>kin flushed, <b>A</b>gitation, <b>L</b>ow-grade fever, <b>T</b>hirst. Whichever direction the sodium is off, <b>correct it slowly</b>."},
   {h:"Sodium and fluid volume"},
   {table:{head:["","Fluid volume excess (overload)","Fluid volume deficit (dehydration)"],rows:[
    ["<strong>When seen</strong>","Oliguric AKI, CKD/ESRD, missed dialysis, nephrotic syndrome, glomerulonephritis","Prerenal AKI, diuretic phase of AKI, poor intake, vomiting/diarrhea, over-diuresis"],
    ["<strong>Cues</strong>","Weight gain, edema, crackles, dyspnea, JVD, <strong>bounding pulses</strong>, hypertension, low SpO₂","Weight loss, tachycardia, hypotension, <strong>weak/thready pulses</strong>, dry mucous membranes, poor turgor, concentrated urine, confusion (older adults)"],
    ["<strong>Sodium</strong>","Often <strong>low (dilutional hyponatremia)</strong>","Often <strong>high (hypernatremia)</strong> when water is lost in excess of sodium"],
    ["<strong>Hematocrit</strong>","Low (diluted)","High (<strong>hemoconcentration</strong>)"],
    ["<strong>Priority actions</strong>","High Fowler's, oxygen, fluid and sodium restriction, loop diuretics (if still making urine), dialysis","Isotonic IV fluids; correct hypernatremia <strong>slowly</strong> to avoid cerebral edema; monitor for overload in older/cardiac patients"]
   ]}},
   {hook:"<b>Weight is the most accurate indicator of fluid gain or loss</b> in an acutely ill client. Get an accurate daily weight — same time, same scale, same clothing — and record it. A 1-kg (about 2.2-lb) change equals about 1,000 mL of fluid."},
   {hook:"<b>The hematocrit vs. hemoglobin dilution trick:</b> hematocrit is a <b>percentage</b> of the blood that is cells, so added water drops it; hemoglobin is an absolute amount and stays more stable. A <b>falling hematocrit with a stable hemoglobin = fluid gain</b>. If both fall together, think bleeding."},
   {list:[
    "<strong>Dilutional hyponatremia:</strong> the sodium is low because of too much water, not sodium loss — <strong>remove the water, don't add salt</strong>",
    "<strong>Fluid restriction counts every source:</strong> PO fluids, maintenance IV fluids, IV antibiotics, and the fluid IV medications are mixed in",
    "<strong>Watch for overcorrection:</strong> dialysis and diuretics can push the client into <strong>fluid volume deficit</strong> — hypotension, tachycardia, dizziness after a dialysis run or a dose of furosemide. Daily weights and BP catch it",
    "<strong>Ascites:</strong> the <strong>fluid wave test</strong> — hand on the middle of the abdomen (or the side if obese), tap gently on the other side; a positive test is a fluid wave felt across the abdomen. A fluid-filled abdomen feels squishy, not hard, and <strong>percusses dull</strong> (air is tympanic)",
    "<strong>Orthopnea:</strong> can't breathe lying flat — ask how many pillows the client sleeps on. An <strong>S3 gallop</strong> means the ventricle is being overfilled"]},
   {hook:"Hyponatremia and hypernatremia both show up as neurologic changes — confusion, lethargy, seizures — because sodium shifts pull water into or out of brain cells. That's also why correcting either one too fast is dangerous."},
   {h:"Metabolic acidosis in renal failure"},
   {list:[
    "Kidneys can't excrete hydrogen ions or regenerate bicarbonate → low HCO<sub>3</sub>, low pH",
    "<strong>Cues:</strong> Kussmaul respirations (compensation), headache, confusion, lethargy, nausea, hyperkalemia",
    "<strong>Treatment:</strong> oral <strong>sodium bicarbonate</strong> in CKD; IV bicarbonate for severe acidosis (pH below 7.35); dialysis",
    "The metabolic acidosis of chronic renal failure is often <strong>asymptomatic</strong>; when it causes symptoms, it is reduced with <strong>sodium bicarbonate supplements or dialysis</strong>"]},
   {h:"Class poster review — fluid volume overload"},
   {table:{head:["Signs & symptoms","Interventions"],rows:[
    ["<strong>Neuro:</strong> headache, altered mental status, neuro changes/<strong>seizures</strong> from ↑ ICP, fatigue, ↓ appetite<br><strong>Respiratory:</strong> pulmonary edema, dyspnea/shortness of breath, <strong>orthopnea</strong>, crackles/wheezing, wet cough, <strong>pink frothy sputum</strong>, ↑ RR, ↓ O₂ sat<br><strong>Cardiovascular:</strong> hypertension, tachycardia, <strong>S3 heart sound</strong>, murmur, <strong>bounding pulse</strong>, JVD, cool/clammy skin<br><strong>Fluid:</strong> fluid retention, pitting edema, <strong>anasarca</strong>, weeping skin, third spacing, <strong>ascites</strong>, <strong>rapid weight gain</strong><br><strong>Labs:</strong> hyponatremia (dilutional), <strong>low H&amp;H</strong> (dilution), ↑ BUN/creatinine; severe electrolyte dilution can lead to seizures and death","<strong>Raise the HOB</strong>; administer/titrate O₂ as needed<br><strong>Strict I&amp;O charting</strong>; <strong>daily weights</strong><br><strong>Restrict intake</strong> — fluid and sodium; <strong>limit IV fluids</strong>; renal/low-sodium diet<br>Turn every 2 hours; elevate extremities<br>Bed rest until stable, then activity as tolerated<br>Neuro checks; seizure monitoring/precautions PRN; fall-risk precautions<br><strong>Diuretics — furosemide (Lasix)</strong>; monitor K⁺<br>Encourage voiding; incentive spirometer<br>Albumin for third spacing (pulls fluid back into the vessels; needs kidney function or dialysis to remove it)<br>Mannitol — less commonly used in kidney failure (more common for increased ICP/cerebral edema); it first pulls fluid <em>into</em> the bloodstream, so without working kidneys (or dialysis) it can worsen pulmonary edema and heart failure<br>Dialysis"]
   ]}},
   {hook:"<b>Incentive spirometry and suctioning don't remove pulmonary edema.</b> IS helps prevent atelectasis and pneumonia in a client on bed rest, but it doesn't move fluid out of the alveoli — and suctioning edema fluid is \"like trying to catch bubbles.\" What actually removes the fluid: raising the HOB and O₂ for the breathing, then <b>diuretics and dialysis</b>."},
   {h:"Class poster review — hyperkalemia"},
   {table:{head:["Signs & symptoms","Interventions"],rows:[
    ["<strong>Cardiac:</strong> dysrhythmias, <strong>peaked T waves</strong>, <strong>widened QRS</strong>, irregular heart rate and rhythm, PVCs, <strong>tachycardia or bradycardia</strong>, ↓ BP, <strong>V-tach</strong><br><strong>Neuromuscular:</strong> muscle weakness, muscle irritability, paresthesia, fatigue<br><strong>GI:</strong> abdominal cramps, GI issues<br><strong>Acid–base:</strong> metabolic acidosis, <strong>Kussmaul respirations</strong><br><strong>Severe:</strong> seizures, coma, death","<strong>Cardiac monitoring (ECG)</strong><br><strong>Calcium gluconate FIRST</strong> — protect the heart<br><strong>IV regular insulin + 50% glucose</strong> — monitor blood sugar<br>Sodium bicarbonate; albuterol<br><strong>Kayexalate / Lokelma</strong><br>Non-potassium-sparing diuretic (<strong>furosemide</strong>); <strong>NO spironolactone</strong><br>Monitor I&amp;O and BUN/creatinine<br>Limit K⁺ in the diet; <strong>no salt substitutes</strong><br>Seizure precautions; safety/fall precautions<br>Dialysis (last resort)"]
   ]}},
   {h:"Class poster review — hypocalcemia / hyperphosphatemia"},
   {table:{head:["Signs & symptoms","Interventions"],rows:[
    ["<strong>Hypocalcemia:</strong> <strong>tetany</strong>, tingling fingers, numbness around the mouth, muscle cramps, pain/aches, <strong>+ Chvostek</strong>, <strong>+ Trousseau</strong>, <strong>laryngeal and bronchospasm</strong>, dysrhythmias, prolonged ST and QT, tachycardia, seizures, altered mental status<br><strong>Hypocalcemia (this semester's board):</strong> paresthesia, muscle weakness, dysrhythmias, <strong>QT prolongation</strong>, bronchospasm, respiratory distress, coma, cardiac arrest<br><strong>Hyperphosphatemia:</strong> weak bones/osteoporosis, low bone density, ↑ fracture risk, joint pain, fatigue, hypotension, <strong>severe pruritus</strong>/skin rash, dry scaly skin, brittle nails","Heart monitor<br><strong>IV calcium gluconate</strong> (or calcium chloride); oral/parenteral calcium replacement; Tums (calcium carbonate)<br>Vitamin D<br><strong>Sevelamer</strong> (phosphate binder)<br>Low-sodium, <strong>low-phosphorus</strong> diet<br><strong>Seizure precautions</strong> (padded rails, suction and O₂ at bedside); fall precautions<br>Magnesium sulfate if magnesium is also low (low Mg keeps calcium from correcting)<br>Education on long-term PPI use (can lower magnesium, and with it calcium)<br>Airway precautions; cardiac monitoring<br>DEXA scan; weight-bearing exercise<br>Slow introduction of nutrients/food<br>Dialysis<br><em>Note:</em> <strong>patiromer</strong> appeared on the class board, but it binds <strong>potassium</strong>, not phosphorus — it belongs with hyperkalemia"]
   ]}},
   {h:"IV fluid solutions"},
   {table:{head:["Type","Examples","Fluid shift","Primary use","Safety risk"],rows:[
    ["<strong>Isotonic</strong>","0.9% normal saline, lactated Ringer's (LR)","<strong>Stays put</strong> — expands intravascular volume without moving fluid in or out of cells","Volume replacement — hypovolemia, shock","<strong>Fluid volume overload</strong> — check lung sounds. LR contains potassium and is often avoided in renal failure"],
    ["<strong>Hypotonic</strong>","0.45% saline (½ NS), 2.5% dextrose","Moves <strong>into cells</strong> — pulls fluid from the vessels into the cells","Severe cellular dehydration (DKA, HHS)","<strong>Cerebral edema</strong> — never give to head-injury clients"],
    ["<strong>Hypertonic</strong>","3% saline, D10W, D50W, albumin (colloid)","Moves <strong>out of cells</strong> — pulls fluid from cells and tissue into the vessels","Severe hyponatremia, cerebral edema","<strong>Rapid fluid overload</strong> (pulmonary edema) — give slowly"]
   ]}}
  ],
  check:{stem:"A client with ESRD has a potassium level of 6.8 mEq/L and peaked T waves. The provider orders calcium gluconate IV. What is the purpose of this medication?",
   options:["To bind potassium in the GI tract for elimination","To stabilize the cardiac cell membrane and protect against dysrhythmias","To shift potassium into the cells","To correct the client's metabolic acidosis"],
   answer:1,
   why:"Calcium gluconate stabilizes the myocardium against the effects of hyperkalemia within minutes, but it does not lower the potassium level. Insulin with dextrose shifts potassium into cells, and binders or dialysis remove it."}
},
{ id:"elim-dialysis", title:"Dialysis Types: Hemodialysis, Peritoneal Dialysis & CRRT", kicker:"How each one works, access types and care, and the complications to watch for",
  blocks:[
   {p:"Dialysis takes over the kidneys' filtering job by moving wastes, excess electrolytes, and water across a semipermeable membrane. It relies on three principles: <strong>diffusion</strong> (solutes move from higher to lower concentration — urea, creatinine, and potassium move out of the blood), <strong>osmosis</strong> (water moves toward the higher solute concentration), and <strong>ultrafiltration</strong> (water is pushed out by a pressure gradient). The three types differ in <em>where</em> the membrane is and <em>how often</em> they run."},
   {h:"When is dialysis needed? — AEIOU"},
   {table:{head:["","Indication"],rows:[
    ["<strong>A</strong>","<strong>Acidosis</strong> — metabolic acidosis not controlled by bicarbonate"],
    ["<strong>E</strong>","<strong>Electrolytes</strong> — severe hyperkalemia (or hyperphosphatemia) refractory to medical treatment"],
    ["<strong>I</strong>","<strong>Intoxication</strong> — dialyzable drug or toxin overdose (e.g., salicylates, lithium)"],
    ["<strong>O</strong>","<strong>Overload</strong> — symptomatic fluid overload/pulmonary edema not responding to diuretics"],
    ["<strong>U</strong>","<strong>Uremia</strong> — uremic complications such as pericarditis or encephalopathy; also anuria"]
   ]}},
   {h:"Comparing the three types"},
   {table:{head:["","Hemodialysis (HD)","Peritoneal dialysis (PD)","Continuous renal replacement therapy (CRRT)"],rows:[
    ["<strong>Membrane</strong>","Artificial membrane in an external dialyzer (the \"artificial kidney\")","The patient's own <strong>peritoneum</strong> acts as the semipermeable membrane","Artificial filter, run continuously at the bedside"],
    ["<strong>Access</strong>","AV fistula, AV graft, or a temporary central venous dialysis catheter","<strong>Tenckhoff catheter</strong> surgically placed into the peritoneal cavity","Large-bore central venous dialysis catheter"],
    ["<strong>Schedule</strong>","Usually 3 times a week, about 3–4 hours per session, at a center","Daily — manual exchanges several times a day (CAPD) or overnight by a machine (APD, cycler)","24 hours a day in the ICU"],
    ["<strong>Best for</strong>","Rapid removal of fluid, K⁺, and wastes; most ESRD patients","Patients who want independence at home; those who can't tolerate rapid fluid shifts","<strong>Hemodynamically unstable</strong> ICU patients who can't tolerate the rapid shifts of HD"],
    ["<strong>Diet</strong>","More restrictive — K⁺, phosphorus, sodium, and fluid build up between treatments","More liberal — K⁺ is removed daily; phosphorus still limited; higher protein because protein is lost into the dialysate","Managed by the ICU team"]
   ]}},
   {h:"Hemodialysis access types"},
   {table:{head:["Access","What it is","Timing","Key points"],rows:[
    ["<strong>AV fistula</strong>","Surgical connection of an artery directly to a vein (usually in the forearm), so the vein enlarges and thickens","Needs about <strong>1–3 months</strong> to mature before use (ideally created months before dialysis starts)","Preferred access — longest-lasting, lowest infection and clotting risk. Over years the vein can become visibly enlarged and bulging"],
    ["<strong>AV graft</strong>","A synthetic tube tunneled under the skin connecting an artery to a vein","Usable in about <strong>2–3 weeks</strong>","For patients whose vessels are not suitable for a fistula; higher risk of clotting and infection than a fistula"],
    ["<strong>Vascath</strong> (temporary central catheter)","Temporary, non-tunneled, double-lumen catheter","Usable <strong>immediately</strong> — for acute needs (AKI)","High infection risk; not permanent. Strict sterile dressing changes; <strong>do not use for fluids or meds</strong>"],
    ["<strong>Permacath</strong> (tunneled catheter)","Tunneled, long-term catheter under the skin","Usable immediately; lasts longer than a Vascath","Risk of clotting and infection. Monitor the exit site for redness; maintain the <strong>heparin lock</strong>"]
   ]}},
   {p:"The AV fistula is the <strong>gold standard</strong> — lowest infection and clotting risk — but takes months to mature. The graft is a good option for clients with poor veins but has a higher risk of clotting (thrombosis), infection, aneurysm, and stenosis."},
   {h:"More access details"},
   {list:[
    "<strong>Dialysis catheters:</strong> placement in the upper chest is confirmed by <strong>x-ray</strong> before first use; the lumens are filled with concentrated heparin, so <strong>don't inject IV fluids or meds</strong> into them and <strong>don't unclamp</strong> unless preparing for dialysis (blood will fill the lumen and clot). The <strong>red</strong> lumen is \"arterial\" (blood to the machine) and the <strong>blue</strong> lumen is \"venous\" (blood back to the client). Temporary catheters are generally used for up to about 3–4 weeks. After removal, apply pressure and check the site for several hours — dialysis catheters are large and bleed more",
    "<strong>AV fistula:</strong> ideally created months before dialysis is expected to start; after healing, the client <strong>exercises the arm</strong> (e.g., squeezing a ball) to help it mature. Check patency more often when the client is <strong>hypotensive</strong> (low BP promotes clotting). For post-dialysis needle-site bleeding, apply just enough pressure to stop the bleeding <strong>without occluding the vessel</strong>",
    "<strong>AV graft:</strong> avoid puncturing a new graft for about 2–4 weeks while tissue grows into it",
    "<strong>Vein preservation:</strong> in clients who may need a fistula someday, avoid PICC lines and subclavian catheters (they cause central vein stenosis) and protect the nondominant arm's veins",
    "<strong>Fistula teaching:</strong> wash the site daily with antibacterial soap and before dialysis; don't pick scabs; check for redness, warmth, or a pimple-like spot; feel for the thrill several times a day and report any change; ask staff to rotate needle sites"]},
   {h:"Caring for an AV fistula or graft"},
   {list:[
    "<strong>Palpate for a thrill</strong> (a buzzing vibration) and <strong>auscultate for a bruit</strong> (a whooshing sound) every shift — their presence means the access is patent; absence means possible clotting and must be reported <strong>immediately</strong>",
    "<strong>No</strong> blood pressures, venipunctures, IVs, or injections in the access arm",
    "No tight clothing, jewelry, or restraints on the access arm; don't carry heavy objects with it or sleep on it",
    "Post a sign or band identifying the access limb",
    "Assess for infection — redness, warmth, drainage, fever",
    "Check distal circulation — a <strong>pale, cold hand</strong> (with pain or numbness) can signal <strong>steal syndrome</strong> (the access diverts too much arterial blood from the hand) — a red flag, along with an absent thrill or bruit",
    "After dialysis, apply gentle pressure to needle sites to control bleeding (heparin is used during the treatment)"]},
   {h:"Nursing care before and after hemodialysis"},
   {list:[
    "<strong>Before:</strong> weigh the patient (1 kg = 1 L), take vital signs, check labs, assess the access, and <strong>hold antihypertensives and water-soluble vitamins</strong> (and other drugs removed by dialysis, such as some antibiotics) until after treatment, per orders",
    "<strong>After:</strong> weigh again (weight loss reflects fluid removed), take vital signs, assess for bleeding at the access and for hypotension, and watch for disequilibrium syndrome"]},
   {h:"CRRT nursing care"},
   {list:[
    "A slower, 24/7 form of dialysis — gentle on blood pressure, so it's used for <strong>hemodynamically unstable</strong> ICU clients who can't tolerate the rapid fluid shifts of hemodialysis",
    "Requires close (often 1:1) ICU nursing care",
    "<strong>Vital signs hourly</strong> for hemodynamic shifts",
    "<strong>Check the filter for clotting</strong> — early sign is a falling ultrafiltration rate; then rising venous pressure and dark blood lines",
    "<strong>Frequent electrolyte monitoring</strong> (at least twice daily) to prevent rapid imbalances; daily weights",
    "An hourly fluid-balance goal is set; the nurse totals all intake and output each hour and adjusts replacement fluid to meet it",
    "<strong>Blood leak alarm</strong> — blood in the ultrafiltrate means the filter has ruptured; gross blood = don't return the circuit blood to the client",
    "<strong>Hypothermia</strong> — blood cools outside the body; use a blood warmer or warming blanket (hypothermia can also mask fever)",
    "Hold ACE inhibitors before CRRT as ordered (risk of severe hypotension or reaction)"]},
   {h:"During and after hemodialysis"},
   {list:[
    "Vital signs <strong>before, during, and after</strong> dialysis — a slight temperature rise is expected from warming of the blood, but a persistent elevation suggests infection; watch for any precipitous drop in BP",
    "Monitor for bleeding — heparin is used during dialysis to prevent clotting (reversed with protamine); watch platelets for heparin-induced thrombocytopenia",
    "BP and pulse at least every 30 minutes during acute hemodialysis; keep the access visible at all times (a disconnected line can cause rapid blood loss); discourage eating during treatment (can trigger hypotension and nausea)",
    "Draw post-dialysis labs at least <strong>2–3 hours after</strong> treatment — values drawn immediately afterward are falsely low while solutes re-equilibrate",
    "<strong>Dry weight</strong> — the weight at which the client has no fluid excess or deficit — guides how much fluid to remove",
    "Monitor for fluid overload <em>before</em> dialysis and for hypovolemia <em>after</em>",
    "A client with a <strong>femoral catheter</strong> should sit up at <strong>less than a 45-degree angle</strong> and not lean forward, to avoid occlusion or kinking",
    "Monitor the graft/fistula for clotting — inability to feel a thrill or hear a bruit, or client complaints of arm discomfort and paresthesia",
    "The thrill feels like a \"purring\"; the bruit sounds like rushing water (\"like a washing machine\")"]},
   {h:"Complications of hemodialysis"},
   {list:[
    "<strong>Hypotension</strong> — from rapid removal of blood volume; the most common complication",
    "Nausea, vomiting, chest pain, visual changes",
    "<strong>Muscle cramps</strong> — from rapid fluid and electrolyte shifts (and low-sodium dialysis solution)",
    "<strong>Steal syndrome</strong> — pain distal to the access site, poor capillary refill, paresthesia",
    "Insertion/access site bleeding, hematoma, or infection",
    "<strong>Dialysis disequilibrium syndrome</strong> — urea is removed from the blood faster than from the brain, pulling water into brain cells → headache, nausea/vomiting, restlessness, confusion, seizures. Highest risk in first treatments or after a long gap with a very high BUN; prevented with shorter sessions (e.g., 1–2 hours on 3–4 consecutive days)",
    "Hypotension is treated with a <strong>normal saline bolus (about 100–200 mL)</strong> and slowing fluid removal; antihypertensives are often held 4–6 hours before dialysis and sedatives avoided. Muscle cramps are treated by lowering the ultrafiltration rate and giving a saline bolus",
    "Dysrhythmias and angina in clients with heart disease — slow the fluid removal",
    "<strong>Bleeding</strong> — from heparin used during treatment",
    "<strong>Infection</strong> — especially with central catheters",
    "<strong>Air embolism</strong> — rare but serious"]},
   {h:"Peritoneal dialysis — how an exchange works"},
   {list:[
    "<strong>Fill:</strong> warmed dialysate (dextrose solution) flows in by gravity through the Tenckhoff catheter",
    "<strong>Dwell:</strong> it stays in the peritoneal cavity for a prescribed time while wastes and water move across the peritoneum by diffusion and osmosis (the dextrose pulls water out)",
    "<strong>Drain:</strong> the bag is lowered below the abdomen and the fluid drains out by gravity, carrying wastes and excess water",
    "<strong>CAPD</strong> (continuous ambulatory PD) — manual exchanges about 4 times a day; <strong>APD</strong> (automated PD) — a cycler machine performs exchanges overnight",
    "<strong>CCPD</strong> (continuous cyclic PD — cycler exchanges overnight with a long daytime dwell) gives the client <strong>more independence</strong> during the day, but the <strong>risk of peritonitis is greater</strong>"]},
   {h:"Peritoneal dialysis nursing care"},
   {list:[
    "Before starting: baseline vital signs and weight; have the client <strong>empty the bladder</strong> (if still making urine); assess the abdomen and catheter site",
    "Warm dialysate to body temperature in a commercial warmer — <strong>never a microwave</strong> (uneven heating can burn the peritoneum)",
    "<strong>Strict aseptic technique</strong> for every connection. The <strong>infusion clamp is opened during inflow and clamped after</strong>; when the dwell is done, the <strong>drain clamp is opened</strong> and fluid drains by gravity into the drainage bag",
    "Typical exchange: fill by gravity over about 5–10 minutes, dwell about 30–45 minutes (acute) or hours (CAPD), drain by gravity in no more than about 20 minutes. Dextrose strengths are 1.5%, 2.5%, or 4.25% — higher concentrations pull off more fluid",
    "If drainage is short by 500 mL or more after several exchanges, evaluate for fluid retention (abdominal distention, fullness, weight gain)",
    "Clear fluid leaking around the catheter can be confirmed as dialysate with a <strong>glucose test strip</strong> (positive because of the dextrose)",
    "Hypokalemia is common (dialysate usually has no potassium) — KCl may be added; insulin may be added for hyperglycemia",
    "PD is contraindicated with existing peritonitis, recent or extensive abdominal surgery, or abdominal adhesions; in cardiac arrest, the abdomen is drained immediately",
    "Strict aseptic technique with every connection; mask during exchanges; daily catheter exit-site care",
    "Outflow (effluent) should be <strong>clear, straw-colored / pale yellow</strong>. Blood-tinged outflow is expected in the first few exchanges after catheter placement",
    "<strong>Outflow color guide:</strong> clear straw-colored = normal; <strong>cloudy</strong> = peritonitis; <strong>bloody</strong> after the first few exchanges = vascular complication; <strong>brown</strong> = bowel perforation; <strong>urine-colored</strong> = bladder perforation — report anything other than clear",
    "Don't let the dwell run longer than prescribed (more glucose absorbed → hyperglycemia). If outflow is less than inflow, the difference has been absorbed and is counted as <strong>intake</strong>",
    "Abdominal cramping is common during inflow in the first few exchanges (warm dialysate helps). After catheter placement, smaller volumes are used for about 1–2 weeks while the cuffs heal in, to prevent leaking",
    "<strong>Catheter cuffs</strong> are made of Dacron polyester. As tissue grows into them they <strong>stabilize the catheter</strong>, <strong>prevent dialysate from leaking</strong>, and provide a <strong>barrier against microorganisms</strong>",
    "<strong>Cloudy outflow = peritonitis</strong> until proven otherwise — along with fever, abdominal pain, rebound tenderness, and a <strong>rigid, board-like abdomen</strong>; send a sample for culture and notify the provider",
    "<strong>Poor (sluggish) outflow:</strong> the main cause is a <strong>full colon</strong> — prevent constipation with fiber and stool softeners. Also check for kinks and closed clamps, keep the bag below the abdomen, and <strong>reposition the client side to side</strong> (or elevate the HOB, gently massage the abdomen); fibrin clots may need heparin added to the dialysate as ordered",
    "<strong>Shortness of breath during the dwell</strong> means the fluid may be pushing on the diaphragm — <strong>drain the fluid immediately</strong>"]},
   {h:"Intake and output math for dialysis"},
   {list:[
    "<strong>True urine output</strong> = total output − the amount of dialysate/irrigant instilled",
    "<strong>Ultrafiltration</strong> (fluid removed) = dialysate drained out − dialysate put in. Example: 2,000 mL in, 2,500 mL out → <strong>500 mL</strong> of fluid removed",
    "Outflow should equal or exceed inflow; if less drains out than went in, the client is retaining fluid"]},
   {h:"Complications of peritoneal dialysis"},
   {list:[
    "<strong>Peritonitis</strong> — the most serious; cloudy outflow, abdominal pain, fever",
    "Exit-site or tunnel infection",
    "Hyperglycemia and weight gain from dextrose absorbed from the dialysate",
    "Hernias and <strong>back pain</strong> from the weight of the dialysate (orthopedic binders may help back pain)",
    "<strong>Pneumonia and atelectasis</strong> from pressure on the diaphragm during the dwell",
    "Ongoing protein loss and malnutrition — monitor nutritional status"]},
   {hook:"The two access-patency checks are paired senses: you <strong>feel</strong> a thrill and <strong>hear</strong> a bruit. For PD, the eyes do the work — any cloudy bag is peritonitis until proven otherwise."}
  ],
  check:{stem:"The nurse drains a peritoneal dialysis exchange and notes the outflow is cloudy. The client reports abdominal pain. What does the nurse suspect?",
   options:["Normal outflow after the first few exchanges","Peritonitis","Constipation blocking the catheter","Dialysis disequilibrium syndrome"],
   answer:1,
   why:"Cloudy outflow with abdominal pain is the hallmark of peritonitis. Blood-tinged outflow is expected only in the first few exchanges after catheter placement, and constipation causes poor outflow rather than cloudy fluid."}
},
{ id:"elim-diet", title:"The Renal Diet: Potassium, Phosphorus & Sodium", kicker:"From the GU diet handout — what to limit, why, and the \"double jeopardy\" foods",
  blocks:[
   {h:"Why potassium matters"},
   {p:"Potassium is a mineral found in most foods. It helps with muscle movement, keeps the nervous system healthy, and helps balance the amount of water in the body. The kidneys control the blood potassium level, so in kidney disease it can build up to high levels — <strong>hyperkalemia</strong> — which can be dangerous for the heart."},
   {h:"Why phosphorus matters"},
   {p:"Phosphorus helps build strong bones and teeth and helps convert food into energy. Kidneys normally release extra phosphorus into the urine; kidney disease prevents this, and the buildup causes problems for the bones and heart."},
   {h:"Hemodialysis diet"},
   {list:[
    "<strong>Potassium is limited</strong> because it builds up between dialysis treatments, causing weakness, muscle cramps, tiredness, irregular heartbeat, and even heart attack",
    "Potassium is found mostly in <strong>fruits, vegetables, and dairy products</strong>. Eating a large amount of a low-potassium food can still add up to a dangerous level",
    "Most foods contain some potassium — meat, poultry, bread, pasta. <strong>Butter, margarine, and oils are the only potassium-free foods</strong>",
    "<strong>Phosphorus is limited</strong> because hemodialysis removes only a small amount. Without diet limits and phosphorus binders, levels climb — causing itching, weak and brittle bones, and calcium deposits in blood vessels and organs including the heart and lungs",
    "Phosphorus is highest in <strong>high-protein foods, dairy, nuts, seeds, dried beans and peas, chocolate, colas, and whole-grain foods</strong>"]},
   {h:"Peritoneal dialysis diet"},
   {list:[
    "Because PD is performed <strong>daily</strong>, the diet is a little more liberal",
    "Potassium is usually removed well through PD, so most PD patients keep a normal or even <strong>low</strong> potassium — those with low levels may be told to eat potassium-rich foods such as tomatoes, orange juice, and bananas",
    "Phosphorus is <strong>not</strong> removed well during PD, so PD patients still need to limit phosphorus"]},
   {h:"Double jeopardy foods — high in both potassium and phosphorus"},
   {p:"Most high-potassium foods come from plants (fruits and vegetables). High-protein foods such as meats, along with dried beans and peas, tend to be high in phosphorus. Foods high in <em>both</em> — dairy, nuts, seeds, chocolate, and some whole-grain foods — are best avoided or used in very small amounts."},
   {table:{head:["Double jeopardy food","Kidney-friendly alternative"],rows:[
    ["Cheese","Vegan rella cheese, low-fat cottage cheese, a sprinkle of parmesan (very small amounts of extra-sharp cheese for maximum flavor)"],
    ["Chocolate","Desserts made with lemon or apple, white cake, rice-crispy treats"],
    ["Cream soup","Broth-based soups with pureed vegetables, or soups made with acceptable milk substitutes"],
    ["Dried beans and peas","Green beans, wax beans"],
    ["Ice cream","Sorbet, sherbet, popsicles"],
    ["Milk","Almond milk, Rice Dream original, unenriched rice beverage"],
    ["Nuts","Low-salt snack foods — pretzels, tortilla chips, popcorn, crackers, Sun Chips"],
    ["Peanut butter","Low-fat cream cheese, jam, or fruit spread"]
   ]}},
   {h:"Phosphorus targets"},
   {list:[
    "CKD stages 3 and 4: keep phosphorus between <strong>2.7 and 4.6 mg/dL</strong>",
    "Dialysis patients: keep phosphorus between <strong>3.0 and 5.5 mg/dL</strong>"]},
   {h:"Seven ways to help control phosphorus levels"},
   {list:[
    "<strong>1. Reduce phosphorus intake</strong> — eat foods low in phosphorus",
    "<strong>2. Take phosphorus binders</strong> — taken <strong>with meals and snacks</strong>; they act like sponges that soak up phosphorus in the stomach so it passes through the GI tract instead of entering the bloodstream. A low-phosphorus diet is still necessary for binders to work well",
    "<strong>3. Take vitamin D</strong> — an active form called <strong>calcitriol</strong> helps balance calcium and phosphorus. Active vitamin D <strong>cannot be taken if calcium or phosphorus levels are too high</strong>, because it increases the risk of deposits in soft tissues such as arteries, lungs, eyes, and skin",
    "<strong>4. Take a calcimimetic medicine</strong> — helps lower parathyroid hormone (PTH), calcium, and possibly phosphorus to keep bones healthier",
    "<strong>5. Stay on dialysis the entire time</strong> — dialysis removes some phosphorus; staying for the full treatment time gives the best results",
    "<strong>6. Start a provider-approved exercise program</strong> — builds strength and, in some cases, bone",
    "<strong>7. Parathyroid surgery</strong> — in some cases, removing part of the parathyroid glands prevents long-term PTH release that weakens bone and calcifies tissues",
    "Patients should tell their provider and dietitian about all medicines and supplements, because some contain phosphorus"]},
   {h:"Shopping for a low-phosphorus diet"},
   {list:[
    "<strong>Shop the outer perimeter</strong> of the grocery store (fresh foods); avoid the middle aisles, where shelf-stable boxed foods use phosphorus as a preservative",
    "<strong>Dark sodas</strong> use phosphorus for color — clear sodas are lower",
    "<strong>Milk and dairy</strong> are avoided even though the client's calcium is low — the phosphorus in them drives calcium down further. \"Drink more milk to raise your calcium\" is a wrong answer",
    "Fresh vegetables are generally acceptable (watch the high-potassium ones)",
    "Cheap, shelf-stable food is the easiest to get, so cost can be a real barrier — <strong>assess barriers</strong> and refer to a dietitian or social work rather than just re-teaching the diet"]},
   {h:"Kidney-friendly snacks"},
   {list:[
    "Fruit: apples, grapes, tangerines, strawberries; dried cranberries or blueberries; fruit cups with peaches, pears, pineapple, mandarin oranges, or mixed fruit",
    "Low- or no-sodium microwave popcorn",
    "Low-sodium crackers, pita chips, or unsalted pretzels",
    "A small can or pouch of tuna or chicken with individual mayonnaise packets",
    "Kidney-friendly nutrition bars or supplements that meet these guidelines: protein <strong>15 g or more</strong>, potassium <strong>200 mg or less</strong>, phosphorus <strong>150 mg or less</strong>, sodium <strong>300 mg or less</strong>"]},
   {h:"Stocking a kidney-friendly kitchen (key tips)"},
   {list:[
    "Compare brands — sodium and potassium levels vary significantly",
    "Choose low-sodium broths, stocks, and condiments; fresh vegetables or no-salt-added frozen/canned (drain and rinse canned vegetables)",
    "Use only <strong>1/4</strong> of the tomato sauce and canned tomatoes a recipe calls for, to limit potassium and sodium",
    "Rinse canned fish or chicken; limit canned goods in general",
    "Avoid baking and pancake mixes with added salt and baking powder",
    "Use sweet pickles instead of dill pickles",
    "Check cereals for sodium; oatmeal has more phosphorus but may be okay 1–2 times a week if phosphorus is well controlled",
    "Check vinegars (seasoned rice vinegar has added salt), and avoid store-bought sauces and gravies",
    "Choose homemade soups — some canned soups contain more than 800 mg sodium per serving",
    "<strong>Don't trade sodium for potassium</strong> — some salt substitutes replace salt with <strong>potassium chloride</strong>",
    "Limit nuts, seeds, and chocolate — high in potassium and phosphorus"]},
   {h:"Renal diet quick table (CKD & ESRD)"},
   {table:{head:["Nutrient","High — avoid/limit","Lower — safer choices","Why / nurse tip"],rows:[
    ["<strong>Potassium</strong>","Bananas, oranges, potatoes, spinach, tomatoes, avocados","Apples, berries, grapes, green beans, cabbage","Avoid salt substitutes (potassium chloride). The kidneys can't excrete it; high K⁺ leads to lethal dysrhythmias"],
    ["<strong>Phosphorus</strong>","Dairy (milk, cheese, yogurt), nuts, dark colas, whole grains","Rice milk, sorbet, clear sodas, white bread/rice","\"Double jeopardy\" foods like chocolate and dairy are high in both K⁺ and phosphorus. High phosphorus pulls calcium from bones"],
    ["<strong>Sodium</strong>","Canned soups, processed meats, pickled foods, soy sauce","Fresh herbs, lemon juice, no-salt-added canned vegetables","Rinse canned fish or vegetables to remove salt. Sodium causes water retention, HTN, and edema"],
    ["<strong>Protein</strong>","Excessive meat, poultry, or eggs (pre-dialysis CKD)","Small portions of high-biological-value protein (egg whites)","Limit protein <strong>before</strong> dialysis; once on dialysis, protein may be <strong>increased</strong> to replace losses"],
    ["<strong>Fluid</strong>","Anything liquid at room temperature counts — water, ice, Jell-O, ice cream","Measured amounts","Prevents fluid volume overload. Use small cups; suck on hard candy or chew gum for thirst"]
   ]}},
   {hook:"Renal rule of thumb: if it's \"healthy\" elsewhere, it's often dangerous in renal disease — bananas, spinach, oranges, and whole grains are all restricted because of their potassium and phosphorus."},
   {hook:"Phosphate binders: \"If you skip the meal, skip the pill.\" They only work when there is food in the stomach to bind to — so they're taken with the first bite of every meal."},
   {hook:"The salt-substitute trap is a classic exam item: a patient with kidney disease who switches to a salt substitute to lower sodium may be adding potassium chloride — exactly what the kidneys can't get rid of."}
  ],
  check:{stem:"A client on hemodialysis asks when to take her phosphorus binder. Which instruction is correct?",
   options:["At bedtime on an empty stomach","With meals and snacks","Only on dialysis days, right after treatment","Two hours after meals"],
   answer:1,
   why:"Phosphorus binders act like sponges that soak up phosphorus from the food in the stomach, so they must be taken with meals and snacks to work."}
}
]};

const ELIM_GLOM = { title:"Nephritis, Nephrotic Syndrome, Nephrosclerosis & PKD", group:"elim", sub:"Glomerulonephritis, pyelonephritis, nephritic vs. nephrotic syndrome, hardening of the renal arteries, and polycystic kidney disease.", lessons:[
{ id:"elim-gn", title:"Glomerulonephritis", kicker:"An immune reaction in the glomeruli — often after a recent strep infection",
  blocks:[
   {p:"Glomerulonephritis is <strong>inflammation of the glomeruli</strong>, the kidney's filtering capillaries. In the classic acute form, <strong>antigen–antibody complexes from a recent streptococcal infection</strong> (often strep throat, typically about 2–3 weeks earlier) lodge in the glomeruli, causing inflammation and a <strong>decreased glomerular filtration rate</strong>. This is an immune reaction to the infection — not bacteria infecting the kidney itself."},
   {hook:"Glomerulonephritis vs. pyelonephritis: glomerulonephritis is an <em>immune</em> problem (antibody complexes after strep), so antibiotics alone don't fix the kidney. Pyelonephritis is an <em>infection</em> of the kidney itself, so antibiotics are the treatment."},
   {hook:"<b>Primary presenting features of acute glomerulonephritis:</b> hematuria, edema, azotemia (excess nitrogenous wastes in the blood), and proteinuria."},
   {hook:"<b>Causes beyond strep:</b> acute glomerulonephritis is also associated with <b>varicella zoster virus, hepatitis B, and Epstein-Barr virus</b>."},
   {h:"Priority assessments/cues"},
   {list:[
    "<strong>Recent strep infection</strong> — ask about a sore throat or skin infection in the past few weeks",
    "<strong>Headache</strong>",
    "<strong>Elevated blood pressure</strong> — from sodium and water retention",
    "<strong>Facial / periorbital edema</strong> — often most noticeable in the morning",
    "<strong>Lethargy</strong>",
    "<strong>Low-grade fever</strong>",
    "<strong>Weight gain</strong> (from edema)",
    "Urine: <strong>proteinuria, hematuria, oliguria, dysuria</strong>; urine may be dark, <strong>tea- or cola-colored</strong> from blood",
    "Signs of fluid overload — crackles, dyspnea, JVD"]},
   {h:"Priority laboratory/diagnostic cues"},
   {list:[
    "Urinalysis — <strong>hematuria</strong> with RBC casts, proteinuria (mild to moderate), increased specific gravity",
    "<strong>Elevated antistreptolysin O (ASO) titer</strong> — evidence of a recent strep infection",
    "Elevated BUN and creatinine; decreased GFR",
    "Decreased serum complement levels",
    "Elevated ESR (inflammation)",
    "Kidney biopsy may be done to confirm the type"]},
   {h:"Priority interventions/collaborative actions"},
   {list:[
    "<strong>Rest</strong> during the acute phase, until urine clears and BP normalizes",
    "Monitor BP closely; give <strong>antihypertensives</strong> as ordered",
    "<strong>Sodium and fluid restriction</strong>; daily weights; strict I&amp;O",
    "<strong>Loop diuretics</strong> for edema and fluid overload",
    "<strong>Antibiotics</strong> if a strep infection is still present (treats the infection, not the kidney inflammation)",
    "<strong>Corticosteroids</strong> and other immunosuppressants for some forms (such as rapidly progressive disease) to suppress the immune reaction",
    "Protein restricted if azotemia is significant; adequate calories",
    "Teach the patient to report decreased urine output, increasing edema, or headache; teach the importance of treating future strep infections fully"]},
   {h:"Priority actual & potential complications"},
   {list:["<strong>Hypertensive encephalopathy</strong> — severe headache or neuro changes = <strong>emergency</strong>","Heart failure and pulmonary edema from fluid overload","Acute kidney injury","Progression to chronic glomerulonephritis and CKD"]},
   {p:"The Nephritic vs. Nephrotic slide also names <strong>Berger's disease (IgA nephropathy)</strong> as the most common cause of primary glomerulonephritis — an immune condition in which IgA antibody deposits in the glomeruli, often producing hematuria after an upper respiratory infection."}
  ],
  check:{stem:"A client developed periorbital edema, hypertension, and cola-colored urine two weeks after a sore throat. Which lab result supports the suspected diagnosis?",
   options:["Elevated antistreptolysin O (ASO) titer","Positive urine culture for E. coli","Serum albumin of 5.0 g/dL","Decreased serum creatinine"],
   answer:0,
   why:"An elevated ASO titer shows a recent streptococcal infection, supporting acute poststreptococcal glomerulonephritis. E. coli in the urine points to pyelonephritis/UTI."}
},
{ id:"elim-pyelo", title:"Pyelonephritis", kicker:"Bacterial infection of the kidney — acute illness, and scarring when it becomes chronic",
  blocks:[
   {p:"Pyelonephritis is <strong>not a simple UTI</strong> — it is a <strong>bacterial infection of the renal pelvis, tubules, and interstitial tissue</strong> of the kidney. It usually starts as a lower urinary tract infection that <strong>ascends</strong> from the bladder up the ureters. <em>E. coli</em> is the most common organism. The lecture image contrasts a normal kidney with a pyelonephritic kidney showing <strong>inflammation, pus, scarring, and atrophy of the cortex</strong>."},
   {h:"Risk factors"},
   {list:[
    "Lower UTI that isn't treated or treated fully",
    "Urinary obstruction or stasis — stones, BPH, tumors",
    "Vesicoureteral reflux (urine flowing backward from the bladder into the ureters)",
    "Indwelling urinary catheters and instrumentation",
    "Pregnancy",
    "Diabetes and immunosuppression",
    "Female anatomy (shorter urethra)"]},
   {h:"Acute vs. chronic"},
   {table:{head:["","Acute pyelonephritis","Chronic pyelonephritis"],rows:[
    ["<strong>What it is</strong>","An active kidney infection","Repeated or persistent infections causing scarring and loss of kidney tissue"],
    ["<strong>Cues</strong>","Fever and chills, <strong>flank pain</strong>, <strong>costovertebral angle (CVA) tenderness</strong>, nausea/vomiting, malaise, plus lower UTI symptoms (dysuria, frequency, urgency); cloudy, foul-smelling urine","Often few symptoms until late — fatigue, headache, hypertension, poor appetite, polyuria and nocturia (the kidney loses concentrating ability)"],
    ["<strong>Outcome</strong>","Usually resolves with antibiotics","Scarring, atrophy, and progression to CKD"]
   ]}},
   {h:"Priority laboratory/diagnostic cues"},
   {list:[
    "Urinalysis — WBCs (pyuria), <strong>WBC casts</strong> (confirm the infection is in the kidney, not just the bladder), bacteria, positive nitrites and leukocyte esterase, possibly hematuria",
    "<strong>Urine culture and sensitivity</strong> — collect <strong>before</strong> starting antibiotics",
    "CBC — leukocytosis",
    "Blood cultures if urosepsis is suspected",
    "Imaging (ultrasound or CT) to look for obstruction or abscess"]},
   {h:"Priority interventions/collaborative actions"},
   {list:[
    "<strong>IV antibiotics</strong> as ordered, then oral — often about 2 weeks total. Teach the patient to <strong>finish the entire course</strong> even when feeling better, to clear the infection and <strong>prevent kidney scarring</strong>",
    "Follow-up urine culture to confirm the infection is cleared",
    "<strong>High fluid intake — 2–3 L/day</strong> unless contraindicated — to flush bacteria; IV fluids until the client can tolerate oral fluids",
    "Collect a <strong>clean-catch</strong> urine sample (teach the correct technique to prevent contamination); use sterile technique if a catheter must be inserted",
    "Analgesics and antipyretics for flank pain and fever; <strong>warm, moist heat to the flank</strong>",
    "<strong>Re-culture the urine after antibiotics are completed</strong> (about 2 weeks after the course ends) to confirm resolution; a relapse may need antibiotics for up to 6 weeks",
    "Measure I&amp;O carefully and check the <strong>temperature every 4 hours</strong> in the hospitalized client",
    "Monitor for signs of urosepsis — hypotension, tachycardia, confusion, high fever",
    "Teach UTI prevention: void frequently and after intercourse, wipe front to back, avoid holding urine, report early UTI symptoms"]},
   {h:"Priority actual & potential complications"},
   {list:["<strong>Urosepsis</strong>, septicemia, and septic shock","Renal abscess","Chronic pyelonephritis with scarring — leading to hypertension, renal calculi, and end-stage kidney disease","AKI and progression to CKD, dialysis, or transplant"]},
   {h:"Priority hypotheses for nursing care"},
   {list:[
    "In older adults, a common cause of pyelonephritis is <strong>catheter-associated urinary tract infection (CAUTI)</strong> — avoid unnecessary catheters",
    "UTIs may be life-threatening in infants and older adults — rapid progression to sepsis",
    "Older adults may present with <strong>new confusion or agitation</strong> rather than classic urinary symptoms"]},
   {h:"Priority medications (antibiotics)"},
   {list:[
    "<strong>Ampicillin</strong> — broad-spectrum; oral, IM, or IV",
    "<strong>Vancomycin</strong> (IV) — often combined with gentamicin or tobramycin; monitor drug levels (trough about 10–20 mcg/mL). Infusing too quickly causes <strong>red man syndrome</strong> (itching and flushing of the head, face, neck, and upper torso)",
    "<strong>Gentamicin, tobramycin</strong> (aminoglycosides) — nephrotoxic and ototoxic; monitor levels and kidney function",
    "<strong>Trimethoprim/sulfamethoxazole</strong> (oral) — may be switched to once culture results are back; check for sulfa allergy",
    "<strong>Ciprofloxacin</strong> (oral, IV) — risk of <strong>tendonitis or tendon rupture</strong> (primarily the Achilles tendon)",
    "NSAIDs for mild pain — the most significant adverse effect is GI bleeding"]}
  ],
  check:{stem:"Which urinalysis finding best indicates that a urinary infection involves the kidney rather than only the bladder?",
   options:["Positive nitrites","Bacteria in the urine","White blood cell casts","Leukocyte esterase"],
   answer:2,
   why:"WBC casts form in the renal tubules, so they show the infection is in the kidney. Nitrites, bacteria, and leukocyte esterase can all be present in a simple bladder infection."}
},
{ id:"elim-nephrotic", title:"Nephrotic Syndrome (and Nephritic vs. Nephrotic)", kicker:"A leaky glomerulus — massive proteinuria, low albumin, severe edema, high lipids",
  blocks:[
   {p:"In nephrotic syndrome, damage to the glomerulus makes it abnormally <strong>permeable to protein</strong> — the lecture's \"leaky glomerulus lets protein out.\" Large amounts of protein, mainly albumin, spill into the urine. The loss of albumin lowers the blood's oncotic pressure, fluid leaks into the tissues, and severe edema follows. The liver responds to low protein by making more lipoproteins, so cholesterol rises."},
   {h:"The four hallmark findings"},
   {list:[
    "<strong>Massive proteinuria</strong> — more than <strong>3.5 g/day</strong> (heavy urinary protein loss)",
    "<strong>Hypoalbuminemia</strong>",
    "<strong>Severe edema</strong> — periorbital, peripheral, and generalized (anasarca), plus ascites",
    "<strong>Hyperlipidemia</strong> — high LDL cholesterol",
    "Urine appears <strong>foamy or frothy</strong> from the protein"]},
   {h:"Causes"},
   {list:["Primary glomerular disease (such as minimal change disease — the most common cause in children)","Diabetes (diabetic nephropathy)","Systemic lupus erythematosus","Chronic glomerulonephritis","Multiple myeloma","Renal vein thrombosis","Other systemic diseases, infections, and certain drugs"]},
   {h:"Priority assessments/cues"},
   {list:[
    "Edema — location and degree; daily weight and abdominal girth",
    "Urine — foamy appearance, output",
    "Signs of infection — immunoglobulins are lost in the urine, so infection risk rises",
    "Signs of blood clots — DVT (unilateral leg swelling, pain), pulmonary embolism, renal vein thrombosis",
    "Skin integrity over edematous areas",
    "Respiratory status if ascites or pleural effusion develops"]},
   {h:"Priority laboratory/diagnostic cues"},
   {list:[
    "24-hour urine protein greater than 3.5 g",
    "Low serum albumin and total protein",
    "Elevated cholesterol, LDL, and triglycerides",
    "BUN and creatinine — may be normal early, rising as disease progresses",
    "Kidney biopsy to identify the underlying cause"]},
   {h:"Priority interventions/collaborative actions"},
   {list:[
    "<strong>Corticosteroids</strong> (prednisone) and other immunosuppressants to reduce proteinuria, depending on the cause",
    "<strong>ACE inhibitors or ARBs</strong> to lower glomerular pressure and reduce protein loss",
    "<strong>Loop diuretics</strong> for edema",
    "Statins for hyperlipidemia; anticoagulants if clots develop or risk is high",
    "Diet: <strong>low sodium</strong>, low saturated fat, and moderate — not high — protein",
    "Meticulous skin care; reposition often; elevate edematous extremities",
    "Infection prevention — hand hygiene, avoid sick contacts, vaccinations as ordered",
    "Encourage mobility to reduce clot risk"]},
   {h:"Priority actual & potential complications"},
   {list:["<strong>Thromboembolism</strong> — clotting proteins are lost in the urine, making the blood hypercoagulable","<strong>Infection</strong>","Accelerated atherosclerosis","Acute kidney injury and progression to CKD"]},
   {h:"Nephritic vs. nephrotic syndrome"},
   {p:"These are often confused. Remember: <strong>Nephritic = blood/HTN</strong>; <strong>Nephrotic = protein/edema</strong>. Neph<strong>r-I-tic</strong> = <strong>I</strong>nflammation; neph<strong>r-O-tic</strong> = <strong>O</strong>verflowing protein."},
   {table:{head:["Feature","Acute glomerulonephritis (nephritic)","Nephrotic syndrome"],rows:[
    ["<strong>Primary cause</strong>","Post-infectious — often strep throat about 2–3 weeks earlier; <strong>Berger's disease (IgA nephropathy)</strong> is the most common cause of primary glomerulonephritis","Glomerular damage causing massive \"leaking\" — e.g., minimal change disease, diabetic nephropathy"],
    ["<strong>Key symptom</strong>","<strong>Cola-colored (smoky) urine</strong> (hematuria); oliguria","<strong>Massive edema</strong> (anasarca/periorbital)"],
    ["<strong>Urinalysis</strong>","RBCs, mild protein","<strong>Massive proteinuria</strong> (more than 3.5 g/day); foamy urine"],
    ["<strong>Blood pressure</strong>","<strong>Hypertension</strong> is common","<strong>Normal or low</strong> (fluid shifts out of the vessels)"],
    ["<strong>Key lab</strong>","<strong>Positive ASO titer</strong> (strep antibodies); rising BUN/creatinine","<strong>Hypoalbuminemia</strong> (low blood protein) and <strong>hyperlipidemia</strong>"],
    ["<strong>Nursing priority</strong>","Manage BP, fluid restriction, antibiotics (if strep is active)","Skin care (edema), infection prevention (loss of immunoglobulins), corticosteroids"]
   ]}},
   {hook:"The Nephritic vs. Nephrotic cartoon: the nephritic side shows an inflamed glomerulus with a BP cuff (HTN), dripping urine (oliguria), and cola-colored urine (hematuria); the nephrotic side shows a swollen patient (peripheral edema), protein in the urine sample (massive proteinuria), and blood full of fat globules (hyperlipidemia) with too little albumin."}
  ],
  check:{stem:"A client with nephrotic syndrome has a serum albumin of 1.8 g/dL. Why does this client have severe edema?",
   options:["Low albumin reduces oncotic pressure, so fluid leaks from the vessels into the tissues","High blood pressure forces fluid into the tissues","The kidneys are retaining potassium","Inflammation of the glomeruli blocks all urine output"],
   answer:0,
   why:"Albumin holds fluid in the vascular space (oncotic pressure). When large amounts are lost in the urine, fluid shifts into the tissues, causing severe edema."}
},
{ id:"elim-nephrosclerosis", title:"Nephrosclerosis", kicker:"Hardening of the renal arteries — the kidney damage of long-standing hypertension",
  blocks:[
   {p:"Nephrosclerosis is <strong>hardening of the renal arteries</strong>. The lecture image shows <strong>plaque building up</strong> where the renal arteries leave the aorta, <strong>narrowing the renal artery</strong>. As the vessels thicken and narrow, blood flow to the kidney falls, the tissue becomes ischemic, and nephrons are gradually lost. It is typically caused by prolonged, <strong>uncontrolled hypertension</strong> or <strong>diabetes</strong> (type 1 or 2), along with atherosclerosis, and it's a major cause of CKD. It's a \"silent killer\": BUN and creatinine rise with minimal symptoms at first."},
   {h:"A two-way street with hypertension"},
   {p:"High blood pressure damages the renal arterioles, and the damaged, underperfused kidney then activates the renin–angiotensin–aldosterone system, which raises blood pressure further. Each problem worsens the other, which is why blood pressure control is the core of management."},
   {h:"Two forms"},
   {table:{head:["","Benign nephrosclerosis","Accelerated (malignant) nephrosclerosis"],rows:[
    ["<strong>Associated with</strong>","Long-standing, often moderate hypertension; aging; atherosclerosis","Severely elevated blood pressure (hypertensive emergency)"],
    ["<strong>Course</strong>","Slow and gradual; often no symptoms early","Rapid — kidney function can decline over weeks"],
    ["<strong>Cues</strong>","Hypertension, mild proteinuria, slowly rising BUN and creatinine","Severe hypertension, headache, visual changes (hypertensive retinopathy), rapidly rising BUN and creatinine, proteinuria, hematuria"]
   ]}},
   {h:"Priority assessments/cues"},
   {list:[
    "Blood pressure trends",
    "Kidney function labs over time — BUN, creatinine, GFR",
    "Urine — protein, blood",
    "Risk factors — hypertension, diabetes, smoking, hyperlipidemia, older age",
    "Vision changes and headache (malignant form)",
    "Signs of CKD as it progresses"]},
   {h:"Priority interventions/collaborative actions"},
   {list:[
    "<strong>Aggressive blood pressure control</strong> is the primary intervention — the only way to slow progression to ESRD. ACE inhibitors (or ARBs) are often preferred because they also protect the kidney and reduce proteinuria; beta blockers are also used",
    "Lifestyle: sodium restriction, weight management, exercise, <strong>smoking cessation</strong>, limit alcohol",
    "Lipid control (statins) and glucose control",
    "Monitor kidney function regularly",
    "Teach medication adherence — uncontrolled BP drives progression",
    "As function declines, CKD management and eventually dialysis or transplant"]},
   {h:"Priority actual & potential complications"},
   {list:["Progression to CKD and ESRD","Hypertensive emergency (malignant form)","Cardiovascular disease — heart attack and stroke share the same vascular process"]}
  ],
  check:{stem:"Which intervention is the priority for slowing the progression of nephrosclerosis?",
   options:["Increasing dietary protein","Controlling blood pressure","Increasing fluid intake to 3 L/day","Starting a potassium supplement"],
   answer:1,
   why:"Nephrosclerosis is driven by hypertension damaging the renal arteries, and the damaged kidney raises BP further. Aggressive blood pressure control is the core of slowing progression."}
},
{ id:"elim-pkd", title:"Polycystic Kidney Disease (PKD)", kicker:"An inherited disorder — fluid-filled cysts crowd out the nephrons",
  blocks:[
   {p:"Polycystic kidney disease is a <strong>genetic</strong> disorder in which numerous fluid-filled cysts grow in the kidneys, enlarging them and destroying the nephrons. There's no cure — it progresses to <strong>CKD and kidney failure</strong>. It's the most common inherited cause of kidney failure."},
   {h:"Types"},
   {table:{head:["","Autosomal dominant (ADPKD — \"adult\")","Autosomal recessive (ARPKD — \"infantile\")"],rows:[
    ["<strong>How common</strong>","Most common form (about 90%)","Rare (about 10%)"],
    ["<strong>Inheritance</strong>","One affected parent can pass it on","Both parents are carriers but unaffected"],
    ["<strong>Onset</strong>","Often no symptoms until about age 30–40; progresses to end-stage kidney disease","Begins in utero or the first months of life; often fatal in infancy"]
   ]}},
   {p:"Cysts can also form in the <strong>liver and pancreas</strong>, and clients are at risk for <strong>brain (cerebral) aneurysms</strong> and cardiovascular problems."},
   {h:"Priority cues"},
   {list:[
    "<strong>Flank, lumbar, or abdominal pain</strong> — worse with activity, relieved by lying down; increasing <strong>abdominal fullness and girth</strong>",
    "<strong>Palpable, enlarged kidneys</strong> / abdominal masses",
    "<strong>Hypertension</strong> (often an early finding) — the finding the nurse is <strong>most likely</strong> to assess; it is present in about 75% of clients at diagnosis",
    "<strong>Hematuria</strong> (cyst rupture), proteinuria, pyuria",
    "<strong>Recurrent UTIs</strong>, fever and chills (infected cysts); <strong>kidney stones</strong>",
    "Signs of progressing CKD — rising BUN/creatinine, the fluid and electrolyte problems of renal failure",
    "A <strong>family history</strong> of kidney disease"]},
   {h:"Diagnostics"},
   {list:["<strong>Renal ultrasound</strong> — the preferred test to see the cysts","Genetic testing if imaging is unclear; family history","Urinalysis, BUN/creatinine, GFR"]},
   {h:"Priority interventions"},
   {list:[
    "<strong>Control blood pressure</strong> (antihypertensives) to slow the decline",
    "<strong>Pain management</strong> — avoid NSAIDs and aspirin (bleeding risk and they're nephrotoxic); dry heat to the flank or abdomen for comfort",
    "Monitor for <strong>gross hematuria</strong> (cyst rupture) — bed rest if a cyst ruptures",
    "Prevent and treat <strong>UTIs</strong>; antibiotics for infected cysts",
    "Adequate fluids; in early disease some clients lose sodium rather than retain it, so sodium and water may be encouraged as prescribed",
    "Prevent constipation (enlarged kidneys press on the colon) — fiber, fluids, activity",
    "<strong>Tolvaptan</strong> may be prescribed to slow the loss of kidney function — watch for polyuria/thirst and liver injury",
    "Percutaneous drainage of a cyst for obstruction or abscess",
    "Prepare for <strong>dialysis or transplant</strong> as the kidneys fail",
    "<strong>Genetic counseling</strong> for the client and family; psychosocial support"]},
   {hook:"PKD is the one renal exemplar you can inherit. Think <b>big kidneys + family history + hypertension + flank pain and hematuria</b> — and remember it ends in the same place as every other exemplar: CKD, with fluid overload, high potassium, high phosphorus, and low calcium."}
  ],
  check:{stem:"A client with autosomal dominant polycystic kidney disease reports flank pain. Which medication should the nurse question?",
   options:["Acetaminophen","Ibuprofen","A prescribed antihypertensive","An antibiotic for a urinary tract infection"],
   answer:1,
   why:"NSAIDs such as ibuprofen are avoided in PKD — they increase bleeding risk from cysts and are nephrotoxic in a disease that is already destroying kidney function. Acetaminophen, antihypertensives, and antibiotics for UTIs are all part of expected care."}
}
]};

{ id:"sens-lowvision", title:"Impaired Vision: Helping a Client Adjust", kicker:"Communication, safety, and the environment for a client who can't see well",

    "Explain what you are doing before you touch the client or start a procedure",
    "Describe the surroundings and who else is in the room",
    "Use the <strong>clock method</strong> to describe a meal tray (\"your coffee is at 2 o'clock, the potatoes are at 6 o'clock\")",
    "Offer large-print or audio materials, and read important documents aloud"]},

   {list:[

    "Keep pathways clear of clutter, cords, and spills; keep doors fully open or fully closed",
    "Keep the call light and personal items within reach",
    "Provide good lighting while reducing glare",
    "Use high-contrast colors (for example, a dark plate on a light tray, colored tape on step edges)",
    "<strong>Sighted guide technique:</strong> offer your arm; the client holds it just above your elbow and walks about a half step (one step) behind you while you keep your arm close to your body so the client can feel the direction of movement; describe steps, curbs, and doorways as you approach them",

   {list:[

    "Referral to low-vision services, occupational therapy, and community resources",
    "Encourage the client to do as much as possible independently",
    "Allow time to grieve — vision loss changes driving, reading, work, and independence; watch for depression and social isolation"]},
   {hook:"Legal blindness is defined as central visual acuity of 20/200 or less in the better eye with correction, or a visual field of 20 degrees or less."}
