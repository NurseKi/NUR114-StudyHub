{
"h": "4.5 ACLS Algorithms (2025)"
},
{
"p": "<b>Tachycardia with a pulse</b>"
},
{
"list": [
"<b>Unstable</b> = hypotension, acutely altered mental status, signs of shock, ischemic chest discomfort, or acute HF → <b>synchronized cardioversion</b> (sedate whenever feasible; device-recommended energy, maximum if unknown). Consider adenosine if regular and narrow",
"<b>Stable, narrow QRS (&lt; 0.12 s):</b> vagal maneuvers, adenosine if regular, beta blocker or CCB, expert consultation",
"<b>Stable, wide QRS (≥ 0.12 s):</b> adenosine only if regular and monomorphic; antiarrhythmic infusion (procainamide 20–50 mg/min up to 17 mg/kg — avoid with prolonged QT or CHF — or amiodarone); expert consultation",
"Always: airway, O₂ if hypoxemic, monitor, BP/oximetry, IV access, 12-lead EKG"
]
},
{
"p": "<b>Bradycardia with a pulse</b>"
},
{
"list": [
"Treat only if the bradycardia (typically &lt; 50) causes hypotension, altered mental status, shock, ischemic chest discomfort, or acute HF — otherwise support ABCs, find the cause, observe",
"<b>Atropine first</b>, then transcutaneous pacing and/or dopamine or epinephrine infusion; consider expert consultation and transvenous pacing"
]
},

{
"h": "<span style=\"font-size:1.05em\">Part 5 · Heart Failure</span>"
},
{
"p": "Heart failure is how well the heart pumps blood to the body. It is a <b>chronic condition that can have acute exacerbations</b>, and it is the classic \"volume\" problem — both types involve fluid volume overload. The goal is to treat the underlying cause and keep the patient out of exacerbation."
},

],
[

"Structural changes but no symptoms"
],
[
"<b>3 · Heart failure</b>",
"Symptoms present"
],
[
"<b>4 · Advanced</b>",
"End stage"
]
]
}
},
{
"h": "5.2 Systolic vs. Diastolic"
},
{
"p": "An <b>echocardiogram</b> tells you which type. A patient can have both."
},
{
"table": {
"head": [
"",

"h": "5.3 Left-Sided vs. Right-Sided"
},
{
"table": {
"head": [
"",
"Left-sided failure",
"Right-sided failure"
],

[
"<b>Backs up to</b>",

"<b>Rest of the body</b>"
],
[

"Pulmonary congestion/edema, wet cough, crackles, wheezes, dyspnea, orthopnea, tachypnea, tachycardia, blood-tinged sputum, confusion, restlessness, cyanosis, fatigue",

},
{
"hook": "<b>Watch the wording</b><br>The left ventricle pumps TO the body, but when it fails blood backs up into the <b>LUNGS</b>. The right ventricle pumps to the lungs, but when it fails blood backs up into the <b>BODY</b>. Left failure = lungs; right failure = body."
},
{
"h": "5.4 Priority Assessments"
},
{
"list": [
"Lung sounds (crackles, wheezes), cough, orthopnea, SOB, O₂ sat, RR",

"Edema, JVD, ascites, weight gain — <b>daily weights</b> and I&amp;O",
"Mental status (confusion, restlessness) and urine output",
"Heart sounds — a <b>new murmur</b> means something changed"
]
},
{

},
{
"list": [
"<b>Echocardiogram</b> — type and ejection fraction",
"<b>BNP</b> — high = big and boggy heart",
"<b>Potassium</b> and other electrolytes, especially on diuretics",
"EKG for rhythm (A-fib is common); <b>digoxin level</b> if on digoxin"
]
},
{
"h": "5.6 Priority Interventions"
},
{
"list": [
"<b>Treat the underlying cause</b>",
"<b>Limit sodium</b> and possibly fluids (fluid volume overload)",
"<b>Adequate rest</b> to avoid tachycardia; <b>mild exercise</b> started very low and controlled — cardiac rehab first if needed",
"Stop smoking and alcohol; keep oxygenation adequate",
"<b>Diuretics</b> take the fluid off (monitor K⁺); <b>CPAP</b> forces O₂ in when the patient cannot take a deep breath",
"Medications: diuretics, ACE inhibitors, ARBs/ARNI (Entresto), beta blockers, SGLT2 inhibitors, nitrates, digoxin — nitrates and digoxin can be added if the patient cannot tolerate ACE/ARB/ARNI",
"Slides by stage: lifestyle + SGLT2 → ACE inhibitor, beta blocker, statin → ARNI + diuretic (potassium-sparing to start) → device and IV management"
]

{

},

},
{
"hook": "<b>A PE is a DVT that broke off and went to the lungs</b><br>The <b>#1 cause of PE is a DVT</b>, so the best thing to do is <b>prevent</b>. Risk factors: oral contraceptives/hormones, post-surgery, bedbound."
},

"Detail"

],

],
[

"Elevate legs; do NOT bend the knees or cross the legs — <b>no pillows behind the knees</b>"
],
[
"<b>Medication</b>",
"Anticoagulants"
],
[

"<b>Massage the clot</b>"
],
[

"Healthy lifestyle"
]
]
}

{

},
{
"h": "7.1 Anemia"
},
{
"p": "The body is either <b>not making enough</b> red blood cells or <b>destroying them too fast</b>. Several types exist. Chronic kidney failure patients have anemia."
},
{
"table": {
"head": [
"System",
"Findings"
],
"rows": [
[
"<b>Skin</b>",
"Paleness, cold, <b>jaundice</b> (yellow eyes from rapid RBC breakdown)"
],
[
"<b>Respiratory</b>",
"SOB"
],
[
"<b>Muscle</b>",
"Weakness, fatigue"
],
[
"<b>Vitals</b>",
"<b>Low BP, high HR</b>"
],
[
"<b>Other</b>",
"Spleen enlargement (RBCs destroyed too fast)"
]
]
}
},
{
"hook": "<b>Anemia = decreased cardiac output</b><br>Same nursing care as decreased CO. Tachycardic → <b>sit down and rest</b>. Space activities with rest periods, small self-care tasks, good hydration."
},
{
"list": [
"<b>Diet and meds</b> — iron, folic acid, vitamin B (red meat), folate; if diet does not work → <b>epoetin alfa</b> injection",
"<b>Teach</b> — frequent rest and adequate diet"
]
},
{
"h": "7.2 Types of Anemia — Iron Deficiency vs. Folic Acid/B12"
},
{
"hook": "<b>Added from standard nursing content</b><br>Your class notes do not break anemia into types, so this table comes from standard nursing content. Check it against your textbook chapter."
},
{
"table": {
"head": [
"",
"Iron deficiency",
"Folic acid / B12 deficiency"
],
"rows": [
[
"<b>Causes</b>",
"Blood loss (GI bleeding, heavy periods), poor intake, pregnancy, poor absorption",

],
[
"<b>RBC size</b>",
"Small, pale cells (microcytic)",
"Large cells (macrocytic/megaloblastic)"
],
[
"<b>Unique signs</b>",
"Fatigue, pallor, brittle or spoon-shaped nails, pica (craving ice or dirt), sore tongue",
"Fatigue, pallor, smooth red tongue. <b>B12 only: neuro signs</b> — numbness, tingling, poor balance, confusion"
],
[
"<b>Foods</b>",
"Red meat, liver, leafy greens, beans, iron-fortified cereal",
"Folic acid: leafy greens, citrus, beans, fortified grains. B12: meat, eggs, dairy"
],
[
"<b>Treatment</b>",
"Oral iron (ferrous sulfate); IV iron if severe",
"Folic acid tablets. B12 injections — <b>lifelong</b> for pernicious anemia"
]
]
}
},
{
"h": "7.3 Hemophilia"
},
{
"p": "A genetic, <b>recessive X-linked</b> clotting factor deficiency — <b>males</b> are at higher risk."
},
{
"table": {
"head": [
"Severity",
"What to expect"
],
"rows": [
[
"<b>Mild</b>",
"May not know they have it; bleeds more with trauma or after surgery"
],
[
"<b>Moderate</b>",
"They will probably know"
],
[
"<b>Severe</b>",
"<b>Spontaneous bleeds</b> into joints, muscles, and the GI tract"
]
]
}
},
{
"list": [
"<b>Nursing care</b> — give the clotting factor, especially when bleeding",
"<b>Teach</b> — how to do their own IV; <b>NO heat</b>; pressure to stop a bleed but <b>not too much</b> (compartment syndrome); elevate the limb and rest so the blood is reabsorbed",
"Antiplatelets are contraindicated in hemophilia"
]
},
{
"h": "7.4 Sickle Cell Disease"
},
{
"p": "<b>Autosomal recessive.</b> Red blood cells are crescent-shaped, so they clump together and form clots."
},
{
"table": {
"head": [
"Risk",
"Key point"

"Perfusion and oxygenation problem"
],
[
"<b>Sickle cell crisis</b>",
"Pain and clotting"
]
]
}
},
{
"hook": "<b>HOPP — the management goals</b><br><b>H</b>ydrate (avoid triggers) · <b>O</b>xygenate (acute chest syndrome) · <b>P</b>erfuse (HF, stroke, reproductive and wound issues) · <b>P</b>ain (control the crisis). Goal = perfusion and pain control."

"h": "8.1 ACE Inhibitors, ARBs &amp; ARNI"
},
{
"table": {
"head": [
"ACE inhibitors (\"-pril\") — lisinopril, benazepril"
],
"rows": [
[
"<b>Use</b>",
"Dilate vessels → ↓ afterload, ↓ BP and workload, ↓ fluid (preload), prevent remodeling. HF, CAD, HTN"
],
[
"<b>Black box</b>",
"<b>Pregnancy</b> — fetal injury/death. <b>Angioedema</b> (mouth, tongue, neck) — even after years on the drug"
],
[
"<b>Watch</b>",
"<b>Dry hacking cough</b> (switch to an ARB), hypotension, proteinuria, tachycardia"
],
[
"<b>Nursing</b>",
"Check BP first; monitor K⁺ and kidney function; orthostatic hypotension; avoid with ARBs unless ordered"
],
[
"<b>Teaching</b>",
"Dizziness/fall risk; <b>avoid salt substitutes</b>; take consistently"
]
]
}
},
{
"table": {
"head": [
"ARBs (\"-sartan\") — losartan, valsartan"
],
"rows": [
[
"<b>Use</b>",
"HF (↓ BP and fluid) · CAD (↓ workload) · stroke (HTN) · A-fib (↓ onset and recurrence)"
],
[
"<b>Black box</b>",
"<b>Fetal toxicity</b> — stop immediately"
],
[
"<b>Nursing</b>",
"Vitals, electrolytes, kidney function, I&amp;O"
],
[
"<b>Teaching</b>",
"Rebound HTN if stopped; adherence; lifestyle changes"
]
]
}
},
{
"table": {
"head": [

],
"rows": [
[

"Chronic heart failure with reduced EF (HFrEF). Valsartan (ARB) lowers BP and afterload; sacubitril blocks neprilysin so the body keeps more natriuretic peptides → vasodilation and sodium/water loss"
],
[
"<b>Black box</b>",
"<b>Fetal toxicity</b> — stop if pregnant"
],
[

[
"<b>4 B's</b>",
"<b>B</b>radycardia · <b>B</b>P drop · <b>B</b>ronchoconstriction (no asthma) · <b>B</b>lood sugar masking"
],
[
"<b>Nursing</b>",
"<b>Call provider if HR &lt; 60</b>; edema, daily weights, cold extremities, paresthesia"
],
[
"<b>Teaching</b>",
"Do not stop abruptly; rise slowly; check HR at home; hypoglycemia signs; nothing OTC without approval"
]
]
}
},
{
"table": {
"head": [
"Calcium channel blockers — diltiazem (\"dilates\"), amlodipine, nifedipine"
],
"rows": [
[
"<b>Use</b>",
"Vasodilate → ↓ afterload and O₂ demand, ↑ perfusion to the heart; slow SA firing and AV conduction"
],
[
"<b>Black box</b>",
"Nifedipine — ↑ risk of MI, stroke, arrhythmias"
],
[
"<b>Nursing</b>",
"<b>Hold and notify if SBP &lt; 90 or HR &lt; 60</b>; swelling of hands/feet, SOB; <b>no grapefruit</b>"
],
[
"<b>Teaching</b>",
"Stopping abruptly ↑ chest pain; NTG may be taken for acute angina"
]
]
}
},
{
"h": "8.3 Antiarrhythmics &amp; Digoxin"
},
{
"table": {
"head": [
"Antiarrhythmics — amiodarone, lidocaine"
],
"rows": [
[
"<b>Use</b>",
"Block K⁺ and Na⁺ channels to slow impulses. Amiodarone slows it down. <b>Lidocaine = ventricular only</b>"
],
[
"<b>Black box</b>",
"<b>Fatal lung and liver toxicity</b> · proarrhythmic · ↑ QT interval"
],
[
"<b>Nursing</b>",
"Electrolytes, renal and hepatic function, seizure risk"
],
[
"<b>Teaching</b>",
"Avoid grapefruit juice; sun sensitivity, blue-gray skin; report vision or urine changes, jaundice, lightheadedness, SOB"
]
]
}
},
{
"table": {
"head": [
"Digoxin — cardiac glycoside"
],
"rows": [
[
"<b>Use</b>",
"Heart failure. Normal level <b>0.8–2.0</b>"
],
[
"<b>DIGIT</b>",
"<b>D</b>ecreased HR · <b>I</b>ncreased contractility · <b>G</b>I symptoms (N/V/diarrhea) · <b>I</b>ons (hypokalemia worsens toxicity) · <b>T</b>oxicity"
],
[
"<b>Toxicity</b>",
"Know the toxic level · yellow/green vision changes · antidote <b>Digibind</b> · black box V-fib · main NCLEX red-flag drug"
]
]
}
},
{
"h": "8.4 Vasopressors &amp; Atropine — for Bradycardia"
},
{
"table": {
"head": [
"Vasopressors — epinephrine, norepinephrine, dopamine"
],
"rows": [
[
"<b>Use</b>",
"Systolic HF, bradyarrhythmias, low perfusion/BP, ischemia. ICU/ER only — nobody goes home on these"
],
[
"<b>Black box</b>",
"<b>Vesicants</b> — extravasation damages tissue; antidote <b>phentolamine</b>. Contraindicated in CAD"
],
[
"<b>Nursing</b>",
"Large IV/central line; titrate; vitals q5 min; pulses, cap refill; epi/norepi photosensitive (cover); watch PVCs, SVT, V-tach"
]
]
}
},
{
"table": {
"head": [
"Atropine — anticholinergic"
],
"rows": [
[
"<b>Use</b>",
"<b>First-line drug for symptomatic bradycardia</b> — blocks vagal slowing so the SA node fires faster"
],
[
"<b>Dose</b>",
"1 mg IV push, repeat q3–5 min, <b>max 3 mg</b>. Fast onset, short half-life — a band aid"
],
[
"<b>Watch</b>",
"Tachycardia, dry mouth, blurred vision, urinary retention, confusion in older adults"
],
[
"<b>Nursing</b>",
"Telemetry (HR, rhythm, O₂, BP). Not for A-fib. If it fails → pacing and/or dopamine or epinephrine drip"
]
]
}
},
{
"h": "8.5 Anticoagulants, Antiplatelets &amp; Thrombolytics"
},
{
"table": {
"head": [
"Anticoagulants — heparin, warfarin, Lovenox (enoxaparin)"
],
"rows": [
[
"<b>Use</b>",
"Prevent PE and DVT; stop clotting of stagnant blood in the heart (heparin for A-fib/flutter)"
],
[
"<b>Black box</b>",
"<b>Huge bleeding risk</b> · fetal bleeding · heparin-induced thrombocytopenia"
],
[
"<b>Nursing</b>",
"<b>Heparin = PTT · Warfarin = PT/INR.</b> Do NOT remove the Lovenox air bubble. Check gums and stool"
]
]
}
},
{
"table": {
"head": [
"Antiplatelets — clopidogrel (Plavix), aspirin"
],
"rows": [
[
"<b>Use</b>",
"Long-term clot prevention; aspirin first line for CAD (chew in an emergency); stroke/TIA prevention"
],
[
"<b>Black box</b>",
"Hemorrhage, kidney failure, <b>liver toxicity</b>, angioedema, Reye's syndrome"
],
[
"<b>Avoid</b>",
"Impaired kidneys, hemophilia, PUD, NSAIDs; <b>no aspirin with warfarin</b>; clopidogrel — <b>no grapefruit</b>"
],
[
"<b>Nursing</b>",
"Bleeding precautions — does NOT dissolve existing clots"
]
]
}
},
{
"table": {
"head": [
"Thrombolytics (\"-ase\") — alteplase, tenecteplase"
],
"rows": [
[
"<b>Use</b>",
"Destroy clots, restore perfusion — <b>ischemic stroke within 3 hours</b>. Exam 4 Meds sheet also lists DVT and PE"
],
[
"<b>Contraindicated</b>",
"Active bleeding, head trauma, surgery &lt; 2 weeks, uncontrolled HTN, severe hypotension, hemorrhagic stroke history, allergy"
],
[
"<b>Nursing</b>",
"Not mixed with other IV drugs; ER/ICU only; <b>stop for any bleeding</b>; watch GI, urine, BP/HR, belly swelling; labs from a central line"
],
[
"<b>Teaching</b>",
"Electric razor, soft toothbrush, report prolonged bleeding; stroke signs — face, arm, speech, call 911"
]
]
}
},
{
"h": "8.6 Statins &amp; Nitroglycerin"
},
{
"table": {
"head": [
"Statins — rosuvastatin, atorvastatin"
],
"rows": [
[
"<b>Use</b>",
"Interrupt cholesterol synthesis — prevent plaque (CAD)"
],
[
"<b>Black box</b>",
"<b>Rhabdomyolysis</b>; can raise blood sugar and damage the liver"
],
[
"<b>Nursing</b>",
"Baseline liver and kidney labs; muscle pain; urine appearance"
],
[
"<b>Teaching</b>",
"Take as prescribed; lab follow-ups; DASH diet, exercise, quit smoking"
]
]
}
},
{
"table": {
"head": [
"Nitroglycerin"
],
"rows": [
[
"<b>Use</b>",
"Vasodilator for angina"
],
[
"<b>Watch</b>",
"BP drops, HR goes up"
],
[
"<b>Key point</b>",
"<b>Max 3 tablets</b>, 5 minutes apart → then ER"
],
[
"<b>Teaching</b>",
"Carry at all times; amber glass, out of the sun"
]
]
}
},
{
"h": "8.7 Diuretics &amp; Blood Disorder Drugs"
},
{
"table": {
"head": [
"Furosemide — loop diuretic"
],
"rows": [
[
"<b>Use</b>",
"Fluid off in FVO and HF (↓ preload) — priority drug in acute HF"
],
[
"<b>Nursing</b>",
"<b>Monitor potassium</b>; potassium chloride may be given"
]
]
}
},
{
"table": {
"head": [
"Hydroxyurea"
],
"rows": [
[
"<b>Use</b>",
"Sickle cell — ↓ sickle cell adhesion, may prevent stroke; chemo drug"
],
[
"<b>Watch</b>",
"<b>Bone marrow suppression</b> — do not give if WBC too low; bleeding risk; secondary cancer; mouth sores, hair loss"
],
[
"<b>Nursing</b>",
"Wear gloves when handling"
],
[
"<b>Teaching</b>",
"Infection signs; regular labs; contraception (teratogenic); male infertility; sun protection"
]
]
}
},
{
"table": {
"head": [
"Iron supplements — ferrous sulfate (PO), IV iron"
],
"rows": [
[
"<b>Use</b>",
"Iron deficiency anemia"
],
[
"<b>Nursing</b>",
"Best absorbed between meals with <b>vitamin C</b> (orange juice); give with food if GI upset. Keep apart from antacids, dairy, and calcium"
],
[
"<b>Teaching</b>",
"Liquid iron <b>through a straw</b> (stains teeth); <b>dark/black stools are expected</b>; constipation → fluids and fiber"
]
]
}
},
{
"table": {
"head": [
"Folic acid &amp; vitamin B12 (cyanocobalamin)"
],
"rows": [
[
"<b>Use</b>",
"Folic acid deficiency anemia; also promotes healthy RBCs in sickle cell. B12 for B12 deficiency/pernicious anemia"
],
[
"<b>Key point</b>",
"Pernicious anemia cannot absorb oral B12 → <b>injections for life</b>"
],
[
"<b>Teaching</b>",
"Folate foods: leafy greens, citrus, beans, fortified grains. B12 foods: meat, eggs, dairy. Limit alcohol"
]
]
}
},
{
"table": {
"head": [
"Epoetin alfa"
],
"rows": [
[
"<b>Use</b>",
"Anemia (especially chronic kidney failure) when diet, iron, folic acid, and B vitamins are not enough — stimulates RBC production"
],
[
"<b>Nursing</b>",
"Monitor Hgb and BP; iron stores must be adequate for it to work"
]
]
}
},
{
"table": {
"head": [
"Clotting factors — factor VIII (hemophilia A), factor IX (hemophilia B)"
],
"rows": [
[
"<b>Use</b>",
"Replace the missing clotting factor — for active bleeds, before procedures, or on a schedule to prevent bleeds"
],
[
"<b>Nursing</b>",
"IV infusion; monitor for bleeding and allergic reaction; avoid IM injections, aspirin, and NSAIDs"
],
[
"<b>Teaching</b>",
"How to self-infuse at home; for a bleed: factor, pressure (not too much), elevate, rest, <b>no heat</b>"
]
]
}
},
{
"table": {
"head": [
"Ketorolac &amp; enoxaparin in sickle cell"
],
"rows": [
[
"<b>Ketorolac</b>",
"Pain control — <b>caution with kidneys</b> (NSAID)"
],
[
"<b>Enoxaparin</b>",
"Prevents micro clots"
]
]
}
}

const SKY_WORKBOOK = [
{
id:"skynotes-wb-foundations",
title:"Sky's Workbook — Perfusion Foundations, Diagnostics & CAD",
kicker:"Workbook questions with answer key · foundations, labs, cardiac cath, decreased CO, CAD &amp; angina",
blocks:[
{p:"Fill it in from memory first, then check the answer under each question. Anything you miss goes on your final-review list."},
{h:"<span style=\"font-size:1.05em\">Perfusion Basics</span>"},
{h:"1.  What is perfusion?"},
{p:"Blood delivery to tissue."},
{h:"2.  What are the three categories of perfusion problems? Give an exemplar for each."},
{list:[
"<b>Volume</b> (too little volume or pumping) — heart failure, tachy/bradycardia, anemia, hemophilia",
"<b>Narrowing</b> (a vessel is too small) — coronary artery disease",
"<b>Clots</b> (something is blocking flow) — pulmonary emboli, brain attack (stroke)"
]},
{h:"3.  Trace the flow of blood through the heart, starting with blood returning from the body."},
{list:[
"1. Body → superior/inferior vena cava",
"2. Right atrium",
"3. Tricuspid valve",
"4. Right ventricle",
"5. Pulmonary valve",
"6. Pulmonary artery",
"7. Lungs",
"8. Left atrium",
"9. Bicuspid (mitral) valve",
"10. Left ventricle",
"11. Aortic valve → aorta → rest of the body"
]},
{h:"4.  When are the coronary arteries perfused? Why does a fast heart rate put the heart muscle at risk?"},
{p:"In <b>diastole</b> (every other organ is perfused during systole). The left ventricle pushes blood out the aorta, the valve snaps shut, and the blood that falls back fills the coronary arteries. The heart needs good rest periods to perfuse — a fast rate shortens that rest time, so the heart muscle gets less blood."},
{h:"5.  Which coronary artery is called the “widow maker”? Why?"},
{p:"The <b>left coronary artery</b> — it supplies the entire left side of the heart."},
{h:"6.  Definitions"},
{table:{head:["Term","Definition / what it tells the nurse"],rows:[
["Preload","Volume of blood returning to the right atrium (end of diastole). <b>Volume</b> — FVO = high, dehydration = low. Treat with diuretics"],
["Afterload","Resistance the ventricle pumps against. <b>Pressure</b> — too much (HTN, vasoconstriction) wears the heart out; too little = no blood left to perfuse the heart. Treat with BP meds"],
["Stroke volume","Volume ejected from the ventricle per beat"],
["Ejection fraction","Percent of blood ejected per beat — normal <b>50 to 70%</b>. Below 50% = heart failure. Only an echo gives EF"],
["Cardiac output","Stroke volume × heart rate — normal <b>4 to 8 L/min</b>"],
["Contractility","How easily the heart snaps back to its shape (poor snap-back = big and boggy heart)"],
["Compliance","How easily something stretches"],
["SVR","Afterload for the left side — the left ventricle pumps to the body"],
["PVR","Afterload for the right side — the right ventricle pumps to the lungs"],
["Arteriosclerosis","Arteries hardened and narrowed — smoking, HTN, diabetes, drug abuse"],
["Atherosclerosis","Plaque buildup inside the arteries — high cholesterol, genetics"],
["Ischemia","Lack of blood supply to tissue — <b>reversible</b>"],
["Necrosis","Tissue death — <b>not reversible</b>"],
["Heart murmur","Whoosh from a valve not snapping back correctly. A <b>new</b> murmur means something changed — often fluid overload in HF"]
]}},
{h:"7.  Calculate the cardiac output: HR 80, stroke volume 60 mL. Is this normal? Show your work."},
{p:"80 × 60 mL = 4,800 mL/min → ÷ 1,000 = <b>4.8 L/min</b>. Normal (4–8 L/min). Convert mL to L before comparing."},
{h:"8.  What is the difference between ischemia and necrosis? Which one can the nurse reverse, and how?"},
{p:"Ischemia = lack of blood supply; necrosis = tissue death. <b>Ischemia</b> is reversible — the priority is restoring oxygen and perfusion. Necrosis is not reversible."},
{h:"<span style=\"font-size:1.05em\">Diagnostic Tests</span>"},
{h:"9.  Diagnostic tests: what does it show, pre-procedure care, post-procedure care"},
{table:{head:["Test","What it shows","Pre-procedure","Post-procedure"],rows:[
["12-lead EKG","10 stickers (each arm and leg + 6 on the chest), 12 views at once — shows where perfusion is lacking",SKY_WB_GAP,SKY_WB_GAP],
["Stress test (treadmill)","How well the heart works under pressure (about 20 min on the treadmill, compared to baseline)","EKG leads and vitals; baseline vitals and assessment; heart and lung sounds; NPO about 2 hrs; consent; crash cart close by; hold meds that can be held","Stop the test if HR passes the limit, rhythm/EKG changes, chest pain, SOB, abnormal beats, pale and diaphoretic"],
["Stress test (medication)","Same as treadmill — for patients who cannot get on the treadmill","Same as treadmill","Same as treadmill"],
["Transcutaneous echo","Structure, valves, blood flow, muscle size, clots in the ventricles; ejection fraction; systolic vs. diastolic HF. Less clear, less invasive","NPO","No post-op care"],
["Transesophageal echo (TEE)","Same, through the esophagus — much more clear","NPO since midnight, consent, baseline vitals","Vitals; liquids → soft foods → solids; watch respiratory rate (anesthesia)"],
["Cardiac cath / angiogram","Only test that shows perfusion of the coronary arteries — contrast shows narrowing and clots; 100% occlusion may be fixed in the cath","NPO, consent, vitals; trim/prep groin if femoral; evaluate kidneys (contrast is nephrotoxic); do NOT keep flat before","Vitals q15 min × 1 hr, q30 min × 2, then hourly + site check each time; groin = lie flat; bilateral pulses, temp, color; coags and ACT; hematoma → hold pressure"]
]}},
{h:"10.  When should a stress test be stopped? List the findings."},
{list:["HR passes the limit","Rhythm or EKG changes","Chest pain","SOB","Abnormal beats","Pale and diaphoretic"]},
{h:"11.  Which test is the only way to obtain an ejection fraction?"},
{p:"<b>Echocardiogram.</b>"},
{h:"12.  Which test is the only one that shows perfusion of the coronary arteries? When is it ordered?"},
{p:"<b>Cardiac cath (coronary angiogram).</b> Ordered if the patient fails the stress test, or when the EKG and troponin are normal but CAD is still suspected."},
{h:"13.  Normal lab values"},
{table:{head:["Lab","Normal value","Significance"],rows:[
["Troponin","Normal is 0","Breakdown of heart muscle fibers. Rises slowly — drawn in a series (about q6h). <b>Priority lab with chest pain</b>"],
["CK-MB",SKY_WB_GAP,"CK = any muscle; MB = cardiac muscle — cardiac-specific breakdown"],
["Myoglobin",SKY_WB_GAP,"Muscle breakdown all over the body — not cardiac-specific"],
["BNP",SKY_WB_GAP,"High = heart is big and boggy, not snapping back. The routine HF lab"],
["Potassium",SKY_WB_GAP,"Check with diuretics. Tall peaked T = hyperkalemia. Low K⁺ causes more cardiac problems and worsens digoxin toxicity"],
["Magnesium",SKY_WB_GAP,"Low magnesium → Torsades de pointes"],
["Cholesterol / LDL / HDL",SKY_WB_GAP,"Lipid panel — evaluates atherosclerosis"],
["PTT",SKY_WB_GAP,"Monitors <b>heparin</b> (“two T's make an H”)"],
["PT/INR",SKY_WB_GAP,"Monitors <b>warfarin</b>"],
["Digoxin level","0.8–2.0","Know the toxic level; toxicity worsened by hypokalemia"]
]}},
{h:"14.  Why is troponin drawn in a series instead of once?"},
{p:"It rises <b>slowly</b> after heart muscle damage, so one normal result does not rule out damage — drawn about q6h."},
{h:"<span style=\"font-size:1.05em\">Cardiac Cath</span>"},
{h:"15.  Which insertion site is preferred and why? Which site needs the most post-procedure care?"},
{p:"<b>Wrist (radial)</b> — most common, fewer complications. <b>Femoral</b> has the most risk and post-op care."},
{h:"16.  Why does the nurse evaluate kidney function before a cardiac cath?"},
{p:"Contrast dye is <b>nephrotoxic</b> — fluids/bicarb may be given."},
{h:"17.  What is the post-procedure vital sign schedule? What else is assessed with every set of vitals?"},
{p:"q15 min × 1 hour, then q30 min × 2, then hourly. <b>Check the site every time</b> (plus pulses, temperature, and color of the extremity)."},
{h:"18.  After a femoral cath, the patient's BP drops and HR rises. What do you suspect? What other symptom would you expect?"},
{p:"<b>Internal bleeding — retroperitoneal hemorrhage.</b> Expect one-sided back/flank pain (seen on CT)."},
{h:"19.  A hard, painful bulge develops at the insertion site. What is it? What is your first nursing intervention?"},
{p:"<b>Hematoma.</b> Hold pressure."},
{h:"20.  Which is NOT part of the post-cath assessment: pedal pulses, back pain, gag reflex, groin site? Why?"},
{p:"<b>Gag reflex</b> — the cath goes through an artery, not the throat. Watch back pain, groin, and pedal pulses."},
{h:"<span style=\"font-size:1.05em\">Decreased Cardiac Output</span>"},
{h:"21.  List signs and symptoms of decreased cardiac output"},
{list:[
"Skin: pale, cyanotic, cool and clammy, diaphoresis",
"Low BP, high HR",
"Weak/thready/diminished pulses, poor cap refill",
"Dependent edema, syncope",
"SOB, high RR, decreased O₂ sat",
"Dizziness, confusion, fatigue",
"Decreased urine output",
"Nausea"
]},
{h:"22.  List nursing interventions for the patient with decreased cardiac output"},
{list:[
"Fluid balance — fluids only if indicated; still low pressure → vasopressors",
"Monitoring — EKG/telemetry, serum labs, urine output",
"O₂ PRN",
"Position — HOB up if BP okay and MAP above 60; MAP below 60 → flat with legs up",
"Avoid Valsalva",
"Bed rest and clustered care with rest periods between activities"
]},
{h:"23.  The patient's MAP is 55. How should the nurse position the patient?"},
{p:"<b>Lay flat with the legs up</b> (MAP below 60)."},
{h:"24.  Why should a patient with decreased cardiac output avoid the Valsalva maneuver?"},
{p:"So they do not “vagal out” — bearing down stimulates the vagus nerve and slows the heart."},
{h:"<span style=\"font-size:1.05em\">Coronary Artery Disease</span>"},
{h:"25.  Modifiable vs. nonmodifiable risk factors"},
{table:{head:["Modifiable","Nonmodifiable"],rows:[
["Stress","Age"],["Smoking","Ethnicity (African American/Hispanic)"],["Diet, exercise","Male gender"],["Diabetes, hypertension","Genetics/family history"]
]}},
{h:"26.  How might chest pain present differently in women and older adults?"},
{p:"They may complain of <b>indigestion</b> that is actually cardiac — do not assume it is only GI."},
{h:"27.  Stable vs. unstable angina"},
{table:{head:["","Stable angina","Unstable angina"],rows:[
["Description","Predictable, demand-related chest pain","<b>Emergency</b> — heart muscle is not getting enough blood"],
["Relieved by","Rest and nitroglycerin","Not relieved — still has pain after rest and <b>3 NTG tablets</b>"],
["Nursing actions","Rest, NTG (1 tab q5 min, max 3)","911/ER · MONA · two large-bore IVs · 12-lead EKG · troponin"]
]}},
{h:"28.  What should the patient be taught about nitroglycerin?"},
{list:[
"a. How to take it: 1 tablet every 5 minutes",
"b. Maximum 3 in 15 minutes — not better after 3 → <b>911/ER</b> (a 4th tablet is the wrong answer)",
"c. Side effects: BP drops and HR goes up",
"d. Storage: amber glass, away from sun and light; carry it at all times"
]},
{h:"29.  What does MONA stand for?"},
{list:["<b>M</b>orphine","<b>O</b>xygen","<b>N</b>itroglycerin","<b>A</b>spirin"]},
{h:"30.  A patient is admitted with chest pain not relieved by 3 nitroglycerin tablets"},
{list:[
"a. Type of angina: <b>unstable angina</b> — emergency",
"b. Contraindicated now: <b>a 4th NTG tablet</b> (max is 3)",
"c. Two large-bore IVs: he may need several procedures",
"d. Priority lab: <b>troponin</b> — is the heart being damaged?",
"e. NOT indicated now: <b>lisinopril</b> — lowers BP; not an acute chest pain drug",
"f. EKG and troponin normal → next test: <b>coronary angiogram</b> (shows whether arteries are narrowed)",
"g. Heparin drip prevents a new clot (does NOT break up the existing one) · Plavix prevents platelet aggregation · Metoprolol decreases dysrhythmia risk and workload",
"h. Home: statin, possibly aspirin; limit salt; more fruits and vegetables"
]}
]

{h:"<span style=\"font-size:1.05em\">EKG Basics</span>"},
{h:"1.  Strip basics"},
{list:["One big box = <b>0.20 seconds</b>","One little box = <b>0.04 seconds</b>","Strip length = <b>6 seconds</b>"]},
{h:"2.  How do you calculate heart rate on a 6-second strip?"},
{p:"Count the QRS complexes × 10 (8 QRS = HR 80)."},
{h:"3.  How often should EKG electrodes be changed? Why?"},
{p:"Every <b>24 hours</b> — to reduce artifact."},
{h:"4.  What is artifact? What should the nurse do first?"},
{p:"False readings on the monitor. If you cannot read the strip, <b>assess the patient</b> first."},
{h:"5.  Electrical conduction: pathway in order and intrinsic rate of each pacemaker site"},
{table:{head:["Structure","Intrinsic rate","Role"],rows:[
["SA node","60–100","The pacemaker — tells the heart to beat"],
["AV node","40–60","Takes over if the SA node fails"],
["Bundle of His","—","Carries the impulse into the ventricles"],
["Right/left bundle branches","—","Carry the impulse into the ventricles"],
["Purkinje fibers","20–40","Last backup pacemaker"]
]}},
{h:"6.  What does each wave or interval represent? What is normal?"},
{table:{head:["Wave","Represents","Normal"],rows:[
["P wave","SA node fired — atrial depolarization","Easy to see, facing up"],
["PR interval","Start of P to the Q","Fits in a big box"],
["QRS complex","Ventricular depolarization (atrial repolarization hidden here)","Narrow, fits in a big box; can point up or down"],
["T wave","Ventricular repolarization (resting)","Rounded"]
]}},
{p:"Tall, peaked T wave = <b>hyperkalemia</b>."},
{h:"7.  List the five questions used to interpret a rhythm strip"},
{list:["1. HR — count QRS × 10","2. Regular? Same gap between each QRS","3. P wave for every QRS?","4. QRS within a big box?","5. PR interval within a big box?"]},
{h:"8.  If all five answers are “yes” and the HR is 60–100, what is the rhythm?"},
{p:"<b>Normal sinus rhythm.</b> Any NO means do not call it sinus."},
{h:"9.  Atrial rhythms are a problem with which wave? Ventricular rhythms?"},
{p:"Atrial = <b>P wave</b>. Ventricular = <b>QRS</b>."},
{h:"10.  A patient's rhythm is abnormal, but he has no symptoms. Should you treat?"},
{p:"<b>No.</b> Assess the patient first — symptomatic → treat; asymptomatic → do not treat. The goal is always optimizing cardiac output."},
{h:"<span style=\"font-size:1.05em\">Sinus &amp; Atrial Dysrhythmias (recognize and treat)</span>"},
{h:"11.  Rhythm table"},
{table:{head:["Rhythm","Rate","Regular?","P wave?","Key feature","Causes / treatment"],rows:[
["Normal sinus","60–100","Yes","Yes","Breaks no rules","None — keep assessing"],
["Sinus brady","below 60","Yes","Yes","Everything normal except the rate","Asymptomatic → none. Symptomatic → treat the cause → atropine → pacing and/or dopamine or epi drip"],
["Sinus tachy","above 100","Yes","Yes","Everything normal except the rate","Treat the cause — rest, fluids, Tylenol, pain meds, calm anxiety"],
["SVT","150+","Yes","No","Narrow QRS → problem is above the ventricles; PSVT starts/stops suddenly","Vagal maneuver → adenosine 6 mg then 12 mg → BB or CCB. Unstable → synchronized cardioversion"],
["Atrial fibrillation","Any (RVR above 100)","No","No","Irregular, no P, fibrillating baseline","Rate control (BB/CCB), amiodarone, anticoagulant every day. Never atropine"],
["Atrial flutter","Any","Either","No","Sawtooth flutter waves","Same as A-fib"]
]}},
{h:"12.  What are the three hallmark signs of A-fib?"},
{list:["Irregular","No P wave","Fibrillating baseline"]},
{h:"13.  Why do A-fib patients take a blood thinner every day? What is A-fib the #1 cause of?"},
{p:"The atria quiver instead of contracting, so blood <b>pools and clots</b>. A-fib is the <b>#1 cause of stroke</b>."},
{h:"14.  What must be ruled out before cardioverting A-fib? How?"},
{p:"A <b>clot in the atria</b> — TEE to confirm no clots, unless the patient has been therapeutically anticoagulated for at least 2 weeks."},
{h:"<span style=\"font-size:1.05em\">Ventricular Dysrhythmias (recognize only)</span>"},
{h:"15.  Ventricular rhythm table"},
{table:{head:["Rhythm","What it looks like","Lethal?"],rows:[
["PVC — unifocal","Sinus rhythm with a wide QRS beat, same shape every time","N — usually not concerning"],
["PVC — multifocal","Wide beats of different shapes (one up, one down)","N — more concerning"],
["PVC — couplet","Two PVCs together","N — very concerning"],
["R on T","PVC lands on the T wave","N — but can trigger V-tach/V-fib"],
["Ventricular tachycardia","Big wide QRS — all you see are ventricles","<b>Y</b>"],
["Torsades de pointes","Twisting V-tach","<b>Y</b>"],
["Ventricular fibrillation","No QRS, no P, quivering baseline","<b>Y</b>"],
["Asystole","Flat line — no electrical activity","<b>Y</b>"]
]}},
{h:"16.  How many PVCs in a row make V-tach?"},
{p:"<b>3 or more.</b>"},
{h:"17.  What electrolyte imbalance is linked to Torsades de pointes?"},
{p:"<b>Low magnesium.</b>"},
{h:"<span style=\"font-size:1.05em\">Pacemakers (recognize only)</span>"},
{h:"18.  Where is the pacer spike for each?"},
{list:["Atrial — spike before the P wave","Ventricular — spike before the QRS (the huge, wide QRS is expected)","Dual (AV) — spike before both"]},
{h:"19.  What does a pacer spike on the T wave indicate?"},
{p:"A <b>malfunctioning pacemaker</b> — can cause R on T."},
{h:"20.  Pacemaker set at 60 and HR 60. Can you give metoprolol? Why?"},
{p:"<b>Yes</b> — the pacemaker keeps the heart at its set rate."},
{h:"<span style=\"font-size:1.05em\">Heart Block (basic understanding)</span>"},
{h:"21.  Which EKG rule does a heart block break?"},
{p:"The <b>PR interval</b> rule — typically more P waves than QRS complexes."},
{h:"22.  Bradycardia or tachycardia? When is a heart block dangerous?"},
{p:"<b>Bradycardia only</b>, never tachycardia. Dangerous depending on the <b>heart rate</b> — a block with HR 25 is an emergency."},
{h:"<span style=\"font-size:1.05em\">Treatment of Dysrhythmias</span>"},
{h:"23.  Five causes of bradycardia and how to treat each"},
{list:["Opioids/fentanyl/overdose → naloxone (Narcan)","Hypothermia → warm the patient","Sleep apnea → tell them to breathe","Just climbed stairs → let them rest and breathe","Cardiac meds (CCB, BB, digoxin), anesthesia, SA node failure, ischemia, hypoxia, hyperkalemia → treat the cause, support ABCs"]},
{h:"24.  Five causes of tachycardia and how to treat each"},
{list:["Exercise → sit down and rest","Dehydration → fluids","Fever → Tylenol","Anxiety, fear, anger → calm the patient","Pain → pain medication"]},
{p:"Also: caffeine, cocaine/meth, allergic reaction, infection, blood loss, anemia, FVO, HF, CAD, respiratory disease → treat the cause."},
{h:"25.  Dysrhythmia drugs"},
{table:{head:["Drug","Use","Dose","Key facts"],rows:[
["Atropine","Symptomatic bradycardia — first line; blocks vagal slowing","1 mg IV push, repeat q3–5 min, max 3 mg","Fast onset, short half-life (a band aid). Tachycardia, dry mouth, blurred vision, urinary retention, confusion in older adults. Telemetry. Never for A-fib"],
["Adenosine","SVT / regular narrow tachy — first line","6 mg rapid IV push + NS flush, then 12 mg","“Reboots” the heart (stops it 6–10 sec); half-life ~10 sec — SLAM it in a big IV"],
["Amiodarone","Tachyarrhythmias, V-tach, A-fib","150 mg over 10 min, then 1 mg/min × 6 hrs","Fatal lung/liver toxicity, ↑ QT; no grapefruit; sun sensitivity, blue-gray skin"],
["Lidocaine","Ventricular rhythms ONLY","Drip","Seizure risk"],
["Dopamine drip","Brady after atropine fails","5–20 mcg/kg/min","Titrate, taper slowly; vesicant (phentolamine)"],
["Epinephrine drip","Brady drip, lethal rhythms","2–10 mcg/min","“When in doubt, give EPI”; vesicant; photosensitive"]
]}},
{h:"26.  How should adenosine be given? Why?"},
{p:"<b>Rapid IV push in a big IV, then flush</b> — its half-life is about 10 seconds, so a slow push can fail."},
{h:"27.  Atropine is not working for symptomatic bradycardia. Next two options?"},
{p:"<b>Transcutaneous pacing</b> and/or a <b>dopamine or epinephrine drip</b>."},
{h:"28.  What makes a tachycardia “unstable”? What is the treatment?"},
{p:"Hypotension, acutely altered mental status, signs of shock, ischemic chest discomfort, or acute HF → <b>synchronized cardioversion</b>."},
{h:"29.  Synchronized cardioversion vs. defibrillation"},
{table:{head:["","Synchronized cardioversion","Defibrillation"],rows:[
["Rhythms used for","Fast rhythm WITH a pulse — SVT, A-fib, unstable tachy","V-fib or pulseless V-tach"],
["Pulse?","Yes","No"],
["Patient","Awake, frequently sedated","Unconscious"],
["Synch","ON — synchronized with the QRS","OFF"],
["Energy","50–200 J","Begin at 200 J, up to 360 J"],
["Consent?","Yes — consent form","No — emergency; call a code"]
]}},
{h:"30.  List the steps for a lethal rhythm"},
{list:["1. Check the pulse","2. Start CPR","3. Shock or not? (V-fib and pulseless V-tach are shockable)","4. When in doubt, give EPI"]}
]
},
{
id:"skynotes-wb-hf-clot-blood",
title:"Sky's Workbook — Heart Failure, PE, Stroke, Blood Disorders & Meds",
kicker:"Workbook questions with answer key · HF, PE, stroke, anemia, hemophilia, sickle cell, medications",
blocks:[
{p:"Fill it in from memory first, then check the answer under each question."},
{h:"<span style=\"font-size:1.05em\">Heart Failure</span>"},
{h:"1.  List the four stages of heart failure"},
{list:["1. At risk — risk factors (obesity, inactivity, high BP, smoking, high cholesterol, diabetes)","2. Pre-heart failure — structural changes, no symptoms","3. Heart failure — symptoms present","4. Advanced — end stage"]},
{h:"2.  Systolic vs. diastolic"},
{table:{head:["","Systolic (HFrEF)","Diastolic (HFpEF)"],rows:[
["What happens to the ventricle","Big and boggy — fills but cannot snap back and squeeze out","Thick muscle wall, smaller chamber — cannot fill"],
["Ejection fraction","Reduced (below 50%)","Preserved"],
["BNP","High",SKY_WB_GAP],
["Memory trick","“SYSTOLIC = STRETCHED OUT”","“DIASTOLIC = DAMN SHE THICK”"]
]}},
{h:"3.  What test determines the type of heart failure?"},
{p:"<b>Echocardiogram</b> (a patient can have both types)."},
{h:"4.  Left-sided vs. right-sided"},
{table:{head:["","Left-sided HF","Right-sided HF"],rows:[
["Blood backs up to","<b>Lungs</b>","<b>Rest of the body</b>"],
["Signs and symptoms","Pulmonary congestion/edema, wet cough, crackles, wheezes, dyspnea, orthopnea, tachypnea, tachycardia, blood-tinged sputum, confusion, restlessness, cyanosis, fatigue","Dependent edema, weight gain, JVD, ascites, enlarged liver and spleen, anorexia/GI distress, fatigue"]
]}},
{h:"5.  Why does tachycardia make heart failure worse?"},
{p:"Both types already have decreased stroke volume and cardiac output — a fast rate adds workload and leaves less time to fill, so output drops further. Adequate rest avoids tachycardia."},
{h:"6.  Nursing interventions for the patient with HF"},
{list:["Treat the underlying cause","Limit sodium and possibly fluids","Adequate rest to avoid tachycardia; mild exercise started very low (cardiac rehab)","Stop smoking and alcohol; keep oxygenation adequate","Daily weights and I&amp;O; monitor K⁺ on diuretics","CPAP when the patient cannot take a deep breath"]},
{h:"7.  Medications for HF and why"},
{list:["Diuretics (furosemide) — take the fluid off, ↓ preload; monitor K⁺","ACE inhibitors — ↓ afterload, BP, workload; prevent remodeling","ARBs / ARNI (Entresto) — ↓ BP and afterload; ARNI for HFrEF","Beta blockers — ↓ workload, BP, HR","SGLT2 inhibitors — early-stage therapy with lifestyle changes","Nitrates and digoxin — can be added if ACE/ARB/ARNI not tolerated"]},
{h:"8.  HF patient: HR 110, O₂ 94%, wheezes in upper lobes, crackles in lower lobes"},
{list:["a. Priority medication: <b>furosemide</b> — decreases preload, treats the overload","b. Monitor potassium: he is on a diuretic — low K⁺ causes more cardiac problems","c. CPAP: forces O₂ into the lungs — he cannot take a deep breath","d. Nitroglycerin drip: vasodilator — decreases afterload (watch for a BP drop)","e. Also in A-fib: <b>amiodarone + a blood thinner</b>"]},
{h:"9.  HF discharge teaching"},
{list:["Sodium and fluid limits","Daily weights","Rest to avoid tachycardia; start exercise slowly (cardiac rehab)","Stop smoking and alcohol","Digoxin toxicity = yellow/green vision changes"]},
{h:"<span style=\"font-size:1.05em\">Pulmonary Emboli</span>"},
{h:"10.  What is the #1 cause of a pulmonary embolism?"},
{p:"<b>DVT</b> — a clot that broke off and went to the lungs."},
{h:"11.  Risk factors for DVT/PE"},
{list:["Oral contraceptives/hormones","Post-surgery","Bedbound"]},
{h:"12.  DVT/PE prevention teaching"},
{list:["Get up and move","Compression socks and SCDs","Elevate legs; do NOT bend the knees or cross the legs — no pillows behind the knees","Anticoagulants","Do NOT massage the clot; healthy lifestyle"]},
{h:"13.  Signs and symptoms of a PE"},
{list:["SOB, rapid breathing, hyperventilation","Chest pain when breathing in","Tachycardia","Anxiety, restlessness, panic","Blue from the chest up = lethal PE"]},
{h:"14.  Diagnostic tests for a PE? Which is the perfusion test?"},
{p:"V/Q scan (<b>the perfusion test</b>), CT with contrast, pulmonary angiogram, MRI, chest X-ray."},
{h:"15.  How is a PE treated? When is an IVC filter used?"},
{p:"<b>Anticoagulants</b> (heparin drip or Lovenox); embolectomy. <b>IVC filter</b> if a past history of clots. Thrombolytics for PE: Sky's notes disagree (3/19 class notes say no; handwritten notes and the Exam 4 Meds sheet say yes) — ask the instructor."},
{h:"<span style=\"font-size:1.05em\">Stroke</span>"},
{h:"16.  Ischemic vs. hemorrhagic"},
{table:{head:["","Ischemic stroke","Hemorrhagic stroke"],rows:[
["What happens","Blood clot — tissue dies past the clot","A vessel ruptures"],
["Causes","#1 A-fib (not on an anticoagulant), thrombosis, embolism, unknown, clotting issues","Trauma, aneurysms, massive HTN"],
["Thrombolytic?","Yes — within 3 hours","<b>No</b> — contraindicated"]
]}},
{h:"17.  CVA vs. TIA"},
{table:{head:["","CVA","TIA"],rows:[
["Definition","Brain attack — blood flow blocked (ischemic) or a vessel bleeds (hemorrhagic)","Temporary ischemia — stroke symptoms that resolve on their own (minutes to hours)"],
["Lasting damage?","Yes — brain tissue dies","No"],
["Nursing significance","Time is brain — thrombolytic window 3 hours","Warning sign a stroke may be coming — workup and prevention (antiplatelets, control A-fib and HTN)"]
]}},
{h:"18.  What is the #1 cause of ischemic stroke?"},
{p:"<b>A-fib.</b>"},
{h:"19.  Define"},
{list:["Hemiparesis/hemiplegia — one-sided weakness/paralysis, on the <b>opposite</b> side of the brain injury","Homonymous hemianopsia — loss of half the visual field","Aphasia — cannot speak and/or understand speech"]},
{h:"20.  First imaging test for suspected stroke? Why is an MRI not first?"},
{p:"<b>CT without contrast</b> — about 5 minutes; a bleed shows immediately. MRI is better for ischemic stroke but takes about 45 minutes."},
{h:"21.  Why is blood glucose checked on a patient with stroke symptoms?"},
{p:"Low blood sugar looks like a stroke and is much easier to fix."},
{h:"22.  Time window for a thrombolytic? What if the patient cannot have one?"},
{p:"<b>Within 3 hours</b> of symptom start. Cannot have one → <b>anticoagulant</b> (heparin drip)."},
{h:"23.  Contraindications to a thrombolytic"},
{list:["Hemorrhagic stroke (current or history)","Surgery in the last 2 weeks","Head trauma","Uncontrolled HTN","Also: active bleeding, severe hypotension, allergy"]},
{h:"24.  Signs of stroke to teach the public"},
{p:"Face drooping, arm weakness, speech difficulty, time to call 911."},
{h:"<span style=\"font-size:1.05em\">Anemias</span>"},
{h:"25.  Two main causes of anemia"},
{p:"The body is <b>not making enough</b> red blood cells, or <b>destroying them too fast</b>."},
{h:"26.  Why does anemia look like decreased cardiac output? Signs and symptoms"},
{p:"Tissues are not getting oxygen. Paleness, cold skin, jaundice (rapid RBC breakdown), SOB, weakness, fatigue, low BP, high HR, enlarged spleen."},
{h:"27.  Iron deficiency vs. folic acid/B12 deficiency"},
{p:"Sky's guide marks this table as standard nursing content, not class notes."},
{table:{head:["","Iron deficiency","Folic acid / B12 deficiency"],rows:[
["Causes","Blood loss (GI bleeding, heavy periods), poor intake, pregnancy, poor absorption","Folic acid: poor diet, alcohol, pregnancy. B12: strict vegan diet, poor absorption — pernicious anemia, gastric surgery"],
["RBC size","Small, pale (microcytic)","Large (macrocytic/megaloblastic)"],
["Unique signs","Brittle or spoon-shaped nails, pica (ice or dirt), sore tongue","Smooth red tongue. B12 only: neuro signs — numbness, tingling, poor balance, confusion"],
["Food sources","Red meat, liver, leafy greens, beans, iron-fortified cereal","Folate: leafy greens, citrus, beans, fortified grains. B12: meat, eggs, dairy"],
["Treatment","Oral iron (ferrous sulfate); IV iron if severe","Folic acid tablets; B12 injections — lifelong for pernicious anemia"]
]}},
{h:"28.  What should the patient taking iron be taught?"},
{list:["Best absorbed between meals with vitamin C (orange juice); with food if GI upset","Keep apart from antacids, dairy, and calcium","Liquid iron through a straw (stains teeth)","Dark/black stools are expected","Constipation → fluids and fiber"]},
{h:"29.  What is pernicious anemia? How is it treated?"},
{p:"B12 deficiency from no intrinsic factor — cannot absorb B12 from the gut. <b>Lifelong B12 injections.</b>"},
{h:"30.  When is epoetin alfa used?"},
{p:"When diet, iron, folic acid, and B vitamins are not enough (especially chronic kidney failure) — stimulates RBC production. Monitor Hgb and BP."},
{h:"<span style=\"font-size:1.05em\">Hemophilia</span>"},
{h:"31.  How is hemophilia inherited? Who is at higher risk?"},
{p:"<b>Recessive X-linked</b> — <b>males</b> are at higher risk."},
{h:"32.  Severity"},
{table:{head:["Severity","What to expect"],rows:[["Mild","May not know they have it; bleeds more with trauma or after surgery"],["Moderate","They will probably know"],["Severe","Spontaneous bleeds into joints, muscles, and the GI tract"]]}},
{h:"33.  Treatment for a bleed? Teaching about heat and pressure?"},
{p:"<b>Give the clotting factor.</b> NO heat. Pressure to stop the bleed but not too much (compartment syndrome). Elevate and rest so the blood is reabsorbed."},
{h:"<span style=\"font-size:1.05em\">Sickle Cell Disease</span>"},
{h:"34.  How is sickle cell inherited? What happens to the RBCs?"},
{p:"<b>Autosomal recessive.</b> RBCs are crescent-shaped, so they clump together and form clots."},
{h:"35.  #1 cause of death? Signs and trigger?"},
{p:"<b>Acute chest syndrome</b> — chest pain, cough, fever, low O₂. Triggered by <b>infection</b>."},
{h:"36.  What does HOPP stand for?"},
{list:["<b>H</b>ydrate (avoid triggers)","<b>O</b>xygenate (acute chest syndrome)","<b>P</b>erfuse (HF, stroke, reproductive and wound issues)","<b>P</b>ain (control the crisis)"]},
{h:"37.  Why are fluids important in sickle cell crisis?"},
{p:"Fluids keep the cells apart."},
{h:"38.  Precautions with ketorolac? A blood transfusion?"},
{p:"Ketorolac (NSAID) — <b>caution with kidneys</b>. Transfusion — watch for a <b>reaction and fluid volume overload</b>; monitor iron levels."},
{h:"<span style=\"font-size:1.05em\">Medications</span>"},
{h:"39.  Medication summary (full cards in Sky's Study Guide — Medication Cards)"},
{table:{head:["Class","Key points"],rows:[
["Beta blockers (metoprolol, carvedilol)","↓ O₂ demand, BP, HR. 4 B's. Black box: abrupt stop → MI. Call provider if HR below 60"],
["CCBs (diltiazem, amlodipine)","Vasodilate, slow SA/AV. Hold if SBP below 90 or HR below 60. No grapefruit"],
["ACE inhibitors (lisinopril)","↓ afterload/BP/workload. Black box: pregnancy, angioedema. Dry cough; no salt substitutes"],
["ARBs (losartan, valsartan)","Black box: fetal toxicity. Rebound HTN if stopped"],
["ARNI (sacubitril/valsartan)","HFrEF. Never with an ACE inhibitor — stop ACE 36 hrs before. Hyperkalemia, angioedema"],
["Vasopressors (dopamine, epi, norepi)","Brady/low perfusion; ICU/ER only. Vesicant — phentolamine"],
["Anticoagulants (heparin, warfarin, enoxaparin)","Bleeding, HIT. Heparin = PTT; warfarin = PT/INR. Keep the Lovenox air bubble"],
["Antiplatelets (aspirin, clopidogrel)","Long-term clot prevention; do not dissolve clots. No aspirin with warfarin; clopidogrel — no grapefruit"],
["Thrombolytics (alteplase)","Destroy clots — ischemic stroke within 3 hrs. Stop for any bleeding"],
["Statins (atorvastatin, rosuvastatin)","Prevent plaque. Rhabdomyolysis — report muscle pain; liver labs"],
["Antiarrhythmics (amiodarone, lidocaine)","Lung/liver toxicity, ↑ QT. Lidocaine = ventricular only"],
["Digoxin","HF. Level 0.8–2.0. Toxicity: yellow/green vision, GI, brady; Digibind; hypokalemia worsens"],
["Atropine","Symptomatic brady first line; 1 mg q3–5 min, max 3 mg"],
["Anemia supplements (iron, folic acid, B12, epoetin)","See anemia section above"],
["Hydroxyurea","Sickle cell; bone marrow suppression — hold if WBC low; gloves; contraception"],
["Clotting factors","VIII (hemophilia A), IX (hemophilia B); IV; self-infusion teaching"],
["Nitroglycerin","Vasodilator; 1 q5 min, max 3 → ER; BP drops, HR rises; amber glass"]
]}},
{h:"40.  When should a beta blocker or calcium channel blocker be held?"},
{p:"Beta blocker — <b>HR below 60</b> (call the provider). CCB — <b>SBP below 90 or HR below 60</b>."},
{h:"41.  Which drugs should not be taken with grapefruit?"},
{p:"<b>Calcium channel blockers, clopidogrel, amiodarone.</b>"},
{h:"42.  Signs of digoxin toxicity? Antidote? Electrolyte that makes it worse?"},
{p:"Yellow/green vision changes, GI symptoms (N/V/diarrhea), decreased HR. Antidote <b>Digibind</b>. <b>Hypokalemia</b> worsens toxicity."},
{h:"43.  Antidote for a vasopressor that leaks into the tissue?"},
{p:"<b>Phentolamine.</b>"},
{h:"44.  Which lab monitors heparin? Warfarin?"},
{p:"Heparin = <b>PTT</b>. Warfarin = <b>PT/INR</b>."},
{h:"45.  How long must an ACE inhibitor be stopped before starting sacubitril/valsartan? Why?"},
{p:"At least <b>36 hours</b> — angioedema risk."},
{h:"46.  Five possible nursing diagnoses for the patient with altered perfusion"},
{p:SKY_WB_GAP}
]
}
];

function shuffleExam(bank){
  const caseBlock = bank.filter(q=>q.caseId);
  const others = bank.filter(q=>!q.caseId).slice();
  for(let i=others.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [others[i],others[j]] = [others[j],others[i]];
  }
  const insertAt = Math.floor(Math.random()*(others.length+1));
  return others.slice(0,insertAt).concat(caseBlock, others.slice(insertAt));
}
function curBank(){ if(!S.shuffledBank && S.id==="game-daily") S.shuffledBank = buildBank("game-daily"); return S.shuffledBank || QUIZ[S.id]; }
function isExamId(id){ return !!id && id.startsWith("exam"); }
function shuffleIdx(n){ const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function shuffleOpts(q){
  if(!q.options || q.noShuffle || (q.type && q.type!=="sata")) return q;
  const idx = shuffleIdx(q.options.length), opts = idx.map(i=>q.options[i]);
  if(q.type==="sata") return Object.assign({}, q, {options:opts, answers:q.answers.map(a=>idx.indexOf(a))});
  return Object.assign({}, q, {options:opts, answer:idx.indexOf(q.answer)});
}
const TIMED = {"game-abgspeed":90, "game-lightning":60};
function isTimed(id){ return !!TIMED[id]; }
function isEndReview(id){ return isExamId(id) || isTimed(id); }
function isGame(id){ return !!id && (id.startsWith("game-") || id.startsWith("drill-")); }
function shuffled(arr){ const idx = shuffleIdx(arr.length); return idx.map(i=>arr[i]); }
function dailyFive(){
  const pool = [];
  Object.entries(QUIZ).forEach(([k,qs])=>{ if(isExamId(k) || isGame(k) || k==="m3-abgquiz") return; qs.forEach(q=>{ if(!q.caseId) pool.push(Object.assign({ref:k}, q)); }); });
  return shuffled(pool).slice(0,5);
}
function buildBank(id){
  let base;
  if(id === "game-daily") base = dailyFive();
  else if(isExamId(id)) base = shuffleExam(QUIZ[id]);
  else if(isTimed(id)) base = shuffled(QUIZ[id]);
  else base = QUIZ[id].slice();
  return base.map(shuffleOpts);
}
const LETTERS = ["A","B","C","D","E","F"];
function correctTextOf(q){
  const A = LETTERS;
  if(q.type === "sata") return q.answers.slice().sort((a,b)=>a-b).map(idx=>A[idx]+". "+q.options[idx]).join("; ");
  if(q.type === "fitb") return String(q.answer);
  if(q.type === "cloze") return q.blanks.map(b=>b.options[b.correct]).join(" · ");
  if(q.type === "gtpal") return ["G","T","P","A","L"].map((l,idx)=>l+q.answers[idx]).join(" ");
  if(q.type === "hotspot") return "See the outlined region in the lesson/question image.";
  if(q.type === "dragdrop") return q.items.map((it,idx)=>it+" → "+q.bins[q.correctBin[idx]]).join("; ");
  if(q.type === "ordering") return q.items.join(" → ");
  if(q.type === "matrix") return q.rows.map((r,idx)=>r+" → "+q.cols[q.correct[idx]]).join("; ");
  if(q.type === "bowtie") return "Condition: "+q.conditionOptions[q.correctCondition]+" · Actions: "+q.correctActions.map(idx=>q.actionOptions[idx]).join(", ")+" · Parameters: "+q.correctParams.map(idx=>q.paramOptions[idx]).join(", ");
  return A[q.answer]+". "+q.options[q.answer];
}
function userTextOf(q){
  const A = LETTERS, none = "(no answer)";
  if(q.type === "sata") return S.multi.length ? S.multi.slice().sort((a,b)=>a-b).map(i=>A[i]+". "+q.options[i]).join("; ") : none;
  if(q.type === "fitb") return S.textAnswer || none;
  if(q.type === "cloze") return q.blanks.map((b,i)=>S.clozeSel[i]!==undefined ? b.options[S.clozeSel[i]] : "—").join(" · ");
  if(q.type === "dragdrop") return q.items.map((it,i)=>it+" → "+(S.ddPlace[i]!==undefined ? q.bins[S.ddPlace[i]] : "—")).join("; ");
  if(q.type === "ordering") return S.orderArr ? S.orderArr.map(i=>q.items[i]).join(" → ") : none;
  if(q.type === "matrix") return q.rows.map((r,i)=>r+" → "+(S.matrixSel[i]!==undefined ? q.cols[S.matrixSel[i]] : "—")).join("; ");
  if(q.type === "bowtie") return "Condition: "+(S.bowtie.condition!==null ? q.conditionOptions[S.bowtie.condition] : "—")+" · Actions: "+(S.bowtie.actions.map(i=>q.actionOptions[i]).join(", ")||"—")+" · Parameters: "+(S.bowtie.params.map(i=>q.paramOptions[i]).join(", ")||"—");
  if(q.type === "gtpal") return S.gtpalVals.join(" ");
  if(q.type === "hotspot") return S.clickPoint ? "Clicked a point" : none;
  return S.pick!==null ? A[S.pick]+". "+q.options[S.pick] : none;
}
let TIMER = null;
function startTimer(){
  if(TIMER) clearInterval(TIMER);
  TIMER = setInterval(()=>{
    if(S.view!=="quiz" || !isTimed(S.id)){ clearInterval(TIMER); TIMER=null; return; }
    const left = Math.max(0, Math.ceil((S.deadline - Date.now())/1000));
    const el = document.getElementById("gmTimer");
    if(el){ el.textContent = left+"s"; el.classList.toggle("low", left<=10); }
    if(left<=0){ clearInterval(TIMER); TIMER=null; finishTimed(); }
  }, 250);
}
function finishTimed(){
  const b = S.best[S.id];
  if(b === undefined || S.score > b) S.best[S.id] = S.score;
  nav("result",{shuffledBank:S.shuffledBank, answered:S.i});
}
function goNext(){
  const bank = curBank();
  if(S.i < bank.length-1){
    S.i++; S.pick = null; S.multi = []; S.submitted = false; S.textAnswer = ""; S.fitbCorrect = false; S.activeTab = 0;
    S.clickPoint = null; S.hotspotCorrect = false; S.ddSel = null; S.ddPlace = {}; S.orderArr = null; S.matrixSel = {};
    S.bowtie = {condition:null, actions:[], params:[]}; S.lastPoints = 0; S.clozeSel = {}; S.gtpalVals = ["","","","",""];
    S.qStartScore = S.score; S.streakDone = false;
    draw(); if(!isTimed(S.id)) scrollTo(0,0); return;
  }
  const b = S.best[S.id];
  if(b === undefined || S.score > b) S.best[S.id] = S.score;
  nav("result",{shuffledBank:S.shuffledBank, answered:bank.length});
}


function renderCaseTabs(caseId){
  const c = CASES[caseId];
  let h = '<div class="case-box"><div class="case-title">'+c.title+'</div><div class="case-tabs">';
  c.tabs.forEach((t,i)=>{
    h += '<button class="case-tab'+(S.activeTab===i?" active":"")+'" data-tab="'+i+'">'+t.label+"</button>";
  });
  h += '</div><div class="case-panel">';
  c.tabs[S.activeTab].blocks.forEach(b => h += blk(b));
  h += "</div></div>";
  return h;
}

function blk(b){
  if(b.h) return "<h4>"+b.h+"</h4>";
  if(b.p) return "<p>"+b.p+"</p>";
  if(b.list) return "<ul>"+b.list.map(i=>"<li>"+i+"</li>").join("")+"</ul>";
  if(b.hook) return '<div class="hook">'+b.hook+"</div>";
  if(b.img) return '<figure class="figure"><img src="'+b.img+'" alt="'+(b.caption||"")+'" loading="lazy">'+(b.caption?'<figcaption>'+b.caption+"</figcaption>":"")+"</figure>";
  if(b.table) return '<div class="tbl-wrap"><table><thead><tr>'+b.table.head.map(x=>"<th>"+x+"</th>").join("")+
    "</tr></thead><tbody>"+b.table.rows.map(r=>"<tr>"+r.map(c=>"<td>"+c+"</td>").join("")+"</tr>").join("")+
    "</tbody></table></div>";
  return "";
}

function qHTML(q, label){
  const A = ["A","B","C","D","E","F"], p = S.pick, sub = S.submitted;
  let h = '<div class="q">'+(label?'<div class="lbl">'+label+"</div>":"")+'<p class="stem">'+q.stem+"</p>";
  q.options.forEach((o,i)=>{
    let c = "opt";
    if(sub){ if(i===q.answer) c+=" right"; else if(i===p) c+=" mine"; }
    else if(i===p) c+=" picked";
    h += '<button class="'+c+'" data-p="'+i+'"'+(sub?" disabled":"")+"><b>"+A[i]+"</b>  "+o+"</button>";
  });
  if(!sub){
    if(!(S.view==="quiz" && isTimed(S.id))) h += '<div class="acts"><button data-submit-mc="1"'+(p===null?" disabled":"")+'>Submit answer</button></div>';
  } else {
    const ok = p === q.answer;
    h += '<p class="verdict '+(ok?"y":"n")+'">'+(ok?"Correct":"Answer: "+A[q.answer])+"</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function sataHTML(q){
  const A = ["A","B","C","D","E","F"], sel = S.multi, sub = S.submitted;
  let h = '<div class="q"><div class="sata-note">Select all that apply</div><p class="stem">'+q.stem+"</p>";
  q.options.forEach((o,i)=>{
    let c = "opt sata", isSel = sel.includes(i), isCorrect = q.answers.includes(i);
    if(sub){
      if(isCorrect && isSel) c+=" right";
      else if(isCorrect && !isSel) c+=" missed";
      else if(!isCorrect && isSel) c+=" mine";
    } else if(isSel) c+=" picked";
    h += '<button class="'+c+'" data-t="'+i+'"'+(sub?" disabled":"")+"><b>"+(isSel?"\u2611":"\u2610")+"</b>  "+o+"</button>";
  });
  if(!sub){
    h += '<div class="acts"><button data-submit="1">Submit answer</button></div>';
  } else {
    const ok = sel.slice().sort((a,b)=>a-b).join(",") === q.answers.slice().sort((a,b)=>a-b).join(",");
    const ansText = q.answers.map(i=>A[i]).join(", ");
    h += '<p class="verdict '+(ok?"y":"n")+'">'+(ok?"Correct":"Answer: "+ansText)+"</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function clozeHTML(q){
  const sub = S.submitted;
  let text = q.template;
  q.blanks.forEach((b,i)=>{
    const selVal = S.clozeSel[i];
    let opts = '<option value="">choose…</option>'+b.options.map((o,oi)=>'<option value="'+oi+'"'+(selVal===oi?" selected":"")+'>'+o+"</option>").join("");
    let cls = "blank-select";
    if(sub) cls += selVal===b.correct ? " right" : " wrong";
    text = text.replace("{"+i+"}", '<select class="'+cls+'" data-cloze-blank="'+i+'"'+(sub?" disabled":"")+'>'+opts+"</select>");
  });
  let h = '<div class="q"><div class="sata-note">Drop-Down (Cloze) — choose the correct word for each blank</div><p class="cloze-text">'+text+"</p>";
  const allAnswered = q.blanks.every((_,i)=>S.clozeSel[i]!==undefined);
  if(!sub){
    h += '<div class="acts"><button data-submit-cloze="1"'+(!allAnswered?" disabled":"")+'>Submit answer</button></div>';
  } else {
    const correctCount = q.blanks.filter((b,i)=>S.clozeSel[i]===b.correct).length;
    const ok = correctCount === q.blanks.length;
    h += '<p class="verdict '+(ok?"y":"n")+'">'+correctCount+" of "+q.blanks.length+" blanks correct — "+S.lastPoints.toFixed(2)+" pt (partial credit)</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function dragdropHTML(q){
  const sub = S.submitted;
  let h = '<div class="q"><div class="sata-note">Drag and Drop — tap an item, then tap its category</div><p class="stem">'+q.stem+"</p>";
  const unplaced = q.items.map((_,idx)=>idx).filter(idx => S.ddPlace[idx] === undefined);
  h += '<div class="dd-pool">';
  unplaced.forEach(idx=>{
    h += '<button class="dd-chip'+(S.ddSel===idx?" sel":"")+'" data-dd-pick="'+idx+'"'+(sub?" disabled":"")+'>'+q.items[idx]+"</button>";
  });
  if(!unplaced.length) h += '<span style="color:var(--dim);font-size:13px">All items placed</span>';
  h += "</div>";
  h += '<div class="dd-bins">';
  q.bins.forEach((bin,binIdx)=>{
    h += '<div class="dd-bin" data-dd-bin="'+binIdx+'"><div class="dd-bin-label">'+bin+"</div>";
    q.items.forEach((item,idx)=>{
      if(S.ddPlace[idx] !== binIdx) return;
      let c = "dd-chip";
      if(sub){ c += q.correctBin[idx] === binIdx ? " right" : " wrong"; }
      h += '<button class="'+c+'" data-dd-unplace="'+idx+'"'+(sub?" disabled":"")+'>'+item+"</button>";
    });
    h += "</div>";
  });
  h += "</div>";
  const allPlaced = q.items.every((_,idx)=>S.ddPlace[idx] !== undefined);
  if(!sub){
    h += '<div class="acts"><button data-submit-dd="1"'+(!allPlaced?" disabled":"")+'>Submit answer</button></div>';
  } else {
    const correctCount = q.items.filter((_,idx)=>S.ddPlace[idx]===q.correctBin[idx]).length;
    const ok = correctCount === q.items.length;
    h += '<p class="verdict '+(ok?"y":"n")+'">'+correctCount+" of "+q.items.length+" placed correctly — "+S.lastPoints.toFixed(2)+" pt (partial credit)</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function orderingHTML(q){
  const sub = S.submitted;
  if(!S.orderArr){
    S.orderArr = q.items.map((_,i)=>i);
    for(let i=S.orderArr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [S.orderArr[i],S.orderArr[j]]=[S.orderArr[j],S.orderArr[i]]; }
  }
  let h = '<div class="q"><div class="sata-note">Ordering — arrange in the correct sequence</div><p class="stem">'+q.stem+"</p>";
  h += '<ul class="order-list">';
  S.orderArr.forEach((itemIdx,pos)=>{
    let c = "order-item";
    if(sub) c += itemIdx === pos ? " right" : " wrong";
    h += '<li class="'+c+'"><span class="num">'+(pos+1)+".</span><span class=\"txt\">"+q.items[itemIdx]+'</span>';
    if(!sub){
      h += '<span class="order-btns">'+
        (pos>0?'<button data-order-up="'+pos+'">↑</button>':"")+
        (pos<S.orderArr.length-1?'<button data-order-down="'+pos+'">↓</button>':"")+
        "</span>";
    }
    h += "</li>";
  });
  h += "</ul>";
  if(!sub){
    h += '<div class="acts"><button data-submit-order="1">Submit answer</button></div>';
  } else {
    const correctCount = S.orderArr.filter((itemIdx,pos)=>itemIdx===pos).length;
    const ok = correctCount === S.orderArr.length;
    h += '<p class="verdict '+(ok?"y":"n")+'">'+correctCount+" of "+S.orderArr.length+" in the correct position — "+S.lastPoints.toFixed(2)+" pt (partial credit)</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function matrixHTML(q){
  const sub = S.submitted;
  let h = '<div class="q"><div class="sata-note">Matrix/Grid — one answer per row</div><p class="stem">'+q.stem+"</p>";
  h += '<table class="matrix-table"><thead><tr><th></th>'+q.cols.map(c=>"<th>"+c+"</th>").join("")+"</tr></thead><tbody>";
  q.rows.forEach((row,rIdx)=>{
    let rc = "";
    if(sub) rc = S.matrixSel[rIdx]===q.correct[rIdx] ? " matrix-row-right" : " matrix-row-wrong";
    h += '<tr class="'+rc+'"><td>'+row+"</td>";
    q.cols.forEach((_,cIdx)=>{
      const checked = S.matrixSel[rIdx]===cIdx;
      h += '<td><input type="radio" name="mrow'+rIdx+'" data-matrix-row="'+rIdx+'" data-matrix-col="'+cIdx+'"'+(checked?" checked":"")+(sub?" disabled":"")+"></td>";
    });
    h += "</tr>";
  });
  h += "</tbody></table>";
  const allAnswered = q.rows.every((_,rIdx)=>S.matrixSel[rIdx]!==undefined);
  if(!sub){
    h += '<div class="acts"><button data-submit-matrix="1"'+(!allAnswered?" disabled":"")+'>Submit answer</button></div>';
  } else {
    const correctCount = q.rows.filter((_,rIdx)=>S.matrixSel[rIdx]===q.correct[rIdx]).length;
    const ok = correctCount === q.rows.length;
    h += '<p class="verdict '+(ok?"y":"n")+'">'+correctCount+" of "+q.rows.length+" rows correct — "+S.lastPoints.toFixed(2)+" pt (partial credit)</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function bowtieHTML(q){
  const sub = S.submitted;
  let h = '<div class="q"><div class="sata-note">Bowtie — pick actions, the condition, and parameters</div><p class="stem">'+q.stem+"</p>";
  h += '<div class="bowtie-wrap">';
  h += '<div class="bowtie-col"><div class="bowtie-col-label">Actions to Take (choose '+q.correctActions.length+')</div>';
  q.actionOptions.forEach((opt,idx)=>{
    let c = "bowtie-opt";
    const sel = S.bowtie.actions.includes(idx);
    if(sub){ c += q.correctActions.includes(idx) ? " right" : (sel ? " wrong" : ""); }
    else if(sel) c += " sel";
    h += '<button class="'+c+'" data-bt-action="'+idx+'"'+(sub?" disabled":"")+'>'+opt+"</button>";
  });
  h += '</div><div class="bowtie-col"><div class="bowtie-col-label">Condition</div>';
  q.conditionOptions.forEach((opt,idx)=>{
    let c = "bowtie-opt";
    const sel = S.bowtie.condition===idx;
    if(sub){ c += idx===q.correctCondition ? " right" : (sel ? " wrong" : ""); }
    else if(sel) c += " sel";
    h += '<button class="'+c+'" data-bt-condition="'+idx+'"'+(sub?" disabled":"")+'>'+opt+"</button>";
  });
  h += '</div><div class="bowtie-col"><div class="bowtie-col-label">Parameters to Monitor (choose '+q.correctParams.length+')</div>';
  q.paramOptions.forEach((opt,idx)=>{
    let c = "bowtie-opt";
    const sel = S.bowtie.params.includes(idx);
    if(sub){ c += q.correctParams.includes(idx) ? " right" : (sel ? " wrong" : ""); }
    else if(sel) c += " sel";
    h += '<button class="'+c+'" data-bt-param="'+idx+'"'+(sub?" disabled":"")+'>'+opt+"</button>";
  });
  h += "</div></div>";
  const ready = S.bowtie.condition!==null && S.bowtie.actions.length && S.bowtie.params.length;
  if(!sub){
    h += '<div class="acts"><button data-submit-bowtie="1"'+(!ready?" disabled":"")+'>Submit answer</button></div>';
  } else {
    const totalSlots = 1 + q.correctActions.length + q.correctParams.length;
    const ok = S.lastPoints === 1;
    h += '<p class="verdict '+(ok?"y":"n")+'">'+Math.round(S.lastPoints*totalSlots)+" of "+totalSlots+" correct — "+S.lastPoints.toFixed(2)+" pt (partial credit)</p><p>"+q.why+"</p>";
  }
  return h+"</div>";
}

function anyQHTML(q, label){
  if(q.type === "sata") return sataHTML(q);
  if(q.type === "fitb") return fitbHTML(q);
  if(q.type === "gtpal") return gtpalHTML(q);
  if(q.type === "cloze") return clozeHTML(q);
  if(q.type === "hotspot") return hotspotHTML(q);
  if(q.type === "dragdrop") return dragdropHTML(q);
  if(q.type === "ordering") return orderingHTML(q);
  if(q.type === "matrix") return matrixHTML(q);
  if(q.type === "bowtie") return bowtieHTML(q);
  return qHTML(q, label);
}
