],
"m4-sinus":[
 {type:"matrix", stem:"For each client finding, identify the rhythm.", rows:["Regular, P before every narrow QRS, PR 0.16 s, rate 52","Regular, P before every narrow QRS, PR 0.14 s, rate 124","Regular, P before every narrow QRS, PR 0.18 s, rate 84","Regular, P before every narrow QRS, PR 0.12 s, rate 44"], cols:["Normal sinus rhythm","Sinus bradycardia","Sinus tachycardia"], correct:[1,2,0,1], why:"All sinus rhythms meet every rule except possibly the rate: below 60 = sinus brady, 60–100 = NSR, above 100 = sinus tach."},
 {type:"sata", stem:"A client has sinus tachycardia at 128 bpm. Which conditions could be causing this rhythm? Select all that apply.", options:["Hemorrhage","Fever","Hypothyroidism","Uncontrolled pain","Anemia"], answers:[0,1,3,4], why:"Bleeding, fever, pain, and anemia all make the heart speed up to compensate. Hypothyroidism slows metabolism and is a cause of bradycardia, not tachycardia."},
 {stem:"A client recovering from a hip fracture has sinus tachycardia at 118 and rates pain 9/10. BP is 128/76. Which action should the nurse take first?", options:["Request an order for IV metoprolol","Administer the prescribed analgesic and reassess","Prepare for synchronized cardioversion","Have the client bear down"], answer:1, why:"Sinus tach is treated by treating the cause — here, pain. Rate-control drugs are not first-line, cardioversion is for unstable tachydysrhythmias, and a vagal maneuver is for SVT."},
 {stem:"A marathon runner has a resting heart rate of 48 in sinus bradycardia. BP is 118/72, and the client is alert with no complaints. What is the nurse's best action?", options:["Administer atropine 1 mg IV push","Apply transcutaneous pacing pads","Start a dopamine infusion","Document the finding and continue to monitor"], answer:3, why:"Asymptomatic sinus bradycardia, common in conditioned athletes, is monitored, not treated. Atropine, pacing, and dopamine are reserved for symptomatic bradycardia."},
 {type:"ordering", stem:"A client has symptomatic sinus bradycardia (HR 42, BP 78/44, confused). Place the treatment steps in the order the nurse anticipates.", items:["Assess, identify the cause, give O₂ if hypoxemic, and obtain IV access","Atropine 1 mg IV push","Repeat atropine every 3–5 minutes up to a maximum of 3 mg","If atropine is ineffective, transcutaneous pacing or a dopamine/epinephrine drip","Expert consult and transvenous pacing"], why:"The bradycardia pathway: assess and treat the cause → atropine 1 mg, repeated to a 3 mg max → pacing or a vasopressor drip if ineffective → transvenous pacing/expert consult."}
],
"m4-atrial":[
 {type:"dragdrop", stem:"Sort each strip finding into the rhythm it describes.", items:["Sawtooth waves between QRS complexes","Wavy, fibrillating baseline","Irregularly irregular R-to-R intervals","Regular rate of 190 with P waves hidden in T waves","4 atrial waves for each QRS"], bins:["SVT","A-fib","A-flutter"], correctBin:[2,1,1,0,2], why:"A-flutter has sawtooth flutter waves in ratios such as 4:1. A-fib has a fibrillating baseline and is irregularly irregular. SVT is fast (150–250), regular, with P waves lost in the T waves."},
 {stem:"A client with stable SVT at 186 bpm did not convert with a vagal maneuver. The nurse is preparing adenosine. Which action is correct?", options:["Push 6 mg slowly over 2 minutes in a hand IV","Push 6 mg rapidly through an antecubital IV, followed immediately by a 20 mL NS flush","Dilute 6 mg in 100 mL and infuse over 30 minutes","Give 12 mg IM in the deltoid"], answer:1, why:"Adenosine has a very short half-life, so it is given as a rapid IV push close to the heart (AC or central line) followed by a 20 mL flush. If needed, the next dose is 12 mg."},
 {type:"sata", stem:"A client with new-onset A-fib for about 3 days is scheduled for elective cardioversion. Which interventions should the nurse anticipate? Select all that apply.", options:["Anticoagulation before the procedure","Transesophageal echocardiogram (TEE) to look for an atrial clot","Informed consent","Atropine 1 mg IV before the shock","Conscious sedation"], answers:[0,1,2,4], why:"A-fib longer than 48 hours requires anticoagulation and/or TEE because a shock can dislodge a clot and cause a stroke. Elective cardioversion needs consent and sedation. Atropine is for symptomatic bradycardia."},
 {stem:"After adenosine is given for SVT, the monitor shows a flat line for about 4 seconds, then a regular rhythm at 88 with P waves. What does the nurse recognize?", options:["Expected effect — brief asystole is common after adenosine","Lethal asystole requiring CPR","Medication error requiring the antidote","Pacemaker malfunction"], answer:0, why:"Adenosine briefly “reboots” the heart, and a few seconds of asystole is expected. The return of a sinus rhythm shows the drug worked; the crash cart should still be nearby."},
 {type:"cloze", stem:"Complete the sentence.", template:"In A-fib, the loss of {0} decreases cardiac output, and blood pooling in the atria increases the risk of {1}.", blanks:[{options:["atrial kick","the QRS complex","the T wave"],correct:0},{options:["hypoglycemia","bradycardia","stroke"],correct:2}], why:"Quivering atria do not contract, so the atrial kick that tops off the ventricles is lost. Stagnant blood forms clots that can travel to the brain and cause a stroke — the reason for anticoagulation."}
],
"m4-ventricular":[
 {type:"matrix", stem:"Classify each rhythm.", rows:["Ventricular fibrillation","Sinus tachycardia","Couplet PVCs","Asystole","A-fib with a controlled rate","R on T phenomenon"], cols:["Lethal","Potentially lethal","Non-lethal (treat if symptomatic)"], correct:[0,2,1,0,2,1], why:"V-fib and asystole have no cardiac output (lethal). Couplets and R on T can trigger V-tach or V-fib (potentially lethal). Sinus and atrial rhythms are non-lethal and treated if symptomatic."},
 {stem:"A client's strip shows wide QRS complexes that grow and shrink in height, twisting around the baseline. The client's latest magnesium is low. Which medication should the nurse anticipate?", options:["Adenosine","Atropine","Digoxin","IV magnesium"], answer:3, why:"This is torsades de pointes, a polymorphic VT linked to low magnesium; IV magnesium is the treatment. Adenosine is for SVT and atropine is for bradycardia."},
 {type:"sata", stem:"A client in sinus rhythm begins having PVCs. Which findings should the nurse report to the provider immediately? Select all that apply.", options:["PVCs of several different shapes","Two PVCs in a row","A PVC falling on the T wave","A single unifocal PVC after drinking coffee","Three PVCs in a row"], answers:[0,1,2,4], why:"Multifocal PVCs, couplets, R on T, and runs of 3 or more (a run of V-tach) signal irritable ventricles and can become lethal. An occasional unifocal PVC from caffeine can be normal."},
 {stem:"The monitor shows a flat line. Which action should the nurse take first?", options:["Defibrillate immediately","Assess the client and check the rhythm in a second lead","Administer adenosine","Document asystole"], answer:1, why:"A loose lead can look like asystole, so check the patient and confirm in a second lead. Asystole is not shockable; if confirmed and pulseless, start CPR and give epinephrine."},
 {type:"bowtie", stem:"A client suddenly becomes unresponsive. The monitor shows chaotic, irregular waves with no identifiable P, QRS, or T waves, and no carotid pulse is felt.", conditionOptions:["Ventricular fibrillation","Atrial fibrillation","Artifact","Sinus tachycardia"], correctCondition:0, actionOptions:["Start CPR","Defibrillate","Administer adenosine","Press the SYNC button before shocking","Give atropine"], correctActions:[0,1], paramOptions:["Pulse and responsiveness","Return of a rhythm with a pulse","Blood glucose","INR","Urine output"], correctParams:[0,1], why:"Unresponsive, pulseless, with chaotic waves = V-fib. Start CPR and defibrillate (unsynchronized). Monitor pulse/responsiveness and look for a perfusing rhythm. SYNC is used only for rhythms with a pulse."}
],
"m4-pacers-blocks":[
 {type:"dragdrop", stem:"Sort each strip description into the type of pacing it shows.", items:["Spike, then a P wave, then a narrow QRS","Spike directly before a wide QRS with no P wave","Two spikes per beat","Spike before each P wave"], bins:["Atrial paced","Ventricular paced","Dual (AV) paced"], correctBin:[0,1,2,0], why:"A spike before the P = atrial pacing; a spike before a wide QRS with no P = ventricular pacing; two spikes (one before the P and one before the QRS) = dual pacing."},
 {stem:"A client with a permanent pacemaker has a strip showing a pacer spike landing on the T wave. Why is the nurse concerned?", options:["It shows the pacemaker is working on demand","It means the battery is fully charged","It can cause an R on T event and trigger V-tach or V-fib","It indicates atrial fibrillation"], answer:2, why:"A spike on the T wave fires during the heart's vulnerable recovery period and can trigger V-tach or V-fib, like an R on T PVC. Assess the client and notify the provider."},
 {type:"sata", stem:"A client's strip shows more P waves than QRS complexes, and the client is dizzy with a heart rate of 40. Which actions are appropriate? Select all that apply.", options:["Hold the scheduled diltiazem and notify the provider","Give the scheduled metoprolol","Assess for signs of decreased cardiac output","Anticipate a possible pacemaker","Prepare for synchronized cardioversion"], answers:[0,2,3], why:"More P's than QRS's = heart block, which causes bradycardia and ↓ CO. Beta blockers and CCBs slow AV conduction further and should be held. A pacemaker may be needed; cardioversion is for tachydysrhythmias."},
 {stem:"A client receiving comfort care with a DNR order develops a very slow, wide, irregular rhythm of shapeless complexes. Which action is most appropriate?", options:["Call a code and start CPR","Prepare transcutaneous pacing","Administer atropine","Recognize agonal rhythm and support the client and family"], answer:3, why:"Agonal rhythm is the dying heart. With a DNR/comfort-care order, the nurse honors the client's wishes and supports the client and family rather than starting resuscitation."},
 {type:"cloze", stem:"Complete the sentence.", template:"A permanent pacemaker works {0}, firing only when the client's own heart rate drops {1} the set rate.", blanks:[{options:["on demand","continuously","only during exercise"],correct:0},{options:["above","below","to match"],correct:1}], why:"Permanent pacemakers are demand pacemakers: they sense the heart's own beats and fire only when the rate falls below the programmed rate. Pacemakers treat bradycardia."}
],
"m4-rhythm-tx":[
 {type:"matrix", stem:"Match each situation to the electrical therapy the nurse should anticipate.", rows:["Pulseless V-tach","Symptomatic bradycardia unresponsive to atropine","Unstable A-fib with RVR, BP 74/40, with a pulse","V-fib","Unstable SVT with a pulse"], cols:["Pacing","Synchronized cardioversion","Defibrillation"], correct:[2,0,1,2,1], why:"Brady → pacing; tachydysrhythmia WITH a pulse → synchronized cardioversion; lethal rhythm without a pulse (V-fib, pulseless VT) → defibrillation."},
 {type:"sata", stem:"The nurse is preparing a client for elective synchronized cardioversion. Which actions are appropriate? Select all that apply.", options:["Verify signed informed consent","Press the SYNC button and confirm markers on the R waves","Move oxygen away from the chest and call “all clear” before the shock","Turn SYNC off so the shock is delivered at random","Monitor airway, rhythm, and vital signs after sedation"], answers:[0,1,2,4], why:"Elective cardioversion needs consent, SYNC (timed to the R wave to avoid the T wave), safety (stand clear, O₂ away), and monitoring after sedation. Unsynchronized shocks are for defibrillation."},
 {stem:"A client in sinus bradycardia at 40 bpm is hypotensive and confused, and treating the cause has not helped. Which medication should the nurse prepare to give first?", options:["Adenosine","Amiodarone","Atropine","Aspirin"], answer:2, why:"Atropine 1 mg IV push (repeat q3–5 min, max 3 mg) is the first-line drug for symptomatic bradycardia. Adenosine is for SVT and amiodarone is an antiarrhythmic; mixing up the look-alike “A” drugs can be deadly."},
 {type:"ordering", stem:"A client with stable, narrow, regular SVT at 190 bpm needs treatment. Place the interventions in order.", items:["Assess the client and obtain a 12-lead ECG","Have the client perform a vagal maneuver (bear down)","Adenosine 6 mg rapid IV push with a 20 mL flush","Adenosine 12 mg rapid IV push if no conversion","Beta blocker or calcium channel blocker as ordered"], why:"Stable narrow regular tachycardia: assess → vagal maneuver → adenosine 6 mg → adenosine 12 mg → rate control with a beta blocker or CCB."},
 {stem:"Which client should the nurse identify as needing treatment rather than monitoring only?", options:["A client with chronic A-fib at 82 bpm who feels well","A client in sinus tachycardia at 118 who is hemorrhaging, BP 84/50","An athlete in sinus bradycardia at 52 who has no complaints","A client with an occasional unifocal PVC after coffee"], answer:1, why:"Treatment is based on symptoms of ↓ CO. The hemorrhaging client is hypotensive and needs the cause (bleeding) treated. The others are asymptomatic and are monitored."}
]
});

// ===================== QUIZ: CAD & HEART FAILURE =====================
Object.assign(QUIZ, {
"m4-cad":[
 {stem:"A client asks how plaque in a coronary artery suddenly causes a heart attack. Which explanation by the nurse is accurate?", options:["The plaque slowly grows until it dissolves the artery wall","A thin-capped plaque ruptures, platelets gather, and a clot blocks the artery","High HDL cholesterol forms a clot inside the artery","The artery dilates until blood can no longer flow through it"], answer:1, why:"Vulnerable plaque with a thin fibrous cap can rupture; platelets aggregate and a thrombus blocks flow (acute coronary syndrome). HDL is protective, and CAD is narrowing, not dilation."},
 {type:"sata", stem:"The nurse reviews a client's history. Which findings are modifiable risk factors for coronary artery disease? Select all that apply.", options:["Smokes one pack of cigarettes per day","Type 2 diabetes","Age 68","Sedentary job with no regular exercise","Mother had CAD at age 60"], answers:[0,1,3], why:"Smoking, diabetes, and physical inactivity can be changed or controlled. Age and family history are nonmodifiable."},
 {type:"matrix", stem:"For each lipid result in a client with known CAD, indicate whether it is at goal or needs follow-up.", rows:["Total cholesterol 182 mg/dL","LDL 148 mg/dL","HDL 32 mg/dL","Triglycerides 120 mg/dL"], cols:["At goal","Needs follow-up"], correct:[0,1,1,0], why:"Goals: total cholesterol below 200, LDL below 100 with CAD, HDL above 40–60, triglycerides below 150. LDL 148 is too high and HDL 32 is too low."},
 {stem:"A client with a large waist, high triglycerides, and high fasting glucose asks what metabolic syndrome means. The nurse explains it is diagnosed when a person has how many of the five risk factors?", options:["Any one","Two","Three","All five"], answer:2, why:"Metabolic syndrome requires 3 of the 5: large waist, high triglycerides, low HDL, high BP, and high fasting glucose."},
 {stem:"A client is having a treadmill stress test. Which finding requires the nurse to stop the test?", options:["Heart rate rises from 78 to 118","Reports that the legs feel tired","Respiratory rate increases to 24","O₂ saturation drops to 87%"], answer:3, why:"An O₂ sat below 90% is a reason to stop, along with chest pain, dysrhythmia, SOB, pallor, diaphoresis, or BP that is too high or too low. A higher heart rate, faster breathing, and tired legs are expected during exercise."}
],
"m4-angina":[
 {stem:"A client is admitted after several episodes of chest pain that occur at rest in the early morning. During an episode the ECG shows ST elevation that returns to normal when the pain stops, and troponin stays normal. Which type of angina does this suggest?", options:["Stable angina","Variant (Prinzmetal) angina","Silent ischemia","Intractable (refractory) angina"], answer:1, why:"Pain at rest with reversible ST elevation points to variant angina from coronary artery spasm, treated with calcium channel blockers. Stable angina follows exertion, silent ischemia has no pain, and intractable angina is severe, incapacitating pain."},
 {type:"ordering", stem:"A client with stable angina develops chest pain while climbing stairs at home. Place the steps the client should follow in the correct order.", items:["Stop the activity and sit down","Place 1 nitroglycerin tablet under the tongue","Repeat 1 tablet every 5 minutes if pain continues, up to 3 doses","Call 911 if pain is not relieved after the third dose","In the ED, a 12-lead ECG is obtained within 10 minutes"], why:"Sitting first lowers O₂ demand and protects against NTG hypotension. NTG is taken 1 tablet every 5 minutes up to 3; unrelieved pain means 911, and the ED gets a 12-lead within 10 minutes."},
 {type:"sata", stem:"The nurse teaches a client about sublingual nitroglycerin. Which statements show the client understands? Select all that apply.", options:["\"I'll sit down before I take a tablet.\"","\"I'll keep the tablets in their brown glass bottle.\"","\"If my pain isn't gone after the third tablet, I'll call 911.\"","\"I can take my sildenafil the same evening.\"","\"A headache means I should stop using it.\""], answers:[0,1,2], why:"Sitting prevents falls from hypotension, the amber bottle protects the drug from light, and pain unrelieved after 3 doses needs 911. PDE5 inhibitors with NTG cause severe hypotension, and headache is an expected side effect."},
 {type:"cloze", stem:"Complete the sentence.", template:"A client admitted with unstable angina is started on a heparin drip, which {0}, and metoprolol, which is given to {1}.", blanks:[{options:["prevents new clots from forming","dissolves the existing clot","raises the blood pressure"],correct:0},{options:["increase contractility","lower the risk of lethal dysrhythmias","prevent ventricular remodeling"],correct:1}], why:"Heparin prevents new clots and clot extension but does not dissolve clots. Every chest-pain patient gets a beta blocker to lower O₂ demand and dysrhythmia risk; the ACE inhibitor is the drug that prevents remodeling."},
 {stem:"A 72-year-old client with diabetes reports new shortness of breath and fatigue but denies chest pain. What is the nurse's best interpretation?", options:["Chest pain is required to suspect cardiac ischemia","These symptoms are expected with aging","Older adults and diabetics may have ischemia without classic chest pain","The client most likely has a lung infection"], answer:2, why:"Older adults and diabetics often present atypically (dyspnea, confusion, weakness, fatigue), so ischemia must be considered and a 12-lead obtained."}
],
"m4-cad-care":[
 {stem:"A client with angina is being discharged. Which statement indicates a need for more teaching about activity?", options:["\"I'll wear a scarf over my mouth when I walk in cold weather.\"","\"I'll walk right after a big dinner to help digestion.\"","\"I'll stop and rest if I get chest pain while walking.\"","\"I'll walk at a pace where I can still talk.\""], answer:1, why:"Activity right after a large meal raises myocardial O₂ demand and can trigger angina. The other statements are correct teaching."},
 {type:"sata", stem:"A client returns home after a cardiac catheterization through the femoral artery. Which instructions should the nurse include? Select all that apply.", options:["Check the site for bleeding or a hard lump","If the site bleeds, apply firm pressure","Drink plenty of fluids","Massage any lump that forms at the site","Report numbness or coldness in the leg"], answers:[0,1,2,4], why:"Watch for bleeding and hematoma, hold pressure if it bleeds, drink fluids to flush the dye, and report circulation changes. A hematoma is never massaged."},
 {type:"dragdrop", stem:"Sort each client situation into the correct response.", items:["Chest pain unrelieved after 3 NTG in 15 minutes","Angina now happens with less activity than before","New swelling of the feet and ankles","Chest pain with fainting and heavy sweating"], bins:["Call 911","Call the provider"], correctBin:[0,1,1,0], why:"Unrelieved chest pain or chest pain with syncope/diaphoresis may be an MI — call 911. A change in the angina pattern and new edema need prompt provider follow-up."},
 {stem:"A client taking metoprolol for CAD has an apical pulse of 54 before the morning dose. What should the nurse do?", options:["Give the dose and recheck in 1 hour","Give half the dose","Have the client walk, then recheck the pulse","Hold the dose and notify the provider"], answer:3, why:"Beta blockers are held, with provider notification, when HR is below 60 (or SBP below 90). The nurse does not change the dose without an order."},
 {stem:"The nurse teaches a client how to self-administer sublingual nitroglycerin. Which client statement shows correct understanding?", options:["\"I'll move the tablets to a plastic pill box I can keep in my shirt pocket.\"","\"I'll swallow the tablet with a glass of water.\"","\"I'll replace my supply every 3 to 6 months, even if tablets are left.\"","\"I'll wait until the pain is severe before taking a tablet.\""], answer:2, why:"NTG loses strength with heat, moisture, air, light, and time, so the supply is renewed every 3–6 months and kept in the original capped dark glass bottle, not a pillbox or a pocket. The tablet dissolves under the tongue, and it works best taken early or before activity that causes pain."}
],
"m4-hf-types":[
 {stem:"The nurse explains why a client with heart failure retains sodium and water. Which compensatory mechanism is responsible?", options:["Release of BNP from the ventricles","Activation of the renin–angiotensin–aldosterone system","Ventricular dilation","Decreased sympathetic stimulation"], answer:1, why:"Low kidney perfusion releases renin; angiotensin II triggers aldosterone, which keeps sodium and water. BNP does the opposite (promotes diuresis), and the SNS is increased, not decreased."},
 {type:"matrix", stem:"For each finding, indicate whether it describes systolic HF (HFrEF) or diastolic HF (HFpEF).", rows:["Ejection fraction of 30%","Thick, stiff ventricular walls","Stretched, \"big and boggy\" ventricle","The ventricle can't relax and fill","The ventricle can't pump blood out"], cols:["Systolic (HFrEF)","Diastolic (HFpEF)"], correct:[0,1,0,1,0], why:"Systolic = stretched, can't pump, EF below 50%. Diastolic = thick and stiff, can't fill, EF preserved."},
 {type:"sata", stem:"Which conditions can lead to heart failure? Select all that apply.", options:["Hypertension","Coronary artery disease","Atrial fibrillation","Severe anemia","Hypoglycemia"], answers:[0,1,2,3], why:"HTN, CAD/MI, dysrhythmias such as A-fib, and anemia all strain the heart and can cause HF. Hypoglycemia is not a cause of HF."},
 {stem:"A client had an MI last year, has a reduced EF on echocardiogram, and has never had HF symptoms. Which ACC/AHA stage fits this client?", options:["At risk","Pre-HF","HF","Advanced HF"], answer:1, why:"Structural heart changes without symptoms = pre-HF. At risk has no structural change; HF stage requires current or past symptoms; advanced HF is end stage."},
 {stem:"A client with heart failure is comfortable at rest but gets short of breath walking to the mailbox. Which NYHA class best describes this client?", options:["Class I","Class IV","Class II","Class III"], answer:2, why:"Class II = comfortable at rest, ordinary activity causes symptoms. Class III means less than ordinary activity causes symptoms; Class IV has symptoms at rest."}
],
"m4-hf-left-right":[
 {type:"dragdrop", stem:"Sort each finding into the type of heart failure it most suggests.", items:["Orthopnea","Jugular venous distention","Crackles that don't clear with coughing","Ascites","Pink, frothy sputum","Dependent ankle edema"], bins:["Left-sided HF","Right-sided HF"], correctBin:[0,1,0,1,0,1], why:"Left-sided HF backs up into the lungs (orthopnea, crackles, frothy sputum). Right-sided HF backs up into the rest of the body (JVD, ascites, dependent edema)."},
 {stem:"A client asks why their right-sided heart failure developed. The nurse knows the most common cause of right-sided HF is:", options:["Left-sided heart failure","Liver cirrhosis","Deep vein thrombosis","Hypothyroidism"], answer:0, why:"When the left side fails, pressure backs through the lungs into the right ventricle, which then fails too."},
 {type:"bowtie", stem:"A client with chronic HF wakes up gasping. Findings: RR 34, SpO₂ 84%, crackles throughout both lungs, pink frothy sputum, HR 122, cool clammy skin, extremely anxious. Complete the bowtie: the condition, two priority actions, and two parameters to monitor.", conditionOptions:["Acute pulmonary edema","Right-sided HF exacerbation","Pneumonia","Hypovolemic shock"], correctCondition:0, actionOptions:["Place in high Fowler's position","Give IV furosemide as ordered","Lay flat with legs raised","Give a 1-liter IV fluid bolus","Encourage oral fluids"], correctActions:[0,1], paramOptions:["Oxygen saturation","Urine output","Blood glucose","Pupil response","Bowel sounds"], correctParams:[0,1], why:"Sudden dyspnea, hypoxemia, diffuse crackles, and frothy sputum signal acute pulmonary edema. High Fowler's lowers preload and IV furosemide removes fluid; track SpO₂ and urine output. Lying flat or giving fluids makes it worse."},
 {type:"sata", stem:"The nurse prepares to assess a client's jugular veins. Which actions are correct? Select all that apply.", options:["Raise the head of the bed to 45 degrees","Turn the client's head slightly away","Treat distention more than about 4 cm above the sternal angle as abnormal","Place the client completely flat","Press on the right upper abdomen to check for hepatojugular reflux"], answers:[0,1,2,4], why:"Assess JVD at 45 degrees with the head turned slightly away; more than about 4 cm above the sternal angle is abnormal, and a rise with RUQ pressure points to high venous pressure. Lying flat fills the neck veins in everyone."},
 {stem:"While auscultating a client with heart failure, the nurse hears an extra sound right after S2 (\"Ken-tuc-ky\"). How should the nurse interpret this?", options:["A normal finding in adults","A sign of mitral valve stenosis","An S3, an early sign of fluid overload","A pericardial friction rub"], answer:2, why:"An S3 gallop comes from blood rushing into an overfilled ventricle and is an early sign of fluid overload in HF."}
],
"m4-hf-care":[
 {type:"fitb", stem:"A client with heart failure weighed 80 kg on admission and weighs 77.5 kg after diuresis. About how many liters of fluid has the client lost? Record your answer to the nearest tenth.", answer:2.5, why:"80 − 77.5 = 2.5 kg, and 1 kg is about 1 L of fluid, so about 2.5 L. Daily weights are the best measure of fluid status in HF."},
 {type:"sata", stem:"Which instructions belong in discharge teaching for a client with heart failure? Select all that apply.", options:["Weigh yourself every morning on the same scale in the same clothes","Report a gain of 2–3 lb in a day or 5 lb in a week","Use a salt substitute freely","Follow the sodium and fluid limits as ordered","Get your influenza and pneumonia vaccines"], answers:[0,1,3,4], why:"Daily weights, reporting weight gain, following sodium/fluid limits, and vaccines all prevent exacerbations. Salt substitutes are high in potassium and can cause hyperkalemia with ACE inhibitors, ARBs, or potassium-sparing diuretics."},
 {stem:"A client with heart failure has a BNP of 860 pg/mL. How should the nurse interpret this result?", options:["Normal BNP","Consistent with heart failure — the higher the level, the worse the failure","Evidence of a recent MI","A sign of dehydration"], answer:1, why:"A BNP above 100 pg/mL indicates HF, and higher values mean worse failure. Troponin, not BNP, shows heart muscle damage."},
 {type:"matrix", stem:"A client with HF is receiving furosemide. For each finding, indicate whether it is expected or should be reported.", rows:["Large urine output 1 hour after the dose","Potassium 3.0 mEq/L","Fewer crackles in the lung bases","BP 84/50 with dizziness"], cols:["Expected","Report"], correct:[0,1,0,1], why:"Diuresis and clearer lungs mean the drug is working. Potassium below 3.5 and hypotension with dizziness are diuretic problems that need to be reported."},
 {stem:"A client is prescribed sacubitril/valsartan and has been taking lisinopril. What is the nurse's priority teaching?", options:["Take both medications together in the morning","Stop lisinopril at least 36 hours before starting sacubitril/valsartan","Double the lisinopril dose for the first week","Take sacubitril/valsartan only on days with edema"], answer:1, why:"An ARNI is never taken with an ACE inhibitor — a 36-hour washout is needed to prevent angioedema."}
]
});

// ===================== QUIZ: CLOTTING & BLOOD DISORDERS =====================
Object.assign(QUIZ, {
"m4-vte":[
 {stem:"Which client should the nurse identify as having the highest risk for developing a DVT?", options:["A 30-year-old admitted for observation after a mild concussion who is walking in the hall","A 45-year-old with seasonal allergies taking an antihistamine","A 72-year-old with heart failure on bed rest after a hip fracture repair","A 25-year-old with a sprained wrist"], answer:2, why:"This client stacks Virchow triad risk factors: endothelial damage (fracture and surgery) plus venous stasis (bed rest, heart failure, age over 65). The other clients are mobile and lack major risk factors."},
 {type:"sata", stem:"A client is 1 day post-op after abdominal surgery. Which actions should the nurse include to prevent VTE? Select all that apply.", options:["Assist the client to ambulate in the hall","Teach ankle pumps and leg exercises every hour while in bed","Apply intermittent pneumatic compression devices while in bed","Place a pillow under the knees for comfort","Encourage oral fluids unless restricted"], answers:[0,1,2,4], why:"Early ambulation, leg exercises, SCDs, and hydration all reduce stasis and hemoconcentration. A pillow under the knees compresses the popliteal veins and promotes stasis, so it is avoided."},
 {type:"matrix", stem:"For each item, indicate whether it applies to heparin or warfarin.", rows:["Monitored with the aPTT","Goal INR of 2–3","Antidote is protamine sulfate","Antidote is vitamin K","Monitor platelets for heparin-induced thrombocytopenia (HIT)"], cols:["Heparin","Warfarin"], correct:[0,1,0,1,0], why:"Heparin is monitored with the aPTT (“two t's make an H”), reversed with protamine, and can cause HIT, so platelets are watched. Warfarin is monitored with PT/INR (goal 2–3) and reversed with vitamin K."},
 {stem:"A client being discharged on warfarin for a DVT makes the following statements. Which statement indicates a need for further teaching?", options:["I will use an electric razor instead of a blade.","I will wear a medical ID that says I take a blood thinner.","I will call my provider if my urine looks red or brown.","I'm going to start eating a large spinach salad every day to get healthier."], answer:3, why:"A sudden large increase in vitamin K–rich leafy greens lowers warfarin's effect; intake should stay consistent, not change dramatically. The other statements reflect correct bleeding-precaution teaching."},
 {stem:"A client with a left-leg DVT has started a heparin infusion. Which nursing action is appropriate?", options:["Elevate the client's legs above the level of the heart","Massage the left calf to relieve the cramping","Keep the client in a chair with the knees bent for most of the day","Apply a cold pack to the calf and keep the client on strict bed rest for a week"], answer:0, why:"Elevating the legs above the heart helps the veins empty and reduces swelling; warm packs, analgesics, and walking once anticoagulation has started are also used. Massage can dislodge the clot, and prolonged sitting with bent knees promotes stasis."}
],
"m4-pe":[
 {type:"bowtie", stem:"A client 2 days after hip surgery suddenly becomes short of breath and anxious and reports sharp chest pain when breathing in. RR 32, HR 124, BP 108/70, SpO₂ 86% on room air. Complete the diagram: the condition the client is most likely experiencing, two actions the nurse should take, and two parameters to monitor.", conditionOptions:["Pulmonary embolism","Pneumonia","Panic attack","Stable angina"], correctCondition:0, actionOptions:["Raise the head of the bed and apply oxygen","Notify the provider immediately","Massage the client's calves to improve circulation","Place the client flat in bed","Offer a cup of water to calm the client"], correctActions:[0,1], paramOptions:["SpO₂ and respiratory rate","BP and heart rate for signs of shock/right-sided failure","Bowel sounds","Capillary blood glucose","Pupil response"], correctParams:[0,1], why:"Sudden dyspnea, tachypnea, pleuritic chest pain, tachycardia, anxiety, and hypoxemia in a post-op orthopedic client point to PE. Raise the HOB, give O₂, stay, and notify the provider; monitor oxygenation and watch BP/HR for right-sided heart failure and shock. Massaging the legs could dislodge more clot, and lying flat worsens breathing."},
 {type:"sata", stem:"A client with an unstable PE is receiving a thrombolytic infusion. Which actions should the nurse take? Select all that apply.", options:["Maintain the client on bed rest during the infusion","Hold manual pressure on any puncture site for at least 30 minutes","Limit venipunctures to those that are essential","Stop the infusion and notify the provider if uncontrolled bleeding occurs","Give the prescribed analgesic by IM injection"], answers:[0,1,2,3], why:"Thrombolytics prolong clotting, so the client stays on bed rest, needle sticks are minimized, puncture sites get at least 30 minutes of pressure, and uncontrolled bleeding means stopping the infusion. IM injections cause bleeding and hematomas and should be avoided."},
 {stem:"Which description best explains the gas-exchange problem in a pulmonary embolism?", options:["Alveoli are filled with fluid, so blood passes without picking up oxygen","Alveoli are collapsed while blood flow continues","Alveoli are ventilated, but blood flow to them is blocked","Both ventilation and perfusion are reduced equally"], answer:2, why:"PE causes dead space: air reaches the alveoli but the clot blocks blood flow, so no gas exchange occurs. Fluid-filled or collapsed alveoli with continued blood flow describe a shunt (pneumonia, atelectasis, pulmonary edema)."},
 {stem:"For which client would the nurse expect an inferior vena cava (IVC) filter to be considered?", options:["A client with a first, small PE who is hemodynamically stable","A client with superficial thrombophlebitis of the arm","A client with a DVT who started enoxaparin today","A client with recurrent PEs despite therapeutic anticoagulation"], answer:3, why:"An IVC filter traps clots from the legs and pelvis and is used for recurrent PE despite anticoagulation or when anticoagulation is contraindicated. It is not first-line therapy for a stable first PE or a newly treated DVT, and superficial thrombophlebitis has a low embolus risk."},
 {stem:"A client recovering from a PE is planning a long car trip. Which statement shows the client understands how to prevent a recurrence?", options:["I'll limit fluids so I don't have to stop for the bathroom.","I'll stop every couple of hours to walk, and do leg exercises while I sit.","I'll sit with my legs crossed so I'm more comfortable.","I'll take my compression stockings off for the drive."], answer:1, why:"Walking regularly, exercising the legs while seated, and staying hydrated prevent venous stasis and hemoconcentration. Limiting fluids, crossing the legs, and removing prescribed compression stockings all raise clot risk."}
],
"m4-stroke":[
 {type:"ordering", stem:"A client arrives at the ED 1 hour after sudden left-sided weakness began. Place the nurse's actions in the correct order.", items:["Check capillary blood glucose","Obtain a non-contrast head CT","Review contraindications and confirm BP is below 185/110","Give the alteplase bolus","Start the remaining alteplase infusion over 1 hour"], why:"Glucose is checked first because hypoglycemia mimics stroke. A non-contrast CT must rule out bleeding, contraindications and BP (below 185/110) are confirmed, then alteplase is given as a 10% bolus followed by the rest over 1 hour."},
 {type:"matrix", stem:"For each finding, indicate whether it is more consistent with an ischemic or a hemorrhagic stroke.", rows:["Embolus from atrial fibrillation","Sudden “worst headache of my life” with vomiting","A clot blocks a cerebral artery","Ruptured aneurysm in a client with uncontrolled hypertension","May be a candidate for alteplase within the time window"], cols:["Ischemic","Hemorrhagic"], correct:[0,1,0,1,0], why:"Ischemic strokes come from thrombosis or embolism (often A-fib) and may be treated with alteplase. Hemorrhagic strokes come from a ruptured vessel (hypertension, aneurysm) and classically present with a sudden severe headache; thrombolytics are contraindicated."},
 {type:"sata", stem:"A client with an acute ischemic stroke is being evaluated for alteplase. Which findings are contraindications? Select all that apply.", options:["BP 204/118 that does not come down with treatment","Abdominal surgery 6 days ago","History of a hemorrhagic stroke","Symptom onset 2 hours ago","Takes metformin for type 2 diabetes"], answers:[0,1,2], why:"Uncontrolled BP above 185/110, recent surgery, and a history of hemorrhagic stroke all raise the risk of serious bleeding. Onset 2 hours ago is within the 3-hour window, and metformin is not a contraindication."},
 {stem:"A client has a left-hemisphere ischemic stroke. Which findings should the nurse expect?", options:["Left-sided weakness and impulsive behavior","Left-sided weakness and neglect of the left side","Bilateral leg weakness with intact speech","Right-sided weakness and difficulty speaking or understanding speech"], answer:3, why:"Motor pathways cross, so a left-brain stroke causes right-sided weakness, and the language centers are usually on the left, so aphasia is common. Left-sided weakness, neglect, and impulsivity are typical of a right-hemisphere stroke."},
 {stem:"The family of a client with ischemic stroke asks why the head CT done on arrival was “normal.” Which response by the nurse is accurate?", options:["Ischemic tissue death may not show on CT for about 48 hours; the first CT is done mainly to rule out bleeding.","A normal CT means the client had a TIA, not a stroke.","The CT was done with contrast, which hides early strokes.","A normal CT means the stroke has resolved."], answer:0, why:"On a non-contrast CT, a bleed shows right away, but ischemic damage may not be visible for about 48 hours. The early CT's main job is to rule out hemorrhage before alteplase. A normal CT does not mean a TIA or that the stroke has resolved, and the stroke CT is done without contrast."}
],
"m4-stroke-care":[
 {type:"fitb", stem:"A client with a large ischemic stroke has a BP of 140/80 mm Hg and an intracranial pressure of 22 mm Hg. What is the client's cerebral perfusion pressure in mm Hg? Record your answer to the nearest whole number.", answer:78, why:"MAP = (140 + 2 × 80) ÷ 3 = 300 ÷ 3 = 100. CPP = MAP − ICP = 100 − 22 = 78 mm Hg, which is above the ~60 mm Hg level where cerebral ischemia becomes a risk."},
 {type:"sata", stem:"A client with expressive aphasia after a stroke is frustrated trying to communicate. Which nursing actions are appropriate? Select all that apply.", options:["Face the client and make eye contact","Use short, simple phrases and allow time to respond","Finish the client's sentences to reduce frustration","Offer a picture communication board","Speak loudly so the client can understand"], answers:[0,1,3], why:"Facing the client, using short phrases with time to respond, and offering pictures or a communication board support communication. Finishing sentences increases frustration and takes away practice, and aphasia is not a hearing problem, so a loud voice doesn't help."},
 {stem:"Forty minutes into an alteplase infusion for ischemic stroke, the client reports a sudden severe headache and vomits. BP has risen to 196/112. What is the nurse's priority action?", options:["Give the prescribed antiemetic and continue to monitor","Give acetaminophen for the headache","Stop the alteplase infusion and notify the provider","Lower the head of the bed to flat"], answer:2, why:"Sudden severe headache, vomiting, and rising BP during thrombolytic therapy suggest intracranial bleeding, so the infusion is stopped and the provider notified immediately. Treating symptoms alone delays care, and lying flat raises ICP and aspiration risk."},
 {type:"cloze", stem:"Complete the sentence.", template:"Before a client who had a stroke receives any oral food, fluid, or medication, the nurse should {0}; if dysphagia is present, the nurse should offer {1}.", blanks:[{options:["complete a swallow screen","give a sip of water to see what happens","check the client's blood glucose"],correct:0},{options:["thin liquids through a straw","ice chips only","thickened liquids with the client upright and chin tucked"],correct:2}], why:"Stroke can impair swallowing and the gag/cough reflexes, so the client stays NPO until a swallow screen is passed. Thickened liquids and pureed foods, sitting upright, and a chin tuck reduce aspiration; thin liquids and straws increase it."},
 {stem:"A client with atrial fibrillation is being discharged after an ischemic stroke. Which medication should the nurse expect to be part of secondary prevention for the embolic stroke risk?", options:["Alteplase","Warfarin or a direct oral anticoagulant","Ibuprofen","Hydroxyurea"], answer:1, why:"A-fib lets blood pool and form clots that embolize to the brain, so long-term anticoagulation (warfarin with INR 2–3 or a DOAC) prevents recurrence. Alteplase is only for acute treatment, and ibuprofen and hydroxyurea do not prevent embolic stroke."}
],
"m4-anemia":[
 {type:"sata", stem:"A client is admitted with anemia. Which findings should the nurse expect? Select all that apply.", options:["Fatigue","Tachycardia","Pallor of the skin and conjunctivae","Shortness of breath with exertion","Hypertension"], answers:[0,1,2,3], why:"Anemia reduces oxygen delivery, so the client looks like someone with decreased cardiac output: fatigue, pallor, dyspnea on exertion, and a fast heart rate as the heart compensates. Low, not high, blood pressure is expected."},
 {type:"dragdrop", stem:"Sort each cause of anemia into the correct category.", items:["Chemotherapy","Chronic kidney disease","Diet low in iron and folic acid","GI bleeding from long-term NSAID use","Heavy menstrual periods","Red blood cells destroyed faster than normal"], bins:["Not making enough RBCs","Losing or destroying RBCs"], correctBin:[0,0,0,1,1,1], why:"Chemo suppresses the marrow, CKD lowers erythropoietin, and nutritional deficiencies starve RBC production, so the body isn't making enough. Bleeding loses RBCs, and hemolysis destroys them too fast (watch for jaundice and an enlarged spleen)."},
 {stem:"The nurse teaches a client about oral iron. Which client statement indicates a need for further teaching?", options:["I'll take it with orange juice.","My stools may turn dark, and that's expected.","I'll take my iron with a glass of milk so it doesn't upset my stomach.","I'll drink the liquid iron through a straw and rinse my mouth."], answer:2, why:"Milk, dairy, and antacids block iron absorption. Vitamin C (orange juice) improves absorption, dark stools are expected, and a straw prevents liquid iron from staining the teeth."},
 {stem:"A client with iron deficiency asks why the provider also recommended folic acid and vitamin B12. Which response by the nurse is best?", options:["Those supplements will replace your iron pills.","All three supplements work together to promote healthy red blood cell development.","They are only needed if your blood counts get worse.","They prevent the dark stools caused by iron."], answer:1, why:"Patients with anemia are advised to take iron, folic acid, and B12 regardless of which deficiency is present, because all three support healthy RBC development. They don't replace iron, aren't reserved for worsening anemia, and don't change stool color."},
 {stem:"A client with severe anemia stands up to walk to the bathroom and says, “I feel dizzy.” What should the nurse do first?", options:["Encourage the client to keep walking to build tolerance","Obtain a hemoglobin level","Offer an oral iron supplement","Help the client sit back down"], answer:3, why:"Dizziness signals poor oxygen delivery to the brain and a high fall risk, so safety comes first: sit the client down, then assess vital signs and SpO₂. Pushing through, drawing labs, or giving iron does not prevent the immediate fall."}
],
"m4-sickle":[
 {type:"matrix", stem:"A client is admitted with a vaso-occlusive sickle cell crisis. For each finding, indicate whether it is expected with the crisis or should be reported immediately as a complication.", rows:["Joint pain rated 8/10","Fever, new cough, SpO₂ 88%, new infiltrate on chest X-ray","Yellowish sclera, unchanged from the client's baseline","Sudden slurred speech and right arm weakness","Painful erection lasting 4 hours","Fatigue"], cols:["Expected with crisis","Report immediately"], correct:[0,1,0,1,1,0], why:"Severe pain, baseline jaundice from hemolysis, and fatigue are expected. Fever, cough, hypoxia, and a new infiltrate signal acute chest syndrome; new neuro deficits signal stroke; and priapism longer than 3 hours needs urgent care."},
 {type:"sata", stem:"The nurse is teaching a client with sickle cell disease how to prevent crises. Which triggers should the nurse tell the client to avoid? Select all that apply.", options:["Dehydration","Exposure to cold","Travel to high altitudes","Infections","Warm showers"], answers:[0,1,2,3], why:"Dehydration, cold (vasoconstriction), high altitude (hypoxia), and infection all promote sickling. Warmth is helpful, not harmful — ice and cold are what should be avoided."},
 {stem:"A client with sickle cell disease is started on hydroxyurea. Which laboratory result is most important for the nurse to monitor?", options:["Serum potassium","Hemoglobin A1C","Complete blood count, especially the WBC","Lipid panel"], answer:2, why:"Hydroxyurea causes bone marrow suppression; a low WBC increases infection risk and may mean the dose must be held. Potassium, A1C, and lipids are not affected by hydroxyurea."},
 {stem:"A client in sickle cell crisis rates pain as 10/10 and says the pain is like previous crises. Which action should the nurse take?", options:["Administer the prescribed IV opioid promptly and reassess pain","Apply ice packs to the painful joints","Withhold pain medication until the client's vital signs show distress","Restrict oral fluids to prevent fluid overload"], answer:0, why:"Crisis pain should be believed and treated quickly with opioids (IV/PCA), then reassessed. Cold triggers more sickling, vital signs don't need to show distress to validate pain, and hydration is a core part of crisis care."},
 {stem:"A client with sickle cell disease is receiving a second unit of packed RBCs. The client develops crackles and increasing shortness of breath. What should the nurse suspect?", options:["Iron overload","Hydroxyurea toxicity","Expected response to the transfusion","Fluid volume overload"], answer:3, why:"New crackles and dyspnea during a transfusion suggest fluid overload, so the nurse slows or stops the transfusion and notifies the provider. Iron overload builds up over many transfusions, and these findings are not an expected response."}
],
"m4-hemophilia":[
 {type:"sata", stem:"A nurse is teaching a young adult with hemophilia B about preventing bleeding. Which instructions should the nurse include? Select all that apply.", options:["Use a soft-bristled toothbrush","Shave with an electric razor","Wear a medical alert ID","Take ibuprofen for joint aches","Joining a tackle football team is safe as long as you wear pads"], answers:[0,1,2], why:"A soft toothbrush, electric razor, and medical ID reduce bleeding risk and speed emergency care. NSAIDs like ibuprofen impair platelets, and contact sports should be avoided."},
 {type:"matrix", stem:"A client with hemophilia A has an acute bleed into the left knee. For each intervention, indicate whether it is indicated or contraindicated.", rows:["Administer factor VIII as prescribed","Apply a heating pad to the knee","Elevate the left leg","Wrap the knee snugly with an elastic compression bandage","Rest and immobilize the knee","Give an IM injection for pain"], cols:["Indicated","Contraindicated"], correct:[0,1,0,1,0,1], why:"Replacing factor VIII, elevating, and resting/immobilizing the joint control the bleed and help reabsorption. Heat increases bleeding, compression wraps can cause compartment syndrome, and IM injections cause hematomas."},
 {stem:"A woman who is a carrier of hemophilia A and a man without hemophilia are planning a family. What should the nurse explain about each son they have?", options:["Each son will be a carrier but will not have symptoms.","Each son has a 50% chance of having hemophilia.","Every son will have hemophilia.","Sons cannot inherit hemophilia from their mother."], answer:1, why:"Hemophilia is X-linked recessive. A son gets his only X chromosome from his mother, so with a carrier mother each son has a 50% chance of inheriting the affected X and having hemophilia. Males cannot be silent carriers."},
 {stem:"A client's factor VIII activity is less than 1% of normal. Which finding should the nurse anticipate?", options:["Bleeding only after major surgery","No bleeding problems until older adulthood","Spontaneous bleeding into joints and muscles","Easy clotting and DVT"], answer:2, why:"A factor level below 1% is severe hemophilia, with spontaneous bleeding into joints, muscles, and the GI tract. Bleeding only after trauma or surgery describes mild (above 5%) or moderate (1–5%) disease."},
 {stem:"A client with severe hemophilia A slipped and hit their head 30 minutes ago. The client is alert and reports only a mild headache. What is the nurse's priority?", options:["Apply a warm compress to the head and reassess in 4 hours","Give aspirin for the headache","Encourage the client to rest at home and call if symptoms worsen","Notify the provider for immediate evaluation and prepare to give factor replacement"], answer:3, why:"Intracranial bleeding is the most dangerous bleed in hemophilia, so any head injury needs immediate evaluation and prompt factor replacement, even if the client looks well. Heat increases bleeding, aspirin impairs platelets, and waiting at home delays care."}
]
});

"m4-meds-bb-ccb":[
 {stem:"A client with asthma and hypertension is prescribed propranolol. Which assessment finding is most important for the nurse to report?",
  options:["Heart rate of 72","New expiratory wheezing","Mild fatigue","BP of 128/80"],
  answer:1,
  why:"Propranolol is a nonselective beta blocker that can cause bronchoconstriction — new wheezing in a client with asthma must be reported. A HR of 72 and BP of 128/80 are within parameters, and mild fatigue is a common, less urgent effect."},
 {type:"sata", stem:"A client is being discharged on metoprolol. Which statements should the nurse include in the teaching? Select all that apply.",
  options:["Check your pulse before taking it","Stop the drug if you feel tired","Change positions slowly","Your low-blood-sugar warning signs such as a fast heartbeat may be hidden","Ask before taking OTC cold medicines"],
  answers:[0,2,3,4],
  why:"Beta blockers require pulse checks, slow position changes, glucose awareness (tachycardia/tremor are masked), and avoiding OTC drugs without approval. They must never be stopped abruptly — rebound tachycardia, angina, or MI can occur."},
 {type:"matrix", stem:"For each finding, indicate whether the nurse should give or hold the scheduled oral dose.",
  rows:["Metoprolol: HR 56, BP 118/72","Amlodipine: HR 78, BP 86/54","Diltiazem: HR 88, BP 132/80","Carvedilol: HR 64, BP 104/66","Diltiazem: new heart block on the monitor"],
  cols:["Give","Hold and notify"],
  correct:[1,1,0,0,1],
  why:"Both classes are held for HR below 60 or SBP below 90, and neither is given with heart block. HR 64 with SBP 104 and HR 88 with SBP 132 are within parameters."},
 {stem:"A client taking nifedipine reports that her ankles are swollen at the end of the day. How should the nurse interpret this?",
  options:["A sign of an allergic reaction requiring epinephrine","A sign of digoxin toxicity","A common adverse effect of dihydropyridine calcium channel blockers to report and assess further","An expected sign that the drug is working"],
  answer:2,
  why:"Peripheral edema is a common adverse effect of amlodipine and nifedipine; the nurse assesses for weight gain and SOB and reports it. It is not an allergy or an indication the drug is working."},
 {type:"cloze", stem:"Complete the sentence.",
  template:"Diltiazem is used mainly to {0} in A-fib, while amlodipine is used mainly to {1}; clients on either drug should avoid {2}.",
  blanks:[{options:["control the heart rate","dissolve atrial clots","raise the BP"],correct:0},{options:["slow AV conduction","lower blood pressure","increase contractility"],correct:1},{options:["leafy greens","dairy products","grapefruit juice"],correct:2}],
  why:"Diltiazem slows the SA node and AV conduction (rate control); amlodipine dilates vessels to lower BP. Grapefruit raises CCB levels."}
],
"m4-meds-raas":[
 {stem:"Two years after starting lisinopril, a client arrives with a swollen tongue and lips and a hoarse voice. What is the nurse's priority?",
  options:["Give the next dose with an antihistamine","Assess the airway and call for emergency help","Reassure the client that angioedema occurs only with the first dose","Switch the client to sacubitril/valsartan"],
  answer:1,
  why:"Angioedema from an ACE inhibitor can occur even after years of use and threatens the airway — airway first, stop the drug, get help. An ARNI is also contraindicated with a history of angioedema."},
 {type:"sata", stem:"Which findings should the nurse monitor for a client taking losartan? Select all that apply.",
  options:["Serum potassium","BUN and creatinine","Blood pressure","Persistent dry cough as the expected effect","Pregnancy status"],
  answers:[0,1,2,4],
  why:"ARBs require monitoring of potassium, kidney function, and BP, and are contraindicated in pregnancy. ARBs don't build up bradykinin, so a dry cough is not an expected effect — that's typical of ACE inhibitors."},
 {stem:"A client on enalapril says, \"I've been using a salt substitute to cut my sodium.\" Which lab value is the nurse most concerned about?",
  options:["Sodium 134 mEq/L","Glucose 140 mg/dL","Potassium 5.9 mEq/L","Hemoglobin 12.8 g/dL"],
  answer:2,
  why:"ACE inhibitors cause the kidneys to retain potassium, and salt substitutes are potassium chloride — together they can cause dangerous hyperkalemia. The other values are not the priority."},
 {type:"dragdrop", stem:"Sort each statement to the drug class it best describes.",
  items:["Ends in \"-pril\"; dry cough is common","Ends in \"-sartan\"; the switch when cough occurs","Needs a 36-hour washout from an ACE inhibitor","Combines a neprilysin inhibitor with valsartan","Blocks the enzyme converting angiotensin I to II"],
  bins:["ACE inhibitor","ARB","ARNI"],
  correctBin:[0,1,2,2,0],
  why:"ACE inhibitors (\"-pril\") block the converting enzyme and cause cough. ARBs (\"-sartan\") block the receptor without cough. The ARNI (sacubitril/valsartan) pairs a neprilysin inhibitor with valsartan and must wait 36 hours after an ACE inhibitor."},
 {stem:"A client starting lisinopril for HF receives the first dose. What should the nurse monitor most closely in the next few hours?",
  options:["Blood pressure for first-dose hypotension","Blood glucose for hyperglycemia","Temperature for fever","Urine color for rhabdomyolysis"],
  answer:0,
  why:"First-dose hypotension is a known effect of ACE inhibitors, so the nurse monitors BP and fall risk. Rhabdomyolysis is a statin concern."}
],
"m4-meds-brady":[
 {stem:"A client with symptomatic bradycardia has received atropine 1 mg IV twice, 4 minutes apart, with little change. What is the maximum total atropine dose?",
  options:["1 mg","2 mg","5 mg","3 mg"],
  answer:3,
  why:"Atropine is given 1 mg IV every 3–5 minutes to a maximum of 3 mg; if it is ineffective, pacing and/or a dopamine or epinephrine drip follow."},
 {type:"ordering", stem:"Place the bradycardia treatment steps for a symptomatic client in order.",
  items:["Assess for signs of decreased cardiac output and look for the cause","Atropine 1 mg IV push","Transcutaneous pacing and/or dopamine or epinephrine drip","Transvenous pacing/expert consult"],
  why:"Assess and treat the cause first, then atropine, then transcutaneous pacing and/or a dopamine (5–20 mcg/kg/min) or epinephrine (2–10 mcg/min) drip, then transvenous pacing/expert consult."},
 {type:"sata", stem:"A client is receiving a norepinephrine infusion. Which nursing actions are appropriate? Select all that apply.",
  options:["Infuse through a central line when possible","Check BP, HR, and rhythm frequently while titrating","Stop the drip abruptly once the BP is 120/80","Inspect the IV site often for blanching or swelling","Keep phentolamine available per protocol"],
  answers:[0,1,3,4],
  why:"Vasopressors are vesicants given through a large vein/central line with frequent VS and site checks; phentolamine reverses extravasation. Drips are weaned, not stopped abruptly."},
 {type:"bowtie", stem:"A client on a dopamine drip through a forearm IV says the site burns. The skin around the site is cool, pale, and swollen.",
  conditionOptions:["Vasopressor extravasation","Phlebitis from a bacterial infection","Allergic reaction to dopamine","Fluid overload"],
  correctCondition:0,
  actionOptions:["Stop the infusion and notify the provider","Apply a cold pack and continue the drip","Prepare phentolamine to infiltrate the site","Flush the line forcefully with saline","Increase the dopamine rate"],
  correctActions:[0,2],
  paramOptions:["Appearance and color of the site","Serum sodium","Blood pressure and heart rate","Deep tendon reflexes","Blood glucose"],
  correctParams:[0,2],
  why:"A cool, pale, swollen, burning site during a vasopressor infusion is extravasation of a vesicant. Stop the infusion, notify, and give phentolamine as ordered; monitor the site and the BP/HR (the drug was interrupted and phentolamine can lower BP)."},
 {stem:"After atropine, which effect should the nurse tell the client to expect?",
  options:["Dry mouth and blurred vision","Excess salivation","A slower heart rate","Constricted pupils"],
  answer:0,
  why:"Atropine is an anticholinergic — dry mouth, blurred vision/dilated pupils, a faster HR, and urinary retention are expected. Salivation and pupil constriction are the opposite (cholinergic) effects."}
],
"m4-meds-antiarrhythmic":[
 {stem:"Which IV site is best for giving adenosine?",
  options:["A hand vein","An antecubital or central line","An IO site in the tibia","A foot vein"],
  answer:1,
  why:"Adenosine's half-life is under 10 seconds, so it is pushed rapidly through an antecubital or central line — closest to the heart — followed by a 20 mL NS flush."},
 {type:"sata", stem:"A client is starting long-term amiodarone. Which baseline and follow-up tests should the nurse expect? Select all that apply.",
  options:["Liver enzymes","Thyroid function tests","Chest X-ray/pulmonary function tests","Eye examination","Hearing test for ototoxicity"],
  answers:[0,1,2,3],
  why:"Amiodarone can harm the liver, thyroid, lungs, and eyes (TELLS — plus skin). Ototoxicity is not a key amiodarone effect."},
 {type:"matrix", stem:"Match each drug to its use.",
  rows:["Lidocaine","Adenosine","Magnesium sulfate","Atropine","Diltiazem"],
  cols:["Ventricular dysrhythmia/torsades","Fast atrial/SVT rhythm","Bradycardia"],
  correct:[0,1,0,2,1],
  why:"Lidocaine is for ventricular rhythms only; magnesium treats torsades (polymorphic V-tach). Adenosine converts SVT, and diltiazem controls the rate in fast atrial rhythms. Atropine speeds bradycardia."},
 {stem:"A client on a lidocaine drip becomes confused, reports ringing in the ears and numb lips. What should the nurse suspect?",
  options:["Hypoglycemia","Expected therapeutic effect","Stroke from a clot","Lidocaine toxicity"],
  answer:3,
  why:"Confusion, tinnitus, and perioral numbness are signs of lidocaine CNS toxicity, which can progress to seizures. The nurse stops/reduces the infusion per orders and notifies the provider."},
 {stem:"A client's rhythm becomes polymorphic V-tach twisting around the baseline; the magnesium level is low. Which drug should the nurse anticipate?",
  options:["Magnesium sulfate IV","Adenosine 6 mg","Atropine 1 mg","Digoxin IV"],
  answer:0,
  why:"Torsades de pointes is linked to low magnesium and is treated with magnesium sulfate. Adenosine is for narrow regular SVT and atropine for bradycardia."}
],
"m4-meds-anticoag":[
 {type:"matrix", stem:"Match each anticoagulant to its reversal agent.",
  rows:["Heparin","Warfarin","Apixaban","Dabigatran","Enoxaparin"],
  cols:["Protamine sulfate","Vitamin K","Andexanet alfa","Idarucizumab"],
  correct:[0,1,2,3,0],
  why:"Heparin and LMWH are reversed by protamine sulfate (less effectively for LMWH). Warfarin → vitamin K. Rivaroxaban/apixaban → andexanet alfa. Dabigatran → idarucizumab."},
 {stem:"A client on warfarin for A-fib has an INR of 2.6. What should the nurse do?",
  options:["Hold the dose and give vitamin K","Increase the dose","Give the dose as ordered — the INR is within the goal range","Start a heparin drip"],

 {type:"sata", stem:"The nurse is teaching a client how to self-inject enoxaparin. Which instructions are correct? Select all that apply.",

// ===================== QUIZ: MED MATH (MODULE 4 ADDITIONS) =====================
Object.assign(QUIZ, {
"m4math-co-sv":[
 {type:"fitb", stem:"A client's heart rate is 88 beats/min and stroke volume is 65 mL/beat. Calculate the cardiac output in L/min. Record your answer to one decimal place.", answer:5.7, why:"88 × 65 = 5,720 mL/min; 5,720 ÷ 1,000 = 5.72, which rounds to 5.7 L/min (normal 4–8)."},
 {type:"fitb", stem:"A client's cardiac output is 4.8 L/min with a heart rate of 60 beats/min. Calculate the stroke volume in mL/beat. Record your answer to the nearest whole number.", answer:80, why:"4.8 × 1,000 = 4,800 mL/min; 4,800 ÷ 60 = 80 mL/beat, within the normal 60–100."},
 {type:"sata", stem:"A client in a sustained rhythm at 170 beats/min becomes dizzy and hypotensive. Which statements explain why cardiac output may fall? Select all that apply.", options:["Diastolic filling time is shortened","Stroke volume decreases because the ventricles fill less","Cardiac output always rises when heart rate rises","Myocardial oxygen demand increases","Faster rates lengthen diastole"], answers:[0,1,3], why:"At very fast rates diastole shortens, the ventricles fill less, and SV falls enough that CO = HR × SV drops; O₂ demand also climbs. Faster rates shorten, not lengthen, diastole, and CO does not always rise with HR."},
 {stem:"A client's HR is 50 beats/min and SV is 70 mL/beat. Which interpretation is correct?", options:["CO 3.5 L/min — below normal","CO 35 L/min — above normal","CO 5 L/min — normal","CO 7 L/min — normal"], answer:0, why:"50 × 70 = 3,500 mL/min = 3.5 L/min, below the normal 4–8 L/min — here the slow rate is what drags CO down."},
 {stem:"Which value is within the normal range?", options:["Cardiac output 2.5 L/min","Stroke volume 40 mL/beat","Stroke volume 75 mL/beat","Cardiac output 10 L/min"], answer:2, why:"Normal SV is 60–100 mL/beat, so 75 is normal. Normal CO is 4–8 L/min; 2.5 and 10 fall outside it, and 40 mL/beat is a low SV."}
],
"m4math-hr-ef":[
 {type:"fitb", stem:"A 6-second rhythm strip shows 9 QRS complexes. Calculate the heart rate in beats/min. Record your answer as a whole number.", answer:90, why:"Count the QRS complexes in 6 seconds and multiply by 10: 9 × 10 = 90 beats/min."},
 {type:"fitb", stem:"An echocardiogram reports an end-diastolic volume of 140 mL with 56 mL ejected per beat. Calculate the ejection fraction. Record your answer as a whole-number percentage.", answer:40, why:"56 ÷ 140 = 0.40; × 100 = 40%. That is below 50%, consistent with HFrEF."},
 {type:"sata", stem:"Which findings are consistent with heart failure with reduced ejection fraction (HFrEF)? Select all that apply.", options:["EF 35%","Systolic heart failure","Stretched, boggy ventricular walls","EF 62%","Thick, stiff walls that can't fill"], answers:[0,1,2], why:"HFrEF is an EF below 50% — systolic failure with stretched walls that can't pump. EF 62% is normal, and thick stiff walls describe diastolic HF (HFpEF)."},
 {type:"matrix", stem:"Each 6-second strip is from a client in a sinus rhythm. Classify the rate.", rows:["4 QRS complexes","8 QRS complexes","13 QRS complexes","7 QRS complexes"], cols:["Bradycardia","Normal rate","Tachycardia"], correct:[0,1,2,1], why:"Multiply by 10: 40 (below 60, brady), 80 (normal), 130 (above 100, tachy), 70 (normal)."},
 {stem:"Which description of the 6-second method is accurate?", options:["Count the P waves and multiply by 6","Count the QRS complexes in 6 seconds and multiply by 10","Count big boxes between two R waves and multiply by 10","It can only be used for regular rhythms"], answer:1, why:"HR = QRS complexes in a 6-second strip × 10. It estimates rate for regular and irregular rhythms alike, which is why it works for A-fib."}
],
"m4math-map-cpp":[
 {type:"fitb", stem:"A client recovering from an ischemic stroke has BP 140/86. Calculate the MAP in mmHg. Record your answer to the nearest whole number.", answer:104, why:"(140 + 2 × 86) ÷ 3 = (140 + 172) ÷ 3 = 312 ÷ 3 = 104 mmHg — above 65, so organ perfusion is adequate."},
 {type:"fitb", stem:"A client with a hemorrhagic stroke has BP 102/64 and ICP 24 mmHg. Calculate the cerebral perfusion pressure (CPP) in mmHg. Record your answer to the nearest whole number.", answer:53, why:"MAP = (102 + 128) ÷ 3 = 230 ÷ 3 = 76.67. CPP = 76.67 − 24 = 52.67, which rounds to 53 — below ~60, a cerebral ischemia risk."},
 {type:"sata", stem:"Which client results require the nurse to report a perfusion concern? Select all that apply.", options:["MAP 58","CPP 55","MAP 82, CPP 70","MAP 90, ICP 36","MAP 70, ICP 8"], answers:[0,1,3], why:"MAP below 65 and CPP below ~60 are concerns; MAP 90 − ICP 36 = CPP 54, also a concern. MAP 82/CPP 70 and MAP 70 − 8 = CPP 62 are adequate."},
 {type:"ordering", stem:"Place the steps for finding CPP from a blood pressure in the correct order.", items:["Multiply the diastolic BP by 2","Add the systolic BP","Divide the sum by 3 to get MAP","Subtract the ICP from the MAP","Compare the CPP with ~60 and report if low"], why:"MAP = (SBP + 2 × DBP) ÷ 3 must be finished before subtracting ICP; then interpret the CPP against ~60."},
 {stem:"A client with a large stroke has BP 126/78 and ICP 38 mmHg. Which conclusion is correct?", options:["MAP is low, so CPP is also low","MAP and CPP are both adequate","MAP is adequate, but CPP is below ~60","MAP cannot be calculated without a heart rate"], answer:2, why:"MAP = (126 + 156) ÷ 3 = 282 ÷ 3 = 94 (adequate). CPP = 94 − 38 = 56, below ~60 — a normal-looking BP doesn't guarantee brain perfusion when ICP is high."}
],
"m4math-drips":[
 {type:"fitb", stem:"Heparin 25,000 units in 250 mL is ordered at 18 units/kg/h for a client who weighs 70 kg. At what rate (mL/h) should the pump be set? Record your answer to one decimal place.", answer:12.6, why:"Concentration 25,000 ÷ 250 = 100 units/mL. 18 × 70 = 1,260 units/h; 1,260 ÷ 100 = 12.6 mL/h."},
 {type:"fitb", stem:"Dopamine 400 mg in 250 mL is ordered at 10 mcg/kg/min for a client who weighs 75 kg. At what rate (mL/h) should the pump be set? Record your answer to the nearest tenth.", answer:28.1, why:"400 mg = 400,000 mcg ÷ 250 = 1,600 mcg/mL. 10 × 75 × 60 = 45,000 mcg/h; 45,000 ÷ 1,600 = 28.125, which rounds to 28.1 mL/h."},
 {type:"fitb", stem:"Amiodarone 900 mg in 500 mL is to infuse at 1 mg/min. At what rate (mL/h) should the pump be set? Record your answer to the nearest whole number.", answer:33, why:"900 ÷ 500 = 1.8 mg/mL. 1 mg/min × 60 = 60 mg/h; 60 ÷ 1.8 = 33.33, which rounds to 33 mL/h."},
 {type:"sata", stem:"A client with symptomatic sinus bradycardia receives atropine. The prefilled syringe contains 1 mg/10 mL. Which statements are correct? Select all that apply.", options:["The first dose is 10 mL","The dose may be repeated every 3–5 minutes","The maximum total dose is 3 mg (30 mL)","The dose is pushed slowly over 10 minutes and then flushed with 20 mL","If atropine is ineffective, pacing or a dopamine or epinephrine drip is next"], answers:[0,1,2,4], why:"1 mg ÷ 0.1 mg/mL = 10 mL, q3–5 min, max 3 mg; if ineffective, transcutaneous pacing and/or a dopamine or epinephrine drip. The rapid push with a 20 mL flush describes adenosine, not atropine."},
 {stem:"Adenosine 6 mg rapid IV push is ordered for stable SVT. The vial is 3 mg/mL. How much does the nurse draw up?", options:["0.5 mL","1 mL","3 mL","2 mL"], answer:3, why:"6 mg ÷ 3 mg/mL = 2 mL, given rapid IV push followed immediately by a 20 mL NS flush. A second dose of 12 mg would be 4 mL."}
],
"m4math-ci":[
 {type:"fitb", stem:"A client's cardiac output is 6.0 L/min and body surface area is 2.4 m². Calculate the cardiac index. Record your answer to one decimal place.", answer:2.5, why:"CI = CO ÷ BSA = 6.0 ÷ 2.4 = 2.5 L/min/m², the low end of normal (2.5–4)."},
 {type:"fitb", stem:"A client's cardiac output is 4.2 L/min and BSA is 1.75 m². Calculate the cardiac index. Record your answer to one decimal place.", answer:2.4, why:"4.2 ÷ 1.75 = 2.4 L/min/m², just below the normal 2.5–4."},
 {type:"sata", stem:"Which intracardiac pressures are within the normal ranges listed for NUR 211? Select all that apply.", options:["Right atrium 5 mmHg","Pulmonary artery systolic 20 mmHg","Left ventricle systolic 120 mmHg","Right ventricle systolic 60 mmHg","Aorta diastolic 40 mmHg"], answers:[0,1,2], why:"Normal: RA 0–8, PA systolic 15–25, LV systolic 110–130. RV systolic is 15–25 (60 is high), and aortic diastolic is 70–80 (40 is low)."},
 {stem:"Why is cardiac output divided by body surface area?", options:["To convert mL to liters","To adjust cardiac output for body size","To calculate stroke volume","To estimate ejection fraction"], answer:1, why:"Cardiac index relates CO to body size so values can be compared between small and large adults. Converting mL to L is part of the CO calculation, not CI."},
 {stem:"Which side of the heart is the high-pressure system?", options:["Right side, because it pumps to the lungs","Both sides have equal pressures","Left side, because it pumps to the whole body","Neither — pressures are set by the atria"], answer:2, why:"LV systolic 110–130 vs RV systolic 15–25: the left side pumps against systemic resistance, so it is the high-pressure side with the thickest wall."}
]
});

 {type:"dragdrop", stem:"Match each lab to the drug it monitors.", items:["PTT","INR","Platelet count","PT"], bins:["Heparin","Warfarin"], correctBin:[0,1,0,1], why:"Two t's make an H: PTT monitors heparin, and platelets are watched for HIT. PT/INR monitors warfarin (INR goal 2–3)."},

 {type:"sata", stem:"A nurse is preparing to give metoprolol. Which findings require holding the dose and notifying the provider? Select all that apply.", options:["HR 54","SBP 86","HR 72, BP 124/78","HR 58, BP 110/70","HR 66, BP 132/84"], answers:[0,1,3], why:"Hold a beta blocker for HR below 60 or SBP below 90. HR 54, SBP 86, and HR 58 all meet a hold parameter."},
 {stem:"A client with heart failure weighed 172 lb yesterday and 175 lb today. What should the nurse do?", options:["Recheck the weight next week","Report the gain to the provider","Encourage more fluids","Document it as expected"], answer:1, why:"Report a gain of 2–3 lb in a day or 5 lb in a week; 3 lb overnight suggests fluid retention."},
 {type:"cloze", stem:"Complete the sentence.", template:"For tPA in an ischemic stroke, therapy should start within {0} of onset (up to 4.5 hours for selected patients), and the BP must be below {1}.", blanks:[{options:["3 hours","12 hours","24 hours"],correct:0},{options:["140/90","160/100","185/110"],correct:2}], why:"tPA is given within 3 hours (expanded to 4.5 hours for selected patients) after CT rules out bleeding, with BP below 185/110."},

"blocks": [
{
"h": "<span style=\"font-size:1.05em\">Part 3 · EKG Basics &amp; Rhythm Interpretation</span>"
},
{
"p": "The EKG records the heart's electrical activity. <b>Assess the patient first</b> — if the patient is symptomatic, treat; if not, do not treat. The goal is always optimizing cardiac output. This part identifies the rhythm; Part 4 treats it."
},
{
"h": "3.1 Strip Basics"
},
{
"table": {
"head": [
"Item",
"What to know"
],
"rows": [
[

"0.20 seconds"
],
[
"<b>Little box</b>",
"0.04 seconds"
],
[
"<b>Strip length</b>",
"6 seconds"
],
[
"<b>Heart rate</b>",
"Count the QRS complexes on the 6-second strip × 10"
],
[
"<b>Electrodes</b>",
"Change stickers every 24 hours to reduce artifact"
],
[
"<b>Artifact</b>",
"False readings — if you cannot read the strip, <b>assess the patient</b>"
],
[
"<b>12-lead EKG</b>",
"10 stickers (each arm and leg + 6 on the chest), 12 views at once — shows where perfusion is lacking"
]
]
}
},
{

},
{
"table": {
"head": [
"Structure",
"Rate",
"Job"

"60–100",

],
[

"40–60",
"Takes over if the SA node fails"
],
[

"—",

],
[

"Last backup pacemaker"
]
]
}
},

},

"Wave",
"What it means",
"Normal"
],

"SA node fired — atrial depolarization",

],
[

"Start of P to the Q",
"Fits in a big box"
],

"Narrow, fits in a big box; can point up or down"

]
]
}
},
{
"h": "3.4 The 5 Questions"
},
{
"list": [
"<b>Step 1 — HR:</b> count QRS × 10",
"<b>Step 2 — Regular?</b> Same gap between each QRS",
"<b>Step 3 — P wave</b> for every QRS?",
"<b>Step 4 — QRS</b> within a big box?",
"<b>Step 5 — PR interval</b> within a big box?"
]
},
{
"hook": "<b>All yes + HR 60–100 = normal sinus rhythm</b><br>Any NO means do not call it sinus. <b>Atrial = problem with the P wave. Ventricular = problem with the QRS.</b>"
},
{

"P wave",
"Key clue"

"Yes",
"Yes",
"Breaks no rules"

[

"Yes",

"Yes",

{

},
{
"hook": "<b>Scope for 114: recognize these on a strip</b><br>Treatment of ventricular rhythms is taught in <b>Medical Emergencies</b>. For this exam, know what each looks like and that V-tach, Torsades, and V-fib are <b>lethal</b>."

],

"<b>LETHAL</b>"
],
[

],

]
]
}
},
{
"h": "3.7 Heart Blocks — Basic Understanding"
},
{
"list": [
"A heart block <b>breaks the PR interval rule</b> — typically more P waves than QRS complexes",
"<b>Heart blocks only cause bradycardia, never tachycardia</b>",
"Not always dangerous — <b>look at the heart rate</b>. A block with HR 25 is an emergency",
"<b>114 does not differentiate the types</b> (1st, 2nd, 3rd degree) — know what a block is, how to spot it, and that it causes bradycardia"
]
},
{

{
"h": "<span style=\"font-size:1.05em\">Part 4 · Treating Dysrhythmias</span>"
},
{
"p": "Same four ideas every time: the <b>goal</b> is optimizing cardiac output, the <b>priority</b> is assessment (symptomatic or not), <b>prevention</b> means looking for the cause, and <b>maintenance</b> asks whether long-term therapy is needed. Most rhythm problems are fixed by treating the cause, not by reaching for a cardiac drug."
},
{
"h": "4.1 Bradycardia (Slow)"
},
{
"table": {
"head": [
"Cause",
"Fix the cause first"
],
"rows": [
[
"<b>Opioids/fentanyl/overdose</b>",
"Naloxone (Narcan)"
],
[
"<b>Hypothermia</b>",
"Warm the patient"
],
[
"<b>Sleep apnea</b>",
"Tell them to breathe"
],
[
"<b>Just climbed stairs</b>",
"Let them rest and breathe"
],
[
"<b>Cardiac meds (CCB, beta blockers, digoxin), anesthesia, SA node failure, ischemia, hypoxia, hyperkalemia</b>",
"Treat the cause; support ABCs"
]
]
}
},
{
"list": [
"<b>Atropine is first line</b> — IV push, stimulates the SA node, very fast onset, short half-life. Patient on telemetry (HR, rhythm, O₂, BP). A band aid; can be given up to 3 times",
"Atropine not working → <b>transcutaneous pacing</b> and/or <b>dopamine or epinephrine drip</b> (quick on and off)",
"<b>Pacemaker = bradycardia only.</b> Temporary (pads on the chest, or invasive) vs. permanent (implanted)",
"<b>Never give atropine for A-fib</b>"
]
},
{
"h": "4.2 Tachycardia (Fast)"
},
{
"table": {
"head": [
"Cause",
"Fix the cause first"
],
"rows": [
[
"<b>Exercise</b>",
"Sit down and rest"
],
[
"<b>Dehydration</b>",
"Fluids"
],
[
"<b>Fever</b>",
"Tylenol"
],
[
"<b>Anxiety, fear, anger</b>",
"Calm the patient"
],
[
"<b>Pain</b>",
"Pain medication"
],
[
"<b>Caffeine, cocaine/meth, allergic reaction, infection, blood loss, anemia, FVO, HF, CAD, respiratory disease</b>",
"Treat the cause"
]
]
}
},
{
"list": [
"<b>Adenosine is first line</b> for regular tachy rhythms like SVT — it \"reboots\" the heart, stopping it 6–10 seconds. Half-life ~10 seconds, so <b>SLAM it</b> in a big IV; a slow push can fail. Up to 3 times",
"<b>Antiarrhythmics</b> (amiodarone, lidocaine) = drips · <b>Beta blockers</b> = push or drip · <b>Calcium channel blockers</b> = IV push — select-all-that-apply topic",
"<b>SVT</b> — also have the patient bear down (Valsalva)",
"<b>Electric options</b> — synchronized cardioversion and defibrillation"
]
},
{
"h": "4.3 Treatment by Rhythm — the Ones You Treat in 114"
},

"table": {

"Rhythm",
"Treatment"
],
"rows": [

"None — normal. Keep assessing"
],
[
"<b>Sinus bradycardia</b>",
"Assess; asymptomatic → no treatment. Symptomatic → <b>treat the cause</b>, then <b>atropine</b>, then pacing and/or <b>dopamine or epinephrine drip</b>"
],
[
"<b>Sinus tachycardia</b>",
"<b>Treat the cause</b> — rest, fluids, Tylenol for fever, pain meds, calm anxiety"
],
[

],
[
"<b>A-fib</b>",
"<b>Rate control</b> (beta blocker or CCB), <b>antiarrhythmic</b> (amiodarone), <b>anticoagulant every day</b>. Cardioversion only after TEE shows no clot or 2+ weeks anticoagulated. Never atropine"
],
[

"<b>Same as A-fib</b>"
]
]
}
},
