    "A <strong>problem with the PR interval</strong> — the impulse is delayed or blocked at the AV node",
    "PR may be <strong>long</strong> (more than one big box, 0.20 s) or <strong>QRS complexes are dropped</strong>",
    "Key clue: <strong>more P waves than QRS complexes</strong>",
    "Fewer ventricular beats → <strong>bradycardia and ↓ cardiac output</strong> (dizziness, syncope, hypotension, confusion)",
    "<strong>Avoid beta blockers and calcium channel blockers</strong> — they slow AV conduction further; in general give these drugs slowly, because they can cause a block",
    "Symptomatic → treat like bradycardia (atropine, pacing); may need a <strong>permanent pacemaker</strong>"]},
   {hook:"<strong>More P's than QRS's = block.</strong> The atria are talking, but the message isn't getting through to the ventricles."},
   {h:"Agonal rhythm"},
   {img:STRIPS.agonal, caption:"Agonal rhythm — very slow (about 30), wide, shapeless complexes with no P waves; the heart is dying."},
   {list:[
    "A <strong>dying heart</strong>: very slow, wide, irregular complexes from the ventricles; little or no cardiac output",
    "Often seen at the end of life in patients with a <strong>DNR</strong>/comfort-care order — support the patient and family",
    "Full-code patient → check for a pulse and respond as a lethal rhythm (CPR, epinephrine)"]}
  ],
  check:{stem:"A client's strip shows a sharp vertical spike directly before each wide QRS complex, with no P waves seen. How should the nurse interpret this?", options:["Atrial paced rhythm","Ventricular paced rhythm","Dual-chamber paced rhythm","Pacemaker malfunction"], answer:1, why:"A spike followed by a wide QRS with no P wave = ventricular pacing. Atrial pacing has a spike before the P; dual pacing has two spikes; a spike with nothing after it would suggest malfunction."}
},

// ---------- 6. TREATMENT ----------
{ id:"m4-rhythm-tx", title:"Treating Dysrhythmias", kicker:"Assess first, cause second, meds and electricity after",
  blocks:[
   {h:"The approach"},
   {list:[
    "<strong>Goal:</strong> optimize <strong>cardiac output</strong>.",
    "<strong>Priority: assess, assess, assess.</strong> Symptomatic of ↓ CO → treat. Not symptomatic → monitor (some people live with an out-of-range baseline, such as chronic A-fib).",
    "<strong>Look for the cause first</strong> (hypoxia, electrolytes, pain, fever, bleeding, drugs, thyroid) and treat it; <strong>meds are second</strong>.",
    "<strong>Maintenance:</strong> is long-term therapy needed? (for example, rate control and anticoagulation for A-fib)."]},
   {hook:"Treat the <strong>patient</strong>, not the monitor. A number on the screen alone is never the reason to act."},
   {h:"Bradycardia pathway (HR typically below 50 and symptomatic)"},
   {list:[
    "<strong>1.</strong> Assess; identify and treat the cause; O₂ if hypoxemic; cardiac monitor, IV access, 12-lead ECG",
    "<strong>2. Atropine 1 mg IV push</strong>, repeat every 3–5 minutes, <strong>max 3 mg</strong>",
    "<strong>3.</strong> If atropine doesn't work: <strong>transcutaneous pacing</strong> and/or <strong>dopamine drip 5–20 mcg/kg/min</strong> or <strong>epinephrine drip 2–10 mcg/min</strong>",
    "<strong>4.</strong> Expert consult; <strong>transvenous pacing</strong>; permanent pacemaker if needed"]},
   {h:"Tachycardia pathway (HR typically 150 or more)"},
   {list:[
    "<strong>1.</strong> Assess; treat the cause; O₂ if needed; monitor, IV, 12-lead ECG",
    "<strong>2. Unstable</strong> (hypotension, altered mental status, chest pain, acute HF, shock) → <strong>synchronized cardioversion</strong>",
    "<strong>3. Stable, narrow, regular</strong> (SVT) → <strong>vagal maneuver</strong> (bear down)",
    "<strong>4. Adenosine 6 mg rapid IV push + 20 mL NS flush</strong>; if no conversion, <strong>12 mg</strong>",
    "<strong>5.</strong> Beta blocker or CCB (diltiazem) for rate control; antiarrhythmic (<strong>amiodarone</strong>; <strong>lidocaine</strong> for ventricular rhythms only) as ordered; expert consult"]},
   {h:"Electrical options"},
   {p:"Match the electricity to the problem: <strong>brady → pacing</strong>, <strong>tachy with a pulse → synchronized cardioversion</strong>, <strong>lethal → defibrillation</strong>."},
   {table:{head:["Feature","Pacing","Synchronized cardioversion","Defibrillation"],rows:[
    ["Used for","Symptomatic <strong>bradycardia</strong> / heart block","<strong>Tachydysrhythmias WITH a pulse</strong> (unstable SVT, A-fib, A-flutter, VT with a pulse)","<strong>V-fib, pulseless VT</strong> — no cardiac output"],
    ["Synced?","—","<strong>Yes</strong> — SYNC button times the shock to the R wave (avoids the T wave)","<strong>No</strong> — unsynchronized"],
    ["Patient awake?","Usually; sedate/medicate for pain with transcutaneous","Usually awake → <strong>sedated</strong>","<strong>Unconscious</strong>, pulseless"],
    ["Consent?","Yes when time allows","<strong>Yes</strong> — elective or urgent","No — emergency"],
    ["Energy","Low (set rate and output)","<strong>Lower</strong>","<strong>Higher</strong>"]]}},
   {h:"Synchronized cardioversion — nursing care"},
   {list:[
    "Informed <strong>consent</strong> (unless emergent); NPO if elective",
    "<strong>A-fib/flutter:</strong> confirm anticoagulation status; <strong>TEE</strong> to rule out a clot, especially if A-fib has lasted longer than 48 hours",
    "IV access, O₂ and suction ready, crash cart at the bedside; <strong>conscious sedation</strong>/analgesia",
    "Pads in place; press <strong>SYNC</strong> and confirm the marker on each R wave (re-press SYNC if another shock is needed)",
    "<strong>“I'm clear, you're clear, everyone's clear”</strong> — no one touching the patient or bed; O₂ away from the chest",
    "After: monitor rhythm, vitals, airway/LOC until sedation wears off, skin under the pads (burns); continue anticoagulation as ordered"]},
   {h:"Defibrillation basics"},
   {list:[
    "Emergency for pulseless VT/V-fib — no consent, no sync",
    "Minimize interruptions in CPR; resume compressions immediately after the shock",
    "<strong>Stand clear</strong> and call it out loud; <strong>move O₂ away</strong> from the chest (fire risk)",
    "Pads placed correctly, not over a permanent pacemaker or medication patch (remove patches)"]},
   {h:"Beware the look-alike “A” drugs"},
   {table:{head:["Drug","Used for","Key nursing points"],rows:[
    ["<strong>Atropine</strong>","<strong>Bradycardia</strong> (symptomatic)","1 mg IV push q3–5 min, max 3 mg; blocks vagal slowing; short-acting"],
    ["<strong>Adenosine</strong>","<strong>SVT</strong> (stable, narrow, regular)","6 mg <strong>rapid</strong> IV push + 20 mL flush, then 12 mg; brief asystole expected; AC/central line; crash cart nearby"],
    ["<strong>Amiodarone</strong>","<strong>Antiarrhythmic</strong> — A-fib rhythm control, ventricular rhythms","IV drip then PO; watch for bradycardia/hypotension, QT prolongation; long-term: lung, liver, thyroid toxicity, photosensitivity"]]}},
   {hook:"<strong>Atropine = A-brady-up. Adenosine = A-reboot. Amiodarone = A-antiarrhythmic.</strong> Read the label twice — giving the wrong “A” drug can be deadly."},
   {h:"Lethal rhythm response"},
   {list:[
    "<strong>Check the pulse</strong> (and the patient)",
    "<strong>Start CPR</strong> and call the code",
    "<strong>To shock or not to shock:</strong> V-fib/pulseless VT → defibrillate; asystole → no shock",
    "<strong>When in doubt, give epinephrine</strong>; torsades → magnesium",
    "Full code management is covered in Medical Emergencies"]}
  ],
  check:{stem:"A client with a heart rate of 170 is pale, confused, and has a BP of 72/40. The monitor shows a regular, narrow-complex tachycardia. Which intervention should the nurse prepare for?", options:["Defibrillation","Adenosine 6 mg slow IV push over 2 minutes","Atropine 1 mg IV push","Synchronized cardioversion"], answer:3, why:"An unstable tachydysrhythmia WITH a pulse (hypotension, confusion) is treated with synchronized cardioversion. Defibrillation is for pulseless rhythms; adenosine is for stable SVT and is given rapidly, not slowly; atropine would speed the heart further."}
}
]};

// ===================== CORONARY ARTERY DISEASE =====================
const CAD_UNIT = { title:"Coronary Artery Disease", group:"cardiac", sub:"Narrowed coronary arteries: atherosclerosis, risk factors, angina and chest pain priorities, the Mr. Bob case flow, and the teaching that keeps the patient out of the ED.", lessons:[

{ id:"m4-cad", title:"CAD &amp; Atherosclerosis", kicker:"Plaque, narrowing, and the road from ischemia to infarction",
  blocks:[
   {h:"What CAD is"},
   {p:"<strong>Coronary artery disease (CAD) is narrowing of the coronary arteries</strong>, most often from <strong>atherosclerosis</strong>. The coronary arteries feed the heart muscle itself, so when they narrow, the myocardium does not get the oxygen it needs. CAD is a \"narrowing\" problem — like hypertension and nephrosclerosis — and its treatment centers on diet, exercise, and medications that keep the vessels open."},
   {h:"How the plaque forms"},
   {list:[
    "<strong>Endothelial injury</strong> (high BP, smoking, high blood sugar, high LDL) lets LDL cholesterol move into the artery wall.",
    "Inflammatory cells swallow the LDL; smooth muscle cells grow a <strong>fibrous cap</strong> over a fatty core → an <strong>atheroma (plaque)</strong> that bulges into the lumen and narrows it.",
    "<strong>Stable plaque</strong> has a thick cap. <strong>Vulnerable (unstable) plaque</strong> has a thin cap and active inflammation — it can <strong>rupture</strong>.",
    "A ruptured plaque attracts platelets → <strong>thrombus</strong> → sudden blockage = acute coronary syndrome (unstable angina or MI).",
    "Plaques like to form where arteries <strong>branch</strong> (turbulent flow). Coronary <strong>vasospasm</strong> or profound hypotension can also cut off flow."]},
   {h:"Ischemia → injury → infarction"},
   {table:{head:["Stage","What is happening","Reversible?"],rows:[
    ["<strong>Ischemia</strong>","O₂ supply does not meet O₂ demand; cells switch to anaerobic metabolism → chest pain (angina)","Yes — restore flow or lower demand and the cells recover"],
    ["<strong>Injury</strong>","Ischemia is prolonged or severe; cells are damaged but not yet dead","Still salvageable if flow returns quickly"],
    ["<strong>Infarction</strong>","Cells die (necrosis) and are replaced by scar tissue that does not contract","No — dead muscle is permanent; troponin is released"]]}},
   {hook:"Think <strong>\"supply vs. demand.\"</strong> Every CAD intervention either <strong>increases supply</strong> (open the vessel: nitroglycerin, stents, antiplatelets) or <strong>decreases demand</strong> (rest, beta blockers, treat pain and anxiety)."},
   {h:"Risk factors"},
   {table:{head:["Nonmodifiable (can't change)","Modifiable (can change)"],rows:[
    ["<strong>Age</strong> (men above 45, women above 55)","<strong>Hyperlipidemia</strong> (high LDL, low HDL)"],
    ["<strong>Sex/gender</strong> (men develop CAD earlier; women's risk rises after menopause)","<strong>Tobacco use</strong> (including secondhand smoke)"],
    ["<strong>Family history / genetics</strong> (first-degree relative with early CVD; inherited high LDL)","<strong>Hypertension</strong>"],
    ["<strong>Race/ethnicity</strong> (higher incidence in African Americans)","<strong>Diabetes</strong> and <strong>metabolic syndrome</strong>"],
    ["History of premature menopause or pregnancy disorders such as preeclampsia","<strong>Obesity</strong>, <strong>physical inactivity</strong>, poor diet, <strong>stress</strong>"],
    ["—","Chronic inflammatory conditions (RA, lupus, HIV) and chronic kidney disease"]]}},
   {p:"The <strong>more risk factors</strong> a person has, the greater the chance of CAD. Diabetes, peripheral arterial disease, carotid artery disease, and abdominal aortic aneurysm are <strong>CAD risk equivalents</strong> — these patients carry the same risk for a cardiac event as someone who already has CAD."},
   {h:"Metabolic syndrome"},
   {p:"A cluster that sharply raises cardiovascular risk. It is diagnosed when <strong>3 of these 5</strong> are present:"},
   {list:[
    "<strong>Large waist</strong> (abdominal obesity)",
    "<strong>High triglycerides</strong> (or on treatment for them)",
    "<strong>Low HDL</strong> (or on treatment)",
    "<strong>High blood pressure</strong> (130/80 or higher, or on treatment)",
    "<strong>High fasting glucose</strong> (100 mg/dL or higher, or on treatment)"]},
   {hook:"Metabolic syndrome = the <strong>\"big belly + bad numbers\"</strong> picture: waist, triglycerides, HDL, BP, glucose. Many people with type 2 diabetes fit it."},
   {h:"Complications of CAD"},
   {list:[
    "<strong>Myocardial infarction (MI)</strong> — a clot completely blocks a narrowed artery.",
    "<strong>Heart failure</strong> — scarred or chronically ischemic muscle can't pump well.",
    "<strong>Dysrhythmias</strong> — ischemic muscle is electrically irritable (PVCs, V-tach, V-fib); sudden cardiac death is possible."]},
   {p:"A stroke is <strong>not</strong> a complication of CAD — it is a complication of clots or narrowing in the vessels of the brain."},
   {h:"Diagnostics"},
   {table:{head:["Test","What it shows / nursing point"],rows:[
    ["<strong>12-lead ECG</strong>","Looks at the whole heart at once for ischemia or injury; obtain within 10 minutes of chest pain. A normal ECG does not rule out CAD."],
    ["<strong>Troponin</strong> (with CK-MB)","Gold standard for heart muscle damage; normally ~0. Rises late, so it is drawn on arrival and repeated."],
    ["<strong>Lipid panel</strong>","Total cholesterol below 200; LDL below 100 with CAD (below 130 otherwise); HDL above 40–60 is protective; triglycerides below 150."],
    ["<strong>Stress test</strong>","Treadmill, or medication-based (dipyridamole, adenosine, dobutamine) if the patient can't walk. NPO, hold beta blockers as ordered. <strong>Stop</strong> for chest pain, dysrhythmia, SOB, pallor, diaphoresis, BP too high/low, or O₂ sat below 90%."],
    ["<strong>Echocardiogram</strong>","Ultrasound of wall motion, valves, wall thickness, and ejection fraction."],
    ["<strong>Coronary angiogram / cardiac cath</strong>","Dye shows exactly where the arteries are blocked and how well the heart is perfused; stents can be placed. Check contrast allergy and kidney function first."]]}},
   {h:"Prevention &amp; lifestyle"},
   {list:[
    "<strong>Heart-healthy diet</strong> — low saturated fat and cholesterol (DASH, AHA, or Mediterranean style): fruits, vegetables, whole grains, beans, nuts, fish; limit red meat, sweets, sugary drinks, and sodium. Read labels for saturated fat, trans fat, cholesterol, and fiber.",
    "<strong>Exercise</strong> — about 150 minutes a week of moderate activity plus strengthening 2 days a week. Start small; exercise at a pace where you can still talk. Stop for chest pain, unusual SOB, dizziness, or nausea.",
    "<strong>Smoking cessation</strong> — nicotine raises HR and BP, constricts coronary arteries, and carbon monoxide steals O₂ from hemoglobin. Risk drops within the first year of quitting.",
    "<strong>Control BP</strong> (goal below 130/80), <strong>diabetes</strong>, and <strong>lipids</strong>.",
    "<strong>Statins</strong> lower LDL when diet alone isn't enough — teach to report muscle pain or dark urine (rhabdomyolysis).",
    "Weight loss if needed and stress reduction."]},
   {hook:"HDL = <strong>H</strong>appy/<strong>H</strong>ealthy (higher is better). LDL = <strong>L</strong>ousy (lower is better)."}
  ],
  check:{stem:"A client asks which of their risk factors for coronary artery disease they can change. Which factor should the nurse identify as modifiable?", options:["Age of 62 years","Father had an MI at age 50","Cigarette smoking","Male sex"], answer:2, why:"Tobacco use is a modifiable risk factor — quitting lowers risk within the first year. Age, family history, and sex are nonmodifiable."}
},

{ id:"m4-angina", title:"Angina &amp; Chest Pain", kicker:"Stable vs. unstable, NTG rules, MONA, and the Mr. Bob case",
  blocks:[
   {h:"What angina is"},
   {p:"<strong>Angina pectoris is chest pain caused by myocardial ischemia</strong> — the heart's O₂ demand is higher than what the narrowed coronary arteries can supply. When demand rises, a blocked artery can't increase its flow, so ischemia results. Patients describe it as pressure, tightness, squeezing, heaviness, choking, or a viselike feeling rather than sharp pain — usually <strong>behind the sternum</strong>, poorly localized, and often spreading to the neck, jaw, shoulders, or inner arms (usually the left)."},
   {h:"What triggers it"},
   {table:{head:["Trigger","Why it causes ischemia"],rows:[
    ["<strong>Physical exertion</strong>","Raises myocardial O₂ demand"],
    ["<strong>Cold exposure</strong>","Vasoconstriction and ↑ BP → ↑ O₂ demand"],
    ["<strong>Heavy meal</strong>","Blood shifts to the gut for digestion, leaving less for the heart muscle"],
    ["<strong>Stress or strong emotion</strong>","Catecholamines ↑ BP, HR, and the heart's workload"]]}},
   {p:"Pain may come with <strong>apprehension or a feeling of impending death</strong>, weakness or numbness in the arms, wrists, and hands, SOB, pallor, diaphoresis, dizziness, and nausea or vomiting. The hallmark of angina: it <strong>subsides with rest or nitroglycerin</strong>. Unstable angina is not closely tied to these triggers."},
   {h:"Types of angina"},
   {table:{head:["Type","Pattern","Relieved by","What it means"],rows:[
    ["<strong>Stable</strong>","<strong>Predictable and consistent</strong> — with exertion, emotional stress, cold, or a heavy meal; short","<strong>Rest + NTG</strong>","Fixed plaque; manage with meds and risk-factor control"],
    ["<strong>Unstable</strong> (preinfarction, crescendo)","At <strong>rest</strong>, new, or <strong>increasing in frequency and severity</strong>","<strong>Not</strong> reliably relieved by rest/NTG","<strong>Emergency</strong> — needs medical intervention; part of acute coronary syndrome; can progress to MI"],
    ["<strong>Intractable (refractory)</strong>","Severe, <strong>incapacitating</strong> chest pain","Hard to control","Disabling despite treatment"],
    ["<strong>Variant (Prinzmetal)</strong>","Pain <strong>at rest</strong> with <strong>reversible ST elevation</strong>; not tied to exertion","Treated with <strong>calcium channel blockers</strong> (and nitrates)","Coronary artery <strong>spasm</strong>"],
    ["<strong>Silent ischemia</strong>","<strong>No pain</strong>, but objective evidence of ischemia (e.g., ECG changes on a stress test)","—","Easy to miss — think of it in older adults and diabetics"]]}},
   {hook:"<strong>Stable = predictable.</strong> Unstable = <strong>un</strong>predictable, at rest, or <strong>un</strong>relieved → treat it like an MI until proven otherwise."},
   {h:"Assessing chest pain — PQRST"},
   {table:{head:["Letter","Ask","Typical angina answer"],rows:[
    ["<strong>P</strong> — Provokes / Palliates","What brings it on? What makes it better?","Exertion, stress, cold, big meal; better with rest or NTG"],
    ["<strong>Q</strong> — Quality","What does it feel like?","Pressure, tightness, squeezing, heaviness"],
    ["<strong>R</strong> — Region / Radiation","Where is it? Does it spread?","Substernal or left chest; may spread to the left arm, jaw, neck, back, or epigastric area"],
    ["<strong>S</strong> — Severity / Symptoms","Rate it 0–10. Anything else with it?","SOB, nausea, diaphoresis, palpitations, lightheadedness"],
    ["<strong>T</strong> — Timing","When did it start? How long does it last?","Angina usually lasts <strong>5–15 minutes</strong>; pain lasting <strong>more than 15 minutes</strong> suggests ACS (unstable angina or MI)"]]}},
   {h:"Questions to ask during an episode"},
   {list:[
    "\"Where is the pain? Can you point to it?\" and \"Can you feel it anywhere else?\"",
    "\"How would you describe the pain?\"",
    "<strong>\"Is it like the pain you had before?\"</strong> — a change may mean the disease is worsening or there is a different cause.",
    "\"Can you rate it from 0 to 10?\"",
    "\"When did it begin?\" and \"How long does it last?\"",
    "\"What brings it on?\" and \"What helps it go away?\"",
    "\"Do you have any other symptoms with the pain?\""]},
   {h:"Atypical presentations"},
   {p:"Not everyone has classic crushing chest pain. Ischemia may show up as:"},
   {list:[
    "<strong>Women</strong> — indigestion, nausea, palpitations, numbness, fatigue, SOB; they tend to wait longer to seek care.",
    "<strong>Older adults</strong> — pain transmission is diminished with aging, so <strong>dyspnea is often the presenting symptom</strong>; confusion, weakness, or fainting may replace chest pain, and some have <strong>no symptoms at all (silent CAD)</strong>. Teach them to treat chest pain–like symptoms such as weakness as a signal to <strong>rest or take their prescribed medication</strong>. Angina meds are given cautiously (more adverse reactions).",
    "<strong>Diabetics</strong> — nerve damage (autonomic neuropathy) dulls pain perception; SOB or fatigue may be the only clue.",
    "Anyone — SOB, indigestion or a choking feeling, weakness, numbness or tingling in the upper extremities, a fluttering heartbeat. <strong>Lower abdominal pain is not</strong> a typical angina symptom."]},
   {h:"Angina vs. ACS"},
   {table:{head:["Feature","Stable angina (ischemia)","ACS (unstable angina or MI)"],rows:[
    ["Duration","Usually <strong>5–15 minutes</strong>","<strong>More than 15 minutes</strong>"],
    ["Brought on by","Exertion, emotional upset, a large meal, temperature extremes","Can occur <strong>at rest or during sleep</strong>"],
    ["Relief","Rest, NTG, oxygen","<strong>Not</strong> relieved by rest or 3 NTG"],
    ["Muscle damage","None — reversible","MI: permanent, <strong>troponin rises</strong> (unstable angina: troponin stays normal)"],
    ["Other S/S","May be mild","Often diaphoresis, nausea, SOB, palpitations, unusual fatigue, sense of doom"]]}},
   {h:"Treating an angina episode"},
   {table:{head:["Step","Nursing action","Why"],rows:[
    ["1","<strong>Stop all activity</strong>; sit or rest in bed in <strong>semi-Fowler's</strong>","Lowers the O₂ needs of the ischemic heart muscle"],
    ["2","<strong>Assess the angina</strong> — is it the same as the patient's usual pain?","A change may mean worsening disease or a different cause"],
    ["3","<strong>Vital signs</strong>; watch for respiratory distress","Baseline before NTG"],
    ["4","<strong>12-lead ECG</strong> (in the hospital)","Looks for ST-segment and T-wave changes"],
    ["5","<strong>NTG SL</strong> — repeat every 5 minutes if pain is unchanged or still present, <strong>up to 3 doses</strong>; check <strong>BP and HR each time</strong>","Relieves ischemia; watch for hypotension"],
    ["6","<strong>Oxygen</strong>, usually <strong>2 L/min by nasal cannula</strong>, especially if RR is up or SpO₂ is down","Supports O₂ supply"],
    ["7","Pain significant and continuing → evaluate for <strong>MI</strong>; may move to a higher level of care","Unrelieved pain = possible ACS"]]}},
   {h:"Nitroglycerin (NTG) basics"},
   {list:[
    "<strong>Sit down</strong> and stop the activity, then place <strong>1 tablet under the tongue</strong> (or in the cheek pouch) or use 1 spray; relief ideally comes within about 3 minutes.",
    "Repeat <strong>every 5 minutes</strong> as needed — <strong>maximum 3 doses</strong>.",
    "<strong>Pain not relieved after 3 doses (15 minutes) → call 911.</strong>",
    "Expected: <strong>throbbing headache</strong>, flushing, dizziness, and <strong>reflex tachycardia</strong>. The danger is <strong>hypotension</strong> — that's why the patient sits first.",
    "<strong>Never</strong> take with PDE5 inhibitors (sildenafil, tadalafil) — severe hypotension.",
    "<strong>Carry it at all times</strong> in the original capped dark glass bottle, and take it <strong>before</strong> an activity known to cause angina."]},
   {hook:"NTG <strong>\"1-5-3\"</strong>: <strong>1</strong> tab, every <strong>5</strong> minutes, max <strong>3</strong> — then 911. And always <strong>sit</strong> before you take it."},
   {h:"If the pain isn't relieved: acute chest pain priorities"},
   {list:[
    "<strong>Assess first</strong> — PQRST, vital signs, SpO₂; have the patient sit or rest to lower O₂ demand.",
    "<strong>12-lead ECG within 10 minutes</strong> of arrival or of the complaint.",
    "<strong>MONA</strong> (not a priority order): <strong>M</strong>orphine 2–4 mg IV push for pain unrelieved by NTG, <strong>O</strong>xygen (often 2 L/min by nasal cannula; needed if SpO₂ is low or breathing is labored), <strong>N</strong>itroglycerin, <strong>A</strong>spirin 325 mg <strong>chewed</strong> (faster antiplatelet effect).",
    "<strong>2 large-bore IVs.</strong>",
    "<strong>Troponin</strong> is the priority lab (CK-MB, BMP, CBC also drawn) — on arrival and repeated about every 6 hours, because it rises late.",
    "<strong>Continuous cardiac monitoring</strong> — ischemic muscle is prone to lethal dysrhythmias."]},
   {h:"The CAD case: Mr. Bob"},
   {p:"A 40-year-old man reports chest pain, SOB, and a fluttering heartbeat. Follow the flow:"},
   {table:{head:["Step","What happens","Why"],rows:[
    ["1","<strong>Full assessment</strong>","Always assess before acting"],
    ["2","<strong>12-lead ECG</strong>","Evaluates the fluttering heartbeat and looks for ischemia"],
    ["3","Diagnosed with angina → <strong>NTG SL</strong>","Vasodilator, first line for chest pain"],
    ["4","Relieved by 2 NTG → <strong>stable angina</strong>","Rest + NTG relief = stable"],
    ["5","Home with NTG","Teach: <strong>always keep it with you</strong>"],
    ["6","Later: pain <strong>unrelieved after 3 NTG</strong> → calls 911","Another NTG is NOT the answer now"],
    ["7","ED: <strong>MONA</strong>, <strong>2 large-bore IVs</strong>, <strong>troponin</strong>","Treat pain/ischemia, prepare for meds, detect damage"],
    ["8","ECG and troponin normal → <strong>unstable angina</strong> → <strong>coronary angiogram/cardiac cath</strong>","Shows where perfusion is blocked"],
    ["9","<strong>Heparin drip</strong>","Prevents new clots and clot extension (does not dissolve clots)"],
    ["10","<strong>Clopidogrel</strong>","Prevents platelet aggregation"],
    ["11","<strong>Metoprolol</strong>","Every chest-pain patient gets a beta blocker: ↓ O₂ demand, ↓ risk of lethal tachydysrhythmias"]]}},
   {p:"If a thrombolytic is ordered, the nurse first <strong>reviews the chart and interviews the client for contraindications</strong> (bleeding risk). If the patient suddenly becomes unstable with a fast rhythm (for example HR 140, BP 70/20), anticipate <strong>synchronized cardioversion</strong>."},
   {h:"Mr. Bob's discharge meds"},
   {table:{head:["Medication","Reason"],rows:[
    ["<strong>Aspirin</strong>","Antiplatelet — prevents clots on plaque/stent"],
    ["<strong>Clopidogrel</strong>","Antiplatelet — prevents platelet aggregation"],
    ["<strong>Carvedilol</strong> (beta blocker)","↓ HR and O₂ demand; protects against dysrhythmias"],
    ["<strong>Lisinopril</strong> (ACE inhibitor)","<strong>Prevents ventricular remodeling</strong> (scar-driven reshaping of the heart)"],
    ["<strong>Statin</strong> (lovastatin)","Lowers LDL and stabilizes plaque"]]}},
   {hook:"Discharge after CAD = <strong>\"A-C-B-A-S\"</strong>: <strong>A</strong>spirin, <strong>C</strong>lopidogrel, <strong>B</strong>eta blocker, <strong>A</strong>CE inhibitor, <strong>S</strong>tatin."}
  ],
  check:{stem:"A client with a nitroglycerin prescription for stable angina has taken 3 sublingual tablets 5 minutes apart, and the chest pain is unchanged. What should the client do next?", options:["Take a fourth tablet","Lie down and rest for 30 minutes","Call 911","Take an extra dose of the scheduled beta blocker"], answer:2, why:"Pain not relieved by 3 NTG doses over 15 minutes may be unstable angina or MI — call 911. Never exceed 3 doses; rest alone or extra beta blocker delays emergency care."}
},

{ id:"m4-cad-care", title:"CAD Nursing Care &amp; Teaching", kicker:"Lower O₂ demand, ease anxiety, and teach for home",
  blocks:[
   {h:"Assessment"},
   {p:"Gather information about the patient's symptoms and the <strong>activities that come before and bring on</strong> angina attacks (where, what it feels like, is it the same as before, severity, onset, duration, triggers, what relieves it, other symptoms). Also assess <strong>CAD risk factors</strong>, how the patient responds to angina, how well the patient and family <strong>understand the diagnosis</strong>, and <strong>adherence</strong> to the current treatment plan. These answers shape the treatment and prevention plan."},
   {h:"Nursing diagnoses &amp; potential complications"},
   {table:{head:["Nursing diagnoses","Potential complications"],rows:[
    ["<strong>Risk for impaired cardiac function</strong>","ACS and MI"],
    ["<strong>Anxiety</strong> related to cardiac symptoms and possible death","Dysrhythmias and cardiac arrest"],
    ["<strong>Lack of knowledge</strong> about the underlying disease","Heart failure"],
    ["Able to perform self-care","Cardiogenic shock"]]}},
   {h:"Goals for the patient with angina"},
   {list:[
    "<strong>Immediate and appropriate treatment when angina occurs.</strong>",
    "<strong>Prevention of angina.</strong>",
    "Reduced anxiety.",
    "Awareness of the disease process and understanding of the prescribed care.",
    "Adherence to the self-care program.",
    "Absence of complications."]},
   {h:"During an angina episode"},
   {list:[
    "Act right away — for chest pain <strong>or warning symptoms</strong> (indigestion or nausea, choking, heaviness, weakness or numbness in the arms, dyspnea, dizziness).",
    "<strong>Stop all activity</strong> and have the patient <strong>sit or rest in bed in semi-Fowler's</strong> — lowers O₂ demand.",
    "Assess the pain — <strong>is it the same as usual?</strong> — plus vital signs and signs of respiratory distress; obtain a <strong>12-lead ECG</strong> (ST-segment and T-wave changes).",
    "Give <strong>NTG SL</strong> (hold and notify if SBP below 90); repeat every 5 minutes for pain that is unchanged or still present, <strong>up to 3 doses</strong>, checking <strong>BP and HR each time</strong>.",
    "Give <strong>O₂</strong>, usually <strong>2 L/min by nasal cannula</strong> — especially if RR is up or SpO₂ is down.",
    "Stay with the patient; pain that is significant and continues → notify the provider and treat as possible ACS/MI.",
    "<strong>Bed rest until stable</strong>; avoid Valsalva (straining)."]},
   {h:"Reducing anxiety"},
   {p:"Patients with angina often fear <strong>losing their roles</strong> in the family and society, and fear that the pain means an <strong>MI or death</strong>. Fear raises catecholamines, which raise HR, BP, and O₂ demand — worsening ischemia. Explore what the diagnosis means to the patient, stay calm, and explain the illness, its treatment, and how to slow its progression in simple terms. Involve the family, and offer <strong>stress-reduction methods</strong> such as guided imagery or music therapy. Addressing <strong>spiritual needs</strong> can also ease fear. Morphine, when ordered for unrelieved pain, also eases anxiety."},
   {hook:"<strong>Anxiety is a demand problem.</strong> A calm patient is a heart that needs less oxygen."},
   {h:"Preventing pain: balancing activity and rest"},
   {p:"Identify the <strong>level of activity that brings on</strong> the patient's pain or warning symptoms and plan activities around it. If pain comes often or with minimal activity, <strong>alternate activities with rest periods</strong>. Balancing activity and rest is a core part of teaching for the patient and family."},
   {list:[
    "Daily exercise that <strong>does not cause pain</strong>; increase duration first, then intensity.",
    "<strong>Alternate activity with rest</strong>; some fatigue during recovery is expected.",
    "Avoid activity right after a <strong>large meal</strong>; eat smaller meals.",
    "Avoid <strong>extremes of heat and cold</strong> and walking into the wind; in cold weather, dress warmly and cover the mouth and nose with a scarf.",
    "Exercise at a level where you can still <strong>talk</strong>; check pulse during activity.",
    "<strong>Stop</strong> any activity that causes chest pain, extreme SOB, dizziness, or undue fatigue.",
    "Limit caffeine (raises HR); avoid smoke-filled places."]},
   {h:"Self-care teaching"},
   {p:"Teaching is planned <strong>with the patient and family</strong> so they can understand the illness, <strong>recognize the symptoms of ischemia</strong>, state what to do when symptoms start, and prevent chest pain and the progression of CAD. The aims: fewer and milder angina attacks, slower disease progression, and no complications. <strong>Any pain not relieved within 15 minutes by the usual methods, including NTG, means calling 911</strong> for transport to the closest ED."},
   {h:"Managing angina at home — what the patient should be able to do"},
   {list:[
    "Follow a diet <strong>low in saturated fat</strong> and high in fruits, vegetables, and whole grains (lower in calories if weight loss is needed).",
    "<strong>Balance rest with daily activity</strong> — stay below the level that causes chest discomfort, shortness of breath, or undue fatigue; follow the prescribed exercise plan.",
    "<strong>Avoid temperature extremes, especially cold</strong> — don't exercise in very hot or cold weather.",
    "Know the name, dose, side effects, and schedule of every medication; take <strong>aspirin and beta blockers as prescribed</strong>.",
    "<strong>Carry NTG at all times</strong> and know when and how to use it.",
    "<strong>Avoid OTC products that raise HR and BP</strong> (diet pills, nasal decongestants) unless the provider approves.",
    "<strong>Stop smoking</strong> and avoid secondhand smoke — smoking raises HR, BP, and carbon monoxide levels.",
    "Keep <strong>blood pressure and blood glucose</strong> at goal; manage weight and stress; use support resources during stressful times.",
    "<strong>Report any increase in symptoms</strong>, keep follow-up appointments and testing, and know how to reach the provider."]},
   {h:"Teaching NTG self-administration"},
   {list:[
    "<strong>Moisten the tablet with saliva</strong>, place it under the tongue, and let it <strong>dissolve completely</strong> before swallowing.",
    "NTG is <strong>volatile</strong> — heat, moisture, air, light, and time inactivate it. Keep it in the <strong>original capped dark glass bottle</strong> in a cool place; <strong>never</strong> move tablets into a plastic pillbox or carry them in a pocket close to the body.",
    "<strong>Keep it with you at all times</strong> and <strong>renew the supply every 3–6 months</strong>.",
    "Take it <strong>before</strong> any activity that may cause pain (exercise, climbing stairs, sexual activity) — it raises tolerance for exercise and stress and works best before pain starts.",
    "<strong>Note how long it takes</strong> to relieve the discomfort.",
    "<strong>Sit down for a few minutes</strong> when taking it to avoid hypotension and fainting.",
    "<strong>1 tablet every 5 minutes, maximum 3</strong> — pain still there after the third → <strong>call 911</strong>.",
    "Side effects: <strong>flushing, throbbing headache, hypotension, and tachycardia</strong>.",
    "<strong>Never</strong> take with PDE5 inhibitors (sildenafil, tadalafil, vardenafil, avanafil) — severe hypotension."]},
   {hook:"NTG storage = <strong>\"keep it dark, cool, capped, and fresh\"</strong> — original dark glass bottle, out of the pocket, renewed every 3–6 months."},
   {h:"When to call 911 vs. the provider"},
   {table:{head:["Call 911","Call the provider"],rows:[
    ["Chest pain or pressure (or warning symptoms) <strong>not relieved after 3 NTG in 15 minutes</strong>","New or more frequent angina, or angina with less activity"],
    ["Chest pain with fainting, severe SOB, or sweating","SOB, fainting spells, slow or fast heartbeat"],
    ["Signs of stroke or severe bleeding","Swelling of the feet and ankles"]]}},
   {h:"Cardiac rehabilitation"},
   {p:"A structured, supervised program after an MI, stent, or bypass surgery, or for chronic angina. It offers <strong>monitored exercise</strong>, diet and stress-reduction teaching, help with smoking cessation, guidance on returning to work, driving, and sex, and support groups. Encourage every eligible patient to enroll."},
   {h:"Medication teaching overview"},
   {table:{head:["Class","Why","Key teaching"],rows:[
    ["<strong>Antiplatelets</strong> (aspirin, clopidogrel)","Prevent clots on plaque or a stent","Bleeding precautions; report black stools; never stop without the cardiologist (especially after a stent); clopidogrel held about 5 days before surgery"],
    ["<strong>Statins</strong>","Lower LDL","Report muscle pain or dark urine; liver enzymes checked; not in pregnancy"],
    ["<strong>Beta blockers</strong> (\"-olol\")","↓ HR, BP, and O₂ demand","Check pulse; hold/notify if HR below 60 or SBP below 90; <strong>never stop abruptly</strong>"],
    ["<strong>Nitrates</strong> (NTG)","Dilate vessels, relieve angina","1 every 5 min, max 3; sit first; original dark glass bottle, renewed every 3–6 months; no PDE5 inhibitors"],
    ["<strong>ACE inhibitors</strong> (\"-pril\")","Prevent remodeling, lower BP","Dry cough, angioedema, potassium, rise slowly"]]}},
   {p:"Full details for each class live in the Medications unit."},
   {h:"Home teaching after a cardiac cath"},
   {list:[
    "Check the insertion site (groin or wrist) daily for <strong>bleeding, swelling, a hard lump (hematoma)</strong>, redness, or drainage.",
    "If the site bleeds, <strong>lie down and apply firm pressure</strong>; call 911 if bleeding doesn't stop.",
    "Report <strong>numbness, tingling, coldness, color change, or pain</strong> in the leg or arm used.",
    "Avoid heavy lifting and strenuous activity for the time ordered.",
    "<strong>Drink fluids</strong> to help flush the contrast dye (protects the kidneys).",
    "After a stent: take aspirin and clopidogrel <strong>exactly as prescribed</strong> — stopping early risks a clot inside the stent.",
    "A stent or bypass does <strong>not cure CAD</strong> — lifestyle changes and meds are still needed."]},
   {hook:"Hematoma at the site? <strong>Hold pressure — never massage.</strong> Severe one-sided back or flank pain with ↓BP and ↑HR = retroperitoneal bleed → emergency."},
   {h:"Home care checklist"},
   {list:[
    "Can name their condition and how it affects daily life",
    "States name, dose, side effects, and schedule of every medication",
    "Knows how to take NTG and when to call 911",
    "Follows a heart-healthy diet and activity plan",
    "Commits to smoking cessation and BP, glucose, and lipid control",
    "Knows follow-up appointments, cardiac rehab, and support resources"]}
  ],
  check:{stem:"A client on a telemetry unit reports chest pressure while walking in the hall. What is the nurse's first action?", options:["Obtain a troponin level","Have the client stop and sit down","Administer aspirin 81 mg","Call the rapid response team"], answer:1, why:"Stopping the activity and resting immediately lowers myocardial O₂ demand. Assessment, ECG, and NTG follow; labs and calling for help come after the client is resting."}
}

]};

// ===================== HEART FAILURE =====================
const HF_UNIT = { title:"Heart Failure", group:"cardiac", sub:"A volume problem: systolic vs. diastolic, left vs. right, stages, daily weights, and the teaching that prevents exacerbations.", lessons:[

{ id:"m4-hf-types", title:"Heart Failure: Types &amp; Causes", kicker:"Can't pump vs. can't fill — and why the body makes it worse",
  blocks:[
   {h:"What heart failure is"},
   {p:"<strong>Heart failure (HF) is a syndrome in which the heart cannot pump enough blood to meet the body's needs.</strong> Either the ventricle can't <strong>contract</strong> well (systolic) or it can't <strong>fill</strong> well (diastolic). Both end in <strong>decreased cardiac output</strong> and <strong>congestion</strong> — fluid backing up behind the weak side. HF is a \"volume\" problem, so fluid balance is at the center of care."},
   {h:"Compensation: the vicious cycle"},
   {p:"When cardiac output drops, the body tries to fix it — and in the short term it works. Over time, these same mechanisms make the heart work harder and cause the signs and symptoms of HF."},
   {table:{head:["Mechanism","What it does","Long-term cost"],rows:[
    ["<strong>Sympathetic nervous system</strong> (epinephrine, norepinephrine)","↑ HR and contractility; vasoconstriction","Tachycardia and ↑ afterload raise O₂ demand; less blood to kidneys, GI tract, skin"],
    ["<strong>RAAS</strong> (renin → angiotensin II → aldosterone)","Low kidney perfusion releases renin; angiotensin II constricts vessels; aldosterone holds sodium and water","<strong>Fluid volume overload</strong>; ↑ preload and afterload"],
    ["<strong>Hypertrophy</strong> (thickening)","Thicker muscle squeezes harder at first","Stiff walls that can't relax and fill"],
    ["<strong>Dilation</strong> (stretching)","Chamber stretches to hold more volume","Overstretched muscle loses its \"snap back\""],
    ["<strong>Ventricular remodeling</strong>","Abnormal structure and early death of heart cells, fibrosis","Progressive, worsening failure"]]}},
   {p:"The overstretched chambers release <strong>BNP</strong>, which promotes diuresis and vasodilation — but it isn't strong enough to win. That's why BNP is the lab marker for HF."},
   {hook:"Why ACE inhibitors, ARBs, ARNI, and beta blockers are HF drugs: they <strong>block the compensation</strong> (RAAS and SNS) that is driving the vicious cycle and remodeling."},
   {h:"Systolic vs. diastolic"},
   {table:{head:["Feature","Systolic — HFrEF","Diastolic — HFpEF"],rows:[
    ["Name","Heart failure with <strong>reduced</strong> ejection fraction","Heart failure with <strong>preserved</strong> ejection fraction"],
    ["Ejection fraction","<strong>EF below 50%</strong>","EF preserved (normal range)"],
    ["The problem","<strong>Can't PUMP</strong> — weak contraction","<strong>Can't FILL</strong> — stiff ventricle can't relax"],
    ["Ventricle walls","<strong>Stretched</strong>, thin, \"big and boggy\"","<strong>Thick</strong>, stiff, smaller chamber"],
    ["Result","Fills but can't squeeze it out → ↓ stroke volume","Squeezes but too little blood got in → ↓ stroke volume"],
    ["How it's diagnosed","Echocardiogram (EF, wall thickness)","Echocardiogram (EF, wall thickness)"]]}},
   {p:"<strong>Normal EF is 50–70%</strong> — the percentage of blood in the ventricle that is pumped out with each beat. A patient can have both types at once."},
   {hook:"<strong>Systolic = Stretched. Diastolic = thick</strong> (\"Damn she thick\"). Both lead to the same place: decreased cardiac output."},
   {h:"Causes"},
   {list:[
    "<strong>CAD and MI</strong> — a leading cause; ischemic or dead muscle can't contract.",
    "<strong>Hypertension</strong> — ↑ afterload → hypertrophy → stiff, then failing ventricle (the most common cause of HFpEF).",
    "<strong>Valve disease</strong> — blood can't move forward; pressure and workload rise.",
    "<strong>Cardiomyopathy</strong> — disease of the heart muscle itself (including from alcohol or some chemotherapy).",
    "<strong>Dysrhythmias</strong> — A-fib can cause or result from HF; very fast or very slow rates drop cardiac output.",
    "<strong>Anemia</strong> and <strong>thyroid disease</strong> — the heart works harder to meet O₂ demand.",
    "<strong>Lung disease</strong> (COPD, pulmonary hypertension, PE) — a cause of <strong>right-sided</strong> HF because the right ventricle pumps against high lung pressure.",
    "Kidney failure with volume overload; hypoxia, acidosis, electrolyte imbalances worsen it."]},
   {h:"ACC/AHA stages"},
   {table:{head:["Stage","Description","Example"],rows:[
    ["<strong>At risk</strong> (A)","Risk factors, no structural change, no symptoms","HTN, diabetes, obesity, smoking, high cholesterol, inactivity"],
    ["<strong>Pre-HF</strong> (B)","Structural heart changes but <strong>no symptoms</strong>","Old MI, left ventricular hypertrophy, low EF on echo"],
    ["<strong>HF</strong> (C)","Structural disease <strong>with current or past symptoms</strong>","Dyspnea, fatigue, edema"],
    ["<strong>Advanced HF</strong> (D)","End stage; symptoms despite maximal therapy","Repeated hospitalizations, devices, transplant evaluation"]]}},
   {p:"Stages only move <strong>forward</strong> — they describe the natural progression of the disease, and treatment is matched to the stage."},
   {h:"NYHA functional class"},
   {table:{head:["Class","Symptoms with activity"],rows:[
    ["I","No limitation — ordinary activity causes no symptoms"],
    ["II","Slight limitation — comfortable at rest; ordinary activity causes fatigue, dyspnea, or palpitations"],
    ["III","Marked limitation — less than ordinary activity causes symptoms"],
    ["IV","Symptoms <strong>at rest</strong>; any activity increases discomfort"]]}},
   {p:"NYHA class describes <strong>how the patient feels today</strong> and can go up or down with treatment; ACC/AHA stage describes <strong>disease progression</strong>."},
   {h:"Acute vs. chronic"},
   {p:"<strong>HF is a chronic disease with acute exacerbations</strong> (acute decompensated HF). The goal of long-term care is to keep the patient managed and <strong>out of exacerbation</strong>. Common triggers: too much sodium or fluid, missed medications, uncontrolled HTN, new A-fib or other dysrhythmia, infection, ischemia."}
  ],
  check:{stem:"An echocardiogram shows a client's left ventricle is dilated with thin walls and an ejection fraction of 35%. The nurse recognizes this as which type of heart failure?", options:["Diastolic heart failure (HFpEF)","Systolic heart failure (HFrEF)","Right-sided heart failure only","Normal ventricular function"], answer:1, why:"A stretched, thin-walled ventricle with an EF below 50% can't pump — systolic HF with reduced EF. Diastolic HF has thick, stiff walls with a preserved EF."}
},

{ id:"m4-hf-left-right", title:"Left- vs. Right-Sided HF", kicker:"Left → Lungs. Right → Rest of the body.",
  blocks:[
   {h:"Why the signs differ"},
   {p:"Blood backs up <strong>behind</strong> the ventricle that is failing."},
   {list:[
    "<strong>Left ventricle fails</strong> → blood can't move forward into the aorta → it backs up into the left atrium and <strong>pulmonary veins → lungs</strong>. Fluid is forced into the alveoli = pulmonary congestion/edema. Forward flow to the body also drops (low-output signs).",
    "<strong>Right ventricle fails</strong> → blood can't move forward into the lungs → it backs up into the <strong>venous system → rest of the body</strong>: neck veins, liver, abdomen, legs."]},
   {hook:"<strong>L = Lungs. R = Rest of the body.</strong> The most common cause of right-sided HF is <strong>left-sided HF</strong> — the pressure backs up through the lungs into the right ventricle."},
   {h:"Signs and symptoms"},
   {table:{head:["Left-sided HF (Lungs)","Right-sided HF (Rest of body)"],rows:[
    ["<strong>Dyspnea</strong>, dyspnea on exertion, tachypnea","<strong>Jugular venous distention (JVD)</strong>"],
    ["<strong>Orthopnea</strong> (can't breathe lying flat; uses more pillows)","<strong>Dependent edema</strong> — feet, ankles, legs; sacrum if on bed rest"],
    ["<strong>Paroxysmal nocturnal dyspnea (PND)</strong> — wakes up gasping","<strong>Weight gain</strong> (fluid retention)"],
    ["<strong>Crackles</strong> that don't clear with coughing; wheezes","<strong>Ascites</strong> — ↑ abdominal girth"],
    ["<strong>Cough</strong> — dry at first, then <strong>pink, frothy, or blood-tinged sputum</strong>","<strong>Hepatomegaly / splenomegaly</strong> — RUQ tenderness"],
    ["<strong>Restlessness, confusion</strong>, anxiety (low O₂ to the brain)","<strong>Anorexia, nausea, GI distress</strong> (congested gut)"],
    ["<strong>S3</strong> heart sound; tachycardia","Fatigue, weakness"],
    ["Low SpO₂, cyanosis, fatigue, ↓ urine output","Nocturia (fluid returns to circulation lying down)"]]}},
   {p:"In chronic HF, patients often have <strong>both</strong> sets of signs at once."},
   {h:"The S3 heart sound"},
   {p:"An <strong>S3 (\"ventricular gallop\")</strong> is an extra sound just after S2, heard best at the apex with the bell. It comes from blood rushing into an overfilled ventricle and is an <strong>early sign of fluid overload</strong> in HF. Rhythm: \"Ken-<strong>tuc</strong>-ky.\""},
   {h:"Assessing JVD"},
   {list:[
    "Position the patient with the <strong>head of the bed at 45 degrees</strong>, head turned slightly away.",
    "Look at the internal jugular area for the top of the venous pulsation.",
    "Distention <strong>more than about 4 cm above the sternal angle</strong> is abnormal → suggests high venous pressure and right-sided failure.",
    "Hepatojugular reflux: pressing on the right upper abdomen makes the neck veins rise further — another sign of high venous pressure."]},
   {hook:"Visible neck veins while sitting up at 45° = <strong>the right side is backed up</strong>."},
   {h:"Pulmonary edema — an emergency"},
   {p:"<strong>Acute pulmonary edema</strong> (acute decompensated HF) happens when the left ventricle suddenly can't handle the volume and fluid floods the alveoli. It can come on fast (\"flash\")."},
   {list:[
    "<strong>Recognize:</strong> sudden severe breathlessness and a feeling of suffocation, tachypnea, low SpO₂, <strong>pink frothy sputum</strong>, crackles throughout the lungs, restlessness/anxiety/confusion, cool clammy pale or cyanotic skin, tachycardia, JVD."]},
   {table:{head:["Priority action","Why"],rows:[
    ["<strong>High Fowler's</strong>, legs dangling if possible","↓ venous return (preload) and lung congestion; eases breathing"],
    ["<strong>Oxygen</strong> (non-rebreather at first as ordered); pulse oximetry","Relieve hypoxemia; prepare for noninvasive ventilation if not improving"],
    ["<strong>IV access</strong>, cardiac monitor","For IV meds; watch for dysrhythmias"],
    ["<strong>IV furosemide</strong> (loop diuretic) as ordered","Rapid diuresis pulls fluid off the lungs"],
    ["<strong>Morphine or nitrates</strong> per provider order","Vasodilation ↓ preload; morphine also eases anxiety and air hunger"],
    ["<strong>Monitor</strong> BP, urine output (bedside commode or catheter), I&amp;O, K⁺, kidneys","Diuresis can drop BP and potassium quickly"],
    ["<strong>Stay with the patient</strong>; calm, simple explanations","Anxiety worsens dyspnea and cardiac workload"]]}},
   {hook:"Pulmonary edema \"<strong>sit up, O₂, pee it off</strong>\": High Fowler's → oxygen → IV furosemide → watch BP and K⁺."}
  ],
  check:{stem:"A client with heart failure has crackles that don't clear with coughing, orthopnea, and pink frothy sputum. These findings point to which problem?", options:["Right-sided heart failure","Left-sided heart failure with pulmonary congestion","Hypovolemia","Ascites from liver failure"], answer:1, why:"Left-sided failure backs blood up into the lungs: crackles, orthopnea, and frothy sputum. JVD, dependent edema, and ascites are right-sided (rest of the body) findings."}
},

{ id:"m4-hf-care", title:"HF Management &amp; Teaching", kicker:"Diagnostics, treatment by stage, daily weights, and the nursing process",
  blocks:[
   {h:"Diagnostics"},
   {table:{head:["Test","What it tells you"],rows:[
    ["<strong>BNP</strong>","Released by overstretched ventricles. <strong>Below 100 pg/mL normal; above 100 = HF</strong> — the higher, the worse. Rising levels suggest an exacerbation."],
    ["<strong>Echocardiogram</strong>","Confirms HF and the type: <strong>EF</strong> (normal 50–70%; HFrEF below 50%), wall thickness, chamber size, valves"],
    ["<strong>Chest X-ray</strong>","Enlarged heart, pulmonary congestion/edema, pleural effusion"],
    ["<strong>BMP</strong>","<strong>K⁺</strong> (3.5–5.5) and <strong>Na⁺</strong> — diuretics and ACE/ARB/ARNI shift them; <strong>BUN and creatinine</strong> — kidney function"],
    ["<strong>12-lead ECG</strong>","Dysrhythmias (A-fib is common), signs of ischemia or old MI"],
    ["Others","CBC (anemia), thyroid studies, liver tests, troponin if ischemia is suspected"]]}},
   {h:"Treatment by stage"},
   {table:{head:["Step","Treatment"],rows:[
    ["1","<strong>Lifestyle modifications</strong> + <strong>SGLT2 inhibitor</strong> (blood sugar control)"],
    ["2","<strong>ACE inhibitor</strong>, <strong>beta blocker</strong>, <strong>statin</strong>"],
    ["3","<strong>ARNI</strong> (sacubitril/valsartan), <strong>diuretic</strong> — potassium-sparing to start"],
    ["4","More invasive device management and IV therapy (NUR 211 content)"]]}},
   {p:"<strong>Nitrates</strong> and <strong>digoxin</strong> (cardiac glycoside) can be added at any stage, or used when the patient can't tolerate an ACE inhibitor, ARB, or ARNI. Always treat the <strong>underlying cause</strong> too (HTN, CAD, valve disease, A-fib)."},
   {h:"Medication overview"},
   {table:{head:["Class","Role in HF","Key nursing point"],rows:[
    ["<strong>ACE inhibitor</strong> (\"-pril\") / <strong>ARB</strong> (\"-sartan\")","Block RAAS: ↓ afterload, ↓ fluid retention, slow remodeling","Cough (ACE → switch to ARB), angioedema, ↑ K⁺, first-dose hypotension, kidneys"],
    ["<strong>ARNI</strong> (sacubitril/valsartan)","Blocks RAAS and boosts natriuretic peptides","<strong>Never with an ACE inhibitor</strong> — 36-hour washout (angioedema)"],
    ["<strong>Beta blocker</strong>","Blocks SNS: ↓ HR and workload, slows remodeling","Hold/notify HR below 60 or SBP below 90; never stop abruptly"],
    ["<strong>Diuretics</strong>","Remove excess fluid","Daily weights, I&amp;O, BP, K⁺; give in the morning"],
    ["<strong>SGLT2 inhibitor</strong>","Blood sugar control; started early in HF","Started with lifestyle changes at the first step"],
    ["<strong>Digoxin</strong> / <strong>nitrates</strong>","Add-ons","Low K⁺ raises digoxin toxicity risk"]]}},
   {p:"Full details live in the Medications unit."},
   {h:"Lifestyle modifications"},
   {list:[
    "<strong>Nutrition:</strong> <strong>low sodium</strong>, <strong>low cholesterol</strong>, <strong>omega-3</strong>; read labels and avoid canned, processed, and restaurant foods; flavor with herbs, lemon, vinegar.",
    "<strong>Fluid management</strong> — fluid restriction <strong>as ordered</strong>; plan fluids across the day.",
    "<strong>Exercise</strong> — mild and gradual, often through <strong>cardiac rehab</strong>; <strong>avoid tachycardia</strong>.",
    "<strong>Rest</strong> and <strong>sleep-disorder evaluation</strong> (sleep apnea worsens HF).",
    "<strong>Evaluation of cardiac rhythm</strong> — A-fib is common.",
    "<strong>Smoking and alcohol cessation.</strong>",
    "<strong>Vaccines</strong> (influenza, pneumonia) — infections trigger exacerbations.",
    "<strong>Oxygen PRN.</strong>"]},
   {h:"Daily weights — the most important self-check"},
   {list:[
    "Weigh <strong>every morning</strong>, same time, <strong>same scale</strong>, <strong>same clothing</strong>, after voiding and before breakfast.",
    "<strong>Report a gain of 2–3 lb in a day or 5 lb in a week.</strong>",
    "Sudden weight gain in HF is <strong>fluid, not fat</strong> (1 kg ≈ 1 L of fluid).",
    "Keep a written log to bring to appointments."]},
   {hook:"<strong>\"2–3 in a day, 5 in a week\"</strong> — call the provider before the lungs fill up."},
   {h:"Sodium and fluid limits"},
   {p:"Follow the sodium and fluid limits <strong>as ordered</strong> (sodium is commonly limited to about 2 g/day). Teach that many foods contain hidden sodium, salt substitutes are high in potassium (dangerous with ACE inhibitors, ARBs, or potassium-sparing diuretics), and OTC antacids, cough syrups, and laxatives may contain sodium — check with the provider first."},
   {h:"Balancing activity and rest"},
   {list:[
    "Avoid prolonged bed rest unless acutely ill — deconditioning, pressure injuries, and clots.",
    "Daily walking, increased gradually: <strong>duration first, then frequency, then intensity</strong>.",
    "<strong>Alternate activity with rest periods</strong>; don't schedule two big tasks back to back.",
    "Small, frequent meals; sit for tasks (chopping vegetables at the table); wait about 2 hours after eating to exercise.",
    "Must be able to <strong>talk</strong> during activity; stop for severe SOB, pain, or dizziness; avoid extreme heat, cold, and humidity.",
    "In the hospital, check VS and SpO₂ before, during, and after activity; HR should return to baseline within about 3 minutes."]},
   {h:"When to call the provider"},
   {list:[
    "Weight gain of <strong>2–3 lb in a day or 5 lb in a week</strong>",
    "Unusual SOB with activity or at rest",
    "↑ swelling of the ankles, feet, or abdomen",
    "Persistent cough",
    "Loss of appetite",
    "Restless sleep or needing <strong>more pillows</strong> to breathe at night",
    "Profound fatigue, dizziness, or fainting"]},
   {h:"Nursing process for the patient with HF"},
   {table:{head:["Step","Focus"],rows:[
    ["<strong>Assess</strong>","Dyspnea, number of pillows, PND, fatigue, edema (0–4+), lung sounds (crackles, wheezes), S3, HR/rhythm, BP (incl. orthostatic), JVD, pulses, skin color/temperature, abdomen (ascites, liver), LOC, I&amp;O, daily weight, emotional response/depression, understanding of self-care"],
    ["<strong>Problems</strong>","Activity intolerance; fluid volume excess; anxiety; powerlessness; difficulty managing the regimen. Potential complications: pulmonary edema, hypotension/cardiogenic shock, dysrhythmias, thromboembolism"],
    ["<strong>Interventions</strong>","Promote activity tolerance (pace and rest); manage fluid volume (diuretics in the morning, I&amp;O, weights, sodium/fluid limits, HOB up or recliner, skin care for edema); control anxiety (O₂, comfort, family presence, <strong>avoid restraints</strong>); minimize powerlessness (offer choices); teach with teach-back"],
    ["<strong>Evaluate</strong>","Stable weight, clearer lungs, less dyspnea and edema, tolerates activity, follows the plan, no exacerbation"]]}},
   {p:"Watch diuretic problems: <strong>hypokalemia</strong> (dysrhythmias, weakness — dangerous with digoxin), <strong>hyperkalemia</strong> (ACE/ARB/spironolactone), hyponatremia, dehydration and hypotension, rising creatinine. Also monitor for <strong>oliguria</strong> — urine output that drops despite diuretics signals kidney trouble."},
   {h:"Acute exacerbation priorities"},
   {list:[
    "<strong>Airway and breathing first</strong> — high Fowler's, O₂, SpO₂, lung sounds.",
    "Cardiac monitor, IV access, VS frequently.",
    "<strong>IV diuretic</strong> as ordered; strict I&amp;O, daily weight, K⁺ and kidney labs.",
    "Bed rest during the acute phase; bedside commode to save energy.",
    "Stay with the patient, reduce anxiety.",
    "Find the trigger (diet, missed meds, A-fib, infection) and target teaching to it before discharge."]}
  ],
  check:{stem:"A client with heart failure weighed 172 lb yesterday morning and 175 lb this morning on the same scale. What is the nurse's best action?", options:["Document the weight and recheck tomorrow","Notify the provider of the weight gain","Encourage the client to drink more water","Encourage the client to walk more today"], answer:1, why:"A gain of 2–3 lb in a day (or 5 lb in a week) is fluid retention and must be reported so therapy can be adjusted. Waiting allows fluid to build up; extra water worsens overload."}
}

]};

// ===================== CLOTTING: DVT, PE & STROKE =====================
const CLOT_UNIT = { title:"Clotting: DVT, PE &amp; Stroke", group:"clot", sub:"Venous thromboembolism from Virchow triad to prevention, pulmonary embolism, ischemic vs hemorrhagic stroke and TIA, tPA, and nursing care of the stroke patient.", lessons:[

// ---------- 1. DVT & VTE PREVENTION ----------
{ id:"m4-vte", title:"DVT &amp; VTE Prevention", kicker:"Virchow triad, assessment, prevention, and anticoagulant safety",
  blocks:[
   {h:"What VTE is"},
   {p:"<strong>Venous thromboembolism (VTE)</strong> is the umbrella term for <strong>deep vein thrombosis (DVT)</strong> and <strong>pulmonary embolism (PE)</strong>. A DVT is a clot in a deep vein, usually the thigh or calf (upper-extremity DVT is usually linked to IV access devices — central lines, ports, dialysis catheters, pacing wires). The danger is the clot's <strong>“tail”</strong>: it can grow in the direction of blood flow, break off, and travel to the lungs as a PE. VTE is often <strong>silent</strong> — sometimes the first sign of a DVT is a PE."},
   {h:"Virchow triad — why clots form"},
   {p:"Three factors set the stage for a venous clot. Any one raises risk; stacking them raises it more (think of the post-op, immobile patient with cancer)."},
   {table:{head:["Virchow factor","What it means","Risk factors"],rows:[
    ["<strong>Endothelial damage</strong>","Injury to the vein's inner lining creates a site for a clot","Central venous catheters, dialysis access catheters, pacing wires, local vein damage (IV irritants), repetitive-motion injury, <strong>surgery</strong>, <strong>trauma</strong>/fractures"],
    ["<strong>Venous stasis</strong>","Slow blood flow — veins dilate and the calf-muscle pump isn't working","<strong>Bed rest/immobilization</strong>, age over 65, <strong>heart failure</strong>, <strong>obesity</strong>, spinal cord injury, varicose veins, long trips"],
    ["<strong>Altered coagulation</strong> (hypercoagulability)","Blood clots more easily than normal","<strong>Cancer</strong>, <strong>oral contraceptives</strong>/hormones, <strong>pregnancy</strong> (and about 6 weeks postpartum), polycythemia, septicemia, inherited clotting disorders (factor V Leiden, protein C/S or antithrombin III deficiency), abruptly stopping an anticoagulant"]]}},
   {hook:"<strong>“Damage, Stasis, Thick blood.”</strong> When you see a hip-replacement patient on bed rest, you are looking at two sides of the triangle already — prevention starts on day 0."},
   {h:"Signs and symptoms of DVT"},
   {list:[
    "<strong>Unilateral</strong> edema/swelling of the leg (or arm) — compare sides",
    "Pain, heaviness, or cramping; ankle engorgement",
    "<strong>Warmth</strong> — the affected limb feels warmer than the other",
    "<strong>Tenderness</strong> on gentle palpation (often appears later, from vein-wall inflammation)",
    "<strong>Prominent superficial veins</strong>",
    "Often no symptoms at all — and <strong>PE may be the first sign</strong>"]},
   {p:"<strong>Assess by measuring:</strong> measure the circumference of both legs (thigh and calf) at the <strong>same marked level</strong> with a tape measure and compare. A difference between sides quantifies the swelling. If both legs are swollen, a difference may be hard to detect."},
   {h:"Superficial vs deep"},
   {table:{head:["","Superficial thrombophlebitis","Deep vein thrombosis"],rows:[
    ["Where","Veins just under the skin (saphenous, cephalic, basilic)","Deep veins of the thigh/calf (or subclavian with lines)"],
    ["Look/feel","Pain/tenderness, <strong>redness</strong>, warmth along a <strong>cordlike</strong>, palpable vein","Unilateral <strong>swelling</strong>, warmth, heaviness, tenderness; may be silent"],
    ["Embolus risk","<strong>Low</strong> — most dissolve on their own","<strong>High</strong> — can break off → PE"],
    ["Treatment","Often at home: elevate, analgesics, anti-inflammatories","Anticoagulation ± clot removal; prevent extension and PE"]]}},
   {h:"Diagnostics"},
   {table:{head:["Test","What it shows / why"],rows:[
    ["<strong>Venous duplex ultrasound</strong>","Main test for DVT — the vein looks enlarged with clot, or <strong>won't compress</strong> under the probe"],
    ["<strong>D-dimer</strong>","Blood test for clot breakdown products — elevated with an active clot (also with surgery, trauma, infection); a normal result makes VTE unlikely"],
    ["<strong>Coagulation studies</strong> — PT/INR, aPTT","<strong>Baselines</strong> before starting anticoagulants"],
    ["CBC (Hgb/Hct, platelets)","Baseline for bleeding risk and heparin-induced thrombocytopenia (HIT)"],
    ["Hypercoagulability workup","If no obvious cause: factor V Leiden, protein C/S, antithrombin III, CRP"]]}},
   {h:"Prevention — the most important nursing job"},
   {list:[
    "<strong>Early ambulation</strong> — the single most effective way to prevent stasis; walking beats standing or sitting",
    "<strong>Leg exercises</strong> (ankle pumps, calf flexion) every hour while in bed or on long trips; deep breathing also helps venous return",
    "<strong>Anti-embolism stockings</strong> and <strong>intermittent pneumatic compression devices (SCDs)</strong> as ordered",
    "<strong>Prophylactic anticoagulant</strong>: SubQ unfractionated heparin or LMWH (enoxaparin)",
    "<strong>Hydration</strong> — dehydration thickens the blood",
    "<strong>No crossing the legs, no pillows under the knees</strong>, no prolonged sitting with hips and knees bent",
    "<strong>Never massage the leg</strong> — it can dislodge a clot",
    "Lifestyle: weight loss, smoking cessation, regular exercise"]},
   {hook:"<strong>Move it, squeeze it, thin it, water it — but never rub it.</strong> Ambulation/leg exercises, stockings/SCDs, heparin/LMWH, fluids — and no massage, no crossed legs, no pillow under the knees."},
   {h:"Nursing care of the patient with a DVT"},
   {list:[
    "<strong>Elevate</strong> the feet and lower legs <strong>above the level of the heart</strong> to empty the veins",
    "<strong>Walk once anticoagulation has started</strong> — goal at least 10 minutes every 1–2 hours",
    "<strong>Graduated compression stockings</strong> improve venous return and comfort; teach how to apply them",
    "<strong>Warm packs</strong> may reduce discomfort; give analgesics as ordered",
    "Measure and compare leg circumference daily; reassess pain, warmth, and color",
    "Watch for <strong>PE</strong>: sudden dyspnea, chest pain, tachypnea, anxiety"]},
   {p:"Anticoagulants <strong>prevent new clots and stop the clot from growing</strong> — they do <strong>not</strong> dissolve a clot that has already formed. The body breaks down the existing clot over time."},
   {h:"Monitoring anticoagulant therapy"},
   {table:{head:["Drug","Monitor","Antidote"],rows:[
    ["<strong>Heparin</strong> (IV drip/SubQ)","<strong>aPTT</strong> (“two t's make an H”); <strong>platelets</strong> for HIT","Protamine sulfate"],
    ["<strong>LMWH</strong> (enoxaparin) SubQ","Platelets, bleeding; don't expel the air bubble, don't aspirate or rub the site","Protamine (partial)"],
    ["<strong>Warfarin</strong> (PO)","<strong>PT/INR</strong>, goal <strong>2–3</strong>; takes days to work, so it's bridged with heparin","Vitamin K"],
    ["<strong>DOACs</strong> (rivaroxaban, apixaban, dabigatran)","No routine lab monitoring; bleeding","Andexanet alfa (Xa inhibitors); idarucizumab (dabigatran)"]]}},
   {p:"For every anticoagulant: get <strong>baseline</strong> labs, watch Hgb/Hct and platelets, and assess for bleeding. Bleeding is reported <strong>immediately</strong>; the drug may be stopped or reversed."},
   {h:"Teaching — taking anticoagulants"},
   {list:[
    "Take exactly as prescribed; <strong>don't stop</strong> unless told to; warfarin at the same time every day",
    "<strong>Wear/carry ID</strong> stating the anticoagulant; tell every provider and dentist; check before dental work or surgery",
    "Keep all lab appointments (INR for warfarin)",
    "Ask before taking other drugs or supplements — especially <strong>aspirin, NSAIDs</strong>, antibiotics, cold medicines, vitamins, herbals",
    "Warfarin: <strong>avoid alcohol</strong>; keep <strong>vitamin K intake consistent</strong> (leafy greens) — no big diet changes",
    "Bleeding precautions: <strong>electric razor</strong>, <strong>soft toothbrush</strong>, avoid contact sports and sharps",
    "Report: bleeding that won't stop, nosebleeds, extensive bruising, <strong>red/brown urine</strong>, <strong>red or black stools</strong>, possible pregnancy"]},
   {h:"Complications of venous thrombosis"},
   {list:["<strong>Pulmonary embolism</strong> — the deadly one","<strong>Post-thrombotic syndrome</strong> (chronic leg swelling and skin changes)","Chronic venous insufficiency","Edema","Varicosities","Venous ulcers","Venous gangrene"]},
   {hook:"A calf that is <strong>swollen, warm, and tender on one side</strong> = think DVT. A patient who suddenly <strong>can't catch their breath</strong> = think the DVT just moved."}
  ],
  check:{stem:"A client is on day 2 after a total knee replacement. Which finding should the nurse report as a possible DVT?", options:["Bilateral ankle edema of 1+ that improves with elevation","The right calf measures 3 cm larger than the left and feels warm","Bruising around the incision line","Pedal pulses 2+ bilaterally with brisk capillary refill"], answer:1, why:"Unilateral swelling (a measurable difference in circumference) with warmth is a classic DVT cue. Bilateral dependent edema that improves with elevation is less specific, incisional bruising is expected after surgery, and strong pulses are a normal arterial finding."}
},

// ---------- 2. PULMONARY EMBOLISM ----------
{ id:"m4-pe", title:"Pulmonary Embolism", kicker:"Dead space, right-heart strain, stable vs unstable management",
  blocks:[
   {h:"What a PE is"},
   {p:"A <strong>pulmonary embolism</strong> is a blockage of the pulmonary artery or one of its branches. <strong>Most often it is a DVT that broke off</strong>, traveled through the vena cava and right heart, and lodged in the lungs. Other emboli: air, fat (long-bone fractures), amniotic fluid, and septic emboli."},
   {h:"Pathophysiology — follow the clot"},
   {list:[
    "<strong>1. Dead space:</strong> the blocked area is still <strong>ventilated</strong> (air moves in and out) but has <strong>no blood flow</strong> — so no gas exchange happens there → hypoxemia.",
    "<strong>2. Vasoconstriction:</strong> substances released from the clot constrict nearby vessels and bronchioles, making the V/Q mismatch worse.",
    "<strong>3. ↑ Pulmonary vascular resistance</strong> → ↑ pulmonary artery pressure → the <strong>right ventricle</strong> has to push harder.",
    "<strong>4. Right ventricular strain/failure</strong> → less blood reaches the left side → <strong>↓ cardiac output, ↓ BP, shock</strong>.",
    "Small emboli can cause pulmonary infarction (dead lung tissue)."]},
   {h:"V/Q mismatch — dead space vs shunt"},
   {p:"Gas exchange needs <strong>both</strong> air (ventilation, V) and blood (perfusion, Q) in the same place at the same time."},
   {table:{head:["","Ventilation (air)","Perfusion (blood)","Example"],rows:[
    ["<strong>Normal</strong>","Yes","Yes","Healthy alveolus next to a working capillary"],
    ["<strong>Dead space</strong>","<strong>Yes</strong>","<strong>No</strong>","<strong>Pulmonary embolism</strong> — air arrives, but the blood can't get there"],
    ["<strong>Shunt</strong>","<strong>No</strong>","<strong>Yes</strong>","Pneumonia, atelectasis, pulmonary edema — blood passes alveoli filled with fluid or collapsed"]]}},
   {hook:"<strong>PE = Plenty of air, Empty vessel.</strong> Dead space is a clot problem; shunt is an alveoli problem."},
   {h:"Signs and symptoms"},
   {list:[
    "<strong>Dyspnea</strong> — the <strong>most common symptom</strong>, usually sudden",
    "<strong>Tachypnea</strong> — the <strong>most common sign</strong>",
    "<strong>Sudden pleuritic chest pain</strong> (sharp, worse with breathing in); may mimic angina",
    "<strong>Anxiety, apprehension, restlessness</strong> — a “sense of doom”",
    "<strong>Tachycardia</strong>, low SpO₂, cough, <strong>hemoptysis</strong>, diaphoresis, fever, syncope",
    "Massive PE: hypotension, rapid weak pulse, confusion, cyanosis (may be blue from the chest up), shock, sudden death",
    "Can be subtle and mimic pneumonia or heart failure"]},
   {h:"Priority actions — the post-op patient who suddenly can't breathe"},
   {list:[
    "<strong>Stay with the patient</strong> and call for help (rapid response)",
    "<strong>Raise the head of the bed</strong> (semi-Fowler) to ease breathing",
    "<strong>Apply oxygen</strong>; check SpO₂, RR, HR, BP, lung sounds",
    "<strong>Notify the provider</strong> immediately",
    "Ensure IV access; anticipate ABG, D-dimer, ECG, and <strong>CT pulmonary angiography</strong>",
    "Anticipate anticoagulation (or a thrombolytic if unstable); keep the patient calm and explain what's happening"]},
   {h:"Diagnostics"},
   {table:{head:["Test","Findings / purpose"],rows:[
    ["<strong>CT pulmonary angiography (MDCTA)</strong>","<strong>The standard</strong> for diagnosing PE — fast and shows the clot"],
    ["<strong>V/Q scan</strong>","Compares ventilation and perfusion in each lung region; used when CT isn't an option (e.g., contrast allergy, kidney concerns)"],
    ["Pulmonary angiogram","Catheter + dye via the right heart; direct view of the clot (alternative to CT)"],
    ["D-dimer","Elevated with a clot"],
    ["ABG","<strong>Hypoxemia</strong> and low CO₂ (from fast breathing); may be normal"],
    ["Chest X-ray","Often normal; rules out other causes (pneumonia, pneumothorax)"],
    ["ECG","Most often <strong>sinus tachycardia</strong>; nonspecific ST–T changes"]]}},
   {h:"Management — stable vs unstable"},
   {table:{head:["","Stable PE","Unstable (massive) PE"],rows:[
    ["Picture","Normal BP, no severe hypoxemia","<strong>Hypotension, tachycardia, confusion</strong>, hypoxemia despite O₂, cardiovascular collapse"],
    ["Goal","Stop the clot from growing and prevent new ones","Stabilize heart and lungs, then <strong>dissolve or remove</strong> the clot"],
    ["Treatment","<strong>Anticoagulation</strong> right away: heparin, LMWH, or a DOAC; then long-term <strong>warfarin or a DOAC for at least 3–6 months</strong> (longer if high risk)","<strong>Thrombolytic (t-PA/alteplase)</strong>; <strong>embolectomy</strong> (surgical or catheter) if massive or thrombolytics are contraindicated; then maintenance anticoagulation"]]}},
   {h:"Thrombolytic therapy — nursing"},
   {list:[
    "<strong>Screen for contraindications first</strong>: active bleeding, recent stroke or intracranial problem, recent surgery (within about 10 days), recent labor/delivery, trauma, severe hypertension",
    "Get baseline <strong>INR, aPTT, Hct, platelets</strong>; anticoagulants are stopped before the thrombolytic",
    "<strong>Bed rest</strong> during the infusion; frequent vital signs and SpO₂",
    "<strong>Minimize needle sticks</strong> — only essential punctures; hold <strong>manual pressure at least 30 minutes</strong> on any puncture site",
    "INR/aPTT checked 3–4 hours after the infusion starts",
    "<strong>Uncontrolled bleeding → stop the infusion immediately</strong> and notify the provider",
    "After the infusion: start maintenance anticoagulation"]},
   {h:"IVC filter and embolectomy"},
   {p:"An <strong>inferior vena cava (IVC) filter</strong> is a small umbrella-like screen placed in the vena cava to <strong>trap clots from the legs and pelvis</strong> before they reach the lungs. Indication: <strong>recurrent PE despite anticoagulation</strong>, or anticoagulation is <strong>contraindicated</strong>. It is not the first-line treatment. After an <strong>embolectomy</strong>: check the catheter site for hematoma/infection, vital signs, urine output; keep BP high enough to perfuse organs; elevate the foot of the bed, use SCDs, encourage isometric exercises and walking — <strong>avoid long periods of sitting</strong> (hip flexion compresses the groin veins)."},
   {h:"Nursing care"},
   {list:[
    "<strong>Oxygen</strong>: monitor SpO₂ and for hypoxemia; teach why continuous O₂ matters",
    "<strong>Semi-Fowler position</strong> for comfort and breathing; reposition often to improve V/Q",
    "<strong>Deep breathing and incentive spirometry</strong> to prevent atelectasis",
    "<strong>Pain</strong>: usually pleuritic — positioning and analgesics as ordered",
    "<strong>Anxiety</strong>: stay calm, let the patient voice fears, explain care honestly",
    "<strong>Watch for right-sided HF and shock</strong>: JVD, ↓BP, ↑HR, ↓urine output, confusion",
    "Bleeding precautions on anticoagulants/thrombolytics"]},
   {h:"Teaching — preventing another PE"},
   {list:[
    "Name the anticoagulant, dose, side effects, and safety rules; keep follow-up and lab appointments",
    "Keep wearing <strong>anti-embolism/compression stockings</strong> as directed",
    "<strong>Avoid crossing the legs</strong> and sitting for long periods",
    "When traveling: change position, <strong>walk regularly</strong>, do leg exercises while sitting, and <strong>drink fluids</strong> (also in warm weather) to avoid hemoconcentration",
    "Report DVT signs: calf/leg pain, swelling, pedal edema",
    "Report PE signs: dyspnea, chest pain, anxiety, fever, tachycardia, cough, syncope, diaphoresis, hemoptysis — <strong>call 911</strong> for sudden shortness of breath or chest pain"]},
   {hook:"<strong>Sudden SOB + chest pain + anxiety in a post-op or immobile patient = PE until proven otherwise.</strong> Sit them up, give O₂, stay, call."}
  ],
  check:{stem:"A client receiving a thrombolytic for a massive PE needs a venipuncture for labs. Which action is correct?", options:["Apply a pressure dressing and check it in 4 hours","Hold manual pressure on the site for at least 30 minutes","Ask the client to bend the arm for 5 minutes","Apply ice and elevate the arm"], answer:1, why:"Thrombolytics greatly prolong clotting, so only essential punctures are done and manual pressure is held for at least 30 minutes. A pressure dressing alone, bending the arm, or ice is not enough to prevent bleeding."}
},

// ---------- 3. STROKE ----------
{ id:"m4-stroke", title:"Stroke: Ischemic vs Hemorrhagic &amp; TIA", kicker:"Types, BE-FAST, deficits, CT first, and the tPA window",
  blocks:[
   {h:"Brain attack"},
   {p:"A <strong>stroke</strong> (cerebrovascular accident, CVA, “brain attack”) is a sudden loss of brain function from a disruption in blood flow to part of the brain. Like a heart attack, <strong>time is tissue</strong>: the area around the dead core (the <strong>penumbra</strong>) can still be saved if blood flow returns quickly."},
   {table:{head:["","Ischemic stroke","Hemorrhagic stroke","TIA"],rows:[
    ["What happens","A <strong>clot blocks</strong> a vessel → tissue past the clot dies","A vessel <strong>ruptures and bleeds</strong> into or around the brain","<strong>Temporary</strong> ischemia; symptoms <strong>resolve</strong> completely (within 24 h, most within 1 h)"],
    ["Causes","<strong>Thrombosis</strong> (atherosclerosis in brain vessels), <strong>embolism</strong> (often from <strong>A-fib</strong>), <strong>unknown</strong>","<strong>Uncontrolled hypertension</strong>, aneurysm, AVM, trauma, anticoagulant use","Same as ischemic"],
