     ["Contraindications","<strong>Active bleeding</strong>; <strong>history of hemorrhagic stroke</strong>; recent ischemic stroke, <strong>head trauma, or major surgery</strong> (within about 2 weeks–3 months); <strong>uncontrolled hypertension</strong>; intracranial tumor/aneurysm; bleeding disorders or anticoagulant use; severe liver disease"],
     ["Nursing interventions","<strong>Review the chart and interview for contraindications first</strong>; baseline CBC, platelets, aPTT, type and crossmatch; two IV lines — <strong>don't mix with other IV drugs</strong>; frequent VS and <strong>neuro checks</strong>; <strong>minimize needle sticks</strong> (start lines first), pressure on puncture sites ≥30 minutes; bed rest; <strong>no anticoagulants or antiplatelets for 24 hours after tPA</strong> for stroke. Sudden severe headache, ↓ LOC, new deficits, or N/V → <strong>stop the infusion</strong> and notify (intracranial bleed)"],
     ["Patient education","Report headache, bleeding, or new weakness right away; bleeding precautions (electric razor, soft toothbrush); teach stroke signs — BE-FAST, call 911, note the time"]]}},
   {h:"Stroke Timing at a Glance"},
   {table:{head:["Step","Key point"],rows:[
     ["Last known well","Note the exact time of symptom onset — the clock starts here"],
     ["Blood glucose","Check first — hypoglycemia mimics stroke"],
     ["Non-contrast head CT","Must rule out bleeding before any thrombolytic"],
     ["tPA window","Within <strong>3 hours</strong>; up to <strong>4.5 hours</strong> for selected patients"],
     ["BP","Below 185/110 before tPA"],
     ["After tPA","No anticoagulant/antiplatelet for 24 hours; neuro checks; bleeding precautions"]]}},
   {hook:"<b>\"-ase\" erASEs the clot.</b> Antiplatelets and anticoagulants only <b>prevent</b> — thrombolytics <b>dissolve</b>. Before any \"-ase\": <b>Is there a bleed, a recent bleed risk, or a sky-high BP?</b>"},
   {hook:"Aspirin in an emergency: <strong>325, chewed</strong>. Aspirin every day: <strong>81</strong>."}
  ],
  check:{stem:"A client arrives 2 hours after the onset of left-sided weakness. Alteplase is being considered. Which finding is a contraindication?",
   options:["Blood glucose of 110 mg/dL","History of a hemorrhagic stroke 3 years ago","Takes atorvastatin daily","BP of 170/96"],
   answer:1,
   why:"A history of hemorrhagic stroke is a contraindication to thrombolytics. A BP below 185/110 is acceptable for tPA, a normal glucose rules out a hypoglycemic mimic, and statins don't affect eligibility."}
},
{ id:"m4-meds-statin-nitrate", title:"Statins &amp; Nitrates", kicker:"Atorvastatin, rosuvastatin, simvastatin, lovastatin — nitroglycerin and isosorbide",
  blocks:[
   {h:"Atorvastatin, Rosuvastatin, Simvastatin, Lovastatin — HMG-CoA Reductase Inhibitors (\"-statin\")"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","PO daily. <strong>High LDL/CAD</strong> — slows plaque buildup and lowers the risk of MI and stroke; given at discharge with CAD. Atorvastatin and rosuvastatin can be taken any time of day; <strong>simvastatin and lovastatin in the evening</strong> (cholesterol is made at night; lovastatin with the evening meal)"],
     ["Mechanism of action","Blocks HMG-CoA reductase, the liver enzyme that makes cholesterol → ↓ LDL and triglycerides, slight ↑ HDL; stabilizes plaque"],
     ["Adverse reactions","Serious: <strong>rhabdomyolysis</strong> — muscle breakdown (muscle pain/weakness, <strong>dark, tea-colored urine</strong>, ↑ CK, kidney injury); <strong>liver toxicity</strong> (↑ liver enzymes); ↑ blood glucose; GI upset, headache"],
     ["Contraindications","<strong>Pregnancy and breastfeeding</strong>; <strong>active liver disease</strong>; caution with heavy alcohol use and interacting drugs (e.g., gemfibrozil)"],
     ["Nursing interventions","Baseline and periodic <strong>liver enzymes</strong> and kidney function; lipid panel to track response; CK if muscle pain; assess for muscle pain and urine color"],
     ["Patient education","<strong>Report unexplained muscle pain, tenderness, or weakness and dark urine</strong>; report jaundice; limit alcohol; avoid large amounts of <strong>grapefruit juice</strong> (simvastatin, lovastatin, atorvastatin); keep up the low-cholesterol diet (DASH), exercise, and smoking cessation; contraception"]]}},
   {h:"Nitroglycerin (SL, Spray, Patch, Ointment, IV), Isosorbide Mononitrate/Dinitrate — Nitrates"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","<strong>Angina</strong> — SL tablet or spray for acute attacks (and before exertion); patch, ointment, and isosorbide PO for <strong>prevention</strong>; IV drip for recurring ischemia or unrelieved chest pain (titrated to pain and BP; <strong>usually not given if SBP is below 90</strong>; switched to PO or topical once symptom-free); heart failure add-on (isosorbide dinitrate + hydralazine)"],
     ["Mechanism of action","<strong>Vasodilator</strong> — mainly veins → ↓ preload (less blood returning to the heart); also dilates coronary arteries → ↓ O₂ demand and ↑ O₂ supply to the heart muscle"],
     ["Adverse reactions","<strong>Headache</strong> (common — means it's working; treat with acetaminophen), <strong>hypotension</strong>/orthostatic hypotension, dizziness, flushing, <strong>reflex tachycardia</strong>; tolerance with continuous use"],
     ["Contraindications","<strong>PDE5 inhibitors</strong> — sildenafil, vardenafil (within 24 h), tadalafil (within 48 h) → severe, possibly fatal hypotension; SBP below 90; head trauma/increased ICP"],
     ["Nursing interventions","<strong>Check BP before each dose</strong>; have the patient sit or lie down; <strong>SL: 1 tablet every 5 minutes, max 3</strong> — BP before each; notify the provider if pain isn't relieved after 3; IV: pump, continuous BP; patch/ointment: wear gloves, remove the old one, clean the site, rotate hairless sites; <strong>remove patches before defibrillation</strong> (burns/arcing)"],
     ["Patient education","Carry SL NTG at all times; keep it in the <strong>original amber glass bottle</strong>, tightly closed, away from light, heat, and moisture (not in a pocket against the body or in a hot car); <strong>renew the supply every 3–6 months</strong>; moisten the tablet with saliva and let it dissolve completely under the tongue — don't swallow it whole; take it <strong>before</strong> activities that cause angina; note how long relief takes (ideally within about 3 minutes); a slight sting may mean it's fresh. <strong>Take 1 tablet every 5 minutes, max 3; if the pain isn't relieved after 3 tablets (15 minutes), call 911</strong>. <strong>Never with sildenafil-type drugs</strong>; rise slowly; don't stop long-acting nitrates abruptly"]]}},
   {h:"Nitrate Forms"},
   {table:{head:["Form","How it's used","Key point"],rows:[
     ["SL tablet","Under the tongue at the first sign of angina","1 every 5 min, max 3; amber glass bottle"],
     ["Translingual spray","Sprayed onto or under the tongue","Don't inhale the spray; same 5-minute rule"],
     ["Transdermal patch","Once daily — <strong>on in the morning, off at bedtime</strong>","<strong>10–12-hour patch-free period</strong> prevents tolerance; rotate sites; remove before defibrillation"],
     ["Ointment","Measured on dose paper, spread on hairless skin, covered","Wear gloves; don't rub it in; remove the old dose"],
     ["IV drip","Titrated for unrelieved chest pain/HF","Continuous BP; infusion pump"],
     ["Isosorbide (PO)","Daily/BID prevention — not for an acute attack","Swallow extended-release whole"]]}},
   {hook:"<b>NTG rule: 1 – 5 – 3.</b> <b>1</b> tablet every <b>5</b> minutes, no more than <b>3</b> — pain still there after the third (15 minutes)? <b>Call 911.</b>"},
   {hook:"Nitrates need a <b>night off</b> — the patch-free period keeps them working. And <b>\"Viagra + NTG = BP drops to zero.\"</b>"},
   {hook:"Statins: <b>\"Sore muscles + cola-colored pee = stop and call.\"</b>"}
  ],
  check:{stem:"A client with angina asks how to store his sublingual nitroglycerin. Which response is correct?",
   options:["Keep a few tablets loose in your shirt pocket so they're always handy","Keep them in the original amber glass bottle, tightly closed, away from heat and light","Store them in the refrigerator in a plastic pill organizer","Keep them in the glove compartment of your car"],
   answer:1,
   why:"Nitroglycerin breaks down with light, heat, moisture, and air, so it stays in the original amber glass bottle, tightly capped. Body heat in a pocket, plastic organizers, and hot cars all degrade it."}
},
{ id:"m4-meds-hf", title:"Other Heart Failure Drugs", kicker:"SGLT2 inhibitors, diuretics recap, and digoxin as an add-on",
  blocks:[
   {p:"HF drug therapy builds in layers: <strong>lifestyle + SGLT2 inhibitor</strong> → <strong>ACE inhibitor, beta blocker, statin</strong> → <strong>ARNI and a diuretic</strong> (potassium-sparing to start) → devices/IV therapy. <strong>Nitrates and digoxin</strong> can be added, or used when an ACE inhibitor/ARB/ARNI isn't tolerated."},
   {h:"Dapagliflozin (Farxiga), Empagliflozin (Jardiance) — SGLT2 Inhibitors (\"-gliflozin\")"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","PO once daily. Type 2 diabetes — and <strong>heart failure (both HFrEF and HFpEF), with or without diabetes</strong>; also CKD. Fewer HF hospitalizations and deaths"],
     ["Mechanism of action","Blocks glucose and sodium reabsorption in the kidney tubules → glucose and sodium leave in the urine → mild diuresis, ↓ preload and afterload, ↓ BP"],
     ["Adverse reactions","<strong>Genital yeast infections</strong> and <strong>UTIs</strong> (sugar in the urine); <strong>volume depletion</strong> — dehydration, dizziness, orthostatic hypotension; <strong>ketoacidosis</strong> (can occur with a near-normal glucose); hypoglycemia if combined with insulin/sulfonylureas"],
     ["Contraindications","Type 1 diabetes/history of DKA; dialysis/severe kidney failure; caution with volume depletion"],
     ["Nursing interventions","Monitor BP, I&amp;O, weight, kidney function, and glucose; assess for dehydration; <strong>hold before surgery</strong> (usually about 3 days, as ordered) and <strong>when the client is NPO/not eating or acutely ill</strong>; urine glucose will be positive (expected)"],
     ["Patient education","Good genital hygiene; report itching, discharge, burning with urination; stay hydrated; <strong>sick-day rule — skip it when vomiting or not eating</strong> and call the provider; report nausea, vomiting, abdominal pain, unusual fatigue, or trouble breathing (ketoacidosis) even if the glucose is normal"]]}},
   {h:"Furosemide (Lasix) — Loop Diuretic (recap)"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","PO/IV. <strong>Fluid overload</strong> in HF — pulmonary edema, peripheral edema, weight gain. Give IV slowly. Acts fast and strong"],
     ["Mechanism of action","Blocks sodium and chloride reabsorption in the loop of Henle → water follows → ↓ preload; <strong>potassium is lost</strong>"],
     ["Adverse reactions","<strong>Hypokalemia</strong> (→ dysrhythmias, digoxin toxicity), dehydration, orthostatic hypotension, ototoxicity (rapid IV push)"],
     ["Contraindications","Anuria; sulfa allergy (caution)"],
     ["Nursing interventions","<strong>Monitor K⁺ (3.5–5.5)</strong>, BP, daily weight, I&amp;O, lung sounds, edema"],
     ["Patient education","Take it in the morning; potassium-rich foods; <strong>daily weights — report 2–3 lb in a day or 5 lb in a week</strong>; rise slowly"]]}},
   {h:"Spironolactone (Aldactone), Eplerenone — Potassium-Sparing Diuretic / Mineralocorticoid Receptor Antagonist (MRA)"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","PO daily. HF (HFrEF) — reduces hospitalizations and death; the <strong>diuretic to start</strong> in the HF layer; often paired with a loop diuretic"],
     ["Mechanism of action","Blocks <strong>aldosterone</strong> → sodium and water out, <strong>potassium kept</strong>; reduces fibrosis/remodeling of the heart"],
     ["Adverse reactions","<strong>Hyperkalemia</strong>; gynecomastia (spironolactone); kidney impairment"],
     ["Contraindications","Hyperkalemia; severe kidney failure"],
     ["Nursing interventions","<strong>Monitor K⁺ closely</strong>, especially with ACE inhibitors, ARBs, or an ARNI (they also raise K⁺); kidney function; ECG changes (peaked T waves)"],
     ["Patient education","<strong>No salt substitutes</strong> or potassium supplements; don't overdo high-potassium foods; report muscle weakness or an irregular heartbeat"]]}},
   {h:"Digoxin (Lanoxin) — Cardiac Glycoside (add-on)"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","PO daily (IV available). <strong>Add-on</strong> for HF symptoms and for rate control in A-fib. Improves symptoms and hospitalizations, not survival. Lower doses in older adults and kidney impairment (renally excreted)"],
     ["Mechanism of action","<strong>Increases contractility</strong> (stronger squeeze → ↑ cardiac output) and <strong>slows the heart rate</strong>/AV conduction"],
     ["Adverse reactions","<strong>Toxicity</strong> — anorexia, <strong>nausea/vomiting</strong>, diarrhea; <strong>vision changes</strong> (blurred, yellow-green <strong>halos</strong>); confusion, fatigue; bradycardia and <strong>dysrhythmias</strong>"],
     ["Contraindications","Bradycardia/heart block; V-fib; digoxin toxicity"],
     ["Nursing interventions","<strong>Apical pulse for a full minute before each dose — hold if below 60</strong> and notify; monitor <strong>K⁺</strong> (<strong>hypokalemia raises toxicity</strong> — watch with loop diuretics), digoxin level (therapeutic about 0.5–2.0 ng/mL), kidney function. <strong>Antidote: digoxin immune Fab (DigiFab)</strong>"],
     ["Patient education","Take your pulse daily — call if below 60; report nausea, appetite loss, or visual halos; don't switch brands or take antacids at the same time; eat potassium-rich foods if on a loop diuretic"]]}},
   {hook:"<b>SGLT2 = Sugar Goes Through To the Toilet</b> — so expect <b>yeast/UTIs</b> and <b>dehydration</b>, and <b>hold it when not eating</b>."},
   {hook:"Digoxin: <b>pulse below 60 — don't give it.</b> <b>Low K⁺ = high dig toxicity.</b> Toxic clues: <b>N/V + halos + slow/irregular rhythm.</b>"}
  ],
  check:{stem:"A client with HF takes digoxin and furosemide. Today the client reports nausea and seeing yellow halos around lights. Which lab value should the nurse check first?",
   options:["Sodium","Potassium","Hemoglobin","Calcium"],
   answer:1,
   why:"Nausea and visual halos are signs of digoxin toxicity, and furosemide causes hypokalemia, which increases the risk of digoxin toxicity. Potassium is the priority lab, along with a digoxin level."}
},
{ id:"m4-meds-blood", title:"Anemia Supplements &amp; Blood Drugs", kicker:"Iron, folic acid, vitamin B12, epoetin alfa, hydroxyurea, and clotting factors VIII and IX",
  blocks:[
   {p:"Iron, folic acid, and vitamin B12 all help the body build healthy red blood cells. <strong>Clients with anemia are advised to take ALL three supplements — no matter which deficiency they have.</strong> Pair them with an RBC-building diet: red meat and organ meat, dark leafy greens, beans, fortified cereals, and citrus with iron."},
   {h:"Ferrous Sulfate (and Other Iron Products) — Iron Supplement"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","PO (tablet or liquid) — iron deficiency and anemia; may be increased gradually from 1 tablet/day to 2–3 divided doses to reduce GI upset. IV iron when stores are very low or oral iron isn't tolerated; IM iron is given by <strong>Z-track</strong>. Continue for months — until iron stores are refilled, even after fatigue improves"],
     ["Mechanism of action","Replaces the iron needed to make hemoglobin"],
     ["Adverse reactions","<strong>Constipation</strong>, nausea, cramping, GI upset; <strong>dark/black stools (expected)</strong>; liquid iron stains the teeth; IV/IM iron — anaphylaxis risk"],
     ["Contraindications","Iron overload (e.g., hemochromatosis, repeated transfusions); hemolytic anemia without iron loss"],
     ["Nursing interventions","Give on an <strong>empty stomach</strong> (1 hour before or 2 hours after a meal) if tolerated; with food only if GI upset is severe (less absorbed); <strong>not with milk, dairy, or antacids</strong>; separate from other meds as directed; IM by Z-track; watch for anaphylaxis with parenteral iron; monitor Hgb/Hct"],
     ["Patient education","Take with <strong>orange juice/vitamin C</strong> (better absorption); stools will be dark or black; eat high-fiber foods and drink fluids (stool softener if needed); <strong>liquid iron through a straw</strong> or with the spoon at the back of the mouth, then rinse; keep out of reach of children (iron overdose is dangerous)"]]}},
   {h:"Folic Acid (Folate) — Vitamin B9"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","PO, typically <strong>1 mg daily</strong> (IM if malabsorption). Folic-acid deficiency anemia, alcohol use (continue as long as drinking continues), pregnancy, <strong>sickle cell disease</strong> (daily — high RBC turnover)"],
     ["Mechanism of action","Needed for DNA synthesis and normal RBC maturation"],
     ["Adverse reactions","Rare — mild GI upset, allergic reaction"],
     ["Contraindications","Folic acid alone can correct the anemia of B12 deficiency while the nerve damage keeps progressing — one reason to give <strong>B12 along with it</strong>"],
     ["Nursing interventions","Monitor CBC; assess diet and alcohol use"],
     ["Patient education","Foods: dark leafy greens, beans, citrus, fortified cereals/breads; limit alcohol"]]}},
   {h:"Cyanocobalamin — Vitamin B12"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","<strong>PO, IM, or intranasal</strong>. Dietary deficiency (e.g., strict vegan diets) → oral supplements/fortified foods. <strong>Pernicious anemia</strong> (no intrinsic factor, so B12 can't be absorbed from the gut) → typically <strong>monthly IM injections for life</strong> (very high oral doses or nasal spray/gel are alternatives)"],
     ["Mechanism of action","Needed for RBC maturation and healthy nerves (myelin)"],
     ["Adverse reactions","Rare — injection-site pain, mild diarrhea, itching; hypokalemia early in treatment of severe deficiency"],
     ["Contraindications","Cobalt/B12 allergy"],
     ["Nursing interventions","Teach self- or family injection; monitor CBC (reticulocytes rise within about a week); assess neuro symptoms (numbness/tingling, balance) — nerve recovery is slower and may be incomplete"],
     ["Patient education","<strong>Pernicious anemia means lifelong B12</strong> — stopping lets the anemia and nerve damage return; foods: meat, eggs, dairy, fortified cereals/soy milk"]]}},
   {h:"Epoetin Alfa (Epogen, Procrit) — Erythropoiesis-Stimulating Agent"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","SubQ or IV, 1–3 times weekly. <strong>Anemia of CKD</strong> — replaces the erythropoietin the failing kidneys no longer make; also chemotherapy-related anemia"],
     ["Mechanism of action","Stimulates the bone marrow to make red blood cells"],
     ["Adverse reactions","<strong>Hypertension</strong>; <strong>blood clots</strong> — stroke, MI, DVT (black box); seizures; headache"],
     ["Contraindications","<strong>Uncontrolled hypertension</strong>"],
     ["Nursing interventions","Monitor <strong>BP and Hgb</strong>; <strong>hold and notify if Hgb is above about 10–11 g/dL</strong> (clot/stroke risk); check iron levels — iron is needed for it to work; don't shake the vial"],
     ["Patient education","Hgb rises gradually over weeks; take iron supplements as ordered; check BP; report headache, chest pain, or a swollen, painful leg"]]}},
   {h:"Hydroxyurea (Droxia, Hydrea) — Antimetabolite for Sickle Cell Disease"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","PO daily (capsule — don't open or crush). <strong>Sickle cell disease</strong> — fewer pain crises, less acute chest syndrome, fewer transfusions; may lower stroke risk. Full benefit takes months"],
     ["Mechanism of action","Raises <strong>fetal hemoglobin (HbF)</strong>, which doesn't sickle → fewer sickled cells and less adhesion to vessel walls"],
     ["Adverse reactions","<strong>Bone marrow suppression</strong> (↓ WBC, platelets, RBCs → infection, bleeding); <strong>teratogenic</strong>; possible infertility; risk of later malignancy; mouth sores, hair thinning, skin/nail darkening"],
     ["Contraindications","<strong>Pregnancy</strong>/breastfeeding; severe bone marrow suppression (<strong>hold if WBC or platelets are too low</strong>)"],
     ["Nursing interventions","<strong>CBC with WBC and platelets</strong> regularly; hazardous drug — <strong>wear gloves</strong> (chemo precautions); assess for infection and bleeding"],
     ["Patient education","Report fever, sore throat, unusual bleeding/bruising; <strong>reliable contraception</strong> (men and women); caregivers wear gloves when handling; regular lab draws; sun protection; no live vaccines without approval; stay hydrated; take exactly as prescribed"]]}},
   {h:"Factor VIII and Factor IX Concentrates — Clotting Factor Replacement"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","<strong>IV</strong>. <strong>Hemophilia A → factor VIII; hemophilia B → factor IX</strong> (recombinant products are common). Given at the first sign of a bleed, before procedures/dental work, and prophylactically several times a week (especially children — protects the joints). Patients/families learn to give it <strong>at home</strong>. Desmopressin may be used for mild hemophilia A"],
     ["Mechanism of action","Replaces the missing clotting factor so a normal clot can form"],
     ["Adverse reactions","Allergic/infusion reactions; <strong>inhibitors</strong> (antibodies) that make the factor stop working; rarely, clots"],
     ["Contraindications","Known allergy to the product (or its components)"],
     ["Nursing interventions","Give early in a bleed; IV technique — no IM injections; assess bleeding, joints (pain, swelling, warmth), and response; report if bleeding doesn't respond (possible inhibitor)"],
     ["Patient education","Home infusion: aseptic technique, correct mixing, safe sharps disposal; infuse at the first sign of a joint bleed (tingling, warmth, stiffness); keep an infusion log; medical ID; no aspirin/NSAIDs; soft toothbrush, electric razor; avoid contact sports"]]}},
   {h:"Which Drug for Which Blood Problem?"},
   {table:{head:["Problem","Drug","Must-know"],rows:[
     ["Any nutritional anemia","Iron + folic acid + B12","Take <strong>all</strong> of them"],
     ["Pernicious anemia","Cyanocobalamin","Lifelong (monthly IM)"],
     ["Anemia of CKD","Epoetin alfa","Hold if Hgb above ~10–11; HTN, clots"],
     ["Sickle cell disease","Hydroxyurea (+ folic acid)","↑ HbF; CBC; contraception; gloves"],
     ["Hemophilia A / B","Factor VIII / factor IX","IV, often at home"]]}},
   {hook:"<b>Iron rules:</b> <b>empty</b> stomach, <b>orange</b> juice, <b>no milk or antacids</b>, <b>dark stools are expected</b>, liquid through a <b>straw</b>."},
   {hook:"<b>A</b> comes before <b>B</b> and <b>8</b> comes before <b>9</b> — hemophilia <b>A = factor VIII</b>, hemophilia <b>B = factor IX</b>."}
  ],
  check:{stem:"A client with iron-deficiency anemia is prescribed ferrous sulfate. Which statement shows the teaching was effective?",
   options:["\"I'll take it with a glass of milk to protect my stomach.\"","\"I'll call the clinic if my stools turn dark.\"","\"I'll take it with orange juice an hour before breakfast.\"","\"I'll take it with my antacid so it doesn't upset my stomach.\""],
   answer:2,
   why:"Iron is best absorbed on an empty stomach with vitamin C (orange juice). Milk and antacids decrease absorption, and dark stools are an expected effect."}
}
]};

const MED_MATH = {"title": "Med Math", "sub": "", "lessons": [{"id": "mathdose", "title": "Dosage Calculations & Basic Conversions", "kicker": "The building blocks every other calculation relies on", "blocks": [{"p": "Before any drip rate or weight-based dose can be calculated, you need to be fluent in the basic conversions underneath them — pounds to kilograms, and the metric ladder from kilograms down to micrograms. Almost every calculation error in practice traces back to a mistake at this level, not the fancier formula built on top of it."}, {"h": "Basic Dosage Calculation"}, {"p": "<strong>Formula:</strong> (Desired ÷ Have) × Quantity = Amount to administer"}, {"p": "<strong>Worked example:</strong> Order is 500 mg PO; available as 250 mg tablets. (500 ÷ 250) × 1 tablet = <strong>2 tablets</strong>."}, {"p": "<strong>Worked example 2:</strong> Order is 2 mg lorazepam; available as a 4 mg/mL vial. (2 ÷ 4) × 1 mL = <strong>0.5 mL</strong>."}, {"h": "Weight Conversions"}, {"table": {"head": ["Conversion", "Formula", "Example"], "rows": [["Pounds → kilograms", "lbs ÷ 2.2 = kg", "154 lbs ÷ 2.2 = 70 kg"], ["Kilograms → pounds", "kg × 2.2 = lbs", "100 kg × 2.2 = 220 lbs"]]}}, {"hook": "Almost every weight-based drug calculation in this unit starts with converting the patient's weight to kilograms — if that first conversion is wrong, every step after it is wrong too, even if the rest of the math is done perfectly. This matters directly in this module for weight-based pediatric dosing (ADHD/ASD medications) and for BSA-based chemotherapy dosing."}, {"h": "Metric System Conversions — the 1000 rule"}, {"p": "Standard medical units (kg, g, mg, mcg) are each separated from their neighbor by a factor of 1000."}, {"table": {"head": ["Direction", "Rule", "Example"], "rows": [["Larger → smaller (kg→g, g→mg, mg→mcg)", "Multiply by 1000 (move the decimal 3 places right)", "2 g × 1000 = 2000 mg"], ["Smaller → larger (mcg→mg, mg→g, g→kg)", "Divide by 1000 (move the decimal 3 places left)", "2500 mcg ÷ 1000 = 2.5 mg"]]}}, {"h": "Volume Conversions"}, {"table": {"head": ["Conversion", "Formula", "Example"], "rows": [["Milliliters → liters", "mL ÷ 1000 = L", "2500 mL ÷ 1000 = 2.5 L"], ["Liters → milliliters", "L × 1000 = mL", "0.5 L × 1000 = 500 mL"]]}}, {"h": "Household & Volume Equivalents"}, {"table": {"head": ["Household/Metric", "Equivalent"], "rows": [["1 teaspoon (tsp)", "5 mL"], ["1 tablespoon (tbsp)", "15 mL (or 3 tsp)"], ["1 ounce (oz)", "30 mL (or 2 tbsp)"], ["1 cup", "240 mL (8 oz)"], ["1 quart (approx.)", "1000 mL (1 L)"]]}}]}, {"id": "mathiv", "title": "IV Flow Rates, Drip Rates & Concentration", "kicker": "Getting fluid and medication into the vein at the right speed", "blocks": [{"p": "These formulas answer one of two questions: how fast should this infusion pump run (mL/hr), or how many drops per minute should a gravity IV be set to (gtt/min) when there's no pump involved? A third formula, concentration, sets up weight-based drip calculations."}, {"h": "Flow Rate / Infusion Rate (mL/hr) — for infusion pumps"}, {"p": "<strong>Formula:</strong> Total Volume (mL) ÷ Total Time (hr) = mL/hr"}, {"p": "<strong>Worked example:</strong> Infuse 1000 mL of Normal Saline over 8 hours. 1000 ÷ 8 = <strong>125 mL/hr</strong>."}, {"h": "Infusion Time — working backward from a known rate"}, {"p": "<strong>Formula:</strong> Total Volume (mL) ÷ Flow Rate (mL/hr) = Time (hours)"}, {"p": "<strong>Worked example:</strong> A 1000 mL bag is infusing at 125 mL/hr. How long will it last? 1000 ÷ 125 = <strong>8 hours</strong>."}, {"h": "Drip Rate (gtt/min) — for gravity IV tubing without a pump"}, {"p": "There are two equivalent ways to reach the same answer, depending on whether you already know the mL/hr rate or are starting from the total order."}, {"table": {"head": ["Starting point", "Formula"], "rows": [["You already know mL/hr", "(mL/hr ÷ 60) × Drop Factor (gtt/mL) = gtt/min"], ["You're starting from the total order", "(Total Volume [mL] × Drop Factor [gtt/mL]) ÷ Time (minutes) = gtt/min"]]}}, {"p": "<strong>Worked example (method 1):</strong> Infuse at 125 mL/hr using tubing with a drop factor of 15 gtt/mL. First, mL/min: 125 ÷ 60 = 2.08 mL/min. Then: 2.08 × 15 = 31.2, rounded to <strong>31 gtt/min</strong>."}, {"p": "<strong>Worked example (method 2):</strong> Infuse 1000 mL over 8 hours (480 minutes) with a drop factor of 15 gtt/mL. (1000 × 15) ÷ 480 = 15,000 ÷ 480 = 31.25, rounded to <strong>31 gtt/min</strong> — the same answer either way."}, {"h": "IV Push Medication Rate"}, {"p": "A common general safety rule for IV push medications is roughly <strong>1 mL per minute</strong> unless the drug's specific administration guidelines say otherwise. <strong>Worked example:</strong> a 10 mL medication is administered over 10 minutes, consistent with the 1 mL/min rule. Pushing too fast is a common cause of adverse drug reactions — relevant here for IV push benzodiazepines (e.g., lorazepam for agitation/status epilepticus) and IV antihistamines."}, {"h": "Concentration Calculation — the setup step for weight-based drips"}, {"p": "<strong>Formula:</strong> (Total mg in the bag × 1000) ÷ Total mL in the bag = Concentration (mcg/mL)"}, {"p": "<strong>Worked example:</strong> A bag contains 400 mg of a drug in 250 mL of D5W. (400 × 1000) ÷ 250 = <strong>1600 mcg/mL</strong>."}]}, {"id": "mathcardiac", "title": "Cardiac & Vasoactive Drip Calculations", "kicker": "MAP, CPP, and weight-/unit-based infusions", "blocks": [{"p": "This lesson groups together the calculations that show up most often in critical care and high-alert medication administration — all of them either measure perfusion pressure directly, or calculate the pump rate for a drug that manipulates that pressure. Relevant here for a client in delirium tremens, an oncology patient in septic shock, or any client on a high-alert IV drip."}, {"h": "MAP — Mean Arterial Pressure"}, {"p": "<strong>Formula:</strong> (Systolic BP + [2 × Diastolic BP]) ÷ 3 = MAP"}, {"p": "<strong>Worked example:</strong> BP is 120/80. (120 + [2 × 80]) ÷ 3 = (120 + 160) ÷ 3 = <strong>93.3 mmHg</strong>."}, {"p": "MAP reflects the average pressure driving blood into the organs across the whole cardiac cycle — it's weighted toward diastole because the heart spends more time in diastole than systole. A MAP of roughly <strong>65 mmHg or higher</strong> is generally considered necessary to maintain adequate organ perfusion in a critically ill patient."}, {"h": "CPP — Cerebral Perfusion Pressure"}, {"p": "<strong>Formula:</strong> MAP − ICP = CPP"}, {"p": "<strong>Worked example:</strong> MAP is 93, ICP is 15. 93 − 15 = <strong>78 mmHg</strong>."}, {"hook": "CPP depends directly on MAP — if you already calculated MAP for a patient, you're one subtraction away from CPP. A CPP that drops too low (generally below ~60 mmHg) risks cerebral ischemia, which is why both numbers are tracked together in a patient with a head injury or elevated ICP."}, {"h": "Weight-Based Infusion (mcg/kg/min)"}, {"p": "<strong>Formula:</strong> (Desired mcg × kg × 60 minutes) ÷ Concentration (mcg/mL) = mL/hr"}, {"p": "<strong>Worked example:</strong> Order is 5 mcg/kg/min for an 80 kg patient, with a concentration of 1600 mcg/mL (from the concentration calculation in the previous lesson). (5 × 80 × 60) ÷ 1600 = <strong>15 mL/hr</strong>."}, {"h": "Units-Based Infusion (Units/kg/hr) — e.g., Heparin"}, {"p": "<strong>Formula:</strong> (Units × kg) ÷ Concentration (Units/mL) = mL/hr"}, {"p": "<strong>Worked example:</strong> Order is 12 Units/kg/hr for a 100 kg patient, with a concentration of 100 Units/mL. (12 × 100) ÷ 100 = <strong>12 mL/hr</strong>."}, {"hook": "Both weight-based and units-based drips are high-alert medications given by infusion pump only — the shared theme across every high-alert drug is a computerized pump, frequent reassessment, and a clear plan for what triggers stopping or adjusting the rate."}]}, {"id": "mathfluid", "title": "Fluid Balance, I&O & Tonicity", "kicker": "Tracking what goes in, what comes out, and what IV fluids do to cells", "blocks": [{"p": "Intake and output tracking is really just accounting for fluid — but a couple of categories have special rules that are easy to get wrong, and tonicity explains why the choice of IV fluid itself matters beyond just the volume. This is directly relevant to fluid management in cancer/chemotherapy patients, HIV/AIDS patients with diarrhea or wasting, and any client receiving IV psychiatric medications."}, {"h": "What counts as intake"}, {"list": ["<strong>Oral (PO) fluids</strong> — water, juice, soda, milk, coffee", "<strong>Liquid foods</strong> — soups, broths, gelatin, sherbet, sorbet, pudding", "<strong>Ice chips</strong> — recorded as <strong>half</strong> the original volume (200 mL of ice chips = 100 mL intake), since ice chips are mostly air/space between solid pieces", "<strong>IV fluids</strong> — maintenance fluids, boluses, and piggyback medications (like antibiotics)", "<strong>Tube feedings</strong> — formula and water flushes (relevant for a client with anorexia nervosa on enteral nutritional rehabilitation)"]}, {"h": "What counts as output"}, {"list": ["Urine — voided, catheterized, or urostomy drainage", "Emesis (vomitus) — relevant for a client with bulimia or chemotherapy-induced nausea", "Liquid stool — diarrhea or colostomy drainage", "Wound drainage — from JP drains, Hemovacs, or chest tubes", "Suction — gastric (NG) or respiratory"]}, {"h": "Net Fluid Balance"}, {"p": "<strong>Formula:</strong> Total Intake − Total Output = Net Balance"}, {"p": "<strong>Worked example:</strong> Intake of 3000 mL, output of 800 mL. 3000 − 800 = <strong>+2200 mL</strong> (a positive balance, meaning the patient is retaining more fluid than they're losing)."}, {"h": "Insensible Loss"}, {"p": "Fluid lost through the skin and lungs that can't be directly measured. Standard estimate: <strong>600–900 mL/day</strong>, or roughly <strong>0.5 mL/kg/hr</strong>. <strong>Worked example:</strong> a 70 kg patient: 0.5 × 70 = 35 mL/hr, or roughly 840 mL/day."}, {"h": "Fluid Weight Calculation"}, {"p": "<strong>Rule of thumb:</strong> a 1 kg weight change equals roughly 1 L of fluid change. <strong>Worked example:</strong> a patient's weight rises 2 kg over two days — that's roughly a 2 L fluid gain, not necessarily 2 kg of actual tissue."}, {"hook": "An output under <b>30 mL/hr</b> is always reported as a potential emergency — it signals inadequate perfusion to the kidneys."}, {"h": "Tonicity — what different IV fluids do to cells"}, {"table": {"head": ["Type", "Solute concentration vs. inside the cell", "Effect on the cell", "Examples", "Clinical use"], "rows": [["Hypertonic", "Higher outside the cell", "Water leaves the cell — it shrinks (plasmolysis)", "3% or 5% NaCl; 10% Dextrose in Water", "Cerebral edema, severe hyponatremia"], ["Hypotonic", "Lower outside the cell", "Water enters the cell — it swells or bursts (cytolysis)", "0.45% NaCl (half normal saline)", "Dehydration — pushes water back into cells"], ["Isotonic", "Equal inside and outside", "No net water movement — equilibrium maintained", "0.9% Normal Saline, Lactated Ringer's, D5W", "Routine IV fluid replacement and hydration"]]}}, {"hook": "A simple way to remember the direction: <b>hyper</b>tonic pulls water <b>OUT</b> of the cell (think 'hyper' = high solute outside, pulling water toward it), while <b>hypo</b>tonic pushes water <b>IN</b>. Isotonic is the 'do no harm' default fluid."}]}, {"id": "mathbody", "title": "Body Measurement: BMI & BSA", "kicker": "Calculations that scale a dose — or a diagnosis — to the patient's size", "blocks": [{"p": "These two calculations both answer a version of the same question — how big is this patient, in a way that's useful for dosing or risk assessment? BMI is a general screening number used constantly in this module's eating-disorder content; BSA is a more precise scaling factor used specifically for chemotherapy dosing in the Cancer unit."}, {"h": "BMI — Body Mass Index"}, {"table": {"head": ["System", "Formula"], "rows": [["Metric", "Weight (kg) ÷ [Height (m)]²"], ["Imperial", "[Weight (lbs) × 703] ÷ [Height (in)]²"]]}}, {"p": "<strong>Worked example (metric):</strong> Weight 70 kg, height 1.75 m. Square the height: 1.75 × 1.75 = 3.0625. Divide weight by that: 70 ÷ 3.0625 = <strong>22.86</strong> (normal weight range)."}, {"p": "<strong>Worked example (imperial):</strong> Weight 154 lbs, height 69 inches. 154 × 703 = 108,262. Square the height: 69 × 69 = 4,761. Divide: 108,262 ÷ 4,761 = <strong>22.74</strong> — the same result as the metric calculation, just arrived at with different starting units."}, {"hook": "This is exactly the calculation behind the BMI thresholds in the Anorexia Nervosa lesson: a BMI under 17 is a diagnostic marker of the disorder, and under 15 is considered extreme/life-threatening. Knowing how to compute BMI from a height and weight given in a case stem — not just recognize the threshold — is testable on its own."}, {"h": "BSA — Body Surface Area"}, {"p": "BSA approximates a patient's total skin surface area in square meters (m²), and it's used specifically for drugs with a narrow therapeutic index, chemotherapy agents, pediatric patients, and burn patients — situations where a small dosing error has an outsized effect. This is the calculation behind chemotherapy dosing in the Cancer unit."}, {"p": "<strong>Formula:</strong> BSA = √[(Height in cm × Weight in kg) ÷ 3600]"}, {"h": "Fully worked pediatric dosing example"}, {"p": "Order: a chemotherapy agent at 2 mg/m². Patient: 37 lb, 97 cm tall. Supply: 1 mg/mL."}, {"list": ["<strong>Step 1 — convert weight to kg:</strong> 37 lb ÷ 2.2 = 16.8 kg", "<strong>Step 2 — calculate BSA:</strong> √[(97 cm × 16.8 kg) ÷ 3600] = √[1629.6 ÷ 3600] = √0.4527 = <strong>0.67 m²</strong>", "<strong>Step 3 — calculate the dose in mg:</strong> 2 mg/m² × 0.67 m² = <strong>1.34 mg</strong>", "<strong>Step 4 — calculate the dose in mL:</strong> 1.34 mg ÷ 1 mg/mL = <strong>1.34 mL</strong> to administer"]}, {"hook": "Notice this whole calculation depends on the weight-to-kg conversion from the first Med Math lesson — get that first step wrong, and every subsequent step (BSA, mg dose, mL dose) inherits the error."}]}, {"id": "m3math-renal", "title": "Renal Math: Urine Output, Fluid Restriction & Daily Weights", "kicker": "The calculations behind the AKI, CKD, and fluid-balance lessons", "blocks": [{"h": "Hourly Urine Output (mL/kg/hr)"}, {"p": "<strong>Formula:</strong> Urine output (mL) ÷ Hours ÷ Weight (kg) = mL/kg/hr. The minimum acceptable adult output is about <strong>0.5 mL/kg/hr</strong> (roughly 30 mL/hr)."}, {"p": "<strong>Minimum for a given client:</strong> Weight (kg) × 0.5 = minimum mL/hr. A 70 kg client needs at least 70 × 0.5 = <strong>35 mL/hr</strong>."}, {"p": "<strong>Worked example:</strong> An 80 kg client voids 200 mL over 8 hours. 200 ÷ 8 = 25 mL/hr; 25 ÷ 80 = <strong>0.31 mL/kg/hr</strong> — below 0.5, so it's reported as an early warning of AKI."}, {"h": "24-Hour Output — naming the problem"}, {"table": {"head": ["24-hour urine output", "Term"], "rows": [["Less than 400–500 mL", "<strong>Oliguria</strong> (the oliguric phase of AKI: below 400 mL/day)"], ["Less than 50 mL", "<strong>Anuria</strong>"], ["4–5 L/day", "<strong>Diuretic phase</strong> of AKI — watch for fluid volume deficit"], ["More than 3 L/day after an obstruction is relieved", "<strong>Postobstructive diuresis</strong>"]]}}, {"h": "Fluid Restriction"}, {"p": "<strong>Formula:</strong> Previous 24-hour urine output + about 500–600 mL (insensible losses) = Fluid allowance for the next 24 hours. (Some references use 500–800 mL.)"}, {"p": "<strong>Worked example:</strong> A client in the oliguric phase put out 350 mL of urine yesterday. 350 + 500 = 850 mL to 350 + 600 = 950 mL — a fluid allowance of about <strong>850–950 mL</strong> for today."}, {"hook": "The fluid allowance is spread across all 24 hours — with sips, ice chips, and frequent mouth care for thirst — and it has to include the fluid used to take medications."}, {"h": "Daily Weights — 1 kg = 1 L"}, {"p": "<strong>Rule:</strong> a 1 kg weight change equals about 1 L of fluid (about 2.2 lb per liter). Weigh at the same time, on the same scale, in the same clothing."}, {"p": "<strong>Worked example:</strong> Yesterday 72.0 kg; today 74.5 kg. 74.5 − 72.0 = 2.5 kg = about <strong>2.5 L of retained fluid</strong>."}, {"p": "<strong>Worked example (pounds):</strong> A weight gain of 4.4 lb ÷ 2.2 = 2 kg = about <strong>2 L</strong> of fluid."}, {"h": "BUN:Creatinine Ratio"}, {"p": "<strong>Formula:</strong> BUN ÷ Creatinine. Normal is about 10:1 to 20:1; <strong>above 20:1</strong> points toward a <strong>prerenal</strong> cause (dehydration, low perfusion)."}, {"table": {"head": ["BUN", "Creatinine", "Ratio", "Points toward"], "rows": [["48 mg/dL", "1.2 mg/dL", "48 ÷ 1.2 = 40:1", "Prerenal — BUN rising out of proportion (dehydration)"], ["80 mg/dL", "8.0 mg/dL", "80 ÷ 8 = 10:1", "Intrarenal or postrenal — both rising together"]]}}, {"h": "Phosphate Binder Dose per Meal (Sevelamer)"}, {"p": "<strong>Formula:</strong> Total daily dose ÷ Number of meals the client actually eats = Dose per meal"}, {"p": "<strong>Worked example:</strong> Sevelamer 4,800 mg/day. Three meals a day: 4,800 ÷ 3 = <strong>1,600 mg with each meal</strong>. The same client skips breakfast and eats 2 meals: 4,800 ÷ 2 = <strong>2,400 mg with each meal</strong>."}, {"hook": "The number of meals comes from the client's eating pattern, not a standard schedule — fewer meals means a <b>bigger</b> dose with each meal. And no meal, no binder."}, {"h": "Maximum-Rate Problems"}, {"p": "<strong>Formula:</strong> Dose (mg) ÷ Maximum rate (mg/min) = Minimum time (minutes)"}, {"p": "<strong>Worked example:</strong> High-dose IV furosemide is infused no faster than <strong>4 mg/min</strong> (ototoxicity). For a 120 mg dose: 120 ÷ 4 = <strong>30 minutes minimum</strong>."}, {"hook": "Rapid IV furosemide is what causes the tinnitus and hearing loss — if the math says 30 minutes, it never goes in faster, even when the client is fluid overloaded."}, {"h": "Net Fluid Balance"}, {"p": "<strong>Formula:</strong> Total Intake − Total Output = Net Balance"}, {"p": "<strong>Worked example:</strong> Intake: PO 600 mL + IV 900 mL + ice chips 200 mL (counts as 100 mL) = 1,600 mL. Output: urine 450 mL + emesis 150 mL = 600 mL. 1,600 − 600 = <strong>+1,000 mL</strong> — a positive balance (fluid retention)."}]}, {"id": "m3math-dialysis", "title": "Dialysis Fluid Math: Hemodialysis, PD & CRRT", "kicker": "How much fluid came off — and how to count it", "blocks": [{"h": "Hemodialysis — Fluid Removal Goal"}, {"p": "<strong>Formula:</strong> Pre-dialysis weight − Dry (target) weight = Fluid to remove (1 kg = 1 L)"}, {"p": "<strong>Worked example:</strong> Pre-dialysis weight 78.4 kg; dry weight 76.0 kg. 78.4 − 76.0 = 2.4 kg = about <strong>2.4 L</strong> to remove. The post-dialysis weight confirms how much actually came off."}, {"h": "Peritoneal Dialysis — Net Ultrafiltration"}, {"p": "<strong>Formula:</strong> Outflow (drained) − Inflow (instilled) = Net fluid removed. A <strong>negative</strong> result means the client absorbed (retained) dialysate."}, {"table": {"head": ["Inflow", "Outflow", "Result", "Meaning"], "rows": [["2,000 mL", "2,500 mL", "+500 mL", "<strong>500 mL removed</strong> — recorded as output"], ["2,000 mL", "1,800 mL", "−200 mL", "<strong>200 mL retained</strong> — counts toward intake; check for kinks, constipation, and position"]]}}, {"p": "<strong>Multiple exchanges:</strong> add the net result of each one. Exchanges of +300, +150, and −100 mL = <strong>+350 mL</strong> net removed. If drainage is short by <strong>500 mL or more</strong> over several exchanges, evaluate for fluid retention and notify the provider."}, {"hook": "PD outflow is not urine. Record the client's <b>true urine output</b> separately from the dialysate drained."}, {"h": "CRRT — Hourly Fluid Balance"}, {"p": "The nurse totals all intake and output <strong>every hour</strong> and adjusts to meet the ordered hourly balance goal."}, {"p": "<strong>Formula:</strong> Hourly net fluid removal needed = Hourly intake (IV fluids, meds, feedings, replacement fluid) + Desired hourly fluid loss"}, {"p": "<strong>Worked example:</strong> The goal is a net loss of 100 mL/hr. This hour the client receives IV fluid 50 mL + tube feeding 60 mL + IV meds 40 mL = 150 mL. To achieve −100 mL, the machine must remove 150 + 100 = <strong>250 mL</strong> of fluid from the client this hour."}]}]};
Object.assign(QUIZ, {"mathdose": [{"stem": "An order calls for 750 mg of a medication PO. It is supplied as 250 mg tablets. Using the (Desired ÷ Have) × Quantity formula, how many tablets should the nurse give?", "options": ["3 tablets", "2 tablets", "4 tablets", "0.5 tablet"], "answer": 0, "why": "(750 ÷ 250) × 1 tablet = 3 tablets."}, {"stem": "A patient weighs 176 lbs. Using the standard conversion factor from this lesson, what is this weight in kilograms?", "options": ["80 kg", "70 kg", "88 kg", "160 kg"], "answer": 0, "why": "lbs ÷ 2.2 = kg, so 176 ÷ 2.2 = 80 kg."}, {"stem": "Using the metric 1000 rule, how many milligrams are in 3.5 g?", "options": ["3500 mg", "350 mg", "0.0035 mg", "35,000 mg"], "answer": 0, "why": "Converting a larger unit (g) to a smaller one (mg) means multiplying by 1000: 3.5 × 1000 = 3500 mg."}, {"stem": "An order calls for 2 tablespoons of a liquid medication. Using the household equivalents in this lesson, how many mL is this?", "options": ["30 mL", "10 mL", "60 mL", "15 mL"], "answer": 0, "why": "1 tablespoon = 15 mL, so 2 tablespoons = 2 × 15 mL = 30 mL."}, {"type": "sata", "stem": "Which of the following conversions from this lesson are correct? Select all that apply.", "options": ["1 kg = 1000 g", "1 mL = 1000 L", "1 tablespoon = 15 mL", "1 ounce = 30 mL", "154 lbs = 70 kg"], "answers": [0, 2, 3, 4], "why": "kg→g is a larger-to-smaller conversion (×1000, so 1 kg = 1000 g, not the reverse); 1 tbsp = 15 mL and 1 oz = 30 mL are both stated household equivalents; 154 lbs ÷ 2.2 = 70 kg is the lesson's own worked example. '1 mL = 1000 L' reverses the mL↔L relationship (it should be 1000 mL = 1 L)."}], "mathiv": [{"stem": "A patient is to receive 1500 mL of Normal Saline over 10 hours via infusion pump. What rate (mL/hr) should the pump be set to?", "options": ["150 mL/hr", "100 mL/hr", "125 mL/hr", "200 mL/hr"], "answer": 0, "why": "Total Volume ÷ Total Time = mL/hr, so 1500 ÷ 10 = 150 mL/hr."}, {"stem": "An 800 mL bag is infusing at 100 mL/hr. Approximately how long will it take to infuse completely?", "options": ["8 hours", "10 hours", "80 hours", "0.8 hour"], "answer": 0, "why": "Total Volume ÷ Flow Rate = Time, so 800 ÷ 100 = 8 hours."}, {"stem": "An order is to infuse 1000 mL over 6 hours (360 minutes) using tubing with a drop factor of 10 gtt/mL. What is the drip rate, rounded to the nearest whole drop?", "options": ["28 gtt/min", "21 gtt/min", "15 gtt/min", "10 gtt/min"], "answer": 0, "why": "(Total Volume × Drop Factor) ÷ Time in minutes = gtt/min: (1000 × 10) ÷ 360 = 10,000 ÷ 360 = 27.78, which rounds to 28 gtt/min."}, {"stem": "A bag contains 300 mg of a drug in 500 mL of D5W. What is the concentration in mcg/mL?", "options": ["600 mcg/mL", "300 mcg/mL", "1500 mcg/mL", "60 mcg/mL"], "answer": 0, "why": "(Total mg × 1000) ÷ Total mL = concentration: (300 × 1000) ÷ 500 = 300,000 ÷ 500 = 600 mcg/mL."}, {"type": "sata", "stem": "Which of the following statements about IV flow-rate calculations from this lesson are correct? Select all that apply.", "options": ["mL/hr is calculated as Total Volume (mL) ÷ Total Time (hr)", "Drip rate in gtt/min requires knowing the tubing's drop factor", "A general safety guideline for IV push medications, absent other guidance, is roughly 1 mL per minute", "Concentration in mcg/mL is found by dividing total mg by total mL, with no unit conversion needed", "The two methods for calculating gtt/min will always give different final answers for the same infusion"], "answers": [0, 1, 2], "why": "mL/hr and the 1 mL/min IV push guideline are both directly stated, and drop factor is required for any gtt/min calculation. Concentration requires converting mg to mcg first (×1000) before dividing by mL — skipping that step gives a wrong answer. And the lesson's own worked example shows both gtt/min methods arriving at the same answer (31 gtt/min), not different ones."}], "mathcardiac": [{"stem": "A patient's BP is 140/90. Using the MAP formula, what is this patient's mean arterial pressure?", "options": ["106.7 mmHg", "115 mmHg", "90 mmHg", "140 mmHg"], "answer": 0, "why": "(Systolic + [2 × Diastolic]) ÷ 3 = MAP: (140 + [2 × 90]) ÷ 3 = (140 + 180) ÷ 3 = 320 ÷ 3 = 106.7 mmHg."}, {"stem": "A patient's MAP is 90 mmHg and ICP is 20 mmHg. What is this patient's cerebral perfusion pressure (CPP)?", "options": ["70 mmHg", "110 mmHg", "20 mmHg", "90 mmHg"], "answer": 0, "why": "MAP − ICP = CPP, so 90 − 20 = 70 mmHg."}, {"stem": "An order is for a weight-based drip at 3 mcg/kg/min for a 60 kg patient, using a bag concentration of 400 mcg/mL. What rate (mL/hr) should the pump be set to?", "options": ["27 mL/hr", "3 mL/hr", "60 mL/hr", "7.5 mL/hr"], "answer": 0, "why": "(Desired mcg × kg × 60) ÷ Concentration = mL/hr: (3 × 60 × 60) ÷ 400 = 10,800 ÷ 400 = 27 mL/hr."}, {"stem": "A heparin order is for 15 Units/kg/hr for a 70 kg patient, using a concentration of 50 Units/mL. What rate (mL/hr) should the pump be set to?", "options": ["21 mL/hr", "15 mL/hr", "50 mL/hr", "70 mL/hr"], "answer": 0, "why": "(Units × kg) ÷ Concentration = mL/hr: (15 × 70) ÷ 50 = 1050 ÷ 50 = 21 mL/hr."}, {"type": "sata", "stem": "Which of the following statements from this lesson are accurate? Select all that apply.", "options": ["A MAP of at least approximately 65 mmHg is generally needed to maintain adequate organ perfusion", "CPP is calculated by adding ICP to MAP", "A CPP that drops below roughly 60 mmHg risks cerebral ischemia", "Weight-based and units-based infusions are both considered high-alert medications requiring an infusion pump", "MAP is weighted more toward systolic pressure because the heart spends more time in systole"], "answers": [0, 2, 3], "why": "A MAP of roughly 65+ mmHg and a CPP floor of roughly 60 mmHg are both stated thresholds, and both drip types are named as high-alert, pump-only medications. CPP is MAP minus ICP, not plus; and MAP is weighted toward diastole (not systole), since the heart spends more time in diastole."}], "mathfluid": [{"stem": "A patient's total intake for a shift is 2400 mL and total output is 1800 mL. What is the net fluid balance?", "options": ["+600 mL", "+4200 mL", "-600 mL", "+1800 mL"], "answer": 0, "why": "Total Intake − Total Output = Net Balance: 2400 − 1800 = +600 mL."}, {"stem": "A patient consumes 300 mL of ice chips. How much should be recorded as intake?", "options": ["150 mL", "300 mL", "600 mL", "75 mL"], "answer": 0, "why": "Ice chips are recorded as half their measured volume, since they're mostly air between solid pieces: 300 ÷ 2 = 150 mL."}, {"stem": "Using the 0.5 mL/kg/hr estimate, what is the approximate hourly insensible fluid loss for a 60 kg patient?", "options": ["30 mL/hr", "60 mL/hr", "15 mL/hr", "120 mL/hr"], "answer": 0, "why": "0.5 mL/kg/hr × 60 kg = 30 mL/hr."}, {"stem": "A patient's weight rises by 3 kg over three days, with no change in diet suggesting real tissue gain. Using the fluid weight rule of thumb, approximately how much fluid does this represent?", "options": ["3 L", "1 L", "6 L", "0.3 L"], "answer": 0, "why": "The rule of thumb is that a 1 kg weight change equals roughly 1 L of fluid change, so a 3 kg change is roughly 3 L."}, {"type": "sata", "stem": "Which of the following statements from this lesson are accurate? Select all that apply.", "options": ["Hypertonic solutions cause water to leave the cell, causing it to shrink", "Hypotonic solutions cause water to leave the cell", "0.9% Normal Saline is an isotonic solution", "Urine output under 30 mL/hr is a potential emergency signaling inadequate renal perfusion", "Ice chips are counted at their full measured volume, with no adjustment"], "answers": [0, 2, 3], "why": "Hypertonic fluids pull water out of the cell (shrinkage/plasmolysis), 0.9% NS is a classic isotonic fluid, and output under 30 mL/hr is flagged as a potential emergency. Hypotonic fluids push water INTO the cell (not out), and ice chips are counted at half their measured volume, not the full amount."}], "mathbody": [{"stem": "A patient weighs 60 kg and is 1.6 m tall. Using the metric BMI formula, what is this patient's BMI (rounded to the nearest tenth)?", "options": ["23.4", "24.0", "22.9", "25.6"], "answer": 0, "why": "Weight (kg) ÷ [Height (m)]²: 1.6 × 1.6 = 2.56; 60 ÷ 2.56 = 23.4."}, {"stem": "A patient weighs 180 lbs and is 72 inches tall. Using the imperial BMI formula, what is this patient's BMI (rounded to the nearest tenth)?", "options": ["24.4", "22.9", "26.0", "20.4"], "answer": 0, "why": "[Weight (lbs) × 703] ÷ [Height (in)]²: 180 × 703 = 126,540; 72 × 72 = 5184; 126,540 ÷ 5184 ≈ 24.4."}, {"stem": "A patient is 150 cm tall and weighs 50 kg. Using the BSA formula, what is this patient's approximate BSA (rounded to the nearest hundredth)?", "options": ["1.44 m²", "2.08 m²", "0.72 m²", "14.4 m²"], "answer": 0, "why": "BSA = √[(Height in cm × Weight in kg) ÷ 3600] = √[(150 × 50) ÷ 3600] = √[7500 ÷ 3600] = √2.083 ≈ 1.44 m²."}, {"stem": "A pediatric chemo order is 3 mg/m². The patient weighs 44 lb and is 106 cm tall, and the drug is supplied as 1 mg/mL. Following the same step-by-step process as the lesson's worked example, approximately how many mL should be given?", "options": ["≈2.3 mL", "≈3.0 mL", "≈0.77 mL", "≈6.9 mL"], "answer": 0, "why": "Step 1 — convert weight to kg: 44 ÷ 2.2 = 20 kg. Step 2 — BSA: √[(106 × 20) ÷ 3600] = √[2120 ÷ 3600] = √0.589 ≈ 0.77 m². Step 3 — dose in mg: 3 mg/m² × 0.77 m² ≈ 2.3 mg. Step 4 — dose in mL: 2.3 mg ÷ 1 mg/mL ≈ 2.3 mL."}, {"type": "sata", "stem": "Which of the following statements from this lesson are accurate? Select all that apply.", "options": ["A BMI under 17 is a diagnostic marker used for anorexia nervosa", "A BMI under 15 is considered extreme/life-threatening in anorexia nervosa", "BSA is used for chemotherapy dosing because it scales more precisely to a patient's size than weight alone", "The metric and imperial BMI formulas will give meaningfully different results for the same patient", "BSA is expressed in kilograms, not square meters"], "answers": [0, 1, 2], "why": "The BMI thresholds (<17 diagnostic, <15 extreme) and BSA's precision rationale for chemo dosing are both stated directly. The metric and imperial BMI formulas give the same result for the same patient (just starting from different units), and BSA is expressed in square meters (m²), not kilograms."}], "m3math-renal": [{"type": "fitb", "stem": "A 90 kg client with suspected AKI has voided a total of 240 mL over the last 8 hours. Calculate the client's urine output in mL/kg/hr. Record your answer to the nearest hundredth.", "answer": 0.33, "why": "240 mL ÷ 8 hr = 30 mL/hr; 30 ÷ 90 kg = 0.333 → 0.33 mL/kg/hr. This is below the 0.5 mL/kg/hr minimum (this client needs at least 90 × 0.5 = 45 mL/hr), so 30 mL/hr is not adequate for a 90 kg client and should be reported."}, {"type": "fitb", "stem": "A client in the oliguric phase of AKI had a urine output of 420 mL over the previous 24 hours. The provider orders a fluid allowance of the previous 24-hour output plus 500 mL. How many mL may the client have over the next 24 hours? Record your answer as a whole number.", "answer": 920, "why": "420 mL + 500 mL (insensible losses) = 920 mL. The allowance is spread across all 24 hours and includes fluid taken with medications and IV fluids."}, {"type": "fitb", "stem": "A client with CKD weighed 154 lb yesterday and 160.6 lb this morning on the same scale in the same clothing. About how many liters of fluid has the client retained? Record your answer to the nearest tenth.", "answer": 3, "why": "160.6 − 154 = 6.6 lb; 6.6 ÷ 2.2 = 3.0 kg; 1 kg = about 1 L, so about 3.0 L retained. A gain this size overnight is fluid, not fat, and needs to be reported."}, {"type": "fitb", "stem": "A client on hemodialysis is prescribed sevelamer 6,400 mg per day divided with meals. The client states, \"I never eat breakfast — I just eat lunch and dinner.\" How many mg of sevelamer should be given with each meal? Record your answer as a whole number.", "answer": 3200, "why": "Daily dose ÷ meals actually eaten: 6,400 mg ÷ 2 meals = 3,200 mg with each meal. The divisor is the client's real eating pattern, not a standard three meals — fewer meals means a larger dose with each one."}, {"type": "sata", "stem": "The nurse reviews data for a 60 kg client on a medical-surgical unit. Which findings should the nurse report to the provider? Select all that apply.", "options": ["Urine output of 25 mL/hr for the past 4 hours", "BUN 18 mg/dL and creatinine 1.0 mg/dL", "Weight up 1.5 kg since yesterday", "24-hour urine output of 1,600 mL", "IV furosemide 120 mg infusing over 15 minutes"], "answers": [0, 2, 4], "why": "25 ÷ 60 = 0.42 mL/kg/hr, below 0.5 (minimum 30 mL/hr for this client). A 1.5 kg overnight gain is about 1.5 L of retained fluid. 120 mg over 15 minutes is 8 mg/min — double the 4 mg/min maximum, risking ototoxicity (it needs at least 30 minutes). BUN/creatinine of 18/1.0 and a 1,600 mL daily output are normal."}], "m3math-dialysis": [{"type": "fitb", "stem": "A client's pre-hemodialysis weight is 82.6 kg. The client's dry (target) weight is 79.8 kg. How many liters of fluid is the goal to remove during this treatment? Record your answer to the nearest tenth.", "answer": 2.8, "why": "82.6 − 79.8 = 2.8 kg; 1 kg = about 1 L, so the goal is about 2.8 L. The post-dialysis weight confirms how much actually came off."}, {"type": "fitb", "stem": "A client on peritoneal dialysis completes three exchanges, each with 2,000 mL instilled. The outflow volumes are 2,250 mL, 1,850 mL, and 2,400 mL. What is the net fluid removed for the three exchanges, in mL? Record your answer as a whole number.", "answer": 500, "why": "Outflow − inflow for each exchange: +250, −150, +400. Net = 250 − 150 + 400 = +500 mL removed. The 150 mL retained in the second exchange is subtracted, not ignored."}, {"type": "fitb", "stem": "A client on CRRT has an ordered net fluid loss of 150 mL/hr. This hour the client receives IV fluid 75 mL, tube feeding 50 mL, and an IV antibiotic 25 mL. How many mL must the machine remove from the client this hour to meet the goal? Record your answer as a whole number.", "answer": 300, "why": "Hourly intake = 75 + 50 + 25 = 150 mL. Fluid to remove = intake + desired loss = 150 + 150 = 300 mL. Removing only 150 mL would just break even with intake."}, {"type": "matrix", "stem": "The nurse records peritoneal dialysis exchanges. For each exchange, indicate whether the result is fluid removed from the client or fluid retained by the client.", "rows": ["Inflow 2,000 mL — outflow 2,400 mL", "Inflow 2,000 mL — outflow 1,750 mL", "Inflow 1,500 mL — outflow 1,650 mL", "Inflow 2,500 mL — outflow 2,300 mL", "Inflow 1,000 mL — outflow 1,200 mL"], "cols": ["Fluid removed (record as output)", "Fluid retained (counts toward intake)"], "correct": [0, 1, 0, 1, 0], "why": "Outflow − inflow: a positive result (+400, +150, +200) is fluid removed; a negative result (−250, −200) means the client absorbed dialysate, which counts toward intake. Retained exchanges prompt a check for kinks, constipation, and position."}, {"type": "sata", "stem": "Over three peritoneal dialysis exchanges, a client's drainage is 550 mL less than the total instilled. Which actions should the nurse take? Select all that apply.", "options": ["Check the tubing for kinks and closed clamps", "Ask when the client last had a bowel movement", "Notify the provider of possible fluid retention", "Add the 550 mL to the client's urine output total", "Switch the next bag to 4.25% dextrose without an order"], "answers": [0, 1, 2], "why": "A drainage deficit of 500 mL or more over several exchanges is evaluated for fluid retention and reported; kinks, clamps, and constipation are common mechanical causes of poor outflow. Dialysate is never recorded as urine output, and changing dextrose strength requires a provider order."}]});

{ id:"m4math-co-sv", title:"Cardiac Output &amp; Stroke Volume", kicker:"CO = HR × SV — and why a racing heart can pump less",
  blocks:[
   {p:"Every rhythm, drug, and fluid decision in Perfusion is really about one goal: <strong>optimize cardiac output</strong>. Two quick formulas let you see how heart rate and stroke volume trade off against each other."},
   {h:"The formulas"},
   {table:{head:["Value","Formula","Normal"],rows:[
    ["Cardiac output (CO)","Heart rate × stroke volume (mL) ÷ 1,000 = L/min","<strong>4–8 L/min</strong>"],
    ["Stroke volume (SV)","(CO in L/min × 1,000) ÷ heart rate = mL/beat","<strong>60–100 mL/beat</strong>"]]}},
   {p:"Stroke volume is measured in <strong>mL per beat</strong>, but cardiac output is reported in <strong>liters per minute</strong> — so divide by 1,000 at the end (or multiply by 1,000 to go back)."},
   {h:"Worked example 1 — finding CO"},
   {list:[
    "<strong>Given:</strong> HR 72 beats/min, SV 70 mL/beat",
    "<strong>Formula:</strong> CO = HR × SV",
    "<strong>Steps:</strong> 72 × 70 = 5,040 mL/min → 5,040 ÷ 1,000 = 5.04 L/min",
    "<strong>Answer:</strong> CO ≈ <strong>5 L/min</strong> — within the normal 4–8 L/min"]},
   {h:"Worked example 2 — finding SV"},
   {list:[
    "<strong>Given:</strong> CO 5.5 L/min, HR 80 beats/min",
    "<strong>Formula:</strong> SV = (CO × 1,000) ÷ HR",
    "<strong>Steps:</strong> 5.5 × 1,000 = 5,500 mL/min → 5,500 ÷ 80 = 68.75",
    "<strong>Answer:</strong> SV = <strong>68.75 mL/beat</strong> (≈ 69) — within the normal 60–100 mL/beat"]},
   {h:"Worked example 3 — why tachycardia eventually LOWERS CO"},
   {p:"Faster sounds like more output, and at first it is. But the ventricles fill during <strong>diastole</strong>, and diastole is the part of the cycle that shrinks when the rate climbs. Less filling time → less blood in the ventricle → <strong>↓ stroke volume</strong>."},
   {table:{head:["Situation","HR","SV","CO"],rows:[
    ["Resting","80","70 mL","80 × 70 = 5,600 mL → <strong>5.6 L/min</strong>"],
    ["Sustained tachycardia, poor filling","160","25 mL","160 × 25 = 4,000 mL → <strong>4.0 L/min</strong>"]]}},
   {p:"The rate doubled, but stroke volume fell so far that cardiac output <strong>dropped</strong>. Lose the atrial kick (as in A-fib) and filling drops even more; a fast heart also raises myocardial O₂ demand — which is why a patient in a fast rhythm can show signs of decreased CO (↓BP, dizziness, chest pain)."},
   {hook:"<strong>CO = HR × SV.</strong> If one side drops, the other has to rise to keep up. A slow heart lowers CO through HR; a very fast heart lowers CO through SV (no time to fill)."}
  ],
  check:{stem:"A client's heart rate is 100 beats/min and stroke volume is 50 mL/beat. What is the cardiac output?", options:["0.5 L/min","2 L/min","5 L/min","50 L/min"], answer:2, why:"100 × 50 = 5,000 mL/min; 5,000 ÷ 1,000 = 5 L/min, which is within the normal 4–8 L/min."}
},
{ id:"m4math-hr-ef", title:"Heart Rate from a Strip &amp; Ejection Fraction", kicker:"The 6-second method and the EF percentage",
  blocks:[
   {p:"Two numbers you'll calculate constantly: the heart rate off a rhythm strip, and the ejection fraction that classifies heart failure."},
   {h:"Heart rate — the 6-second method"},
   {p:"<strong>Formula:</strong> number of QRS complexes in a 6-second strip × 10 = heart rate (beats/min). Count the QRS complexes (the tall spikes), not the P waves. One big box = 0.20 s, so 30 big boxes = 6 seconds."},
   {img:STRIPS.nsr, caption:"Normal sinus rhythm — 6-second strip. Count the QRS complexes: 7 × 10 = about 70 (measured rate ≈75)."},
   {list:[
    "<strong>Given:</strong> 7 QRS complexes in 6 seconds (a 7–8 count is typical for this rate)",
    "<strong>Steps:</strong> 7 × 10 = 70",
    "<strong>Answer:</strong> about <strong>70–75 beats/min</strong> → within 60–100 = normal rate"]},
   {img:STRIPS.sb, caption:"Sinus bradycardia — 6-second strip. 5 QRS complexes × 10 = about 50 (measured rate ≈45)."},
   {list:[
    "<strong>Given:</strong> 5 QRS complexes in 6 seconds",
    "<strong>Steps:</strong> 5 × 10 = 50",
    "<strong>Answer:</strong> about <strong>50 beats/min</strong> → below 60 = bradycardia. Check whether the client is symptomatic before treating."]},
   {hook:"The 6-second method is an <strong>estimate</strong> — great for regular and irregular rhythms alike (it's the go-to for A-fib). A partial complex at the edge makes the count land a little above or below the true rate."},
   {table:{head:["QRS in 6 s","Rate","Interpretation (if sinus)"],rows:[
    ["3","30","Very slow — brady"],
    ["5","50","Brady (below 60)"],
    ["6–10","60–100","Normal rate"],
    ["12","120","Tachy (above 100)"],
    ["18","180","SVT range (150–250) — not sinus tach"]]}},
   {h:"Ejection fraction (EF)"},
   {p:"<strong>Formula:</strong> (volume ejected ÷ end-diastolic volume) × 100 = EF %. End-diastolic volume is how much blood is in the ventricle when it's full; volume ejected is what leaves with one squeeze (the stroke volume)."},
   {list:[
    "<strong>Given:</strong> end-diastolic volume 100 mL; 60 mL ejected",
    "<strong>Steps:</strong> 60 ÷ 100 = 0.60 → × 100 = 60",
    "<strong>Answer:</strong> EF = <strong>60%</strong> → normal"]},
   {list:[
    "<strong>Given:</strong> end-diastolic volume 120 mL; 42 mL ejected",
    "<strong>Steps:</strong> 42 ÷ 120 = 0.35 → × 100 = 35",
    "<strong>Answer:</strong> EF = <strong>35%</strong> → below 50% = HFrEF (systolic, can't pump)"]},
   {table:{head:["EF","Meaning"],rows:[
    ["50–70%","Normal"],
    ["Below 50%","<strong>HFrEF</strong> — reduced EF, systolic HF, stretched/boggy walls that can't pump"],
    ["Normal EF with HF symptoms","<strong>HFpEF</strong> — preserved EF, diastolic HF, thick stiff walls that can't fill"]]}},
   {hook:"An echocardiogram is the go-to test for EF. Remember <strong>\"Systolic = stretched\"</strong> (low EF) and <strong>\"Diastolic = thick\"</strong> (EF preserved)."}
  ],
  check:{stem:"An echocardiogram shows an end-diastolic volume of 150 mL and 60 mL ejected per beat. Which interpretation is correct?", options:["EF 60% — normal","EF 40% — consistent with HFrEF","EF 90% — hyperdynamic","EF 25% — normal for older adults"], answer:1, why:"60 ÷ 150 = 0.40 × 100 = 40%. Below 50% is reduced EF (HFrEF, systolic heart failure)."}
},
{ id:"m4math-map-cpp", title:"MAP → CPP Multi-Step Problems", kicker:"Perfusion pressure to the organs and the brain",
  blocks:[
   {p:"In stroke and neuro patients you'll often need <strong>two steps</strong>: calculate MAP from the blood pressure, then subtract ICP to get cerebral perfusion pressure."},
   {h:"The formulas"},
   {table:{head:["Value","Formula","Target"],rows:[
    ["MAP","(SBP + 2 × DBP) ÷ 3","<strong>65 or higher</strong> = adequate organ perfusion"],
    ["CPP","MAP − ICP","Below ~60 = <strong>cerebral ischemia risk</strong>"]]}},
   {hook:"Diastole counts twice in MAP because the heart spends about two-thirds of each cycle in diastole. Always finish MAP <strong>before</strong> you subtract ICP."},
   {h:"Example 1 — post-stroke client, adequate"},
   {list:[
    "<strong>Given:</strong> BP 150/90, ICP 15 mmHg",
    "<strong>Step 1 (MAP):</strong> 2 × 90 = 180 → 150 + 180 = 330 → 330 ÷ 3 = <strong>110</strong>",
    "<strong>Step 2 (CPP):</strong> 110 − 15 = <strong>95 mmHg</strong>",
    "<strong>Interpret:</strong> MAP 65 or higher and CPP well above 60 → brain is being perfused"]},
   {h:"Example 2 — low BP, rising ICP"},
   {list:[
    "<strong>Given:</strong> BP 84/48, ICP 22 mmHg",
    "<strong>Step 1 (MAP):</strong> 2 × 48 = 96 → 84 + 96 = 180 → 180 ÷ 3 = <strong>60</strong>",
    "<strong>Step 2 (CPP):</strong> 60 − 22 = <strong>38 mmHg</strong>",
    "<strong>Interpret:</strong> MAP below 65 AND CPP far below 60 → cerebral ischemia risk. Report immediately; this client needs perfusion support."]},
   {h:"Example 3 — normal MAP, but high ICP"},
   {list:[
    "<strong>Given:</strong> BP 120/75, ICP 35 mmHg",
    "<strong>Step 1 (MAP):</strong> 2 × 75 = 150 → 120 + 150 = 270 → 270 ÷ 3 = <strong>90</strong>",
    "<strong>Step 2 (CPP):</strong> 90 − 35 = <strong>55 mmHg</strong>",
    "<strong>Interpret:</strong> MAP looks fine, but CPP is below ~60 → the brain is at risk. A \"normal\" BP doesn't guarantee brain perfusion when ICP is high."]},
   {h:"Example 4 — rounding a MAP"},
   {list:[
    "<strong>Given:</strong> BP 118/76, ICP 12 mmHg",
    "<strong>Step 1 (MAP):</strong> 2 × 76 = 152 → 118 + 152 = 270 → 270 ÷ 3 = <strong>90</strong>",
    "<strong>Step 2 (CPP):</strong> 90 − 12 = <strong>78 mmHg</strong> → adequate",
    "If MAP doesn't divide evenly (e.g., 122/78 → 278 ÷ 3 = 92.67), round only at the end, as the question directs (92.7 or 93)."]},
   {h:"Quick interpretation table"},
   {table:{head:["Result","Meaning","Nursing thought"],rows:[
    ["MAP 65 or higher","Organs perfused","Keep monitoring"],
    ["MAP below 65","Organ perfusion at risk","Report; think decreased CO care (SBP goal above 90)"],
    ["CPP about 60 or higher","Brain perfused","Keep monitoring neuro status"],
    ["CPP below ~60","Cerebral ischemia risk","Report; neuro checks; check BP and ICP trends"]]}}
  ],
  check:{stem:"A client has BP 96/60 and ICP 20 mmHg. Which statement is accurate?", options:["MAP 72, CPP 52 — cerebral ischemia risk","MAP 78, CPP 58 — adequate","MAP 72, CPP 92 — adequate","MAP 52, CPP 72 — organ perfusion inadequate"], answer:0, why:"MAP = (96 + 120) ÷ 3 = 216 ÷ 3 = 72. CPP = 72 − 20 = 52, which is below ~60, so the brain is at risk even though MAP is above 65."}
},
{ id:"m4math-drips", title:"Cardiac Drip Calculations", kicker:"Heparin, dopamine, epinephrine, amiodarone, atropine, adenosine",
  blocks:[
   {p:"These are high-alert drugs on an infusion pump (or a rapid push). Find the <strong>concentration</strong> first, then solve for mL/h or mL. The concentrations below are examples — always use the label on the bag or syringe in front of you."},
   {h:"Heparin — units/h and mL/h"},
   {list:[
    "<strong>Given:</strong> heparin 25,000 units in 250 mL; order 1,000 units/h",
    "<strong>Concentration:</strong> 25,000 ÷ 250 = 100 units/mL",
    "<strong>Formula:</strong> ordered units/h ÷ units/mL = mL/h",
    "<strong>Steps:</strong> 1,000 ÷ 100 = 10",
    "<strong>Answer:</strong> <strong>10 mL/h</strong>"]},
   {list:[
    "<strong>Weight-based — Given:</strong> 18 units/kg/h for an 80 kg client; same bag (100 units/mL)",
    "<strong>Steps:</strong> 18 × 80 = 1,440 units/h → 1,440 ÷ 100 = 14.4",
    "<strong>Answer:</strong> <strong>14.4 mL/h</strong> (1,440 units/h)"]},
   {hook:"Heparin is monitored with the <strong>PTT</strong> — \"two t's make an H.\" Watch platelets for HIT; the antidote is protamine sulfate."},
   {h:"Dopamine — mcg/kg/min → mL/h"},
   {list:[
    "<strong>Given:</strong> dopamine 400 mg in 250 mL; order 5 mcg/kg/min; client 80 kg",
    "<strong>Concentration:</strong> 400 mg × 1,000 = 400,000 mcg ÷ 250 mL = <strong>1,600 mcg/mL</strong>",
    "<strong>Formula:</strong> (mcg × kg × 60 min) ÷ mcg/mL = mL/h",
    "<strong>Steps:</strong> 5 × 80 = 400 mcg/min → × 60 = 24,000 mcg/h → 24,000 ÷ 1,600 = 15",
    "<strong>Answer:</strong> <strong>15 mL/h</strong>. (At the top of the 5–20 mcg/kg/min brady range, 20 mcg/kg/min for the same client = 96,000 ÷ 1,600 = 60 mL/h.)"]},
   {h:"Epinephrine — mcg/min → mL/h"},
   {list:[
    "<strong>Given:</strong> epinephrine 4 mg in 250 mL; order 2 mcg/min (brady range 2–10 mcg/min)",
    "<strong>Concentration:</strong> 4 mg × 1,000 = 4,000 mcg ÷ 250 mL = <strong>16 mcg/mL</strong>",
    "<strong>Formula:</strong> (mcg/min × 60) ÷ mcg/mL = mL/h (no weight in this one)",
    "<strong>Steps:</strong> 2 × 60 = 120 mcg/h → 120 ÷ 16 = 7.5",
    "<strong>Answer:</strong> <strong>7.5 mL/h</strong>. At 10 mcg/min: 600 ÷ 16 = 37.5 mL/h."]},
   {hook:"Dopamine and epinephrine are <strong>vesicants</strong> — large vein or central line, check the site often; extravasation antidote is phentolamine."},
   {h:"Amiodarone — mg/min → mL/h"},
   {list:[
    "<strong>Given:</strong> amiodarone 900 mg in 500 mL; maintenance 1 mg/min",
    "<strong>Concentration:</strong> 900 ÷ 500 = <strong>1.8 mg/mL</strong>",
    "<strong>Steps:</strong> 1 mg/min × 60 = 60 mg/h → 60 ÷ 1.8 = 33.33",
    "<strong>Answer:</strong> <strong>33.3 mL/h</strong> (33 mL/h to the nearest whole number)"]},

   {table:{head:["Drug","Given","Steps","Answer"],rows:[
    ["Atropine 1 mg IV push","Prefilled syringe 0.1 mg/mL (1 mg/10 mL)","1 ÷ 0.1 = 10","<strong>10 mL</strong> — repeat q3–5 min, max 3 mg (30 mL total)"],

   {hook:"Beware the look-alike, sound-alike <strong>\"A\" drugs</strong>: <strong>A</strong>tropine speeds a slow heart, <strong>A</strong>denosine briefly stops a fast one, <strong>A</strong>miodarone is an antiarrhythmic drip. Read the label twice."}
  ],
  check:{stem:"Heparin 25,000 units in 500 mL is infusing. The order is 1,200 units/h. At what rate should the pump be set?", options:["12 mL/h","24 mL/h","48 mL/h","50 mL/h"], answer:1, why:"25,000 ÷ 500 = 50 units/mL. 1,200 ÷ 50 = 24 mL/h."}

{ id:"m4math-ci", title:"Cardiac Index (likely NUR 211)", kicker:"Cardiac output sized to the body — plus intracardiac pressures",
  blocks:[
   {hook:"<strong>Likely NUR 211 content — kept here for next semester; not on the Module 4 exam.</strong>"},
   {h:"Why index cardiac output?"},
   {p:"A CO of 4 L/min means something different for a small adult than for a very large one. <strong>Cardiac index (CI)</strong> adjusts cardiac output for body size by dividing by body surface area (BSA)."},
   {h:"Formula"},
   {table:{head:["Value","Formula","Normal"],rows:[
    ["Cardiac index","CO (L/min) ÷ BSA (m²)","<strong>2.5–4 L/min/m²</strong>"]]}},
   {h:"Worked example"},
   {list:[
    "<strong>Given:</strong> CO 5.5 L/min, BSA 1.64 m²",
    "<strong>Formula:</strong> CI = CO ÷ BSA",
    "<strong>Steps:</strong> 5.5 ÷ 1.64 = 3.354 → rounds to 3.35",
    "<strong>Answer:</strong> CI ≈ <strong>3.35 L/min/m²</strong> → within the normal 2.5–4"]},
   {p:"Bedside monitors usually calculate BSA and CI automatically once height and weight are entered."},
   {h:"Normal intracardiac pressures (likely 211)"},
   {table:{head:["Location","Normal (mmHg)"],rows:[
    ["Right atrium","0–8"],
    ["Right ventricle","Systolic 15–25 / diastolic 0–8"],
    ["Pulmonary artery","Systolic 15–25 / diastolic 8–15"],
    ["Left atrium","4–12"],
    ["Left ventricle","Systolic 110–130 / diastolic 4–12"],
    ["Aorta","Systolic 110–130 / diastolic 70–80"]]}},
   {hook:"Pattern to notice: the <strong>right side is a low-pressure system</strong> (pumps only to the lungs); the <strong>left side is high pressure</strong> (pumps to the whole body) — which is why the left ventricle is the thickest chamber."}
  ],
  check:{stem:"A client's CO is 3.2 L/min and BSA is 2.0 m². How should the nurse interpret the cardiac index?", options:["1.6 L/min/m² — below normal","6.4 L/min/m² — above normal","3.2 L/min/m² — normal","2.5 L/min/m² — low normal"], answer:0, why:"3.2 ÷ 2.0 = 1.6 L/min/m², below the normal 2.5–4 L/min/m²."}
}
);
