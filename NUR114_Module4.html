    ["Onset clues","Sudden deficits — one-sided weakness, speech, vision","Sudden <strong>severe “worst headache of my life”</strong>, N/V, rapid drop in LOC, seizures, stiff neck","Stroke symptoms that go away"],
    ["Key treatment","<strong>tPA</strong> if eligible; clot retrieval","<strong>No thrombolytics</strong>, no anticoagulants; control BP, reverse anticoagulants, manage ICP","Find the cause; <strong>prevent the full stroke</strong>"]]}},
   {hook:"<strong>A TIA is a warning shot.</strong> Symptoms that disappear still need an emergency workup — a full stroke may follow."},
   {h:"Risk factors"},
   {list:[
    "<strong>Hypertension</strong> — the major modifiable risk factor; controlling BP is the key to prevention",
    "<strong>Atrial fibrillation</strong> (emboli) — anticoagulate",
    "Carotid stenosis, dyslipidemia, diabetes, smoking, obesity, sedentary lifestyle, excessive alcohol, sleep apnea, migraine, hypercoagulable states, sickle cell disease",
    "Nonmodifiable: older age, family history, prior stroke/TIA"]},
   {h:"Recognize it — BE-FAST"},
   {table:{head:["Letter","Check","Stroke sign"],rows:[
    ["<strong>B</strong> — Balance","Sudden dizziness, trouble walking","Loss of balance or coordination"],
    ["<strong>E</strong> — Eyes","Sudden vision change","Loss of vision/half the visual field, double vision"],
    ["<strong>F</strong> — Face","Ask them to smile","One side droops"],
    ["<strong>A</strong> — Arm","Both arms out, eyes closed","One arm drifts down"],
    ["<strong>S</strong> — Speech","Repeat a simple phrase","Slurred, wrong words, or can't speak/understand"],
    ["<strong>T</strong> — Time","Note the <strong>time of onset / last known well</strong>","Call 911 — time decides treatment"]]}},
   {p:"Other signs: one-sided numbness, confusion, sudden severe headache (hemorrhagic), dysphagia, loss of gag/cough reflex. Symptoms <strong>depend on the site and size</strong> of the damage."},
   {h:"Opposite side — right vs left hemisphere"},
   {p:"Motor pathways cross, so a stroke on one side of the brain causes deficits on the <strong>opposite side of the body</strong>. Speech and language centers are on the left in most people."},
   {table:{head:["Left hemisphere stroke","Right hemisphere stroke"],rows:[
    ["<strong>Right-sided</strong> weakness/paralysis","<strong>Left-sided</strong> weakness/paralysis"],
    ["Right visual field loss","Left visual field loss"],
    ["<strong>Aphasia</strong> (expressive, receptive, or global); trouble with reading, writing, math","Spatial–perceptual problems; <strong>left-sided neglect</strong>"],
    ["Slow, cautious behavior","<strong>Impulsive</strong>, poor judgment, distractible — <strong>high fall risk</strong>"],
    ["Aware of deficits → depression, anxiety, frustration","Often unaware of or denies deficits"]]}},
   {h:"Common neurologic deficits"},
   {table:{head:["Area","Deficit"],rows:[
    ["Vision","<strong>Homonymous hemianopsia</strong> (loss of the same half of the visual field in both eyes, on the paralyzed side), loss of peripheral vision, diplopia"],
    ["Motor","<strong>Hemiparesis</strong> (weakness) or <strong>hemiplegia</strong> (paralysis) of one side, ataxia, <strong>dysarthria</strong> (slurred speech from weak muscles), <strong>dysphagia</strong>"],
    ["Sensory","Paresthesia (numbness, tingling) on the opposite side; loss of position sense"],
    ["Verbal","<strong>Expressive aphasia</strong> (can't get words out), <strong>receptive aphasia</strong> (can't understand), <strong>global aphasia</strong> (both)"],
    ["Cognitive","Memory loss, short attention span, poor judgment and reasoning"],
    ["Emotional","Emotional lability, depression, frustration, low stress tolerance, withdrawal"]]}},
   {h:"Diagnostics — in this order"},
   {list:[
    "<strong>1. Blood glucose first</strong> — hypoglycemia can look exactly like a stroke, and it is easy to fix",
    "<strong>2. Non-contrast head CT immediately on arrival</strong> — a <strong>bleed shows right away</strong>; ischemic tissue death may <strong>not show for about 48 hours</strong>, so a “normal” early CT in an ischemic stroke is expected. The purpose is to <strong>rule out bleeding before tPA</strong>",
    "<strong>MRI</strong> shows ischemia much earlier, but it takes much longer (about 45 minutes vs about 5 for CT), so CT comes first in the emergency",
    "Labs: CBC, platelets, PT/INR, aPTT; 12-lead ECG (look for A-fib)",
    "Find the source: <strong>carotid ultrasound/Doppler</strong>, CT or MR angiography, echocardiogram/TEE (clot in the heart)",
    "NIH Stroke Scale (NIHSS) to score severity"]},
   {h:"tPA (alteplase) — the clot buster"},
   {p:"For <strong>ischemic stroke only</strong>, given <strong>within 3 hours of symptom onset</strong> (expanded to <strong>4.5 hours for selected patients</strong>), and <strong>only after CT rules out bleeding</strong>. Onset is measured from the <strong>last known well</strong> time — a patient who woke up with symptoms is timed from when they went to bed. Dose is weight-based (0.9 mg/kg, max 90 mg): 10% IV bolus over 1 minute, the rest over 1 hour."},
   {table:{head:["tPA is NOT given if…","Why"],rows:[
    ["Any bleed on CT, or history of hemorrhagic stroke","Would worsen bleeding"],
    ["<strong>BP above 185/110</strong> that can't be lowered","High risk of brain bleed — lower BP first"],
    ["Active bleeding; platelets below 100,000; on anticoagulants with an elevated INR","Bleeding risk"],
    ["Recent surgery (about 2 weeks), serious head trauma or stroke within 3 months, recent GI/urinary bleeding","Fresh vessels can bleed"],
    ["Onset beyond the time window","Reperfusing dead tissue → edema and hemorrhage"],
    ["Blood glucose below 50","Symptoms may be hypoglycemia, not stroke"]]}},
   {h:"Blood pressure targets"},
   {table:{head:["Situation","BP goal"],rows:[
    ["<strong>tPA candidate</strong> (before, during, and 24 h after)","<strong>Below 185/110</strong>"],
    ["Ischemic, <strong>no tPA</strong>","<strong>Permissive hypertension</strong> — treat only if above 220/120; lowering too much reduces flow to the penumbra"],
    ["Hemorrhagic","Lower BP as ordered to limit bleeding; avoid extremes (too low = ischemia)"]]}},
   {p:"If the patient can't receive tPA, anticoagulants or antiplatelets may be used per the provider. Mechanical thrombectomy (clot retrieval) may be done for large-vessel clots in specialized centers."},
   {h:"Carotid endarterectomy (CEA)"},
   {p:"Surgical removal of plaque from a narrowed <strong>carotid artery</strong> to <strong>prevent stroke</strong> in patients with significant carotid stenosis (often after a TIA or mild stroke). After surgery: <strong>neuro checks</strong> (new one-sided weakness = possible clot at the site → notify immediately), keep <strong>BP stable</strong> (hypotension → brain ischemia; hypertension → bleeding at the incision), watch the neck for <strong>swelling/hematoma that can compress the airway</strong> (keep emergency airway equipment nearby), and assess cranial nerves — <strong>hoarseness, difficulty swallowing</strong>, tongue deviation, facial droop."},
   {hook:"<strong>Sugar → Scan → Clot buster.</strong> Check glucose, get a non-contrast CT to rule out a bleed, then tPA within 3 (to 4.5) hours with BP below 185/110."}
  ],
  check:{stem:"A client arrives at the ED with right-sided weakness and slurred speech that began 90 minutes ago. Which action should the nurse take first?", options:["Prepare to administer alteplase","Check the client's blood glucose","Give aspirin 325 mg by mouth","Place the client flat with legs elevated"], answer:1, why:"Hypoglycemia can mimic a stroke and is quickly fixed, so a fingerstick glucose comes first; a non-contrast CT must then rule out bleeding before alteplase. Nothing is given by mouth before a swallow screen, and aspirin is never given before a bleed is ruled out."}
},

// ---------- 4. STROKE NURSING CARE ----------
{ id:"m4-stroke-care", title:"Stroke Nursing Care", kicker:"Neuro checks, swallowing, positioning, aphasia, neglect, and prevention",
  blocks:[
   {h:"Neuro checks and perfusion"},
   {p:"Frequent neurologic assessment shows whether the stroke is <strong>extending</strong> or a complication (bleeding, swelling) is developing. A <strong>decrease in level of consciousness is often the earliest sign</strong> of deterioration."},
   {list:[
    "LOC and orientation; pupils (size, equality, reaction); speech",
    "Movement and strength of all four extremities; facial symmetry",
    "Vital signs with attention to <strong>BP</strong> and <strong>temperature</strong> (treat fever); continuous SpO₂ (O₂ if below about 95%)",
    "Blood glucose (avoid both hypo- and hyperglycemia)",
    "Report <strong>any new or worsening deficit</strong> immediately"]},
   {p:"<strong>Cerebral perfusion pressure (CPP) = MAP − ICP.</strong> MAP = (SBP + 2 × DBP) ÷ 3. A CPP <strong>below about 60 mm Hg</strong> means the brain isn't getting enough blood → ischemia. This is why BP can't be dropped too low after an ischemic stroke and why rising ICP (swelling) is dangerous. Example: BP 150/90 → MAP 110; ICP 20 → CPP 90."},
   {hook:"<strong>The brain needs pressure.</strong> Low MAP or high ICP → low CPP → more dead brain."},
   {h:"Airway, breathing, and swallowing"},
   {p:"Stroke can weaken the muscles of the throat, chest, and diaphragm and wipe out the gag and cough reflexes → <strong>aspiration pneumonia</strong> is a major threat."},
   {list:[
    "<strong>NPO until a swallow screen is passed</strong> — nothing by mouth, including meds, water, or ice chips",
    "<strong>HOB at least 30°</strong> to handle secretions, reduce aspiration, and lower ICP; suction at the bedside",
    "Dysphagia cues: <strong>coughing or choking</strong>, drooling, food <strong>pocketing</strong> in the cheek on the affected side, wet/gurgly voice, nasal regurgitation",
    "Feeding: sit <strong>upright</strong> (in a chair if possible), <strong>chin tuck</strong> when swallowing, <strong>small bites</strong>, place food on the <strong>unaffected side</strong> of the mouth, check for pocketing afterward",
    "<strong>Thickened liquids and pureed foods</strong> are easier to swallow than thin liquids; speech therapy advances the diet",
    "Oral care; tube feeding if unable to swallow safely"]},
   {h:"Positioning and preventing complications"},
   {table:{head:["Complication","Prevention"],rows:[
    ["<strong>DVT/PE</strong>","Early mobility, ROM exercises, SCDs, prophylactic heparin/LMWH as ordered (not in the first 24 h after tPA)"],
    ["<strong>Pressure injury</strong>","Turn <strong>every 2 hours</strong>, limit time lying on the affected side if sensation is impaired, minimize shear/friction, keep skin clean and dry, specialty mattress"],
    ["<strong>Contractures</strong> / footdrop","Passive ROM to affected limbs 4–5 times a day; splints; hand slightly supinated with fingers barely flexed; pillow between legs when side-lying"],
    ["<strong>Shoulder subluxation/pain</strong>","<strong>Never lift or pull by the affected arm</strong>; support the flaccid arm on a pillow or table; pillow in the axilla to keep the arm away from the chest; sling when first walking"],
    ["<strong>Aspiration pneumonia</strong>","Swallow screen, HOB up, oral care, deep breathing"],
    ["Bowel/bladder problems","Scheduled toileting, fluids 2–3 L/day unless restricted, high fiber"]]}},
   {h:"Communicating with aphasia"},
   {table:{head:["Type","Problem","Usually from"],rows:[
    ["<strong>Expressive</strong> (Broca)","Understands, but <strong>can't get words out</strong>","Left frontal lobe (with right-sided weakness)"],
    ["<strong>Receptive</strong>","<strong>Can't understand</strong> spoken or written language","Left temporal lobe"],
    ["<strong>Global</strong>","Both — can't express or understand","Large left-hemisphere stroke"]]}},
   {list:[
    "Face the patient, make eye contact, <strong>speak slowly and clearly in a normal tone</strong> (aphasia isn't hearing loss)",
    "Use <strong>short, simple phrases</strong>, one instruction at a time, and <strong>allow time</strong> to respond",
    "Use <strong>gestures, pictures, a communication board</strong>, writing; name objects as the patient uses them",
    "<strong>Don't finish their sentences</strong> — it increases frustration and reduces practice",
    "Reduce background noise; be consistent with words and routines; treat them as an adult",
    "Expect frustration and depression; refer to speech therapy"]},
   {h:"Vision and neglect"},
   {p:"<strong>Homonymous hemianopsia</strong> = blindness in the same half of the visual field in both eyes, on the <strong>same side as the paralysis</strong>. The patient may eat food from only half the tray or miss people on that side."},
   {list:[
    "Approach and speak from the <strong>unaffected (seeing) side</strong>",
    "Place the call light, water, phone, and personal items on the <strong>unaffected side</strong>",
    "Teach the patient to <strong>scan</strong> — turn the head toward the affected side to see the whole field",
    "Rotate the tray or remind them to look at the other half; good lighting, glasses on"]},
   {p:"<strong>Unilateral neglect</strong> (most common after a <strong>right</strong>-hemisphere stroke → ignores the <strong>left</strong> side): the patient may not recognize the affected limbs as their own or may not dress/wash that side. <strong>Remind them of the affected side</strong>, keep the limbs aligned and in view, use a mirror when dressing, place clothing on the affected side in order, and teach scanning."},
   {hook:"<strong>Stuff on the good side, teach them to scan to the bad side.</strong> Items go where they can see; therapy pulls their attention back to what they're missing."},
   {h:"Safety and falls"},
   {list:[
    "Right-hemisphere patients are <strong>impulsive</strong> and often unaware of deficits — high fall risk; bed in low position, alarms, frequent rounding",
    "Call light within reach on the unaffected side; non-skid footwear; gait belt; lock wheelchair brakes",
    "Do self-care on the unaffected side first, but don't let the patient ignore the affected side",
    "Assistive devices: electric razor, wide-grip utensils, plate guards, grab bars, raised toilet seat"]},
   {h:"After tPA — the first 24 hours"},
   {list:[
    "Neuro checks and vital signs frequently (e.g., every 15 min × 2 h, every 30 min × 6 h, then hourly to 24 h)",
    "<strong>BP below 185/110</strong>",
    "<strong>No anticoagulants or antiplatelets (aspirin, clopidogrel, heparin) for 24 hours</strong>",
    "Delay invasive lines/tubes (NG tube, urinary catheter, arterial line) for 24 hours if possible; minimize needle sticks",
    "Watch for bleeding: IV sites, gums, urine, stool, emesis",
    "<strong>Intracranial bleed cues</strong>: sudden severe headache, nausea/vomiting, ↓ LOC, new or worse deficits, sharp rise in BP → <strong>stop the infusion and notify the provider</strong> immediately"]},
   {h:"Secondary prevention and teaching"},
   {table:{head:["Strategy","Details"],rows:[
    ["<strong>Antiplatelets</strong>","Aspirin, clopidogrel (sometimes both for a short period after a minor stroke/TIA)"],
    ["<strong>Anticoagulants for A-fib</strong>","Warfarin (INR 2–3) or a DOAC to prevent embolic stroke; no aspirin with warfarin unless ordered"],
    ["<strong>Statin</strong>","Even if LDL is near normal"],
    ["<strong>BP control</strong>","ACE inhibitors, diuretics; BP is the biggest modifiable risk"],
    ["Lifestyle","Stop smoking, limit alcohol, exercise, healthy weight, DASH/Mediterranean diet, manage diabetes"],
    ["Surgery","Carotid endarterectomy or stenting for carotid stenosis"]]}},
   {p:"Teach the family <strong>BE-FAST</strong> and to <strong>call 911</strong> and note the time; include the family in care, fall-proof the home, and watch for caregiver stress and depression in both patient and caregiver."}
  ],
  check:{stem:"A client with a right-hemisphere ischemic stroke has left homonymous hemianopsia. Where should the nurse place the client's call light and water pitcher?", options:["On the client's left side so the client must look for it","On the client's right side","Directly behind the head of the bed","On whichever side the door is on"], answer:1, why:"A right-hemisphere stroke causes left-sided paralysis and left visual field loss, so items go on the unaffected (right) side where the client can see them. The client is taught separately to scan toward the left; making needed items hard to find is unsafe."}
}

]};

const BLOOD_UNIT = { title:"Blood Disorders: Anemias, Sickle Cell &amp; Hemophilia", group:"clot", sub:"Anemia as a decreased-cardiac-output problem, sickle cell disease and crisis care (HOPP), and hemophilia bleeding care.", lessons:[

// ---------- 1. ANEMIAS ----------
{ id:"m4-anemia", title:"Anemias", kicker:"Low red cells = low oxygen delivery — care like decreased cardiac output",
  blocks:[
   {h:"The big idea"},
   {p:"<strong>Anemia</strong> means too few red blood cells (or too little hemoglobin) to carry the oxygen the body needs. There are several forms, but they are <strong>grouped together</strong> for care: the patient looks and is treated like a patient with <strong>decreased cardiac output</strong>, because tissues aren't getting enough oxygen. <strong>Sickle cell disease is the exception</strong> — it is so different that it is studied on its own."},
   {h:"Causes — two ways to end up low"},
   {table:{head:["Problem","Causes"],rows:[
    ["<strong>Not making enough</strong> RBCs","<strong>Nutritional deficiencies</strong> — iron, vitamin B12, folic acid (poor diet, strict vegan diet without B12, alcohol use, malabsorption after gastric/bariatric surgery)<br><strong>Disease</strong> — <strong>chronic kidney disease</strong> (kidneys don't make enough erythropoietin, the hormone that tells the marrow to make RBCs), chronic inflammation/cancer<br><strong>Medications</strong> — <strong>chemotherapy, immunosuppressants</strong> (bone marrow suppression)"],
    ["<strong>Losing or destroying</strong> RBCs","<strong>Blood loss</strong> — GI bleeding (aspirin/NSAIDs, ulcers), heavy menstrual periods, surgery, trauma<br><strong>Destroying them too fast</strong> (hemolysis) → <strong>jaundice</strong> (yellow skin/eyes from bilirubin) and an <strong>enlarged spleen</strong>"]]}},
   {hook:"<strong>Can't make them, or can't keep them.</strong> If cells are destroyed too fast, look for yellow — jaundice."},
   {h:"Signs and symptoms — they look like decreased cardiac output"},
   {table:{head:["System","What you see"],rows:[
    ["Central / neuro","<strong>Fatigue</strong> (the most common symptom), <strong>dizziness, fainting</strong>; confusion in older adults"],
    ["Skin &amp; eyes","<strong>Pallor</strong> (check conjunctivae, gums, and mucous membranes on darker skin), <strong>cold</strong> skin; yellowing with hemolysis"],
    ["Respiratory","<strong>Shortness of breath</strong>, especially with exertion"],
    ["Heart","<strong>Tachycardia</strong>, palpitations, <strong>chest pain/angina</strong> — the heart pumps faster and harder to make up for less oxygen"],
    ["Blood vessels","<strong>Low blood pressure</strong>"],
    ["Muscles","<strong>Weakness</strong>, activity intolerance"],
    ["Other","Enlarged spleen, changed stool color (dark/black stool can mean GI bleeding)"]]}},
   {p:"<strong>Severe or long-standing anemia can lead to heart failure</strong> — the heart wears out from working overtime. Watch for edema, crackles, JVD, ↓ urine output. Mild anemia in older adults increases <strong>falls</strong>, frailty, and confusion."},
   {h:"Nursing care — the decreased cardiac output care plan, plus"},
   {list:[
    "<strong>Assess</strong>: vital signs and <strong>SpO₂ — especially with activity</strong>, heart and lung sounds, signs of HF, skin color, LOC, signs of bleeding (stool, emesis, menstrual history)",
    "<strong>Decreased CO basics</strong>: I&amp;O and hydration, O₂ PRN, bedrest until stable; HOB up if BP is okay, flat with legs elevated if BP is low; goal <strong>SBP above 90, MAP 65 or higher</strong>",
    "<strong>Spread out activities with rest periods</strong>; cluster care; help the patient prioritize what matters most to them",
    "Small, gradual increases in activity to avoid deconditioning",
    "<strong>Fall precautions</strong> — dizziness and weakness; <strong>sit or lie down if dizzy</strong>, change positions slowly",
    "<strong>Oxygen</strong> as needed, especially with heart or lung disease",
    "Promote <strong>hydration</strong> and a well-balanced diet; limit alcohol",
    "Hold/adjust antihypertensives per parameters if BP is low",
    "Monitor CBC trends over time",
    "<strong>Transfusion</strong> (packed RBCs) if severe or from acute blood loss — monitor for reactions and fluid overload"]},
   {h:"Diet — add iron, B12, and folic acid foods"},
   {table:{head:["Nutrient","Food sources"],rows:[
    ["<strong>Iron</strong>","<strong>Red meat</strong>, <strong>organ meats</strong> (liver), beans (pinto, black, garbanzo), <strong>dark leafy greens</strong>, raisins, molasses, iron-fortified cereals"],
    ["<strong>Vitamin B12</strong>","Red meat, liver, eggs, dairy, fortified cereals (vegans need a supplement)"],
    ["<strong>Folic acid</strong>","Dark leafy greens, beans, citrus, <strong>fortified cereals</strong> and breads"],
    ["<strong>Vitamin C</strong> (helps iron absorb)","Citrus/orange juice, strawberries, tomatoes, broccoli — eat <strong>with</strong> iron foods"]]}},
   {h:"Supplements — take ALL of them"},
   {p:"Patients are advised to take <strong>iron, folic acid, and vitamin B12 together, no matter which deficiency they have</strong>, because all three promote healthy red blood cell development."},
   {h:"Teaching — taking oral iron"},
   {list:[
    "Take on an <strong>empty stomach</strong> (1 hour before or 2 hours after a meal) if tolerated, <strong>with orange juice or another vitamin C source</strong>",
    "<strong>Not with milk, dairy, or antacids</strong> — they block absorption",
    "If it upsets the stomach, it may be taken with food (absorbs less, so it takes longer to work)",
    "<strong>Dark green/black stools are expected</strong> and harmless",
    "Constipation is common — fluids, fiber, activity",
    "<strong>Liquid iron stains teeth</strong> — use a straw, then rinse the mouth",
    "Keep taking it for months (to refill iron stores) even after feeling better",
    "IM iron is given by <strong>Z-track</strong>; IV iron may be used if oral iron isn't absorbed or tolerated (watch for reactions)"]},
   {h:"Epoetin alfa"},
   {p:"<strong>Epoetin alfa</strong> is a man-made erythropoietin — it tells the bone marrow to make more RBCs. It is used when diet and supplements aren't enough, especially in <strong>chronic kidney disease</strong> (and with chemotherapy). Given by injection; monitor <strong>hemoglobin</strong> and <strong>blood pressure</strong>."},
   {hook:"<strong>Anemia = decreased CO care + Diet + All three supplements + Rest between activities + Fall precautions.</strong> Epoetin for kidneys; blood for severe."}
  ],
  check:{stem:"A client with anemia from chronic kidney disease reports feeling exhausted by mid-morning. Which nursing action is most appropriate?", options:["Encourage the client to complete all care at once to save energy for later","Schedule rest periods between activities and cluster care","Restrict all activity to bed rest until the hemoglobin is normal","Increase the client's fluid restriction"], answer:1, why:"Fatigue is the most common symptom of anemia; spacing activities with rest periods conserves oxygen supply while preventing deconditioning. Doing everything at once worsens fatigue, total bed rest causes deconditioning, and fluid restriction does not treat the fatigue."}
},

// ---------- 2. SICKLE CELL DISEASE ----------
{ id:"m4-sickle", title:"Sickle Cell Disease", kicker:"Vaso-occlusion, crisis care with HOPP, acute chest syndrome, hydroxyurea",
  blocks:[
   {h:"What's going on"},
   {p:"<strong>Sickle cell disease (SCD)</strong> is an <strong>autosomal recessive</strong> genetic disorder. The patient inherits a sickle hemoglobin (HbS) gene from <strong>each</strong> parent. When oxygen is low, the red cells become <strong>rigid and crescent (sickle) shaped</strong>. Sickled cells:"},
   {list:[
    "<strong>Stick together and block small vessels</strong> (vaso-occlusion) → ischemia, tissue damage, <strong>severe pain</strong>, swelling, fever — a <strong>sickle cell crisis</strong>",
    "<strong>Break down quickly</strong> → chronic hemolytic anemia, <strong>jaundice</strong>, fatigue",
    "Damage any organ over time — especially areas with slow circulation: <strong>lungs, spleen, brain</strong>, kidneys, bones"]},
   {table:{head:["","Sickle cell trait","Sickle cell disease"],rows:[
    ["Genes","One sickle gene + one normal gene (carrier)","Two sickle genes"],
    ["Symptoms","Usually none (unless severe hypoxia)","Lifelong anemia and crises"],
    ["Key teaching","Two carriers → each child has a <strong>1 in 4</strong> chance of SCD; genetic counseling","Crisis prevention and management"]]}},
   {h:"Crisis triggers — anything that lowers O₂ or slows/thickens blood"},
   {list:["<strong>Dehydration</strong>","<strong>Hypoxia</strong> — high altitude, unpressurized flights, smoking, respiratory illness","<strong>Infection</strong>/fever","<strong>Cold</strong> (vasoconstriction slows flow)","<strong>Stress</strong>","<strong>Strenuous exercise</strong>"]},
   {hook:"Triggers make cells <strong>dry, cold, breathless, or stressed</strong>. Keep them <strong>wet, warm, oxygenated, and calm</strong>."},
   {h:"Management — HOPP"},
   {table:{head:["Letter","Focus","Nursing actions"],rows:[
    ["<strong>H — Hydrate</strong>","Fluids keep cells apart and blood flowing; <strong>avoid triggers</strong>","Oral fluids, or <strong>IV fluids</strong> if unable to drink about 2–3 L/day during a crisis; I&amp;O; watch for <strong>fluid overload</strong> (crackles, SOB) — especially with lung or heart involvement"],
    ["<strong>O — Oxygenate</strong>","Prevent and catch <strong>acute chest syndrome</strong>","SpO₂, lung sounds, O₂ as ordered, <strong>incentive spirometry</strong>, deep breathing"],
    ["<strong>P — Perfuse</strong>","Organs downstream of blocked vessels","Neuro checks (<strong>stroke</strong>), HF signs (edema, crackles, JVD), <strong>priapism</strong>/reproductive issues, <strong>leg ulcers</strong>/wound healing, kidney function"],
    ["<strong>P — Pain</strong>","<strong>Control the pain crisis</strong> — fast","Treat promptly; <strong>opioids</strong> (IV/PCA morphine, PO oxycodone); NSAIDs such as <strong>ketorolac with caution — kidneys</strong> (and GI bleeding)"]]}},
   {h:"Acute chest syndrome — the #1 cause of death"},
   {p:"Sickling in the lung vessels (often triggered by infection, fat or clot emboli) → the lungs can't oxygenate, and the patient can deteriorate to <strong>respiratory failure quickly</strong>."},
   {list:[
    "<strong>Chest pain</strong>, <strong>cough</strong>, <strong>fever</strong>, <strong>low O₂</strong>, tachypnea, wheezing",
    "<strong>New infiltrate</strong> on chest X-ray",
    "Treatment: <strong>O₂</strong>, <strong>antibiotics</strong> promptly, bronchodilators, careful hydration, pain control, <strong>transfusion</strong>; ventilator if respiratory failure",
    "Prevention: <strong>incentive spirometry during every crisis</strong>, flu and pneumococcal vaccines"]},
   {hook:"A sickle cell patient with <strong>chest pain + fever + falling SpO₂</strong> is not “just another pain crisis” — that's acute chest syndrome. Report it immediately."},
   {h:"Nursing process — the patient in sickle cell crisis"},
   {table:{head:["Step","Key points"],rows:[
    ["<strong>Assess</strong>","Pain level and whether it is <strong>the same as or different from</strong> usual crisis pain; joints for pain/swelling; abdomen (splenic infarction); SpO₂ and breath sounds; HF signs; <strong>dehydration</strong> (intake, mucous membranes, turgor, urine output, BUN/creatinine); thorough <strong>neuro exam</strong> (silent stroke); <strong>infection</strong> (chest, long bones — pneumonia, osteomyelitis); <strong>leg ulcers</strong>; Hgb, Hct, reticulocytes vs baseline; transfusion and hydroxyurea history"],
    ["<strong>Problems</strong>","Acute/chronic pain and fatigue (tissue hypoxia); risk for infection; powerlessness; knowledge deficit about crisis prevention"],
    ["<strong>Complications to watch</strong>","Skin ulcers/poor healing, dehydration, <strong>stroke</strong>, anemia, kidney injury, <strong>HF, pulmonary hypertension, acute chest syndrome</strong>, impotence/priapism, cognitive changes, distrust between patient and staff over poorly managed pain"],
    ["<strong>Intervene — pain</strong>","<strong>Believe the patient's pain rating</strong> and medicate quickly; support and <strong>elevate swollen joints</strong>; relaxation, breathing exercises; <strong>warmth/heat packs may help — avoid ice and cold</strong> (cold triggers sickling)"],
    ["<strong>Intervene — fatigue</strong>","Balance rest and activity; maximize nutrition, hydration, sleep"],
    ["<strong>Intervene — infection</strong>","Watch for fever and infection; give antibiotics promptly; finish the full course; <strong>pneumococcal and annual flu vaccines</strong>"],
    ["<strong>Intervene — coping</strong>","Listen, advocate, focus on strengths, let the patient make decisions about care — builds trust and adherence"]]}},
   {h:"Other complications"},
   {list:[
    "<strong>Stroke</strong> — sickling in brain vessels; watch for neuro changes; transfusion reduces risk",
    "<strong>Heart failure, pulmonary hypertension</strong> — the heart works harder against chronic anemia",
    "<strong>Priapism</strong> — painful prolonged erection; warm compresses/bath, fluids; <strong>seek care if longer than 3 hours</strong> (repeated episodes → impotence)",
    "<strong>Leg ulcers</strong> — slow to heal; protect from trauma, aseptic wound care, wound-care referral",
    "Kidney injury; infections (functionally no spleen)"]},
   {h:"Medications and treatments"},
   {table:{head:["Treatment","Nursing points"],rows:[
    ["<strong>Hydroxyurea</strong> (chemo drug)","↑ <strong>fetal hemoglobin</strong> → fewer sickled cells → <strong>fewer pain crises</strong>, less acute chest syndrome, fewer transfusions. <strong>Bone marrow suppression</strong> — monitor CBC/<strong>WBC</strong> (hold if too low; infection risk); <strong>teratogenic — contraception</strong>; <strong>wear gloves</strong> (chemo precautions); may cause mouth sores, hair loss; regular labs"],
    ["<strong>Folic acid</strong> daily","Supports the extra RBC production needed to replace hemolyzed cells"],
    ["<strong>Transfusion</strong>","For severe crisis/anemia, acute chest syndrome, stroke, before surgery. Watch for <strong>fluid overload</strong> (harder to breathe), transfusion reactions, and <strong>iron overload</strong> (iron builds up in the liver, heart, pancreas → chelation therapy; monitor iron levels)"],
    ["<strong>Analgesics</strong>","Opioids for severe pain (PCA morphine, oxycodone PO); NSAIDs with caution (kidneys, GI)"],
    ["<strong>Potential cure</strong>","<strong>Stem cell transplant</strong> or <strong>gene therapy</strong> (only for selected patients)"]]}},
   {h:"Teaching — preventing crises"},
   {list:[
    "<strong>Drink plenty of fluids</strong> every day, more in heat, exercise, or illness",
    "<strong>Keep warm</strong>; avoid cold exposure and cold water",
    "Avoid <strong>high altitude</strong>, unpressurized planes, smoking, and <strong>strenuous exercise</strong>; manage stress",
    "<strong>Prevent infection</strong>: hand hygiene, <strong>vaccines</strong> (flu, pneumococcal), report fever early",
    "Take folic acid and hydroxyurea as prescribed; keep lab appointments; contraception with hydroxyurea",
    "Seek care for: fever, <strong>chest pain or shortness of breath</strong>, neuro changes (weakness, speech, vision), priapism over 3 hours, pain not controlled at home"]}
  ],
  check:{stem:"A client in sickle cell crisis rates pain 9/10. The client's temperature is 101.8°F, SpO₂ has dropped from 96% to 89%, and the client has a new cough. What should the nurse suspect?", options:["Expected vaso-occlusive pain crisis","Acute chest syndrome","Opioid-induced respiratory depression","Iron overload"], answer:1, why:"Fever, cough, falling oxygen saturation, and chest symptoms in a client with SCD point to acute chest syndrome, the leading cause of death in SCD. Opioid respiratory depression causes slow, shallow breathing and sedation rather than fever and cough, and iron overload is a long-term transfusion complication."}
},

// ---------- 3. HEMOPHILIA ----------
{ id:"m4-hemophilia", title:"Hemophilia", kicker:"Missing clotting factor — replace it, protect joints, and bleed care without heat",
  blocks:[
   {h:"What it is"},
   {p:"<strong>Hemophilia</strong> is an inherited bleeding disorder caused by a <strong>missing or defective clotting factor</strong>. Platelets form the first plug, but the clot can't be stabilized, so bleeding lasts longer and can start on its own."},
   {table:{head:["","Hemophilia A","Hemophilia B"],rows:[
    ["Missing factor","<strong>Factor VIII</strong>","<strong>Factor IX</strong> (“Christmas disease”)"],
    ["Inheritance","<strong>X-linked recessive</strong>","<strong>X-linked recessive</strong>"],
    ["Who","Mostly <strong>males</strong>; females are usually carriers without symptoms","Same"],
    ["Treatment","Replace <strong>factor VIII</strong> IV","Replace <strong>factor IX</strong> IV"]]}},
   {hook:"<strong>A comes before B, and 8 comes before 9:</strong> hemophilia A = factor VIII, hemophilia B = factor IX. It rides on the <strong>X</strong> chromosome, so boys get it and moms carry it."},
   {h:"Severity — based on how much factor the patient has"},
   {table:{head:["Severity","Factor level","Bleeding"],rows:[
    ["<strong>Severe</strong>","<strong>Below 1%</strong> of normal","<strong>Spontaneous</strong> bleeding into <strong>joints and muscles</strong> and the <strong>GI tract</strong> — often found as a toddler"],
    ["<strong>Moderate</strong>","<strong>1–5%</strong>","Bleeds after trauma or surgery, occasionally spontaneous — usually knows they have it"],
    ["<strong>Mild</strong>","<strong>Above 5% to below 40%</strong>","Bleeds after trauma or surgery — <strong>may not know</strong> until bleeding too much after a procedure"]]}},
   {h:"Where they bleed"},
   {list:[
    "<strong>Joints (hemarthrosis)</strong> — the most common site: knees, elbows, ankles, shoulders, hips. <strong>Pain often comes before swelling</strong>; repeated bleeds → joint damage, chronic pain, loss of motion",
    "<strong>Muscles</strong> — hematomas can compress nerves (numbness, weakness) and cause <strong>compartment syndrome</strong>",
    "<strong>GI bleeding</strong>, <strong>hematuria</strong>",
    "Mucous membranes — gums, nose; bleeding after <strong>dental work</strong> and surgery",
    "<strong>Intracranial</strong> — the most dangerous; <strong>any head injury needs immediate evaluation</strong>; falls are especially dangerous in adults"]},
   {h:"Treatment — give the missing factor"},
   {list:[
    "<strong>Replace the clotting factor IV</strong> (recombinant factor VIII or IX) — <strong>as soon as bleeding starts</strong>; earlier treatment = less damage",
    "<strong>Prophylactic</strong> factor several times a week to protect the joints, and <strong>before any procedure or surgery</strong>",
    "<strong>Patients and families learn to give factor IV at home</strong> at the first sign of a bleed",
    "Desmopressin may raise factor VIII in mild hemophilia A",
    "Some patients develop <strong>inhibitors</strong> (antibodies) against the factor → it stops working well; watch for bleeding that doesn't respond"]},
   {h:"Caring for an active bleed"},
   {table:{head:["DO","DON'T"],rows:[
    ["<strong>Give the clotting factor</strong> as ordered — first and fast","<strong>No heat</strong> — it dilates vessels and increases bleeding"],
    ["<strong>Apply pressure</strong> to stop the bleed — <strong>but not too much</strong>","<strong>No compression wraps</strong> — too much pressure can cause <strong>compartment syndrome</strong>"],
    ["<strong>Elevate</strong> the limb","Don't use the “RICE” mnemonic — compression is not part of hemophilia bleed care"],
    ["<strong>Rest/immobilize</strong> the joint (splint) so the blood can be reabsorbed","No aspirin/NSAIDs for the pain; no IM injections"],
    ["Cold may be applied if ordered; analgesics such as acetaminophen or opioids","No nasal packing for nosebleeds (bleeding restarts when removed)"]]}},
   {hook:"<strong>Factor, Pressure (gentle), Elevate, Rest — never Heat, never Wrap.</strong>"},
   {h:"Nursing process"},
   {list:[
    "<strong>Assess the bleed</strong>: location and extent, joint pain/swelling/range of motion, neurovascular checks (pulses, sensation, pain out of proportion → compartment syndrome)",
    "Watch for life-threatening bleeds: <strong>altered LOC</strong>/headache (intracranial), <strong>respiratory distress</strong> (bleeding into the airway/neck)",
    "After surgery: frequent vital signs, dressings, and drains for bleeding",
    "Manage pain from hematomas and joint bleeds (no NSAIDs)",
    "Avoid <strong>all injections</strong> and invasive procedures unless factor is given first",
    "<strong>Coping</strong>: lifelong disease with limits; support independence while keeping the patient safe; involve the family",
    "<strong>Genetic counseling</strong> for female carriers"]},
   {h:"Teaching"},
   {list:[
    "<strong>How to give factor IV at home</strong> and when (first sign of bleeding, before procedures)",
    "<strong>No aspirin or NSAIDs</strong>; avoid alcohol and herbals that affect platelets; check every new medicine",
    "<strong>No IM injections</strong>",
    "<strong>Soft toothbrush</strong>, good dental care (fewer extractions); <strong>electric razor</strong>",
    "<strong>Avoid contact sports</strong>; choose safe activities (swimming); fall-proof the home",
    "<strong>Wear medical ID</strong>; keep a written emergency plan with contacts",
    "Report: joint pain/swelling, headache or any head injury, blood in urine or stool, bleeding that won't stop"]}
  ],
  check:{stem:"A client with severe hemophilia A reports pain and early swelling in the right knee after bumping it. After giving factor VIII as prescribed, which action should the nurse take?", options:["Apply a warm pack to reduce pain","Wrap the knee snugly with an elastic compression bandage","Elevate the leg and keep the knee at rest","Give ibuprofen for the pain"], answer:2, why:"Elevating and resting (immobilizing) the joint helps stop the bleeding and lets the blood be reabsorbed. Heat increases bleeding, a compression wrap can cause compartment syndrome, and NSAIDs such as ibuprofen impair platelet function."}
}

]};

// ===================== MEDICATIONS =====================

const M4_MEDS = { title:"Medications", sub:"Perfusion drug classes — what each does, what to watch, and what to teach.", lessons:[
{ id:"m4-meds-bb-ccb", title:"Beta Blockers &amp; Calcium Channel Blockers", kicker:"Metoprolol, carvedilol, atenolol, propranolol, labetalol, esmolol — diltiazem, verapamil, amlodipine, nifedipine",
  blocks:[
   {p:"Both classes <strong>lower the heart's workload and oxygen demand</strong>. Both can drop the heart rate and the blood pressure — so both share the same check before every dose: <strong>pulse and BP</strong>."},
   {h:"Metoprolol, Carvedilol, Atenolol, Propranolol, Labetalol, Esmolol — Beta Blockers (\"-olol\")"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","PO daily/BID; IV push (metoprolol, labetalol — <strong>give slowly</strong>); esmolol is a short-acting <strong>IV drip</strong>. Hypertension, <strong>angina/CAD</strong> (every chest-pain patient gets one unless contraindicated), after MI, <strong>heart failure</strong> (carvedilol, metoprolol succinate — started low and titrated up slowly over weeks), <strong>rate control</strong> for A-fib, A-flutter, and SVT. Labetalol IV is common for acute BP control (e.g., stroke). Metoprolol and atenolol are <strong>cardioselective</strong> (mostly beta-1); propranolol, carvedilol, and labetalol are nonselective"],
     ["Mechanism of action","Blocks <strong>beta-1 receptors</strong> in the heart → ↓ heart rate, ↓ contractility, slower conduction through the AV node, ↓ BP → <strong>↓ myocardial O₂ demand</strong> and ↓ dysrhythmia risk. Nonselective drugs also block beta-2 receptors in the lungs"],
     ["Adverse reactions","The <strong>4 B's: Bradycardia, BP drop, Bronchoconstriction, Blood-sugar masking</strong>; fatigue, dizziness/orthostatic hypotension, depression, erectile dysfunction; HF symptoms can worsen in the first weeks of therapy; cold extremities"],
     ["Contraindications","<strong>Bradycardia</strong>, <strong>heart block</strong>, cardiogenic shock/acutely decompensated HF; use with caution in <strong>asthma/COPD</strong> (especially nonselective drugs) and diabetes"],
     ["Nursing interventions","Check the <strong>apical pulse and BP</strong> before each dose — <strong>hold and notify if HR is below 60 or SBP is below 90</strong>; give IV pushes slowly with the patient on a monitor; daily weights, edema, and lung sounds (wheezes, crackles); monitor glucose in diabetics; hold before a stress test as ordered"],
     ["Patient education","<strong>Never stop abruptly</strong> — rebound tachycardia, chest pain, or MI; the provider tapers it. Check your pulse at home; rise slowly; diabetics: tremor and fast heartbeat may be hidden, so check glucose (sweating still occurs); no OTC drugs (e.g., decongestants) without approval; report wheezing, SOB, weight gain, or dizziness"]]}},
   {h:"Diltiazem, Verapamil, Amlodipine, Nifedipine — Calcium Channel Blockers"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","Two groups. <strong>Diltiazem and verapamil</strong> act on the heart: <strong>rate control</strong> for A-fib, A-flutter, and SVT (diltiazem IV push slowly, then a drip, or PO), angina. <strong>Amlodipine and nifedipine</strong> act on the vessels: <strong>hypertension</strong> and angina (including vasospastic angina). PO daily (extended-release forms — swallow whole)"],
     ["Mechanism of action","Blocks calcium entry into heart and vascular smooth muscle → <strong>vasodilation</strong>, ↓ afterload, ↓ O₂ demand, more blood flow to the heart muscle. Diltiazem and verapamil also <strong>slow the SA node and AV conduction</strong> and reduce contractility"],
     ["Adverse reactions","<strong>Hypotension</strong>, dizziness, headache, flushing; <strong>bradycardia/heart block</strong> (diltiazem, verapamil); <strong>peripheral edema</strong> (ankles — especially amlodipine, nifedipine); <strong>constipation</strong> (most with verapamil); reflex tachycardia (short-acting nifedipine). Hypotension is most likely when given IV"],
     ["Contraindications","<strong>Heart block</strong>, sick sinus syndrome, SBP below 90; diltiazem/verapamil with HFrEF (they weaken contraction); caution when combined with a beta blocker (additive bradycardia)"],
     ["Nursing interventions","Check BP and HR — <strong>hold and notify if SBP is below 90 or HR is below 60</strong>; continuous ECG monitoring with IV diltiazem; assess for edema of the hands and feet, weight gain, and SOB; monitor for constipation"],
     ["Patient education","<strong>No grapefruit or grapefruit juice</strong> (raises drug levels); rise slowly; don't stop abruptly (more frequent, longer angina); NTG can still be taken for acute angina; report swelling, SOB, dizziness, or a slow pulse; fiber and fluids for constipation"]]}},
   {h:"Same Checks, Different Jobs"},
   {table:{head:["","Beta blockers","CCBs"],rows:[
     ["Recognize","\"-olol\" (plus carvedilol, labetalol)","Diltiazem, verapamil, \"-dipine\""],
     ["Hold/notify","HR below 60 or SBP below 90","HR below 60 or SBP below 90"],
     ["Signature warning","4 B's; never stop abruptly","Grapefruit; edema; heart block"],
     ["Rhythm use","Rate control (metoprolol)","Rate control (diltiazem)"],
     ["Avoid in","Heart block, asthma (caution)","Heart block, SBP below 90"]]}},
   {hook:"<b>DIL-tiazem DILates and slows the rate; amlo-DIP-ine DIPs the pressure.</b> For beta blockers think <b>4 B's</b> — and the 5th: <b>Bye-bye abruptly? Never.</b>"},
   {hook:"Heart block on the strip? <strong>No beta blockers and no CCBs</strong> — both slow AV conduction even more."}
  ],
  check:{stem:"A client with A-fib is due for oral diltiazem. The apical pulse is 54 and BP is 102/64. What should the nurse do?",
   options:["Give the dose and recheck the pulse in 1 hour","Give half the dose","Hold the dose and notify the provider","Have the client drink grapefruit juice to boost absorption"],
   answer:2,
   why:"CCBs are held and the provider notified when the HR is below 60 or SBP is below 90. A pulse of 54 meets the hold parameter. Grapefruit raises CCB levels and is avoided."}
},
{ id:"m4-meds-raas", title:"ACE Inhibitors, ARBs &amp; ARNI", kicker:"Lisinopril, enalapril, captopril, benazepril — losartan, valsartan — sacubitril/valsartan (Entresto)",
  blocks:[
   {p:"These drugs block the <strong>renin–angiotensin–aldosterone system</strong> — the hormone loop that squeezes vessels and holds onto sodium and water. Blocking it lowers BP, takes fluid off, and <strong>prevents remodeling</strong> of the heart. They share the same big three to monitor: <strong>BP, potassium, kidney function</strong> — and none are given in pregnancy."},
   {h:"Lisinopril, Enalapril, Captopril, Benazepril — ACE Inhibitors (\"-pril\")"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","PO daily (enalaprilat is IV). <strong>Hypertension</strong>, <strong>heart failure</strong> (slows progression, fewer hospitalizations), after MI/at discharge with CAD (<strong>prevents ventricular remodeling</strong>), diabetes with kidney protection"],
     ["Mechanism of action","Blocks the enzyme that converts angiotensin I to angiotensin II → vasodilation (↓ afterload — less pressure to pump against) and less aldosterone (↓ sodium and water retention — ↓ preload); the kidneys <strong>keep potassium</strong>"],
     ["Adverse reactions","<strong>Dry, hacking cough</strong> (bradykinin builds up); <strong>angioedema</strong> — swelling of the lips, tongue, face, throat (can occur even after years of use); <strong>hyperkalemia</strong>; <strong>first-dose hypotension</strong>/orthostatic hypotension and dizziness; rising creatinine (kidney injury)"],
     ["Contraindications","<strong>Pregnancy</strong> (black box — fetal injury/death); history of angioedema; bilateral renal artery stenosis; hyperkalemia; <strong>never with an ARNI</strong> (36-hour washout); not combined with an ARB unless specifically ordered"],
     ["Nursing interventions","Check BP before each dose (first dose — watch closely for hypotension); monitor <strong>potassium, BUN/creatinine</strong>; assess for angioedema — airway emergency: stop the drug, call for help; assess any cough (a wet cough with crackles may mean worsening HF, not the drug)"],
     ["Patient education","Rise slowly (fall risk); <strong>avoid salt substitutes</strong> (potassium chloride) and potassium supplements unless ordered; report facial/tongue swelling or trouble breathing right away (911); report a cough that won't stop — the provider may switch to an ARB; use contraception and report pregnancy; take consistently"]]}},
   {h:"Losartan, Valsartan — Angiotensin II Receptor Blockers (ARBs, \"-sartan\")"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","PO daily. Same uses as ACE inhibitors — hypertension, heart failure, kidney protection in diabetes, stroke prevention through BP control. The usual <strong>switch when an ACE inhibitor causes a cough</strong>"],
     ["Mechanism of action","Blocks angiotensin II at its receptor → vasodilation and less aldosterone. ARBs don't build up bradykinin, so <strong>no cough</strong>"],
     ["Adverse reactions","Hypotension, dizziness, <strong>hyperkalemia</strong>, kidney impairment; angioedema is possible but less common than with ACE inhibitors"],
     ["Contraindications","<strong>Pregnancy</strong> (black box — fetal toxicity; stop immediately); hyperkalemia; bilateral renal artery stenosis; not with an ACE inhibitor unless specifically ordered"],
     ["Nursing interventions","Monitor BP, <strong>potassium</strong>, BUN/creatinine, and I&amp;O"],
     ["Patient education","Same as ACE inhibitors: rise slowly, no salt substitutes, report swelling of the face/lips; take it every day (adherence) along with lifestyle changes; contraception"]]}},
   {h:"Sacubitril/Valsartan (Entresto) — Angiotensin Receptor–Neprilysin Inhibitor (ARNI)"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","PO <strong>twice daily</strong>. <strong>Heart failure</strong> (HFrEF) — reduces cardiovascular death and hospitalization; preferred first-line angiotensin blocker for most symptomatic HFrEF. Sacubitril/valsartan is the <strong>only FDA-approved drug in its class</strong>. If an ARNI can't be taken (e.g., cost), an ACE inhibitor or ARB is the alternative"],
     ["Mechanism of action","Two drugs in one tablet: <strong>valsartan</strong> (an ARB) blocks angiotensin II, and <strong>sacubitril</strong> blocks neprilysin — the enzyme that breaks down the body's own natriuretic peptides — so more sodium and water are excreted and vessels relax"],
     ["Adverse reactions","<strong>Hypotension</strong>, <strong>hyperkalemia</strong>, <strong>kidney impairment</strong>, <strong>angioedema</strong>, dizziness, cough"],
     ["Contraindications","<strong>Never with an ACE inhibitor — stop the ACE inhibitor at least 36 hours before the first dose</strong> (together they cause angioedema); history of angioedema; <strong>pregnancy</strong>"],
     ["Nursing interventions","Verify the <strong>36-hour washout</strong> when switching from an ACE inhibitor; monitor BP, potassium, and kidney function (BUN/creatinine); assess for angioedema"],
     ["Patient education","Never take it with a \"-pril\" drug; rise slowly; avoid salt substitutes; report facial/throat swelling (911); contraception — report pregnancy; it's taken twice a day"]]}},
   {h:"Telling Them Apart"},
   {table:{head:["","ACE inhibitor","ARB","ARNI"],rows:[
     ["Ending","-pril","-sartan","sacubitril/valsartan"],
     ["Cough","Yes (classic)","No","Less common"],
     ["Angioedema","Yes — any time","Rare","Yes"],
     ["K⁺/kidneys/BP","Monitor all three","Monitor all three","Monitor all three"],
     ["Pregnancy","Contraindicated","Contraindicated","Contraindicated"],
     ["Key rule","Switch to ARB if cough","Don't combine with an ACE inhibitor","36-hour washout from an ACE inhibitor"]]}},
   {hook:"<b>\"Pril\" = the Pill that makes you cough.</b> Swap the <b>pril for a sartan</b> and the cough goes. <b>Entresto + a pril = angioedema</b> — so wait <b>36 hours</b> between them."},
   {hook:"All three <strong>keep potassium</strong>. Put that next to a potassium-sparing diuretic (spironolactone) and the K⁺ can climb fast — and no salt substitutes."}
  ],
  check:{stem:"A client with HFrEF is being switched from lisinopril to sacubitril/valsartan. The last lisinopril dose was 12 hours ago. What is the nurse's best action?",
   options:["Give the first sacubitril/valsartan dose now","Hold the dose and clarify — at least 36 hours must pass after the last ACE inhibitor dose","Give the dose with a salt substitute to prevent hypokalemia","Give the dose and check for a dry cough"],
   answer:1,
   why:"An ARNI must not be given within 36 hours of an ACE inhibitor because the combination causes angioedema. Salt substitutes contain potassium and are avoided; hyperkalemia, not hypokalemia, is the risk."}
},
{ id:"m4-meds-brady", title:"Atropine &amp; Vasopressors", kicker:"Speeding up a slow heart — atropine, dopamine, epinephrine, norepinephrine, and phentolamine for extravasation",
  blocks:[
   {p:"Bradycardia is treated when it is <strong>symptomatic</strong> (signs of decreased cardiac output) — HR is typically below 50. Look for and treat the cause first. The drug order: <strong>atropine first</strong> → if it doesn't work, <strong>transcutaneous pacing and/or a dopamine or epinephrine drip</strong> → transvenous pacing/expert consult."},
   {h:"Atropine — Anticholinergic"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","<strong>Symptomatic bradycardia — first-line drug. 1 mg IV push every 3–5 minutes, max 3 mg</strong>. Comes in a prefilled syringe; short-acting (wears off in roughly 30–45 minutes)"],
     ["Mechanism of action","Blocks the vagus nerve (parasympathetic) \"brake\" on the SA and AV nodes → the heart rate rises"],
     ["Adverse reactions","Tachycardia, palpitations; <strong>anticholinergic effects</strong> — dry mouth, blurred vision/dilated pupils, urinary retention, flushed hot dry skin, confusion; can increase O₂ demand/ischemia"],
     ["Contraindications","Angle-closure glaucoma; urinary obstruction; may not work in a heart-transplant patient (no vagal connection) or in some heart blocks — move to pacing"],
     ["Nursing interventions","Continuous ECG, HR, and BP; have pacing pads ready if it fails; reassess symptoms (BP, LOC, chest pain) after each dose; monitor urine output"],
     ["Patient education","Explain the expected racing heart, dry mouth, and blurry vision; report trouble urinating or chest pain"]]}},
   {h:"Dopamine, Epinephrine, Norepinephrine — Vasopressors"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","Continuous IV drips, <strong>titrated</strong> — ICU/ER drugs (nobody goes home on them). For bradycardia when atropine fails: <strong>dopamine 5–20 mcg/kg/min</strong> or <strong>epinephrine 2–10 mcg/min</strong>. Norepinephrine is the go-to for <strong>low BP/shock</strong>. Epinephrine is also the cardiac-arrest drug (Medical Emergencies)"],
     ["Mechanism of action","Stimulate adrenergic receptors → ↑ heart rate and contractility (beta-1) and <strong>vasoconstriction</strong> (alpha) → ↑ BP and perfusion pressure"],
     ["Adverse reactions","Tachycardia, <strong>dysrhythmias</strong> (PVCs, SVT, V-tach — palpitations), chest pain/ischemia (↑ O₂ demand), hypertension, headache; poor peripheral perfusion (cool, pale fingers and toes); <strong>vesicant — extravasation causes tissue necrosis</strong>"],
     ["Contraindications","Uncorrected hypovolemia (fill the tank first); tachydysrhythmias/V-fib (except epinephrine in arrest); use with caution in CAD"],
     ["Nursing interventions","<strong>Infusion pump</strong>; <strong>large vein — central line preferred</strong>; check the IV site often; titrate to orders; <strong>BP, HR, and rhythm frequently</strong> (e.g., every 5 minutes while titrating), pulses, capillary refill, urine output; protect epinephrine/norepinephrine from light per pharmacy; never stop abruptly — wean"],
     ["Patient education","Explain the monitor and frequent checks; report pain, burning, or swelling at the IV site, chest pain, or palpitations right away"]]}},
   {h:"Phentolamine — Extravasation Antidote"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","<strong>Extravasation of a vasopressor</strong> (norepinephrine, dopamine, epinephrine) — diluted and injected SubQ in several spots around the infiltrated area as soon as possible"],
     ["Mechanism of action","Alpha-blocker — reverses the intense local vasoconstriction so blood returns to the tissue before it dies"],
     ["Adverse reactions","Hypotension, tachycardia, dizziness"],
     ["Contraindications","Caution with CAD (reflex tachycardia, ischemia)"],
     ["Nursing interventions","At the first sign (pain, swelling, blanching, coolness at the site): <strong>stop the infusion</strong>, disconnect the tubing, aspirate from the catheter if possible, notify the provider, <strong>give phentolamine</strong> as ordered, elevate, mark and monitor the site; follow facility extravasation protocol; restart the drip in another (preferably central) line"],
     ["Patient education","Report any burning, pain, or coolness at the IV site immediately"]]}},
   {hook:"<b>Brady ladder: A-P-D-E</b> — <b>A</b>tropine 1 mg (max 3), then <b>P</b>acing and/or <b>D</b>opamine or <b>E</b>pinephrine drip."},
   {hook:"<b>Vasopressors are vesicants.</b> Blanched, cold, painful site? <b>Stop, aspirate, phentolamine.</b> Norepinephrine \"pulls the blood away\" — phentolamine \"puts it back.\""}
  ],
  check:{stem:"A client has a HR of 38, BP 78/46, and is dizzy and pale. Atropine 1 mg IV was given 5 minutes ago with no change. Which order should the nurse anticipate next?",
   options:["Adenosine 6 mg rapid IV push","Transcutaneous pacing and/or a dopamine drip","Metoprolol 5 mg IV push","Amiodarone 150 mg IV"],
   answer:1,
   why:"For symptomatic bradycardia, atropine 1 mg can be repeated every 3–5 minutes up to 3 mg; if it is ineffective, transcutaneous pacing and/or a dopamine (5–20 mcg/kg/min) or epinephrine (2–10 mcg/min) drip follow. Adenosine, metoprolol, and amiodarone slow the heart and would worsen bradycardia."}
},
{ id:"m4-meds-antiarrhythmic", title:"Antiarrhythmics", kicker:"Adenosine, amiodarone, lidocaine, and magnesium sulfate",
  blocks:[
   {p:"Antiarrhythmics are the <strong>second line</strong> — find and treat the cause first (electrolytes, hypoxia, fever, pain, bleeding). Unstable patients get electricity, not a pill."},
   {h:"The Classes at a Glance"},
   {table:{head:["Class","Drugs","What it does"],rows:[
     ["IB — sodium channel blocker","Lidocaine","Ventricular dysrhythmias only"],
     ["II — beta blockers","Metoprolol, esmolol, propranolol","Slow the rate (A-fib, A-flutter, SVT)"],
     ["III — potassium channel blocker","Amiodarone","Atrial and ventricular dysrhythmias; prolongs repolarization"],
     ["IV — calcium channel blockers","Diltiazem, verapamil","Slow AV conduction (rate control)"],
     ["Miscellaneous","Adenosine, atropine, epinephrine (also magnesium sulfate)","Adenosine resets SVT; atropine speeds brady; epinephrine for brady/arrest; magnesium for torsades"]]}},
   {h:"Adenosine (Adenocard) — Miscellaneous Antiarrhythmic"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","<strong>Stable, narrow, regular tachycardia (SVT)</strong> after vagal maneuvers fail. <strong>6 mg rapid IV push followed by a 20 mL NS flush</strong>; if no conversion in 1–2 minutes, <strong>12 mg</strong>"],
     ["Mechanism of action","Briefly blocks conduction through the AV node — interrupts the reentry circuit and \"reboots\" the heart. Half-life under 10 seconds"],
     ["Adverse reactions","<strong>Brief asystole/pause (expected)</strong>, flushing, chest pressure, dyspnea, light-headedness, a feeling of doom; transient dysrhythmias. Effects pass within seconds"],
     ["Contraindications","Heart block or sick sinus without a pacemaker; caution in asthma (bronchospasm); not for irregular or wide-complex rhythms"],
     ["Nursing interventions","<strong>Crash cart and provider at the bedside</strong>; continuous ECG (print the strip); use an <strong>antecubital or central line</strong> closest to the heart; two-syringe or stopcock technique — <strong>push fast, flush fast</strong>, raise the arm"],
     ["Patient education","Warn the patient beforehand: \"You may feel your heart stop, chest pressure, or flushing for a few seconds — it passes quickly\""]]}},
   {h:"Amiodarone (Cordarone, Pacerone) — Class III"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","IV bolus/drip in acute settings, then <strong>PO</strong> for maintenance once stable. A-fib/A-flutter (rate or rhythm control), recurrent or unstable V-tach, V-fib (in arrest it is given IV push — Medical Emergencies). Very long half-life (weeks)"],
     ["Mechanism of action","Blocks potassium (and sodium) channels → prolongs repolarization, slows electrical impulses, and decreases cardiac excitability; also has beta-blocking effects"],
     ["Adverse reactions","Black box: <strong>pulmonary toxicity</strong> (cough, dyspnea — can be fatal) and <strong>liver toxicity</strong>; <strong>thyroid</strong> problems (hypo- or hyper-, it contains iodine); <strong>vision changes</strong> (corneal deposits); <strong>photosensitivity, blue-gray skin</strong>; <strong>bradycardia, hypotension</strong>, heart block; <strong>QT prolongation</strong>/proarrhythmia"],
     ["Contraindications","Severe sinus node disease, marked bradycardia, heart block without a pacemaker; caution with beta blockers/CCBs (additive slowing)"],
     ["Nursing interventions","Continuous ECG (HR, QT), BP; baseline and periodic <strong>chest X-ray/pulmonary function, liver enzymes, thyroid levels, eye exams</strong>, electrolytes (K⁺, Mg²⁺); infusion pump; raises <strong>warfarin and digoxin</strong> levels"],
     ["Patient education","Sunscreen and protective clothing; <strong>avoid grapefruit juice</strong>; keep all lab and eye appointments; report cough/SOB, vision changes, jaundice/dark urine, palpitations, dizziness, or weight change/heat-cold intolerance"]]}},
   {h:"Lidocaine — Class IB"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","<strong>Ventricular dysrhythmias only</strong> — V-tach, V-fib, frequent PVCs. IV bolus, then a continuous drip on an infusion pump (1–4 mg/min)"],
     ["Mechanism of action","Blocks sodium channels in the ventricles → decreases ventricular excitability (\"<strong>Lido = Lowers</strong> ventricular irritability\")"],
     ["Adverse reactions","<strong>CNS toxicity</strong> — confusion, drowsiness, numbness/tingling around the mouth, <strong>tinnitus</strong>, slurred speech, tremor, <strong>seizures</strong>; bradycardia, hypotension, heart block"],
     ["Contraindications","Allergy to amide local anesthetics; severe heart block without a pacemaker; not for atrial rhythms"],
     ["Nursing interventions","Continuous ECG; <strong>infusion pump — never exceed the ordered rate</strong>; neuro checks for toxicity; seizure precautions; caution in older adults, liver disease, HF (slower clearance)"],
     ["Patient education","Report confusion, ringing in the ears, numbness/tingling, or feeling shaky; continued heart monitoring is needed"]]}},
   {h:"Magnesium Sulfate — for Torsades de Pointes"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","<strong>Torsades de pointes</strong> (polymorphic V-tach linked to low magnesium/long QT) and hypomagnesemia. 1–2 g IV, diluted, over minutes (faster in arrest)"],
     ["Mechanism of action","Stabilizes the cardiac cell membrane and shortens the abnormal repolarization that triggers torsades"],
     ["Adverse reactions","Flushing, sweating, <strong>hypotension</strong> (if pushed too fast); toxicity — <strong>loss of deep tendon reflexes</strong>, respiratory depression, bradycardia/heart block"],
     ["Contraindications","Heart block; caution in kidney failure (magnesium builds up)"],
     ["Nursing interventions","Continuous ECG; BP, RR, <strong>deep tendon reflexes</strong>; serum magnesium level; infusion pump; calcium gluconate is the antidote for magnesium toxicity"],
     ["Patient education","Expect warmth/flushing; report weakness or trouble breathing"]]}},
   {h:"Beware the Look-Alike \"A\" Drugs"},
   {table:{head:["Drug","Use","What it does to the rate"],rows:[
     ["<strong>A</strong>tropine","Symptomatic <strong>bradycardia</strong>","Speeds it up"],
     ["<strong>A</strong>denosine","Stable narrow-complex <strong>SVT</strong>","Briefly stops it (reset)"],
     ["<strong>A</strong>miodarone","A-fib, V-tach/V-fib","Steadies and slows it"],
     ["<strong>A</strong>lteplase (bonus)","Clot-busting thrombolytic — not an antiarrhythmic","None — dissolves clots"]]}},
   {hook:"Atropine = <b>Accelerate</b>. Adenosine = <b>A pause</b> (\"slam and flush\"). Amiodarone = <b>A lot of organs</b> to watch — <b>TELLS</b>: <b>T</b>hyroid, <b>E</b>yes, <b>L</b>ungs, <b>L</b>iver, <b>S</b>kin."},
   {hook:"<b>Lidocaine lives in the ventricles.</b> <b>Torsades → magnesium.</b>"}
  ],
  check:{stem:"Immediately after adenosine 6 mg rapid IV push for SVT, the monitor shows a 4-second pause before a sinus rhythm at 88. What should the nurse do?",
   options:["Begin chest compressions","Prepare atropine 1 mg IV","Recognize this as an expected effect and continue monitoring","Give a second dose of 6 mg immediately"],
   answer:2,
   why:"A brief pause or asystole is expected after adenosine because it blocks AV conduction for a few seconds; the rhythm converted to sinus. Compressions and atropine are not indicated, and a repeat dose (12 mg) is only for failure to convert."}
},
{ id:"m4-meds-anticoag", title:"Anticoagulants", kicker:"Heparin, enoxaparin, warfarin, and the DOACs — labs, reversal agents, and bleeding precautions",
  blocks:[
   {p:"Anticoagulants <strong>prevent new clots and stop existing clots from growing — they do not dissolve clots</strong> (that's a thrombolytic). They're used for DVT/PE treatment and prevention and for A-fib/A-flutter (blood pooling in the atria). The big risk for all of them is <strong>bleeding</strong>."},
   {h:"Heparin (Unfractionated) — Anticoagulant"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","<strong>IV continuous infusion</strong> (weight-based, on an electronic pump) for DVT/PE, unstable angina/chest pain (lowers the chance of MI), A-fib — often an IV bolus, then a continuous infusion; <strong>SubQ</strong> for DVT prevention. Starts working right away; short half-life (60–90 min). Used to bridge until warfarin is therapeutic"],
     ["Mechanism of action","Binds antithrombin → inactivates clotting factors (thrombin, Xa) → prevents extension of the thrombus and new clot formation"],
     ["Adverse reactions","<strong>Bleeding</strong>; <strong>heparin-induced thrombocytopenia (HIT)</strong> — platelets fall and, paradoxically, new clots form; bruising/hematoma at injection sites"],
     ["Contraindications","Active bleeding, severe thrombocytopenia, history of HIT, recent brain/spine/eye surgery, uncontrolled HTN"],
     ["Nursing interventions","Monitor <strong>aPTT</strong> (\"two t's make an H\") — dose is adjusted to the aPTT, and therapy is usually considered <strong>therapeutic at about 2–2.5 times the normal aPTT</strong>; monitor the <strong>platelet count</strong> and Hgb/Hct. Watch for external and internal bleeding (↓ BP, ↑ HR, falling Hgb/Hct). Bleeding precautions: hold pressure on needle sites longer than usual, <strong>avoid IM injections</strong>, avoid trauma and constant use of an automatic BP cuff. If HIT is suspected: stop all heparin (including flushes), notify — a direct thrombin inhibitor (argatroban) may be ordered. SubQ: abdomen at least 2 inches from the umbilicus, <strong>don't aspirate or rub</strong>. Double-check doses with another nurse (high-alert). <strong>Antidote: protamine sulfate</strong> (watch for hypotension, bradycardia)"],
     ["Patient education","Report bleeding gums, nosebleeds, blood in urine/stool, bruising; bleeding precautions (soft toothbrush, electric razor)"]]}},
   {h:"Enoxaparin (Lovenox), Dalteparin — Low-Molecular-Weight Heparin (LMWH)"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","<strong>SubQ once or twice daily</strong>. DVT prevention (after surgery, immobility) and treatment of DVT/PE; may replace IV heparin for <strong>unstable angina</strong>; bridging to warfarin; can be given at home. <strong>Can be used during pregnancy</strong> (with close monitoring)"],
     ["Mechanism of action","Inhibits factor Xa → prevents thrombus extension and new clots"],
     ["Adverse reactions","Bleeding (fewer complications than unfractionated heparin), injection-site bruising/hematoma, <strong>lower risk of HIT</strong>"],
     ["Contraindications","Active bleeding; history of HIT; caution with kidney impairment and with spinal/epidural anesthesia (spinal hematoma)"],
     ["Nursing interventions","Prefilled syringe: <strong>do NOT expel the air bubble</strong> (it ensures the full dose); inject into the abdomen (\"love handles\"), rotate sites; <strong>don't aspirate, don't rub</strong>; monitor platelets, CBC, kidney function — routine aPTT isn't needed. Antidote: <strong>protamine sulfate</strong> (only partly effective)"],
     ["Patient education","Self-injection technique; expect small bruises; report bleeding or large bruises; safe sharps disposal"]]}},
   {h:"Warfarin (Coumadin) — Vitamin K Antagonist"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","<strong>PO once daily at the same time</strong>. Long-term prevention: A-fib, after DVT/PE (at least 3–6 months), mechanical heart valves. <strong>Slow onset — days</strong> (full antithrombotic effect in 2–7 days), so heparin or LMWH is given with it at the start (<strong>bridging</strong>) until the INR is therapeutic. Narrow therapeutic window"],
     ["Mechanism of action","Blocks the liver's use of <strong>vitamin K</strong> to make clotting factors II, VII, IX, and X"],
     ["Adverse reactions","<strong>Bleeding/hemorrhage</strong> (black box); bruising; reddish/brown urine, red or black stools"],
     ["Contraindications","Active bleeding; <strong>pregnancy</strong> (crosses the placenta — fetal bleeding/defects); severe liver disease; patients unable to follow up with labs"],
     ["Nursing interventions","Monitor <strong>PT/INR — goal 2–3</strong>; many <strong>drug and food interactions</strong> (antibiotics, amiodarone, aspirin/NSAIDs, herbals); <strong>antidote: vitamin K (phytonadione)</strong>; fresh-frozen plasma or prothrombin complex concentrate for serious bleeding; periprocedural bridging when held"],
     ["Patient education","<strong>Keep vitamin K intake consistent</strong> (leafy greens — don't suddenly add or stop them); avoid alcohol; no aspirin, NSAIDs, or supplements without approval; keep every INR appointment; bleeding precautions"]]}},
   {h:"Rivaroxaban (Xarelto), Apixaban (Eliquis), Dabigatran (Pradaxa) — Direct Oral Anticoagulants (DOACs)"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","PO, fixed doses — <strong>no routine INR monitoring</strong>. Treat and prevent DVT/PE; stroke prevention in A-fib (not for mechanical valves). Rivaroxaban once or twice daily (higher doses with food); apixaban twice daily; dabigatran twice daily"],
     ["Mechanism of action","Rivaroxaban and apixaban <strong>directly inhibit factor Xa</strong>; dabigatran is a <strong>direct thrombin inhibitor</strong>. Fast onset (hours)"],
     ["Adverse reactions","<strong>Bleeding</strong>; GI upset/dyspepsia (dabigatran); spinal hematoma with epidural/spinal procedures"],
     ["Contraindications","Active bleeding; mechanical heart valves; <strong>severe kidney impairment</strong> (low creatinine clearance); pregnancy (generally avoided)"],
     ["Nursing interventions","Assess <strong>kidney function</strong> (and liver), CBC; dose by age/weight/kidney function as ordered; may need bridging around procedures. <strong>Reversal: andexanet alfa</strong> for rivaroxaban/apixaban; <strong>idarucizumab (Praxbind)</strong> for dabigatran; activated charcoal for a recent overdose"],
     ["Patient education","Don't skip doses — protection wears off quickly; no known food interactions; dabigatran: swallow capsules whole and keep them in the original bottle (moisture); bleeding precautions; tell every provider/dentist"]]}},
   {h:"Monitoring Labs and Reversal Agents"},
   {table:{head:["Drug","Lab to monitor","Reversal agent"],rows:[
     ["Heparin (IV)","<strong>aPTT</strong>, platelets (HIT)","<strong>Protamine sulfate</strong>"],
     ["Enoxaparin (LMWH)","Platelets, CBC, kidney function","Protamine sulfate (partial)"],
     ["Warfarin","<strong>PT/INR</strong> (goal 2–3)","<strong>Vitamin K</strong>; FFP or prothrombin complex concentrate"],
     ["Rivaroxaban, apixaban","No routine coagulation test; kidney function","<strong>Andexanet alfa</strong> (or activated charcoal)"],
     ["Dabigatran","No routine coagulation test; kidney function","<strong>Idarucizumab</strong>"],
     ["Argatroban (if HIT)","aPTT, liver function","None specific — stop the drip"]]}},
   {h:"Teaching for Anyone on an Anticoagulant"},
   {list:[
     "Take it exactly as prescribed — <strong>don't stop it unless told to</strong>; warfarin at the same time every day.",
     "Wear or carry <strong>medical identification</strong>; tell every provider and dentist; call the managing provider before dental work or surgery.",
     "Keep all lab appointments (INR for warfarin).",
     "Check with the provider before taking vitamins, cold medicines, antihistamines, antibiotics, <strong>aspirin</strong>, laxatives, or anti-inflammatories (NSAIDs) — or herbal supplements.",
     "Warfarin: <strong>avoid alcohol</strong>, and avoid big changes in diet, especially <strong>vitamin K foods</strong> (leafy greens). No known food or alcohol interactions with oral factor Xa inhibitors.",
     "<strong>Bleeding precautions</strong>: electric razor, soft-bristled toothbrush, avoid sharps and contact sports.",
     "Report right away: bleeding, cuts that won't stop bleeding, nosebleeds, extensive bruising, <strong>reddish/brown urine</strong>, <strong>red or black stools</strong>, vomiting blood, sudden severe headache.",
     "Tell the provider if you might be pregnant."]},
   {hook:"<b>Two t's make an H</b> — pT<b>T</b> → <b>H</b>eparin. <b>PT/INR → Warfarin</b>, goal <b>2–3</b>. <b>Heparin ↔ Protamine</b> (both have an \"in\"), <b>Warfarin ↔ Vitamin K</b>."},
   {hook:"Lovenox: <strong>leave the bubble, don't rub the belly.</strong>"}
  ],
  check:{stem:"A client receiving a continuous heparin infusion has a platelet count that has fallen from 240,000 to 95,000/mm³, and the left calf is newly swollen. What should the nurse do first?",
   options:["Give vitamin K as the antidote","Stop the heparin infusion and notify the provider","Increase the heparin rate to treat the new clot","Switch the client to enoxaparin"],
   answer:1,
   why:"A large platelet drop with a new clot suggests heparin-induced thrombocytopenia — all heparin is stopped and the provider notified (a direct thrombin inhibitor such as argatroban may be ordered). Vitamin K reverses warfarin, not heparin, and LMWH also carries HIT risk."}
},
{ id:"m4-meds-antiplatelet-lytic", title:"Antiplatelets &amp; Thrombolytics", kicker:"Aspirin and clopidogrel prevent clots — alteplase, tenecteplase, and reteplase dissolve them",
  blocks:[
   {p:"Three clot drug groups, three jobs: <strong>antiplatelets</strong> keep platelets from sticking (arterial clots — CAD, stroke prevention), <strong>anticoagulants</strong> block clotting factors (venous clots, A-fib), and <strong>thrombolytics</strong> are the only ones that <strong>dissolve</strong> a clot that's already there."},
   {h:"Aspirin (Acetylsalicylic Acid) — Antiplatelet"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","<strong>Emergency chest pain: 325 mg chewed</strong> (part of MONA). <strong>New angina diagnosis:</strong> 162–325 mg, then continued at 81–325 mg daily. <strong>Prevention: usually 81 mg daily</strong> — CAD/angina, after stents, ischemic stroke/TIA prevention"],
     ["Mechanism of action","Irreversibly blocks platelet aggregation for the life of the platelet (about 7–10 days)"],
     ["Adverse reactions","<strong>GI bleeding</strong>/ulcers, bleeding, bruising; <strong>tinnitus</strong> (toxicity); allergic reactions/bronchospasm (asthma, nasal polyps)"],
     ["Contraindications","Active bleeding, bleeding disorders (hemophilia), peptic ulcer disease, <strong>children/teens with viral illness (Reye syndrome)</strong>, aspirin allergy; caution with other NSAIDs and anticoagulants (no aspirin with warfarin unless prescribed)"],
     ["Nursing interventions","Assess for bleeding (stools, gums, bruising); give with food for daily doses; an H2 blocker (famotidine) or PPI (omeprazole) may be ordered to protect the stomach; hold before surgery as ordered; ask about tinnitus"],
     ["Patient education","Chew 325 mg if having chest pain and calling 911 (as directed by the provider); take the daily dose with food; <strong>keep taking aspirin even when also taking acetaminophen</strong> for pain; report black stools, ringing in the ears, or bleeding; avoid ibuprofen/other NSAIDs unless approved"]]}},
   {h:"Clopidogrel (Plavix), Prasugrel, Ticagrelor — Antiplatelets (P2Y12 Inhibitors)"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","PO daily. CAD/angina, after MI, <strong>after coronary stents</strong> (with aspirin — dual antiplatelet therapy), stroke/TIA prevention, peripheral artery disease. Often added to aspirin for patients at high risk for MI. <strong>Unlike aspirin, may take a few days to reach full antiplatelet effect</strong> — a loading dose may be given in an emergency. <strong>Prasugrel and ticagrelor</strong> may be used instead of clopidogrel during coronary events and interventions"],
     ["Mechanism of action","Blocks the platelet ADP receptor → <strong>prevents platelet aggregation</strong>. Does not dissolve or break apart clots"],
     ["Adverse reactions","<strong>Bleeding</strong> — GI tract or other sites, bruising, GI upset; rare thrombotic thrombocytopenic purpura (TTP)"],
     ["Contraindications","Active bleeding (e.g., peptic ulcer, intracranial bleed); caution with other antiplatelets/anticoagulants and severe liver disease"],
     ["Nursing interventions","Monitor for bleeding, CBC; <strong>hold about 5 days before surgery</strong> as ordered; bleeding precautions"],
     ["Patient education","<strong>Don't stop it on your own</strong> — especially after a stent (the stent can clot); tell the dentist/surgeon; report black stools, blood in urine, or unusual bruising; soft toothbrush, electric razor"]]}},
   {h:"Alteplase (tPA), Tenecteplase, Reteplase — Thrombolytics (\"-ase\")"},
   {table:{head:["Category","Detail"],rows:[
     ["Indications/dosage","IV. <strong>Ischemic stroke</strong> (alteplase within <strong>3 hours of onset</strong>, up to <strong>4.5 hours</strong> for selected patients, only after a non-contrast CT rules out bleeding and BP is below 185/110); <strong>unstable (massive) PE</strong>; MI; DVT. Tenecteplase is a single IV bolus; reteplase is two boluses; alteplase is a bolus then an infusion. Low-dose alteplase also clears occluded central lines"],
     ["Mechanism of action","Converts plasminogen to plasmin, which breaks down fibrin → <strong>lyses (dissolves) the existing clot</strong> and restores perfusion"],
     ["Adverse reactions","<strong>Bleeding/hemorrhage — including intracranial hemorrhage</strong>; bleeding from IV/puncture sites; hypotension; allergic reactions; reperfusion dysrhythmias"],
