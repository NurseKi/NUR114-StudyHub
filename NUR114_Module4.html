<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NUR 114 · Module 4 Study App</title>
<style>
:root{
  --bg:#FAF9F5; --card:#FFFFFF; --line:#E2DFD3; --ink:#0F5B52; --inkdim:#3E8F82;
  --text:#221F19; --dim:#6E6A5C;
  --ok:#1B7A57; --okbg:#EAF4EE; --no:#B23A48; --nobg:#FBEEEF;
  --crit:#b03a2e; --critbg:#fdecea; --caut:#9a6a00; --cautbg:#fef5e0; --tip:#1e8449; --tipbg:#e9f7ef; --say:#6c3483; --saybg:#f4ecf7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.55 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
h1,h2,h3.title{font-family:Georgia,"Iowan Old Style","Times New Roman",serif}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
.wrap{max-width:700px;margin:0 auto;padding:0 20px 90px}
header{background:linear-gradient(135deg,#1b2a4a,#33507e);box-shadow:0 4px 18px rgba(20,40,80,.18)}
header .bannerwrap{max-width:700px;margin:0 auto;padding:22px 20px 20px}
header .toprow{display:flex;gap:16px;align-items:center;justify-content:space-between}
h1{font-size:22px;font-weight:700;margin:0;color:#fff;letter-spacing:-.01em}
header .sub{color:#bcd6d3;font-size:13.5px;font-weight:600;margin-top:4px}
#back{color:#fff;font-weight:700;font-size:14px;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:20px}
#back[hidden]{display:none}
.hublink{display:inline-block;color:#bcd6d3;font-size:12.5px;font-weight:700;text-decoration:none;margin-bottom:6px}
.hublink:hover{color:#fff}
.unit-chip{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.unit-banner{color:#fff;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.3px;
  margin:24px 0 10px;display:inline-block;text-transform:uppercase}

.lede{margin:22px 0 24px;color:#3a4d4f;max-width:56ch;font-size:14.5px;background:#fff;border:1px solid var(--line);
  border-left:5px solid var(--ink);border-radius:0 10px 10px 0;padding:14px 16px}
.unit{margin-bottom:30px}
.unit h2{font-size:15px;font-weight:700;margin:0 0 2px;color:var(--ink)}
.unit p{margin:0 0 10px;font-size:13.5px;color:var(--dim)}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 0;
  border-bottom:1px solid var(--line);text-align:left}
.row .t{flex:1;font-weight:600;font-size:15px}
.row .qz{font-size:13.5px;color:var(--ink);font-weight:700;white-space:nowrap}
.row .s{font-size:13px;color:var(--ok);font-weight:700;white-space:nowrap}

h3.title{font-size:25px;font-weight:600;letter-spacing:-.01em;margin:14px 0 4px}
.kick{color:var(--dim);margin:0 0 24px;font-size:14.5px;font-style:italic}
h4{font-size:15.5px;margin:24px 0 8px;font-weight:700}
p,li{max-width:64ch}
p{margin:0 0 12px}
ul{margin:0 0 14px;padding-left:20px}
li{margin-bottom:6px}
strong{font-weight:700}
table{width:100%;border-collapse:collapse;margin:8px 0 18px;font-size:14.5px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0 18px}
.tbl-wrap table{margin:0}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:#F1F0E9;font-weight:700;font-size:13.5px}
.hook{border-radius:10px;padding:11px 14px;margin:16px 0 18px;font-size:14.5px;border:1px solid var(--tip);background:var(--tipbg)}
.hook::before{content:"TIP";display:block;font-weight:800;font-size:11px;letter-spacing:.6px;color:var(--tip);margin-bottom:3px}
.figure{margin:16px 0 20px;text-align:center}
.figure img{max-width:100%;border-radius:8px;border:1px solid var(--line)}
.figure figcaption{font-size:13px;color:var(--dim);margin-top:6px;font-style:italic}

.q{margin:24px 0 0;padding-top:20px;border-top:1px solid var(--line)}
.lbl{font-size:13px;color:var(--dim);margin-bottom:10px;font-weight:600}
.stem{font-weight:600;margin-bottom:13px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;margin-bottom:8px;background:var(--card);line-height:1.45;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.mine{background:var(--nobg);border-color:var(--no)}
.opt.picked{background:#EEF6F4;border-color:var(--ink)}
.opt.missed{background:#FFF6E2;border-color:#B8860B}
.opt.sata b{display:inline-block;width:18px}
.sata-note{font-size:13px;color:var(--ink);font-weight:700;margin-bottom:10px;text-transform:uppercase;letter-spacing:.03em}
.reviewlink{display:inline-block;font-size:12.5px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:#F1F0E9;margin:2px 0 14px;color:var(--ink)}
.case-box{border:1px solid var(--line);border-radius:10px;margin-bottom:20px;overflow:hidden;background:#FDFCF9}
.case-title{background:var(--ink);color:#fff;font-size:13.5px;font-weight:700;padding:9px 14px}
.case-tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);background:#F1F0E9}
.case-tab{padding:9px 12px;font-size:13px;font-weight:600;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap}
.case-tab.active{color:var(--ink);border-bottom:2px solid var(--ink);background:#fff}
.case-panel{padding:12px 14px;max-height:280px;overflow-y:auto;font-size:14.5px}
.case-panel h4{margin:10px 0 6px;font-size:14px}
.case-panel h4:first-child{margin-top:0}
.case-panel table{font-size:13.5px;margin:6px 0 10px}
.case-panel p,.case-panel li{max-width:none}
.gm-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 6px;font-size:13.5px;color:var(--inkdim);font-weight:600}
.gm-timer{font-size:22px;font-weight:800;color:var(--ink);min-width:56px}
.gm-timer.low{color:var(--no)}
.deck-list{display:grid;gap:10px;margin:14px 0}
.deck-btn{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;cursor:pointer}
.deck-btn:hover{border-color:var(--ink)}
.deck-btn small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}
.flashcard{border:1px solid var(--line);border-radius:14px;background:#fff;min-height:190px;padding:22px 18px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.05);margin:12px 0}
.flashcard.back{background:#F3F8F6;font-size:15.5px;text-align:left;justify-content:flex-start}
.flashcard .side{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:8px}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.match-col{display:grid;gap:8px;align-content:start}
.match-col h6{margin:0 0 2px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.mcard{border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 10px;font-size:13.5px;text-align:left;cursor:pointer;min-height:44px}
.mcard.sel{border-color:var(--ink);background:#EEF6F4;box-shadow:0 0 0 2px var(--ink) inset}
.mcard.done{background:var(--okbg);border-color:var(--ok);color:#2d5a45;cursor:default}
.mcard.bad{background:var(--nobg);border-color:var(--no)}
.rs-box{border:1px solid var(--line);border-radius:12px;background:#fff;padding:16px;margin:12px 0}
.rs-fb{border-left:4px solid var(--inkdim);background:#F3F8F6;padding:10px 12px;border-radius:6px;margin:10px 0;font-size:14.5px}
.rs-fb.bad{border-left-color:var(--no);background:var(--nobg)}
.rs-fb.good{border-left-color:var(--ok);background:var(--okbg)}
.fitb-input{width:180px;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:6px 0 4px;display:block}
.fitb-input:disabled{background:#F4F3EE;color:var(--text);border-color:var(--line)}
.gtpal-inputs{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.gtpal-field{display:flex;flex-direction:column;align-items:center;gap:4px}
.gtpal-letter{font-weight:800;font-size:13px;color:var(--ink)}
.gtpal-input{width:52px;text-align:center;font-size:17px;font-weight:700;padding:8px 4px;border:1px solid var(--line);border-radius:8px}
.gtpal-input:disabled{background:#F4F3EE;color:var(--text)}
.cloze-text{font-size:15.5px;line-height:2.4;margin:10px 0}
.blank-select{font-size:14px;font-weight:600;padding:5px 8px;border:1px solid var(--ink);border-radius:6px;background:var(--okbg);color:var(--ink);margin:0 3px}
.blank-select.right{border-color:var(--ok);background:var(--okbg)}
.blank-select.wrong{border-color:var(--no);background:var(--nobg)}
.hotspot-wrap{position:relative;display:inline-block;max-width:100%;cursor:crosshair;margin:10px 0;line-height:0}
.hotspot-img{max-width:100%;display:block;border-radius:8px;border:1px solid var(--line)}
.hotspot-marker{position:absolute;width:18px;height:18px;background:rgba(200,60,50,.85);border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.hotspot-region{position:absolute;border:2px dashed var(--ok);background:rgba(46,125,90,.18);pointer-events:none;border-radius:4px}
.dd-pool{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.dd-chip{padding:8px 12px;border:1px solid var(--line);border-radius:20px;font-size:13.5px;background:#fff}
.dd-chip.sel{border-color:var(--ink);background:var(--okbg)}
.dd-bins{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap}
.dd-bin{flex:1;min-width:140px;border:1px dashed var(--line);border-radius:8px;padding:10px;min-height:70px;background:#FDFCF9}
.dd-bin-label{font-size:12.5px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
.dd-bin .dd-chip{display:block;margin-bottom:6px;cursor:pointer}
.dd-chip.right{border-color:var(--ok);background:var(--okbg)}
.dd-chip.wrong{border-color:var(--no);background:var(--nobg)}
.order-list{list-style:none;margin:10px 0;padding:0}
.order-item{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:6px;font-size:14px;background:#fff}
.order-item .num{font-weight:700;color:var(--dim);margin-right:10px;min-width:18px}
.order-item .txt{flex:1}
.order-btns button{padding:4px 9px;margin-left:4px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13px}
.order-item.right{border-color:var(--ok);background:var(--okbg)}
.order-item.wrong{border-color:var(--no);background:var(--nobg)}
.matrix-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
.matrix-table th,.matrix-table td{border:1px solid var(--line);padding:8px;text-align:center}
.matrix-table td:first-child{text-align:left}
.matrix-table input[type=radio]{width:16px;height:16px}
.matrix-row-right td{background:var(--okbg)}
.matrix-row-wrong td{background:var(--nobg)}
.bowtie-wrap{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.bowtie-col{flex:1;min-width:150px}
.bowtie-col-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--dim);margin-bottom:8px;text-align:center}
.bowtie-opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px;background:#fff}
.bowtie-opt.sel{border-color:var(--ink);background:#EEF6F4}
.bowtie-opt.right{border-color:var(--ok);background:var(--okbg)}
.bowtie-opt.wrong{border-color:var(--no);background:var(--nobg)}
.verdict{font-weight:700;margin:14px 0 6px}
.verdict.y{color:var(--ok)} .verdict.n{color:var(--no)}
.acts{display:flex;gap:16px;flex-wrap:wrap;margin-top:22px}
.acts button{color:var(--ink);font-weight:700;font-size:14.5px}
.count{font-size:13.5px;color:var(--dim);margin:24px 0 4px;font-weight:600}
.big{font-size:42px;font-weight:700;letter-spacing:-.02em;margin:26px 0 0;font-family:Georgia,serif}
.rev{margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.rev h5{margin:18px 0 6px;font-size:15px;font-weight:700}
.topic-group{margin:0 0 16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.topic-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 18px;text-align:left;background:#F1F0E9}
.topic-group.open .topic-toggle{background:#FDFCF9;border-bottom:1px solid var(--line)}
.topic-toggle-label{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.topic-toggle-icon{flex:none;font-size:18px;font-weight:700;color:var(--ink);width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;line-height:1;margin-left:14px}
.topic-body{padding:18px 18px 4px}
.topic-body .unit{margin-bottom:26px}
.topic-body .unit:last-child{margin-bottom:6px}
@media(max-width:520px){body{font-size:15.5px}h3.title{font-size:21px}table{font-size:13.5px}th,td{padding:6px}}
</style>
</head>

{ id:"m4-ap", title:"Heart A&amp;P &amp; Blood Flow", kicker:"Layers, chambers, valves, coronaries, the cardiac cycle and the conduction system",
  blocks:[
   {p:"Every perfusion problem comes down to one of four things: the pump fails (HF, dysrhythmias), the pipes narrow (CAD, stroke), clots block flow (DVT/PE), or there is not enough blood to carry oxygen (anemia). It all builds on how a normal heart moves blood."},
   {h:"Layers of the heart"},
   {table:{head:["Layer","What it is","Why it matters"],rows:[
    ["Pericardium","Two-layer sac around the heart (visceral layer on the heart, tough parietal layer outside) with about 20 mL of lubricating fluid between them","Reduces friction as the heart beats; anchors the heart in the mediastinum"],
    ["Epicardium","Outer layer of the heart wall","The coronary arteries run on the surface of the heart"],
    ["Myocardium","Middle, <strong>muscle</strong> layer — does the pumping","The layer damaged by ischemia/MI; troponin leaks out of these cells"],
    ["Endocardium","Smooth inner lining of the chambers and valves","Lines everything blood touches"]
   ]}},
   {h:"Chambers"},
   {list:[
    "<strong>Right atrium</strong> — receives deoxygenated blood from the body (superior and inferior vena cava) and from the heart itself (coronary sinus).",
    "<strong>Right ventricle</strong> — pumps blood to the lungs through the pulmonary artery (a low-pressure system). The pulmonary artery is the only artery that carries deoxygenated blood.",
    "<strong>Left atrium</strong> — receives oxygenated blood from the lungs through the four pulmonary veins.",
    "<strong>Left ventricle</strong> — pumps oxygenated blood to the whole body through the aorta. It is the <strong>thickest, most muscular chamber</strong> (2–3 times the right ventricle) because it must push against the high pressure of the systemic circulation.",
    "Atria have thin walls (they only push blood a short way into the ventricles); ventricles have thick walls."
   ]},
   {h:"Valves and heart sounds"},
   {p:"Valves keep blood moving in <strong>one direction</strong>. They open and close in response to pressure changes in the chambers."},
   {table:{head:["Valve","Between","Type","Closure makes"],rows:[
    ["Tricuspid (3 leaflets)","Right atrium → right ventricle","Atrioventricular (AV)","<strong>S1</strong> (“lub”)"],
    ["Mitral / bicuspid (2 leaflets)","Left atrium → left ventricle","Atrioventricular (AV)","<strong>S1</strong> (“lub”)"],
    ["Pulmonic","Right ventricle → pulmonary artery","Semilunar","<strong>S2</strong> (“dub”)"],
    ["Aortic","Left ventricle → aorta","Semilunar","<strong>S2</strong> (“dub”)"]
   ]}},
   {list:[
    "<strong>S1</strong> = AV valves close as the ventricles start to contract → marks the start of <strong>systole</strong>; loudest at the apex (5th intercostal space, left midclavicular line — the PMI).",
    "<strong>S2</strong> = semilunar valves close as the ventricles relax → marks the start of <strong>diastole</strong>.",
    "Papillary muscles and chordae tendineae hold the AV valve leaflets shut during contraction so blood does not flow backward (regurgitation) into the atria.",
    "A <strong>murmur</strong> is the sound of turbulent blood flow through a valve that is narrowed or leaking. An extra sound (S3) can be heard in heart failure."
   ]},
   {hook:"“Try before you buy”: <strong>tri</strong>cuspid on the right comes before the <strong>bi</strong>cuspid (mitral) on the left. Lub = AV valves close (systole starts); dub = semilunar valves close (diastole starts)."},
   {h:"Blood flow through the heart, step by step"},
   {list:[
    "1. Body → <strong>superior and inferior vena cava</strong>",
    "2. → <strong>right atrium</strong>",
    "3. → tricuspid valve → <strong>right ventricle</strong>",
    "4. → pulmonic valve → <strong>pulmonary artery</strong>",
    "5. → <strong>lungs</strong> (blood picks up O₂ and drops off CO₂)",
    "6. → <strong>pulmonary veins</strong> → <strong>left atrium</strong>",
    "7. → mitral (bicuspid) valve → <strong>left ventricle</strong>",
    "8. → aortic valve → <strong>aorta</strong> → rest of the body"
   ]},
   {hook:"Right side = to the lungs; left side = to the body. When the left side fails, blood backs up into the <strong>Lungs</strong>; when the right side fails, blood backs up into the <strong>Rest</strong> of the body."},
   {h:"Coronary arteries"},
   {p:"The heart muscle gets its own blood supply from the <strong>coronary arteries</strong>, which branch off the aorta just above the aortic valve. Unlike every other artery, the coronaries fill during <strong>DIASTOLE</strong> — when the aortic valve snaps shut, blood falls back against it and flows into the coronary openings while the heart muscle is relaxed."},
   {table:{head:["Artery","Supplies (mainly)"],rows:[
    ["<strong>Right coronary artery (RCA)</strong>","Right atrium, right ventricle, and the inferior (bottom) wall of the left ventricle; its posterior descending branch supplies the posterior wall. In most people it also feeds the SA and AV nodes."],
    ["<strong>Left main coronary artery</strong>","Short trunk that splits into the LAD and the circumflex — a blockage here cuts off a huge area of the left ventricle."],
    ["<strong>Left anterior descending (LAD)</strong>","Front (anterior) wall of the left ventricle and most of the septum — the main pumping muscle."],
    ["<strong>Circumflex</strong>","Wraps around to the lateral (side) wall of the left ventricle and the left atrium."]
   ]}},
   {p:"<strong>Clinical tie:</strong> a fast heart rate shortens diastole, so the coronaries have less time to fill. That is why <strong>tachycardia can cause chest pain and ischemia</strong>, especially in a patient with CAD — and why beta blockers (which slow the rate) protect the heart."},
   {hook:"Coronaries fill in diastole: <strong>fast heart = short diastole = hungry heart muscle.</strong>"},
   {h:"The cardiac cycle"},
   {table:{head:["Phase","What happens"],rows:[
    ["<strong>Diastole</strong> (relaxation / filling)","All chambers relaxed; AV valves open, semilunar valves closed; ventricles fill; coronary arteries fill. Normally the longest part of the cycle."],
    ["<strong>Atrial systole</strong> (“atrial kick”)","Near the end of diastole the SA node fires, the atria contract and top off the ventricles with the last portion of blood (roughly 15–25% more)."],
    ["<strong>Ventricular systole</strong> (contraction / ejection)","Ventricular pressure rises → AV valves close (S1) → semilunar valves open → blood is ejected into the pulmonary artery and aorta. When pressure falls, the semilunar valves close (S2) and diastole begins again."]
   ]}},
   {p:"<strong>Clinical tie:</strong> in atrial fibrillation the atria quiver instead of contracting, so the <strong>atrial kick is lost</strong> → less filling → lower stroke volume and cardiac output. The blood that sits in the quivering atria can pool and clot."},
   {h:"Conduction system overview"},
   {p:"The heart makes its own electrical impulses — the brain does not tell it to beat. The impulse normally travels:"},
   {list:[
    "<strong>SA node</strong> (right atrium) — the heart's natural pacemaker → impulse spreads across both atria → atria contract (<strong>P wave</strong>).",
    "<strong>AV node</strong> — the gatekeeper; briefly delays the impulse so the ventricles can finish filling (part of the <strong>PR interval</strong>).",
    "<strong>Bundle of His</strong> → <strong>right and left bundle branches</strong> → <strong>Purkinje fibers</strong> → ventricles contract (<strong>QRS complex</strong>).",
    "Ventricles recover/reset (<strong>T wave</strong> = ventricular repolarization). Atrial repolarization is hidden inside the QRS."
   ]},
   {table:{head:["Pacemaker site","Intrinsic rate (bpm)","When it takes over"],rows:[
    ["SA node","<strong>60–100</strong>","Normal pacemaker"],
    ["AV node / junction","<strong>40–60</strong>","Backup if the SA node fails"],
    ["Purkinje fibers / ventricles","<strong>20–40</strong>","Last resort if both higher pacemakers fail"]
   ]}},
   {img:STRIPS.nsr, caption:"Normal sinus rhythm — every beat starts at the SA node: a P wave before every narrow QRS, regular, rate about 75."},
   {p:"Heart rate is also adjusted by the nervous system: the <strong>sympathetic</strong> system (beta-1 receptors, catecholamines, excess thyroid hormone) speeds it up; the <strong>vagus nerve</strong> (parasympathetic) slows it down. Atropine works by blocking the vagal slowing."},
   {hook:"The farther down the pathway the pacemaker, the slower the rate: <strong>SA 60–100 → AV 40–60 → ventricles 20–40.</strong>"}
  ],
  check:{stem:"A client with coronary artery disease develops a heart rate of 150/min and reports new chest pressure. Which explanation best describes why the tachycardia caused the chest pain?",
   options:["The tricuspid valve cannot close at fast rates, so blood leaks backward","Fast rates shorten diastole, which is when the coronary arteries fill","The SA node stops firing above 100/min, so the AV node takes over","The atrial kick doubles at fast rates and overstretches the ventricle"],
   answer:1, why:"The coronary arteries are perfused during diastole. A fast rate shortens diastole, so the heart muscle receives less oxygen-rich blood while its demand rises — ischemia and chest pain result, especially with narrowed coronaries."}
},

// ---------- 2. Hemodynamics ----------
{ id:"m4-hemo", title:"Cardiac Output, Preload, Afterload &amp; Contractility", kicker:"What makes the pump move blood — and how meds change it",
  blocks:[
   {h:"Cardiac output"},
   {p:"<strong>Cardiac output (CO) = heart rate (HR) × stroke volume (SV).</strong> It is the amount of blood one ventricle pumps out per minute — normally about 4–6 L/min at rest. If either HR or SV drops (and the other cannot make up for it), cardiac output falls and tissues are under-perfused."},
   {list:[
    "<strong>Stroke volume</strong> = the amount of blood pumped out of the ventricle with each beat.",
    "Stroke volume is set by three things: <strong>preload, afterload, and contractility</strong>.",
    "Heart rate helps only up to a point: a very fast rate leaves too little time to fill (and to fill the coronaries), so SV and CO actually <strong>drop</strong>. A very slow rate pumps too few times per minute."
   ]},
   {h:"Ejection fraction (EF)"},
   {p:"<strong>EF</strong> = the percentage of the blood in the left ventricle at the end of filling that is pumped out with each beat. <strong>Normal EF is 50–70%.</strong> It is a measure of how well the ventricle squeezes (contractility) and is measured by <strong>echocardiogram</strong>. An EF below 50% = reduced pumping = HFrEF (systolic heart failure)."},
   {h:"Preload — the VOLUME"},
   {list:[
    "Preload = the <strong>volume</strong> of blood in the ventricle at the end of diastole and how much it stretches the muscle fibers.",
    "<strong>Starling's law</strong> (Frank–Starling): within limits, the more the muscle is stretched by filling, the harder it contracts and the bigger the stroke volume — like a rubber band. Stretch it too far (an overfilled, failing heart) and it stops snapping back.",
    "<strong>↓ preload:</strong> diuretics, venodilators (nitrates), blood loss, dehydration (vomiting, diarrhea, diaphoresis).",
    "<strong>↑ preload:</strong> IV fluids, blood transfusion, fluid retention."
   ]},
   {h:"Afterload — the PRESSURE"},
   {list:[
    "Afterload = the <strong>resistance</strong> (pressure) the ventricle must push against to eject blood.",
    "<strong>Systemic vascular resistance (SVR)</strong> = resistance to flow in the systemic circulation — the afterload of the <strong>left</strong> ventricle. Think: systemic BP.",
    "<strong>Pulmonary vascular resistance (PVR)</strong> = resistance created by the pulmonary circulation — the afterload of the <strong>right</strong> ventricle.",
    "Afterload and stroke volume move in <strong>opposite</strong> directions: vasoconstriction/hypertension ↑ afterload → ↓ SV and ↑ workload; vasodilation ↓ afterload → ↑ SV.",
    "<strong>↓ afterload:</strong> BP medications and vasodilators (ACE inhibitors, ARBs, nitrates, CCBs like amlodipine)."
   ]},
   {hook:"<strong>Preload = volume. Afterload = pressure.</strong> Too much volume? Take it off (diuretics). Too much pressure? Open the pipes (BP meds/vasodilators)."},
   {h:"Contractility and compliance"},
   {list:[
    "<strong>Contractility</strong> = the force of the heart muscle's squeeze, independent of how full it is. ↑ by the sympathetic system/catecholamines and some drugs (digoxin, dopamine, dobutamine); ↓ by hypoxemia, acidosis, damaged muscle (MI), and beta blockers.",
    "<strong>Compliance</strong> = how easily the ventricle (or a vessel) stretches to accept volume. A thick, stiff ventricle has <strong>low compliance</strong> — it can't fill well (HFpEF, “diastolic — thick”). Stiff, hardened arteries also have low compliance and raise BP."
   ]},
   {h:"Effects of preload and afterload on the heart"},
   {table:{head:["Change","Common causes","Stroke volume","Ventricular work","Myocardial O₂ requirement"],rows:[
    ["<strong>↑ Preload</strong>","↑ fluid volume, vasoconstriction","↑","↑","↑"],
    ["<strong>↓ Preload</strong>","Hypovolemia, vasodilation","↓","↓","↓"],
    ["<strong>↑ Afterload</strong>","Hypovolemia*, vasoconstriction","↓","↑","↑"],
    ["<strong>↓ Afterload</strong>","Vasodilation","↑","↓","↓"]
   ]}},
   {p:"*Hypovolemia → the body vasoconstricts to compensate → increased afterload."},
   {h:"Tying it to the meds"},
   {table:{head:["Medication","Main hemodynamic effect","Why it helps"],rows:[
    ["<strong>Nitroglycerin</strong>","↓ preload <strong>and</strong> ↓ afterload (dilates veins and arteries)","Less volume returning and less pressure to push against → ↓ cardiac workload and O₂ demand → relieves angina"],
    ["<strong>Diuretics</strong> (e.g., furosemide)","↓ preload","Remove excess fluid volume (heart failure, fluid overload)"],
    ["<strong>ACE inhibitors / ARBs</strong>","↓ afterload","Dilate arteries and lower BP so the left ventricle pushes against less resistance"],
    ["<strong>Beta blockers</strong>","↓ HR and ↓ contractility","Lower O₂ demand, lengthen diastole for coronary filling, reduce dysrhythmia risk"],
    ["<strong>Digoxin</strong> (HF add-on)","↑ contractility, ↓ HR","Stronger squeeze for a failing pump"]
   ]}},
   {h:"Vocabulary review"},
   {table:{head:["Term","Meaning"],rows:[
    ["Afterload","Resistance the ventricle must overcome to eject blood (the pressure)"],
    ["Arteriosclerosis","Hardening and loss of elasticity of the arteries"],
    ["Atherosclerosis","Fatty deposits (plaque) building up on the inner walls of arteries — the type of arteriosclerosis behind CAD and ischemic stroke"],
    ["Cardiac output","HR × SV; the amount of blood pumped per minute"],
    ["Compliance","Ability of the ventricle or vessel to stretch and expand with volume"],
    ["Contractility","Force of the heart muscle's contraction"],
    ["Ejection fraction","Percentage of the ventricle's end-diastolic volume pumped out per beat; normal 50–70%"],
    ["Heart murmur","Abnormal sound from turbulent blood flow, usually from a narrowed or leaking valve or a defect"],
    ["Ischemic","Lacking adequate blood supply (and therefore oxygen) to a tissue"],
    ["Preload","Volume of blood in the ventricle at the end of diastole (the stretch)"],
    ["Pulmonary vascular resistance (PVR)","Resistance to flow out of the right ventricle created by the pulmonary circulation"],
    ["Stroke volume","Amount of blood pumped out of the ventricle with each beat"],
    ["Systemic vascular resistance (SVR)","Resistance to flow in the systemic circulation (the left ventricle's afterload)"]
   ]}},
   {hook:"Anything that makes the heart work harder (↑ HR, ↑ preload, ↑ afterload, ↑ contractility) also raises its <strong>O₂ demand</strong> — dangerous for a heart with narrowed coronaries."}
  ],
  check:{stem:"A client with heart failure has crackles, edema, and a BP of 168/94. The provider orders furosemide and lisinopril. Which statement best explains the combined effect?",
   options:["Both drugs increase contractility so the heart pumps harder","Furosemide reduces afterload; lisinopril reduces preload","Furosemide reduces preload; lisinopril reduces afterload","Both drugs increase stroke volume by raising preload"],
   answer:2, why:"Diuretics remove fluid volume, lowering preload. ACE inhibitors dilate arteries and lower BP, lowering afterload. Together they reduce the heart's workload and O₂ demand."}
},

// ---------- 3. Labs & 12-lead ----------
{ id:"m4-dx", title:"Cardiac Labs &amp; the 12-Lead ECG", kicker:"Troponin, BNP, lipids, coags, electrolytes — and reading the heart from 12 views",
  blocks:[
   {h:"Cardiac biomarkers — is heart muscle damaged?"},
   {p:"When heart muscle cells are starved of oxygen long enough to be injured, they leak proteins into the blood. These biomarkers plus the 12-lead ECG and the assessment are how heart damage is identified."},
   {table:{head:["Lab","What it tells you","Key nursing points"],rows:[
    ["<strong>Troponin</strong>","<strong>Gold standard</strong> for heart muscle damage; comes from the myocardium","Normally about 0 (undetectable). <strong>First lab priority</strong> for chest pain. Drawn on arrival and repeated serially (about every 6 h × 2). Rise is <strong>delayed</strong>, so one normal value does <strong>not</strong> rule out MI; stays elevated for days."],
    ["<strong>CK-MB</strong>","Cardiac-muscle fraction of the enzyme creatine kinase","Drawn <strong>with</strong> troponin; supports the diagnosis of heart muscle injury."],
    ["<strong>Myoglobin</strong>","Oxygen-binding protein in skeletal <em>and</em> cardiac muscle","Rises early but is <strong>not cardiac-specific</strong> — any muscle injury (trauma, rhabdomyolysis) raises it. Not the priority lab."],
    ["<strong>BNP</strong> (B-type natriuretic peptide)","Released by the ventricles when they are stretched by volume/pressure","<strong>Below 100 pg/mL = normal; above 100 = heart failure</strong> — the higher, the worse. Useful to diagnose and track HF."]
   ]}},
   {hook:"Troponin is the <strong>T</strong>ruth-teller for heart damage — but it's a <strong>slow</strong> talker. Draw it on arrival and draw it again."},
   {h:"Lipid panel — risk for CAD"},
   {table:{head:["Test","Goal","Notes"],rows:[
    ["Total cholesterol","<strong>Below 200 mg/dL</strong>",""],
    ["LDL (“bad” — deposits plaque)","<strong>Below 100 mg/dL with CAD</strong> (below 130 otherwise)","Lowered with statins, diet, exercise"],
    ["HDL (“good” — carries cholesterol away to the liver)","<strong>Above 40–60 mg/dL</strong> — higher is better","Raised by exercise, quitting smoking"],
    ["Triglycerides","<strong>Below 150 mg/dL</strong>","Raised by diabetes, alcohol, obesity; drawn after a 12-hour fast"]
   ]}},
   {hook:"<strong>L</strong>DL = <strong>L</strong>ousy (keep it Low). <strong>H</strong>DL = <strong>H</strong>appy (keep it High)."},
   {h:"Coagulation studies — for anticoagulated patients"},
   {table:{head:["Test","Monitors","Remember"],rows:[
    ["<strong>PTT / aPTT</strong>","<strong>Heparin</strong>","“Two t's make an H” — p<strong>tt</strong> → heparin. Antidote: protamine sulfate."],
    ["<strong>PT / INR</strong>","<strong>Warfarin</strong>","INR goal <strong>2–3</strong> for most anticoagulated patients (a patient not on warfarin is about 1). Antidote: vitamin K."]
   ]}},
   {p:"Coags (plus a CBC with hemoglobin, hematocrit, and platelets) are also drawn as baselines before invasive procedures such as cardiac cath."},
   {h:"BMP vs CMP and the electrolytes that matter"},
   {table:{head:["Panel","Includes","Cardiac use"],rows:[
    ["<strong>BMP</strong> (basic metabolic panel)","Sodium, potassium, chloride, CO₂, BUN, creatinine, glucose, calcium","Electrolytes for dysrhythmia risk; kidney function before contrast dye and with ACE inhibitors/diuretics"],
    ["<strong>CMP</strong> (comprehensive)","Everything in the BMP <strong>plus</strong> liver tests (AST, ALT, alkaline phosphatase, bilirubin, albumin, protein)","Liver function — e.g., monitoring patients on statins or amiodarone"]
   ]}},
   {list:[
    "<strong>Potassium (K⁺) 3.5–5.5 mEq/L.</strong> Too low or too high → dangerous dysrhythmias. Watch K⁺ with diuretics (loop diuretics waste it; potassium-sparing diuretics and ACE inhibitors/ARBs raise it).",
    "<strong>Magnesium (Mg²⁺)</strong> is <strong>not</strong> part of a BMP or CMP — it is ordered separately. Low magnesium → ventricular dysrhythmias, including torsades de pointes (treated with magnesium).",
    "Electrolyte imbalance is one of the first causes to look for (and fix) with any new dysrhythmia."
   ]},
   {h:"The 12-lead ECG"},
   {list:[
    "Ten electrodes record the heart's electrical activity from <strong>12 different views (leads)</strong> at the same time, so it can show damage all around the heart.",
    "Used to find ischemia, injury, or infarction (ST-segment changes), dysrhythmias, conduction problems, enlarged chambers, and electrolyte effects.",
    "For chest pain, the 12-lead ECG is obtained <strong>within 10 minutes</strong> of arrival/onset — along with assessment and a troponin.",
    "Also get a 12-lead for any new rhythm change or when a patient becomes symptomatic of decreased cardiac output."
   ]},
   {table:{head:["","12-lead ECG","Continuous monitoring / telemetry"],rows:[
    ["What","A snapshot from 12 views","Continuous recording from 1–2 leads, shown at the bedside or a central station"],
    ["Best for","Diagnosing ischemia/MI and where it is","Catching rhythm changes as they happen in patients at risk for dysrhythmias"],
    ["Teaching","Lie still, breathe normally","The monitor does <strong>not</strong> detect chest pain or shortness of breath — <strong>report new symptoms right away</strong>"]
   ]}},
   {h:"Artifact — false readings"},
   {p:"Artifact is interference that makes the tracing look abnormal when the heart is not. <strong>Always assess the patient, not the monitor</strong> — a patient talking to you with a strong pulse is not in V-fib."},
   {table:{head:["Cause","Fix"],rows:[
    ["Sweaty/oily skin","Dry the skin before placing electrodes"],
    ["Hair under the electrode","Clip (or shave) the area"],
    ["Dried-out electrode gel","Replace the electrodes"],
    ["Loose or disconnected lead","Reattach / check connections"],
    ["Movement, shivering, deep breaths, patient handling the wires","Have the patient rest still; warm the shivering patient; secure the wires"]
   ]}},
   {img:STRIPS.artifact, caption:"Artifact — a chaotic-looking baseline caused by movement or poor electrode contact. Check the patient and the leads first."},
   {hook:"Monitor alarm → <strong>look at the patient first.</strong> Responsive with a pulse = probably artifact. Unresponsive = real emergency."}
  ],
  check:{stem:"A client arrives in the ED with chest pain that began 30 minutes ago. The first troponin is undetectable. Which action by the nurse is most appropriate?",
   options:["Tell the client a heart attack has been ruled out","Prepare to discharge the client with sublingual nitroglycerin","Replace the troponin with a myoglobin level, which is more specific","Anticipate repeat troponin levels because the rise is delayed"],
   answer:3, why:"Troponin rises hours after heart muscle injury, so an early normal value does not rule out MI; levels are repeated serially. Myoglobin is not cardiac-specific."}
},

// ---------- 4. Procedures ----------
{ id:"m4-procedures", title:"Stress Test, Echo/TEE &amp; Cardiac Cath", kicker:"What each test shows — and the nursing care before and after",
  blocks:[
   {h:"Which test answers which question?"},
   {table:{head:["Test","Question it answers","Invasive?"],rows:[
    ["<strong>Stress test</strong>","How does the heart do when it has to work harder? (ischemia that only shows up with demand)","No (an IV for the medication version)"],
    ["<strong>Echocardiogram</strong> (transthoracic)","How well does it pump and fill? EF, valves, wall thickness, clots","No — ultrasound on the chest"],
    ["<strong>TEE</strong> (transesophageal echo)","Clearer pictures — especially clots in the atria (before cardioversion)","Yes — probe down the esophagus with sedation"],
    ["<strong>Cardiac cath / coronary angiogram</strong>","Are the coronary arteries blocked? Where? Can it be opened now?","Yes — catheter through an artery with contrast dye"]
   ]}},
   {h:"Cardiac stress test"},
   {p:"Healthy coronary arteries dilate when demand goes up; narrowed ones cannot, so ischemia often appears only under “stress.” The heart is stressed by <strong>exercise</strong> (treadmill — most common) or by <strong>medication</strong> for patients who cannot walk or exercise enough: <strong>dipyridamole</strong> or <strong>adenosine</strong> (vasodilators) or <strong>dobutamine</strong> (makes the heart work harder). Some tachycardia during the test is expected."},
   {table:{head:["Before","During","After"],rows:[
    ["Informed consent; explain the test<br>NPO for several hours<br>No caffeine/tobacco (caffeine blocks the vasodilator drugs)<br><strong>Hold beta blockers</strong> (and other rate-slowing drugs) as ordered — they keep the HR from rising<br>Baseline vitals, heart and lung sounds, ECG<br>Walking shoes, comfortable clothes<br>Crash cart available","Continuous ECG, BP, and symptom monitoring<br>Compare to baseline vitals","Monitor until vitals and assessment return to baseline (about 10–15 minutes)<br>A positive (abnormal) result usually leads to cardiac cath"]
   ]}},
   {p:"<strong>STOP the stress test</strong> if the patient develops any of these:"},
   {list:["Chest pain","Dysrhythmia (abnormal rhythm)","Shortness of breath","Pallor","Diaphoresis","BP too high or too low","O₂ saturation below 90%"]},
   {hook:"Stress test stop signs: <strong>pain, rhythm, breath, pale, sweaty, BP, sat below 90.</strong>"},
   {h:"Echocardiogram and TEE"},
   {p:"An echo is an <strong>ultrasound of the heart</strong>. It shows the <strong>ejection fraction</strong> (the go-to test for heart failure), valves opening and closing, <strong>wall thickness</strong> (thick and stiff vs stretched and boggy), overall contraction, and <strong>clots</strong>."},
   {list:[
    "<strong>Transthoracic</strong> (transcutaneous) echo — probe on the skin of the chest; noninvasive, no sedation, no special aftercare; pictures are less clear because sound passes through ribs and lung.",
    "<strong>Transesophageal echo (TEE)</strong> — probe passed down the esophagus, right behind the heart, for much clearer pictures.",
    "<strong>TEE before cardioversion:</strong> a clot sitting in the atria (A-fib, A-flutter) could be shocked loose → left ventricle → aorta → the brain = <strong>stroke</strong>. TEE checks for clots first."
   ]},
   {table:{head:["Pre-TEE","Post-TEE"],rows:[
    ["Informed consent<br><strong>NPO</strong><br><strong>Remove dentures</strong>/retainers<br>Conscious (moderate) sedation; throat numbed with a topical anesthetic","<strong>NPO until the throat numbness wears off and the gag reflex returns</strong> (aspiration risk)<br>Then start clear liquids and advance as tolerated<br>Monitor vitals, sedation level, and breathing<br>Mild sore throat is expected"]
   ]}},
   {hook:"TEE = a tube down the throat → <strong>check the gag reflex before anything by mouth.</strong>"},
   {h:"Cardiac catheterization (coronary angiogram)"},
   {p:"A catheter is threaded through an artery (wrist/radial or groin/femoral) to the heart, and <strong>contrast dye</strong> is injected to show the coronary arteries and how the heart is perfused. During the same procedure the cardiologist can open blocked vessels and place <strong>stents</strong>. It is ordered after a positive stress test or when angina is unstable. <strong>Wrist access has fewer complications than the groin.</strong> Heparin and other blood thinners are given during the procedure, so bleeding is the big post-procedure risk."},
   {table:{head:["Pre-cath","Post-cath"],rows:[
    ["<strong>NPO after midnight</strong><br><strong>Informed consent</strong><br>Ask about <strong>contrast (iodine) allergy</strong> — premedication may be ordered<br>Check <strong>kidney function</strong> (BUN, creatinine) — dye is hard on the kidneys; <strong>acetylcysteine and bicarbonate/IV fluids</strong> protect the kidneys as ordered<br><strong>Hold anticoagulants as ordered</strong>; baseline coags and CBC<br>Baseline vitals and <strong>distal pulses</strong> (mark them)",
     "<strong>Vitals q15 min × 1 h, q30 min × 1 h, then hourly</strong><br>Every check: insertion site (bleeding, hematoma), <strong>distal pulses, color, temperature, sensation</strong> — compare to the other extremity<br>Groin: <strong>lie flat with the leg straight</strong> for several hours (how long depends on how the artery was closed); HOB no higher than 30°<br><strong>Hold pressure about 10 minutes</strong> after the sheath is removed<br><strong>Fluids</strong> to flush the dye; I&amp;O; watch creatinine<br>Report chest pain right away; help the patient the first time up"]
   ]}},
   {h:"Post-cath complications to catch"},
   {table:{head:["Finding","Means","Action"],rows:[
    ["Swelling/firm lump at the site, bleeding","<strong>Hematoma</strong> / bleeding","<strong>Apply firm pressure</strong> above the site — never massage it; notify the provider"],
    ["<strong>One-sided severe back or flank pain</strong> + ↓ BP + ↑ HR","<strong>Retroperitoneal bleed</strong> — the artery was punctured through the back wall and blood is pooling behind the abdomen","<strong>Emergency</strong> — notify the provider immediately; CT confirms"],
    ["Cool, pale, numb, or pulseless extremity","Arterial occlusion (clot) below the site","Notify the provider immediately"],
    ["Rising creatinine, low urine output","Contrast-induced kidney injury","Fluids as ordered; monitor I&amp;O and labs"]
   ]}},
   {hook:"Not part of post-cath care: <strong>checking the gag reflex</strong> (that's TEE). Not part of pre-cath care: <strong>lying flat for 6 hours</strong> (that's after the cath)."}
  ],
  check:{stem:"Two hours after a femoral cardiac catheterization, a client reports sudden severe pain in the right lower back. BP has dropped from 128/76 to 96/58 and HR has risen from 78 to 112. What should the nurse do first?",
   options:["Massage the insertion site to disperse any hematoma","Notify the provider immediately of a suspected retroperitoneal bleed","Raise the head of the bed to 90 degrees for comfort","Give the prescribed analgesic and reassess in 30 minutes"],
   answer:1, why:"One-sided back/flank pain with falling BP and rising HR signals a retroperitoneal bleed — an emergency requiring immediate provider notification (CT confirms). Hematomas are never massaged, and the client must stay flat."}
},

// ---------- 5. Decreased CO ----------
{ id:"m4-dco", title:"Decreased Cardiac Output", kicker:"Causes, signs, and the care plan you'll use for dysrhythmias, HF — and anemia",
  blocks:[
   {p:"<strong>Decreased cardiac output</strong> means the heart is not pumping enough blood to meet the body's needs. Dysrhythmias, heart failure, CAD, and anemia can all end here, and the <strong>goal of treating any dysrhythmia is to optimize cardiac output</strong>."},
   {h:"Causes"},
   {table:{head:["Problem","Examples","How CO drops"],rows:[
    ["Rate too slow","Symptomatic sinus bradycardia, heart block; causes such as drug overdose (beta blockers, CCBs), electrolyte imbalance, hypothyroidism, hypothermia, hypoxia","Too few beats per minute (CO = HR × SV)"],
    ["Rate too fast","SVT, A-fib with rapid rate, sinus tach from fever, pain, anxiety, dehydration, hemorrhage, sepsis, hyperthyroidism","No time to fill (↓ SV) and less coronary filling"],
    ["Pump failure","Heart failure, MI/ischemia, valve problems","Weak or stiff muscle → ↓ SV"],
    ["Loss of atrial kick","A-fib, A-flutter","Less ventricular filling → ↓ SV"],
    ["Not enough volume","Hypovolemia — hemorrhage, dehydration, vomiting/diarrhea","↓ preload → ↓ SV"],
    ["Not enough oxygen carriers","<strong>Anemia</strong>","Tissues get less O₂ even when the heart pumps; the heart speeds up to compensate"]
   ]}},
   {h:"Signs and symptoms — and why"},
   {p:"When output falls, the body compensates (↑ HR, ↑ RR, vasoconstriction) and shunts blood to the brain, heart, and lungs and away from the skin, gut, and kidneys. The signs follow that logic."},
   {table:{head:["Finding","Why it happens"],rows:[
    ["<strong>↑ Heart rate</strong>","Compensation — the heart tries to raise CO by beating faster"],
    ["<strong>↓ Blood pressure</strong>","Less blood being pushed into the arteries"],
    ["<strong>Weak, thready peripheral pulses</strong>; <strong>poor capillary refill</strong>","Low volume reaching the periphery; vasoconstriction"],
    ["<strong>Cold, clammy, pale skin</strong> (on darker skin check gums/mucous membranes); <strong>diaphoresis</strong>","Blood shunted away from the skin; sympathetic response"],
    ["<strong>↑ Respiratory rate</strong>, <strong>shortness of breath</strong>","Compensation for poor tissue perfusion; fluid backing up into the lungs in HF"],
    ["<strong>Low SpO₂</strong> (may be normal at first)","Impaired gas exchange/perfusion — a normal sat early does not mean the patient is fine"],
    ["<strong>Nausea/vomiting</strong>","Blood shunted away from the GI tract"],
    ["<strong>↓ Urine output</strong>","Less blood to the kidneys → <strong>prerenal acute kidney injury</strong> risk"],
    ["<strong>Confusion → dizziness → syncope</strong>","Less blood to the brain; <strong>confusion/disorientation often comes first</strong>"],
    ["Chest pain, fatigue, activity intolerance","Heart muscle and tissues not getting enough O₂"]
   ]}},
   {hook:"Low output looks like <strong>shock in slow motion</strong>: fast heart, low BP, cold clammy skin, little urine, foggy brain."},
   {h:"Priority: assess first"},
   {list:[
    "<strong>Symptomatic</strong> of decreased CO → <strong>treat</strong>. <strong>Asymptomatic</strong> → <strong>monitor</strong>. Some patients live at an out-of-range baseline (an athlete with a HR of 50, chronic A-fib) without symptoms.",
    "<strong>Look for and treat the cause first</strong> (bleeding, dehydration, hypoxia, electrolytes, fever, pain, medications) — <strong>meds second</strong>.",
    "Some patients need long-term maintenance therapy (e.g., rate control and anticoagulation for A-fib)."
   ]},
   {h:"Decreased cardiac output care plan"},
   {table:{head:["Intervention","Rationale"],rows:[
    ["<strong>I&amp;O / hydrate</strong> as ordered","Track kidney perfusion; restore volume (preload) if the patient is dry"],
    ["<strong>Bedrest until stable</strong>","Lowers O₂ demand and fall risk from dizziness/syncope"],
    ["<strong>12-lead ECG</strong>","Identify the rhythm, ischemia, or injury behind the low output"],
    ["<strong>O₂ PRN</strong>","Support tissue oxygenation when SpO₂ drops"],
    ["<strong>Positioning:</strong> HOB up if BP is okay; if BP is low, <strong>flat with knees up / legs elevated</strong> (Trendelenburg is no longer indicated)","Moves blood pooled in the legs back into the central circulation"],
    ["<strong>Goal: SBP above 90, MAP 65 or higher</strong>","Minimum pressure for adequate organ perfusion"],
    ["<strong>Treat the cause and the symptoms</strong>","Fixing the cause fixes the output"],
    ["<strong>NPO</strong>","N/V and aspiration risk; may need a procedure"],
    ["<strong>Avoid Valsalva</strong> (no straining/bearing down — stool softeners as ordered)","Bearing down stimulates the vagus nerve → can drop HR and BP"]
   ]}},
   {p:"<strong>MAP</strong> = (SBP + 2 × DBP) ÷ 3. Example: BP 84/48 → (84 + 96) ÷ 3 = <strong>60</strong> → below 65 = organs are under-perfused."},
   {h:"When to call the provider"},
   {list:[
    "SBP below 90 or MAP below 65",
    "New or worsening confusion, dizziness, or syncope",
    "Urine output below about 30 mL/hr",
    "New chest pain, new dysrhythmia, or a HR that is very slow or very fast with symptoms",
    "Falling SpO₂ or increasing shortness of breath despite O₂",
    "Cold, mottled extremities or weakening pulses"
   ]},
   {h:"The same plan works for anemia"},
   {p:"Anemia means too few RBCs (or too little hemoglobin) to carry O₂, so the patient looks just like someone with decreased cardiac output — fatigue, weakness, pallor, cold, dizziness, SOB, tachycardia, low BP. <strong>This care plan is the core of anemia nursing care</strong>, plus activities spaced out with rest periods, fall precautions, diet, and supplements."},
   {hook:"Cause first, meds second. <strong>Symptomatic → treat; asymptomatic → monitor.</strong> Keep the SBP above 90 and the MAP at 65 or higher."}
  ],
  check:{stem:"A client with symptomatic bradycardia has a BP of 82/50, is dizzy, and has cool, clammy skin. Which position should the nurse place the client in?",
   options:["High Fowler's to ease breathing","Trendelenburg with the head lower than the body","Flat with the knees up and legs elevated","Left side-lying with the head of the bed at 45 degrees"],
   answer:2, why:"With low BP, the client is placed flat with the legs elevated to return pooled blood to the central circulation. Trendelenburg is no longer indicated, and raising the head of the bed is for clients whose BP is adequate."}
}
]};

// ===================== DYSRHYTHMIAS =====================
const RHYTHMS = { title:"Dysrhythmias", group:"cardiac", sub:"Read a 6-second strip, recognize and treat sinus and atrial rhythms, recognize ventricular rhythms, pacemakers, heart block and agonal rhythm, and tell lethal from non-lethal.", lessons:[

// ---------- 1. ECG BASICS ----------
{ id:"m4-ekg-basics", title:"Reading an ECG Strip", kicker:"Graph paper, waves, the 6 questions, and artifact",
  blocks:[
   {h:"The graph paper"},
   {p:"Every rhythm strip is printed on the same grid, so time can be measured by counting boxes. <strong>Little box = 0.04 seconds. Big box (5 little boxes) = 0.20 seconds.</strong> Five big boxes = 1 second, so <strong>30 big boxes = a 6-second strip</strong> — the standard length used for rhythm checks."},
   {table:{head:["Unit","Time","Why it matters"],rows:[
    ["1 little box","0.04 s","Measures PR and QRS precisely"],
    ["1 big box (5 little)","0.20 s","Normal PR is less than one big box; a normal QRS fits well inside one"],
    ["5 big boxes","1 second","Marked at the top of many strips"],
    ["30 big boxes","6 seconds","Standard strip — count QRS × 10 for HR"]]}},
   {h:"Waves and intervals — what each one means"},
   {p:"The ECG records <strong>electrical</strong> activity. The mechanical squeeze follows the electricity, which is why you always confirm a rhythm with a pulse and an assessment."},
   {table:{head:["Part","Electrical event","Normal"],rows:[
    ["P wave","SA node fires → <strong>atrial depolarization</strong> (atria contract)","Upright, rounded, one before every QRS"],
    ["PR interval","Start of P to start of QRS: impulse travels through the atria and is briefly held at the AV node","<strong>0.12–0.20 s</strong> (3–5 little boxes; less than one big box)"],
    ["QRS complex","<strong>Ventricular depolarization</strong> (ventricles contract); atrial repolarization is hidden inside it","<strong>0.06–0.10 s</strong>, narrow; 0.12 s or more = wide"],
    ["ST segment","End of QRS to start of T: ventricles beginning to recover","Flat, at the baseline; elevation or depression can mean ischemia/injury"],
    ["T wave","<strong>Ventricular repolarization</strong> (resetting/recovery)","Upright, rounded, after every QRS"]]}},
   {img:STRIPS.nsr, caption:"Normal sinus rhythm — rate about 75, regular, an upright P before every narrow QRS, normal PR, a T after every QRS."},
   {h:"The 6 questions — ask them in order, every time"},
   {list:[
    "<strong>1. Rate?</strong> Count the QRS complexes in the 6-second strip × 10.",
    "<strong>2. Regular?</strong> Is the distance from R to R the same across the strip? (Measure with calipers or mark a paper edge.)",
    "<strong>3. P wave?</strong> Is there one upright P before every QRS? If yes, the rhythm starts in the SA node and you may use the word <strong>“sinus.”</strong>",
    "<strong>4. QRS complex?</strong> Present after every P? Narrow (0.06–0.10 s, fits inside a big box)?",
    "<strong>5. T wave?</strong> Present after every QRS?",
    "<strong>6. PR interval?</strong> 0.12–0.20 s (less than one big box) and the same every beat?"]},
   {hook:"<strong>“A P for every QRS” = sinus.</strong> If every answer is “yes/normal,” it's normal sinus rhythm. If only the rate is off, it's sinus brady or sinus tach. If the P waves or baseline are the problem → atrial rhythm. If the QRS is the problem → ventricular rhythm."},
   {h:"Calculating heart rate"},
   {p:"Use the <strong>6-second method</strong>: count every QRS complex in a 6-second strip and multiply by 10. Example: 8 QRS complexes × 10 = <strong>80 bpm</strong>. This works for regular and irregular rhythms, so it is the go-to method for A-fib."},
   {h:"Intrinsic pacemakers — the backup system"},
   {p:"The <strong>SA node</strong> is the heart's natural pacemaker. If it fails, a lower site takes over at a slower built-in rate. The lower the pacemaker site, the slower and less reliable the rhythm."},
   {table:{head:["Pacemaker site","Intrinsic rate","What you see"],rows:[
    ["SA node","<strong>60–100</strong>","Normal P before each narrow QRS"],
    ["AV node / junction","<strong>40–60</strong>","Narrow QRS, P absent, inverted, or hidden"],
    ["Ventricles (Purkinje fibers)","<strong>20–40</strong>","Wide, bizarre QRS, no P"]]}},
   {h:"Normal values to memorize"},
   {list:[
    "Heart rate: <strong>60–100</strong> (below 60 = brady, above 100 = tachy)",
    "PR interval: <strong>0.12–0.20 s</strong>",
    "QRS: <strong>0.06–0.10 s</strong>; <strong>0.12 s or more = wide</strong> (ventricular origin or abnormal conduction)",
    "Rhythm: regular R-to-R"]},
   {h:"Lead placement basics"},
   {p:"Most bedside monitors use a <strong>3- or 5-lead</strong> system. A <strong>12-lead ECG</strong> uses 10 electrodes to look at the heart from 12 angles at once — it is ordered to look for ischemia or damage all around the heart (for example, with chest pain)."},
   {table:{head:["Electrode (5-lead)","Placement"],rows:[
    ["White","Right upper chest, below the clavicle"],
    ["Black","Left upper chest, below the clavicle"],
    ["Green","Right lower chest/abdomen"],
    ["Red","Left lower chest/abdomen"],
    ["Brown","Chest lead — often V1 (4th intercostal space, right of the sternum)"]]}},
   {hook:"<strong>“White on the right, smoke over fire.”</strong> White goes upper right; black (smoke) sits above red (fire) on the left; “snow over grass” — white above green on the right; and chocolate (brown) goes close to the heart."},
   {h:"Artifact — a false reading"},
   {p:"<strong>Artifact</strong> is distorted, extra squiggles on the monitor that do not come from the heart. It can look like V-fib or V-tach. <strong>Always look at the patient, not the monitor</strong> — a patient talking to you with a strong pulse is not in V-fib."},
   {img:STRIPS.artifact, caption:"Artifact — a messy, jagged baseline from movement or poor electrode contact; the underlying QRS complexes can still be seen marching through."},
   {table:{head:["Cause","Fix"],rows:[
    ["Sweaty/oily skin","Dry the skin (wash with soap and water); apply new electrodes"],
    ["Chest hair","Clip (or shave) the area so the electrode lies flat"],
    ["Dried-out electrode gel","Replace the electrodes"],
    ["Loose or disconnected lead","Reattach/secure the lead and wire"],
    ["Movement, shivering, tremors, big deep breaths, patient handling the wires","Reposition, warm the patient, ask them to lie still; recheck the strip"]]}},
   {hook:"Monitor alarm for “V-fib”? <strong>Check the patient first</strong> — responsive and has a pulse = look for artifact. Unresponsive and pulseless = it's real; call for help and start CPR."}
  ],
  check:{stem:"A nurse counts 7 QRS complexes on a 6-second strip. Every QRS is narrow and preceded by an upright P wave, and the PR interval is 0.16 s. How should the nurse document the rhythm?", options:["Sinus tachycardia, rate 140","Normal sinus rhythm, rate 70","Sinus bradycardia, rate 42","Junctional rhythm, rate 70"], answer:1, why:"7 × 10 = 70 bpm. A P before every narrow QRS with a normal PR (0.12–0.20 s) and a rate of 60–100 = normal sinus rhythm. A junctional rhythm would lack normal upright P waves."}
},

// ---------- 2. SINUS ----------
{ id:"m4-sinus", title:"Sinus Rhythms", kicker:"NSR, sinus brady, sinus tach — everything normal except (maybe) the rate",
  blocks:[
   {h:"The sinus family"},
   {p:"All three sinus rhythms start in the SA node, so all three have <strong>a P wave before every QRS</strong>, a normal PR, a narrow QRS, and a T after every QRS. <strong>The only thing that changes is the rate.</strong>"},
   {table:{head:["Rule","NSR","Sinus bradycardia","Sinus tachycardia"],rows:[
    ["Rate","60–100","<strong>Below 60</strong>","<strong>Above 100</strong> (usually 100–150)"],
    ["Regular?","Yes","Yes","Yes"],
    ["P wave","One before every QRS","One before every QRS","One before every QRS (may run into the T at fast rates)"],
    ["PR interval","0.12–0.20 s","0.12–0.20 s","0.12–0.20 s"],
    ["QRS","Narrow, 0.06–0.10 s","Narrow","Narrow"],
    ["T wave","After every QRS","After every QRS","After every QRS"]]}},
   {img:STRIPS.nsr, caption:"Normal sinus rhythm — rate about 75; every rule is met."},
   {h:"Sinus bradycardia"},
   {img:STRIPS.sb, caption:"Sinus bradycardia — rate about 45; regular, a P before every narrow QRS. Everything is normal except the rate."},
   {p:"<strong>Causes</strong> — some are normal, some are dangerous:"},
   {list:[
    "<strong>Expected/benign:</strong> well-conditioned athletes, sleep",
    "<strong>Medications:</strong> beta blockers, calcium channel blockers (diltiazem), digoxin, amiodarone",
    "<strong>Vagal stimulation:</strong> vomiting, bearing down/straining (Valsalva), suctioning, severe pain",
    "<strong>Low metabolic states:</strong> hypothermia, hypothyroidism",
    "<strong>Hypoxia</strong> — a common cause of unstable, symptomatic bradycardia",
    "<strong>Heart disease:</strong> MI (especially inferior wall), SA node dysfunction",
    "<strong>Overdose</strong> (for example beta blocker, CCB, or opioid), increased intracranial pressure, electrolyte imbalance"]},
   {h:"Sinus tachycardia"},
   {img:STRIPS.st, caption:"Sinus tachycardia — rate about 120; regular, a P before every narrow QRS. Everything is normal except the rate."},
   {p:"Sinus tach is almost always the body <strong>responding to something</strong>. Find the trigger:"},
   {list:[
    "<strong>Pain, anxiety, fear, stress</strong>",
    "<strong>Fever</strong>/hyperthermia, infection, <strong>sepsis</strong>",
    "<strong>Low volume:</strong> dehydration, hemorrhage, hypovolemic <strong>shock</strong>",
    "<strong>Anemia</strong> and hypoxia (heart speeds up to deliver more O₂)",
    "<strong>Hyperthyroidism</strong>",
    "<strong>Stimulants:</strong> caffeine, nicotine, cocaine/amphetamines; medications such as atropine or epinephrine",
    "Heart failure, exercise, electrolyte imbalance"]},
   {hook:"Sinus tach is a <strong>symptom, not a disease</strong>. Treat the cause: pain → analgesic, fever → antipyretic, hemorrhage/dehydration → fluids or blood, anxiety → reassurance. Slowing the heart with a drug while the patient is bleeding removes their compensation."},
   {h:"Is the patient symptomatic? (signs of decreased cardiac output)"},
   {p:"A rate that is too slow means less blood pumped each minute. A rate that is too fast shortens filling time, so each beat pumps less. Either way, watch for <strong>decreased cardiac output</strong>:"},
   {list:[
    "↓ BP, dizziness, syncope, <strong>confusion/change in mental status</strong> (often first)",
    "Chest pain/angina, shortness of breath, ↑ RR",
    "Weak, thready pulses; poor cap refill; cool, clammy, pale skin; diaphoresis",
    "↓ urine output; nausea/vomiting",
    "Low SpO₂ (may be normal at first)"]},
   {h:"Treatment"},
   {table:{head:["Rhythm","Asymptomatic","Symptomatic"],rows:[
    ["NSR","No treatment","—"],
    ["Sinus brady","<strong>Monitor</strong> (an athlete with HR 50 and no symptoms needs nothing)","Treat the cause (hold the beta blocker as ordered, warm the patient, give O₂ for hypoxia, stop vagal stimulation); if HR typically below 50 with symptoms → <strong>atropine 1 mg IV push q3–5 min, max 3 mg</strong> → if ineffective, <strong>transcutaneous pacing</strong> and/or <strong>dopamine</strong> (5–20 mcg/kg/min) or <strong>epinephrine</strong> (2–10 mcg/min) drip → transvenous pacing/expert consult"],
    ["Sinus tach","<strong>Treat the cause</strong>; monitor","<strong>Treat the cause</strong> (fluids, blood, analgesia, antipyretic, O₂, treat infection/thyroid); rate-control drugs are not the first answer"]]}},
   {hook:"<strong>Atropine</strong> = brady drug. IV push, short-acting, blocks the vagus nerve's slowing effect so the SA node speeds up. Dopamine and epinephrine drips are <strong>vasopressors</strong> — titrated, large vein/central line, vesicants."}
  ],
  check:{stem:"A client on metoprolol has a regular rhythm at 46 bpm with a P before every narrow QRS. The client is dizzy, confused, and BP is 82/50. Which action is the priority after notifying the provider and confirming IV access?", options:["Administer the scheduled metoprolol dose","Prepare to administer atropine 1 mg IV push","Prepare for synchronized cardioversion","Have the client bear down as if having a bowel movement"], answer:1, why:"Symptomatic sinus bradycardia (HR below 50 with hypotension and confusion) is treated with atropine 1 mg IV push. The beta blocker should be held, not given. Cardioversion is for tachydysrhythmias, and bearing down (vagal) would slow the heart further."}
},

// ---------- 3. ATRIAL ----------
{ id:"m4-atrial", title:"Atrial Rhythms", kicker:"SVT, A-fib, A-flutter — a problem with the P waves or baseline",
  blocks:[
   {h:"The big picture"},
   {p:"Atrial rhythms are a <strong>problem with the P waves or the baseline</strong>. The QRS is usually <strong>narrow</strong>, because the ventricles still conduct normally. These rhythms are <strong>more stable than ventricular rhythms</strong> — many people live with them for years — but they can drop cardiac output and cause clots. Because there is no normal P before every QRS, you <strong>cannot use the word “sinus.”</strong>"},
   {hook:"Atrial rhythms: <strong>“you can live with these.”</strong> Ventricular rhythms: the ones that can kill. Rule of thumb — narrow QRS = above the ventricles = usually more stable."},
   {h:"Supraventricular tachycardia (SVT)"},
   {img:STRIPS.svt, caption:"SVT — rate about 180, regular, narrow QRS; P waves are lost in the preceding T waves."},
   {list:[
    "<strong>Rate 150–250</strong>; regular",
    "P waves <strong>not seen</strong> — typically lost in the T waves once the rate reaches about 160; PR not measurable",
    "Narrow QRS; T waves present",
    "Often starts and stops suddenly (paroxysmal)",
    "Triggers: caffeine, stimulants, stress, fatigue, hyperthyroidism, hypoxia, heart disease",
    "S/S: palpitations, racing heart, anxiety, dizziness, chest pain, SOB; ↓ CO because the ventricles don't have time to fill"]},
   {h:"Atrial fibrillation (A-fib)"},
   {img:STRIPS.afib, caption:"Atrial fibrillation — irregularly irregular, no discernible P waves, wavy fibrillating baseline, narrow QRS; ventricular rate about 90."},
   {p:"Hundreds of chaotic impulses make the atria <strong>quiver instead of contract</strong>. The AV node lets some through at random, so the ventricular rhythm is <strong>irregularly irregular</strong>. Rate may be controlled (60–100) or fast (above 100, called A-fib with rapid ventricular response, RVR)."},
   {hook:"<strong>A-fib “gold standard”:</strong> irregular + no discernible P waves + fibrillating (wavy) baseline + narrow QRS."},
   {list:[
    "<strong>Lost atrial kick:</strong> the atria normally top off the ventricles before each beat; without it, cardiac output drops (worse with a fast rate).",
    "<strong>Clots/stroke:</strong> blood pools in the quivering atria → clots form → can travel to the brain. A-fib is a major cause of embolic stroke.",
    "Causes/risk: hypertension, CAD/MI, heart failure, valve disease, hyperthyroidism, alcohol, older age, after cardiac surgery, sleep apnea.",
    "Common in HF; many patients live with chronic A-fib on maintenance meds."]},
   {h:"Atrial flutter (A-flutter)"},
   {img:STRIPS.aflutter, caption:"Atrial flutter — sawtooth flutter waves in a 4:1 pattern (four flutter waves to each QRS); ventricular rate about 75, narrow QRS."},
   {list:[
    "<strong>Sawtooth flutter waves</strong> instead of P waves; one irritable spot fires rapidly (atrial rate about 250–400)",
    "Ventricular rhythm regular or irregular depending on how many flutter waves conduct (2:1, 3:1, 4:1)",
    "Narrow QRS; PR not measurable",
    "“Sister of A-fib”: atria don't fully contract → <strong>pooling → clot risk</strong>; treated much like A-fib"]},
   {h:"Comparing the three"},
   {table:{head:["Feature","SVT","A-fib","A-flutter"],rows:[
    ["Rate","150–250","Varies — controlled 60–100 or RVR above 100","Varies — depends on the conduction ratio"],
    ["Regular?","Regular","<strong>Irregularly irregular</strong>","Often regular; can be irregular"],
    ["P waves","Hidden in T waves","None — <strong>wavy fibrillating baseline</strong>","None — <strong>sawtooth flutter waves</strong>"],
    ["QRS","Narrow","Narrow","Narrow"],
    ["Main danger","↓ CO from fast rate","↓ CO (lost atrial kick) + <strong>clots/stroke</strong>","↓ CO + <strong>clots/stroke</strong>"],
    ["First-line approach (stable)","Vagal maneuver → <strong>adenosine</strong>","Rate control + <strong>anticoagulation</strong>","Rate control + <strong>anticoagulation</strong>"]]}},
   {h:"Treatment"},
   {p:"Always start with the patient: <strong>symptomatic or not?</strong> Look for and treat the cause (caffeine, hypoxia, thyroid, electrolytes, dehydration). <strong>Unstable</strong> (hypotension, altered mental status, chest pain, acute HF) → <strong>synchronized cardioversion</strong>."},
   {table:{head:["Rhythm","Stable patient","Unstable patient"],rows:[
    ["SVT","1. <strong>Vagal maneuver</strong> (bear down as if having a bowel movement)<br>2. <strong>Adenosine 6 mg rapid IV push</strong> + 20 mL NS flush; may repeat with <strong>12 mg</strong><br>3. Beta blocker or CCB (diltiazem)","Synchronized cardioversion"],
    ["A-fib / A-flutter","<strong>Rate control:</strong> beta blocker (metoprolol) or CCB (diltiazem)<br><strong>Rhythm control:</strong> amiodarone<br><strong>Anticoagulation:</strong> heparin, warfarin (INR 2–3), or a DOAC<br>Elective cardioversion after TEE","Synchronized cardioversion"]]}},
   {list:[
    "<strong>Adenosine:</strong> “reboots” the heart — brief asystole for a few seconds is expected; crash cart and provider at the bedside; give through an antecubital or central line; push fast and flush (very short half-life).",
    "<strong>A-fib longer than 48 hours</strong> (or unknown) → <strong>anticoagulate first</strong> and/or do a <strong>TEE</strong> to rule out an atrial clot before cardioversion — a shock can knock a clot loose → aorta → brain = stroke.",
    "Maintenance therapy is common: long-term rate control and anticoagulation; bleeding precautions and teaching."]},
   {hook:"<strong>A-fib = think anticoagulant.</strong> Before any cardioversion of A-fib/flutter ask: “How long? Anticoagulated? TEE done?”"}
  ],
  check:{stem:"A client's monitor shows an irregularly irregular rhythm with no identifiable P waves, a wavy baseline, and narrow QRS complexes at 88 bpm. The client has no symptoms. Which order should the nurse anticipate as part of long-term management?", options:["Adenosine 6 mg rapid IV push","Atropine 1 mg IV push","An oral anticoagulant such as warfarin or a DOAC","Immediate defibrillation"], answer:2, why:"This is A-fib with a controlled rate. Blood pools in the quivering atria, so anticoagulation is needed to prevent clots and stroke. Adenosine is for SVT, atropine is for symptomatic bradycardia, and defibrillation is for pulseless lethal rhythms."}
},

// ---------- 4. VENTRICULAR ----------
{ id:"m4-ventricular", title:"Ventricular Rhythms &amp; Lethal vs Non-Lethal", kicker:"A problem with the QRS — recognize them and know which ones kill",
  blocks:[
   {h:"The big picture"},
   {p:"Ventricular rhythms are a <strong>problem with the QRS</strong>. When an impulse starts in the ventricles it spreads slowly, cell to cell, so the QRS is <strong>wide (0.12 s or more) and bizarre</strong> with no P wave in front. These rhythms are <strong>lethal or potentially lethal</strong>. The goal is to <strong>recognize</strong> them and know the big-picture response; detailed code management comes later, in Medical Emergencies."},
   {h:"PVCs — premature ventricular contractions"},
   {p:"A PVC is an <strong>early, wide, bizarre beat</strong> with no P wave, usually followed by a pause. The patient may feel a “skipped beat.” Name the underlying rhythm first, then the PVCs (for example, “NSR with unifocal PVCs”). Causes include caffeine, stress, nicotine, hypoxia, <strong>low K⁺ or Mg²⁺</strong>, MI/ischemia, heart failure, and digoxin toxicity."},
   {img:STRIPS.pvc_uni, caption:"Unifocal PVCs — every PVC looks the same (one irritable spot); occasional ones can be normal."},
   {img:STRIPS.pvc_multi, caption:"Multifocal PVCs — PVCs with different shapes (more than one irritable spot); concerning."},
   {img:STRIPS.pvc_couplet, caption:"Couplet — two PVCs in a row; dangerous."},
   {img:STRIPS.r_on_t, caption:"R on T — a PVC lands on the T wave of the beat before it (the vulnerable recovery period) and here sets off a run of V-tach; R on T can trigger V-tach or V-fib."},
   {table:{head:["Type","What you see","Concern level"],rows:[
    ["Unifocal","All PVCs the same shape","Occasional ones can be normal (caffeine, stress); watch frequency"],
    ["Multifocal","PVCs of different shapes","<strong>Concerning</strong> — more irritable ventricles"],
    ["Couplet","2 PVCs in a row","<strong>Dangerous</strong> — potentially lethal"],
    ["Run (3 or more in a row)","3+ PVCs back-to-back","= a <strong>run of V-tach</strong>; potentially lethal"],
    ["R on T","PVC falls on the T wave","<strong>Potentially lethal</strong> — can trigger V-tach/V-fib"]]}},
   {hook:"PVCs getting <strong>more frequent, multifocal, paired, or landing on the T</strong> = irritable ventricles. Check the patient, check K⁺ and Mg²⁺, check O₂, and notify the provider."},
   {h:"Ventricular tachycardia (V-tach, VT)"},
   {img:STRIPS.vtach, caption:"Ventricular tachycardia — rate about 180, regular, wide bizarre QRS complexes, no P waves."},
   {list:[
    "Rate usually <strong>100–200</strong>; regular; <strong>wide, bizarre QRS</strong>; no visible P waves; no measurable PR",
    "Causes: MI/ischemia, inflammation, trauma, cardiomyopathy, <strong>electrolyte imbalance</strong> (K⁺, Mg²⁺)",
    "<strong>VT with a pulse:</strong> the patient may be awake but often has signs of ↓ CO — <strong>potentially lethal</strong>; can deteriorate at any moment",
    "<strong>Pulseless VT:</strong> no cardiac output — <strong>lethal</strong>; treated like V-fib (CPR + defibrillation)"]},
   {h:"Torsades de pointes"},
   {img:STRIPS.torsades, caption:"Torsades de pointes — polymorphic VT; wide QRS complexes that grow and shrink as if twisting around the baseline."},
   {p:"“Twisting of the points.” A <strong>polymorphic VT</strong> linked to a prolonged QT interval and <strong>low magnesium</strong> (also low K⁺; QT-prolonging drugs). It quickly becomes pulseless. Big-picture treatment: <strong>IV magnesium</strong>."},
   {hook:"<strong>Torsades = Twisted = magnesium.</strong> Think “Mg twists it back.”"},
   {h:"Ventricular fibrillation (V-fib, VF)"},
   {img:STRIPS.vfib, caption:"Ventricular fibrillation — chaotic, irregular waves with no identifiable P, QRS, or T; no cardiac output."},
   {p:"The ventricles <strong>quiver</strong> instead of pumping: <strong>no pulse, no BP, no cardiac output</strong>; the patient is unresponsive. Most common rhythm in sudden cardiac arrest. <strong>Lethal</strong> — immediate CPR and <strong>defibrillation</strong>."},
   {h:"Asystole"},
   {img:STRIPS.asystole, caption:"Asystole — a nearly flat line; no electrical activity, no QRS complexes."},
   {list:[
    "“Flatline”: no electrical activity, no pulse — <strong>lethal</strong>",
    "<strong>Check the patient</strong> (a loose lead also gives a flat line) and <strong>confirm in a second lead</strong>",
    "<strong>Not shockable</strong> — CPR and <strong>epinephrine</strong>; look for a reversible cause"]},
   {h:"Big-picture response to a lethal rhythm"},
   {list:[
    "<strong>Check the patient</strong> — responsive? breathing? <strong>pulse?</strong>",
    "<strong>Call for help</strong> — call the code, get the crash cart/defibrillator",
    "<strong>Start CPR</strong> if there is no pulse",
    "<strong>Shock or not?</strong> V-fib and pulseless VT = shockable → <strong>defibrillate</strong>. Asystole = not shockable → CPR + epinephrine",
    "<strong>When in doubt, give epinephrine</strong>; torsades → magnesium"]},
   {h:"Lethal vs non-lethal — every rhythm at a glance"},
   {table:{head:["Category","Rhythms","Response"],rows:[
    ["<strong>Lethal</strong> (no cardiac output)","<strong>V-fib</strong>, <strong>pulseless V-tach</strong>, <strong>asystole</strong>; <strong>torsades</strong> (quickly becomes pulseless)","Check pulse → call code → CPR → defibrillate if shockable (VF, pulseless VT) → epinephrine; torsades → magnesium"],
    ["<strong>Potentially lethal</strong> (can turn lethal fast)","V-tach <strong>with a pulse</strong>, <strong>R on T</strong>, <strong>runs</strong> of PVCs (3+), <strong>couplets</strong>, multifocal PVCs; heart block with ↓ CO","Assess, notify provider immediately, stay with the patient, crash cart nearby; unstable VT with a pulse → synchronized cardioversion"],
    ["<strong>Non-lethal</strong> — treat if symptomatic","Sinus brady, sinus tach, SVT, A-fib, A-flutter; occasional unifocal PVCs","Assess for ↓ CO; treat the cause; meds; synchronized cardioversion or pacing if unstable"],
    ["Normal","Normal sinus rhythm","None"],
    ["Dying rhythm","Agonal rhythm","Often DNR / comfort care; if full code → treat as pulseless"],
    ["Not a rhythm","Artifact","Assess the patient; fix the leads/skin"]]}},
   {hook:"<strong>Lethal = no cardiac output.</strong> Your first move is never the monitor — it's the <strong>patient and the pulse</strong>."}
  ],
  check:{stem:"The monitor alarms and shows chaotic, irregular waves with no identifiable QRS complexes. What is the nurse's first action?", options:["Print a strip and call the provider","Administer IV magnesium","Check the client's responsiveness and pulse","Prepare for synchronized cardioversion"], answer:2, why:"The pattern looks like V-fib, but artifact can look identical. Assessing the patient (responsive? pulse?) comes first; if pulseless, call the code, start CPR, and defibrillate. Magnesium is for torsades, and synchronized cardioversion is for rhythms with a pulse."}
},

// ---------- 5. PACERS, BLOCKS, AGONAL ----------
{ id:"m4-pacers-blocks", title:"Pacemakers, Heart Blocks &amp; Agonal Rhythm", kicker:"Spot the spike, understand the block, recognize a dying heart",
  blocks:[
   {h:"Pacemakers — what they are for"},
   {p:"A pacemaker sends an electrical impulse to make the heart beat when its own system is <strong>too slow</strong>. <strong>Pacemakers are for bradycardia</strong> (including heart block). On the strip each impulse shows as a <strong>spike</strong> — a thin, straight up-and-down line."},
   {h:"Reading the spike"},
   {table:{head:["Type","Where the spike is","What follows"],rows:[
    ["<strong>Atrial paced</strong>","Spike <strong>before the P wave</strong>","P wave, then the patient's own narrow QRS"],
    ["<strong>Ventricular paced</strong>","Spike <strong>before the QRS</strong>","<strong>Wide QRS</strong>; no P wave after the spike"],
    ["<strong>Dual / AV paced</strong>","<strong>Two spikes</strong>: one before the P, one before the QRS","P wave, then wide QRS"]]}},
   {img:STRIPS.paced_atrial, caption:"Atrial paced — a spike before each P wave, followed by a narrow QRS; rate about 70."},
   {img:STRIPS.paced_vent, caption:"Ventricular paced — a spike directly before each wide QRS, with no P wave; rate about 70."},
   {img:STRIPS.paced_dual, caption:"Dual (AV) paced — two spikes per beat: one before the P and one before the wide QRS."},
   {list:[
    "Every spike should be followed by a wave (P or QRS) — that means the pacer <strong>captured</strong>.",
    "A spike with <strong>nothing after it</strong> = possible malfunction → assess the patient and notify the provider (troubleshooting is NUR 211).",
    "A spike should <strong>never land on the T wave</strong> — that creates an <strong>R on T</strong> risk (V-tach/V-fib)."]},
   {hook:"<strong>Spike → P = atrial. Spike → wide QRS = ventricular. Two spikes = dual.</strong> Spike on a T = danger."},
   {h:"Temporary vs permanent"},
   {table:{head:["Type","How","When"],rows:[
    ["<strong>Transcutaneous</strong> (temporary)","Large pads on the chest (front and back); machine set to a rate, output turned up until each spike captures a beat; painful — sedation/analgesia","Emergency for symptomatic bradycardia when atropine fails"],
    ["<strong>Transvenous</strong> (temporary)","Pacing wire threaded through a vein into the right heart (cath lab/bedside)","Bridge until the cause resolves or a permanent device is placed"],
    ["<strong>Permanent</strong>","Implanted generator under the skin with leads into the heart","Chronic bradycardia/heart block; works <strong>on demand</strong> — fires only when the heart's own rate drops below the set rate"]]}},
   {h:"Heart block — basic understanding"},
   {img:STRIPS.heart_block, caption:"Heart block — P waves march regularly at about 80, but the impulses are not getting through to the ventricles; the slower, wide QRS complexes (about 38) are not tied to the P waves. More P waves than QRS complexes."},
   {list:[
